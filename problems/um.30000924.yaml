title: Asymptotic Stability of Orbitally Stable NLS Ground States
field: mathematics
tier: prose
statement: For the nonlinear Schrödinger equation $iu_t+\Delta u+\beta(|u|^2)u=0$ on $\mathbb{R}\times\mathbb{R}^3$, with standing waves $e^{it\omega}\varphi_\omega$, is every orbitally stable ground state asymptotically stable? Specifically, for every nearby finite-energy solution, do there exist $\omega_0>0$, $\theta\in C^1(\mathbb{R}_+,\mathbb{R})$, and $h_0\in H^1$ such that $\|u(t)-e^{i\theta(t)}\varphi_{\omega_0}-e^{it\Delta}h_0\|_{H^1}\to0$ as $t\to\infty$?
