id: um.20002880
title: Scalar-parabolic rank obstructions for equivariant hyperquadric embeddings
field: mathematics
tier: prose
statement: |-
  **1. (M. Kolar)** Assume $M\subseteq\mathbb C^2$ is a real analytic hypersurface that admits a nonlinearizable automorphism $H$. Does there exist a hyperquadric $Q\subseteq\mathbb C^n$ such that $M\hookrightarrow Q$ nontrivially and $H$ is induced by an automorphism of $Q$? Can a bound on $n$ be found?

  **2. (D. Zaitsev)** Assume $M\subseteq\mathbb C^2$ admits a nontrivial map tangent to the identity of order 2. Does $M$ have an embedding into a hyperquadric $Q$ as in the preceding problem?
