title: Zariski–Nisnevich Comparison for Relative Milnor K-Theory
field: mathematics
tier: prose
statement: Let $X$ be a smooth $d$-dimensional variety over a perfect field of characteristic $p$, and let $Y\hookrightarrow X$ be a normal-crossing divisor with infinitesimal thickenings $Y_s$. Is the canonical map $\lim_s H^i_{\mathrm{Zar}}(X,K_n^M(X,Y_s))\to\lim_s H^i_{\mathrm{Nis}}(X,K_n^M(X,Y_s))$ an isomorphism, in particular over a finite base field when $i=n=d$, as conjectured by Kato and Saito?
