lean:
  module: FormalConjectures.OEIS.«245212»
  decl: OeisA245212.conjecture
  statement: |-
    theorem conjecture (n : ℕ) (h : 0 < n) :
        a n = (σ 1 n : ℤ) ↔ ∃ k : ℕ, n = 2 ^ k
  context:
    - open OeisA245212
    - open Nat Finset
    - open scoped ArithmeticFunction.sigma
  definitions:
    - name: OeisA245212.a
      kind: def
      text: |-
        /-- $a(n) = n \tau(n) - \sum_{d \mid n, d < n} d \tau(d)$, where $\tau(n)$
        is the number of divisors of $n$. -/
        def a (n : ℕ) : ℤ :=
          (n : ℤ) * (n.divisors.card : ℤ) - ∑ d ∈ n.properDivisors, (d : ℤ) * (d.divisors.card : ℤ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/245212.lean#L37
