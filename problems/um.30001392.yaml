title: Locally Omitted Values in Completely Invariant Fatou Components
field: mathematics
tier: prose
statement: Let $f$ be an entire function with a completely invariant Fatou component $D$. Must every locally omitted value of $f$ belong to $D$, where $a$ is locally omitted if some component $G$ of $\{z:|f(z)-a|<\varepsilon\}$ contains no solution of $f(z)=a$?
