title: Conjugacy-Class Intersections with Generating Sets
field: mathematics
tier: prose
statement: For a rank-$r$ linear algebraic group $G$ over a finite field, a regular semisimple $g\in G(F)$, and a generating set $A\subset G(F)$, prove $|A\cap\operatorname{Cl}(g)|\leq C|A^k|^{1-r/\dim G}$ with $C$ and $k$ as small as possible, and determine whether character theory can help.
