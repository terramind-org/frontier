title: Open Problems and Questions about Geodesics — Conjecture 15 ([Bur-Kat1985])
field: mathematics
tier: prose
statement: |-
  Suppose $(M, g)$ is a closed Riemannian manifold. The marked length spectrum of $M$ is the
  function
  that assigns to each free homotopy class of loops the
  infimum of the length of loops in the class (i.e. the length of the shortest closed geodesic lying in this class).

  *Two metrics with negative curvature on a compact manifold must be isometric if they have the same marked length spectrum.*
