statement: |-
  \section*{Critical L3 local smoothing in three dimensions}\label{30007424}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every $\epsilon >0$, does the half-wave propagator satisfy ||exp(it $\operatorname{sqrt}(-Delta))f||_L3(R3$ x $[1,2])<=C_\epsilon ||(1-Delta)^{\epsilon /2}f||_L3(R3)$ for every Schwartz f?
  \subsection{Short English statement}
  For every $\epsilon >0$, does the half-wave propagator satisfy ||exp(it $\operatorname{sqrt}(-Delta))f||_L3(R3$ x $[1,2])<=C_\epsilon ||(1-Delta)^{\epsilon /2}f||_L3(R3)$ for every Schwartz f?
