title: Several Complex Variables Problem List — Problem 36
field: mathematics
tier: prose
statement: |-
  Let $\Omega$ in $\mathbb{C}^n$ be a bounded biholomorphic image of the unit ball
  in $\mathbb{C}^n$. Does the $\bar\partial$ satisfy uniform estimates on $\Omega$?
  The problem is of interest mainly when $\Omega$ has very rough boundary.\\
  -B. Berndtsson, bob@math.chalmers.se
