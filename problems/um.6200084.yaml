title: Boundaries of Groups and Kleinian Groups — Problem 84
field: mathematics
tier: prose
statement: "Let $G$ be a group and let $\\rho_1,\\rho_2:G\\to\\operatorname{Isom}(\\mathbb{H}^n)$ be discrete faithful representations; write $\\ell_{\\rho}(g)=\\inf_x d(\\rho(g)x,x)$. Suppose that ρ1, ρ2 are discrete and faithful representations so that there exists C > 0 for which we have C −1 ≤ ℓρ1(g) ℓρ2(g) ) ≤ C, ∀g ∈ G. Does it follow that there exists a quasiconformal map f: Λ(ρ1(G)) → Λ(ρ2(G)) which is equivariant with respect to the isomorphism ρ2 ◦ ρ−1 1? Can one choose f which is K-quasiconformal for K = K(C)?"
