title: Support-coloring cases and a recursive paving bottleneck
field: mathematics
tier: prose
statement: |-
  Take A = n \(\times\) n matrix that's a commutator and write it as a commutator of B,C with B diagonal of norm 1 and C with bounded norm, with some minimization. Bill's recent PNAS paper with Ozawa and Schechtmann showed something that needed KS with optimal estimates to improve bound from \(n^\alpha\) (which uses only restricted invertibility) to poly(n), and that the existence of a bound independent of n implies KS. Can you improve the result using KS to get a bound independent of n?

  Is there an absolute \(K\) such that every zero-diagonal \(A\in M_n(\mathbb C)\) has \(A=[B,C]\), where \(B\) is diagonal, \(\|B\|\leq 1\), and \(\|C\|\leq K\|A\|\), independently of \(n\)?
