  \section{Optimal Fourier Restriction Estimates on Submanifolds}\label{30004070}
  {\small UnsolvedMath ID 30004070 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For the Fourier restriction operator $R$ to a submanifold $C\subset\mathbb R^{1+n}$, determine the optimal exponents $p,q$ for which

  $$\lVert Rf\rVert_{L^p(C)}\lesssim\lVert f\rVert_{L^q(\mathbb R^{1+n})}$$

  holds.
  \par\smallskip\textit{Formulation references:} \sref{30004070}{1}, \sref{30004070}{2}.
  \subsection{Short English statement}
  For the Fourier restriction operator $R$ to a submanifold $C\subset\mathbb R^{1+n}$, determine the optimal exponents $p,q$ for which

  $$\lVert Rf\rVert_{L^p(C)}\lesssim\lVert f\rVert_{L^q(\mathbb R^{1+n})}$$

  holds.
