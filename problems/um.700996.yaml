field: mathematics
tier: prose
statement: |-
  (Yu. I. Merzlyakov). It is a
  well-known fact that for the ring
  $R={\mathbb{Q} [x,y]$ the elementary group $E_2(R)$ is distinct from
  $SL_2(R)$. Find a minimal subset $A\subseteq SL_2(R)$ such that
  $\left< E_2(R), A\right> =SL_2(R)$.
