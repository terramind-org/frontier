title: Sharp Singularity Probability of Random Sign Matrices
field: mathematics
tier: prose
statement: |-
  Let $B_n$ be an $n\times n$ random sign matrix with independent entries uniformly distributed in $\{-1,1\}$. Determine the sharp asymptotic probability that $B_n$ is singular. The conjectural scale is

  $$\mathbb P(B_n\text{ is singular})=(1/2+o_n(1))^n=(1/2)^{(1+o_n(1))n}$$.
