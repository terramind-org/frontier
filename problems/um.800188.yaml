title: Moments of L-functions — Moments of the Riemann zeta function — Problem 40
field: mathematics
tier: prose
statement: |-
  Let $k \in \mathbb{N}$ and $k \ge 3$.
  For some small $\epsilon_0\geq0$ asymptotically evaluate
  \[
  \int_{0}^{T} \sum_{m \le T^{2+\epsilon_0}} \frac{d_k(m)}{m^{\frac{1}{2}+it}}
  \sum_{n \le T^{2+\epsilon_0}} \frac{d(n)}{n^{\frac{1}{2}-it}} dt.
  \]
  Note that for mean values of long Dirichlet polynomials we know how to evaluate these sums (conjecturally on the additive divisor conjecture) when
  the length of the polynomials is $N=T^{2-\epsilon}$ (see [HN]).
