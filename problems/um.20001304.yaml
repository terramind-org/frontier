title: Uniform point configurations and exact Fourier certificates for convexity
field: mathematics
tier: prose
statement: |-
  **7. (S. Robins)** Given \(N\), can we find explicitly \(N\) points on
  \(S^{n-1}\) that are “uniformly” arranged? Are they the same as the vertices
  of the polytope with \(N\) vertices and maximum volume that is contained in
  \(S^{n-1}\)?

  **8.** Let \(f\) be a function on \(S^{n-1}\). Can we decide from the
  Fourier transform of \(f\) if \(f\) is the support function of a convex body?
  Or if \(f\) is the radial function of a convex body?
