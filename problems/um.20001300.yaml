title: An attained symmetry-reduced cosine program for Schneider's zonoid-sandwich parameter
field: mathematics
tier: prose
statement: |-
  For an origin-symmetric convex body \(K\subset\mathbb R^n\), let \(\lambda(K)\) be the smallest number \(\lambda\geq1\) such that there is a zonoid \(Z\) with
  \[
  K\subseteq Z\subseteq \lambda K.
  \]
  For the cross-polytope \(C_n=\operatorname{conv}\{\pm e_1,\ldots,\pm e_n\}\),
  \[
  \lambda(C_n)=\frac{n}{2^{n-1}}
  \binom{n-1}{\lfloor (n-1)/2\rfloor}
  \sim \sqrt{\frac{2n}{\pi}}.
  \]
  Is \(\lambda(K)\) maximal for the cross-polytope?
