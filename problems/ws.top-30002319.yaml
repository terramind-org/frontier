  \section{Displacement Exponents for Low-Dimensional Self-Avoiding Walks}\label{30002319}
  {\small UnsolvedMath ID 30002319 · Probability}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For self-avoiding walk in dimensions $d=2$ and $d=3$, prove that there exists $\varepsilon>0$ such that

  $$n^{2/d+\varepsilon}\leq \mathbb E_n[\operatorname{Dist}(\gamma_n,0)^2]\leq n^{2-\varepsilon}$$

  for all sufficiently large $n$.
  \par\smallskip\textit{Formulation references:} \sref{30002319}{1}, \sref{30002319}{2}.
  \subsection{Short English statement}
  For self-avoiding walk in dimensions $d=2$ and $d=3$, prove that there exists $\varepsilon>0$ such that

  $$n^{2/d+\varepsilon}\leq \mathbb E_n[\operatorname{Dist}(\gamma_n,0)^2]\leq n^{2-\varepsilon}$$

  for all sufficiently large $n$.
