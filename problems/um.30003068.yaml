title: Existence of Global Monomial Orders for PBW Bases
field: mathematics
tier: prose
statement: For a simple finite-dimensional Lie algebra $\mathfrak g$, is the set $S_{\mathrm{gm}}$ of global monomial degrees nonempty? For every simply laced simple $\mathfrak g$, is $S_{\mathrm{gm}}\cap D^q_{w_0}$ nonempty for some reduced decomposition $w_0$?
