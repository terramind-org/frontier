title: Long Dirichlet-Polynomial Recipe for Quadratic L-Functions
field: mathematics
tier: prose
statement: For fundamental discriminants $d$ and quadratic characters $\chi_d$, the long-polynomial recipe conjectures the stated smoothed average of $\sum_{n\leq X}\tau_A(n)\chi_d(n)/\sqrt n$ is given by the corresponding integral of the quadratic $L$-function swap terms, up to $O(D^{1-\delta})$ as $D\to\infty$.
