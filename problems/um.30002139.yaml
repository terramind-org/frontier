title: Horosphere Geometry Under Quasi-Isometries of Universal Covers
field: mathematics
tier: prose
statement: In dimension $3$, are the horospheres for the lifted hyperbolic metric $\widetilde g_0$ and another negatively curved metric $\widetilde g$ quasi-isometric? More generally, what does a quasi-isometry between the universal covers say about their horospheres, and under what conditions do the lower and upper polynomial volume-growth exponents $\alpha$ and $\beta$ coincide?
