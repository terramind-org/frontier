title: Moy-Prasad Data and Langlands Parameters
field: mathematics
tier: prose
statement: Let $\pi\in\operatorname{Irr}_{\mathrm{sm}}(G(F))$, let $(X,r)$ be its associated Moy-Prasad datum with $r>0$, and let $\phi_\pi$ be its Langlands parameter. Prove that $\phi_\pi|_{W_F^{>r}}=1$ and $\phi_\pi|_{W_F^{=r}}=\phi_X$ in general.
