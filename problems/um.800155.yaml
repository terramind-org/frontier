title: Moments of L-functions — Moments of the Riemann zeta function — Problem 4
field: mathematics
tier: prose
statement: |-
  Smoothed fourth moment. Let $\omega(t)$ be a smooth compactly supported function supported in $[c_1T, c_2T]$ where $0 < c_1 < c_2$.
  Show that
  \[
  \int_{-\infty}^{\infty} \omega(t) |\zeta(\tfrac{1}{2}+i t)|^{4} dt = O(T^{\frac{1}{2} + \theta+\varepsilon })
  \]
  where
  $\theta$ is upper
  bound in Ramanujan's conjecture.
  See [Ber, Corollary 2] where an analogous result was proven for modular $L$-functions.
