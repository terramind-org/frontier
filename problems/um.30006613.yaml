title: Coarse Buneman Models for Countable Preference Data
field: mathematics
tier: prose
statement: Extend the Buneman-graph model of single-peaked preference data to a countably infinite set of alternatives. Construct a coarse Buneman graph that accommodates missing or uncertain half-space assignments and computes medians with controlled error.
