title: Moments of L-functions — Moments of the Riemann zeta function — Problem 12
field: mathematics
tier: prose
statement: |-
  Ng, Shen, and Wong [NSW] showed that the Riemann hypothesis and a smoothed quaternary additive divisor conjecture imply
  the conjectured asymptotic
  \[
  I_4(T) \sim C_4 T (\log T)^{16}
  \]
  for a certain positive constant $C_4$. Under the same assumptions, obtain the full main term, up to an error term of size $o(T)$ or a power savings error term. Obtain a shifted version of this result. Under the same assumptions, asymptotically evaluate
  \[
  \int_{-\infty}^{\infty} \omega(t) \Big( \prod_{j=1}^{4} \zeta(\tfrac{1}{2}+a_j+it) \zeta(\tfrac{1}{2}+b_j-it) \Big) dt
  \]
  where $a_j, b_j$, $j=1, \ldots, 4$ are complex numbers satisfying $|a_j|, |b_j| \ll \frac{1}{\log T}$ and $\omega(t)$ is a smooth, compactly supported function in $[c_1T, c_2T]$ with $0 < c_1 < c_2$.
