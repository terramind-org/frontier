title: "Rational lines on cubic hypersurfaces: a three-layer local obstruction and an explicit pointed example"
field: mathematics
tier: prose
statement: |-
  **Question 16 (Wooley).** Solve the local-global solubility problem for
  finding lines on a cubic hypersurface.

  (a) Find an example of a cubic hypersurface over \(\mathbb Q_p\) (in as many
  variables as possible) with no rational line.

  (b) Find an example of a cubic hypersurface over \(\mathbb Q\) (in as many
  variables as possible) with no rational line.
