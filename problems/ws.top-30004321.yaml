  \section{Nagata Conjecture for Multipoint Seshadri Constants}\label{30004321}
  {\small UnsolvedMath ID 30004321 · Algebraic Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Nagata's conjecture asks whether, for $r\geq 10$ and sufficiently general points $x_1,\ldots,x_r$ in $\mathbb{P}^2$, the multipoint Seshadri constant of $\mathcal{O}_{\mathbb{P}^2}(1)$ equals $1/\sqrt r$.
  \par\smallskip\textit{Formulation references:} \sref{30004321}{1}, \sref{30004321}{2}.
  \subsection{Short English statement}
  Nagata's conjecture asks whether, for $r\geq 10$ and sufficiently general points $x_1,\ldots,x_r$ in $\mathbb{P}^2$, the multipoint Seshadri constant of $\mathcal{O}_{\mathbb{P}^2}(1)$ equals $1/\sqrt r$.
