  module: FormalConjectures.ErdosProblems.«30»
  decl: Erdos30.erdos_30
  statement: |-
    theorem erdos_30 :
        ∀ᵉ (ε > 0), (fun N => h N - (N : Real).sqrt) =O[atTop] fun N => (N : ℝ)^(ε : ℝ)
  context:
    - open Erdos30
    - open Filter
