title: Sub-Twice-Maximum-Degree Game Chromatic Index Bounds
field: mathematics
tier: prose
statement: Does there exist $\varepsilon>0$ such that every nonempty graph $G$ satisfies $\chi'_g(G)\leq(2-\varepsilon)\Delta(G)$, where $\chi'_g(G)$ is the game chromatic index and $\Delta(G)$ is the maximum degree?
