statement: Are elements of $\pi_n(\mathrm{TMF})$ naturally parametrized by $n$-dimensional semisimple compact-type Lie algebras through the Stolz–Teichner cocycle construction? Does the Stolz–Teichner cocycle construction hit exactly the classes represented by compact Lie groups with left-invariant framings?
