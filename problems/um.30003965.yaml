title: Lifting Tropical Divisors with Prescribed Rank
field: mathematics
tier: prose
statement: Given a tropical curve $\Gamma$ and a divisor $D=\sum_{i=1}^n a_i p_i$ of degree $d$ and rank $r$ on $\Gamma$, does there exist a smooth projective curve $X$ over a non-Archimedean field $K$ with dual tropical curve $\Gamma$ and a divisor $\widetilde D$ on $X$ of multiplicity profile $(a_1,\ldots,a_n)$ and rank $r$ whose specialization is $D$?
