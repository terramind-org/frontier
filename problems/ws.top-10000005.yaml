statement: |-
  \section{Additive-error graph model of the Euclidean plane}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $G=(V,E)$ be a connected graph whose edges have unit length, and let $d_G$ be shortest-path distance. A map $f:V\to\mathbb R^2$ is an additive-error rough isometry if some $C<\infty$ satisfies
  \[\bigl|d_G(x,y)-\|f(x)-f(y)\|_2\bigr|<C\quad(x,y\in V),\]
  and every point of $\mathbb R^2$ lies at Euclidean distance less than $C$ from $f(V)$. A bounded-degree graph has $\sup_{v\in V}\deg(v)<\infty$.
  \paragraph{Statement recorded in the supplied source.}
  Does such a graph and additive-error rough isometry exist? Can $G$ in such an example have bounded degree? \sref{statement}{2}
  \subsection{Short English statement}
  Can the whole Euclidean plane be represented by a unit-edge graph with uniformly bounded additive distance error, including with bounded degrees?
