title: Hyperbolic Orbifold Realizations of Compact PL Manifolds
field: mathematics
tier: prose
statement: For every compact PL $n$-manifold $M$ without boundary, does there exist a cocompact lattice $\Gamma\subset O(n,1)$ such that $\mathbb H^n/\Gamma$ is PL-isomorphic to $M$?
