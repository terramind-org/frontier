title: Linear Systems and Eigenvalue Problems — Problem 26
field: mathematics
tier: prose
statement: |-
  There is currently no rigorous proof (in the vein of theoretical computer science) of success for a floating-point implementation of MR$^3$ when applied to an arbitrary symmetric tridiagonal matrix. Willems and Lang [Willems_framework] have given a proof of correctness which is conditional on several underlying assumptions, some of which cannot be verified until the algorithm is executed on a given input. At the same time, it is known that MR$^3$ can fail in the presence of roundoff when eigenvalues are too tightly clustered, if implemented without care (see [Parlett:CSD-04-1367]).

  Give a ``TCS-style'' analysis of MR$^3$ which proves its correctness and convergence under easily verifiable conditions on the input.
