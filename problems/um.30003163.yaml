title: Integral Reduced Norms in Division-Algebra K-Theory
field: mathematics
tier: prose
statement: Let $K$ be a complete discretely valued field with finite residue field of characteristic $p$ and $D$ a central division algebra over $K$. Is the reduced norm isomorphism $\operatorname{Nrd}_{D/K}:K_j(D,\mathbb Z_p)\to K_j(K,\mathbb Z_p)$ induced by a map of K-theory spectra, equivalently yielding an integral reduced-norm isomorphism on K-groups? In particular, are the $p$-primary torsion subgroups of the integral K-groups of bounded exponent?
