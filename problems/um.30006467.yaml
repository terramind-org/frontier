title: Counting Palindromic and Digit-Reversible Squares
field: mathematics
tier: prose
statement: Determine the asymptotic number of palindromic squares in $[1,X]$, and decide whether infinitely many exist outside the four known infinite families. Determine the number of nonpalindromic squares whose digit reversal is also a square, and decide whether there are infinitely many.
