title: Boundaries of Groups and Kleinian Groups — Problem 22
field: mathematics
tier: prose
statement: Is there a convex core for the diagonal action of G on X1 × X2? (A special case is surface groups G with X1 and X2 corresponding to diﬀerent hyperbolic structures.) If there is a convex core, can Z (the space with cell-like maps to X1 and X2) be taken to be the boundary of the core?
