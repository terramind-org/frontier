statement: |-
  \section{Forcing a 2-regular minor}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  All graphs are finite and simple. The average degree of $G$ is $2|E(G)|/|V(G)|$. A graph $H$ is a minor of $G$ if it can be obtained by deleting vertices or edges and contracting edges. A $2$-regular graph has degree two at every vertex, hence is a vertex-disjoint union of cycles.
  \paragraph{Statement recorded in the supplied source.}
  For every integer $t\ge3$, does every graph of average degree at least $4t/3-2$ contain every $2$-regular graph on $t$ vertices as a minor? \sref{statement}{2}
  \subsection{Short English statement}
  Does the proposed sharp average-degree threshold force every prescribed disjoint union of cycles as a minor?
