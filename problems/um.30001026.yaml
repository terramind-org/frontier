title: Geodesic Expansions of Off-Diagonal Spectral Functions
field: mathematics
tier: prose
statement: Let $M$ be a compact Riemannian surface, let $N_{x,y}(\lambda)$ be its spectral function, and let $\Gamma_{x,y}$ be the geodesic segments from $x$ to $y$. Does there exist $p\geq1$ such that, for every $x\in M$ and almost every $y\in M$, the function $N_{x,y}(\lambda)/\sqrt{1+\lambda}$ has in the Besicovitch space $B^p$ the asymptotic expansion obtained by summing over $\gamma\in\Gamma_{x,y}$, with frequencies $l(\gamma)$, phases determined by the Morse indices $m(\gamma)$, and amplitudes determined by $l(\gamma)$ and the orthogonal Jacobi field $J$ satisfying $J(0)=0$ and $J'(0)=1$?
ams: []
