id: um.5000003
title: Reachable points lie on reachable polygons
field: mathematics
tier: prose
statement: Unfold a billiard trajectory in a regular $n$-gon by reflecting the polygon across each encountered side. A short trajectory joins two vertices and meets no vertex in between; a reachable point is an endpoint vertex occurring in such an unfolding. For an oriented short trajectory, let $\alpha$ and $\beta$ be its source and target endpoint angles as in Definition 2.1 of the source, and write $A_k$ for the resulting one of $n-2$ trajectory types (indices modulo $n-2$); in particular $A_0$ is characterized by $\beta-\alpha=2\pi/n$. Prove that every reachable point is a vertex of infinitely many reachable $n$-gons.
