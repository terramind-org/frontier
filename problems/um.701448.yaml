title: Kourovka Notebook Problem 18.19
field: mathematics
tier: prose
statement: |-
  Is any torsion-free, relatively free group of infinite rank not $\aleph_1$-homogeneous?
  This is true for group varieties in which all free groups are residually finite
  (O. Belegradek, *Arch. Math. Logic*, **51**
  (2012), 781--787).
