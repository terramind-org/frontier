title: Infinite Values of the $kappa$-Invariant
field: mathematics
tier: prose
statement: For a closed manifold $M$, define $\kappa(M)$ to be the least integer $k$ such that, for every $\varepsilon>0$, there is a Riemannian metric $g_\varepsilon$ whose Dirac eigenvalues satisfy $\mu_k(g_\varepsilon)=1$ and $|\mu_i(g_\varepsilon)|<\varepsilon$ for $0\leq i<k$; set $\kappa(M)=\infty$ if no such $k$ exists. Can $\kappa(M)=\infty$ occur?
