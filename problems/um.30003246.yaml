id: um.30003246
title: Sharp Transcendence Bounds for the Modular J-Function
field: mathematics
tier: prose
statement: |-
  Let $C$ be $j\operatorname{cl}$-closed, let $\lambda$ be a $j\operatorname{cl}$-independent tuple, and set $F=\mathbb Q(\lambda)$. For a tuple $z$ whose coordinates lie in distinct $G$-orbits and a nonscalar $g\in G_F\setminus G$, is the Ax–Schanuel lower bound
  $$
  \operatorname{td}\bigl(j(z),j'(z),j''(z),j(gz),j'(gz),j''(gz)/F,C\bigr)\geq3n
  $$
  sharp, or can it be improved without proving a modular Schanuel conjecture? Can the $j$-derivation pregeometry $j\operatorname{cl}$ be described explicitly?
