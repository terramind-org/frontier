  definitions:
    - name: OeisA196697.a
      kind: def
      text: |-
        /--
        Number of distinct primes of the form $2^n \pm 2^k \pm 1$ with $0 \le k < n$.
        -/
        def a (n : ℕ) : ℕ :=
          let candidates : Finset ℕ :=
            (Finset.range n).biUnion fun k =>
              {2 ^ n + 2 ^ k + 1, 2 ^ n + 2 ^ k - 1, 2 ^ n - 2 ^ k + 1, 2 ^ n - 2 ^ k - 1}
          (candidates.filter Nat.Prime).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/196697.lean#L34
