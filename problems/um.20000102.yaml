statement: |-
  4th day

  Do there exist a cubic \(4\)-fold defined over number fields which is
  conjecured to be irrational but many reductions are conjectured to be ratioal?

  Does there exist a cubic fourfold \(Y\) over a number field \(K\) which is
  conjectured to be irrational in characteristic zero but for which many
  reductions \(Y_v\) are rational?
