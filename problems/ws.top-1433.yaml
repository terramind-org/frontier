  \item[\hypertarget{source:1433:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 1433 (GRAPH-046). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:1433:2}{S2}] Suchanda Roy and Ramesh Hariharasubramanian, Characterization of Word-Representable Near-Triangulations, arXiv:2605.25733v1 (2026), Sections 1--2, near-triangulation definition and word-representability. \url{https://arxiv.org/pdf/2605.25733v1}.
  \end{description}
