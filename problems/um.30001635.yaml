title: Structure and Topology of Johnson Cokernels
field: mathematics
tier: prose
statement: "In the theory of the Johnson filtration of the mapping class group $\\mathcal{M}_{g,1}$ of a surface of genus $g$ with one boundary component, let $\\tau_k : \\mathcal{M}_{g,1}[k] \\to \\mathfrak{h}_g(k)$ denote the $k$-th Johnson homomorphism into the degree-$k$ part of the derivation Lie algebra $\\mathfrak{h}_g$. Determine the algebraic structure and topological meaning of the Johnson cokernels $\\mathfrak{h}_g(k) / \\tau_k(\\mathcal{M}_{g,1}[k])$."
