title: Research Problems in Function Theory — Problem 9.2
field: mathematics
tier: prose
statement: Let $f(z)\in H^\infty$, and let $\{z_n\}$ be a Blaschke sequence \[\sum^\infty_{n=1}(\-|z_n|)<\infty.\] [(a)] ; Does there always exist a Blaschke product $B(z)$ of norm not necessarily equal to $1$, such that $$ B(z_n)=f(z_n) $$ for $n\geq1$? This is certainly the case if the Blaschke sequence is uniformly separated, that is \[\inf_n\prod_{m\neq n}\big|\frac{z_m-z_n}{1-\overline{z_m}z_n}\big|>0.\] See, for example, Earl . ; Is the unique $H^\infty$ function of minimal norm assuming the values $\{f(z_n)\}$ at $\{z_n\}$ a constant multiple of a Blaschke product? The answer is `yes' if the sequence $\{z_n\}$ is finite, see Earl . What happens if we know, in addition, that $f(z_n)\to0$ as $n\to\infty$? The answer is again `yes' if $z_n\to1$ non-tangentially as $n\to\infty$. ; One can ask questions $(a)$ and $(b)$ for sequences $\{z_n\}$ that are weakly separated, viz \[\inf_{m\neq n}\big|\frac{z_m-z_n}{1-\overline{z_m}z_n}\big|>0.\] ; Also, one can ask questions $(a)$ and $(c)$ for inner functions instead of for Blaschke products. (J. P. Earl and A. Stray)
