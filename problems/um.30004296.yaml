title: Counting Integer Matrices with Prescribed Minor Scales
field: mathematics
tier: prose
statement: Let $f(n)$ be one of $\sqrt n,n,n^{3/2},n^2,n^3$, let $M=[f(m_{ij})]$, let $\Delta_k$ be the maximum absolute determinant of a $k\times k$ minor, and count the tuples $(m_{ij})$ with prescribed scales $\Delta_k\asymp D_k$; what upper bounds can be obtained for this counting function?
