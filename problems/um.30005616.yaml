title: Universal Lower Bounds for Biharmonic Steklov Eigenvalues
field: mathematics
tier: prose
statement: Given $\alpha,M>0$, prove that constants $a,b>0$ depending only on $\alpha,M,n$ satisfy $\rho_k(\Omega)\geq ak^{2/(2n-1)}$ for every convex $\Omega\subset\mathbb R^n$ of volume $M$, and $\rho_k(\Omega)\geq bk^{1/n}$ for every such general domain.
