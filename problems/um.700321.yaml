statement: |-
  Prove that every countable group can act faithfully as a group of
  automorphisms of a finitely generated soluble group (of derived
  length at most 4). For background to this problem, in particular
  its relationship with problem 8.50, see (P. M. Neumann, *in: Groups--Korea, Pusan, 1988 $($Lect. Notes Math.*, **1398**),
  Springer, Berlin, 1989, 124--139).
