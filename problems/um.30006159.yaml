title: Hamiltonicity of Connected Vertex-Transitive Graphs
field: mathematics
tier: prose
statement: Does every connected vertex-transitive graph contain a Hamilton path and, apart from the five known exceptions, a Hamilton cycle? In particular, is every connected Cayley graph Hamiltonian, and is a random connected Cayley graph generated by $C\log|G|$ elements asymptotically almost surely Hamiltonian?
