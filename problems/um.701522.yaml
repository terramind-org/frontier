title: Kourovka Notebook Problem 18.93
field: mathematics
tier: prose
statement: |-
  Let $\mathcal{M}$ be a one-generated saturated formation, that is, the
  intersection of all saturated formations containing some fixed finite
  group. Let $\mathcal{F}$ be a subformation of $\mathcal{M}$ such that $\mathcal{F}
  \ne {\mathcal{F}}{\mathcal{F}}$.

  a) Is it true that then $\mathcal{F}$ can be written in the form
  ${\mathcal{F}}={\mathcal{F}}_{1} \cdots {\mathcal{F}}_{t}$, where ${\mathcal{F}}_{i}$ is a
  non-decomposable formation for every $i=1, \ldots , t$?

  b) Suppose that ${\mathcal{F}}={\mathcal{F}}_{1} \cdots {\mathcal{F}}_{t}$, where
  ${\mathcal{F}}_{i}$ is a non-decomposable formation for every $i=1, \ldots , t$. Is it
  true that then all factors ${\mathcal{F}}_{i}$ are uniquely determined?
