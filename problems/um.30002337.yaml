title: Geometric, Energetic, and Probabilistic Knot Problems
field: mathematics
tier: prose
statement: Can complexity methods prove the existence of nontrivial local minima for knot energies? Are the spaces of embedded equilateral arms and unknotted equilateral polygons connected? How many knot types have a given stick number? What are the limiting torsion laws for confined equilateral walks and polygons? Does mutation preserve arc index? What is the Frisch–Wasserman–Delbrück exponent $\varepsilon$?
