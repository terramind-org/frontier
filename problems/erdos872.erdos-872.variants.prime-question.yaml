lean:
  module: FormalConjectures.ErdosProblems.«872»
  decl: Erdos872.erdos_872.variants.prime_question
  statement: |-
    theorem erdos_872.variants.prime_question :
        ∀ n ≥ 2, ∀ A : Finset ℕ, Maximal (IsPrimitive n) A →
          ((Finset.Icc 2 n).filter Nat.Prime).card ≤ A.card
  context:
    - open Erdos872
    - open Erdos872.erdos_872
    - open Erdos872.erdos_872.variants
    - open Filter
  definitions:
    - name: Erdos872.IsPrimitive
      kind: def
      text: |-
        /-- A primitive subset of $\{2, \dots, n\}$ is a set in which no element divides another.
        The quantified divisibility condition is one-sided because the variables range over all ordered
        pairs of distinct elements. -/
        def IsPrimitive (n : ℕ) (A : Finset ℕ) : Prop :=
          A ⊆ Finset.Icc 2 n ∧ ∀ a ∈ A, ∀ b ∈ A, a ≠ b → ¬ a ∣ b
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/ErdosProblems/872.lean#L45
