title: Several Complex Variables Problem List — Problem 1
field: mathematics
tier: prose
statement: |-
  {\bf (New) (See Section 7.2.) Let $V$ be a germ at $0$ of an irreducible complex variety
  in $\mathbb{C}^n.$ For any small enough $\epsilon > 0$, let
  $E= E_\epsilon:= V \cap \mathbb{R}^n \cap \{|z|< \epsilon \}.$
  Define the extremal function $U_E$ on $\{ |z|< \epsilon \}:
  U_E(z):= \sup \{u(z); u \leq 0\; \mbox{on}\; E,\;
  0 \leq u \leq 1 \; \mbox{on} \; \{|z|< \epsilon \}$
  The problem is to classify those $V$ for which we have a constant
  $A>0$ for which
  $(\alpha) \; U_E(z) \leq A | \Im z |,\; |z|< \epsilon/2.$}
