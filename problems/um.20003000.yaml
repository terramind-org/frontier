title: A convention-robust rank-two superspace coinvariant basis
field: mathematics
tier: prose
statement: |-
  Find a basis of the coinvariant ring of
  \(\mathbb C[x_1,\ldots,x_n,y_1,\ldots,y_n,\theta_1,\ldots,
  \theta_n,\phi_1,\ldots,\phi_n]\) and a combinatorial model for the
  Frobenius characteristic in the
  \(\mathbb C[x_1,\ldots,x_n,y_1,\ldots,y_n,\theta_1,\ldots,
  \theta_n]\) case; does the basis proposed by Haglund--Sergel work?
