title: A residual-diamond model for abelian dynamics with shared memory
field: mathematics
tier: prose
statement: "(13) Lionel Levine: \"What is the right definition of an abelian network with shared memory?\" (a) Lionel Levine: \"I have unified some subset of the class of models that behave like chip-firing does, but a lot of models with an abelian property still fall outside this definition and seem to re-quire some kind of shared memory. An example of shared mem-ory is cluster-firing, as investigated by Spencer Backman [6], who in particular studied when the abelian property is pre-served while allowing firing of multiple vertices at once.\" (b) Jordan Ellenberg: \"This seems formally similar to Persi Diaco-nis's question on non-overlapping discs.\""
