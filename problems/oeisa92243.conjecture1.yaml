  decl: OeisA92243.conjecture1
  statement: "theorem conjecture1 : ∃ n > 250000, a n > 0"
  context:
    - open OeisA92243
  definitions:
    - name: OeisA92243.a
      kind: def
      text: |-
        /-- Score at stage $n$ in "tug of war" between prime gap increases vs. prime gap decreases. -/
        noncomputable def a (n : ℕ) : ℤ :=
          if n ≤ 1 then 0
          else
            ∑ k ∈ Finset.Icc 2 n,
              ((primeGap k : ℤ) - (primeGap (k - 1) : ℤ)).sign
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/92243.lean#L39
