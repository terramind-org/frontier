title: Randomstrasse101 Open Problems (2024) — Conjecture 3 (Global Synchrony with negative edges)
field: mathematics
tier: prose
statement: |-
  Given any $\varepsilon>0$, the $n\times n$ random matrix $A$ with zero diagonal and off-diagonal entries given by
  \[
  A_{ij} =
  \left\{ \begin{array}{ccl}
  1 & \text{with probability} & \frac12+\delta\\
  -1 & \text{with probability} &
  \frac12-\delta,
  \end{array} \right.
  \]
  with $\delta \geq (1+\varepsilon)\sqrt{\frac{\log n}{2n}}$,
  is globally synchronizing with high probability.
