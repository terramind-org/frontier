title: Kourovka Notebook Problem 18.88
field: mathematics
tier: prose
statement: |-
  Can a finitely generated infinite group of finite exponent be the quotient of a residually finite group by a locally finite normal subgroup?

  If not, then there exists a hyperbolic group that is not residually finite.
