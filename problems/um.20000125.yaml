title: Smooth hypersurfaces beyond the Chevalley--Warning range
field: mathematics
tier: prose
statement: |-
  For every \(p,d\) with \(d\geq n+1\), can we find hypersurface over
  \(\mathbb F_p\) of degree \(d\) in \(\mathbb P^n\) such that either
  \(\#X\not\equiv 1\pmod p\) or \(X\) is not rationally connected?
