title: Injectivity of the Quantum K-Theoretic Hall Homomorphism
field: mathematics
tier: prose
statement: "Let $(Q, W)$ be the quiver with potential associated to a symmetric quiver (such as the tripled quiver with canonical cubic potential), let $K(Q, W)$ be its critical $K$-theoretic Hall algebra (KHA), and let $U^+$ be the positive half of the corresponding quantum affine algebra. Is the canonical graded algebra homomorphism $\\psi : U^+ \\to K(Q, W)$ injective?"
