title: Several Complex Variables Problem List — Problem 66
field: mathematics
tier: prose
statement: |-
  Let $ F_c : (z,w) \rightarrow (z^2 +c - w, z)$, $c \in \mathbb{C}$ a symplectic
  automorphism of $\mathbb{C}^2$, i.e. $F_c$ is biholomorphic and $ F^*_c(dz \wedge dw) = dz \wedge dw$. Can there exist a $c \in \mathbb{C}$ and a periodic orbit $\{z_i\}^k_{i=0}$ for $F_c$ such that $z_0$ belongs to a Siegel domain ?\\
  -M. Herman
