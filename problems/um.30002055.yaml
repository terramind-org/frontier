title: Diameter Bounds for Connected Layer Families
field: mathematics
tier: prose
statement: For connected layer families on $d$-element multisets from $n$ symbols, is $\widetilde f(d,n)=d(n-1)$? In particular, can this be proved or refuted for $d=3$? For layer families arising from triangulated surfaces, are the upper bounds $2n$ with boundary and $n$ without boundary tight?
