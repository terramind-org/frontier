  module: FormalConjectures.ErdosProblems.«1056»
  decl: Erdos1056.erdos_1056.variants.noll_simmons
  statement: |-
    theorem erdos_1056.variants.noll_simmons :
        ∀ᶠ k in Filter.atTop,
        ∃ (p : ℕ) (_ : p.Prime) (Q : Fin k → ℕ) (_ : StrictMono Q) (_ : ∀ i, Q i < p),
        ∀ i j : Fin k, (Q i)! ≡ (Q j)! [MOD p]
