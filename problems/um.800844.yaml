title: Randomstrasse101 Open Problems (2024) — Problem 10 (How many deviations are needed afterall?)
field: mathematics
tier: prose
statement: |-
  It is easy to see that the statement of this conjecture implies Spencer's Theorem, since the columns of an $n\times n$, $\pm1$ matrix, have $\ell_2$ norm $\sqrt{n}$. The best current lower bound for K\'{o}mlos is a recent construction by Tim Kunisky [Tim-lowerboundKomlos] which shows a lower bound on $K$ of $1+\sqrt{2}$. Unfortunately, the resulting matrix is not a $\pm1$ matrix (even after scaling), and so it does not provide a lower bound for the Spencer setting.

  What is the value of the following quantity?
  $$\sup_{n\in\mathbb{N}}\sup_{A\in\{\pm1\}^{n\times n}}\frac1{\sqrt{n}}\mathrm{disc}(A)$$
