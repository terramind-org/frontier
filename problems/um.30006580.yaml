title: Model Companions and Geometry of Globally Valued Fields
field: mathematics
tier: prose
statement: Do existentially closed globally valued fields form a first-order class; equivalently, does the theory $\mathrm{GVF}_e$ have a model companion? Is there a Berkovich-type geometry whose closed points represent global heights on residue rings of algebras? What is the asymptotic first-order theory of number fields viewed as globally valued fields, and of globally valued fields satisfying Northcott's principle?
