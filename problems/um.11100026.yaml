title: Applications 2 — Neil Strickland points out that several different moduli spaces are used in differential geometry and…
field: mathematics
tier: prose
statement: Neil Strickland points out that several different moduli spaces are used in differential geometry and physics. For example, there is the moduli space people are always talking about in every talk on gauge theory I have ever been to. I can't remember what this moduli space is now, unfortunately--something to do with connections and the gauge group? Anyway, the geometers tend to think only about the rational homology of these spaces. What about their Morava K-theory? (Neil also mentioned solitons and Seiberg-Witten theory).
