title: Kourovka Notebook Problem 11.44
field: mathematics
tier: prose
statement: |-
  For a finite group $X$,
  we denote by $r(X)$ its sectional rank. Is it true that the
  sectional rank of a finite $p $-group, which is a product $AB$
  of its subgroups $A$ and $ B$, is bounded by some linear function
  of $r(A)$ and $r(B)$?
