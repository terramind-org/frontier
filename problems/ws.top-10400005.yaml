  \item[\hypertarget{source:10400005:2}{S2}] T. Ohtsuki (editor), \emph{Problems on invariants of knots and 3-manifolds}, Geometry \& Topology Monographs 4 (2002), pp. 377--572 (published 2004), item 1.5 and its surrounding definitions and remarks. \url{https://arxiv.org/abs/math/0406190v1}.
  \end{description}
