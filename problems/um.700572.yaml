title: Kourovka Notebook Problem 9.39
field: mathematics
tier: prose
statement: |-
  Let $\Omega$ be a countable set and ${\mathfrak{m}}$ a
  cardinal number such that $\aleph _0 \leq {\mathfrak{m}} \leq 2^{\aleph
  _0}$ (we assume Axiom of Choice but not Continuum Hypothesis). Does
  there exist a permutation group $G$ on $\Omega$ that has exactly
  ${\mathfrak{m}}$ orbits on the power set ${\mathfrak{P}}(\Omega )$?

  *Comment of 2001:* It is proved
  (S. Shelah, S. Thomas, *Bull. London Math. Soc.*, **20**,
  no. 4 (1988), 313--318) that the answer is positive in set theory
  with Martin's Axiom. The question is still open in ZFC.
