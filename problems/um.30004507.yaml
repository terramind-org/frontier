title: Subconvexity for Symmetric-Square L-Functions
field: mathematics
tier: prose
statement: Let $u_j$ be a Hecke--Maass cusp form on $\mathrm{SL}_2(\mathbb{Z})$ with Laplace eigenvalue $1/4 + t_j^2$, and let $L(\operatorname{sym}^2 u_j, s)$ be its symmetric-square $L$-function. Prove a subconvexity bound in the spectral $t_j$-aspect at the central point $s = 1/2$, i.e., $L(\operatorname{sym}^2 u_j, 1/2) \ll t_j^{1/2 - \delta}$ for some absolute constant $\delta > 0$.
