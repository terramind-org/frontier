statement: |-
  \section{Feit–Thompson conjecture}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For distinct primes $p,q$, the integers
  \[
  A_{p,q}=\frac{p^q-1}{p-1}=\sum_{j=0}^{q-1}p^j,\qquad B_{p,q}=\frac{q^p-1}{q-1}=\sum_{j=0}^{p-1}q^j
  \]
  are geometric sums. The relation $a\mid b$ means $b=at$ for some integer $t$.
  \paragraph{Statement recorded in the supplied source.}
  For every ordered pair of distinct primes $p,q$, is $A_{p,q}\nmid B_{p,q}$? \sref{statement}{2}
  \subsection{Short English statement}
  Can the stated prime-base geometric sum ever divide the analogous sum with the two primes interchanged?
