  \section{\texorpdfstring{$L^p$ Bounds for the Triangular Hilbert Transform}{L\textasciicircum{}p Bounds for the Triangular Hilbert Transform}}\label{30003534}
  {\small UnsolvedMath ID 30003534 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Determine the range of exponents for which the triangular Hilbert transform, the trilinear singular integral with kernel $(x+y+z)^{-1}$, is bounded on the corresponding $L^p$ spaces.
  \par\smallskip\textit{Formulation references:} \sref{30003534}{1}, \sref{30003534}{2}.
