title: An unbounded-width obstruction for weak square at aleph_omega
field: mathematics
tier: prose
statement: |-
  Is it consistent to have the failure of both $\mathrm{SCH}$ and $\square_{\aleph_\omega}^{*}$?

  Is it relatively consistent with ZFC (from suitable large-cardinal hypotheses) that $\kappa=\aleph_\omega$ is a singular strong-limit cardinal, $2^\kappa>\kappa^+$, and Jensen's weak square $\square^*_{\kappa}$ fails?

  A positive answer is necessary to get $\mathrm{AP}_{\aleph_{\omega+1}}+\mathrm{AP}_{\aleph_{\omega+2}}$.
