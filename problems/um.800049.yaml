title: The Lyapin's Notebook — Problem 51
field: mathematics
tier: prose
statement: |-
  (E.S. Lyapin)

  - For the main classes of mathematical structures and natural pargoids of transformations, determine the classes of structures that are defined by these pargoids up to isomorphism.

  - Find pargoids of transformations that are determined up to isomorphism by their semigroup of endomorphisms (or group of automorphisms).

  E.S. Lyapin proved that partially ordered sets are determined up to isomorphism by the pargoids of their closure operators on these sets (see [ESL2], [ESL3], [ESL4]).
