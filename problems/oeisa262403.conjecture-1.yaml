  module: FormalConjectures.OEIS.«262403»
  decl: OeisA262403.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : 4 < n) : 0 < a n"
  context:
    - open OeisA262403
  definitions:
    - name: OeisA262403.a
      kind: def
      text: |-
        /--
        Number of ways to write $\pi(T(n)) = \pi(T(k)) + \pi(T(m))$ with $1 < k < m < n$.
        -/
        def a (n : ℕ) : ℕ :=
          let target := primeCountTriangular n
          ∑ k ∈ Finset.Icc 2 (n - 2),
            ((Finset.Icc (k + 1) (n - 1)).filter (fun m =>
              target = primeCountTriangular k + primeCountTriangular m)).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/262403.lean#L41
