title: Positively Curved Projective Varieties — Problem 8
field: mathematics
tier: prose
statement: |-
  The second difference concerns the positivity of fibers $F$ of $\phi:X \to Y$.
  It was proved in [DPS94] that rationally connected manifolds with nef tangent bundle are always Fano manifolds.
  However, the same conclusion does not hold for pseudo-effective tangent bundles,
  since the tangent bundle of the Hirzebruch surfaces is pseudo-effective (see [HIM19, Proposition 4.5]).
  Then we suggest the following problem:

  [{[HIM19, Problem 3.13]}]

  Let $X$ be a rationally connected manifold with pseudo-effective tangent bundle.
  Then is the anti-canonical divisor $-K_X$ big?
