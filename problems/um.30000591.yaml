title: Stable Cohomology of Orthogonal Groups over Binary Fields
field: mathematics
tier: prose
statement: Does the inverse system of cohomology groups for orthogonal groups over $\mathbb{F}_2$, analogous to the stabilizing system for general linear groups, stabilize? Is its stable value described by an analogue of the Betley–Suslin theorem in the functor category $\mathcal{F}_{\mathrm{quad}}$?
