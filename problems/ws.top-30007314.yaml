statement: |-
  \section*{Dimension-one bound after Jiang–Su stabilization for separable nuclear C*-algebras}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every separable nuclear complex C*-algebra A, including nonunital and nonsimple algebras, must $dim_nuc(A\otimes Z)\leq 1$?
  \subsection{Short English statement}
  For every separable nuclear complex C*-algebra A, including nonunital and nonsimple algebras, must $dim_nuc(A\otimes Z)\leq 1$?
