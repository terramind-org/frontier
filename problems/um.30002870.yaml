title: Symmetric Landau–Ginzburg Mirrors of Homogeneous Spaces
field: mathematics
tier: prose
statement: For a homogeneous space $X$ and its Landau–Ginzburg mirror, can the relationship be made more symmetric? Can the mirror be expressed in coordinates naturally related to the cohomology of $X$? Does the map from cohomology to twisted de Rham cohomology extend to an isomorphism of bundles with connection?
