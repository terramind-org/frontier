title: Linear Systems and Eigenvalue Problems — Problem 4 (Polynomially decaying eigenvalues)
field: mathematics
tier: prose
statement: |-
  Fix constants $\varepsilon > 0$ and $p > 0$.
  Let $\mathbf{A}_n \in \mathbb{C}^{n \times n}$, $n\geq 1$, be a sequence of random positive definite matrices constructed via
  \begin{equation*}
  \mathbf{A}_n = \mathbf{U} \mathbf{\Lambda}_n \mathbf{U}^*,
  \quad \text{where } \begin{cases} \mathbf{U} \in \mathbb{C}^{n \times n} \text{ is Haar unitary}, \\
  \mathbf{\Lambda}_n = \operatorname{diag}\{1^{-p}, 2^{-p}, \ldots, n^{-p}\}.
  \end{cases}
  \end{equation*}
  Let $\mathbf{b}_n = \mathbf{A}_n \mathbf{z}_n$ be a sequence of random vectors where $\mathbf{z}_n \in \mathbb{C}^n$ is distributed uniformly on the sphere.
  What is the asymptotic behavior of $T_\mathrm{CG}(\mathbf{A}_n,\mathbf{b}_n,\epsilon)$ compared with $T_\mathrm{RCD}(\mathbf{A}_n,\mathbf{b}_n,\epsilon)$ as $n \rightarrow \infty$?
