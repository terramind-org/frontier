lean:
  module: FormalConjectures.Wikipedia.GyarfasSumnerConjecture
  decl: GyarfasSumnerConjecture.gyarfas_sumner_conjecture
  statement: |-
    theorem gyarfas_sumner_conjecture :
        ∀ {W : Type} [Fintype W] [DecidableEq W] (T : SimpleGraph W) [DecidableRel T.Adj],
          T.IsTree → ∃ f : ℕ → ℕ, IsChiBoundedBy T f
  context:
    - open GyarfasSumnerConjecture
    - open SimpleGraph
  definitions:
    - name: GyarfasSumnerConjecture.IsChiBoundedBy
      kind: def
      text: |-
        /-- A class of graphs given by a forbidden induced subgraph `T` is **χ-bounded by `f`** if every
        finite graph `G` with no induced copy of `T` satisfies `χ(G) ≤ f(ω(G))`. -/
        def IsChiBoundedBy {W : Type} (T : SimpleGraph W) (f : ℕ → ℕ) : Prop :=
          ∀ {V : Type} [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj],
            ¬ SimpleGraph.IsIndContained T G → G.chromaticNumber ≤ f G.cliqueNum
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Wikipedia/GyarfasSumnerConjecture.lean#L44
