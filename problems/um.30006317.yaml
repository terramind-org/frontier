id: um.30006317
title: The Local Geometric Langlands Conjecture
field: mathematics
tier: prose
statement: For a Hamiltonian $G$-space $M$, can one construct a dual Hamiltonian $G^\vee$-space $M^\vee$ so that local geometric Langlands duality matches the boundary conditions associated with $M$ and $M^\vee$? In the unramified cotangent case $M=T^*X$, can this be realized by an equivalence involving $G(\mathcal D)$-equivariant sheaves on $X(\mathring{\mathcal D})$?
