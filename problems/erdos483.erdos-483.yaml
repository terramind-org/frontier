  statement: |-
    theorem erdos_483 :
        ∃ C : ℝ, 0 < C ∧ ∀ k : ℕ, 0 < k →
          ∃ N : ℕ, (N : ℝ) < C ^ k ∧ Forces k N
  context:
    - open Erdos483
  definitions:
    - name: Erdos483.Forces
      kind: def
      text: |-
        /-- Every colouring of $\{1,\ldots,N\}$ with at most $k$ colours has a Schur triple. -/
        def Forces (k N : ℕ) : Prop := ∀ χ : Fin N → Fin k, HasTriple χ
