schema: 1
id: dirichletcharacter.simple-prop-one-hundred
title: Simple zeros of the Riemann zeta function on the critical line (DirichletCharacter.simple_prop_one_hundred)
field: mathematics
tier: proof
statement: |-
  Almost all nontrivial zeros of `L(s, χ)`, `χ` primitive, are simple and on the critical
  line.
ams:
  - 11
tags:
  - paper
references:
  - label: pdf
    url: https://www-cdn.anthropic.com/95c246936988e43127bc6b2ceb7077c1dad2d68e.pdf
  - label: Lean formalisation
    url: https://github.com/anthropics/zeta-23-lean
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Riemann_hypothesis#Zeros_on_the_critical_line
