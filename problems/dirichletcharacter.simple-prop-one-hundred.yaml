  licence: Apache-2.0
upstream_status: open
lean:
  module: FormalConjectures.Paper.RiemannZetaZeros
  decl: DirichletCharacter.simple_prop_one_hundred
  statement: |-
    theorem simple_prop_one_hundred (hχ : χ.IsPrimitive) : ∃ o : ℝ → ℝ, o =o[atTop] (1 : ℝ → ℝ) ∧
        ∀ T > 0, (1 - o T) * N (LFunction χ) T (2 * T) ≤ Ns (LFunction χ) T (2 * T)
  context:
    - open DirichletCharacter
    - open Filter
    - open ZetaZeros
    - "variable {M : ℕ} [NeZero M] {χ : DirichletCharacter ℂ M}"
  definitions:
    - name: ZetaZeros.N
      kind: def
      text: |-
        /-- `N(T₁, T₂)`: the nontrivial zeros of `f` with imaginary part in `(T₁, T₂]`, counted with
        multiplicity. -/
        noncomputable def N (f : ℂ → ℂ) (T₁ T₂ : ℝ) : ℕ :=
          ∑ᶠ s ∈ nontrivialZeros f T₁ T₂, (analyticOrderAt f s).toNat
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Paper/RiemannZetaZeros.lean#L53
    - name: ZetaZeros.Ns
      kind: def
      text: |-
        /-- `Ns(T₁, T₂)`: the number of simple zeros of `f` on the critical line with imaginary part in
        `(T₁, T₂]`. -/
        noncomputable def Ns (f : ℂ → ℂ) (T₁ T₂ : ℝ) : ℕ :=
          {s ∈ nontrivialZeros f T₁ T₂ | s.re = 1 / 2 ∧ analyticOrderAt f s = 1}.ncard
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Paper/RiemannZetaZeros.lean#L62
