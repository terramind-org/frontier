lean:
  module: FormalConjectures.ErdosProblems.«97»
  decl: Erdos97.erdos_97.variants.k_equidistant
  statement: |-
    theorem erdos_97.variants.k_equidistant :
        ∃ k : ℕ, ∀ A : Finset ℝ², A.Nonempty → ConvexIndep A → ¬HasNEquidistantProperty k A
  context:
    - open Erdos97
    - open Erdos97.erdos_97
    - open Erdos97.erdos_97.variants
    - open EuclideanGeometry
    - open Real
  definitions:
    - name: Erdos97.HasNEquidistantProperty
      kind: def
      text: |-
        /--
        A set of points $A$ has n equidistant property
        if for every point in $A$, there exist at least $n$ other points in $A$ that are equidistant from it.
        -/
        def HasNEquidistantProperty (n : ℕ) (A : Finset ℝ²) : Prop :=
          HasNEquidistantPointsOn n A A
