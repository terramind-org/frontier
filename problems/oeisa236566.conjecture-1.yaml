  module: FormalConjectures.OEIS.«236566»
  decl: OeisA236566.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : 2 < n) : 0 < a n"
  context:
    - open OeisA236566
  definitions:
    - name: OeisA236566.a
      kind: def
      text: |-
        /-- $a(n)$ is the number of ordered ways to write $2n = p + q$ with $p, q$ and
        $\operatorname{prime}(p + 2) + 2$ all prime. -/
        noncomputable def a (n : ℕ) : ℕ :=
          ∑ p ∈ Finset.range (2 * n),
            if p.Prime ∧ (2 * n - p).Prime ∧ (Nat.nth Nat.Prime (p + 1) + 2).Prime then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/236566.lean#L34
