title: Resolvent Degree of Abelian-Variety Torsion Covers
field: mathematics
tier: prose
statement: If $(g,p)\neq(2,2)$, then the resolvent degree of the $p$-torsion cover of the moduli space $A_g$ of principally polarized abelian varieties is $\operatorname{RD}(A_{g,p}\to A_g)=\dim A_g=g(g+1)/2$.
