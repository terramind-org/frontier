title: Global Stability Thresholds in Two-Species Migration Models
field: mathematics
tier: prose
statement: For the two-species Lotka–Volterra competition system with nonnegative heterogeneous growth rate $m(x)$, let $c\in(c^*,1)$ and suppose $(\mu,\nu)\in\Sigma_c$, so that the semitrivial steady state $(\theta,0)$ is linearly stable. Is $(\theta,0)$ globally asymptotically stable for every $0<b<1$?
