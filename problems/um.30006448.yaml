title: Small Resolutions Detected by Symplectic Cohomology
field: mathematics
tier: prose
statement: Let $F$ be the Milnor fiber of an isolated compound Du Val singularity. Does the singularity admit a small resolution with $\ell$ irreducible exceptional components if and only if $\operatorname{rank}SH^k(F)=\ell$ in every negative degree $k$?
