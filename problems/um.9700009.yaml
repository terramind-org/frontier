title: Spectral gap of a Bayesian graph Laplacian
field: mathematics
tier: prose
statement: For the posterior random weighted graphs $G(t)$ defined from independent Poisson edge counts and flat priors, study the process $\operatorname{gap}(G(t))$. For large graphs is it concentrated near its expectation under weak assumptions, and how large must $t$ be before it is close to $\operatorname{gap}(G(\infty))$?
