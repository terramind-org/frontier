title: What a computable nonforking section computes
field: mathematics
tier: prose
statement: |-
  Inspection of page 2 of the original AIM problem-session PDF shows that the material beginning “1.4.

  The complete relevant source context is Section 1.3, “Continuous sections (Miller)”:

  Thus “computable section” in Question 8 refers to a section
  \[
   s=s^{\mathrm{nf}}_{M,N}:S_1(M)\longrightarrow S_1(N)
  \]
  of restriction \(r:S_1(N)\to S_1(M)\), where \(s(p)\) is the unique nonforking extension of \(p\) from \(M\) to \(N\). The PDF does not specify representations of models, formula algebras, or points of the Stone spaces. Without such data, “computable” has no invariant formal meaning. The results below therefore state an explicit effective coding convention.
