  module: FormalConjectures.ErdosProblems.«805»
  decl: Erdos805.erdos_805.parts.i
  statement: |-
    theorem erdos_805.parts.i :
        {g : ℕ → ℕ | (∀ᶠ n : ℕ in atTop, Real.log n ^ 2 ≤ g n ∧ g n < n) ∧ HasRamseyGraphs g} =
          erdos_805.parts.i.answer
  context:
    - open Erdos805
    - open Erdos805.erdos_805
    - open Erdos805.erdos_805.parts
    - open Filter
  definitions:
    - name: Erdos805.HasRamseyGraphs
      kind: def
      text: |-
        /-- `HasRamseyGraphs g`: for all sufficiently large `n` there is a graph on `n` vertices in
        which every induced subgraph on `g n` vertices contains a clique and an independent set of size
        at least $\log n$ (that is, of at least `⌈log n⌉` vertices; `log` is the natural logarithm). -/
        def HasRamseyGraphs (g : ℕ → ℕ) : Prop :=
          ∀ᶠ n : ℕ in atTop, ∃ G : SimpleGraph (Fin n), IsLocallyRamsey G (g n) ⌈Real.log n⌉₊
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/805.lean#L60
    - name: Erdos805.erdos_805.parts.i.answer
      kind: def
      text: |-
        /-- The answer: the set of functions `g` with $n>g(n)\geq(\log n)^2$ for which such graphs
        exist. -/
        def erdos_805.parts.i.answer : Set (ℕ → ℕ) := sorry
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/805.lean#L66
