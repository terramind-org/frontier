id: um.20002669
title: Uniform spectral tails and compact-resolvent obstruction for the free heat semigroup
field: mathematics
tier: prose
statement: Consider \(\Delta=\sum_{i=1}^m\partial_{x_i}^*\partial_{x_i}\) and the corresponding completely positive map \(\varphi_t=\exp(-t\Delta)\), where \((x_1,\ldots,x_m)\) have finite free Fisher information. Can \(\varphi_t\) converge uniformly to the identity map on the unit ball of \(W^*(x_1,\ldots,x_m)\)? If no, it follows that the von Neumann algebra generated by \((x_1,\ldots,x_m)\) is not weakly rigid if it is non-hyperfinite.
