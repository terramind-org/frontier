title: Kourovka Notebook Problem 20.64
field: mathematics
tier: prose
statement: |-
  Let $G$ be a non-amenable group.

  a) Prove that $G^n$ is non-unitarisable for some $n$.

  b) At least prove that $G^{\infty}$, the
  direct sum (restricted product), is non-unitarisable.
