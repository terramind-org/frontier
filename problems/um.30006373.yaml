title: Legendre–Assouad Bounds for Fractal Local Smoothing
field: mathematics
tier: prose
statement: For $p>2$, does $\left(\sum_{t\in E_j}\lVert e^{it\sqrt{-\Delta}}P_jf\rVert_{L^p(\mathbb{R}^d)}^p\right)^{1/p}\leq C2^{js}\lVert f\rVert_{L^p(\mathbb{R}^d)}$ hold whenever $s>p^{-1}\nu_E^{\#}(ps_p)$, where $s_p=(d-1)(1/2-1/p)$ and $\nu_E^{\#}$ is the Legendre–Assouad function of $E$?
