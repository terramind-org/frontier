id: um.20002614
title: Gaussian-side decoupling and free-convolution density
field: mathematics
tier: prose
statement: |-
  Determine eigenvalue information, especially the limiting eigenvalue density of \(M_1\), in the Hermitian two-matrix model

  \[
    Z_N^{-1}\exp\{-N\operatorname{Tr}[V(M_1)+W(M_2)+tM_1M_2]\}\,dM_1\,dM_2. \tag{1}
  \]

  Its first case is \(V(x)=x^2/2\) and a general, not necessarily even, polynomial \(W\) of even degree. Its broader case takes \(V\) to be an even quartic and \(W\) to have no symmetry. This report uses the standard interpretation that \(M_1,M_2\) are \(N\times N\) Hermitian matrices and \(t\in\mathbb R\). “Even degree (no symmetry)” is understood as allowing odd lower-order terms, not as saying \(W(-x)=W(x)\).

  There is an omitted normalization condition. A polynomial of even degree need not be confining: its leading coefficient must be positive. In the quadratic case the interaction imposes a sharper condition described below. Without it, (1) is not a probability density.
