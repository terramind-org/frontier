title: Differential Criteria for Low-Genus Curves on Surfaces
field: mathematics
tier: prose
statement: |-
  Let $X$ be a smooth projective surface over $\mathbb C$, let $\pi:X\to\mathbb P^2$ be a finite morphism with branch divisor $B$, and fix $g\geq0$. If $L$ is an invertible sheaf of minimal degree among those admitting a nonzero section vanishing on the image of every curve on $X$ of geometric genus at most $g$, does there exist
  $$
  \omega\in H^0\bigl(\mathbb P^2,L\otimes S^r\Omega^1_{\mathbb P^2/\mathbb C}\bigr)
  $$
  such that every component of $B$ and every image of such a low-genus curve is $\omega$-integral?
