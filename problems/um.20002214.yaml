id: um.20002214
title: Exact orthant certificates and Newton obstructions for polynomials in minors
field: mathematics
tier: prose
statement: |-
  An algorithmic process is known to identify inequalities that compare the
  products of two minors for all \(TN\) matrices.

  Classify real linear combinations of products of minors that are nonnegative
  for all \(TN\) matrices. More concretely, given a polynomial
  \(p(\{x_{I\times J}\mid I,J\subset[n], |I|=|J|\})\), when can one certify,
  via some constructive algorithmic process, that evaluating \(p\) at
  \(x_{I\times J}=\det A_{I\times J}\) yields a non-negative output for all
  \(TN\) matrices \(A\).
