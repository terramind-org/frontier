lean:
  module: FormalConjectures.Paper.Kurepa
  decl: Kurepa.kurepa_conjecture.variants.prime
  statement: |-
    theorem kurepa_conjecture.variants.prime (p : ℕ) (h_p : 2 < p) :
        p.Prime → (!p : ℕ) % p ≠ 0
  context:
    - open Kurepa
    - open Kurepa.kurepa_conjecture
    - open Kurepa.kurepa_conjecture.variants
    - open BigOperators Nat Finset
    - local notation "!" n => left_factorial n
  definitions:
    - name: Kurepa.left_factorial
      kind: def
      text: |-
        /--
        Left factorial of n
        $$!n = 0! + 1! + 2! + \dots + (n-1)!$$
        -/
        def left_factorial (n : ℕ) := ∑ m ∈ Finset.range n, m !
