title: Problem 4.9 — Investigate the topology of Hg andHc g and their components.
field: mathematics
tier: prose
statement: Investigate the topology of Hg andHc g and their components. Specifically, compute their homology and the cohomology at infinity of Hc g,α. The period mapping immerses each Hc g,α in hg as a closed subvariety. Consequently, each Hc g,α is a Stein manifold and thus has the homotopy type of a CW-complex of dimension equal to its complex dimension, which is 2 g− 1. 10As the genus increases, the number of components of Hg increases exponentially while the minimum number of generators of Tg increases polynomially. The failure of the genus 3 argument presented above in higher genus suggests that J c g is not, in general, simply connected.
