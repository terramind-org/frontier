title: Gepner-type numerical stability on quintic threefolds
field: mathematics
tier: prose
statement: |-
  \section*{Gepner-type numerical stability on quintic threefolds}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every smooth complex quintic $X\subset P^{4}$, is there a locally finite numerical Bridgeland stability condition (Z,P) with the full numerical support property, normalized by $Z(O_x)=-1$ for each point, such that $\Phi =T_{O_X}\circ (-\otimes O_X(1))$ sends $P(\varphi )$ to $P(\varphi +2/5)$ and $Z(\Phi E)=\exp (2\pi i/5)Z(E)$?
  \subsection{Short English statement}
  For every smooth complex quintic $X\subset P^{4}$, is there a locally finite numerical Bridgeland stability condition (Z,P) with the full numerical support property, normalized by $Z(O_x)=-1$ for each point, such that $\Phi =T_{O_X}\circ (-\otimes O_X(1))$ sends $P(\varphi )$ to $P(\varphi +2/5)$ and $Z(\Phi E)=\exp (2\pi i/5)Z(E)$?
