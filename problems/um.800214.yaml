title: Several Complex Variables Problem List — Problem 10
field: mathematics
tier: prose
statement: |-
  Let $X$ be a complex subvariety of the unit ball $\mathbb{B}$ with an isolated
  singularity at the origin. Suppose $\Omega_t$ is a continuously increasing
  family of Stein open subsets of $X$. Also, suppose that $0 \in \partial \Omega_{1/2} ,
  0\in \Omega_t, t>1/2.$ Is $\Omega_s$ Runge in $\Omega_t$ $\forall s<t$?
