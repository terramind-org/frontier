title: Hamiltonian cycles in powers of infinite graphs
field: mathematics
tier: prose
statement: |-
  Conjecture

  - If $G$ is a countable connected graph then its third power is hamiltonian.
  - If $G$ is a 2-connected countable graph then its square is hamiltonian.
