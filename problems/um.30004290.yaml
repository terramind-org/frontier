id: um.30004290
title: Typical Size of the Erdős–Hooley Function
field: mathematics
tier: prose
statement: |-
  For a typical integer $n$, determine the asymptotic size of the Erdős–Hooley divisor-concentration function

  $$\Delta(n)=\max_i\#\{d\mid n:e^i\leq d\leq e^{i+1}\}.$$

  In particular, is the exponent $\eta\approx0.353$ in the almost-all lower bound $\Delta(n)\gg(\log\log n)^{\eta+o(1)}$ optimal?
