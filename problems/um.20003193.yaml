statement: "**Question 5.5 (Bill Goldman).** Let \\(S\\) be a closed orientable surface with \\(\\chi(S)<0\\), and \\(G\\) a semisimple Lie group. Define \\(E_\\rho:\\mathcal T_S\\to\\mathbb R\\) to be the energy function associated to a representation \\(\\rho:\\pi_1(S)\\to G\\). What are the most general conditions on \\(\\rho\\) for which \\(E_\\rho\\) is proper?"
