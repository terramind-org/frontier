title: Higher-dimensional critical configurations and an orientation obstruction
field: mathematics
tier: prose
statement: "What are higher dimensional (in the sense of [18] and [17]) critical configurations?” Sam Hopkins asks whether the desired objects should specifically generalize stable recurrent configurations, or also parking functions and superstable elements. Klivans replies: “We would like to generalize any of these notions from the graph case to the simplicial complex case."
