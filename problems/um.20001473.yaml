id: um.20001473
title: The liftable-Calkin-masa and diffuse-witness reductions
field: mathematics
tier: prose
statement: |-
  Consider the following statement: for every pure state \(\phi\) of
  \(\mathcal B(H)\) there is a masa \(\mathcal A\) such that
  \(\phi\restriction\mathcal A\) is multiplicative (i.e., pure). Is it
  consistent with ZFC?

  Its negation is known to follow from the Continuum Hypothesis
  (Akemann--Weaver).
