title: Uniform Bounds for Volume-Decomposition Functionals
field: mathematics
tier: prose
statement: |-
  Let $P\subset\mathbb R^n$ be a polytope whose centroid is the origin. For $1\leq k\leq n-1$, does a constant $c(n,k)$ exist such that
  $$
  \frac{X_k(P)}{V_n(P)}\leq c(n,k)
  $$
  for every such $P$?
