title: An unequal-cardinality trilinear Kakeya estimate in four dimensions
field: mathematics
tier: prose
statement: |-
  **Recovered question.** Suppose that we are in \(\mathbb R^4\), and let \(\varepsilon>0\). Suppose that \(\mathbb T_1,\mathbb T_2,\mathbb T_3\) are three transversal families of \(\delta\)-tubes (three short sides of length \(\delta\) and one long side of length \(1\)) such that, for each \(j\in\{1,2,3\}\),
  \[
  \{e(T):T\in\mathbb T_j\}
  \]
  is a \(\delta\)-separated subset of \(S^3\). If
  \[
  q\geq \frac43,
  \qquad
  \frac1p+\frac3q\leq 3,
  \]
  then is there a constant \(C_\varepsilon>0\) such that
  \[
  \left\|
  \prod_{j=1}^{3}
  \left(\sum_{T\in\mathbb T_j}\chi_T\right)
  \right\|_{L^{q/3}(\mathbb R^4)}
  \leq C_\varepsilon
  \prod_{j=1}^{3}
  \left[
  \delta^{\,4/q-3/p'-\varepsilon}
  (\#\mathbb T_j)^{1/p}
  \right]?
  \tag{AIM}
  \]
  Here \(e(T)\in S^3\) is the direction of the long side of \(T\), and \(p'\) is the conjugate exponent.
