title: Kourovka Notebook Problem 19.7
field: mathematics
tier: prose
statement: |-
  The group of virtual pure braids $VP_n$, $n \geq 2$, is generated by elements $\lambda_{ij}$, $1 \leq i \not= j \leq n$, and is defined by the relations
  $
  \lambda_{ij}\lambda_{kl}=\lambda_{kl}\lambda_{ij}$, \ $\lambda_{ki}\lambda_{kj}\lambda_{ij}=\lambda_{ij}\lambda_{kj}\lambda_{ki}
  $,
  where different letters denote different indices.

  a) Construct a normal form of words in the group $VP_n$ for $n \geq 4$.

  b) Is the group $VP_n$ linear for $n \geq 4$? It is known that the group $VP_3$ is linear.
