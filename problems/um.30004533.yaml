title: Asymptotic Minimal Quadratic Growth of Gorenstein Algebras
field: mathematics
tier: prose
statement: |-
  Let

  $$\nu(r)=\min_{A\in QG(r)}\dim A_2,$$

  where $QG(r)$ consists of codimension-$r$ Artinian Gorenstein algebras presented by quadrics and having socle degree $4$. Is

  $$\lim_{r\to\infty}\frac{\nu(r)}{r^{2/3}}=6$$?
