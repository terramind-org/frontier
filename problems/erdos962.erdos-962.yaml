  decl: Erdos962.erdos_962
  statement: |-
    theorem erdos_962 :
        ∃ ε : ℕ → ℝ,
          (∀ δ > 0, ∀ᶠ n in atTop, |ε n| < δ) ∧
          ∀ᶠ n : ℕ in atTop,
            log (k n : ℝ)
              ≤ rpow (log n) ((1 : ℝ) / 2 + ε n)
