title: Projector endomorphisms and the correct Hilbert chart
field: mathematics
tier: prose
statement: |-
  For each standard tableau \(T\) of size \(n\), compute the \((q,t,a)\)-graded algebra \(H^*\operatorname{REnd}(P_T)\) in the appropriate completed/bounded-above homotopy category of type-A Soergel complexes, and compare it with
  \[
  \Gamma(\mathring{\operatorname{FH}}_T(\mathbb C),
  \mathcal O_{\operatorname{FH}^{\mathrm{dg}}_n(\mathbb C)})
  \otimes \Lambda^\bullet(\mathcal T_n^\vee).
  \]
