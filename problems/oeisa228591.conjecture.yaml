lean:
  module: FormalConjectures.OEIS.«228591»
  decl: OeisA228591.conjecture
  statement: "theorem conjecture (n : ℕ) (hn : n > 15) : a n ≠ 0"
  context:
    - open OeisA228591
    - open Matrix
  definitions:
    - name: OeisA228591.a
      kind: def
      text: |-
        /-- Determinant of the $n \times n$ $(0,1)$-matrix with $(i,j)$-entry ($1 \le i, j \le n$) equal
        to $1$ if and only if $i + j$ is $2$ or an odd composite number. -/
        def a (n : ℕ) : ℤ :=
          let M : Matrix (Fin n) (Fin n) ℤ := fun i j =>
            let k := i.val + j.val + 2
            if k = 2 ∨ (k % 2 = 1 ∧ ¬ k.Prime) then 1 else 0
          M.det
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/228591.lean#L36
