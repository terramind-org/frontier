lean:
  module: FormalConjectures.OEIS.«234246»
  decl: OeisA234246.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) :
        a n = 1 ↔ n ∈ ({4, 5, 8, 9, 12, 13, 24, 33, 49} : Finset ℕ)
  context:
    - open OeisA234246
    - open ArithmeticFunction
    - open scoped ArithmeticFunction.sigma
  definitions:
    - name: OeisA234246.a
      kind: def
      text: |-
        /--
        Number of integers $0 < k < n$ such that $k \phi(n - k) + 1$ is a square,
        where $\phi$ is Euler's totient function.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ k ∈ Finset.Ico 1 n,
            let m := k * (n - k).totient + 1
            if ∃ r ≤ m, r * r = m then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/234246.lean#L37
