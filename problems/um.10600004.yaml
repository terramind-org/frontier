title: Virtual-knot problem 4 — Virtuals and the Theory of Doodles
field: mathematics
tier: prose
statement: |-
  Virtuals and the Theory of Doodles: Compare flat theories of
  virtual knots with theories of doodles. A doodle is represented by a
  flat diagram in the plane. Reidemeister moves of type I and II are
  allowed but not type III. So a triple point must not be allowed.
  Khovanov has associated a group to doodles . Commutator
  identities can also be associated to a doodle. Cobordism of doodles
  is defined by an immersed surface without triple points. Cobordism
  classes represent elements of a free abelian group. There is
  undoubtably a rich seam of results which could be found by
  investigating doodles. For example there is no reason not to have
  virtual crossings as well as flat crossings. This would give doodles
  on a surface of higher genus, see .
