title: Foliations and Diffeomorphism Groups — Question 2
field: mathematics
tier: prose
statement: Let $\varphi$ be a transitive pseudo-Anosov flow on a closed, oriented 3-manifold, and let $\gamma_1,\dots, \gamma_k$ be a collection of closed orbits. Let $Z\subseteq \mathbb{R}^k$ be the closure of the set of multislopes such that simultaneous Dehn surgery on the $\gamma_i$'s results in a pseudo-Anosov flow admitting a transverse codimension 1 foliation. What structure does the set $Z$ have?
