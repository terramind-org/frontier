lean:
  module: FormalConjectures.ErdosProblems.«1111»
  decl: Erdos1111.erdos_1111
  statement: |-
    theorem erdos_1111 :
        ∀ t c : ℕ, 1 ≤ t → 1 ≤ c → ∃ d : ℕ, 1 ≤ d ∧
          ∀ (V : Type*) [Finite V] (G : SimpleGraph V),
            (d : ℕ∞) ≤ G.chromaticNumber → G.CliqueFree t →
              ∃ A B : Set V, Anticomplete G A B ∧
                (c : ℕ∞) ≤ (G.induce A).chromaticNumber ∧
                (c : ℕ∞) ≤ (G.induce B).chromaticNumber
  context:
    - open Erdos1111
  definitions:
    - name: Erdos1111.Anticomplete
      kind: def
      text: |-
        /-- Two sets `A` and `B` of vertices of `G` are *anticomplete* if they are disjoint and `G` has
        no edge between `A` and `B`. -/
        def Anticomplete {V : Type*} (G : SimpleGraph V) (A B : Set V) : Prop :=
          Disjoint A B ∧ ∀ a ∈ A, ∀ b ∈ B, ¬ G.Adj a b
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/1111.lean#L37
