title: Periodic Minimizers in Compact Linear Domino Games
field: mathematics
tier: prose
statement: For a linear domino game $(\Sigma,T,s)$ with infinite compact topological symbol space $\Sigma$ and continuous size function $s$, must an average-size minimizer be periodic? Equivalently, construct a game for which no periodic sequence minimizes average size, or prove none exists.
