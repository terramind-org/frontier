title: Kourovka Notebook Problem 14.14
field: mathematics
tier: prose
statement: |-
  (C. C. Edmunds, G. Rosenberger). We call
  a pair of natural numbers $(k,m)$ *admissible* if
  in the derived subgroup $F_2'$ of a free group $F_2$
  there is an element $w$ such that the commutator length
  of the element $w^m$ is equal to $k$.
  Find all admissible pairs.

  It is known that every pair $(k, 2)$, $k \geq 2$,
  is admissible (V. G. Bardakov, *Algebra and Logic*, **39**
  (2000), 224--251).
