title: Beilinson conjectures on special values of motivic L-functions
field: mathematics
tier: prose
statement: For a motive (or the cohomology of a smooth projective variety) and an appropriate integer argument, is the order of vanishing of its L-function the predicted motivic-cohomology rank, and is its first nonzero Taylor coefficient, up to the prescribed rational factor, the determinant of the Beilinson regulator?
