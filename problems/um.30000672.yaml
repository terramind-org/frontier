title: Relative Galois Reconstruction of One-Variable Function Fields
field: mathematics
tier: prose
statement: Let $K,K'$ be perfect fields, suppose $K$ has a finite extension of degree greater than $2$ and prime to $\operatorname{char}K$, let $F/K$ be a one-variable function field, and let $F'/K'$ be any function field. Is the canonical map $\operatorname{Isom}(F/K,F'/K')\to\operatorname{Isom}(G_{F/K},G_{F'/K'})/\operatorname{Inn}(G_{F'/K'})$ bijective?
