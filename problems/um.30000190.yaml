title: Semiampleness and Ampleness on Abelian Moduli Spaces
field: mathematics
tier: prose
statement: Let $\mathcal{A}_g^F$ be the first Voronoi (perfect-cone) toroidal compactification of the moduli space $\mathcal{A}_g$ of principally polarized abelian varieties of dimension $g$, let $E$ be the Hodge bundle on $\mathcal{A}_g^F$ with first Chern class $M = c_1(E)$, and let $D$ be the boundary divisor. Is the divisor $12M - D$ semi-ample on $\mathcal{A}_g^F$? Furthermore, for which ample line bundles $L$ on $\mathcal{A}_g^F$ is the vector bundle $E \otimes L$ ample?
