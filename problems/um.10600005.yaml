title: Virtual-knot problem 5 — Virtual Three Manifolds
field: mathematics
tier: prose
statement: |-
  Virtual Three Manifolds: There is a theory of virtual
  $3$–manifolds constructed as formal equivalence classes of virtual
  diagrams modulo generalized Kirby moves, see . From this
  point of view, there are two equivalences for ordinary
  $3$–manifolds: homeomorphisms and virtual equivalence. Do these
  equivalences coincide? That is, given two ordinary three manifolds,
  presented by surgery on framed links $K$ and $L$, suppose that $K$
  and $L$ are equivalent through the virtual Kirby calculus. Does this
  imply that they are equivalent through the classical Kirby calculus?

  What is a virtual $3$-manifold?: That is, give an
  interpretation of these equivalence classes in the domain of
  geometric topology.

  Construct another theory of virtual $3$–manifolds by
  performing surgery on links in thickened surfaces $S_{g}\times
  \mathbb{R}$ considered up to stabilization. Will this theory
  coincide to that proposed by Kauffman and Dye ?
