title: Kourovka Notebook Problem 4.9
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finitely generated torsion-free
  nilpotent group. Are there only a finite number of non-isomorphic
  groups in the sequence $\alpha G$, $\alpha ^2G, \ldots $ ? Here
  $\alpha G$ denotes the automorphism group of $G$ and $\alpha
  ^{n+1}G=\alpha (\alpha ^nG)$ for $n=1, 2,\ldots $
