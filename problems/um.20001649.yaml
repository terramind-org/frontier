title: A quantitative Dehn-twist growth criterion
field: mathematics
tier: prose
statement: |-
  **Problem 3.7.** Prove (uniform) uniform exponential growth for two-generator subgroups of \(\operatorname{Out}(F_n)\), or in particular two Dehn twists.

  Matt Clay in his talk had proposed a “baby question” towards proving the Dehn twist case: bounding a certain ratio (which ought to be recalled here) appearing in his joint work with Alexandra Pettet. Martin Bridson suggested using linear quotients, as it is potentially easier to prove uniform exponential growth by mapping to well-understood subgroups.
