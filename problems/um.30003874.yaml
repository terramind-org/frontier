title: Resolvent Degrees of Lines and Bitangents
field: mathematics
tier: prose
statement: Conjecturally, the resolvent degree of the 27-sheeted cover parametrizing lines on smooth cubic surfaces is $\operatorname{RD}(H_{3,3}^{(1)}\to H_{3,3})=3$, and the resolvent degree of the 28-sheeted cover parametrizing bitangents to smooth plane quartics is $\operatorname{RD}(H_{4,2}^{(1)}\to H_{4,2})=\dim H_{4,2}=6$.
