title: Splitting Bundles for Hilbert-Scheme Equivalences
field: mathematics
tier: prose
statement: Choose a splitting bundle $V_0$ on the Frobenius-twisted punctual Hilbert scheme $\operatorname{Hilb}^{(1)}_0$ such that $\Gamma(\operatorname{Hilb}^{(1)}_0,V_0(-1))=L_{\mathrm{sign}}$. Prove that the resulting composite derived equivalence preserves the natural $t$-structures and sends each simple $S_n$-module object $L_\tau$ to $\tau_H$.
