title: Distribution of Elliptic-Curve Selmer Exact Sequences
field: mathematics
tier: prose
statement: Given an abstract short exact sequence $S$ of $\mathbb Z_p$-modules, what is the density of elliptic curves $E$ over $k$ for which $0\to E(k)\otimes\mathbb Q_p/\mathbb Z_p\to\operatorname{Sel}_{p^\infty}(E)\to\operatorname{Sha}(E)[p^\infty]\to0$ is isomorphic to $S$?
