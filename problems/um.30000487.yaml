title: Prime Ideals in Iwasawa Algebras
field: mathematics
tier: prose
statement: Let $G$ be a uniform, torsion-free, $p$-adic analytic pro-$p$ group whose $\mathbb{Q}_p$-Lie algebra is simple (for example, a congruence subgroup of $\mathrm{SL}_n(\mathbb{Z}_p)$), and let $\Omega G = \mathbb{F}_p[[G]]$ be its mod-$p$ Iwasawa algebra. Are $\{0\}$ and the Jacobson radical $J(\Omega G)$ the only two-sided prime ideals of $\Omega G$?
