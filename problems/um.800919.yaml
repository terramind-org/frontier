title: AGNES Open Problems in Algebraic Geometry — Q7
field: mathematics
tier: prose
statement: |-
  Do the Noether-Lefschetz divisors span
  $\text{Pic}(M^{K3}_{2n}) \otimes_{\mathbb{Z}}{\mathbb{Q}}$?

  Let $X$ be a compact
  Calabi-Yau 3-fold expressed as $K3$-fibration over $\mathbb{P}^1$,
  $$\pi:X\rightarrow \mathbb{P}^1\ .$$
  Given an ample line bundle $L$ on $X$, the family $\pi$
  determines a morphism of the base $\mathbb{P}^1$ to the moduli
  of polarized $K3$ surfaces.
  Via [mpnl], the Gromov-Witten theory of $X$ in $\pi$-fiber classes is
  calculated in terms of the Noether--Lefschetz numbers of $\pi$ and
  the Katz-Klemm-Vafa [kkv] conjecture concerning $\lambda_g$ integrals
  in the reduced Gromov-Witten theory of a fixed $K3$ surface. The KKV
  conjecture is proven for all classes in genus 0 in [kmps] and
  all genera in primitive classes in [mpt].
