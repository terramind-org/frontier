title: Tverberg Intersections Under Good Cover Conditions
field: mathematics
tier: prose
statement: "For continuous maps in the topological Tverberg setting: does the Tverberg conclusion hold when images of faces form a good cover or are contractible; is there a common point in all images of faces of dimension m-r; and does the disjoint-face intersection assertion hold for affine maps from an m-polytope?"
