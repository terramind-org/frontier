title: Finite-resolution density of periodic geodesic directions
field: mathematics
tier: prose
statement: |-
  **Question 8.4.3.** Is there a dense subset of metrics in $\mathcal G$ for which the tangent vectors to the closed geodesics are dense in $SM$?

  It is relatively easy to construct, see e.g. [Weinstein1970], a metric on any manifold such that a certain open subset of $SM$ contains no vectors tangent to a closed geodesic.
