title: Open Problems in Arithmetic Dynamics — Question 48
field: mathematics
tier: prose
statement: |-
  We recall that $\operatorname{End}_d^1(K)$ denotes the set of degree $d$ rational
  functions $f\in K(x)$, and we write $\operatorname{Poly}_d^1(K)$ for the set of
  degree $d$ polynomials $f\in K[x]$. We define
  \begin{align*}
  \operatorname{Poly}_d^1(\mathbb{F}_q)^\mathrm{stab} &:= \bigl\{ f\in\operatorname{Poly}_d^1(\mathbb{F}_q) : \text{$(f,0)$ is stable over $\mathbb{F}_q$} \bigr\}, \\
  \operatorname{Rat}_d^1(\mathbb{F}_q)^\mathrm{stab} &:= \bigl\{ f\in\operatorname{Rat}_d^1(\mathbb{F}_q) : \text{$(f,0)$ is stable over $\mathbb{F}_q$} \bigr\},
  \end{align*}
  to be the indicated sets of $\mathbb{F}_q$-stable maps. For fixed $d\ge2$,
  how does the size of the sets $\operatorname{Poly}_d^1(\mathbb{F}_q)^\mathrm{stab}$ and
  $\operatorname{Rat}_d^1(\mathbb{F}_q)^\mathrm{stab}$ grow as $q\to\infty$?
  Analogous questions apply for the sets of eventually stable maps,
  and for maps of $\mathbb{A}^N$ or $\mathbb{P}^N$ with $N\ge2$.
