title: Long-Time Behavior of Random-Data Nonlinear Schrödinger Equations
field: mathematics
tier: prose
statement: Determine the long-time behavior of the almost-sure global solution to the one-dimensional nonlinear Schrödinger equation $$i\partial_sU+\partial_y^2U=|U|^{p-1}U,$$ where $1<p<5$ and the initial data are Gaussian and of low regularity.
