title: A compact finite-shell reduction for lattice soft packings
field: mathematics
tier: prose
statement: |-
  **Lattice Packings**

  It is know that the problem of finding the densest lattice packing of spheres in a fixed dimension is a solvable by a finite algorithm (Voronoi, Minkowski).

  Can the lattice soft ball packing problem be solved by a finite algorithm?
  Amongst lattice packings of unit balls, which maximizes the density with respect to soft balls?
