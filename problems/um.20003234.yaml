title: A stabilizer certificate for Frobenius divisibility
field: mathematics
tier: prose
statement: |-
  **“Kaplansky's sixth conjecture” for fusion categories.** Is
  \[
    \frac{\operatorname{FPdim}(\mathcal C)}
         {\operatorname{FPdim}(X)}
  \]
  an algebraic integer for every
  $X\in\operatorname{Irr}(\mathcal C)$?
