title: Question 3.5 — For which values of m does Out(Fn) embed in Out(Fm)?
field: mathematics
tier: prose
statement: For which values of m does Out(Fn) embed in Out(Fm)? What is the minimal such m, and is it true for all suﬃciently large m? It has been shown that when n is suﬃciently large with respect to i, the homology group Hi(Out(Fn), Z) is independent of n [50, 51 ].
