title: Signed variation of cotangent Dehn-twist powers and the five-dimensional negative stabilization
field: mathematics
tier: prose
statement: |-
  This is Question 1.33 (Giroux), under “Sixth day,” in the AIM workshop notes *Holomorphic Curves in Contact Geometry*.

  1. **Generation and the boundary twist.** A contact structure on a closed manifold is represented by a Stein/Weinstein open book, hence by a boundary-relative symplectomorphism of its page, modulo stabilization. Are such symplectomorphisms generated by Dehn twists about parametrized Lagrangian spheres? For an integral closed symplectic manifold \((W,\omega)\), a high-degree Donaldson hypersurface \(H_k\) has Stein complement \(F_k=W\setminus H_k\). The annulus-fiber twist near \(\partial F_k\), equivalently the canonical fibered boundary twist, is boundary-relative. Is it a product of ordinary Lagrangian-sphere twists? If \(F_k\) is subcritical and contains no Lagrangian sphere, is this monodromy isotopic, even topologically, to the identity?
  2. **Odd powers and the Ustilovsky examples.** The standard contact structure on \(S^{2n+1}\) is supported by the positive Dehn twist \(\phi\) on the cotangent page. Do \(\phi^3,\phi^5,\ldots\) produce Ustilovsky's contact structures on \(S^{4m+1}\)? Can \(\phi\) and \(\phi^3\) be distinguished by Floer homology, perhaps after stabilization, and how does that compare with contact homology? More generally, what happens when each Dehn twist in an open-book factorization is replaced by an odd power?
  3. **Left-handed stabilization.** Attach a Weinstein handle to a Stein page along the boundary of a Lagrangian disk, obtaining a Lagrangian sphere, and compose the old monodromy with a left-handed Dehn twist about that sphere. The underlying closed manifold is unchanged. Is the resulting contact structure different and is it unfillable? The notes specifically propose \(S^5\) and one left-handed twist “in \(UT^*(S^2)\).”

  There is one necessary dimensional correction to that last phrase and to the informal use of \(T^*S^n\): the compact page is
  \[
  P_n=D^*S^n,
  \]
  the disk cotangent bundle, while \(UT^*S^n=\partial D^*S^n\) is its boundary and becomes the binding. The monodromy is compactly supported, hence the identity on a collar of the boundary.
