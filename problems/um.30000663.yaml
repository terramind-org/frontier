title: Unramified Quotients of Equivariant Endomorphisms
field: mathematics
tier: prose
statement: Let $X$ be a normal affine $\mathbb{C}$-variety with an effective action of an algebraic group $G$, let $\varphi:X\to X$ be a $G$-equivariant unramified endomorphism, and let $\psi:X//G\to X//G$ be induced. Must $\psi$ be unramified?
