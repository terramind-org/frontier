lean:
  module: FormalConjectures.ErdosProblems.«535»
  decl: Erdos535.erdos_535.variants.sunflower_strong
  statement: |-
    theorem erdos_535.variants.sunflower_strong {r : ℕ} (hr : 3 ≤ r) :
        ∃ c_r > (0 : ℝ),
          ∀ k : ℕ, ∀ A : Finset ℕ,
            AllBigOmega k A →
            NoConstantPairwiseGcdCoprimeSubsets r A →
            (A.card : ℝ) ≤ c_r ^ k
  context:
    - open Erdos535
    - open Erdos535.erdos_535
    - open Erdos535.erdos_535.variants
    - open ArithmeticFunction
    - open Filter Real
    - open scoped omega Omega
  definitions:
    - name: Erdos535.NoConstantPairwiseGcdCoprimeSubsets
      kind: def
      text: |-
        /-- No `r`-subset has constant pairwise GCD with coprime quotients. -/
        def NoConstantPairwiseGcdCoprimeSubsets (r : ℕ) (A : Finset ℕ) : Prop :=
          ∀ S ⊆ A, S.card = r →
            ¬ (∃ d, 0 < d ∧ (S : Set ℕ).Pairwise (fun a b => Nat.gcd a b = d) ∧
              ∀ a ∈ S, ∃ b, a = d * b ∧ Nat.gcd b d = 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/535.lean#L41
    - name: Erdos535.AllBigOmega
      kind: def
      text: |-
        /--
        All elements of `A` are positive and have exactly `k` prime factors,
        counted with multiplicity.

        Erdős [Er73] explains that Abbott pointed out the ordinary sunflower conjecture
        does not seem to suffice for Problem 535; the corrected stronger auxiliary
        statement uses $Ω$, not $ω$.
        -/
        def AllBigOmega (k : ℕ) (A : Finset ℕ) : Prop :=
          ∀ a ∈ A, 1 ≤ a ∧ Ω a = k
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/535.lean#L47
