title: Exponential Frames for Measurable Sets
field: mathematics
tier: prose
statement: Does there exist a subset $\Gamma\subset\mathbb{R}$ and $\eta$ in a Hilbert space $H$ such that the $\Gamma$-translates of $\eta$ form a frame, or even a tight frame? Equivalently, does $L^2(A)$ admit a frame of exponentials?
