title: Iterated differential signatures as a quotient tower
field: mathematics
tier: prose
statement: |-
  **AIM Problem 3.4 (Invariants).** “What can we say about the signature of the signature of a curve?”

  The workshop schedule places talks by Peter Olver and Irina Kogan on the same day, and the participant compilation records Olver's interest in differential-invariant signatures; this supports the reconstructed setting without identifying an author for the problem.

  The following reconstruction is therefore used.

  Let \(G\subset \operatorname{PGL}_3(\mathbb C)\) be a positive-dimensional closed algebraic group acting rationally on the affine plane. Let
  \[
  I=(K_1,K_2)
  \]
  be a rational classifying pair of differential invariants for the prolonged \(G\)-action. For a suitable irreducible plane curve \(X\), restriction gives the rational signature map
  \[
  \sigma_X=(K_1|_X,K_2|_X):X\dashrightarrow \mathbb A^2,
  \]
  and the Zariski closure
  \[
  \mathcal S_I(X)=\overline{\sigma_X(X)}
  \]
  is its signature curve. The question asks what happens when the signature construction is applied again to \(\mathcal S_I(X)\).
