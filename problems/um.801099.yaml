title: "Henon Maps: Open Problems — Question 51"
field: mathematics
tier: prose
statement: |-
  Under what circumstance is it true that
  \[\log\operatorname{Norm}(\mathfrak{a}_n)=o(d^n) \]
  as $n\to \infty$?
  Under what circumstance does there exist an ideal $\mathfrak{b} \subset \mathcal{O}_{K, S}$ such
  that $\mathfrak{a}_n | \mathfrak{b}$ for infinitely many $n$? Note that, since $\mathfrak{a}_1 | \mathfrak{a}_n$
  for all $n$, $\mathfrak{b} =\mathfrak{a}_1$ is a
  reasonable candidate.
