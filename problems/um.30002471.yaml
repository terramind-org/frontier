title: Chromatic Uniqueness of Nonrepresentable Matroids
field: mathematics
tier: prose
statement: Does there exist a matroid whose chromatic polynomial is not the chromatic polynomial of any matroid representable over a field; does there exist a matroid not representable over any field that is chromatically unique; and how small can such a matroid be?
