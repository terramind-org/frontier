title: Foliations and Diffeomorphism Groups — Question 16
field: mathematics
tier: prose
statement: |-
  Let $\omega$ be a volume-form on $**S**^2$ and $\mathrm{Diff}_0(**S**^2, \mathrm{vol})$ be the group of volume-preserving diffeomorphisms of the 2-sphere that are in the same component as the identity map. The isomorphism type of the group $\mathrm{Diff}_0(**S**^2, \mathrm{vol})$ does not depend on the choice of $\omega$. Banyaga [banyaga1978structure] showed that $\mathrm{Diff}_0(**S**^2, \mathrm{vol})$ is a simple group. Ghys and Gambaudo [gambaudo2004commutators] showed that there are plenty of non-trivial quasimorphisms on the group $\mathrm{Diff}_0(**S**^2, \mathrm{vol})$, in particular this group is not uniformly perfect. The following question is posed by Burago, Ivanov, and Poltervoich [burago2008conjugation].

  - Is $\mathrm{Diff}_0(**S**^3, \mathrm{vol})$ uniformly perfect?

  - Does $\mathrm{Diff}_0(**S**^3, \mathrm{vol})$ admit any non-trivial quasimorphism?
