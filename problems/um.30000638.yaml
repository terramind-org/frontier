title: Volume Bounds for Symmetric Lattice Polytopes
field: mathematics
tier: prose
statement: If $P$ is a $0$-symmetric lattice polytope in $\mathbb{R}^n$, then one conjectures that $\operatorname{vol}(P)\geq(2^{n-1}/n!)(G(\operatorname{int}P)+1)$, where $G(\operatorname{int}P)$ is the number of interior lattice points of $P$.
