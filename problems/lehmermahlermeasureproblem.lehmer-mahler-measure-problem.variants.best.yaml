lean:
  module: FormalConjectures.Wikipedia.LehmerMahlerMeasureProblem
  decl: LehmerMahlerMeasureProblem.lehmer_mahler_measure_problem.variants.best
  statement: |-
    theorem lehmer_mahler_measure_problem.variants.best :
        mahlerMeasureZ lehmerPolynomial ≤ lehmerConstant
  context:
    - open LehmerMahlerMeasureProblem
    - open LehmerMahlerMeasureProblem.lehmer_mahler_measure_problem
    - open LehmerMahlerMeasureProblem.lehmer_mahler_measure_problem.variants
    - open Polynomial LehmerMahlerMeasureProblem
  definitions:
    - name: LehmerMahlerMeasureProblem.mahlerMeasureZ
      kind: def
      text: |-
        noncomputable def mahlerMeasureZ (f : ℤ[X]) : ℝ :=
          mahlerMeasure (f.map (algebraMap ℤ ℂ))
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/LehmerMahlerMeasureProblem.lean#L41
    - name: LehmerMahlerMeasureProblem.lehmerConstant
      kind: def
      text: |-
        /--
        **Lehmer's Mahler measure constant**: the infimum of $M(f)$ over all $f \in \mathbb{Z}[x]$ with
        $M(f) > 1$.
        -/
        @[optimization_constant "40a"]
        noncomputable def lehmerConstant : ℝ :=
          sInf {m | ∃ f : ℤ[X], 1 < mahlerMeasureZ f ∧ mahlerMeasureZ f = m}
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/LehmerMahlerMeasureProblem.lean#L44
    - name: LehmerMahlerMeasureProblem.lehmerPolynomial
      kind: def
      text: "noncomputable def lehmerPolynomial : ℤ[X] := X^10 + X^9 - X^7 - X^6 - X^5 - X^4 - X^3 + X + 1"
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/LehmerMahlerMeasureProblem.lean#L61
