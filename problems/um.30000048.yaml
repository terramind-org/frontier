title: Positive Characters of Simply Connected Groups
field: mathematics
tier: prose
statement: Let $G$ be a connected simply connected compact Lie group, and let $f$ be a virtual character such that $f(x)\in\mathbb R_{\geq0}$ for every $x\in G$ and $\langle f,1\rangle=1$. Must $f=\chi\overline{\chi}$ for an irreducible complex character $\chi$ of $G$?
