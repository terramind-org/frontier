title: Globality, Lee-cover volume, and mapping-torus resonance for lcs forms
field: mathematics
tier: prose
statement: |-
  **Question 1.36.** Given a c.s.s. is it global?

  There is the following result: a c.s.s. \(\Omega\) is global if and only if \(\omega\) is exact. Are there other conditions?

  Banyaga has constructed c.s.s. for which \(\Omega\) is non zero in the Lichnerowicz cohomology, but such examples seem few and far between.

  The acronym `c.s.s.` is the notes' abbreviation for a “(local) conformal symplectic structure”; the standard modern term and abbreviation are **locally conformally symplectic (lcs)**. The immediately preceding source text fixes the convention
  \[
  d\Omega=-\omega\wedge\Omega,
  \qquad d_\omega=d+\omega\wedge,
  \qquad d_\omega\Omega=0,
  \]
  where \(\omega\) is a closed Lee form. To avoid confusing the Lee form with a symplectic form, this report renames it \(\theta\).

  With this sign convention, if \(\theta=dh\), then
  \[
  d(e^h\Omega)=e^h(dh\wedge\Omega+d\Omega)=0. \]
  Thus the global symplectic representative is \(e^h\Omega\). Conversely, if \(\Omega=f\sigma\), where \(f>0\) and \(d\sigma=0\), then \(\theta=-d\log f\). This verifies the sign in the source's “if and only if” rather than silently importing the opposite convention common in some papers.
