title: Kourovka Notebook Problem 10.77
field: mathematics
tier: prose
statement: |-
  Suppose that $G$ is a periodic group containing
  an elementary abelian subgroup $R$ of order 4. Must $G$ be locally
  finite

  a) if $C_G(R)$ is finite?

  b) if the centralizer of every involution of
  $R$ in $G$ is a
  Chernikov group?

  *Remark of 1999:* P. V. Shumyatsky
  (*Quart. J. Math. Oxford (2)*, **49**, no. 196 (1998),
  491--499) gave a positive answer to the question a) in the case
  where $G$ is residually finite.
