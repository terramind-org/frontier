statement: Conjecture. Stabilisation under Cartesian Products. [Sc[n] g∩(Y ) =+∞]⇔[Sc[n+k] g⊕gk∩(Y × Xk) =+∞], where Xk = (Xk,gk) is a compact Riemannian manifold of dimension k and where W × Xk ⊃Y × Xk is endowed with the metric g⊕gk. Notice that the implication [Sc[n] g∩(Y ) =+∞]⇒[Sc[n+k] g⊕gk∩(Y × Xk) =+∞] is obvious for compact manifoldsXk without boundaryas well as for completenon-compactmanifoldswiththescalarcurvaturesbounded from below where the leading example isXk = Rk. Possibly, this remains true for compact manifoldswith boundary. The reverse implication [Sc[n+k] g⊕gk∩(Y × Xk) =+∞]⇒[Sc[n] g∩(Y ) =+∞], probably, fails to be true forn = 2 and, possibly, forn = 3, 4 but it is plausible forn≥5. Relaxing C2-Smoothness of ∂Vε to C1. The requirement for the existence metrics withSc > σ →∞on the boundaries of domainsVε ⊂W whichapproximate Y ⊂W intheabovedeﬁnitionof Sc[n] g∩(Y ) =+∞iscompoundedwiththenecessityoftheseboundaries to be isometrically embeddable to(W,g).67 This complication can be removed by applying to the NashKuipertheoremonisometric C1-embeddingsandallowing Vε tohave C1-smoothboundaries, yet withC2-smooth, rather than continuous, induced metrics, where it would be even more natural to admitcontinuous metrics on ∂Vε. However the extension of the inequality Sc ≥σ to continuous metrics is a non-trivial matter. 26 Manifolds with Small Balls. The deﬁnition of the scalar curvature in terms of the volumes of small balls in section 1 suggests the following. Say that ametric measure spaceX = (X,dist,vol ) where vol = volX is the measure onX, called herevolume, islocally volume-wise smaller than another such spaceX′= (X′,dist′,vol′) and write X ≺volX′ 67There is variety of obstructions to embeddablity of surfaces to 3-spaces (see a brief overview of basic examples in section 3.2.3 in [42]) but amazingly little is known forn≥3. 79 if allε-balls inX are smaller than theε-balls inX′, vol(Bx(ε)) <vol′(Bx′(ε)) for all x ∈X,x′∈X′and some continuous positive functio