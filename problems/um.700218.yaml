title: Kourovka Notebook Problem 4.7
field: mathematics
tier: prose
statement: |-
  (Well-known problem). For which ring epimorphisms
  $R \rightarrow Q$ is the corresponding group homomorphism $SL_n(R)
  \rightarrow SL_n(Q)$ an epimorphism (for a fixed $n \geq 2$)? In
  particular, for what rings $R$ does the equality $SL_n(R)=E_n(R)$
  hold?
