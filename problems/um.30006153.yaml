title: Robertson’s Surface Four-Flow Conjecture
field: mathematics
tier: prose
statement: Every $2$-edge-connected graph embedded in the projective plane with face-width at least $4$ has a nowhere-zero $4$-flow. More generally, for every surface $S$, does there exist a constant $r(S)$ such that every $2$-edge-connected graph embedded in $S$ with face-width at least $r(S)$ has a nowhere-zero $4$-flow?
