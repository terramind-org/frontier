title: Discrete First Cohomology of Totally Disconnected Groups
field: mathematics
tier: prose
statement: Let $G=\operatorname{Aut}_F(E)$, where $F$ has characteristic zero and $E/F$ has finite transcendence degree. Compute the discrete cohomology group $dH^1(G,E^\times)$.
