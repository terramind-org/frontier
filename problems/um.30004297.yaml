title: Bounded Weighted Integral Points on a Rank-One Elliptic Curve
field: mathematics
tier: prose
statement: For integer solutions $(x,y,z)$ with $|x|,|y|,|z|\leq B$ of $zy^2+yz^2=x^3-xz^2$, is the counting quantity $\sum r_0(z)$, where $r_0(z)=1$ if $z$ is a sum of two squares and $0$ otherwise, bounded as $B\to\infty$?
