title: A torsion and multiplication sieve for rational multisections
field: mathematics
tier: prose
statement: |-
  Let \(X/\mathbb C\) be a surface of general type. Then Lang's conjecture implies that there exists a constant \(N\), depending only on \(X\), such that if \(C\subseteq X\) is rational, then \(K_X\cdot C\leq N\).

  What happens if \(X\) is an elliptic surface? Is there a bound on \(K_X\cdot C\) as \(C\) varies through rational curves?
