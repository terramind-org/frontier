  definitions:
    - name: OeisA262403.primeCountTriangular
      kind: def
      text: |-
        /-- The number of primes not exceeding the $x$-th triangular number $\frac{x(x+1)}{2}$. -/
        def primeCountTriangular (x : ℕ) : ℕ :=
          Nat.primeCounting (Nat.triangular x)
