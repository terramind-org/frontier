title: A convex support-function obstruction for holomorphic curves in R x T^3
field: mathematics
tier: prose
statement: At the end of his talk, Hutchings mentioned that one could try to generalize the methods therein to compute the Embedded Contact Homology of \(S^1\times S^2\), torus bundles over \(S^1\), or unit cotangent bundles of surfaces of genus \(g>1\). It might also be interesting to try to further understand the holomorphic curves in \(\mathbb R\times T^3\) in terms of amoebas etc.
