title: Kirby Problem 4.97
field: mathematics
tier: prose
statement: |-
  Let $\lambda:=c^{2}_{1}/c_{2}$ be the Chern slope of a closed, almost complex 4–manifold X. What is the supremum of $\lambda as X$ ranges over the following families?

  (a) Symplectic $\Sigma_{g}–bundles$ over $\Sigma_{h}$, with g, $h \geq$ 2.

  (b) Holomorphic $\Sigma_{g}–bundles$ over $\Sigma_{h}$, with g, $h \geq$ 2.

  (c) Symplectic Lefschetz fibrations over $S^{2}$.

  (d) Holomorphic Lefschetz fibrations over $S^{2}$. (Here, the Lefschetz fibrations are assumed to have critical points.)
