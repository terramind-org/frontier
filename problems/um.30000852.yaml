title: Galois Actions on Moduli of General-Type Surfaces
field: mathematics
tier: prose
statement: For the absolute Galois group $\operatorname{Gal}(\overline{\mathbb Q}/\mathbb Q)$ acting on moduli spaces of minimal complex surfaces of general type, which topological invariants of a variety over $\overline{\mathbb Q}$ are preserved under Galois conjugation? Is the action on the union $\mathcal M$ of these moduli spaces faithful, and is it faithful on the rigid surfaces?
