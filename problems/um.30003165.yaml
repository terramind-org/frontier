id: um.30003165
title: Motives and Higher Chow Groups with Modulus
field: mathematics
tier: prose
statement: For motives with modulus, can the isomorphism $\operatorname{Hom}(M(Y,E),M(X,0)[-j])\cong CH^d(X\times(Y\setminus|E|),j)$, where $X$ is smooth, proper, equidimensional, and of dimension $d$, and $(Y,E)$ is a modulus pair, be generalized by replacing the zero divisor on $X$ with a nonzero divisor, possibly using higher Chow groups with modulus? For a curve $C$ with modulus $D$, can $i(M(C,D))\in D(\mathrm{MNST})$ be described explicitly as a complex of MNST objects?
