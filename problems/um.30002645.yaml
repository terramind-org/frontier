title: Nonsimple Deformation Varieties and Geometrically Isolated Cusps
field: mathematics
tier: prose
statement: Let $X$ be a $k$-cusped hyperbolic $3$-manifold. If the deformation variety of $X$ is not simple, then $X$ has a set of cusps strongly geometrically isolated from the rest.
