title: Research Problems in Function Theory — Problem 7.27
field: mathematics
tier: prose
statement: "For a domain $D$ in $\\mathbb{C}$, define \\[\\rho(x,y) = \\sup\\{|f(x)-f(y)| : x,y\\in D; f \\text{ analytic in }D; |f'|\\leq1\\text{ in }D\\}.\\] If $D$ is convex, then $\\rho(x,y) = |x-y|$, but not otherwise. Clearly $\\rho(x,y)\\leq L(x,y)$, the infimum of the lengths of paths in $G$ that join $x$ to $y$. What can be said about $\\rho$ for general $D$, in terms of the geometry of $D$? (L. A. Rubel)"
