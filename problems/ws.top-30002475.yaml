  \section{Nonsingularity and Limit Laws for Random Matrices}\label{30002475}
  {\small UnsolvedMath ID 30002475 · Probability}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $A(n,d)$ be the adjacency matrix of a uniformly random $d$-regular graph, where $d>2$. Is $A(n,d)$ nonsingular with probability tending to $1$ as $n\to\infty$? What are the limiting distributions of the permanent of a random $\{\pm1\}$-matrix and the determinant of a random symmetric $\{\pm1\}$-matrix?
  \par\smallskip\textit{Formulation references:} \sref{30002475}{1}, \sref{30002475}{2}.
  \subsection{Short English statement}
  Let $A(n,d)$ be the adjacency matrix of a uniformly random $d$-regular graph, where $d>2$. Is $A(n,d)$ nonsingular with probability tending to $1$ as $n\to\infty$? What are the limiting distributions of the permanent of a random $\{\pm1\}$-matrix and the determinant of a random symmetric $\{\pm1\}$-matrix?
