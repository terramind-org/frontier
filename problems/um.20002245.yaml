title: Divisorial accumulation for curves and locally dense rational points
field: mathematics
tier: prose
statement: |-
  Let \(K\) be a global field and \(v\) a place. Let \(X,Y\) be positive-dimensional irreducible projective varieties over \(K\), let \(f:X\dashrightarrow Y\) be a dominant rational map over \(K\), and let \(U\) be a nonempty \(K\)-defined Zariski open subset of the domain of \(f\). If \(X(K)\) is Zariski dense, then there is a nonzero effective Cartier divisor \(D\) on \(Y\), defined over \(K\), for which the local Weil function \(\lambda_{Y,D,v}\) is unbounded on
  \[
  f(U(K))\setminus \operatorname{Supp}(D).
  \]
  Equivalently, there are \(x_n\in U(K)\setminus f^{-1}(\operatorname{Supp}D)\) whose images approach \(\operatorname{Supp}(D)(K_v)\) \(v\)-adically.
