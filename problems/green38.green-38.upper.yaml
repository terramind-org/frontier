lean:
  module: FormalConjectures.GreensOpenProblems.«38»
  decl: Green38.green_38.upper
  statement: |-
    theorem green_38.upper :
        LargestAdmissibleCardinality ≤ᶠ[atTop] green_38.upper.answer ∧
        ∃ c : ℝ, 0 < c ∧ c < C₂ ∧ green_38.upper.answer =O[atTop] (fun n ↦ c ^ n)
  context:
    - open Green38
    - open Green38.green_38
    - open Filter Set
    - open scoped Pointwise
  definitions:
    - name: Green38.LargestAdmissibleCardinality
      kind: def
      text: |-
        /--
        The largest subset $A \subset \mathbb{F}_7^n$ for which $A - A$ intersects $\{-1, 0, 1\}^n$ only
        at $0$.
        -/
        noncomputable def LargestAdmissibleCardinality : ℕ → ℝ := fun n ↦
          (sSup (ValidCardinalities n) : ℕ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/GreensOpenProblems/38.lean#L69
    - name: Green38.C₂
      kind: def
      text: |-
        /-- The upper bound constant $C_2 \approx 3.3177$ from [La79]. -/
        noncomputable def C₂ : ℝ := (7 * Real.cos (Real.pi / 7)) / (1 + Real.cos (Real.pi / 7))
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/GreensOpenProblems/38.lean#L79
    - name: Green38.green_38.upper.answer
      kind: def
