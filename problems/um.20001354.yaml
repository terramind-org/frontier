title: Universal bounds and an exact uniformly recurrent family
field: mathematics
tier: prose
statement: |-
  **Growths functions of repetitive graphs.** A graph $\Gamma$ is called **repetitive** if for all $r>0$ there exists $d>0$ such that for all $x,y\in\Gamma$, there exists an isomorphic copy of $B_r(x)$ (the ball of radius $r$ centered at $x$) at distance less or equal to $d$ from $y$.

  Consider two kind of growths functions for $\Gamma$: pick $x_0\in\Gamma$ and define $f_{x_0}(n)=\#B_n(x_0)$ and $f(x)=\max\{f_x(n):x\in\Gamma\}$.

  What functions can be realized as growths functions of repetitive graphs?
