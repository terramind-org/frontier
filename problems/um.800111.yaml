title: Foliations and Diffeomorphism Groups — Question 52
field: mathematics
tier: prose
statement: |-
  Likewise, on these groups we may define the *flow length* as the word length for the set $\mathcal{S}$ of all time one map of flows, which generates $\mathrm{Homeo}_0(M)$ or $\mathrm{Diff}_0^\infty(M)$ since these groups are simple.
  This norm (or its asymptotic version) measures in some sense the dynamical complexity of a map, especially on surfaces where flows are considered to have ``simple" dynamics.
  The methods used in [bowden2022quasi] for finding elements with positive scl also yield positive stable flow length. Also note that an element which is conjugate to its inverse has vanishing scl.

  Can we find an element in $\mathrm{Homeo}_0(\Sigma_g)$ with vanishing scl and positive stable flow length? Does there exist such an element which is conjugate to its inverse?
