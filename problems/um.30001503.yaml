id: um.30001503
title: Asymptotic Counting in General Circle Packings
field: mathematics
tier: prose
statement: For a locally finite circle packing $P$ in the complex plane, do there exist a Borel measure $\omega_P$ and an exponent $\alpha$ such that, for every suitable bounded Borel set $E$, the number of circles meeting $E$ and having curvature less than $T$ is asymptotic to $\omega_P(E)T^\alpha$ as $T\to\infty$? What analogous results hold for circle packings beyond Apollonian packings?
