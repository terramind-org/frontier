  module: FormalConjectures.WrittenOnTheWallII.GraphConjecture96
  decl: WrittenOnTheWallII.GraphConjecture96.conjecture96
  statement: |-
    theorem conjecture96 (G : SimpleGraph α) (h : G.Connected) :
        let minDistEven := (Finset.univ.image (distEven G)).min' (by simp)
        let maxL := (Finset.univ.image (fun v => indepNeighborsCard G v)).max' (by simp)
        (G.indepNum : ℝ) ≤ 1 + (minDistEven : ℝ) * ((maxL : ℝ) - 1)
  context:
    - open WrittenOnTheWallII
    - open WrittenOnTheWallII.GraphConjecture96
    - open SimpleGraph
    - "variable {α : Type*} [Fintype α] [DecidableEq α] [Nontrivial α]"
  definitions: []
