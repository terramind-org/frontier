  definitions:
    - name: SteinerSystems.LargeSteinerSystemWitness
      kind: structure
      text: |-
        /--
        A constructive witness for a large Steiner system: concrete values of $n$, $k$, $t$
        satisfying $n > k > t > 5$, $t < 10$, $n < 200$, together with an explicit Steiner system.
        -/
        structure LargeSteinerSystemWitness where
          /-- The size of the ground set. -/
          n : ℕ
          /-- The block size. -/
          k : ℕ
          /-- The covering parameter. -/
          t : ℕ
          h_nk : n > k
          h_kt : k > t
          h_t_lower : t > 5
          h_t_upper : t < 10
          h_n_upper : n < 200
          /-- The explicit Steiner system. -/
          system : S(t, k, n)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/SteinerSystem.lean#L59
