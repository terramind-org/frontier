id: um.20001303
title: A polylogarithmic nonsymmetric MM* bound and exact simplex calculation
field: mathematics
tier: prose
statement: |-
  Let \(K\) be a symmetric convex body. There exists a linear operator \(T\) such that
  \[
  \int_{S^{n-1}}h_{TK}(\theta)\,d\sigma(\theta)\,
  \int_{S^{n-1}}h_{(TK)^\circ}(\theta)\,d\sigma(\theta)
  \le C\log n.
  \tag{AIM}
  \]
  What is the upper bound for the above quantity for nonsymmetric convex bodies \(K\)? (In this case we need to take \(T\) affine.)
