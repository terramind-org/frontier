title: Face Numbers and Volumes of Poisson Zero Cells
field: mathematics
tier: prose
statement: For the zero cell $Z_0$ of a Poisson hyperplane tessellation, determine the mean number $\mathbb E f_\ell(Z_0)$ of $\ell$-dimensional faces for $\ell\geq1$. For the zero cell of a Poisson–Voronoi mosaic, determine its unknown mean volume and face numbers.
