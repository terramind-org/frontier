title: Quadratic Schreier Growth for Torsion-Free Solvable Groups
field: mathematics
tier: prose
statement: Let $G$ be a finitely generated torsion-free solvable group. Prove that either $G$ is virtually abelian or every faithful $G$-set $X$ satisfies $\operatorname{vol}_{G,X}(n)\succeq n^2$.
