title: Open Problems and Questions about Geodesics — Question 29 ([Bur-Kni1991])
field: mathematics
tier: prose
statement: |-
  The simplest question of this type asks if a Riemannian plane satisfying Euclid's 5th postulate must be flat.
  Consider the plane $\mathbb{R}^2$ with a complete Riemannian metric. Assume that for every geodesic and for every point not on the geodesic there exists precisely one non-trivial geodesic that passes through the point and does not intersect the geodesic.
  This assumption implies that the metric has no conjugate points.

  *Must a metric satisfying this version of the parallel postulate be flat?*
