title: Kourovka Notebook Problem 17.94
field: mathematics
tier: prose
statement: |-
  (Well-known problem). Can the free product $Z*G$
  of the infinite cyclic group $Z$ and a nontrivial group $G$ be the
  normal closure of a single element?

  *Editors' comments*:
  the negation is also known as Kervaire's conjecture. It was proved for torsion-free groups (A. Klyachko, *Commun. Algebra*, **21**, no. 7 (1993), 2555--2575) and for residually finite groups (M. Gerstenhaber, O. S. Rothaus, *Proc. Nat. Acad.
  Sci. U.S.A.*, **48** (1962) 1531--1533).
