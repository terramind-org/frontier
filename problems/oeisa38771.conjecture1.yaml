lean:
  module: FormalConjectures.OEIS.«38771»
  decl: OeisA38771.conjecture1
  statement: |-
    theorem conjecture1 :
        let p_next_sq (n : ℕ) : ℝ := ((Nat.nth Nat.Prime n : ℝ)) ^ 2
        let seq (n : ℕ) : ℝ := (a n : ℝ) / p_next_sq n
        (liminf seq atTop = 1) ∧ (limsup seq atTop = 2)
  context:
    - open OeisA38771
    - open Filter Topology Real
  definitions:
    - name: OeisA38771.a
      kind: def
      text: |-
        /-- $a(n)$ is the smallest composite number $c$ such that $\textrm{primorial}(n) + c$ is prime. -/
        noncomputable def a (n : ℕ) : ℕ :=
          let Qn : ℕ := ∏ i ∈ Finset.range n, Nat.nth Nat.Prime i
          let is_composite (c : ℕ) : Prop := c > 1 ∧ ¬ c.Prime
          sInf { c : ℕ | is_composite c ∧ (Qn + c).Prime }
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/OEIS/38771.lean#L36
