id: oeisa38771.conjecture1
title: Smallest composite $c$ such that $\textrm{primorial}(n) + c$ is prime (conjecture1)
field: mathematics
tier: proof
statement: |-
  Conjecture:
  $\liminf_{n \to \infty} \frac{a(n)}{p_{n+1}^2} = 1 <$
  $\limsup_{n \to \infty} \frac{a(n)}{p_{n+1}^2} = 2$.
  - Charles R Greathouse IV and Thomas Ordowski, Apr 24 2015
