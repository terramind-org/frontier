title: Problem 5.16 — Determine the subalgebras of H ∗(Ig,K ), for K = Q and K = F2, generated by H 1(Ig,K ).
field: mathematics
tier: prose
statement: Determine the subalgebras of H ∗(Ig,K ), for K = Q and K = F2, generated by H 1(Ig,K ). Note that H ∗(Ig,K ) is a module over Sp(2 g,K ). When K = Q this problem has been solved in degree 2 by Hain [ Ha3] and degree 3 (up to one unknown piece) by Sakasai [ Sa]. Symplectic representation theory (over R) is used as a tool in these papers to greatly simplify computations. When K = F2, the seemingly basic facts one needs about representations are either false or they are beyond the current methods of modular representation theory. Thus computations become more complicated. Some progress in this case is given in [ BF a2], where direct geometric computations, evaluating cohomology classes on abelian cycles, shows that each of the images of σ∗:H 2(B3, F2)→H 2(Ig, F2) (σ|Kg )∗:H 2(B2, F2)→H 2(Kg, F2) has dimension at least O(g4).
