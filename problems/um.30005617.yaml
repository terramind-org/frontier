title: Curved-Waveguide Simplicity and Surface-Curvature Optimization
field: mathematics
tier: prose
statement: For soft or hard-wall curved waveguides, determine whether every discrete eigenvalue above the ground state is simple. Separately, among connected compact smooth surfaces $\Sigma\subset\mathbb R^3$ of fixed area and genus $g\geq 1$, minimize $H_\Sigma=\|k_1-k_2\|_\infty$ and characterize minimizers.
