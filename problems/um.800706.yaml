title: Open Problems on Central Simple Algebras — Problem 16
field: mathematics
tier: prose
statement: |-
  Compute the essential dimension and the essential $p$-dimension of
  $\operatorname{PGL}_{n}$.
  In particular:

  - Compute $\mathrm{ed}_F(\operatorname{PGL}_4)$ when $\operatorname{char} F=2$.

  - Compute $\mathrm{ed}_F(\operatorname{PGL}_5)$.
