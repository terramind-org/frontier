title: Taylor–Wiles Deformation Maps to Augmented Hecke Algebras
field: mathematics
tier: prose
statement: Does there exist an $\mathcal O[\Delta_Q]$-algebra homomorphism from $R_{S\cup Q}$ to the $Q$-augmented Hecke algebra $\mathbb T_{S\cup Q,Q\text{-aug}}(K_0(Q)/K_1(Q))$ localized at the maximal ideal $\mathfrak m_{\bar\rho}$ determined by the residual representation $\bar\rho$, carrying the characteristic polynomial of $\rho_{S\cup Q}(\operatorname{Fr}_v)$ to $P_v(X)$ for every $v\notin S\cup Q$?
