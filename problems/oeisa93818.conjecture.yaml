  module: FormalConjectures.OEIS.«93818»
  decl: OeisA93818.conjecture
  statement: "theorem conjecture (p : ℕ) (hp : p.Prime) (hp_odd : p ≠ 2) : ∃ n > 0, a n = p"
  context:
