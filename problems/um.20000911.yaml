title: Constructive Beck-Fiala status and an exact pseudoforest incidence theorem
field: mathematics
tier: prose
statement: Given a set system \((V,\mathcal S)\) with \(V=[n]\), \(\mathcal S=S_1,\ldots,S_m\). Each \(i\in V\) occurs in at most \(t\) sets from \(\mathcal S\). Then there is a coloring to the elements of \(V\) achieving a discrepancy of \(O(\sqrt t)\). Komlós conjecture implies this by treating the incidence vector of each \(i\in V\) as a vector and scaling it down by \(\sqrt t\).
