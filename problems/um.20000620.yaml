title: Index tests and quantitative boundary-root pushing for zero-free Mergelyan approximation
field: mathematics
tier: prose
statement: |-
  If \(\mathbb C\setminus K\) is connected and \(f\in A(K)\) has no zeros in \(K^\circ\), must \(f\) be a uniform limit on \(K\) of polynomials having no zeros on \(K\)?

  The live page was checked on 2026-07-28. It attributes the problem to P. Gauthier and reads:

  The phrase “Let be \(K\) be” is a source typo; the intended opening is “Let \(K\subset\mathbb C\) be compact.” The page does not specify a topology for \(p_n\to f\). The intended meaning is **uniform convergence on \(K\)**:

  \[
  \|p_n-f\|_K:=\max_{z\in K}|p_n(z)-f(z)|\longrightarrow0. \]

  This reconstruction is verified by the precise formulations in Andersson, Gauthier--Knese, Khrushchev, and Danielyan. It is also confirmed internally by adjacent AIM Conjecture 9.2, which uses \(\|\cdot\|_{\infty,K}\) and says that Andersson proved its equivalence to Problem 9.1.

  \[
  A(K)=C(K)\cap\mathcal O(K^\circ). \]

