lean:
  module: FormalConjectures.ErdosProblems.«789»
  decl: Erdos789.erdos_789.variants.sq_isBigO
  statement: |-
    theorem erdos_789.variants.sq_isBigO :
        (fun n : ℕ ↦ √n) =O[atTop] fun n ↦ (subsetSumThreshold n : ℝ)
  context:
    - open Erdos789
    - open Erdos789.erdos_789
    - open Erdos789.erdos_789.variants
    - open Filter
    - open scoped Asymptotics Finset
  definitions:
    - name: Erdos789.subsetSumThreshold
      kind: def
      text: |-
        /-- The subset sum threshold $h(n)$, for each positive $n$, is the maximal separating
        cardinality of subset sums for $n$. -/
        noncomputable def subsetSumThreshold (n : ℕ): ℕ :=
          sSup { m | IsSubsetSumSeparatingCard n m }
