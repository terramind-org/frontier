title: Origami, Triangle-Area, and Circle-Packing Rigidity Problems
field: mathematics
tier: prose
statement: Can the standard origami model of a hyperbolic paraboloid be realized with straight creases and developable faces isometric to plane faces, or must the paper stretch? For a partition of the unit square into triangles, what relation among their signed areas exists besides their sum being one? Is every doubly periodic hexagonal-lattice circle packing with prescribed neighboring inversive distances rigid?
