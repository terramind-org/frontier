title: Virtual-knot problem 2 — Flat Virtuals
field: mathematics
tier: prose
statement: |-
  Flat Virtuals: Flat virtual knots, also known as virtual
  strings , are difficult to classify. Find new
  combinatorial invariants of flat virtual knots.

  We would like to know more about the flat biquandle algebra. This
  algebra is isomorphic to the Weyl algebra and has no
  (non-trivial) finite dimensional representations. An example that
  goes beyond the usual restrictions is the (very simple) affine
  biquandle used in to construct the Affine Index
  polynomial invariant of virtual knots. One can make small examples
  of the flat biquandle algebra, that detect some flat linking beyond
  mod $2$ linking numbers, but the absence of other finite dimensional
  representations presents a problem.
