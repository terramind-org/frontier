title: Algebraic Groups with Large Cayley Degree
field: mathematics
tier: prose
statement: For a connected reductive algebraic group $G$, let $\operatorname{Cay}(G)$ be the minimum degree of a dominant $G$-equivariant rational map $G\dashrightarrow\operatorname{Lie}(G)$. Does there exist an algebraic group $G$ with $\operatorname{Cay}(G)>2$? Does there exist a simple algebraic group with this property?
