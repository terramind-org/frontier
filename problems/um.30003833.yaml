title: Inverse-Galois and Decidability Problems for Profinite Groups
field: mathematics
tier: prose
statement: Let $G$ be a finite group and let $C_1,\ldots,C_{m(G)+r}$ be conjugacy classes of cyclic subgroups that generate $G$. Is there a tamely ramified extension $L/\mathbb Q$ with Galois group $G$ and inertia groups $C_1,\ldots,C_{m(G)+r}$? Can every finite $p$-group occur as a regular Galois group over $\mathbb Q(t)$? For $g\geq2$, is the profinite or pro-$p$ completion of the surface group $\Sigma_g$ an absolute Galois group in the corresponding characteristic? Does every decidable projective profinite group have only decidable open subgroups?
