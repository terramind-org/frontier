title: Boundary-Intersection Vanishing on Abelian-Variety Moduli
field: mathematics
tier: prose
statement: Let $\mathcal A_g$ be a toroidal compactification of the moduli space of principally polarized abelian varieties, let $G=g(g+1)/2$, and let $a_N$ be the intersection number of the Hodge class and boundary divisor. Must $a_N$ vanish unless $G-N=k(k+1)/2$ for some $k\leq g$? Does the same vanishing pattern hold for other reasonable toroidal compactifications?
