title: Quantitative Complexity of Homotopy Representatives and Homotopies
field: mathematics
tier: prose
statement: |-
  For finite simply connected piecewise Riemannian simplicial complexes, or compact Riemannian manifolds, how can one estimate the least geometric complexity of a representative of a homotopy class from its algebraic size? If two maps are homotopic, how does the least complexity of a homotopy depend on the complexities of the maps? Is scalability an $\mathbb R$-homotopy invariant? Is a space $Y$ scalable exactly when its cohomology algebra admits a differential-graded-algebra embedding

  $$H^*(Y;\mathbb R)\hookrightarrow\bigwedge^*\mathbb R^N$$

  for some $N$?
