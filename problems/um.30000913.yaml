title: Lattices and Covolumes in Davis-Complex Automorphism Groups
field: mathematics
tier: prose
statement: Let $X$ be a Davis complex and $G=\operatorname{Aut}(X)$, with lattices defined as discrete subgroups $\Gamma<G$ of finite covolume $\mu(\Gamma\backslash G)$. Does $G$ admit uniform or nonuniform lattices, and how can they be constructed? What is the set of covolumes $\mu(\Gamma\backslash G)$; in particular, is it discrete?
