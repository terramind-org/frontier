title: Exact norm of the CAR generator matrix
field: mathematics
tier: prose
statement: |-
  To prove the existence of an embedding \(\Gamma_{q,n}\to\mathcal R^\omega\), one uses Speicher's central limit theorem. In this procedure, is it possible to find explicitly uniformly bounded matrices whose mixed moments approach those of \(q\)-Gaussians? More precisely, let \(c_{i,j}\) be unitary generators of the CAR algebra (or \(-1\)-Gaussians); are the matrices
  \[
  \frac1{\sqrt n}[c_{i,j}]_{i,j\leq n}
  \]
  uniformly bounded?
