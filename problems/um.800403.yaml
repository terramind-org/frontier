title: Open Problems in Arithmetic Dynamics — Conjecture 26 (Integrality Conjecture)
field: mathematics
tier: prose
statement: |-
  \textup{(Bellon--Viallet, [MR1704282], 1999)} Let
  $f:\mathbb{P}^N\dashrightarrow\mathbb{P}^N$ be a dominant rational map. Then the dynamical
  degree $\delta_f$ of $f$ is an algebraic integer, i.e., $\delta_f$ is the root
  of a monic polynomial having integer coefficients.
