lean:
  module: FormalConjectures.ErdosProblems.«766»
  decl: Erdos766.erdos_766.parts.i
  statement: |-
    theorem erdos_766.parts.i :
        ∀ k l : ℕ, k < l → l ≤ k ^ 2 / 4 →
          (fun n ↦ (forcingNumber n k l : ℝ)) =Θ[atTop] erdos_766.parts.i.answer k l
  context:
    - open Erdos766
    - open Erdos766.erdos_766
    - open Erdos766.erdos_766.parts
    - open Filter
    - open scoped SimpleGraph
  definitions:
    - name: Erdos766.forcingNumber
      kind: def
      text: |-
        /-- $f(n;k,l)$ in the sense of [Er64c], where it is called $f_1(n;k,l)$: the least $m$ such that
        every graph with $n$ vertices and $m$ edges contains at least one graph with $k$ vertices and
        $l$ edges as a (not necessarily induced) subgraph. There is no graph with $n$ vertices and more
        than $\binom{n}{2}$ edges, so the set is nonempty. -/
        noncomputable def forcingNumber (n k l : ℕ) : ℕ :=
          sInf {m : ℕ | ∀ G : SimpleGraph (Fin n), G.edgeSet.ncard = m →
            ∃ H : SimpleGraph (Fin k), H.edgeSet.ncard = l ∧ H ⊑ G}
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/766.lean#L37
    - name: Erdos766.erdos_766.parts.i.answer
      kind: def
      text: "def erdos_766.parts.i.answer : ℕ → ℕ → ℕ → ℝ := sorry"
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/766.lean#L91
