title: Set-Sized Models of Initial Surreal Substructures
field: mathematics
tier: prose
statement: If a theory extending the theory of nontrivial densely ordered abelian groups has every model isomorphic to an initial subgroup of $\mathbf{No}$, must it be the theory of divisible ordered abelian groups? Analogously, if every model of an ordered-field theory is isomorphic to an initial subfield of $\mathbf{No}$, must it be the theory of real-closed ordered fields? Can the only-if directions be proved in NBG using set-sized universes?
