lean:
  module: FormalConjectures.ErdosProblems.«1180»
  decl: Erdos1180.erdos_1180.variants.optimal
  statement: |-
    theorem erdos_1180.variants.optimal : ∀ δ : ℝ, 0 < δ →
        ∀ᶠ ε : ℝ in nhdsWithin 0 (Set.Ioi 0), ∃ P : ℕ, ∀ p : ℕ, P ≤ p → p.Prime → ∀ a : ZMod p,
          ∃ s : Multiset ℕ, (s.card : ℝ) ≤ ε⁻¹ ^ (1 + δ) ∧ Represents ε p a s
  context:
    - open Erdos1180
    - open Erdos1180.erdos_1180
    - open Erdos1180.erdos_1180.variants
    - open Filter
  definitions:
    - name: Erdos1180.Represents
      kind: def
      text: |-
        /--
        `Represents ε p a s` says that the multiset `s` of denominators `n` with `1 ≤ n ≤ p^ε` and
        `n` coprime to `p` has `∑ n⁻¹ = a` in `ZMod p`.
        -/
        def Represents (ε : ℝ) (p : ℕ) (a : ZMod p) (s : Multiset ℕ) : Prop :=
          (∀ n ∈ s, 1 ≤ n ∧ (n : ℝ) ≤ (p : ℝ) ^ ε ∧ n.Coprime p) ∧
            (s.map fun n : ℕ ↦ (n : ZMod p)⁻¹).sum = a
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/1180.lean#L40
