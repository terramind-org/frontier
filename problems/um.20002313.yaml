id: um.20002313
title: A finite-support obstruction to definable isomorphisms with the complex field
field: mathematics
tier: prose
statement: |-
  **Question 11.** Let \(\mathcal A=HF(\mathbb C)\), and suppose \(K\cong\mathbb C\) is \(\Sigma\)-definable in \(\mathcal A\). Is there a \(\Sigma\)-definable isomorphism?

  The answer is yes if we replace \(\mathbb C\) by \(\mathbb R\) and both \((K,\oplus,\odot)\cong\mathbb R\) and \(K\subseteq\mathbb R\) hold. It is open if merely \(K\subseteq\mathbb R^2\).
