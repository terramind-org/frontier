title: Ordinary and Symbolic Powers of Point-Set Ideals
field: mathematics
tier: prose
statement: Which Cohen–Macaulay point sets $X$ in $\mathbb P^1\times\mathbb P^1$, equivalently line unions in $\mathbb P^3$, satisfy $I(X)^3=I(X)^{(3)}$; and for every positive integer $t$, does there exist an ideal $I_t$ with $I_t^m=I_t^{(m)}$ for $m\leq\operatorname{bight}(I_t)+t-1$ but $I_t^m\ne I_t^{(m)}$ when $m=\operatorname{bight}(I_t)+t$?
