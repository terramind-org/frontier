title: Modular Construction of Prescribed $\mathbb Z_p$-Extensions
field: mathematics
tier: prose
statement: Let $F_\infty/F$ be the cyclotomic $\mathbb Z_p$-extension. Can modular methods construct a $\mathbb Z_p$-extension $L_Q/F_\infty$ that is Galois over $F$, on which $\operatorname{Gal}(F_\infty/F)$ acts cyclotomically, and that is unramified outside prescribed auxiliary primes $Q$ but ramified at $Q$?
