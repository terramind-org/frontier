title: Radial Julia Dimensions of Exponential Maps
field: mathematics
tier: prose
statement: For $f_\lambda(z)=\lambda e^z$ with hyperbolic parameter $\lambda$, determine the supremum of $\dim_H(J_r(f_\lambda))$ over all hyperbolic parameters, and determine whether the function $\lambda\mapsto\dim_H(J_r(f_\lambda))$ is increasing on $(0,1/e)$.
