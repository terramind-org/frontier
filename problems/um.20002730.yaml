title: The compact obstruction to a relative conductor
field: mathematics
tier: prose
statement: |-
  **Relative conductor of \(p\)-adic groups.** Let \(H\leq G\) be groups over \(\mathbb Q_p\), \(\pi\) be an admissible representation of \(G\), and \(K_G\) be a maximal compact of \(G\). Define
  \[
  K_H(p^n):=\{g\in K_G\mid (g\bmod p^n)\in H\}.
  \]
  Does \(\pi\) have a non-zero vector fixed by \(K_H(p^n)\) for some \(n\)? If so, what is the smallest such \(n\)?
