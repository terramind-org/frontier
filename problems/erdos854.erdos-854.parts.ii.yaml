lean:
  module: FormalConjectures.ErdosProblems.«854»
  decl: Erdos854.erdos_854.parts.ii
  statement: |-
    theorem erdos_854.parts.ii :
        ∃ c > (0 : ℝ), ∀ᶠ k : ℕ in atTop,
          c * (maxGap (kthPrimorial k) : ℝ) ≤ ((gapSet (kthPrimorial k)).card : ℝ)
  context:
    - open Erdos854
    - open Erdos854.erdos_854
    - open Erdos854.erdos_854.parts
    - open Filter Asymptotics
  definitions:
    - name: Erdos854.kthPrimorial
      kind: def
      text: |-
        /-- The $k$th primorial $n_k = p_1 \cdots p_k$, the product of the first $k$ primes
        (`Nat.nth Nat.Prime i` is the $(i+1)$st prime, counting from $i = 0$). In particular $n_0 = 1$. -/
        noncomputable def kthPrimorial (k : ℕ) : ℕ :=
          ∏ i ∈ Finset.range k, Nat.nth Nat.Prime i
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/854.lean#L44
    - name: Erdos854.gapSet
      kind: def
      text: |-
        /-- `gapSet m` is the set of values of $a_{i+1} - a_i$, where $a_1 < a_2 < \cdots$ are the
        integers in $[1, m)$ coprime to $m$ (for $m > 1$). It is the set of entries of `Erdos235.gaps m`,
        the differences of consecutive entries of the sorted list of integers below `m` coprime to `m`. -/
        def gapSet (m : ℕ) : Finset ℕ :=
          (Erdos235.gaps m).toFinset
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/854.lean#L49
    - name: Erdos854.maxGap
      kind: def
      text: |-
        /-- `maxGap m` is $\max_i (a_{i+1} - a_i)$ for the integers in $[1, m)$ coprime to `m`, and `0`
        if there are no gaps. For $m = n_k$ with $k\geq 2$ this is the Jacobsthal function of $m$. -/
        def maxGap (m : ℕ) : ℕ :=
          (gapSet m).sup id
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/854.lean#L55
