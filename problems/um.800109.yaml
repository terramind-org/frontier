title: Foliations and Diffeomorphism Groups — Question 50
field: mathematics
tier: prose
statement: |-
  A theorem of Michel Herman says that in the group of $\mathrm{Diff}_+^\infty(**S**^1)$, every element with diophantine rotation number is $C^\infty$ conjugate to a rotation. Using that the rotation number is a continuous function, it follows easily that every element is the product of a rotation and of a conjugate to a rotation. In particular, every element is the product of two commutators. However, it is not known if one commutator is enough.

  Is every element in $\mathrm{Diff}_+^\infty(**S**^1)$ a commutator?
