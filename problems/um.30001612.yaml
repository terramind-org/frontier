title: Polynomial Density on Crescent Domains
field: mathematics
tier: prose
statement: Let $\Omega$ be a crescent domain with bounded complementary component $G$ and unbounded complementary component $\Omega_\infty$, put $\delta(z)=\operatorname{dist}(z,\Omega_\infty)$, and let $\omega$ be harmonic measure on $\partial G$. If $$\int_{\partial G}\log\delta(z)\,d\omega(z)=-\infty,$$ must $H^p(\Omega,dA)=L_a^p(\Omega,dA)$ hold for every $1\leq p<\infty$?
