id: oeisa179524.conjecture3
title: Central binomial sum $a(n) = \sum_{k=0}^n (-4)^k \binom{n}{k}^2 \binom{n-k}{k}^2$ (conjecture3)
field: mathematics
tier: proof
statement: |-
  If $p$ is a prime with $p \equiv 11, 13, 17, 19 \pmod{20}$,
  then $\sum_{k=0}^{p-1} a(k) \equiv 0 \pmod{p^2}$.
  - _Zhi-Wei Sun_, Jul 01 2010
