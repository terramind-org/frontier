id: um.20000823
title: Linear-span lifting and exact plane-curve component dimensions
field: mathematics
tier: prose
statement: |-
  Fix integers \(d,g,n\).  Find a useful, preferably sharp, lower bound for
  the dimensions of irreducible components of
  \(\operatorname{Hilb}_{d,g}(\mathbf P^n)\), the Hilbert scheme of curves with
  Hilbert polynomial \(dm+1-g\).  The usual expected-dimension bounds are
  \(4d\) in \(\mathbf P^3\) and \(5d+1-g\) in \(\mathbf P^4\); the latter is
  uninformative for fixed \(d\) and large \(g\).
