title: Warped-Cone Rigidity Without Property FSL
field: mathematics
tier: prose
statement: In coarse geometry, let $\mathcal{O}_\Gamma Y$ denote the warped cone associated to a measure-preserving action of a finitely generated group $\Gamma$ on a compact metric space $Y$. Can the technical condition $\mathrm{FSL}$ (finite subset of lengths / translation-like control) be removed from the warped-cone quasi-isometric rigidity theorem (Vigolo)?
