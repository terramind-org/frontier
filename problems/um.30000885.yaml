title: Virtual Cohomological Dimension of Unit Groups
field: mathematics
tier: prose
statement: Let $\mathbb{Q}G=A_1\times\cdots\times A_n$ for a finite group $G$, let $R_i$ be an order in $A_i$, and let $\operatorname{vcd}(R_i^1)$ be the virtual cohomological dimension of its reduced-norm-one unit group. Classifications are known when $\operatorname{vcd}(R_i^1)\leq2$ for every $i$. Can they be extended to $\operatorname{vcd}(R_i^1)\leq3$, yielding a corresponding classification of $U(\mathbb{Z}G)$?
