title: Kourovka Notebook Problem 12.20
field: mathematics
tier: prose
statement: |-
  (Well-known problem). Is
  R. Thompson's group $$F=\left< x_0, x_1,\ldots \mid
  x_n^{x_i}= x_{n+1}, \; \; i < n,\;\;n=1, 2, \ldots \right>
  =$$
  $$= \left< x_0,\ldots ,x_4\mid x_1^{x_0}=x_2, \; \;
  x_2^{x_0}=x_3, \; \; x_2^{x_1}=x_3, \; \; x_3^{x_1}=x_4, \; \;
  x_3^{x_2}=x_4\right> $$
  amenable?
