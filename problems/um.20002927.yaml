title: A decorated cocore criterion for trivial bypasses
field: mathematics
tier: prose
statement: |-
  **Can we characterize trivial bypasses in terms of the belt sphere of \(n\)-handle and the attaching sphere of the \(n+1\) handle?**

  Let \((M^{2n+1},\xi)\) have Weinstein-convex boundary \(\Sigma^{2n}=R_+\cup\Gamma\cup R_-\). Attach a contact \(n\)-handle \(H_n\), followed by a contact \((n+1)\)-handle \(H_{n+1}\), in Honda--Huang bypass position. Which extra contact-geometric decoration on the smooth pair \((B^n,A^n)\) detects that the bypass data is of type (TB1) or (TB2), and hence that the resulting layer is vertically invariant relative to the boundary? Does the unadorned one-point intersection suffice?
