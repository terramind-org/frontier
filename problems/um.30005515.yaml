title: Four Modular Isomorphism Problems
field: mathematics
tier: prose
statement: Determine whether the Modular Isomorphism Problem has a positive answer for groups of odd order and for groups of nilpotency class $2$; whether there are $p$-groups $G,H$ and a characteristic-$p$ field $k$ with $\mathbb F_pG\not\cong\mathbb F_pH$ but $kG\cong kH$; and which invariants of $G$ are determined by $kG$.
