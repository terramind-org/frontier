title: Diagonal resolutions versus homotopy-colimit depth
field: mathematics
tier: prose
statement: |-
  There are two known ways to bound Rouquier dimension of a category: (1)
  bound length of a resolution of a diagonal; (2) the minimal depth of a
  presentation of \(\mathcal C\) as hocolim (cats with Rouquier dimension
  \(Q\)). Meaning if \(F:I^{\leq}\to Cat\) [is a] diagram with
  \(Rdim F(i)=0\), then \(Rdim(hocolim F i)\leq depth(I)\). Can (1) be used
  to bound (2) or vice-versa?
