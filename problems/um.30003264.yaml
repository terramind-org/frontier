title: Third Homology and Pre-Bloch Groups of $S$-Arithmetic $\operatorname{SL}_2$
field: mathematics
tier: prose
statement: |-
  For a global field $F$ and every sufficiently large finite set $S$ of places, is the natural map

  $$\pi_S:\ker\!\left(H_3(\operatorname{SL}_2(\mathcal O_S),\mathbb Z[1/2])\to H_3(\operatorname{SL}_2(F),\mathbb Z[1/2])\right)\longrightarrow\bigoplus_{v\in S\setminus S_\infty}\mathcal P(k(v))\otimes\mathbb Z[1/2]$$

  an isomorphism?
