statement: |-
  \section*{Average sensitivity of polynomial threshold functions}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must every Boolean threshold of a real multilinear degree-at-most-d polynomial on the uniform n-cube, with $sign(0)=1$ and $1\leq d\leq n$, have total influence at most $8d\surd n$?
  \subsection{Short English statement}
  Must every Boolean threshold of a real multilinear degree-at-most-d polynomial on the uniform n-cube, with $sign(0)=1$ and $1\leq d\leq n$, have total influence at most $8d\surd n$?
