title: "Henon Maps: Open Problems — Question 31"
field: mathematics
tier: prose
statement: |-
  Let $f_1$, $f_2$ be two generalized H\'enon maps. Under which circumstances is it possible
  that some local unstable slice of $f_1$ (i.e., a set of the form $K^+\cap U$, where $U$ is a relatively
  open subset of an unstable manifold)
  is biholomorphically equivalent to an unstable slice of $f_2$?
