title: Geometric Langlands Duals of Quantized Theta Sheaves
field: mathematics
tier: prose
statement: Let $M$ be a quantization whose geometric theta series is a distinguished $D$-module on $\operatorname{Bun}_G$. Is its geometric-Langlands dual a sheaf on the moduli space of $\check G$-local systems arising from a coherent quantization of $\check M$?
