title: Hole Projections and Hyperbolicity of Surface Graphs
field: mathematics
tier: prose
statement: Let $G(S)$ be a graph on a surface $S$ with a mapping-class-group action, and call essential subsurfaces on which subsurface projection is everywhere defined holes. If every pair of holes intersects, must $G(S)$ be Gromov hyperbolic? Is the thresholded sum $\sum_X' d_X(\alpha,\beta)$ over all holes uniformly multiplicatively and additively comparable with the distance between $\alpha$ and $\beta$ in $G(S)$?
