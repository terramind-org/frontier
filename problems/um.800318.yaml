title: Complexity in Enumerative Combinatorics — Conjecture 2
field: mathematics
tier: prose
statement: |-
  Let $a_n$ be the number of unlabeled plane
  triangulations with $n$ vertices, and let $b_n$ be the number of
  $3$-connected planar graphs with $n$ vertices.
  Then $\{a_n\}$ and $\{b_n\}$ can be computed
  in \mathrm{poly}$(n)$ time.
