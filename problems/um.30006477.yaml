title: Asymptotic Density for Quaternary Quadratic Forms
field: mathematics
tier: prose
statement: For a quaternary quadratic form $Q$, choose the appropriate main term $M_T(r)$ and determine whether the normalized error in the count $\#\{x\in\mathbb{Z}^4\cap[-r,r]^4:Q(x)=0\}-M_T(r)$ has an asymptotic density as $r\to\infty$.
