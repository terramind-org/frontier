title: Quadratic Nil Algebras and Algebraic Division Algebras
field: mathematics
tier: prose
statement: Does there exist an infinite-dimensional quadratic nil algebra? More specifically, let $F$ be a field of characteristic $p>0$, let $R=F[t_0,t_1,\ldots\mid t_i^p=0]$, and put $\partial_i=\partial/\partial t_i$. Is the associative algebra generated by $V_1=\sum_{i\geq1}(\prod_{j=0}^{i-2}t_j^{p-1})\partial_i$ and $V_2=\sum_{i\geq2}(\prod_{j=1}^{i-2}t_j^{p-1})\partial_i$ nil? If $L$ is the Lie algebra generated by $V_1,V_2$, $U=U(L)$ is its universal enveloping algebra, $Z$ is the center of $U$, and $D=(Z\setminus\{0\})^{-1}U$, is $D$ an algebraic division algebra?
