title: Determination of Moduli Maps by Symplectic Monodromy
field: mathematics
tier: prose
statement: Let $X$ be a finite-type Riemann surface and let $\varphi:X\to\mathcal M_g$ be holomorphic, with induced symplectic monodromy $\rho'_\varphi:\pi_1(X)\to\operatorname{Mod}_g\to\operatorname{Sp}(2g,\mathbb Z)$. If two such maps $\varphi_1$ and $\varphi_2$ satisfy $\rho'_{\varphi_1}=\rho'_{\varphi_2}$, must $\varphi_1=\varphi_2$?
