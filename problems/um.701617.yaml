title: Kourovka Notebook Problem 19.69
field: mathematics
tier: prose
statement: |-
  (P. Wesolek).
  The acronym tdlc stands for totally disconnected and locally compact, and tdlcsc for tdlc and second countable. Let $\rm{Res}(G)$ denote the intersection of all open normal subgroups of a topological group $G$. The class of elementary tdlcsc groups is defined as the smallest class $\mathscr{E}$ of tdlcsc groups such that
  \begin{itemize}
  \item[(1)] $\mathscr{E}$ contains all second countable profinite groups and countable discrete groups;
  \item[(2)] $\mathscr{E}$ is closed under taking closed subgroups, Hausdorff quotients, directed unions of open subgroups, and group extensions.
  \end{itemize}
  This class admits a well-behaved, ordinal-valued decomposition rank $\xi$ defined recursively as follows: $\xi(\{1\}) = 1$, and if $G \in \mathscr{E}$ is a union of an increasing sequence $(O_i)$ of compactly generated open subgroups, then $\xi(G) = \sup_i \{\xi(\rm{Res}(O_i))\} + 1$.

  What is the supremum of the decomposition ranks of elementary tdlcsc groups? In particular, is it countable?
