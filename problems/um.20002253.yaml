title: Reversal obstructs a globally minimal higher Countryman line
field: mathematics
tier: prose
statement: A *Countryman line* is an uncountable linear ordering whose square is the union of countably many chains. In $\mathrm{ZFC} + \mathrm{CH}$ (and even under weaker hypotheses such as $\diamondsuit$), Countryman lines exist, and under $\mathrm{PFA}$ every two Countryman lines are isomorphic or reverse-isomorphic. Is it consistent with $\mathrm{ZFC} + \mathrm{CH}$ that there is a unique Countryman line up to isomorphism and reverse-isomorphism?
