title: "Henon Maps: Open Problems — Question 40"
field: mathematics
tier: prose
statement: |-
  Urech proved that $\deg(f^n)$ tends to infinity whenever it is unbounded, see [urech].
  His result was made stronger by Cantat and Xie in [CX]: there exists a universal function $\sigma\colon \mathbb{N}\to\mathbb{N}$
  such that $\limsup \sigma = \infty$ and $\deg(f^n) \ge \sigma(n)$.
  They raised the following weaker form of the previous problem.

  Suppose that $\lambda(f)=1$, and $\deg(f^n)$ is unbounded
  for some polynomial automorphism $f$ of $\mathbb{C}^d$.
  Does there exist $C>0$ such that $\deg(f^n) \ge Cn$?
