title: Lattice Gases and Antiferromagnetic Potts Models — Conjecture 1
field: physics
tier: prose
statement: |-
  For any countably infinite graph $G$ of maximum degree $\Delta$,
  the hard-core lattice gas on $G$ has a unique Gibbs measure whenever
  $0 \le w_x \le (1-\epsilon) \times$\break
  $(\Delta-1)^{\Delta-1}/(\Delta-2)^\Delta$
  $ [\sim e/\Delta$ for large $\Delta]$
  for all vertices $x$, for some $\epsilon > 0$.
  [Perhaps this is true even with $\epsilon = 0$.]
