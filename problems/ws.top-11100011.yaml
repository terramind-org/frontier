  \setcounter{section}{11100010}
  \section{Morava K- and E-theory 1 — Show that pi\_* L\_K(n) S\textasciicircum{}0 is finitely generated over the p-adics in each degree.}\label{11100011}
  {\small UnsolvedMath ID 11100011 · Topology}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For every prime $p$, positive chromatic height $n\ge1$, and integer degree $k$, must $\pi_kL_{K(n)}S^0$ be a finitely generated module over the $p$-adic integers? Here $L_{K(n)}$ is localization of the sphere spectrum at the height-$n$ Morava $K$-theory.
  \par\smallskip\textit{Formulation references:} \sref{11100011}{1}, \sref{11100011}{2}.
  \subsection{Short English statement}
  For every prime $p$, positive chromatic height $n\ge1$, and integer degree $k$, must $\pi_kL_{K(n)}S^0$ be a finitely generated module over the $p$-adic integers? Here $L_{K(n)}$ is localization of the sphere spectrum at the height-$n$ Morava $K$-theory.
