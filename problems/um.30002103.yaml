id: um.30002103
title: Leray–Hodge Filtrations and Chern Classes on Singular Varieties
field: mathematics
tier: prose
statement: |-
  For a singular complex projective variety $X$, is the Leray filtration on $H^n(X,\mathbb Z)$ a filtration by sub-mixed-Hodge structures, and does the image of the $p$th Chern class map

  $$K_0(X)\otimes\mathbb Q\to H^{2p}(X,\mathbb Q)$$

  equal

  $$\operatorname{Hom}_{\mathrm{MHS}}(\mathbb Z(-p),L^pH^{2p}(X,\mathbb Z))\otimes\mathbb Q?$$

  Equivalently, are these precisely the rational Hodge classes in the $p$th Leray step?
