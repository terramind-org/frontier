  % UnsolvedMath ID 93; source catalogue code GREEN-002
  \setcounter{section}{92}
  \section{Restricted Sumset Problem}\label{93}
  {\small\sffamily UnsolvedMath ID 93 · Combinatorics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For a finite set $S\subset\mathbb Z$, its \emph{restricted sumset} is
  \[
  S\widehat{+}S=\{s+t:s,t\in S,\ s\ne t\}.
  \]
  Thus the prohibition concerns sums of distinct elements only; a double $2s$ is permitted to belong to the ambient set. Throughout this statement $\log$ is the natural logarithm.
  \paragraph{Statement recorded in the supplied source.}
  Is there $n_0\in\mathbb N$ such that, for every integer $n\ge n_0$ and every set $A\subset\mathbb Z$ with $|A|=n$, there exists $S\subset A$ for which
  \[
  |S|\ge(\log n)^{100},\qquad (S\widehat{+}S)\cap A=\varnothing?
  \]
  Equivalently, must the largest subset sum-free with respect to $A$ have at least $(\log |A|)^{100}$ elements uniformly over all sufficiently large finite integer sets? \sref{93}{1}\sref{93}{2}
  \subsection{Short English statement}
  Can every sufficiently large finite set of integers provide a subset of size at least the hundredth power of its logarithmic size such that no sum of two distinct chosen elements belongs to the original set?
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:93:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, record 93 (GREEN-002). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:93:2}{S2}] Adrian Beker, \emph{The Erdős--Moser sum-free set problem via improved bounds for $k$-configurations}, arXiv:2501.10203v2, 2 October 2026, section 1, pp. 1--3: sum-free-with-respect-to-$A$ definition and explicit identification of Green's Problem 2. The catalogue specifies the target exponent $100$; the paper's proved lower bound in Theorem 1.2 has exponent $1+c$. \url{https://arxiv.org/pdf/2501.10203v2}.
  \item[\hypertarget{source:93:3}{S3}] Ben Green, \emph{100 Open Problems}, author manuscript with December 2025 updates, Problem 2, pp. 3--4. \url{https://people.maths.ox.ac.uk/greenbj/papers/open-problems.pdf}.
  \end{description}
  \label{end:93}
