title: Sharp Hilbert-Transform Bounds for UMD Spaces
field: mathematics
tier: prose
statement: For a UMD Banach space $X$, let $h_p(X)$ be the $L^p(X)$ operator norm of the Hilbert transform and let $m_p(X)$ be the UMD-$p$ constant. Determine the sharp dependence of $h_p(X)$ on $m_p(X)$; in particular, decide whether $h_p(X)$ and $m_p(X)$ are comparable up to universal linear factors.
