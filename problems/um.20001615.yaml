title: "Cantor Cayley spectrum: normalization audit and quotient-torus obstruction"
field: mathematics
tier: prose
statement: |-
  Is there an amenable group whose spectrum is a Cantor set?

  **Remark (Dudko).** For Grigorchuk's group $G$, the spectrum is a union of two intervals: $[-1,0]\cup[1/2,1]$; the question is whether there can be something a tad crazier.

  **Recovered isotropic question.** Does there exist an infinite finitely generated amenable group $G$ and a finite symmetric generating set $S$ such that $\sigma(M_S)$ is homeomorphic to the Cantor set?
