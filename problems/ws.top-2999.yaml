  \item[\hypertarget{source:statement:2}{S2}] R. İnanç Baykur, Robion C. Kirby and Daniel Ruberman (eds.), \emph{K3: A New Problem List in Low-Dimensional Topology}, Mathematical Surveys and Monographs 295, American Mathematical Society (2026), Problem 4.123, author preliminary version. \url{https://math.berkeley.edu/sites/default/files/surv-295-ruberman-watermarked-author-pdf.pdf}.
