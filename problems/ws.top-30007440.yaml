statement: |-
  \section*{Balanced L3 boundedness of the trilinear Hilbert transform}\label{30007440}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For Schwartz functions f1,f2,f3 on R, let $T(f1,f2,f3)(x)=pv$ integral f1(x+t)f2(x+2t)f3(x+3t) dt/t. Is $||T(f1,f2,f3)||_L1$ $<=$ C $product_j$ $||fj||_L3$ for one finite absolute C?
  \subsection{Short English statement}
  For Schwartz functions f1,f2,f3 on R, let $T(f1,f2,f3)(x)=pv$ integral f1(x+t)f2(x+2t)f3(x+3t) dt/t. Is $||T(f1,f2,f3)||_L1$ $<=$ C $product_j$ $||fj||_L3$ for one finite absolute C?
