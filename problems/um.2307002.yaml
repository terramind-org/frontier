title: Research Problems in Function Theory — Problem 7.2
field: mathematics
tier: prose
statement: Let $f(z)$ be analytic in a simply-connected domain $D$. It is known that $f(z)$ can be expanded in a series of Faber polynomials \[f(z)=\sum^\infty_{n=0}a_nP_n(z).\] Find the domain of variability $V$ of $a_n$ as $f(z)$ runs through all functions analytic in $D$, and having positive real part there. It is known that if $D$ is a circle, $V$ is a circle; and if $D$ is an ellipse, then $V$ is an ellipse, see Royster . (W. C. Royster)
