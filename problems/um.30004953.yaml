title: Optimal Great-Subsphere Concentration for the Negative-$p$ Aleksandrov Problem
field: mathematics
tier: prose
statement: For $p\leq-1$, what is the optimal upper bound on $\mu(\xi)/\mu(S^{n-1})$, over great subspheres $\xi\subset S^{n-1}$, that guarantees a convex body whose $L_p$ integral curvature measure is $\mu$?
