id: oeisa238902.conjecture-2
title: Number of integers $0 < k \le n$ such that $\pi(\pi(k n))$ is a square (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): For every $n = 1, 2, 3, \dots$, there exists a positive integer
  $k \le (n + 1) / 2$ such that $\pi(\pi(k n))$ is a triangular number.
