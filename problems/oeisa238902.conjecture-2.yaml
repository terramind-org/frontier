  module: FormalConjectures.OEIS.«238902»
  decl: OeisA238902.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 0 < n) :
        ∃ k : ℕ, 0 < k ∧ k ≤ (n + 1) / 2 ∧
          (Nat.primeCounting (Nat.primeCounting (k * n))).IsTriangular
