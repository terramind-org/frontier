id: um.801193
title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 19: Haiman's unimodality and positivity conjecture for Hecke algebra monomial characters on Kazhdan-Lusztig basis elements"
field: mathematics
tier: prose
statement: Let $H_n(q)$ be the Iwahori-Hecke algebra of type $A_{n-1}$, let $\phi^\lambda$ be the monomial virtual character of $H_n(q)$ corresponding to $\lambda \vdash n$, and let $C'_w$ be the Kazhdan-Lusztig basis element indexed by $w\in S_n$. Is it true that $\phi^\lambda(q^{\ell(w)/2} C'_w)$ is a polynomial in $q$ with nonnegative integer coefficients, and moreover that these coefficients are unimodal and symmetric about $q^{\ell(w)/2}$?
