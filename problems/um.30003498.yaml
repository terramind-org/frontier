title: Definability of Canonical Products with Sparse Zero Sets
field: mathematics
tier: prose
statement: For $0<s<1$, does the real field define the canonical Weierstrass product with zero sequence $(n^s)$ on $(0,\infty)$? More generally, for $\alpha>1$, what definable sets arise in the expansion of the real field by the canonical product associated with the geometric sequence $a_n=\alpha^n$, beyond the definable set $\alpha^{\mathbb Z}$?
