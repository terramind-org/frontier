title: Normality and Smoothness of Truncated Hadamard Simplices
field: mathematics
tier: prose
statement: Let $C=[-1,1]^d$, let $\Delta$ be a Hadamard simplex (a regular simplex whose vertices are vertices of $C$), and let $m,n$ be odd natural numbers with $n<m<nd$. In the affine lattice $\Lambda=(n+2\mathbb{Z})^d$, is $m\Delta\cap nC$ a lattice polytope? For which values of $m$ and $n$ is it normal, and for which is it smooth?
