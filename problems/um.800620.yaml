title: Selection Principles in Mathematics — Problem 49
field: mathematics
tier: prose
statement: |-
  It is easy to see that $\mathfrak{p}=\mathfrak{p}_2=\mathfrak{p}_3=\dots=\mathfrak{p}_{\aleph_0}$, and $\mathfrak{p}_\mathfrak{t}=\mathfrak{t}$.
  It turns out that $\mathfrak{p} = \mathfrak{p}_{\aleph_1}$ [Pyt].
  We get a hierarchy of cardinals between $\mathfrak{p}$ and $\mathfrak{t}$:
  $$\mathfrak{p}=\mathfrak{p}_{\aleph_1}\le \mathfrak{p}_{\aleph_2}\le ...\le \mathfrak{p}_\mathfrak{t} = \mathfrak{t}.$$

  Is $\mathfrak{p}_{\mathfrak{p}}=\mathfrak{t}$?
