title: Relative Betti Inequalities for Lex-Plus-Powers Ideals
field: mathematics
tier: prose
statement: Let $S = k[x_1, \ldots, x_n]$ be a polynomial ring over a field $k$, let $F = (x_1^{a_1}, \ldots, x_n^{a_n})$ be a regular sequence of pure powers, let $P = (f_1, \ldots, f_n)$ be a homogeneous regular sequence with $\deg f_i = a_i$, and let $I \supset P$ be a homogeneous ideal with corresponding lex-plus-powers (LPP) ideal $L \supset F$ having the same Hilbert function. In the setting of the Lex-Plus-Powers Conjecture, does the graded Betti-number inequality $b_{i,j}^{S/P}(L) \geq b_{i,j}^{S/F}(I)$ hold for all $i, j$?
