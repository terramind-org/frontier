statement: |-
  \section{S(S(f)) = S(f) for reloids}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For a set $X$, let $\mathcal F(X)$ be all filters on $\mathcal P(X)$, including the improper filter $\bot_X=\mathcal P(X)$. A filter is a nonempty family closed under finite intersections and supersets. Order filters by $\mathcal A\sqsubseteq\mathcal B$ when $\mathcal A\supseteq\mathcal B$ as families. Thus $\bigsqcup$ is intersection of filter families and $\bigsqcap$ is the filter generated by their union; the empty join is $\bot_X$ and the empty meet is $\top_X=\{X\}$. For $E\subseteq X$, $\uparrow E=\{U\subseteq X:E\subseteq U\}$ is its principal filter. Write $\mathcal A\mathrel{\#}\mathcal B$ when every $U\in\mathcal A$ and $V\in\mathcal B$ have $U\cap V\ne\varnothing$, equivalently $\mathcal A\sqcap\mathcal B\ne\bot_X$.

  A reloid $f:X\to Y$ is a filter on $X\times Y$, ordered by reverse inclusion of filter families. For a relation $R\subseteq X\times Y$, its principal reloid is $\uparrow R$. The reloid $g\circ f:X\to Z$ is generated by $G\circ F$ for $F\in f,G\in g$, where $G\circ F=\{(x,z):\exists y,(x,y)\in F,(y,z)\in G\}$. The reverse $f^{-1}$ is generated by $F^{-1}=\{(y,x):(x,y)\in F\}$ for $F\in f$. The identity $1_X$ is $\uparrow\Delta_X$, where $\Delta_X=\{(x,x):x\in X\}$.For an endoreloid $f:X\to X$, set $f^0=1_X$, $f^{j+1}=f\circ f^j$, and
  \[
   S(f)=\bigsqcup_{j=0}^{\infty}f^j.
  \]
  This join is the intersection of the filter families of all powers. It is the endomorphism series $S$, distinct from the source’s separately defined connectivity operator $S^*$.
  \paragraph{Statement recorded in the supplied source.}
  For every set $X$ and endoreloid $f:X\to X$, is
  \[
   S(S(f))=S(f)?
  \]
  The inner and outer occurrences use the same endomorphism-series operator. \sref{statement}{2}\sref{statement}{3}
  \subsection{Short English statement}
  Is taking the join of all finite powers, including the identity, idempotent for every endoreloid?
