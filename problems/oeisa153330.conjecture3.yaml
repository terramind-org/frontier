  decl: OeisA153330.conjecture3
  statement: |-
    theorem conjecture3 (n : ℕ) (v : ℤ) (hn : 0 < n) (ha : a n = some v)
        (hv : v ≠ 1 ∧ v ≠ 3 ∧ v ≠ 6) :
        ∃ x y : ℕ, v.natAbs = 5 * x + 8 * y
