  \item[\hypertarget{source:statement:2}{S2}] Amol Aggarwal, Vincent Delecroix, Élise Goujard, Peter Zograf and Anton Zorich, Conjectural Large Genus Asymptotics of Masur–Veech Volumes and of Area Siegel–Veech Constants of Strata of Quadratic Differentials (2019), Conjecture 1, Remark 1, §3 regular-point normalization. \url{https://arxiv.org/abs/1912.11702}.
  \item[\hypertarget{source:statement:3}{S3}] Jayadev S. Athreya, Alex Eskin and Anton Zorich, Right-angled billiards and volumes of moduli spaces of quadratic differentials on CP1 (2016), §4.1, Convention 4.1, equations (4.2)–(4.5); §4.13. \url{https://arxiv.org/abs/1212.1660}.
