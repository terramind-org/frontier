title: Branko Grunbaum in Many Dimensions — Question 4
field: mathematics
tier: prose
statement: |-
  A $2$-dimensional simplicial complex is said to be *polyhedral* if it admits an embedding in $\mathbb{R}^3$ with every vertex corresponding to a point, every edge corresponding to a straight line segment, and every triangle corresponding to a flat triangle contained in an affine plane. (It must also actually be a topological embedding, i.e.\ a continuous, injective, map on the geometric realization of the complex.)

  Is every triangulation of the $2$-dimensional torus polyhedral?
