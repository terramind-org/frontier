title: Multiplicatively Badly Approximable Pairs
field: mathematics
tier: prose
statement: What is the correct multiplicative analogue of badly approximable points? For $M_\lambda=\{(\alpha,\beta)\in\mathbb R^2:\liminf_{q\to\infty}q(\log q)^\lambda\|q\alpha\|\,\|q\beta\|>0\}$, is $M_\lambda$ empty for $\lambda<1$ and of full Hausdorff dimension for $\lambda\geq1$?
