title: Kernels of Nonfaithful Type-Preserving Punctured-Torus Representations
field: mathematics
tier: prose
statement: |-
  Let $T$ be the once-punctured torus. If $\rho:\pi_1(T)\to\operatorname{PSL}(2,\mathbb C)$ is a nonfaithful, discrete, type-preserving representation, is its kernel either

  $$\langle\!\langle\beta_r^m\rangle\!\rangle$$

  for some $r\in\widehat{\mathbb Q}$ and $m\geq2$, or

  $$\langle\!\langle\beta_{r_1}^{m_1},\beta_{r_2}^{m_2}\rangle\!\rangle$$

  for distinct $r_1,r_2\in\widehat{\mathbb Q}$ and $m_1,m_2\geq2$?
