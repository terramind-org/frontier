title: Research Problems in Function Theory — Problem 6.99
field: mathematics
tier: prose
statement: A function $f(z) = z + a_2 z^2 +\ldots$ is said to belong to the class $CV(R_1,R_2)$ if it is univalent and convex in $\mathbb{D}$, and if on $f(\{|z|=1\})$ the curvature $\rho$ satisfies the inequalities $R_1\leq\rho\leq R_2$. So far, little progress has been made on the study of this class of functions (see Goodman and ); we do not even know the sharp bound for $|a_2|$ in $CV(R_1,R_2)$. (A. W. Goodman)
