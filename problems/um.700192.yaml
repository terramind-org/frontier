title: Kourovka Notebook Problem 3.43
field: mathematics
tier: prose
statement: |-
  Let $\mu$ be an infinite cardinal number. A group
  $G$ is said to be $\mu $-*overnilpotent* if every
  cyclic subgroup of $G$ is a member of some ascending normal series
  of length less than $\mu$ reaching $G$. It is not difficult to
  show that the class of $\mu $-overnilpotent groups is a
  radical class. Is it true that if $\mu _1 < \mu _2$ for two
  infinite cardinal numbers $\mu _1$ and $\mu _2$, then there exists
  a group $G$ which is $\mu _2 $-overnilpotent and $\mu _1
  $-semisimple?

  *Remark of 2001:* In (S. Vovsi, *Sov. Math. Dokl.*, **13** (1972), 408--410) it was proved that
  for any two infinite cardinals $\mu _1 < \mu _2$ there exists a
  group that is $\mu _2$-overnilpotent but not $\mu _
  1$-overnilpotent.
