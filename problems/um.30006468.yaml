title: Rational Points on a Singular Twisted Cayley Cubic
field: mathematics
tier: prose
statement: Let $N(B)$ count primitive integer solutions $(x,y,z,w)\in[-B,B]^4$ with $x\neq0$ to $x^3+2xyz+xw^2-y^2w+wz^2=0$. Prove an asymptotic $N(B)\sim(c_1+c_2)B(\log B)^3$ with explicit positive constants, where $c_1$ is the predicted product of local densities and $c_2$ accounts for the Zariski-dense thin set.
