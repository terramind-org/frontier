title: Regularity and Symmetry in Laplacian Shape Optimization
field: mathematics
tier: prose
statement: Let $D\subset\mathbb{R}^d$ be bounded and open, fix a volume $m$, and let $\widehat{\Omega}\subset D$ be an optimal quasi-open set of volume $m$ for the $k$-th Dirichlet eigenvalue. For $k=1$, obtain sharper bounds for the size of the singular part of $\partial\widehat{\Omega}$. For $k=2$, when $d=2$ and $D$ is a rectangle, must $\widehat{\Omega}$ be symmetric? For $k\geq3$ and connected $D$, are the associated eigenfunctions Lipschitz continuous?
