  \section{Exact sketches versus genuine dynamical reduction}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  Dimension reduction maps observations from a high-dimensional space into a lower-dimensional representation. A linear projection can preserve selected statistics or approximate pairwise geometry under stated assumptions. A dynamical reduction must additionally describe how trajectories or update rules behave in the reduced representation.
