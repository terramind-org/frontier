title: Mod-$\ell$ Bogomolov–Pop Reconstruction Conjecture
field: mathematics
tier: prose
statement: Let $K/k$ and $L/l$ be function fields of transcendence degree at least $2$ over algebraically closed fields whose characteristics differ from $\ell$. Is the canonical map from field isomorphisms modulo Frobenius to Milnor-$K$-theory-preserving isomorphisms $K^\times/\ell\to L^\times/\ell$ bijective?
