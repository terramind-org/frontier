title: Open Problems in Wavelet Theory — Problem 9
field: mathematics
tier: prose
statement: |-
  One of the most fundamental problems in wavelet theory asks for a characterization of dilations for which o.n. wavelets exist. Although this problem has been explicitly stated by Speegle [S03] and Wang [Wa], it has been studied earlier in late 1990's.

  For what dilations $A \in GL_n(\mathbb{R})$ and lattices $\Gamma \subset \mathbb{R}^n$, there exist an orthonormal wavelet associated with $(A,\Gamma)$?
