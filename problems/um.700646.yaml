title: Kourovka Notebook Problem 10.31
field: mathematics
tier: prose
statement: |-
  Suppose that $G$ is an algebraic group, $H$ is a
  closed normal subgroup of $G$ and $f\! : G \rightarrow G/H$ is the
  canonical homomorphism. What conditions ensure that there exists a
  rational section $s\! : G/H \rightarrow G$ such that $ sf=1$? For
  partial results, see (Yu. I. Merzlyakov, *Rational Groups*,
  Nauka, Moscow, 1987, $\S$ 37 (Russian)).
