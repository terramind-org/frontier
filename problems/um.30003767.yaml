title: Quantitative Thin-Set Descriptions of Reducible Specializations
field: mathematics
tier: prose
statement: Let $f(t,x)\in\mathbb Q[t,x]$ be irreducible, and let $\operatorname{Red}_f$ be the set of parameters $t$ for which $f(t,x)$ is reducible. In a thin-set presentation of $\operatorname{Red}_f$ by maps $\varphi_i$, how many maps are needed, what degrees can they have, and how do these quantities control the growth of $\operatorname{Red}_f\cap\mathbb Z$?
