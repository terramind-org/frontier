title: Rational Formula for the Knot Invariant $\rho_1$
field: mathematics
tier: prose
statement: |-
  For a knot $K \subset S^3$, let $P^{(1)}(t)$ be the $1$-loop polynomial (perturbed Alexander invariant) arising in the asymptotic expansion of the colored Jones polynomial, and let $\rho_1(t)$ be Rozansky's rational $1$-loop knot invariant. Does the conjectured identity
  $$
  \rho_1(t^2) = \frac{t^2}{(1 - t^2)^2} P^{(1)}(t)
  $$
  hold for every knot $K$?
