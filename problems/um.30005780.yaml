title: Cohomology and Balmer Spectra of Hopf Algebras
field: mathematics
tier: prose
statement: For a finite-dimensional, not necessarily cocommutative Hopf algebra $A$, determine when $H^*(A,k)$ is Noetherian, when the natural map $\Psi:\operatorname{Spec}(\operatorname{stab}A)\to\operatorname{Proj}H^*(A,k)$ is a homeomorphism, and how to compute $\operatorname{Proj}H^*(A,k)$.
