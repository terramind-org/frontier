title: Open Problems in Pluripotential Theory — Question 15
field: mathematics
tier: prose
statement: |-
  [DDGHKZ]
  Are the following properties equivalent ?

  (i) There exists $\varepsilon_{\mu}>0$ such that $\exp(-\varepsilon_\mu PSH(X,\omega) ) \subset L^1(\mu)$.

  (ii) There exists $\varphi \in {\mathcal{H}ol}(X,\omega)$ sucht that $\mu=MA(\varphi)$.
