  definitions:
    - name: OeisA7013.a
      kind: def
      text: |-
        /-- Catalan-Mersenne numbers: $a(0) = 2$, $a(n+1) = 2^{a(n)} - 1$. -/
        def a (n : ℕ) : ℕ :=
          match n with
          | 0 => 2
          | n + 1 => 2 ^ a n - 1
