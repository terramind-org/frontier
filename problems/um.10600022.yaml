title: Virtual-knot problem 22 — The Rack Space
field: mathematics
tier: prose
statement: |-
  The Rack Space: The rack space was invented by Fenn, Rourke
  and Sanderson . The homology of the rack
  space has been considered by the above authors and Carter, Kamada,
  Saito . For low dimensions, the homology has the following
  interesting interpretations. Two dimensional cycles are represented
  by virtual link diagrams consistently colored by the rack, and three
  dimensional cycles by the same but with the regions also colored.
  See the thesis of Greene . So virtual links can give,
  in this way, information about classical knots! For the second
  homology of the dihedral rack, the results are given in Greene's
  thesis. We now know that for a prime $p$ the third homology has a
  factor $\mathbb{Z}_p$, see .

  Another line of enquiry is to look at properties of the birack
  space and associated homology.

  Beyond problem number the cited item we list new
  problems that are added to this revised problem list.
