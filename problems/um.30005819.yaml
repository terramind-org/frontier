title: Nearly Right-Angled Point Sets
field: mathematics
tier: prose
statement: Let $X\subseteq\mathbb R^n$ be finite and suppose no three points of $X$ determine an angle greater than $\frac\pi2(1-10^{-10000})$. Prove or disprove that $|X|\leq 1.99^n$.
