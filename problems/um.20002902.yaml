title: A Lam--Kato bridge for the geometric and graded meanings of k-Schur functions
field: mathematics
tier: prose
statement: |-
  “(7) Elucidate the representation-theoretical significance of the \(k\)-Schur functions. The answer may involve either representation theory of symmetric groups or representation theory of Lie algebras.”

  The exact AIM record is:

  It is Problem 7 in the 2005 AIM workshop list on Generalized Kostka Polynomials, <https://aimath.org/WWN/kostka/prob2.pdf>. The surrounding workshop notes use the one-parameter recursive \(k\)-Schur functions \(s_\lambda^{(k)}[X;t]\). The problem is deliberately open-ended: it asks for a representation-theoretic model, not for a yes/no assertion.

  There are now two answers which must not be conflated:

  1. the parameter-forgotten specialization \(s_\lambda^{(k)}[X;1]\) represents an affine-Grassmannian homology Schubert class;
  2. the full graded modern \(k\)-Schur function is the graded character of a finite-dimensional module for a current algebra, equivalently for a skew group algebra containing \(\mathbb C\mathfrak S_m\).

  The first answer is geometric and was published by Lam. The second is the main subject of Kato's current arXiv preprint. The parameter is called \(t\) in the older literature and \(q\) in Kato's convention. Below it is denoted by \(u\) whenever the name is immaterial.
