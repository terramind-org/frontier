statement: If compactly generated totally disconnected locally compact groups $G$ and $H$ are quasi-isometric and have finite rational cohomological dimension, must $\operatorname{cd}_{\mathbb Q}G=\operatorname{cd}_{\mathbb Q}H$? Is there a useful totally disconnected locally compact analogue of right-angled Artin groups?
