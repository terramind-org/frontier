title: Open Problems in Pluripotential Theory — Question 10
field: mathematics
tier: prose
statement: |-
  A subtle point is to understand precisely when a function $\varphi \in DMA(X,\omega)$ belongs to
  ${\mathcal{E}}(X,\omega)$. This has been investigated in [CGZ08] with poor success:

  [Coman-Guedj-Zeriahi]
  Assume $\varphi \in DMA(X,\omega)$ is such that $MA(\varphi)$ does not charge $(\varphi=-\infty)$.
  Does it imply that $\varphi$ belongs to ${\mathcal{E}}(X,\omega)$ ?
