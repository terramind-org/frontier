id: um.30004359
title: Maximum Independent Sets in Regular Uniform Hypergraphs
field: mathematics
tier: prose
statement: |-
  For $r\geq2$ and $d\geq1$, determine the maximum number of independent sets in a $d$-regular $r$-uniform hypergraph $G$ on $n$ vertices. In particular, does the canonical $d$-regular hypergraph $H_d^r$ satisfy the conjectured extremal bound

  $$\operatorname{ind}(G)\leq \operatorname{ind}(H_d^r)^{n/(rd)}$$?
