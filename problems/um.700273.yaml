title: Kourovka Notebook Problem 4.66
field: mathematics
tier: prose
statement: |-
  Let $P$ be a presentation of a finite group $G$
  on $m_p$ generators and $r_p$ relations. The *deficiency*
  $\mathrm{def} (G)$ is the maximum of $m_p - r_p$ over all
  presentations $P$. Let $G$ be a finite group such that $G=G'\ne 1$
  and the multiplicator $M(G)=1$. Prove that $\mathrm{def} (G^n)
  \rightarrow - \infty $ as $n \rightarrow \infty $, where $G^n$ is
  the $n$th direct power of $G$.
