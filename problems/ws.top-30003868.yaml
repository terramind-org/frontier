  \section{Local Algorithms for Semidefinite Programming}\label{30003868}
  {\small\sffamily UnsolvedMath ID 30003868 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A bisection partitions the vertices into two parts of equal size (or differing by one for odd order). Its cut consists of the edges joining the parts; minimum bisection minimizes their total weight.

  A semidefinite program optimizes a linear functional of a symmetric matrix subject to affine constraints and positive semidefiniteness. The condition $X\succeq0$ means $v^TXv\geq0$ for every real vector $v$.

  In the LOCAL model vertices communicate synchronously along graph edges; messages and local computation are unrestricted and complexity is the number of rounds. After $t$ rounds a vertex can depend only on its radius-$t$ neighborhood and any supplied identifiers or randomness.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  Source-record limitation: The broad local-SDP question is subsumed by the more specific random-graph target retained under OWR ID 30003869.

  Related catalogue records: \href{https://mehmetmars7.github.io/Erdosproblems-llm-hunter/problem.html?type=open_problems&id=30003869}{30003869}. Separate source IDs are preserved for their provenance.
  \paragraph{Statement recorded in the supplied source.}
  How accurately can local algorithms solve or approximate semidefinite programs, particularly SDP relaxations for random graph problems? \sref{30003868}{2}
