title: Functional Characterization of Thompson Group Amenability
field: mathematics
tier: prose
statement: Let $\mathcal{T}$ be the variable-free terms generated by $1$ under a binary operation $\star$. Is the amenability of Thompson's group $F$ equivalent to the existence of strictly increasing nonidentity functions $f_T:\mathbb{N}\to\mathbb{N}$, indexed by $T\in\mathcal{T}$, such that $f_S=f_T$ whenever $S$ and $T$ are related by $A\star(B\star C)=(A\star B)\star(A\star C)$, $\operatorname{crit}(f_{A\star B})=f_A(\operatorname{crit}(f_B))$, and the set of critical points is $\mathbb{N}$?
