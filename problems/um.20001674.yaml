id: um.20001674
title: Forest-only mutation components and plabic-link HOMFLY
field: mathematics
tier: prose
statement: |-
  Is there an association between the mutation equivalence of plabic graphs or the mutation equivalence of quivers to the invariants of isotopy classes of their associated links? Can these be used to produce invariants of quivers up to mutation equivalence?

  **Recovered reading.** Use the oriented smooth plabic link \(L_G^{\mathrm{plab}}\subset S^3\) and the mutable interior-face quiver \(Q_G\) of a simple plabic graph \(G\). Determine when an oriented smooth link invariant such as
  \[
  P(L_G^{\mathrm{plab}};a,z)
  \]
  depends only on the Fomin--Zelevinsky mutation class of \(Q_G\).
