lean:
  module: FormalConjectures.Wikipedia.CongruentNumber
  decl: CongruentNumber.Tunnell_even_converse
  statement: |-
    theorem Tunnell_even_converse (n : ℕ) (hsqf : Squarefree n) (heven : Even n) :
        2 * (C n).ncard = (D n).ncard → congruentNumber n
  context:
    - open CongruentNumber
  definitions:
    - name: CongruentNumber.congruentNumber
      kind: def
      text: |-
        def congruentNumber (n : ℕ) : Prop :=
          ∃ (a b c : ℚ), a ^ 2 + b ^ 2 = c ^ 2 ∧ n = (2⁻¹ : ℚ) * a * b
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Wikipedia/CongruentNumber.lean#L36
    - name: CongruentNumber.C
      kind: def
      text: "def C (n : ℕ) : Set (ℤ × ℤ × ℤ) := {(x, y, z) | n = 8 * x ^ 2 + 2 * y ^ 2 + 64 * z ^ 2}"
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Wikipedia/CongruentNumber.lean#L97
    - name: CongruentNumber.D
      kind: def
      text: "def D (n : ℕ) : Set (ℤ × ℤ × ℤ) := {(x, y, z) | n = 8 * x ^ 2 + 2 * y ^ 2 + 16 * z ^ 2}"
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Wikipedia/CongruentNumber.lean#L98
