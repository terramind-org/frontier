id: um.20001091
title: "Graham's reciprocal-mass square conjecture: a dyadic extremal reduction"
field: mathematics
tier: prose
statement: |-
  Let \(A\subseteq\mathbb Z\times\mathbb Z\) satisfy
  \[
  \sum_{(x,y)\in A}\frac1{x^2+y^2}=\infty.
  \]
  Conjecture (\(\$1000\)): \(A\) contains the four vertices of a square, i.e. four points of the form
  \((x,y),(x+a,y),(x,y+a),(x+a,y+a)\). More generally, it should be true that \(A\) contains a \(k\times k\) square grid.
