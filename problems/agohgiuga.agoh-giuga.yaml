  definitions:
    - name: AgohGiuga.AgohGiugaCongr
      kind: def
      text: |-
        /--
        The **Agoh-Giuga Conjecture**, Agoh's formulation.
        An integer `p ≥ 2` is prime if and only if we have
        `p*B_{p-1} ≡ -1 [MOD p]`
        -/
        def AgohGiugaCongr : Prop :=
          ∀ p ≥ 2, p.Prime ↔ ∃ (k : ℤ),
          let B := bernoulli' (p - 1)
          p * B.num + B.den = k * p^2
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/AgohGiuga.lean#L45
