title: Kourovka Notebook Problem 14.93
field: mathematics
tier: prose
statement: |-
  Let $N({\mathbb{Z}/p{\mathbb{Z})$ be the group defined
  in Archive, 12.24 (the so-called ``Nottingham group'', or the ``Wild
  group'').
  Find relations of $N({\mathbb{Z}/p{\mathbb{Z})$ as a pro-$p $-group
  (it has two generators, e. g., $x+x^2$ and $x/(1-x)$). *Comment
  of 2009:* for $p>2$ see progress in (M. V. Ershov, *J. London Math. Soc.*, **71** (2005),
  362--378).
