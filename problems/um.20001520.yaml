title: Rank obstruction and a characteristic-fiber normalizer reduction
field: mathematics
tier: prose
statement: |-
  A group \(G\) is said to be of type \(VF\) if there exists a finite index subgroup \(G'\) of \(G\) which admits a finite classifying space.

  If \(G\) is a free-by-cyclic group then \(\operatorname{Out}(G)\) is of type \(VF\).

  The repository record itself is uncorrupted. More importantly, the workshop literature fixes the convention: a free-by-cyclic group is
  \[
  G=F_n\rtimes_\phi\mathbb Z
  \]
  with \(F_n\) of **finite rank** and the quotient infinite cyclic. Andrew--Martino use exactly this convention in the first sentence of their setup. Thus the intended conjecture concerns finite \(n\). If arbitrary-rank free fibers are allowed, the assertion is false (Proposition 5.1 below).

  We use the presentation
  \[
  G_\phi=\langle F_n,t\mid txt^{-1}=\phi(x)\ (x\in F_n)\rangle
  \]
  and write \(\Phi=[\phi]\in\operatorname{Out}(F_n)\).
