lean:
  module: FormalConjectures.Wikipedia.LittlewoodConjecture
  decl: LittlewoodConjecture.littlewood_conjecture
  statement: |-
    theorem littlewood_conjecture (α β : ℝ) :
        atTop.liminf (fun (n : ℕ) ↦ n * distToNearestInt (n * α) * distToNearestInt (n * β)) = 0
  context:
