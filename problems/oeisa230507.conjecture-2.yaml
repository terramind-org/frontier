id: oeisa230507.conjecture-2
title: Triples summing to $n$ with $2m+1$ and $2m^3+1$ prime (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): Any integer $n > 8$ can be written as $x + y + z$ ($x, y, z > 0$) with
  $2x + 1, 2y + 1, 2z - 1, 2x^4 - 1, 2y^4 - 1, 2z^4 - 1$ all prime.
