lean:
  module: FormalConjectures.OEIS.«230507»
  decl: OeisA230507.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : n > 8) :
        ∃ x y z : ℕ, 0 < x ∧ 0 < y ∧ 0 < z ∧ x + y + z = n ∧
          (2 * x + 1).Prime ∧ (2 * y + 1).Prime ∧ (2 * z - 1).Prime ∧
          (2 * x ^ 4 - 1).Prime ∧ (2 * y ^ 4 - 1).Prime ∧ (2 * z ^ 4 - 1).Prime
  context:
    - open OeisA230507
  definitions: []
