  \item[\hypertarget{source:statement:2}{S2}] B. Hujter, V. Kiss and L. Tóthmérész, On the complexity of the chip-firing reachability problem (2017), Sections 1 and 2.1--2.4; Section 5, Problems 19 and 22, pp.12--13. \url{https://arxiv.org/pdf/1507.03209}.
