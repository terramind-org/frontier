statement: |-
  \section{Complexity of the halting problem for Eulerian multigraphs}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $G=(V,A)$ be a finite loopless directed multigraph, with $a_{uv}$ arcs from $u$ to $v$ and $d^+(v)=\sum_w a_{vw}$. A chip distribution is $x\in\mathbb Z_{\ge0}^{V}$. Firing $v$ is legal when $x(v)\ge d^+(v)$ and changes $x$ by removing $d^+(v)$ chips at $v$ and sending one chip along each outgoing arc. Reachability permits any finite legal firing sequence, including the empty sequence. A distribution is terminating if no infinite legal firing sequence starts from it; equivalently a maximal legal game reaches a distribution with no legal firing. The original legal-firing convention includes a zero-outdegree vertex, whose firing has no effect. Arc multiplicities and chip counts are binary encoded. A directed multigraph is Eulerian if $d^+(v)=d^-(v)$ for every vertex, where $d^-(v)=\sum_w a_{wv}$. Multiple arcs remain allowed and are succinctly encoded by their binary multiplicities.
  \paragraph{Statement recorded in the supplied source.}
  Does a deterministic polynomial-time algorithm decide whether an input chip distribution on an Eulerian directed multigraph is terminating? \sref{statement}{2}
  \subsection{Short English statement}
  Can termination of chip firing on Eulerian graphs with binary-encoded parallel edges be decided in polynomial time?
