statement: For a lattice polytope $P$, characterize homogeneous polynomial weights beyond $R_P$, particularly weights in $S_P$, for which the weighted $h^*$-polynomial has nonnegative coefficients and is coefficientwise monotone under inclusions $P\subseteq Q$.
