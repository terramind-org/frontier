title: Kourovka Notebook Problem 15.9
field: mathematics
tier: prose
statement: |-
  An automorphism $\varphi$ of the free group
  $F_n$ on the free generators $x_1, x_2,\ldots , x_n$ is called
  *conjugating* if $x_i^{\varphi}=
  t_i^ {-1} x_ {\pi (i)} t_i$, $i=1, 2,\ldots ,n$, for some
  permutation $\pi \in {\mathbb{S}_n$ and some elements $t_i\in F_n$.
  The set of conjugating automorphisms fixing the product
  $x_1x_2\cdots x_n$ forms the braid group $B_n$. The group
  $B_n$ is linear for any $n\geq 2$, while the group of all
  automorphisms $\mathrm{Aut} F_n$ is not linear for $n\geq 3$. Is the
  group of all conjugating automorphisms linear for
  $n\geq 3$?
