title: Sharp-Interface Limits of Periodic Phase-Transition Equations
field: mathematics
tier: prose
statement: |-
  Let $a$ be a $\mathbb Z^d$-periodic uniformly elliptic matrix field, let $W$ be a double-well potential with global minima at $\pm1$, and let $u_\varepsilon$ solve
  $$
  \partial_tu_\varepsilon-\operatorname{div}\!\bigl(a(\varepsilon^{-1}x)Du_\varepsilon\bigr)+\varepsilon^{-2}W'(u_\varepsilon)=0
  $$
  on $\mathbb R^d\times(0,\infty)$ with initial datum $u_0$. What is the limiting behavior of $u_\varepsilon$ as $\varepsilon\to0^+$?
