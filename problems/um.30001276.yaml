title: Iwasawa Main Conjecture for Dihedral Ring Class Towers
field: mathematics
tier: prose
statement: Let $K$ be a finite extension of the imaginary quadratic field $k$ inside its cyclotomic extension, and let $F$ be the maximal totally real subfield of $K$. Assume that the root number of $L(E/k,s)$ is $+1$, that $p\geq5$, that the representation on $E[p]$ has image $\operatorname{GL}_2(\mathbb{F}_p)$, that $p$ does not divide the minimal modular degree, and that $E[p]$ is an irreducible $I_v$-module whenever $v^2\mid N\mathcal{O}_F$ and $p\mid\operatorname{N}(v)+1$. For the ring-class tower $K[p^\infty]$, does $(L_p(\phi_F,K[p^\infty]))=(\operatorname{char}_{\Lambda(J_K(\infty))}X(E/K[p^\infty]))$ hold? Torsion and the inclusion from the $p$-adic $L$-function ideal into the characteristic ideal are known; the open content is the reverse divisibility.
