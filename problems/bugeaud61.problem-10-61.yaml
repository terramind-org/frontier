lean:
  module: FormalConjectures.Books.BugeaudDistributionModuloOne.Problem10_61
  decl: Bugeaud61.problem_10_61
  statement: |-
    theorem problem_10_61 (α : ℝ) (hα : IsPisot α) (hα2 : 2 < α) :
        ∀ ξ ∈ pisotCantorSet α, ¬ IsEquidistributedModuloOne fun n : ℕ => ξ * α ^ (n + 1)
  context:
    - open Bugeaud61
  definitions:
    - name: Bugeaud61.pisotCantorSet
      kind: def
      text: |-
        /--
        The set $C(\alpha)$ of Problem 10.61. For $\alpha > 2$ it is a Cantor set of Hausdorff
        dimension $\log 2 / \log \alpha < 1$, normalised so that $0$ is its least and $1$ its
        greatest element.
        -/
        noncomputable def pisotCantorSet (α : ℝ) : Set ℝ := Set.range (cantorPoint α)
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Books/BugeaudDistributionModuloOne/Problem10_61.lean#L68
