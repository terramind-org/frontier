id: bugeaud61.problem-10-61
title: "Bugeaud Collection of Conjectures and Open Questions: Pisot orbits on the Cantor set"
field: mathematics
tier: proof
statement: |-
  Problem 10.61. Let $\alpha > 2$ be a Pisot number. For every $\xi \in C(\alpha)$ the
  sequence $(\xi \alpha^n)_{n \ge 1}$ is not uniformly distributed modulo one.
