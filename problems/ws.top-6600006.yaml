statement: |-
  \section{Homological Pisot Conjecture}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A one-dimensional self-similar inflation tiling uses finitely many labeled interval types: expanding each interval by $\lambda$ and subdividing it according to a substitution reproduces the tiling. Its substitution (abelianisation) matrix $M$ counts tiles of each type in each substituted tile. The translation hull $\Omega$ is the closure of its translates in the local tiling topology, with the translation-invariant probability measure of the substitution system. Pure point dynamical spectrum means that $L^2(\Omega)$ is spanned by eigenfunctions of the translation action. A Pisot number is a real algebraic integer $\lambda>1$ whose other algebraic conjugates have modulus less than $1$. Unimodular means $\det M=\pm1$. The rank of first rational Čech cohomology is $\dim_{\mathbb Q}\check H^1(\Omega;\mathbb Q)$.
  \paragraph{Statement recorded in the supplied source.}
  Must a one-dimensional unimodular Pisot inflation tiling have pure point dynamical spectrum if $\dim_{\mathbb Q}\check H^1(\Omega;\mathbb Q)$ equals the algebraic degree of $\lambda$? \sref{statement}{2}
  \subsection{Short English statement}
  Does the stated minimal rational cohomology rank force a unimodular Pisot inflation system to have pure point spectrum?
