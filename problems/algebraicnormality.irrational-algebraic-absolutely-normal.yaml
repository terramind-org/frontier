lean:
  module: FormalConjectures.Wikipedia.AlgebraicNormality
  decl: AlgebraicNormality.irrational_algebraic_absolutely_normal
  statement: |-
    theorem irrational_algebraic_absolutely_normal :
        ∀ x : ℝ, IsIrrationalAlgebraic x → IsAbsolutelyNormal x
  context:
    - open AlgebraicNormality
    - open NormalNumber
  definitions:
    - name: AlgebraicNormality.IsIrrationalAlgebraic
      kind: def
      text: |-
        /-- A real number is irrational algebraic if it is algebraic over `ℚ` but not rational. -/
        def IsIrrationalAlgebraic (x : ℝ) : Prop :=
          IsAlgebraic ℚ x ∧ Irrational x
