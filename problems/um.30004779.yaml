statement: For every algebraically closed field $K$ and every $\gamma\in C^{\bullet}(K)$, does the action of the stabilizer group $P_\gamma$ on $R\Gamma(f^{-1}(\gamma),\omega_{f^{-1}(\gamma)})$ factor through the component group $\pi_0(P_\gamma)$?
