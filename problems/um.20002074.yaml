title: An orbit-category and Rees-deformation model for Legendrians in open books
field: mathematics
tier: prose
statement: Auroux asked whether there is a category for Legendrians in open books, analogous to the Fukaya category of Lagrangians in a symplectic manifold. Morphisms between two Legendrians cannot in general be isolated from their self-chords, so coefficients in the contact homology of the individual Legendrians may be needed. The open-book angular direction suggests a filtration by the rotation of Reeb chords. If two Legendrians lie on one page, their contact-homological morphisms should involve all iterated monodromy images rather than only their ordinary Lagrangian Floer homology. Restoring the binding might be a deformation of an \(A_\infty\)-category. Relative contact homology should also be a module over absolute contact homology. Eliashberg suggested studying the gluing by rounding the convex, flat, and concave boundary pieces in the symplectization of the binding complement and then partially gluing along the resulting convex boundary.
