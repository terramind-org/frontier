title: Dense-Order-Preserving Preorders on Ordinal-Valued Functions
field: mathematics
tier: prose
statement: For each countable ordinal $\alpha$, classify the preorder on functions $\varphi,\psi:\mathbb{Q}\to\alpha$ defined by $\varphi\leq_{\alpha,\mathrm{dop}}\psi$ if and only if some dense order-preserving $g:\mathbb{Q}\to\mathbb{Q}$ satisfies $\varphi(q)\leq_\alpha\psi(g(q))$ for every $q\in\mathbb{Q}$.
