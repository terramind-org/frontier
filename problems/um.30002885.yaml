title: K-Theoretic Geometric Satake Equivalence
field: mathematics
tier: prose
statement: For a semisimple complex group $G$ with Langlands dual $G^\vee$, let $\mathrm{Gr}$ be its affine Grassmannian. Is the convolution category $K\mathrm{Conv}(\mathrm{Gr})$ equivalent to a full subcategory of $U_q(\mathfrak g)$-equivariant $\mathcal O_q(G)$-modules?
