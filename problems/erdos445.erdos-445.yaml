  decl: Erdos445.erdos_445
  statement: |-
    theorem erdos_445 :
        ∀ c : ℝ, c > 1 / 2 →
          ∀ᶠ p : ℕ in atTop, p.Prime → ∀ n : ℕ, Erdos445Prop c p n
  context:
    - open Erdos445
    - open Filter
  definitions:
    - name: Erdos445.Erdos445Prop
      kind: def
      text: |-
        /--
        The property that there exist $a,b\in(n,n+p^c)$ such that $ab\equiv 1\pmod{p}$.
        -/
        def Erdos445Prop (c : ℝ) (p n : ℕ) : Prop :=
          ∃ a b : ℕ,
            n < a ∧ (a : ℝ) < (n : ℝ) + (p : ℝ) ^ c ∧
            n < b ∧ (b : ℝ) < (n : ℝ) + (p : ℝ) ^ c ∧
            a * b ≡ 1 [MOD p]
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/445.lean#L37
