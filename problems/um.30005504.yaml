id: um.30005504
title: Optimal Character-Ratio Bounds for Almost Quasisimple Groups
field: mathematics
tier: prose
statement: For a finite almost quasisimple group $G$ and $g\in G\setminus Z(G)$, find the smallest explicit $\gamma(g)\in(0,1)$ satisfying $|\chi(g)|/\chi(1)\leq\gamma(g)$ for every nonlinear $\chi\in\operatorname{Irr}(G)$, and the smallest explicit $\alpha(g)\in(0,1)$ satisfying $|\chi(g)|\leq\chi(1)^{\alpha(g)}$ for every $\chi\in\operatorname{Irr}(G)$.
