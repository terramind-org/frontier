lean:
  module: FormalConjectures.OEIS.«1146»
  decl: OeisA1146.conjecture
  statement: |-
    theorem conjecture :
      ∀ k : ℕ, ((k^4 - 1) : ℕ) ∣ (2^k - 1 : ℕ) → k > 1 → ∃ n : ℕ, 2 ≤ n ∧ k = a n
  context:
    - open OeisA1146
  definitions:
    - name: OeisA1146.a
      kind: def
      text: |-
        /--
        The primary defining sequence `a`.
        $a(n) = 2^{2^n}$.
        -/
        def a (n : ℕ) : ℕ := 2 ^ (2 ^ n)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/OEIS/1146.lean#L31
