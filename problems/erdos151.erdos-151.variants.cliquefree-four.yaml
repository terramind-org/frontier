lean:
  module: FormalConjectures.ErdosProblems.«151»
  decl: Erdos151.erdos_151.variants.cliqueFree_four
  statement: |-
    theorem erdos_151.variants.cliqueFree_four :
        ∀ (n : ℕ) (G : SimpleGraph (Fin n)), G.CliqueFree 4 →
          cliqueTransversalNumber G ≤ n - H n
  context:
    - open Erdos151
    - open Erdos151.erdos_151
    - open Erdos151.erdos_151.variants
    - open SimpleGraph
  definitions:
    - name: Erdos151.H
      kind: def
      text: |-
        /-- $H(n)$: the largest `k` such that every triangle-free graph on `n` vertices contains an
        independent set on `k` vertices. -/
        noncomputable def H (n : ℕ) : ℕ :=
          sSup {k | ∀ G : SimpleGraph (Fin n), G.CliqueFree 3 → ∃ s, G.IsNIndepSet k s}
