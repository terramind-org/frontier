lean:
  module: FormalConjectures.ErdosProblems.«151»
  decl: Erdos151.erdos_151.variants.cliqueFree_four
  statement: |-
    theorem erdos_151.variants.cliqueFree_four :
        ∀ (n : ℕ) (G : SimpleGraph (Fin n)), G.CliqueFree 4 →
          cliqueTransversalNumber G ≤ n - H n
  context:
    - open Erdos151
    - open Erdos151.erdos_151
    - open Erdos151.erdos_151.variants
    - open SimpleGraph
    - "variable {V : Type*}"
  definitions:
    - name: Erdos151.cliqueTransversalNumber
      kind: def
      text: |-
        /-- The clique transversal number $\tau(G)$: the minimal number of vertices that meet every
        maximal clique of `G` with at least two vertices. -/
        noncomputable def cliqueTransversalNumber (G : SimpleGraph V) : ℕ :=
          sInf {k | ∃ T : Finset V, IsCliqueTransversal G T ∧ T.card = k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/ErdosProblems/151.lean#L47
    - name: Erdos151.H
      kind: def
      text: |-
        /-- $H(n)$: the largest `k` such that every triangle-free graph on `n` vertices contains an
        independent set on `k` vertices. -/
        noncomputable def H (n : ℕ) : ℕ :=
          sSup {k | ∀ G : SimpleGraph (Fin n), G.CliqueFree 3 → ∃ s, G.IsNIndepSet k s}
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/ErdosProblems/151.lean#L52
