title: Structural Relations Between Projected Diffusion Generators
field: mathematics
tier: prose
statement: Let $p:N\to M$ be a smooth surjection between manifolds, and let diffusion generators $A$ on $M$ and $B$ on $N$ satisfy $B(f\circ p)=(Af)\circ p$ for every smooth $f:M\to\mathbb{R}$. Determine structural and spectral relationships between $A$ and $B$, including whether $B$ has a natural decomposition.
