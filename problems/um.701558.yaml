title: Kourovka Notebook Problem 19.10
field: mathematics
tier: prose
statement: |-
  a)
  Is it possible to embed a finitely generated non-abelian free pro-$p$ group as an open subgroup of a simple totally disconnected locally compact group?

  b) If the answer is yes, can we require that the simple envelope is also compactly generated?

  *Comment of 2025*: Partial progress on part b) is made in (Y. Barnea, M. Ershov, A. Le Boudec, C. D. Reid,
  M. Vannacci, T. Weigel, *Preprint*, 2025, https://arxiv.org/pdf/2507.04120).
