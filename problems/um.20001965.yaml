title: A fixed-component formula for the hyper-compact signature
field: mathematics
tier: prose
statement: |-
  The recovered statement of Conjecture 6.10 is as follows. Put

  \[
   K=\mathbb Q(u),\qquad
   \widehat H^*_{S^1}(M)=H^*_{S^1}(M;\mathbb Q)\otimes_{\mathbb Q[u]}K,
  \]

  and order $K$ by declaring a nonzero rational function positive when its leading coefficient (equivalently its sign for $u\gg0$) is positive. For a circle-compact $M$, Hausel--Proudfoot define integration by fixed-set localization and the pairing

  \[
   B_M(\alpha,\beta)=\int_M\alpha\beta. \]

  The intended conjecture is that if $M^{4n}$ is hyper-compact and \(\sigma(M)\) is the signature of this localized pairing, then \((-1)^n\sigma(M)\ge0\).

  Two corrections are necessary. First, the AIM Definition 6.9 immediately preceding the record says “finitely many critical points.” Read literally, this is inconsistent in positive dimension with the weight-one symplectic hypothesis and the existence of a minimum (Proposition 5.1 below). Hausel's primary 2003 paper instead defines hyper-compactness using a proper Hamiltonian with a minimum and explicitly allows fixed components $F_1,\ldots,F_f$; the later semiprojective formulation also has projective fixed components. Second, on odd cohomology cup product is alternating, not symmetric. The abelianization Theorems 6.12--6.13 are boundary context, not additional problems addressed here.
