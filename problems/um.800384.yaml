title: Open Problems in Arithmetic Dynamics — Question 7
field: mathematics
tier: prose
statement: |-
  \begin{parts}

  (a)
  For which choices of fields $K$, maps $f$, and basepoints $P$ is the
  Odoni index $\iota_K(f,P)$ equal to $1$, i.e., when is the arboreal
  representation $\rho^{\mathrm{arb}}_{f,P}$ surjective?

  (b)
  For which choices of fields $K$, maps $f$, and basepoints $P$ is the
  Odoni index $\iota_K(f,P)$ finite, i.e., when does the image of the
  arboreal representation $\rho^{\mathrm{arb}}_{f,P}$ have finite index in the full tree automorphism group?
  \end{parts}
