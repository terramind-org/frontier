title: Existence of Combinatorial Designs at Admissible Orders
field: mathematics
tier: prose
statement: |-
  For integers $q>r\geq1$ and $\lambda\geq1$, an $(n,q,r,\lambda)$-design is a collection of $q$-subsets of an $n$-element set in which every $r$-subset occurs in exactly $\lambda$ blocks. Characterize the orders $n$ for which such a design exists. The necessary divisibility conditions are
  $$\binom{q-i}{r-i}\mid\lambda\binom{n-i}{r-i}\qquad(0\leq i<r).$$
  For fixed $q$, $r$, and $\lambda$, these conditions are known to be sufficient for all sufficiently large $n$; the remaining question is to determine the finite exceptional admissible orders. When $\lambda=1$, the designs are Steiner systems.
