title: Topological Complexity of Polygon Spaces and Three-Manifolds
field: mathematics
tier: prose
statement: For a generic length vector $\ell$, what is the topological complexity $\operatorname{TC}(M_\ell)$ of the moduli space of closed planar $n$-gons with side lengths $\ell$, modulo rotations and translations? More generally, for a closed 3-manifold $M$, does $\operatorname{TC}(M)$ depend only on $\pi_1(M)$; in particular, is $\operatorname{TC}(L(p,q))=\operatorname{TC}(L(p,1))$?
