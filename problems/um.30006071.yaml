title: The Grothendieck–Katz p-Curvature Conjecture
field: mathematics
tier: prose
statement: Let $A$ be a matrix with entries in $\mathbb Q(z)$. Are all solutions of $(\partial/\partial z-A)\mathbf f(z)=0$ algebraic if and only if the reduction of $(\partial/\partial z-A)^p$ vanishes for almost all primes $p$?
