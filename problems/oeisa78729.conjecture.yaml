schema: 1
id: oeisa78729.conjecture
title: Least $k > 0$ such that $(k+1)(k+2)\cdots(k+n) + 1$ is prime
field: mathematics
tier: proof
statement: |-
  $(k+1)(k+2)(k+3)(k+4) + 1 = (k^2 + 5k + 5)^2$, which is never prime. Hence $a(4) = 0$.
  Conjecture: $a(n) = 0$ if and only if $n = 4$.
