lean:
  module: FormalConjectures.OEIS.«78729»
  decl: OeisA78729.conjecture
  statement: "theorem conjecture (n : ℕ) (hn : 0 < n) : a n = 0 ↔ n = 4"
  context:
    - open OeisA78729
  definitions:
    - name: OeisA78729.a
      kind: def
      text: |-
        /-- Least positive integer $k$ such that $(k+1)(k+2)\cdots(k+n) + 1$ is prime, or 0 if no such $k$ exists. -/
        noncomputable def a (n : ℕ) : ℕ :=
          if h : ∃ k, 0 < k ∧ (∏ i ∈ Finset.range n, (k + i + 1) + 1).Prime then
            Nat.find h
          else
            0
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/OEIS/78729.lean#L36
