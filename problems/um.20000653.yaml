title: A conductor-normalized hybrid phase diagram
field: mathematics
tier: prose
statement: "**Strong hybrid bounds for \\(L(1/2,f\\times\\chi)\\).** Let \\(f\\) be a holomorphic or Hecke--Maass cusp form of level \\(p\\), and \\(\\chi\\) be a primitive Dirchlet character of level \\(q\\). Conrey--Iwaniec obtained a Weyl type subconvexity bound for \\(L(1/2,f\\times\\chi)\\) when \\(p=q\\), while Khan has obtained a Burgess-type bound when \\(p\\asymp q\\), and Yang has proved a Burgess-type bound over number fields in a similar range. Prove strong hybrid bounds for other ranges of \\(p\\) and \\(q\\)."
