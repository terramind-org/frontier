title: Exponential Degree Growth in Composita of Fibers
field: mathematics
tier: prose
statement: |-
  Let $X/\mathbb Q$ be a curve of genus $g$, let $t\in\mathbb Q(X)$ have degree $\nu\geq2$, and choose points $P_n$ with $t(P_n)=n$. If $t$ has a finite critical value outside $\mathbb Q$, or if $\overline{\mathbb Q}(X)/\overline{\mathbb Q}(t)$ is nonabelian, does there exist $c(g,\nu)>0$ such that

  $$[\mathbb Q(P_1,\ldots,P_N):\mathbb Q]\geq e^{c(g,\nu)N}$$

  for all sufficiently large $N$?
