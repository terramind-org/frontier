title: Finite Length of Permutation Modules over Arbitrary Fields
field: mathematics
tier: prose
statement: Let $M$ be an $\omega$-categorical structure, let $G=\operatorname{Aut}(M)$, and let $W$ be an oligomorphic $G$-set. Is the permutation module $F[W]$ of finite length over $FG$ for every field $F$?
