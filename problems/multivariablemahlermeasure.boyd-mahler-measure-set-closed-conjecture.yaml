lean:
  module: FormalConjectures.Wikipedia.MultivariableMahlerMeasure
  decl: MultivariableMahlerMeasure.boyd_mahler_measure_set_closed_conjecture
  statement: |-
    theorem boyd_mahler_measure_set_closed_conjecture :
        IsClosed (⋃ n, intLogMahlerSet n)
  context:
    - open MultivariableMahlerMeasure
    - open MeasureTheory MvPolynomial
  definitions:
    - name: MultivariableMahlerMeasure.intLogMahlerSet
      kind: def
      text: |-
        /-- Boyd's value set $L_n = \{m(P) : P \in \mathbb{Z}[X_0, \dots, X_{n-1}] \setminus \{0\}\}$. -/
        def intLogMahlerSet (n : ℕ) : Set ℝ :=
          {m : ℝ | ∃ P : MvPolynomial (Fin n) ℤ,
            P ≠ 0 ∧ m = logMahlerMeasure (MvPolynomial.map (Int.castRingHom ℂ) P)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/MultivariableMahlerMeasure.lean#L63
