title: An exact cyclic r-star reduction for higher-size Angelesco equilibrium problems
field: mathematics
tier: prose
statement: |-
  Study potential theory for \(k\times k\) Riemann--Hilbert problems for
  \(k>2\) when multiple orthogonal polynomials are involved.

  **Recovered research program.**  For RHPs of size \(k=r+1>2\) arising from
  MOPs, identify the correct vector logarithmic-energy problem (masses,
  interaction coefficients, support and upper constraints, and external
  fields), prove existence and uniqueness or identify critical alternatives,
  derive its Euler--Lagrange and spectral-curve data, and use those data to
  construct the \(g\)-functions and sheet structure required for nonlinear
  steepest descent.  The official report emphasizes the external-source
  \(4\times4\) case, but the canonical wording also includes Angelesco,
  Nikishin, star, two-matrix, and other MOP systems.
