title: Threshold Constants for Asymmetric Random Ramsey Properties
field: mathematics
tier: prose
statement: Let $1<m_2(F_1)\le m_2(F_2)$ and put $m=m_2(F_1,F_2)=\max_{H\subseteq F_2,\,|V(H)|\ge2}|E(H)|/(|V(H)|-2+1/m_2(F_1))$. Does there exist $b>0$ such that for every $\varepsilon>0$, the probability of $G_{n,p}\to(F_1,F_2)$ tends to $0$ when $p\le(1-\varepsilon)bn^{-1/m}$ and to $1$ when $p\ge(1+\varepsilon)bn^{-1/m}$?
