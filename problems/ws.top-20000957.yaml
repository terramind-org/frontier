  \section{Four concyclic points and bounded Euclidean Ramsey witnesses}\label{20000957}
  {\small UnsolvedMath ID 20000957 · Combinatorics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For every four-point subset $X$ of a circle and every finite number of colors $r$, must there exist a dimension $N$ such that every coloring of $\mathbb R^N$ with $r$ colors contains a monochromatic congruent copy of $X$?
  \par\smallskip\textit{Formulation references:} \sref{20000957}{1}, \sref{20000957}{2}.
  \subsection{Short English statement}
  For every four-point subset $X$ of a circle and every finite number of colors $r$, must there exist a dimension $N$ such that every coloring of $\mathbb R^N$ with $r$ colors contains a monochromatic congruent copy of $X$?
