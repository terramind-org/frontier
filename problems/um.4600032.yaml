title: Embedding under a preimage bound
field: mathematics
tier: prose
statement: Let $S$ be a one-sided subshift and $T$ the full one-sided shift on $N$ symbols, with $h(S)<\log N$, and suppose no point of $S$ has more than $N$ preimages. Must $S$ be isomorphic to a subshift of $T$?
