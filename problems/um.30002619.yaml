title: Involutivity Obstructions for Normal Currents
field: mathematics
tier: prose
statement: Let $X(x,y,z)=(1,0,-x/2)$ and $Y(x,y,z)=(0,1,y/2)$ be the horizontal vector fields on the Heisenberg group $\mathbb H^1\cong\mathbb R^3$, and put $\xi=X\wedge Y$. If $T=\xi\wedge\mu$ is a normal $2$-current in $\mathbb R^3$, must $\mu$ be absolutely continuous with respect to Lebesgue measure? More generally, can normal currents that fail the Frobenius-type involutivity conclusion for integral currents be classified, and what remains true when the vector field has less than $C^1$ regularity or involutivity is defined without Lie brackets?
