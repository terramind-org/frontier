title: Fargues’ Cohomological Conjectures for the Curve
field: mathematics
tier: prose
statement: For an étale abelian torsion sheaf $\mathcal F$ on $X_{E,F}^{\mathrm{alg}}$, prove that $H^i(X_{E,F}^{\mathrm{alg}},\mathcal F)=0$ for $i\geq 3$; that adification gives $H^i(X_{E,F}^{\mathrm{alg}},\mathcal F)\cong H^i(X_{E,F}^{\mathrm{ad}},\mathcal F^{\mathrm{ad}})$ for $i\geq 0$; and that the function field $E(X_{E,F}^{\mathrm{alg}})$ is $C_1$.
