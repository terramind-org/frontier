title: Khintchine Theory for Symbolic Self-Similar Approximation
field: mathematics
tier: prose
statement: |-
  Let $\phi_1,\ldots,\phi_N$ be contractions of $\mathbb R^n$ with attractor $F$, choose $x\in F$ and an approximating function $\psi$ on finite words, and let $W(x,\psi)$ be the set of points of $F$ lying in
  $$
  B\bigl(\phi_{s_1}\circ\cdots\circ\phi_{s_k}(x),\psi(s_1,\ldots,s_k)\bigr)
  $$
  for infinitely many words. Classify the functions $\psi$ for which $W(x,\psi)$ is large, and establish a Khintchine theory when $\dim_{\mathrm H}F$ equals the similarity dimension.
