title: "Henon Maps: Open Problems — Question 43"
field: mathematics
tier: prose
statement: |-
  A complex manifold which admits a holomorphic atlas whose transition maps are restriction of birational maps
  of $\mathbb{P}^d_\mathbb{C}$ is said to carry a birational structure.

  The following problem is extracted from [dloussky].

  Does any non-K\"ahler compact complex surface admit a birational structure?
