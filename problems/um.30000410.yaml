title: Bounded Local Solutions of Global Differential Modules
field: mathematics
tier: prose
statement: Let $(M,\partial_M)$ be a global differential module over the global differential ring $(\mathcal O_{F'},\partial_F)$, and suppose its $p$-curvature vanishes for almost all primes $p$. Near every nonsingular prime of degree one, are the solutions of $M$ locally bounded power series over the constant field?
