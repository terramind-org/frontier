title: Motion and Trace of Real Divisors
field: mathematics
tier: prose
statement: Let $X$ be a nonsingular projective real algebraic curve and let $A$ be a simple real divisor. How can $A$ move within its linear-equivalence class while remaining simple and real? What is $\pi_1(\operatorname{Emb}(A,X))$, and what can be the image of its trace homomorphism to $H_1(X)$?
