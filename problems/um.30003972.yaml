title: Equivalence of Graphs in Strong Ramsey Games
field: mathematics
tier: prose
statement: Determine the largest $t=t(k)$ such that $K_k$ is 2-equivalent to $K_k+K_{1,t}$, and the largest $t=t(k)$ for which some tree $T$ on $t$ vertices satisfies $K_k\sim_2 K_k+T$; moreover, for each $q\ge 2$, do there exist two non-isomorphic connected $q$-equivalent graphs?
