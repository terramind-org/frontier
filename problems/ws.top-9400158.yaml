  % UnsolvedMath ID 9400158; source catalogue code AMR-093-0158
  \setcounter{section}{9400157}
  \section{Are there infinitely many prime quadruplets}\label{9400158}
  {\small\sffamily UnsolvedMath ID 9400158 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A prime quadruplet is a tuple $(p,p+2,p+6,p+8)$ whose four entries are prime.
  \paragraph{Statement recorded in the supplied source.}
  Are there infinitely many primes $p$ for which all four entries of this tuple are prime? \sref{9400158}{2}
  \subsection{Short English statement}
  Do infinitely many primes start the four-prime pattern with offsets zero, two, six and eight?
