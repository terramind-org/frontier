title: L-Space Conjecture for Rational Homology Spheres
field: mathematics
tier: prose
statement: "For every irreducible rational homology sphere $Y$, are the following equivalent: $Y$ supports no taut foliation, $Y$ is an L-space, and $\\pi_1(Y)$ is not left-orderable?"
