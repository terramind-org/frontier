title: Kourovka Notebook Problem 4.19
field: mathematics
tier: prose
statement: |-
  Denote by ${\mathfrak{C}}$ the class of all groups $G$
  with the following property: if $U$ and $V$ are maximal locally
  soluble subgroups of $G$, then $U$ and $V$ are conjugate in $G$
  (or at least isomorphic). It is almost obvious that a finite group
  $G$ belongs to ${\mathfrak{C}}$ if and only if $G$ is soluble. What can
  be said about the locally finite groups in ${\mathfrak{C}}$?
