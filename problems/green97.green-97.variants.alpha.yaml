lean:
  module: FormalConjectures.GreensOpenProblems.«97»
  decl: Green97.green_97.variants.alpha
  statement: |-
    theorem green_97.variants.alpha :
        Tendsto (fun n : ℕ ↦ (numQueens n : ℝ) ^ ((1 : ℝ) / n) / n) atTop
          (𝓝 (Real.exp (-green_97.variants.alpha.answer)))
  context:
    - open Green97
    - open Green97.green_97
    - open Green97.green_97.variants
    - open Filter Asymptotics
    - open scoped Nat Topology
  definitions:
    - name: Green97.numQueens
      kind: def
      text: |-
        /--
        `numQueens n` is $Q(n)$, the number of ways to place $n$ non-attacking queens on an $n \times n$
        chessboard (`IsQueens`). For $n = 0$ there is one (empty) placement.
        -/
        def numQueens (n : ℕ) : ℕ :=
          (Finset.univ.filter fun σ : Equiv.Perm (Fin n) ↦ IsQueens σ).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/GreensOpenProblems/97.lean#L60
