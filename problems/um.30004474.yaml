title: Frobenius-Stable Loci and Dense Arithmetic Points
field: mathematics
tier: prose
statement: Let $X/\overline{\mathbb F}_p$ be smooth, connected, and of finite type; let $S_{\bar\rho}$ parametrize semisimple $\overline{\mathbb Q}_\ell$-local systems with residual representation $\bar\rho$; and let $A_{\bar\rho}$ be its arithmetic points. If a Zariski-closed subset $Z\subset S_{\bar\rho}$ is stable under a power of Frobenius, is $A_{\bar\rho}\cap Z$ Zariski dense in $Z$?
