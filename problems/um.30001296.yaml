title: Frobenius Polynomials of Degeneration Pencils
field: mathematics
tier: prose
statement: Let $f_0\in\mathbb Q[x_0,\ldots,x_{n+1}]$ be homogeneous of degree $d$, put $f_1=x_0^d+\cdots+x_{n+1}^d$, and consider the pencil of degree-$d$, dimension-$n$ hypersurfaces $$(1-t)f_0+tf_1=0,$$ which is generically smooth and may degenerate at $t=0$. For a suitable prime $p$, let $F$ and $N$ be the Frobenius and nilpotent monodromy matrices in the associated limiting cohomology, with entries in $\mathbb Q_p$ and $\mathbb Q$, respectively, and satisfying $NF=pFN$. Does $\det(1-TF|_{\ker N})$ have integer coefficients, with each reciprocal root having complex absolute value $p^{i/2}$ for an integer $i$ satisfying $0\leq i\leq n$?
