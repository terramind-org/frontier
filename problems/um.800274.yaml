statement: Let $H_d$ denote the space of holomorphic maps $f:\mathbb{P}^2 \rightarrow \mathbb{P}^2$ of degree d. This is a finite dimensional space parametrized by the coefficients. Does the set of $ f\in H_d$ with infinitely many attractive basins have measure zero?
