title: Elementary Proof of the Closed Walk Stacking Criterion
field: mathematics
tier: prose
statement: Find an elementary proof that a closed walk $W$ has a stacking in a graph $G$ if and only if $W\neq kW'$ for every walk $W'$ and every integer $k\geq 2$.
