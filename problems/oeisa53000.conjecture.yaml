  definitions:
    - name: OeisA53000.a
      kind: def
      text: |-
        /-- $a(n) = (\text{smallest prime} > n^2) - n^2$. -/
        noncomputable def a (n : ℕ) : ℕ :=
          (sInf {p | Nat.Prime p ∧ n ^ 2 < p}) - n ^ 2
