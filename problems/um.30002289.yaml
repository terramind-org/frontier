title: Endpoint Regularity for $p$-Laplacian Gradients
field: mathematics
tier: prose
statement: For $p$-harmonic functions in dimensions $n\geq3$, can one construct higher-dimensional analogues of the planar least-regular examples and determine their optimal gradient regularity? In particular, does $V(\nabla u)=|\nabla u|^{(p-2)/2}\nabla u$ belong locally to $C^{1/2}$ in every dimension?
