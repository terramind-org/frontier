title: Billiards and Quantitative Symplectic Geometry — Serge Tabachnikov — Problem 8
field: mathematics
tier: prose
statement: |-
  **Approximating a convex curve by polygons with respect to the symmetric difference..** A popular topic in convex geometry is the approximation of smooth convex closed curves by polygons, see [Gr]. The quality of approximation by $n$-gons may be measured by the difference of perimeters or areas, and the polygons may be inscribed or circumscribed. This leads to four functions of $n$, and these four functions correspond to the minimal actions of four billiards: the conventional, Birkhoff, billiards, the outer billiards, the symplectic billiards, and the outer length billiards (see [AT24,BBF] about these lesser studied billiards).

  Consider the approximation of an oval by $n$-gons where the quality of approximation is measured by the area of the symmetric difference.

  Problem: *is the resulting function of $n$ related to some billiard-like dynamical system?*
