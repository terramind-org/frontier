title: A tame positive-characteristic form of Milnor's four-point criterion
field: mathematics
tier: prose
statement: |-
  **Milnor's characterization of Lattès maps with four postcritical points.**

  - no critical point is postcritical;
  - all critical points are simple.

  Does this hold over positive characteristic? What does one get from the dual of Frobenius in the inseparable case? What happens in characteristics \(2\) and \(3\), where \(\operatorname{Aut}(E)\) can be nonabelian?
