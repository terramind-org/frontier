statement: |-
  \section*{A subexponential mixing bound from typical low-temperature SK starts}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every fixed $\beta >1$ in Gaussian SK, is there $c_\beta >0$ independent of n and realized disorder such that a Gibbs-sampled initial configuration has mixing time at most $\exp (n^{1-c_\beta })$, with joint probability tending to one?
  \subsection{Short English statement}
  For every fixed $\beta >1$ in Gaussian SK, is there $c_\beta >0$ independent of n and realized disorder such that a Gibbs-sampled initial configuration has mixing time at most $\exp (n^{1-c_\beta })$, with joint probability tending to one?
