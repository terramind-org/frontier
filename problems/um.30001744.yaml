title: Long-Time Action Preservation for Fourier Splitting of NLS
field: mathematics
tier: prose
statement: For a fully discrete Fourier splitting method for the one-dimensional cubic nonlinear Schrödinger equation, let $I_j^{K,n}=|\xi_j^n|^2$ denote the numerical actions, with $K$ prime. A bound $|I_j^{K,n}-I_j^{K,0}|\leq C\varepsilon$ is known for $n\tau\leq T/\varepsilon$. Does a comparable action-preservation bound hold up to times of order $\varepsilon^{-r}$ for large $r$?
