title: "Henon Maps: Open Problems — Problem 12"
field: mathematics
tier: prose
statement: |-
  Very recently, in [BSt], the authors developed a kneading theory for the H\'enon maps $H_{a,b}$ within a set of parameters $\mathcal{WY}$
  for which Wang and Young proved the existence of a strange attractor.
  This set has positive measure and consist of maps which are strongly dissipative.
  We refer to [BSt] and [WY] for details.

  Describe the set of kneading sequences $\mathfrak{K}$ of the H\'enon map $H_{a,b}$, with $(a,b) \in \mathcal{WY}$.
