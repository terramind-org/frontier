statement: |-
  State Skein algebra of bigons

  Find skeins representing the basis for the isomorphism
  “Stated Skein Algebra of bigon \(\cong O_q(SL_n)\) for \(n\geq 3\)” where \(O_q(SL_n)\) has Kashiwara-Lusztig canonical basis.
