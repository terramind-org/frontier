title: Radial zero curvature as a finite Jacobi-operator condition
field: mathematics
tier: prose
statement: |-
  Its boundaries matter.

  1. The opening paragraph is a **remark continuing Question 6.2.1**, whose actual question occurs in the preceding canonical records. It asks what can be inferred, without assuming nonpositive curvature and possibly in higher dimensions, from either
     \[
     K_{\gamma(t)}(\sigma)=0\quad\text{for every two-plane }\sigma\subset T_{\gamma(t)}M,
     \]
     or the weaker radial condition
     \[
     K_{\gamma(t)}(\dot\gamma(t),v)=0\quad(v\perp\dot\gamma(t)). \tag{R}
     \]
  2. Section 6.3 asks Eberlein's flat-closing question: if a compact rank-one manifold of nonpositive curvature contains an isometrically immersed Euclidean plane, must it contain a totally geodesically immersed flat torus?
  3. Section 6.4 asks whether the Besson--Courtois--Gallot degree/volume-entropy rigidity theorem extends from negatively curved locally symmetric targets to higher-rank symmetric spaces of noncompact type.
  4. The final two sentences merely begin Section 6.5 by defining \(N(T)\), the number of free homotopy classes containing zero-curvature closed geodesics. The actual Knieper question and its formula occur in the next canonical record, AIM-GEOMETRY-0239, and are not claimed here.

  The input's garbled expression `h4 > vol Vol` is reconstructed from the original PDF and Merlin's paper as
  \[
   h_{\mathrm{vol}}(g)^4\operatorname{Vol}(M,g),
  \]
  the four-dimensional instance of the scale-invariant normalized volume entropy \(h_{\mathrm{vol}}(g)^n\operatorname{Vol}(M,g)\).
