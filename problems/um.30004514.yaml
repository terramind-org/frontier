title: Barycentric Hyperplanes Through Convex Body Centroids
field: mathematics
tier: prose
statement: If $K\subset\mathbb{R}^n$ is a convex body, does the barycenter of $K$ always lie on at least $n+1$ distinct barycentric hyperplanes, meaning hyperplanes through it for which it is the barycenter of the corresponding section $K\cap h$?
