title: Quantum Invariants and Boundary Character Varieties
field: mathematics
tier: prose
statement: Let $M$ be a three-manifold with boundary $F$ and let $G$ be semisimple. Do the Witten–Reshetikhin–Turaev vectors $I_{G,r}(M)\in V_{G,r}(F)$ over all levels $r$ determine the image of the character variety $X_G(M)$ in $X_G(\partial M)$?
