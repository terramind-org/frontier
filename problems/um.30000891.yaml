title: Exact Dimensions of Secant Cones
field: mathematics
tier: prose
statement: Let $A\subset\mathbb{N}^m$ have cardinality $n$ and lie on an affine hyperplane, let $f=(x^\alpha)_{\alpha\in A}$ be the associated monomial map, and let $C$ be the closure of its image. For a $k$-tuple $\ell=(\ell_1,\ldots,\ell_k)$ of affine-linear forms, set $C_i(\ell)=\{\alpha\in A:\ell_i(\alpha)<\ell_j(\alpha)\text{ for every }j\neq i\}$. The tropical method gives $\dim(kC)\geq\sum_{i=1}^k(1+\dim\operatorname{Aff}_{\mathbb{R}}C_i(\ell))$. Does maximizing the right-hand side over all such $\ell$ always give $\dim(kC)$?
