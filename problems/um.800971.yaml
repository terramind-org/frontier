title: Open Problems and Questions about Geodesics — Question 52
field: mathematics
tier: prose
statement: |-
  To the best of our knowledge, the existence of a closed geodesic on a Lorentzian manifold is a quite complicated problem and nothing is known in dimensions $\ge 3$. In dimension 2, a closed orientable manifold with a metric of signature $(+,-)$
  is homeomorphic to the torus. By [Suhr2013a], every Lorentzian 2-dimensional torus has at least two simple closed geodesics one of
  which is definite, i.e. timelike or spacelike. Moreover, explicit examples show the optimality of this claim.

  We therefore ask the following

  *Does every closed Lorentzian manifold have at least one closed geodesic?*
