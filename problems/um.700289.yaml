title: Kourovka Notebook Problem 5.5
field: mathematics
tier: prose
statement: |-
  If
  $G$ is a finitely generated abelian-by-polycyclic-by-finite group,
  does there exist a finitely generated metabelian group $M$ such
  that $G$ is isomorphic to a subgroup of the automorphism group of
  $M$? If so, many of the tricky properties of $G$ like its residual
  finiteness would become transparent.
