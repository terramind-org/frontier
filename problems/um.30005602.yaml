title: Exact Bases with Exponential-Polyhomogeneous Asymptotics
field: mathematics
tier: prose
statement: For generalized semiclassical ordinary differential operators $P_h=\sum_{k=0}^mC_k(x,h)\partial_x^k$, prove that $\ker P_h$ has a basis of exact solutions with the same exponential-polyhomogeneous asymptotics as the corresponding quasimodes.
