title: Effective characteristic refinement and exact Aut-Out transfer for free-group congruence kernels
field: mathematics
tier: prose
statement: |-
  **Problem 3.4.** Does every finite index subgroup contain one of these \(\Gamma\)?

  Mladen Bestvina asked if there is an effective way to construct these subgroups. Verbal subgroups, or pass to Burnside group, suggested Martin Bridson. Karen Vogtmann commented that you would classify characteristic subgroups of \(\operatorname{Out}(F_n)\).

  Bridson offered a baby question in that direction: if \(n\geq 4\), is \(\operatorname{Out}(F_n)\) large? Meaning, does there exist a finite-index subgroup which acts on a tree, thus maps onto a free group?
