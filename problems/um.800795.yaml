title: Branko Grunbaum in Many Dimensions — Conjecture 2
field: mathematics
tier: prose
statement: |-
  The Four Color Theorem for planar graphs is equivalent to the statement that the dual graph of every triangulated $2$-sphere is $3$-edge colorable. This is essentially Tait's 1880 observation that the Four Color Theorem is equivalent to showing that every cubic bridgeless planar graph is $3$-edge colorable [Tait1880].

  In 1968, Gr\"unbaum conjectured a beautiful generalization.

  If $ G $ is a simple loopless triangulation of an orientable surface $S$, then the dual graph of $ G $ is 3-edge-colorable.
