title: Northcott Property for Bounded-Degree Composita
field: mathematics
tier: prose
statement: Let $\mathbb Q^{(d)}$ be the compositum of all extensions of $\mathbb Q$ of degree at most $d$; does it have Property (N), meaning that for every $X\geq1$ only finitely many elements have absolute multiplicative Weil height $H(\alpha)<X$?
