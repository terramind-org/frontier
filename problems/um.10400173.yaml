statement: (N. Sato) Find a subfactor which can distinguish lens spaces L(7, 1) and L(7, 2). Moreover, find a subfactor to classify 3-manifolds as well as possible. In the lattice field theory, Ponzano and Regge [332] construc ted a state sum model for SU (2) and investigated an asymptotic behavior of the model. Some infinite depth subfactors are manageable in the sense of growth rate (amenability). Such subfactors are called strongly amenable. The strong amen- ability condition might be enough to control the asymptotic behavior of the state sum model constructed from a strongly amenable subfac tor.
