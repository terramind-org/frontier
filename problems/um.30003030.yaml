title: Geometry of Lattices from Finite Abelian Groups
field: mathematics
tier: prose
statement: Given a finite Abelian group G and $S=\{0=g_0,g_1,\ldots,g_{n-1}\}\subseteq G$, determine the geometric properties of $L_G(S)=\{x\in A_{n-1}:\sum_{j=1}^{n-1}x_jg_j=0\}$, including its minimum norm and determinant, number of minimal vectors, well-roundedness, minimal-vector bases, and automorphism group.
