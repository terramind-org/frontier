title: Aperiodicity from Cohomological Trace Density in Delone Hulls
field: mathematics
tier: prose
statement: Let $P$ be a repetitive finite-local-complexity Delone set whose hull translation action is uniquely ergodic with ergodic measure $\mu$. Is $P$ aperiodic if and only if $\tau_\mu^*(\check H^1(\Omega_P,\mathbb Z))$ is dense in $\mathbb R^d$?
