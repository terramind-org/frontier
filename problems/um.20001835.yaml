id: um.20001835
title: Twisted-product pieces and the missing global-split branch
field: mathematics
tier: prose
statement: |-
  Let \(M^3\) be a closed manifold. Outside flat points, it splits locally as \(\Sigma\times\mathbb R\). Does there exist a collection of totally geodesic flat surfaces \(S_1,\ldots,S_k,\ldots\) such that
  \[
  M\setminus(S_1\cup\cdots\cup S_k\cup\cdots)
  \text{ is }(\Sigma\times\mathbb R)/\text{group}?
  \]
  where \(\Sigma\) is a surface (with possibly finitely or infinitely many components) with boundary a union of closed geodesics.

  Moreover, if \(M\) has nonnegative curvature, then is it diffeomorphic to a lens space?
