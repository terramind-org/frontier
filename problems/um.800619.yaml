title: Selection Principles in Mathematics — Problem 47 ([tautau, ShTb768])
field: mathematics
tier: prose
statement: |-
  The study of $\tau^*$-covers, a variant of $\tau$-covers,
  led to the following problem.
  A family $\mathcal{F}\subseteq{[\mathbb{N}]^{\aleph_0}}$ is *linearly refinable*
  if for each $A\in\mathcal{F}$ there exists an infinite subset
  $\hat A\subseteq A$ such that the family $\hat\mathcal{F} = \{\hat A : A\in\mathcal{F}\}$ is
  linearly (quasi)ordered by $\subseteq^*$.
  $\mathfrak{p}^*$ is the minimal size of a centered family
  in ${[\mathbb{N}]^{\aleph_0}}$ which is not linearly refinable.

  $\mathfrak{p} = \min\{\mathfrak{p}^*,\mathfrak{t}\}$, and $\mathfrak{p}^*\le\mathfrak{d}$ [tautau].

  Is $\mathfrak{p}=\mathfrak{p}^*$?
