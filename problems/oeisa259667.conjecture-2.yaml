lean:
  module: FormalConjectures.OEIS.«259667»
  decl: OeisA259667.conjecture_2
  statement: |-
    theorem conjecture_2 (k : ℕ) :
        a (2 ^ k - 1) = 5 ↔ k = 2 ∨ k = 8
  context:
    - open OeisA259667
    - open Nat
  definitions:
    - name: OeisA259667.a
      kind: def
      text: |-
        /-- $a(n) = C_n \bmod 6$, where $C_n$ is the $n$-th Catalan number. -/
        def a (n : ℕ) : ℕ :=
          _root_.catalan n % 6
