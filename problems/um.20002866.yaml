title: Constant-degree denominator removal and stable polynomial endpoints
field: mathematics
tier: prose
statement: Let \(f:\mathbb B^n\to\mathbb B^N\) be a proper rational map. Is \(f\) homotopic to a polynomial map \(p\) of the same degree? That is, for every \(t\in[0,1]\), each \(f_t:\mathbb B^n\to\mathbb B^N\) is proper, with \(f_0=f\) and \(f_1=p\).
