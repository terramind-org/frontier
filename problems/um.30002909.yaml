title: Virtual Surjectivity and Generalized Torelli Kernels
field: mathematics
tier: prose
statement: For a finite quotient $p:\pi_1(\Sigma_g)\twoheadrightarrow H$, is the induced Prym representation $\rho_{H,p}$ virtually surjective onto every component of the centralizer of $H$ in the relevant symplectic group? Are the kernels of these representations, viewed as generalized Torelli groups, finitely generated?
