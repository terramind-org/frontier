title: Research Problems in Function Theory — Problem 7.3
field: mathematics
tier: prose
statement: "Let $z_i$, $1\\leq i\\leq n$ be a finite sequence of complex numbers such that $|z_i|\\leq1$. Set \\[S_k=\\sum^n_{i=1}z^k_i.\\] Can we have $$ \\max_{2\\leq k\\leq n+1}|S_k|<A^{-n}, $$ where $A$ is an absolute constant greater than one? If we assume $z_1=1$, $|z_i|\\leq1$, $2\\leq i\\leq n$, then ([source label: 7.1]) can be satisfied. See Tur\\'an . (P. Erd\\\"os)"
