title: Open Problems on Central Simple Algebras — Problem 17
field: mathematics
tier: prose
statement: |-
  Determine structural conclusions about central simple algebras
  from essential ($p$-)dimension bounds.

  - Calculate bounds for $\mathrm{ed}(\operatorname{CPAlg}_n)$ and $\mathrm{ed}(\mathrm{Alg}_G)$.

  - Compute the difference $\mathrm{ed}(\mathrm{Alg}_G)-\mathrm{ed}(G)$.

  - If $\mathrm{ed}(\operatorname{CPAlg}_n)=\mathrm{ed}(\operatorname{PGL}_n)$, determine whether every algebra of
  degree $n$ over every extension of $F$ is a crossed product.
