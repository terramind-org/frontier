lean:
  module: FormalConjectures.OEIS.«262880»
  decl: OeisA262880.conjecture_2
  statement: |-
    theorem conjecture_2 (p : ℕ × ℕ) (hp : p ∈ pairs2) (n : ℕ) :
        ∃ w x y z : ℕ, n = Nat.triangular w + 2 * x ^ 3 + p.1 * y ^ 3 + p.2 * z ^ 3
  context:
    - open OeisA262880
  definitions:
