title: Equal Sum Counts for Increasing Ratio Sequences
field: mathematics
tier: prose
statement: Given real numbers $1<a_1<a_2<\cdots$ whose successive ratios $a_{n+1}/a_n$ are increasing, what can be said about the number of solutions of $a_{i_1}+\cdots+a_{i_k}=a_{j_1}+\cdots+a_{j_k}$?
