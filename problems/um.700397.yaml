title: Kourovka Notebook Problem 6.55
field: mathematics
tier: prose
statement: |-
  A group $G$ of the form $G=F\leftthreetimes H$ is
  said to be a *Frobenius group with kernel $F$ and complement*
  $H$ if $H \cap H^g=1$ for any $g \in G\setminus H$ and $F\setminus
  \{ 1\} =G\setminus \bigcup\limits_{g\in G} H^g$. Do there exist
  Frobenius $p
  $-groups?
