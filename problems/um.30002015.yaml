title: Cohomological Disjointness for Parabolic Deligne–Lusztig Varieties
field: mathematics
tier: prose
statement: For a parabolic Deligne–Lusztig variety $X_P$, prove that the cohomology modules $H_c^i(X_P,\mathbb{Q}_\ell)$ are pairwise disjoint and that $\operatorname{End}_{G^F}\!\left(\bigoplus_i H_c^i(X_P,\mathbb{Q}_\ell)\right)\cong\mathbb{Q}_\ell W_S$.
