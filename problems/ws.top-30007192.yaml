statement: |-
  \section*{Simple overgroups of type F infinity for decidable word problems}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Does every finitely generated group with decidable word problem embed in a nontrivial simple group H admitting a classifying CW complex with finitely many cells in each dimension?
  \subsection{Short English statement}
  Does every finitely generated group with decidable word problem embed in a nontrivial simple group H admitting a classifying CW complex with finitely many cells in each dimension?
