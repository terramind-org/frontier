title: Fixed-point marks refute the real-signature and plane-branch comparisons
field: mathematics
tier: prose
statement: |-
  The record asks:

  1. If a finite group \(G\) acts linearly on \(V=\mathbb C^n\) and
     \(f:V\to V\) is a \(G\)-equivariant polynomial map with an isolated zero at
     \(0\), is the \(G\)-module
     \[
     Q(f)=\mathbb C[[x_1,\ldots,x_n]]/(f_1,\ldots,f_n)
     \]
     equal in \(R_{\mathbb C}(G)\) to the permutation representation obtained by
     linearizing the Burnside-ring-valued stable local degree?
  2. Over \(\mathbb R\), is the \(G\)-signature of the
     Eisenbud--Levine--Khimshiashvili (ELK) form on \(Q(f)\) equal to the real
     linearization of that stable local degree?
  3. If \(f=\nabla F:\mathbb C^2\to\mathbb C^2\) for a \(G\)-invariant equation
     \(F=0\) of an isolated plane-curve singularity, is the \(G\)-set of analytic
     branches equal, as a Burnside class, to the stable local degree of
     \(\nabla F\)?
