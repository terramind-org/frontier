title: Continuous-time
field: mathematics
tier: prose
statement: For a continuous-time Markov semigroup $(m_x^t)$ define $$\kappa(x,y)=\liminf_{t\to0^+}\frac1t\frac{d(x,y)-T_1(m_x^t,m_y^t)}{d(x,y)}.$$ Under a natural assumption such as non-explosion, does this definition give the standard elementary consequences of positive coarse Ricci curvature for both diffusions and jump processes, even with an unbounded generator? Is positivity of $\kappa$ enough to imply non-explosion?
