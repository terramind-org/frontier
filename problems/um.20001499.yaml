title: BNS symmetry, separability, and a subgroup-tameness reduction
field: mathematics
tier: prose
statement: |-
  **Hyperbolic case.** If $G$ is a hyperbolic free-by-cyclic group with irreducible monodromy then $G$ is LERF if and only if the BNS invariant of every finite index subgroup of $G$ is symmetric.

  The adjacent AIM background page <http://aimpl.org/freebycyclic/6/> gives the Cayley-graph definition of the Bieri--Neumann--Strebel invariant. We write

  \[
   S(V)=\bigl(\operatorname{Hom}(V,\mathbb R)\setminus\{0\}\bigr)/\mathbb R_{>0}
  \]

  and interpret “symmetric” as antipodal symmetry
  \(\Sigma^1(V)=-\Sigma^1(V)\) in $S(V)$.

  There is one important scope distinction. In current usage, an outer automorphism $\Phi\in\operatorname{Out}(F_n)$ is **irreducible** if it preserves no nontrivial free-factor system (equivalently, no free splitting of the form described by Hughes--Kudlinska). It is **fully irreducible** if every positive power is irreducible. The AIM hypothesis says irreducible, not fully irreducible. Hyperbolicity separately forces the monodromy to be atoroidal. The conditional theorem below is stated first in the fully irreducible subclass because the available subgroup-tameness conjecture has exactly that hypothesis; an explicitly analogous tameness assumption gives the same implication in the merely irreducible case.
