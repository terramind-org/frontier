title: Cohomological Dimensions of Elementary Amenable Groups
field: mathematics
tier: prose
statement: "Let $G$ be an elementary amenable group and $k$ a commutative ring. Is $\\operatorname{cd}_k(G)<\\infty$ equivalent to finite Hirsch length, $|G|<\\aleph_\\omega$, and invertibility in $k$ of every finite-subgroup order? For an arbitrary group $G$, is $\\operatorname{hd}_k(G)\\leq1$ equivalent to $G$ being a filtered colimit of groups of $k$-cohomological dimension at most one? Finally, for elementary amenable $G$, is $\\operatorname{cd}_k(G)=2$ equivalent both to an action on a contractible $2$-complex with finite stabilizers whose orders are invertible in $k$, and to one of the following: $G$ has a finite-index subgroup $\\langle x,y\\mid y^{-1}xy=x^n\\rangle$ for some nonzero integer $n$; $G$ has a countably infinite locally finite normal subgroup $T$ with $G/T$ infinite cyclic or infinite dihedral; or $G$ is locally finite of cardinality $\\aleph_1$?"
