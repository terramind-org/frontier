title: Open Problems in Wavelet Theory — Problem 1
field: mathematics
tier: prose
statement: |-
  One of the fundamental areas in the theory of wavelets is the investigation of properties of the collection of all wavelets as a subset of $L^2(\mathbb{R})$. The most prominent problem in this area was formulated independently by D. Larson and G. Weiss around the year 1995.

  Is the collection of all orthonormal wavelets (as a subset of the unit sphere in $L^2(\mathbb{R})$) path connected in
  $L^2(\mathbb{R})$ norm?
