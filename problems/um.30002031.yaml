title: Turán Densities of Hypergraph Daisies
field: mathematics
tier: prose
statement: Let $D_r$ be the $r$-daisy consisting of the six $r$-sets $A$ with $P\subset A\subset P\cup Q$ for an $(r-2)$-set $P$ and a disjoint $4$-set $Q$. How large can a family $\mathcal A$ of $r$-sets from an $n$-set be if it contains no copy of $D_r$?
