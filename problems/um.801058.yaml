title: "Henon Maps: Open Problems — Question 10"
field: mathematics
tier: prose
statement: |-
  As mentioned previously, for mildly dissipative real H\'enon maps the set of periodic points is dense
  in the union of the supports of the invariant probability measures [CP].
  The same property holds for any complex H\'enon maps [MR4142445].

  For any real H\'enon map, does the closure of the set of periodic orbits support all the invariant probability measures?
