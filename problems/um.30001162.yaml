title: Boundary Corrections to Li–Yau Eigenvalue Bounds
field: mathematics
tier: prose
statement: For Dirichlet Laplacian eigenvalues, can the Li–Yau lower bound for sums of eigenvalues be strengthened by a correction term involving boundary surface area? Do analogous boundary-measure corrections hold for sums of Neumann eigenvalues and for Berezin-type bounds?
