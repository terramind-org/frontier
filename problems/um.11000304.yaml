statement: Prove (or disprove) that the even Mumford-Morita-Miller classes e2i∈H 4i(Ig; Q) are non-trivial, in a suitable stable range, as cohomology classes of the Torelli group. The diﬃculty of the above problem comes from the now classical fact, proved by Johnson [ 40], that the abelianization of the Torelli group is very big, namely H1(Ig; Q)∼=UQ (g≥ 3). Observe that if Ig were perfect, then the above problem would have been easily solved by simply applying the Quillen plus construction to each group of the group extension (1) and then looking at the homotopy exact sequence of the resulting fibration. The work of Igusa [ 38] (in particular Corollary 8.5.17) shows a close connection between the above problem with another very important problem (see Problem 4.4 in § 4) of non-triviality of Igusa’s higher Franz-Reidemeister torsion classes in H 4i(IOutn; R) (Igusa uses the notation Out hFn for the group IOut n). We also refer to a recent work of Sakasai [ 95] which is related to the above problem. 22. Cohomological structure of the mapping class group and beyond 355 Next we recall the following two well-known problems about the structure of the Torelli group which are related to a foundational work of Hain [ 29].
