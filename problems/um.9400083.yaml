title: Manin conjecture
field: mathematics
tier: prose
statement: "Manin conjecture: if K-rational points on Fano variety are Zariski-dense subset, then the distribution of points of height: $H(x)\\leq B$ in any Zariski-open subset $U$ is proportional to $B \\log (B)^{r-1}$, where $r$ is rank of Picard group of that variety."
