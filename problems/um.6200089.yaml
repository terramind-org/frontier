title: Boundaries of Groups and Kleinian Groups — Problem 89
field: mathematics
tier: prose
statement: Suppose that ∆ is a developable triangle of groups, where all the cellgroups have Property T and so that all the links in the universal cover of T have λ1 > 1/2. Does it follow that π1(∆) has Property T?
