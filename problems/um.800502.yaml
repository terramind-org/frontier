title: Linear Systems and Eigenvalue Problems — Problem 11
field: mathematics
tier: prose
statement: |-
  Another reason for focusing on condition number reduction rather than ``improving'' the entire eigenvalue distribution by preconditioning is that the eigenvalue distribution is usually unknown in practical applications. Yet, the recent line of work in [GerMadNieStr19,GerNieStr20,GerNieStr22,NieStr24] has shown that for certain elliptic PDE model problems, for example $-\nabla\cdot (k(x)\nabla u)=f$ with $k(x)$ being a measurable, bounded, and uniformly positive function from ${\mathbb{R}}^d$ to ${\mathbb{R}}$, one can obtain the exact localization of the eigenvalues of the discretized operators (i.e., the matrices), and of the left-preconditioned matrices under Laplacian preconditioning. This approach yields new insights into the convergence of CG for the preconditioned systems.

  Several specific open problems that exist in this context are mentioned in [NieStr24, Section 9]. More generally, try to extend the approach in [GerMadNieStr19,GerNieStr20,GerNieStr22,NieStr24] to other types of PDEs or preconditioners.
