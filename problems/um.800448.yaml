title: Analysis of Boolean Functions — Symmetric Gaussian Problem
field: computer-science
tier: prose
statement: "Fix $0 \\leq \\rho, \\mu, \\nu \\leq 1$. Suppose $A,B \\subseteq \\mathbb{R}^n$ have Gaussian measure $\\mu$, $\\nu$ respectively. Further, suppose $A$ is centrally symmetric: $A = -A$. What is the minimal possible value of $\\operatorname{Pr}[\\mathbf{x} \\in A, \\mathbf{y} \\in B]$, when $(\\mathbf{x}, \\mathbf{y})$ are $\\rho$-correlated $n$-dimensional Gaussians?"
