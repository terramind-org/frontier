title: Equivalence of Weak Scalar-Curvature Notions for Continuous Metrics
field: mathematics
tier: prose
statement: Is the Ricci-flow-based $\beta$-weak notion of lower scalar-curvature bounds for $C^0$ metrics equivalent to Gromov's polyhedral formulation, locally or globally? For a metric near the origin in $\mathbb{R}^n$ of the form $g_{ij}(x)=\delta_{ij}+r^2G_{ij}(x/r)+O(|x|^{2+\eta})$, where $x^ix^jG_{ij}(x)=0$ on $S^{n-1}$, characterize explicitly when it has nonnegative scalar curvature at the origin in this weak sense.
