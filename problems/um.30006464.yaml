title: Short Coefficient Detection of Cusp-Form Norms
field: mathematics
tier: prose
statement: For every $\varepsilon>0$, prove that there is a constant $C=C(k,\varepsilon)>0$ such that every cusp form $f\in S_k(N)$ satisfies $\|f\|^2\ll_{k,\varepsilon}\sum_{n\leq C N^{1+\varepsilon}}|a_f(n)|^2$, without assuming squarefree level or Atkin–Lehner eigenform conditions.
