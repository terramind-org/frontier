title: Maximum Principle for Intermediate Riesz Kernels
field: mathematics
tier: prose
statement: |-
  For $s\in(1,d-1)$ and $K(x)=x/|x|^{s+1}$, does there exist $C>0$ such that every nonnegative smooth compactly supported function $f$ satisfies
  $$
  \sup_{x\in\mathbb R^d}|K*f(x)|\leq C\sup_{x\in\operatorname{supp}f}|K*f(x)|
  $$?
