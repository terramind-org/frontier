title: Haar squashability on nilpotent regular covers
field: mathematics
tier: prose
statement: |-
  **Question 12 (F. Ledrappier, O. Sarig).** Let \(\Gamma\) be a normal conilpotent subgroup of a uniform lattice in \(\mathrm{SL}(2,\mathbb R)\). Is the Haar measure nonsquashable?

  For general discrete subgroup \(\Gamma\subset \mathrm{SL}(2,\mathbb R)\), it is not known whether the Haar measure on \(\mathrm{SL}(2,\mathbb R)/\Gamma\) is nonsquashable, or whether there exist other nonsquashable \(u_t\)-ergodic Radon measures.
