title: Stable Superpolynomials for Khovanov–Rozansky Homology
field: mathematics
tier: prose
statement: For every knot $K$, do there exist finite polynomials $\overline{\mathcal{P}}_K\in\mathbb{Z}[a^{\pm1},q^{\pm1},t^{\pm1}]$ and $\mathcal{P}_K\in\mathbb{Z}_{\geq0}[a^{\pm1},q^{\pm1},t^{\pm1}]$ such that, for all sufficiently large $N$, the unreduced and reduced $\mathfrak{sl}(N)$ Khovanov–Rozansky Poincaré polynomials satisfy the following identities? $$\overline{\operatorname{KhR}}_N(K;q,t)=\frac{\overline{\mathcal{P}}_K(q^N,q,t)}{q-q^{-1}},\qquad \operatorname{KhR}_N(K;q,t)=\mathcal{P}_K(q^N,q,t)$$.
