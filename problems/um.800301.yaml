title: Group Actions on 1-Manifolds — Question 18
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finitely-generated group of $C^2$ orientation-preserving circle diffeomorphisms. Does there exist a
  non-degenerate probability distribution on $G$ for which the stationary measure is absolutely continuous with respect to the Lebesgue measure ?
