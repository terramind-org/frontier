title: Polynomial Separation at Roots of Unity
field: mathematics
tier: prose
statement: For every $f\in\mathbb Z[t_1,\ldots,t_n]$, does there exist $E>0$ such that for all roots of unity $z_1,\ldots,z_n$ of order at most $d$, either $f(z_1,\ldots,z_n)=0$ or $|f(z_1,\ldots,z_n)|>d^{-E}$?
