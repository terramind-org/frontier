title: Leaf spaces and transverse structures — Question 8.5
field: mathematics
tier: prose
statement: |-
  Suppose $M$ admits a minimal taut foliation. What is the best analytic (transverse) quality
  of a taut foliation it admits? Can we find a minimal foliation such that the holonomy
  groupoid is of type $\text{III}_\lambda$ for some algebraic $\lambda$?
  What about if one asks for a foliation monotone equivalent to the first? Homotopic?
