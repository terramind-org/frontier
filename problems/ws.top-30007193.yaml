statement: |-
  \section*{Virtual compact specialness of hyperbolic ascending free-group mapping tori}\label{30007193}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For a finitely generated free group F and injective endomorphism $\varphi :F\to F$, if the ascending HNN extension $\langle F,t|t^{-1}ft=\varphi (f)$, $f\in F\rangle $ is word-hyperbolic, must it be virtually compact special?
  \subsection{Short English statement}
  For a finitely generated free group F and injective endomorphism $\varphi :F\to F$, if the ascending HNN extension $\langle F,t|t^{-1}ft=\varphi (f)$, $f\in F\rangle $ is word-hyperbolic, must it be virtually compact special?
