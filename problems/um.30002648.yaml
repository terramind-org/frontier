title: Hyperbolic-Volume Decay of Partition Functions
field: mathematics
tier: prose
statement: |-
  For the quantum-Teichmüller TQFT state-integral $Z_b(X)$ associated with a triangulated hyperbolic $3$-manifold $X$ whose edges may carry conical singularities, is

  $$\lvert Z_b(X)\rvert\sim\exp\left(-\frac{\operatorname{vol}(X)}{2\pi b^2}\right)$$

  as $b\to0$?
