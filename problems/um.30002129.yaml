title: Refined Slippery Bounds for Positive-Word Rotation Numbers
field: mathematics
tier: prose
statement: |-
  For a positive word $w=a^{\alpha_1}b^{\beta_1}\cdots b^{\beta_m}$ with $R(w,r,s)=p/q$, does

  $$R(w,r,s)-h_a(w)r-h_b(w)s\leq \frac mq$$

  hold?
