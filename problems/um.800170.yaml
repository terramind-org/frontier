title: Moments of L-functions — Moments of the Riemann zeta function — Problem 20
field: mathematics
tier: prose
statement: |-
  Remove the integral in $t$ from Chandee-Li's work and give an asymptotic formula for
  $$
  \frac{2}{\phi(q)} \sum_{\substack{\chi \mod{q}\\ \chi(-1)=(-1)^k}} \sum_{f\in\mathcal{H}_\chi}^h \left|L\left({\textstyle \frac{1}{2}},f\right)\right|^6
  $$
  See work of Chandee-Li-Matomaki-Radziwill on the sixth moment of Dirichlet $L$-functions.\\
  (Joshua Stucky, University of Georgia)
