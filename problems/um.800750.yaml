title: Banach Spaces and Ramsey Theory — Problem 14
field: mathematics
tier: prose
statement: |-
  Recall the very old result due to S. Banach and S. Mazur saying that every
  infinite-dimensional Banach space has an infinite basic sequence. It turns out
  that the dual version of this *Basic Sequence Problem* is still widely open.

  \emph{(S. Banach [B] -- A. Pe{\l}czy\'{n}ski [Pe0])}
  Does every infinite-dimensional Banach space $X$ has an infinite-dimensional
  quotient with a Schauder basis?
