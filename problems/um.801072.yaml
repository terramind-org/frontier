title: "Henon Maps: Open Problems — Conjecture 24"
field: mathematics
tier: prose
statement: |-
  where $(c, b)\in\mathbb{C}^2$ is a parameter. (We include the case $b=0$ to simplify the presentation.) Let $J_{c, b}$ be the Julia set of $f_{c, b}$: by definition this
  is the intersection between the boundaries of the sets of points having bounded forward (resp. backward) orbits.
  By extension, we let $J_{c, 0}$ be the Julia set of $p(z)=z^2+c$. The *connectedness locus* of $f_{c, b}$ is defined as

  \[\mathcal{M}=\big\{(c, b)\in\mathbb{C}^2 : J_{c, b} \mbox{ is connected}\big\}.\]

  $\mathcal{M}$ is disconnected.
