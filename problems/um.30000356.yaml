title: Lyapunov Positivity for Smooth Quasiperiodic Schrödinger Operators
field: mathematics
tier: prose
statement: If a smooth potential $v$ on the circle satisfies the transversality condition and $\omega$ satisfies a weak Diophantine condition, does there exist $\lambda_0$ such that for every $|\lambda|>\lambda_0$ and every energy $E$, the Lyapunov exponent of the quasiperiodic Schrödinger operator is positive, indeed at least $\tfrac14\log|\lambda|$?
