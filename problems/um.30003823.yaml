title: Uniform Presentations of Pure Reflection Braid Groups
field: mathematics
tier: prose
statement: Let $W$ be a finite reflection group with pure braid group $P_c(W)$, let $T$ be the set of squares of the reflection generators, and let $\Delta$ be the full twist. Is $$P_c(W)=\langle T:\operatorname{Red}_T(\Delta)\rangle$$ a presentation for every finite reflection group?
