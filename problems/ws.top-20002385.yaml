  \section{Characterization of cones admitting lifted LMI representations}\label{20002385}
  {\small UnsolvedMath ID 20002385 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Characterize all full-dimensional pointed closed convex cones that are linear images of affine sections of positive semidefinite matrix cones, equivalently cones admitting a lifted linear-matrix-inequality representation. Is this class strictly larger than the class of hyperbolicity cones?
  \par\smallskip\textit{Formulation references:} \sref{20002385}{1}, \sref{20002385}{2}.
  \subsection{Short English statement}
  Characterize all full-dimensional pointed closed convex cones that are linear images of affine sections of positive semidefinite matrix cones, equivalently cones admitting a lifted linear-matrix-inequality representation. Is this class strictly larger than the class of hyperbolicity cones?
