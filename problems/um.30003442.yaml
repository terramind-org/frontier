title: Largest Roots of Doubly Stochastic Stable Polynomials
field: mathematics
tier: prose
statement: Let $D_{m,d}$ consist of the doubly stochastic stable homogeneous polynomials of degree $d$, let $\lambda_1(P)$ be the largest zero of the mixed characteristic polynomial $\chi_P$, and set $P_\infty=(x_1+\cdots+x_m)^d/m^d$. Is $\lambda_1(P)\leq\lambda_1(P_\infty)$ for every $P\in D_{m,d}$?
