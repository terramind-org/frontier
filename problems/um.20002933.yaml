title: An augmentation-rigid-boundary sieve for distinct Weinstein fillings
field: mathematics
tier: prose
statement: Given a Weinstein domain \(W\) with contact boundary \((Y,\xi)\), construct either (i) another Weinstein filling of \((Y,\xi)\) inequivalent to \(W\), or (ii) a nontrivial boundary contactomorphism which preserves the augmentation of the rational full contact-homology DGA induced by a filling; ideally do both so that two inequivalent fillings induce the same augmentation after identifying their boundaries.
