title: Types of vertices of reachable polygons
field: mathematics
tier: prose
statement: Unfold a billiard trajectory in a regular $n$-gon by reflecting the polygon across each encountered side. A short trajectory joins two vertices and meets no vertex in between; a reachable point is an endpoint vertex occurring in such an unfolding. For an oriented short trajectory, let $\alpha$ and $\beta$ be its source and target endpoint angles as in Definition 2.1 of the source, and write $A_k$ for the resulting one of $n-2$ trajectory types (indices modulo $n-2$); in particular $A_0$ is characterized by $\beta-\alpha=2\pi/n$. Call an $n$-gon reachable if it is an $SL(2,\mathbb R)$ image of the original regular $n$-gon and all its vertices except the distinguished vertex $O$ are reachable points. If $n\ge5$ and its clockwise vertices are $v_0=O,v_1,\ldots,v_{n-1}$, prove that $v_1,\ldots,v_{n-1}$ have types $A_0,A_1,\ldots,A_{n-3},A_0$, respectively.
