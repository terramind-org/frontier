title: Moments of L-functions — Moments of the Riemann zeta function — Problem 6
field: mathematics
tier: prose
statement: |-
  Conrey *el al* made the conjecture
  \[
  I_k(T) = TP_{k^2} (\log T) + O(T^{\frac{1}{2} + \varepsilon})
  \]
  where $P_{k^2}$ is a certain degree $k^2$ polynomial. Let
  \[
  E_k(T) = I_k(T) -TP_{k^2} (\log T)
  \]
  denote the error term. Since the publication of [CFKRS] there has been some debate on what should be the correct
  conjectural size of
  $E_k(T) $. Note that it is widely believed that $E_1(T) = O(T^{\frac{1}{4}+\varepsilon})$ and
  $E_2(T) = O(T^{\frac{1}{2}+\varepsilon})$ are best possible. There are omega results for both of these cases. It would be desirable to come up with a conjecture for optimal
  constants $\theta_k$ such that
  \[
  E_k(T) = O(T^{\theta_k+\varepsilon})
  \]
  holds for $k \in\mathbb{N}$. N. Ng believes that $\theta_1=\frac{1}{4}$ and $\theta_2=\frac{1}{2}$ are the correct answers for
  $k=1,2$. What about $k \ge 3$? Both Ivic and Motohashi suggested $\theta_3 = \frac{3}{4}$. Can the Multiple Dirichlet Series method be used to derive
  an appropriate conjecture? (Work in progress of Baluyot and Cech is studying this.) \\
  (Nathan Ng, Lethbridge)
