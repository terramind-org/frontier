  \section*{Optimal Max-Cut approximation hardness}\label{30007463}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every fixed $\alpha $ greater than the Goemans–Williamson constant and at most 1, is achieving approximation factor $\alpha $ for Max-Cut NP-hard even on finite simple unweighted graphs?
  \subsection{Short English statement}
  For every fixed $\alpha $ greater than the Goemans–Williamson constant and at most 1, is achieving approximation factor $\alpha $ for Max-Cut NP-hard even on finite simple unweighted graphs?
