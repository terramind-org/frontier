id: um.20002615
title: Negative-quartic two-matrix model is not a real probability measure
field: mathematics
tier: prose
statement: |-
  **Coupled random matrix model with negative potentials.** Consider the coupled two-matrix random matrix model on pairs $(M_1, M_2)$ of $n \times n$ Hermitian matrices with formal joint weight
  $$
  \frac{1}{Z_n} \exp\left\{-n \operatorname{Tr}[V(M_1) + W(M_2) + t M_1 M_2]\right\} dM_1\,dM_2
  $$
  and quartic potentials
  $$
  V(x) = -(x^4 - a x^2), \qquad W(y) = V(y).
  $$
  Is there any new critical behavior for some value of the parameter $a$?
