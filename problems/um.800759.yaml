title: Open Problems in the Theory of Ample Fields — Conjecture 2 (Shafarevich)
field: mathematics
tier: prose
statement: |-
  The importance of this question lies in the fact that, via Pop's results on ample fields,
  a positive answer would give a proof of the following conjecture of Shafarevich, cf. [DD]:

  The absolute Galois group $G_{\mathbb{Q}_\mathrm{ab}}$ of $\mathbb{Q}_\mathrm{ab}$ is a free profinite group.
