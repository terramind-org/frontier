title: Inner Automorphisms in the Fourth Antipode Formula
field: mathematics
tier: prose
statement: Let $H$ be an Artin–Schelter Gorenstein Hopf algebra. Determine the inner automorphism $\gamma$ in the fourth-antipode identity $$S^4=\gamma\circ\tau_{\chi_\ell}\circ\tau_{\chi_r}^{-1}$$.
