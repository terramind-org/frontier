title: Local connectivity of the Mandelbrot set
field: mathematics
tier: prose
statement: |-
  \section*{\texorpdfstring{Local connectivity of the Mandelbrot set}{Local connectivity of the Mandelbrot set}}\label{statement}
  \subsection{Definitions and mathematical statement}
  For $c\in{\mathbb{C}}$, let $f_c(z)=z^2+c$ and write $f_c^{\circ n}$ for its $n$-fold iterate. The Mandelbrot set is
  \[
   \mathcal M=\{c\in{\mathbb{C}}:\sup_{n\ge0}|f_c^{\circ n}(0)|<\infty\}.
  \]
  A space is locally connected at a point if every neighborhood contains a connected neighborhood of that point. The question is whether $\mathcal M$ has this property at every $c\in\mathcal M$, particularly on its boundary. Connectedness of the whole set alone is not local connectedness.
  \par\smallskip\textit{Formulation and concept references:} \href{https://arxiv.org/abs/1709.09869}{[S1]}.

  \subsection{Short English statement}
  Is the Mandelbrot set connected at every sufficiently local scale around each of its points?
  \subsection{Sources}
  \begin{itemize}
  \item[S1]Anna Miriam Benini, A survey on MLC, Rigidity and related topics, Conformal Geometry and Dynamics 22 (2018).
  \url{https://arxiv.org/abs/1709.09869}.
  \textit{Formulation source.}
  \end{itemize}
