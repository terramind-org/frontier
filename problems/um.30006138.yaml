title: Multiplicity of Centroidal Hyperplane Sections
field: mathematics
tier: prose
statement: For a convex body $K\subset\mathbb R^n$, must at least $n+1$ distinct hyperplane sections through the centroid $c(K)$ also have centroid $c(K)$? More generally, determine the minimum number $\mu(n)$ of such sections over all convex bodies, especially for $n=3$ and $4$.
