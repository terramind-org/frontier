title: Equality of Variationally Minimizing Maps
field: mathematics
tier: prose
statement: Let $X$ be a finite ideal hyperbolic simplicial complex with vertex set $S$, and let $\sigma,\tau\in\mathcal T(X)$. Let $\mathcal Y$ be the facewise $W^{1,2}$ maps $(X\setminus S,\sigma)\to(X\setminus S,\tau)$ that preserve every edge and face, and let $\mathcal D\subset\mathcal Y$ consist of maps restricting to a diffeomorphism on each face. If $u\in\mathcal Y$ and $\widetilde u\in\mathcal D$ minimize the respective energies, must $u=\widetilde u$? Equivalently, must $u$ be a diffeomorphism on every face?
