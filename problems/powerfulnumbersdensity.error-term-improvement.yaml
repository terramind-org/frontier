lean:
  module: FormalConjectures.Wikipedia.PowerfulNumbersDensity
  decl: PowerfulNumbersDensity.error_term_improvement
  statement: |-
    theorem error_term_improvement :
        ∃ δ > (0 : ℝ),
          (fun x : ℝ => (Q x : ℝ) - A * x ^ ((1 : ℝ) / 2) - B * x ^ ((1 : ℝ) / 3)) =O[atTop]
            fun x => x ^ ((1 : ℝ) / 6 - δ)
  context:
    - open PowerfulNumbersDensity
    - open Filter Asymptotics Real
  definitions:
    - name: PowerfulNumbersDensity.Q
      kind: abbrev
      text: |-
        /-- $Q(x)$ is the number of powerful integers $n$ with $1 \le n \le x$. -/
        noncomputable abbrev Q (x : ℝ) : ℕ := {n : ℕ | 0 < n ∧ n.Powerful ∧ (n : ℝ) ≤ x}.ncard
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/PowerfulNumbersDensity.lean#L48
    - name: PowerfulNumbersDensity.A
      kind: abbrev
      text: |-
        /-- The leading constant $\zeta(3/2)/\zeta(3) = 2.173\ldots$ -/
        noncomputable abbrev A : ℝ := (riemannZeta (3 / 2)).re / (riemannZeta 3).re
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/PowerfulNumbersDensity.lean#L51
    - name: PowerfulNumbersDensity.B
      kind: abbrev
      text: |-
        /-- The second-order constant $\zeta(2/3)/\zeta(2)$, where $\zeta(2/3)$ is given by analytic
        continuation. -/
        noncomputable abbrev B : ℝ := (riemannZeta (2 / 3)).re / (riemannZeta 2).re
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/PowerfulNumbersDensity.lean#L54
