title: Helly Numbers for Isolated Line Transversals
field: mathematics
tier: prose
statement: For an isolated line transversal to a finite collection of pairwise disjoint convex sets in $\mathbb R^d$, does an analogue of the Helly theorem for disjoint balls hold? In particular, is every such transversal already an isolated transversal to a subcollection of bounded size, for example at most $2d-1$?
