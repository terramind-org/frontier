lean:
  module: FormalConjectures.OEIS.«238585»
  decl: OeisA238585.conjecture_1
  statement: |-
    theorem conjecture_1 (n : ℕ) (hn : 0 < n) :
        0 < a n ↔ ¬(n ∣ 6)
  context:
    - open OeisA238585
    - open Finset
  definitions:
    - name: OeisA238585.a
      kind: def
      text: |-
        /-- Number of primes $p < n$ with $\text{prime}(p)^2 + (\text{prime}(n) - 1)^2$ prime. -/
        noncomputable def a (n : ℕ) : ℕ :=
          ∑ p ∈ Ico 1 n,
            if p.Prime ∧ Nat.Prime (Nat.nth Nat.Prime (p - 1) ^ 2 + (Nat.nth Nat.Prime (n - 1) - 1) ^ 2)
            then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/238585.lean#L39
