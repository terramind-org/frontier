title: Euler-Characteristic Growth of Stable Quiver Moduli
field: mathematics
tier: prose
statement: For a quiver $Q$ and generic stability $\Theta$, does there exist $C_Q\in\mathbb R$ such that, for large $\Theta$-coprime dimension vectors $d$, $\log\chi(M_d^{\mathrm{st}}(Q))\sim C_Q\bigl(\dim M_d^{\mathrm{st}}(Q)-1\bigr)$?
