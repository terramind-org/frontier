title: Ropelength, Menger Energy, and Loop-Number Problems
field: mathematics
tier: prose
statement: Can a ropelength-minimizing or ropelength-critical knot be described explicitly, and is the minimizing trefoil piecewise $C^2$ or piecewise smooth? Which geometric quantities or topological invariants are bounded by higher-dimensional integral Menger energies $M_p(\Sigma)$? For an unknot diagram $D$ with writhe $w(D)$, is its loop number at least $|w(D)|$, and how is loop number related to other knot invariants?
