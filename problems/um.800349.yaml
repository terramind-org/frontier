title: Trimer Covers in the Triangular Grid — Problem 1
field: mathematics
tier: prose
statement: |-
  Find an exact formula for $T_{003}(k(3k-1)/2,k(3k+1)/2)$.

  Of course, even short of an exact formula,
  any method of determining the number of tilings
  that is more efficient than brute-force enumeration
  (e.g., a recurrence relation) would be of interest.

  See [KiPr] for more discussion of no-stones tilings of benzels.
