title: Presentation gauge, a binary complement, and the two Clifford K3 surfaces
field: mathematics
tier: prose
statement: |-
  Pick three quadrics, \(Q_0,Q_1,Q_2\).  Put
  \[
  X=V(x_0Q_0+x_1Q_1+x_2Q_2)\subset \mathbf P^5.
  \]
  Then \(X\) contains the plane \(P=V(x_0,x_1,x_2)\).  The net generated by
  the \(Q_i\) is a family of quadric fourfolds over \(\mathbf P^2\); the
  Stein factorization of its relative variety of maximal isotropic spaces is
  a \(\mathbf P^3\)-family over a double-plane K3 surface and gives a Brauer
  class.  Projection of \(X\) from \(P\) gives a family of residual quadric
  surfaces over the \(\mathbf P^2\) parametrizing \(3\)-planes containing
  \(P\); its maximal isotropic spaces similarly give a projective family over
  another double-plane K3 surface.  Is there an intrinsic description of the
  relation between these twisted K3 surfaces?
