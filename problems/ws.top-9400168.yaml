title: Can a prime p satisfy $2^{p-1}\equiv 1\pmod{p^2}$ and $3^{p-1}\equiv 1\pmod{p^2}$ simultaneously
field: mathematics
tier: prose
statement: |-
  \section{\texorpdfstring{Can a prime p satisfy $2^{p-1}\equiv 1\pmod{p^2}$ and $3^{p-1}\equiv 1\pmod{p^2}$ simultaneously}{Can a prime p satisfy 2\textasciicircum{}\{p-1\}congruent to 1pmod\{p\textasciicircum{}2\} and 3\textasciicircum{}\{p-1\}congruent to 1pmod\{p\textasciicircum{}2\} simultaneously}}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For a prime $p\nmid a$, being Wieferich to base $a$ means $a^{p-1}\equiv1\pmod{p^2}$. A prime satisfying this for both bases $2$ and $3$ must be different from $2$ and $3$.
  \paragraph{Statement recorded in the supplied source.}
  Does there exist a prime $p$ satisfying both $2^{p-1}\equiv1\pmod{p^2}$ and $3^{p-1}\equiv1\pmod{p^2}$ simultaneously? \sref{statement}{2}
  \subsection{Short English statement}
  Can one prime be Wieferich for both bases two and three?
