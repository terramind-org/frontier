statement: |-
  Let ${\mathfrak{V}}$ be a variety of groups which is
  not the variety of all groups, and let $p$ be a prime. Is there a
  bound on the
  $
  p
  $-lengths of the finite $p
  $-soluble groups
  whose Sylow $ p
  $-subgroups are in ${\mathfrak{V}}$?
