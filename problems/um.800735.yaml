title: Open Problems in Topological Algebra — Problem 9 (Guran)
field: mathematics
tier: prose
statement: |-
  A paratopological group $G$ is *left $\omega$-bounded* (resp.
  *right $\omega$-bounded*) if for any neighborhood $U\subset G$
  of the origin there is a countable subset $F\subset G$ with $G=FU$
  (resp. $G=UF$); $G$ is *$\omega$-bounded* if it is both left
  and right $\omega$-bounded.

  Is a paratopological group $G$ left
  $\omega$-bounded if it is right $\omega$-bounded?
