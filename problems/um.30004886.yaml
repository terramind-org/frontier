title: Splitting Subgroups of General Linear Supergroups
field: mathematics
tier: prose
statement: In the representation theory of the general linear supergroup $G = \mathrm{GL}(m|n)$ (with $m \geq n$), a subgroup $K \subseteq G$ is called a *splitting subgroup* if the restriction of every projective $G$-module to $K$ remains projective, and let $H = \mathrm{SL}(1|1)^n \subseteq \mathrm{GL}(m|n)$ be the minimal standard splitting subgroup of Serganova and Sherman. Does every splitting subgroup $K$ of $\mathrm{GL}(m|n)$ contain a subgroup conjugate to $H = \mathrm{SL}(1|1)^n$?
