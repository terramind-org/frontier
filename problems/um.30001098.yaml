title: Càdlàg Solutions of Cylindrical Stable Evolution Equations
field: mathematics
tier: prose
statement: For $dX_t=AX_t\,dt+dZ_t$ on a Hilbert space, driven by a cylindrical stable process with coefficients $\beta_k$ satisfying $\sum_k\beta_k^\alpha/\gamma_k<\infty$, does the $H$-valued solution have càdlàg trajectories under conditions substantially weaker than $\sum_k\beta_k^\alpha<\infty$?
