  module: FormalConjectures.Mathoverflow.«75792»
  decl: Mathoverflow75792.complexity_two_pow
  statement: "theorem complexity_two_pow : ∀ n : ℕ, 0 < n → complexity (2 ^ n) = 2 * n"
  context:
    - open Mathoverflow75792
  definitions:
    - name: Mathoverflow75792.complexity
      kind: def
      text: |-
        /--
        The [(Mahler-Popken) complexity of `n`](https://en.wikipedia.org/wiki/Integer_complexity):
        the minimum number of `1`s needed to express a given number using only addition and
        multiplication. E.g. `2 = 1 + 1`, so `complexity 2 = 2`.
        -/
        def complexity (n : ℕ) : ℕ :=
          if h : n = 0 then 0 else Nat.find ⟨n, Reachable.self n <| n.pos_of_ne_zero h⟩
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Mathoverflow/75792.lean#L136
