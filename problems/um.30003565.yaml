title: Complexified Volume Conjecture for Hyperbolic Knots
field: mathematics
tier: prose
statement: |-
  For every hyperbolic knot $K\subset S^3$, is

  $$\lim_{N\to\infty}\frac{2\pi\log J_N\!\left(K;e^{2\pi i/N}\right)}{N}=\operatorname{Vol}(S^3\setminus K)+i\operatorname{CS}(S^3\setminus K),$$

  where $J_N$ is the $N$-colored Jones invariant with the indicated root-of-unity specialization?
