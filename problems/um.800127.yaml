title: Foliations and Diffeomorphism Groups — Question 68
field: mathematics
tier: prose
statement: |-
  It is likely that using Bowden-Hensel-Webb's work, one could show that ${\textnormal{\text{PL}}}_\circ(\Sigma,\text{rel }\partial)$ is not uniformly perfect for cases where $\text{Homeo}_0(\Sigma,\text{rel }\partial)$ is not uniformly perfect. This gives an h-principle approach for perfectness of ${\textnormal{\text{PL}}}_\circ(\Sigma,\text{rel }\partial)$. I still do not know an algebraic proof and more importantly do not know how to generalize my approach to higher dimensions. In particular, I do not know the following.

  Is the space $\overline{\mathrm{B}\Gamma}_n^{\textnormal{\text{PL}}}$ is $n+1$-connected?
