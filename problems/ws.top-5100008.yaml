  \section{Elliptic-billiard invariant k\_\{117\}}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Fix a noncircular ellipse
  \[
  E=\{(x,y)\in\mathbb R^2:x^2/a^2+y^2/b^2=1\},\qquad a>b>0,
  \]
  with center $O=(0,0)$ and foci $f_1=(\sqrt{a^2-b^2},0)$ and $f_2=-f_1$. Fix an inner confocal ellipse $C$, and an integer $N\geq3$, for which the pair $(E,C)$ admits a Poncelet family $\mathcal F$ of $N$-periodic billiard trajectories. A member $P=(P_1,\ldots,P_N)$ has vertices on $E$, each segment $P_iP_{i+1}$ is tangent to $C$, and incoming and outgoing segments satisfy the usual specular reflection law at $P_i$. Indices are cyclic: $P_{N+1}=P_1$.
  For any ordered polygon $W=(W_1,\ldots,W_N)$ define its signed area by
  \[
  S(W)=\frac12\sum_{i=1}^N\det(W_i,W_{i+1}),\qquad
  \det((x,y),(u,v))=xv-yu.
  \]
  Let $t_i$ be the tangent line to $E$ at $P_i$. The outer polygon $P'$ has vertices $P_i'=t_i\cap t_{i+1}$, and the inner polygon $P''$ has vertices $P_i''$, the contact points of $P_iP_{i+1}$ with $C$. Write $A=S(P)$, $A'=S(P')$ and $A''=S(P'')$. These areas retain their signs. Constancy below means constancy as $P$ varies in the fixed family $\mathcal F$; its value may depend on $E$, $C$ and $N$.
  Let $l_i=|P_i''-P_i|$ and $r_i=|P_{i+1}-P_i''|$ be the Euclidean lengths of the two portions of side $P_iP_{i+1}$ separated by its contact with the caustic. The orbit perimeter is $L=\sum_{i=1}^N|P_{i+1}-P_i|=\sum_{i=1}^N(l_i+r_i)$; it is constant on the family.
  \paragraph{Statement recorded in the supplied source.}
  For every such family with $N$ even, prove that both $\displaystyle\prod_{i=1}^N l_i$ and $\displaystyle\prod_{i=1}^N r_i$ are constant on $\mathcal F$. \sref{statement}{2}
  \subsection{Short English statement}
  For every even period, prove that each of the two products of side lengths split at the caustic contacts stays constant.
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Dan Reznik, Ronaldo Garcia and Jair Koiller, Eighty New Invariants in the Elliptic Billiard (2020), arXiv version 11, section 3.1, Table 2, p. 5, invariant $k_{117}$; sections 1--2, pp. 1--3, and Appendix A, Table 12, p. 15. \url{https://arxiv.org/abs/2004.12497v11}.
  \end{description}
  \label{end:statement}
