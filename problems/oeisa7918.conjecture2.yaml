lean:
  module: FormalConjectures.OEIS.«7918»
  decl: OeisA7918.conjecture2
  statement: |-
    theorem conjecture2 (n : ℕ) (hn : 1 < n) :
        (a n : ℝ) < (n : ℝ) ^ ((n : ℝ) ^ (1 / (n : ℝ)))
  context:
    - open OeisA7918
  definitions:
    - name: OeisA7918.a
      kind: def
      text: |-
        /-- Least prime $\ge n$ (version 1 of the "next prime" function). -/
        noncomputable def a (n : ℕ) : ℕ :=
          sInf { p : ℕ | p.Prime ∧ n ≤ p }
