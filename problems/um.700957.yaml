title: Kourovka Notebook Problem 13.39
field: mathematics
tier: prose
statement: |-
  Let $A$ be an associative ring with unity and with
  torsion-free additive group, and let $F^A$ be the tensor product
  of a free group $F$ by $A$ (A. G. Myasnikov,
  V. N. Remeslennikov, *Siberian Math. J.*, **35**,
  no. 5 (1994), 986--996);
  then $F^A$ is a *free exponential group over $A$*; in
  (A. G. Myasnikov, V. N. Remeslennikov, *Int. J. Algebra Comput.*, **6** (1996), 687--711), it is shown
  how to construct
  $F^A$ in terms of free products with amalgamation.

  b)
  Is $F^{A}$ a linear group?

  In the case where $\left< 1\right>$ is a pure
  subgroup of the additive group of $A$, there is an affirmative answer
  to ``b'' (A. M. Gaglione, A. G. Myasnikov,
  V. N. Remeslennikov, D. Spellman, *Commun. Algebra*,
  **25** (1997), 631--648). It is also known that the Magnus
  homomorphism is one-to-one on any subgroup of $F^{\mathbb{Q}$ of the
  type $\left< F,t \mid u = t^n\right>$ (G. Baumslag, *Commun.
  Pure Appl. Math.*, **21** (1968), 491--506).

  d)
  Is the universal theory of $F^{A}$ decidable?

  e) (G. Baumslag). Can free $A $-groups be
  characterized by a length function?

  f) (G. Baumslag). Does a free $\mathbb{Q}
  $-group admit a free action on some $\Lambda $-tree?
  See definition in (R. Alperin,
  H. Bass, *in: Combinatorial group theory and topology,
  Alta, Utah, 1984 $($Ann. Math. Stud.*, **111**), Princeton Univ.
  Press, 1987, 265--378).

  [Archived solved part(s) of 13.39:]
