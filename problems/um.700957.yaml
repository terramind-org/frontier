  $F^A$ in terms of free products with amalgamation.

  a)
  (G. Baumslag). Is $F^{A}$ residually
  nilpotent torsion-free?

  c)
  (G. Baumslag). Is the Magnus homomorphism
  of $F^{\mathbb{Q}$ into the group of power series over the rational
  number field $\mathbb{Q}$ faithful or not?
