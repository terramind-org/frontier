title: Kourovka Notebook Problem 17.107
field: mathematics
tier: prose
statement: |-
  Does $G=\mathrm{SL}_2(\mathbb{C})$ contain a
  2-generated free subgroup that is conjugate in $G$ to a proper
  subgroup of itself?

  A 6-generated free subgroup with this property
  has been found (D. Calegari, N. M. Dunfield,
  *Proc. Amer. Math. Soc.*, **134**, no. 11 (2006), 3131--3136).
