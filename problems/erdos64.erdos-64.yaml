lean:
  module: FormalConjectures.ErdosProblems.«64»
  decl: Erdos64.erdos_64
  statement: |-
    theorem erdos_64 :
        ∀ (V : Type*) (G : SimpleGraph V) [Fintype V] [DecidableRel G.Adj],
            G.minDegree ≥ 3 → ∃ (k : ℕ) (v : V) (c : G.Walk v v),
                k ≥ 2 ∧ c.IsCycle ∧ c.length = 2^k
  context:
    - open Erdos64
  definitions: []
