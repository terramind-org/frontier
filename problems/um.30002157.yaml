title: Arithmetic Fundamental Lemma in All Dimensions
field: mathematics
tier: prose
statement: For an unramified quadratic extension $E/F$ of $p$-adic fields, let $Y=\mathcal N_n$ embed diagonally in $\mathcal N_n\times\mathcal N_{n+1}$. For $\delta\in U(n+1)$ and $\gamma\in\operatorname{GL}_{n+1}(E)$ matching under $\operatorname{GL}_n(E)$, does the arithmetic fundamental lemma identity $\langle Y,(1\times\delta)^*Y\rangle=\operatorname{orb}^{\prime}(\gamma,\mathbf 1_{S_{n+1}(\mathcal O_F)})$ hold in every dimension $n$?
