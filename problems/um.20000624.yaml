title: Stability-preserving Markov semigroups on three bits
field: mathematics
tier: prose
statement: |-
  **Recovered statement.** Characterize continuous-time Markov generators $\psi$ on the coefficient vectors of multiaffine generating polynomials for probability measures on $\{0,1\}^3$ such that
  \[
  T_t=e^{t\psi}:\mathbb R_{MA}[x,y,z]\longrightarrow\mathbb R_{MA}[x,y,z]
  \]
  preserves real stability for every $t\ge 0$.
