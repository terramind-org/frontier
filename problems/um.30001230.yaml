title: Kähler Limits and Transcendental Morse Inequalities
field: mathematics
tier: prose
statement: "Let $\\pi:X\\to\\Delta$ be a proper holomorphic submersion whose fibers are compact complex manifolds. If $X_t$ is Kähler for every $t\\in\\Delta\\setminus\\{0\\}$, must the central fiber $X_0$ belong to Fujiki class $\\mathcal C$? More generally, does Demailly's transcendental Morse conjecture hold: if a compact complex $n$-fold $Y$ carries a $d$-closed positive $(1,1)$-current $T$ satisfying $\\int_Y(T_{\\mathrm{ac}})^n>0$, must the de Rham class of $T$ contain a Kähler current without assuming its integrality?"
