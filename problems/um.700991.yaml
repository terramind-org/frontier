title: Kourovka Notebook Problem 14.6
field: mathematics
tier: prose
statement: |-
  A group $\Gamma$ is said to have {\it Property
  $P_{\rm{nai}}$} if, for any finite subset $F$ of $\Gamma \setminus
  \{1\},$ there exists an element $y_0 \in \Gamma$ of infinite order
  such that, for each $x \in F$, the canonical epimorphism from the
  free product $\langle x \rangle * \langle y_0\rangle$ onto the
  subgroup $\langle x , y_0 \rangle$ of $\Gamma$ generated by $x$
  and $y_0$ is an isomorphism.
  For $n \in \{2, 3,\ldots\},$ does $PSL_n({\mathbb{Z} )$ have
  Property $P_{\rm{nai}}$? More generally, if $\Gamma$ is a lattice
  in a connected real Lie group $G$ which is simple and with centre
  reduced to $\{ 1\},$ does $\Gamma$ have Property $P_{\rm{nai}}$?

  Answers are known to be " yes" \ if $n =
  2$, and more generally if $G$ has real rank $1$ (M. Bekka,
  M. Cowling, P. de la Harpe, *Publ. Math. IHES*, **80**
  (1994), 117--134).

  *Comments of 2018*:
  Property $P_{\rm{nai}}$ has been established for relatively hyperbolic groups
  (G. Arzhantseva, A. Minasyan, *J. Funct. Anal.*, **243**, no. 1 (2007), 345--351) and for groups acting on CAT(0) cube complexes
  with appropriate conditions (A. Kar, M. Sageev, *Comment. Math. Helv.*, **91** (2016), 543--561). Some progress has been made in the preprint (T. Poznansky, http://arxiv.org/abs/0812.2486).
