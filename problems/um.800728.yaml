title: Open Problems in Topological Algebra — Problem 2 (Choban)
field: mathematics
tier: prose
statement: |-
  Under which conditions is the free
  universal algebra of an uncountable signature over a metrizable
  space $X$ paracompact? In particular, is the free topological
  linear space $L(X)$ of $X$ over the discrete field of real numbers
  paracompact?
