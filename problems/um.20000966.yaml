title: Fourier completion of a roots-of-unity hypergraph Laplacian
field: mathematics
tier: prose
statement: |-
  The mathematical question is whether chip-firing on graphs has a useful extension to a \(k\)-uniform hypergraph equipped with a cyclic order on every edge, with the \(k\)th roots of unity replacing the signs \(+1,-1\). Spencer Backman reported a complex positive-semidefinite Laplacian, independence from an auxiliary total order on the vertices, and asked for its kernel and for analogues of nonnegative, reduced, and recurrent configurations. Andrea Sportiello suggested replacing roots of unity by arbitrary edge vectors whose coordinates sum to zero.

  1. The isolated “1” after “workshop's website” is a footnote marker; the footnote gives `aimath.org/WWN/chipfiring/`.
  2. The last displayed phrase in the PDF is “between \(\omega\) and \(\omega^{n-1}\).” The problem otherwise uses \(k\), not \(n\). Thus \(n\) is undefined there and may be a notational slip. It is not silently changed below.

  The old workshop landing page remains accessible, but its participant-list endpoint (which was supposed to contain Backman's statement of interest) was not recoverable in this run. Consequently, the exact unpublished firing convention could not be verified. It realizes exactly the advertised positivity and order-independence, specializes to the ordinary graph Laplacian when \(k=2\), and is the same general operator later studied by Mulas and Reff. Claims about Backman's unpublished setup are therefore phrased conditionally on this reconstruction.
