title: Birational Equivalence of Twisted Algebraic-Group Representations
field: mathematics
tier: prose
statement: Let $G$ be a connected semisimple algebraic group, let $V$ be a finite-dimensional algebraic $G$-module with trivial stabilizers in general position, and let $\sigma$ be an automorphism of $G$. Must $V$ and its twist $V^{(\sigma)}$ be birationally $G$-isomorphic? In the explicit special case $G=\operatorname{SL}_d/\mu_d$, $V=\operatorname{Sym}^d(k^d)$ with its natural $G$-action, and $\sigma$ induced by $g\mapsto(g^T)^{-1}$, are $V$ and $V^{(\sigma)}$ birationally $G$-isomorphic? For $d>3$, this special case has trivial stabilizers in general position.
