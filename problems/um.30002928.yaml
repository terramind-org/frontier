title: Uniqueness of Condensation-Model Parameters
field: mathematics
tier: prose
statement: |-
  Fix $\beta>1$, let $m_\beta>0$ solve $m_\beta=\tanh(\beta m_\beta)$, and put $m^*=\sqrt{1-\beta^{-1}}$. For $u_+\in(m^*,m_\beta)$, consider a profile $q:\mathbb R_{\leq0}\to\mathbb R$ satisfying

  $$q(x)=\tanh\!\left(\beta(J*q)(x)+\beta h_*\right),\qquad \lim_{x\to-\infty}q(x)=m_-,\qquad q(0)=u_+.$$

  Are the parameters $h_*$ and $m_-$ uniquely determined by $u_+$?
