statement: Give a complete quasi-isometry classification (in the sense of Rosendal) of big mapping class groups. For instance, let $S$ be the ladder surface and let $S'$ be the $3$--pod blooming surface. Is $\operatorname{Map}(S)$ quasi-isometric to $\operatorname{Map}(S')$?
