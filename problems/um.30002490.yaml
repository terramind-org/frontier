title: Finite-Time Invariant Manifolds and Unsteady Transport
field: mathematics
tier: prose
statement: Develop a theory of finite-time invariant manifolds that genuinely captures the time dependence of aperiodic unsteady flows. In particular, quantify transport created by intersecting or nonintersecting stable and unstable manifold segments and relate those manifolds to practical flow-barrier diagnostics.
