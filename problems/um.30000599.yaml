title: Periodic Trajectories and Invariant Curves in Billiards
field: mathematics
tier: prose
statement: For a plane billiard table, the set of periodic billiard trajectories should have measure zero with respect to the canonical invariant measure. Also, are convex billiard tables with an invariant curve consisting of periodic trajectories rare or common, and how can such tables be constructed systematically? The same questions may be asked for outer billiards.
