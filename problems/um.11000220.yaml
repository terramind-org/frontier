title: Problem 13 — (Kernel foliation).
field: mathematics
tier: prose
statement: (Kernel foliation). IsN a complex-analytic (complex-algebraic) orbifold? When is dimCN = dim CO +n−m? On the other hand when does N coincide with the entire connected component of the enveloping stratum H(α′ 1,...,α ′ n)? One of the key properties used in [ McM3] for the classification of the closures of orbits of GL(2, R) in each of H(1, 1) and H(2) was the knowledge that on any translation surface of either stratum, one can find a pair of homologous saddle connections. For example, cutting a surface ( X,ω ) in H(1, 1) along two homologous saddle connections joining distinct zeroes decomposes the surface into two tori, allowing one to apply the machinery of Ratner’s Theorem.
