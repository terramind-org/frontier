title: Sections and Rational Points of Hyperbolic Curves
field: mathematics
tier: prose
statement: Let $k$ be a finitely generated extension of $\mathbb Q$ and let $X/k$ be a proper hyperbolic curve. Is every section of $\pi_1(X)\to G_k$ induced by a unique point of $X(k)$? For a smooth nonproper hyperbolic curve $U$ with compactification $X$, is every section of $\pi_1(U)\to G_k$ likewise induced by a unique point of $X(k)$?
