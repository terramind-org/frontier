title: Number of $0 < k < n$ such that $\pi(kn)$ is prime (conjecture_3)
field: mathematics
tier: proof
statement: |-
  Moreover, for each $n = 1, 2, 3, \dots$, there is a positive integer $k < 3\sqrt{n} + 3$ with
  $\pi(kn)$ prime.
