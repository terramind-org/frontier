title: Point-Set Reconstruction from Directional X-Rays
field: mathematics
tier: prose
statement: Let $A$ be a finite point set in the plane, and call $A$ reconstructible from directions $u_1,\ldots,u_k$ if its discrete X-rays in those directions uniquely determine $A$. Define $f(u_1,\ldots,u_k)$ as the largest $n$ such that every $n$-point set is reconstructible, and $F(k)=\max f(u_1,\ldots,u_k)$ over $k$ distinct directions. Determine or estimate $F(k)$.
