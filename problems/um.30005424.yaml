statement: Compare the representation theory of $\operatorname{mono}(1\to2,\operatorname{mod}\mathbb{Z}/p^6\mathbb{Z})$ with that of $\operatorname{mono}(1\to2,\operatorname{mod}k[x]/(x^6))$. Are the two monomorphism categories equivalent in an appropriate representation-theoretic sense?
