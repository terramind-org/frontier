title: Billiards and Quantitative Symplectic Geometry — Boris Khesin — Problem 1
field: mathematics
tier: prose
statement: |-
  **1. Find physically interesting examples of infinite-dimensional billiards**

  **Motivation:**
  It is a well-known folklore (made into a theorem under certain conditions) that billiard and geodesic flows are closely related by taking appropriate limits, see e.g. [Giannetto, Lange]. There are various physical problems leading to the construction of geodesics on infinite-dimensional spaces. One of the sources is the Euler-Arnold equation describing geodesics on infinite-dimensional groups. In particular, solutions of the Euler equation of incompressible hydrodynamics can be regarded as geodesics on the group of volume-preserving diffeomorphisms with respect to the right-invariant $L^2$-metric on the group. A similar framework exists for the KdV equation, magnetohydrodynamics, Heisenberg chain, etc. [Arnold66, ArnKh]
  A natural question is whether there exist interesting infinite-dimensional billiards, possibly related to equations of mathematical physics.

  One possible approach would be to consider not one or several particles hitting a wall with a billiard reflection, but a continuum of particles doing that. The difficulty is that then the reflected flow will be passing through the same domain as the flow before reflection, and hence there will be two different flows passing simultaneously through each point in the vicinity of the boundary. However, this is exactly the setting handled by multi-phase flows and by the corresponding groupoid structure for generalized flows, see [Brenier, IzKh]. This way infinite-dimensional billiards in fluids might correspond to a choice of appropriate boundary conditions in the diffeomorphism groupoid for two-phase fluids. It would be very interesting to develop the corresponding theory for multi-phase fluids with billiard reflections from the boundary.
