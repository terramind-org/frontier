title: Conference-matrix reduction and a strict coherence-gap certificate
field: mathematics
tier: prose
statement: Let \(v(n,r,\mathbb K)\) denote the maximum possible number of equi-isoclinic \(n\)-planes that can be embedded in \(\mathbb K^r\), where \(\mathbb K=\mathbb R,\mathbb C\), or \(\mathbb H\). (a) For \(r\ge4\), find \(v(2,2r,\mathbb R)\). (b) Find \(v(2,7,\mathbb R)\). (c) For \(r\ge3\), find \(v(3,3r,\mathbb R)\). (d) Find all regular \(v\)-tuples in \(G(4,4v)\) whose symmetry groups are isomorphic to \(S_v\). (e) Find \(v(3,3r,\mathbb K)\) for \(\mathbb K=\mathbb C\) or \(\mathbb H\). (f) Find all complex equiangular tight frames with parameters \((2M,M)\).
