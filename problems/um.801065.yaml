title: "Henon Maps: Open Problems — Question 17"
field: mathematics
tier: prose
statement: |-
  If the answer is yes, we may consider the set $\Theta\subset (\mathbb{R}-\mathbb{Q})/\mathbb{Z}$ of rotation numbers $\theta$ such that $H_2$ has a Herman ring with rotation number $\theta$.

  Does $\Theta$ have positive Lebesgue measure? More precisely, is $0$ a Lebesgue density point of $\Theta$?
