title: "Scalar Curvature Question [?16]: Singularities are Unstable"
field: mathematics
tier: prose
statement: "Conjecture. Singularities are Unstable. Brian White told me about 30 years ago that he believed that Volume minimising hypersurfaces in generic Riemannian manifoldsX are non-singular: singularities disappear under arbitrarily small smooth perturbations of metrics inX. This was conﬁrmed in 1993 by Nathan Smale, [118] forn= 8, which extends the Schoen-Yau theorem ton= 8."
