title: Degree Spectra and Index of Brauer-Equivalent Azumaya Algebras
field: mathematics
tier: prose
statement: Given an Azumaya algebra $A$ on a connected ringed space $X$, what are the possible degrees of Azumaya algebras $A'$ that are Brauer-equivalent to $A$, and how can their greatest common divisor, the index $\operatorname{ind}([A])$, be characterized?
