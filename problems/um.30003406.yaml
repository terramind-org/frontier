title: Equality of Canonical Models from Universal Projective Sets
field: mathematics
tier: prose
statement: Let $\widetilde\varphi$ be a $\Delta^1_3$-scale on a good universal $\Pi^1_2$ set, and let $O_{\Sigma^1_3,\widetilde\varphi}$ be the universal $\Sigma^1_3$ set defined relative to that scale. Is $$L_{u_\omega}[O_{\Sigma^1_3}]=L_{u_\omega}[O_{\Sigma^1_3,\widetilde\varphi}]$$?
