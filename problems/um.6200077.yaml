title: Boundaries of Groups and Kleinian Groups — Problem 77
field: mathematics
tier: prose
statement: For the fundamental group G of a closed hyperbolic n-manifold consider a short exact sequence 1 →Zp → Γ → G → 1. Is the group Γ residually ﬁnite? In other words, is there a ﬁnite-index subgroup G′ in G so that the restriction map H 2(G,Zp) → H 2(G′,Zp) is zero?
