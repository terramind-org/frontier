title: start at (0,0), at each point in time, we take a step from (x, y) to (x+1, y), (x-1, y), (x, y+1), or (x, y-1) with prob
field: mathematics
tier: prose
statement: "Consider the following walk: start at (0,0), at each point in time, we take a step from (x, y) to (x+1, y), (x-1, y), (x, y+1), or (x, y-1) with probability proportional to one plus the number of steps we have already taken from (x, y) to the destination point in the past. What is the probability of returning to the origin at some point? Even if the öweightö of an edge (i.e., one plus the number of steps taken between two points) is never incremented beyond 2, this problem is open."
