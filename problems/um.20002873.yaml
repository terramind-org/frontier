title: A moment counterexample and a Levi wall for sphere links
field: mathematics
tier: prose
statement: Let \(n\geq 2\) and \(M\subseteq\mathbb C^n\) be a compact CR manifold which is maximally complex (so the CR codimension is \(1\)). Suppose in the class of maximally complex CR manifolds, \(M\) is homotopic to a sphere in the complex \(m\)-plane, where \(m-1\) is the CR dimension. Must \(M\) be the boundary of a smooth analytic submanifold?
