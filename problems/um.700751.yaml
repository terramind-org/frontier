field: mathematics
tier: prose
statement: |-
  A $TI$-subgroup $A$ of a
  group $G$ is called a *subgroup of root type* if $[A,
  A^g]=1$ whenever $N_A(A^g) \ne 1$. Describe the finite groups
  containing a cyclic subgroup of order 4 as a subgroup of root
  type.
