title: Blockwise Chain Cancellation for Finite Groups
field: mathematics
tier: prose
statement: For a finite group $G$, a prime $p$, and a positive-defect block idempotent $b$ of $\mathbb{Z}_pG$, does the alternating sum over conjugacy classes of chains of nontrivial $p$-subgroups, $\sum_{\sigma\in[\mathcal{P}(G)/G]}(-1)^{|\sigma|}\operatorname{Mat}_{|G:G_\sigma|}(\mathbb{Q}G_\sigma b_\sigma)$, equal zero?
