title: Class-Breadth Inequalities for Odd-Prime Groups
field: mathematics
tier: prose
statement: For a finite $p$-group $G$, write $p^{\operatorname{br}(g)}=|g^G|$ and $\operatorname{br}(G)=\max_{g\in G}\operatorname{br}(g)$. If $p$ is odd, must the nilpotency class satisfy $\operatorname{cl}(G)\leq\operatorname{br}(G)+1$?
