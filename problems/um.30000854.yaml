title: Reid’s Fundamental-Group Conjecture for General-Type Surfaces
field: mathematics
tier: prose
statement: If $S$ is a minimal complex surface of general type with $K_S^2<4\chi(S)$, must its algebraic fundamental group be, up to finite group extensions, the fundamental group of a curve? When $K_S^2<3\chi(S)$ and $S$ has no irregular étale covers, what explicit upper bounds hold for $|\pi_1^{\mathrm{alg}}(S)|$?
