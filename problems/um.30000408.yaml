title: Grothendieck–Katz $p$-Curvature Conjecture
field: mathematics
tier: prose
statement: "P-curvature Conjecture: let $(F,\\partial_F)$ be a one-variable differential field over a number field $K$, and let $(M,\\partial_M)$ be a differential module over $F$. Is it true that $M$ has a full system of algebraic solutions if and only if its $p$-curvature is trivial for almost all primes $p$?"
