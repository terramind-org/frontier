title: Holomorphic Foliation Theory — Problem 15
field: mathematics
tier: prose
statement: |-
  In order to study foliations with leaves of dimension larger than $1$, what is the right notion which substitutes directed ${dd^c}$-closed currents in dimension $1$ that should be considered ?
  Such objects should permit to develop the ergodic theory for these foliations.
