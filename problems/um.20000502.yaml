title: A closure obstruction for the proposed oval flow
field: mathematics
tier: prose
statement: |-
  **Conjecture (The ovals of Benguria and Loss).** Let $\Gamma \subset \mathbb{R}^2$ be a closed smooth curve of length $2\pi$, let $\kappa(s)$ be its curvature as a function of arclength, and let
  $$
  H_\Gamma = -\frac{d^2}{ds^2} + \kappa(s)^2
  $$
  act on periodic functions in $W^{2,2}(\Gamma)$. Then its lowest eigenvalue satisfies $\lambda_1(H_\Gamma) \geq 1$.
