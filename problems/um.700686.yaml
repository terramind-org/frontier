title: Kourovka Notebook Problem 10.71
field: mathematics
tier: prose
statement: |-
  Is it true that the centralizer of any
  automorphism (any finite set of automorphisms) in the automorphism
  group of a free group of finite rank is a finitely presented
  group? This is true in the case of rank 2 and in the case of inner
  automorphisms for any finite rank.
