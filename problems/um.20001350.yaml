title: Finite-kernel entropy rescaling and obstructions to intermediate SFT spectra
field: mathematics
tier: prose
statement: |-
  Let \(G\) be a finitely generated infinite ameanable group, \(A\) be a finite
  alphabet and define
  \[
  \mathcal{F}
  =\left\{f:B\rightarrow A:B\subseteq G\text{ finite}\right\}
  \]
  a finite set of forbidden patterns and
  \[
  S_{G,\mathcal{F},A}
  =\left\{x\in A^G:x\text{ contains no forbidden subpatterns}\right\}.

  Choose \(\{F_n\}_{n\in\mathbb N}\) a Følner sequence and define
  \[
  \mathcal H_{G,\mathcal F,A}
  =\lim_{n\to+\infty}
  \frac{\log\#\{f:F_n\to A:f\text{ appears in some }
  x\in S_{G,\mathcal F,A}\}}{n}.
  \]

  Define
  \[
  E_G=\{\mathcal H_{G,\mathcal F,A}:
  \mathcal F\text{ is a finite set of forbidden subwords}\}.
  \]

  1. Given a recursively presented and finitely generated infinite amenable
     group \(G\), what is \(E_G\)?
  2. Does there exist a recursively presented and finitely generated infinite
     amenable group \(G\) such that
     \(E_{\mathbb Z}\subsetneq E_G\subsetneq E_{\mathbb Z^2}\)?
