lean:
  module: FormalConjectures.ErdosProblems.«425»
  decl: Erdos425.erdos_425.parts.i
  statement: |-
    theorem erdos_425.parts.i : ∃ c : ℝ, 0 < c ∧
        Tendsto
          (fun n : ℕ =>
            ((pairProductExtremal n : ℝ) - (Nat.primeCounting n : ℝ)) /
              ((n : ℝ) ^ ((3 : ℝ) / 4) * (Real.log n) ^ (-(3 : ℝ) / 2)))
          atTop (𝓝 c)
  context:
    - open Erdos425
    - open Erdos425.erdos_425
    - open Erdos425.erdos_425.parts
    - open Filter
    - open scoped Topology
  definitions:
    - name: Erdos425.pairProductExtremal
      kind: def
      text: |-
        /-- The maximum cardinality $F(n)$ of a subset of $\{1,\ldots,n\}$ with distinct
        pairwise products. -/
        noncomputable def pairProductExtremal (n : ℕ) : ℕ := by
          classical
          exact Nat.findGreatest
            (fun m => ∃ A : Finset ℕ, A ⊆ Finset.Icc 1 n ∧ PairProductDistinct A ∧ A.card = m) n
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/425.lean#L41
