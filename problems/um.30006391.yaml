title: Minimum Random-Projective-Plane Hitting Sets
field: mathematics
tier: prose
statement: Let $P$ be the point set of a projective plane of order $q$, and retain each point independently with probability $1/2$ to form $R$. With high probability, must the minimum size of a subset $B\subseteq R$ meeting every nonempty $L\cap R$ grow faster than $q$, perhaps as $\Omega(q\log q)$?
