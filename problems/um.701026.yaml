title: Kourovka Notebook Problem 14.41
field: mathematics
tier: prose
statement: |-
  A group $G$ is said to be *para-free* if
  all factors $\gamma _i(G)/\gamma _{i+1}(G)$ of its lower central
  series are isomorphic to the corresponding lower central factors
  of some free group, and $\bigcap_{i=1}^{\infty}\gamma _i(G) =1$.
  Is an arbitrary para-free group representable by matrices over a
  commutative-associative ring with $1$?
