title: Kourovka Notebook Problem 16.93
field: mathematics
tier: prose
statement: |-
  Let $F_n$ be a free group of finite rank $n \geq
  2$. Is the group $\text{Inn} F_n$ of inner automorphisms of $F_n$
  a first-order definable subgroup of $\text{Aut} F_n$?
  It is known that the set of inner automorphisms induced by
  powers of primitive elements is definable in $\text{Aut} F_n$.
