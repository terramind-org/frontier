lean:
  module: FormalConjectures.OEIS.«179537»
  decl: OeisA179537.conjecture3
  statement: |-
    theorem conjecture3 (n : ℕ) (hn : 1 ≤ n) :
        (n : ℤ) ∣ ∑ k ∈ Finset.range n, ((42 * (k : ℤ) + 37) * (-1 : ℤ) ^ k * a k)
  context:
    - open OeisA179537
  definitions:
    - name: OeisA179537.a
      kind: def
      text: |-
        /-- The sequence $a(n) = \sum_{k=0}^n \binom{n}{k}^2 \binom{n-k}{k}^2 (-16)^k$. -/
        def a (n : ℕ) : ℤ :=
          ∑ k ∈ Finset.range (n + 1), (n.choose k : ℤ) ^ 2 * ((n - k).choose k : ℤ) ^ 2 * (-16 : ℤ) ^ k
