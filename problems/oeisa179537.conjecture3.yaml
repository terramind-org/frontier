id: oeisa179537.conjecture3
title: Central binomial sum $a(n) = \sum_{k=0}^n \binom{n}{k}^2 \binom{n-k}{k}^2 (-16)^k$ (conjecture3)
field: mathematics
tier: proof
statement: |-
  $\sum_{k=0}^{n-1} (42k + 37) (-1)^k a(k) \equiv 0 \pmod n$ for all $n \ge 1$.
  - _Zhi-Wei Sun_, Jul 17 2010
