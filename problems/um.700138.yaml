title: Kourovka Notebook Problem 2.68
field: mathematics
tier: prose
statement: |-
  What can one say about lattice isomorphisms of a
  pure soluble group? Is such a group strictly determined by its
  lattice? It is well-known that the answer is affirmative for free
  soluble groups.
