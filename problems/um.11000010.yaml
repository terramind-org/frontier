title: Problem 2.3 — (Volume spectrum).
field: mathematics
tier: prose
statement: "(Volume spectrum). Determine for each 1≤ k≤ 3g− 3 the image of Volk: Xg(Γ)→ R. Determine the union of all such images as Γ ranges over all finitely presented groups. It would also be interesting to pose the same problem for representations with special geometric constraints, for example those with holomorphic or totally geodesic (with respect to a fixed metric) representatives. In particular, how do such geometric properties constrain the set of possible volumes? Note that Mirzakhani [ Mir] has given recursive formulas for the Weil-Petersson volumes of moduli spaces for surfaces with nonempty totally geodesic boundary. Invariants from linear representations. Each linear representation ψ: Mod g→ GLm(C) provides us with many invariants for elements of Xg(Γ), simply by composition with ψ followed by taking any fixed class function on GL m(C). One can obtain commensurability invariants for subgroups of Mod g this way as well. While no faithful ψ is known for g ≥ 3 (indeed the existence of such a ψ remains a major open problem), there are many such ψ which give a great 2. Some problems on mapping class groups and moduli space 17 deal of information. Some computations using this idea can be found in [ Su2]. I think further computations would be worthwhile."
