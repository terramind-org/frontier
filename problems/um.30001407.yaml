title: Genus Three Hecke Trace Formula
field: mathematics
tier: prose
statement: "For $a\\geq b\\geq c\\geq0$, prove or disprove the genus-3 conjectural formula for the trace of the Hecke operator $T(p)$ on $S_{a-b,b-c,c+4}$: $\\operatorname{tr}T(p)=e_c(A_3\\otimes\\mathbb{F}_p,V_{a,b,c})-e_{3,\\mathrm{extra}}(a,b,c)$, where $e_{3,\\mathrm{extra}}=-e_c(A_2,V_{a+1,b+1})-e_{2,\\mathrm{extra}}(a+1,b+1)\\otimes S[c+2]+e_c(A_2,V_{a+1,c})+e_{2,\\mathrm{extra}}(a+1,c)\\otimes S[b+3]-e_c(A_2,V_{b,c})-e_{2,\\mathrm{extra}}(b,c)\\otimes S[a+4]$."
