title: Kourovka Notebook Problem 19.33
field: mathematics
tier: prose
statement: |-
  *Conjecture*: Let $G$ be a finite group, $p$ a prime number, and $P$ a Sylow $p$-subgroup of $G$. Suppose that an irreducible ordinary character $\chi$ of $G$ has degree divisible by $p$. If the restriction $\chi_P$ of $\chi$ to $P$ has a linear constituent, then $\chi_P$ has at least $p$ different linear constituents.

  This conjecture has been verified for symmetric, alternating, $p$-solvable, and sporadic simple groups.
