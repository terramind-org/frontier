title: Smooth Varieties with Squarefree Gröbner Degenerations
field: mathematics
tier: prose
statement: Let $I$ be a homogeneous ideal in a standard graded polynomial ring $S$ over a field $K$. Suppose $I$ defines a nonsingular projective variety and has a square-free initial ideal for some monomial order. Must $S/I$ be Cohen–Macaulay with negative $a$-invariant? For curves, must every such nonsingular projective curve have genus zero?
