lean:
  module: FormalConjectures.Wikipedia.MeynielConjecture
  decl: MeynielConjecture.meyniel_conjecture.variants.soft
  statement: |-
    theorem meyniel_conjecture.variants.soft :
        ∃ ε C : ℝ, 0 < ε ∧ 0 < C ∧ ∀ (V : Type) [Fintype V] (G : SimpleGraph V), G.Connected →
          (copNumber G : ℝ) ≤ C * (Fintype.card V : ℝ) ^ ((1 : ℝ) - ε)
  context:
    - open MeynielConjecture
    - open MeynielConjecture.meyniel_conjecture
    - open MeynielConjecture.meyniel_conjecture.variants
    - open Filter
    - "variable {V : Type*}"
  definitions:
    - name: MeynielConjecture.copNumber
      kind: def
      text: |-
        /-- The **cop number** `c(G)`: the least number of cops that can guarantee to catch the
        robber on `G`. -/
        noncomputable def copNumber (G : SimpleGraph V) : ℕ :=
          sInf {k | CopsWin G k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/MeynielConjecture.lean#L64
