schema: 1
id: colossallyabundantnumber.alaoglu-erdos-prime-powers-rational-conjecture
title: Alaoglu–Erdős Conjectures on Colossally Abundant Numbers (alaoglu_erdos_prime_powers_rational_conjecture)
field: mathematics
tier: proof
statement: |-
  **Alaoglu–Erdős Rational Prime-Powers Conjecture** [AE44]: if $p \ne q$ are primes and
  $x \in \mathbb{R}$ satisfies $p^x \in \mathbb{Q}$ and $q^x \in \mathbb{Q}$, then
  $x \in \mathbb{Z}$.
