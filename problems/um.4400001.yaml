title: Pingree open problems — Hochman problem 1
field: mathematics
tier: prose
statement: Let $X=\{0,1\}^{\mathbb{Z}}$ and $Y=\{y\in\{0,1,2\}^{\mathbb{Z}}:y_i\neq y_{i+1}\}$. Both are mixing shifts of finite type with entropy $\log2$, but they are not isomorphic. If $\operatorname{Per}(X)$ and $\operatorname{Per}(Y)$ denote their periodic points, are $X\setminus\operatorname{Per}(X)$ and $Y\setminus\operatorname{Per}(Y)$ topologically conjugate?
