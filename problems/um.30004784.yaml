title: The Sigma–Rho Poisson Summation Conjecture
field: mathematics
tier: prose
statement: The $(\sigma,\rho)$-Poisson summation conjecture asserts that the nonzero invariant functionals on the Schwartz spaces attached to $\sigma$ and its contragredient satisfy $E_{\sigma,\rho}(\phi)=E_{\widetilde{\sigma},\rho}(F_{\sigma,\rho,\psi}\phi)$ for every test function $\phi$.
