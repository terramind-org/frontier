statement: Let $F$ be any discontinuous group of M\"obius transformations of $\mathbb{D}$. Does there always exist a meromorphic function automorphic with respect to $\Gamma$ and normal, i. e. such that \[(1-|z|^2)\frac{|f'(z)|}{1+|f(z)|^2}\] is bounded in $\mathbb{D}$? (Ch. Pommerenke)
