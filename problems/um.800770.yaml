title: Positively Curved Projective Varieties — Problem 5
field: mathematics
tier: prose
statement: |-
  Let $(X, g)$ be a compact K\"ahler manifold
  with semi-positive $($or semi-negative$)$ holomorphic sectional curvature.
  Let $V \subset T_X$ be the set of ``appropriate" truly flat tangent vectors.

  $\bullet$ Does $V$ determine an integrable subbundle of $T_X$?

  $\bullet$ Can we find a subbundle $W \subset T_X$ such that $T_X \cong W \oplus V $?

  $\bullet$ In the case of semi-positive holomorphic sectional curvatures,
  can we construct an MRC fibration $f: X \to Y$ such that $W=T_{X/Y}$?

  $\bullet$ In the case of semi-negative holomorphic sectional curvatures,
  can we construct the Iitaka fibration $f: X \to Z$ associated with the canonical bundle $K_X$
  such that $V=T_{X/Z}$?
