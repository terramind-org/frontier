title: Problem 1C — Are there more refined restrictions to the collision of critical values?
field: mathematics
tier: prose
statement: Are there more refined restrictions to the collision of critical values? Is it true that for any two vanishing cycles, whose intersection number is equal to $\pm 1$ or 0, we can lift the collision of the corresponding critical values to $B_{\varepsilon}$ via the Lyashko–Looijenga submersion?
