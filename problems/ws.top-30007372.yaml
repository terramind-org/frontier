statement: |-
  \section*{The all-temperature pressure of orthogonally invariant Ising disorder}\label{30007372}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For $J_N=U_N$ $Lambda_N$ $U_N^T$ with $U_N$ Haar orthogonal, deterministic diagonal $Lambda_N$ whose empirical spectral laws approach compactly supported mu and whose extreme eigenvalues approach the edges of supp(mu), does the uniform-spin Ising pressure converge in mean and almost surely to $inf_p$ ${S(p)+G_1(p)}$, over the stated hierarchical trial measures? No independence of $U_N$ between different dimensions is required.
  \subsection{Short English statement}
  For $J_N=U_N$ $Lambda_N$ $U_N^T$ with $U_N$ Haar orthogonal, deterministic diagonal $Lambda_N$ whose empirical spectral laws approach compactly supported mu and whose extreme eigenvalues approach the edges of supp(mu), does the uniform-spin Ising pressure converge in mean and almost surely to $inf_p$ ${S(p)+G_1(p)}$, over the stated hierarchical trial measures? No independence of $U_N$ between different dimensions is required.
