title: Yau–Tian–Donaldson Conjecture for Polarized Varieties
field: mathematics
tier: prose
statement: Let $(X,L)$ be a smooth polarized complex projective variety with finite automorphism group. Does $c_1(L)$ contain a constant-scalar-curvature Kähler metric if and only if $(X,L)$ is K-stable?
