statement: For a locally compact group $G$, can every class in $H^3_{\mathrm{Borel}}(G,\mathbb T)$ be realized as the Connes–Jones invariant of an automorphic representation $G\to\operatorname{Out}(R)$ on the hyperfinite type $\mathrm{II}_1$ factor $R$?
