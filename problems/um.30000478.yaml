statement: Every family $M$ of Calabi–Yau threefolds has a mirror family $W$ with $h^{1,1}(W)=h^{2,1}(M)$, $h^{2,1}(W)=h^{1,1}(M)$, and corresponding Type-II prepotentials identified.
