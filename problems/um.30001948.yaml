title: Topological $\widehat A$-Classes on Witt Spaces
field: mathematics
tier: prose
statement: For a Witt space $X$, under what hypotheses can the homology $\widehat A$-class be defined topologically, how does it depend on a positive-scalar-curvature metric on the links, and is it the Chern character of a suitable $K$-homology class defined by the spin Dirac operator?
