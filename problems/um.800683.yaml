title: Holomorphic Foliation Theory — Problem 10
field: mathematics
tier: prose
statement: |-
  Let $Z$ be a holomorphic vector field in $\mathbb{C}^k$ which is not the product of a polynomial vector field with a holomorphic function.
  Let $\phi$ be the uniformization of a leaf $L$. The source could be $\mathbb{C}$ or the unit disc. Consider the Nevanlinna currents
  $$\tau^\phi_r:={1\over T(r)} \phi_*\Big(\log^+{r\over |\zeta|}\Big).$$
  Are the cluster points of $\tau_r^\phi$, when $r$ tends to $\infty$ for the case of $\mathbb{C}$ and $r$ tends to $1$ for the case of the unit disc, supported necessarily by the hyperplane at infinity ?
