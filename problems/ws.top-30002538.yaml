title: CAT(0) Actions of Artin Groups
field: mathematics
tier: prose
statement: |-
  \section*{\texorpdfstring{CAT(0) Actions of Artin Groups}{CAT(0) Actions of Artin Groups}}\label{statement}
  \subsection{Definitions and mathematical statement}
  Let $S$ be a finite set and $(m_{st})$ a Coxeter matrix with $m_{ss}=1$ and $m_{st}\in\{2,3,\ldots,\infty\}$ for $s\ne t$. Its Artin group is
  \[
   A=\langle S\mid
   \underbrace{sts\cdots}_{m_{st}\text{ letters}}=
   \underbrace{tst\cdots}_{m_{st}\text{ letters}}
   \text{ whenever }m_{st}<\infty\rangle.
  \]
  Finite matrix means finitely many generators, not that the associated Coxeter group is finite. A geodesic metric space is CAT(0) when distances within every geodesic triangle are at most the corresponding Euclidean comparison distances.

  Does every such Artin group act properly and cocompactly by isometries on a nonempty CAT(0) space, in Haettel's Conjecture 1.1 convention? Properness requires only finitely many group translates of a compact set to meet that set, and cocompactness means that $AK=X$ for some compact subset $K$ of the target space $X$. No particular standard complex, cube-complex structure, or faithful linear representation is prescribed as the construction.
  \par\smallskip\textit{Formulation and concept references:} \href{https://www.numdam.org/item/10.5802/aif.3524.pdf}{[S1]}.

  \subsection{Short English statement}
  Does every finitely generated Artin group admit a proper cocompact isometric action on some nonempty CAT(0) space?
  \subsection{Sources}
  \begin{itemize}
  \item[S1]T. Haettel, XXL type Artin groups are CAT(0) and acylindrically hyperbolic, AIF 72 (2022), 2541–2555.
  \url{https://www.numdam.org/item/10.5802/aif.3524.pdf}.
  \textit{Formulation source.}
  \end{itemize}
