title: Resolvent Degree of Polynomial Root Covers
field: mathematics
tier: prose
statement: Let $\widetilde{\mathcal P}_n\to\mathcal P_n$ be the finite cover from monic degree-$n$ polynomials with a chosen root to all monic degree-$n$ polynomials. Determine its resolvent degree $\operatorname{RD}(\widetilde{\mathcal P}_n/\mathcal P_n)$; in particular, decide Hilbert's sextic, thirteenth, and octic conjectures.
