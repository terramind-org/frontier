  \section*{Borsuk covering assertion in dimension nine}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Can every bounded subset S of $R^9$ with positive diameter be covered by at most ten subsets, each having diameter strictly smaller than diam(S)?
  \subsection{Short English statement}
  Can every bounded subset S of $R^9$ with positive diameter be covered by at most ten subsets, each having diameter strictly smaller than diam(S)?
