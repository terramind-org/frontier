lean:
  module: FormalConjectures.OEIS.«212496»
  decl: OeisA212496.conjecture_6
  statement: |-
    theorem conjecture_6 (n : ℕ) (hn : 2008 < n) :
        -Real.log (Real.log (n : ℝ)) / Real.sqrt (n : ℝ) < (b n : ℝ)
  context:
    - open OeisA212496
    - open scoped ArithmeticFunction.Omega
  definitions:
    - name: OeisA212496.b
      kind: def
      text: |-
        /-- Auxiliary sequence $b(n) = \sum_{k=1}^n \frac{(-1)^{k - \Omega(k)}}{k}$. -/
        def b (n : ℕ) : ℚ :=
          ∑ k ∈ Finset.Icc 1 n, (if (k + Ω k) % 2 = 0 then (1 : ℚ) else -1) / (k : ℚ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/212496.lean#L60
