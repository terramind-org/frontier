title: Kourovka Notebook Problem 18.26
field: mathematics
tier: prose
statement: |-
  Suppose that a finite group $G$ has a normal series $ 1< G_1<G_2<G $
  such that the groups $G_1$ and $G_2/G_1$
  are elementary abelian $p$-groups, $G/G_2\cong A_5\times A_5$
  (where $A_5$ is the alternating group of degree 5), $G_1$ and
  $G_2/G_1$ are minimal normal subgroups of $G$ and $G/G_1$, respectively.
  Is it true that $\mathrm{form}(G)$ has finitely many subformations?
