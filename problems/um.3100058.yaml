statement: "Erdős: Suppose that S is a set of positive integers with the property that no element is the sum of a nonempty set of other elements. Such a set is called \"sum-free.\" Let R(S) be the sum of the reciprocals of S. How large can R(S) be? Denote by R the supremum of R(S) over all sum-free S. It is known that R is less than 4, and R > 2.064 (Abbott and Levine-O'Sullivan, respectively)."
