title: Major problems 4 — On the same theme, find some way of doing index theory related to elliptic cohomology.
field: mathematics
tier: prose
statement: On the same theme, find some way of doing index theory related to elliptic cohomology. This is not really algebraic topology, but would have a major impact on our field. I don't know much about this, but people who might are Ezra Getzler and Richard Melrose on the analysis side. Richard Melrose has a theory of index theory on manifolds with corners that might possibly be relevant, and Ezra has worked on index theory on certain infinite dimensional manifolds, which again might be relevant. From the algebraic topology side, I know Haynes Miller and Mike Hopkins have thought about this some.
