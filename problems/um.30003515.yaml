title: Epsilon Dichotomy for Generic General Linear Representations
field: mathematics
tier: prose
statement: Let $\pi$ be a generic representation of $\operatorname{GL}_6(F)$ with central character $\chi^2$. Is $$m(\pi)=1\iff\epsilon\!\left(\frac12,(\wedge^3\pi)\otimes\chi^{-1}\right)=1,$$ and equivalently $m(\pi)=0$ precisely when this epsilon factor is $-1$?
