title: Asymptotic Proportion of $Q$ in Classical Groups
field: mathematics
tier: prose
statement: Let $G=\operatorname{Class}(n,q)$ be a finite classical group of dimension $n$ over a field of odd order $q$, with natural module $V$. Let $Q$ be the set of even-order elements $g\in G$ for which the fixed space of $g^{|g|/2}$ has dimension at least $n/3$ and less than $2n/3$. Determine the asymptotic behavior of $|Q|/|G|$. In particular, is it of order $1/\log n$?
