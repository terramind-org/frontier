title: Uncommon Pairs of Linear Equations
field: mathematics
tier: prose
statement: For even $k\geq 6$, if the common solution space of $\sum_{i=1}^k a_ix_i=0$ and $\sum_{i=1}^k b_ix_i=0$ has dimension $k-2$, is the pair of equations uncommon over every sufficiently large finite field?
