schema: 1
id: green2.green-2
title: Ben Green's Open Problem 2
field: mathematics
tier: proof
statement: |-
  Let $A \subset \mathbf{Z}$ be a set of $n$ integers. Is there a set $S \subset A$ of size
  $(\log n)^{100}$ such that the restricted sumset$S \hat{+} S$ is disjoint from $A$?
ams:
  - 11
tags:
  - greens-open-problems
references:
  - label: Green, Ben. "100 open problems." (2024).
    url: https://people.maths.ox.ac.uk/greenbj/papers/open-problems.pdf#problem.2
source:
  name: formal-conjectures
  repo: https://github.com/google-deepmind/formal-conjectures
