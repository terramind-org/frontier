  path: FormalConjectures/GreensOpenProblems/2.lean
  url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/GreensOpenProblems/2.lean#L58
  licence: Apache-2.0
upstream_status: open
lean:
  module: FormalConjectures.GreensOpenProblems.«2»
  decl: Green2.green_2
  statement: |-
    theorem green_2 :
        ∀ᶠ n : ℕ in atTop, ∀ A : Finset ℤ, A.card = n →
          (maxRestrictedSumAvoidingSubsetSize A : ℝ) ≥ (Real.log n) ^ 100
  context:
    - open Green2
    - open Filter
    - open scoped Topology
  definitions:
    - name: Green2.maxRestrictedSumAvoidingSubsetSize
      kind: def
      text: |-
        /--
        We define the construction from [Sa21, p1] as
        $M(A) := \max \{|S| : S \subseteq A \text{ and } (S \hat{+} S) \cap A = \varnothing \}$.
        -/
        def maxRestrictedSumAvoidingSubsetSize (A : Finset ℤ) : ℕ :=
          (A.powerset.filter fun S => Disjoint S.restrictedSumset A).sup Finset.card
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/GreensOpenProblems/2.lean#L46
