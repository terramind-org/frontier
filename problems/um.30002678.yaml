title: Circuits and Thresholds in Rank-Two Matrix Completion
field: mathematics
tier: prose
statement: In rank-$2$ low-rank matrix completion, characterize circuits and circuit polynomials; moreover, if $N=n$ and the observed positions are the edges of a uniformly random $2r$-regular graph, determine whether all entries are completable with high probability as $n=N\to\infty$.
