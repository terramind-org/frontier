title: The dual Wilking bound and singular join tests
field: mathematics
tier: prose
statement: |-
  **Problem 6.** Extend the Wilking Connectivity Theorem to Alexandrov
  spaces, i.e. if \(X\) is a positively curved Alexandrov space and
  \(Y\subset X\) a totally geodesic subspace of codimension \(k\), is it true
  that \(X-Y\) has homology only up to dimension \(2k-2\)?
