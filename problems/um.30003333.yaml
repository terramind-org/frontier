title: Box Discrepancy of Higher-Dimensional Permutations
field: mathematics
tier: prose
statement: |-
  For every fixed $d\geq1$, do there exist $d$-dimensional permutations $X\subseteq[n]^{d+1}$ such that every axis-parallel box $B\subseteq[n]^{d+1}$ satisfies
  $$
  \left||X\cap B|-\frac{\operatorname{vol}(B)}{n}\right|=O\!\left(\sqrt{\operatorname{vol}(B)}\right)
  $$?
