title: Confinement of compact-disc candidates and a flat local survivor in C^3
field: mathematics
tier: prose
statement: "**Recovered question.** Is there a smooth bounded pseudoconvex domain \\(\\Omega\\subset\\mathbb C^n\\) (\\(n\\geq3\\)) whose boundary contains a nonconstant analytic disc and for which the \\(\\bar\\partial\\)-Neumann operator \\(N_1\\) on \\((0,1)\\)-forms is compact? For \\(n=2\\) this is impossible."
