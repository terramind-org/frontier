title: Kourovka Notebook Problem 2.22
field: mathematics
tier: prose
statement: |-
  a) An abstract group-theoretic property $\Sigma$ is
  said to be *radical $($in our sense*) if, in any group $G$,
  the subgroup $\Sigma(G)$ generated by all normal $\Sigma
  $-subgroups is a $\Sigma $-subgroup itself (called the *$\Sigma $-radical* of $G$). A radical property $\Sigma$ is said
  to be *strongly radical* if, for any group $G$, the
  factor-group $G/\Sigma(G)$ contains no non-trivial normal $\Sigma
  $-subgroups. Is the property $ \overline{\! RN}$ radical?
  strongly radical?

  [Archived solved part(s) of 2.22:]
  b) An abstract group-theoretical property $\Sigma$ is called
  *radical $($in our sense$)$* if, in any group $G$, the join
  $\Sigma(G)$ of all normal $\Sigma$-subgroups is a
  $\Sigma$-subgroup. Is the property $N^0$ (see Archive, 1.38)
  radical?
