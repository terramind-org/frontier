title: Admissible Gelfand–Zetlin Faces Representing Smooth Schubert Cycles
field: mathematics
tier: prose
statement: For $G=GL_n(\mathbb C)$, $X=G/B$, and the Gelfand–Zetlin polytope $Q_\lambda$, can every Schubert cycle defined by a Schubert cell with smooth closure be represented by an admissible face $\Gamma$ of $Q_\lambda$, so that the face combinatorics captures the cycle’s geometry?
