statement: |-
  \section{A Fifteen-Constraint Additive Pattern}\label{statement}


  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Unless a section says otherwise, $\N=\{1,2,\ldots\}$,
  $\Z$ is the ring of integers, $\Q,\R,\C$ are the rational, real, and complex
  fields, $[N]=\{1,\ldots,\lfloor N\rfloor\}$, and $\log$ is the natural
  logarithm. For real functions of a parameter tending to infinity,
  $f\ll g$ and $f=O(g)$ mean $|f|\leq Cg$ eventually for some fixed $C$;
  $f\gg g$ reverses this comparison; $f=o(g)$ means $f/g\to0$;
  $f\sim g$ means $f/g\to1$; and $f\asymp g$ means both order bounds.
  A subscript on $O$ or $\ll$ specifies allowed constant dependence.
  The expression $n^{o(1)}$ in an upper bound means growth smaller than
  $n^\epsilon$ for each fixed $\epsilon>0$. Local definitions govern any
  exception, finite-field convention, or use of the same symbol for another
  object. An asymptotic claim is not automatically an effective algorithm.



  All indices $i,j$ below are read modulo 5, in $\{1,\ldots,5\}$. The density is $\alpha=|A|/N$. Count ordered ten-tuples, with coincidences between entries permitted, through
  \[T(A)=\sum_{x_1,\ldots,x_5,y_1,\ldots,y_5\in G}\prod_{i=1}^5\prod_{s=0}^2 1_A(x_i+y_{i+s}).\]
  The precise proposed inequality is $T(A)\geq\alpha^{15}N^{10}$ for every finite abelian group and every subset. \sref{statement}{1} \sref{statement}{2}

  \paragraph{Statement recorded in the supplied source.}
  Let $G$ be an abelian group of size $N$, and suppose that $A \subset G$ has density $\alpha$. Are there at least $\alpha^{15}N^{10}$ tuples $(x_1, \ldots, x_5, y_1, \ldots, y_5) \in G^{10}$ such that $x_i + y_j \in A$ whenever $j \in \{i, i+1, i+2\}$? \sref{statement}{1}

  \paragraph{Residual task reported by the archive.}

  The embedded review (2026-08-17) records: Produce a counterexample or prove the stated lower bound. \sref{statement}{1}

  \subsection{Short English statement}

  Does every dense subset of a finite abelian group contain at least the random-model number of configurations satisfying these fifteen linked sum conditions?

