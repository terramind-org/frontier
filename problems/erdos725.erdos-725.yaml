lean:
  module: FormalConjectures.ErdosProblems.«725»
  decl: Erdos725.erdos_725
  statement: |-
    theorem erdos_725 (k : ℕ → ℕ) (hk : ∀ n, k n ≤ n) :
        (fun n ↦ (L (k n) n : ℝ)) ~[atTop] fun n ↦ erdos_725.answer (k n) n
  context:
    - open Erdos725
    - open Filter Asymptotics
  definitions:
    - name: Erdos725.L
      kind: def
      text: |-
        /-- $L(k,n)$ is the number of $k\times n$ Latin rectangles. Rows, columns and entries are
        labelled and the rows are ordered. It is $0$ for $k>n\geq 1$ and $1$ for $k=0$. -/
        noncomputable def L (k n : ℕ) : ℕ :=
          Nat.card {M : Fin k → Fin n → Fin n // IsLatinRectangle M}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/725.lean#L45
