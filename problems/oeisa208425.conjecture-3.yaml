lean:
  module: FormalConjectures.OEIS.«208425»
  decl: OeisA208425.conjecture_3
  statement: |-
    theorem conjecture_3 (p : ℕ) (hp : p.Prime) (hmod : p % 3 = 2) :
        ((∑ k ∈ Finset.range p, (a k : ℚ)) -
          (2 * p : ℚ) / ((2 * (p + 1) / 3).choose ((p + 1) / 3) : ℚ)).num % (p ^ 2 : ℤ) = 0
  context:
    - open OeisA208425
  definitions:
    - name: OeisA208425.a
      kind: def
      text: |-
        /-- Expansion of $\sum_{n \ge 0} \frac{(3n)!}{n!^3} \frac{x^{2n}}{(1-x)^{3n+1}}$, given by
        $a(n) = \sum_{k=0}^n \binom{n}{k} \binom{n-k}{k} \binom{n+k}{k}$. -/
        def a (n : ℕ) : ℕ :=
          ∑ k ∈ Finset.range (n + 1), n.choose k * (n - k).choose k * (n + k).choose k
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/208425.lean#L35
