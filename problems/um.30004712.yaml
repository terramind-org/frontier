title: Hyperkähler Compactification of Projective Fibrations
field: mathematics
tier: prose
statement: Given a smooth projective fibration $M_U\to U$, where $U\subseteq\mathbb{P}^n$, when does there exist a smooth hyper-Kähler compactification $M$ of $M_U$ with a regular morphism $\pi:M\to\mathbb{P}^n$ extending $\pi_U$?
