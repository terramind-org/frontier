title: Kourovka Notebook Problem 16.99
field: mathematics
tier: prose
statement: |-
  Suppose that $G$ is a finite solvable group, $A
  \leq \mathrm{Aut} G$, \ $C_G(A)=1$, the orders of $G$ and $A$ are
  coprime, and let $l(A)$ be the length of the longest chain of
  nested subgroups of $A$. Is the Fitting height of $G$ bounded
  above by $l(A)$?

  For $A$ solvable the question coincides
  with 5.30. It is proved that for any finite group $A$, first,
  there exist $G$ with $h(G)=l(A)$ and, second, there is a finite
  set of primes $\pi$ (depending on $A$) such that if $|G|$ is
  coprime to each prime in $\pi$, then $h(G)\leq l(A)$. See
  (A. Turull, *Math. Z.*, **187** (1984), 491--503).
