title: Sphere-Packing Bounds and Fourier Eigenfunction Constructions
field: mathematics
tier: prose
statement: The linear-programming upper bound for sphere-packing density in $\mathbb R^n$ is conjectured to be $2^{-(\lambda+o(1))n}$ with $\lambda\approx0.6044$, and there is conjectured to exist a nonzero Schwartz function $f:\mathbb R^2\times\mathbb R^2\to\mathbb R$ with $f(0,0)=0$, $\widehat f=-f$, and $f(x,y)\geq0$ whenever $|x|^2-|y|^2\in2\mathbb Z$ and $|x|^2+|y|^2\geq4/3$.
