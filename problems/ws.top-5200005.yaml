statement: |-
  \section{Open Problems on Billiards and Geometric Optics}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A convex caustic is a convex curve inside the table such that any billiard segment tangent to it remains tangent after reflection. Symmetry about $l$ means invariance under reflection in that line; smoothness is required of the table, while the question does not add smoothness of the caustic.
  \paragraph{Statement recorded in the supplied source.}
  Let $\gamma$ be a smooth convex plane billiard table symmetric about an axis $l$, and let $C$ be a convex caustic. Must $C$ be symmetric about $l$? Prove this or give a counterexample. \sref{statement}{2}
  \subsection{Short English statement}
  Must every convex caustic inherit a reflection symmetry of its smooth convex billiard table? Prove this or find a counterexample.
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] M. Bialy, C. Fierobe, A. Glutsyuk, M. Levi, A. Plakhov and S. Tabachnikov, \emph{Open problems on billiards and geometric optics} (2021), arXiv:2110.10750v2, Misha Bialy, Problem 5, p. 4. \url{https://arxiv.org/pdf/2110.10750v2}.
  \end{description}
