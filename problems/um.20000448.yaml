title: Fixed-length sums of 2/(x^2-2)
field: mathematics
tier: prose
statement: |-
  **Problem/Question 15.** Characterize the rational numbers \(\alpha\) that can be written as
  \[
  \alpha=\frac{2}{x_1^2-2}+\frac{2}{x_2^2-2}+\cdots+\frac{2}{x_n^2-2}
  \]
  for \(x_i\in\mathbb Q\) and fixed \(n\). (Poonen)

  It is necessary that \(|\alpha|_p\leq1\) for \((2/p)=-1\) and \(p=2\). Is it sufficient?
