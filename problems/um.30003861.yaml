title: Mirror Families from Log Calabi–Yau Pairs
field: mathematics
tier: prose
statement: For a simple normal-crossings Calabi–Yau pair $(Y,D_Y)$ with maximal boundary and $D_Y$ supporting an ample divisor, does the Gross–Hacking–Keel curve-counting algebra construction produce a flat family of affine log Calabi–Yau varieties whose torus quotient depends only on $U=Y\setminus D_Y$ and is its mirror family?
