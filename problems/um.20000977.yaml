title: Abelian hard-object growth and a greedy obstruction
field: mathematics
tier: prose
statement: |-
  **(12) Persi Diaconis:** “Is there an abelian growth model for non-overlapping discs growing in the plane?”

  **(a) James Propp:** “There is such an abelian model in the case of non-nesting discs; firing means if you have a disc that is totally contained in another one, you move it in some fixed way.”

  **(b) Anton Dochtermann:** “We could even ask if there is an abelian model of the one-dimensional case of non-overlapping intervals on a line.”
