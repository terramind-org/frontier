title: Affinely equivalent projections and an ellipsoidal 2-cover criterion
field: mathematics
tier: prose
statement: |-
  **Problem 2.** (See [G, Problem 3.3 and Note 3.2].) Same problem as in
  (1) but for projections, i.e. if all projections \(K|S\),
  \(S\in G(n,k)\), are affinely equivalent, is \(K\) an ellipsoid? Here
  \(K\) is convex.
