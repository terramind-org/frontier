title: Lifting Dehn-Twist Relations to Punctured Surfaces
field: mathematics
tier: prose
statement: Given a relation $t_{a_1}\cdots t_{a_n}=1$ of Dehn twists in $\operatorname{Mod}_g$, can the curves be moved away from the puncture to curves $\widetilde a_i$ in the punctured surface satisfying $t_{\widetilde a_1}\cdots t_{\widetilde a_n}=1$ in $\operatorname{Mod}_{g,1}$?
