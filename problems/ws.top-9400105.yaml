  \section{Erdős–Moser problem}\label{9400105}
  {\small\sffamily UnsolvedMath ID 9400105 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For integers $m\ge2$ and $k\ge1$, the Erd\H{o}s--Moser equation is
  \[
  \sum_{j=1}^{m-1}j^k=m^k.
  \]
  The pair $(m,k)=(3,1)$ gives $1+2=3$.
  \paragraph{Statement recorded in the supplied source.}
  Is $(m,k)=(3,1)$ its only solution with $m\ge2$ and $k\ge1$? Equivalently, does it have no solution with $k\ge2$? \sref{9400105}{2}
  \subsection{Short English statement}
  Is one plus two equals three the only positive-integer power-sum equality of this form?
