  \item[\hypertarget{source:9400105:2}{S2}] Pieter Moree, \emph{Moser\textquotesingle s mathemagical work on the equation $1^k+\cdots+(m-1)^k=m^k$}, arXiv:1011.2940v2 (2011) Introduction, equation (1), p. 1. \url{https://arxiv.org/pdf/1011.2940}.
