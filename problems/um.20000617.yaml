title: Exact degree-two Jacobi interlacing and its physical interpretation
field: mathematics
tier: prose
statement: Let \(P_n^{\;\alpha,\,\beta}\) denote the Jacobi polynomial of \(\deg n\) with parameters \(\alpha,\beta>-1\). Then \(P_n^{\;\alpha',\,\beta'}\) and \(P_n^{\;\alpha,\,\beta}\) interlace for \(\alpha\approx\alpha'\), and \(\beta\approx\beta'\). Does the failure of interlacing correspond to some physical law being “violated”?
