title: Dehn-twist tails obstruct one-sided length shortening
field: mathematics
tier: prose
statement: |-
  Its mathematical content can be recovered unambiguously:

  Let \(\Gamma _0<\mathrm{PSL}_2(\mathbb R)\) be an infinitely generated Fuchsian group of the first kind (its limit set is the full circle at infinity) and let \(X_0=\mathbb H^2/\Gamma _0\). Does there exist a nontrivial marked quasiconformal deformation \(Y\in\mathcal T_{qc}(X_0)\) such that
  \[
   \ell_\gamma(Y)\leq\ell_\gamma(X_0)
   \quad\text{for every essential simple closed curve }\gamma? \]

  The 2014 PDF adds that Alessandrini and Guéritaud had recent results. No citable joint paper corresponding to that sentence was located. The 2016 update omits it, so it is treated as an informal progress note rather than a verified theorem.
