statement: "Conjecture. C0-closeness of the spaces ofC0-metrics withVolumicallyPositiveScalarCurvatures. IfaRiemannian C0-metricg onan n-dimensionalmanifold X canbe C0-approximated byC0-metrics g′with Scvoln(g′) ≥κ then Scvoln(g) ≥κ. This conjecture is motivated by the corresponding property of smooth metrics: C0-Closure Theorem.If a RiemannianC2-metric g on X can beC0-approximated byC2-metricsg′withSc(g′) ≥κ thenSc(g) ≥κ [49, 10]. Test. Check [?"
