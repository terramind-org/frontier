    reference:
      label: Moosbauer and Poole, arXiv:2502.04514
      url: https://arxiv.org/abs/2502.04514
    note: The abstract (read 2026-10-19) reports "new schemes for multiplying 5x5 matrices using 93 multiplications and 6x6 matrices using 153 multiplications over arbitrary ground fields"; the catalogue page for 5x5x5 lists <5x5x5:93> with that citation as its only entry. No lower bound better than the trivial ones was found.
  format: 'A JSON object {"terms": [{"a": M, "b": M, "c": M}, ...]} where each M is a 5x5 array of arrays. Entries are integers. The scheme computes C = sum over terms of <a,A> <b,B> c, with <a,A> = sum of a[i][j]*A[i][j] and c added to C as stored (C[i][l] gets the coefficient of A[i][j]*B[j][l]). It is valid when this equals the 5x5 matrix product as a polynomial identity, checked exactly. The value is the number of terms (at most 1000).'
