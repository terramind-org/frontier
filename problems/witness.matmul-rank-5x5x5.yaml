schema: 1
id: witness.matmul-rank-5x5x5
title: Matrix multiplication scheme for 5x5 matrices with fewer than 93 multiplications
field: computer-science
tier: witness
statement: Multiplying two 5x5 matrices with the schoolbook method takes 125 scalar multiplications. A rank-r scheme writes the product as AB = sum over s=1..r of <a_s,A> <b_s,B> c_s, where a_s, b_s, c_s are fixed 5x5 matrices with integer entries and <a,A> is the sum of a_ij*A_ij. The best known scheme, from 2025, has r = 93. Find a scheme with r = 92 or fewer, with integer coefficients.
