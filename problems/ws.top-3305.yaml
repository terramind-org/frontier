  \item[\hypertarget{source:statement:2}{S2}] Open Problem Garden, Highly arc transitive two ended digraphs, node 691, original problem page. Original question and full discussion. \url{https://www.openproblemgarden.org/op/highly_arc_transitive_two_ended_digraphs}.
