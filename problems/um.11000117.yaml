statement: Let r be a positive integer and let Γr be the (normal) subgroup of Modg generated by the rth powers of all Dehn twists. Is Γr of infinite index? If we let Nr to be the normal closure in the mapping class group Mod g of the rth power of a single Dehn twist about a nonseparating simple closed curve, then by a result of Humphries [ 17] the index of Nr is finite in Mod g for all g when r = 2 and for ( g,r ) = (2, 3). Thus, the answer to Problem 2.12 is no in these cases. It is also known from [ 17] and [ 10] that Nr is of infinite index if r̸= 2, 3, 4, 6, 8, 12. Clearly, Nr is contained in Γ r. Let PMod b g,p denote the subgroup of Mod b g,p consisting of the isotopy classes of those diﬀeo- morphisms which fix each puncture. If g≥ 4, then the homology group H2(PModb g,p; Z) is iso- morphic to Zp+1. (cf. [ 13], [ 39] and [ 33].) (We note that the roles of the subscript p and the superscript b are interchanged in [ 33].) 5. Problems on homomorphisms of mapping class groups 91
