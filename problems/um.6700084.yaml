statement: 'Conjecture. Geroch for Alexandrov Spaces.If anndimensionalAlexandrovspace X withsect.curv ≥−1andScvoln(X) ≥ 0 admits a continuous mapΦ with non-zero degree(i.e. the homology homomorphism Φ∗does not vanish onHn(X)) to then-torus, then the universal covering ofX is isometric toRn. Moral in Conclusion. The deﬁnition ofScvol is not supposed to answer the question"What is scalar curvature", but rather to inspire a quest for a true deﬁnition. 27 Fredholm Coarea and StableK-Area. Let X be a Riemannin manifold or a more general (metric) space where one may speak of length of curves and areas of surfaces and deﬁne the FredholmK-area on its homology similarly to how it was done for K-area+ in sections 12,13 but now allowinginﬁnite dimensional bundles L overX. Namely, given a complex Hilbertian vector bundle L over X, introduce the concept of a unitary connection∇in it via parallel transport over certain curves inX and deﬁne the norm of the curvature of∇as in section 9: ||curv(∇)||(x) is the inﬁmum of positive functionsC(x) such that the maximal rotation angles α ∈[−π,π ] of the parallel transports along the boundaries of "nice" (smooth in the Riemannin case) surfacesS in X satisfy |α|≤∫S C(s)ds 84 Represent elementsκ of theK-cohomologygroup ofX by pairs of complex Hilbertian vector bundleL= (L1,L 2) overX withFredholm homomorphisms71 and it is also useful for certain non-compact ones.Φ∶L1→L2 and deﬁne the coarea (norm) ofκ as the inﬁmum of numbersc, such thatκ admits a representation byΦ∶L1→L2, whereL1 and L2 are endowed with connections with ||curv||≤c. Do the same for theK-cohomology with compact supports(say, on locally compact X), where the homomorphismsΦ are required to be unitaryisomorphisms at inﬁnity, i.e. outside compact subsets inX and such thatΦ must be connection preserving at inﬁnity Deﬁne the coarea "norm" onκ in the so deﬁnedKcomp(X) as the inﬁmum of the numbersc, such thatκ admits a representation byΦ ∶L1→L2, where L1 and L2 are endowed with connections with||curv||≤c and such that Φ is connection preserving at inﬁnity. DeﬁneFredholmK-areaon theK-homology ofX, on the ordinary homology and on the homology with inﬁnite supports by linear duality: for…'
