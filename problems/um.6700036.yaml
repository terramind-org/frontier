title: "Scalar Curvature Question [?39]: Let $B=B\\Gamma$ be the classifying space of a discrete countable group, and let $f:X\\to B$ be a continuous map"
field: mathematics
tier: prose
statement: Let $B=B\Gamma$ be the classifying space of a discrete countable group, and let $f:X\to B$ be a continuous map from a Riemannian manifold. Does there exist a compact subset $B_0\subset B$ containing $f(X)$ such that the Fredholm coareas of certain nonzero multiples of pullback bundles become arbitrarily small? More precisely, given $\varepsilon>0$, do there exist an integer $N\ne0$ and a Fredholm bundle $(L,\nabla)$ over $X$ with $\|\operatorname{curv}(\nabla)\|\leq\varepsilon$, such that $L$ is K-theoretically equivalent to the $N$th Whitney power of a pullback bundle $f^*(L_0)$?
