title: Cartan and Polar Decompositions for Kac–Moody Groups
field: mathematics
tier: prose
statement: For a Kac–Moody group $G$ with unitary form $K$, when do Cartan or polar decompositions exist? Does $G=KAK$ imply that $G$ is spherical? Does $\operatorname{SL}_n(F[t,t^{-1}])$ admit a polar decomposition? If $U$ is the unipotent radical of a Borel subgroup, when does $G=KUK$ hold in the nonspherical case, particularly for $\operatorname{SL}_n(F[t,t^{-1}])$?
