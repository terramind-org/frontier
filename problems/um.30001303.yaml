statement: If $H\subseteq K^{\mathrm{ab}}$ and $\Delta_\varphi\in CH^{r+1}(X_r)_0(H)$ is a generalized Heegner cycle, is $\Phi_C(\Delta_\varphi)\in A(H)\otimes\mathbb{Q}$ and does $\Phi_C(\Delta_\varphi^\sigma)=\Phi_C(\Delta_\varphi)^\sigma$ for every $\sigma\in\operatorname{Gal}(H/K)$?
