title: Topological Modular Forms over Generalized Elliptic Curves
field: mathematics
tier: prose
statement: Extend topological modular-form operations to the moduli stack of generalized elliptic curves; identify $\lim_{\mathrm{Isog}}\mathcal O^{\mathrm{top}}$; and determine whether its map from the TMF-local sphere yields integral or near-integral resolutions of that sphere.
