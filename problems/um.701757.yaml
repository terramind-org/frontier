title: Kourovka Notebook Problem 20.99
field: mathematics
tier: prose
statement: |-
  *Conjecture*: Let $a_1G_1,\ldots,a_kG_k$, $k>1$, be finitely many pairwise disjoint left cosets in
  a group $G$ with $[G:G_i]<\infty$ for all $i=1,\ldots,k$. Then

  $\gcd([G:G_i],[G:G_j])\ge k\qquad \text{for some }1\leq i<j\leq k$.

  The conjecture is known to hold for $k=2,3,4$.
