title: Large Anticomplete Sets in Triangle-Free Graphs
field: mathematics
tier: prose
statement: Does there exist a constant $c>0$ such that every triangle-free graph on more than two vertices has disjoint vertex subsets of orders $cn^c$ and $cn$ with no edges between them?
