title: Source-Algebra Classification of Cyclic Blocks
field: mathematics
tier: prose
statement: For a cyclic block $B$ of a finite group $G$, determine whether $W(B)$ is recoverable from the character table of $G$; determine $W(B)$ for every nonuniserial cyclic block and every cyclic block of a finite quasisimple group; and reduce the general classification to the quasisimple case.
