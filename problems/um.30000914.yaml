title: Closed Contraction Groups of Totally Disconnected Groups
field: mathematics
tier: prose
statement: For an automorphism $\alpha$ of a totally disconnected locally compact group $G$, define $U_\alpha=\{x\in G:\alpha^n(x)\to1\text{ as }n\to\infty\}$. Under what conditions is $U_\alpha$ closed?
