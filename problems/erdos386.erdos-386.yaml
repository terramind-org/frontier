  decl: Erdos386.erdos_386
  statement: |-
    theorem erdos_386 :
        ∃ᶠ n in .atTop, ∃ k ≥ 2,
          k ≤ n - 2 ∧ ∃ p q : ℕ, n.choose k = ∏ i ∈ .Ico p q, nth Nat.Prime i
