title: Grothendieck's Section Conjecture over Number Fields
field: mathematics
tier: prose
statement: Let $X$ be a smooth proper geometrically integral curve of genus at least $2$ over a number field $k$. Is the natural map from $X(k)$ to conjugacy classes of continuous sections of $$\pi_1(X/k)\longrightarrow\operatorname{Gal}(\overline k/k)$$ a bijection?
