title: Are shy couplings necessarily rigid?
field: mathematics
tier: prose
statement: |-
  \section{Are shy couplings necessarily rigid?}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $D\subset\mathbb R^d$, $d\ge2$, be a bounded connected open set. A coupling of reflected Brownian motions in $D$ means two such processes with their prescribed individual laws defined on the same probability space. Call a coupling shy if some $\varepsilon>0$ has
  \[\mathbb P\left(\inf_{t\ge0}\|X_t-Y_t\|_2\ge\varepsilon\right)>0.\]
  A rigid coupling here means that a deterministic function $f:\overline D\to\overline D$ satisfies $Y_t=f(X_t)$ simultaneously for all $t\ge0$ almost surely.
  \paragraph{Statement recorded in the supplied source.}
  If a shy coupling exists in $D$, must there exist another shy coupling $(X'_t,Y'_t)$ that is rigid? The separation constant for the new coupling may differ from that for the original one. \sref{statement}{2}
  \subsection{Short English statement}
  Does the existence of a pair of reflected Brownian motions that stay apart with positive probability imply the existence of such a pair related by a deterministic map?
  \subsection{Sources}
