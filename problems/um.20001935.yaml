title: A topology-aware phase-box reduction for generic density of closed geodesics
field: mathematics
tier: prose
statement: |-
  **Question 11.2.2.** Are the tangent vectors to closed geodesics dense in the tangent bundle for a generic Riemannian metric on a closed manifold?

  It is known that this is the case for metrics with nonuniformly hyperbolic geodesic flows.
