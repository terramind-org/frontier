lean:
  module: FormalConjectures.OEIS.«107247»
  decl: OeisA107247.conjecture
  statement: |-
    theorem conjecture :
        conjecture.answer = a (sInf {n : ℕ | 8 < n ∧ (a n).Prime})
  context:
    - open OeisA107247
  definitions:
    - name: OeisA107247.a
      kind: def
      text: |-
        /--
        The primary defining sequence `a`.
        `a n` is the sum of squares of nonacci numbers (Fibonacci 9-step numbers).
        The official sequence matches the sum up to `n + 1` of the standard nonacci numbers
        to align with the offset.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ k ∈ Finset.range (n + 2), (nonacci k) ^ 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/107247.lean#L43
