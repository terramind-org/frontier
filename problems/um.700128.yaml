title: Kourovka Notebook Problem 2.56
field: mathematics
tier: prose
statement: |-
  Classify up to isomorphism the abelian connected
  algebraic unipotent linear groups over a field of positive
  characteristic. This is not difficult in the case of a field of
  characteristic zero. On the other hand, C. Chevalley has solved
  the classification problem for such groups up to isogeny.
