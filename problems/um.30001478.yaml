title: Prime Ideals and Coordinate-Ring Maps of $R(\alpha,\beta)$
field: mathematics
tier: prose
statement: Let $k$ be an uncountable algebraically closed field, let $\alpha,\beta$ be algebraically independent over its prime subfield, and let $$R=R(\alpha,\beta)=k\langle x_1,x_2,x_3,x_4\rangle/(f_1,\ldots,f_6),$$ where $$\begin{aligned}f_1&=x_1(\alpha x_1-x_3)+x_3(x_1-\alpha x_3),&f_2&=x_1(\alpha x_2-x_4)+x_3(x_2-\alpha x_4),\\f_3&=x_2(\alpha x_1-x_3)+x_4(x_1-\alpha x_3),&f_4&=x_2(\alpha x_2-x_4)+x_4(x_2-\alpha x_4),\\f_5&=x_1(\beta x_1-x_2)+x_4(x_1-\beta x_2),&f_6&=x_1(\beta x_3-x_4)+x_4(x_3-\beta x_4).\end{aligned}$$ Is the augmentation ideal $R_+$ the only nontrivial graded prime ideal of $R$, and does $R$ admit no nontrivial map to a twisted homogeneous coordinate ring?
