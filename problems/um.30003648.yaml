title: Extremal Copositive Rays and Completely Positive Factorizations
field: mathematics
tier: prose
statement: For the copositive cone, can the extremal generating rays be completely characterized? For the completely positive cone, can the supporting hyperplanes be completely characterized, and can a general completely positive matrix $A$ be given explicitly as $A=\sum_{i=1}^r b_i b_i^T$ with $b_i\in\mathbb R_+^n$?
