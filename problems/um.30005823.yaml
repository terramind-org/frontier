title: Vanishing Viscosity and Propagating Terraces
field: mathematics
tier: prose
statement: For the $n$-tube incompressible porous-media model, establish well-posedness when $\nu=0$ and characterize the vanishing-viscosity limit as $\nu\to 0$. For the two-tube model, prove existence and study stability of the propagating terrace for every tube separation $l>0$.
