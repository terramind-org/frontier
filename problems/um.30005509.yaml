title: Finitely Generated Cohomology in Stable Module Categories
field: mathematics
tier: prose
statement: For a finite group $G$ and a field $k$ of characteristic $p$, prove that the thick subcategory of $\operatorname{StMod}(kG)$ consisting of modules with finitely generated cohomology is generated by the thick subcategories of finitely generated modules and modules with no cohomology.
