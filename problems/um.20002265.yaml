title: Exact-size padding and ZFC bounds for cofinal types at aleph_2
field: mathematics
tier: prose
statement: |-
  Under a given analog of PFA for \(\aleph_2\), how many cofinal types of directed sets of cardinality \(\aleph_2\) are there?

  Under PFA, \(1,\omega,\omega_1,\omega\times\omega_1\), and \((\omega_1)^{<\omega}\) are the cofinal types of directed sets of cardinality \(\aleph_1\).

  For an explicitly named higher forcing axiom \(A\), determine the Tukey-equivalence classes of directed sets of cofinality at most \(\aleph_2\).
