title: Uniqueness and Fundamental Solutions for Fractional Diffusion
field: mathematics
tier: prose
statement: Let $M$ be a complete connected noncompact $N$-dimensional Riemannian manifold with $\operatorname{Ric}(M)\geq-(N-1)k$ and $\lambda_1(\Omega)\geq c\,m(\Omega)^{-2/N}$ for every relatively compact open $\Omega$. For $u_t=-(-\Delta_M)^s(u^m)$, where $s\in(0,1)$ and $m>1$, prove uniqueness of weak dual solutions, construct fundamental solutions with Dirac-delta initial data, and establish pointwise bounds for general solutions.
