statement: |-
  \section*{Integral and fractional expectation thresholds within a constant factor}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Does one absolute constant C satisfy $q_f(F)<=C$ q(F) for every nonempty proper increasing family F on an arbitrary finite ground set, where integral and fractional covers both use cost budget one half?
  \subsection{Short English statement}
  Does one absolute constant C satisfy $q_f(F)<=C$ q(F) for every nonempty proper increasing family F on an arbitrary finite ground set, where integral and fractional covers both use cost budget one half?
