title: Mode Counts of Gaussian Mixtures
field: mathematics
tier: prose
statement: For mixtures of $k$ Gaussian distributions in dimension $d$, determine the distribution and maximum possible number of modes. In fixed dimension, is the maximum for isotropic mixtures bounded linearly in $k$? Give verifiable conditions ensuring at most $k$ modes, and formulate a Gaussian analogue of strong modes.
