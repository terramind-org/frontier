title: Selection Principles in Mathematics — Problem 3 ([ideals])
field: mathematics
tier: prose
statement: |-
  Dichotomic arguments imply the existence (in ZFC) of a set
  of reals $X$ satisfying $\mathsf{S}_1(\Gamma,\Gamma)$ such that $|X|=\mathfrak{t}$ [alpha_i],
  and a set of reals satisfying $\mathsf{S}_{\mathrm{fin}}(\Omega,\Omega)$ such that $|X|=\operatorname{cf}(\mathfrak{d})$ [SFH].
  Now, $\operatorname{non}(\mathsf{S}_1(\Gamma,\Gamma))=\mathfrak{b}$, $\operatorname{non}(\mathsf{S}_{\mathrm{fin}}(\Omega,\Omega))=\mathfrak{d}$,
  and it is consistent that $\mathfrak{b}>\mathfrak{t}$ and $\mathfrak{d}>\operatorname{cf}(\mathfrak{d})$.
  Thus, these existence results are not satisfactory.

  Does there exist (in ZFC) a set of reals $X$ satisfying $\mathsf{S}_1(\Gamma,\Gamma)$ such that $|X|=\mathfrak{b}$?
