title: Odd-primary Wood filtrations and a chromatic lower bound
field: mathematics
tier: prose
statement: |-
  The Wood cofibre sequence is the cofibre sequence
  \(\Sigma KO\xrightarrow{\eta}KO\to KU\) (and similarly for the connective versions). There is also a version relating \(BP_{\mathbb R}\langle n\rangle^{C_2}\) to \(BP_{\mathbb R}\langle n\rangle\).

  What are odd primary analogs of the Wood cofibre sequence? For example, one might expect a \(p\)-stage filtration on \(E_{p-1}\) with associated graded \(E_{p-1}^{hC_p}\). Is there an analog for \(E_{(p-1)p^{n-1}m}\)?
