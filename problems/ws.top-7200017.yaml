  \item[\hypertarget{source:statement:2}{S2}] Hélène Esnault and Phùng Hô Hai, Packets in Grothendieck’s Section Conjecture (2007). Section 2, exact sequence (2.2) and the complete-curve formulation (SC), pp. 3–4. \url{https://arxiv.org/pdf/math/0703877v2}.
  \end{description}
