title: Lower Bounds for Sums of Roots of Unity
field: mathematics
tier: prose
statement: |-
  Let $C_d=\{e^{2\pi i k/d}:k\in\mathbb Z\}$, and let $mC_d$ denote its $m$-fold Minkowski sum. For a set $A\subset\mathbb C$, write $\min_0(A)=\min\{|x|:x\in A\setminus\{0\}\}$. For every fixed positive integer $m$, does there exist $E=E(m)>0$ such that
  $$\min_0(mC_d)>d^{-E}$$
  for all $d$?
