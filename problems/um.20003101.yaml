title: Fixed-clock boundedness for cylindrical Thurston stretch rays
field: mathematics
tier: prose
statement: |-
  **Problem 2.11.** Determine when two Thurston geodesic rays stay bounded distance apart.

  The sentence immediately preceding the problem says that Lenzhen and Masur had completely answered the analogous question for Teichmüller geodesic rays. Their formulation compares unit-speed rays at the same time, possibly from distinct basepoints.

  There is an essential ambiguity that was absent in the Teichmüller-metric analogue. Thurston's metric is asymmetric, so “distance” may mean the forward distance, the reverse distance, or a symmetrization. Moreover, “rays” may be compared at the same clock time, after reparameterization, or only as image sets. These conventions are inequivalent, as proved below.

  The original problem does not restrict to stretch rays. The proved theorem in this report concerns the substantial special class of cylindrical stretch rays on a closed oriented surface of genus at least two, with chain-recurrent complete supports, which is the setting of Théret's theorem used below.
