title: Kourovka Notebook Problem 12.95
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finitely generated
  pro-$p
  $-group and let $g_1,\ldots ,g_n \in G$. Let $H$
  be an open subgroup of $G$, and suppose there exists a non-trivial
  word $w=w(X_1,\ldots ,X_n)$ such that $w(a_1,\ldots ,a_n)=1$
  whenever $a_1 \in g_1H,\ldots ,a_n \in g_nH$ (that is, $G$
  satisfies a *coset identity*). Does it follow that $G$
  satisfies some non-trivial identity?

  A positive answer to this question would imply
  that an analogue of the Tits Alternative holds for finitely
  generated pro-$p
  $-groups. Note that J. S. Wilson and
  E. I. Zelmanov (*J. Pure Appl. Algebra*, **81** (1992),
  103--109) showed that the graded Lie algebra $L_p(G)$ with respect
  to the dimension subgroups of $G$ in characteristic $p$ satisfies
  a polynomial identity.

  *Comment of 2017*:
  This has been shown to be true for finitely generated linear groups (M. Larsen, A. Shalev, *Algebra Number Theory*, **10**, no. 6 (2016), 1359--1371).
