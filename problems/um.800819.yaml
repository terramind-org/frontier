title: Geometric Hydrodynamics in Open Problems — Problem 18 (Aging Problem)
field: mathematics
tier: prose
statement: |-
  Consider an arbitrary solution $u=u(t,x)$ of the Euler equations in $M$.
  Given any two time instants can one decide which velocity field $u(t_1,x)$ or $u(t_2,x)$
  corresponds to an earlier time instant?
  In other words, is it possible to determine the aging of the fluid from its velocity field?
  Numerical experiments suggest that fluids ``age" with time:
  starting with a smooth initial velocity $u_0(x)$ the corresponding solution becomes ``wrinkled"
  in that its derivatives generally grow. (V. Yudovich referred to this phenomenon as
  ``regularity deterioration".)

  Is it possible to quantify the ``aging" property of the fluid?
