id: um.30005561
title: Chow Vanishing for Lagrangian-Fibered Hyperkähler Varieties
field: mathematics
tier: prose
statement: Let $X$ be a projective hyperkähler variety of dimension $n$ with a Lagrangian fibration induced by $L$, and let $c_I(X)$ be a weighted polynomial of degree $2i$ in the even Chern classes. Prove $c_I(X)L^{n+1-k}=0$ in $\operatorname{CH}(X)_{\mathbb Q}$ whenever $i\geq k$.
