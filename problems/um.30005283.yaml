title: Borovik–Cherlin Generic-Transitivity Conjecture
field: mathematics
tier: prose
statement: Let a group $G$ of finite Morley rank act definably and generically $k$-transitively on $X$. Prove $k\leq\operatorname{RM}(X)+2$, with equality only when the action is definably isomorphic to $\operatorname{PGL}_n$ acting on $\mathbb P^{n-1}$.
