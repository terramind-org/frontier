statement: Let $p\geq 673$ be a prime and $r \geq 2$ be an integer. Let $B$ be the free group in the Burnside variety of exponent $p$ on $a_1, \dots , a_r$. Must every non-identical one-variable equation $w(a_1, \dots , a_r, x) = 1$ over $B$ have at most finitely many solutions in $B$?
