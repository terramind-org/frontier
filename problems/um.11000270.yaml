title: Question 2.2 — Does there exist a compactification of the spine of Outer space satisfying Rosen- thal’s conditions?
field: mathematics
tier: prose
statement: Does there exist a compactification of the spine of Outer space satisfying Rosen- thal’s conditions? Same question for the complex of arc systems filling a punctured surface. 20. Automorphism groups of free, surface and free abelian groups 323 In all of the cases mentioned above, the candidate space E has dimension equal to the virtual cohomological dimension of the group. G. Mislin [ 68] has constructed a cocompact EG for the mapping class group of a closed surface, but it has much higher dimension, equal to the dimension of the Teichm¨ uller space. This leads us to a slight variation on Question 1.1.
