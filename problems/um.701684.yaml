title: Kourovka Notebook Problem 20.26
field: mathematics
tier: prose
statement: |-
  Let $\phi$ be the Euler totient function. Does there exist a constant $a > 0$ such that $| Aut(G)| \geq \phi (|G|)^a$

  a) for every finite group $G$?

  b) for every finite nilpotent group $G$?

  If such a constant $a$ exists, then $a\le \frac{40}{41}$ (J. Gonz\'alez-S\'anchez, A. Jaikin-Zapirain, *Forum Math. Sigma*, **3**, Article ID e7, 11 p., electronic only (2015)). Also cf. Archive 12.77.
