title: Open Problems on Central Simple Algebras — Problem 6
field: mathematics
tier: prose
statement: |-
  Determine groups $G$ and $G'$ and conditions on $F$ under which $G\Rightarrow_F G'$.
  In particular:

  - Determine, for $m$ prime-to-$p$, whether $C_p\rtimes C_m\Rightarrow_F C_p\times C_m$.

  - Determine whether all quasi-symbols are cyclic.
