title: The tableau-rowmotion bridge and its three-chain boundary
field: mathematics
tier: prose
statement: |-
  Bloom et al. [BPS13] proved a homomesy result for rectangular
  semistandard tableaux under promotion. But we also know that promotion
  of semistandard tableaux is a special case of PL promotion in the
  order polytope of a product of two chains, and we also know homomesy
  results for rowmotion and promotion in products of two chains (Propp
  and Roby).

  **Problem 2.10.** How do the results of Bloom, Pechenik, and Saracino
  relate to the results of Propp and Roby?

  Also, there is work to be done regarding rowmotion on products of
  three chains. The obvious cardinality statistic is not in general
  homomesic under rowmotion in general, but various other statistics are
  (or at least appear to be, experimentally).

  **Problem 2.11.** What are the homomesies of rowmotion acting [on]
  order ideals in a product of three chains? ...
