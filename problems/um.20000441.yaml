title: "Rigid Calabi--Yau intermediate Jacobians: periods, cycle-theoretic separation, and symmetry certificates"
field: mathematics
tier: prose
statement: Use the intermediate Jacobian (when it is an abelian variety) in arithmetic? To fix ideas, \(\dim X=3\), look at algebraic 1-cycles modulo rational equivalence. Compute this for a rigid Calabi--Yau 3-fold \(X\) (over \(\mathbf C\)), i.e. \(K_X\sim0\), \(X\) simply connected, \(h^{1,0}=h^{2,0}=h^{2,1}=0\), and \(h^{3,0}=1\). In this case the intermediate Jacobian \(J^2(X)\cong E\) is of dimension 1. Determine \(E\) given \(X\), i.e. give its \(j\)-invariant.
