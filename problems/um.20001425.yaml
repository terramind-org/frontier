title: Formal-period covers and the phase-quotient ramification budget
field: mathematics
tier: prose
statement: |-
  Fix $d$. If $n >>_d 1$, then is $M_d(n)$ of general type, where $M_d(n)$ marks periodic points of formal period $n$.

  Known for abelian varieties and for $d=2$, $n=1,\ldots,5$ $M_d(n)$ is rational and $M_2(6)$ is general type (Blanc-Canci)

  Its exact wording is:

  The record adds, verbatim:

  The notation $n\gg_d1$ is read as “all sufficiently large $n$, with threshold allowed to depend on $d$.”

  There are two bibliographic corrections to the literature note. First, the small-period paper has three authors: Jérémy Blanc, Jung Kyu Canci, and Noam D. Elkies. Second, its theorem is stated for a point of **exact** period $n$, whereas Michelle Manes's $M_d(n)$ is constructed using **formal** period. Blanc--Canci--Elkies explicitly say that their exact-period variety is a $\operatorname{PGL}_2$-invariant open subset of Manes's formal-period variety. Thus the birational assertions agree on the relevant component, but the moduli functors are not literally identical.

  The abelian-variety analogy is broadly correct but too imprecise to be a citation. A precise modern result of Abramovich and Várilly-Alvarado says that for a locally closed $X\subset\mathcal A_g$, all irreducible components of its pullback to sufficiently high full-level moduli are of general type. Full abelian level structure is much richer than one marked dynamical periodic point, so this is an analogy rather than a reduction.
