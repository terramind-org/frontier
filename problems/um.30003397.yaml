title: Monotonicity Constants for Expected Random-Simplex Volumes
field: mathematics
tier: prose
statement: Let $K\subseteq L\subset\mathbb{R}^d$ be convex bodies, and let $P_{d+1}^K$ and $P_{d+1}^L$ be simplices generated by $d+1$ independent uniform points in $K$ and $L$, respectively. Does there exist $c(d)$ with $\limsup_{d\to\infty}c(d)^{1/d}<\infty$ such that $\mathbb{E}V_d(P_{d+1}^K)\leq c(d)\mathbb{E}V_d(P_{d+1}^L)$? Determine lower bounds for the optimal $c(d)$.
