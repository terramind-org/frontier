  definitions:
    - name: OeisA218585.a
      kind: def
      text: |-
        /-- Number of ways to write $n = x + y$ with $0 < x \le y$ and $x^2 + xy + y^2$ prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.Icc 1 (n / 2),
            let y := n - x
            if Nat.Prime (x ^ 2 + x * y + y ^ 2) then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/218585.lean#L36
