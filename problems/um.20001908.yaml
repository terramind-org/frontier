title: Closed-one-form twists obstruct the asserted cyclic-cover product
field: mathematics
tier: prose
statement: |-
  Let \(M^2\) be a closed surface of genus at least two, let \(S^1\) be the circle, and let \(g\) be a Riemannian metric without conjugate points on \(M\times S^1\).

  **Conjecture 7.3.1 (Burago--Kleiner).** The metric on the \(\mathbb Z\)-cover corresponding to the \(S^1\) factor is a direct product
  \[
  (M\times\mathbb R,g)=(M,g_1)\times(\mathbb R,dt^2).
  \]
