title: Kourovka Notebook Problem 20.118
field: mathematics
tier: prose
statement: |-
  Let $G$ be a pro-$p$ group that is a 3-dimensional Poincar\'e duality group. Can it contain a direct product $F_2\times F_2$ of free pro-$p$ groups of rank 2?

  If it can, then the answer to 20.117 is negative, but in the abstract case it is known that it can not (P. H. Kropholler, M. A. Roller, *J. London
  Math. Soc. (2)*, **39** (1989), 271--284).
