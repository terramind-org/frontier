title: A graph-splitting obstruction to specialization of unirationality
field: mathematics
tier: prose
statement: |-
  **Does unirationality specialize in smooth projective families?**

  Let \(R\) be a discrete valuation ring (DVR), with fraction field \(K\) and residue field \(k\), and let \(\mathcal X\to\operatorname{Spec}R\) be smooth and projective with geometrically integral fibers. If the geometric generic fiber \(\mathcal X_{\overline K}\) is unirational, must the geometric special fiber \(\mathcal X_{\overline k}\) be unirational?
