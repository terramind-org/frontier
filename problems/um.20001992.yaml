title: From tropical Grassmannians to Chow quotients
field: mathematics
tier: prose
statement: |-
  **A.10 The tropical Grassmannian**

  The tropical Grassmannian, studied by Speyer and Sturmfels, turns out, at least in the cases they study, (2,n) and (3,6) to have strong combinatorial connections with the Kapranov's Chow quotient G(r,n)//(C*)^n.

  Question (Eugene Tevelev and Sean Keel): Try to understand the precise relationship. (contributed by Sean Keel)
