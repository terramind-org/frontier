title: Kourovka Notebook Problem 14.57
field: mathematics
tier: prose
statement: |-
  Describe the hereditarily just infinite
  pro-$p $-groups of finite width.

  Definitions: A pro-$p $-group $G$ has finite
  *width* $p^d$ if $|\gamma _i(G)/\gamma _{i+1}(G)|\leq p^d$
  for all $i$, and $G$ is *hereditarily just infinite* if $G$
  is infinite and each of its open subgroups has no closed normal
  subgroups of infinite index.
