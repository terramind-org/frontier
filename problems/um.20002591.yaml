title: A one-dimensional counterexample and a bottleneck reduction for spin-glass mixing
field: mathematics
tier: prose
statement: |-
  \[
  H_n(\sigma)=\sum_{(i,j)\in E_n}J_{ij}\sigma_i\sigma_j,
  \qquad
  \mu_{n,J}(\sigma)=Z_{n,J}^{-1}e^{\beta H_n(\sigma)},
  \]

  where the couplings are described as a “random symmetric matrix with i.i.d. $\pm1$ entries.”  After fixing the disorder, it asks whether there are
  $\beta_0$ and $\varepsilon>0$ such that, for every $\beta\ge\beta_0$, Glauber
  dynamics has mixing time at least $\exp(n^\varepsilon)$.

  The wording omits several quantifiers and conventions.

  The exact
  repository record was therefore preserved, and all repairs above are labeled
  as reconstructions.
