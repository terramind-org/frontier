  \section{A classwise CM implication and a one-product coniveau certificate}\label{20000428}
  {\small UnsolvedMath ID 20000428 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  In a setting where the Hodge conjecture implies the Tate conjecture, must the generalized Hodge conjecture also imply the generalized Tate conjecture? In particular, does this implication hold for CM abelian varieties? The generalized assertions concern coniveau, not only individual cycle classes.
  \par\smallskip\textit{Formulation references:} \sref{20000428}{1}, \sref{20000428}{2}.
  \subsection{Short English statement}
  In a setting where the Hodge conjecture implies the Tate conjecture, must the generalized Hodge conjecture also imply the generalized Tate conjecture? In particular, does this implication hold for CM abelian varieties? The generalized assertions concern coniveau, not only individual cycle classes.
