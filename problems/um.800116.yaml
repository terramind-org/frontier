title: Foliations and Diffeomorphism Groups — Question 57
field: mathematics
tier: prose
statement: |-
  For the case of real-analytic codimension 1 foliations, the presence of an exceptional minimal set implies that an extremal leaf (passing through an endpoint of an interval of its complement in a transversal section) has infinitely many ends.

  Can the above theory for the analytic group actions be generalized to the case of codimension 1 real analytic foliations? Can it lead to establishing of the Dippolito conjecture for foliations?
