  \section{Trace-Cone Classification after Razak–Jacelon Stabilization}\label{30002225}
  {\small UnsolvedMath ID 30002225 · Algebra}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For separable nuclear $C^*$-algebras $A$ and $B$, does $T(A)\cong T(B)$ if and only if $A\otimes\mathcal W\otimes\mathcal K\cong B\otimes\mathcal W\otimes\mathcal K$, assuming the trace-cone isomorphism is a linear homeomorphism?
  \par\smallskip\textit{Formulation references:} \sref{30002225}{1}, \sref{30002225}{2}.
  \subsection{Short English statement}
  For separable nuclear $C^*$-algebras $A$ and $B$, does $T(A)\cong T(B)$ if and only if $A\otimes\mathcal W\otimes\mathcal K\cong B\otimes\mathcal W\otimes\mathcal K$, assuming the trace-cone isomorphism is a linear homeomorphism?
