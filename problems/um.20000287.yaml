title: Reduction of non-Q-Gorenstein multiplier ideals and finite toric divisor witnesses
field: mathematics
tier: prose
statement: |-
  Let \(X\) be a normal variety in characteristic zero, let \(\mathfrak a\subseteq\mathcal O_X\) be a nonzero ideal, and let \(t\in\mathbb Q_{\geq0}\). After choosing a model over a finitely generated \(\mathbb Z\)-algebra \(A\), is there a dense open \(U\subseteq\operatorname{Spec}A\) such that
  \[
  \mathcal J_{\mathrm{dFH}}(X,\mathfrak a^t)_\mu
    =\tau_b(X_\mu,\mathfrak a_\mu^t)
  \]
  for every closed point \(\mu\in U\)? Does this hold when \(K_X\) is numerically \(\mathbb Q\)-Cartier?
