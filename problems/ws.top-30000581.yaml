  \section{Nonvanishing or Uniruledness for Smooth Projective Varieties}\label{30000581}
  {\small UnsolvedMath ID 30000581 · Algebraic Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Does every smooth projective variety $X$ either have a nonzero pluricanonical section in $H^0(X,\mathcal O_X(mK_X))$ for some $m>0$, or is it covered by rational curves?
  \par\smallskip\textit{Formulation references:} \sref{30000581}{1}, \sref{30000581}{2}.
  \subsection{Short English statement}
  Does every smooth projective variety $X$ either have a nonzero pluricanonical section in $H^0(X,\mathcal O_X(mK_X))$ for some $m>0$, or is it covered by rational curves?
