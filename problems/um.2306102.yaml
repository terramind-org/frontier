title: Research Problems in Function Theory — Problem 6.102
field: mathematics
tier: prose
statement: Let $\{v_n\}^\infty_1$ be a sequence of positive integers (which may include $\infty$); the sequence is called a valence sequence if there is a function $f(z)$, analytic in $\mathbb{D}$, such that $f^{(n)}(z)$ has valence $v_n$ in $\mathbb{D}$, for $n = 1,2,\ldots$. Find interesting necessary conditions for $\{v_n\}$ to be a valence sequence. Also, find sufficient conditions for $\{v_n\}$ to be a valence sequence. (For some results of this type, see Goodman .) (A. W. Goodman)
