title: Root Vector Majorization for Doubly Stochastic Stable Polynomials
field: mathematics
tier: prose
statement: Let $D_{m,d}$, $P_\infty$, and $\lambda(P)=(\lambda_1(P),\ldots,\lambda_d(P))$ be as in the doubly stochastic stable-polynomial setting. Is $\lambda(P)$ majorized by $\lambda(P_\infty)$ for every $P\in D_{m,d}$? Moreover, if $P\in D_{m,d}\cap\operatorname{Sym}_m$, $0\leq r\leq s$, and $\Psi_s=\exp(s(I-T))$, is $\lambda(\Psi_r(P))$ majorized by $\lambda(\Psi_s(P))$?
