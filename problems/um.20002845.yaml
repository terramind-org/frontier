title: Noncompact automorphism groups and anisotropic orbit rates
field: mathematics
tier: prose
statement: Let \(\Omega\) be a smooth bounded domain in \(\mathbb C^n\) such that the automorphism group of \(\Omega\) is non-compact. What can be said about \(\Omega\)? See Isaev--Krantz (*Adv. Math.* 146, 1999, MR1706680, survey on domains with non-compact automorphism group).
