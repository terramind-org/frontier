title: Degree-Four Expansion from Random Latin Squares
field: mathematics
tier: prose
statement: |-
  Let $Y(n,d)$ be the random two-dimensional simplicial complex obtained as the union of the complexes associated with $d$ independent uniformly random Latin squares of order $n$, and let $h_1(Y)$ be its first coboundary-expansion constant. Does there exist $\varepsilon>0$ such that
  $$
  \lim_{n\to\infty}\mathbb P\{Y\in Y(n,4):h_1(Y)>\varepsilon\}=1
  $$?
