title: Local Middle-Dimensional Symplectic Nonsqueezing
field: mathematics
tier: prose
statement: |-
  Let $P_k$ be orthogonal projection onto the standard $\mathbb R^{2k}\subset\mathbb R^{2n}$. Two local middle-dimensional nonsqueezing questions remain open. First, for every symplectomorphism $\phi:\mathbb R^{2n}\to\mathbb R^{2n}$ and every $x\in\mathbb R^{2n}$, is

  $$\operatorname{vol}_{2k}\bigl(P_k\phi(B_r(x))\bigr)\geq\omega_{2k}r^{2k}$$

  for all sufficiently small $r>0$? Second, if $\{\phi_t\}_{t\in[0,1]}$ is a smooth family of symplectomorphisms with $\phi_0$ linear, is

  $$\operatorname{vol}_{2k}\bigl(P_k\phi_t(B_1)\bigr)\geq\omega_{2k}$$

  for all sufficiently small $t\geq0$?
