title: Effective G-Function Bounds for Unlikely Intersections
field: mathematics
tier: prose
statement: Determine the strongest fully explicit G-function height bounds for unlikely intersections in algebraic tori and abelian varieties. In particular, extend the current explicit bounds from line sections in $\mathbb G_m^3$ to arbitrary algebraic curves in $\mathbb G_m^n$, and develop analogous explicit bounds for curves in powers $A^n$ of a simple abelian variety $A$.
