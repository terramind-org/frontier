title: Integral Points on Finite Covers of Semiabelian Varieties
field: mathematics
tier: prose
statement: Let $G$ be a semiabelian variety over a number field $k$, let $V$ be a smooth $k$-variety, let $\pi:V\to G$ be a finite $k$-morphism, and let $S$ be a finite set of places of $k$. If the $S$-integral points $V(\mathcal{O}_S)$ are Zariski-dense in $V$, then $\pi$ should be an unramified covering; in particular, $V$ should have a semiabelian variety structure for which $\pi$ is an isogeny.
