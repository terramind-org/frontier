title: Distributions of Class-Group Ranks and $S_5$ Extensions
field: mathematics
tier: prose
statement: Let $r_p(D)$ be the $p$-rank of the ideal class group of $\mathbb Q(\sqrt{-D})$. As $0<D<X$, determine the average of $p^{r_p(D)}$, the distribution of $r_p(D)$, and upper bounds for $r_p(D)$ as functions of $D$. Let $n(D)$ be the number of $S_5$-extensions of $\mathbb Q$ with squarefree discriminant $D$. As $-X<D<X$, determine the average and distribution of $n(D)$ and upper bounds for $n(D)$ as functions of $D$.
