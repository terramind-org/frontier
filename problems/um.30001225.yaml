title: Classification of Analytic Hilbert Modules on Strictly Convex Domains
field: mathematics
tier: prose
statement: Let $\Omega\subset\mathbb C^d$ be a strictly convex domain with smooth boundary, and let $A$ be a matrix with entries in the disk algebra $\mathcal A(\Omega)$ whose rank is constant on $\partial\Omega$. Classify, within the framework of quasi-free Hilbert modules, the privileged analytic Hilbert modules $$F=\operatorname{coker}\bigl(A:L_a^2(\Omega)^m\longrightarrow L_a^2(\Omega)^n\bigr),$$ and describe their parameter space.
