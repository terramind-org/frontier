title: Nijenhuis Geometry and Integrable Systems — Problem 2
field: mathematics
tier: prose
statement: |-
  \begin{Problem} Can one write the system of equations in such a way that its coefficients depend on $L$ only (at least in the $\mathrm{gl}$-regular case)? \end{Problem}
  Note that in the $\mathrm{gl}$-regular case any two pairs $(L_1,e_1)$ and $(L_2, e_2)$ with identical Jordan blocks of $L_1$ and $L_2$ are isomorphic by a coordinate transformation. Moreover, $\alpha$ is just the dual form for $e$. This makes us hope that the system can be written in terms of $L$ only.

  Are the compatibility conditions for this system precisely the conditions $\mathcal{N}_L=0$? They must be geometric conditions on $L$ which vanish if $L$ is a Nijenhuis operator.
