statement: Construct the LMO invariant (or the theory of finite type invariants) in arrow diagrams. 11.5 Refinements of the LMO invariant (T. Le) As mentioned in a remark in Problem 11.1, the LMO invar iant is a weak invariant when b1(M ) > 0; in particular, Z L M O(M ) = 1 when b1(M ) > 3. The following two problems might give refinements of Z L M O(M ) which would be stronger than Z L M O(M ), in particular, when b1(M ) > 0.
