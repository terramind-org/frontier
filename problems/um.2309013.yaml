title: Research Problems in Function Theory — Problem 9.13
field: mathematics
tier: prose
statement: Let $K$ be a compact subset of $\mathbb{R}^n$, $n\geq3$. For $\phi\in\mathcal{D}$, let $D(\phi)$ be a least-diameter disc containing $\text{spt }\phi$; let $d(\phi) = \text{diam }(\text{spt }\phi)$, and let \[\|\phi\|_\ast=\|\phi\|_\infty+d(\phi)\cdot\|\triangledown\phi\|_\infty.\] Are the following conditions equivalent for continuous functions $f:\mathbb{R}^n\to\mathbb{R}$? [(1)] ; There exists a sequence $\{f_n\}^\infty_1$ of functions harmonic near $K$, such that $f_n\to f$ uniformly on $K$. ; There exists a function $n$ such that $n(\delta)$ decreases to $0$ as $\delta$ decreases to $0$, for which \[\Big|\int_{\mathbb{R}^n}f\delta\phi\,dx\Big|\leq\eta(d(\phi))\|\phi\|_\ast C(D(\phi)-X).\] Here $C$ denotes the harmonic capacity of $\mathbb{R}^n$ obtained from the kernel $r^{-n+2}$. Note that $(1)$ implies $(2)$, and that $(2)$ implies $(1)$ if $f$ is a $C^2$-function. The condition $(2)$ is formally analogous to one that occurs in rational approximation theory. (A. G. O'Farrell)
