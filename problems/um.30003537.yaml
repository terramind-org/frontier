title: Sharp Weighted Bounds for Rough Singular Integrals
field: mathematics
tier: prose
statement: For a rough homogeneous singular integral $T_\Omega$ with $\Omega\in L^\infty(S^{n-1})$ and mean zero, can the weighted estimate $\lVert T_\Omega\rVert_{L^2(w)\to L^2(w)}\lesssim[w]_{A_2}^2$ be improved to linear dependence on $[w]_{A_2}$? Is the maximal singular integral $T_\Omega^\star$ of weak type $(1,1)$?
