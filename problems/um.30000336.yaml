title: Nonstabilized Weakly Reducible Heegaard Splittings
field: mathematics
tier: prose
statement: For the complements of the twisted torus knots $T(7,17,10m-4)$ with sufficiently large $|m|$, is the weakly reducible Heegaard splitting obtained by boundary stabilization of the unique genus-two Heegaard splitting stabilized? More generally, does a three-manifold with one boundary component admit a weakly reducible nonstabilized Heegaard splitting whose weak reduction is nonessential?
