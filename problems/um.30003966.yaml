title: Teichmüller Projections of Hitchin Components
field: mathematics
tier: prose
statement: Does there exist a mapping-class-group-equivariant projection from the Hitchin component for $\operatorname{PSL}(n,\mathbb{R})$ to Teichmüller space $T(\Sigma_g)$ whose fiber over a Riemann surface $X$ is $\bigoplus_{i=3}^n H^0(X,K_X^i)$?
