title: Stein Tangent Bundles of Complete Hessian Manifolds
field: mathematics
tier: prose
statement: If $(M,g)$ is a complete Hessian manifold, is its tangent bundle with the natural complex structure a Stein manifold? In particular, if a convex domain $\Omega\subset\mathbb{R}^n$ contains no complete line and a discrete affine group $\Gamma$ acts freely and properly discontinuously, is $T(\Omega/\Gamma)$ Stein?
