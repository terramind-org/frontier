title: Poisson Laws across Boundary Regimes of Random Hyperbolic Surfaces
field: mathematics
tier: prose
statement: Find a unified proof of the known volume identities and determine further volumes for which they hold. Prove a Poisson-limit interpolation for simple closed geodesics on random genus-$g$ hyperbolic surfaces with one boundary of length $L_g$ across the regimes $L_g=o(g)$, $L_g/g\to c$, and $L_g\gg g$, including existence of the required continuous rescaling function.
