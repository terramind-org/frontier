title: Minimal Pseudo-Anosov Dilatations
field: mathematics
tier: prose
statement: What is the behavior of the minimum pseudo-Anosov dilatation $\delta(S_{g,n})$ as a function of genus $g$ and punctures $n$? Is there an accumulation point of normalized dilatations smaller than $\ell_0=((3+\sqrt 5)/2)^2$, and what do small-dilatation mapping classes look like?
