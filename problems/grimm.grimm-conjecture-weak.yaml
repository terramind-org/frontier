lean:
  module: FormalConjectures.Wikipedia.Grimm
  decl: Grimm.grimm_conjecture_weak
  statement: |-
    theorem grimm_conjecture_weak (n k : ℕ) (hn : 1 ≤ n) (hk : 1 ≤ k)
        (h : ∀ i : Fin k, (n + i).Composite) :
        ∃ ps : Fin k ↪ ℕ,  ∀ i : Fin k, (ps i).Prime ∧ ∃ j : Fin k, ps i ∣ (n + j)
  context:
    - open Grimm
    - open Function
  definitions: []
