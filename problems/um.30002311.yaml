title: Intermediate Distributions in Stochastic Numerical Homogenization
field: mathematics
tier: prose
statement: For a multiscale numerical approximation $u_\varepsilon^h$ of a stochastic heterogeneous partial differential equation and the corresponding numerical homogenized solution $u_0^h$, determine the limiting distribution of the appropriately normalized fluctuation $u_\varepsilon^h-u_0^h$ as $\varepsilon\to0$ with coarse scale $h$ fixed. Does this intermediate distribution converge, as $h\to0$, to the fluctuation law predicted by continuum corrector theory?
