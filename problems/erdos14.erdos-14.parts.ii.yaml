lean:
  module: FormalConjectures.ErdosProblems.«14»
  decl: Erdos14.erdos_14.parts.ii
  statement: |-
    theorem erdos_14.parts.ii :
        ∃ (A : Set ℕ), IsLittleO atTop (nonUniqueSumCount A) squareRoot
  context:
    - open Erdos14
    - open Erdos14.erdos_14
    - open Erdos14.erdos_14.parts
    - open Asymptotics Filter
  definitions:
    - name: Erdos14.nonUniqueSumCount
      kind: def
      text: |-
        /--
        The number of integers in $\{1,\ldots,N\}$ which are not representable in exactly one way
        as the sum of two elements from $A$ (either because they are not representable at all, or
        because they are representable in more than one way).
        -/
        noncomputable def nonUniqueSumCount (A : Set ℕ) (N : ℕ) : ℝ :=
          ((Set.Icc 1 N) \ (allUniqueSums A)).ncard
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/14.lean#L34
    - name: Erdos14.squareRoot
      kind: def
      text: |-
        noncomputable def squareRoot (N : ℕ) : ℝ :=
          Real.sqrt N
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/14.lean#L45
