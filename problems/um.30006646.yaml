title: Etingof-Ostrik Cohomological Finite-Generation Conjecture
field: mathematics
tier: prose
statement: Let $\mathcal C$ be a finite tensor category. Prove that $H^*(\mathcal C)=\operatorname{Ext}^*_{\mathcal C}(\mathbf 1,\mathbf 1)$ is Noetherian and that $\operatorname{Ext}^*_{\mathcal C}(M,N)$ is a finite $H^*(\mathcal C)$-module for all objects $M,N\in\mathcal C$.
