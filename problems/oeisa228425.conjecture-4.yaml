id: oeisa228425.conjecture-4
title: Partitions of $n$ into $x + y$ with $x(x+1)/2 + y^2$ prime (conjecture_4)
field: mathematics
tier: proof
statement: |-
  For $k = 5$, the pair $(5, m)$ works (with $m > 5$) if $m$ is congruent to $0$ or $4$ modulo $6$,
  in the sense that all sufficiently large integers $n$ can be written as $x + y$ ($x, y > 0$) with
  $p_5(x) + p_m(y)$ prime.
  - _Zhi-Wei Sun_
