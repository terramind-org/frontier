  decl: OeisA228425.conjecture_4
  statement: |-
    theorem conjecture_4 (m : ℕ) (hm : 5 < m) (hmod : m ≡ 0 [MOD 6] ∨ m ≡ 4 [MOD 6]) :
        ∀ᶠ (n : ℕ) in Filter.atTop, ∃ x y : ℕ, 0 < x ∧ 0 < y ∧ x + y = n ∧
          Nat.Prime (Nat.polygonalNumber 5 x + Nat.polygonalNumber m y)
