title: Kourovka Notebook Problem 20.63
field: mathematics
tier: prose
statement: |-
  a) Prove that every unitarisable group has trivial cost.

  This is known to be true for residually finite groups (I. Epstein, N. Monod, *Int. Math. Res. Notes*, **2009**, no. 22 (2009), 4336--4353).

  b) At least prove that every unitarisable group has vanishing
  first $L^2$ Betti number.
