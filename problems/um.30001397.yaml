title: Hausdorff Gauges for Conformal Measures of Elliptic Maps
field: mathematics
tier: prose
statement: For an elliptic function $f$ whose critical points are attracted to attracting or parabolic periodic points and with at least one parabolic point, does there exist a gauge function $g$ such that the atomless $h$-conformal measure on $J(f)$ equals the Hausdorff measure $\mathcal H^g$ on $J(f)$?
