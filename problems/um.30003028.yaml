title: Kummer–Vandiver Conjecture
field: mathematics
tier: prose
statement: "Kummer–Vandiver conjecture: for every odd prime $p$, if $C$ is the $p$-Sylow subgroup of the ideal class group of $\\mathbb{Q}(\\zeta_p)$, then the plus part $C^+$, equivalently each even character component $C^{(i)}$ for $0\\leq i\\leq p-3$, is zero."
