title: Optimal Stability Exponents in Convex-Body Tomography
field: mathematics
tier: prose
statement: Determine the best possible Hölder exponents in stability inequalities for reconstructing convex bodies from tomographic data derived from sections, projections, and their averages. In particular, determine the optimal dependence on the dimension $n$, conjectured to be linear in $1/n$ rather than quadratic.
