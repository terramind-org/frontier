title: Open Problems in the Theory of Ample Fields — Conjecture 8 (D\`ebes-Deschamps)
field: mathematics
tier: prose
statement: |-
  D\`ebes and Deschamps combined these two conjectures into one.
  A **regular solution** to an embedding problem $G\rightarrow\mathrm{Gal}(L/K)$ over $K$
  is a solution $\gamma:\mathrm{Gal}(F/K(t))\rightarrow G$ to the induced embedding problem
  $G\rightarrow\mathrm{Gal}(L/K)\cong\mathrm{Gal}(L(t)/K(t))$
  over $K(t)$ such that $F/L$ is regular.

  Every finite split embedding problem over any field $K$ has a regular solution.
