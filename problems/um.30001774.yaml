title: Homological and Filtration Problems for Symmetric-Group Modules
field: mathematics
tier: prose
statement: Is the Young dimension of an $S_n$-module $M$ equal to the injective dimension of its associated Schur-algebra module $G(M)$? For $\lambda$ maximal in its block, is the algebra $\operatorname{Ext}_{S_d}^{\bullet}(Y^\lambda,Y^\lambda)$ graded-commutative, and can it act naturally on the modules in that block? Does $\operatorname{Lie}(n)$, and likewise the Foulkes module, admit a Specht or dual Specht filtration?
