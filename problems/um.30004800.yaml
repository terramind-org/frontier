id: um.30004800
title: Weighted Sobolev Stability Under Nonlinear Composition
field: mathematics
tier: prose
statement: Let $G$ be smooth with a first-order zero at the origin, and let $s>1$. Does there exist $C_2=C_2(G,s)$ such that every coefficient family $\{\phi_{\widetilde{\ell}}(t)\}_{\widetilde{\ell}\in\mathbb{N}^2}$ on $[t_-,t_+]$ satisfying $\sum_{\widetilde{\ell}}(1+|\widetilde{\ell}|)^{2s}\sup_{t\in[t_-,t_+]}|\phi_{\widetilde{\ell}}(t)|^2\leq1$ also satisfies $\sum_{\widetilde{\ell}}(1+|\widetilde{\ell}|)^{2s}\sup_{t\in[t_-,t_+]}|(G\circ\phi)_{\widetilde{\ell}}(t)|^2\leq C_2$?
