title: Banach Spaces and Ramsey Theory — Problem 6
field: mathematics
tier: prose
statement: |-
  *(Block homogeneous basis problem -- see [FR])*
  Let $X$ be a Banach space with a normalized block homogeneous Schauder
  basis. Is it true that $X$ is isomorphic to $c_0$ or $\ell_p$ for some
  $1\leqslant p<+\infty$?
