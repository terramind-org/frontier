title: Kirby Problem 4.103
field: mathematics
tier: prose
statement: |-
  (a) What polynomials can occur as the Alexander polynomials of complex plane algebraic curves?

  (b) More generally, what are the conditions that must be satisfied by a finitely presented group G, so that there exist a plane algebraic curve having Gas the fundamental group of its complement?
