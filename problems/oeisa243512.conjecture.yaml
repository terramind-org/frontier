lean:
  module: FormalConjectures.OEIS.«243512»
  decl: OeisA243512.conjecture
  statement: "theorem conjecture (n : ℕ) : a n ≠ 0"
  context:
    - open OeisA243512
    - open Finset
  definitions:
    - name: OeisA243512.a
      kind: def
      text: |-
        /-- Least positive integer $i$ such that `abundancyDiff i = n`, or $0$ if no such index exists. -/
        noncomputable def a (n : ℕ) : ℕ :=
          sInf {i : ℕ | 0 < i ∧ abundancyDiff i = n}
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/243512.lean#L45
