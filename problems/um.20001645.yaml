title: The exact Aut-to-Out correction for characteristic congruence kernels
field: mathematics
tier: prose
statement: |-
  **Problem 3.3.** What are and what is known about the finite index subgroups of \(\operatorname{Out}(F_n)\)?

  One fact about finite-index subgroups concerns principal congruence subgroups. Given \(H\) a characteristic finite-index subgroup of \(F_n\), one has
  \[
  \Gamma=\ker\bigl(\operatorname{Aut}(F_n)\longrightarrow
  \operatorname{Aut}(F_n/H)\bigr).
  \]
