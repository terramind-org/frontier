id: um.20002661
title: Relative free-difference-quotient constants and spectral gaps
field: mathematics
tier: prose
statement: |-
  In a von Neumann algebra \(M\) with a faithful normal trace-state τ let \(X=X^*\in M\) and let \(1\in B\subset M\) be an infinite-dimensional von Neumann subalgebra so that \(B\) and \(X\) are free in the algebraic sense and \(M=W^*(X,B)\). Assume that ∂\(_{X:B}\) is closable in \(L^2(M,τ)\). ... Under what conditions are the \(L^2\) solutions of ∂\(_{X:B}u=0\) in \(L^2(B,τ)\)? A related question ... when does the free Poincare inequality

  \[
  C\|\partial_{X:B}\xi\|_2\geq \|\xi-E_B\xi\|_2
  \]

  hold for ξ in \(B\langle X\rangle\)?
