lean:
  module: FormalConjectures.ErdosProblems.«1017»
  decl: Erdos1017.erdos_1017.lower_bound
  statement: |-
    theorem erdos_1017.lower_bound :
        ∀ n k : ℕ, k ≤ n.choose 2 → n * n < 4 * k →
          erdos_1017.lower_bound.answer n k ≤ f n k
  context:
    - open Erdos1017
    - open Erdos1017.erdos_1017
    - open SimpleGraph
  definitions:
    - name: Erdos1017.f
      kind: def
      text: |-
        /-- The least uniform bound on the number of cliques in an edge partition of an
        $n$-vertex, $k$-edge graph. For infeasible parameters the value is zero. -/
        noncomputable def f (n k : ℕ) : ℕ :=
          sInf {m : ℕ | ∀ G : SimpleGraph (Fin n), G.edgeSet.ncard = k →
            ∃ P : Finset (Finset (Fin n)), G.IsCliqueEdgePartition P ∧ P.card ≤ m}
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/1017.lean#L42
