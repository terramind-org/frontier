title: Foliations and Diffeomorphism Groups — Question 53
field: mathematics
tier: prose
statement: |-
  Let $G$ denote the group of area and orientation preserving homeomorphisms of the 2-sphere, and $[G,G]$ its subgroup generated by commutators. We recently proved ([cristofaro2023pfh], see also [cristofaro2024proof, cristifaro-gardiner2022quantitative]) that $G$ is not perfect, i.e.
  \[ [G,G]\varsubsetneq G\]
  However, the group $G$ remains poorly understood and the following questions are wide open:

  What is $[G,G]$ ?
  What is the quotient $G/[G,G]$?
