title: Three-way divisibility and a list strengthening for even-hole-free graphs
field: mathematics
tier: prose
statement: |-
  A \(k\)-division of a graph \(G\) is a partition of \(V(G)\) into
  \(V_1,\ldots,V_k\) such that no \(V_i\) contains a largest clique of
  \(G\). A graph is \(k\)-divisible if each of its induced subgraphs with at
  least one edge has a \(k\)-division.

  **Conjecture 2 (Hoàng).** Every even-hole-free graph is 3-divisible.
