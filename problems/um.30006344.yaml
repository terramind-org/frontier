title: Geometric Realizability of Algebraic Two-Complexes over Group Rings
field: mathematics
tier: prose
statement: Let $G$ be a finitely presented group. Characterize which algebraic two-complexes of $\mathbb{Z}[G]$-modules are geometrically realizable as the cellular chain complexes of finite two-dimensional CW-complexes with fundamental group $G$.
