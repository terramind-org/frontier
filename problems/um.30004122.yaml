title: Conlon–Lee Conjecture for Graph Subdivisions
field: mathematics
tier: prose
statement: Let $k\geq2$ be even, let $H$ be a graph, and write $H^{k-1}$ for the subdivision obtained by replacing every edge of $H$ with a path having exactly $k-1$ new internal vertices. Does there exist $\delta>0$ such that $$\operatorname{ex}(n,H^{k-1})=O(n^{1+1/k-\delta})$$?
