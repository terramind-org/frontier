  definitions:
    - name: Green65.IsNonzeroSquare
      kind: def
      text: |-
        /-- An integer is a nonzero square if it is the square of a nonzero natural number. -/
        def IsNonzeroSquare (d : ℤ) : Prop :=
          ∃ n : ℕ, n ≠ 0 ∧ d = (n : ℤ) ^ 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/GreensOpenProblems/65.lean#L35
    - name: Green65.LargeDifferencePattern
      kind: def
      text: |-
        /--
        There is a fixed density exponent $c > 0$ such that every sufficiently large subset
        $A \subseteq [N]$ with $|A| \geq N^{1-c}$ has a difference satisfying $P$.

        We model $[N]$ as the integer interval $\{1, \ldots, N\}$ and use sufficiently large $N$, since
        the literal small-$N$ version is false for the nonzero-square question.
        -/
        def LargeDifferencePattern (P : ℤ → Prop) : Prop :=
          ∃ c : ℝ, 0 < c ∧ c < 1 ∧ ∀ᶠ N : ℕ in atTop, ∀ A : Finset ℤ,
            A ⊆ Finset.Icc 1 (N : ℤ) →
              (N : ℝ) ^ (1 - c) ≤ (A.card : ℝ) →
                ∃ d ∈ A - A, P d
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/GreensOpenProblems/65.lean#L43
