title: The surface cone of a split rank-three bundle over the projective plane
field: mathematics
tier: prose
statement: |-
  In (Fulger 2011, MR2836078) Fulger showed how to compute the effective cone of \(k\)-cycles \(\operatorname{Eff}^k(\mathbb P(\mathcal E)\) of a projective bundle over a smooth curve. In this case the answer can be given in terms of data coming from the Harder–Narasimhan filtration of \(\mathcal E\). However, even in the case where \(X\) is a \(\mathbb P^2\)-bundles over a surface \(S\), it is not known how to compute \(\operatorname{Eff}_2(X)\). It is natural to first consider the case where \(S\) is the projective plane or a K3 surface.

  **What is the effective cone of surfaces \(\operatorname{Eff}_2(X)\) where \(X\) is a \(\mathbb P^2\)-bundle over \(\mathbb P^2\)?**
