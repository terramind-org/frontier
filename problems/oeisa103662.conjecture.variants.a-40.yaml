lean:
  module: FormalConjectures.OEIS.«103662»
  decl: OeisA103662.conjecture.variants.a_40
  statement: |-
    theorem conjecture.variants.a_40 :
      ¬ ∃ (b : ℕ), IsValidZerolessPower 40 b
  context:
