    - open Nat List Set
  definitions:
    - name: OeisA103662.IsValidZerolessPower
      kind: def
      text: |-
        /--
        A helper predicate: $b^n$ is a power with base $>1$ whose decimal representation
        does not contain the digit 0.
        We assume $n$ is the exponent, $n \ge 1$.
        -/
        def IsValidZerolessPower (n b : ℕ) : Prop :=
          b > 1 ∧ 0 ∉ digits 10 (b ^ n)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/103662.lean#L36
