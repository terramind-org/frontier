title: Negative Ricci Curvature on Solvable Lie Algebras
field: mathematics
tier: prose
statement: Let $\mathfrak{g}$ be a solvable Lie algebra with nilradical $\mathfrak{n}$. Does $\mathfrak{g}$ admit an inner product with $\operatorname{Ric}<0$ if and only if some $X\in\mathfrak{g}\setminus\mathfrak{n}$ has $\left.\operatorname{ad}X\right|_{\mathfrak{n}}$ satisfying linear inequalities determined solely by $\mathfrak{n}$?
