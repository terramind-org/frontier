title: Chain-Independent Homology Growth in Finite Covers
field: mathematics
tier: prose
statement: Let $G$ be finitely presented. For every field $K$ and every inverse system of finite-index normal subgroups $(G_i)_{i\in I}$ with $\bigcap_iG_i=\{1\}$, does the limit $\lim_{i\in I}b_1(G_i;K)/[G:G_i]$ exist and remain independent of the choices of $(G_i)$ and $K$?
