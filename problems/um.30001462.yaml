title: Facet Connectivity in the Fan of $D_h$
field: mathematics
tier: prose
statement: For each cone $\sigma$ in the fan defining $D_h$, is there a sequence of cones $\sigma_1=\sigma,\ldots,\sigma_r$ such that consecutive cones meet in a common facet and one facet of $\sigma_r$ is defined by $d_i=0$ for some $i$?
