title: Quantitative accounting for a many-turn spiral under curve shortening
field: mathematics
tier: prose
statement: It makes sense to consider the weak limit of manifolds with lower sectional curvature bounds by passing to a sequence of covers if the sequence collapses. Is the universal cover of an almost flat manifold uniformly locally $\mathrm{CAT}(0)$ (after rescaling the metric)? Is there a uniform bound on the injectivity radius of the universal cover of manifolds with $|K| \le 1$?
