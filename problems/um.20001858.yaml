title: Formation diameter after deleting one bar
field: mathematics
tier: prose
statement: |-
  **9. (St. John)** Consider a multi-robot formation that is a generically minimally rigid framework \(G\), with diameter
  \[
  D=\max_{(p_i,p_j)}\|p_i-p_j\|.
  \]
  We remove an edge and obtain \(\bar G\) that is flexible. Let
  \[
  d=\min \operatorname{diameter}(\text{configuration space of }\bar G).
  \]
  Question: Understand the relationship between \(D\) and \(d\), and find algorithms to detect what edge to delete for maximal change in diameter. More precisely, find find bar \(e\) and “positioning” \(q\) such that the diameter of \((G\setminus e,q)\) is minimum under the constraints that bar lengths in \(G\setminus e\) are maintained.
