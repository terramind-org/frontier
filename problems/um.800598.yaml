title: Selection Principles in Mathematics — Problem 26 ([tautau])
field: mathematics
tier: prose
statement: |-
  $Y\subseteq{[\mathbb{N}]^{\aleph_0}}$ is *linearly refinable*
  if for each $y\in Y$ there exists an infinite subset
  $\hat y\subseteq y$ such that the family $\hat Y = \{\hat y : y\in Y\}$ is
  linearly (quasi)ordered by $\subseteq^*$.
  A cover $\mathcal{U}=\{U_n : n\in\mathbb{N}\}$ of $X$ is a *$\tau^*$-cover* of $X$ if it is large,
  and the family of all sets $\{n : x\in U_n\}$, $x\in X$,
  is linearly refinable.
  $\mathrm{T}^*$ is the collection of all countable open $\tau^*$-covers of $X$.

  Every analytic space satisfies $\binom{\mathrm{T}}{\Gamma}$ [tau].

  Does $\{0,1\}^{\mathbb{N}}$ satisfy $\binom{\mathrm{T}^*}{\Gamma}$?
