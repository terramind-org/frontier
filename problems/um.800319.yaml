title: Complexity in Enumerative Combinatorics — Conjecture 3
field: mathematics
tier: prose
statement: |-
  It was shown in [Ges] that similar polynomial recurrences exist for the number
  of $k$-regular labeled graphs, for every fixed $k\ge 1$.

  Fix $k\ge 1$ and let $a_n$ be the number of unlabeled
  $k$-regular graphs with $n$ vertices. Then $\{a_n\}$
  can be computed in \textup{\textrm{poly}}$(n)$ time.
