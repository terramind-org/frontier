title: Enumeration of Matchings — Problem 1
field: mathematics
tier: prose
statement: |-
  Show that in the $2n-1,2n,2n-1$ semiregular hexagon,
  the central location (consisting of the two innermost triangles) is
  covered by a lozenge in exactly one-third of the tilings.

  (Equivalently: Show that if one chooses a random perfect matching of
  the dual graph, the probability that the central edge is contained
  in the matching is exactly 1/3.)
