title: CMC Min–Max Width Under Nonnegative Scalar Curvature
field: mathematics
tier: prose
statement: |-
  Let $(M^3,g)$ be complete, asymptotically flat, without boundary, with nonnegative scalar curvature, and not isometric to $\mathbb R^3$. For $c>0$, is the one-parameter min–max value $\omega_c$ of

  $$\mathcal A_c(\Omega)=\operatorname{Area}(\partial\Omega)-c\operatorname{Vol}(\Omega)$$

  always less than $16\pi/(3c^2)$?
