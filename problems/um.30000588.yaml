title: Additivity of Knot Crossing Number
field: mathematics
tier: prose
statement: "For all oriented knots $K_1$ and $K_2$, the crossing number should be additive under connected sum: $c(K_1\\mathbin{\\#}K_2)=c(K_1)+c(K_2)$."
