id: oeisa234246.conjecture-5
title: Number of integers $0 < k < n$ such that $k \phi(n - k) + 1$ is a square (conjecture_5)
field: mathematics
tier: proof
statement: |-
  Conjecture (iii): If $n > 7$ is not equal to $10$ or $20$, then $\phi(k)\phi(n - k) + 1$
  is a square for some $0 < k < n$.
