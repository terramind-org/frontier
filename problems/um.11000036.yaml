title: Conjecture 3.15 — (Density of pseudo-Anosovs).
field: mathematics
tier: prose
statement: (Density of pseudo-Anosovs). LetP denote the set of pseudo-Anosov ele- ments of Modg. Then d(P) = 1. J. Maher [ Mah] has recently proven that a random walk on Mod g lands on a pseudo-Anosov element with probability tending to one as the length of the walk tends to infinity. I. Rivin [ Ri] has proven that a random (in a certain specific sense) element of Mod g is pseudo-Anosov by proving a corresponding result for Sp(2 g, Z). While the methods in [ Mah] and [ Ri] may be relevant, Conjecture 3.15 does not seem to follow directly from these results. As another test we pose the following.
