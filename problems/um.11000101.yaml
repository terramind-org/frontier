title: Question — Does ModS has the Kazhdan property (T)?
field: mathematics
tier: prose
statement: Does ModS has the Kazhdan property (T)? A positive answer would imply the positive answer to the previous question, but this problems seems to be much more diﬃcult. Most of the known proofs of the property (T) for discrete groups are eventually based on the relations of these discrete groups with Lie groups and on the representation theory of Lie groups. Such an approach is not available for Mod S. New approaches to the Kazhdan Property (T) (see, for example Y. Shalom [ Shal], A. ˙Zuk [ Z] and the N. Bourbaki Seminar report of A. Valette [ V]) hold a better promise for our problem, but, to the best of my knowledge no serious work in this direction was done. The problem remains completely open.
