title: Open Problems in Arithmetic Dynamics — Question 27
field: mathematics
tier: prose
statement: |-
  Let $f:\mathbb{P}^N\dashrightarrow\mathbb{P}^N$ be a dominant rational map. Is it
  true that there exists an integer $\ell_f$ satisfying $0\le\ell_f\le
  N$ such that (We recall that the notation $F(n)\asymp G(n)$
  means that there are positive constants $c_1,c_2,c_3$, depending on $F$
  and $G$, so that $c_1F(n) \le G(n) \le c_2F(n)$ for all $n\ge c_3$.)
  \[
  \deg(f^n) \asymp n^{\ell_f} \delta_f^n,
  \]
  where the implied constants may depend on $f$, but not on $n$?
