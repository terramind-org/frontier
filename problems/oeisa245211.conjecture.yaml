    - open Finset
  definitions:
    - name: OeisA245211.a
      kind: def
      text: |-
        /-- Sum over all proper divisors $d$ of $n$ of $d \cdot \tau(d)$, where $\tau(d)$ is the
        number of divisors of $d$. -/
        def a (n : ℕ) : ℕ :=
          ∑ d ∈ n.properDivisors, d * d.divisors.card
