title: Billiards and Quantitative Symplectic Geometry — Olga Paris-Romaskevich — Problem 3
field: mathematics
tier: prose
statement: |-
  \begin{question} In the class of tiling billiards in periodic tilings, is there a finite list of generic archetypal behaviors? For instance, the tiling billiards for which generic behavior is understood fall into one of two categories: either their typical trajectories are dense in open sets of the plane, as in cases 1. and 5., or the behavior is integrable (typical trajectories are either periodic or linearly escaping), as in cases 2. and 3. (and conjecturally in case 4. as well). One could ask whether such a dichotomy holds in general.
  \end{question}

  Locally foldable periodic tiling billiards, up to some technical regularity conditions, are integrable. This is not at all obvious but follows from fine Morse theory developed by Ivan Dynnikov, see in particular Theorem $1$ in [Dynnikov_main], and [PaRoH]. The first ingredient in the proof comes from [BDFI18] and was further developed in [TAF, PaRoH]. It states that for any locally foldable tiling there exists a **global folding map** $\mathcal{F}$ defined on a tiled plane such that, on the restriction of two neighboring tiles, it is a folding of one of them onto the other along the common edge (which is an axial symmetry with respect to this edge).

  It seems that the tilings on which one could start testing Question $1$ should be the simplest not-locally foldable tilings - for example, irrational brick tiling billiards or the parallelogram tiling billiards that we discuss in Question $2$.
