title: Problem 2B — The same questions concerning the approximate solutions.
field: mathematics
tier: prose
statement: The same questions concerning the approximate solutions. That is, for any $i$ and any $(a,b)\in U_{i}$, the value $\varphi_{i}(a,b)$ should be not necessarily a root of the system $\{f_{a}=0,g_{b}=0\}$, but just a point in the $\varepsilon$–neighborhood of such a root for some fixed positive $\varepsilon$.
