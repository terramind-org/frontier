title: Moments of L-functions — Moments of the Riemann zeta function — Problem 5
field: mathematics
tier: prose
statement: |-
  In 1989 Zavorotnyi proved that
  \[
  I_2(T) = T P_4 (\log T) + O( T^{\frac{2}{3}+\varepsilon}),
  \]
  where $P_4$ is a specific degree $4$ polynomial.
  Improve the bound in the error term. \\
  (Nathan Ng, Lethbridge)
