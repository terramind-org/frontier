title: Refinements and Degenerations in Schrödinger Spectral Gaps
field: mathematics
tier: prose
statement: For one-dimensional Schrödinger operators, characterize the largest class of potentials for which the fundamental-gap estimate holds. Are the normalized potential means $\langle Vu_j^2\rangle$ increasing with the eigenvalue index $j$, and can the gap estimate be sharpened by a correction term involving $V$? Can Lavine-type, Brascamp–Lieb, or Korevaar methods yield analogous or stronger estimates in higher dimensions?
