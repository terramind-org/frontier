title: Minimum polychromatic number for plane graphs with fixed girth
field: mathematics
tier: prose
statement: For a plane graph $G$, let $g(G)$ denote the length of the shortest face in $G$. For a (not necessarily proper) $k$-coloring of $V(G)$ we say that a face is polychromatic if all $k$ colors appear on its vertices. A k-coloring of $V(G)$ is called polychromatic if every face of $G$ is polychromatic. The polychromatic number of $G$, denoted by $p(G)$, is the largest number $k$ such that there is a polychromatic $k$-coloring of $V(G)$. Define $p(g)=\min\{p(G)|g(G)=g\}$. Determine $p(g)$ exactly for every positive integer $g$. The first open case is $g=5$ where we know that $2 \leq p(5) \leq 4$.
