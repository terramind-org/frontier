title: Littlewood Conjecture
field: mathematics
tier: prose
statement: For every $(\alpha,\beta)\in\mathbb R^2$, is $\liminf_{q\to\infty}q\lVert q\alpha\rVert\,\lVert q\beta\rVert=0$, where $\lVert\cdot\rVert$ denotes distance to the nearest integer?
