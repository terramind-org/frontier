title: A Nonamenable Extension Beyond Thompson's Group
field: mathematics
tier: prose
statement: Let $\alpha(t)=t+1/2$ and let $\beta$ be the piecewise-projective homeomorphism of $\mathbb R$ defined by $\beta(t)=t$ for $t\leq0$, $\beta(t)=t/(1-t)$ for $0\leq t\leq1/2$, $\beta(t)=3-1/t$ for $1/2\leq t\leq1$, and $\beta(t)=t+1$ for $t\geq1$. Is the subgroup $\langle\alpha,\beta\rangle$ of Monod's group nonamenable, and what structural role does the coefficient $1/2$ play in its relation to Thompson's group $F$?
