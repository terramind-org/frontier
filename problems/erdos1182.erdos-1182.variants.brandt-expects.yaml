  module: FormalConjectures.ErdosProblems.«1182»
  decl: Erdos1182.erdos_1182.variants.brandt_expects
  statement: |-
    theorem erdos_1182.variants.brandt_expects :
        ∀ᶠ n : ℕ in atTop, 2 * n < F n ∧ F n < 6 * n
  context:
    - open Erdos1182
