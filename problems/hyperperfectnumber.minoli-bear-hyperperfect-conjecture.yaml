title: Hyperperfect numbers (minoli_bear_hyperperfect_conjecture)
field: mathematics
tier: proof
statement: |-
  Minoli and Bear's conjecture (1975; Guy 2004, §B2, pp. 74–75): for every integer $k \ge 1$, at
  least one $k$-hyperperfect integer exists.
