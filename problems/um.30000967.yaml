title: Uniqueness of Dirichlet Forms on the Sierpinski Carpet
field: mathematics
tier: prose
statement: For the Sierpiński carpet $F$, do the Barlow–Bass and Kusuoka–Zhou Dirichlet forms with the common Besov–Lipschitz domain coincide up to a positive multiplicative constant; equivalently, is there a unique ‘nice’ Dirichlet form on $F$?
