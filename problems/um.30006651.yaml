title: Periodic Loci for Derived Permutation Modules
field: mathematics
tier: prose
statement: Let $G$ be a finite or profinite group and let $H\leq G$ be a finite or profinite $p$-subgroup. Prove that the point $P(H,p)$ in the spectrum of compact derived permutation modules is periodic if and only if $p$ is periodic; equivalently, prove that the periodic locus is the complement of the closed points.
