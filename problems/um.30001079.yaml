title: Fluctuations of Poisson-Line Cell Boundary Paths
field: mathematics
tier: prose
statement: Let $C_n$ be the Poisson-line-process cell containing $(-n/2,0)$ and $(n/2,0)$, and follow $\partial C_n$ clockwise between those points. What are the fluctuations of the path length and its maximum lateral deviation from the Euclidean segment? How far can the true network geodesic differ from the clockwise or counterclockwise boundary paths?
