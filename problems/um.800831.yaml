title: Geometric Hydrodynamics in Open Problems — Problem 30
field: mathematics
tier: prose
statement: |-
  Find a direct link from 3D NLS equation to 1D NLS equation as a reduction to singular solutions,
  rather than going through the LIA procedure.
  A similar question arises for the compressible Euler equations as a reduction
  from 3D to singular solutions supported on 1D submanifolds.
