title: Research Problems in Function Theory — Problem 3.14
field: mathematics
tier: prose
statement: Let there be given an integrable function $F$ on $\mathbb{T}$ and a point $z_0$ in $\mathbb{D}$. The problem is to maximise $u(z_0)$, where $u$ runs through all functions which are subharmonic in $\mathbb{D}$, equal to $F$ on $\mathbb{T}$, and which satisfy \[\inf u(re^{i\theta})\leq 0, \hspace{1cm}0 < r < 1.\] (A. Baernstein)
