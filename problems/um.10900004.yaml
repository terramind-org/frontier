title: 1.4 (Danciger) — Convex projective structures on glued figure-eight complements
field: mathematics
tier: prose
statement: Let $N$ be the closed $3$-manifold obtained by gluing two copies of the figure-eight knot complement along their torus boundaries by a homeomorphism. Does $N$ admit a convex projective structure?
