title: Derived Subgroups, Automorphisms, and Solvable Group-Algebra Units
field: mathematics
tier: prose
statement: For a free group $G$, is $G\cap(1+\delta_n(\mathbb{Z}G))$ equal to the $n$-th derived subgroup $G^{(n)}$, and what is the analogous intersection over a field of positive characteristic or for an arbitrary group? For a finite $p$-group $G$ over the field $k$ with $p$ elements, can every automorphism of $kG$ be written as an automorphism induced by $G$ followed by a unipotent automorphism? For a Lie-solvable group algebra $KG$ over a field of odd characteristic, does there exist $f:\mathbb{N}\to\mathbb{N}$ such that $\operatorname{dl}(U(KG))\leq f(\operatorname{dl}^L(KG))$?
