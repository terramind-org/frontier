lean:
  module: FormalConjectures.Paper.PudlakFiniteDomainConjectures
  decl: PudlakFiniteDomain.sat_no_p_optimal_proof_system
  statement: |-
    theorem sat_no_p_optimal_proof_system (L : DecisionProblem) (hL : IsCompleteFor NP L) :
        ¬∃ P : List Bool → List Bool, IsPOptimalProofSystem L P
  context:
    - open PudlakFiniteDomain
    - open ComplexityTheory
  definitions:
    - name: PudlakFiniteDomain.IsCompleteFor
      kind: def
      text: |-
        /-- `L` is **complete** for the class `C` under polynomial-time many-one reductions. -/
        def IsCompleteFor (C : DecisionComplexityClass) (L : DecisionProblem) : Prop :=
          L ∈ C ∧ ∀ L' ∈ C, ManyOneReducible L' L
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Paper/PudlakFiniteDomainConjectures.lean#L55
    - name: PudlakFiniteDomain.IsPOptimalProofSystem
      kind: def
      text: |-
        /-- `P` is a **p-optimal** proof system for `L`: a proof system that p-simulates every proof
        system for `L`. -/
        def IsPOptimalProofSystem (L : DecisionProblem) (P : List Bool → List Bool) : Prop :=
          IsProofSystem L P ∧ ∀ Q, IsProofSystem L Q → PSimulates P Q
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Paper/PudlakFiniteDomainConjectures.lean#L78
