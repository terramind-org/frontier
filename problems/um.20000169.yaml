title: Prime support of possible odd equivariant MU-classes
field: mathematics
tier: prose
statement: |-
  Quillen's theorem for \(MU\) states that the map from the Lazard ring \(L\) to
  \(\pi_*MU\) is an isomorphism and so, in particular, the homotopy of \(MU\) is
  concentrated in even degrees. Furthermore, when \(G\) is a finite abelian
  group, it is known that the \(G\)-equivariant homotopy of \(MU\) is also even.

  For any finite or compact Lie group \(G\), is it also the case that
  \(\pi_*^G(MU)\) is even?
