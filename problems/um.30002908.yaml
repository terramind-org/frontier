title: Nontrivial Actions on Invariant Prym Homology
field: mathematics
tier: prose
statement: In the Prym-homology setting, let $\mathcal D_K$ be the connected normal subgroup generated by the one-parameter subgroups arising from lifted Dehn twists. Are there examples with $H_K^{\mathcal D_K}\neq0$ on which $\mathcal G_K^\circ/\mathcal D_K$ acts nontrivially?
