statement: (T. Kerler) [Non-semisimple vs. semisimple TQFT’s, the dou - ble conjecture] (1) Clarify the diﬀerence in the content of VC andVC! Are there homological TQFT’sH such that VC is in some essential way equivalent to VC⊗H? (2) Find a construction of WB that generalizes the Turaev-Viro TQFT’s to non-semisimpleB ’s, similar to the way [216] generalized the Reshetikhin- Turaev construction. In the case of quantum groups and close d 3-mani- folds this should reproduce a version of the Kuperberg invar iant. (3) What is the relation between WB andVD(B)? Are they in some sense isomorphic TQFT’s? For the case of Uq(sl2) there is evidence from the genus=1 case that such an H is indeed given by the Frohman-Nicas- U (1)-theory. Item (2) is rather natural as a problem. As is apparent in [236] one may expect technical challenges requiring “minimal” cell decompositions of cobordisms, as opposed to general triangulations, as well as “combings” instead of framings. The last conjecture appears also as Question 5 in [209] which was motivated by works of and discussions with D. Kazhdan and S. Gelfand in 1 994. Since it is a rather nearby conjecture from a formal point of view it may have been posed already earlier. For categories arising from subfact ors and closed mani- folds results answering this conjecture have been obtained in [204]. As outlined in [209] further, more general results in this direction sho uld yield a deeper un- derstanding of both TQFT constructions involved as well as e ntail a topological picture for the Drinfel’d double construction.
