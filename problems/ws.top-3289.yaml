  \item[\hypertarget{source:3289:2}{S2}] Open Problem Garden, Multicolour Erdős--Hajnal Conjecture, node 60042, original problem page. Original question and full discussion. \url{https://www.openproblemgarden.org/op/multicolour_erdos_hajnal_conjecture}.
