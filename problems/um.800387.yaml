title: Open Problems in Arithmetic Dynamics — Question 10
field: mathematics
tier: prose
statement: |-
  Let $K$ be a field of characteristic $0$, let $f:\mathbb{P}^N\to\mathbb{P}^N$ be a
  morphism of degree $d\ge2$ defined over $K$, and for $n\ge1$, let
  $\nu=\nu(n,f)=\#\operatorname{Per}_n^*(f)$. Find general necessary and
  sufficient conditions on $f$ for the following statements to
  hold\textup:
  \begin{parts}

  (a)
  The index of the dynatomic representation $\rho_{n,f}^{\mathrm{dyn}}$ is bounded, i.e.,
  \[
  \sup_{n\ge1}\; \bigl ( \operatorname{Aut}({\mathcal{P}}_{n,\nu}^*) : \rho_{n,f}^{\mathrm{dyn}}(G_K) \bigr) < \infty.
  \]

  (b)
  For all sufficiently large $n$, the dynatomic representation
  $\rho_{n,f}^{\mathrm{dyn}}$ is as surjective as possible, i.e.,
  \[
  \rho_{n,f}^{\mathrm{dyn}}(G_K) = \operatorname{Aut}({\mathcal{P}}_{n,\nu}^*)^{\operatorname{Aut}_K(f)}.
  \]
  \end{parts}
