title: Banach–Mazur Bounds and Mean Width of Inscribed Polytopes
field: mathematics
tier: prose
statement: Let $P_n\subset B^d$ be an inscribed polytope with $n=d+k$ vertices, where $1\leq k\leq d$. Conjecturally, $\delta_{\mathrm{BM}}(P_n,B^d)\geq\widetilde{c}d/\sqrt{k}$ for an absolute constant $\widetilde{c}>0$. Also, is the mean width of an inscribed $(d+1)$-vertex polytope $P_{d+1}$ maximal for the regular simplex?
