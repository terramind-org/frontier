title: Spectral Norms of Gaussian Matrices with Variance Profiles
field: mathematics
tier: prose
statement: Let $X$ be a symmetric Gaussian random matrix whose entries on and above the diagonal are independent and have prescribed variances $b_{ij}^2$. Determine or sharply bound its operator norm, especially the spectral edge, in terms of the variance profile.
