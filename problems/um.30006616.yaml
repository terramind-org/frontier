title: Comparing Travelling-Salesman and Travelling-Polytope Metrics
field: mathematics
tier: prose
statement: For a graph $X$, vertices $x,y$, and a finite vertex set $F$, compare the minimum path length $\operatorname{TS}(x,F,y)$ through every vertex of $F$ with the minimum length $\operatorname{TP}(x,F,y)$ of a path of convex finite-vertex polytopes covering $F$. Determine sharp reverse bounds to $\operatorname{TP}\leq2\operatorname{TS}$ and compute the resulting exponent $\operatorname{TP}(X)$.
