title: Selection Principles Milestone Problems — Conjecture 40
field: mathematics
tier: prose
statement: |-
  In [wqn, FrwQN] it is shown that $s_1$ (for $X$), $\mathsf{wQN}$ (for $X$),
  and SSP (for $C_p(X)$) are all equivalent.
  This and other reasons lead to suspecting that all these equivalent properties
  are equivalent to a standard selection hypothesis.
  In [wqn], Scheepers shows that
  $\mathsf{S}_1(\Gamma,\Gamma)$ implies being an $\mathsf{wQN}$-space.

  [{Scheepers [wqn, Conjecture 1]}]
  For sets of reals, $\mathsf{wQN}$ implies $\mathsf{S}_1(\Gamma,\Gamma)$.
