statement: 'Conjecture 6. ISC: Singularities are Irrelevant. Schoen and Yau announced 35 years ago [110], [114] that their descent metod extends to singular minimal subvarieties In a series of papers over the last decade, Lohkamp suggested an approach to the solution of this conjecture(see [86]-Lohkamp The Higher Dimensional Positive Mass Theorem II 2016where one can ﬁnd references to his earlier papers). Recently, Schoen and Yau published an alternative proof of a version of the irrelevance conjecture [115]. 27 7 Flatly Twisted Spinors over Tori and their Precursors in Algebraic Topology. The kernels ofD+ andD−on the ﬂat even dimensional torus consist of parallel spinors, where both spaces haveequal dimensions(= 2n−1); hence the ordinary index of the Dirac operator vanishes on the torus. However, these parallel spinors make the followingK-theoretic indexof D non zero not only on tori, but also on what we callover-torical manifolds X, which admit maps to then-torus of non-zero degrees, or equivalently, admitsn homology classes withnon-zero intersection index. The index of the Dirac operatorD = D+⊕D−on a Riemannian manifold X of even dimensionn we speak about takes the values in theK-theory of the torus Tm which comes about as the space of theunitary charactersofπ1(X), i.e. of homomorphismsτ ∶π1(X)→T, which is them-torus form=rankQH1(X). These homomorphisms deﬁne ﬂat unitary bundleslτ, τ ∈Tm, overX which are used to "twist" the spinor bundleS = S+⊕S−overX by taking the tensor products S±⊗lτ and accordingly twist the Dirac operator on the sections of these bundles, D± τ =D± ⊗lτ ∶C∞(S±⊗lτ)→C∞(S∓⊗lτ) 27I have not studied the papers by Lohkamp and Schoen-Yau in depth. 21 The kernels ofD+ τ andD− τ, even though their dimensions, in general, depend onτ, may be regarded as vector bundles overTm the diﬀerence of which deﬁnes the K-theoretic index of Atiyah-Singer. ⋆If X admits homology classes h1,h 2,...,h n ∈H1(X) with non zero intersection index, h1 ⌢h2 ⌢...⌢hn ≠0 or, equivalently, if X admits a continuous map to then-torus with non-zero degree, then thisK-theoretic index is non-zero. This was shown in 1972 by Lustig [?'
