title: Subconvex Pointwise Equidistribution of Hecke–Laplace Eigenfunctions
field: mathematics
tier: prose
statement: |-
  Does there exist $\delta>0$ such that, for $y\in D^\times(\mathbb A_\mathbb Q)$ and every Hecke–Laplace eigenfunction $f$ of eigenvalue $\lambda$,

  $$f(y)=\int_{D^\times(\mathbb Q)\backslash D^\times(\mathbb A_\mathbb Q)}f(x)\,d\mu(x)+O(\lambda^{1/4-\delta})$$?
