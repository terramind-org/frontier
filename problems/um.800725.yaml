title: Open Problems on Central Simple Algebras — Problem 40
field: mathematics
tier: prose
statement: |-
  Amongst the first examples one sees, probably the fields ${\mathbb{R}}$ or iterated Laurent series ${\mathbb{R}}((x_1))((x_2))\cdots((x_n))$ are the only ones whose Brauer group is nonzero and finite. This leads to the following naive question:

  For which natural numbers $n$ is there a field $F$ such that $|\!\operatorname{Br}(F)| = n$?
