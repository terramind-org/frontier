title: Visibility Graphs of Points, Segments and Polygons — Problem 29
field: mathematics
tier: prose
statement: |-
  Bar visibility graphs have been generalized to rectangle visibility
  graphs by considering both vertical and horizonal visibility among bars
  having non-zero
  thickness [bdhs-orvg-1997,dh-rvrbp-1997,o-opcv-1998,r-drvg-1997,sw-rvgc-2003].
  A graph $G$ is called a *rectangle visibility graph* if it can be realized by closed isothetic
  rectangles in the plane, with pairwise disjoint interiors, with vertices representing rectangles
  in such a way that two vertices $v_i$ and $v_j$ of $G$ are connected by an edge if and only if
  their corresponding rectangles are vertically or horizontally visible
  from each other by a beam of unobstructed visibility of finite width.
  Unlike bar visibility graphs, no characterization of rectangle visibility graphs are known,
  and moreover, Shermer [s-orvsiii-1996] has shown that the problem of recognizing
  them is NP-complete. We have the following problem.

  Characterize rectangle visibility graphs.
