title: Geometric Noncollapse and Hybrid Convergence
field: mathematics
tier: prose
statement: Develop noncollapsing hypotheses based on constant-mean-curvature surfaces or isoperimetric regions. Also construct a notion of convergence for varying manifolds that implies volume-preserving intrinsic-flat convergence while retaining $W^{1,p}$ information on good regions, possibly through a metric on Riemannian manifolds.
