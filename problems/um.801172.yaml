title: Open Problems in Wavelet Theory — Problem 11
field: mathematics
tier: prose
statement: |-
  A variant of Problem 3.1 asks for a characterization of dilations for which well-localized o.n. wavelets exist. We say that a function $\psi \in L^2(\mathbb{R}^n)$ is *well-localized* if both $\psi$ and $\hat \psi$ have polynomial decay. That is, for some large $N>0$, we have
  \[
  \psi(x) = O(|x|^{-N}) \text{ as } |x| \to \infty
  \qquad\text{and}\qquad
  \hat \psi(\xi) = O(|\xi|^{-N}) \text{ as } |\xi| \to \infty.
  \]

  Let $\Gamma={\mathbb{Z}}^n$ be the lattice of translates.
  For what expansive dilations $A$ do there exist well-localized wavelets (possibly with multiple generators)?
