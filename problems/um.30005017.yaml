title: Equations of Three-Dimensional Wachspress Varieties
field: mathematics
tier: prose
statement: For a polytope $P\subset\mathbb R^3$, its Wachspress coordinates define a rational map to projective space with one coordinate for each vertex of $P$. What are the homogeneous equations of the Zariski closure of its image, and what are the higher-dimensional analogues?
