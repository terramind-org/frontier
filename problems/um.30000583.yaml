title: Projective Subspaces with Trivial Normal Bundle in Fano Manifolds
field: mathematics
tier: prose
statement: If $X$ is a Fano manifold with second Betti number $b_2(X)=1$ and $X$ is not projective space, does $X$ contain no immersed projective space $\mathbb P^k$ with trivial normal bundle for every $1<k<\dim X$?
