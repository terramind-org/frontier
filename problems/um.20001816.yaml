title: Normalized extinction-gap budget and the correct C0 topology
field: mathematics
tier: prose
statement: |-
  Consider $(S^3,g)$ with scalar curvature $R\geq 6$. The Ricci Flow exists on the maximal interval $(0,T)$. The scalar curvature evolves by
  $$\partial_t R = \Delta R + 2 |Rc|^2.$$
  One can estimate that
  $$\partial_t R = \Delta R + 2 |Rc|^2 = \Delta R + \frac 2 3 R^2 + |\mathring{Rc}|^2 \geq \Delta R + \frac 2 3 R^2 .$$
  It follows from the maximum principle that
  $$R\geq \frac{6}{1-4t} \mbox{ and } T \leq \frac 1 4.$$

  If $T$ is close to $\frac 1 4$, is $g(0)$ close to the round metric in the Gromov-Hausdorff sense and in the $C^0$ sense? One can also ask the same question for other flows such as mean curvature flow. What would be a suitable topology?
