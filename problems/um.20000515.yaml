id: um.20000515
title: A weighted Kähler characteristic and a toric logarithmic Hardy model
field: mathematics
tier: prose
statement: |-
  Given a Kähler manifold $(M, \omega)$. Define
  $H^2_\omega:=\{f: \Delta \rightarrow M : \int_\Delta \log |z|^2
  f^* \omega > -\infty \}$. Investigate these spaces, for example:
  completeness, radial limits, etc... A special case to consider is when $M$
  being toric.

  For holomorphic maps $f:\Delta\to M$, analyze the maps for which
  $\int_\Delta\log|z|^2 f^*\omega$ is finite rather than $-\infty$; specify a
  topology or metric before asking about completeness; and determine meaningful
  forms of boundary convergence, especially for toric targets.
