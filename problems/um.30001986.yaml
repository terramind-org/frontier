title: Turing Degree of Finite-Set Cardinality Indices
field: mathematics
tier: prose
statement: In computability theory and algorithmic randomness, let $(K_e)_{e \in \omega}$ be a standard effective listing of the finite $K$-trivial classes (sets of reals $A$ with prefix-free Kolmogorov complexity $K(A \upharpoonright n) \leq K(n) + e$ for all $n$). Does the cardinality function $e \mapsto |K_e|$ compute the Turing jump $\varnothing'$ or even the double jump $\varnothing''$?
