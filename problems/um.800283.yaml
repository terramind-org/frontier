title: Several Complex Variables Problem List — Problem 83
field: mathematics
tier: prose
statement: |-
  **(New) A diffeomorphism between two strongly pseudoconvex CR
  $(2n+1)$-manifolds is called quasiconformal if its differential preserves
  the underlying contact structures and distorts the CR structures boundedly.
  When Hermitian metrics on the contact bundles are fixed, this distortion
  can be measured by checking how spheres in the contact space is mapped to
  ellipsoids. However, this measurement depends on the choices of the Hermitian
  metrics if $n>1$. Fixing a quasiconformal diffeomorphism, can we choose
  Hermitian metrics so that the distortion is minimal?\\
  - Puqi Tang, tang@math.purdue.edu**
