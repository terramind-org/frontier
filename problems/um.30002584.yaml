title: Schatten-Class Commutators for Homogeneous Polynomial Modules
field: mathematics
tier: prose
statement: Let $M$ be the submodule of the Drury–Arveson space $H_d^2$ generated by homogeneous polynomials $p_1,\ldots,p_m\in\mathbb C[z_1,\ldots,z_d]$, let $S_j$ be the compression of multiplication by $z_j$ to $M^\perp$, and let $Z(p)$ be the common zero set of the generators. Are all commutators $[S_j,S_k^*]$ in the Schatten class $\mathcal S^q$ for every $q>\dim Z(p)$?
