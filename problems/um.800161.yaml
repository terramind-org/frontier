title: Moments of L-functions — Moments of the Riemann zeta function — Problem 11
field: mathematics
tier: prose
statement: |-
  Is it possible to prove an omega theorem for $I_3(T)$ assuming the ternary additive divisor conjecture?
  Prove that there exists $\Theta >0$, such that
  \[
  I_3(T) = T \mathcal{P}_9(\log T) + \Omega(T^{\Theta})
  \]
  where $\mathcal{P}_9$ is a certain degree nine polynomial. \\
  (Nathan Ng, Lethbridge)
