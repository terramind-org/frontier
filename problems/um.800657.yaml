title: Selection Principles Milestone Problems — Problem 30 ([GTpseq, Problem 0.6 (reformulated)])
field: mathematics
tier: prose
statement: |-
  Kombarov [Km] introduced the following two generalizations of $p$-sequentiality:
  Let $M$ be a collection of ultrafilters.
  $Y$ is *weakly $M$-sequential* if for
  each non-closed $A\subseteq Y$
  there exists $y\in Y\setminus A$ and a sequence $\{a_n\}_{n\in\mathbb{N}}$ in $A$
  such that ${p\mbox{-}\lim} a_n = y$ for *some* $p\in M$.
  $Y$ is *strongly $M$-sequential* if *some* is replaced
  by *for all* in the last definition.

  Assume that $X$ satisfies the $\delta_M$ property.
  Must $C_p(X)$ be weakly $M$-sequential?
