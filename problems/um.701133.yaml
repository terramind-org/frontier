title: Kourovka Notebook Problem 15.45
field: mathematics
tier: prose
statement: |-
  We define the class of *hierarchically
  decomposable* groups in the following way. First, if ${\mathfrak{X}}$ is
  any class of groups, then let $**H**_1{\mathfrak{X}}$ denote the class
  of groups which admit an admissible action on a finite-dimensional
  contractible complex in such a way that every cell stabilizer belongs
  to ${\mathfrak{X}}$. Then the ``big'' class $**H**{\mathfrak{X}}$ is defined
  to be the smallest $**H**_1$-closed class containing ${\mathfrak{X}}$.

  a) Let ${\mathfrak{F}}$ be the class of all finite
  groups. Find an
  example of an $**H**{\mathfrak{F}}$ group which is not in $**H**_3{\mathfrak{F}}$ $(=**H**_1**H**_1**H**_1F)$.

  b) Prove or disprove that there is an ordinal
  $\alpha$ such that $**H**_{\alpha}{\mathfrak{F}}=**H**{\mathfrak{F}}$,
  where $**H**_{\alpha}$ is the operator on classes of groups defined
  by transfinite induction in the obvious way starting from $**H**_1$.
  \ *Editor's comment*: It is proved that such an ordinal cannot be countable (T. Januszkiewicz, P. H. Kropholler, I. J. Leary, *Bull. London Math. Soc.*, **42**, No. 5 (2010), 896--904).
