title: Kourovka Notebook Problem 10.60
field: mathematics
tier: prose
statement: |-
  Does every periodic group ($p $-group) $A$ of
  regular automorphisms of an abelian group have non-trivial
  centre?

  *Editors' comment (2001):* The answer is
  affirmative if $A$ contains an element of order 2 or 3
  (A. Kh. Zhurtov, *Siberian Math. J.*, **41**, no. 2
  (2000), 268--275).
