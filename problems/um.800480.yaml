title: Billiards and Quantitative Symplectic Geometry — Serge Tabachnikov — Problem 2
field: mathematics
tier: prose
statement: |-
  **Inner and outer periodic orbits on immersed submanifolds..** Let $M$ be a closed immersed submanifold of Euclidean space. A generalized $n$-periodic billiard trajectory is an $n$-gon inscribed in $M$ (that is, the vertices lie on $M$) that has an extremal perimeter.

  Problem: *estimate from below the number of $n$-periodic trajectories in terms of the topology of $M$ and the immersion*.

  The case of $n=2$ was studied in [Pu], where the answer is given in terms of the topology of $M$ (but not of the immersion). For example, for a 2-dimensional torus, the number of such *diameters* is not less than 10, and this estimate is sharp. For higher periods, see [Du1,Du2].

  A similar question can be asked about periodic trajectories of the outer symplectic billiard about $M$; see [ACT] for their recent study.
