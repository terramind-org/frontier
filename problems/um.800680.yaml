title: Holomorphic Foliation Theory — Problem 7
field: mathematics
tier: prose
statement: |-
  (i) Assume that $\mathscr{F}$ is a foliation of geometric degree $d\geq 2$ on $\mathbb{P}^2$ with the line at infinity invariant and having only hyperbolic singularities. Do the leaves, except for the compact curves, have Green functions ?

  (ii) More generally, assume that $\mathscr{F}$ is in $\mathscr{B}_d$ with $d\geq 2.$ What is the function theory of leaves (in terms of Green functions), when the foliation admits a non-zero, positive closed current directed by $\mathscr{F}$ ?
