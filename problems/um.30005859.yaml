title: Persistence of Nonnegative Scalar Curvature under Intrinsic-Flat Limits
field: mathematics
tier: prose
statement: If three-manifolds $(M_j,g_j)$ with nonnegative scalar curvature converge in the Sormani-Wenger intrinsic-flat sense to a smooth Riemannian manifold $(M_0,g_0)$, must $g_0$ have nonnegative scalar curvature? Does the conclusion hold when the sequence also satisfies a uniform positive lower bound on minimal-surface area?
