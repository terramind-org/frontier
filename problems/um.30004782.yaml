title: Analytic Continuation and Functional Equations of Automorphic L-Functions
field: mathematics
tier: prose
statement: For a number field $k$, a split reductive group $G$, a cuspidal automorphic representation $\sigma$ of $G(\mathbb A)$, and a finite-dimensional dual-group representation $\rho$, prove that the automorphic $L$-function $L(s,\sigma,\rho)$ has meromorphic continuation and satisfies $L(s,\sigma,\rho)=\epsilon(s,\sigma,\rho)L(1-s,\widetilde\sigma,\rho)$.
