title: Character Multiplicities and Kac–Moody Roots
field: mathematics
tier: prose
statement: For a generic tuple of irreducible characters $X_1,\ldots,X_k$ of $\operatorname{GL}_n(\mathbb F_q)$ and its associated quiver dimension vector $v$, is $\langle X_1\otimes\cdots\otimes X_k,1\rangle$ an integer polynomial in $q$ with positive coefficients when the characters are split and leading coefficient $1$, nonzero exactly when $v$ is a Kac–Moody root, and equal to $1$ exactly for a real root?
