statement: For the enumerative series $F_{g,m}(\alpha;\gamma_1,\ldots,\gamma_N)$ associated with Hilbert schemes of points on a K3 surface, prove the conjectured quasi-Jacobi-form structure with its predicted index and weight, the multiple-cover formula via formal Hecke operators, and the holomorphic-anomaly equation.
