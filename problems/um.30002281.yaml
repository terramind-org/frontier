title: Motivic Stabilization of Symmetric Powers
field: mathematics
tier: prose
statement: |-
  Motivic stabilization conjecture: If $X$ is geometrically irreducible, then

  $$\frac{[\operatorname{Sym}^nX]}{\mathbb L^{n\dim X}}$$

  tends to a limit as $n\to\infty$.
