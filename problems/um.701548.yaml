title: Kourovka Notebook Problem 18.120
field: mathematics
tier: prose
statement: |-
  Let $P=AB$ be a finite $p$-group
  factorized by an abelian subgroup $A$ and a class-two subgroup $B$. Suppose, if
  necessary, $A \cap B=1$. Then is it true that $ \langle A, [B,B]
  \rangle =AB_{0}$, where $B_{0}$ is an abelian subgroup of $ B$?
