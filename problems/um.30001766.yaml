title: Projective-Free Lie Modules of Symmetric Groups
field: mathematics
tier: prose
statement: Let $p$ divide $n$ and let $\operatorname{Lie}(n)$ be the Lie module of $S_n$, with projective-free part $\operatorname{Lie}^{\mathrm{pf}}(n)$. Determine the size of $\operatorname{Lie}^{\mathrm{pf}}(n)$ and how far $\operatorname{Lie}(n)$ is from being projective. When $n=p^k$, is $\operatorname{Lie}^{\mathrm{pf}}(n)$ indecomposable with regular elementary abelian vertex $E_n$, and what are the isomorphism types of its endo-permutation sources? What changes when $n$ is not a power of $p$?
