title: Irreducible Curves with Strongly Negative Harbourne Constants
field: mathematics
tier: prose
statement: For a reduced plane curve $C \subset \mathbb{P}^2_{\mathbb{C}}$, let $\widetilde{\mathbb{P}^2} \to \mathbb{P}^2$ be the blow-up of the singular points of $C$, let $\widetilde{C}$ be its strict transform, and let $H(C) = (\widetilde{C})^2 / s$ be the Harbourne constant (where $s$ is the number of singular points blown up). Do there exist irreducible complex plane curves $C \subset \mathbb{P}^2_{\mathbb{C}}$ with $H(C) \leq -2$, and what analogous bounded-negativity questions and constructions arise on other algebraic surfaces?
