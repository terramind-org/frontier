title: The Lyapin's Notebook — Problem 48
field: mathematics
tier: prose
statement: |-
  (G. Mashevitzky)
  Find an algorithm that decides whether the inclusive variety generated by a given finite set of finite semigroups, can be defined by a finite system of (elementary) identical inclusions or prove that such an algorithm does not exist.
  (This problem is similar to Tarski's problem for identities).

  In [M4], a finite semigroup was constructed that does not have a finite basis for its elementary identical inclusions.
