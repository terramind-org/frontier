title: Cyclic Lifting Property for Moduli Stacks
field: mathematics
tier: prose
statement: Characterize the algebraic stacks that satisfy the cyclic lifting property. Extend the associated $p$-adic volume formula to moduli spaces with non-quotient singularities, including moduli of Higgs bundles, coherent sheaves, and quiver representations.
