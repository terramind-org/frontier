statement: Assume PFA and let $\eta_C$ be a universal Aronszajn line. Does either the universality of $\eta_C$ or the assertion that Aronszajn lines are well-quasi-ordered by embeddability imply $|\mathbb{R}|\leq\aleph_2$?
