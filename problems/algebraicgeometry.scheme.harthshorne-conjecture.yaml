lean:
  module: FormalConjectures.Paper.HartshorneConjecture
  decl: AlgebraicGeometry.Scheme.harthshorne_conjecture
  statement: |-
    theorem harthshorne_conjecture (n : ℕ) (hn : 7 ≤ n)
        (𝓕 : VectorBundles ℙ(Fin (n + 1); Spec (.of ℂ)))
        (h𝓕 : 𝓕.rank = 2) :
        Nonempty (𝓕.Splitting (Fin 2))
  context:
    - open AlgebraicGeometry
    - open AlgebraicGeometry.Scheme
    - open CategoryTheory Limits MvPolynomial AlgebraicGeometry
    - "variable (S : Scheme.{u})"
  definitions:
    - name: AlgebraicGeometry.Scheme.VectorBundles
      kind: structure
      text: |-
        /--
        A vector bundle over a scheme `S` is a locally free $\mathcal{O}_S$-module of finite rank.
        -/
        structure VectorBundles where
          carrier : S.Modules
          rank : ℕ
          isLocallyFreeFiniteConstantRank : SheafOfModules.IsVectorBundleWithRank
            (J := Opens.grothendieckTopology S) carrier rank
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Paper/HartshorneConjecture.lean#L36
