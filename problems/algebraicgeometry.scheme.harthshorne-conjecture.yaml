schema: 1
id: algebraicgeometry.scheme.harthshorne-conjecture
title: Hartshorne's conjecture on Vector Bundles
field: mathematics
tier: proof
statement: |-
  There are no indecomposable vector bundles of rank 2 on $\mathbb{P}^n$ for $n \ge 7$.
  This is Conjecture 6.3 in [Har1974].
ams:
  - 14
tags:
  - paper
references:
  - label: Varieties of small codimension in projective space
    url: https://projecteuclid.org/journals/bulletin-of-the-american-mathematical-society-new-series/volume-80/issue-6/Varieties-of-small-codimension-in-projective-space/bams/1183535999.full
  - label: Evidences on Hartshorne's conjecture? References?
    url: https://mathoverflow.net/questions/13990/evidences-on-hartshornes-conjecture-references
