title: Pure Resolutions of Paracanonical Level Curves
field: mathematics
tier: prose
statement: For a general level-$\ell$ curve $[C,\eta]$ of even genus $g\geq6$, does the paracanonically embedded curve $C\hookrightarrow\mathbb P^{g-2}$ have a pure homogeneous coordinate-ring resolution; equivalently, is $K_{g/2-2,1}(C,K_C\otimes\eta)=0$?
