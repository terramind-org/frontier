title: Ellipsoid Rigidity from Constant Central-Section Products
field: mathematics
tier: prose
statement: |-
  If an origin-symmetric convex body $K\subseteq\mathbb R^n$, with $n\geq3$, satisfies

  $$h_K(\theta)\operatorname{vol}_{n-1}(K\cap\theta^\perp)=c$$

  for every $\theta\in S^{n-1}$ and a constant $c$ independent of $\theta$, must $K$ be an ellipsoid?
