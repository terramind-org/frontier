lean:
  module: FormalConjectures.ErdosProblems.«626»
  decl: Erdos626.erdos_626.variants.h_even_conjecture
  statement: |-
    theorem erdos_626.variants.h_even_conjecture :
        ∀ m : ℕ, Even m → 2 ≤ m → ∀ ε > (0 : ℝ), ∀ᶠ n : ℕ in atTop,
          (n : ℝ) ^ (2 / ((m : ℝ) + 2) - ε) ≤ (h m n : ℝ) ∧
            (h m n : ℝ) ≤ (n : ℝ) ^ (2 / (m : ℝ) + ε)
  context:
    - open Erdos626
    - open Erdos626.erdos_626
    - open Erdos626.erdos_626.variants
    - open Filter
    - open scoped Topology
  definitions:
    - name: Erdos626.h
      kind: def
      text: |-
        /--
        `h m n` is $h^{(m)}(n)$: the largest chromatic number of a graph on $n$ vertices with girth
        $> m$.
        -/
        noncomputable def h (m n : ℕ) : ℕ :=
          sSup {c : ℕ | ∃ G : SimpleGraph (Fin n), (m : ℕ∞) < G.egirth ∧ G.chromaticNumber = c}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/626.lean#L53
