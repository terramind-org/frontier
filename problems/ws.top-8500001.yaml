  \item[\hypertarget{source:8500001:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 8500001 (AMR-084-0001). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:8500001:2}{S2}] Andrej Dujella, Diophantine m-tuples, author-maintained survey (snapshot accessed 9 October 2026), Chapter 1, Definition 1.2 and paragraph on rational upper bounds. \url{https://raw.githubusercontent.com/dujella/dujella.github.io/master/intro.html}.
  \end{description}
