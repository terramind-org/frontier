lean:
  module: FormalConjectures.Paper.Dubner
  decl: DubnerConjecture.dubner_conjecture
  statement: |-
    theorem dubner_conjecture (n : ℕ) (hn : 4208 < n) (h : Even n) :
        ∃ p q : ℕ,
          IsTwinPrime p ∧
          IsTwinPrime q ∧
          p + q = n
  context:
    - open DubnerConjecture
  definitions:
    - name: DubnerConjecture.IsTwinPrime
      kind: def
      text: |-
        /--
        A twin prime is a prime number that has a prime gap of 2, meaning either p - 2 or p + 2
        is also prime.
        -/
        def IsTwinPrime (p : ℕ) : Prop :=
          p.Prime ∧ ((p - 2).Prime ∨ (p + 2).Prime)
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Paper/Dubner.lean#L31
