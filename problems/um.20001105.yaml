title: Lacunary counterexamples to the asymmetric Freiman container question
field: mathematics
tier: prose
statement: |-
  Tao. Let \(A,B\subseteq\mathbb Z\) be finite, with
  \[
   |A|=m>|B|=n,
   \qquad |A+B|<Km. \]
  Must there be a generalized arithmetic progression \(P\) of rank \(c(K)\), containing \(B\), and a set \(X\subseteq\mathbb Z\) such that
  \[
   A\subseteq P+X,
   \qquad |P+X|\le c(K)|A|? \tag{Q}
  \]

  Its missing symbols are
  \[
   |P+P|\le c(K,\varepsilon)m^{\varepsilon}|P|. \tag{R}
  \]
  The complete recovered remark says that Plünnecke's inequality gives the desired type of covering if the requirement that \(P\) be a progression is weakened to (R); in that version \(P\) is merely a set with somewhat small sumset. The source also notes that \(m=n\) is the case of Freiman's theorem.

  Croot and Lev later restated the question as “Freiman's theorem for distinct set summands,” using a constant \(C=C(K)\) to bound both the rank and \(|X+P|/|A|\). They explicitly note that the comparable-size regime \(|A|\asymp|B|\) follows from Freiman's theorem and Ruzsa covering.
