title: Relative Homology Obstructions to Complete Positive Scalar Curvature
field: mathematics
tier: prose
statement: Let $Y$ be a manifold with boundary and classifying map $\nu$. Is nonvanishing of $\nu_*[Y,\partial Y]\in H_n(B\Gamma,B\Gamma^{\prime};\mathbb{Q})$ an obstruction to a complete positive-scalar-curvature metric on $\operatorname{int}(Y)$ when $\Gamma^{\prime}\to\Gamma$ is injective or the metric has finite volume?
