title: Degree Bounds for Canonical Covers of Minimal-Degree Surfaces
field: mathematics
tier: prose
statement: Let $\varphi:X\to W$ be the canonical map of a surface of general type with canonical singularities and ample base-point-free $K_X$, where $W$ is a singular surface of minimal degree. Must $\deg\varphi\leq4$?
