title: Highly Ramified Figure-Eight Covers of Hyperbolic 3-Manifolds
field: mathematics
tier: prose
statement: For a closed hyperbolic $3$-manifold $M$ and every $L>0$, does there exist a finite cover $\widetilde M\to M$ and a branched covering $p:\widetilde M\to S^3$ whose branch locus is the figure-eight knot and whose ramification index along every component over the knot exceeds $L$?
