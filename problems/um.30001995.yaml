title: Vanishing-Regularization Convergence for Nonlinear Iterations
field: mathematics
tier: prose
statement: |-
  In iterative regularization for nonlinear inverse PDE problems $R(u) = g$, let $B$ be a nonlinear forward/reconstruction operator with local approximations $B_k$, and let $S_n = N_{\rho, \alpha_n} \circ R$ be the regularized inverse step using Tikhonov regularization with parameter $\alpha_n \to 0$. Can the convergence analysis of the iteration
  $$
  g_{n+1} = g_k + B(S(g_n)) - B_k(S(g_n))
  $$
  be extended when the exact inverse $S$ is replaced by $S_n = N_{\rho, \alpha_n} \circ R$ as $\alpha_n \to 0$?
