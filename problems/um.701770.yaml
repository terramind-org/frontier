title: Kourovka Notebook Problem 20.112
field: mathematics
tier: prose
statement: |-
  Let $\mathfrak{F}$ be a hereditary saturated formation and let $\mathrm{w}^{*}\mathfrak{F}$ denote the class of all
  finite groups $G$ for which
  $\pi(G)\subseteq\pi(\mathfrak{F})$ and the normalizers of all Sylow subgroups of $G$ are $\mathfrak{F}$-subnormal in $G$.
  It is known that $\mathrm{w}^{*}\mathfrak{F}$ is a formation.
  Must $\mathrm{w}^{*}\mathfrak{F}$ be a saturated formation?
