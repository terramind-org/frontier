lean:
  module: FormalConjectures.Wikipedia.CramerConjecture
  decl: CramerConjecture.cramer_conjecture.variants.limsup_eq_one
  statement: |-
    theorem cramer_conjecture.variants.limsup_eq_one :
        (∀ ε : ℝ, 0 < ε → ∀ᶠ n in Filter.atTop, cramerRatio n ≤ 1 + ε) ∧
          (∀ ε : ℝ, 0 < ε → ∃ᶠ n in Filter.atTop, 1 - ε ≤ cramerRatio n)
  context:
    - open CramerConjecture
    - open CramerConjecture.cramer_conjecture
    - open CramerConjecture.cramer_conjecture.variants
    - open scoped Asymptotics
  definitions:
    - name: CramerConjecture.cramerRatio
      kind: def
      text: |-
        /-- Cramér's normalized prime-gap ratio $\dfrac{p_{n+1} - p_n}{(\log p_n)^2}$. Since $p_n \ge 2$
        for all $n \in \mathbb{N}$, the denominator $(\log p_n)^2$ is always strictly positive. -/
        noncomputable def cramerRatio (n : ℕ) : ℝ :=
          (primeGap n : ℝ) / (Real.log (Nat.nth Nat.Prime n)) ^ 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/CramerConjecture.lean#L50
