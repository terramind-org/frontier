schema: 1
id: cramerconjecture.cramer-conjecture.variants.limsup-eq-one
title: "Cramér's Conjecture on Prime Gaps (variant: limsup_eq_one)"
field: mathematics
tier: proof
statement: |-
  **Cramér's Heuristic Limit-Superior Prediction**: $\limsup_{n \to \infty} g_n / (\log p_n)^2 =
  1$. Rather than an explicit conjecture in [Cr36], this stronger statement comes from Cramér's
  probabilistic prime model and contradicts `cramer_conjecture.variants.granville`
  ($2 e^{-\gamma} > 1$).
ams:
  - 11
tags:
  - wikipedia
  - variant
references:
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Cram%C3%A9r%27s_conjecture
