title: Intermediate pseudoconvex domains above Fatou-Bieberbach domains
field: mathematics
tier: prose
statement: |-
  Given a Fatou-Bieberbach domain $\Omega$, must there exist a pseudoconvex domain $\tilde{\Omega}$ such that $\tilde{\Omega}$ with $\Omega \subsetneq \tilde{\Omega} \subsetneq \mathbb{C}^n$.

  **Recovered problem.** For \(n\geq2\), given a Fatou--Bieberbach domain
  \(\Omega\subsetneq\mathbb C^n\), must there exist a connected pseudoconvex domain
  \(D\) such that
  \[
  \Omega\subsetneq D\subsetneq\mathbb C^n?
  \]
