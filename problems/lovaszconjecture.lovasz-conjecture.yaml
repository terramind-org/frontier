id: lovaszconjecture.lovasz-conjecture
title: Lovász's conjecture on Hamiltonian paths in vertex-transitive graphs (1970)
field: mathematics
tier: proof
statement: |-
  **Lovász's conjecture (1970).**

  Every finite connected vertex-transitive graph has a Hamiltonian path.
