lean:
  module: FormalConjectures.Wikipedia.LovaszConjecture
  decl: LovaszConjecture.lovasz_conjecture
  statement: |-
    theorem lovasz_conjecture :
        ∀ {V : Type} [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj],
          G.Connected → IsVertexTransitive G → HasHamiltonianPath G
  context:
    - open LovaszConjecture
    - open SimpleGraph
    - "variable {V : Type*}"
  definitions:
    - name: LovaszConjecture.IsVertexTransitive
      kind: def
      text: |-
        /-- A graph is **vertex-transitive** if its automorphism group acts transitively on the
        vertices: any vertex can be mapped to any other by a graph automorphism. -/
        def IsVertexTransitive (G : SimpleGraph V) : Prop :=
          ∀ u v : V, ∃ φ : G ≃g G, φ u = v
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/LovaszConjecture.lean#L45
    - name: LovaszConjecture.HasHamiltonianPath
      kind: def
      text: |-
        /-- `G` has a **Hamiltonian path**: a walk visiting every vertex exactly once. -/
        def HasHamiltonianPath [DecidableEq V] (G : SimpleGraph V) : Prop :=
          ∃ (a b : V) (p : G.Walk a b), p.IsHamiltonian
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/LovaszConjecture.lean#L50
