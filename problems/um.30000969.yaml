title: Bigness of Very Moving Algebraic Cycles
field: mathematics
tier: prose
statement: If $W$ is a codimension-$k$ subvariety of a smooth projective variety $Y$ that is very moving—its deformations can be required to pass through a generic point with a generically prescribed tangent space—is the algebraic-cycle class $[W]$ big, meaning that it lies in the interior of the cone generated by effective codimension-$k$ cycle classes?
