  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Dan Reznik, Ronaldo Garcia and Jair Koiller, \emph{Eighty New Invariants in the Elliptic Billiard}, arXiv:2004.12497v11 (29 October 2020), \S3.5, Table 5, pp. 6--7. \url{https://arxiv.org/abs/2004.12497v11}.
  \end{description}
  \label{end:statement}
