title: Trigonometric Factorization of Positive Matrix Polynomials
field: mathematics
tier: prose
statement: For every positive-semidefinite symmetric $m\times m$ trigonometric matrix polynomial $M$ on the two-dimensional torus, is $M=S^{\mathsf T}S$ for some trigonometric matrix polynomial $S$? The case $d=2$ and $m\geq2$ is open.
