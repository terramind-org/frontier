  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Walter K. Hayman and Edward F. Lingham, \emph{Research Problems in Function Theory} (2018), arXiv:1809.07200. Problem 9.10, complete original question, all following updates, and the relevant chapter definitions. \url{https://arxiv.org/abs/1809.07200}.
