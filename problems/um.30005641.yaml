title: Non-Density of Bounded-Rank Galois Loci
field: mathematics
tier: prose
statement: "Let $X$ be a smooth geometrically connected variety of dimension $\\geq 2$ over a number field $k$, let $\\rho_\\ell : \\pi_1(X) \\to G_\\ell \\subset \\mathrm{GL}_r(\\mathbb{Z}_\\ell)$ be an $\\ell$-adic Galois representation whose image $G_\\ell$ is a $\\mathbb{Z}_\\ell$-Lie group with finite abelianization, let $|X|_{\\leq d}$ be the set of closed points of degree $\\leq d$ over $k$, and let $|X|_{V_\\ell}$ be the Cadoret--Tamagawa locus of closed points $x \\in |X|$ where the image of the decomposition group $D_x$ fails to be open in $G_\\ell$ (or lies in a proper subgroup scheme $V_\\ell$). Is the intersection $|X|_{V_\\ell} \\cap |X|_{\\leq d}$ non-Zariski-dense in $X$?"
