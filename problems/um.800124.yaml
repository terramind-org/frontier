title: 'Foliations and Diffeomorphism Groups — Question 65 (``Foliations with only one leaf": see Tsuboi [tsuboi1984gamma1])'
field: mathematics
tier: prose
statement: |-
  \
  Let $\Gamma_q$ be the groupoid of the germs of
  local
  diffeomorphisms of $\mathbb{R}^q$, and $G_q\subset\Gamma_q$
  be the subgroup fixing $0$. Let $B\bar G_q$ be the
  homotopy-theoretic fibre of the map
  $BG_q\to BGL_q(\mathbb{R})$ classifying the normal bundle
  of the universal $G_q$-structure.
  Is $B\bar G_q$
  homotopically trivial in $B\bar\Gamma_q$ ?
