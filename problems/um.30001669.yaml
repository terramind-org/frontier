title: Short Cycles in Highly Dominating Digraphs
field: mathematics
tier: prose
statement: Call a directed graph $D=(V,E)$ $s$-dominating if every subset $U$ of at most $s$ vertices has a vertex $v$ with $(v,u)\in E$ for every $u\in U$. Does every 100-dominating finite directed graph contain a directed cycle of length at most 100?
