statement: |-
  Assume that $X,Y\subseteq\mathbb{R}$ satisfy $\mathsf{S}_1(\mathcal{O},\mathcal{O})$, and $X$ also satisfies $\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\Gamma)$.
  Does it follow that $X\times Y$ satisfies $\mathsf{S}_1(\mathcal{O},\mathcal{O})$?
