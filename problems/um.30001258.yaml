statement: For the Lane–Emden problem $-\Delta_pu=\lambda|u|^{q-2}u$ in a bounded domain with $u=0$ on the boundary, do the asymptotic results for ground states and least-energy nodal solutions as $q\to p$ remain valid when $1<q<p$?
