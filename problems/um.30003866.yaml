title: Maximum Simple Singularities of Plane Curves
field: mathematics
tier: prose
statement: For a plane curve of degree $d$, what is the largest $k$ for which an $A_k$ singularity can occur? More generally, for $(a,b)\in\mathbb N^2$, what is the largest $k$ for which a curve in $\mathbb A^2(\mathbb C)$ of bidegree $(a,b)$ can have an $A_k$ singularity?
