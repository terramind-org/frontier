title: Problems Around Polynomials — Conjecture 3
field: mathematics
tier: prose
statement: "[A. Gabrielov, D. Novikov, B. Sh., seems good, but no progress] Let $(x_1,y_1),(x_2,y_2),\\dots, (x_N,y_N)$ be a collection of points in $\\mathbb{R}^2$, $\\xi_1, \\xi_2, \\dots , \\xi_N$ be arbitrary real charges and $\\alpha\\ge 1/2$. Then the rational univariate function $$\\Psi(x)=\\sum_{i=1}^N\\frac{\\xi_i}{((x-x_i)^2+y_i^2)^{\\alpha}},\\; x\\in \\mathbb{R},$$ has at most $N$ local maxima on the whole real line."
