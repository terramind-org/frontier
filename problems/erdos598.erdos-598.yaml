lean:
  module: FormalConjectures.ErdosProblems.«598»
  decl: Erdos598.erdos_598
  statement: |-
    theorem erdos_598 :
        ∀ (m : Type*) [Infinite m],
        ∃ c : { s : Set m // s.Countable } → κ.out,
        ∀ X : Set m, #X = κ →
        c '' { s : { sub : Set m // sub.Countable } | s.1 ⊆ X } = Set.univ
