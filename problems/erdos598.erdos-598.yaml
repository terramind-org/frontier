lean:
  module: FormalConjectures.ErdosProblems.«598»
  decl: Erdos598.erdos_598
  statement: |-
    theorem erdos_598 :
        ∀ (m : Type*) [Infinite m],
        ∃ c : { s : Set m // s.Countable } → κ.out,
        ∀ X : Set m, #X = κ →
        c '' { s : { sub : Set m // sub.Countable } | s.1 ⊆ X } = Set.univ
  context:
    - open Erdos598
    - open Cardinal
  definitions:
    - name: Erdos598.κ
      kind: def
      text: |-
        /--
        Let $\kappa = (2^{\aleph_0})^+$. This is the successor cardinal of the continuum.
        -/
        noncomputable def κ : Cardinal := Order.succ (2 ^ ℵ₀)
