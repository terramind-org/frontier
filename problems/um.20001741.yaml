title: Lattice Riesz polarization and the quantitative covering limit
field: mathematics
tier: prose
statement: |-
  Which lattices $\Lambda$ in $\mathbb R^d$ of determinant $1$ maximize
  \[
  \min_{y \in \mathbb R^d \setminus \Lambda} \sum_{x \in \Lambda} \frac{1}{|x-y|^s}?
  \]
  For $s \to \infty$ this is the covering problem. On $S^{n-1}$ this is called polarization.
