title: Finiteness of Nonzero Bockstein Maps in Local Cohomology
field: mathematics
tier: prose
statement: For a polynomial ring $R$ over $\mathbb Z$ and a fixed ideal $\mathfrak a\subseteq R$, are the Bockstein homomorphisms $\beta_k^p:H_{\mathfrak a}^k(R/pR)\to H_{\mathfrak a}^{k+1}(R/pR)$ zero for all but finitely many primes $p$?
