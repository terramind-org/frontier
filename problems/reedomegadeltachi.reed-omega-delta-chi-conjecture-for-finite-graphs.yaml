lean:
  module: FormalConjectures.Paper.ReedOmegaDeltaChi
  decl: ReedOmegaDeltaChi.reed_omega_delta_chi_conjecture_for_finite_graphs
  statement: |-
    theorem reed_omega_delta_chi_conjecture_for_finite_graphs :
      ∀ {V : Type} [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj],
        let χ := G.chromaticNumber
        let ω := G.cliqueNum
        let Δ := G.maxDegree
        2 * χ ≤ ω + Δ + 2
  context:
    - open ReedOmegaDeltaChi
    - open scoped Finset
  definitions: []
