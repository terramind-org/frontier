title: Problem 3 — Given a topological description of fk0,fk1 describe fk0+k1.
field: mathematics
tier: prose
statement: "Given a topological description of fk0,fk1 describe fk0+k1. A good understanding of this would enable one to drop the rather artificial introduction of the subclass D(0) g,ν,p in the discussion above. More generally still, if we have two pencils on a symplectic manifold X with fibre classes F1,F 2 one can ask for a description of a TLP with fibre F1 +F2 (if such exists). This might 11. Lefschetz pencils and mapping class groups 171 give information about the problem of describing the classes represented by symplectic forms on a fixed 4-manifold. Rather than trying to use the TLP description to reduce questions to combinatorics one can attempt to use it as a tool to prove general properties of symplectic 4-manifolds. So far, this has been more fruitful, giving a new approach to Taubes’ results independent of the Seiberg-Witten theory [ 6], [ 13], [ 9]. There is also a generalisation of the TLP description to other 4-manifolds [3] and there are many things one could try here; for example to prove that any 4-manifold has “simple type”. One thing that should be important to understand is the role of the canonical class K(ω). Using the Seiberg-Witten theory and pseudo-holomorphic curve techniques, a complete classification is known of symplectic 4-manifolds with ω.K (ω)< 0, i.e. withθ< 0 in our notation above. The only examples are the standard ones given by rational and ruled complex surfaces [ 8]. It would be interesting to derive this by the Lefschtez pencil method:"
