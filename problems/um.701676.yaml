title: Kourovka Notebook Problem 20.18
field: mathematics
tier: prose
statement: |-
  Let $R_{p^k}$ be the variety of class $2$ nilpotent groups of exponent
  $p^k$, where $p$ is a prime number and $k\geq 2$. It is true that for every $p$ and $k$ there are infinitely many subquasivarieties of $R_{p^k}$ each of which is generated by a finite group with derived subgroup of exponent $p^k$ and does not have an independent basis of quasi-identities?
