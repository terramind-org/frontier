title: Open Problems and Questions about Geodesics — Question 37
field: mathematics
tier: prose
statement: |-
  This question is closely related to the famous
  Arnold diffusion conjecture.
  If $\dim(M)=2$ and $k$ is large enough,
  the answer is negative: if we take a metric with integrable geodesic flow such that certain
  Liouville tori are irrational, and
  any small perturbation of the metric has non-transitive geodesic flow by the KAM theory.

  {\it Assume $M$ is closed.
  Is there a dense subset of metrics in $\mathcal{G}$ for which the tangent vectors to the closed geodesics are dense in $SM$? }
