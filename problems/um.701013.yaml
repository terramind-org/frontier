title: Kourovka Notebook Problem 14.28
field: mathematics
tier: prose
statement: |-
  Let ${\mathfrak{F}}$ be a soluble Fitting formation of
  finite groups with Kegel's property, that is, ${\mathfrak{F}}$ contains
  every finite group of the form $G=AB=BC=CA$ if $A,B,C$ are in ${\mathfrak{F}}$. Is ${\mathfrak{F}}$ a saturated formation?

  *Comment of 2013:*
  Some progress was made in (A. Ballester-Bolinches, L. M. Ezquerro, *J. Group Theory*, **8**, no. 5 (2005), 605--611).
