title: Rotation-equivariant Minkowski-additive operators
field: mathematics
tier: prose
statement: |-
  Classify all continuous \(T:\mathcal K^n\to\mathcal K^n\) with the following properties:
  \[
  h_{T(K+L)}=h_{TK}+h_{TL},\qquad
  T(\theta K)=\theta TK\quad\text{for every rotation }\theta.
  \]
