title: Hodge and Order Filtrations on GKZ Modules
field: mathematics
tier: prose
statement: For the GKZ modules $M_A^0$ and $M_A^{-c}$, the Hodge filtration equals the order filtration up to the shifts $F^H_\bullet M_A^0=F^{\mathrm{ord}}_{\bullet+d}M_A^0$ and $F^H_\bullet M_A^{-c}=F^{\mathrm{ord}}_{\bullet-n-c_0}M_A^{-c}$, where $c_0$ is the first component of $c\in NA\subset\mathbb Z^{d+1}$.
