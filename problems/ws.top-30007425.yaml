statement: |-
  \section*{Diagonal extension from positively curved surfaces in R3}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every compact smooth positively curved surface Sigma in $R^3$, allowing a smooth boundary, and every $p>3$, is its surface extension operator bounded from $L^p(Sigma)$ to $L^p(R^3)$?
  \subsection{Short English statement}
  For every compact smooth positively curved surface Sigma in $R^3$, allowing a smooth boundary, and every $p>3$, is its surface extension operator bounded from $L^p(Sigma)$ to $L^p(R^3)$?
