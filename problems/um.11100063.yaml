title: Miscellaneous problems 1 — Build MU from the moduli stack of formal groups.
field: mathematics
tier: prose
statement: Build MU from the moduli stack of formal groups. This has got to be doable somehow, though it is an old problem (I first heard it in Ravenel's green book). Note that we have some more tools now--the moduli stack is, I think, just a space in Voevodsky's category, so maybe it is an infinite loop space there?
