statement: |-
  \section{Research Problems in Function Theory — Problem 4.11}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $n\ge1$ and let $f(z)=\prod_{j=1}^n(z-z_j)$ be a monic polynomial of degree $n$, with zeros repeated according to multiplicity. Its filled unit lemniscate is the compact set
  \[E_f=\{z\in\mathbb C:|f(z)|\le1\}.
  \]
  The monic normalization is the one used in the source's Problem 4.7 and its following lemniscate questions.Assume in addition $|z_j|\le1$ for every $j$. Let $\lambda_2$ denote planar Lebesgue measure and define the optimal lower-area function
  \[a_n=\inf_{z_1,\ldots,z_n\in\overline{\mathbb D}}\lambda_2\left(\left\{z:\prod_{j=1}^n|z-z_j|\le1\right\}\right).
  \]
  \paragraph{Statement recorded in the supplied source.}
  Obtain lower bounds for $a_n$ in terms of $n$, and determine its sharp size and asymptotic behaviour. The source records that arbitrarily small areas are possible once the degree is sufficiently large, so the requested lower bound must depend on degree. \sref{statement}{2}
  \subsection{Short English statement}
  Find sharp lower bounds, depending on degree, for the area of a monic polynomial’s lemniscate when all zeros lie in the unit disc.
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Walter K. Hayman and Edward F. Lingham, \emph{Research Problems in Function Theory}, arXiv:1809.07200, 2018. Problem 4.11, its complete Update 4.11, and the relevant chapter notation. \url{https://arxiv.org/pdf/1809.07200}.
  \end{description}
  \label{end:statement}
