title: (−1)-Curve Conjecture for Plane Blowups
field: mathematics
tier: prose
statement: Let $X_r$ be the blowup of $\mathbb P^2$ at $r\geq0$ general points. If $C\subset X_r$ is an irreducible reduced curve with $C^2<0$, must $C$ be a smooth rational curve with $C^2=-1$?
