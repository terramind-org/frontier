  statement: "theorem infinite_pellNumber_primes : Infinite {n : ℕ | Prime (pellNumber n)}"
  context:
    - open PellNumbers
  definitions:
    - name: PellNumbers.pellNumber
      kind: def
      text: |-
        /-- The *Pell numbers* $P_n$ are defined by $P_0 = 0$, $P_1 = 1$, $P_{n+2} = 2*P_{n+1} + P_n$ -/
        def pellNumber : ℕ → ℕ
          | 0 => 0
          | 1 => 1
          | n + 1 + 1 => 2 * pellNumber (n + 1) + pellNumber n
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/Pell.lean#L37
