title: Sections on every open and the Brauer--Manin set
field: mathematics
tier: prose
statement: |-
  **Problem/Question 19.** Let \(X\) be a variety over a number field \(k\), and suppose that for every Zariski-dense open \(U\subset X\), the map

  \[
  \pi_1(U)\longrightarrow \operatorname{Gal}(\bar k/k)
  \]

  has a splitting \(s\) (for example, this holds if \(X(k)\) is Zariski dense). If \(X(\mathbf A_k)\ne\varnothing\), is
  \[
  X(\mathbf A_k)^{\operatorname{Br}}\ne\varnothing?
  \]
  (Ellenberg)
