title: Selflessness and Strict Comparison for Reduced Group $C^*$-Algebras
field: mathematics
tier: prose
statement: For a discrete group $G$, is strict comparison for $C_r^*(G)$ equivalent to $C^*$-simplicity? Is selflessness equivalent to strict comparison together with $C^*$-simplicity? Find a dynamical characterization of selflessness, and more generally characterize selflessness of reduced crossed products through dynamics or stabilizer subgroups.
