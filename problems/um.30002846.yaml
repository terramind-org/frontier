id: um.30002846
title: Matrix Spencer Signing Conjecture
field: mathematics
tier: prose
statement: Given $n\times n$ matrices $A_1,\ldots,A_n$ with $\lVert A_i\rVert\leq 1$, does there exist a signing $s_i\in\{\pm1\}$ such that $\left\lVert\sum_{i=1}^n s_iA_i\right\rVert=O(\sqrt n)$? More generally, for $m>n$, is the bound $O\left(\sqrt{n\log(m/n)+1}\right)$ valid?
