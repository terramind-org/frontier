title: Convergence and Curvature of Homogeneous Ricci Flows
field: mathematics
tier: prose
statement: For a general solvable Lie group, does the bracket flow converge after suitable normalization to a Ricci soliton, and is the limit unique? If a homogeneous space admits homogeneous metrics with positive scalar curvature, must the scalar curvature of every homogeneous Ricci-flow solution on that space eventually become positive?
