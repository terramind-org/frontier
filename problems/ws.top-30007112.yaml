statement: |-
  \section*{Binary edit distance has exponential-scale L1 distortion}\label{30007112}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Do absolute $c>0,d_{0}$ exist such that, for every integer $d\geq d_{0}$, some common word length $1\leq n\leq d$ and finite $W\subset {0,1}^{n}$ with at least two words have least $L^{1}$ distortion at least $\exp (c\surd (\log $ d loglog d)) for ordinary unit-cost insertion, deletion and substitution edit distance?
  \subsection{Short English statement}
  Do absolute $c>0,d_{0}$ exist such that, for every integer $d\geq d_{0}$, some common word length $1\leq n\leq d$ and finite $W\subset {0,1}^{n}$ with at least two words have least $L^{1}$ distortion at least $\exp (c\surd (\log $ d loglog d)) for ordinary unit-cost insertion, deletion and substitution edit distance?
