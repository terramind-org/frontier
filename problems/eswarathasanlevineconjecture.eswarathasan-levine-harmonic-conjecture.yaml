lean:
  module: FormalConjectures.Wikipedia.EswarathasanLevineConjecture
  decl: EswarathasanLevineConjecture.eswarathasan_levine_harmonic_conjecture
  statement: |-
    theorem eswarathasan_levine_harmonic_conjecture {p : ℕ} (hp : p.Prime) :
        (harmonicNumDivisibleSet p).Finite
  context:
    - open EswarathasanLevineConjecture
  definitions:
    - name: EswarathasanLevineConjecture.harmonicNumDivisibleSet
      kind: def
      text: |-
        /-- Indices $n \ge 1$ whose $n$-th harmonic sum $H_n$ has reduced numerator divisible by $p$.
        The bound $1 \le n$ rules out $n = 0$, where `harmonic 0 = 0` has numerator $0$. -/
        def harmonicNumDivisibleSet (p : ℕ) : Set ℕ :=
          {n : ℕ | 1 ≤ n ∧ (p : ℤ) ∣ (harmonic n).num}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/EswarathasanLevineConjecture.lean#L44
