title: Virtual-knot problem 11 — Virtualization and Unit Jones Polynomial
field: mathematics
tier: prose
statement: |-
  Virtualization and Unit Jones Polynomial: Suppose the knot $K$
  is classical and not trivial. Suppose that ${\tilde K}$ (obtained
  from $K$ by virtualizing a subset of its crossings) is not trivial
  and has a unit Jones polynomial, $V(\tilde K)=1$. Is it possible
  that ${\tilde K}$ is classical (i.e. isotopic through virtual
  equivalence to a classical knot)?

  Suppose $K$ is a virtual knot diagram with unit Jones polynomial. Is
  $K$ equivalent to a classical diagram via virtual equivalence plus
  crossing virtualization? (Recall that by crossing virtualization, we
  mean flanking a classical crossing by two virtual crossings. This
  operation does not affect the value of the Jones polynomial.)

  Given two classical knots $K$ and $K',$ if $K$ can be obtained from
  $K'$ by a combination of crossing virtualization and virtual
  Reidemeister moves, then is $K$ classically equivalent to $K'?$

  If the above two questions have affirmative answers, then the only
  classical knot with unit Jones polynomial is the unknot.
