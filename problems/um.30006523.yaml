title: Weak-Order Convexity of Grothendieck Schubert Supports
field: mathematics
tier: prose
statement: For every $w\in S_n$, is $\operatorname{Supp}_S(G_w)$ convex in left weak order? Equivalently, if $u,u^{\prime}\in\operatorname{Supp}_S(G_w)$, is every $v$ with $u\leq_L v\leq_L u^{\prime}$ also in the support?
