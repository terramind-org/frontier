title: Exact A2 symmetry and collision strata in Marklof's raw triple-gap count
field: mathematics
tier: prose
statement: |-
  **Question 45 (J. Marklof).** What is the distribution of the set
  \[
  \{(Q(x_1)-Q(x_2),Q(x_2)-Q(x_3)):x_i\in\mathbb Z^2,
  \ x_i\ne x_j\text{ for }i\ne j\}\subset\mathbb R^2?
  \]
  More precisely, determine the asymptotics of
  \[
  N_T((a,b),(c,d)):=\#\left\{(x_1,x_2,x_3)\in(\mathbb Z^2)^3:
  \begin{array}{l}
  a<Q(x_1)-Q(x_2)<b,\\
  c<Q(x_2)-Q(x_3)<d,\\
  x_i\ne x_j\ (i\ne j),\quad \|x_i\|<T\ (i=1,2,3)
  \end{array}\right\}.
  \]
