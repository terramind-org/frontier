title: Open Problems in Integrable Systems — Topology of integrable systems, Lagrangian fibrations, and their invariants
field: mathematics
tier: prose
statement: Assume that we know explicit formulas for the action variables $I_1,\dots, I_n$ so that we are able to analyse their asymptotic behaviour in a neighbourhood of a singular fiber. Can we recover the topology of this singularity from the asymptotic behaviour (or at least to distinguish between different types of singularities)? For example, we know that, in the case of non-degenerate hyperbolic singularities, the singular part $I_{sing}$ is of the form $h\ln h + \dots$ . Is this property characteristic for non-degenerate hyperbolic singularities? The case of one degree of freedom is understood in .
