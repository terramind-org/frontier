  \section{Maximum Normalized Mahler Measure of Littlewood Polynomials}\label{30006453}
  {\small UnsolvedMath ID 30006453 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $P_n(x)=\sum_{k=0}^n a_kx^k$ range over Littlewood polynomials with $a_k\in\{-1,1\}$. Determine the extremal limit superior $b_m=\limsup_{n\to\infty}M_0(P_n)/\sqrt{n}$, where $M_0$ denotes Mahler measure.
  \par\smallskip\textit{Formulation references:} \sref{30006453}{1}, \sref{30006453}{2}.
  \subsection{Short English statement}
  Let $P_n(x)=\sum_{k=0}^n a_kx^k$ range over Littlewood polynomials with $a_k\in\{-1,1\}$. Determine the extremal limit superior $b_m=\limsup_{n\to\infty}M_0(P_n)/\sqrt{n}$, where $M_0$ denotes Mahler measure.
