title: Character-Counting Chain Cancellation in Blocks
field: mathematics
tier: prose
statement: For a positive-defect block idempotent $b$ of $\mathcal{O}G$ and every admissible parameter tuple $(d,r,L,h)$, does the alternating sum over conjugacy classes of chains of nontrivial $p$-subgroups, $\sum_{\sigma\in[\mathcal{P}(G)/G]}(-1)^{|\sigma|}|\operatorname{Irr}_K(G_\sigma,b_\sigma,d,r,L,h)|$, equal zero? Here $\operatorname{Irr}_K$ denotes the irreducible $K$-characters in the corresponding Brauer-correspondent blocks with the specified defect, residue, character field, and Hasse invariant.
