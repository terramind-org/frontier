title: High-Chromatic Odd-Cycle-Free Graphs with Large Minimum Degree
field: mathematics
tier: prose
statement: For fixed $k$, do there exist $n$-vertex graphs containing no odd cycle of length less than $2k+1$, with chromatic number at least four and minimum degree at least $f(k)n$, where $f(k)$ is of order $1/k$?
