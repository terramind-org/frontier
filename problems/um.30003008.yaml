title: Logarithmic Linearization of Convex-Body Means
field: mathematics
tier: prose
statement: Does there exist a logarithmic map $L$ on a natural class of convex bodies satisfying $L(G(A,B))=(L(A)+L(B))/2$ for the geometric mean $G$? Is $G(M_{\mathrm{ag}}(A,B),M_{\mathrm{gh}}(A,B))=G(A,B)$, where $M_{\mathrm{ag}}$ and $M_{\mathrm{gh}}$ are the arithmetic–geometric and geometric–harmonic iterations?
