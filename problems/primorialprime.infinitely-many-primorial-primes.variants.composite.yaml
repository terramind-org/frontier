title: "Infinitude of primorial primes (variant: composite)"
field: mathematics
tier: proof
statement: |-
  Are infinitely many integers of the form $p_n\# \pm 1$ composite? This statement takes the
  union over both signs ($m = p_n\# + 1$ or $m = p_n\# - 1$).
