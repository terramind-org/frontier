title: Clasp Formula for Local Intersection Numbers
field: mathematics
tier: prose
statement: Let $V=\mathbb C^n$, let $\lambda$ be dominant, and let $\mu$ be a weight of $\Lambda^kV$ such that $\lambda+\mu$ is dominant. If $\kappa_{\lambda,\mu}$ is the resulting one-dimensional local intersection form, is $$\kappa_{\lambda,\mu}=\prod_\alpha\frac{\langle\lambda+\rho,\alpha\rangle}{\langle\lambda+\rho+\mu,\alpha\rangle},$$ where the product is over positive roots $\alpha$ for which the denominator is exactly one less than the numerator?
