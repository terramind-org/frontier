title: The Twisted Fourier–Jacobi Gan–Gross–Prasad Conjecture
field: mathematics
tier: prose
statement: For étale quadratic algebras $E$ and $K$ over a local or global field $F$, a skew-Hermitian $E$-space $V$, an irreducible representation $\Pi$ of $U(V_K)$, and the Weil representation $\omega_{V,\psi,\mu}$ of $U(V)$, determine the local branching multiplicity $\operatorname{Hom}_{U(V)}(\Pi,\omega_{V,\psi,\mu})$ and the corresponding global period in the twisted Fourier–Jacobi Gan–Gross–Prasad problem.
