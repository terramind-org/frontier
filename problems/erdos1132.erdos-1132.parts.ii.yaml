lean:
  module: FormalConjectures.ErdosProblems.«1132»
  decl: Erdos1132.erdos_1132.parts.ii
  statement: |-
    theorem erdos_1132.parts.ii :
        ∀ x : ℕ → ℝ, (∀ k, x k ∈ Set.Icc (-1 : ℝ) 1) → Function.Injective x →
          ∀ᵐ t ∂(volume.restrict (Set.Ioo (-1 : ℝ) 1)),
            ∀ ε > (0 : ℝ), ∃ᶠ n : ℕ in atTop,
              (2 / Real.pi - ε) * Real.log n ≤ lebesgueFunction n x t
  context:
    - open Erdos1132
    - open Erdos1132.erdos_1132
    - open Erdos1132.erdos_1132.parts
    - open Filter MeasureTheory
  definitions:
    - name: Erdos1132.lebesgueFunction
      kind: def
      text: |-
        /-- The Lebesgue function $L_n(t)=\sum_{k<n}\lvert l_k(t)\rvert$ of the first `n` nodes
        `x 0, …, x (n - 1)`. The nodes `x 0, x 1, …` play the role of $x_1, x_2, \ldots$. -/
        noncomputable def lebesgueFunction (n : ℕ) (x : ℕ → ℝ) (t : ℝ) : ℝ :=
          ∑ k ∈ Finset.range n, |lagrangeBasis n x k t|
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/1132.lean#L52
