title: Complexity in Enumerative Combinatorics — Conjecture 7
field: mathematics
tier: prose
statement: |-
  Here $p_n$ is the $n$-th prime, and $\pi(n)$ is the number of primes $\le n$,
  as above. Both GFs are known to be non-D-finite, as shown by
  Flajolet, Gerhold and Salvy in [FGS] by asymptotic
  arguments. The authors quip: ``*Almost anything
  is non-holonomic unless it is holonomic by design*''.
  Well, maybe so. But the same applies for D-transcendence
  where the gap between what we believe and what we can prove
  is much wider. The reader should think of such open problems as
  the irrationality of $e+\pi$ and $\zeta(5)$, and imagine a similar
  phenomenon in this case (cf. [KoZ]).

  }}$
  is D-transcendental.
