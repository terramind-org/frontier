id: um.30001163
title: Equality Cases for Universal Eigenvalue Mean Inequalities
field: mathematics
tier: prose
statement: Let $E_1\leq E_2\leq\cdots$ be Dirichlet eigenvalues and, for $p>0$, define $$M_p(J)=\left(\frac{n+2p}{nJ}\sum_{j=1}^J E_j^p\right)^{1/p}.$$ Does there exist a domain $\Omega$ and an integer $J$ for which $$M_1(J)^2-M_2(J)^2\geq\frac{(E_{J+1}-E_J)^2}{4}$$ is attained with equality?
