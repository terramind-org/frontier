schema: 1
id: witness.cap-set-f3-8
title: Largest cap set in F_3^8
field: mathematics
tier: witness
statement: A cap set in F_3^n is a set of points containing no three distinct points on a line, which is the same as no distinct a, b, c with a + b + c = 0. In F_3^8 a cap set of 512 points is known (FunSearch, 2023), improving the earlier record of 496. Find a cap set in F_3^8 with more than 512 points.
