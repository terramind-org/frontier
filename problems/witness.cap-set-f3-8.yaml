  format: 'A JSON object {"points": [[...], ...]}. Each point is an array of 8 integers, each 0, 1 or 2 (a vector of F_3^8). Points must be distinct, there are at most 6561 of them, and no three may sum to 0 mod 3 coordinatewise. The value is the number of points.'
