title: Skew Fields between $\mathbb{C}G$ and $U(G)$
field: mathematics
tier: prose
statement: Let $G$ be a torsion-free group, let $L(G)$ be its group von Neumann algebra, and let $U(G)$ be the algebra of densely defined closed operators affiliated to $L(G)$. Does there exist a skew field (division ring) $D$ satisfying $\mathbb{C}G \subseteq D \subseteq U(G)$ (the Linnell skew-field question)?
