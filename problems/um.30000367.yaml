title: Geometric Characterization of Active Robin Boundaries
field: mathematics
tier: prose
statement: Let $D\subset\mathbb{R}^d$ be a bounded domain containing a closed ball $B^*$. Let $u$ solve $\Delta u=0$ on $D\setminus B^*$, with $u=1$ on $\partial B^*$ and $\partial u/\partial n=u$ on $\partial D$. Give necessary and sufficient geometric conditions for $\inf_{x\in D\setminus B^*}u(x)>0$, equivalently, for the whole boundary of $D$ to be active.
