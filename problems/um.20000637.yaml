title: Near-rational improvements and a linear-phase delta-method bottleneck
field: mathematics
tier: prose
statement: |-
  Obtain cancellations in additive twists of GL(3) Fourier coefficients.

  Let \(\pi\) be a GL(3) Hecke--Maass cusp form with the n-th Fourier coefficient \(\lambda_\pi(1,n)\). For \(\alpha\in\mathbb R\), prove a bound of the form
  \[
  \sum_{n\ll N}\lambda_\pi(1,n)e(n\alpha)\ll_\pi N^{1-\delta},
  \]
  for some \(\delta>0\) using a delta method. Aim to improve upon Miller's bound.
