title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 21: Stanley-Stembridge e-positivity conjecture for chromatic symmetric functions of (3+1)-free posets"
field: mathematics
tier: prose
statement: Let $P$ be a finite $(3+1)$-free poset (i.e., $P$ contains no induced subposet isomorphic to the disjoint union of a $3$-element chain and a $1$-element chain), and let $G = \operatorname{inc}(P)$ be its incomparability graph. Is the chromatic symmetric function $X_G(x) = \sum_\kappa x_1^{a_1(\kappa)} x_2^{a_2(\kappa)}\cdots$ of $G$ $e$-positive (i.e., a nonnegative linear combination of elementary symmetric functions $e_\lambda$)?
