title: Conjecture 7.30 — (K.
field: mathematics
tier: prose
statement: (K. Habiro) Suppose that Conjecture 7.29 would hold. For a new indeterminate t, set R′ 1 = lim←−nR1[t]/((t− q)(t− q2)···(t− qn)) Then there exists an invariant I sl(M )∈ R′ 1 of an integral homology 3-sphere M such that I sl(M )|t=qn = I sln(M ) for any n≥ 1, where we set I sl1(M ) = 1.
