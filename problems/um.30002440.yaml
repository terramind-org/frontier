title: Quenched Central Limit Theorem for Small-Disorder Random Walks
field: mathematics
tier: prose
statement: |-
  For $d\geq3$, does there exist $\varepsilon(d)>0$ such that, under the i.i.d. small-disorder assumptions,

  $$n^{-1/2}(X_n-na(\mu))$$

  converges in law, almost surely in the environment, to $N(0,\Sigma(\mu))$, with $\Sigma(\mu)$ positive definite?
