title: Local Geometry and Algebraic Classification of Multiplier Varieties
field: mathematics
tier: prose
statement: For multiplier varieties, is there an intrinsic local definition of a variety, and are the classical irreducible components varieties in that sense? Are multiplier-biholomorphic irreducible varieties in a finite-dimensional ball associated with isomorphic multiplier algebras, and is multiplier biholomorphism an equivalence relation? Finally, if $f:\mathbb D\to\mathbb B_\infty$ is a proper embedding with $f(0)=0$, is evaluation at $0$ the only character that vanishes on every coordinate multiplier?
