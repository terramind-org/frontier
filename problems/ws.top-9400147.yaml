  % UnsolvedMath ID 9400147; source catalogue code AMR-093-0147
  \setcounter{section}{9400146}
  \section{Are there infinitely many Cullen primes}\label{9400147}
  {\small\sffamily UnsolvedMath ID 9400147 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For $n\ge1$ put $C_n=n2^n+1$. A Cullen prime is a prime value among these integers.
  \paragraph{Statement recorded in the supplied source.}
  Is $C_n$ prime for infinitely many $n\ge1$? \sref{9400147}{2}
  \subsection{Short English statement}
  Are infinitely many Cullen numbers prime?
