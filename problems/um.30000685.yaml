title: Grading of Twisted-Involution Bruhat Posets
field: mathematics
tier: prose
statement: Let $(W,S)$ be a Coxeter system, let $\theta$ be an involutive automorphism of $W$, and let $\mathcal{I}(\theta)=\{w\in W:\theta(w)=w^{-1}\}$ be the set of twisted involutions. For which $(W,S)$ and $\theta$ is the induced Bruhat-order subposet $\operatorname{Br}(\mathcal{I}(\theta))$ graded?
