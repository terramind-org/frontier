title: Kourovka Notebook Problem 12.4
field: mathematics
tier: prose
statement: |-
  Let $G$ be a group and assume that we have
  $[x,y]^3=1$ for all $x,y \in G$. Is $G'$ of finite exponent? Is
  $G$ soluble? By a result of N. D. Gupta and N. S. Mendelssohn,
  1967, we know that $G'$ is a 3-group.
