lean:
  module: FormalConjectures.Paper.PudlakFiniteDomainConjectures
  decl: PudlakFiniteDomain.np_inter_conp_no_complete_language
  statement: |-
    theorem np_inter_conp_no_complete_language :
        ¬∃ L : DecisionProblem, IsCompleteFor (NP ∩ coNP) L
  context:
    - open PudlakFiniteDomain
    - open ComplexityTheory
  definitions:
    - name: PudlakFiniteDomain.IsCompleteFor
      kind: def
      text: |-
        /-- `L` is **complete** for the class `C` under polynomial-time many-one reductions. -/
        def IsCompleteFor (C : DecisionComplexityClass) (L : DecisionProblem) : Prop :=
          L ∈ C ∧ ∀ L' ∈ C, ManyOneReducible L' L
