schema: 1
id: pudlakfinitedomain.np-inter-conp-no-complete-language
title: Pudlák's conjectures on incompleteness in the finite domain (np_inter_conp_no_complete_language)
field: mathematics
tier: proof
statement: |-
  **NP ∩ coNP has no complete language** (Pudlák's conjecture `NP ∩ coNP` [Pu17]).

  No language in `NP ∩ coNP` is complete for that class under polynomial-time many-one
  reductions.
