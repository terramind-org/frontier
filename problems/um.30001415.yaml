title: Nodal Geometry of Second $p$-Laplacian Eigenfunctions
field: mathematics
tier: prose
statement: Determine the second eigenfunction of the $p$-Laplacian on a bounded domain, including its nodal set; in particular, prove or disprove that the nodal line is a diameter for a disk for every $p\in(1,\infty)$, and is vertical or horizontal on a square for $1<p<2$ but diagonal for $p>2$.
