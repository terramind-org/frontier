title: Nontame Automorphisms with Point-Centered Sarkisov Factorizations
field: mathematics
tier: prose
statement: Does there exist an essentially nontame automorphism $\theta$ of affine $3$-space $\mathbb{C}^3$ such that the Sarkisov factorization of the induced Cremona transformation $\Phi_\theta$ of $\mathbb{P}^3$ begins with a possibly weighted blowup of a point on the hyperplane at infinity?
