statement: "Give a homotopy theoretic construction of a map ρh: Ω ∞CP ∞ −1→K Sp(Z) with ρ≃ ρh◦α, at least after localization at a regular prime. (The 2-local case is of particular interest; cf. [ 12]). The rational cohomology of Ω ∞CP ∞ −1 is easy to list. For each connected component, H ∗(Ω∞ k CP ∞ −1; Q) = Q[κ′ 1,κ ′ 2,... ] 6. The mapping class groups and homotopy theory 97 whereκi =α∗(κ′ i) are the standard Miller-Morita-Mumford classes of degree 2 i, see [ 5], [ 15], [ 17] for further details. The rational cohomology of B Sp(Z) was calculated by Borel: H ∗(B Sp(Z); Q)∼=H ∗(Sp/U; Q)∼= Q[c1,c 3,... ]. where c2i+1 is the image of the (2 i + 1)st Chern class under the natural map from Sp /U to BU. Moreover,ρ∗(c2i+1) is a non-zero multiple of κ′ 2i+1 so that κ2i+1 restricts to zero in the rational cohomology of the Torelli group, [ 17]."
