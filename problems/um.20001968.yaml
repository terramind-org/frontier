title: Rank-one normalization and status audit for the HRV mixed-Hodge formula
field: mathematics
tier: prose
statement: |-
  **Conjecture 6.18 (Hausel--Rodriguez-Villegas).** For a compact Riemann surface of genus $g$, coprime integers $(n,d)=1$, and $\zeta_n = \exp(2\pi i/n)$, let
  $$
  \mathcal{M}_B^d(\mathrm{GL}_n) = \left\{(A_1, B_1, \ldots, A_g, B_g) \in \mathrm{GL}_n(\mathbb{C})^{2g} : \prod_{i=1}^g [A_i, B_i] = \zeta_n^d I_n\right\} \!\!/\!\!\, \mathrm{PGL}_n
  $$
  be the twisted $\mathrm{GL}_n(\mathbb{C})$ character variety, with ordinary-cohomology mixed Hodge polynomial $H_n^{\mathrm{geom}}(x,y,t) = \sum_{p,q,k} h^{p,q;k}(\mathcal{M}_B^d(\mathrm{GL}_n)) x^p y^q t^k$, and let $\mathbb{H}_n(q,t)$ be the combinatorial rational function defined via the partition-hook plethystic product. Then
  $$
  H_n^{\mathrm{geom}}(\sqrt{q}, \sqrt{q}, t) = \mathbb{H}_n(q, t).
  $$
