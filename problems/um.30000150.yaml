title: Curves Minimizing $\lambda_{1}(g,C)$
field: mathematics
tier: prose
statement: For a closed planar curve $C \subset \mathbb{R}^2$ of fixed length and coupling parameter $g \in \mathbb{R}$, let $\lambda_1(g, C)$ denote the lowest eigenvalue of the two-dimensional Schrödinger operator with a curvature/boundary interaction of strength $g$ supported on $C$. Determine the closed curve $C$ of given length that minimizes $\lambda_1(g, C)$ in the parameter ranges $1/4 < g \leq 1$ and $g < 0$ with $g \neq -1$.
