title: Discrete Riemann Mapping by Conformal Triangulations
field: mathematics
tier: prose
statement: "Discrete Riemann mapping conjecture: let $\\Omega$ be a Jordan domain with distinct boundary points $p,q,r$. For each $\\varepsilon>0$, triangulate a maximal simply connected $\\Omega_\\varepsilon\\subset\\Omega$ by equilateral triangles of edge length $\\varepsilon$, choose boundary vertices $p_\\varepsilon,q_\\varepsilon,r_\\varepsilon$ within $2\\varepsilon$ of $p,q,r$, and form its metric double. After discrete conformal uniformization to area $3/2$ with curvature $4\\pi/3$ at those three vertices and zero elsewhere, does the resulting polyhedral sphere converge as $\\varepsilon\\to0$ to the metric double of the unit equilateral triangle?"
