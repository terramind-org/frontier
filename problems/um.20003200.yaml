title: Forced freeness and small-order edge homomesy for Aztec diamonds
field: mathematics
tier: prose
statement: |-
  **Problem 2.4.** Is there a cyclic action of order \(2^n\) on the set of perfect
  matchings of the Aztec diamond graph of order \(n\), such that the edge-inclusion
  indicator functions associated with all the edges of the Aztec diamond graph are all
  homomesic?

  A possible avenue to pursue in solving Problem 2.4 may be an analysis of domino
  shuffling, since the set of Aztec diamonds is naturally divided into “equivalence
  classes” of size \(2^n\) by the shuffling algorithm.
