title: Hirzebruch's 1954 Problem List — Problem 4
field: mathematics
tier: prose
statement: |-
  A closed surface $M$ in the $4$-dimensional Euclidean space ${\mathbb{E}}^4$ has an induced Riemannian metric and hence a Gaussian
  curvature $K$. Does there exist such a surface for which $K<0$ everywhere? In particular, does there exist a surface of genus
  $2$ in ${\mathbb{E}}^4$ for which $K<0$ everywhere?
