title: Hirzebruch's 1954 Problem List — Problem 3
field: mathematics
tier: prose
statement: |-
  Let $n+d(n)$ be the minimum dimension of an Euclidean space in which the $n$-dimensional real projective space $\mathbb{P}^n$
  can be differentiably imbedded. H. Hopf proved that (even for topological imbedding) $d(n)>1$; Chern proved that $d(n)>2$
  if $n\neq 2^k-1$ ($k\geq 2$) and $n\neq 2^k-2$ ($k\geq 2$). Can these bounds be improved? In particular, can $\mathbb{P}^6$
  be imbedded in an Euclidean space of $8$ dimensions?
