title: Transcendental Holomorphic Morse Inequalities
field: mathematics
tier: prose
statement: Let $X$ be a compact complex manifold and $\alpha$ a closed $(1,1)$-form. If the integral of $\alpha^{\dim X}$ over the locus where $\alpha$ has at most one negative eigenvalue is positive, then $[\alpha]$ should contain a Kähler current, and $\operatorname{vol}([\alpha])$ should be at least that integral.
