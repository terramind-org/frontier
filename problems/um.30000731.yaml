title: Biased Weak-Win Games on Sparse Hypergraphs
field: mathematics
tier: prose
statement: Can Beck's weak-win Meta-Conjecture for generalized tic-tac-toe on finite hypergraphs be extended to biased games? When the underlying hypergraph is sparse, what positive results remain possible after complete occupation is replaced by an appropriate majority or surplus objective?
