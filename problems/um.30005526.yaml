title: Asymptotic Counting Near Curved Submanifolds
field: mathematics
tier: prose
statement: Let $M\subset\mathbb R^m$ be a bounded immersed submanifold with boundary and codimension $R$, satisfying appropriate curvature conditions. Prove $N(M;Q,\delta)\sim c_M\delta^RQ^{\dim M+1}$ whenever $\delta\geq Q^{-1/R+\epsilon}$ and $Q\to\infty$.
