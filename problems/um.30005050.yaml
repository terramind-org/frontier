title: Extreme Normalized Gaps between Riemann-Zeta Zeros
field: mathematics
tier: prose
statement: |-
  If $0<\gamma_1\leq\gamma_2\leq\cdots$ are the ordinates of the nontrivial zeros of the Riemann zeta function, are
  $$
  \liminf_{n\to\infty}\frac{(\gamma_{n+1}-\gamma_n)\log\gamma_n}{2\pi}=0
  \quad\text{and}\quad
  \limsup_{n\to\infty}\frac{(\gamma_{n+1}-\gamma_n)\log\gamma_n}{2\pi}=\infty
  $$
  ?
