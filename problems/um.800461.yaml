id: um.800461
title: Spaces with Lower Ricci Curvature — Conjecture 5
field: mathematics
tier: prose
statement: Let $\big(M^n_i,g_i,p_i\big)\to (X,d,p)$ satisfy $\mathrm{Ric}\geq -\lambda$ and $\mathrm{Vol}(B_1(p_i))>v>0$, then for each $k\leq n-2$ there exists $\hat\mathcal{S}^k$ with $\dim\hat\mathcal{S}^k\leq k$ such that for each $x\in X\setminus \hat\mathcal{S}^k$ we have that *every* tangent cone is at least $k+1$-symmetric.
