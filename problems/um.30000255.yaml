title: Interface-Layer Solutions on Perforated Domains
field: mathematics
tier: prose
statement: Let $\Omega\subset\mathbb R^N$, with $N\geq3$, be a domain with one hole. For sufficiently large $p$, does $-\Delta u=u^p$ admit a solution that converges away from a suitable $(N-1)$-dimensional manifold $M$ to a harmonic function and tends to $1$ on $M$?
