title: Realizing Complex Manifolds Transversely to Algebraic Foliations
field: mathematics
tier: prose
statement: For any compact complex manifold $(X,J)$, does there exist a smooth complex projective variety Z, an algebraic foliation D on Z, and an isotopy class $\alpha$ of transverse embeddings $X\to Z$ such that $J=J_f$ for some $f\in\alpha$?
