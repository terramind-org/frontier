    note: 'Read on 2026-10-19: the catalogue says the variant "matches the current best-known tensor rank while removing the reliance on complex coefficients" and is taken from Dumas, Pernet and Sedoglavic (2025); the Epoch AI page says the best decomposition has rank 48 over both complex and rational arithmetic and that rank 47 is known only in characteristic 2. The Dumas et al. paper itself was not opened. No proven lower bound was found in the opened sources. Epoch AI judges submissions in its own ring, not plain Q.'
  format: 'A JSON object {"terms": [{"a": M, "b": M, "c": M}, ...]} where each M is a 4x4 array of arrays. Entries are integers or strings "p/q" in lowest terms with q >= 2. The scheme computes C = sum over terms of <a,A> <b,B> c, with <a,A> = sum of a[i][j]*A[i][j] and c added to C as stored (C[i][l] gets the coefficient of A[i][j]*B[j][l]). It is valid when this equals the 4x4 matrix product as a polynomial identity, checked exactly. The value is the number of terms (at most 1000).'
