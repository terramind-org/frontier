statement: For any finite sets $X$ and $Y$ of published mathematical theorems expressible in second-order arithmetic, is either $\mathsf{RCA}_0+X$ interpretable in $\mathsf{RCA}_0+Y$, or $\mathsf{RCA}_0+Y$ interpretable in $\mathsf{RCA}_0+X$?
