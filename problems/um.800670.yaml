title: Selection Principles Milestone Problems — Problem 43 ([SakaiRez, Question 3.5], [reznicb])
field: mathematics
tier: prose
statement: |-
  In [coc7] it is shown that
  $C_p(X)$ has countable fan tightness as well as Reznichenko's property if, and only if,
  each finite power of $X$ has the Hurewicz covering property.
  Recently, Sakai found an exact dual of the Reznichenko property:
  An open $\omega$-cover $\mathcal{U}$ of $X$ is
  *$\omega$-shrinkable* if for each $U \in \mathcal{U}$ there exists
  a closed subset $C_U\subseteq U$ such that
  $\{C_U : U \in \mathcal{U}\}$ is an $\omega$-cover of $X$.
  Then $C_p(X)$ has the Reznichenko property if, and only if, each $\omega$-shrinkable open $\omega$-cover of $X$
  is $\omega$-groupable [SakaiRez].
  Thus if $X$ satisfies $\binom{\Omega}{\Omega^{gp}}$,
  then $C_p(X)$ has the Reznichenko property. The other direction is not clear.

  Is it true that $C_p(X)$ has the Reznichenko property if, and only if,
  $X$ satisfies $\binom{\Omega}{\Omega^{\mbox{*\tiny gp*}}}$?
