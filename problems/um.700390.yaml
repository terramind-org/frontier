title: Kourovka Notebook Problem 6.47
field: mathematics
tier: prose
statement: |-
  (C. D. H. Cooper). Let $G$ be a group, $v$ a group word in two
  variables such that the operation $x \odot y=v(x,y)$ defines the
  structure of a new group $G_v=\left< G,\odot \right>$ on the set
  $G$. Does $G_v$ always lie in the variety generated by $G$?
