title: Ultraproduct II_1 Factors — Problem 8
field: mathematics
tier: prose
statement: |-
  For some mild evidence for the above in the negative, see [jekel2024upgradedfreeindependencephenomena] wherein a general result on free complementation in $L(\mathbb{F}_2)^\mathcal{U}$ is proved, generalizing previous forms of absorption results in the literature, for instance [Popa1983, HoudayerIoana2024, CyrilAOP, FreePinsker].

  Does there exist a nonamenable strongly solid $N$ and $M$ containing an existential copy of $N$ such that $M$ admits a Cartan subalgebra?
