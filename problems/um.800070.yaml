title: Foliations and Diffeomorphism Groups — Question 11
field: mathematics
tier: prose
statement: |-
  Nicola Pia has some work constraining the dynamics of the kernel line field $\mathcal{W}$, but overall we know very little. A crucial remark is that there is no stability for Engel structures, meaning that perturbing an Engel structure will produce some other Engel structure that in general won't be diffeomorphic to the original one. A vague question is then:

  Are there any dynamical properties of $\mathcal{W}$ that are persistent under homotopies of the Engel structure?
