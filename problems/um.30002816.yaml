title: Linear Sum-of-Squares Representations on Grassmann Orbitopes
field: mathematics
tier: prose
statement: For every Grassmann orbitope $G_{k,n}$, is every calibration representable as a sum of squares of linear polynomials relative to the vanishing ideal $I_{k,n}$? Equivalently, if $\delta-\ell$ is the supporting nonnegative function on $G_{k,n}$, does there exist a representation $\delta-\ell(p)=\sum_i h_i(p)^2$ with all $h_i$ linear modulo $I_{k,n}$?
