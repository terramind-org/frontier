  \section*{Geometric CAT(0) actions for word-hyperbolic groups}\label{30007194}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Does every word-hyperbolic group admit a proper cocompact isometric action on a nonempty proper complete CAT(0) space?
  \subsection{Short English statement}
  Does every word-hyperbolic group admit a proper cocompact isometric action on a nonempty proper complete CAT(0) space?
