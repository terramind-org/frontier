lean:
  module: FormalConjectures.OEIS.«261876»
  decl: OeisA261876.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : 0 < n) : 0 < a n"
  context:
    - open OeisA261876
  definitions:
    - name: OeisA261876.a
      kind: def
      text: |-
        /--
        Number of ordered ways to write $n$ as $x^2 + y^2 + z^2 + w^2$ with $(5x^2 + 7y^2 + 9z^2)yz$
        a square, where $x, y, z, w$ are nonnegative integers with $z > 0$.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.range (n + 1),
            ∑ y ∈ Finset.range (n + 1),
              ∑ z ∈ Finset.Ico 1 (n + 1),
                ∑ w ∈ Finset.range (n + 1),
                  if x ^ 2 + y ^ 2 + z ^ 2 + w ^ 2 == n &&
                     isSquare ((5 * x ^ 2 + 7 * y ^ 2 + 9 * z ^ 2) * y * z) then
                    1
                  else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/261876.lean#L41
