title: Kourovka Notebook Problem 16.70
field: mathematics
tier: prose
statement: |-
  Suppose that a finitely generated group $G$ acts
  freely on an $A$-tree, where $A$ is an ordered abelian group. Is
  it true that $G$ acts freely on a ${\mathbb{Z}^n$-tree for some
  $n$?

  *Comment of 2013:*
  It was proved that every finitely presented group acting freely on an $A$-tree acts freely on some $\mathbb{R}^n$-tree for a suitable $n$, where $\mathbb{R}$ has the lexicographical order (O. Kharlampovich, A. Myasnikov, D. Serbin, *Int. J. Algebra Comput.*, **23** (2013), 325--345).
