title: Several Complex Variables Problem List — Problem 77
field: mathematics
tier: prose
statement: |-
  Let C be a smooth cubic in $\mathbb{P}^2$. Then $\mathbb{P}^2\setminus C$
  is algebraically parallellizable, but cannot be algebraically immersed in $\mathbb{C}^2$. Can it be holomorhically immersed in $\mathbb{C}^2$?
  [ There are smooth cubics for which it is true . For related problems see the section called ``Stein manifolds''.]\\
  -R. Narasimhan, Dept. of Math., Univ. of Chicago, Chicago, IL 60637
