title: Selection Principles Milestone Problems — Problem 3 ([ideals, Problem 17], [o-bdd, Problem 2])
field: mathematics
tier: prose
statement: |-
  Let $B=\{f_\alpha : \alpha < {\mathfrak{b}}\}\subseteq\mathbb{N}$ be a $\le^*$-unbounded
  set of strictly increasing elements of $\mathbb{N}$ which forms a \emph{${\mathfrak{b}}$-scale}
  (that is, for each $\alpha<\beta$, $f_\alpha \leq^* f_\beta$),
  and set $H = B\cup Q$.
  In [ideals] it is proved that
  all finite powers of $H$ satisfy $\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\Gamma)$.

  Does $H$ satisfy $\mathsf{S}_1(\Gamma,\Gamma)$?
