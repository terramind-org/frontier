title: Sharper Positive-Scalar-Curvature Face Gluing
field: mathematics
tier: prose
statement: For positive-scalar-curvature manifolds with corners, determine whether isometric faces can be attached without requiring one of the two face mean-curvature functions to have constant sign, whether it suffices that the dihedral angles sum to $\pi$ pointwise, and what sharp hypotheses permit attachment of noncylindrical distinguished faces while preserving the required scalar and boundary curvature conditions.
