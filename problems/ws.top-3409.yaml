  \item[\hypertarget{source:3409:2}{S2}] Open Problem Garden, Rank vs. Genus, OPG-1783. Original problem statement, full mathematical discussion, bibliography and comments. \url{https://www.openproblemgarden.org/op/rank_vs_genus}.
  \item[\hypertarget{source:3409:3}{S3}] Tao Li, Rank and genus of 3-manifolds, Journal of the American Mathematical Society 26 (2013), 777--829; arXiv:1106.6302v2. Introduction, Theorems 1.1 and 1.2. \url{https://arxiv.org/abs/1106.6302v2}.
