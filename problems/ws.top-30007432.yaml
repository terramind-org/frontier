statement: |-
  \section*{Nearly minimal Littlewood maxima with positive minima}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every $\eta >0$, do all sufficiently large integer lengths N admit a polynomial with N real sign coefficients whose modulus is at least sqrt(N)/16 and at most (1+eta)sqrt(N) everywhere on the unit circle?
  \subsection{Short English statement}
  For every $\eta >0$, do all sufficiently large integer lengths N admit a polynomial with N real sign coefficients whose modulus is at least sqrt(N)/16 and at most (1+eta)sqrt(N) everywhere on the unit circle?
