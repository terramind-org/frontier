title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 8: Adin's cubical h-vector nonnegativity and GLBT for cubical complexes"
field: mathematics
tier: prose
statement: |-
  Let $L$ be a pure cubical complex of rank $d$ (dimension $d-1$), and let $h(L)=(h_0(L),h_1(L),\dots,h_d(L))$ be Adin's cubical $h$-vector defined by $\sum_{i=0}^d h_i(L)x^i = \frac{1}{1+x}\left(2^{d-1} + x\sum_s h(\Delta_s,x) + (-2)^{d-1}\widetilde{\chi}(L)x^{d+1}\right)$, where $\Delta_s=\operatorname{link}(s)$ for each vertex $s$ of $L$.

  (a) If $L$ is a Cohen-Macaulay poset, is $h_i(L)\ge 0$ for all $i$?

  (b) If $L$ is in addition a Gorenstein* poset, is it true that $h_0(L)\le h_1(L)\le \cdots \le h_{\lfloor d/2\rfloor}(L)$?
