title: Visibility Graphs of Points, Segments and Polygons — Problem 8
field: mathematics
tier: prose
statement: |-
  Regarding the lower bound on obstacle numbers,
  Alpet et al. [akl-ong-2010] have showed that there exists a graph of $n$ vertices with
  obstacle number $O(\sqrt{\log n})$, which has been improved
  to $O(n/\log ^2 n)$ by Mukkamala et al. [mps-glon-2010]. The bound becomes $O(n/\log n)$
  if the obstacles are restricted to convex polygons.

  Improve the present lower bound $O(n/\log ^2 n)$ of the obstacle number of a graph with $n$ vertices.
