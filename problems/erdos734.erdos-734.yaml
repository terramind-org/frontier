lean:
  module: FormalConjectures.ErdosProblems.«734»
  decl: Erdos734.erdos_734
  statement: |-
    theorem erdos_734 :
        ∃ C : ℝ, 0 < C ∧ ∀ᶠ n : ℕ in atTop,
        ∃ H : Finset (Finset (Fin n)), H.IsPairwiseBalancedDesign ∧
          (∀ e ∈ H, e.card < n) ∧ ∀ t : ℕ,
            ({e ∈ H | e.card = t}.card : ℝ) ≤ C * Real.sqrt n
  context:
    - open Erdos734
    - open Filter Asymptotics
  definitions: []
