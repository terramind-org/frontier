id: um.30002549
title: Universal Almost-Sure Prediction for Stationary Gaussian Processes
field: mathematics
tier: prose
statement: |-
  Let $\{Y_n\}_{n\in\mathbb Z}$ be a stationary, ergodic, mean-zero Gaussian process. Does there exist a sequence of predictors $g_n$ such that

  $$\mathbb E(Y_n\mid Y_1,\ldots,Y_{n-1})-g_n(Y_1,\ldots,Y_{n-1})\longrightarrow0$$

  almost surely as $n\to\infty$?
