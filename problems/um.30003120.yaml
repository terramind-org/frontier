id: um.30003120
title: Uniform Composition Powers of Rational Functions
field: mathematics
tier: prose
statement: For rational functions $u,f\in K(X)$, if $u\circ v=f^n$ for some $n>0$ and $v\in K(X)$, must there be $w\in K(X)$ with $u\circ w=f^N$ for a positive $N$ depending only on $\deg(u)$? More generally, when does the reduction to irreducible genus-at-most-one fibered products produce multiple towers?
