lean:
  module: FormalConjectures.GreensOpenProblems.«53»
  decl: Green53.green_53
  statement: |-
    theorem green_53 :
        ∃ (c : ℕ → ℕ), ∀ (n K : ℕ) (A : Fin K → Set (𝔽₂ n)),
          (⋃ i, A i) = Set.univ →
          Pairwise (Disjoint on A) →
          ∃ (i : Fin K) (S : AffineSubspace (ZMod 2) (𝔽₂ n)),
            (S : Set (𝔽₂ n)) ⊆ A i + A i ∧
            n ≤ Module.finrank (ZMod 2) S.direction + c K
  context:
    - open Green53
    - open Filter Function Real
    - open scoped Pointwise
  definitions: []
