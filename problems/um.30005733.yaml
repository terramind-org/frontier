title: Optimal Set Motions from Nonconvex Initial Regions
field: mathematics
tier: prose
statement: For the optimal set-motion problem, characterize optimal strategies when the initial set $\Omega_0$ is nonconvex and determine when all $\Omega(t)$ remain connected. Which planar results extend to $\mathbb R^n$ or Riemannian manifolds, and in particular do optimal set motions remain convex in $\mathbb R^3$?
