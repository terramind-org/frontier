title: Uniform support separation and a stabilizer obstruction in the hyperfinite full group
field: mathematics
tier: prose
statement: |-
  Take a hyperfinite (ergodic) equivalence relation on $[0,1]$. Let $G$ be the full group of all measure-preserving transformations that respect the equivalence relation (i.e. whose graph is contained in the equivalence relation). Does $G$ contain any *discrete* non-amenable subgroups? Here
  \[
  d(a,b)=\mu\{x:ax\ne bx\}.
  \]
  **Juschenko:** If the answer is no, then IET is amenable.
