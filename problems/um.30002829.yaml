title: Rationality of Ueno-Type Varieties
field: mathematics
tier: prose
statement: Let $E_4$ and $E_6$ be the anharmonic and equianharmonic elliptic curves with their standard automorphisms $g_4$ and $g_6$, and let $X_{n,m}$ be the minimal resolution of $E_m^n/\langle g_m\rangle$ for the diagonal action. Is $X_{4,6}$ rational? Is $X_{5,6}$ unirational?
