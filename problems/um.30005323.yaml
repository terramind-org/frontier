title: Bijective Proof of a Hurwitz Number Identity
field: mathematics
tier: prose
statement: Let $H_{n,\ell}$ count ordered ℓ-tuples of transpositions in $S_n$ whose product is the identity. For $\lambda\vdash n$, let $f_\lambda$ count standard Young tableaux and let $C_\lambda=\sum_{(i,j)\in\lambda}(j-i)$. Give a bijective proof, for all ℓ≥0, of $n!H_{n,\ell}=\sum_{\lambda\vdash n}f_\lambda^2 C_\lambda^\ell$.
