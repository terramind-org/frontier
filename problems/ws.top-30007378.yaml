statement: |-
  \section*{An isolated lightest particle in the continuum O(3) spin field}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For the canonical massive continuum O(3) spin field constructed from the planar lattice model, does the two-point spectral measure have the form $\rho =Z$ $\delta _{m_1^2}+\rho _rest$, with $m_1,Z,\delta >0$ and $supp(\rho _rest)$ contained in $[(m_1+\delta )^2,infinity)$?
  \subsection{Short English statement}
  For the canonical massive continuum O(3) spin field constructed from the planar lattice model, does the two-point spectral measure have the form $\rho =Z$ $\delta _{m_1^2}+\rho _rest$, with $m_1,Z,\delta >0$ and $supp(\rho _rest)$ contained in $[(m_1+\delta )^2,infinity)$?
