  \section{Hemisphere Partition Functions and Stability Across GLSM Phases}\label{30003057}
  {\small UnsolvedMath ID 30003057 · Mathematical Physics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  In the GLSM setting, is the hemisphere partition function $Z_{D^2}:K_0(D)\to\mathbb C$ a central-charge function for a Bridgeland stability condition on $D$, and for the grade-restriction subcategory $W_n$ are the phase quotient categories $D_{\zeta\gg0}$ and $D_{\zeta\ll0}$ related to $W_n$ by the conjectured commuting equivalences?
  \par\smallskip\textit{Formulation references:} \sref{30003057}{1}, \sref{30003057}{2}.
  \subsection{Short English statement}
  In the GLSM setting, is the hemisphere partition function $Z_{D^2}:K_0(D)\to\mathbb C$ a central-charge function for a Bridgeland stability condition on $D$, and for the grade-restriction subcategory $W_n$ are the phase quotient categories $D_{\zeta\gg0}$ and $D_{\zeta\ll0}$ related to $W_n$ by the conjectured commuting equivalences?
