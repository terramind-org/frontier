  module: FormalConjectures.ErdosProblems.«12»
  decl: Erdos12.erdos_12.parts.iii
  statement: |-
    theorem erdos_12.parts.iii :
        ∀ (A : Set ℕ), IsGood A → Summable (fun (n : A) ↦ (1 / n : ℝ))
  context:
    - open Erdos12
    - open Erdos12.erdos_12
    - open Erdos12.erdos_12.parts
    - open Filter Set
  definitions:
    - name: Erdos12.IsGood
      kind: abbrev
      text: |-
        /--
        A set `A` is "good" if it is infinite and there are no distinct `a,b,c` in `A`
        such that `a ∣ (b+c)` and `b > a`, `c > a`.
        -/
        abbrev IsGood (A : Set ℕ) : Prop := A.Infinite ∧
          ∀ᵉ (a ∈ A) (b ∈ A) (c ∈ A), a ∣ b + c → a < b →
          a < c → b = c
