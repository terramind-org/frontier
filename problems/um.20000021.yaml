title: Spherical twists must be formed after Cox localization
field: mathematics
tier: prose
statement: Let $X$ be a smooth projective toric variety with Cox ring $S$ and irrelevant ideal $B$. Can a spherical twist be implemented on bounded graded free $S$-complexes so that it acts on virtual resolutions, and what obstruction is caused by $B$-torsion?
