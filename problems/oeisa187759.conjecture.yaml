lean:
  module: FormalConjectures.OEIS.«187759»
  decl: OeisA187759.conjecture
  statement: |-
    theorem conjecture (n : ℕ) (hn : 200 < n) (hnot : n ∉ ({211, 226, 541, 701} : Finset ℕ)) :
        0 < a n
  context:
    - open OeisA187759
  definitions:
    - name: OeisA187759.a
      kind: def
      text: |-
        /--
        The number of ways to write $n = x + y$ ($0 < x < y < n$) with $6x - 1$, $6x + 1$, $6y - 1$,
        and $6y + 1$ all prime.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.Icc 1 ((n - 1) / 2),
            let y := n - x
            if Nat.Prime (6 * x - 1) ∧ Nat.Prime (6 * x + 1) ∧
               Nat.Prime (6 * y - 1) ∧ Nat.Prime (6 * y + 1)
            then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/187759.lean#L36
