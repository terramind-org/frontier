title: Vanishing for Non-$p$-Nilpotent Compact Lie Groups
field: mathematics
tier: prose
statement: Let $G$ be a positive-dimensional compact Lie group such that $\pi_0(G)$ is not $p$-nilpotent. Is the map $\pi_*(\Gamma_k C_*(\Omega BG^\wedge_p))\to\pi_*(C_*(\Omega BG^\wedge_p))$ zero?
