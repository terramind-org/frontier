title: Uniqueness of Rough Continuity Equations
field: mathematics
tier: prose
statement: For the continuity equation $\partial_tu+\operatorname{div}(bu)=0$ in $d$ dimensions, with bounded divergence-free $b\in W^{1,p}$ and $u\in L^q$, are distributional solutions unique and Lagrangian throughout the regime $1<1/p+1/q<1+1/d$?
