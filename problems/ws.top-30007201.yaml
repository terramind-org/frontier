statement: |-
  \section*{Coefficient injectivity for unimodular one-variable equations}\label{30007201}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every group A and word $w\in A*\langle t\rangle $ with exponent sum1 $or-1$ in t, is the canonical homomorphism $A\to (A*\langle t\rangle )/\langle \langle w\rangle \rangle $ injective?
  \subsection{Short English statement}
  For every group A and word $w\in A*\langle t\rangle $ with exponent sum1 $or-1$ in t, is the canonical homomorphism $A\to (A*\langle t\rangle )/\langle \langle w\rangle \rangle $ injective?
