title: Decomposition of Representable Polymatroids into Matroid Ranks
field: mathematics
tier: prose
statement: |-
  Let $f$ be a polymatroid function on a ground set $V$ that is linearly representable over a field $F$: there are subspaces $T_v$ such that

  $$f(S)=\operatorname{rk}\!\left(\bigcup_{v\in S}T_v\right).$$

  Is $f$ always a nonnegative linear combination of linear-matroid rank functions over $F$?
