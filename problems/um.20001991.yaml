id: um.20001991
title: Betti bounds and a defect-vector formula for real tropical patchworks
field: mathematics
tier: prose
statement: "Real tropical hypersurfaces are directly related to T-hypersurfaces (piecewise-linear hypersurfaces arising in the combinatorial patchworking). Many restrictions on the topology of T-hypersurfaces are known. It would be interesting to look at these restrictions from the point of view of tropical geometry and to study the topology of real tropical varieties. For example, the following question arises. Question: What can be said about Betti numbers of a real tropical variety? (contributed by Ilia Itenberg)"
