  \item[\hypertarget{source:9400108:2}{S2}] Tomohiro Yamada, \emph{On the Ratat--Goormaghtigh equation and integer points close to the graph of a smooth function}, arXiv:2510.11252v1 (2025) Introduction, equation (1.1), p. 1. \url{https://arxiv.org/pdf/2510.11252}.
