title: Metastability and Massive-Arratia Limits for Weakly Interacting Diffusions
field: mathematics
tier: prose
statement: Prove dynamical metastability for the mean-field partial differential equation governing weakly interacting diffusions. Also prove convergence of the particle system to the massive Arratia flow in the joint regime $N\to\infty$, $\gamma\to\infty$, $\ell\to 0$, and $\gamma\ell/\log N\to\infty$.
