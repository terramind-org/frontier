title: Open Problems in Arithmetic Dynamics — Conjecture 3
field: mathematics
tier: prose
statement: |-
  \textup{(Poonen, 1998, [poonen:uniformboundrefined])}
  For all $c\in\mathbb{Q}$, the set of periodic points \text{$\operatorname{Per}(x^2+c,\mathbb{Q})$} contains
  no points of period strictly greater than $3$.
