title: Exact state chamber and integrable interaction for a separating thin-film shock pair
field: mathematics
tier: prose
statement: |-
  The thin-film equation
  \[
  u_t+(u^2-u^3)_x=-\varepsilon (u^3u_{xxx})_x
  \]
  supports solutions comprising a Lax shock moving left with speed \(s_1\)
  and an undercompressive shock moving right with speed \(s_2\), as in
  Figure 2. Can one prove stability or instability of this structure?
