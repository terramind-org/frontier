title: Halfspace pullbacks in the pure Salvetti complex
field: mathematics
tier: prose
statement: Let $\Sigma$ be the Davis complex of the associated Artin group. Take intersections of halfspaces in $\Sigma$, then pull back via the natural surjection from $P$. What can we say about these subspaces of $P$? Specifically, when are they $\pi_1$-injective?
