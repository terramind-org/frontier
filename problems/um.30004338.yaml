id: um.30004338
title: Free Quasi-Actions and Almost-Ramanujan Subgroups
field: mathematics
tier: prose
statement: For a standard probability space $(X,\mu)$, how many essentially free quasi-actions of $\operatorname{Aut}(X,\mu)$ exist up to conjugacy, and are all factors of the canonical product quasi-action $\rho_\infty$? Separately, for $k\geq 2$ and $\varepsilon>0$, does there exist $C$ such that every $k$-generated subgroup of a free group with no nontrivial reduced-word relations has normalized adjacency operator norm at most the Ramanujan bound $\sqrt{2k-1}/k+\varepsilon$?
