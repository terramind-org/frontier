title: Kourovka Notebook Problem 12.9
field: mathematics
tier: prose
statement: |-
  Following Bass, call a group *tree-free* if
  there is an ordered Abelian group $\Lambda$ and a $\Lambda $-tree
  $X$ such that $G$ acts freely without inversion on $X$.

  a) Must every finitely generated tree-free
  group satisfy the
  maximal condition for Abelian subgroups?

  b) The same question for finitely
  presented tree-free
  groups.
