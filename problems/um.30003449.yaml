title: Rank-One Kernel Boundary Points of Free Spectrahedra
field: mathematics
tier: prose
statement: Let $L$ be a Hermitian monic linear pencil and let $D(L)$ be its free spectrahedron. Must there exist a boundary point $X$ satisfying $\dim\ker L(X)=1$; equivalently, is $\partial^1D(L)$ nonempty?
