title: Finite Subgroups and Torsion Primes of Cremona Groups
field: mathematics
tier: prose
statement: Write $\operatorname{Aff}_n$ for the affine group, $\operatorname{Cr}_n$ for the Cremona group, and $\operatorname{Tors}(G)$ for the set of torsion primes of a group $G$. Do there exist isomorphic finite subgroups of $\operatorname{Aff}_n$ that are not conjugate in $\operatorname{Cr}_n$? Are the sets $\operatorname{Tors}(\operatorname{Cr}_n)$, $\operatorname{Tors}(\operatorname{Aut}(\mathbb A^n))$, and $\operatorname{Tors}(\operatorname{Aut}^*(\mathbb A^n))$ finite, and what is the least $n$ for which one of them contains $7$? Finally, which analogues of the standard Jordan-decomposition properties for connected reductive algebraic groups hold for these three groups?
