title: Characteristic-p Approximation of Normalized Betti Numbers
field: mathematics
tier: prose
statement: Let $k$ be a field of positive characteristic, let $\Gamma$ be a residually finite group with residual chain $(\Gamma_i)$, and let $X$ be a finite free $\Gamma$-CW complex. For every $n$, does $$\lim_{i\to\infty}\frac{\dim_k H_n(\Gamma_i\backslash X;k)}{[\Gamma:\Gamma_i]}$$ exist for arbitrary $\Gamma$, is it independent of the residual chain, and what invariant equals this limit?
