id: um.30000704
title: Boundary Regularity for Complete Conformal Metrics
field: mathematics
tier: prose
statement: Let $\Omega\subseteq\mathbb C$ be a domain and $\Gamma\subseteq\partial\Omega$ a boundary set. For a regular conformal metric $\lambda(z)|dz|$ on $\Omega$ with curvature bounded below by $-4$, when are local completeness near $\Gamma$, meaning $d_\lambda(z,z_0)\to\infty$ as $z$ approaches every point of $\Gamma$, and divergence $\lambda(z)\to\infty$ at every point of $\Gamma$ equivalent? In particular, what minimal regularity of $\Gamma$ makes them equivalent?
