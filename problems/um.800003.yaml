title: The Lyapin's Notebook — Problem 3
field: mathematics
tier: prose
statement: |-
  (S. Bershadsky, S. Kublanovsky)
  Is there an algorithm that decides whether a given finite semigroup is embeddable into a power semigroup over some finite group (periodic group) (see Chapter 5 of this notebook)?

  Not every finite semigroup has this property, but every semigroup is a divisor of the power semigroup over a periodic group (see [BersKubl]). For divisors of power semigroups over finite groups the answer is positive (see [Henckell]).
