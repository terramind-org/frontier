title: Comparative Prime Number Theory — Problem 11
field: mathematics
tier: prose
statement: |-
  - (Greg Martin, University of British Columbia)
  This question was asked by Carl Pomerance and appears in [Mar, Section 3]. Let $a$ and $b$ be distinct reduced residue classes modulo $q$.

  Prove unconditionally that the set of $x$ for which $\pi(x;q,a)=\pi(x;q,b)$ (the set of ``ties'' in the prime number race) has (natural or logarithmic) density $0$.

  If we assume GRH and a very mild version of LI (see [Devin, Theorem 2.2]), the limiting logarithmic distribution of $\bigl( \pi(x;q,a)=\pi(x;q,b) \bigr) (\log x)/\sqrt x$ exists and is absolutely continuous with respect to Lebesgue measure. Consequently, for any function $f(x)$ that is $o(\sqrt x/\log x)$, the set of $x$ for which $\bigl| \pi(x;q,a)=\pi(x;q,b) \bigr| < f(x)$ has logarithmic density $0$; this conclusion is far stronger than ``ties have density $0$''. But ``ties have density $0$'' is such a weak assertion that we might hope to prove it unconditionally.
