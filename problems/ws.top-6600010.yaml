  \item[\hypertarget{source:6600010:3}{S3}] Alan Haynes, Henna Koivusalo, Lorenzo Sadun and James Walton, \emph{Gaps problems and frequencies of patches in cut and project sets}, arXiv:1411.0578 (2014), Section 1.2, pp. 2--5. \url{https://arxiv.org/pdf/1411.0578}.
