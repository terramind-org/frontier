title: Selection Principles in Mathematics — Problem 55 ([prods])
field: mathematics
tier: prose
statement: |-
  If $X,Y\subseteq\{0,1\}^{\mathbb{N}}$ are meager-additive, then $X\times Y$ is a meager-additive
  subset of $\{0,1\}^{\mathbb{N}}\times\{0,1\}^{\mathbb{N}}$. The same is true for null-additive subsets of $\{0,1\}^{\mathbb{N}}$.
  For the real line this is open.

  Assume that $X,Y\subseteq\mathbb{R}$ are meager- (respectively, null-) additive.
  Does it follow that $X\times Y$ is meager- (respectively, null-) additive?
