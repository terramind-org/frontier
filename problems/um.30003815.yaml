title: Generalized Alternating-Sign Matrices and Shifted Plane Partitions
field: mathematics
tier: prose
statement: Find a natural definition of $(n,k)$-alternating-sign matrices such that $(n-1,2)$-alternating-sign matrices coincide with, or are in a simple bijection with, ordinary $n$-alternating-sign matrices, and such that their number equals the number of $(n,k)$ column-strict shifted plane partitions.
