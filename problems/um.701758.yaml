title: Kourovka Notebook Problem 20.100
field: mathematics
tier: prose
statement: |-
  *Conjecture*:
  Let $n$ be a positive integer, and let $G$ be a group
  containing no elements of order among $2,\ldots,n+1$.
  Then, for any $A\subseteq G$ with $|A|=n$, we may write $A=\{a_1,\ldots,a_n\}$
  with $a_1,a_2^2,\ldots,a_n^n$ pairwise distinct.

  The conjecture is known to hold for $n\leq 3$.
