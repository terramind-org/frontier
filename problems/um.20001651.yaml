title: Three obstructions to infinite mapping-class images
field: mathematics
tier: prose
statement: |-
  **Problem 4.2.** What is \(\operatorname{Hom}(\operatorname{Out}(F_n),\operatorname{MCG}(S))\)? Can homomorphisms have infinite image if \(n\ge4\)?

  **Remark.** Juan warned that you need bounds on \(S\) and \(n\) because otherwise the answer is the infinite abelianization problem.

  If there exists a finite index subgroup \(\Gamma<\operatorname{Out}(F_n)\) which surjects onto \(\mathbb Z\), then \(\operatorname{Out}(F_n)\) surjects onto \(A\), a virtually abelian subgroup of \(\operatorname{MCG}(S)\). So a warm-up question would be

  **Problem 4.3.** Does every homomorphism \(\phi:\operatorname{Out}(F_n)\to\operatorname{MCG}(S)\) have virtually abelian image?
