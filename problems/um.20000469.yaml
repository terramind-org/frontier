title: A finite-part BOCG identity for Fisher--Hartwig symbols
field: mathematics
tier: prose
statement: |-
  The Borodin-Okounkov-Case-Geronimo identity is given by
  \(\text{det}(T_N(e^f))=(e^{N\hat f(0)+\sum k\hat f(k)\hat f(-k)})
  \text{det}(1-k)\).
  Find a useful adjustment to the right-hand side so that an identity holds in the
  Fisher-Hartwig case.
