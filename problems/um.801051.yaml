title: "Henon Maps: Open Problems — Question 3"
field: mathematics
tier: prose
statement: |-
  Do there exist $\varepsilon>0$ and a locally dense set (i.e., whose closure has non-empty interior.) $E$ of quadratic H\'enon maps for which
  every point starting in some set of Lebesgue measure at least $\varepsilon$ has non-statistical behavior?
