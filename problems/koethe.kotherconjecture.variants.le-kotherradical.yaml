lean:
  module: FormalConjectures.Wikipedia.Koethe
  decl: Koethe.KotherConjecture.variants.le_KotherRadical
  statement: |-
    theorem KotherConjecture.variants.le_KotherRadical {I : Ideal R} (hI : IsNil I) :
        (I : Set R) ⊆ KotheRadical R
  context:
    - open Koethe
    - open Koethe.KotherConjecture
    - open Koethe.KotherConjecture.variants
    - open Ideal TwoSidedIdeal Polynomial
    - open Matrix
    - "variable {R : Type*}"
    - variable [Ring R]
    - local notation "Nil* " R => KotheRadical R
  definitions:
    - name: Koethe.IsNil
      kind: def
      text: |-
        /-- Say a subset `I` of a ring `R` is nilpotent if all its elements are nilpotent. -/
        def IsNil {S : Type*} [SetLike S R] (I : S) := ∀ i ∈ I, IsNilpotent i
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/Koethe.lean#L40
    - name: Koethe.KotheRadical
      kind: def
      text: |-
        /-- The *Kothe Radical* of a ring `R` is the sum of all (two-sided) nil ideals of `R`.
        Tags: Kothe Radical, upper nilradical-/
        def KotheRadical : TwoSidedIdeal R := sSup {I : TwoSidedIdeal R | IsNil I}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/Koethe.lean#L46
