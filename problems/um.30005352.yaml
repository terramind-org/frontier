title: Monochromatic Subspaces in Binary Vector Spaces
field: mathematics
tier: prose
statement: Let $f(n)$ be the largest number such that every two-coloring of $\mathbb F_2^n\setminus\{0\}$ contains a monochromatic set of $f(n)$ nonzero vectors forming a linear subspace together with $0$. Is $f(n)=O(n)$?
