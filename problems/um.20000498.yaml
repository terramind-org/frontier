title: Planar nonattainment and a nodal-puncture obstruction for simple first Steklov eigenvalues
field: mathematics
tier: prose
statement: |-
  **Non-existence of a maximizer for the first Steklov eigenvalue with perimeter constraint.**
  Let \(\sigma _1(\Omega)\) denote the first non-trivial Steklov eigenvalue for a bounded domain \(\Omega\subset\mathbb R^n\). Prove that there is no \(\Omega\subset\mathbb R^n\) which maximizes the quantity
  \[
  P(\Omega)^{1/(n-1)}\sigma _1(\Omega).
  \]
