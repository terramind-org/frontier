title: A harmonic family bound and the exact individual-extraction barrier
field: mathematics
tier: prose
statement: |-
  Shifted convolution sum for $\mathrm{GL}_3\times\mathrm{GL}_2$ in level aspect. Let $\pi$ be a fixed Hecke--Maass cusp form for $SL_3(\mathbb Z)$ with Fourier coefficients $\{\lambda_\pi(r,n)\}$ and $f$ be a holomorphic for Hecke Maass cusp form for $\Gamma_0(M)$ with Fourier coefficients $\{\lambda_f(n)\}$. Obtain a non-trivial bound for
  \[
  \sum_{n<N}\lambda_\pi(r,n)\lambda_f(n+1)
  \]
  in the convexity range $N\sim M^{3/2}$.
