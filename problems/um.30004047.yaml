id: um.30004047
title: Two-Step Path Density in Tripartite Graphs
field: mathematics
tier: prose
statement: Let $A,B,C$ be disjoint nonempty vertex sets. Suppose every vertex of $A$ has at least $x\lvert B\rvert$ neighbors in $B$ and every vertex of $B$ has at least $y\lvert C\rvert$ neighbors in $C$. Let $\phi(x,y)$ be the largest $z$ such that some vertex of $C$ is joined by two-edge paths to at least $z\lvert A\rvert$ vertices of $A$. Is $\phi(x,x)\geq1/2$ for $x>1/3$? More generally, do $x+ky>1$ and $kx+y\geq1$ imply $\phi(x,y)\geq1/k$?
