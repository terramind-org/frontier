title: Geometry of Continued Fractions — Faces of sails
field: mathematics
tier: prose
statement: "Which $n$-gons are realizable as faces of an $m$-dimensional continued fraction? Here are two essentially geometrically different subcases: ; {\\bf Faces at integer distance 1 to the origin:} this is a question of description of integer convex polyhedra that are inscribed to simplices of full dimension in $\\r^n$. ; {\\bf Faces at integer distance greater than 1 to the origin:} here we have a typical view-obstacle problem, one avoids integer points that are view-obstacles for the corresponding faces."
