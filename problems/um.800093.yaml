title: Foliations and Diffeomorphism Groups — Question 34
field: mathematics
tier: prose
statement: Let $\mathcal{F}$ be the foliation defined by a fibration $\pi\colon M\to S$ where $S$ is a genus $2$ closed oriented surfaces and the fiber is the torus $T^2$. Under what hypothesis on the monodromy does any foliation $\mathcal{G}$ close to $\mathcal{F}$ have a compact leaf close to a fiber?
