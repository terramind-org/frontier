title: Selection Principles Milestone Problems — Problem 31 ([BerJu, Question 4.2], [lengthdiags, footnote 1])
field: mathematics
tier: prose
statement: |-
  Let $\mathcal{D}$ denote the collection of all families $\mathcal{U}$ of open sets in $X$
  such that $\cup\mathcal{U}$ is dense in $X$.
  In [BerJu], Berner and Juh\'asz introduce the open-point game,
  which by [coc6] is equivalent to $\mathsf{G}_1(\mathcal{D},\mathcal{D})$ in the sense
  that a player has a winning strategy in the open-point game on $X$
  if, and only if, the *other* player has a winning strategy in
  $\mathsf{G}_1(\mathcal{D},\mathcal{D})$.

  Does there exist in ZFC a space in which $\mathsf{G}_1(\mathcal{D},\mathcal{D})$ is undetermined?
