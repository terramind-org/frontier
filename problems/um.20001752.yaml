title: Midpoint projection and modular-period reductions for the E8 and Leech magic functions
field: mathematics
tier: prose
statement: |-
  Let $f$ be the magic function in $8$-dimension and
  $M_f(s) = \int_0^\infty f(x) x^{s-1} dx$. Conjecture of Cohn and Miller:
  $M_f(4) = \frac{1}{15} = M_{\hat{f}}(4)$. Can we prove this? The same
  question for the magic function in $24$-dimension, where
  $M_f(12) = M_{\hat{f}}(12) = 0.17786094729650\ldots$?
