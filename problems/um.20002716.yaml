title: LCM balancing, Coxeter-like quotient obstructions, and atomic tameness
field: mathematics
tier: prose
statement: |-
  **Problem 4.2 (P. Dehornoy).** (1) Given a cancellative, finitely-generated monoid \(M\) in which lcm's exist, is \(M\) necessarily a Garside monoid? That is, does there exist a Garside element \(\Delta\) in \(M\)?

  (2) In the case of Artin groups, the nicest Garside structures come from the Cayley graph of the corresponding Coxeter group. Is there a way to systematize this? Is there some notion of a “Coxeter group” corresponding to each Garside group?

  (3) Let \(M\) be a Garside monoid with Garside element \(\Delta\), and let \(\ell\) be a length on \(M\) (\(M\) is atomic). Is it always true that \(\ell(\Delta^k)\leq Ck\,|\Delta|\) for some constant \(C\)?
