title: Profinite Rigidity with Free Edge Groups
field: mathematics
tier: prose
statement: Let $\Lambda$ be an amalgamated product $F_1*_H F_2$ or an HNN extension $F_1*_H$ of free groups, where $H$ is an arbitrary finitely generated free group. If the profinite completion of $\Lambda$ is isomorphic to that of a free group or a surface group $\Gamma$, must $\Lambda\cong\Gamma$?
