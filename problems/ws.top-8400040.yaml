  \item[\hypertarget{source:8400040:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 8400040 (AMR-083-0040). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:8400040:2}{S2}] Leonard M. Adleman and Kevin S. McCurley, Open Problems in Number Theory Complexity, II, in Algorithmic Number Theory, LNCS 877 (1994), pp. 291--322, C35/O35, manuscript p. 22 (LNCS p. 312). \url{https://mccurley.org/papers/open.ps.gz}.
  \end{description}
