title: Rational Algebraic Realizations of Compact Manifolds
field: mathematics
tier: prose
statement: Can every compact differentiable manifold be realized as a connected component of the real locus $W(\mathbb{R})$ of a smooth real rational algebraic variety $W$? In higher dimensions, what topological restrictions do Kodaira dimension $-\infty$ or rational connectedness impose on such components?
