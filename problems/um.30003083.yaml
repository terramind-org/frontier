title: Bounded Negativity Conjecture for Projective Surfaces
field: mathematics
tier: prose
statement: "Bounded Negativity Conjecture: for every smooth complex projective surface X, there is $b(X)$ such that every irreducible curve C on X satisfies $C^2\\geq-b(X)$."
