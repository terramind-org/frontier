title: Virtual Cohomological Dimension of Surface Automorphism Groups
field: mathematics
tier: prose
statement: |-
  For a Coble surface, an Enriques surface, or an elliptic K3 surface $S$, is

  $$\operatorname{vcd}(\operatorname{Aut}S)=\max_f\operatorname{MW-rk}(f),$$

  where the maximum ranges over genus-one fibrations $f:S\to\mathbb P^1$ and $\operatorname{MW-rk}(f)$ is the Mordell–Weil rank of the Jacobian fibration?
