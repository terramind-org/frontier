title: Analysis of Boolean Functions — $k$-wise Independence for PTFs
field: computer-science
tier: prose
statement: "Fix $d \\in \\mathbb{N}$ and $\\varepsilon \\in (0,1)$. Determine the least $k = k(d,\\varepsilon)$ such that the following holds: If $p \\colon \\mathbb{R}^n \\to \\mathbb{R}$ is any degree-$d$ multivariate polynomial, and $\\mathbf{X}$ is any $\\mathbb{R}^n$-valued random variable with the property that each $\\bX_i$ has the standard Gaussian distribution and each collection $\\bX_{i_1}, \\dots, \\bX_{i_k}$ is independent, then $|\\operatorname{Pr}[p(\\mathbf{X}) \\geq 0] - \\operatorname{Pr}[p(\\mathbb{Z}) \\geq 0]| \\leq \\varepsilon$, where $\\mathbb{Z}$ has the standard $n$-dimensional Gaussian distribution."
