title: "Henon Maps: Open Problems — Conjecture 48 (see [I])"
field: mathematics
tier: prose
statement: |-
  We have already seen why this bound must depend on $d$, and adjoining periodic points of $f$ to the base field shows why the bound must depend on $[K:\mathbb{Q}]$. As a starting point for further exploration, we mention two more readily falsifiable conjectures.

  Over $\mathbb{Q}$, $(x, y)\mapsto (y, y^2+c+x)$ has no point of period $N$, other than $N\in \{1, 2, 3, 4, 6, 8\}$.
