title: "Ben Green's Open Problem 31 (variant: upper_eventually)"
field: mathematics
tier: proof
statement: |-
  Can we improve the upper bound $N^{1/2} + 0.94349 N^{1/4} + O(1)$ [HZ26], for all sufficiently
  large $N$?
