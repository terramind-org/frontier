  definitions:
    - name: OeisA185150.a
      kind: def
      text: |-
        /-- Number of odd primes $p \in (n^2, (n+1)^2)$ with $(n/p) = 1$. -/
        def a (n : ℕ) : ℕ :=
          ∑ p ∈ Finset.Ioo (n ^ 2) ((n + 1) ^ 2),
            if p.Prime ∧ p ≠ 2 ∧ jacobiSym (n : ℤ) p = 1 then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/185150.lean#L36
