lean:
  module: FormalConjectures.ErdosProblems.«1109»
  decl: Erdos1109.erdos_1109.variants.polylog
  statement: |-
    theorem erdos_1109.variants.polylog :
        ∃ C > (0 : ℝ),
          (fun N : ℕ => (f N : ℝ)) ≪ fun N : ℕ => (Real.log N) ^ C
  context:
    - open Erdos1109
    - open Erdos1109.erdos_1109
    - open Erdos1109.erdos_1109.variants
    - open Filter Asymptotics
    - open scoped Pointwise
  definitions:
    - name: Erdos1109.f
      kind: def
      text: |-
        /--
        `f N` is the largest size of a subset `A ⊆ {1, ..., N}` such that every element
        of `A + A` is squarefree.
        -/
        noncomputable def f (N : ℕ) : ℕ :=
          sSup {k : ℕ | ∃ A : Finset ℕ,
            A ⊆ Finset.Icc 1 N ∧ (∀ n ∈ A + A, Squarefree n) ∧ A.card = k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/1109.lean#L42
