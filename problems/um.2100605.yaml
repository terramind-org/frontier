title: Open Problems in Integrable Systems — Poisson geometry and action-angle variables
field: mathematics
tier: prose
statement: Consider a Poisson manifold $M$ of even dimension such that it is symplectic on a dense set $U\subset M$. Assume that $M$ is endowed with a toric action which is Hamiltonian on $U$. Is there an analog of Delzant theorem for the image of the moment map?
