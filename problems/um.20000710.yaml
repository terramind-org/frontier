statement: |-
  Evaluate
  \[
  \int_0^T f\!\left(\left|\zeta\!\left(\tfrac12+it\right)\right|\right)\,dt,
  \]
  where \(f=J_{2k}\), the Bessel function, or \(f=T_{2k}\), the Chebyshev polynomial.
