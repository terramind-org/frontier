  module: FormalConjectures.ErdosProblems.«857»
  decl: Erdos857.erdos_857
  statement: |-
    theorem erdos_857 :
        ∀ k : ℕ, 3 ≤ k → Tendsto (fun n : ℕ => (m n k : ℝ) / erdos_857.answer k n) atTop (nhds 1)
  context:
    - open Erdos857
    - open Filter
  definitions:
    - name: Erdos857.m
      kind: def
      text: |-
        /--
        `m(n, k)`: minimal sunflower-forcing family size in the non-uniform `[n]` model.
        -/
        noncomputable def m (n k : ℕ) : ℕ :=
          sInf {t : ℕ | ∀ (F : Set (Set (Fin n))), t ≤ F.ncard →
            ∃ S ⊆ F, S.ncard = k ∧ IsSunflower S}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/857.lean#L36
