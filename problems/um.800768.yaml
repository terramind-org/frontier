title: Positively Curved Projective Varieties — Problem 3
field: mathematics
tier: prose
statement: |-
  [{[Mat18b, Problem 5.1]}]

  Let $(X, g)$ be a compact K\"ahler manifold
  with semi-positive holomorphic sectional curvature.
  Assume that $n_{{\rm{tf}}}{(X, g)} = \dim X$.

  $\bullet$ Does it hold that $h^{0}(X, \Omega_X^q)=0$ for any $q>0$?

  $\bullet$ Is $X$ automatically projective?
