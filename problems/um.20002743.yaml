title: Finite residual certificates for adjoint Stark-unit reconstruction
field: mathematics
tier: prose
statement: "**Local-global description of Stark units.** Let \\(f\\) be a weight-\\(1\\) modular form with associated Galois representation \\(\\rho_f\\). The Harris--Venkatesh conjecture gives a description of Stark units for \\(\\mathrm{Ad}^0(\\rho_f)\\) modulo \\(p\\) for almost all \\(p\\). In explicit exotic cases, can this be used to describe the Stark units for \\(\\mathrm{Ad}^0(\\rho_f)\\) themselves?"
