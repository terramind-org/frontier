title: Structure of Generalized Verma Modules
field: mathematics
tier: prose
statement: Let $\mathfrak{g}$ be a semisimple complex Lie algebra, let $\mathfrak{p}$ be a parabolic subalgebra containing a Borel subalgebra, let $\mathfrak{a}$ be the reductive part of $\mathfrak{p}$, and let $V$ be a simple $\mathfrak{a}$-module. Determine the structure of the generalized Verma module $\Delta(\mathfrak{p},V)=U(\mathfrak{g})\otimes_{U(\mathfrak{p})}V$, including its simple composition factors and their multiplicities.
