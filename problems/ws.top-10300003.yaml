  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Danny Calegari, \emph{Problems in foliations and laminations of 3-manifolds}, version 0.78 (2002), Question 2.3; Definitions 1.1--1.10 and local definitions and remarks. \url{https://arxiv.org/abs/math/0209081v1}.
  \end{description}
