title: Equality of Tropical and Matroidal Amoeba-Dimension Formulas
field: mathematics
tier: prose
statement: For a loopless matroid $M$ on $[n]$ with matroid-fan support $F\subseteq\mathbb R^n$, prove that $\min_U\{2\dim_{\mathbb R}(U+F)-\dim_{\mathbb R}U\}$ equals $\min_{\bigsqcup_{i=1}^kP_i=[n]}\sum_{i=1}^k(2\operatorname{rk}_M(P_i)-1)$, where $U$ ranges over rationally spanned subspaces and every $P_i$ is nonempty.
