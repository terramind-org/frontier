lean:
  module: FormalConjectures.GreensOpenProblems.«97»
  decl: Green97.green_97.variants.toroidal
  statement: |-
    theorem green_97.variants.toroidal :
        (fun n : ℕ ↦ (numToroidalQueens n : ℝ)) ~[toroidalDegrees]
          green_97.variants.toroidal.answer
  context:
    - open Green97
    - open Green97.green_97
    - open Green97.green_97.variants
    - open Filter Asymptotics
    - open scoped Nat Topology
  definitions:
    - name: Green97.numToroidalQueens
      kind: def
      text: |-
        /--
        `numToroidalQueens n` is $T(n)$, the number of ways to place $n$ non-attacking queens on the
        toroidal $n \times n$ board (`IsToroidalQueens`).
        -/
        def numToroidalQueens (n : ℕ) : ℕ :=
          (Finset.univ.filter fun σ : Equiv.Perm (Fin n) ↦ IsToroidalQueens σ).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/GreensOpenProblems/97.lean#L80
    - name: Green97.toroidalDegrees
      kind: def
      text: |-
        /--
        The filter on `ℕ` for $n \to \infty$ through the integers with $n \equiv 1, 5 \pmod 6$. For
        $n \ge 1$, these are exactly the $n$ for which $T(n) > 0$ (Pólya, see [BoKe21, Chapter 1]).
        -/
        noncomputable def toroidalDegrees : Filter ℕ :=
          atTop ⊓ Filter.principal {n : ℕ | n % 6 = 1 ∨ n % 6 = 5}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/GreensOpenProblems/97.lean#L87
    - name: Green97.green_97.variants.toroidal.answer
      kind: def
      text: "def green_97.variants.toroidal.answer : ℕ → ℝ := sorry"
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/GreensOpenProblems/97.lean#L170
