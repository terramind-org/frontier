statement: Let \(G\) be a free-by-cyclic group and \(F\) a component of the BNS invariant of \(G\). When is it the case that the stretch factor functions \(\lambda_{+}, \lambda_{-} \colon F \to \mathbb{R}\) agree on a convex subset of \(F\)?
