title: Hausdorff Dimension of Critical Almost Mathieu Spectra
field: mathematics
tier: prose
statement: For the almost Mathieu operator on $\ell^2(\mathbb{Z})$, defined by $(H_{\alpha,\lambda,\theta}\psi)(n)=\psi(n+1)+\psi(n-1)+\lambda\cos(2\pi\alpha n+\theta)\psi(n)$, let $S(\alpha,\lambda)$ be its spectrum, independent of $\theta$ when $\alpha$ is irrational. Is $\dim_HS(\alpha,2)<1/2$ for every irrational $\alpha$?
