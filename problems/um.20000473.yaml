title: Perturbative solvability beyond the reciprocal-symbol symmetry
field: mathematics
tier: prose
statement: |-
  “The determinant of Toeplitz \(+\) Handle is expressible in terms of the \(4 \times 4\) Riemann-Hilbert problem for Szego type symbols. The obstacle to asymptotic analysis is the existence of a solution to model problems. If \(d \tilde{d}=1\) on \(\{|z|=1\}\), where \(d=\frac{\phi(z)}{w(z)}\) and \(\tilde{d}=\frac{\phi(1/z)}{w(1/z)}\), then it is solvable. What if this doesn't hold?”

  For Szegő-type nonvanishing symbols, what can be said about existence of the model Riemann--Hilbert problem when the ratio \(d=w/\phi\) does not obey \(d(z)d(z^{-1})=1\)?
