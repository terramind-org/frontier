    url: https://people.maths.ox.ac.uk/greenbj/papers/open-problems.pdf#problem.37
  - label: Green & Tao, *The primes contain arbitrarily long arithmetic progressions* (arXiv:math/0404188)
    url: https://arxiv.org/abs/math/0404188
