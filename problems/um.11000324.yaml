statement: 1. ¯σ∗(˜t2k+1) is non-trivial in H 2(Hg,1) for any k 2. σ∗(˜t2k+1) is trivial in H 2(Hg,1) for any k. The first part of the above conjecture is the “group version” of Conjecture 6.1 and it should be even more diﬃcult to prove. On the other hand, if the classes σ∗(˜t2k+1) were non-trivial, then they would serve as invariants for certain 4-manifolds (2-dimensional family of homology cylinders). This seems unlikely to be the case. Thus the second part is related to the following problem.
