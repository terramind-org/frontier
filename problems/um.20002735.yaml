title: Fixed vectors as compact-torus distinction
field: mathematics
tier: prose
statement: |-
  **Fixed vectors for $\mathrm{GSp}_{2n}$.** Let $\pi$ be a irreducible admissible infinite-dimensional representation of $\mathrm{GSp}_{2n}(\mathbb Q_p)$. Consider the subgroup
  \[
  R(n):=\{g\equiv(\text{matrix with $1$ on the diagonal for first $n$ entries, $a$ on the diagonal for the last $n$ entries})\pmod{p^n}\text{ for some }a\in\mathbb Z_p^\times\}.
  \]
  Does $\pi$ have a $R(n)$-fixed vector for some $n$?
