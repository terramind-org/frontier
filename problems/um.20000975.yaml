title: Semisimple character partitions and a rational cycle obstruction
field: mathematics
tier: prose
statement: "Lionel Levine: “This question is inspired by Criel Merino's work [25] relating the Tutte polynomial to chip-firing. The Tutte polynomial is the most general invariant of a graph that has a deletion-contraction recurrence. Is there a deletion-contraction recurrence of some sort for critical groups? It would have to be at the level of group algebras rather than groups themselves.” Jeremy Martin suggested starting with a cycle graph. Levine also asked whether the deletion--restriction exact sequence for hyperplane-arrangement algebras has a critical-group analogue."
