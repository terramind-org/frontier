title: Equality Cases in the Balanced Lower Bound Conjecture
field: mathematics
tier: prose
statement: For every balanced simplicial d-polytope P, the normalized h-numbers satisfy $\frac{h_0(P)}{\binom{d}{0}}\leq\cdots\leq\frac{h_{\lfloor d/2\rfloor}(P)}{\binom{d}{\lfloor d/2\rfloor}}$; equality at the relevant adjacent terms should characterize the balanced stacked property.
