title: Determinant Approximation for $L^{2}-Torsion$
field: mathematics
tier: prose
statement: Let $G$ be residually finite and let $G=G_0\supset G_1\supset\cdots$ be a chain of normal finite-index subgroups with trivial intersection. For a matrix $A$ over $\mathbb QG$, is its Fuglede–Kadison determinant over $G$ the limit of the normalized Fuglede–Kadison determinants of the induced matrices over the finite quotients $G/G_i$?
