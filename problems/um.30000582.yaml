title: Rigid Fano Targets of Holomorphic Maps
field: mathematics
tier: prose
statement: Which Fano manifolds $X$ are rigid targets of surjective holomorphic maps? Here $X$ is a rigid target if every projective subvariety of $T_X$ dominating $X$ is a section; equivalently, every deformation of a surjective holomorphic map $Y\to X$ arises from an automorphism of $X$.
