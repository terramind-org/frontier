title: Arbitrary-ideal alteration formula, finite-principalization obstruction, and exact DVR audit
field: mathematics
tier: prose
statement: |-
  Given a log pair \((X,\Delta)\), we know that there exists a finite map
  \(\phi:Y\to X\) such that
  \[
  \operatorname{im}\!\left(
  \phi_*\mathcal O_Y\!\left(K_Y-\phi^*(K_X+\Delta)\right)
  \overset{\mathrm{trace}}{\longrightarrow}\mathcal O_X
  \right)=\tau(X,\Delta).
  \]
  Is this statement true if further decorated by \(\mathfrak a^t\)? What
  about for alterations?
