title: Prime-power obstructions and divisor-bounded positive results
field: mathematics
tier: prose
statement: |-
  Can anything be done for correlations of unbounded functions? What is the behavior in almost all intervals of
  \[
  \sum_{x\leq n\leq x+H}g(n),
  \]
  with \(g\) an unbounded multiplicative function such that \(g(p)=O(1)\), and \(H=\log^A x\) for \(A>0\) fixed?
