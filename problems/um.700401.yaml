title: Kourovka Notebook Problem 6.59
field: mathematics
tier: prose
statement: |-
  A group $G$ is said to be (*conjugacy, $p$-conjugacy*)
  *biprimitively finite* if, for any finite subgroup $H$,
  any two elements of prime order (any two conjugate elements of
  prime order, of prime order $p$) in $N_G(H)/H$ generate a finite
  subgroup. Prove that an arbitrary periodic (conjugacy)
  biprimitively finite
  group (in particular, having no involutions) of finite rank is
  locally finite.
