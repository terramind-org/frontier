title: Nonparametric Bootstrap for High-Dimensional Spectral Statistics
field: mathematics
tier: prose
statement: For high-dimensional sample covariance matrices, determine whether a fully nonparametric bootstrap consistently approximates centered linear spectral statistics. The ordinary bootstrap can fail, while an $m$-out-of-$n$ and $q$-out-of-$p$ scheme preserving the dimension-to-sample ratio may succeed under representative-subpopulation assumptions.
