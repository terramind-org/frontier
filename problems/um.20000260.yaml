title: Frobenius-stable adjoint sections in families
field: mathematics
tier: prose
statement: |-
  **Recovered question.** Let \(f:\mathcal X\to T\) be a flat projective family in
  characteristic \(p>0\), let \(\mathcal A\) be a fixed relatively ample Cartier
  divisor, and let \(m\) be fixed so that
  \(M_t=mK_{X_t}+A_t\) is Cartier.  Is
  \[
  t\longmapsto \dim_{k(t)}S^0(X_t,M_t)
  \]
  invariant, semicontinuous, or otherwise better behaved than ordinary
  plurigenera?
