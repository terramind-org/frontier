title: Prorepresentable Obstructions for Local Action Deformations
field: mathematics
tier: prose
statement: For a local $G$-action $\rho$ on $k[[t]]$, with subgroup $N$, let $\Theta=\operatorname{Der}_k(k[[t]])$ and $\Theta^\sharp=\operatorname{Der}_k(k[[t]]^N)$. Does there exist a pro-representable functor $F$ with tangent space $H^1(G/N,\Theta^\sharp/\Theta^N)$ and maps $D_N^{G/N}\to F$ and $D_{G/N}\to F$ such that $\psi:D_G\to D_N^{G/N}\times D_{G/N}$ factors through $D_N^{G/N}\times_FD_{G/N}$ and the induced map $D_G\to D_N^{G/N}\times_FD_{G/N}$ is smooth?
