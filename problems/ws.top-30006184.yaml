  \section{Power of Shared Randomness in Distributed Computation}\label{30006184}
  {\small\sffamily UnsolvedMath ID 30006184 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  Public randomness is one random string visible to every participant. If inputs depend on it, the joint input-and-randomness distribution need not have the independence assumed in ordinary public-coin protocols.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The task family, input selection/adversary model, and resource measure are not specified by the supplied question.

  Source-record limitation: The distributed task family, adversary/input-selection model, and resource measure are absent.
  \paragraph{Statement recorded in the supplied source.}
  Characterize the power of a public random string shared by multiple parties performing a joint task, particularly when the parties' inputs may depend on that string. \sref{30006184}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record partially solved; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-22.
  \subsection{Short English statement}
  Characterize distributed computation with public randomness when inputs may be chosen as a function of it.
