title: Optimality and Practical Efficiency of Proof Search
field: mathematics
tier: prose
statement: How should proof-search algorithms be compared, and is there an optimal way to search for propositional proofs; why is searching in stronger proof systems apparently unhelpful; and how can practical SAT and automated-theorem-proving algorithms perform well on very long formulas despite exponential lower bounds for associated proof systems?
