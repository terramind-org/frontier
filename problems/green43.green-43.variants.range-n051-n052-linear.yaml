lean:
  module: FormalConjectures.GreensOpenProblems.«43»
  decl: Green43.green_43.variants.range_N051_N052_linear
  statement: |-
    theorem green_43.variants.range_N051_N052_linear :
        ∃ c : ℝ, 0 < c ∧ ∀ᶠ N : ℕ in atTop, ∀ a : ℕ → ℤ,
          c * N ≤ sievedCard N a ((N : ℝ) ^ (0.51 : ℝ)) ((N : ℝ) ^ (0.52 : ℝ))
  context:
    - open Green43
    - open Green43.green_43
    - open Green43.green_43.variants
    - open Filter Topology
  definitions:
    - name: Green43.sievedCard
      kind: def
      text: |-
        /-- The size of the sieved subset `sievedSet N a lo hi`. -/
        noncomputable def sievedCard (N : ℕ) (a : ℕ → ℤ) (lo hi : ℝ) : ℕ :=
          (sievedSet N a lo hi).card
