  \section{Lipschitz extension from Hilbert spaces into L1}\label{20000576}
  {\small UnsolvedMath ID 20000576 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Does the pair $(L^2,L^1)$ have the Lipschitz extension property? Explicitly, is there a constant $C<\infty$ such that every Lipschitz map from every subset of the Hilbert space $L^2$ into $L^1$ extends to the whole $L^2$ with Lipschitz constant at most $C$ times the original constant?
  \par\smallskip\textit{Formulation references:} \sref{20000576}{1}, \sref{20000576}{2}.
  \subsection{Short English statement}
  Does the pair $(L^2,L^1)$ have the Lipschitz extension property? Explicitly, is there a constant $C<\infty$ such that every Lipschitz map from every subset of the Hilbert space $L^2$ into $L^1$ extends to the whole $L^2$ with Lipschitz constant at most $C$ times the original constant?
