title: Kourovka Notebook Problem 6.10
field: mathematics
tier: prose
statement: |-
  Let $p$ be a prime and $n$ be an integer with $p > 2n + 1$. Let
  $x, y$ be $p
  $-elements in $GL_n({\mathbb{C})$. If the
  subgroup $\left< x,y\right>$ is finite, then it is an abelian
  $p
  $-group (W. Feit, J. G. Thompson, *Pacif.
  J. Math.*, **11**, no. 4 (1961), 1257--1262). What can be said
  about $\left< x,y\right> $ in the case it is an infinite group?
