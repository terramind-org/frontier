title: Symplectic Periods of Essentially Speh Representations
field: mathematics
tier: prose
statement: Let $\mathcal{G}'$ consist of representations $Q(\Delta_1,\ldots,\Delta_{2r})$ built from ladder representations such that every $Q(\Delta_{2i+1},\Delta_{2i+2})$ is essentially Speh. Is every $\theta\in\mathcal{G}'$ endowed with a symplectic period?
