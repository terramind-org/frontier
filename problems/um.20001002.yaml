title: Scaled intertwining, time change, and lumpability for harmonic Markov maps
field: mathematics
tier: prose
statement: |-
  James Propp: “What is known about harmonic maps (in the sense of Baker and
  Norine [8], Cory [15], etc.) between Markov chains?” Matt Baker comments that
  Urakawa's paper [33], cited in the original article, already recognizes a
  connection with random walks, and that there is also a notion of harmonic
  maps for metric graphs.
