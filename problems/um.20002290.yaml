id: um.20002290
title: A positive-existential definition of nonzero rationals
field: mathematics
tier: prose
statement: |-
  **Question 6 (Koenigsmann).** Consider the language
  \(\mathcal O_2=\{0,1,+,P_2\}\), where \(P_2\) is the set of squares. Is every
  \(\exists\)-\(\mathcal O_2\)-definable set in \(\mathbb Q\) already
  \(\exists^+\)-\(\mathcal O_2\)-definable? Equivalently, are the following sets
  \(\exists^+\)-\(\mathcal O_2\)-definable?
  \[
  \{x\in\mathbb Q:x\ne0\},\qquad
  \{x\in\mathbb Q:(\forall y)(y^2\ne x)\}.
  \]
