title: Foliations and Diffeomorphism Groups — Question 35
field: mathematics
tier: prose
statement: |-
  One says that two commuting vector fields $(U,V)$ on $\tilde S$ are $\rho$-equivariant if
  for any $p$ and $\gamma\in\pi_1(S)$ one has
  \[ (U(\varphi(\gamma) (p)) , V(\varphi(\gamma)(p))= \rho(\gamma)(U(p),V(p)), \]
  where $A(U,V) =(aU+bV, cU+dV))$ if $A$ is the matrix
  $$\left(
  \begin{array}{cc}
  a & b\\
  c & d
  \end{array}
  \right).$$

  Characterize the representations $\rho$ for which any $\rho$-equivariant commuting vector fields $(U,V)$ have a common zero.
