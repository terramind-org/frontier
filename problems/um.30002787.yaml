statement: If $F_1,\ldots,F_r$ are forms in independent sets of variables, is their Waring rank additive, namely $\operatorname{rank}(F_1+\cdots+F_r)=\operatorname{rank}(F_1)+\cdots+\operatorname{rank}(F_r)$?
