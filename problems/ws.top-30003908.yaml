  \section{Almost Everywhere Regularity of Parametrized Stationary Varifolds}\label{30003908}
  {\small UnsolvedMath ID 30003908 · Partial Differential Equations}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For a general parametrized integer stationary $n$-varifold, does the singular set have zero $n$-dimensional Hausdorff measure without additional hypotheses?
  \par\smallskip\textit{Formulation references:} \sref{30003908}{1}, \sref{30003908}{2}.
  \subsection{Short English statement}
  For a general parametrized integer stationary $n$-varifold, does the singular set have zero $n$-dimensional Hausdorff measure without additional hypotheses?
