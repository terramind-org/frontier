title: Algebraic Fundamental Groups Below the Noether Line
field: mathematics
tier: prose
statement: If $S$ is a surface with $K_S^2<3\chi(S)$ and no irregular étale cover, is it true that, up to finitely many exceptions, $\pi_1^{\mathrm{alg}}(S)$ is a subgroup of $(\mathbb Z/2\mathbb Z)^2$?
