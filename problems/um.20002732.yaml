statement: "**$p$-indivisibility of $L(\\chi,0)$.** Fix a prime $p$. Let $q$ be a prime and let $\\chi$ be an odd character of $(\\mathbb Z/q\\mathbb Z)^\\times$. How often is $L(\\chi,0)$ indivisible by $p$?"
