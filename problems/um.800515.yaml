title: Linear Systems and Eigenvalue Problems — Problem 24
field: mathematics
tier: prose
statement: |-
  Let $Q$ be an orthonormal basis for a Krylov space for arbitrary $A\in{\mathbb{C}}^{n\times n}$ with random starting vector $b$. Is $\kappa_V(Q^*AQ)$ bounded (by a polynomial in $n$) with high probability? Or is ${\mathbb{E}}[\operatorname{area}\Lambda_\varepsilon(Q^*AQ)]$ (the expected value of the area in ${\mathbb{C}}$ of the $\varepsilon$-pseudospectrum) bounded by $\mathrm{poly}(n)\varepsilon^\beta$ for $\beta$ close to 2?
  (This problem is open even when $A$ is a circulant shift matrix.)
