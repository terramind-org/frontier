title: The one-point count for a plane cubic and the degree-nine log-BPS answer
field: mathematics
tier: prose
statement: |-
  Let $X \subset \mathbb{P}^2$ be a smooth plane cubic (elliptic curve).

  **Problem 3.1.** What is the number of degree-$d$ rational curves in $\mathbb{P}^2$ meeting $X$ at a single point (with multiplicity $3d$)? This is known for $d \leq 8$ by Takahashi, and even $d = 9$ would be new and interesting. One possible approach is to degenerate $X$ to a union of $3$ lines; is a tropical approach also possible?
