title: Kourovka Notebook Problem 18.58
field: mathematics
tier: prose
statement: |-
  Let $G$ be a group generated by finite number $n$ of involutions
  in which $(uv)^4=1$ for all involutions $u,v\in G$. Is it true
  that $G$ is finite? is a 2-group?
  This is true for $n\leq 3$.

  *Editors' comment of 2021*: the previously published claim
  of an affirmative solution of this problem proved to be erroneous.
