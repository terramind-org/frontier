title: Complete Invariance of Singular-Value Basins
field: mathematics
tier: prose
statement: If $f$ is entire and $D$ is an immediate basin containing all critical and asymptotic values of $f$, must $D$ be completely invariant? More generally, if a region $D$ contains all such values, must $f^{-1}(D)$ be connected?
