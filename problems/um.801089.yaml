title: "Henon Maps: Open Problems — Question 41"
field: mathematics
tier: prose
statement: |-
  Let $\mathrm{Tame}(3)$ be the subgroup of polynomial automorphisms of $\mathbb{C}^3$ which is generated by affine and triangular transformations.
  A theorem of Shestakov and Umirbaev [SU] states that $\mathrm{Tame}(3)$ is a strict subgroup
  of the full group of polynomial automorphisms of $\mathbb{C}^3$ (as opposed to the $2$-dimensional situation).
  A decisive progress on the structure of $\mathrm{Tame}(3)$ was recently
  made by Lamy and Przytycky [LP], who constructed a $\mathrm{CAT}(0)$-complex $\mathcal{C}$ over which $\mathrm{Tame}(3)$
  acts by isometries.

  Is it possible to characterize those $f\in \mathrm{Tame}(3)$ for which $\lambda(f)=1$ in terms of their action on $\mathcal{C}$?
