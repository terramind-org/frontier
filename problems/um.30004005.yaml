title: Fast Submodular Minimization for Represented Matroid Ranks
field: mathematics
tier: prose
statement: |-
  Let $r$ be the rank function of a matroid on ground set $V$, supplied by an explicit linear representation over a field, and let $z:V\to\mathbb R$. Can

  $$\min_{S\subseteq V}\bigl(r(S)-z(S)\bigr)$$

  be computed more efficiently by exploiting the representation?
