title: Empty Regions in the Biembeddability Poset
field: mathematics
tier: prose
statement: "In the poset of biembeddability classes of finitely generated subgroups of $\\operatorname{PL}_o(I)$, are all three of the following regions empty: elementary-amenable classes incomparable with $F$, non-elementary-amenable classes incomparable with $F$, and non-elementary-amenable subgroups of $F$ into which $F$ does not embed?"
