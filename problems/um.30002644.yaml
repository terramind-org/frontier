title: Diagrammatic and Geometric Maximality
field: mathematics
tier: prose
statement: For a sequence of knots or links $K_n$ with crossing number $c(K_n)\to\infty$, call it geometrically maximal if $\operatorname{vol}(K_n)/c(K_n)\to v_8$ and diagrammatically maximal if $2\pi\log\det(K_n)/c(K_n)\to v_8$, where $v_8$ is the volume of the regular ideal octahedron. Is every diagrammatically maximal sequence geometrically maximal, and conversely?
