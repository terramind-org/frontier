title: The Two-Dimensional Time-Bomb Conjecture
field: mathematics
tier: prose
statement: In the Time-Bomb game on $\mathbb Z^2$, the Angel moves at most one square per turn and the Devil names one position-time pair $(p,t)$ per turn; the Angel loses if its $t$-th move lands at a previously named $p$. Can the Angel survive forever?
