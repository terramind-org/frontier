title: Kernels of Completed Locally Nilpotent Derivations
field: mathematics
tier: prose
statement: Let $B$ be a factorial affine domain over $\mathbb{C}$, let $\delta$ be a locally nilpotent derivation of $B$, set $A=\ker(\delta)$, let $M$ be a maximal ideal of $B$, and set $m=M\cap A$. If $\delta$ extends to a derivation $\widehat{\delta}_M$ of the completion $\widehat{B}_M$ and $\ker(\delta_M)=A_m$ for the corresponding local derivation, is $\ker(\widehat{\delta}_M)=\widehat{A}_m$?
