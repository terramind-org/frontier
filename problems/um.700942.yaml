title: Kourovka Notebook Problem 13.24
field: mathematics
tier: prose
statement: |-
  Let $G$ be a non-discrete topological group with
  only finitely many ultrafilters that converge to the identity. Is
  it true that
  $G$ contains a countable open subgroup of exponent 2?

  *Comment of 2005:* This is proved for $G$
  countable (E. G. Zelenyuk, *Mat. Studii*, **7**
  (1997), 139--144).
