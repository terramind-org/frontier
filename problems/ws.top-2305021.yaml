  \item[\hypertarget{source:2305021:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 2305021 (AMR-022-5021). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:2305021:2}{S2}] W. K. Hayman and E. F. Lingham, Research Problems in Function Theory (2018), arXiv:1809.07200, Chapter 5, Problem 5.21, its update and the preceding shared notation. \url{https://arxiv.org/abs/1809.07200}.
  \end{description}
  \label{end:2305021}
