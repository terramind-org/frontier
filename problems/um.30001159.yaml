title: Spectral Rigidity of Unit-Area Riemannian Two-Spheres
field: mathematics
tier: prose
statement: Let $(M,g)$ be a unit-area Riemannian topological $2$-sphere, and let $\lambda_1(g)$ be its first nonzero Laplace eigenvalue. Is $(M,g)$ isometric to $(S^2,s g_0)$ for some positive conformal factor $s$ satisfying $\lVert s\rVert_{H^{-1}(S^2,g)}\leq C\lambda_1(g)$ for a universal constant $C$?
