title: Local-to-global gap criteria for exotic-order design
field: mathematics
tier: prose
statement: Engineering structures by carefully designing the interactions of the particles making up the system, is seldom straightforward and often requires trial and error, as unintended crystal structures might still be favored. It is not clear which clusters frustrate the formation of simple crystals and favor exotic order. This mechanism for stabilization and growth of exotic order has recently been explored with some success in a lattice gas model, and we will work to explore the possibility of this scenario in off-lattice models of real materials.
