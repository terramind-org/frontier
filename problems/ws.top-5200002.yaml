  \item[\hypertarget{source:statement:2}{S2}] M. Bialy, C. Fierobe, A. Glutsyuk, M. Levi, A. Plakhov and S. Tabachnikov, \emph{Open problems on billiards and geometric optics} (2021), arXiv:2110.10750v2, Misha Bialy, Problem 2, pp. 2--3. \url{https://arxiv.org/pdf/2110.10750v2}.
