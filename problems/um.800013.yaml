title: The Lyapin's Notebook — Problem 13
field: mathematics
tier: prose
statement: |-
  Let $K$ be a class of semigroups. For each natural number $n$, denote by $f_K(n)$ the minimal number of endomorphisms among all finite semigroups from $K$ having at least $n$ elements. The function $f_K(n)$ is called the *endomorphic function* of the class $K$. A class $K$ is called *endomorphic* if its endomorphic function is unbounded. In particular, we are interested in endomorphic varieties of semigroups. The following problems arise concerning endomorphic functions.

  (S. Kublanovsky)
  Describe endomorphic varieties of semigroups.\\
  Some sufficient conditions were obtained in [kubl].
