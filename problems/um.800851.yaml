title: Randomstrasse101 Open Problems (2025) — Conjecture 1
field: mathematics
tier: prose
statement: |-
  In [Bandyopadhyay2002-MUBs] it is shown that $\mathrm{MUB}(d)\leq d+1$ and that equality is achieved when $d$ is a prime power. For $d$ not a prime power, the problem of determining $\mathrm{MUB}(d)$ is still open. The smallest open instance is particularly well known for being a tantalizing open problem that has remained open (see Open Problem 6.2 in [Afonso10L42P]).

  Let $\mathrm{MUB}(d)$ denote the largest possible number of (simultaneously) mutually unbiased bases (MUBs) in $\mathbb{C}^d$. We have $\mathrm{MUB}(6)<7$.
