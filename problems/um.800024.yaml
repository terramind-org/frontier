title: The Lyapin's Notebook — Problem 25
field: mathematics
tier: prose
statement: |-
  In his book *Semigroups*, E.S. Lyapin emphasized that establishing connections between the properties of endomorphism semigroups and the properties of the underlying structured sets is one of the most important directions in semigroup theory. This direction may be viewed as a natural generalization of the ideas of Galois theory.

  (E.S. Lyapin)
  For natural classes of mathematical structures - such as ordered sets, relatively free algebras, and for subsemigroups of endomorphism semigroups of these structures - determine:

  - Subclasses of structures defined up to isomorphism by these semigroups;

  - Subsemigroups of endomorphism semigroups that determine these structures up to isomorphism.

  For various classes of partially ordered sets E.S. Lyapin found endomorphism semigroups that determine these classes up to isomorphism (see [Lyapin4], [L5], [L6]).
