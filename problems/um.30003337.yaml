title: Minimum Degree after Random Edge Percolation
field: mathematics
tier: prose
statement: Let $G$ have minimum degree $D$, retain each edge independently with probability $1/2$, and let $d$ be the largest minimum degree of a nonempty subgraph of the resulting random graph. How large must $d$ be in terms of $D$? In particular, is $d\geq D/3-o(D)$ for every $G$?
