title: Harmonic Test Inequalities Above the First Eigenvalue
field: mathematics
tier: prose
statement: For every bounded sufficiently smooth domain $\Omega\subset\mathbb{R}^m$ and every $\lambda>\lambda_1(\Omega)$, does there exist a harmonic function $h$ such that $\sum_{j=1}^{\infty}\frac{\lambda_j}{\lambda_j-\lambda}|\langle h,u_j\rangle|^2<0$, where the $u_j$ are Dirichlet eigenfunctions?
