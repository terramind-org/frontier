title: "Henon Maps: Open Problems — Conjecture 47"
field: mathematics
tier: prose
statement: |-
  Let $K$ be a number field, let $B\geq 1$, and let $d\geq 2$. Then as $f$ varies over generalized H\'{e}non maps of degree $d$ over $K$, the quantity
  \[\#\{P\in \operatorname{Per}(f):[K(P):K]\leq B\}\]
  is bounded just in terms of $[K:\mathbb{Q}]$, $d$, and $B$.
