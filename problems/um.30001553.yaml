title: Sharp Bounds for Alternating Involution Periods
field: mathematics
tier: prose
statement: For a morphic involution $\theta$ on $A^*$, with $\tau_\theta(w)$ the maximum length of a $\theta$-unbordered factor and $\pi_\theta^{\mathrm{alt}}(w)$ the shortest alternating $\theta$-period, what is the sharp relation between these quantities, analogous to the ordinary unbordered-factor and period relation?
