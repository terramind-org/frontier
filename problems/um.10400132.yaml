title: Problem 7.17 — (T.
field: mathematics
tier: prose
statement: (T. Ohtsuki) Give a “complex structure” to the set of 3- manifolds. More precisely, find an embedding (or, an immersi on) of the set of 3-manifolds to some complex variety such that its restric tion to the set {NK;(p,q)| p2 + q2 > >0} can be extended to a holomorphic map of the above mentioned complex parameter for any (hyperbolic) knot K in any 3-manifold N. We would expect some structures of the set of 3-manifolds suc h as mentioned in Problems 7.17 and Problem 10.16. Such structures would yiel d new viewpoints in the study of (the set of, and invariants of) 3-manifolds.
