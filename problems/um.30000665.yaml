title: Birational Asymmetry Between Representations and Their Duals
field: mathematics
tier: prose
statement: Over an algebraically closed field $k$ of characteristic zero, do there exist a connected semisimple algebraic group $G$ and a finite-dimensional algebraic $G$-module $V$ with trivial stabilizers in general position such that $V$ and its dual $V^*$ are not birationally $G$-isomorphic?
