title: A finite-total-curvature gate for unbounded negative cusps
field: mathematics
tier: prose
statement: Let \(M\) be a finite volume, complete, negatively curved manifold. Is the Liouville measure an equilibrium state? The case when the curvature is uniformly bounded below is known, so the case of curvature is unbounded is the remaining case.
