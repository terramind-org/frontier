title: Kourovka Notebook Problem 8.40
field: mathematics
tier: prose
statement: |-
  Describe the finite groups generated by a conjugacy
  class $D$ of involutions which satisfies the following property: if
  $a,b \in D$ and $|ab|=4$, then $[a,b] \in D$. This condition is
  satisfied, for example, in the case where $D$ is a conjugacy class of
  involutions of a known finite simple group such that $\left<
  C_D(a)\right>$ is a 2-group for every $a \in D$.
