title: Exponential intersection tails in three-dimensional slabs
field: mathematics
tier: prose
statement: For a subset $S=\{(n,f(n),g(n)):n\in\mathbb{N}\}\subset\mathbb{Z}^3$, characterize the conditions on $f$ and $g$ under which $S$ supports a probability measure on infinite paths with exponential intersection tails.
