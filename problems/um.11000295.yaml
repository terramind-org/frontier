title: Question 5.3 — Do the Morita classes generate all of the rational homology of Out(Fn)?
field: mathematics
tier: prose
statement: Do the Morita classes generate all of the rational homology of Out(Fn)? The maximum dimension of a Morita class is about 4 n/3. Morita’s cycles lift naturally to Aut(Fn), and again the first two are non-trivial in homology. By Galatius’ result, all of these cycles must eventually disappear under the stabilization map Aut( Fn)→ Aut(Fn+1). Conant and Vogtmann show that in fact they disappear immediately after they appear, i.e. one application of the stabilization map kills them [ 25]. If it is true that the Morita classes generate all of the rational homology of Out( Fn) then this implies that the stable range is significantly lower than the current bound. We note that Morita has identified several conjectural relationships between his cycles and various other interesting objects, including the image of the Johnson homomorphism, the group of homology cobordism classes of homology cylinders, and the motivic Lie algebra associated to the algebraic mapping class group (see Morita’s article in this volume). Since the stable rational homology of Out( Fn) is trivial, the natural maps from mapping class groups to Out( Fn) and from Out( Fn) to GL( n, Z) are of course zero. However, the unstable homology of all three classes of groups remains largely unkown and in the unstable range these maps might well be nontrivial. In particular, we note that H8(GL(6, Z); Q)∼= Q [30]; this leads naturally to the question 330 M. Bridson and K. Vogtmann
