field: mathematics
tier: prose
statement: |-
  a)
  Let $p$ be a prime greater than 3. Is it true that every finite
  group of exponent $p$ can be embedded in the commutator subgroup
  of a finite group of exponent $p$?

  [Archived solved part(s) of 5.56:]
  b)
  Does there exist a locally nilpotent group of prime exponent that
  coincides with its derived subgroup (and hence has no maximal
  subgroups)?
