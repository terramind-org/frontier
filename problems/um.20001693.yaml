title: Euler rigidity and handle-minimal cobordisms for positroid closure relations
field: mathematics
tier: prose
statement: For each positroid stratum of a Grassmannian, there is a Legendrian link whose augmentation variety is that stratum. Positroid strata are also ordered with respect to closure. Is this partial order recoverable on the Legendrian links in terms of topology, for instance by (decomposable) Lagrangian cobordisms? Could the difference in dimension be related to the minimal genus of the cobordisms?
