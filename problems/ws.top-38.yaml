title: The Köthe Conjecture
field: mathematics
tier: prose
statement: |-
  \section{The Köthe Conjecture}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $R$ be any associative ring; neither commutativity nor a multiplicative identity is assumed. A left ideal is an additive subgroup $J\le(R,+)$ with $RJ\subseteq J$; a right ideal has $JR\subseteq J$. A two-sided ideal satisfies both conditions. An element $x$ is nilpotent if $x^m=0$ for some integer $m\ge1$. An ideal is nil if every one of its elements is nilpotent; the exponent may depend on the element, so a nil ideal need not be a nilpotent ideal. \sref{statement}{2}
  \paragraph{Statement recorded in the supplied source.}
  For every associative ring $R$, is the following biconditional true?
  \[
   \begin{aligned}
   &R\text{ has no nonzero nil two-sided ideal}\\
   &\qquad\Longleftrightarrow
   R\text{ has no nonzero nil left ideal and no nonzero nil right ideal}.
   \end{aligned}
  \]
  The nontrivial implication asserts that the absence of nil two-sided ideals forces the absence of nil ideals on either side; the reverse implication is immediate. \sref{statement}{2}
  \subsection{Short English statement}
  Must a ring with no nonzero nil two-sided ideal also have no nonzero nil one-sided ideal? The question concerns arbitrary associative rings, including rings without an identity.
  \subsection{Sources}
