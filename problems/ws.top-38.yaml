  \item[\hypertarget{source:statement:2}{S2}] Peter Kálnai and Jan Žemlička, Self-Injective von Neumann Regular Rings and Köthe’s Conjecture, arXiv:1912.12159v2 (2020), opening paragraphs and definitions on page 1. \url{https://arxiv.org/pdf/1912.12159}.
  \end{description}
