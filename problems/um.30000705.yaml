id: um.30000705
title: Completely Invariant Julia Sets of Rational Semigroups
field: mathematics
tier: prose
statement: For a rational semigroup $G$, let $J(G)$ be its Julia set and let $E(G)$ be the smallest closed completely invariant subset of the Riemann sphere containing at least three points. If $G$ contains $f$ and $g$ with $J_f\neq J_g$ and $E(G)$ is not the whole sphere, must $E(G)$ be Möbius-equivalent to a line segment or circle? If $G$ is a polynomial semigroup, $J_h=J(G)$ for some $h\in G$, and $J(G)$ is not a line segment, must $J_f=J_g$ for all $f,g\in G$, and hence must $G$ be nearly abelian?
