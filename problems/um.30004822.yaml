title: Spectrahedrality Under the Eigenvalue-Set Transformation
field: mathematics
tier: prose
statement: Let $M\subseteq\mathbb R^n$ be invariant under coordinate permutations, let $\mathcal S^n$ be the space of real symmetric $n\times n$ matrices, and define $$\Lambda(M)=\{A\in\mathcal S^n:\lambda(A)\in M\},$$ where $\lambda(A)$ is the ordered eigenvalue vector of $A$. Is $M$ a spectrahedron if and only if $\Lambda(M)$ is a spectrahedron?
