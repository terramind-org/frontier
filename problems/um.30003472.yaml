id: um.30003472
title: Exponential Probability Gaps Between Random Order Types
field: mathematics
tier: prose
statement: For every probability measure $\mu$ on the plane that assigns measure zero to every line, do there exist order types $\omega_1(\mu)$ and $\omega_2(\mu)$ on $n$ points and an absolute constant $c>1$ such that a random independent $n$-point sample $X$ satisfies $$\Pr[X\text{ realizes }\omega_1(\mu)]>c^n\Pr[X\text{ realizes }\omega_2(\mu)]$$?
