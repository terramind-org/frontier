title: "Trace-norm matrix signing: positive case solved with sharp exponent"
field: mathematics
tier: prose
statement: |-
  Let \(\{a_j:j=1,\ldots,m\}\) be “(self-adjoint?, positive?)” \(n\times n\)
  matrices, each with trace norm less than \(\epsilon\ll1\), and put
  \(a=\sum_j a_j\), with \(\|a\|\le1\). “For starters” take every \(a_j>0\)
  and \(a=1\).
