title: Z-Stability of Elliott Classification Counterexamples
field: mathematics
tier: prose
statement: Are all nonelementary counterexamples to the Elliott classification conjecture $C^*$-algebras that do not absorb the Jiang–Su algebra $\mathcal Z$? Equivalently, for every such unital algebra $A$, does $\mathcal Z$ fail to embed unitally into $A_\omega\cap A'$?
