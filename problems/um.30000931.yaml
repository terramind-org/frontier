title: Levels and Thick Subcategories in Triangulated Categories
field: mathematics
tier: prose
statement: Given a class $\mathcal C$ of objects in a triangulated category $\mathcal T$ and an object $M$, how can one determine the level of $M$ with respect to $\mathcal C$? More modestly, how can one decide whether that level is finite, equivalently whether $M$ belongs to the thick subcategory generated by $\mathcal C$?
