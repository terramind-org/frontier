title: Diagonal Decomposition of Smooth Projective Varieties
field: mathematics
tier: prose
statement: For every smooth projective variety $X$ over a field, its diagonal class should decompose, modulo an adequate equivalence relation, into orthogonal projectors carrying respectively the even and odd Weil cohomology of $X$.
