title: A full toric Kummer image on projective space with an exact cyclotomic correlation
field: mathematics
tier: prose
statement: |-
  Generalizing: Can you find an example in higher dimensions?

  Find classes of examples of polynomials or rational maps \(d\geq3\) for which we can compute explicitly the arboreal Galois representation up to finite index over various fields.

  This sentence is not self-contained.

  It also suggests trying Stoll's techniques for \(x^p+c\). The archived section has no further introduction, so “generalizing” must at least carry forward the request for computable arboreal images. Since Problem 10.1 already varies the **degree** of a map of \(\mathbb P^1\), “higher dimensions” most naturally means a phase space of dimension greater than one. This is consistent with the official workshop report, where Joseph Silverman describes maps of \(\mathbb P^2\) as candidates for higher-dimensional arboreal representations.

  Several choices nevertheless remain unstated:

  * the phase space could be \(\mathbb P^r\), a product, an abelian variety, or a general quasiprojective variety;
  * a “preimage tree” is still a one-dimensional rooted graph, even when the phase space has dimension \(r>1\);
  * for an endomorphism of \(\mathbb P^r\), its algebraic degree and generic number of preimages differ: degree \(d\) gives topological degree \(d^r\);
  * “the expected group” could mean the full automorphism group of the regular preimage tree or the smaller group forced by algebraic structure.

  We preserve these distinctions and give an honest endomorphism of \(\mathbb P^r\), not merely a self-map written on a Cartesian product. Its image is computed exactly. It is maximal in the natural toric Kummer comparison group, although it has infinite index in the full tree automorphism group.
