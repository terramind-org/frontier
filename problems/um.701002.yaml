title: Kourovka Notebook Problem 14.17
field: mathematics
tier: prose
statement: |-
  Let $\mathrm{IMA}(G)$ denote the subgroup of the automorphism group
  $\mathrm{Aut }G$ consisting of all automorphisms that act trivially on the
  second derived quotient $G/G''$. Find generators and defining
  relations for
  $\mathrm{IMA}(F_n)$, where $F_n$ is a free group of rank $n\geq 3$.
