lean:
  module: FormalConjectures.OEIS.«53067»
  decl: OeisA53067.conjecture
  statement: |-
    theorem conjecture :
        conjecture.answer =
          if h : ∃ n, 2 < n ∧ (a n).Prime then
            some (sInf {n | 2 < n ∧ (a n).Prime})
          else
            none
  context:
    - open OeisA53067
    - open scoped Classical
  definitions:
    - name: OeisA53067.a
      kind: def
      text: |-
        /-- $a(n)$ is the concatenation of the next $n$ numbers. -/
        def a (n : ℕ) : ℕ :=
          if n = 0 then 0
          else
            let start_num : ℕ := triangular (n - 1) + 1
            let end_num : ℕ := triangular n
            let numbers_to_concat : List ℕ := List.Ico start_num (end_num + 1)
            numbers_to_concat.foldl concatenateNats 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/53067.lean#L41
