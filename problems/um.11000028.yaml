title: Problem 3.7 — (Distortion).
field: mathematics
tier: prose
statement: "(Distortion). Find the possible distortions of subgroups in Modg. In particular, compute the distortions of Ig. Determine the asymptotics of the distortion of Ig(k) as k→∞. Is there a subgroup H <Modg that has precisely polynomial distortion of degree d> 1? There are some known results on distortion of subgroups in Mod g. Convex cocompact sub- groups (in the sense of [ FMo]) have linear distortion in Mod g; there are many such examples where H is a free group. Abelian subgroups of Mod g have linear distortion (see [ FLMi]), as do subgroups corresponding to mapping class groups of subsurfaces (see [ MM2, Ham ]). I would guess that Ig has exponential distortion in Mod g. A first step to the question of how the distortion of Ig(k) in Mod g behaves as k→∞ would be to determine the distortion of Ig(k + 1) in Ig(k). The “higher Johnson homomorphisms” (see, e.g., [ Mo3]) might be useful here. A stronger notion than linear distortion is that of quasiconvexity. Let S = S−1 be a fixed generating set for a group Γ, and let π: S∗→ Γ be the natural surjective homomorphism from the free monoid on S to Γ sending a word to the group element it represents. Let σ: Γ →S∗ be a (perhaps multi-valued) section of π; that is, σ is just a choice of paths in Γ from the origin to each g∈ Γ. We say that a subgroup H <Γ is quasiconvex (with respect to σ) if there exists K >0 so that for each h∈ H, each path σ(h) lies in the K-neighborhood of H in Γ. Quasiconvexity is a well-known and basic notion in geometric group theory. It is easy to see that if H is quasiconvex with respect to some collection of quasigeodesics then H has linear distortion in Mod g (see [ F a1]). 2. Some problems on mapping class groups and moduli space 27"
