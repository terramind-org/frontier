title: Stable Banach Isometric Subspace Conjecture
field: mathematics
tier: prose
statement: Let $V$ be a real or complex $n$-dimensional normed space and $2\leq k<n$. If every pair of $k$-dimensional subspaces $E,E'\subset V$ satisfies $d_{\mathrm{BM}}(E,E')<1+\delta$, prove that $d_{\mathrm{BM}}(V,\ell_2^n)<1+\varepsilon(n,k,\delta)$ with $\varepsilon(n,k,\delta)\to 0$ as $\delta\to 0$.
