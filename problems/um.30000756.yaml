title: Simultaneous Real and $p$-Adic Algebraicity
field: mathematics
tier: prose
statement: Let $p$ be prime and let $(a_n)_{n\geq1}$ satisfy $a_n\in\{0,1,\ldots,p-1\}$. Define the real number $\alpha=\sum_{n\geq1}a_n/p^n$ and the $p$-adic number $\alpha_p=\sum_{n\geq1}a_np^n$. Prove that $\alpha$ and $\alpha_p$ are algebraic if and only if both are rational.
