title: Low-degree smoothness and a Wronskian kernel criterion for osculating Schubert curves
field: mathematics
tier: prose
statement: |-
  Let $E = H^0(\mathbb{P}^1, \mathcal{O}_{\mathbb{P}^1}(d))$, $n = d+1$, and $k = r+1$, so that linear series $g^r_d$ on $\mathbb{P}^1$ correspond to points of the Grassmannian $G = G(k, E)$ of dimension $N = k(n-k)$. For $x \in \mathbb{P}^1$, let $F_\bullet(x)$ be the complete osculating flag defined by order of vanishing at $x$. Given pairwise distinct real points $x_1, \ldots, x_s \in \mathbb{P}^1(\mathbb{R})$ and partitions $\lambda_i \subseteq k \times (n-k)$ satisfying $\sum_{i=1}^s |\lambda_i| = N - 1$, let
  $$
  S = S(\lambda_\bullet; x_\bullet) := \bigcap_{i=1}^s \Omega_{\lambda_i}(F_\bullet(x_i)) \subseteq G
  $$
  be the scheme-theoretic intersection of the corresponding Schubert varieties, which by the Eisenbud--Harris proper-intersection theorem is a projective Cohen--Macaulay curve (when nonempty) whose real locus is smooth.

  **Problem 10.4 (Levinson).** Is the entire complex curve $S_{\mathbb{C}}$ smooth? Equivalently, can $S$ have a conjugate pair of nonreal singular points even though every real point of $S$ is smooth?
