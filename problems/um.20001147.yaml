title: Even-pair skew partitions and a natural two-block localization theorem
field: mathematics
tier: prose
statement: |-
  **E.8 Even-Pair Skew-Partition.** An even-pair skew-partition is a partition of the vertex set of a graph \(G\) into four sets \(A,B,C,D\) such that \(A\) is complete to \(B\), \(C\) is anti-complete to \(D\), and any two non-adjacent vertices in \(A\) or \(B\) are an even pair.
  **Question 2.** Is even-pair skew-partition a composition?
  Contributed by Bruce Reed.
