title: Mean-Curvature Flow from Isolated Conical Singularities
field: mathematics
tier: prose
statement: Let $M_0\subset\mathbb R^{n+1}$ be a hypersurface with isolated point singularities modeled on regular hypercones, and let $(M_t)_{t\geq0}$ be a mean-curvature flow with initial data $M_0$. In dimensions $n\geq7$, does $M_t$ evolve by self-similar expansion asymptotically near each singular point and become smooth for a short positive time?
