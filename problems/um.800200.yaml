statement: Describe the general projective deformation of $S^{[2]}$, for $S$ a polarized K3 surface of genus $1$, $2$, $3$, ... (and for some choice of polarization on $S^{[2]}$); or at least find more examples of locally complete projective families. Same question with $S^{[r]}$ for $r\geq 3$.
