title: Open Problems in Integrable Systems — Argument shift method and Jordan-Kronecker invariants of Lie algebras
field: mathematics
tier: prose
statement: "Compute the Jordan--Kronecker invariants for the most interesting classes of Lie algebras, and particularly for the following {\\/\\rm(}a{\\/\\rm)} semidirect sums $\\mathfrak{g}+_{\\rho}V$, where $\\rho: \\mathfrak{g} \\rightarrow End(V)$ is a representation of a semisimple Lie algebra $\\mathfrak{g}$ and $V$ is assumed to be commutative; {\\/\\rm(}b{\\/\\rm)} Borel subalgebras of simple Lie algebras; {\\/\\rm(}c{\\/\\rm)} parabolic subalgebras of simple Lie algebras; {\\/\\rm(}d{\\/\\rm)} the centralisers of singular elements $a\\in\\mathfrak{g}$, where $\\mathfrak{g}$ is simple; {\\/\\rm(}e{\\/\\rm)} Lie algebras of small dimensions."
