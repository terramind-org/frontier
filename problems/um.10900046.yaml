title: 6.2 (Maher) — Random tetrahedron-gluing pseudomanifolds
field: mathematics
tier: prose
statement: Start with $n$ tetrahedra and glue their faces together at random. The vertex links need not be spheres but are essentially random triangulated surfaces; call the resulting space a pseudomanifold. Investigate the properties of these pseudomanifolds.
