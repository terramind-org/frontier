title: Relations Among Algebraic PL and Fourier Knot Degrees
field: mathematics
tier: prose
statement: For a knot $K$, establish inequalities in both directions among its algebraic, piecewise-linear, and Fourier degrees. Determine the extrema of their three pairwise quotients and whether those quotients have limits along sequences of knots with crossing number tending to infinity.
