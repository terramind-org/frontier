title: Foliations and Diffeomorphism Groups — Question 33
field: mathematics
tier: prose
statement: Consider a foliation $\mathcal{F}$ defined by a fibration with closed basis $B$ and fiber $F$ and $\pi_1(F)=\mathbb{Z}^k$. Under what hypothesis does any foliation $\mathcal{G}$ close to $\mathcal{F}$ have a compact leaf close to a fiber?
