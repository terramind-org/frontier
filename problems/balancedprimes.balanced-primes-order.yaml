lean:
  module: FormalConjectures.Wikipedia.BalancedPrimes
  decl: BalancedPrimes.balanced_primes_order
  statement: |-
    theorem balanced_primes_order :
        ∀ k > 0, {n : ℕ | k ≤ n ∧ 2 * k * Nat.nth Prime n = ∑ i ∈ .Ioc 0 k,
          ((n - i).nth Prime + (n + i).nth Prime)}.Infinite
