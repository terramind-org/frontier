title: A moment-free R-transform for an unbounded R-diagonal pair
field: mathematics
tier: prose
statement: |-
  **Q:** Can we make sense of the R-transform for \(x_1,x_2\) unbounded (power-series are insufficient to encode all the information)? Easier question is for infinitely divisible unbounded operators.

  **Q:** If \(c\) is unbounded R-diagonal, what is the R-transform of \(c,c^*\)?

  **0.11 Focus Group on Dirichlet Forms, from Classical to Quantum (day 5)**
