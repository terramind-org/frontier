title: Several Complex Variables Problem List — Problem 18
field: mathematics
tier: prose
statement: |-
  \ \ \
  Let $\Phi =\{ \Phi^0, \Phi^1, \Phi^2, \Phi^3\}$ be a subset of the body
  $(=skew-field) \ \mathbb{H}$ of the real quaternions with the conditions
  $$
  \Phi^p \bar\Phi^q + \Phi^q \bar\Phi^p = 2 \delta_{p,q},
  $$
  $\Omega$ is a domain in $\mathbb{R}^4=\mathbb{C}^2$. On the $\mathbb{H}$-bimodule $C^1(\Omega ;
  \mathbb{H})$ the operator
  $D_\Phi = \sum^3_{k=0} \Phi^k \frac \partial {\partial x_k} $
  defines the set of the $(left-\Phi)$-hyper-holomorphic functions
  $M_\Phi (\Omega ; \mathbb{H}) = Ker D_\Phi$.
  Let $\hat \Phi =\{ 1, i, j, -k\}$ with i, j, k being the ordinary imaginary
  units in $\mathbb{H}$. It is known that
  $$
  Hol (\Omega ; \mathbb{C}^2) \subset M_{\hat \Phi} (\Omega ; \mathbb{H}),
  $$
  where $Hol (\Omega ; \mathbb{C}^2)$ is the subset of all holomorphic (in the usual
  sense) mappings. 1) Describe the set of all hyper-holomorphic but non-holomorphic functions in
  $\Omega$ (it is not empty). 2) Describe "locations" of the sets $Hol$ and $M_\Phi Hol$ inside $M_\Phi$. 3) How do they depend on $\Omega$?

  -H. Shapiro and N. Vasilievsky, matemat@cinvesmx.bitnet
