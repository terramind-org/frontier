title: "Henon Maps: Open Problems — Question 14"
field: mathematics
tier: prose
statement: |-
  We say that $H_2$ has small cycles if for any neighborhood $U$ of the origin $\mathbf{s}ymbol{0}$ in $\mathbb{C}^2$, there exists a cycle of $H_2$ which is entirely contained in $U\smallsetminus \{\mathbf{s}ymbol{0}\}$.

  Does $H_2$ have small cycles?
