  definitions:
    - name: Green24.max013AffineTranslates
      kind: def
      text: |-
        /--
        The maximum number of $\lbrace 0,1,3 \rbrace$ affine translates that a set of size $n$ can
        contain.
        -/
        noncomputable def max013AffineTranslates (n : ℕ) : ℕ :=
          sSup { k |
            ∃ A : Finset ℤ,
              A.card = n ∧
              -- Iterate over (x,y) = (a, a + d) in A × A (x ≠ y), and check if a + 3d = x + 3(y - x) ∈ A
              k = ((A ×ˢ A).filter (fun (x, y) ↦ x ≠ y ∧ x + 3 * (y - x) ∈ A)).card
          }
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/GreensOpenProblems/24.lean#L37
