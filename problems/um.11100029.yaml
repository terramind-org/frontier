title: Applications 5 — Try to carry out Stolz's plan for metrics of positive Ricci curvature.
field: mathematics
tier: prose
statement: Try to carry out Stolz's plan for metrics of positive Ricci curvature. Here we expect the obstruction to lie in elliptic cohomology rather than K-theory, and the manifolds should be MO8 manifolds. But hardly anything is known here, I think.
