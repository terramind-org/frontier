title: Cartwright local matrices as link walks with potential
field: mathematics
tier: prose
statement: "(36) Lionel Levine: “The graph Laplacian is the generator of a random walk on a graph. Does the Laplacian of a simplicial complex generate some kind of stochastic process on this higher-dimensional object?” (a) Caroline Klivans: “Look up the work of Russel Lyons [24].” (b) Lionel Levine: “I have and it is interesting but not what I want.” (c) Andrea Sportiello: “Dustin Cartwright's model [13] looks more like a random walk with the way it assigns weights.” (d) Matt Baker: “So the concrete question is: does Dustin's model generate some stochastic process?”"
