lean:
  module: FormalConjectures.OEIS.«7918»
  decl: OeisA7918.conjecture1
  statement: |-
    theorem conjecture1 (n : ℕ) (hn : 0 < n) :
        a n = sInf { p0 : ℕ | ∃ d : ℕ, isApOfNPrimes n p0 d }
  context:
    - open OeisA7918
  definitions:
    - name: OeisA7918.a
      kind: def
      text: |-
        /-- Least prime $\ge n$ (version 1 of the "next prime" function). -/
        noncomputable def a (n : ℕ) : ℕ :=
          sInf { p : ℕ | p.Prime ∧ n ≤ p }
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/7918.lean#L33
    - name: OeisA7918.isApOfNPrimes
      kind: def
      text: |-
        /--
        The initial term $p_0$ and common difference $d$ form an arithmetic progression of
        length $n$ consisting entirely of prime numbers with $d > 0$.
        -/
        def isApOfNPrimes (n p0 d : ℕ) : Prop :=
          d > 0 ∧ ∀ k < n, (p0 + k * d).Prime
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/7918.lean#L69
