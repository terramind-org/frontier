title: Restriction Criteria for Endotrivial Modules
field: mathematics
tier: prose
statement: Let $S$ be a Sylow $p$-subgroup of a finite group $G$ and define $\rho_1(Q)=N_G(Q)'$ and $\rho_i(Q)=\langle N_G(Q)\cap\rho_{i-1}(R):1\ne R\subseteq S\rangle$, with $\rho^\infty(S)=\bigcup_i\rho_i(S)$. The conjecture is that a one-dimensional $kN_G(S)$-module $L$ is the restriction, modulo projectives, of an endo-trivial $kG$-module if and only if $\rho^\infty(S)\subseteq\ker L$; equivalently, the image of $K(G)\to K(N_G(S))$ is the dual of $N_G(S)/\rho^\infty(S)$.
