title: Several Complex Variables Problem List — Problem 7
field: mathematics
tier: prose
statement: |-
  If D is a strictly pseudoconvex domain in $\mathbb{C}^2$ diffeomorphic to $\mathbb{R}^4$ and A is an embedded
  analytic disc outside D with $bA \subset bD$, then there is an embedded smooth disc
  M in D, with bM=bA, and such that M is totally real except at
  one elliptic point. With such a configuration
  (M,A) in $\mathbb{C}^2$, does it follow that the envelope of holomorphy of
  M contains A ?\\
  -F. Forstneric, forstner@math.wisc.edu
