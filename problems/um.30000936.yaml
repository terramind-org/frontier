title: Integral Zeros and Counting for Polynomial Forms
field: mathematics
tier: prose
statement: For a form $F\in\mathbb{Z}[x_1,\ldots,x_n]$ of degree $d$, when does $F$ have a nontrivial zero in $\mathbb{Z}^n$? How does $N(B)=|\{x\in\mathbb{Z}^n:F(x)=0,\ \max_i|x_i|\leq B\}|$ behave as $B\to\infty$, especially for nonsingular cubic and quartic forms beyond diagonal or high-dimensional cases?
