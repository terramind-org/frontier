title: 3.8 (Agol) — Twisted homology products after cutting along a surface
field: mathematics
tier: prose
statement: Let $M$ be a $3$-manifold, let $\phi:\pi_1M\to\mathbb{Z}$ be dual to $(\Sigma,\partial\Sigma)\subset(M,\partial M)$, and let $N$ be obtained by cutting $M$ along $\Sigma$. For which $\alpha\in\operatorname{Hom}(\pi_1M,SL_2(\mathbb{C}))$ is $N$ an $\alpha$-twisted homology product?
