title: Uniform critical-exponent control under quasiconformal deformation
field: mathematics
tier: prose
statement: |-
  **Problem 4.5 (F. Guéritaud).** Can we have a quasiconformal deformation of \(\Gamma _0\) which bend a variation of \(\delta(\Gamma _n)\) independent of \(n\)?

  The printed source says, verbatim (apart from typographical spacing),

  The string “5. The intended mathematical verb cannot be recovered with confidence. The immediately preceding text supplies the setting: \(\Gamma _0\) is an infinitely generated Fuchsian group of the first kind, and \(\Gamma _n\) is the subgroup carried by the \(n\)-ball in \(\mathbb H^2/\Gamma _0\). Problem 4.4 asks whether \(\delta(\Gamma _n)\to\delta(\Gamma _0)\).

  I therefore keep the source wording visible and separate three plausible readings:

  1. **uniform-bound reading:** “bend” is a typo for “bound,” and one asks for a bound on the finite change \(\delta(\Gamma_n')-\delta(\Gamma_n)\) whose constant is independent of \(n\);
  2. **infinitesimal reading:** one asks for first-variation bounds for \(\frac d{dt}\delta(\Gamma_n(t))\) independent of \(n\);
  3. **exact-equality reading:** one asks for a deformation for which \(\delta(\Gamma_n(t))-\delta(\Gamma_n(0))\) is literally the same function of \(t\) for every \(n\).

  The first reading admits an explicit answer, and a natural asymptotic form of “independent of \(n\)” admits a positive answer along compact deformation families. The second has a conditional almost-everywhere answer. The third is much stronger and is obstructed by invariant elementary stages. Because the original intended reading remains unresolved, the result is classified as conditional rather than as a solution of the printed problem.
