title: Counting Integer Matrices with Fixed Characteristic Polynomial
field: mathematics
tier: prose
statement: Let $R_n(H;f)$ count the integer $n\times n$ matrices of height at most $H$ with characteristic polynomial $f$. Uniformly over $f$, is $R_n(H;f)\leq H^{n(n-1)/2+o(1)}$ as $H\to\infty$?
