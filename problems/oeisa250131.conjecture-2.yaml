lean:
  module: FormalConjectures.OEIS.«250131»
  decl: OeisA250131.conjecture_2
  statement: "theorem conjecture_2 : b '' sievedIndices = {p : ℕ | p.Prime}"
  context:
    - open OeisA250131
    - open Nat
  definitions:
    - name: OeisA250131.b
      kind: def
      text: |-
        /-- Auxiliary sequence $b(n)$ related to A250131: $b(1)=2$, $b(2)=3$, and $b(n)=a(n-2)$ for
        $n \ge 3$. -/
        def b (n : ℕ) : ℕ :=
          match n with
          | 0 => 0
          | 1 => 2
          | 2 => 3
          | n' + 3 => a (n' + 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/250131.lean#L58
    - name: OeisA250131.sievedIndices
      kind: def
      text: |-
        /-- The set of indices $n \ge 1$ such that $b(n) \ne 1$ and $b(n)$ is not a multiple of any $b(k)$
        for $1 \le k < n$ where $b(k) \ne 1$. This formalizes the Eratosthenes-like sieve applied to $b(n)$
        after removing $1$s. -/
        def sievedIndices : Set ℕ :=
          { n | 1 ≤ n ∧ b n ≠ 1 ∧ ∀ k, (1 ≤ k ∧ k < n ∧ b k ≠ 1) → ¬ (b k ∣ b n) }
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/250131.lean#L67
