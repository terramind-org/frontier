title: Kourovka Notebook Problem 14.100
field: mathematics
tier: prose
statement: |-
  Is it true that in a Shunkov group
  (i. e. conjugately biprimitively finite group, see 6.59) having
  infinitely many elements of finite order every element of prime
  order is contained in some infinite locally finite subgroup? This
  is true under the additional condition that any two conjugates of
  this element generate a soluble subgroup (V. P. Shunkov, *$M_p$-groups*, Moscow, Nauka, 1990 (Russian)).
