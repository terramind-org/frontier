title: Safe edge deletion, modular unichord certificates, and the 3-core
field: mathematics
tier: prose
statement: |-
  **Conjecture 2 (Conforti, Rao).** In every balanced graph, there exists an edge that can be deleted, so that the resulting graph remains balanced.

  Hence, \(G(k,m)-e\) is still balanced for any edge \(e\), in agreement with
  Conjecture 2 from the section "Balanced Graphs".
