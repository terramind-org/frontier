statement: |-
  \section*{The exact low-temperature transfer gap of the planar O(4) model}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For the nearest-neighbor two-dimensional O(4) lattice model and its full transfer-gap mass $m_lat(\beta )$, is $lim_{\beta \to \infty }$ exp(pi $\beta )m_lat(\beta )/\operatorname{sqrt}(\beta )=32$ $\exp (\pi /4-1/2)$?
  \subsection{Short English statement}
  For the nearest-neighbor two-dimensional O(4) lattice model and its full transfer-gap mass $m_lat(\beta )$, is $lim_{\beta \to \infty }$ exp(pi $\beta )m_lat(\beta )/\operatorname{sqrt}(\beta )=32$ $\exp (\pi /4-1/2)$?
