schema: 1
id: cramerconjecture.cramer-conjecture.variants.granville
title: "Cramér's Conjecture on Prime Gaps (variant: granville)"
field: mathematics
tier: proof
statement: |-
  **Cramér–Granville Conjecture** [Gr95]: $\limsup_{n \to \infty} g_n / (\log p_n)^2 \ge
  2 e^{-\gamma}$, stated without conditional `ℝ`-suprema as infinitely many $n$ satisfying
  $\operatorname{cramerRatio}(n) \ge c$ for each $c < 2 e^{-\gamma}$ (contradicting
  `limsup_eq_one` and `strict_bound`).
ams:
  - 11
tags:
  - wikipedia
  - variant
references:
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Cram%C3%A9r%27s_conjecture
