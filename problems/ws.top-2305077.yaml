statement: |-
  \section{Research Problems in Function Theory — Problem 5.77}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $\mathbb D=\{z\in\mathbb C:|z|<1\}$ and $\mathbb T=\partial\mathbb D$. The disc algebra $A(\overline{\mathbb D})$ consists of the functions continuous on $\overline{\mathbb D}$ and analytic in $\mathbb D$. A univalent function means an injective analytic function. Let $m:[0,2\pi)\to\mathbb C$ be an arbitrary Lebesgue-measurable function.
  \paragraph{Statement recorded in the supplied source.}
  Does every such $m$ occur as \[\lim_{r\uparrow1}f^{\prime}(re^{i\theta})=m(\theta)\quad\text{for almost every }\theta\] for some $f\in A(\overline{\mathbb D})$ that is univalent on $\mathbb D$? \sref{statement}{2}
  \subsection{Short English statement}
  Can every measurable complex boundary function be realized almost everywhere as the radial limit of the derivative of a univalent disc-algebra function?
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Walter K. Hayman and Edward F. Lingham, \emph{Research Problems in Function Theory} (2018), arXiv:1809.07200. Problem 5.77, complete original question, all following updates, and the relevant chapter definitions. \url{https://arxiv.org/abs/1809.07200}.
  \end{description}
