title: $p$-Adic Definability Rings with Finite Additive Descriptions
field: mathematics
tier: prose
statement: For a prime $p$, with $\gamma_p(x)=p^{-1}(x^p-x)/((x^p-x)^2-1)$ and $\Gamma_p(\mathbb Q)=\{a(1+pb)^{-1}:a,b\in\mathbb Z_{(p)}[\gamma_p(\mathbb Q)]\}$, does there exist $n_p$ such that $\Gamma_p(\mathbb Q)=\{a(1+pb)^{-1}:a,b\in\sum_{i=1}^{n_p}\gamma_p(\mathbb Q)\}$?
