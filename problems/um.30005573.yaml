title: Nontriviality of Heegner-Point Kolyvagin Systems
field: mathematics
tier: prose
statement: For an elliptic curve $E/\mathbb Q$, an odd prime $p$ of good ordinary reduction, and an admissible imaginary quadratic field $K$, is the Kolyvagin system $\{\kappa_n\}_{n\in\mathcal N}$ derived from Heegner points nontrivial; equivalently, does $\kappa_n\neq0$ for some square-free product $n$ of admissible inert primes?
