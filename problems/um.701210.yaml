title: Kourovka Notebook Problem 16.18
field: mathematics
tier: prose
statement: |-
  Does there exist a linearly orderable soluble
  group of derived length exactly $n$ that has a single proper
  normal relatively convex subgroup

  a) for $n=3$?

  b) for $n > 4$?

  Such groups do exist for $ n=2$ and for
  $n=4$.
