statement: |-
  \section*{The one-sixth free-energy fluctuation exponent in low-temperature SK}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each fixed $\beta >1$ in Gaussian zero-field SK, are $sd(F_n)=n^(1/6+o(1))$ and $Var(F_n)=n^(1/3+o(1))$? Require additionally that $|F_n-E$ $F_n|$ lies between $n^{1/6-\eta }$ and $n^{1/6+\eta }$ with probability tending to one for every $\eta >0$.
  \subsection{Short English statement}
  For each fixed $\beta >1$ in Gaussian zero-field SK, are $sd(F_n)=n^(1/6+o(1))$ and $Var(F_n)=n^(1/3+o(1))$? Require additionally that $|F_n-E$ $F_n|$ lies between $n^{1/6-\eta }$ and $n^{1/6+\eta }$ with probability tending to one for every $\eta >0$.
