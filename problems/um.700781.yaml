title: Kourovka Notebook Problem 11.89
field: mathematics
tier: prose
statement: |-
  Let $k$ be an infinite
  cardinal number. Describe the epimorphic images of the Cartesian
  power $\prod\limits_{k}{\mathbb{Z}$ of the group ${\mathbb{Z}$ of
  integers. Such a description is known for $k=\omega _0$
  (R. Nunke, *Acta Sci. Math. (Szeged)*, **23** (1963),
  67--73).
