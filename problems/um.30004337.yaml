title: Pointwise Equidistribution Under Toral Endomorphisms with Fewer Hypotheses
field: mathematics
tier: prose
statement: Let $A$ and $B$ be nonsingular integer matrices and let $\mu$ be an $A$-invariant ergodic probability measure on $\mathbb{T}^d$ with positive entropy, satisfying irreducibility of every characteristic polynomial of $B^n$ and with no power of $B$ conjugate to a power of $A$. Are additional hypotheses such as (3a)–(3c) unnecessary for almost-everywhere pointwise equidistribution under $B$?
