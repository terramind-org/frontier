  % UnsolvedMath ID 3188; source catalogue code OPG-46583
  \setcounter{section}{3187}
  \section{Decomposing a connected graph into paths.}\label{3188}
  {\small\sffamily UnsolvedMath ID 3188 · Graph Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For a finite simple graph $G$, a path is a sequence of distinct vertices with edges between consecutive vertices. A path decomposition is a partition of $E(G)$ into edge sets of paths; vertices may occur in different paths. Write $n=|V(G)|$.
  \paragraph{Statement recorded in the supplied source.}
  Does every connected graph $G$ admit a path decomposition with at most \[\left\lfloor\frac{n+1}{2}\right\rfloor=\left\lceil\frac n2\right\rceil\] paths? \sref{3188}{2}
  \subsection{Short English statement}
  Can the edges of every connected graph be partitioned into at most half its order rounded up paths?
