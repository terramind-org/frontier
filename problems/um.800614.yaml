title: Selection Principles in Mathematics — Problem 42 ([BZSPM])
field: mathematics
tier: prose
statement: |-
  If $G$ is *analytic* and does not satisfy $\mathsf{S}_1(\Omega_{\mathrm{nbd}},\Gamma)$, then
  $G^2$ does not satisfy $\mathsf{S}_{\mathrm{fin}}(\mathcal{O}_{\mathrm{nbd}},\mathcal{O})$. Thus,
  for analytic groups, $\mathsf{S}_1(\Omega_{\mathrm{nbd}},\Gamma)=\mathsf{S}_1(\Omega_{\mathrm{nbd}},\Omega)$ [BZSPM].
  Moreover, for analytic *abelian* groups, $\mathsf{S}_{\mathrm{fin}}(\mathcal{O}_{\mathrm{nbd}},\mathcal{O})=\mathsf{S}_1(\Omega_{\mathrm{nbd}},\Gamma)$ [BZSPM].
  For general analytic groups this is open.

  Is there an analytic group satisfying $\mathsf{S}_{\mathrm{fin}}(\mathcal{O}_{\mathrm{nbd}},\mathcal{O})$ but not $\mathsf{S}_1(\Omega_{\mathrm{nbd}},\Gamma)$?
