title: Radiality and Liouville Properties for Critical Elliptic Operators
field: mathematics
tier: prose
statement: For Pucci's maximal uniformly elliptic operator $\mathcal{M}^+_{\lambda,\Lambda}$ and its critical exponent $p^*$, is every nonnegative $C^2$ solution of $\mathcal{M}^+_{\lambda,\Lambda}(D^2u)+u^{p^*}=0$ on $\mathbb{R}^N$ radial? For $1<p<p^*$, is every nonnegative entire solution identically zero?
