lean:
  module: FormalConjectures.Other.Rule30
  decl: Rule30.centerColumn_not_eventually_periodic
  statement: |-
    theorem centerColumn_not_eventually_periodic :
        ¬ ∃ p : ℕ, 0 < p ∧ ∃ N : ℕ, ∀ t : ℕ, N ≤ t → centerColumn (t + p) = centerColumn t
