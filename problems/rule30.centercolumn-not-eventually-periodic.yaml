lean:
  module: FormalConjectures.Other.Rule30
  decl: Rule30.centerColumn_not_eventually_periodic
  statement: |-
    theorem centerColumn_not_eventually_periodic :
        ¬ ∃ p : ℕ, 0 < p ∧ ∃ N : ℕ, ∀ t : ℕ, N ≤ t → centerColumn (t + p) = centerColumn t
  context:
    - open Rule30
  definitions:
    - name: Rule30.centerColumn
      kind: def
      text: |-
        /-- The **center column** of Rule 30: the value of the single central cell (position $0$)
        at time $t$. -/
        def centerColumn (t : ℕ) : Bool := state t 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Other/Rule30.lean#L64
