statement: Given a homomorphism of dual groups $\xi:\widehat H\to\widehat G$, construct the predicted transfer $\xi_*:\operatorname{AutRep}(H)\to\operatorname{AutRep}(G)$ satisfying $L(s,\xi_*(\pi),\tau)=L(s,\pi,\tau\circ\xi)$ for every finite-dimensional representation $\tau$ of $\widehat G$.
