title: Kourovka Notebook Problem 15.8
field: mathematics
tier: prose
statement: |-
  b) Let $G$ be any Lie group (indeed, any separable continuous
  group) made discrete: can $G$ act faithfully on a countable set?

  *Comment of 2021*:
  an affirmative answer was obtained for the nilpotent case (N. Monod, *J. Group Theory*, **25**, no. 5 (2022), 851--865).
  *Comment of 2025*:
  this problem is reduced to the case of simple Lie groups; in particular, the
  solvable case is settled (A. Conversano, N. Monod, *J. Algebra*, **640** (2024), 106--116).

  [Archived solved part(s) of 15.8:]
  a)
  (S. M. Ulam). Consider the usual compact group $SO(3)$ of all
  rotations of a
  3-dimensional Euclidean space, and let $G$ denote this group viewed
  as a discrete group. Can $G$ act non-trivially on a countable
  set?
