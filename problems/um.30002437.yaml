title: Subpolynomial Bounds for an Additive Multiplicative Equation
field: mathematics
tier: prose
statement: Let $SP(n)$ be the number of positive-integer solutions to $abc+a+b+c=n$. For every $\varepsilon>0$, does there exist $C(\varepsilon)$ such that $SP(n)<C(\varepsilon)n^\varepsilon$ for all $n$?
