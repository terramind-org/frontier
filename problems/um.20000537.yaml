title: Near-sharp trilinear convolution range on transverse patches of the 3-sphere
field: mathematics
tier: prose
statement: |-
  **Question 10 (Bez).** Let \(S_1,S_2,S_3\) be transversal patches of the unit
  sphere \(\mathbb S^3\) in \(\mathbb R^4\). Let
  \(\sigma_1,\sigma_2,\sigma_3\) be the surface measures, respectively. Determine
  the full range of exponents \(p,q>0\) such that
  \[
  \|g_1d\sigma_1*g_2d\sigma_2*g_3d\sigma_3\|_q
  \lesssim \prod_{j=1}^3\|g_j\|_p. \tag{0.12}
  \]
