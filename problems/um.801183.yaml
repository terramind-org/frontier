title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 10: Combinatorial interpretation of Kronecker product coefficients of symmetric group characters"
field: mathematics
tier: prose
statement: Let $\chi^\lambda$ and $\chi^\mu$ be irreducible characters of the symmetric group $S_n$ indexed by partitions $\lambda,\mu\vdash n$, and let $g_{\lambda\mu\nu} = \langle \chi^\lambda \chi^\mu, \chi^\nu\rangle$ be the Kronecker product coefficients, equivalently defined by $\prod_{i,j,k}(1-x_i y_j z_k)^{-1} = \sum_{\lambda,\mu,\nu} g_{\lambda\mu\nu} s_\lambda(x)s_\mu(y)s_\nu(z)$. Find a positive combinatorial interpretation of the Kronecker coefficients $g_{\lambda\mu\nu}$, thereby combinatorially reproving that they are nonnegative.
