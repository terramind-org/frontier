title: Logarithmic positivity and a two-point configuration-space test
field: mathematics
tier: prose
statement: |-
  **Problem 2.2 (Viehweg).** Let \(U\) be a smooth variety, étale over a moduli stack of polarized manifolds \(M_H\). Let \(Y\) be a log compactification of \(U\) and \(\Gamma=Y\setminus U\).

  1. Is \(\Omega_Y^1(\log \Gamma)\) weakly positive with respect to \(U\)?
  2. Is \(\omega_Y(\Gamma)\) ample with respect to \(U\)?

  Both of these statements are known for period domains, and it is known that the second implies the first. These problems may be hard, but similar questions would be interesting and perhaps more tractable for configuration spaces.
