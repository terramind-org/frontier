title: Question 2.1 — Do mapping class groups or Out(Fn) satisfy the Baum-Connes conjecture?
field: mathematics
tier: prose
statement: "Do mapping class groups or Out(Fn) satisfy the Baum-Connes conjecture? Does Out(Fn) satisfy the Novikov conjecture? An approach to proving these conjectures is given by work of Rosenthal [ 75], generalizing results of Carlsson and Pedersen [ 23]. A contractible space on which a group Γ acts properly and for which the fixed point sets of finite subgroups are contractible is called an EΓ. Rosenthal’s theorem says that the Baum-Connes map for Γ is split injective if there is a cocompact EΓ = E that admits a compactification X, such that (1) the Γ-action extends to X; (2) X is metrizable; (3) XG is contractible for every finite subgroup G of Γ (4) EG is dense in XG for every finite subgroup G of Γ (5) compact subsets of E become small near Y = X ∖E under the Γ-action: for every compact K⊂E and every neighborhood U⊂X of y∈Y, there exists a neighborhood V ⊂X of y such that γK∩V ̸=∅ implies γK⊂U. The existence of such a space E also implies the Novikov conjecture for Γ. For Out(Fn) the spine of Outer space mentioned in the previous section is a reasonable can- didate for the required EΓ, and there is a similarly defined candidate for Aut( Fn). For mapping class groups of punctured surfaces the complex of arc systems which fill up the surface is a good candidate (note that this can be identified with a subcomplex of Outer space, as in [ 47], section 5)."
