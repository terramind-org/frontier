id: um.3000078
title: Skew-supermodular colouring with two class sizes
field: mathematics
tier: prose
statement: "Let $p_1$ and $p_2$ be integer skew-supermodular set functions on ground set S such that $\\max\\{p_1(X),p_2(X)\\}\\leq \\min\\{|X|,k\\}$ for every $X \\subseteq S$, and let $m_1,m_2,n_1,n_2$ be positive integers such that $m_1 n_1+m_2 n_2=|S|$. Can we decide in polynomial time if there is a partition ${\\mathcal P}$ of S with $m_1$ classes of size $n_1$ and $m_2$ classes of size $n_2$, such that $|\\{Y \\in {\\mathcal P}: Y \\cap X \\neq \\emptyset\\}| \\geq \\max\\{p_1(X), p_2(X)\\}$ for every $X \\subseteq S$?"
