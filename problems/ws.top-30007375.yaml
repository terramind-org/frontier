title: Universal gap and force exponents at negative spherical-perceptron jamming
field: mathematics
tier: prose
statement: |-
  \section*{Universal gap and force exponents at negative spherical-perceptron jamming}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For the negative-margin spherical perceptron at margin $-1$ and the small coordinate-mixture laws $\nu _\epsilon $ specified in the source, is there one satisfiability threshold $\alpha _c$ independent of epsilon, with the stated ordered critical limits for positive gaps and normalized contact forces? Ask for a force law of mean one without an atom at zero and exponents gamma,theta satisfying $\gamma =1/(2+\theta )$, $0.4126930<\gamma <0.4126934$, $0.4231063<\theta <0.4231088$, with $G_J(u)=u^(1-\gamma +o(1))$ and $F_J(s)=s^(1+\theta +o(1))$.
  \subsection{Short English statement}
  For the negative-margin spherical perceptron at margin $-1$ and the small coordinate-mixture laws $\nu _\epsilon $ specified in the source, is there one satisfiability threshold $\alpha _c$ independent of epsilon, with the stated ordered critical limits for positive gaps and normalized contact forces? Ask for a force law of mean one without an atom at zero and exponents gamma,theta satisfying $\gamma =1/(2+\theta )$, $0.4126930<\gamma <0.4126934$, $0.4231063<\theta <0.4231088$, with $G_J(u)=u^(1-\gamma +o(1))$ and $F_J(s)=s^(1+\theta +o(1))$.
