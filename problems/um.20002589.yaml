title: A uniform-in-q product-chain cutoff and the Potts lower-bound gap
field: mathematics
tier: prose
statement: |-
  **Universal lower bound for Potts.** Consider the \(q\)-Potts model or
  uniform \(q\) proper colorings on a general graph \(G\). Is there a
  universal \(\asymp n\log n\) lower bound on the mixing time uniform in the
  temperature? Is there always an \(n\log n/2\) lower bound?
