title: Idempotent geometry and the ideal--congruence divide
field: mathematics
tier: prose
statement: |-
  The record is item A.12, “Idempotent geometry,” contributed by G. L. Litvinov in cooperation with G. B. Shpiz to the AIM workshop list *Amoebas and tropical geometry*. The source asks a six-part foundational program:

  1. Can algebraic geometry be constructed over a class of algebraically closed idempotent semifields, beyond only tropical semifields?
  2. Can one define abstract, rather than only affine or projective, varieties over tropical and idempotent semifields?
  3. Can regular functions and regular maps be defined so as to obtain a natural category of affine varieties and a correspondence with idempotent semirings of functions?
  4. Can equations and ideals be defined so that points and subvarieties correspond to suitable analogues of ideals?
  5. What should prime ideals, irreducible varieties, and decomposition into irreducible components mean?
  6. Can dequantization produce a natural correspondence, perhaps a functor or “almost functor,” from traditional algebraic varieties to tropical varieties?

  This is a recovered statement, not a single yes/no theorem. The isolated “8” is the PDF page number, not mathematics.
