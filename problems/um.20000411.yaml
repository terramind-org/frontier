title: A dihedral projector test for explicit exotic divisor classes
field: mathematics
tier: prose
statement: "2. (D. Ramakrishnan) Let X be a Hilbert modular surface over Q. All of the Tate classes that arise from modular curves on X are defined over Qab; however, there also exist Tate classes which are algebraic, but not defined over Qab. (In fact, they are defined over dihedral extensions of Q.) We know the algebraicity of these classes, but do not know specific representatives. Comments: 1) One possible suggestion for such representatives could be non-congruence curves on X. (D. Ramakrishnan) 2) If we can find representatives, we can intersect them with the modular curves: this may be a way to find interesting non-Heegner points on the modular curves. (D. Ramakrishnan)"
