title: Question 3.3 — LetG∼=π1(S2g)→ Γg be the injection given by Theorem 3.1.
field: mathematics
tier: prose
statement: "LetG∼=π1(S2g)→ Γg be the injection given by Theorem 3.1. Consider ∂∞(G) which can be canonically identified with the circle at infinity of the universal cover ˜S2g∼= H2 of S2g. Does there exist a continuous G-equivariant map ∂∞(G)→ PML0(Σ)? 3.5. In the context of 3-manifold topology, given an essential surface Σ in a finite volume hyperbolic 3-manifold M, a natural question is whether there is a finite cover of M to which Σ lifts to an embedded surface. A group theoretic property that is closely related to this question is LERF, which now define. If Γ is a group, and H a subgroup of Γ, then Γ is called H-separable if for every g∈G\\H, there is a subgroup K of finite index in Γ such that H⊂K but g /∈K. Γ is called LERF or subgroup separable if Γ is H-separable for all finitely generated subgroups H. This has been widely studied in the setting of low-dimensional topology (see [ 1] and [ 36] for example). Indeed, it is often the case that one does not need the full power of LERF for applications to hyperbolic manifolds, separating geometrically finite subgroups often suﬃces; this led to the property of GFERF, that is separable on all geometrically finite subgroups. 280 A.W. Reid Now it is known that the groups Γ g are not LERF whenever g≥ 2 since they contain F2×F2, however in analogy with the case for hyperbolic manifolds we pose (for g = 1 it is known that Γ 1 is LERF since it is virtually free):"
