title: Critical-Exponent Geometry of Negatively Pinched Hadamard Quotients
field: mathematics
tier: prose
statement: Let $\Gamma$ be a finitely generated discrete isometry group of a Hadamard manifold $X$ with $-b^2\leq K_X\leq-1$ and critical exponent $\delta_\Gamma\leq2$. Must $X/\Gamma$ have finitely many cusps and bounded orders of torsion elements in $\Gamma$? Also, do there exist four-dimensional examples $(X_k,\Gamma_k)$ with $\delta_{\Gamma_k}\to2$ from above and $b_k\to1$?
