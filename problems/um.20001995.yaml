title: Exactness and topology in the higher-genus adiabatic limit
field: mathematics
tier: prose
statement: '**A.13 Moduli space of holomorphic polygons.** Background: In the paper with Fukaya "Zero loop open strings in the cotangent bundle and Morse homotopy", Asian J. Math. 1 (1997), 96--180, we proved that "The moduli space of holomorphic polygons with boundary lying on k-tuples of La-grangian graphs of k-Morse functions is diffeomorphic to that of graph flows of the Morse functions in the adiabatic limit or (in the large complex structure limit). The projections, near the limit, of the holomorphic polygons on the base of the cotangent bundle resembles amoeba-type shapes and it shrinks to the graphs of Morse flows in the limit." In the paper, we dealt with the case of discs, i.e., open Riemann surfaces of genus zero. **Problem:** Study the similar degeneration problem for the higher genus case.'
