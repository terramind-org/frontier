lean:
  module: FormalConjectures.Wikipedia.TuzaConjecture
  decl: TuzaConjecture.tuza_conjecture
  statement: |-
    theorem tuza_conjecture {V : Type} [Fintype V] (G : SimpleGraph V) :
        triangleCoverNumber G ≤ 2 * trianglePackingNumber G
  context:
    - open TuzaConjecture
    - "variable {V : Type*}"
  definitions:
    - name: TuzaConjecture.triangleCoverNumber
      kind: def
      text: |-
        /-- The **triangle covering number** `τ(G)`: the least number of edges meeting every triangle
        of `G`. -/
        noncomputable def triangleCoverNumber (G : SimpleGraph V) : ℕ :=
          sInf {n | ∃ C : Set (Sym2 V), IsTriangleCover G C ∧ C.ncard = n}
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/TuzaConjecture.lean#L49
    - name: TuzaConjecture.trianglePackingNumber
      kind: def
      text: |-
        /-- The **triangle packing number** `ν(G)`: the greatest number of pairwise edge-disjoint
        triangles of `G`. -/
        noncomputable def trianglePackingNumber (G : SimpleGraph V) : ℕ :=
          sSup {n | ∃ T : Set (Finset V), IsTrianglePacking G T ∧ T.ncard = n}
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/TuzaConjecture.lean#L54
