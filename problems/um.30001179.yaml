title: Generation of Free Product Systems by Tensor Subsystems
field: physics
tier: prose
statement: For a free product system $E^{\ast}$, let its largest tensor-product subsystem be the intersection, over all decompositions $t=t_1+\cdots+t_n$, of the subsystems $E_{t_n}\odot\cdots\odot E_{t_1}$. Does this intersection subsystem generate $E^{\ast}$ as a free product system?
