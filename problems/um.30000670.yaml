title: Formal Group Isomorphisms and Positive-Characteristic CIT
field: mathematics
tier: prose
statement: Let $(K,D)$ be a Hasse–Schmidt field with field of absolute constants $C$, let $A,B$ be commutative algebraic groups over $C$, and let $\phi:A\to B$ be a nowhere-algebraic formal isomorphism. Suppose $(a,b)\in A(K)\times B(K)$ satisfies $U_\phi(l_D^A(a))=l_D^B(b)$ and $\operatorname{trdeg}_C(a,b)\leq n$, so that $b\in B_0(K)+c$ for some proper algebraic subgroup $B_0<B$ over $C$ and some $c\in B(C)$. If $\phi^{-1}$ is also nowhere algebraic, must $a$ likewise lie in a coset of a proper algebraic subgroup of $A$? Can the special case of a formal map from the multiplicative group to an ordinary elliptic curve prove weak $\mathrm{CIT}_p$? What invariant should replace $\dim_{\mathbb Q}$ in a Schanuel-style formulation?
