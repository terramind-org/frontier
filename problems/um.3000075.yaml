title: Sabidussi's compatibility conjecture
field: mathematics
tier: prose
statement: Let G=(V,E) be an Eulerian graph with minimum degree at least 4, and let W be a closed Eulerian walk of G. Is it true that G has a cycle decomposition such that no pair of consecutive edges of W appear in the same cycle of the decomposition?
