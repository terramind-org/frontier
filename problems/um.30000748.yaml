title: Recycled Maker–Breaker Games and Kaplansky Four-in-a-Line
field: mathematics
tier: prose
statement: In the recycled Maker–Breaker game, if Breaker has a winning strategy, does that imply a winning strategy in the recycled game, in particular when Breaker's win is guaranteed by the Erdős–Selfridge theorem? Also, is the 4-in-a-line Kaplansky game, in which players alternately claim points of $\mathbb Z^2$ and the first to obtain four points on an opponent-free line wins, a draw?
