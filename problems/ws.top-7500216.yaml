  \item[\hypertarget{source:7500216:2}{S2}] Stephen G. Simpson, Open Problems in Reverse Mathematics (15 December 1999), Replacing RCA0 by a Weaker Base Theory, paragraph beginning One project for the future. \url{https://sgslogic.net/t20/talks/cta/problems/node9.html}.
  \item[\hypertarget{source:7500216:3}{S3}] Leszek Aleksander Ko\l odziejczyk, Katarzyna Kowalik and Keita Yokoyama, How Strong Is Ramsey's Theorem If Infinity Can Be Weak?, arXiv:2011.02550v2 (16 January 2021), Introduction and Section 3. \url{https://arxiv.org/pdf/2011.02550}.
  \end{description}
