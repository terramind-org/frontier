lean:
  module: FormalConjectures.Paper.RiemannZetaZeros
  decl: riemannZeta.simple_prop_one_hundred
  statement: |-
    theorem simple_prop_one_hundred : ∃ o : ℝ → ℝ, o =o[atTop] (1 : ℝ → ℝ) ∧
        ∀ T > 0, (1 - o T) * N riemannZeta T (2 * T) ≤ Ns riemannZeta T (2 * T)
  context:
    - open riemannZeta
    - open Filter
    - open ZetaZeros
  definitions:
    - name: ZetaZeros.N
      kind: def
      text: |-
        /-- `N(T₁, T₂)`: the nontrivial zeros of `f` with imaginary part in `(T₁, T₂]`, counted with
        multiplicity. -/
        noncomputable def N (f : ℂ → ℂ) (T₁ T₂ : ℝ) : ℕ :=
          Complex.zeroCountOn f (nontrivialZeros f T₁ T₂)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Paper/RiemannZetaZeros.lean#L53
    - name: ZetaZeros.Ns
      kind: def
      text: |-
        /-- `Ns(T₁, T₂)`: the number of simple zeros of `f` on the critical line with imaginary part in
        `(T₁, T₂]`. -/
        noncomputable def Ns (f : ℂ → ℂ) (T₁ T₂ : ℝ) : ℕ :=
          {s ∈ nontrivialZeros f T₁ T₂ | s.re = 1 / 2 ∧ analyticOrderAt f s = 1}.ncard
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Paper/RiemannZetaZeros.lean#L62
