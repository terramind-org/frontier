id: riemannzeta.simple-prop-one-hundred
title: Simple zeros of the Riemann zeta function on the critical line (riemannZeta.simple_prop_one_hundred)
field: mathematics
tier: proof
statement: Almost all nontrivial zeros of `ζ` are simple and on the critical line.
