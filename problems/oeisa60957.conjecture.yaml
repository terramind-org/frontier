id: oeisa60957.conjecture
title: Number of different products of subsets of $\{1, 2, \dots, n\}$
field: mathematics
tier: proof
statement: |-
  Conjecture: let $p \le n$ be prime. If $m$ and $p^a m$ are two such products, then so is $p^k m$
  for all $0 < k < a$.
  - Yan Sheng Ang, Feb 13 2020
