lean:
  module: FormalConjectures.OEIS.«60957»
  decl: OeisA60957.conjecture
  statement: |-
    theorem conjecture :
        ¬ ∀ (n p : ℕ), p.Prime → p ≤ n →
          ∀ (m a_exp : ℕ), m ∈ productsOfSubsets n → p ^ a_exp * m ∈ productsOfSubsets n →
            ∀ k : ℕ, 0 < k → k < a_exp → p ^ k * m ∈ productsOfSubsets n
  context:
    - open OeisA60957
  definitions:
    - name: OeisA60957.productsOfSubsets
      kind: def
      text: |-
        /-- The set of products of subsets of $\{1, \dots, n\}$. -/
        def productsOfSubsets (n : ℕ) : Set ℕ :=
          {m : ℕ | ∃ s ⊆ Finset.Icc 1 n, m = s.prod id}
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/60957.lean#L63
