id: um.30006037
title: Higher Algebra Structures on Graph-Cooperad Deformations
field: mathematics
tier: prose
statement: |-
  Does the deformation complex of the chain cooperad $\mathrm{EGraphs}_n^c$ carry a natural $E_{n+2}$-algebra structure, with the action of the $L_\infty$-algebra $\mathrm{EGC}_{2n}$ inducing a quasi-isomorphism

  $$U_{E_{n+2}}(\mathrm{EGC}_{2n})\xrightarrow{\sim}\operatorname{Def}(\mathrm{EGraphs}_n^c,\mathrm{EGraphs}_n^c)?$$

  Equivalently, establish the proposed compatibility of these higher-algebraic structures.
