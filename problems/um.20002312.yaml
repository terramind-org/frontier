title: Downward reflection of relative computable categoricity
field: mathematics
tier: prose
statement: |-
  $K$ is relatively $\kappa^+$-categorical when for any two $\kappa^+$-computable $N,M$ of cardinality $\kappa^+$, they are isomorphic in $L_{\kappa^+}(M,N)$.

  **Question 10.** Suppose that $K$ is relatively $\kappa^+$-computably categorical. Must $K$ be relatively $\lambda^+$-computably categorical?
