title: Global Ricci Bounds along Kähler–Ricci Flow
field: mathematics
tier: prose
statement: Let $X$ be a compact Kähler manifold admitting a holomorphic fibration onto a lower-dimensional base (so that the normalized Kähler--Ricci flow $\partial_t \omega(t) = -\operatorname{Ric}(\omega(t)) - \omega(t)$ is immortal and collapses the fibers as $t \to \infty$). Along the Kähler--Ricci flow on $X$, does the Ricci curvature norm $|\operatorname{Ric}(\omega(t))|_{\omega(t)}$ remain uniformly bounded for all time $t \geq 0$ and globally on $X$?
