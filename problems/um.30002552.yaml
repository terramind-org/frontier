title: Simultaneous Adaptive Estimation Across Norms and Derivatives
field: mathematics
tier: prose
statement: For estimation over Hölder balls with unknown smoothness $\beta$ and radius $Q$, can one adapt simultaneously over all $L^p$ losses? Can one simultaneously attain sharp $L^2$ and $L^\infty$ rates for a function and its derivatives? Can adaptation be achieved without coefficientwise wavelet bounds, and can one characterize when simultaneous adaptation is possible and construct an attaining estimator?
