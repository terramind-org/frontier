title: A rational orientation-kernel presentation of the equivariant sphere ring
field: mathematics
tier: prose
statement: |-
  In (Morel 2004, MR2061856) Morel showed that Milnor-Witt K-theory of a field is isomorphic to the graded endomorphism ring of the unit object in the stable homotopy category of motivic spectra over that field.

  Can we prove a similar result in the setting of equivariant spectra? This would aid in understanding the tensor triangular geometry of \(Sp^G\).
