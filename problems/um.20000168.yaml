title: Compact-Lie norms and a fixed-point obstruction
field: mathematics
tier: prose
statement: |-
  In genuine \(G\)-spectra we have multiplicative norm and
  transfer maps when \(G\) has finitely indexed subgroups. Furthermore,
  (via Ando-Morava) there are objects that look like what may arise
  from a multiplicative norm for compact Lie groups.

  Are there analogues of multiplicative norms or multiplicative
  transfers for compact Lie groups?
