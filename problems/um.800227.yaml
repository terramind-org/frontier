title: Several Complex Variables Problem List — Problem 23
field: mathematics
tier: prose
statement: |-
  Let $\Omega \subset \mathbb{C}^n$ be a smoothly bounded, pseudoconvex domain.
  Let $V \subseteq \Omega$ be a divisor which is bounded away from the
  Silov boundary in $\partial \Omega.$ Prove that there is a bounded
  holomorphic function on $\Omega$ that vanishes on $V.$ (This is known
  for the polydisc---a result of Rudin.)\\
  -S. Krantz, sk @math.wustl.edu
