title: Elementary-Theory Classification of Virtually Free Groups
field: mathematics
tier: prose
statement: Do the known classifications for finitely generated virtually free groups extend from $\forall\exists$-formulas to arbitrary first-order formulas? More precisely, can elementary equivalence still be characterized by common overgroups obtained through finite sequences of legal large HNN extensions over finite subgroups and legal small replacements of virtually cyclic subgroups, can elementary embeddings still be characterized by iterated legal large extensions, and do the corresponding decision algorithms still exist?
