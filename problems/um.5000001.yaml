id: um.5000001
title: Closed-versus-preclosed trajectory lengths
field: mathematics
tier: prose
statement: In a regular $n$-gon, call a trajectory preclosed when its endpoints divide their boundary edges into equal-length parts and meet those oriented edges at equal angles. Closed and preclosed trajectories are strongly parallel when they have the same sequence of reflection edges. After canceling all common factors from the ratios of lengths of a family of parallel closed trajectories, prove that the remaining integer factors relating closed-trajectory lengths to the corresponding preclosed-trajectory lengths are never equal to $n$.
