title: Foliations and Diffeomorphism Groups — Question 6
field: mathematics
tier: prose
statement: Let $(\xi_-, \xi_+)$ be a pair of (co)oriented contact structures with opposite signs on $M$ which are homotopic as plane fields, and assume that both of $\xi_-$ and $\xi_+$ are tight. Does $M$ admit a cooriented *Reebless* $C^0$-foliation?
