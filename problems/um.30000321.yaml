title: Fixed Points from Equivariant Cohomology Divisibility
field: mathematics
tier: prose
statement: Let $G=(\mathbb Z/p)^r$ act on a projective $\mathbb ZG$-chain complex $C$, and suppose $j^*H^n(C/G)=p^kH^n(C)$. Must some subgroup isomorphic to $(\mathbb Z/p)^{r-k}$ have a fixed point on $C$?
