id: um.30003234
title: Badly Approximable Points on Planar Curves
field: mathematics
tier: prose
statement: For weights $i, j \geq 0$ with $i + j = 1$, let $\operatorname{Bad}(i, j) \subset \mathbb{R}^2$ denote the set of $(i, j)$-badly approximable points in the plane, i.e., pairs $(x, y)$ for which there exists $c > 0$ such that $\max(q^i \|qx\|, q^j \|qy\|) \geq c$ for all integers $q \geq 1$. Given a nondegenerate planar curve $C \subset \mathbb{R}^2$ and weights $i, j \geq 0$ with $i + j = 1$, is the intersection $C \cap \operatorname{Bad}(i, j)$ always uncountable?
