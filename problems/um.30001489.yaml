title: Donaldson's Almost-Complex Calabi–Yau Conjecture
field: mathematics
tier: prose
statement: Let $(M,\omega)$ be a compact symplectic four-manifold, let $J$ be an almost-complex structure tamed by $\omega$, and let $\sigma$ be a smooth volume form with $\int_M\sigma=\int_M\omega^2$. If a symplectic form $\widetilde\omega$ is cohomologous to $\omega$, compatible with $J$, and satisfies $\widetilde\omega^2=\sigma$, do $C^\infty$ a priori bounds for $\widetilde\omega$ follow from bounds depending only on $(M,\omega,J,\sigma)$?
