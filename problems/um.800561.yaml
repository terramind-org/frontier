title: Visibility Graphs of Points, Segments and Polygons — Problem 35
field: mathematics
tier: prose
statement: |-
  A *dominating set* for a graph $G = (V, E)$ is a subset $D$ of $V$ such that every vertex
  not in $D$ is joined to at least one member of $D$ by some edge. The minimum dominating
  set problem in visibility graphs corresponds to the art gallery problem in polygons which has been
  shown to be NP-hard [ll-ccagp-86, ls-cavg-95]. Following the approximation algorithm for the
  art gallery problem for polygons given by Ghosh [g-apat-2006,g-apatpp-2010],
  a minimum dominating set of
  visibility graph can be computed with an approximation ratio of $O(\log n)$.

  Design a constant factor approximation algorithm for computing minimum dominating set of
  visibility graphs.
