title: Support-Filtration Classification of Compactly Generated t-Structures
field: mathematics
tier: prose
statement: Let $A$ be a connective bounded commutative differential graded ring, let $\mathcal D=D(A)$ be its derived category, and set $X=\operatorname{Spec}(\operatorname{End}_{\mathcal D}(\mathbf 1))$. Are the compactly generated $t$-structures on $\mathcal D$ whose nonpositive aisle is a tensor ideal classified by support filtrations $f:\mathbb Z\to 2^X$?
