title: Integral and mod-p Kirwan maps for weighted projective orbifolds
field: mathematics
tier: prose
statement: For a Hamiltonian presentation of a symplectic toric orbifold, when is the Kirwan restriction map surjective with integral coefficients? What is the answer with \(\mathbb F_p\) coefficients, and how does the answer change when the target is ordinary coarse-space cohomology, Haefliger/Borel orbifold cohomology, or Chen--Ruan cohomology?
