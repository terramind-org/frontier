  \section{Generalized Riemann Hypothesis for Automorphic L-Functions}\label{30003575}
  {\small UnsolvedMath ID 30003575 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For every automorphic $L$-function having an Euler product, the Ramanujan bounds, analytic continuation, and a functional equation, do all nontrivial zeros lie on the critical line $\operatorname{Re}(s)=1/2$?
  \par\smallskip\textit{Formulation references:} \sref{30003575}{1}, \sref{30003575}{2}.
  \subsection{Short English statement}
  For every automorphic $L$-function having an Euler product, the Ramanujan bounds, analytic continuation, and a functional equation, do all nontrivial zeros lie on the critical line $\operatorname{Re}(s)=1/2$?
