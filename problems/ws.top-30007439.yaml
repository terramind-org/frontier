statement: |-
  \section*{The symmetric maximal triangular Hilbert transform}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For F,G in $L^3(R^2)$, is $||sup_{0<a<b<infinity}$ $|integral_{a<|t|<b}$ F(x+t,y)G(x,y+t) dt/t| $||_L(3/2)(R2)$ $<=$ $C||F||_3||G||_3$ with one absolute C?
  \subsection{Short English statement}
  For F,G in $L^3(R^2)$, is $||sup_{0<a<b<infinity}$ $|integral_{a<|t|<b}$ F(x+t,y)G(x,y+t) dt/t| $||_L(3/2)(R2)$ $<=$ $C||F||_3||G||_3$ with one absolute C?
