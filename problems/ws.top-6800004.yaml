  \item[\hypertarget{source:6800004:2}{S2}] Alexander Pigazzini, \emph{Positive Biorthogonal Curvature on $S^2\times T^2$ via Affine Connection}, arXiv:2502.11914v11 (2025), Section 1, printed p. 1, and Section 1.2, ``Problem (Bettiol, 2017)'', p. 3. \url{https://arxiv.org/abs/2502.11914v11}.
