title: Kourovka Notebook Problem 10.54
field: mathematics
tier: prose
statement: |-
  (R. G\"obel). For a cardinal number $\mu$, let
  $${\mathbb{Z}^{<\mu}=\{ f \in {\mathbb{Z}^{\mu}\mid |\mathrm{supp} (f)| < \mu \} \; \; \; \; \mbox{ and} \; \; \; \;
  G_{\mu}={\mathbb{Z}^{\mu}/{\mathbb{Z}^{<\mu}.$$
  a) Find a non-zero direct summand $D$ of
  $G_{\omega
  _1}$ such
  that $D\not\cong G_{\omega _1}$.

  b) Investigate the structure of $G_{\mu}$
  (the
  structure of
  $G_{\omega _0}$ is well known).
