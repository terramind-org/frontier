title: A four-dimensional repair for symmetric surface classes on Mbar_0,7
field: mathematics
tier: prose
statement: |-
  What is the effective cone of surfaces
  \[
  \operatorname{Eff}_2\!\left(\overline{\mathcal M}_{0,7}^{\mathfrak S_7}\right),
  \qquad
  \overline{\mathcal M}_{0,7}^{\mathfrak S_7}
  :=\overline{\mathcal M}_{0,7}/\mathfrak S_7?
  \]

  The AIM record asks:

  Throughout, \(X=\overline M_{0,7}\) over
  \(\mathbb C\), \(G=S_7\), \(Y=X/G\), and \(q:X\to Y\) is the finite coarse
  quotient. Since \(\dim X=4\), surfaces are both dimension-two and
  codimension-two cycles. We use real numerical classes and write
  \(\overline{\operatorname{Eff}}_2\) for the closure of the cone generated by
  effective surfaces. This is the convention called \(\operatorname{Eff}_2\) in
  Fulger--Lehmann.

  There is an important convention warning. The invariant rational
  Chow/homology group upstairs, the rational Chow group of the quotient stack
  \([X/G]\), and the rational cycle group of the coarse quotient are related by
  finite-group transfer, but products of *symmetric divisors* detect only a
  three-dimensional quotient of the four-dimensional invariant surface space. The latter distinction is essential here.
