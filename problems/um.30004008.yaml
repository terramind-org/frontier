title: Rainbow Arborescences Across Arc Partitions
field: mathematics
tier: prose
statement: Let a directed graph $G=(V,A)$ with $\lvert V\rvert=k+1$ have its arc set partitioned into $k$ arborescences $F_1,\ldots,F_k$, each having $k$ arcs. Must there be an arborescence $F^*\subseteq A$ such that $\lvert F^*\cap F_i\rvert=1$ for every $i$?
