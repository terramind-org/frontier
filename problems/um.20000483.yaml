title: The Hilbert matrix on power-weighted ell-squared spaces
field: mathematics
tier: prose
statement: |-
  The \(\mathscr l^2\)-spectrum for the Hilbert matrix
  \(H_{mn}=1/(m+n+1)\) is known. Find the spectrum on spaces of the
  form
  \(\mathscr l_2(\alpha)=\{\sum |a_n|^2(n+1)^\alpha<\infty\}\).
