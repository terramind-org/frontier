title: Open Problems on Central Simple Algebras — Problem 1
field: mathematics
tier: prose
statement: |-
  Perhaps the most important open problem in the theory of central simple algebras is:

  Given a prime $p$, construct a non-cyclic division algebra of degree $p$ over some field $F$.
