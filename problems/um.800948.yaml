title: Open Problems and Questions about Geodesics — Question 28
field: mathematics
tier: prose
statement: |-
  The answer is positive in dimension 2 [Green1954]. The question is open in higher dimensions; the proof in [Green1956] is incorrect. The answer to the corresponding question about Finsler metrics is negative. The
  Teichm\"uller metric on Teichm\"uller space has no conjugate points, but Masur showed that there exist two rays through the same point which do not diverge [Masur1975].

  A closely related question is:

  *Suppose $dist(\alpha(t),\beta(t)) \to 0$ as $t \to -\infty$. Does $dist(\alpha(t), \beta(t)) \to \infty$ as $t\to \infty$?*
