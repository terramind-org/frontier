title: Exact Transversals for Families with the (p,q)-Property
field: mathematics
tier: prose
statement: For a family of hyperplanes in $\mathbb{R}^d$ with the $(p,q)$-property, $d+1\leq q\leq p$, must there be a $(p-q+1)$-transversal; and does the analogous statement hold for families of $r$-element sets with $r+1\leq q\leq p$?
