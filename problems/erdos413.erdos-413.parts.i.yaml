  module: FormalConjectures.ErdosProblems.«413»
  decl: Erdos413.erdos_413.parts.i
  statement: |-
    theorem erdos_413.parts.i :
        { n | IsBarrier (fun m => ω m) n }.Infinite
  context:
    - open Erdos413
