title: A rank-one Morita diagnostic for DAHA and punctured-torus branes
field: mathematics
tier: prose
statement: |-
  Is there a wrapped/stopped, possibly singular and \(B\)-field-twisted A-brane category \(\mathcal A_{N,\tau,q}\) of \(\mathfrak X_{N,\tau}\), containing a canonical coisotropic object \(\mathfrak B_{\mathrm{cc}}\), such that
  \[
  \operatorname{RHom}(\mathfrak B_{\mathrm{cc}},-):
  \mathcal A_{N,\tau,q}
  \longrightarrow
  \operatorname{Mod}\bigl(\mathbb{SH}_{q,t}(GL_N)\bigr)
  \]
  is an equivalence? Equivalently, does \(\mathfrak B_{\mathrm{cc}}\) generate and have endomorphism algebra \(\mathbb{SH}_{q,t}(GL_N)\)?
