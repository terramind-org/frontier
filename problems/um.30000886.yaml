title: Uniform Freeness Bounds for Bicyclic Units
field: mathematics
tier: prose
statement: For a finite non-Hamiltonian group $G$, let $m(G)$ be the least positive integer $m$ such that, for every pair of bicyclic units $b_1,b_2$ whose generated subgroup is not nilpotent, the subgroup generated by $b_1$ and $b_2^m$ is free. Is $\{m(G):G\text{ is finite and non-Hamiltonian}\}$ bounded? Equivalently, for a nonzero algebraic integer $z$, let $m(z)$ be the least $k$ such that $kz$ is a free point, meaning that the group generated by $\begin{bmatrix}1&1\\0&1\end{bmatrix}$ and $\begin{bmatrix}1&z\\0&1\end{bmatrix}$ is free. Is $\{m(z)\}$ bounded?
