title: Geometry and Quasimorphism Extension Along Contactomorphism Inclusions
field: mathematics
tier: prose
statement: |-
  What can be said about the geometry of

  $$j:\operatorname{Cont}_0(M,\alpha)\hookrightarrow\operatorname{Cont}_0(M,\xi),$$

  and can quasimorphisms from $\operatorname{Ham}(X,\omega)$ extend along $j$ in the prequantization case?
