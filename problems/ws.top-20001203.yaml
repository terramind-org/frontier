  \section{Finite Markov templates with several varying level sets}\label{20001203}
  {\small\sffamily UnsolvedMath ID 20001203 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are denoted by $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$; index ranges, computational models and specialized notation follow the cited problem source and the definitions below.


  For an integer matrix $A$, the fiber at $b$ is $\mathcal F_b=\{x\in\mathbb Z_{\ge0}^d:Ax=b\}$. A Markov basis is a finite set of integer moves $u$ with $Au=0$ such that steps $x\mapsto x\pm u$ staying nonnegative connect every nonempty fiber. A hierarchical categorical model is specified by a collection of allowed interactions. Its level sets give the possible values of each variable, and varying their sizes changes the model matrix and its Markov bases. Finiteness can concern move degrees, symmetry classes, or a finite collection of templates rather than a bound on the total number of moves.
  \paragraph{Statement recorded in the supplied source.}
  Question 27. What types of "finiteness" statements can be made about Markov bases for hierarchical models as more than one set of levels is allowed to vary? \sref{20001203}{2}
  \paragraph{Scope qualification.}
  The source asks which kinds of finiteness are possible and does not assert one fixed finiteness conjecture.
  \paragraph{Source status.}
  The supplied catalogue labels this record partially solved. Its source-status metadata was checked against the supplied snapshot on 2026-10-11. This import does not independently establish current open status or mathematical correctness.
  \subsection{Short English statement}
  What finiteness properties survive when several numbers of categories grow in a hierarchical table model?
