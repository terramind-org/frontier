title: Finiteness of R-Equivalence Classes in Nonabelian Cohomology
field: mathematics
tier: prose
statement: Let $K$ be a number field and $G$ a finite solvable group. Is the quotient $H^1(K,G)/R$ by $R$-equivalence finite? If so, relate its cardinality to the minimum number of torsors over a purely transcendental extension of $K$ needed to parametrize $H^1(K,G)$ densely.
