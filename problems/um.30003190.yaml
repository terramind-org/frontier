id: um.30003190
title: Spectral Halo Breaking Points for Hilbert Modular Forms
field: mathematics
tier: prose
statement: |-
  In the Hilbert modular setting, what should replace the following spectral-halo assertion for classical overconvergent modular forms: if $(n_i,m_i)$ are the breaking points of the Newton polygon of the characteristic series modulo $p$, then there exists a rational $0<r<1$ such that, for every weight $\kappa$ in the annulus $r<\lvert T\rvert<1$, the breaking points after specialization are

  $$\bigl(n_i,\operatorname{val}_p(\kappa(1+p)-1)m_i\bigr)$$?
