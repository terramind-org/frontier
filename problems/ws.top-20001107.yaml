  \item[S1] ULAM.AI and the UnsolvedMath Contributors, supplied problems.json, catalogue entry, AIM Workshop Problem Lists. Catalogue identity and source transcription; CC BY 4.0.
  \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[S2] American Institute of Mathematics, Recent trends in additive combinatorics, item 2.7. Original workshop question.
  \url{https://aimath.org/WWN/additivecomb/additivecomb.pdf}.
  \item[S3] Noga Alon, Large sets in finite fields are sumsets. Extremal nonsumset context.
  \url{https://web.math.princeton.edu/~nalon/PDFS/sumset.pdf}.
  \end{itemize}
