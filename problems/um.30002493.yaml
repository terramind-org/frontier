title: Algebraic Cycles Spanning Predicted Tate Classes
field: mathematics
tier: prose
statement: For the basic Newton stratum of a Hodge-type Shimura variety or a moduli space of shtukas, families of cycles $\{Z_\gamma\}$ are parameterized by Mirković–Vilonen cycles. Do the classes of the cycles $Z_\gamma$ span all Tate classes predicted by the Langlands conjecture?
