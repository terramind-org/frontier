title: Character Degrees, Group Algebras, and Nilpotent Blocks
field: mathematics
tier: prose
statement: Determine whether the set of irreducible character degrees determines solvability of a finite group, whether its complex group algebra determines the existence of a normal Sylow $p$-subgroup, and whether nilpotent blocks are exactly those whose height-zero characters all have the same degree.
