title: Positivity Criteria for Tropical Tori
field: mathematics
tier: prose
statement: For a tropical torus $X=\mathbb{R}^n/\Lambda$, determine whether the positivity criterion for representing an integral (1,1)-class by an effective tropical cycle can be inverted, whether tropical analogues of the Nakai–Moishezon and Kleiman criteria exist, and which hypersurface combinatorial types allow large or small ranges of Picard ranks.
