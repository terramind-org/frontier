title: "Unordered tuples of metric trees: qualitative ALR versus injectivity"
field: mathematics
tier: prose
statement: |-
  \({\mathbb Q}_Q(Y)\) denotes the space of unordered \(Q\)-tuples
  \(y=[y_1,\ldots,y_Q]\) of elements of \(Y\) equipped with the metric
  \[
  d(y,z)=\min_{\sigma\in S_Q}\max_{1\leq j\leq Q}
  d(y_j,z_{\sigma(j)}).
  \]
  If \(Y\) is an absolute Lipschitz retract, is the same true of the
  space \({\mathbb Q}_Q(Y)\)?
