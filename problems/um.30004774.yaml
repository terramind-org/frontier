title: Hiraga–Ichino–Ikeda–Langlands Plancherel Density Conjecture
field: mathematics
tier: prose
statement: For almost every tempered representation $\sigma$ of a reductive group $H$, prove the Hiraga–Ichino–Ikeda–Langlands formula $d_H(\sigma)=\frac{\dim(\rho_\sigma)}{|S_\sigma|}\lvert\gamma^*(0,\sigma,\operatorname{Ad}_H)\rvert$, where $\gamma^*$ is the suitably normalized first nonzero Laurent coefficient at $s=0$.
