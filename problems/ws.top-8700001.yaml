statement: |-
  \section{Problem 1.1}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $0\ne f\in\mathbb Z[X,Y]$, let $d=\deg f$, and let $H=\max|c_{ij}|$ be its coefficient height. Assume its zero set in $\mathbb Z^2$ is finite.
  \paragraph{Statement recorded in the supplied source.}
  Find an upper bound $B(d,H)$ for $\max\{|x|,|y|\}$ for every integer solution of $f(x,y)=0$, depending only on $d,H$. The question asks for a determinable bound, not merely the existence of a maximum for each fixed $f$. \sref{statement}{2}
  \subsection{Short English statement}
  Give a degree-and-coefficient bound for every integer solution of a plane equation known to have only finitely many integer solutions.
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Michel Waldschmidt, Open Diophantine Problems, arXiv:math/0312440v2 (24 January 2004), Problem 1.1. \url{https://arxiv.org/abs/math/0312440}.
  \end{description}
  \label{end:statement}
