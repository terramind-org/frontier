  \section*{The nested CLE limit of half-plane double-dimer loops}\label{30007349}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For the half-plane Temperleyan double-dimer ensemble, do all macroscopic loops converge as curves along the full mesh limit to nested $CLE_4$ in the upper half-plane, in the specified loop-collection matching topology?
  \subsection{Short English statement}
  For the half-plane Temperleyan double-dimer ensemble, do all macroscopic loops converge as curves along the full mesh limit to nested $CLE_4$ in the upper half-plane, in the specified loop-collection matching topology?
