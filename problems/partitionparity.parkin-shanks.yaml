schema: 1
id: partitionparity.parkin-shanks
title: Parities of partition numbers (parkin_shanks)
field: mathematics
tier: proof
statement: |-
  The natural density of `n` where the partition number `p(n)` is even (resp. odd) exists and
  equals `1/2`.
