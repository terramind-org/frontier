title: Size Ramsey Numbers of Ramanujan Graphs
field: mathematics
tier: prose
statement: Let $G$ be an $n$-vertex, $\Delta$-regular Ramanujan graph with $\Delta\geq3$, let $N=10^{10^{10\Delta n}}$, and let $p$ be the probability for which a random graph $G(N,p)$ has probability $1/2$ that every two-coloring contains a monochromatic copy of $G$. Is the size Ramsey number of $G$ equal to $\Theta(pN^2)$?
