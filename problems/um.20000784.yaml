title: Factorwise transfer of density-one ordinary reduction
field: mathematics
tier: prose
statement: Let \(A\) be an abelian variety over a number field \(K\). Does there exist a finite extension \(K'/K\) such that for a set of primes \(v\) of \(K'\) of density \(1\), \(A/\mathbb F_v\) is ordinary?
