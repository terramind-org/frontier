title: Birational Modifications Proving Rationality of a Ueno Variety
field: mathematics
tier: prose
statement: The Ueno-type variety $X_{4,6}$ is birational to a diagonal cubic surface over $k(t_1,t_2)$. Can that cubic surface be modified birationally, analogously to the conic-bundle treatment of $X_{3,4}$, to prove that $X_{4,6}$ is rational?
