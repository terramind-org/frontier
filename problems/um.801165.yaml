title: Open Problems in Wavelet Theory — Problem 4
field: mathematics
tier: prose
statement: |-
  Larson [La2] has posed an interesting problem about frequency supports of wavelets. Must the support of the Fourier transform of a wavelet contain a wavelet set? This problem stems from the observation that there are two ways of describing minimality of frequency support. The first one is that $\operatorname{supp} \hat \psi$ has the smallest possible Lebesgue measure (equal to 1), which is used in the actual definition of an MSF wavelet. The second possibility is to insist that the support is minimal with respect to the inclusion partial order. It is not known whether these two natural definitions of minimality of frequency supports are the same. This is the essence of the following problem posed by Larson in late 1990's although its official formulation appeared only in [La2].

  Is it true that for any orthonormal wavelet $\psi \in L^2(\mathbb{R})$, there exists a wavelet set $W$ such that such that $W \subset \operatorname{supp} \hat\psi$?
