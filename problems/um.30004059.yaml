title: Equality of Automorphic Weight Cones
field: mathematics
tier: prose
statement: |-
  Let $C_{\mathrm{zip}}$ be the cone of automorphic weights defined by global sections on the $G$-zip stack, and let $C_K(\mathbb F_p)$ be the corresponding cone for the special fiber of the Shimura variety. Is
  $$
  \langle C_{\mathrm{zip}}\rangle=\langle C_K(\mathbb F_p)\rangle
  $$
  ?
