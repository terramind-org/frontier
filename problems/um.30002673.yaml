title: Estimating Probabilities of Unobserved Species
field: mathematics
tier: prose
statement: Given a multinomial database sample $X\sim\operatorname{Multinom}(n,p)$ over a very large species set and an unobserved species $s$ with $X_s=0$, develop a statistically sound estimate of $p_s$ (or $-\log_{10}p_s$) and quantify its uncertainty.
