statement: |-
  \medskip
  \noindent\textbf{Smoothness.}
  For an integer $m\ge 1$ and a real $y\ge 2$, write $P^+(m)$ for the largest prime divisor of $m$ (with the convention $P^+(1)=1$). We say that $m$ is \emph{$y$--smooth} if $P^+(m)\le y$.
