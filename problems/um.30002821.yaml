title: Optimality of Greedy Circle Packings
field: mathematics
tier: prose
statement: Place infinitely many nonoverlapping disks tangent to the $x$-axis in the curvilinear triangular region bounded by the $x$-axis and two unit disks centered at $(\pm1,1)$, maximizing their total area. Does the greedy procedure that successively inserts a disk tangent to two previously placed disks attain the maximum area?
