statement: Is there a natural quotient complex of any one of the complexes discussed in §1 which might be useful for the construction of non-faithful representations of Mg? Let’s suppose that we have some answers to either Problem 3.1 or 3.2 or 3.5. At that moment, our instincts would lead us right back to a line of investigation that was successful many years ago when, in [ 4], we used the symplectic representation and found an invariant which distinguished inequivalent minimal Heegaard splittings. In the intervening years we suggested that our students try to do something similar with other representations, but that project failed. We propose it anew. Recall that a 3-manifold M may have one or more distinct equivalence classes of Heegaard splittings. It is known that any two become equivalent after some number of stabilizations. There are many interesting unanswered questions about the collection of all equivalence classes 10. 3-manifolds, Heegaard distance and mapping class groups 155 of Heegaard splittings of a 3-manifold, of every genus. Recall that the equivalence class of the Heegaard splitting H∪φH ′ is the double coset HφH inM.
