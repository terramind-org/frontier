statement: |-
  Schwartz class is defined as a collection of all $\infty$-regular functions on $\mathbb{R}^n$.

  Do Schwartz class wavelets exist for integer expansive dilations $A$ and lattice $\Gamma ={\mathbb{Z}}^n$?
