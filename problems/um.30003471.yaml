title: Dihedral Angle Comparison for Combinatorially Equivalent Polytopes
field: mathematics
tier: prose
statement: Let $P_1,P_2\subset\mathbb R^3$ be combinatorially equivalent convex polytopes. Must there be corresponding edges $e_1\subset P_1$ and $e_2\subset P_2$ such that the dihedral angle at $e_1$ is no greater than the angle at $e_2$, unless all corresponding dihedral angles are equal?
