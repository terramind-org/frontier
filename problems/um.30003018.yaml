title: Geometric Langlands Sheaves for Discrete Parameters
field: mathematics
tier: prose
statement: For a discrete Langlands parameter $\varphi:W_E\to{}^LG$, does there exist a perverse Weil sheaf $F_\varphi$ on $\operatorname{Bun}_G\otimes\mathbb F_q$ with an $S_\varphi$-action satisfying the prescribed central-character, L-packet, Hecke-eigenvalue, and local-global compatibility properties?
