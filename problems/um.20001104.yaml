id: um.20001104
title: An anchor-container reduction for imbalanced restricted sumsets
field: mathematics
tier: prose
statement: |-
  Suppose that \(A\) and \(B\) are finite sets of integers with \(|A|=m\) and \(|B|=n\), where \(m>n\), and suppose that \(G\subseteq A\times B\) has size at least \(\delta mn\). Further suppose that
  \[
  \bigl|\{a+b:a\in A,\ b\in B,\ (a,b)\in G\}\bigr|<Cm.
  \]
  Must there exist \(A'\subseteq A\), \(B'\subseteq B\), with \(|A'|\ge cm\), \(|B'|\ge cn\), such that \(|A'+B'|\le Km\), where \(c,K\) depend only on \(\delta,C\)?
