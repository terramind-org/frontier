title: Critical-weight conformal invariants built from Schouten jets
field: mathematics
tier: prose
statement: |-
  Problem 10: If n ≥ 4 is even, is there a nonzero scalar conformal invariant of weight −n

  which is expressible as a linear combination of complete contractions of the tensors ∇lP,

  l ≥ 0? If the answer to this question is no, then the Q-curvature defined via the ambient metric construction is uniquely determined by its transformation law in terms of the GJMS operator

  n = 4, as is the norm squared of the ambient obstruction tensor in higher even dimensions.

  Its mathematical typography is
  \(\nabla^lP\), meaning the \(l\)-th covariant derivative of the Schouten tensor, and \(P_n\), meaning the critical order-\(n\) GJMS operator. No missing qualifier was found.

  The source alternates between scalar and density language elsewhere in the workshop document. Here “scalar conformal invariant of weight \(-n\)” is recovered as a scalar function \(I_g\) satisfying

  \[
  I_{e^{2\omega}g}=e^{-n\omega}I_g. \]

  Equivalently, \(I_g\,dv_g\) is a conformally invariant density. For scalar \(Q\)-curvature, the corresponding transformation law is

  \[
  e^{n\omega}Q_{e^{2\omega}g}=Q_g+\mathcal P_{n,g}\omega,
  \]

  where \(\mathcal P_n\) is used in this report for the critical GJMS operator, to distinguish it from the Schouten tensor \(P_{ij}\). In density notation the factor \(e^{n\omega}\) is absorbed into the volume form.
