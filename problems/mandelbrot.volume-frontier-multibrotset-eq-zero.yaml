schema: 1
id: mandelbrot.volume-frontier-multibrotset-eq-zero
title: Conjectures about the Mandelbrot and Multibrot sets (volume_frontier_multibrotSet_eq_zero)
field: mathematics
tier: proof
statement: |-
  The boundary of any Multibrot set is conjectured to have zero area.
  Note that we don't need to exclude the trivial cases `n = 0` and `n = 1` because the conjecture
  holds for them.
