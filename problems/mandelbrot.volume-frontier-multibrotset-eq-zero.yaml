lean:
  module: FormalConjectures.Wikipedia.Mandelbrot
  decl: Mandelbrot.volume_frontier_multibrotSet_eq_zero
  statement: "theorem volume_frontier_multibrotSet_eq_zero {n : ℕ} : volume (frontier (multibrotSet n)) = 0"
  context:
    - open Mandelbrot
    - open Topology Set Function Filter Bornology Metric MeasureTheory
  definitions:
    - name: Mandelbrot.multibrotSet
      kind: def
      text: |-
        /-- The Multibrot set of power `n` is the set of all parameters `c : ℂ` for which `0` does not
        escape to infinity under repeated application of `z ↦ z ^ n + c`. -/
        def multibrotSet (n : ℕ) : Set ℂ :=
          {c | ¬ Tendsto (fun k ↦ (fun z ↦ z ^ n + c)^[k] 0) atTop (cobounded ℂ)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/Mandelbrot.lean#L41
