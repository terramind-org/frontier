lean:
  module: FormalConjectures.OEIS.«86766»
  decl: OeisA86766.conjecture2
  statement: "theorem conjecture2 (n : ℕ) (hn : 0 < n) (h : ∀ m : ℕ, n ≠ 10 ^ m) : a n ≠ 0"
  context:
    - open OeisA86766
  definitions:
    - name: OeisA86766.a
      kind: def
      text: |-
        /-- Sequence $a(n)$ is the smallest $r > 0$ such that the concatenation of $n$, $r$ times
        with itself, multiplied by $10$ plus $1$, is prime, or $0$ if no such prime exists. -/
        noncomputable def a (n : ℕ) : ℕ :=
          if n = 0 then 0
          else
            let ℓ : ℕ := (Nat.digits 10 n).length
            let M : ℕ := 10 ^ ℓ
            let repCatVal (r : ℕ) : ℕ := n * ∑ i ∈ Finset.range r, M ^ i
            let primeCandidate (r : ℕ) : ℕ := repCatVal r * 10 + 1
            sInf {r : ℕ | 0 < r ∧ (primeCandidate r).Prime}
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/86766.lean#L36
