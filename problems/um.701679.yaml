statement: |-
  (G. Verret).
  Does there exist a finite group $G$ with two normal subgroups $K$ and $L$, each with index 12 in $G$,
  such that $K$ is isomorphic to $L$, but $G/K$ is isomorphic to $C_{12}$, while $G/L$ is isomorphic to $A_4$?
