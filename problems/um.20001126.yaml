title: Joints of lines over finite fields
field: mathematics
tier: prose
statement: |-
  Take \(n\) lines in \(\mathbb R^3\). Define a joint to be a point with three lines passing through it that are not coplanar. How many joints can there be?

  Let \(\mathcal L\) be a set of \(L\) distinct affine lines in \(\mathbb F_q^3\). A point is a **joint** if it lies on three lines of \(\mathcal L\) whose direction vectors are linearly independent. Bound, and if possible determine, the maximum number \(J\) of joints in terms of \(L\) (and the field size \(q\)).
