title: Kourovka Notebook Problem 19.108
field: mathematics
tier: prose
statement: |-
  Let $P$ be a finite $p$-group, where $p$ is an odd prime. Let $\chi$ be a
  complex irreducible character of $P$. If $\chi(x)\ne 0$ for some
  $x\in P$, is it true that the order of $x$ must divide $|P|/\chi(1)^2$?
