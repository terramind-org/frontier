title: Maximum Additive Multiplicity in Logarithmic Random Sets
field: mathematics
tier: prose
statement: For a logarithmic random set $A\subseteq\mathbb{N}$, with each $i$ selected independently with probability $1/i$, determine $\max_x r_A(x)$, where $r_A(x)$ counts representations of $x$ as a sum of elements of $A$.
