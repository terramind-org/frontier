title: Recovering the marking from a flow conjugacy
field: mathematics
tier: prose
statement: |-
  **Conjecture 5.2.1.** Compact Riemannian manifolds with negative curvature must be isometric if they have C0-conjugate geodesic flows. As with

  As with Conjecture 5.1.1 it may be possible to relax the hypothesis of negative curvature to no conjugate points, but some restriction on the metrics is required. Weinstein pointed out that all of the Zoll metrics on \(S^2\) have conjugate geodesic flows. Using the explicit rotationally-symmetric examples of Zoll metrics (Tannery metrics in the terminology of [Besse1978, Chapter 4]) Croke and Kleiner constructed examples of different metrics on an arbitrary closed manifold such that their geodesic flows are conjugate and their marked length spectra coincide, see [Cro-Klei1994].

  The conjecture is true in dimension two; indeed it is enough to assume that one of the manifolds has nonpositive curvature [Cr-Fa-Fe1992]. It follows from the theorem of Besson--Courtois--Gallot discussed in the next subsection that the conjecture holds if one of the metrics is locally symmetric. Croke and Kleiner showed that \(C^1\) conjugacy implies that the volumes of the manifolds are the same with no restrictions on the metrics and implies isometry of the metrics if one of them has a global parallel vector (as is the case in a Riemannian product) [Cro-Klei1994].
