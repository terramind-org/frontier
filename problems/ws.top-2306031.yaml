  \item[\hypertarget{source:statement:2}{S2}] W. K. Hayman and E. F. Lingham, Research Problems in Function Theory (2018), arXiv:1809.07200, Chapter 6, Problem 6.31, complete update and preceding notation. \url{https://arxiv.org/abs/1809.07200}.
  \end{description}
