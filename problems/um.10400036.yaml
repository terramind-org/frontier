statement: (M. Polyak) Milnor’s µ -invariants of string links can be de- fined similarly as above (see [329]). Find a topological pres entation of a µ - invariant of string links (not assuming the vanishing of the lower µ -invariants). (1) Show that lk (L12···n−1, Ln) is well-defined in an appropriate sense. (2) Identify it with µ 12···n−1,n(L). 2.7 Finite type invariants of virtual knots A virtual knot [203] is defined by a knot diagram with virtual crossings modu lo Reidemeister moves. Finite type invariants of virtual knot s were studied in [154], where their weight systems are defined on the space − →A(X; R)/− → FI of arrow diagrams. Here an arrow diagram [330] is a chord diagram with oriented chords, and− →A (X; R) denotes the module over a commutative ring R spanned by arrow diagrams on X subject to the 6T relation, and − → FI denotes the oriented FI relation (see Figure 9 for these relations). It is known [3 30] that − →A (X; R) is isomorphic to the module spanned by acyclic oriented Jaco bi diagrams on X subject to the relations = 0 = and the −→ AS,−−→ IHX, and −−→ STU relations (see Figure 9).
