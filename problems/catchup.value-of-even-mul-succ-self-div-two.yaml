  decl: CatchUp.value_of_even_mul_succ_self_div_two
  statement: |-
    theorem value_of_even_mul_succ_self_div_two
        (N : ℕ) (h_even : Even (N * (N + 1) / 2)) :
        value (.Icc 1 N) = .draw
  context:
