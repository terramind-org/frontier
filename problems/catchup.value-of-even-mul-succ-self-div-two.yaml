  definitions:
    - name: CatchUp.value
      kind: def
      text: |-
        /-- Public API: The game-theoretic value of Catch-Up on the set `S`, assuming optimal play.
        Returns `.win` if player 1 wins, `.loss` if player 2 wins, `.draw` if the game is tied. -/
        noncomputable def value (S : Finset ℕ) : Outcome :=
          valueAux S 0 0 true
