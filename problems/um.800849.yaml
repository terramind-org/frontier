title: Randomstrasse101 Open Problems (2025) — Conjecture 1
field: mathematics
tier: prose
statement: |-
  An interesting question is to characterize the Lov\'asz number for random graphs.
  A well-known family of random graphs is the Erd\mathbb{H}{o}s-R\'enyi random graphs \(G(n, p)\). Here, \(n\) denotes the number of vertices, and \(0 \leq p \leq 1\) is the probability parameter. To sample a graph from \(G(n, p)\), for each pair of vertices \(i \neq j \in [n]\), one adds an edge independently with probability \(p\). The random graphs \(G(n, p)\) are ubiquitous in mathematics; for instance, they are used in combinatorics to lower bound *Ramsey* numbers. There are several results on the Lov\'asz number for Erd\mathbb{H}{o}s-R\'enyi random graphs \(G(n, p)\) (see [juhasz1982asymptotic,coja2005lovasz,aroranote]). However, the precise asymptotics of the Lov\'asz number for \(G(n, 1/2)\) is still open.

  Let \(G\) be distributed as \(G(n, 1/2)\). Then,
  \begin{equation}
  \mathbb{E} \vartheta(G) = (1 + o(1))\sqrt{n}.
  \end{equation}
