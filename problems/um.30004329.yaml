title: Rationality of Seshadri Constants from Plane-Curve Singularities
field: mathematics
tier: prose
statement: Let $C$ be a reduced plane curve, let $Z$ be its singular-point set, and let $\widetilde C$ be its proper transform on the blowup of $\mathbb{P}^2$ at $Z$. If $\widetilde C^2<-1$, must the Seshadri constant $\varepsilon(Z)$ be rational, and can it be computed?
