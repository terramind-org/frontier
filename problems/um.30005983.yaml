title: Construction of p-Energies without Classical Gradients
field: mathematics
tier: prose
statement: How can one construct a canonical $p$-energy on a space that has no classical gradient? Determine hypotheses under which graph-limit, upper-gradient, and Korevaar–Schoen constructions exist and yield the same energy.
