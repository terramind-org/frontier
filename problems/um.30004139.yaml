title: Lefschetz Properties of PL Sphere Face Rings
field: mathematics
tier: prose
statement: Let $\Sigma$ be a piecewise-linear $(d-1)$-sphere with graded face ring $R[\Sigma]$. Are there open dense sets of Artinian reductions $A(\Sigma)$ and degree-one elements $\ell$ such that, for every $k\leq d/2$, multiplication by $\ell^{d-2k}$ gives an isomorphism $A^k(\Sigma)\to A^{d-k}(\Sigma)$ and the form $Q_{\ell,k}(a,b)=\deg(ab\ell^{d-2k})$ is nondegenerate on every squarefree monomial ideal and its annihilator?
