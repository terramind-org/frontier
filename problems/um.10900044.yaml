title: 5.19 (Walsh) — Limit sets of graph Kleinian groups
field: mathematics
tier: prose
statement: Characterize the limit sets of graph Kleinian groups and iterated graph-Kleinian groups. A graph Kleinian group is a convex-cocompact Kleinian group for which the double of the convex core is a graph manifold. An iterated graph-Kleinian group is one whose Bowditch decomposition contains only hanging Fuchsian and graph Kleinian pieces.
