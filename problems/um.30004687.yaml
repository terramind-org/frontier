title: Green–Griffiths–Lang Conjecture for General-Type Varieties
field: mathematics
tier: prose
statement: If $X$ is a complex projective variety of general type, does there exist a proper algebraic subvariety $Y$ of $X$ containing every nonconstant holomorphic map $f:\mathbb{C}\to X$, with the smallest such $Y$ expected over number fields to coincide with the Mordell locus?
