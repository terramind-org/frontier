  \item[\hypertarget{source:statement:2}{S2}] Michel Waldschmidt, \emph{Open Diophantine Problems}, arXiv:math/0312440v2 (24 January 2004), Conjecture 4.14, pp. 40--41; height conventions, p. 35. \url{https://arxiv.org/abs/math/0312440v2}.
  \end{description}
  \label{end:statement}
