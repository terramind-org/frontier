id: um.20002655
title: Initial-data universality requires the right coupling
field: mathematics
tier: prose
statement: |-
  It asks whether two possibly random, mutually independent initial height functions with the same hydrodynamic and fluctuation limits have the same later fluctuation limit, expected to be the KPZ fixed-point semigroup applied to the limiting initial fluctuations.

  The record literally writes the hydrodynamic hypothesis as

  \[
   \epsilon^{-1}h_i(\epsilon^{-1}x;0)\longrightarrow \bar h(x;0),
  \]

  and its fluctuation hypothesis and desired conclusion as

  \[
   \epsilon^{1/2}\left[h_i(\epsilon^{-1}x;0)
   -\epsilon^{-3/2}\bar h(\epsilon^{1/2}x;0)\right]
   \longrightarrow \widetilde h(x;0),
  \]

  \[
   \epsilon^{1/2}\left[h_i(\epsilon^{-1}x;\epsilon^{-3/2}t)
   -\epsilon^{-3/2}\bar h(\epsilon^{1/2}x;t)\right]
   \longrightarrow \widetilde h(x;t). \]

  The first display is almost certainly malformed as written. A microscopic exclusion height has order \(\epsilon^{-1}\) on Euler distance \(\epsilon^{-1}\), so the standard Euler rescaling multiplies it by \(\epsilon\), not \(\epsilon^{-1}\); Euler time is also normally rescaled. This possible typo is not silently repaired here.

  The two fluctuation displays are nevertheless dimensionally consistent with KPZ \(1{:}2{:}3\) scaling. Put \(R=\epsilon^{-3/2}\). Then

  \[
   R^{2/3}=\epsilon^{-1},\qquad R^{-1/3}=\epsilon^{1/2},
   \qquad R^{-1/3}x=\epsilon^{1/2}x. \]

  \[
   h_\epsilon(t,x)=\epsilon^{1/2}
   \left[h_{2\epsilon^{-3/2}t}(2\epsilon^{-1}x)
         +\epsilon^{-3/2}t\right]. \]
