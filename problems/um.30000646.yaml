title: Odd-Dimensional Projective-Module Splitting
field: mathematics
tier: prose
statement: Let $X=\operatorname{Spec}A$ be a smooth affine variety of odd dimension $n\geq2$ over a characteristic-zero field, and let $P$ be a rank-$n$ projective $A$-module with $c_n(P)=0$ in $CH_0(X)$. Does there exist a rank-$(n-1)$ projective $A$-module $Q$ such that $P\simeq A\oplus Q$?
