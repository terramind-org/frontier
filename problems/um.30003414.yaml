title: Hybrid Inner Models at Limits of Woodin Cardinals
field: mathematics
tier: prose
statement: Assume that there is no inner model with a Woodin cardinal that is a limit of Woodin cardinals, and let $\kappa$ be measurable and a limit of Woodin and strong cardinals. Must there be hybrid structures $M_0\mathrel{\triangleleft}M_1\subseteq H_{\kappa^+}$ such that, for every generic $g\subseteq\operatorname{Coll}(\omega,{<}\kappa)$, one has $H^-\mathrel{\triangleleft}M_0$, $$L(M_0^\omega,\Gamma,\mathbb R)\models\mathrm{AD},$$ $\operatorname{Ord}\cap M_0$ is the largest cardinal of $M_1$, and $M_1$ is close to $V$ at $\kappa$?
