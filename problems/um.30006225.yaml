title: Isoperimetric Inequalities Between Total Q-Curvatures
field: mathematics
tier: prose
statement: For $0<\ell<k<n/2$, establish the sharp isoperimetric comparison between the total $k$-th and $\ell$-th $Q$-curvatures of metrics $g=u^{4/(n-2k)}g_{S^n}$ with positive $k$-th $Q$-curvature, and prove that equality holds exactly when $u(\xi)=a(1+b\cdot\xi)^{-(n-2k)/2}$ with $a\in\mathbb{R}$ and $b\in B^{n+1}$.
