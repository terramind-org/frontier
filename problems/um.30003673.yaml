title: Uniqueness of Higher-Dimensional Critical Minimizers
field: mathematics
tier: prose
statement: In spatial dimension $N>1$, for the fair-competition aggregation–diffusion model at critical interaction strength $\chi=\chi_c$, is the global minimizer of the free-energy functional unique up to dilations? In the subcritical rescaled problem, are stationary states global minimizers and are those minimizers unique?
