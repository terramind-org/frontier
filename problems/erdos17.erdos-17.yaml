  definitions:
    - name: Erdos17.IsClusterPrime
      kind: def
      text: |-
        /-- A prime $p$ is a cluster prime if every even natural number
        $n \le p - 3$ can be written as a difference of two primes
        $q_1 - q_2$ with $q_1, q_2 \le p$. -/
        def IsClusterPrime (p : ℕ) : Prop :=
          p.Prime ∧
            ∀ {n : ℕ}, Even n → n ≤ (p - 3 : ℤ) →
              ∃ q₁ q₂ : ℕ, q₁.Prime ∧ q₂.Prime ∧
                q₁ ≤ p ∧ q₂ ≤ p ∧ n = (q₁ - q₂ : ℤ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/17.lean#L31
