title: Universal Decomposition of Complete Graphs into Bounded-Degree Factors
field: mathematics
tier: prose
statement: For every $\Delta$, does an $n_0$ exist such that, whenever $n\geq n_0$ and the $n$-vertex graphs $F_1,\ldots,F_t$ are $r_i$-regular with $r_i\leq\Delta$ and $\sum_i r_i=n-1$, the complete graph $K_n$ decomposes into copies of $F_1,\ldots,F_t$?
