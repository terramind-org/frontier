title: Randomstrasse101 Open Problems (2025) — Problem 2
field: mathematics
tier: prose
statement: |-
  An interesting approach to this problem is to try to build Sum-of-Squares proofs of $\mathrm{MUB}(6)<7$. In [BDK-2022-DualBoundsMUB] it was shown that a certain relaxation related to degree-2 Sum-of-Squares cannot prove that $M(6) < 7$. It is however unclear whether higher degree levels of Sum-of-Squares can provide such a proof.

  Is there a Sum-of-Squares degree 4 proof that there are no $7$ Mutually Unbiased Bases in $\mathbb{C}^6$?
