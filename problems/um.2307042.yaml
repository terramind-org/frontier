title: Research Problems in Function Theory — Problem 7.42
field: mathematics
tier: prose
statement: "Define the Harnack function $H_{z_0}(z)$ for a Green domain $D$ relative to $z_0\\in D$ to be the supremum of all positive harmonic functions $h$ on $D$ to be the supremum of all positive harmonic functions $h$ on $D$ which satisfy $h(z_0)\\leq1$. If $K_\\zeta(z)$ is the Martin kernel for $D$ relative to $z_0$, $K(\\zeta_0)=1$ for all $\\zeta$ in the Martin boundary $\\Delta_1$, then \\[H_{z_0}(z)=\\sup\\{H_\\zeta(z):z\\in D, \\zeta\\in\\Delta_1\\}.\\] In particular for $D$ the unit disc, the boundary $\\Delta_1$ may be identified with the unit circle $\\mathbb{T}$ and, if $z_0=0$, then $K_\\zeta(z)$ is the Poisson kernel with pole at $\\zeta\\in T$. In this case, $K_\\zeta=H_0$ along the radius to $\\zeta$. Using the Riemann mapping functions, this property may be described for simply connected $D$ as follows: for each $\\zeta\\in \\Delta_1$, $K_\\zeta$ touches $H_{z_0}$ along a Green line for $D$ issuing from $z_0$. Does this property continue to hold for $D$ multiply connected? (M. Arsove and G. Johnson)"
