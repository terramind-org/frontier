title: Kourovka Notebook Problem 11.48
field: mathematics
tier: prose
statement: |-
  Is the commutator $[x,
  y, y, y, y, y, y]$ a product of fifth powers in the free
  group $\left< x,y\right>$? If not, then the Burnside group
  $B(2,5)$ is infinite.
