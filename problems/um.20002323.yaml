title: Cone spectra for totally categorical theories in infinite unary languages
field: mathematics
tier: prose
statement: |-
  **1.12. Spectrum of totally categorical theories (Andrews).**
  **Definition.** \(\operatorname{Spec}(T)=\{\mathbf d:\text{ there is a model of }T\text{ computable in }\mathbf d\}.\)
  **Conjecture 21.** If \(T\) is totally categorical then \(\operatorname{Spec}(T)\) is a cone.
  This is true in a finite language.
