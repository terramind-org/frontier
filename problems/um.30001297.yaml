title: Brauer–Manin Conjecture for K3 Surfaces
field: mathematics
tier: prose
statement: For every K3 surface $X$ over a number field $k$, is $X(k)$ dense in its Brauer–Manin set of adelic points? Equivalently, is the Brauer–Manin obstruction the only obstruction to the Hasse principle and weak approximation on $X$?
