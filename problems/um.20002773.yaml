title: A degreewise torsion detector for Iwahori IC stalks
field: mathematics
tier: prose
statement: |-
  Fix the affine Grassmannian \(Gr\) and its stratification by orbits of an
  Iwahori subgroup \(I\). For which primes \(p\) do all integral intersection
  cohomology objects
  \[
  \mathrm{IC}_y(\mathcal O)\in\operatorname{Perv}_I(Gr,\mathcal O),
  \]
  one for each \(I\)-orbit closure \(\overline{Gr_y}\), have torsion-free
  stalk cohomology?
