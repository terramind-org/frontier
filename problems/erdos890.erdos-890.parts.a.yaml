  module: FormalConjectures.ErdosProblems.«890»
  decl: Erdos890.erdos_890.parts.a
  statement: |-
    theorem erdos_890.parts.a :
        ∀ k ≥ 1, liminf (fun n ↦ (∑ i ∈ range k, (ω_gt k (n + i) : EReal))) atTop ≤ k
  context:
    - open Erdos890
