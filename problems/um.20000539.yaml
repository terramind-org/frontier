title: The critical logarithmic endpoint model
field: mathematics
tier: prose
statement: |-
  **Question 12 (Guo).** Prove that there is a universal constant $C>0$
  such that, for every $0<\varepsilon<1/2$,
  \[
  \left\|\sup_{\lambda\in\mathbb R}
  \left|\operatorname {p.v.}\!\int_{\mathbb R}
  f(x-t)e^{i\lambda |t|^\varepsilon}\,\frac{dt}{t}\right|
  \right\|_{L^2(\mathbb R)}
  \le C\|f\|_{L^2(\mathbb R)}. \tag{Q12}
  \]
