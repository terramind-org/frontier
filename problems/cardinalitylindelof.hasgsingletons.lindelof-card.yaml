lean:
  module: FormalConjectures.Paper.CardinalityLindelof
  decl: CardinalityLindelof.HasGδSingletons.lindelof_card
  statement: |-
    theorem HasGδSingletons.lindelof_card :
        ∃ (X : Type) (_ : TopologicalSpace X),
          T35Space X ∧ HasGδSingletons X ∧ LindelofSpace X ∧ 𝔠 < #X
