statement: For an Artin braid group $B_n$, does deformation $K$-theory satisfy $K_{\mathrm{def}}(B_n)\cong H_*(\operatorname{Irr}(B_n))$? Is the deformation $K$-theory of $B_n$ isomorphic to its complex topological $K$-theory?
