id: um.30003395
title: Optimal Minimal Dispersion in High Dimensions
field: mathematics
tier: prose
statement: |-
  For the minimal dispersion $\operatorname{disp}^*(n,d)$ of $n$ points in $[0,1]^d$, can one improve
  $$
  \operatorname{disp}^*(n,d)\leq\min\left\{\frac{c_1d}{n},\frac{c_2d\log(n/d)}{n}\right\},
  $$
  and in particular prove $\operatorname{disp}^*(n,d)\leq cd/n$ for $n\geq d$? Can one also improve
  $$
  \operatorname{disp}^*(n,d)\geq\frac{\log_2d}{4(n+\log_2d)}
  $$?
