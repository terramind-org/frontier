lean:
  module: FormalConjectures.ErdosProblems.«602»
  decl: Erdos602.erdos_602
  statement: |-
    theorem erdos_602 :
        ∀ {α : Type*} {I : Type*} (A : I → Set α),
          (∀ i, (A i).Countable ∧ (A i).Infinite) →
          (∀ i j, i ≠ j → (A i ∩ A j).Finite) →
          (∀ i j, i ≠ j → Set.ncard (A i ∩ A j) ≠ 1) →
          HasPropertyB I A
  context:
    - open Erdos602
    - open Set
  definitions:
    - name: Erdos602.HasPropertyB
      kind: def
      text: |-
        /-- A family `(A_i)_{i ∈ I}` of subsets of `α` has **Property B** if there exists
        a 2-colouring `f : α → Fin 2` such that no `A_i` is monochromatic. -/
        def HasPropertyB {α : Type*} (I : Type*) (A : I → Set α) : Prop :=
          ∃ f : α → Fin 2, ∀ i, ¬IsMonochromatic f (A i)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/602.lean#L54
