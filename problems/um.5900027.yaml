title: CMC Graphs Spanning Convex Planar Curves
field: mathematics
tier: prose
statement: If a convex planar curve $\Gamma$ has length less than $2\pi$, does it bound a graph of constant mean curvature one? Determine the volume threshold $V(\Gamma)$ below which any CMC spanning surface is a graph, and decide whether the disk threshold for a unit circle remains valid for higher topology.
