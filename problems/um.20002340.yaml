title: Finite-fiber Diophantine coding and a degree-at-infinity obstruction
field: mathematics
tier: prose
statement: |-
  **Question 3 (Demeyer).** Consider the ring \(\mathbb F_q[W,Z]\). Does there exist a Diophantine predicate \(\alpha(f,\vec g)\), with \(f\in\mathbb F_q[W,Z]\) and \(\vec g\in\mathbb F_q[Z]^n\), such that

  1. for every \(f\in\mathbb F_q[W,Z]\), there is \(\vec g\in\mathbb F_q[Z]^n\) for which \(\alpha(f,\vec g)\) holds; and
  2. for every \(\vec g\in\mathbb F_q[Z]^n\), the set
     \[
     \{f\in\mathbb F_q[W,Z]:\alpha(f,\vec g)\}
     \]
     is finite?

  This will imply that r.e. = Diophantine for \(\mathbb F_q[W,Z]\). It is possible to give such a predicate if “\(\alpha(\cdots)\) holds” is replaced by “\(\alpha(\cdots)\) does not hold.”
