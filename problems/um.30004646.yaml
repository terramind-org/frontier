title: Motivic Realization of Rigid Local Systems
field: mathematics
tier: prose
statement: Let $X$ be a connected smooth quasi-projective variety over $\mathbb C$ with a smooth projective normal-crossing compactification, and let $\rho:\pi_1^{\mathrm{top}}(X,x)\to\operatorname{GL}_n(\mathbb C)$ be irreducible, rigid, and quasi-unipotent along the boundary. After restriction to a dense open subset $U\subseteq X$, must $\rho$ occur as a summand of $R^mf_*\mathbb C$ for a smooth projective family $f:Y\to U$?
