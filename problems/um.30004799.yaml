statement: For the local packet $\Pi^{\theta(\psi)}_v(G_v)$ attached to an Arthur parameter, prove the endoscopic character identities. At Archimedean places $v$, is the packet independent of the auxiliary group, and does it agree with Arthur's packet in the quasi-split case?
