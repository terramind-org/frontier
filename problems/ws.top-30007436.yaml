  \section*{Planar Schrodinger convergence at H one-third}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every f in $H^{1/3}(R^2)$, does its Schrodinger evolution, interpreted as the limit of Gaussian frequency regularizations, admit a representative converging to f almost everywhere as time decreases to zero?
  \subsection{Short English statement}
  For every f in $H^{1/3}(R^2)$, does its Schrodinger evolution, interpreted as the limit of Gaussian frequency regularizations, admit a representative converging to f almost everywhere as time decreases to zero?
