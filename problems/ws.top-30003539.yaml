title: Sharp Exponents in the Fourier Restriction Conjecture
field: mathematics
tier: prose
statement: |-
  \section*{\texorpdfstring{Sharp Exponents in the Fourier Restriction Conjecture}{Sharp Exponents in the Fourier Restriction Conjecture}}\label{30003539}
  \subsection{Definitions and mathematical statement}
  For a Schwartz function on ${\mathbb{R}}^d$, set $\widehat f(\xi)=\int f(x)e^{-2\pi i x\cdot\xi}\,dx$, and let $d\sigma$ be surface measure on $S^{d-1}$. The restriction estimate is
  \[
   \|\widehat f|_{S^{d-1}}\|_{L^q(d\sigma)}\le C_{d,p,q}\|f\|_{L^p({\mathbb{R}}^d)}.
  \]
  In the usual range $1\le p,q<\infty$, the conjectured non-endpoint range is $p<2d/(d+1)$ and $q\le (d-1)p'/(d+1)$, with $p'=p/(p-1)$ and the usual interpretation at $p=1$. The full target asks for the sharp range in every $d\ge2$; endpoint conventions should be taken from the source, rather than inferred from a schematic inequality.
  \par\smallskip\textit{Formulation and concept references:} \href{https://cm.episciences.org/13778/pdf}{[S1]}.

  \subsection{Short English statement}
  Does Fourier restriction to a sphere satisfy every norm estimate allowed by the standard sharp necessary conditions?
  \subsection{Sources}
  \begin{itemize}
  \item[S1]Diogo Oliveira e Silva, Communications in Mathematics 32 (2024).
  \url{https://cm.episciences.org/13778/pdf}.
  \textit{Formulation source.}
  \item[S2]Smooth Alpert frames, version 5.
  \url{https://arxiv.org/abs/2311.03145v5}.
  \textit{Further reference; not a proof endorsement.}
  \item[S3]A probabilistic analogue of the Fourier extension conjecture.
  \url{https://arxiv.org/abs/2311.03145}.
  \textit{Further reference; not a proof endorsement.}
  \item[S4]A survey of Stein's restriction conjecture.
  \url{https://mathematics.stanford.edu/events/survey-steins-restriction-conjecture}.
  \textit{Further reference; not a proof endorsement.}
  \end{itemize}
