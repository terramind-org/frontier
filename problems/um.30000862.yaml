title: Invariant Distribution Sheaves for Rank-One Lie Groups
field: mathematics
tier: prose
statement: Let $G$ be a connected simple real-rank-one Lie group, let $P=MAN$ be a minimal parabolic subgroup, and let $U\subset N$ be connected. For a generic principal-series induction parameter, the space of $U$-invariant distribution vectors is the space of global sections of a sheaf on an auxiliary manifold $Z_U$. Is this sheaf canonically isomorphic to the sheaf of distributional sections of a suitable vector bundle over $Z_U$?
