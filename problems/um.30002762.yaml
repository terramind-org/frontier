title: Finitely Presented Counterexamples for Conjugation-Invariant Norms
field: mathematics
tier: prose
statement: Does there exist a finitely presented group $G$, generated by a finite union of conjugacy classes and equipped with the associated conjugation-invariant word norm, such that either some cyclic subgroup is neither bounded nor undistorted, or some cyclic subgroup is neither bounded nor detected by a homogeneous quasimorphism?
