title: The scale-invariant stability functional and factor-splitting instability
field: mathematics
tier: prose
statement: |-
  Given a hypersurface $M\subset \mathbb{R}^{n+1}$, define
  $$F(M,x_0,t_0)=(4\pi t_0)^{-\frac n 2} \int_M e^{-\frac{|x-x_0|^2}{4t_0}} dH^{n},$$
  $$\lambda(M) = \sup_{(x_0,t_0)} F(M,x_0,t_0).$$
  Question: Is there a useful notion of $\mu$-stability for Ricci Flow self-shrinkers analogous to Colding-Minicozzi for the $\lambda$ entropy in mean curvature flow? What are the stable solitons?
