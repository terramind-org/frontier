title: Open Problems in Topological Algebra — Problem 8 (Protasov)
field: mathematics
tier: prose
statement: |-
  Can every non-discrete topological group $G$ be algebraically
  generated by a nowhere dense subset? (The answer to Problem 6 is ``No'': under CH the topological group $\mathbb{R}^{\omega_1}$ contains a dense non-separable subgroup $G$ such that each meager subset of $G$ generates a metrizable separable subgroup of $G$; see Proposition 13.8 in [I.Protasov, T.Banakh. Ball stuctures and colorings of graphs and groups // (Mat. Stud. Monograph Series. 11), VNTL Publ. 2003, 148p.])
