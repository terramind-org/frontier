title: A birational I2(4)-diamond conjugacy and an obstruction for the A-row fiber
field: mathematics
tier: prose
statement: |-
  **Problem 3.6.** Relate both sides of the \(L\) identities under promotion, and both sides of the \(J\) identities under (birational) promotion/rowmotion.

  8--9. Its exact question is:

  Here \(\mathcal L(P)\) is the set of linear extensions and \(\mathcal J(P)\) the set of order ideals. The four rows of Theorem 3.4 immediately preceding the problem are labelled \(A,B,H,I\). To avoid relying on the missing fonts, write

  \[
   R_n=[n]\times[n],\qquad
   S_n=J([2]\times[n-1]),\qquad
   Q_m=J^{m-2}([2]\times[2])\quad(m\geq2). \]

  This normalization agrees with the sizes in Theorem 3.4:
  \(|S_n|=n(n+1)/2=|\Phi^+(A_n)|\),
  \(|S_5|=15=|\Phi^+(H_3)|\), and
  \(|Q_m|=2m=|\Phi^+(I_2(2m))|\). The theorem being refined is

  \[
  \begin{aligned}
  |\mathcal L(\Phi^+(A_n))|
   &=2^{n(n-1)/2}|\mathcal L(S_n)|,\\
  2^n|\mathcal J(\Phi^+(A_n)\times[k])|
   &=|\mathcal J(S_n\times[2k+1])|;\\
  |\mathcal L(\Phi^+(B_n))|&=|\mathcal L(R_n)|,
  &|\mathcal J(\Phi^+(B_n)\times[k])|&=|\mathcal J(R_n\times[k])|;\\
  |\mathcal L(\Phi^+(H_3))|&=|\mathcal L(S_5)|,
  &|\mathcal J(\Phi^+(H_3)\times[k])|&=|\mathcal J(S_5\times[k])|;\\
  |\mathcal L(\Phi^+(I_2(2m)))|&=|\mathcal L(Q_m)|,
  &|\mathcal J(\Phi^+(I_2(2m))\times[k])|&=|\mathcal J(Q_m\times[k])|. \end{aligned}
  \]
