title: Conjecture 3.1 — Suppose that b = 0 (Σ is closed).
field: mathematics
tier: prose
statement: Suppose that b = 0 (Σ is closed). For each integer 1≤k≤ 2g +b− 2, the ModΣ-action on the component e−1(2− 2g +b +k) of Hom(π,G ) is ergodic. When b = 0, the component e−1(3− 2g) ≈ Σ× R6g−8 represents a 6 g− 6-dimensional thickening of Σ, upon which ModΣ acts. However, Morita [ 81] showed that ModΣ cannot act smoothly on Σ itself inducing the homomorphism Diﬀ(Σ) −→ ModΣ. (Recently Markovic [ 80] has announced that if Σ is a closed surface of genus > 5, then ModΣ cannot even act on Σ by homeomorphisms inducing Homeo(Σ) −→ ModΣ.)
