title: Hyperbolic Cubulability, Residual Finiteness, and Local Medianity
field: mathematics
tier: prose
statement: If every infinite-order element of a hyperbolic group has unbounded orbits in some cobounded cubical action with quasiconvex hyperplane stabilizers, must the group be cocompactly cubulable or at least a-T-menable? If a hyperbolic group acts properly and cocompactly on a finite-rank median space, must it be residually finite or linear? If a complete simply connected path-metric space is locally median with no uniform radius, must it be globally median?
