title: Effective Surface Cone of Principally Polarized Abelian Threefolds
field: mathematics
tier: prose
statement: |-
  Is the cone $\operatorname{Eff}_2(\mathcal A_3)$ of effective surfaces on the toroidal compactification of the moduli space of principally polarized abelian threefolds equal to
  $$
  \mathbb R_{\geq0}S_A+\mathbb R_{\geq0}S_F+\mathbb R_{\geq0}S_D+\mathbb R_{\geq0}\sigma_{K3+1}+\mathbb R_{\geq0}\sigma_{C4}
  $$
  ?
