statement: |-
  \section*{The separable quotient assertion under CH}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Assuming the Continuum Hypothesis, must every infinite-dimensional real or complex Banach space admit a quotient by a closed linear subspace that is infinite-dimensional and separable?
  \subsection{Short English statement}
  Assuming the Continuum Hypothesis, must every infinite-dimensional real or complex Banach space admit a quotient by a closed linear subspace that is infinite-dimensional and separable?
