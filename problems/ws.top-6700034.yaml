  \section{\texorpdfstring{Scalar Curvature Question [?35]: Bound on the Filling Radius forSc $\geq\sigma$ > 0}{Scalar Curvature Question [?35]: Bound on the Filling Radius forSc ≥σ > 0}}\label{6700034}
  {\small UnsolvedMath ID 6700034 · Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $X$ be a complete Riemannian $n$-manifold with scalar curvature bounded below by a positive constant. Does there exist a constant $C_n$, depending only on dimension, such that its filling radius satisfies
  \[\operatorname{FillRad}(X)\leq C_n\bigl(\inf_{x\in X}\operatorname{Sc}(x)\bigr)^{-2}?\]
  The filling radius measures the neighborhood size needed to fill the fundamental cycle after the metric-space embedding used in its definition.
  The catalogue transcription gives exponent $-2$; the cited original is needed to determine whether this exponent is correct.
  \par\smallskip\textit{Formulation references:} \sref{6700034}{1}, \sref{6700034}{2}.
