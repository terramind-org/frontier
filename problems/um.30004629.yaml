title: Simultaneous Regularization of Cremona Subgroups
field: mathematics
tier: prose
statement: Let $G$ be a finitely generated subgroup of the plane Cremona group such that every element of $G$ is regularizable. Must $G$ itself be regularizable, equivalently conjugate to a subgroup of the automorphism group of a surface? Equivalently, must its locally elliptic action on the blow-up complex be globally elliptic?
