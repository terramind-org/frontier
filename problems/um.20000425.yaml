title: A semisimple-unipotent reduction for the torsion field of J(X(ell))
field: mathematics
tier: prose
statement: |-
  **14. (C. Hall)** Let \(X(\ell)\) be a modular curve. What can we say about the splitting field of the \(\ell\)-torsion of the Jacobian \(J(X(\ell))\)?

  **Comment.** This is needed to speak about the \(L\)-function of \(E\to X(\ell)\) (mod \(\ell\)) in \(\mathbf F_\ell[T]\).
