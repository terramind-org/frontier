title: Power concavity and mode curvature of symmetric stable densities
field: mathematics
tier: prose
statement: |-
  For \(0<\alpha\le2\), let \(Y_\alpha\) have characteristic function \(e^{-|t|^\alpha}\) and density \(f_\alpha\). Prove that \(f_\alpha\) is \(s_\alpha\)-concave, in the standard non-strict sense, for some \(s_\alpha<0\), and prove \(f_\alpha''(0)<0\) at its mode.

  Its problem field is preserved exactly:

  Taken literally, the definition is impossible: at \(\lambda=0\), or whenever \(x=y\), its two sides are equal. The standard definition uses \(\ge\), as in Han and Wellner (2016). The displayed delimiters and parentheses on the live page are balanced; the missing item is the equality bar in the comparison sign, not a bracket.

  Two further hypotheses must be restored.

  1. The function \(t\mapsto e^{-|t|^\alpha}\) is a characteristic function precisely in the stable range \(0<\alpha\le2\). That is the range used below.
  2. “Curvature at the mode is negative” is read as \(f''(m)<0\). At a stationary point this also says that the signed curvature of the graph is negative, and it is equivalent in sign to \((\log f)''(m)<0\).

