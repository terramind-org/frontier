statement: |-
  b) Do there exist local
  Fitting classes which are decomposable into a non-trivial product
  of Fitting classes and in every such a decomposition all factors
  are non-local? \ For the definition of the *product* of
  Fitting classes see (N. T. Vorob'\"ev, *Math. Notes*, **43**, no. 2 (1988), 91--94).

  [Archived solved part(s) of 11.25:]
  a) Does there exist a local
  product (different from the class of all finite groups and from the
  class of all finite soluble groups) of Fitting classes each of which
  is not local and is not a formation? See the definition of the *product* of Fitting classes in (N. T. Vorob'ev, *Math.
  Notes*, **43**, No 1--2 (1988), 91--94).
