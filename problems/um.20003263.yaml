title: Wall avoidance, root detection, and gaps between local-rigidity hypotheses
field: mathematics
tier: prose
statement: |-
  **Conjecture 2.** If in Conjecture 1 the group \(A\) is not contained in a
  wall of a Weyl chamber of the split Cartan subgroup \(D\), then any
  \(C^1\)-small perturbation of the action of \(A\) on \(G/\Gamma\) is
  \(C^\infty\)-conjugate to the action of \(A\) defined by a continuous
  homomorphism from \(A\) to \(D\).

  Its preceding paragraph is Conjecture 1, and the
  damaged record is:

  Thus “Conjecture 1 the” must be replaced by “Conjecture 2. If in Conjecture 1”. Conjecture 1 assumes \(G\) connected
  semisimple, \(\Gamma<G\) an irreducible lattice, \(D<G\) a split Cartan, and
  \(A<D\) closed with \(\dim A>1\). The PDF immediately says Katok--Spatzier
  proved Conjecture 2 when \(A=D\).
