title: Degree Definability and Existential Theory of Rational Function Fields
field: mathematics
tier: prose
statement: Is the relation $E$ on $\mathbb C[t]$, defined by $E(f,g)$ if and only if $\deg(f)=\deg(g)$, Diophantine or definable in the ring language with parameters? For a fixed prime $p$, is the existential theory of $\mathbb F_p(t)$ in the ring language decidable?
