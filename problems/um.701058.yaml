title: Kourovka Notebook Problem 14.73
field: mathematics
tier: prose
statement: |-
  *Conjecture:* There is a function $f$ on
  the natural numbers such that, if $\Gamma$ is a finite,
  vertex-transitive, locally-quasiprimitive graph of valency $v$,
  then the number of automorphisms fixing a given vertex is at most
  $f(v)$. (By definition, a vertex-transitive graph $\Gamma$ is *locally-quasiprimitive* if the stabilizer in $Aut(\Gamma)$ of a
  vertex $\alpha$ is quasiprimitive (see 14.46) in its action on the
  set of vertices adjacent to $\alpha$.)

  To prove the conjecture above one need only
  consider the case where $Aut(\Gamma)$ has the property that every
  non-trivial normal subgroup has at most two orbits on vertices
  (C. E. Praeger, *Ars Combin.*, **19 A** (1985),
  149--163). The analogous conjecture for finite, vertex-transitive,
  locally-primitive graphs was made by R. Weiss in 1978 and is
  still open. For non-bipartite graphs, there is a ``reduction'' of
  Weiss' conjecture to the case where the automorphism group is
  almost simple (see 14.46 for definition) (M. Conder, C. H. Li,
  C. E. Praeger, *Proc. Edinburgh Math. Soc. (2)*, **43**,
  no. 1 (2000), 129--138).

  *Comment of 2013:*
  These conjectures have been proved in the case where there is an upper bound on the degree of any alternating group occurring as a quotient of a subgroup (C. E. Praeger, L. Pyber, P. Spiga, E. Szab\'{o},
  *Proc. Amer. Math. Soc.*, **140**, no. 7 (2012), 2307--2318). *Comment of 2021:*
  This has been proved in the case where the group induced on the neighbourhood of a vertex has an abelian regular normal subgroup (P. Spiga, *Bull. London Math. Soc.*, **48**, no. 1 (2016), 12--18.)
