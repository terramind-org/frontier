id: um.30002041
title: Cellular Resolutions for Consistent Toric Algebras
field: mathematics
tier: prose
statement: Let $X$ be an $n$-dimensional Gorenstein affine toric variety, let $\mathcal E=(E_0,\ldots,E_r)$ be rank-one reflexive sheaves, and set $A=\operatorname{End}_{\mathcal O_X}(\bigoplus_i E_i)$. If $A$ is a consistent toric algebra of global dimension $n$, does its higher quiver exist, and is the minimal projective $(A,A)$-bimodule resolution the cellular resolution encoded by that higher quiver?
