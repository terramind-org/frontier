title: Kourovka Notebook Problem 14.78
field: mathematics
tier: prose
statement: |-
  Suppose that ${\mathfrak{H}}\subseteq {\mathfrak{F}}_{1}\subseteq {\mathfrak{M}}$ \ and \ ${\mathfrak \ H} \subseteq {\mathfrak{F}}_{2}\subseteq {\mathfrak{M}}$ where ${\mathfrak{H}}$ and ${\mathfrak{M}}$ are
  local formations of finite groups and ${\mathfrak{F}}_{1}$ is a
  complement for ${\mathfrak{F}}_{2}$ in the lattice of all formations
  between ${\mathfrak{H}}$ and $ {\mathfrak{M}}$. Is it true that ${\mathfrak{F}}_{1}$ and ${\mathfrak{F}}_{2}$ are local formations? This is true in
  the case ${\mathfrak{H}}=(1)$.
