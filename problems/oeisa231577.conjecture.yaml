  definitions:
    - name: OeisA231577.a
      kind: def
      text: |-
        /-- Number of ways to write $n = x + y$ ($x, y > 0$) with $2^x + y(y+1)/2$ prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.Ico 1 n,
            let y := n - x
            if (2 ^ x + y * (y + 1) / 2).Prime then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/231577.lean#L33
