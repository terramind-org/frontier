statement: For the infinite group $G$ acting on the finite quotients $(\theta-1)^n\Gamma/(\theta-1)^{n+e}\Gamma$ arising from constructible $p$-groups of maximal class, develop computational methods to determine its orbits as $n$ and $e$ vary.
