lean:
  module: FormalConjectures.OEIS.«182510»
  decl: OeisA182510.conjecture2
  statement: |-
    theorem conjecture2 :
        ∀ᶠ n in Filter.atTop,
          ((Finset.range n).filter (fun k => a k < 0)).card <
            ((Finset.range n).filter (fun k => 0 < a k)).card
  context:
    - open OeisA182510
  definitions:
    - name: OeisA182510.a
      kind: def
      text: |-
        /-- Defining recurrence for $a(n)$. -/
        def a : ℕ → ℤ
          | 0 => 0
          | 1 => 1
          | n + 2 => Int.xor (a (n + 1)) (n + 2 : ℤ) - a n
