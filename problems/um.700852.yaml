title: Kourovka Notebook Problem 12.33
field: mathematics
tier: prose
statement: |-
  Suppose that $G$ is a finite group and $x$ is an
  element of $G$ such that the subgroup $\left< x,y\right>$ has odd
  order for any $y$ conjugate to $x$ in $G$. Prove, without using
  CFSG, that the normal closure of $x$ in $G$ is a group of odd
  order.
