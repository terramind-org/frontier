title: First variation of the real-dimensional Cohn--Elkies radius problem
field: mathematics
tier: prose
statement: |-
  **Recovered problem.** For real \(d>0\), define \(A_-(d)\) as the infimum of the last-sign radius over normalized radial Schwartz profiles, using the dimension-\(d\) Fourier--Bessel transform. Determine \(A_-(2)\), study regularity of \(d\mapsto A_-(d)\), and prove or disprove the numerically conjectured derivatives at \(d=8\) and \(d=24\).

  Its problem text is:

  There is one obvious transcription error: “minimum or \(r\)” means “minimum of \(r\).” There is also a substantive compactness issue: an optimizer is not known to exist in the strict Schwartz class for every dimension. Accordingly the safe recovered statement replaces *minimum* by *infimum*:

  Only the phrase “minimum or \(r\)” is silently repaired to “minimum of \(r\)” when quoting a recovered grammatical reading. The further change from minimum to infimum is explicitly declared and is not attributed to the source.
