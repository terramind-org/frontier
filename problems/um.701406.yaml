title: Kourovka Notebook Problem 17.104
field: mathematics
tier: prose
statement: |-
  Let $\Gamma$ be a finite non-oriented graph on
  the set of vertices $\{x_1,\dots,x_n\}$ and let
  $S_\Gamma=\langle x_1,\dots,x_n\mid x_ix_j=x_jx_i \Leftrightarrow
  (x_i,x_j) \in \Gamma;\; {\mathfrak{A}}^2\rangle$ be a presentation of
  a partially commutative metabelian group $S_\Gamma$ in the variety
  of all metabelian groups. Is the universal theory of the group
  $S_\Gamma$ decidable?
