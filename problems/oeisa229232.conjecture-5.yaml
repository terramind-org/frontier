  statement: |-
    theorem conjecture_5 (F : Type*) [Field F] [Fintype F] (hF : Fintype.card F > 7) :
        let m := Fintype.card F - 1
        ∃ b : Fin m ≃ Fˣ,
          ∀ i : Fin m, IsPrimitiveRoot
            ((b i : F) * (b ⟨(i.val + 1) % m, Nat.mod_lt _ (by omega)⟩ : F) + 1) m
