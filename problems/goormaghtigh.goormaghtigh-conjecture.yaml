lean:
  module: FormalConjectures.Wikipedia.Goormaghtigh
  decl: Goormaghtigh.goormaghtigh_conjecture
  statement: |-
    theorem goormaghtigh_conjecture (N : ℕ) (hN : IsGoormaghtighNumber N) :
        N = 31 ∨ N = 8191
  context:
    - open Goormaghtigh
  definitions:
    - name: Goormaghtigh.IsGoormaghtighNumber
      kind: def
      text: |-
        /-- A number having repunit representations of at least three digits in two distinct bases. -/
        def IsGoormaghtighNumber (N : ℕ) : Prop :=
          ∃ base₁ base₂ digits₁ digits₂ : ℕ,
            2 ≤ base₁ ∧ 2 ≤ base₂ ∧ base₁ ≠ base₂ ∧
              3 ≤ digits₁ ∧ 3 ≤ digits₂ ∧
                repunit base₁ digits₁ = N ∧ repunit base₂ digits₂ = N
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/Goormaghtigh.lean#L41
