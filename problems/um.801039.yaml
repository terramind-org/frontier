title: Open Problems in Mathematical Logic — Problem 51 (The hf/hf problem)
field: mathematics
tier: prose
statement: |-
  Analogous to the above, we call a countable Borel equivalence relation *hyperfinite-over-hyperfinite* (or shortly, *hf/hf*) if there is a Borel partial order $\leq$ on $X$ such that

  - if $x \leq y$, then $x E y$,

  - the order type of $\leq \upharpoonright_{[x]}$ is a suborder of $\mathbb{Z}^2$.

  If $E$ is hf/hf, is it hyperfinite?
