title: Foliations and Diffeomorphism Groups — Question 4
field: mathematics
tier: prose
statement: Let $(\xi_-, \xi_+)$ be a pair of cooriented contact structures with opposite signs on $M$, and assume that there exists a vector field $Z$ transverse to both $\xi_-$ and $\xi_+$, and that both of $\xi_-$ and $\xi_+$ are tight. Does $M$ admit a cooriented *Reebless* $C^0$-foliation?
