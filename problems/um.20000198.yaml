title: Canonical curves versus plane differential signatures
field: mathematics
tier: prose
statement: |-
  “From a differential geometry perspective we can assign invariants to a smooth curve or surface. This allows us to assign a signature curve to each curve.”

  **Problem 3.3.** What is the signature curve of a general canonical curve?

  Interpret “signature curve” as the Kogan--Olver rational differential signature of a **plane** algebraic curve, most naturally for the \(\operatorname{PGL}(3)\)-action. Interpret “canonical curve” in its standard algebraic-geometric sense, namely the canonical image of a smooth nonhyperelliptic curve.
