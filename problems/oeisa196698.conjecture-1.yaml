  module: FormalConjectures.OEIS.«196698»
  decl: OeisA196698.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : 1 ≤ n) : 0 < a n"
  context:
    - open OeisA196698
  definitions:
    - name: OeisA196698.a
      kind: def
      text: |-
        /-- Number of primes of the form $3^n \pm 3^k \pm 1$ with $0 \le k < n$. -/
        def a (n : ℕ) : ℕ :=
          let p3n := 3 ^ n
          (Finset.range n).biUnion (fun k =>
            let p3k := 3 ^ k
            { p3n + p3k + 1,
              p3n + p3k - 1,
              p3n - p3k + 1,
              p3n - p3k - 1 }
          )
          |>.filter Nat.Prime
          |>.card
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/196698.lean#L33
