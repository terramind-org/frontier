title: Mapping-Class Orbit Counting in the Thurston Metric
field: mathematics
tier: prose
statement: For $x,y$ in Teichmüller space, determine as $R\to\infty$ the number of points in the mapping-class-group orbit of $y$ lying in the Thurston-metric ball of radius $R$ about $x$. How is this asymptotic related to orbit counting by extremal length rather than hyperbolic length?
