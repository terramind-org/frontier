title: Extensions of the Braid Conley Index
field: mathematics
tier: prose
statement: For the braid Conley index, which braid-group data suffice to compute the index? What is the smallest discretization for which a relative braid class has a single component? When does the index contain more dynamical information than the braid class alone? Does the theory extend to general fourth-order conservative equations?
