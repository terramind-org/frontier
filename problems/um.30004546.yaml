title: Bott–Chern and Aeppli Cohomology for Almost-Complex Manifolds
field: mathematics
tier: prose
statement: For an almost-complex manifold, which Bott–Chern and Aeppli cohomology groups complete the vertical row of the Dolbeault–de Rham diagram while recovering the classical integrable case, respecting the natural maps and spectral sequences, carrying a real structure, and possessing the expected algebra and module structures?
