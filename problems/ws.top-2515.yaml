  \item[\hypertarget{source:statement:2}{S2}] A. O. Asar, Problem 21.6, in E. I. Khukhro and V. D. Mazurov (eds.), \emph{The Kourovka Notebook: Unsolved Problems in Group Theory}, 21st edition, arXiv:1401.0300v48 (6 October 2026). See also source definitions in Problems 15.23. \url{https://arxiv.org/abs/1401.0300v48}.
