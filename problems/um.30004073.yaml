title: Soliton Resolution for Randomized Mass-Subcritical NLS
field: mathematics
tier: prose
statement: Let $2/d<p<4/d$ and $\phi\in L^2(\mathbb{R}^d)$. For almost every $\omega$, does the solution of $i\partial_tu-\Delta u=|u|^pu$, $u(0)=\phi^\omega$, admit solitons $u_j(t,x)=e^{it a_j+i x\cdot k_j}\phi_j(x-c_jt)$ and a free profile $e^{-it\Delta}\phi$ such that $\left\|u(t)-\sum_j u_j(t)-e^{-it\Delta}\phi\right\|_{L^2(\mathbb{R}^d)}\to0$ as $t\to\infty$?
