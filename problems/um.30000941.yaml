title: Asymptotics for Nonstationary GARCH Estimators
field: mathematics
tier: prose
statement: "Consider two nonstationary GARCH specifications: an additive time-varying-parameter model formed by adding a directly time-dependent component to a GARCH variance equation, and a multiplicative model whose conditional variance is the product of stationary and nonstationary components. Determine the asymptotic properties of their maximum-likelihood estimators."
