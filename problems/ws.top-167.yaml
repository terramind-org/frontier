  \item[\hypertarget{source:statement:2}{S2}] Henry Cohn, Robert Kleinberg, Balázs Szegedy and Christopher Umans, \emph{Group-theoretic algorithms for matrix multiplication}, FOCS 2005, 379--388; arXiv:math/0511460v1, §4, Definition 4.1 and Conjecture 4.7. Replacing each source subset $B_i$ by its negative converts the difference-set convention into the displayed sum-set convention. \url{https://arxiv.org/abs/math/0511460}.
  \item[\hypertarget{source:statement:3}{S3}] Ben Green, \emph{100 Open Problems}, maintained author list, Problem 36 and its comments, accessed 7 October 2026. \url{https://people.maths.ox.ac.uk/greenbj/papers/open-problems.pdf}.
