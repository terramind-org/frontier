  \section{Rank Distribution in Quadratic-Twist Families}\label{30006472}
  {\small UnsolvedMath ID 30006472 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Fix an elliptic curve $E$ over a global field $K$, a norm $\operatorname{Nm}$ on $K$, and $j\geq0$. If $\mathcal{F}(X)$ is the set of quadratic extensions $K(\sqrt{d})/K$ with squarefree $d$ and $\operatorname{Nm}(d)\leq X$, determine the limit as $X\to\infty$ of the proportion for which $\operatorname{rk}E(K(\sqrt{d}))-\operatorname{rk}E(K)=j$.
  \par\smallskip\textit{Formulation references:} \sref{30006472}{1}, \sref{30006472}{2}.
  \subsection{Short English statement}
  Fix an elliptic curve $E$ over a global field $K$, a norm $\operatorname{Nm}$ on $K$, and $j\geq0$. If $\mathcal{F}(X)$ is the set of quadratic extensions $K(\sqrt{d})/K$ with squarefree $d$ and $\operatorname{Nm}(d)\leq X$, determine the limit as $X\to\infty$ of the proportion for which $\operatorname{rk}E(K(\sqrt{d}))-\operatorname{rk}E(K)=j$.
