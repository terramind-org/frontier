title: Grothendieck’s Section Conjecture
field: mathematics
tier: prose
statement: |-
  Let $X$ be a proper hyperbolic curve over a finitely generated extension $k/\mathbb Q$. Is the canonical map from $X(k)$ to the conjugacy classes of sections of

  $$1\to\pi_1^{\mathrm{et}}(X_{\bar k})\to\pi_1^{\mathrm{et}}(X)\to\operatorname{Gal}(\bar k/k)\to1$$

  a bijection?
