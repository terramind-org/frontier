title: Kourovka Notebook Problem 20.9
field: mathematics
tier: prose
statement: |-
  In the group algebra of a free group over a field, does every element whose
  support in the group has cardinality more than 1 generate a proper 2-sided ideal?

  This question is one of several related
  questions in (G. M. Bergman, *Commun. Algebra*, **49**, no. 9 (2021), 3760--3776).
