title: Simonovits–Sós and Sumner Tournament Conjectures
field: mathematics
tier: prose
statement: The Simonovits–Sós conjecture asserts that the largest triangle-intersecting families of graphs on a fixed $n$-vertex set are obtained by fixing a triangle and taking all graphs containing it. Sumner's Universal Tournament Conjecture asserts that every tournament on $2n-2$ vertices contains every directed tree on $n$ vertices.
