statement: |-
  \section*{Elliptic-square intersections of Hodge-generic curves in A2}\label{30007251}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For a reduced irreducible closed Hodge-generic Qbar-curve in A2, are only finitely many of its abelian surfaces isogenous to E x E for an elliptic curve E?
  \subsection{Short English statement}
  For a reduced irreducible closed Hodge-generic Qbar-curve in A2, are only finitely many of its abelian surfaces isogenous to E x E for an elliptic curve E?
