id: um.20002003
title: Positive tropicalization, cluster fans, and a finite wall-detection criterion
field: mathematics
tier: prose
statement: |-
  **Question.** What is the connection between the tropicalization of the totally positive part of a variety and the cluster algebra structure of the variety?

  **Background.** Speyer and Williams had described the tropicalization of the totally positive part of the Grassmannian \(G(k,n)\). For \(k=2\), the resulting fan is related to the type-\(A\) associahedron; for \(G(3,6)\) and \(G(3,7)\), the fans are related to the type-\(D_4\) and type-\(E_6\) associahedra. Scott had shown that the cluster algebra structures of \(G(2,n)\), \(G(3,6)\), and \(G(3,7)\) have the corresponding types.
