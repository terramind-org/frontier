title: Open Problems on Central Simple Algebras — Problem 3
field: mathematics
tier: prose
statement: |-
  In view of the fact that all known examples of non-crossed product algebras occur over fields of cohomological dimension at least 3, it is natural to ask:

  If $F$ has cohomological dimension at most 2, is every central simple $F$-algebra a crossed product?
