title: Simple Tops of Young Modules
field: mathematics
tier: prose
statement: For a partition $\lambda$ of $r$, is the top of the Young module $Y^\lambda$ simple if and only if there exists $n\geq\ell(\lambda)$ such that the indecomposable injective polynomial module $I_n(\lambda)$ is projective; equivalently, if and only if $\lambda$ belongs to the De Visscher–Donkin index set $\Lambda^{\mathrm{in}}$?
