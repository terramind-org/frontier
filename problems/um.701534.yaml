title: Kourovka Notebook Problem 18.106
field: mathematics
tier: prose
statement: |-
  Let $R$ be a group that acts coprimely on the finite group $G$.
  Let $p$ be a prime, let $P$ be the unique maximal $RC_{G}(R)$-invariant $p$-subgroup
  of $G$ and assume that $C_{G}(O_{p}(G)) \leq O_{p}(G)$.
  If $p>3$ then $P$ contains a nontrivial characteristic subgroup that is normal in $G$ (P. Flavell, *J. Algebra*, **257** (2002), 249--264). Does the same result hold for the primes 2 and 3?
