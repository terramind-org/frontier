title: "Henon Maps: Open Problems — Question 6"
field: mathematics
tier: prose
statement: |-
  Under this assumption, and in restriction to any open topological disc $D\subset \mathbb{R}^2$ that is compactly mapped inside itself, the dynamics is semi-conjugated to a (non-trivial) continuous map of a real tree. Other strong consequences can be derived (e.g., a closing lemma, or a description of zero entropy dynamics, see below). Using Wiman's theorem (in the same spirit like in [DL, MR3213832]), one can prove that H\'enon maps
  are mildly dissipative once $|b|<1/4$. In this way we obtain dynamical informations for *all* H\'enon maps
  having their Jacobian in $(-1/4,1/4)$ and not only for those satisfying $|b|\ll 1$.
  One expects that this property extends beyond the bound obtained through Wiman's theorem.

  Which real H\'enon maps $f_{c,b}$ are mildly dissipative?
  Is this property satisfied by all H\'enon maps with $|b|<1$?
