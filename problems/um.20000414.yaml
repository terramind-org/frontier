id: um.20000414
title: A d=9 exception and a CM-synchronization reduction
field: mathematics
tier: prose
statement: |-
  **Problem 5 (D. Ulmer).** Consider the curve
  \[
  C_{d,a}: y^d=x(x-1)(x-a)
  \]
  defined over \(\mathbf C\) (though \(\overline{\mathbf Q}\) or \(\mathbf F_q\) will also work). For which values of \(a\) does it happen that this curve has CM? (More precisely, for which values of \(a\) does the Jacobian of \(C_{d,a}\) have endomorphism algebra of dimension \(2g\) over \(\mathbf Q\), where \(g=g(C_{a,d})=d-1\) is the genus?) It happens (for dull reasons) when
  \[
  a=-1,\quad \frac12,\quad 2,\quad \zeta _6,\quad \zeta _6^{-1}.
  \]
  For a fixed \(d>7\), there are only finitely many values of \(a\) for which it happens. Are there infinitely many \(d\) such that there is another value of \(a\) (besides the trivial ones listed above) for which \(C_{d,a}\) has CM?
