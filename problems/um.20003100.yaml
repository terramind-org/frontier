title: Mirzakhani-typical recurrence and equidistribution of classical stretch lines
field: mathematics
tier: prose
statement: |-
  **Problem 2.10 (K. Rafi).** Is a stretch line typically recurrent/dense/
  equidistributed in moduli space?

  Rafi. Inspection of the
  original PDF gives the question

  First, the line break
  `e-quidistributed` means “equidistributed.”  Second, the sentence about
  Lenzhen and Masur is printed after a dotted separator and introduces Problem
  2.11, concerning pairs of Thurston geodesic rays; it is not part of Problem
  2.10.

  The source works with Teichmüller spaces of finite-type hyperbolic surfaces. The result below directly treats the closed case of genus at least two,
  which is the setting of the presently available ergodic stretch-flow
  theorem.
