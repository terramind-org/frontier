title: Linear Subspaces of Hereditarily Hypercyclic Vectors
field: mathematics
tier: prose
statement: For a hereditarily hypercyclic operator $T$, does $HC(T)$ contain the range of an injective bounded operator $S$? If so, is every linearly independent $n$-tuple in $\operatorname{Im}(S)$ hypercyclic for the direct sum $T\oplus\cdots\oplus T$?
