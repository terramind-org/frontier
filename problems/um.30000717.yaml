title: Gradient-Tentacle Certificates for Polynomial Nonnegativity
field: mathematics
tier: prose
statement: "Let $f\\in\\mathbb R[X_1,\\ldots,X_n]$, let $f^*=\\inf f(\\mathbb R^n)$, and let $J$ be generated by $X_j(\\partial f/\\partial X_i)-X_i(\\partial f/\\partial X_j)$ for $1\\leq i<j\\leq n$. Without assuming that $f^*$ is attained, are the following equivalent: $f\\geq0$ on $\\mathbb R^n$; $f\\geq0$ on $V(J)\\cap\\mathbb R^n$; $f\\in\\sum\\mathbb R[\\bar X]^2+\\sqrt J$; and $f+\\varepsilon\\in\\sum\\mathbb R[\\bar X]^2+J$ for every $\\varepsilon>0$?"
