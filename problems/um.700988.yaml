title: Kourovka Notebook Problem 14.3
field: mathematics
tier: prose
statement: |-
  Is it true that every central unit of the
  integral group ring of a finite group is a product of a central
  element of the group and a symmetric central unit? (A unit is *symmetric* if it is fixed by the canonical antiinvolution that
  transposes the
  coefficients at the mutually inverse elements.)
