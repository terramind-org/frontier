lean:
  module: FormalConjectures.GreensOpenProblems.«43»
  decl: Green43.green_43.variants.alon_peres
  statement: |-
    theorem green_43.variants.alon_peres :
        ∀ᶠ p : ℕ in atTop, p.Prime → ∀ A : Finset (ZMod p), A.card = p / 2 →
        ∃ n : ZMod p, ∀ L : ℕ, (p : ℝ) ^ (0.49 : ℝ) < (L : ℝ) → ¬ HasGap (Dilate n A) L
  context:
    - open Green43
    - open Green43.green_43
    - open Green43.green_43.variants
    - open Filter Topology
  definitions:
    - name: Green43.HasGap
      kind: def
      text: |-
        /-- A subset `A ⊆ ℤ/pℤ` has a *gap* of length `L` if there is a run of `L` consecutive residues
        none of which lie in `A`. -/
        def HasGap {p : ℕ} (A : Finset (ZMod p)) (L : ℕ) : Prop :=
          ∃ x : ZMod p, ∀ i : ℕ, i < L → x + (i : ZMod p) ∉ A
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/GreensOpenProblems/43.lean#L121
    - name: Green43.Dilate
      kind: def
      text: |-
        /-- Following Alon–Peres [AP92], a *dilation* of `A` by an integer `n` is the set
        `n A = {n x : x ∈ A}` (here in `ℤ/pℤ`, with `n` reduced modulo `p`). -/
        def Dilate {p : ℕ} (n : ZMod p) (A : Finset (ZMod p)) : Finset (ZMod p) :=
          A.image (fun x => n * x)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/GreensOpenProblems/43.lean#L126
