  \section{Dimension Gaps in Lattice Reductions to Learning with Errors}\label{30002730}
  {\small\sffamily UnsolvedMath ID 30002730 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A lattice generated by independent vectors $b_1,\ldots,b_d$ is $L=\{\sum_i z_i b_i:z_i\in\mathbb Z\}$. SVP seeks a shortest nonzero lattice vector; SIVP seeks $d$ independent short vectors, with approximation measured against the relevant successive minimum.

  Learning with errors gives noisy linear equations $b_i=\langle a_i,s\rangle+e_i\pmod q$ for a hidden vector $s$. Ring-LWE uses the analogous equations in a polynomial quotient ring, under specified sample and error distributions.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The approximation factors, error distribution, modulus, and precise source reductions are not specified by the dimension-only question.

  Source-record limitation: The reductions and all their quantitative promises other than a dimension comparison are absent.
  \paragraph{Statement recorded in the supplied source.}
  Can the discrepancy between the lattice dimensions in the quantum and classical reductions from GapSVP to learning with errors be removed or explained, namely dimension n for the quantum reduction versus order square-root-n for the classical reduction? \sref{30002730}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Resolve the dimension loss between the stated quantum and classical lattice-to-learning reductions.
