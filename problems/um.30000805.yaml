title: Optimal Adaptive Wavelet Schemes for Nonlinear Boundary Problems
field: mathematics
tier: prose
statement: For the nonlinear boundary-value problem $-\Delta u=F(u)$ in $\Omega$, with $u=0$ on $\partial\Omega$ and nonlinear $F:H_0^1(\Omega)\to H^{-1}(\Omega)$, can semiorthogonal spline wavelets be used to construct an adaptive scheme that evaluates the nonlinear terms and solves the equation with asymptotically optimal complexity?
