title: Polynomial-Rate Approximation of Stochastic Differential Equations
field: mathematics
tier: prose
statement: |-
  Consider
  $$
  dX(t)=\mu(X(t))\,dt+\sigma(X(t))\,dW(t),\qquad X(0)=x_0,
  $$
  on $[0,1]$. Under what assumptions on the drift $\mu$ and diffusion $\sigma$ does there exist a method using finitely many evaluations of $W$ that approximates $X(1)$ in absolute mean with a polynomial convergence rate?
