title: Foliations and Diffeomorphism Groups — Question 61
field: mathematics
tier: prose
statement: |-
  Consider the subgroup $R_1$ of $G_1$ which consists of rotations. For $n\in \mathbb{N}$, we put
  $R_n=p_n^{-1}(R_1)$. Then as a topological group, $R_1$ is isomorphic to $\mathbb{R}/\mathbb{Z}$;
  \[
  R_1\cong R_1\cong\cdots \cong R_ n \cdots\cong \mathbb{R}/\mathbb{Z}
  \]
  We fix these isomorphisms. For $n\in \mathbb{N}$, let $G^{(n)}$ be the free product of $G_i$ for $(i = 1 ..... n)$ with amalgamation $R_1\cong R_1\cong\cdots \cong R_ n$. Then we have a direct system of groups;
  $G^{(0)}\hookrightarrow G^{(1)} \hookrightarrow G^{(2)}\hookrightarrow \cdots$. We define $G$ to be the direct limit group; $G:=\varinjlim G^{(n)}$

  Can we show that $G$ is dense in $\mathrm{Diff}^\omega (**S**^1)_0$ ?
