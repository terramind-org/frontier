statement: Under derived geometric Satake, is the basic object $\delta_X$ sent to the sheared structure sheaf $\mathcal O(M^\vee)$, so that the endomorphism algebra of $\delta_X$ identifies with the sheared invariant function algebra $\mathcal O(M^\vee)^{G^\vee}$?
