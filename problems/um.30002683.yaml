title: Geometric Characterization and Removal of Stickiness
field: mathematics
tier: prose
statement: Find descriptors for the degree of full stickiness. Can stickiness always be removed by changing the geometry, and which classes cannot be so treated? Can only subsets of $Q_0$ be sticky? Characterize when stickiness is possible, for example in terms of the tangent cone.
