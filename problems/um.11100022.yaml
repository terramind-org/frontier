title: Elliptic cohomology 2 — Almost everyone who has ever thought about elliptic cohomology ends up thinking it has something to do…
field: mathematics
tier: prose
statement: Almost everyone who has ever thought about elliptic cohomology ends up thinking it has something to do with 2-categories. If you think about vector bundles, you have a bunch of local trivializations, tied together by these transition functions. The transition functions must satisfy a cocycle condition--here we are thinking of a vector bundle as a locally free sheaf, or some such nonsense. I mean on U the vector bundle is U cross R^n, on V it is V cross R^n, so on U intersect V you have two different trivializations, related by a transition function. Then on U intersect V intersect W, you have three ways to trivialize and you need a cocycle condition to hold relating the three different transtion functions. One of the standard ideas for how to build elliptic cohomology is to only require the cocycle condition to hold up to natural isomorphism rather than on the nose. I believe this requires you to replace vector spaces by an appropriate 2-category. My own idea was to use the 2-category of 2-vector spaces, which I learned about in a paper by Kapranov-Voevodsky. Is this idea worth anything?
