title: Packed square-fat-point lower bounds for tangent spaces on the smoothable component
field: mathematics
tier: prose
statement: |-
  **Problem 1.** Describe the singularities of the smoothable component of
  \(\operatorname{Hilb}^{d}(\mathbb A^{n})\). To be more specific,

  - How large can the dimension of the Zariski tangent space to this component get?
  - Does the maximum occur in the intersection of components? Does it occur in the smoothable component?
