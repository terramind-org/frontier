title: A gated local neural-sampling extension of Boltzmann learning
field: mathematics
tier: prose
statement: |-
  Are there biologically plausible extensions of Boltzmann Machines for neural networks?

  The wording is deliberately broad. “Biologically plausible” is not a mathematical predicate until one specifies which biological constraints are required, and “extension” could refer to neuron dynamics, learning, architecture, or all three. This report therefore gives a conditional existence answer under explicit criteria, not a claim that a particular mechanism is used by an actual brain.
