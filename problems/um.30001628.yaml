title: Topological Repair of Non-Hausdorff Quotient Spaces
field: mathematics
tier: prose
statement: Let $X$ be a non-Hausdorff space and let $S\subseteq X$ be a closed crack, meaning that any distinct $x,y\in X$ not both in $S$ have disjoint neighborhoods. Put $R=X\setminus S$. How should one choose $L\subseteq2^S$ and topologize $\widetilde X=L\sqcup R$ so as to repair the non-Hausdorff quotient?
