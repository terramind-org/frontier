statement: |-
  \section{Research Problems in Function Theory — Problem 2.73}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $F:\mathbb C^3\to\mathbb C$ be entire jointly in its three variables. Say that its parameter dependence factors through one entire function if there are entire maps $G:\mathbb C^2\to\mathbb C$ and $H:\mathbb C^2\to\mathbb C$ with $F(z,a,b)=G(z,H(a,b))$ for all $z,a,b\in\mathbb C$. A family is normal if every sequence has a subsequence converging locally uniformly in the spherical metric to a meromorphic function or to $\infty$.
  \paragraph{Statement recorded in the supplied source.}
  Does there exist such an entire function $F$ that does not admit this factorization and for which $\{z\mapsto F(z,a,b):(a,b)\in\mathbb C^2\}$ is a normal family on the whole plane? \sref{statement}{2}
  \subsection{Short English statement}
  Can there exist a normal entire family on the plane that has two genuine parameters and cannot be expressed through one entire scalar parameter?
