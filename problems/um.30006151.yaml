title: Shortest Paths and Cycles of Prescribed Modular Length
field: mathematics
tier: prose
statement: Let $\ell,m\geq 0$ with $m\geq 2$. Is there a polynomial-time algorithm that, given a graph and specified vertices $s,t$, finds a shortest $s$–$t$ path whose length is congruent to $\ell\pmod m$, or certifies that none exists? Is there such an algorithm for a shortest cycle whose length is congruent to $\ell\pmod m$?
