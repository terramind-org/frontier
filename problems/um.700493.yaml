title: Kourovka Notebook Problem 8.43
field: mathematics
tier: prose
statement: |-
  (F. Timmesfeld). Let $T$ be a Sylow 2-subgroup
  of a finite group $G$. Suppose that $\left< N(B)\mid B \right.$ is
  a non-trivial characteristic subgroup of $\left. T\right> $ is a
  proper subgroup of $G$. Describe the group $G$ if $F^
  {\displaystyle{*}}(M)=O_2(M)$ for any 2-local subgroup $M$
  containing $T$.
