title: Problems Around Polynomials — Conjecture 11
field: mathematics
tier: prose
statement: "[B. Sh., seems good] For any real polynomial $p(x)$ of degree $k$ with simple real zeros, $$ \\#_{r}\\left[(k-1)(p'(x))^2-kp(x)p''(x)\\right] \\le \\#_{nr}p(x), $$ i.e. \"Hawaiian`` conjecture holds for $G_1(x)$ as well."
