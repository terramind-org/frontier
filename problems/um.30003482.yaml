title: Stabilization of Hidden Alphabet Distribution Models
field: mathematics
tier: prose
statement: Let $C_d$ be nested classes of observable distributions, with $C_d\subseteq C_{d'}$ for $d\leq d'$, obtained by increasing a hidden alphabet. Does some finite $d$ satisfy $C_d=C_{d'}$ for every $d'\geq d$? Does stabilization hold under cyclic symmetry or full permutation symmetry of three observed variables without increasing the hidden alphabet?
