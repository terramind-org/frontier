title: Minimum Coincidence Components of Homotopic Map Pairs
field: mathematics
tier: prose
statement: |-
  Let $f_1, f_2 : M \to N$ be continuous maps between closed manifolds, and let $C(f_1, f_2) = \{x \in M : f_1(x) = f_2(x)\}$ denote their coincidence locus. In Nielsen coincidence theory, determine the minimum number of coincidence path-components
  $$
  \operatorname{MCC}(f_1, f_2) = \min\left\{\#\pi_0(C(f'_1, f'_2)) : f'_1 \simeq f_1,\ f'_2 \simeq f_2\right\}.
  $$
