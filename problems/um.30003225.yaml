title: Contact Loci and Nash Sets of Prime Divisors
field: mathematics
tier: prose
statement: Let $p_{i_0}$ be a free infinitely near point used to obtain the minimal model of a prime divisor $E$. Is $\bigcup_{E'\equiv_{i_0}E}\mathcal N_{E'}=\operatorname{Cont}_q(E_{p_{i_0}})$ for some $q$?
