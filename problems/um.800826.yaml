title: Geometric Hydrodynamics in Open Problems — Problem 25
field: mathematics
tier: prose
statement: |-
  This is not the case for a general infinite-dimensional dynamical system
  and, in particular, for the Eulerian hydrodynamics.
  Nadirashvili showed that the Euler equation of a 2D fluid has wandering solutions:
  there is an initial condition of a fluid in a 2D annulus whose neighbourhood never returns sufficiently closely
  to the initial condition after a certain time [Nadir].
  A 3D analogue of that result is unknown.

  Prove that the 3D Euler equation has wandering solutions.
