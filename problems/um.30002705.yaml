title: Occupation Times of Manifold Brownian Motion
field: mathematics
tier: prose
statement: Let $W$ be Brownian motion on a Riemannian manifold $M$ starting at $o$, and let a hypersurface $N$ locally separate $M$ into $M^+$ and $M^-$. Describe the total time $T$ that $W$ spends in $M^+$ up to time $t$.
