title: Quantizing Mather measures by equilibrium packets and smooth-graph WKB states
field: mathematics
tier: prose
statement: |-
  Consider the Hamiltonian
  \[
  H(x,p)=\frac12|p|^2+V(x),
  \]
  where \(V\) is periodic on \(\mathbb T^n\). The corresponding quantum Hamiltonian is
  \[
  -\frac{h^2}{2}\Delta+V(x).
  \]
  Do Mather sets play a role in the semiclassical limit? Conversely, can one “quantize” Mather sets by building corresponding quasimodes with good error bounds? Would a Diophantine condition be useful?

  It is Craig Evans's problem from the AIM workshop *New connections between dynamical systems and PDE's*.

  The mathematical text recovered from the original AIM page is:

  Immediately after identifying the operator as \(-h^2\Delta/2+V\), the source displays the eigenproblem with \(+h^2\Delta u/2+Vu=Eu\). With the analytic convention \(\Delta=\sum_j\partial_{x_j}^2\), the quantization of the stated symbol \(|p|^2/2+V\) is
  \[
  P_h=-\frac{h^2}{2}\Delta+V. \]
  That is the operator treated below. The plus-sign display would instead have principal symbol \(-|p|^2/2+V\), which is not the stated Tonelli Hamiltonian.
