title: Sharp block-power obstruction for complex Monge-Ampere regularity
field: mathematics
tier: prose
statement: |-
  Let \(u\) be a plurisubharmonic function satisfying
  \[
  (i\partial\overline\partial u)^n=\psi
  \]
  with \(\psi>0\) and smooth. Assume \(u\) is \(C^{1,\alpha}\) for
  \(\alpha>1-\frac2n\), then \(u\in C^\infty\).

  **Recovered statement (conjecture).** Let \(\Omega\subset\mathbb C^n\) be a
  domain, \(n\ge1\), and let
  \[
  u\in \operatorname{PSH}(\Omega)\cap C_{\mathrm{loc}}^{1,\beta}(\Omega),
  \qquad 0<\beta\le1.
  \]
  Suppose, in the Bedford–Taylor sense,
  \[
  (i\partial\bar\partial u)^n=\Psi,
  \tag{1.1}
  \]
  where \(\Psi\) is a smooth strictly positive \((n,n)\)-form. If
  \(\beta>1-2/n\), prove that \(u\in C^\infty_{\mathrm{loc}}(\Omega)\).
