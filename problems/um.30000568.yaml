title: Spectral and Finite-Dimensional Problems for Hypercyclic Tuples
field: mathematics
tier: prose
statement: If an operator tuple is hypercyclic, must it commute with a cyclic operator $B$, and can $B$ satisfy $\sigma_p(B^*)=\varnothing$? Does there exist an $n$-tuple with a somewhere-dense nondense orbit, a hypercyclic $n$-tuple of matrices on $\mathbb{C}^n$, or a hypercyclic $n$-tuple of hyponormal operators on an infinite-dimensional Hilbert space?
