title: Invariant Laws and Survival of BRACO Processes
field: mathematics
tier: prose
statement: Is every invariant law of an $(a,b,c,d)$ branching-coalescing process the Poissonization of an invariant law of the corresponding resampling-selection process? Does survival of the $(a,b,c,d)$ branching-coalescing process imply survival of the $(a^\dagger,b,c,d)$ process with reversed jump rates $a^\dagger(i,j)=a(j,i)$?
