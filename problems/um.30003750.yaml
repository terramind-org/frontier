title: Attainable Limits in Gaussian Projection Pursuit
field: mathematics
tier: prose
statement: In projection pursuit of structureless Gaussian data with dimension-to-sample ratio $\gamma<1$, is every attainable limiting empirical distribution a mixture of $N(0,q)$, for some $q<(1+\sqrt\gamma)^2$, and a possibly small non-Gaussian component?
