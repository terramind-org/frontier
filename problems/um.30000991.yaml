title: Realization of Persistence Pairings by Filtration Functions
field: mathematics
tier: prose
statement: Let $P$ be a persistence pairing on a filtered simplicial complex $K$, let $V_P$ be its associated discrete gradient vector field, and let $P_{V_P,f}$ be the persistence pairing induced by an integer-valued filtration function $f$. Is there a choice of $f$ for which $P_{V_P,f}=P$?
