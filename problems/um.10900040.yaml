title: 5.15 (Gabai, Trnkova) — Ideal triangulations with arbitrarily many positive tetrahedra
field: mathematics
tier: prose
statement: Let $M$ be a hyperbolic $3$-manifold and let $n$ be any positive integer. Does $M$ admit an ideal triangulation with $m\geq n$ positively oriented tetrahedra?
