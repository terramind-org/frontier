title: Research Problems in Function Theory — Problem 2.6
field: mathematics
tier: prose
statement: Let $f(z)$ be an entire function. Then Boas (unpublished) proved that there exists a path $\Gamma_\infty$ such that, for every $n$, $$ \left|\frac{f(z)}{z^n}\right|\to\infty, \hspace{1cm}\text{ as }z\to\infty \text{ along } \Gamma. $$ Can we improve this result if something is known about the lower growth of $M(r,f)$? Hayman has shown that there exist functions of infinite order and, in fact, growing arbitrarily rapidly, such that, on every path $\Gamma$ on which $f(z)\to\infty$, we have \[\log \log |f(z)|=O(\log |z|),\] i.e. $f(z)$ has finite order on $\Gamma$.
