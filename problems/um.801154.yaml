title: Nijenhuis Geometry and Integrable Systems — Problem 7
field: mathematics
tier: prose
statement: |-
  Next, if we have a regular conservation law $f$ for $L$, then we should be able to construct a companion coordinate system and then
  get a metric $g$ geodesically compatible with $L$, by using the above mentioned explicit formula from [nijappl5].

  For each $\mathrm{gl}$-regular Nijenhuis operator $L$ in dimension 2, construct (explicitly) a geodesically compatible metric.
