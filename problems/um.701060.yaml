statement: |-
  Suppose that ${\mathfrak{G}}=\{ G_1, G_2,\ldots \}$ is
  a family of finite 2-generated groups which generates the variety of
  all groups. Is it true that a free group of rank 2 is residually in
  ${\mathfrak{G}}$?
