  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] R. İnanç Baykur, Robion C. Kirby and Daniel Ruberman (editors), \emph{K3: A New Problem List in Low-Dimensional Topology}, Mathematical Surveys and Monographs 295 (2026), Problem 3.63, p. 176 and following remarks; original author version. \url{https://math.berkeley.edu/sites/default/files/surv-295-ruberman-watermarked-author-pdf.pdf}.
  \end{description}
