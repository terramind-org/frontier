lean:
  module: FormalConjectures.ErdosProblems.«59»
  decl: Erdos59.erdos_59.variants.big_o
  statement: |-
    theorem erdos_59.variants.big_o :
        ∀ (k : ℕ) (H : SimpleGraph (Fin k)), ¬ H.IsAcyclic →
          ∃ C : ℝ, 0 < C ∧ ∀ᶠ n : ℕ in atTop,
            (numFree H n : ℝ) ≤ (2 : ℝ) ^ (C * (extremalNumber n H : ℝ))
  context:
    - open Erdos59
    - open Erdos59.erdos_59
    - open Erdos59.erdos_59.variants
    - open Filter SimpleGraph
  definitions:
    - name: Erdos59.numFree
      kind: def
      text: |-
        /-- `numFree H n` is the number of labelled graphs on the vertex set `Fin n` which do not
        contain `H` as a subgraph. -/
        noncomputable def numFree {k : ℕ} (H : SimpleGraph (Fin k)) (n : ℕ) : ℕ :=
          {G : SimpleGraph (Fin n) | H.Free G}.ncard
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/59.lean#L40
