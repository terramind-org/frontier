id: erdos59.erdos-59.variants.big-o
title: "Erdős Problem 59 (variant: big_o)"
field: mathematics
tier: proof
statement: |-
  It is still possible (and conjectured by Morris and Saxton) that the weaker bound of
  $$2^{O(\mathrm{ex}(n;G))}$$
  holds for all $G$ containing a cycle.
ams:
