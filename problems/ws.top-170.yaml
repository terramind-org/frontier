  \section{Covering Density of Binary Linear Codes}\label{170}

  {\small\sffamily UnsolvedMath ID 170 · Combinatorics}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Unless a section says otherwise, $\N=\{1,2,\ldots\}$,
  $\Z$ is the ring of integers, $\Q,\R,\C$ are the rational, real, and complex
  fields, $[N]=\{1,\ldots,\lfloor N\rfloor\}$, and $\log$ is the natural
  logarithm. For real functions of a parameter tending to infinity,
  $f\ll g$ and $f=O(g)$ mean $|f|\leq Cg$ eventually for some fixed $C$;
  $f\gg g$ reverses this comparison; $f=o(g)$ means $f/g\to0$;
  $f\sim g$ means $f/g\to1$; and $f\asymp g$ means both order bounds.
  A subscript on $O$ or $\ll$ specifies allowed constant dependence.
  The expression $n^{o(1)}$ in an upper bound means growth smaller than
  $n^\epsilon$ for each fixed $\epsilon>0$. Local definitions govern any
  exception, finite-field convention, or use of the same symbol for another
  object. An asymptotic claim is not automatically an effective algorithm.



  The Hamming weight $w(x)$ counts nonzero coordinates and $H_n(r)=\{x\in\F_2^n:w(x)\leq r\}$. A subspace $V$ has covering radius at most $r$ when $V+H_n(r)=\F_2^n$. Its covering density is $|V||H_n(r)|/2^n$. For fixed $r$, $f(r)$ is the least limiting density obtainable along unbounded lengths as in the statement; the subsequent question lets $r$ tend to infinity. \sref{170}{1} \sref{170}{2}

  \paragraph{Statement recorded in the supplied source.}
  Let $r$ be fixed and let $H(r)$ be the Hamming ball of radius $r$ in $\mathbb{F}_2^n$. Let $f(r)$ be the smallest constant such that there exist infinitely many $n$ with subspaces $V_n \leq \mathbb{F}_2^n$ satisfying $V_n + H(r) = \mathbb{F}_2^n$ and $|V_n| = (f(r) + o(1)) \frac{2^n}{|H(r)|}$. Does $f(r) \to \infty$? \sref{170}{1}

  \paragraph{Residual task reported by the archive.}

  The embedded review (2026-08-17) records: Prove an unbounded lower bound for the asymptotic density of linear covering codes as the radius grows, or construct bounded-density families refuting divergence. \sref{170}{1}

  \subsection{Short English statement}

  As the allowed error radius increases, must binary linear covering codes become increasingly inefficient relative to the elementary sphere-covering bound?

