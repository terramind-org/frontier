title: An exact lower-degree defect for homological torsion growth
field: mathematics
tier: prose
statement: |-
  Let $M$ be a closed Riemannian manifold and let
  \[
  \Gamma=\pi_1(M)>\Gamma_1>\Gamma_2>\cdots
  \]
  be a decreasing sequence of finite-index normal subgroups with
  $\bigcap_n\Gamma_n=1$. Let $\widetilde M$ be the universal cover and
  $M_n=\widetilde M/\Gamma_n$. Suppose in addition that $M$ is aspherical,
  $\dim M=2k+1$, and $\beta_j^{(2)}=0$ for every $j$. Is
  \[
  \rho^{(2)}(\widetilde M)=(-1)^k\lim_{n\to\infty}
  \frac{\log|\operatorname{tors}H_k(M_n;\mathbb Z)|}
  {|\Gamma:\Gamma_n|}?
  \]
