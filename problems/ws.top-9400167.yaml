  % UnsolvedMath ID 9400167; source catalogue code AMR-093-0167
  \setcounter{section}{9400166}
  \section{Are there infinitely many Woodall primes}\label{9400167}
  {\small\sffamily UnsolvedMath ID 9400167 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For $n\ge1$, let $W_n=n2^n-1$. A Woodall prime is a prime value of this sequence.
  \paragraph{Statement recorded in the supplied source.}
  Are there infinitely many $n\ge1$ for which $W_n$ is prime? \sref{9400167}{2}
  \subsection{Short English statement}
  Are infinitely many Woodall numbers prime?
