lean:
  module: FormalConjectures.ErdosProblems.«61»
  decl: Erdos61.erdos_61
  statement: |-
    theorem erdos_61 :
        ∀ {α : Type*} [Fintype α] [DecidableEq α] (H : SimpleGraph α),
          ∃ c > (0 : ℝ), IsErdosHajnalLowerBound H (fun n : ℕ => (n : ℝ) ^ c)
  context:
    - open Erdos61
    - open Filter
    - open SimpleGraph
    - open Real
  definitions:
    - name: Erdos61.IsErdosHajnalLowerBound
      kind: def
      text: |-
        def IsErdosHajnalLowerBound {α : Type*} [Fintype α] [DecidableEq α]
          (H : SimpleGraph α) (f : ℕ → ℝ) : Prop :=
          ∀ᶠ n in atTop, ∀ G : SimpleGraph (Fin n),
            (¬∃ g : α ↪ Fin n, H = G.comap g) → G.indepNum ≥ f n ∨ G.cliqueNum ≥ f n
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/61.lean#L39
