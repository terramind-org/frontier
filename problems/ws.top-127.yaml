statement: |-
  \section{Short Intervals Containing Sums of Two Squares}\label{statement}


  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Unless a section says otherwise, $\N=\{1,2,\ldots\}$,
  $\Z$ is the ring of integers, $\Q,\R,\C$ are the rational, real, and complex
  fields, $[N]=\{1,\ldots,\lfloor N\rfloor\}$, and $\log$ is the natural
  logarithm. For real functions of a parameter tending to infinity,
  $f\ll g$ and $f=O(g)$ mean $|f|\leq Cg$ eventually for some fixed $C$;
  $f\gg g$ reverses this comparison; $f=o(g)$ means $f/g\to0$;
  $f\sim g$ means $f/g\to1$; and $f\asymp g$ means both order bounds.
  A subscript on $O$ or $\ll$ specifies allowed constant dependence.
  The expression $n^{o(1)}$ in an upper bound means growth smaller than
  $n^\epsilon$ for each fixed $\epsilon>0$. Local definitions govern any
  exception, finite-field convention, or use of the same symbol for another
  object. An asymptotic claim is not automatically an effective algorithm.



  A sum of two squares means $a^2+b^2$ with $a,b\in\Z$, including a zero summand. The asymptotic interval question concerns sufficiently large real $X$ and the interval with endpoints $X-X^{1/4}/10$ and $X$. The constant $1/10$ is part of the target, not an unspecified positive constant. \sref{statement}{1} \sref{statement}{2}

  \paragraph{Statement recorded in the supplied source.}
  Is there always a sum of two squares between $X - \frac{1}{10}X^{1/4}$ and $X$? \sref{statement}{1}

  \paragraph{Scope and interpretation.}

  The source background concerns a large-$X$ gap bound. This is the asymptotic reading; the wording always is not used to assert the false small-$X$ version. \sref{statement}{1}

  \paragraph{Residual task reported by the archive.}

  The embedded review (2026-08-17) records: Improve the uniform one-sided constant to 1/10, or prove any o(X\textasciicircum{}{1/4}) worst-case gap bound. \sref{statement}{1}

  \subsection{Short English statement}

  Must every sufficiently large number have a sum of two squares within one tenth of its fourth root immediately below it?

