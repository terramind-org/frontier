statement: |-
  \section*{Decidable word problem and embedding in finitely presented simple groups}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Is it true that a finitely generated group has a decidable word problem exactly when it admits an injective homomorphism into a finitely presented simple group?
  \subsection{Short English statement}
  Is it true that a finitely generated group has a decidable word problem exactly when it admits an injective homomorphism into a finitely presented simple group?
