title: A finite generalized-toggle shadow of birational rowvacuation
field: mathematics
tier: prose
statement: |-
  **Problem 5.4.** Start with a known action in the birational (or piecewise-linear) realm and find the corresponding generalized toggle group action in the combinatorial realm. One such example of a birational map is the pentagram map.

  The recovered statement is:

  The PDF line-break artifact “combi-natorial” has been repaired to “combinatorial”; no mathematical wording was changed.

  This is an open-ended construction problem, not a proposition with a fixed universal quantifier. Below, the known birational action is **birational order-filter rowvacuation** on a graded finite poset. Its finite combinatorial shadow is order-filter rowvacuation, an element of the generalized toggle group on the finite family of order filters. The construction is exact. It does **not** identify a toggle model for the pentagram map.
