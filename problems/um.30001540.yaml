title: Lehmer Conjecture on Mahler Measure
field: mathematics
tier: prose
statement: Lehmer's conjecture states that there exists a constant $m>1$ such that the Mahler measure $M(P)\geq m$ for every non-cyclotomic integer polynomial $P$.
