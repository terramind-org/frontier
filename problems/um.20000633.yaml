title: Exact planar probabilities and sphere witnesses for random Viro diagrams
field: mathematics
tier: prose
statement: |-
  **Question 8: Maurice Rojas** What is the probability that a random Viro
  diagram contains no sphere?

  Investigate the connections between random sparse polygons and Newton
  polytopes. This should be extended to the case of random Viro diagrams.

  A sphere is an entire connected component of the Viro hypersurface that is
  PL-homeomorphic to \(S^{d-1}\), where \(d\) is the dimension of the ambient
  triangulated space.
