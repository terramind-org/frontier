title: Virtual-knot problem 29 — Khovanov homology for virtual knots and links works directly with mod-$2$ coefficients.
field: mathematics
tier: prose
statement: |-
  Khovanov homology for virtual knots and links works directly with
  mod-$2$ coefficients. With mod-2 coefficients there are no technical
  difficulties associated with the fact that a virtual state curve can
  resmooth to a single curve. Over the integers, this is a problem
  that has to be dealt with. An integral Khovanov homology for
  virtual knots has been constructed by Manturov . It is
  also the case that the work of Khovanov–Rozansky
  categorifiying infinitely many specializations of the Homflypt
  polynomial is an integral invariant for virtual knots. In principle,
  the Khovanov–Rozansky work solves the problem of integral Khovanov
  homology for virtuals, but to see this in terms of Khovanov's
  original definition is a very good technical problem. Solve this
  problem to clarify the Manturov construction.
