title: Sharp Virulence Thresholds for Stationary SIS Infection
field: mathematics
tier: prose
statement: For each $n$, consider a finite connected weighted network with recovery rates $\mu_v$, and let $X^{(n)}_{\theta,\varepsilon}$ be the stationary number of infected vertices in the SIS process whose infection rate at $v$ is $$\varepsilon+\theta\sum_{y\ \mathrm{infected}}w_{vy}.$$ Assume that there are $0<\theta_*<\theta^*<\infty$ such that, for every sufficiently slowly vanishing sequence $\varepsilon_n$, $$X^{(n)}_{\theta_*,\varepsilon_n}=o(n)\quad\text{and}\quad X^{(n)}_{\theta^*,\varepsilon_n}=\Omega(n)$$ in probability. Must there be $\theta_n\in[\theta_*,\theta^*]$ such that, for every fixed $\delta>0$, $$X^{(n)}_{\theta_n-\delta,\varepsilon_n}=o(n)\quad\text{and}\quad X^{(n)}_{\theta_n+\delta,\varepsilon_n}=\Omega(n)$$ in probability?
