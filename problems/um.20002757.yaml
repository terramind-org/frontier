statement: "**Schur weyl duals.** Are there direct constructions for the Schur--Weyl dual of $\\mathrm{FI}$-modules like $\\mathrm{H}^{\\bullet}(\\mathrm{PConf}^n{X}, \\mathbb{Q})$? E.g., can one construct a $\\mathbf{GL}_{\\infty}$-space and a $\\mathbf{GL}_{\\infty}$-equivariant sheaf whose cohomology is the Schur--Weyl dual?"
