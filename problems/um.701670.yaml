title: Kourovka Notebook Problem 20.12
field: mathematics
tier: prose
statement: |-
  Let us say that a group $G$ has the *unique $n$-fold product* property (u.-$n$-p.)
  if for every $n$-tuple of finite nonempty subsets $A_1, \dots , A_n\subseteq G$ there
  exists $g\in G$ which can be written in one and only one way as $g = a_1\cdots a_n$ with $a_i\in A_i$. It is easy to see that u.-$n$-p. implies u.-$m$-p. for $n \geq m$ (since some of the $A_i$ can be $\{1\}$).

  Are the conditions u.-$n$-p. ($n\geq 2$) all equivalent
  to u.-2-p., the usual unique product condition?
