  \section{\texorpdfstring{Regularity Properties of Nuclear $C^*$-Algebras}{Regularity Properties of Nuclear C\textasciicircum{}*-Algebras}}\label{30002396}
  {\small UnsolvedMath ID 30002396 · Algebra}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For a separable unital simple nuclear stably finite infinite-dimensional $C^*$-algebra $A$, are the following equivalent: $\mathcal Z$-stability ($A\cong A\otimes\mathcal Z$), strict comparison, and finite decomposition rank?
  \par\smallskip\textit{Formulation references:} \sref{30002396}{1}, \sref{30002396}{2}.
  \subsection{Short English statement}
  For a separable unital simple nuclear stably finite infinite-dimensional $C^*$-algebra $A$, are the following equivalent: $\mathcal Z$-stability ($A\cong A\otimes\mathcal Z$), strict comparison, and finite decomposition rank?
