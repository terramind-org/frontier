title: Monotonicity of Weighted Yamabe Heat Traces
field: mathematics
tier: prose
statement: Fix $n\geq4$. For each smooth positive weight $W$ on $S^n$, normalized by $\int_{S^n}W^{n/2}=\operatorname{vol}(S^n)$, form the weighted Yamabe operator $Y_W=W^{-1/2}YW^{-1/2}$ from the round conformal Laplacian $Y$. Must the scaled heat trace $t\longmapsto t^{n/2}\operatorname{Tr}(e^{-tY_W})$ be decreasing on $(0,\infty)$?
