title: High Incidence Partitions and Minimum Ellipsoid Coresets
field: mathematics
tier: prose
statement: For every $c$, does there exist a locally finite convex-cell partition of $\mathbb{R}^3$ in which every cell meets at least $c$ vertices and every vertex meets at least $c$ cells? Separately, for a finite set $S\subset\mathbb{R}^d$, let $\operatorname{MEE}(S)$ be its minimum enclosing ellipsoid, let $\operatorname{DBM}$ be the Banach–Mazur distance, and define $f(d,\varepsilon)$ as the supremum over $S$ of the minimum cardinality of $X\subseteq S$ satisfying $\operatorname{DBM}(\operatorname{MEE}(X),\operatorname{MEE}(S))\leq\varepsilon$. Is $f(d,\varepsilon)=O(d/\varepsilon^2)$?
