statement: Can one prove a critical Lieb–Thirring inequality for arbitrary, including noninteger, powers of the Laplacian? For $0<\theta\leq1$, what is the sharp constant $C_\theta$ in the Hardy–Lieb–Thirring inequality on the half-line with weight $V(r)r^{1-\theta}$?
