title: Kourovka Notebook Problem 13.53
field: mathematics
tier: prose
statement: |-
  Let $a, b$ be elements of finite order of the infinite
  group $G=\left< a, b\right>$. Is it true that there are infinitely
  many elements $g\in G$ such that the subgroup $\left< a,
  b^g\right>$ is infinite?
