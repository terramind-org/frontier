id: um.30001848
title: Fixed-Rank Cohen–Lenstra Distributions
field: mathematics
tier: prose
statement: |-
  Fix an odd prime $p$ and a positive integer $g$. Among imaginary quadratic fields $K$ with $p$-rank $g$, ordered by discriminant, is the probability that $A_K\cong G$ equal to

  $$\frac{1}{|\operatorname{Aut}(G)|}\,p^{-g^2}\prod_{k=1}^g(p^g-p^{g-k})^2?$$

  Equivalently, does the displayed expression give the limiting frequency?
