title: A scaling dictionary and the remaining arbitrary-window polymer problem
field: mathematics
tier: prose
statement: |-
  Polymer universality

  Consider intermediate scaling for polymer with $\beta=n^{-1/4}c(n)$ where $c(n)$ is any function which tends to infinity with $n$. Show universality of the $F_{GUE}$ fluctuations with a fluctuation exponent which may depend on $c(n)$.

  This requires careful estimation of terms in the discrete chaos series which are further and further out as $n$ increases (reminiscent of Soshnikov's approach to edge universality for Wigner matrices).
