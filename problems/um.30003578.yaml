title: Variance of Gaussian Prime Angles in Short Arcs
field: mathematics
tier: prose
statement: Let $N$ be the number of Gaussian-prime angles with norm at most $X$, and let $N_{K,X}(\theta)$ count those in an arc of angular scale $1/K$. Is $$\frac{\operatorname{Var}(N_{K,X})}{N/K}\sim\min\!\left\{1,\frac{2\log K}{\log N}\right\}$$ as $X\to\infty$?
