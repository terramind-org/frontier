title: Positive Scalar Curvature Information from Rosenberg Indices
field: mathematics
tier: prose
statement: Let $M$ be a closed smooth spin manifold, with Rosenberg indices $\alpha_{\mathrm{red}}(M)\in KO_*(C^*_{\mathrm{red}}\pi_1M)$ and $\alpha_{\mathrm{max}}(M)\in KO_*(C^*_{\mathrm{max}}\pi_1M)$. How much information do these indices contain about obstructions to positive scalar curvature on $M$?
