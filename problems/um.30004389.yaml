title: Positive Scalar Curvature for Spin Manifolds with Odd Fundamental Group
field: mathematics
tier: prose
statement: |-
  Let $M$ be a closed connected spin manifold of dimension $d\geq5$ with odd-order abelian fundamental group. Assume that $M$ is $p$-atoral for every prime $p$ dividing $|\pi_1(M)|$: for every $\ell\geq1$ and $c_1,\ldots,c_d\in H^1(M;\mathbb Z/p^\ell)$,

  $$\langle c_1\smile\cdots\smile c_d,[M]\rangle=0\in\mathbb Z/p^\ell.$$

  Is the vanishing of the Rosenberg $\alpha$-invariant sufficient for $M$ to admit a metric of positive scalar curvature?
