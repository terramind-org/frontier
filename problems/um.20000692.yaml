id: um.20000692
title: Fixed-form automorphic diagonals and the missing Type-I mechanism
field: mathematics
tier: prose
statement: |-
  **Problem.** Develop a heuristic for moments of \(L\)-functions of automorphic forms.

  **Remark.** One of the problems here is that \(\sum a_m a_{m+h}=0\), so there are no Type I terms.

  Fix a primitive cuspidal automorphic form \(f\) (initially on \(\mathrm{GL}_2/\mathbb Q\)) and develop a Conrey--Keating/CFKRS heuristic for
  \[
  M_{f,k}(T;w)=\int_{\mathbb R}w(t/T)
        |L(\tfrac12+it,f)|^{2k}\,dt,
  \qquad k\in\mathbb N,
  \]
  as \(T\to\infty\).
