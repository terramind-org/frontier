title: Complexity in Enumerative Combinatorics — Conjecture 13 (cf. [Ges-sem])
field: mathematics
tier: prose
statement: |-
  In [Ges-sem], the author defined the following *Gessel sequence*:
  $$
  b_n := \ 2\cdot 5^n \. - \. (3+4i)^{n} \. - \. (3-4i)^{n}, \quad \text{where} \ \ i \. = \. \sqrt{-1}
  $$
  see also [OEIS, A250102 (https://oeis.org/A250102)].
  Note that $b_n\in \mathbb{Z}$ since
  $$b_n = 2\cdot 5^n \. - \. 2 {2r} \. 3^{n-2r}
  $$
  and that $b_i \ge 0$ since $|3\pm 4i|=5$. Note also that $\{b_n\}$ is C-recursive since
  $$
  B(t) \. := \sum_{n=0}^\infty \. b_n {(1-5t)
  $$
  This is an example of a C-recursive nonnegative sequence without an easy
  combinatorial interpretation.

  Sequence $
  of type $\textup{\small $($\textrm{C1}$)$}$.
