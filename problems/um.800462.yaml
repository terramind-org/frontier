title: Spaces with Lower Ricci Curvature — Conjecture 6 (noncollapsing Yau's conjecture)
field: mathematics
tier: prose
statement: |-
  Let $\big(M^n,g,x\big)$ satisfy
  \[ \mathrm{Ric}\geq -\lambda \qquad \text{and} \qquad \mathrm{Vol}(B_1(p))>v>0,\] then $\exists$ $C(n,\lambda,v)>0$ such that
  \begin{gather*}
  \fint_{B_1(x)} R < C .
  \end{gather*}
