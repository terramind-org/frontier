title: The Lyapin's Notebook — Problem 2
field: mathematics
tier: prose
statement: |-
  (S. Kublanovsky)
  Describe the divisors of the following subclasses of finite 0-simple semigroups:

  - the class of finite Brandt semigroups;

  - the class of finite 0-simple semigroups presented in the Rees representation by a matrix that consists only of zeros and ones.

  Divisors of the class of all finite 0-simple semigroups are described by positive universal formulas (see [Kubl]).
