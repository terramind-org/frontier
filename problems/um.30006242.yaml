title: Fusion Systems of Sectional Rank Three
field: mathematics
tier: prose
statement: Let $p$ be odd, let $S$ be a $p$-group of sectional rank three, and let $\mathcal{F}$ be a saturated fusion system on $S$ with $O_p(\mathcal{F})=1$ and $\mathcal{F}=O^p(\mathcal{F})$. Prove that either $S$ has maximal nilpotency class or $S$ has an abelian maximal subgroup.
