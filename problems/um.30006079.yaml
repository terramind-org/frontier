title: Lang–Vojta and Shafarevich Finiteness Conjectures
field: mathematics
tier: prose
statement: Does every hyperbolic variety over a number field have only finitely many integral points? More generally, for which classes of canonically polarized varieties are there only finitely many isomorphism classes with good reduction outside a fixed finite set of places?
