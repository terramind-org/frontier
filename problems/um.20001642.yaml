title: Directed axes, power minsets, and the shortcut defect in Lipschitz Outer space
field: mathematics
tier: prose
statement: |-
  This is Problem 2.1 in the AIM workshop notes *The geometry of the outer automorphism group of a free group* (25--29 October 2010, edited by Johanna Mangahas). In normalized notation, it asks for analogies between Teichmüller/Weil--Petersson geodesics and geodesics in Culler--Vogtmann Outer space with the Lipschitz metric:

  1. Which geodesics or lines have strongly contracting projection maps?
  2. Is there a useful “thick part”?
  3. How does geodesic behavior relate to boundary theory?
  4. For an iwip \(\phi\), describe
     \[
     \operatorname{Min}(\phi)=
     \left\{X:d(X,\phi X)=\inf_Y d(Y,\phi Y)\right\}.
     \]
     Is it CAT(0), contained in a CAT(0) space, an axis bundle, or quasi-isometric to a line?
  5. How close are \(\operatorname{Min}(\phi)\) and \(\operatorname{Min}(\phi^{-1})\)?

  The discussion asks in addition whether thick geodesics are contracting, whether iwip axes are quantitatively thick, whether taking powers changes the minset, and how train-track points and axis bundles enter.

  The all-caps line `THE GEOMETRY ... 3` is a running page header. The final `3. GROUP PROPERTIES` is the heading of the next section and is not part of Problem 2.1.

  The metric belongs to Outer space \(CV_n\), not to \(\operatorname{Out}(F_n)\) itself. The group acts on \(CV_n\) by isometries. Crucially, the Lipschitz metric is asymmetric, so every claim below records its direction.
