title: Conditions for expanding analytic curves and an exact toral model
field: mathematics
tier: prose
statement: |-
  **Question 17 (N. Shah).** Under what condition on \(\gamma\) do we have
  \[
  a^n\nu\overset{w^*}{\longrightarrow}\lambda
  \qquad(n\to\infty)?
  \]

  Let \(L\) be a Lie group, let \(G\) be a closed subgroup of \(L\), and let \(\Lambda\) be a lattice in \(L\). For a semisimple element \(a\in G\), define its expanding horospherical subgroup by

  \[
   U=\{g\in G:a^{-n}ga^n\longrightarrow e\text{ as }n\to\infty\}. \]

  Assume that \(Gx_0\) is dense in \(L/\Lambda\). If a probability measure on \(U\), absolutely continuous with respect to Haar measure, is pushed to \(Ux_0\), then Shah's earlier theorem gives convergence of its \(a^n\)-translates to the probability Haar measure \(\lambda\) on \(L/\Lambda\). The proposed refinement takes an analytic curve

  \[
   \gamma:[0,1]\longrightarrow U
  \]

  \[
   \nu=(t\longmapsto\gamma(t)x_0)_*(dt). \]

  The recovered question is therefore:

  The PDF's word “Recently” begins the following status sentence; it is not part of the question. That sentence says that Shah had solved the case \(L=\mathrm{SO}(m,1)\), \(G=\mathrm{SO}(n,1)\), \(m>n\), under the sufficient condition that \(\gamma([0,1])\) lies in neither a proper affine subspace nor an \((n-2)\)-dimensional sphere in \(U\cong\mathbb R^{n-1}\). The PDF then states Conjecture 18 for arbitrary ambient Lie groups containing \(G=\mathrm{SO}(n,1)\).

  All actions in the setup are left actions on \(L/\Lambda\), and the definition \(a^{-n}ua^n\to e\) is the convention making \(U\) expanding under positive powers of \(a\).
