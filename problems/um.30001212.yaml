title: Absence of Eigenvalues for Pisot Substitution Operators
field: mathematics
tier: prose
statement: Let $\sigma$ be a primitive substitution with hull $\Omega$ and, for a one-to-one $f:A\to\mathbb{R}$, define $[H_\omega\psi](n)=\psi(n+1)+\psi(n-1)+f(\omega_n)\psi(n)$ on $\ell^2(\mathbb{Z})$. If $\sigma$ is Pisot, must every $H_\omega$ have no eigenvalues; equivalently, must $\Omega_c=\{\omega\in\Omega:H_\omega\text{ has no eigenvalues}\}=\Omega$?
