title: Persistence Exponents of Multiply Integrated Brownian Motion
field: mathematics
tier: prose
statement: Let $B$ be standard Brownian motion, set $A_t^{(1)}=\int_0^t B_s\,ds$, and recursively define $A_t^{(d)}=\int_0^t A_s^{(d-1)}\,ds$. If $\theta_d$ is the persistence exponent governing the long-time probability that $A^{(d)}$ stays positive, determine $\theta_d$ for every $d\geq2$.
