title: Vasconcelos Conjecture for Kähler Differentials
field: mathematics
tier: prose
statement: Let $k$ be a field of characteristic zero and let $S$ be a commutative Noetherian $k$-algebra essentially of finite type. If the module of Kähler differentials $\Omega^1_{S/k}$ has finite projective dimension over $S$, must $S$ be a reduced complete intersection?
