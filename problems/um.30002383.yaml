title: Unbounded Symmetric and Alternating Extensions with Restricted Ramification
field: mathematics
tier: prose
statement: Let $P$ be a finite set of primes containing every prime dividing the order of some finite nonabelian simple group, and let $F_P(m)$ count degree-$m$ number fields with Galois group $A_m$ or $S_m$ that ramify only at primes in $P$. Is the sequence $F_P(m)$ unbounded?
