title: Hanani–Tutte Theorems on Surfaces
field: mathematics
tier: prose
statement: The projective-plane Hanani–Tutte statement says that every drawing of a graph not embeddable in the projective plane contains two nonadjacent edges crossing an odd number of times. Does the analogous statement hold on every other surface?
