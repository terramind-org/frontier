title: Fundamental groups under quasi- and almost-positive curvature
field: mathematics
tier: prose
statement: |-
  **Problem 46.** Find new examples of fundamental groups in quasi-positive curvature or positive curvature on an open dense set.

  The section heading at lines 140--141 is “Quasi-positive Curvature and Positive Curvature on an Open Dense Set.” Problem 45 asks about homogeneous quotients immediately before it, and Problem 47 asks a stabilization/symmetry question immediately after it. Thus “positive curvature on an open dense set” has the standard pointwise meaning used in the literature, not merely positivity for an open dense subset of the Grassmann bundle.

  For a Riemannian manifold \((M,g)\), define
  \[
  \mathcal P(g)=\{p\in M:\sec_g(\sigma)>0
  \text{ for every }2\text{-plane }\sigma\subset T_pM\}. \]
  The metric is **quasi-positively curved** if \(\sec_g\geq0\) and \(\mathcal P(g)\neq\varnothing\). It is **almost positively curved** (the modern name for the second condition in the problem) if \(\sec_g\geq0\) and \(\mathcal P(g)\) is open and dense. Openness is automatic from continuity of sectional curvature and compactness of the Grassmannian of two-planes at a point; density is the extra hypothesis. Almost-positive curvature implies quasi-positive curvature.
