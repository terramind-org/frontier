title: Unique Integrability of Center Bundles
field: mathematics
tier: prose
statement: For a partially hyperbolic diffeomorphism with splitting $TM=E^s\oplus E^c\oplus E^u$, where $E^s$ and $E^u$ are uniquely integrable to $C^0$ foliations with smooth leaves, is the center bundle $E^c$ always uniquely integrable?
