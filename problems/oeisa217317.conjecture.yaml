  context:
    - open OeisA217317
  definitions:
    - name: OeisA217317.a
      kind: def
      text: |-
        /-- Number of primes between $n^2$ and $n^2 + (\log_2 n)^2$ inclusive. -/
        noncomputable def a (n : ℕ) : ℕ :=
          if n = 0 then 0
          else
            let upperBound : ℕ := Int.toNat ⌊(n : ℝ) ^ 2 + (Real.logb 2 n) ^ 2⌋
            Nat.primeCounting upperBound - Nat.primeCounting (n ^ 2)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/OEIS/217317.lean#L34
