title: Linear Systems and Eigenvalue Problems — Problem 21 (Deterministic Minami Perturbation)
field: mathematics
tier: prose
statement: Minami [minami1996local] showed that if $A$ is $n\times n$ Hermitian tridiagonal and $E$ is a random diagonal matrix with independent absolutely continuous entries, then $gap(A+\delta E)\ge C(\delta/n)^c$ for some constants $C,c$ depending on the distribution of the entries. Give an efficient deterministic algorithm for finding such a perturbation. Here, efficient means faster than the parent algorithm in which it is used, so $O(n^3\log^c(n/\delta))$ for diagonalization and, ambitiously, $O(nnz(A)\log^c(n/\delta))$ or $O(nnz(A)\log^c(n)/\delta^c)$ for Krylov methods.
