id: oeisa238585.conjecture-5
title: Number of primes $p < n$ with $\text{prime}(p)^2 + (\text{prime}(n) - 1)^2$ prime (conjecture_5)
field: mathematics
tier: proof
statement: |-
  Conjecture (iii), part 2: If $n > 9$ is not equal to $18$, then
  $\text{prime}(p)^2 + \text{prime}(n)^2 - 1$ is prime for some prime $p < n$.
