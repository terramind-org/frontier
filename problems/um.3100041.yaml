title: How many comparisons are needed to determine a linear order of the Boolean poset
field: mathematics
tier: prose
statement: 'Fishburn, Pekec, Reeds: How many comparisons are needed to determine a linear order of the Boolean poset? That is, what is the fewest number of questions of the form "Is S < T?" must one ask in order to find out a linear ordering of all subsets of an n-set? Conjecture: n-1.'
