statement: "If the sequence $w_n$ satisfies $$ \\arg w_n=O\\big(|w_n|^{\\frac{1}{2}}\\big) $$ and $$ |w_{n+1}- w_n|=O(|w_n|^{\\frac{1}{2}}) $$ then it is known (see Hayman ) that ([source label: 5.5]) and hence ([source label: 5.6]) hold. It is interesting to ask whether the method will yield the same conclusions under somewhat weaker hypotheses, such as for instance, replacing the index $\\frac{1}{2}$ in ([source label: 5.7]) and ([source label: 5.8]) by a smaller positive number."
