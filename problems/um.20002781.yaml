title: A quasihereditary criterion and an extension obstruction
field: mathematics
tier: prose
statement: |-
  Given a symplectic resolution \(\pi\colon Y\to X\), with
  \(G=\operatorname{Aut}(X,\omega)\), consider the subcategory of
  \(\operatorname{Perv}_G(X,k)\) generated by subquotients of
  \(\pi_*\underline{k}_Y\). When is this highest-weight?
