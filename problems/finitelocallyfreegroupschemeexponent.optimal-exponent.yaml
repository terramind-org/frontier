    url: https://webusers.imj-prg.fr/~patrick.polo/SGA3/
  - label: R. Schoof, *Is a finite locally free group scheme killed by its order?*
    url: https://reneschoof.github.io/schoof_oortAAG.pdf
  - label: J. Tate and F. Oort, *Group schemes of prime order*
