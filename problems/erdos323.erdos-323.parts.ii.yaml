lean:
  module: FormalConjectures.ErdosProblems.«323»
  decl: Erdos323.erdos_323.parts.ii
  statement: |-
    theorem erdos_323.parts.ii :
        ∀ k m : ℕ, 1 ≤ m → m < k →
          (fun (x : ℕ) ↦ (x : ℝ) ^ ((m : ℝ) / (k : ℝ))) =O[atTop] (fun (x : ℕ) ↦ (f k m x : ℝ))
  context:
    - open Erdos323
    - open Erdos323.erdos_323
    - open Erdos323.erdos_323.parts
    - open Filter
    - open scoped Asymptotics
  definitions:
    - name: Erdos323.f
      kind: def
      text: |-
        /--
        Let $1\leq m\leq k$ and $f_{k,m}(x)$ denote the number of integers $\leq x$ which are the sum of
        $m$ many nonnegative $k$th powers.
        -/
        noncomputable def f (k m x : ℕ) : ℕ :=
          { n : ℕ | n ≤ x ∧ ∃ (v : Fin m → ℕ), n = ∑ i, v i ^ k }.ncard
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/323.lean#L33
