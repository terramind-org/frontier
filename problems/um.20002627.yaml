id: um.20002627
title: "Two-time KPZ laws: fixed-point formulas and a finite-time full-profile obstruction"
field: mathematics
tier: prose
statement: |-
  Compute multi-time distribution for KPZ. What is the distribution
  \(F'_{t_1,t_2}(\xi_1,\xi_2)\) such that
  \[
  \mathbb P\bigl(A_{t_1}(x)\leq \xi_1,
                  A_{t_2}(x)\leq \xi_2\bigr)
  =F'_{t_1,t_2}(\xi_1,\xi_2)?
  \]

  The record does not restate the initial condition or define \(A_t\). The
  immediately preceding canonical record, AIM-PROBABILITY-0068, gives the
  narrow-wedge convention
  \[
   \mathcal Z(0,\cdot)=\delta_0,
   \qquad
   \mathcal Z(t,X)=
   \exp\left\{-\frac{X^2}{2t}
   +t^{1/3}A_t(t^{-2/3}X)-\frac{t}{24}\right\}. \tag{1.1}
  \]
  I therefore treat narrow-wedge initial data as the intended reading. With
  \(u=t^{-2/3}X\), (1.1) says exactly
  \[
   A_t(u)=t^{-1/3}\log \mathcal Z(t,t^{2/3}u)
         +\frac{u^2}{2}+\frac{t^{2/3}}{24}. \tag{1.2}
  \]
  There is a small ambiguity in the source: keeping the same argument \(x\) in
  \(A_{t_1}(x)\) and \(A_{t_2}(x)\) compares the physical locations
  \(X_i=t_i^{2/3}x\), not one fixed physical location. The latter question
  would instead use \(A_{t_i}(t_i^{-2/3}X)\). Both conventions are recorded
  below.

  The two heights must be constructed from the **same space-time white noise**. Using two independent KPZ solutions would change the question and make the
  joint CDF the product of its marginals.
