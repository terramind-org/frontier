title: Collapse and Involutions in the Khovanov-Floer Spectral Sequence
field: mathematics
tier: prose
statement: For which knots does the involutive Khovanov–Floer spectral sequence collapse immediately, and what does its collapse page signify? When can it determine the involutive Heegaard Floer homology of the branched double cover? Does $\widetilde{BN}$ arise from a nontrivial homotopy involution of the Khovanov complex, and what chain endomorphism does reflection followed by crossing reversal induce?
