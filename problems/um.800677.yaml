title: Holomorphic Foliation Theory — Problem 4 (Anosov)
field: mathematics
tier: prose
statement: |-
  Consider foliations on $\mathbb{P}^2$. Recall that $\mathscr{B}_d$ denote the space of holomorphic foliations of geometric degree $d$ on $\mathbb{P}^2$. Let $\mathscr{A}_d$ denote the space of foliations given in an affine coordinate chart $\mathbb{C}^2$ in $\mathbb{P}^2$ by a vector field
  $$Z:=P(z,w) {\partial \over \partial z} + Q(z,w) {\partial \over \partial w}$$
  with $\max(\deg P, \deg Q)=d$. This notion of degree is not invariant under automorphisms of $\mathbb{P}^2.$
  Generically in $\mathscr{B}_d$, the foliations have no compact leaf, and generically in $\mathscr{A}_d$, the line at infinity is invariant.

  For a generic foliation in $\mathscr{A}_d$ (resp. $\mathscr{B}_d$), are generic leaves biholomorphic to the unit disc ?
