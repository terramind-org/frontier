title: Exceptional directions in Gross's theorem
field: mathematics
tier: prose
statement: "For a local inverse germ $\\phi_z$ of a meromorphic function $f$ at a noncritical value $w=f(z)$, Gross's theorem gives analytic continuation along almost every ray from $w$. Sharpen 'almost every': what is the smallest possible exceptional set theorem, in capacity, dimension, or another natural sense?"
