title: Algebraic limit cycles and related questions
field: mathematics
tier: prose
statement: "Determine the entries currently marked unknown in the following comparison between quadratic systems and planar piecewise-linear systems with a straight separation line: maximum limit cycles ($4?$ versus $3?$); algebraic limit cycles ($1?$ versus $2?$); non-hyperbolic algebraic limit cycles ($0?$ versus $1?$); coexistence of algebraic and non-algebraic limit cycles (unknown for quadratic systems and impossible in the piecewise-linear case); and critical periods ($2?$ versus unknown)."
