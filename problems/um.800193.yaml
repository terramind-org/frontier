title: Holomorphic Symplectic Geometry — Question 2
field: mathematics
tier: prose
statement: |-
  Let $X$, $X'$ be two hyperk\"ahler manifolds of the same dimension. If there is a Hodge isometry $\lambda :H^2(X,\mathbb{Z})\vbox{\hbox to .8cm{\hfill{$\scriptstyle\sim$}\hfill}
  \nointerlineskip\hbox to .8cm{{\hfill$\longrightarrow $\hfill}} } H^2(X',\mathbb{Z})$, what can we say of $X$ and $X'$? Can we conclude that $X$ and $X'$ are isomorphic by imposing that $\lambda $ preserves some extra structure?
