title: Smooth reduced pullbacks under finite holomorphic maps
field: mathematics
tier: prose
statement: |-
  Let \(f:(\mathbb C^n,0)\to(\mathbb C^n,0)\) be a finite holomorphic map germ and let \(V\subset(\mathbb C^n,0)\) be a reduced complex-analytic variety germ. If the reduced inverse-image germ \(f^{-1}(V)_{\mathrm{red}}\) is a complex manifold, must \(V\) be a complex manifold?

  The AIM PDF asks the following question, proposed by Linda Rothschild.
