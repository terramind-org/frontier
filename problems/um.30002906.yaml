statement: For sufficiently natural finite-index subgroups $\Delta_g<\Gamma_g$, is $H^k(M_{\Delta_g})\to H^k(\Delta_g)$ onto for $g\gg 0$, equivalently is $H^k(\Delta_g)$ pure?
