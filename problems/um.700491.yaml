title: Kourovka Notebook Problem 8.41
field: mathematics
tier: prose
statement: |-
  What finite groups $G$ contain a normal set of
  involutions $D$ which contains a non-empty proper subset $T$
  satisfying the following properties:

  1) $C_D(a) \subseteq T$ for any $a \in T$;

  2) if $a,b \in T$ and $ab=ba \ne 1$, then
  $C_D(ab) \subseteq
  T$?
