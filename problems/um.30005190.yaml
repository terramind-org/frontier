title: Gromov's Scalar Curvature Band-Width Conjecture
field: mathematics
tier: prose
statement: Let $M$ be a closed connected manifold of dimension $n-1\neq4$ that admits no metric of positive scalar curvature. If $g$ is a metric on $V=M\times[-1,1]$ with scalar curvature at least $n(n-1)$, must $\operatorname{width}(V,g)\leq2\pi/n$, where $\operatorname{width}(V,g)=\operatorname{dist}_g(\partial_-V,\partial_+V)$?
