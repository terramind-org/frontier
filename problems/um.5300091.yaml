title: Effective computation of entropy for surface diffeomorphisms
field: mathematics
tier: prose
statement: Given an explicitly specified smooth orientation-preserving diffeomorphism $F$ of the $2$-sphere, is its topological entropy Turing-computable to arbitrary prescribed error, and can it be computed in useful time? Resolve this in particular for Hénon and standard-map families; in the area-preserving cases, ask the analogous question for measure-theoretic entropy.
