id: um.20003289
title: A parity-aware discrepancy reduction for quadratic pair correlation
field: mathematics
tier: prose
statement: |-
  For irrational $\alpha$ and a fixed interval $[a,b] \subset [0,1]$, define the pair-correlation statistic
  $$
  R_2([a,b], N, \alpha) = \frac{1}{N} \#\left\{1 \leq i \neq j \leq N : \alpha i^2 - \alpha j^2 \in \frac{1}{N}[a,b] \pmod{1}\right\}.
  $$
  Does $R_2([a,b], N, \alpha)$ converge to $b - a$ as $N \to \infty$ for every Diophantine irrational $\alpha$, or can one characterize the irrational $\alpha$ for which Poissonian pair correlation holds?
