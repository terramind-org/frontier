statement: |-
  **Problem 2.2 (F. Guéritau).** Given \(X,Y\in\mathcal T(S)\), describe
  the set
  \[
  \operatorname{Env}(X,Y):=\bigcup\{G\},
  \]
  where \(G\) denotes a Thurston geodesic connecting \(X\) to \(Y\).
