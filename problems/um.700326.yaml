title: Kourovka Notebook Problem 5.44
field: mathematics
tier: prose
statement: |-
  A
  union ${\mathfrak{A}}=\bigcup\limits_{\alpha} {\mathfrak{V}}_{\alpha}$ of
  varieties of groups (in the lattice of varieties) is called *irreducible* if $\bigcup\limits_{\beta\ne \alpha} {\mathfrak{V}}_{\beta} \ne {\mathfrak{A}}$ for each index $\alpha $. Is every
  variety an irreducible union of (finitely or infinitely many)
  varieties each of which cannot be decomposed into a union of two
  proper subvarieties?
