title: Applications 4 — Stefan Stolz showed that a simply connected Spin manifold of dimension at least 5 admits a metric of p…
field: mathematics
tier: prose
statement: "Stefan Stolz showed that a simply connected Spin manifold of dimension at least 5 admits a metric of positive scalar curvature if and only if its image under the orientation MSpin --> KO is 0. But the situation is not completely understand when the manifolds are not simply connected. It seems to get involved with the Novikov conjecture. Oh yes, I remember--it is actually false for some fundamental groups, but the trouble appears to be all with products with the Bott manifold. That is, the general conjecture is: suppose M is a Spin manfold of dimension at least 5. Then a product of M with some finite number of Bott manifolds admits a metric of positive scalar curvature."
