title: Index one, global regularity, and Stein neighborhoods
field: mathematics
tier: prose
statement: Let \(\Omega\) be a smooth bounded pseudoconvex domain such that for any \(0<\eta<1\), there exists a defining function \(\rho_\eta\) such that \(-(-\rho_\eta)^\eta\) is plurisubharmonic on \(\Omega\). Note that such an \(\eta\) always exists [MR0430315]; however, it could be small. Determine minimal assumptions on \(\Omega\) to show that the \(\bar\partial\)-Neumann operator \(N\) (or the Bergman projection \(\mathbf B\)) is globally regular. Determine minimal assumptions on \(\Omega\) to show existence of a Stein neighborhood basis for the closure. Are there domains such that \(\mathbf B\) is globally regular but no such family of defining functions exists?
