title: A corrected relative-commutant corner preorder for maximal O2-ultrapower embeddings
field: mathematics
tier: prose
statement: |-
  If \(\phi_j\colon A\to \prod_{\mathcal U}\mathcal O_2\) are
  *-homomorphisms, write \(\phi_1\leq\phi_2\) if there is a partial isometry
  \(u\) in \(A\) such that \(u^*\phi_2u=\phi_1\).

  Assume \(A\) is separable and \(A\) embeds into
  \(\prod_{\mathcal U}\mathcal O_2\). Is there a \(\leq\)-maximal embedding
  \(\phi\) of \(A\) into \(\prod_{\mathcal U}\mathcal O_2\)?
