title: Conformal Positivity of Weighted $\sigma_2$-Curvature
field: mathematics
tier: prose
statement: Let $(M^n,g)$ be compact. If $\sup_{\Gamma_2^\infty}W_2<\infty$, does the conformal class $[g]$ contain a metric with positive weighted $\sigma_2$-curvature? In particular, does every compact four-dimensional gradient Ricci soliton satisfy $\chi(M^4)>\tfrac32|\tau(M^4)|$?
