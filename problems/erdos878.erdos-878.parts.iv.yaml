  module: FormalConjectures.ErdosProblems.«878»
  decl: Erdos878.erdos_878.parts.iv
  statement: |-
    theorem erdos_878.parts.iv :
        (fun x : ℕ ↦
          (((Finset.Ico 1 x).filter fun n ↦ f n = F n).card : ℝ))
          ~[atTop] erdos_878.parts.iv.answer
  context:
    - open Erdos878
    - open Erdos878.erdos_878
    - open Erdos878.erdos_878.parts
    - open Filter Asymptotics
    - open scoped Topology Real
  definitions:
    - name: Erdos878.f
      kind: def
      text: |-
        /-- The function $f(n)=\sum_{p\mid n}p^{\lfloor\log_p n\rfloor}$. -/
        noncomputable def f (n : ℕ) : ℕ :=
          ∑ p ∈ n.primeFactors, p ^ Nat.log p n
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/878.lean#L38
    - name: Erdos878.F
      kind: def
      text: |-
        /-- The function $F(n)$ from Erdős Problem 878, with nontrivial terms $a_i \ge 2$. -/
        noncomputable def F (n : ℕ) : ℕ :=
          ((Finset.Icc 2 n).powerset.filter fun A ↦
            A ⊆ Finset.Icc 2 n ∧
              (A : Set ℕ).Pairwise (fun a b ↦ Nat.Coprime a b) ∧
              ∀ a ∈ A, ∀ p, p.Prime → p ∣ a → p ∣ n).sup fun A ↦ ∑ a ∈ A, a
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/878.lean#L43
