title: The Arithmetic Fundamental Lemma Beyond Minuscule Cases
field: mathematics
tier: prose
statement: |-
  In the arithmetic fundamental lemma setting, let $F$ be a $p$-adic field, let $E/F$ be an unramified quadratic extension, and let a regular semisimple $\gamma$ in the unitary symmetric space match $g$ in the corresponding unitary group. Does the AFL identity

  $$O'_\gamma(1_S)=-\omega(\gamma)\left\langle\Delta(N_{n-1}),(1,g)\Delta(N_{n-1})\right\rangle$$

  hold, where the right-hand side is the arithmetic intersection number of the indicated cycles on the unitary Rapoport–Zink space?
