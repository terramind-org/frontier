title: A split-target partial order and the exact composition defect
field: mathematics
tier: prose
statement: |-
  **Topological ribbon concordance.** Gordon asked whether two knots which are mutually ribbon concordant must be isotopic. This problem offers a topological version.

  Define knots $K$ and $J$ to be topologically homotopy ribbon concordant, and write $K\leq_{thrc}J$, if $K$ and $J$ are topologically concordant via an annulus $A$ such that the inclusion-induced map $\pi_1(X_K)\to\pi_1(X_A)$ is a surjection and the inclusion-induced map $\pi_1(X_J)\to\pi_1(X_A)$ is an injection. Is $\leq_{thrc}$ a partial order on the collection of knots in $S^3$?
