title: Kourovka Notebook Problem 10.20
field: mathematics
tier: prose
statement: |-
  In a Chevalley group of rank $\leq 6$ over a
  finite field of order $\leq 9$, describe all subgroups of the form
  $H=\left< H \cap U, H \cap V\right>$ that are not contained in
  any proper parabolic subgroup, where $U$ and $V$ are opposite
  unipotent subgroups.
