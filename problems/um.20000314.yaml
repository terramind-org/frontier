id: um.20000314
title: Four F-pure-threshold questions and a sharp perturbation cylinder
field: mathematics
tier: prose
statement: |-
  **13. (Mustaţă)** Let \(k\) be a field of characteristic \(p\).

  1. For \(f\in k[[x_1,\ldots,x_n]]\), is the \(F\)-pure threshold
     \(\operatorname{fpt}(f)\) a rational number?
  2. Let \(c=\operatorname{fpt}(f)\). Is
     \(\tau(f^c)\) a radical ideal?
  3. If the zero set of \(\tau(f^c)\) is zero-dimensional, does there
     exist \(N>1\) such that for every
     \(g\in k[[x_1,\ldots,x_n]]\) of order at least \(N\),
     \[
        \operatorname{fpt}(f)=\operatorname{fpt}(f+g)?
     \]

  **14.** Does the set
  \[
    \{\operatorname{fpt}(f)\mid
      f\in k[[x_1,\ldots,x_n]]\}
  \]
  have the ascending chain condition?
