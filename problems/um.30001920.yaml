title: Mirror Symmetry for Relative Hodge Numbers
field: mathematics
tier: prose
statement: |-
  Mirror Hodge-number conjecture: For a mirror pair $(\widetilde X_\sigma,w)$ and $(\widetilde X_{\sigma^\vee},w^\vee)$,

  $$h^{p,q}(\widetilde X_\sigma,w)=h^{n-p,q}(\widetilde X_{\sigma^\vee},w^\vee)$$

  when both spaces are smooth, with orbifold Hodge numbers used in the orbifold case.
