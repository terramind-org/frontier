id: um.30002502
title: Intermediate BMO Spaces for Dirichlet Series
field: mathematics
tier: prose
statement: |-
  Does there exist a BMO-type space $\mathcal B$ for Dirichlet series, intermediate between $H^\infty$ and the candidate Dirichlet-series BMO spaces, such that: for every $f\in\mathcal B$, $\sigma>0$, and $p<\infty$,
  $$\limsup_{T\to\infty}\frac1{2T}\int_{-T}^{T}|f(\sigma+it)|^p\,dt<\infty;$$
  and, for every $\sigma>1/2$, the corresponding horizontal shift of the alternating zeta function belongs to $\mathcal B$?
