title: Tverberg Numbers for Unions of Convex Sets
field: mathematics
tier: prose
statement: "What is the least integer $f_r(d,s_1,\\ldots,s_r)$ such that every set $P$ of that many points in $\\mathbb R^d$ has a partition $P=P_1\\sqcup\\cdots\\sqcup P_r$ with the following property: whenever each $C_i$ is $s_i$-convex and contains $P_i$, the intersection $\\bigcap_{i=1}^r C_i$ is nonempty?"
