title: Symmetric Relation Coloring and Bounded Monochromatic Components
field: mathematics
tier: prose
statement: Determine whether $(4,C)$-SymRelCol has a sudden hardness jump, and determine the order of $g(6,n)$, the least $g$ such that every $n$-vertex graph of maximum degree 6 has a two-coloring with every monochromatic component of order at most $g$.
