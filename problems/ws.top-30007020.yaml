  \section*{Canonical nonvanishing for smooth fourfolds}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If X is a smooth connected projective complex fourfold and $K_X$ is pseudo-effective, must $H^{0}(X,mK_X)$ be nonzero for at least one positive integer m?
  \subsection{Short English statement}
  If X is a smooth connected projective complex fourfold and $K_X$ is pseudo-effective, must $H^{0}(X,mK_X)$ be nonzero for at least one positive integer m?
