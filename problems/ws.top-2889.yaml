  \item[\hypertarget{source:2889:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 2889 (KP-4.13). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:2889:2}{S2}] R. İnanç Baykur, Robion C. Kirby and Daniel Ruberman, K3—A New Problem List in Low-Dimensional Topology, Mathematical Surveys and Monographs 295 (2026), author version, Problem 4.13 and Remarks, PDF page 200. \url{https://math.berkeley.edu/sites/default/files/surv-295-ruberman-watermarked-author-pdf.pdf}.
