title: Geometric Hydrodynamics in Open Problems — Problem 2
field: mathematics
tier: prose
statement: |-
  It turned out that in all of the above cases the corresponding configuration space has a natural groupoid structure.
  Using the corresponding Lie groupoids of multiphase diffeomorphisms instead of the Lie group of
  volume-preserving transformations in Arnold's setting one can describe the corresponding Lie algebroids and obtain geometric and Hamiltonian interpretations for the motion of the corresponding multiphase fluids, ``homogenized" vortex sheets, and
  generalized flows. Solutions of the above Euler equations were proved to be precisely the geodesics of an $L^2$-type right-invariant (source-wise) metric on the corresponding Lie groupoids of multiphase volume-preserving diffeomorphisms [IK18, IK22]. Another interesting domain for applications of Lie groupoids is provided by elasticity theory, cf.
  [mar-hugh, Kupf, JimLeon].

  Extend the geodesic and Hamiltonian descriptions of the Euler-Arnold equations on Lie groupoids to problems of elasticity theory.
