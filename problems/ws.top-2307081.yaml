statement: |-
  \section{Research Problems in Function Theory — Problem 7.81}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $H^\infty=\mathcal O(\mathbb D)\cap L^\infty(\mathbb D)$ with norm $\|f\|_\infty=\sup_{z\in\mathbb D}|f(z)|$, and let $(H^\infty)^*$ be its bounded complex-linear dual. An inner function is an element of $H^\infty$ with radial boundary values of modulus $1$ almost everywhere. Let $I$ be all such functions, including unimodular constants; the dual norm is $\|\Lambda\|=\sup_{\|f\|_\infty\le1}|\Lambda(f)|$.
  \paragraph{Statement recorded in the supplied source.}
  If $\Lambda_n\in(H^\infty)^*$ and for every $\phi\in I$ there is a finite $C(\phi)$ with $|\Lambda_n(\phi)|\le C(\phi)$ for all $n$, must $\sup_n\|\Lambda_n\|<\infty$? \sref{statement}{2}
  \subsection{Short English statement}
  Does pointwise boundedness on all inner functions force uniform boundedness of a sequence of bounded linear functionals on the bounded holomorphic functions?
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Walter K. Hayman and Edward F. Lingham, Research Problems in Function Theory (2018), Problem 7.81, its complete update and relevant preceding definitions. \url{https://arxiv.org/abs/1809.07200}.
  \end{description}
  \label{end:statement}
