title: Visibility Graphs of Points, Segments and Polygons — Problem 11
field: mathematics
tier: prose
statement: |-
  All three above problems are open for segment visibility graphs.
  Only characterization known is for a sub-class
  given by Everette et al. [ehkn-cgta2-2000].
  They have characterized those segment visibility graphs that do not have $K_5$ (a complete graph of
  five vertices) as a minor. A graph $M$ is called a *minor* of a graph $G$ if $M$ can be obtained
  from $G$ by a sequence of vertex deletions, edge deletions and edge contractions. Their characterization
  gives a straightforward polynomial time algorithm for recognizing this class of graphs.

  Given a graph $G$ in adjacency matrix form, determine whether $G$ is the segment visibility graph
  of a set of disjoint segments $S$ in the plane.
