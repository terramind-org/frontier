title: Efficient generation and a completable-coordinate strong-lifting criterion
field: mathematics
tier: prose
statement: |-
  **Related question (S. M. Bhatwadekar).** More specifically, let
  \[
    \mathbb C[X_1,\ldots,X_5]\xrightarrow{\alpha}
    \mathbb C[Y_1,Y_2]
  \]
  be a surjective \(k\)-algebra homomorphism, and let \(I=\ker(\alpha)\).
  We know \(\mu(I/I^2)=3\).  Is \(\mu(I)=3\)?
