statement: |-
  \section{Threshold-Avoiding Control for Bank Capital Ratios}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  For a ratio process $R_t$, the first threshold-crossing time is $\tau=\inf\{t\geq0:R_t<0.08\}$. A control law chooses allowed actions using the information available up to the current time.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The ratio dynamics, admissible controls, almost-sure versus probabilistic avoidance, and delay objective are not present in the supplied question; they must be taken from the cited model.

  Source-record limitation: The stochastic ratio dynamics, admissible controls, and optimal-delay criterion of the named model are absent.
  \paragraph{Statement recorded in the supplied source.}
  Does there exist a control law for the stochastic model that prevents a bank's capital adequacy ratio from dropping below $0.08$? If not, determine a control law that postpones the first threshold crossing for as long as possible. \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Find an admissible policy preventing capital-ratio failure, or one that delays the first failure optimally.
