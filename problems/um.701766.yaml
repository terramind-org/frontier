title: Kourovka Notebook Problem 20.108
field: mathematics
tier: prose
statement: |-
  The *holomorph* $\mathrm{Hol}(G)$ of a group $G$ can be defined as the normalizer of the subgroup of left translations in the group of all permutations of the set $G$. The *multiple holomorph* $\mathrm{NHol}(G)$ of $G$ is the normalizer of the holomorph. Set $T(G) = \mathrm{NHol}(G)/\mathrm{Hol}(G)$.

  a) Is there a centerless group $G$ for which $T(G)$ is not an elementary abelian 2-group?

  b) Is there a finite centerless group $G$ for which $T(G)$ is not an elementary abelian 2-group?

  c) (A. Caranti). Is there a finite $p$-group $G$ for which the order of $T(G)$ has a prime divisor not dividing $(p-1)p$?
