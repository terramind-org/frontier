schema: 1
id: selfridge.selfridge-conjecture.variants.pseudo-counterexample
title: "Practice: Selfridge's conjectures (variant: pseudo_counterexample)"
field: mathematics
tier: proof
statement: |-
  Selfridge's test variant:
  Let $p$ be an odd number, with $p \equiv \pm 1 \pmod{5}$, $2^{p-1} \equiv 1 \pmod{p}$
  and $F_{p-1} \equiv 0 \pmod{p}$, then $p$ is a prime number.

  The number $6601$ is a conterexample to this test satisfying $6601 ≡ 1 \mod 5$
ams:
  - 11
tags:
  - wikipedia
  - variant
  - practice
references:
