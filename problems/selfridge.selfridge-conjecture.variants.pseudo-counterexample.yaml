  decl: Selfridge.selfridge_conjecture.variants.pseudo_counterexample
  statement: |-
    theorem selfridge_conjecture.variants.pseudo_counterexample :
        IsPseudoSelfridge 6601 ∧ ¬ (6601).Prime ∧ 6601 ≡ 1 [MOD 5]
  context:
    - open Selfridge
    - open Selfridge.selfridge_conjecture
    - open Selfridge.selfridge_conjecture.variants
  definitions:
    - name: Selfridge.IsPseudoSelfridge
      kind: structure
      text: |-
        /-- A number `p` satisfies the *Pseudo Selfridge condition* if
        1. `p` is odd,
        2. `p ≡ ± 1 (mod 5)`,
        3. `2^(p-1) ≡ 1 (mod p)`
        4. `(p-1).fib ≡ 0 (mod p)`


        This is a variant of the condition that is tested in the PSW conjecture, and appears in the
        wiki page mentioned above.

        Note: this is non-standard terminology. -/
        @[mk_iff]
        structure IsPseudoSelfridge (p : ℕ) where
          is_odd : Odd p
          mod_5 : p ≡ 1 [MOD 5] ∨ p ≡ 4 [MOD 5]
          pow_2 : 2^(p-1) ≡ 1 [MOD p]
          fib : (p-1).fib ≡ 0 [MOD p]
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/Selfridge.lean#L49
