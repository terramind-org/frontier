title: The Lyapin's Notebook — Problem 6
field: mathematics
tier: prose
statement: |-
  (S. Kublanovsky)
  Describe the covers of the semigroup variety $RS_n$ in the lattice of varieties of all semigroups and in the lattice of varieties satisfying the identity $x^2 = x^{n+2}$. \\
  It follows from the results of [Kubl5] that in the latter lattice the number of covers is finite. It is also known that every subvariety of $RS_1$ has only finitely many covers (see [Kubl4]).
