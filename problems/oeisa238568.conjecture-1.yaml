    - name: OeisA238568.a
      kind: def
      text: |-
        /-- Number of positive integers $k < n$ such that $n^2 - \pi(k n)$ is prime. -/
        def a (n : ℕ) : ℕ :=
          ((Ico 1 n).filter fun k => Nat.Prime (n ^ 2 - Nat.primeCounting (k * n))).card
