title: Trajectory Geometry Near Analytic Vector-Field Singularities
field: mathematics
tier: prose
statement: Let $X$ be a real analytic vector field with a singular point at $0\in\mathbb R^n$. What qualitative dynamics near $0$ can be described from geometric properties of trajectories converging to $0$, including their finiteness properties with respect to analytic sets and their behavior relative to neighboring trajectories?
