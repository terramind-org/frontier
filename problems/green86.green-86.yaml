lean:
  module: FormalConjectures.GreensOpenProblems.«86»
  decl: Green86.green_86
  statement: |-
    theorem green_86 :
        ∀ c : ℝ, 0 < c → ∃ n₀ : ℕ, ∀ A : Finset ℤ, n₀ ≤ #A →
          ∃ θ : ℝ, ∀ t : ℝ, (numInInterval A θ t : ℝ) ≤ (#A : ℝ) ^ c
  context:
    - open Green86
    - open scoped Finset
  definitions:
    - name: Green86.numInInterval
      kind: def
      text: |-
        /--
        `numInInterval A θ t` is the number of $a \in A$ such that $\theta a \pmod 1$ lies in the
        interval $[t, t + 1/n)$ of $\mathbb{R}/\mathbb{Z}$, where $n = |A|$.
        -/
        noncomputable def numInInterval (A : Finset ℤ) (θ t : ℝ) : ℕ :=
          #{a ∈ A | Int.fract (θ * ((a : ℤ) : ℝ) - t) < 1 / (#A : ℝ)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/GreensOpenProblems/86.lean#L39
