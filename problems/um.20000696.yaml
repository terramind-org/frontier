title: A safe-range bridge between character and t-aspect orthogonality
field: mathematics
tier: prose
statement: The mechanism for computing moments in families such as Dirichlet characters \(\chi\pmod q\), \(q\leq Q\), uses congruence orthogonality, unlike the \(t\)-aspect mechanism that selects pairs with \(|m-n|\) small. Yet the predicted moment formulae have the same unitary-family structure. Why?
