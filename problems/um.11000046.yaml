title: Conjecture 4.8 — (Mod g is Kahler).
field: mathematics
tier: prose
statement: "(Mod g is Kahler). Forg≥ 3, the group Modg is a Kahler group, i.e. it is isomorphic to the fundamental group of a compact Kahler manifold. It was shown in [ V e] that Mod 2 is not a Kahler group. This is proven by reducing (via finite extensions) to the pure braid group case; these groups are not Kahler since they are iterated extensions of free groups by free groups. A natural place to begin proving Conjecture 4.8 is the same strategy that Toledo uses in [ T o] for nonuniform lattices in SU( n, 1),n ≥ 3. The main point is the following. One starts with a smooth open variety V and wants to prove that π1V is a Kahler group. The first step is to find a compactificationV ofV which is projective, and for which V−V has codimension at least 3. This assumption guarantees that the intersection of the generic 2-plane P in projective space with V misses V. The (weak) Lefschetz Theorem then implies that the inclusion i:V∩P ↪→V induces an isomorphism on fundamental groups, thus giving that π1V is a Kahler group. 6Note: This statement is a slight cheat; the actual version requires the language of orbi-complexes. 34 B. Farb One wants to apply this idea to the Deligne-Mumford compactification Mg of moduli space Mg. This almost works, except that there is a (complex) codimension one singular stratum of Mg, so that the above does not apply. Other compactifications of Mg are also problematic in this regard. What about the Torelli group Ig? This group, at least for g≥ 6, is not known to violate any of the known constraints on Kahler groups. Most notably, Hain [ Ha3] proved the deep result that for g≥ 6 the group Ig has a quadratically presented Malcev Lie algebra; this is one of the more subtle properties posessed by Kahler groups. Note Akita’s theorem (Theorem 5.13 above) that the classifying space of Ig,g≥ 7 does not have the homotopy type of a finite complex shows that these Ig are not fundamental groups of closed aspherical manifolds. There are of course Kahler groups (e.g. finite Kahler groups) with this property. In contrast to Conjecture 4.8, I have recently proven [ F a3] the following."
