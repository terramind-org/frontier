statement: Conjecture. Subsets with Low Hausdorﬀ Dimensions are Remains of Scalar Curvature Blow-ups.All closed subset Y ⊂W with dimHau(Y ) <n−1=dim(W)−2, are intersections of decreasing families of smooth domainsVi ⊂W with Sc(∂Vi)→+∞ This is obvious forn = 2. Also subsets Y ⊂W which are contained in smooth hypersurfacesZn ⊂W and which havezero Hausdorﬀmesn−1, are representable as such intersections by a simple argument. It is convenient at this point deﬁneScg(∂↓Y ) as the supremum of the numbersσ such that every neighbourhoodU ⊃Y contains a smaller smoothV ⊃Y such that the scalar curvature of∂V for the metric induced from the metricg in the ambient manifoldW.
