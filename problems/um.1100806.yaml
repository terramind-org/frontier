title: Questions in Geometric Group Theory — Q 8.6
field: mathematics
tier: prose
statement: (Olympia Talelli) Is there a torsion-free group $G$ of infinite cohomological dimension such that there is $n_0$ with the property that if $H$ is a subgroup of $G$ with finite cohomological dimension $\operatorname{cd} H$, then $\operatorname{cd} H \le n_0$?
