title: Hirzebruch's 1954 Problem List — Problem 8
field: mathematics
tier: prose
statement: |-
  Are the $h^{p,q}$ and the Chern characteristic numbers of an algebraic variety $V_n$ topological invariants of $V_n$? If not,
  determine all those linear combinations of the $h^{p,q}$ and the Chern characteristic numbers which are topological invariants.
