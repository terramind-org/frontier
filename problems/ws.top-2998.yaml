  \item[\hypertarget{source:2998:2}{S2}] R. İnanç Baykur, Robion C. Kirby and Daniel Ruberman (eds.), \emph{K3: A New Problem List in Low-Dimensional Topology}, AMS Mathematical Surveys and Monographs 295 (2026), author preliminary edition. Problem4.122 and all four remarks, pages291--292. \url{https://math.berkeley.edu/sites/default/files/surv-295-ruberman-watermarked-author-pdf.pdf}.
  \item[\hypertarget{source:2998:3}{S3}] Riccardo Piergallini and Daniele Zuddas, \emph{A universal ribbon surface in $B^4$}, arXiv:math/0308222v1 (2003); Proceedings of the London Mathematical Society90 (2005),763--782. Introduction, page2 definitions, Section4 Questions2 and4. \url{https://arxiv.org/pdf/math/0308222v1}.
