title: Uniform Representation Zeta Functions of Congruence Groups
field: mathematics
tier: prose
statement: Let $L$ be a Lie lattice over $\mathbb Z$ such that $\mathbb Q\otimes_{\mathbb Z}L$ is a semisimple $\mathbb Q$-Lie algebra of dimension $d$. For almost all primes $p$, let $G_{p,k}$ be the associated principal congruence groups. Does there exist $W_L(X,Y)\in\mathbb Q(X,Y)$ such that $\zeta_{G_{p,k}}^{\mathrm{irr}}(s)=p^{dk}W_L(p,p^{-s})$ for every $k\geq0$ and almost all $p$?
