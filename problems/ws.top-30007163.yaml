statement: |-
  \section*{Sharp nodal upper bound on smooth surfaces}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each connected closed smooth Riemannian surface (M,g), does one finite C(M,g) bound $H^{1}_g({u=0})\leq C(M,g)\surd \lambda $ for every nonzero real smooth eigenfunction $-\Delta _g$ $u=\lambda u$ with $\lambda >0$?
  \subsection{Short English statement}
  For each connected closed smooth Riemannian surface (M,g), does one finite C(M,g) bound $H^{1}_g({u=0})\leq C(M,g)\surd \lambda $ for every nonzero real smooth eigenfunction $-\Delta _g$ $u=\lambda u$ with $\lambda >0$?
