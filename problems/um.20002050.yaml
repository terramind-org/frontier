title: A spectral-gap criterion for the critical Paneitz kernel
field: mathematics
tier: prose
statement: |-
  **Problem 28:** When does the equation \(P f=0\) have only constant solutions? On a compact manifold in two dimensions this is always true: harmonic functions are constant. In four dimensions, though there are conditions under which \(P f=0\) has only constant solutions, there are also counterexamples, even on conformally flat manifolds.

