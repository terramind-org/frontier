title: Elliptic cohomology 3 — Dennis McLaughlin and Jean-Luc Brylinski also thought along these lines.
field: mathematics
tier: prose
statement: Dennis McLaughlin and Jean-Luc Brylinski also thought along these lines. They wanted to use gerbes, or 2-gerbes maybe, instead. I could never understand what a gerbe was, but I am sure it is supposed to be a bundle of groupoids. I haven't heard anything about this for a while. Can this idea be made to go somewhere?
