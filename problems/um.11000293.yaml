title: Question 5.1 — Where precisely does the rational homology of Aut(Fn) stabilize?
field: mathematics
tier: prose
statement: Where precisely does the rational homology of Aut(Fn) stabilize? And for Out(Fn)? There are only two known non-trivial classes in the (unstable) rational homology of Out( Fn) [49, 26 ]. However, Morita [ 69] has defined an infinite series of cycles, using work of Kontsevich which identifies the homology of Out( Fn) with the cohomology of a certain infinite-dimensional Lie algebra. The first of these cycles is the generator of H4(Out(F4); Q) ∼= Q, and Conant and Vogtmann showed that the second also gives a non-trivial class, in H8(Out(F6); Q) [ 26]. Both Morita and Conant-Vogtmann also defined more general cycles, parametrized by odd-valent graphs.
