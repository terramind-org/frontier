title: Blowup Residues, Stability, and Rates for Mass-Critical gKdV
field: mathematics
tier: prose
statement: For the mass-critical generalized Korteweg-de Vries equation, determine whether every finite-time, finite-point blowup solution with rate exponent $\nu\in(1/3,1/2)$ has an $H^1$ blowup residue, and whether the finite-time, finite-point blowup family constructed for $\nu\in(3/7,1/2)$ is stable. Determine whether the only $H^1$ power blowup rates are $\nu=2/5$ and $\nu>3/7$; if so, construct the remaining rates $\nu\in(1/3,3/7)\setminus\{2/5\}$ for infinite-energy solutions in a suitable $H^\kappa$, with $0<\kappa<1$.
