title: Ultraproduct II_1 Factors — Problem 19
field: mathematics
tier: prose
statement: If $N$ is a super McDuff II$_1$ factor, and $N$ is elementarily equivalent to $M$ then is $M$ super McDuff? In particular, does there exist a super McDuff II$_1$ factor which is not uniformly super McDuff?
