title: An elementary boundary and finite-atom compactness reduction for AESW
field: mathematics
tier: prose
statement: |-
  The Aissen--Edrei--Schoenberg--Whitney (AESW) theorem states that
  a real sequence $(a_0,a_1,a_2,\ldots)$ with $a_0 \neq 0$ is a one-sided
  PF sequence $\Leftrightarrow F(z)=a_0 e^{\delta z}
  \prod\limits_{j=0}^{\infty}\frac{1+\alpha_j z}{1-\beta_jz}$ for
  $\alpha_j, \beta_j, \delta, a_0 \geq 0$ and $\sum_j (\alpha_j + \beta_j)
  < \infty$. Find a proof that does not use Nevanlinna theory: in other
  words, the fact that if $F(z)$ is entire of genus at most one, and has no
  zeros, then it is an exponential function $ae^{\delta z}$ for some
  $\delta \geq 0$.
