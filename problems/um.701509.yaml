statement: |-
  (I. Kaplansky). For $G\neq 1$, show that
  the augmentation ideal of the group algebra $K[G]$ is equal to the Jacobson radical of the ring
  if and only if $\mathrm{char} K=p>0$ and
  $G$ is a locally finite $p$-group.
