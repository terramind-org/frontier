statement: |-
  [Eyssidieux-Guedj-Zeriahi]
  Let $\omega$ be a smooth semi-positive and big form on a compact K\"ahler manifold $X$.
  Is any function $\varphi \in PSH(X,\omega)$ the decreasing limit of smooth $\omega$-psh functions ?
