title: Volume-Above Distance-Below Without Fixed Topology
field: mathematics
tier: prose
statement: Suppose compact oriented Riemannian manifolds have a uniform diameter bound, volumes converging to that of a compact limit manifold, and metric tensors bounded below by factors converging to one relative to the limit metric. Prove volume-preserving intrinsic-flat convergence without assuming that the manifolds are diffeomorphic to the limit.
