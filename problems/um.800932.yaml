title: Open Problems and Questions about Geodesics — Conjecture 12 (Klingenberg)
field: mathematics
tier: prose
statement: |-
  The class of compact manifolds that support metrics with variable negative curvature is much larger than the class that support hyperbolic metrics (of constant negative curvature). The earliest examples of manifolds that support variable but not constant negative curvature were given by Mostow-Siu [Mos-Siu1980] and Gromov-Thurston [Gro-Thu1987]. Recent work of Ontaneda has vastly increased the supply of examples [Ontaneda2011, Ontaneda2014].

  *If a closed manifold admits a metric with Anosov geodesic flow, then it admits a metric with negative sectional curvature.*
