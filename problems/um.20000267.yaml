title: A universal counterexample, semiampleness persistence, and degree escape
field: mathematics
tier: prose
statement: Suppose that \(X\) is a variety over \(k\), with \(\operatorname{char} k=0\), and \(L\) is a nef divisor on \(X\). Must \(L_p\) be nef on \(X_p\) for infinitely many \(p\)? What about in the case \(L=K_X\)? What if “nef” is replaced by “semiample”?
