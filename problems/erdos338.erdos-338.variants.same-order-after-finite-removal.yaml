lean:
  module: FormalConjectures.ErdosProblems.«338»
  decl: Erdos338.erdos_338.variants.same_order_after_finite_removal
  statement: |-
    theorem erdos_338.variants.same_order_after_finite_removal :
        ∀ A : Set ℕ,
          (∃ h : ℕ, ∀ F : Set ℕ, F.Finite → basisOrder (A \ F) = (h : ℕ∞)) →
          ∃ t, HasRestrictedOrder A t
  context:
    - open Erdos338
    - open Erdos338.erdos_338
    - open Erdos338.erdos_338.variants
    - open Filter
  definitions:
    - name: Erdos338.HasRestrictedOrder
      kind: def
      text: |-
        /-- `HasRestrictedOrder A t` means that every sufficiently large natural number is a sum of at most
        $t$ distinct elements of $A$.

        The summands form a `Finset`, so they are distinct. A summand $0$ never helps, so the notion does
        not depend on whether $0 \in A$. -/
        def HasRestrictedOrder (A : Set ℕ) (t : ℕ) : Prop :=
          ∀ᶠ m in atTop, ∃ S : Finset ℕ, (∀ x ∈ S, x ∈ A) ∧ S.card ≤ t ∧ ∑ x ∈ S, x = m
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/338.lean#L55
    - name: Erdos338.basisOrder
      kind: def
      text: |-
        /-- The order of $A$: the least $h$ with `HasOrder A h`, or `⊤` if $A$ is not a basis. -/
        noncomputable def basisOrder (A : Set ℕ) : ℕ∞ :=
          ⨅ (h : ℕ) (_ : HasOrder A h), (h : ℕ∞)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/338.lean#L63
