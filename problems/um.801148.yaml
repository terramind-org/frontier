title: Nijenhuis Geometry and Integrable Systems — Problem 1
field: mathematics
tier: prose
statement: |-
  For the KdV system, this was reported to be done already in [veselov], though we did not find detailed formulas. The booklet [moser81] relates stationary solutions of the KdV to the solutions of the Neumann systems. Namely, it is shown that the potential energy of the Neumann system evaluated along the trajectory and suitably scaled is a solution of the KdV system. Moreover, the solutions of the KdV equations obtained by this method are related to potentials in the Hills-Schr\"odinger equation whose spectrum has finitely many bands. See also [DKN, p. 219, eqn (2.162), pp. 247, 248].

  What is special in the potential generated by $V(t)= C(t)/m(t)$?
