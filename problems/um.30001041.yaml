title: Entropy of Globally Minimal Geodesic Flows
field: mathematics
tier: prose
statement: Let $M$ be a compact manifold of hyperbolic type, let $g$ be any Riemannian metric on $M$, let $\varphi_t$ be its geodesic flow on $SM$, and let $SM_{\min}$ consist of unit vectors whose lifts are globally minimizing geodesics. Is $h_{\mathrm{top}}(\varphi_t|_{SM_{\min}})=h_{\mathrm{Vol}}(g)$? If $M$ is a higher-genus surface, is the Liouville-measure entropy $h_{\mu_L}(\varphi_t)>0$ for every metric $g$?
