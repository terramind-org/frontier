id: um.30002925
title: Limit Theorems in the Condensation Regime
field: mathematics
tier: prose
statement: |-
  In the stochastic house-of-cards model, let $\beta$ be the mutation probability and $\mu$ the mutant-fitness distribution. In the condensation regime

  $$\beta\int_0^1\frac{\mu(dx)}{1-x}<1,$$

  the population size $N(t)$ has exponential growth rate $\lambda^*=1-\beta$ but is not strictly exponential. Determine the correction to $e^{\lambda^*t}$ needed to obtain a nondegenerate limit theorem for $N(t)$.
