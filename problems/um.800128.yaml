title: Foliations and Diffeomorphism Groups — Question 69
field: mathematics
tier: prose
statement: |-
  Does an analog of discrete $\mathrm{GV}$ exist in higher dimensions? In particular, does there exist a $3$-cocycle in the third group cohomology $H^3(\mathrm{PL}_c(\mathbb{R}^2); \mathbb{R})$ that induces a surjection
  \[
  H_3(\mathrm{PL}_c(\mathbb{R}^2); \mathbb{Z})\twoheadrightarrow \mathbb{R}.
  \]
