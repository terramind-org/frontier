title: Open Problems in Arithmetic Dynamics — Question 1
field: mathematics
tier: prose
statement: |-
  Let $S$ be a set, and let $T\subseteq S$ be a subset. Classify those maps
  $f:S\to S$ with the property that for every $\alpha\in S$, the set
  \[
  \bigl\{ n \ge 0 : f^n(\alpha) \in T \bigr\}
  \]
  has some nice structure, for example, it is the union of finitely many
  one-sided arithmetic progressions.
