title: Kourovka Notebook Problem 16.92
field: mathematics
tier: prose
statement: |-
  Let $F$ be an infinitely generated free group.
  Is $\text{Aut} F$ equal to its derived subgroup? This is true if
  $F$ is countably generated (R. Bryant,
  V. A. Roman'kov, *J. Algebra*, **209** (1998), 713--723).
