statement: |-
  \section*{Critical nonpercolation on locally finite quasi-transitive graphs below one}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every infinite connected locally finite undirected quasi-transitive graph whose independent bond critical probability $p_c$ is less than one, does independent bond percolation at $p_c$ have no infinite open cluster almost surely?
  \subsection{Short English statement}
  For every infinite connected locally finite undirected quasi-transitive graph whose independent bond critical probability $p_c$ is less than one, does independent bond percolation at $p_c$ have no infinite open cluster almost surely?
