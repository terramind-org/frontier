title: Equalities Among Critical Biases in Positional Games
field: mathematics
tier: prose
statement: In $(1:b)$ biased Maker--Breaker positional games played on the edges of the complete graph $K_n$, let $b_H$, $b_{D_k}$, and $b_{C_k}$ denote respectively the critical threshold biases for the Hamiltonicity game, the minimum-degree-$k$ game, and the $k$-vertex-connectivity game. Do the asymptotic equalities $b_H = b_{D_2}$ and $b_{C_k} = b_{D_k}$ hold?
