title: A Lagrangian-locus reduction for stratified Liouville skeleta
field: mathematics
tier: prose
statement: "**Recovered question.** Let \\((X^{2n},\\lambda)\\) be a Liouville manifold of the half-dimensional Morse/homotopy type contemplated in problem 3.2. Suppose, for the given Liouville form \\(\\lambda\\), that its skeleton (core) is stratified by smooth manifolds of dimension at most \\(n\\). Is \\(\\lambda\\) Liouville homotopic to a Weinstein structure? Is there a one-parameter version?"
