title: Projectivized Toric Vector Bundles as Toric Varieties
field: mathematics
tier: prose
statement: Characterize the ways in which the projectivization of a toric vector bundle behaves like a smooth projective toric variety. Determine which toric-geometric structures, invariants, and vanishing properties extend to such projectivizations.
