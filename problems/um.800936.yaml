title: Open Problems and Questions about Geodesics — Question 16 (Benjamin Schmidt)
field: mathematics
tier: prose
statement: |-
  One can ask a similar question for non-manifolds.
  Consider a 2-dimensional (metrical) simplicial complex such that every simplex is hyperbolic with geodesic edges and such that $CAT(-1)$ condition holds on every vertex. Assume in addition that every edge is contained in at least two simplices.

  *Does the marked length spectrum determine such a metric (in the class of all locally $CAT(-1)$ metrics on this space, or in the class of all 2-dimensional (metrical) simplicial complexes
  with the above properties
  homeomorphic to the given complex)?*
