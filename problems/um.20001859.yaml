statement: |-
  **10. (Theran)** Consider a Delaunay triangulation (no vertex is inside the
  circumcircle of any triangle). Fix a combinatorial type of a triangulation.
  Question: What is the configuration space?

  \(d=2\) it is a ball

  \(d=3\) is it universal?
