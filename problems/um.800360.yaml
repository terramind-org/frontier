title: Iwahori-Hecke Algebras — Problem 1
field: mathematics
tier: prose
statement: |-
  Let $I$ be a finite set and let $(m_{ij})_{(i,j)\in I\times I}$ be a symmetric matrix whose diagonal entries are $1$
  and whose nondiagonal entries are integers $\ge2$ or $\infty$. Let $W$ be the group with generators
  $\{s_i;i\in I\}$ and relations $(s_is_j)^{m_{ij}}=1$ for any $i,j$ such that $m_{ij}<\infty$; this is a Coxeter
  group. (Examples of Coxeter groups are the Weyl groups of simple Lie algebras; these are finite groups. Other
  examples are the affine Weyl groups which are almost finite.)
  For $w\in W$ let $|w|$ be the smallest integer $n\ge0$ such that $w$ is a product of $n$ generators
  $s_i,i\in I$. We assume that we are given a weight function $L:W@>>>\mathbb{N}$ that is, a function such that
  $L(w)>0$ for all $w\in W-\{1\}$ and $L(ww')=L(w)+L(w')$ for any $w,w'$ in $W$ such that $|ww'|=|w|+|w'|$.
  (For example, $w\mapsto|w|$ is a weight function.)
  Let $A=\mathbb{Z}[v,v
  - ]$ where $v$ is an indeterminate. Let $H$ be the free $A$-module with basis $\{T_w;w\in W\}$.
  There is a unique structure of associative $A$-algebra on $H$ for which
  $(T_{s_i}+v^{-L(s_i)})(T_{s_i}-v^{L(s_i)})=0$ for $i\in I$ and $T_wT_{w'}=T_{ww'}$ for any $w,w'$ in $W$ such
  that $|ww'|=|w|+|w'|$; this is the Iwahori-Hecke algebra associated to $W,L$.

  For $c\in\mathbb{C}-\{0\}$ let $H_c=\mathbb{C}\otimes AH$ where $\mathbb{C}$ is viewed as an $A$-algebra via the ring homomorphism
  $A@>>>\mathbb{C},v\mapsto c$. Now $H_c$ is also referred to as an Iwahori-Hecke algebra.

  (a) {\it Show that the algebras associated in [S20] to a supercuspidal representation of a parabolic
  subgroup of a $p$-adic reductive group are (up to extension by a group algebra of a small finite group) of
  the form $H_q$ where $q$ is a power of $p$, with $H$ associated to an affine Weyl group $W$ and with $L$
  in the collection $\Sigma_W$ of weight functions on $W$ described in [L91, \mathbb{S]17}, [L95], [L02].}
  \newline
  For example, if $W$ is of affine type $F_4$, then $\Sigma_W$ consists of all $L$ whose values on $\{s_i;i\in I\}$
  are $(1,1,1,1,1)$ or $(1,1,1,2,2)$ or $(2,2,2,1,1)$ or $(1,1,1,4,4)$; if $W$ is of affine type $G_2$, then
  $\Sigma_W$ consists of all $L$ whose values on $\{s_i;i\in I\}$ are $(1,1,1)$ or $(1,1,3)$ or $(3,3,1)$ or
  $(1,1,9)$.

  The statement analogous to (a) for groups with connected centre over a finite field $F_q$ instead of $p$-adic
  groups is known to hold, without the words in parenthesis; in that case, $W$ is a Weyl group and $\Sigma_W$
  consists of the weight functions on $W$ described in [L78, p.35].
