title: Kourovka Notebook Problem 18.100
field: mathematics
tier: prose
statement: |-
  For a given class of groups $\mathfrak{X}$, let $(\mathfrak{X},\infty)^{\ast }$ denote the class of groups in which every infinite subset contains two distinct elements $x$ and $y$ that satisfy $\langle x,x^{y}\rangle\in\mathfrak{X}$.
  Let $G$ be a finitely generated soluble-by-finite group in the class $(\mathfrak{X},\infty)^{\ast }$, let $m$ be a positive integer, and let $\mathfrak{F}$, $\mathfrak{E}_{m}$, $\mathfrak{E}$, $\mathfrak{N}$, and $\mathfrak{P}$ denote the classes of finite groups, groups of exponent dividing $m$, groups of finite exponent, nilpotent groups, and polycyclic groups, respectively.

  a) If $\mathfrak{X}=\mathfrak{E}\mathfrak{N}$, then is $G$ in $\mathfrak{E}\mathfrak{N}$?

  b) If $\mathfrak{X}=\mathfrak{E}_{m}\mathfrak{N}$, then is $G$ in $\mathfrak{E}_{m}(\mathfrak{F}\mathfrak{N})$?

  c) If $\mathfrak{X}=\mathfrak{N}(\mathfrak{P}\mathfrak{F})$, then is $G$ in $\mathfrak{N}(\mathfrak{P}\mathfrak{F})$?
