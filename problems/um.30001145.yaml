title: Admissible Groups over Global Function Fields
field: mathematics
tier: prose
statement: For the function field $F$ of a curve over a finite field, characterize the finite groups $G$ that are admissible over $F$, meaning that $G$ occurs as the Galois group of a maximal subfield of an $F$-division algebra.
