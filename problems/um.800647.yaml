title: Selection Principles Milestone Problems — Problem 20
field: mathematics
tier: prose
statement: |-
  It is often the case that properties of the form $\Pi(\Omega,\mathfrak{V})$ where
  $\Omega\subseteq\mathfrak{V}$ are equivalent to $\Pi(\Lambda,\mathfrak{V})$ [coc1, coc2, coc7, coc8, strongdiags].
  But we do not know the answer to the following simple question.

  Is $\binom{\Omega}{\mathcal{O}^{\gamma\mbox{-*\tiny gp*}}}$ equivalent to $\binom{\Lambda}{\mathcal{O}^{\gamma\mbox{-*\tiny gp*}}}$?
