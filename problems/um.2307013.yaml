title: Research Problems in Function Theory — Problem 7.13
field: mathematics
tier: prose
statement: One part of Nevanlinna theory is devoted to the following problem. How does the geometric structure of a simply connected Riemann covering surface of the sphere influence the value distribution of the meromorphic function generating the surface? It is suggested that one also consider halfsheets among the constituent pieces of such surfaces, which have an infinite number of branch points on their boundary. A typical example is the covering surface generated by $e^z - z$. It contains a right half-plane with a second order branch point at $2\pi in$ for each integer $n$. (F. Huckeman)
