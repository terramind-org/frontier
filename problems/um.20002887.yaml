id: um.20002887
title: A divisor-trace criterion for removability of meromorphic sphere maps
field: mathematics
tier: prose
statement: |-
  Let \((M,p)\subset \mathbb C^n\) be a generic real-analytic submanifold, and suppose
  \[
  f:M\longrightarrow \partial\mathbb B^N,\qquad n\leq N,
  \]
  is a continuous CR mapping which extends meromorphically to a neighborhood of \(p\). Under what conditions does \(f\) extend holomorphically near \(p\)? In particular, is minimality of \(M\) sufficient?
