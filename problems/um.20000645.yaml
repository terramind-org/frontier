title: The solved maximal-parabolic formula and an all-level Borel support reduction
field: mathematics
tier: prose
statement: |-
  **$GL(3)$ Kuznetsov trace formula in the level aspect.**

  Develop a Kuznetsov trace formula for automorphic forms for the group
  \[
  \Gamma_0(N)=\left\{\begin{pmatrix}
  \star&\star&\star\\
  \star&\star&\star\\
  0&0&\star
  \end{pmatrix}\bmod N\right\}
  \]
  for any integer \(N\geq 1\).

  For the purpose of applications, develop a Kuznetsov trace formula for automorphic forms for the group
  \[
  \Gamma_B(N)=\left\{\begin{pmatrix}
  \star&\star&\star\\
  0&\star&\star\\
  0&0&\star
  \end{pmatrix}\bmod N\right\}.
  \]
