title: Holomorphic monodromy as a Teichmüller-section problem and finite-cover defect
field: mathematics
tier: prose
statement: |-
  **Question 3.1 (Dieter Kotschick).** Fix a closed Riemann surface \(B\) of genus \(g\geq 3\), and fix \(h\geq 2\). There exist at most finitely many non-isotrivial holomorphic genus \(h\) fibrations over \(B\),
  \[
  F_h\longrightarrow X\longrightarrow B.
  \]
  This gives a conjugacy class of representations
  \[
  \rho:\pi_1(B)\longrightarrow \operatorname{MCG}(F_h).
  \]
  How to characterise the representations which are the holonomy of a holomorphic fibration?

  **Comment 3.2 (Dieter Kotschick).** When the fibration is holomorphic there is a Kähler structure on the surface bundle \(X\), and so the cohomology of \(X\) satisfies certain constraints from Hodge theory (e.g. \(h_1(X)\) is even). These constraints give some restrictions on the representations, but they are not enough to give an “if and only if” statement.

  The recovered typography repairs \(Fh\) to \(F_h\), adds the missing space after “\(B\).”, joins the line-break hyphenations “charac-terise” and “struc-ture,” and restores “Kähler.” The source displays \(h_1(X)\); it is the first Betti number in this context.

  The intended fibration is a proper holomorphic submersion with connected smooth genus-\(h\) fibers. Ehresmann's theorem then makes it a smooth surface bundle. This is not a singular fibration: if critical values \(D\subset B\) are allowed, geometric monodromy is naturally a representation of \(\pi_1(B\setminus D)\), with additional local monodromy data. Nor does “holomorphic fibration” mean holomorphically locally trivial; a non-isotrivial Kodaira fibration is smoothly locally trivial but its fiber complex structure varies.
