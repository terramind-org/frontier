title: Existence of Random-Graph Coloring Growth Rates
field: mathematics
tier: prose
statement: |-
  For every integer $k\geq3$ and every average degree $d>0$, does the limit

  $$\phi(d)=\lim_{n\to\infty}\mathbb E\bigl[\#\{k\text{-colorings of }G(n,m)\}\bigr]^{1/n}$$

  exist?
