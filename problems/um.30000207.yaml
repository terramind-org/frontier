title: Subconvexity Coefficient Bounds for Triple $L$-Functions
field: mathematics
tier: prose
statement: For fixed Maass forms $\phi$ and $\phi'$, let $c_i=\int_Y\phi\phi'\phi_i\,dv$ be their triple periods and set $d_i=\gamma(\lambda_i)|c_i|^2$ using the standard gamma-factor normalization. Is it true that, for every $\varepsilon>0$, $d_i\ll|\lambda_i|^\varepsilon$?
