lean:
  module: FormalConjectures.OEIS.«5153»
  decl: OeisA5153.conjecture
  statement: |-
    theorem conjecture (n : ℕ) (hn : 3 ≤ n) (hodd : Odd n) :
        ∃ p q : ℕ, p.Prime ∧ A q ∧ n = p + q
  context:
    - open OeisA5153
  definitions:
    - name: OeisA5153.A
      kind: def
      text: |-
        /-- A positive integer $n$ is practical if every $m \le n$ can be represented as a sum of
        distinct divisors of $n$. -/
        def A (n : ℕ) : Prop :=
          0 < n ∧ Nat.IsPractical n
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/5153.lean#L34
