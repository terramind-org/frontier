title: Branched surfaces and triangulations — Question 7.9
field: mathematics
tier: prose
statement: |-
  Give a useful definition of thin position for an
  embedded graph $\Gamma \subset M$ with respect to a taut foliation $\mathscr{F}$.
  If $\Gamma$ is the $1$–skeleton $\tau^1$ for a triangulation, can one find
  an isotopy such that the leaves of $\mathscr{F}$ are made up of polyhedral disks of bounded
  index?
