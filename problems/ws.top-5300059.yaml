  \section{Representative transcendental entire dynamics}\label{5300059}
  {\small\sffamily UnsolvedMath ID 5300059 · Dynamical Systems}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A transcendental entire map is a holomorphic function $f:\mathbb C\to\mathbb C$ that is not a polynomial. Its dynamics means the iterates $f^n$, their orbit behaviour, and the stable (Fatou) and Julia sets: the Fatou set is the largest open set where the iterates form a normal family, and its complement is $J(f)$.
  \paragraph{Statement recorded in the supplied source.}
  Find a collection of representative transcendental entire maps whose dynamics can be understood and can model general phenomena. \sref{5300059}{2}
  \subsection{Short English statement}
  Develop representative examples that make the dynamics of transcendental entire functions understandable.
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:5300059:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 5300059 (AMR-052-0059). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:5300059:2}{S2}] Robert Devaney, ``Open Questions in Non-Rational Complex Dynamics'', in Ben Bielefeld and Mikhail Lyubich (eds.), Problems in Holomorphic Dynamics (1992), first problem in Section 1, pp. 35; arXiv:math/9205209v1. \url{https://arxiv.org/pdf/math/9205209}.
  \end{description}
