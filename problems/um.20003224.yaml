title: Explicit presentations for unions of chains and a diamond kernel reduction
field: mathematics
tier: prose
statement: |-
  **Problem 4.8.** When is the birational toggle group finitely presented?

  We know that this is the case when \(P\) is just a chain, for then the PL
  toggles are actual linear maps, and their birational lifts are just monomial
  maps. But even for as simple a poset as \([2]\times[2]\), we do not know the
  answer to this question.

  Perhaps it is better to approach the birational toggle group from above.
  Certain algebraic combinations of the variables are invariant under all the
  birational toggles.
