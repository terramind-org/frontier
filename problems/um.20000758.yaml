title: A parahoric Koszul descent criterion at a semistable node
field: mathematics
tier: prose
statement: Derived special cycles have been defined on integral models of certain Shimura varieties (resp. moduli of Shtukas) in recent works of Madapusi (resp. Feng-Yun-Zhang) in the good reduction case. Is it possible to extend their method and define derived special cycles in the bad reduction cases e.g. for some specific parahoric levels?
