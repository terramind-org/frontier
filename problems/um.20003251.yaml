title: "Supertransitivity above index four: formulation correction and complexity bounds"
field: mathematics
tier: prose
statement: |-
  The supertransitivity with respect to an object $X$ with $\dim(X)>2$ is the largest $N$ such that $\operatorname{Hom}(1,X^{\otimes n})$ is Temperley--Lieb.

  Supertransitivity is the analog of transitivity of group actions.

  Is there an upper bound on the supertransitivity of a subfactor planar algebra?

  Is there a universal upper bound on the finite supertransitivity of non-Temperley--Lieb, finite-depth subfactor standard invariants of index $\delta^2>4$?
