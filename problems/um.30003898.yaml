title: Debarre’s Minimal Cohomology-Class Conjecture
field: mathematics
tier: prose
statement: |-
  Let $(A,\Theta)$ be an indecomposable principally polarized abelian variety of dimension $g$, and let $X\subset A$ be a reduced pure $d$-dimensional subvariety with $1\leq d\leq g-2$ and minimal cohomology class

  $$[X]=\frac{\theta^{g-d}}{(g-d)!}.$$

  Must either $(A,\Theta)$ be the Jacobian of a curve $C$ with $X$ a translate of $W_d(C)$, or $g=5$, $d=2$, and $X$ be a translate of the Fano surface in the intermediate Jacobian of a smooth cubic threefold?
