title: Top-degree W1 solvability and a finite-order open-mapping reduction
field: mathematics
tier: prose
statement: "**Problem 11 (proposed by Mei-Chi Shaw).** Let \\(\\Omega\\subset\\mathbb {CP}^{n}\\) be pseudoconvex with \\(C^\\infty\\) boundary. Let us solve \\(\\bar\\partial u=f\\) in \\(\\Omega\\). If \\(f\\) is a \\((p,q)\\)-form such that \\(\\bar\\partial f=0\\) and \\(f\\in C^\\infty(\\overline\\Omega)\\), does there exist \\(u\\in W^1(\\overline\\Omega)\\) such that \\(\\bar\\partial u=f\\)? It is known that there is such a \\(u\\) in \\(L^2(\\overline\\Omega)\\), and also one in \\(W^\\varepsilon(\\overline\\Omega)\\) for some \\(\\varepsilon>0\\), where \\(\\varepsilon\\) depends on \\(\\Omega\\). See [CSW]. The answer was not known even when \\(\\partial\\Omega\\) was real analytic."
