title: Kourovka Notebook Problem 18.114
field: mathematics
tier: prose
statement: |-
  Does there exist an irreducible $5'$-subgroup $G$ of $GL(V)$ for some finite ${\mathbb{F} _5$-space $V$ such that the number of conjugacy classes of the semidirect product $VG$ is equal to $|V|$ but $G$ is not cyclic?

  Such a subgroup exists if 5 is replaced by $p=2, 3$ but does not exist for primes $p>5$ (*J. Group Theory*, **14** (2011), 175--199).
