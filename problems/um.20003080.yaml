statement: Can you relate the flat and hyperbolic geometry of a given surface? That is, show how to uniformize the flat structure. For instance, describe (up to quasi-isometry) the hyperbolic structure on the Loch Ness monster corresponding to the flat structure given by the Chamanara surface.
