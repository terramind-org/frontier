title: Ultraproduct II_1 Factors — Problem 47
field: mathematics
tier: prose
statement: |-
  For a definition of selfless see [robertselfless]. This is known for all ultraproduct II$_1$ factors, and some select other examples. Also recall that it is known that strict comparison holds for all II$_1$ factors viewed as $C^*$-algebras.

  Does there exist a II$_1$ factor $N$ such that $N^\mathcal{U}$ has non-full fundamental group?
