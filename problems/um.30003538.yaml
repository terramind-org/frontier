title: Equivalence of Hardy Spaces on Noncompact Manifolds
field: mathematics
tier: prose
statement: For a complete connected noncompact Riemannian manifold $M$, do the Hardy spaces $H_R^1(M)$, $H_H^1(M)$, and $H_P^1(M)$, defined through the Riesz transform, heat maximal operator, and Poisson maximal operator, respectively, coincide and admit atomic decompositions?
