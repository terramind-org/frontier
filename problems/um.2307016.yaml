title: Research Problems in Function Theory — Problem 7.16
field: mathematics
tier: prose
statement: Let $\gamma$ be a Jordan arc, $d\mu$ a measure on $\gamma$. Does the Laplace transform $$ f(z) = \int_\gamma e^{z\zeta}\,d\mu(\zeta) $$ always have `asymptotically analytic' growth as $|z|\to\infty$. The answer might be `no'. However it could be true anyway that the zeros of $f(z)$ have `measurable distribution' in the sense of A. Pfluger . (J. Korevaar)
