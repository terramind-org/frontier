title: Several Complex Variables Problem List — Problem 5
field: mathematics
tier: prose
statement: |-
  Let M be a smooth real hypersurface in $\mathbb{C}^n$ with defining
  function r. Let $p_0$ be a point in M, and let U be a neighborhood in $\mathbb{C}^n$
  of $p_0$. When do C-R functions on $M\cap U$ extend to $\lbrace r > 0
  \rbrace$?\\
  -B. Stensones, berit@math.lsa.umich.edu
