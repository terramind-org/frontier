title: Rigidity of Continuous Orbit Equivalence
field: mathematics
tier: prose
statement: For which topologically free actions of countable groups on compact spaces does continuous orbit equivalence imply conjugacy? In particular, which hypotheses beyond the known duality-group-versus-solvable-group criterion rule out the counterexamples that occur for higher-rank free abelian groups and nonabelian free groups?
