title: Energetic Limits for General Complete-Damage Energies
field: mathematics
tier: prose
statement: For the complete-damage model with stored energy $$\widehat{\mathcal E}(u,z)=\int_\Omega W(x,e(u),z)+\frac{\kappa}{r}|\nabla z|^r\,dx,$$ extend the existence and convergence theorem for energetic solutions from quadratic to general nonquadratic densities $W$ and from $r>d$ to the range $1\leq r\leq d$.
