title: Enumeration of Matchings — Problem 14
field: mathematics
tier: prose
statement: |-
  Find a general formula for the number of domino tilings
  of Aztec windows.

  Even an argument explaining why the number of tilings for windows
  of inner order $x$ and outer order $x+w$ should be given by a polynomial
  in $x$ (for each fixed $w$) would constitute progress!
