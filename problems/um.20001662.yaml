title: Rapid decay status and a quantitative central certificate for braid groups
field: mathematics
tier: prose
statement: |-
  **8 Which one of these groups have RD?**

  1. \(\operatorname{Out}(\text{free group})\),
  2. \(\operatorname{Aut}(\text{free group})\),
  3. braid groups \(B_n\) (\(B_3\) has RD),
  4. mapping class group,
  5. Artin groups (right angled groups have RD since they act freely on cube
     complexes).

  Note that Coxeter groups have RD.
