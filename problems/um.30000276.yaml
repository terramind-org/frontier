title: Rank Growth over Cubic Radical Extensions
field: mathematics
tier: prose
statement: Given an elliptic curve $E$ over $\mathbb{Q}$, for which cube-free integers $m$ does $E$ acquire new rational points of infinite order (i.e., strictly larger Mordell--Weil rank $\operatorname{rank} E(\mathbb{Q}(\sqrt[3]{m})) > \operatorname{rank} E(\mathbb{Q})$) over the cubic radical extension $\mathbb{Q}(\sqrt[3]{m})$?
