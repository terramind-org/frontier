title: Kourovka Notebook Problem 6.32
field: mathematics
tier: prose
statement: |-
  Let $F_n$ be the free profinite group of finite rank $n
  > 1$. Is it true that for each normal subgroup $N$ of the free
  profinite group of countable rank, there exists a normal
  subgroup of $F_n$ isomorphic to $N$?
