lean:
  module: FormalConjectures.OEIS.«238224»
  decl: OeisA238224.conjecture
  statement: "theorem conjecture (n : ℕ) (hn : 1 < n) : 0 < a n"
  context:
    - open OeisA238224
  definitions:
    - name: OeisA238224.a
      kind: def
      text: |-
        /-- $a(n)$ is the number of pairs $(j, k)$ with $0 < j < k \le n$ and $k \equiv 1 \pmod j$
        such that $\pi(j \cdot n)$ divides $\pi(k \cdot n)$. -/
        def a (n : ℕ) : ℕ :=
          ∑ j ∈ Finset.Ico 1 n,
            ∑ q ∈ Finset.Icc 1 ((n - 1) / j),
              let k := j * q + 1
              if Nat.primeCounting (j * n) ∣ Nat.primeCounting (k * n) then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/238224.lean#L34
