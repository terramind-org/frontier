title: Maximal Complexity of Non-p-by-p Specht Modules
field: mathematics
tier: prose
statement: For a Specht module $S^\lambda$ of a symmetric group in a block of weight $w$, prove that every remaining case with $\lambda$ not $p\times p$ has complexity $w$, the maximal complexity in its block; equivalently, resolve the remaining direction of the VIGRE conjecture.
