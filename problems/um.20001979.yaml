title: A finite-area counterexample on the cotangent cylinder
field: mathematics
tier: prose
statement: Let \(M\) be a compact manifold, and consider \(T^*M\). Let \(\sigma\) be the canonical symplectic form on \(T^*M\). For any other exact symplectic form \(\omega=d\alpha\) on \(T^*M\), with \(\alpha|_M\) exact, is it possible to find a diffeomorphism on \(T^*M\) preserving \(M\) sending \(\omega\) to \(\pm\sigma\)?
