title: BMO Blowup Criteria for Incompressible Flow Potentials
field: mathematics
tier: prose
statement: For incompressible Navier–Stokes flow, does blowup at a finite time $t_*$ imply $\lVert A\rVert_{\mathrm{BMO}}\to\infty$ in three dimensions and $\lVert\psi\rVert_{\mathrm{BMO}}\to\infty$ in two dimensions, where $A$ is the three-dimensional vector potential and $\psi$ is the two-dimensional stream function?
