title: Question 4.1 — Can one detect the growth of a surface or free-group homomorphism by its action on the homology of a characteristic s…
field: mathematics
tier: prose
statement: "Can one detect the growth of a surface or free-group homomorphism by its action on the homology of a characteristic subgroup of finite index? Notice that one has to pass to a subgroup of finite index in order to have any hope because automorphisms of exponential growth can act trivially on homology. A. Piggott [ 74] has an- swered the above question for free-group automorphisms of polynomial growth, and linear-growth automorphisms of surfaces are easily dealt with, but the exponential case remains open in both settings. 328 M. Bridson and K. Vogtmann Finer questions concerning growth are addressed in the on-going work of Handel and Mosher [43]. They explore, for example, the implications of the following contrast in behaviour between surface automorphisms and free-group automorphisms: in the surface case the exponential growth rate of a pseudo-Anosov automorphism is the same as that of its inverse, but this is not the case for iwip free-group automorphisms. For mapping tori of automorphisms of free abelian groups G = Zn ⋊φ Z, the following con- ditions are equivalent (see [ 17]): G is automatic; G is a CAT(0) group 3; G satisfies a quadratic isoperimetric inequality. In the case of mapping tori of surface automorphisms, all mapping tori satisfy the first and last of these conditions and one understands exactly which Sg ⋊ Z are CAT(0) groups. Brady, Bridson and Reeves [ 12] show that there exist mapping tori of free-group automor- phismsF ⋊ Z that are not automatic, and Gersten showed that some are not CAT(0) groups [ 36]. On the other hand, many such groups do have these properties, and they all satisfy a quadratic isoperimetric inequality [ 18]."
