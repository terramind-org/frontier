id: oeisa219055.conjecture-2
title: Representations of $n$ using prime pairs with prime gaps of $6$ (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture: For any two multiples $d_1$ and $d_2$ of
  $6$, all sufficiently large integers $n$ can be written as $p + q(3 - (-1)^n)/2$ with $p > q$ and
  $p, q, p - d_1, q + d_2$ all prime.
  - _Zhi-Wei Sun_
