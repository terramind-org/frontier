lean:
  module: FormalConjectures.OEIS.«219055»
  decl: OeisA219055.conjecture_2
  statement: |-
    theorem conjecture_2 (d₁ d₂ : ℤ) (hd₁ : 6 ∣ d₁) (hd₂ : 6 ∣ d₂) :
        ∃ N : ℕ, ∀ n : ℕ, N ≤ n →
          ∃ p q p' q' : ℕ, q < p ∧ p.Prime ∧ q.Prime ∧ p'.Prime ∧ q'.Prime ∧
            (p : ℤ) - d₁ = p' ∧ (q : ℤ) + d₂ = q' ∧ n = p + (1 + n % 2) * q
  context:
    - open OeisA219055
  definitions: []
