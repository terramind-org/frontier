    - name: EquationalTheories_677_255.Equation255
      kind: abbrev
      text: "abbrev Equation255 (G: Type) [Magma G] := ∀ x : G, x = ((x ◇ x) ◇ x) ◇ x"
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/Other/EquationalTheories_677_255.lean#L35
