title: Enumeration of Matchings — Problem 12
field: mathematics
tier: prose
statement: |-
  Consider the Kasteleyn matrix $K_n$ for the Aztec diamond of order $n$,
  in which every other vertical domino has its sign flipped (that is,
  the corresponding 1's in the bipartite adjacency matrix are
  replaced by $-1$'s).

  Show that the sum of the entries of the matrix inverse
  of $K_n$ is $(n-1)(n+3)/2 - 2^{n-1} + 2$.

  (This formula works for $n=1$ through $n=8$.)

  I should mention in this connection that Greg Kuperberg has some
  high-tech ruminations on the inverses of Kasteleyn matrices, and
  there is a chance that representation-theory methods will be useful
  here.
