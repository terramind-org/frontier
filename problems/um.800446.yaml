title: Analysis of Boolean Functions — Aaronson--Ambainis Conjecture
field: computer-science
tier: prose
statement: Let $f \colon \{-1,1\}^n \to [-1,1]$ have degree at most $k$. Then there exists $i \in [n]$ with $\Inf_i[f] \geq (\operatorname{Var}[f]/k)^{O(1)}$.
