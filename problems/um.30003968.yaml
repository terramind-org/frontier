title: Weak Tumor-Invasion Solutions Without Growth Compatibility
field: mathematics
tier: prose
statement: |-
  Let $n_1,n_2$ satisfy

  $$\partial_tn_1-\operatorname{div}(n_1\nabla p)=n_1F_1(p)+n_2G_1(p),$$
  $$\partial_tn_2-\operatorname{div}(n_2\nabla p)=n_1F_2(p)+n_2G_2(p)$$

  on $\mathbb R^d$ for $t\geq0$, where $n=n_1+n_2$, $p=n^\gamma$, $\gamma>1$, $F=F_1+F_2$, $G=G_1+G_2$, and $F(p),G(p)\leq0$ for $p\geq P_H$. Can weak solutions be constructed without assuming

  $$\sup_{0\leq p\leq P_H}\frac{\lvert F(p)-G(p)\rvert^2}{p^{1/\gamma}}\leq C_H$$

  Can weak solutions be constructed when no such uniform bound is imposed?
