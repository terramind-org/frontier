title: Question 3.13 — (Rational growth).
field: mathematics
tier: prose
statement: "(Rational growth). Does Modg have rational growth function with respect to some set of generators? with respect to every set of generators? Of course one can also ask the same question for any finitely generated subgroup of Mod g, for exampleIg. Note that the existence of an automatic structure is not known to imply rationality of growth (even for one generating set); one needs in addition the property that the automatic structure consist of geodesics. Unfortunately Mosher’s automatic structure does not satisfy this stronger condition. It is natural to ask for other recursive patterns in the Cayley graph of Mod g. To be more precise, let P denote a property that elements of Mod g might or might not have. For example, P might be the property of being finite order, of lying in a fixed subgroup H <Modg, or of being pseudo-Anosov. Now let cP (r) = # {BModg (r)∩{x∈ Modg:x has P}} We now define the growth series for the property P, with respect to a fixed generating set for Γ, to be the power series fP (z) = ∞∑ i=0 cP (i)zi"
