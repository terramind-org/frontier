title: Kourovka Notebook Problem 20.82
field: mathematics
tier: prose
statement: |-
  Two groups are said to be *isospectral* if they have the same set of element
  orders. Suppose that $G$ is a finite group such that every finite group isospectral to $G$ is isomorphic to $G$. Is it true that the quotient of $G$ by its socle is solvable?
