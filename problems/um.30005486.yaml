title: Local Resilience of Random-Hypergraph Perfect Matchings
field: mathematics
tier: prose
statement: For every fixed $k$, do sufficiently large $C$ and sufficiently small $\varepsilon>0$ ensure that, with high probability, deleting at most an $\varepsilon$-fraction of the incident hyperedges at every vertex of $G_k(n,C\log n/n^{k-1})$ still leaves a perfect matching?
