title: Visibility Graphs of Points, Segments and Polygons — Problem 19
field: mathematics
tier: prose
statement: |-
  Let us consider variations of bar visibility graphs. While representing vertices of $G$ as
  bars, there is no restriction on the length of horizontal bars. Suppose, a restriction
  is imposed that all bars in a visibility representation must have the same length.
  In that case, we get another type of visibility graphs which are known as
  *unit bar visibility graphs*. Though there are characterizations for special classes
  of unit bar visibility graphs [chks-cbvt-2006,dgh-unvl-2004,dv-ubvg-2003],
  no characterization is known for general graphs.
  We have the following problems.

  Characterize unit bar visibility graphs.
