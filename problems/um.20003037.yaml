title: "Genus-g trace boundaries: the zero-genus answer and a marked Alexander obstruction"
field: mathematics
tier: prose
statement: "**Genus $g$ traces and concordance.** For a knot $K$ in $S^3$, let $X^g(K)$ denote the 4-ball union $\\Sigma_g\\times D^2$, where $\\Sigma_g$ is a genus $g$ surface with one boundary component, attached to $B^4$ along a 0-framed neighborhood of $K$. Are there nonconcordant knots $K$ and $J$ such that $\\partial X^g(K)$ and $\\partial X^g(J)$ are integrally homology cobordant?"
