title: "Henon Maps: Open Problems — Problem 36"
field: mathematics
tier: prose
statement: |-
  Show that $\mu_\phi$ satisfies the Large Deviation Principle (LDP) for H\"older continuous observables.
  Namely, prove that, for any H\"older continuous observable $g$ with $\langle \mu_\phi, g\rangle=0$ and which is not a coboundary, there exists a
  non-negative, strictly convex function $c$ which is defined on a neighborhood of $0 \in \mathbb{R}$,
  vanishes
  only at $0$, and such that, for all
  $\epsilon > 0$ sufficiently small,
  \[
  \lim_{n\to \infty}
  \frac{1}{n}
  \log \mu_\phi
  \left(\left\{
  x \in X\colon
  \frac{S_n(g)(x) }{n}
  >\epsilon
  \right\}\right)
  = -c(\epsilon).\]
