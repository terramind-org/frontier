title: Jointly slice normal generators for a fixed homology ball
field: mathematics
tier: prose
statement: Let \(K\) be a knot in an integer homology sphere \(Y\), and suppose that \(Y\) bounds an integer homology ball \(W\) such that \(K\) is null-homotopic in \(W\). Must \(K\) be homotopic in \(Y\) to a knot \(K'\) which is smoothly slice in \(W\)?
