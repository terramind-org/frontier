title: Questions in Geometric Group Theory — Q 2.1
field: mathematics
tier: prose
statement: (Swarup) Is there a proof of Johannson’s theorem that Out(π1M) is virtually generated by Dehn twists for M a Haken 3-manifold along the lines of Rips-Sela’s theorem that Out(G) is virtually generated by Dehn twists for torsion-free 1-ended hyperbolic G? Is this true for CAT(0) groups? In particular, if G is a CAT(0) group and Out(G) is infinite, does G admit a Dehn twist of infinite order?
