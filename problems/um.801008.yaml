statement: |-
  If $L_\beta\models\mbox{$\mathit{V}=\mathit{HC}$}$, then
  \begin{align*}
  \left(\mathcal{P}(\omega)\cap L_\beta\models\mathbf{s}ymbol{\Pi}_{m+1}^1\mathsf{-MI} \right)\iff\beta\mbox{ supports a strong }\Sigma_{m+1}\textrm{-nesting}.
  \end{align*}
