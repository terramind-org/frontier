title: Exact Potts censoring on one edge and a monotonicity obstruction
field: mathematics
tier: prose
statement: |-
  **Censoring for the Potts model.** Consider the \(q\)-state Potts model
  (say with \(q=3\) for concreteness) and start from all green. Is it the case
  that deterministically censoring a sequence of spin flips can only increase
  the total variation distance to stationarity?
