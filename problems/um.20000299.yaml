title: A boundary-saturation obstruction to deforming F-injectivity
field: mathematics
tier: prose
statement: |-
  **Recovered deformation question.** Let \((R,\mathfrak m)\) be a
  commutative Noetherian local ring of characteristic \(p>0\), let
  \(f\in\mathfrak m\) be a nonzerodivisor, and put \(S=R/fR\). If Frobenius is
  injective on every \(H^j_{\mathfrak m}(S)\), must Frobenius be injective on
  every \(H^i_{\mathfrak m}(R)\)?
