title: Tverberg Regions and Random Great-Circle Cells
field: mathematics
tier: prose
statement: Resolve the following two questions. (1) For which $k$ is the region $D_k=\{q\in\mathbb R^d:\operatorname{TvD}(P,q)\geq k\}$ contractible for every $n$-point set $P\subseteq\mathbb R^d$? (2) For $n$ great circles in general position on $S^2$, choose a cell $c$ uniformly, remove the circles touching $c$, and let $x$ be the number of edges of the resulting cell containing $c$; how large can $\mathbb E[x]$ be?
