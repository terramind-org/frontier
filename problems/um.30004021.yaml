title: Exceptional Isomorphism of Two W-Algebras
field: mathematics
tier: prose
statement: |-
  Is

  $$W_{-7+7/3}(\mathfrak{sl}_7,f)\cong W_{-4+4/3}(\mathfrak{sl}_4,f'),$$

  where $f$ has orbit partition $(3,2^2)$ in $\mathfrak{sl}_7$ and $f'$ has orbit partition $(2^2)$ in $\mathfrak{sl}_4$?
