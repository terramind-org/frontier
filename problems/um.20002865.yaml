title: Finite-kernel reduction for cocompact invariant ball embeddings
field: mathematics
tier: prose
statement: |-
  **Problem (X. Huang).** Assume \(\Gamma\subset\operatorname{Aut}(\mathbb
  B^N)\) is a discrete subgroup and
  \(f:\mathbb B^n\to\mathbb B^N\) is a proper holomorphic embedding such that
  \(\Gamma(f(\mathbb B^n))\subset f(\mathbb B^n)\) and
  \(f(\mathbb B^n)/\Gamma\) is compact. Is \(f\) linear?
