title: Sparsity Transfer in Penalized Empirical Risk Minimization
field: mathematics
tier: prose
statement: For penalized empirical risk minimization with population minimizer $\lambda_\varepsilon$ and empirical minimizer $\widehat{\lambda}_\varepsilon$, does sparsity of $\lambda_\varepsilon$ imply sparsity of $\widehat{\lambda}_\varepsilon$? How does that sparsity control the excess loss risk and the $\ell^1$ error from the unpenalized population minimizer, and how should the penalty parameter $\varepsilon$ be chosen?
