title: Digit Sum Bias and Nonvanishing Hankel Determinants
field: mathematics
tier: prose
statement: With $\gamma_\infty(t)=\lim_{k\to\infty}2^{-k}|\{0\leq n<2^k:s_2(n+t)\geq s_2(n)\}|$, is $\gamma_\infty(t)>1/2$ for every integer $t\geq1$, what is $\liminf_{t\to\infty}\gamma_\infty(t)$, and does there exist an infinite sequence $a$ over a finite subset of $\mathbb{Z}$ for which every Hankel determinant $\det(a_{k+i+j})_{0\leq i,j<n}$ is nonzero for all $n\geq1$ and $k\geq0$?
