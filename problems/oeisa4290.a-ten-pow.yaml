    - open OeisA4290
  definitions:
    - name: OeisA4290.a
      kind: def
      text: |-
        /-- Least positive multiple of $n$ using only 0's and 1's in base 10. -/
        noncomputable def a (n : ℕ) : ℕ :=
          sInf { m : ℕ | 0 < m ∧ n ∣ m ∧ ∀ d ∈ Nat.digits 10 m, d = 0 ∨ d = 1 }
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/4290.lean#L33
