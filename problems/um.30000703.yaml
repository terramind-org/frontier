title: Boundary Behavior under Asymptotic Schwarz–Pick Equality
field: mathematics
tier: prose
statement: Let $f:\mathbb{D}\to\mathbb{D}$ be holomorphic and suppose $\lim_{z\to1}(1-|z|^2)|f'(z)|/(1-|f(z)|^2)=1$. What can be said about the boundary behavior of $f$ at $z=1$?
