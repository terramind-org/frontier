title: Principal Ideals and Characteristic Elements for Iwasawa Modules
field: mathematics
tier: prose
statement: Let $G$ be a compact $p$-valued group with no elements of order $p$, and let $\Lambda_G$ be its Iwasawa algebra. For a finitely generated torsion $\Lambda_G$-module, can the reflexive right ideals $L_i$ in the structure theorem be replaced by principal ideals? How should a characteristic element be defined in general?
