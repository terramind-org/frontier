statement: Suppose that $P$ is a finite $p$-group with a non-trivial partition (which is equivalent to having proper Hughes subgroup $H_p(P):=\langle g\in P\mid g^p\ne 1\rangle\ne P$). If $P$ admits a fixed-point-free automorphism of prime order, must $P$ be of exponent $p$?
