title: Kourovka Notebook Problem 18.35
field: mathematics
tier: prose
statement: |-
  A family ${\mathscr F}$ of group homomorphisms $A\to B$ is *separating* if for every nontrivial $a\in A$ there is $f\in {\mathscr F}$ such that $f(a)\ne 1$, and *discriminating* if for any finitely many nontrivial elements $a_1,\dots ,a_n\in A$ there is $f\in {\mathscr F}$ such that $f(a_i)\ne 1$ for all $i=1,\dots , n$.
  Let $G$ be a relatively free group of rank 2 in the variety of metabelian groups. Let $T$ be a metabelian group
  in which the centralizer of every nontrivial element is abelian. If $T$ admits a separating family of surjective
  homomorphisms $T\to G$ must it also admit a discriminating family of surjective homomorphisms $T\to G$?

  A positive answer would give a metabelian analogue of a classical theorem of B. Baumslag.
