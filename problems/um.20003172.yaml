title: "Stable quasipositive towers: exact reconstruction, model cases, and a stable-flag reduction"
field: mathematics
tier: prose
statement: |-
  **Problem 47.** Fix $k\in\mathbb N$. Is there an $n_0=n_0(k)$ such that for any quasipositively curved manifold $(M^n,g)$ with $n\ge n_0$ and
  \(\operatorname{cohom}(M^n,g)\le k\), there exists a chain
  \[
  M_0=M^n\subset M_1^{\,n+k}\subset M_2^{\,n+2k}\subset\cdots
  \]
  such that all inclusions are totally geodesic, the manifolds $M_i$ are quasipositively curved,
  \(\bigcup_iM_i\) is the classifying space of a Lie group, and
  \(M_i/\operatorname{Iso}(M_i,g)\) is isometric to
  \(M/\operatorname{Iso}(M,g)\)?
