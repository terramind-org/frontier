  module: FormalConjectures.OEIS.«262446»
  decl: OeisA262446.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : 3 < n) : 0 < a n"
  context:
    - open OeisA262446
  definitions:
    - name: OeisA262446.a
      kind: def
      text: |-
        /--
        Number of ways to write $b(n) = b(k) + b(m)$ with $0 < k < m < n$.
        -/
        def a (n : ℕ) : ℕ :=
          let target := b n
          ∑ k ∈ Finset.Ico 1 n,
            ((Finset.Ico (k + 1) n).filter (fun m => target = b k + b m)).card
