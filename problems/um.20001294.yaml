title: The cube-projection core of the zonoid psi_2 problem
field: mathematics
tier: prose
statement: |-
  **Problem 7 (Grigoris Paouris).** Which bodies are \(\psi_2\)-bodies? Are zonoids \(\psi_2\)-bodies? Are projections of \(\psi_2\)-bodies \(\psi_2\)-bodies?

  **Remark.** It is known that the \(B_p^n\) for \(p\geq2\) is \(\psi_2\).
