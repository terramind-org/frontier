lean:
  module: FormalConjectures.ErdosProblems.«1175»
  decl: Erdos1175.erdos_1175.variants.threshold_formulation
  statement: |-
    theorem erdos_1175.variants.threshold_formulation :
        ∀ (κ : Cardinal), ℵ₀ < κ →
          ∃ (μ : Cardinal),
            ∀ (V : Type*) (G : SimpleGraph V), μ ≤ G.chromaticCardinal →
              ∃ (H : G.Subgraph), H.coe.CliqueFree 3 ∧ H.coe.chromaticCardinal = κ
  context:
    - open Erdos1175
    - open Erdos1175.erdos_1175
    - open Erdos1175.erdos_1175.variants
    - open Cardinal SimpleGraph
