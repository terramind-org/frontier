statement: "Do there exist two surfaces S,S ′, closed and of genus ≥ 2, such that MCG (S) contains a subgroup isomorphic to π1(S′) all of whose nontrivial elements are pseudo-Anosov? The closest attempt so far is an example of Leininger and Reid [ LR04] in which all closed curves on S′ give pseudo-Anosov elements of MCG (S) with the exception of a single simple closed curve and its iterates. This problem invites the following refinement: 266 L. Mosher"
