title: Problem 2.12 — This one is a warm-up.
field: mathematics
tier: prose
statement: This one is a warm-up. Given α∈M g, say as a product of Dehn twists, expressβ∈M 2g+1 as a related product of Dehn twists. With that in hand, observe that if α,α ′ are equivalent in the mapping class group Mg then the Heegaard splittings associated to β,β ′ appear to be equivalent. What about the converse? And how can we tell whether an arbitrary Heegaard splitting of a 3-manifold is the bundle-related splitting of a fibered 3-manifold? What restrictions must we place on β in order to be able to reverse the construction, and produce a surface bundle from a Heegaard splitting?
