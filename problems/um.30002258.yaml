title: Nearly-Lie Quotients of Automorphism Groups in NIP Theories
field: mathematics
tier: prose
statement: Given a saturated model $M$ of an NIP theory $T$ and a formula $\varphi(x,y)$, does there exist a homomorphism $h:\operatorname{Aut}(M)\to G$ into a nearly Lie group $G$ whose kernel fixes every $\varphi$-type over $M$ that does not fork over $\varnothing$?
