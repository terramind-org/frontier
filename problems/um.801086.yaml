title: "Henon Maps: Open Problems — Question 38"
field: mathematics
tier: prose
statement: |-
  The case of cubic automorphisms on $\mathbb{C}^3$, and the case of automorphisms obtained as a composition of an affine transformation and a triangular one were considered by
  Blanc and Van Santen [blanc-V1,blanc-V2]. Their computations lead them to formulate the following intriguing problem.
  A weak Perron number is an algebraic integer $\lambda \ge1$ such that all its Galois conjugates satisfy $|\mu|\le \lambda$.

  Is the dynamical degree of any polynomial automorphism of $\mathbb{C}^d$ equal to a weak Perron number of degree
  $\le d-1$?
