title: Problem 8.1 — Determine the image as well as the cokernel of the homomorphism (15) explic- itly.
field: mathematics
tier: prose
statement: Determine the image as well as the cokernel of the homomorphism (15) explic- itly. Note that Hain [ 29] proved that the image of (15), after tensored with Q, is precisely the Lie subalgebra generated by the degree 1 part. However it is unclear which part of hQ g,1 belongs to this Lie subalgebra. In relation to this problem, Oda predicted, in the late 1980’s, that there should arise “arith- metic obstructions” to the surjectivity of Johnson homomorphism. More precisely, based on the theory of Ihara in number theory which treated mainly the case g = 0,n = 3, he expected that the absolute Galois group Gal( Q/Q) should “appear” in hg,1⊗ Zℓ outside of the geometric part and which should be Sp-invariant for any genus g and for any prime ℓ. In 1994, Nakamura [ 86] 22. Cohomological structure of the mapping class group and beyond 367 proved, among other results, that this is in fact the case (see also Matsumoto [ 65]). This was the second obstruction to the surjectivity of Johnson homomorphism, the first one being the traces in [76]. This raised the following problem.
