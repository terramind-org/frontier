title: Positive interiors and nonnegative compactifications of braid varieties
field: mathematics
tier: prose
statement: Define an open positive locus on a braid variety which recovers the positive part of an open positroid variety, and define a closed nonnegative locus in a specified compactification which recovers the closure of that positive positroid part. State precisely which choices (cluster seed, weave orientation, braid presentation, and compactification) the construction does or does not depend on.
