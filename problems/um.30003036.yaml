title: Grothendieck–Serre Conjecture in Mixed Characteristic
field: mathematics
tier: prose
statement: "Grothendieck–Serre conjecture: if $R$ is a regular local integral domain with fraction field $F$, then for every smooth reductive group scheme $G$ over $R$, the map $H^1_{\\mathrm{et}}(R,G)\\to H^1_{\\mathrm{et}}(F,G)$ is injective."
