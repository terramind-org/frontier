title: Analysis of Boolean Functions — Uncertainty Principle for Quadratic Fourier Analysis
field: computer-science
tier: prose
statement: Suppose $q_1, \dots, q_m \colon \mathbb{F}_2^n \to \mathbb{F}_2$ are polynomials of degree at most $2$ and suppose the indicator function of $(1, \dots, 1) \in \mathbb{F}_2^n$, namely $\operatorname{AND} \colon \mathbb{F}_2^n \to \{-1,1\}$, is expressible as $\operatorname{AND}(x) = \sum_{i=1}^m c_i (-1)^{q_i(x)}$ for some real numbers $c_i$. What is a lower bound for $m$?
