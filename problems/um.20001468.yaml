title: Forcing absoluteness of minimal and separable maximal tensor products
field: mathematics
tier: prose
statement: |-
  Does \(\otimes_{\min}\) or \(\otimes_{\max}\) commute with forcing?

  The record names no pair of C\(^*\)-algebras and gives no remarks or literature. The two preceding records ask whether the number of C\(^*\)-norms on certain algebraic tensor products, and the ideal structure of \(\mathcal B(H)\otimes_{\min}\mathcal Q(H)\), can depend on the model of set theory. This supports a model-comparison reading, but it does **not** justify silently inserting \(\mathcal B(H)\), \(\mathcal Q(H)\), or any other particular pair into Problem 3.3.

  There is also a real foundational ambiguity. If \(M\subseteq N=M[G]\) is a forcing extension and \(A\in M\) is complete according to \(M\), then \(N\) may contain new Cauchy sequences in the old metric space. The convention used in later operator-algebra forcing work is to identify a ground-model C\(^*\)-algebra with its metric completion in the extension [FKV]. We adopt precisely that convention.

  For a ground-model C\(^*\)-algebra \(A\), write
  \[
   A^N=\widehat{A^M}^{\,N}. \]
  For \(\alpha\in\{\min,\max\}\), the canonical formulation studied here is whether
  \[
   \widehat{(A\otimes_\alpha B)^M}^{\,N}
   \quad\hbox{and}\quad
   A^N\otimes_\alpha^N B^N                                      \tag{1}
  \]
  are canonically isomorphic by the identity on the old algebraic tensor product.

  This is different from recomputing a definition in \(N\). For example, the completion of the ground-model Calkin algebra need not be the Calkin algebra computed in the extension [FKV, §2]. It is also different from asking whether forcing preserves nuclearity or exactness, and from developing a Boolean-valued tensor-product functor. Those are plausible broader questions, not recovered content of the one-line AIM record.
