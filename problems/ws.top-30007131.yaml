statement: |-
  \section*{Affine Bernstein assertion for entire graphs in dimension ten}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must every smooth function $u:R^{10}\to R$ with everywhere positive-definite Hessian, satisfying $\Sigma _ij$ $U^ij$ $\partial _ij(det$ $D^{2}u)^{-11/12}=0$ and $U=det(D^{2}u)(D^{2}u)^{-1}$, be a quadratic polynomial plus an affine term?
  \subsection{Short English statement}
  Must every smooth function $u:R^{10}\to R$ with everywhere positive-definite Hessian, satisfying $\Sigma _ij$ $U^ij$ $\partial _ij(det$ $D^{2}u)^{-11/12}=0$ and $U=det(D^{2}u)(D^{2}u)^{-1}$, be a quadratic polynomial plus an affine term?
