lean:
  module: FormalConjectures.ErdosProblems.«1183»
  decl: Erdos1183.erdos_1183.parts.iii
  statement: |-
    theorem erdos_1183.parts.iii :
        (∀ c : ℝ, ∀ᶠ n : ℕ in atTop, (n : ℝ) ^ c < (F n : ℝ)) ∧
          ∀ ε : ℝ, 0 < ε → ∀ᶠ n : ℕ in atTop, (F n : ℝ) < (1 + ε) ^ n
  context:
    - open Erdos1183
    - open Erdos1183.erdos_1183
    - open Erdos1183.erdos_1183.parts
    - open Filter Asymptotics
  definitions:
    - name: Erdos1183.F
      kind: def
      text: |-
        /-- $F(n)$: the same as $f(n)$, except that the family is only required to be closed under
        unions (`SupClosed`; the supremum of two finsets is their union). -/
        noncomputable def F (n : ℕ) : ℕ :=
          sSup {m : ℕ | ∀ c : Finset (Fin n) → Bool, ∃ ℱ : Finset (Finset (Fin n)),
            m ≤ ℱ.card ∧ IsMonochromatic c ℱ ∧ SupClosed (ℱ : Set (Finset (Fin n)))}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/1183.lean#L53
