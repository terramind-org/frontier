id: um.20002662
title: Predictable-step recovery for finite-action free processes
field: mathematics
tier: prose
statement: |-
  **Question.** Given a tracial state \(\tau\) corresponding to a free stochastic process, does there exist a sequence of tracial states \(\tau_n\to\tau\) with \(\chi_p^*(\tau_n)\to\chi_p^*(\tau)\), where \(\tau_n\) corresponds to the process
  \[
  dA_i(t)=dS_i(t)+k_t(A_1(s),\ldots,A_m(s))_{s\leq t}\,dt
  \]
  with \(k_t\) stepwise constant in \(s\), and \(\chi_p^*\) denotes the quantity \(\chi^*\) defined for processes in the paper of Guionnet and Cabanal-Duvillard?
