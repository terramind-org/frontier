title: Several Complex Variables Problem List — Problem 15
field: mathematics
tier: prose
statement: |-
  Let $\Omega \subset \subset \mathbb{C}^n$ be a smooth pseudoconvex
  domain. Let $A^k(\bar\Omega)= H(\Omega)\cap C^k(\bar\Omega)$
  with $C^k$ topology, $1 \leq k \leq \infty$. Is $A^{\infty}(\bar\Omega)$
  dense in $A^k(\bar\Omega)$?\\
  -N. Sibony, sibony@anh.matups.fr
