title: Solvability and Realizability of Finite Skew Braces
field: mathematics
tier: prose
statement: Is the multiplicative group of a finite skew left brace with solvable additive group solvable? Is every finite nilpotent group of class two the multiplicative group of a two-sided skew brace of abelian type? Is there a non-IYB finite group all of whose Sylow subgroups are IYB groups?
