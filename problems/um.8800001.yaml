title: Fast evaluation of high-degree elliptic-curve isogenies
field: mathematics
tier: prose
statement: Given an elliptic curve $E/\mathbb{F}_q$ and $P\in E(\mathbb{F}_q)$, characterize maps or isogenies $\psi:E\to E'$ for which $\psi(P)$ can be evaluated in time polynomial in $\log\deg\psi$ and $\log q$, ideally $O(\log\deg\psi\,\log^2q)$.
