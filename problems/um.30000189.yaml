title: Explicit Flips on Voronoi Compactifications
field: mathematics
tier: prose
statement: For $6\leq g\leq10$, the ray $\mathbb{R}_+[C_1]$ defines a flipping contraction on the first Voronoi compactification $\mathcal{A}_g^F$. Can the predicted flip, and more generally the minimal model program on $\mathcal{A}_g^F$, be carried out explicitly?
