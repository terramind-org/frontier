lean:
  module: FormalConjectures.GreensOpenProblems.«87»
  decl: Green87.green_87.decreasing
  statement: |-
    theorem green_87.decreasing :
        ∀ p : ℕ → ℝ, (∀ k, Tendsto (fun n ↦ i n k) atTop (𝓝 (p k))) → StrictAnti p
  context:
    - open Green87
    - open Green87.green_87
    - open Filter Asymptotics Topology
  definitions:
    - name: Green87.i
      kind: def
      text: |-
        /-- `i n k` is the proportion of permutations of $[n]$ that fix a set of size $k$, denoted
        $i(n, k)$ in [BW15] and [EFG16]. -/
        noncomputable def i (n k : ℕ) : ℝ :=
          (Nat.card {σ : Equiv.Perm (Fin n) // FixesSet σ k} : ℝ) / (Nat.card (Equiv.Perm (Fin n)) : ℝ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/GreensOpenProblems/87.lean#L46
