title: Kourovka Notebook Problem 17.85
field: mathematics
tier: prose
statement: |-
  Let $\mathcal{V}$ be a variety of groups such
  that any free group in $\mathcal{V}$ has torsion-free integral
  homology groups in all dimensions. Is it true that $\mathcal{V}$ is
  abelian?

  It is known that free metabelian groups may
  have 2-torsion in the second homology groups, and free nilpotent
  groups of class 2 may have 3-torsion in the fourth homology
  groups.
