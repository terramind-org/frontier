title: Lifting Polynomial Automorphisms from Dual Numbers
field: mathematics
tier: prose
statement: Let $d\geq3$ and let $R$ be a reduced ring containing $\mathbb{Q}$; put $Y=(y_1,\ldots,y_{d-1})$. Does there exist $\bar\gamma\in\operatorname{Aut}_x(R[t]/(t^2)[x,Y])\cap\operatorname{Aut}_{R[t]}(R[t][x,Y])$ with $\bar\gamma\notin\operatorname{Aut}_x(R[t][x,Y])$?
