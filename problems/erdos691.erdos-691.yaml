  definitions:
    - name: Erdos691.multiples
      kind: def
      text: |-
        /-- The set $M_A = \{n \geq 1 : a \mid n \text{ for some } a \in A\}$ of positive multiples
        of elements of $A$. -/
        def multiples (A : Set ℕ) : Set ℕ := {n | 1 ≤ n ∧ ∃ a ∈ A, a ∣ n}
