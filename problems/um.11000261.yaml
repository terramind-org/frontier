title: Question 4 — How much of this paper can be generalized to the Birman-Wenzl-Murakami algebra?
field: mathematics
tier: prose
statement: How much of this paper can be generalized to the Birman-Wenzl-Murakami algebra? In this direction, John Enyang [ Eny04] has shown that the Birman-Murakami-Wenzl algebra is a cellular algebra, and used this to give a definition of its irreducible representations similar to the approach in Section 7. Next we would like to generalize [ Big04] to the Birman-Wenzl-Murakami algebra.
