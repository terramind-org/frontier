schema: 1
id: vcdimconvex.exists-exponential-bound-hasaddvcndimatmost-n-of-convex-rn-add-one
title: VCₙ dimension of convex sets in ℝⁿ, ℝⁿ⁺¹, ℝⁿ⁺² (exists_exponential_bound_hasAddVCNDimAtMost_n_of_convex_rn_add_one)
field: mathematics
tier: proof
statement: |-
  For every $n \ge 1$ there exists some $d$ such that every convex set in $\mathbb R^{n + 1}$ has
  $\mathrm{VC}_n$ dimension at most $d$.

  The bound can be taken to be $d = c^n$ for some constant $c \ge 2$ independent of $n$.
