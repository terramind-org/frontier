title: Number of Regions Meeting in a Minimizing Partition
field: mathematics
tier: prose
statement: Let $k(n)$ be the maximum number of regions meeting at one point in an area-minimizing partition in $n$ dimensions. Determine the growth of $k(n)$ and whether it is strictly increasing; investigate the analogue for other surface energies.
