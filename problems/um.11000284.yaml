title: Question 3.4 — If a subgroup G⊂Out(Fn) is not virtually abelian, then is H 2 b (G; R) infinite dimensional?
field: mathematics
tier: prose
statement: If a subgroup G⊂Out(Fn) is not virtually abelian, then is H 2 b (G; R) infinite dimensional? Ifm≥n then there are obvious embeddings GL( n, Z)→ GL(m, Z) and Aut( Fn)→ Aut(Fm), but there are no obvious embeddings Out( Fn)→ Out(Fm). Bogopolski and Puga [ 10] have shown that, for m = 1 + ( n− 1)kn, where k is an arbitrary natural number coprime to n− 1, there is in fact an embedding, by restricting automorphisms to a suitable characteristic subgroup of Fm.
