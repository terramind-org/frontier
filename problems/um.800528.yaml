title: Linear Systems and Eigenvalue Problems — Problem 37 (Subspace injection properties of sparse random matrices)
field: mathematics
tier: prose
statement: |-
  Assume the condition $r\le \mathcal{O}(n/\log n)$ relating the subspace dimension $r$ and the ambient dimension $n$.
  Prove or disprove: A SparseStack embedding with parameters $\zeta = \mathcal{O}(1)$ and $k = \mathcal{O}(r)$ is an oblivious subspace injection with parameter $\alpha = \mathrm{const}$.
  More specifically, do parameters $\zeta = 4$ and $k = 2r$ suffice to achieve the OSI property (for all sufficiently large $r$)?
