title: Euler inversion, punctured p-torsion, and equivariant chromatic primes
field: mathematics
tier: prose
statement: |-
  We may examine how viewing the Tate spectrum of a given \(G\)-spectrum is related to chromatic localizations. For example, given the spectrum \(KO\) with trivial \(C_2\)-action, we have
  \[
  (KO_{(2)})^{tC_2}\simeq\bigvee_{k\in\mathbb Z}\Sigma^{4k}H\mathbb Q_{(2)}.
  \]
  Why should taking the Tate spectrum bring an object down in chromatic height (i.e. why do we see a blue shift)? More generally, we'd like to look at “chromatic primes” and “equivariant primes” in the same place and understand how they interact.
