title: Descent of Freeness for Orthogonal Modular Form Algebras
field: mathematics
tier: prose
statement: Let $\Gamma<O^+(M)$ be a finite-index subgroup generated by reflections, and let $\Gamma'$ be a finite-index subgroup of $\Gamma$. If $M_*(\Gamma')$ is a free graded algebra of modular forms, must $M_*(\Gamma)$ also be free?
