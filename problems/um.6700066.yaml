title: "Scalar Curvature Question [?70]: Let a domainY ⊂Rn havemean"
field: mathematics
tier: prose
statement: "Conjecture Let a domainY ⊂Rn havemean.curv(∂Y ) ≥ n−k+ε for someε> 0 and k = 2,...,n −1. ThenY−1 admits a continuous map onto a(k−1)-dimensional polyhedral space space, say ∆∶Y−1→Pk−1, such that the pullbacks of all points are uniformly bounded, diam(∆−1(p)) ≤const=const(n,ε). Thus, the macroscopic dimension (see below) ofY−1 is ≤k−1. (The extremal case whereε= 0 is seen inY =Bn−k(1)× Rk ⊂Rn, where Rk admits no continuous map to any Pk−1 with uniformly bounded pullbacks of allp∈P by Lebesgue Lemma.) In particular, If Y ⊂Rn is a connected domain withmean.curv(∂Y ) > n−2+ε then the subsetY−1 ⊂Y is bounded. (Recall that the macroscopic dimension of a metric spaceM is the minimal dimension of polyhedral spacesP, for whichM admits a continuous map ∆ ∶M →P, such thatdiamM(∆−1(p)) ≤d for some constantd=d(M).) Now let us formulate the scalar curvature conjecture of the above conjecture. Start with a few deﬁnitions. Length Metrics in Spaces of Maps.The space Φ of mapsφ from X to S, whereS is a metric space comes with thesup-metric dist(φ1,φ 2) = sup x∈X dist(φ1(x),φ 2(x)). Let us endow subsets inΦ with the correspondinglength metrics: such a metric on aΨ⊂Φ is the supremum of the metrics which locally agree with the supmetric onΨ, which the same (except for irrelevant pathological cases) as the metric deﬁned via the length of curves inΨ. What is interesting is that this length metric in a Ψ may be signiﬁcantly greater than the sup-metric, which happens whenΨ is distorted inside Φ. Examples. (A) Continuous Maps Let Ψ = C(X→S) ⊂Φ be the space ofcontinuous maps X→S with the above length metric and let ˜S →S be a locally isometric covering map.65 Then the corresponding mapC(X→˜S)→C(X→S) is an isometry. It follows that the space of maps from then-ballBn to a compact spaceS with an inﬁnitefundamental group hasinﬁnite diameter. 65Here and below we assume that our spaces are locally contractible, e.g. manifolds or cell complexes and thatS is alength metric space, e.g. a Riemannian manifold. 70 But ifS has ﬁnite fundamental group, then the spaceC(Bn→S) has ﬁnite diameter. For instance, diam(C(Bn→Sm(1)))=diam(Sm(1)) =π for m> n. Somewhat less obviously, diam(C(Bn→Sn(1)))≤3π,…"
