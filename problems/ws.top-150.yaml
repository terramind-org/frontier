statement: |-
  \section{Optimal Dimension Bounds for Odd-Degree Forms}\label{statement}


  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Unless a section says otherwise, $\N=\{1,2,\ldots\}$,
  $\Z$ is the ring of integers, $\Q,\R,\C$ are the rational, real, and complex
  fields, $[N]=\{1,\ldots,\lfloor N\rfloor\}$, and $\log$ is the natural
  logarithm. For real functions of a parameter tending to infinity,
  $f\ll g$ and $f=O(g)$ mean $|f|\leq Cg$ eventually for some fixed $C$;
  $f\gg g$ reverses this comparison; $f=o(g)$ means $f/g\to0$;
  $f\sim g$ means $f/g\to1$; and $f\asymp g$ means both order bounds.
  A subscript on $O$ or $\ll$ specifies allowed constant dependence.
  The expression $n^{o(1)}$ in an upper bound means growth smaller than
  $n^\epsilon$ for each fixed $\epsilon>0$. Local definitions govern any
  exception, finite-field convention, or use of the same symbol for another
  object. An asymptotic claim is not automatically an effective algorithm.



  A degree-$d$ form is a homogeneous polynomial $F$ satisfying $F(t\mathbf x)=t^dF(\mathbf x)$. A nontrivial integer zero is $\mathbf x\in\Z^n\setminus\{0\}$ with $F(\mathbf x)=0$. For odd $d\geq3$, the source asks for effective or sharp bounds on a dimension threshold valid uniformly over all integer coefficients. Determining the least possible threshold is the corresponding extremal formulation. \sref{statement}{1} \sref{statement}{2}

  \paragraph{Statement recorded in the supplied source.}
  Let $d \geq 3$ be odd. Give bounds on $\nu(d)$ such that if $n > \nu(d)$ then any homogeneous polynomial $F(\mathbf{x}) \in \mathbb{Z}[x_1, \dots, x_n]$ of degree $d$ has a nontrivial integer zero. \sref{statement}{1}

  \paragraph{Residual task reported by the archive.}

  The embedded review (2026-08-17) records: Record the best explicit upper and lower bounds for the exact single-form threshold nu(d). \sref{statement}{1}

  \subsection{Short English statement}

  How many variables are needed to guarantee a nonzero integer solution to every homogeneous equation of a fixed odd degree?

