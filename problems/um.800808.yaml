title: Geometric Hydrodynamics in Open Problems — Problem 7 (Two-point boundary value problem)
field: mathematics
tier: prose
statement: |-
  Let $M$ be a compact two-dimensional Riemannian manifold
  and let $\varphi$ be a volume-preserving diffeomorphism of $M$ of Sobolev class $H^s$.

  (i) \mathrm{(Surjectivity Problem)}
  Find a divergence-free vector field $v \in H^s(M)$ such that $\exp_e{v} = \varphi$.

  (ii) \mathrm{(Variational Problem)}
  Find a curve $\gamma(t)$ in $\mathscr{D}_\mu^s(M)$ from $e$ to $\varphi$
  which minimizes the $L^2$ energy functional
  $
  \mathcal{E}(\gamma) = \frac{1}{2} \int_0^1 \| \dot{\gamma}(t)\|^2_{L^2} dt.
  $
