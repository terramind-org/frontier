title: Elementary Equivalence of Differential Generalized Series Fields
field: mathematics
tier: prose
statement: If $k\equiv k'$ as fields and the asymptotic couples $(G,\psi)$ and $(G',\psi')$ are elementarily equivalent, are the generalized series fields $k((G))$ and $k'((G'))$, equipped with the derivations induced by their asymptotic couples, elementarily equivalent as differential valued fields?
