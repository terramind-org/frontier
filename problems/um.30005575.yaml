title: Poincaré Duality for Pro-Étale Cohomology of Stein Varieties
field: mathematics
tier: prose
statement: Let $X$ be a smooth geometrically irreducible Stein variety over $K$. Are $H^i_{\mathrm{pro\acute et}}(X,\mathbb{Q}_p(j))$ nuclear Fréchet spaces and $H^i_{\mathrm{pro\acute et},c}(X,\mathbb{Q}_p(j))$ spaces of compact type? Does the cup-product pairing give perfect duality between ordinary and compactly supported pro-étale cohomology?
