title: A quantitative rational-dependence family for Littlewood's conjecture
field: mathematics
tier: prose
statement: |-
  **Conjecture 28 (Littlewood).** For any \(\alpha,\beta\in\mathbb R\),
  \[
  \liminf_{q\to\infty}q\langle q\alpha\rangle\langle q\beta\rangle=0.
  \]
