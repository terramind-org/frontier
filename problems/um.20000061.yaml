title: Explicit K3 models and fine-moduli equivalences for discriminants 26 and 38
field: mathematics
tier: prose
statement: There have been new rationality constructions of special cubic fourfolds \(X\) due to Russo and Staglianò, for discriminant 26 or 38. Using these explicit constructions, write down an explicit K3 surface \(S\) and an equivalence \(\operatorname{Ku}(X)\simeq D(S)\).
