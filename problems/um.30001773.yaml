title: Vertices, Sources, and Filtrations of Symmetric-Group Modules
field: mathematics
tier: prose
statement: Let $F$ be a field, let $G$ be a finite group, and let $H\leq G$. For $i\geq1$, let $$T_i=\underbrace{FG\otimes_{FH}\cdots\otimes_{FH}FG}_{i\text{ copies of }FG},$$ viewed as an $(FH,FH)$-bimodule. Determine the minimal $n$ for which $T_n$ and $T_{n+1}$ have the same indecomposable direct summands up to multiplicity, including the alternating-group case. Determine the vertices and sources of irreducible $S_n$-modules $D^\lambda$, and decide whether a nontrivial source in characteristic $2$ must have even dimension. Is $\operatorname{Lie}(n)\otimes\operatorname{Lie}(n)^*$ a permutation module? Does every nonsimple indecomposable Specht module in characteristic $2$ restrict indecomposably to $A_n$? Determine the graded multiplicities of $D^\lambda$ in the coinvariant algebras of symmetric groups and $\operatorname{GL}_n(q)$, or in their socles.
