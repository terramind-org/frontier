title: Asymptotic Lengths of Local Cohomology Modules
field: mathematics
tier: prose
statement: Let $(R,\mathfrak m)$ be a d-dimensional local ring, I an ideal, and $(I_n)$ a decreasing sequence cofinal with the powers of I. If $\operatorname{length}H^i_{\mathfrak m}(R/I_n)<\infty$ for all sufficiently large n, what is the asymptotic behavior of $l_n^i=\operatorname{length}H^i_{\mathfrak m}(R/I_n)$?
