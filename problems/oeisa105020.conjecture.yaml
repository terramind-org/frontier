lean:
  module: FormalConjectures.OEIS.«105020»
  decl: OeisA105020.conjecture
  statement: |-
    theorem conjecture :
      ∀ (n i j : ℕ), 1 ≤ n →
        a i = 2 * n + 1 →
        a j = 2 * n + 3 →
        j = i + n + 1 →
        ∃ (k : ℕ),
          i < k ∧
          k < j ∧
          (a k).IsSemiprime
