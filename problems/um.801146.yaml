field: mathematics
tier: prose
statement: Suppose $N_1, N_2, M_1, M_2$ are separable II$_1$ factors such that $N_1^\mathcal{U}\overline{\otimes} N_2^\mathcal{U}\cong M_1^\mathcal{U}\overline{\otimes} M_2^\mathcal{U}$, then is $N_i$ elementarily equivalent to $M_i$ up to permutation?
