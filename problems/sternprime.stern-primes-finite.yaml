  definitions:
    - name: SternPrime.IsSternPrime
      kind: def
      text: |-
        /-- Predicate asserting that $q$ is prime and fails `HasPrimePlusTwiceSquare`. -/
        def IsSternPrime (q : ℕ) : Prop :=
          q.Prime ∧ ¬ HasPrimePlusTwiceSquare q
