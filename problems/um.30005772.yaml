title: Combinatorial Interpretations of Negative k-Arrangements
field: mathematics
tier: prose
statement: Let $A(n,k)$ denote the number of permutations of $[n]$ whose fixed points are colored with one of $k$ colors, extended polynomially from nonnegative integers $k$. Does $A(n,k)$ have a combinatorial interpretation for every negative integer $k$? More generally, does $A(2n,k)$ have a combinatorial interpretation for every $k\in\mathbb Z$?
