title: Asymptotic Growth Under Group Automorphisms
field: mathematics
tier: prose
statement: Given a finitely generated group $G$, an automorphism $\alpha$, and an element $g\in G$, how does $\alpha^n(g)$ grow as $n\to\infty$, and does the sequence have a limit in a suitable sense?
