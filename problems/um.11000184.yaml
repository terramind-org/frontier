title: Problem 6 — Find special features of the monodromy of algebraic surfaces.
field: mathematics
tier: prose
statement: Find special features of the monodromy of algebraic surfaces. There is some good motivation for this coming from at least three directions • The problem includes (in principle) the well-known problem of describing possible fun- damental groups of algebraic surfaces. • One famous constraint is the “hard Lefschetz” property, which has a well-known trans- lation into the action of the monodromy on homology. • From the Seiberg-Witten theory we know that there are strong restrictions on the basic classes of algebraic surfaces, and these can be translated into the TLP point of view along the lines of [ 6], [ 13].
