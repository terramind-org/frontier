statement: For every bounded convex domain $\Omega$ and every $k$, prove a dimension-free bound $\mu_{k+1}(\Omega)\lesssim\mu_k(\Omega)$; find an analytic proof; and extend the universal eigenvalue-ratio bound to convex domains in manifolds of nonnegative Ricci curvature.
