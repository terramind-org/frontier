  \section*{Endpoint gradient regularity of the planar disk maximal operator}\label{30007423}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For the centered Hardy-Littlewood maximal operator M over Euclidean disks in $R^2$, does every real f in $W^{1,1}(R^2)$ have M f in $W_loc^{1,1}(R^2)$ and ||gradient M $f||_L1$ $<=$ C||gradient $f||_L1$ for one absolute C?
  \subsection{Short English statement}
  For the centered Hardy-Littlewood maximal operator M over Euclidean disks in $R^2$, does every real f in $W^{1,1}(R^2)$ have M f in $W_loc^{1,1}(R^2)$ and ||gradient M $f||_L1$ $<=$ C||gradient $f||_L1$ for one absolute C?
