title: A sharp two-label frontier for Seymour's load conjecture
field: mathematics
tier: prose
statement: |-
  **Conjecture 6.5 (Seymour).** Under the hypotheses of Conjecture 6.1, if
  \(|V|=d\) and
  \[
  \sum_{i=1}^{k}\delta^+_{G_i}(v)\geq d
  \]
  for all \(v\), then \(G\) has a rainbow directed cycle.

  **Note.** This conjecture is false if \(|V|=d\) is replaced by
  \(|V|=d+1\).
