title: Problem 3.5 — Find explicit way of calculating d1(ϕ) for any given element ϕ ∈ Kg.
field: mathematics
tier: prose
statement: Find explicit way of calculating d1(ϕ) for any given element ϕ ∈ Kg. In particular, determine whether the Magnus representation Ig,1→GL(2g; Z[H]) of the Torelli group detectsd1 or not. Suzuki [ 103] proved that the Magnus representation of the Torelli group mentioned above is not faithful so that it may happen that the intersection of the kernel of the Magnus representation withKg is not contained in the kernel of d1. We may also ask whether the representation of the hyperelliptic mapping class group given by Jones [ 45], restricted to the intersection of this group withKg, detects d1 or not (cf. Kasahara [ 46] for a related work for the case g = 2). There are also various interesting works related to the class d1 such as Endo [ 14] and Morifuji [ 71] treating the hyperelliptic mapping class group, Kitano [ 54] as well as Hain and Reed [ 33]. Recently Biss and Farb [ 5] proved that the group Kg is not finitely generated for all g≥ 3 (K2 is known to be an infinitely generated free group by Mess [ 69]). However it is still not yet known whether the abelianization H1(Kg) is finitely generated or not (cf. Problem 2.2 of [ 80]). Finally we would like to mention that Kawazumi [ 50] is developing a theory of harmonic Mag- nus expansions which gives in particular a system of diﬀerential forms representing the Mumford- Morita-Miller classes on the universal family of curves over the moduli space Mg.
