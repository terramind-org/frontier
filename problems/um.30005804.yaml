title: Dolnikov’s Colorful Transversal Conjecture
field: mathematics
tier: prose
statement: Let $K\subseteq\mathbb R^2$ be compact and convex, and let $\mathcal F_1,\mathcal F_2,\mathcal F_3$ be finite families of translates of $K$. If $A\cap B\neq\varnothing$ whenever $A\in\mathcal F_i$, $B\in\mathcal F_j$, and $i\neq j$, prove that some $\mathcal F_j$ can be pierced by three points.
