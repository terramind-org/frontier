lean:
  module: FormalConjectures.Wikipedia.Conway99Graph
  decl: Conway99Graph.conway99Graph
  statement: |-
    theorem conway99Graph : ∃ G : SimpleGraph (Fin 99),
        G.LocallyLinear ∧ NonEdgesAreDiagonals G
  context:
    - open Conway99Graph
    - open SimpleGraph
    - "variable {V : Type} {G : SimpleGraph V}"
    - variable [Fintype V]
    - variable [DecidableEq V]
  definitions:
    - name: Conway99Graph.NonEdgesAreDiagonals
      kind: def
      text: |-
        /--
        Each two non-adjacent vertices have exactly two common neighbors.
        -/
        def NonEdgesAreDiagonals (G : SimpleGraph V) : Prop :=
           Pairwise fun i j => ¬ G.Adj i j → (G.neighborSet i ∩ G.neighborSet j).ncard = 2
