statement: . Find a direct description of some particular simple torsion classes in H ∗(BΓ∞; Z). There is an interesting connection between the higher Reidemeister torsion classes from [ 10] and the classes κi that require further study. Indeed both [ 10] and [ 14] use parametrized Morse theory. Could Problem 3.3 be related to “modular higher Reidemeister torsion”? Let Fg denote the free groups on g generators and Aut( Fg) its automorphism group. It obviously maps into Aut( Fg+1) and one can form BAut(F∞) and also its plus construction BAut(F∞)+. (Aut( F∞) contains a perfect index two subgroup). A. Hatcher has shown that Ω∞S∞ is a direct factor of Z×BAut(F∞)+ (up to homotopy), [ 8].
