  \section{\texorpdfstring{Kadison–Kastler Conjecture for Separable $C^*$-Algebras}{Kadison–Kastler Conjecture for Separable C\textasciicircum{}*-Algebras}}\label{30002216}
  {\small UnsolvedMath ID 30002216 · Algebra}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For a separable Hilbert space $H$, does there exist $\delta>0$ such that every pair of separable $C^*$-algebras $A,B\subset B(H)$ with $d(A,B)<\delta$ are spatially isomorphic?
  \par\smallskip\textit{Formulation references:} \sref{30002216}{1}, \sref{30002216}{2}.
  \subsection{Short English statement}
  For a separable Hilbert space $H$, does there exist $\delta>0$ such that every pair of separable $C^*$-algebras $A,B\subset B(H)$ with $d(A,B)<\delta$ are spatially isomorphic?
