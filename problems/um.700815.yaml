title: Kourovka Notebook Problem 11.123
field: mathematics
tier: prose
statement: |-
  (Well-known problem).
  For a given group $G$, define the following sequence of groups:
  $A_1(G)=G$, $A_{i+1}(G)=\mathrm{Aut} (A_i(G))$. Does there exist a
  finite group $G$ for which this sequence contains infinitely many
  non-isomorphic groups?
