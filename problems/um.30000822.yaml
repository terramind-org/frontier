title: Category-Weight Constructions for Nonsimply Connected Spaces
field: mathematics
tier: prose
statement: Can the category-weight construction that assigns a zero-divisor $\phi(u)\in H^*(X\times X)$ to a sufficiently high-category-weight cohomology class $u\in H^*(X)$, together with its cohomology-weight lower bound, be extended from simply connected spaces to nonsimply connected spaces?
