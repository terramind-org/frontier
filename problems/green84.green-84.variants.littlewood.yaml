lean:
  module: FormalConjectures.GreensOpenProblems.«84»
  decl: Green84.green_84.variants.littlewood
  statement: |-
    theorem green_84.variants.littlewood :
        ∀ ε : ℝ, 0 < ε → ∀ᶠ N in atTop, ∃ f : ℕ → ℤ, IsSignOn N f ∧
          ∀ θ : ℝ, |‖fourierSum N f θ‖ - √N| ≤ ε * √N
  context:
    - open Green84
    - open Green84.green_84
    - open Green84.green_84.variants
    - open Filter
    - open scoped ExponentialSum Finset Topology
  definitions:
    - name: Green84.IsSignOn
      kind: def
      text: |-
        /-- `IsSignOn N f` says that $f$ takes only the values $\pm 1$ on $[N] = \{1, \dots, N\}$. -/
        def IsSignOn (N : ℕ) (f : ℕ → ℤ) : Prop :=
          ∀ n ∈ Finset.Icc 1 N, f n = 1 ∨ f n = -1
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/GreensOpenProblems/84.lean#L47
    - name: Green84.fourierSum
      kind: def
      text: |-
        /--
        `fourierSum N f θ` is $\hat f(\theta) = \sum_{n=1}^{N} f(n) e(n\theta)$, with
        $e(x) = e^{2\pi i x}$, the Fourier transform of the restriction of $f$ to $[N]$.
        -/
        noncomputable def fourierSum (N : ℕ) (f : ℕ → ℤ) (θ : ℝ) : ℂ :=
          ∑ n ∈ Finset.Icc 1 N, (f n : ℂ) * e (n * θ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/GreensOpenProblems/84.lean#L51
