id: um.30000223
title: Injective Ext Systems for Cofinal Ideal Chains
field: mathematics
tier: prose
statement: Let $R$ be a polynomial ring over a field. For which ideals $\mathfrak{a}\subset R$ does there exist a descending chain $\{\mathfrak{a}_t\}_{t\in\mathbb{N}}$, cofinal with $\{\mathfrak{a}^t\}_{t\in\mathbb{N}}$, such that the natural maps $$\operatorname{Ext}_R^i(R/\mathfrak{a}_t,R)\longrightarrow\operatorname{Ext}_R^i(R/\mathfrak{a}_{t+1},R)$$ are injective for every $i$ and $t$?
