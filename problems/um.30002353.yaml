title: Valuative Form of Grothendieck's Section Conjecture
field: mathematics
tier: prose
statement: Let $k$ be a number field and $X/k$ a hyperbolic curve. Is every Galois section $s:G_k\to\pi_1(X)$ induced, up to conjugacy, by a suitable $k$-valuation of the function field $k(X)$?
