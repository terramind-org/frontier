lean:
  module: FormalConjectures.OEIS.«217785»
  decl: OeisA217785.conjecture_3
  statement: |-
    theorem conjecture_3 (n : ℕ) (hn : 1 ≤ n) :
        Irreducible (Polynomial.map (Int.castRingHom ℚ) (polyS n))
  context:
    - open OeisA217785
  definitions:
    - name: OeisA217785.polyS
      kind: def
      text: |-
        /-- The polynomial $s_n(x) = \sum_{k=0}^n (k+1) x^k$ over $\mathbb{Z}[x]$. -/
        noncomputable def polyS (n : ℕ) : Polynomial ℤ :=
          ∑ k ∈ Finset.range (n + 1), Polynomial.C (k + 1 : ℤ) * Polynomial.X ^ k
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/217785.lean#L92
