id: oeisa217785.conjecture-3
title: Smallest integer $s > n$ such that $1 + 2s + 3s^2 + \dots + n s^{n-1}$ is prime (conjecture_3)
field: mathematics
tier: proof
statement: |-
  Conjecture: The polynomials $s_n(x) = \sum_{k=0}^n (k+1) x^k$ for
  $n \ge 1$ are all irreducible over the field of rational numbers.
