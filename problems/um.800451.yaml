id: um.800451
title: Analysis of Boolean Functions — $\varepsilon$-biased Sets for DNFs
field: computer-science
tier: prose
statement: Is it true for each constant $\delta > 0$ that $s^{-O(1)}$-biased densities $\delta$-fool size-$s$ DNFs? I.e., that if $f \colon \{0,1\}^n \to \{-1,1\}$ is computable by a size-$s$ DNF and $\varphi$ is an $s^{-O(1)}$-biased density on $\{0,1\}$, then $|\mathbb{E}_{\mathbf{x} \sim \{0,1\}^n}[f(\mathbf{x})] - \mathbb{E}_{\mathbf{y} \sim \varphi}[f(\mathbf{y})]| \leq \delta$.
