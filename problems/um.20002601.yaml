id: um.20002601
title: A portal-gap reduction for a biased small-world walk
field: mathematics
tier: prose
statement: |-
  **Cycle + Erdos-Renyi.** Consider the graph \(G=\mathbb Z_n\cup ER(n,p)\) and make the simple random walk on \(G\) nonreversible by adding a counterclockwise drift to the cycle part.

  Prove that for \(p=\epsilon/n\), \(\epsilon>0\) fixed, the nonreversible chain has \(t_{\mathrm{mix}}\asymp\log n\).

  Prove that when \(p=\epsilon n^{-3/2}\) the nonreversible chain has \(t_{\mathrm{mix}}=\widetilde O(\sqrt n)\).
