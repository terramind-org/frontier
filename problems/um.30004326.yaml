title: Nonreduced Special Linear Systems on Plane Blowups
field: mathematics
tier: prose
statement: Let $X$ be the blowup of $\mathbb{P}^2$ at $r$ very general points and let $D=dH-\sum_i m_iE_i$. If the linear system $|D|$ is special, meaning its dimension exceeds $\max\{\binom{d+2}{2}-\sum_i\binom{m_i+1}{2}-1,-1\}$, must every divisor in $|D|$ be nonreduced?
