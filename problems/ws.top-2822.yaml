  \section{Kirby Problem 3.24}\label{2822}
  {\small UnsolvedMath ID 2822 · Topology}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Suppose a word-hyperbolic group has Gromov boundary homeomorphic to $S^2$. Must it act as a cocompact Kleinian group? More generally, if its boundary is planar, must a finite-index subgroup be a convex-cocompact Kleinian group? A Kleinian group is a discrete group of isometries of hyperbolic three-space.
  \par\smallskip\textit{Formulation references:} \sref{2822}{1}, \sref{2822}{2}, \sref{2822}{3}.
  \subsection{Short English statement}
  Suppose a word-hyperbolic group has Gromov boundary homeomorphic to $S^2$. Must it act as a cocompact Kleinian group? More generally, if its boundary is planar, must a finite-index subgroup be a convex-cocompact Kleinian group? A Kleinian group is a discrete group of isometries of hyperbolic three-space.
