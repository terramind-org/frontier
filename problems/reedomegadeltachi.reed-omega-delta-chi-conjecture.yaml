lean:
  module: FormalConjectures.Paper.ReedOmegaDeltaChi
  decl: ReedOmegaDeltaChi.reed_omega_delta_chi_conjecture
  statement: |-
    theorem reed_omega_delta_chi_conjecture :
      ∀ {V : Type} (G : SimpleGraph V),
        let χ := G.chromaticNumber
        let ω := G.ecliqueNum
        let Δ := G.emaxDegree
        2 * χ ≤ ω + Δ + 2
  context:
    - open ReedOmegaDeltaChi
    - open scoped Finset
  definitions: []
