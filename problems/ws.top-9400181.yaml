  \item[\hypertarget{source:9400181:2}{S2}] Y. Benmerieme and A. Movahhedi, \emph{Multi-quadratic p-rational Number Fields}, arXiv:2007.04864v1 (2020), Section 1, Greenberg conjecture, p. 1; Section 2, definition of p-rationality, pp. 2--3. \url{https://arxiv.org/pdf/2007.04864}.
