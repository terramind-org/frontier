  definitions:
    - name: Green35.c
      kind: def
      text: |-
        /-- The infimum of $\|f \ast f\|_p$ over unit-interval densities. -/
        noncomputable def c (p : ℝ≥0∞) : ℝ≥0∞ :=
          sInf { r | ∃ f, IsUnitIntervalDensity f ∧ r = eLpNorm (f ⋆ f) p }
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/GreensOpenProblems/35.lean#L63
