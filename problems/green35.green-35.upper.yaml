field: mathematics
tier: proof
statement: |-
  Upper bound for $c(p)$ for $1 < p \le \infty$. The TTT-Discover construction gives
  $c(\infty) \le 0.751435$ after rescaling to $[0,1]$ [YD26].
  The answer is informative only at $p = \infty$ and is `⊤` otherwise.
