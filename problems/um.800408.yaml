title: Open Problems in Arithmetic Dynamics — Conjecture 31 (Dynamical Lang Height Conjecture)
field: mathematics
tier: prose
statement: |-
  Let $N\ge1$, $D\ge1$, and $d\ge2$. There are positive constants
  $c_1(D,N,d)$ and $c_2(D,N,d)$ such that for all number fields $K/\mathbb{Q}$
  with $[K:\mathbb{Q}]\le D$, all degree $d$ morphisms $f:\mathbb{P}^N\to\mathbb{P}^N$
  defined over $K$, and all points $P\in\mathbb{P}^N(K)$ whose
  orbit $\mathcal{O}_f(P)$ is Zariski dense in $\mathbb{P}^N$, we have
  \[
  {\hat h}_f(P) \ge c_1(D,N,d) h_\mathcal{M}(f) + c_2(D,N,d).
  \]
