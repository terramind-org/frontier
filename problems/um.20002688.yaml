title: A moment obstruction to the stated freeness and a quantitative diagonal-recovery test
field: mathematics
tier: prose
statement: |-
  **Q.** Let \(B_c\) be a band limited operator obtained from \(c\), a circular element, and let \(D\) be the band limited operator obtained from the identity. Then \(D\) is uniformly distributed on \([0,1]\) and \(\star\)-free from \(\{B_c,B_c^*\}\). Is \(D\in W^*(B_c)\)? Or is \(W^*(B_c)=L(\mathbb F_t)\) with
  \[
  t=1+2c\left(1-\frac c2\right)?
  \]
