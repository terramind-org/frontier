statement: (\mathrm{arXiv):1711.03472}\) gives a description of \(n\)-slices, the objects that appear in the associated graded of the slice filtration. Is there a way to get a good computational grasp of \(n\)-slices? For example understanding their Postnikov towers, homotopy groups etc.
