id: um.20000057
title: A surface criterion for total CH0-triviality and its separation from L-rationality
field: mathematics
tier: prose
statement: |-
  Colliot-Thélène and Pirutka defined the notion of a \(CH_0\)-universally trivial resolution of singularities. As a preliminary question, is admitting a \(CH_0\)-universally trivial resolution an analytic local property for complex varieties? Assuming the answer is yes, we pose the following questions.

  In low dimensions, say up to 4, can we give an analytic local classification of \(CH_0\)-universally trivial singularities?

  More vaguely, is there a local classification of \(CH_0\)-universally trivial singularities in terms of MMP data?

  We can ask the same questions for \(L\)-rational singularities (defined by Nicaise and Shinder), and for \(B\)-rational singularities (defined by Kontsevich and Tschinkel).
