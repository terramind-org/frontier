statement: |-
  b) Let $E_n$ be a free locally nilpotent $n$-Engel
  group on countably many generators, and let $\pi(E_n)$ be the set
  of prime divisors of the orders of elements of the periodic part
  of $E_n$. It is known that $2, 3, 5\in \pi(E_4)$.

  Is it true that $\pi(E_n)=\pi(E_{n+1}) $
  for all sufficiently large $ n$?

