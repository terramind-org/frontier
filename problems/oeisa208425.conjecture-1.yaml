id: oeisa208425.conjecture-1
title: Expansion of $\sum_{n \ge 0} \frac{(3n)!}{n!^3} \frac{x^{2n}}{(1-x)^{3n+1}}$ (conjecture_1)
field: mathematics
tier: proof
statement: |-
  Conjecture (i): For any prime $p > 3$ and positive integer $n$, the number
  $(a(pn)-a(n))/(pn)^3$ is always a $p$-adic integer.
  - _Zhi-Wei Sun_, Nov 12 2016
