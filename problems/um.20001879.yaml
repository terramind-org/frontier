title: A Bezout obstruction to the printed divisibility model
field: mathematics
tier: prose
statement: |-
  It also shows that the page header and all the subsequent text beginning “4. Curvature conditions and hyperbolicity of the geodesic flow” belong to the next section, not to Conjecture 3.2.2.

  The immediately preceding paragraph is indispensable context. It defines
  \[
   \alpha_{g,G}=\lim_{\deg Y\to\infty}\frac{\deg Y}{\operatorname{cr}(Y)}
  \]
  for nonzero free-loop homology classes over a field \(G\), and then supposes, as a “little example,” that for a generator \(X\) of an integral rank-one homology group there are \(a<b<c<d\) such that
  \[
  \operatorname{cr}(mX)=
  \begin{cases}
  d,&(m,3)=(m,7)=1,\\
  c,&3\mid m,\ (m,7)=1,\\
  b,&7\mid m,\ (m,3)=1,\\
  a,&21\mid m. \end{cases} \tag{1}
  \]
  The displayed “conjecture” then gives the proposed coefficient pattern
  \[
   \alpha_{g,\mathbb Q}=a,\qquad
   \alpha_{g,\mathbb F_3}=b,\qquad
   \alpha_{g,\mathbb F_7}=c,\qquad
   \alpha_{g,\mathbb F_p}=a\quad(p\ne3,7). \tag{2}
  \]

  As printed, (2) is not a quantified proposition: it specifies neither a metric nor an existence or universal quantifier, and its constants come only from the hypothetical (1). Moreover, (1) is algebraically impossible. Thus this record cannot conservatively be classified as an open conjecture with a determinate truth value.
