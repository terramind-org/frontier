id: um.30000903
title: Real-Rooted Barycentric h-Polynomials and g-Theorem Conditions
field: mathematics
tier: prose
statement: If $P$ is a $d$-dimensional polytope, not necessarily simplicial, does the $h$-polynomial of the barycentric subdivision $\operatorname{sd}(\partial P)$ have only real roots? More generally, if $h(t)=h_0+h_1t+\cdots+h_dt^d$ has integer coefficients with $h_0=1$ and $h_i\geq1$, and all its roots are real, must $(h_0,\ldots,h_d)$ satisfy the classical $g$-theorem conditions?
