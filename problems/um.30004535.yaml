title: Eventual Linearity of Homological Invariants in Symmetric Ideal Chains
field: mathematics
tier: prose
statement: |-
  Let $(I_n)$ be a $\operatorname{Sym}$-invariant chain of ideals in polynomial rings $R_n$. Are $\operatorname{pd}_{R_n}(R_n/I_n)$ and $\operatorname{reg}(I_n)$ eventually linear in $n$? Equivalently, do integers $A,B,C,D$ exist such that

  $$\operatorname{pd}_{R_n}(R_n/I_n)=An+B,\qquad \operatorname{reg}(I_n)=Cn+D$$

  for all sufficiently large $n$?
