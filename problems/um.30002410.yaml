title: Involutions and Accuracy in Constrained PDE Methods
field: mathematics
tier: prose
statement: For involution-constrained PDEs in magnetohydrodynamics and nonlinear elasticity, how can the proper involutions be identified; what is the relation between enforcing involutions and using higher-order methods; and are lower-order methods with involution constraints sufficient?
