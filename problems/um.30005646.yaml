statement: Find varieties over global fields $K$ for which the full étale-homotopy obstruction is strictly stronger than its two-stage truncation; equivalently, find examples with $X(\mathbb{A}_K)^h\subsetneq X(\mathbb{A}_K)^{h,2}$.
