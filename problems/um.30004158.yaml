title: Theta Function Rings and Symplectic Cohomology
field: mathematics
tier: prose
statement: Let $(M,D)$ be a positive maximally degenerate pair, let $X=M\setminus D$, and let $A$ be the ring generated by its Gross–Siebert theta functions. Beyond the known additive identification, is $A$ isomorphic as a ring to the symplectic cohomology $SH^*(X)$?
