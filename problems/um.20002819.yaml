title: Projected superinduction and the transitivity defect
field: mathematics
tier: prose
statement: |-
  **Problem 1.7.** Make sense out of superinduction and restriction more generally than for algebra groups.

  **Remark.** To start with, trying the supercharacter theory induced by automorphisms and character-istic subgroups. Look at the article Induction for association schemes. Johnson & Smith (1986).

  K. W. Johnson and J. D. H. Smith, “A Note on Character Induction in Association Schemes,” *European Journal of Combinatorics* **7**(2) (1986), p. 139, DOI 10.1016/S0195-6698(86)80039-7.
