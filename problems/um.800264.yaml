title: Several Complex Variables Problem List — Problem 63
field: mathematics
tier: prose
statement: |-
  Do there exist Fatou--Bieberbach domains which are not Runge?
  A Fatou--Bieberbach domain is a proper subdomain of $\mathbb{C}^2$ which is
  biholomorphic to $\mathbb{C}^2$.\\
  -F. Forstneric, forstner@math.wisc.edu
