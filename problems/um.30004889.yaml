title: Unitarity from Nilpotent-Orbit Boundary Codimension
field: mathematics
tier: prose
statement: Let $G$ be a real reductive Lie group and call an irreducible Harish–Chandra module unipotent when it is annihilated by a unipotent ideal associated with a nilpotent orbit $\mathcal O$. If $$\operatorname{codim}(\partial\mathcal O,\mathcal O)\geq4,$$ must every such unipotent module be unitary?
