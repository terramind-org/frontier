  \section*{Campana–Peternell for Fano sixfolds}\label{30007017}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must every smooth connected projective complex Fano variety of dimension exactly six whose tangent bundle is nef be rational homogeneous?
