id: um.30004049
title: Strong Erdős–Hajnal Phenomena in Sparse H-Free Graphs
field: mathematics
tier: prose
statement: |-
  For which graphs $H$ does some $\varepsilon>0$ have the following property? Every $n$-vertex, $\varepsilon$-sparse, $H$-free graph $G$, with $n>1$, contains sets $A,B$ that are complete or anticomplete to each other and satisfy at least one of

  $$\lvert A\rvert,\lvert B\rvert\geq\varepsilon n;\qquad
  \lvert A\rvert\geq\varepsilon n,\ \lvert B\rvert\geq n^\varepsilon;\qquad
  \lvert A\rvert,\lvert B\rvert\geq n^\varepsilon.$$ 

  Must at least one of these three size conditions always hold?
