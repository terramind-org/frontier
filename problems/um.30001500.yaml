title: $L^2$ Eta Forms Without Determinant-Class Fibers
field: mathematics
tier: prose
statement: For a family of normal coverings and the rescaled Bismut superconnection $A_t$ of the family of signature operators, is $\operatorname{tr}_\Gamma\!\left(\tau\,\frac{dA_t}{dt}e^{-A_t^2}\right)$ integrable for $t\geq1$, so that the $L^2$ eta form is well-defined and continuous, without assuming that the fibers are of determinant class?
