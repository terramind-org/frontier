title: Irrational Seshadri Constants from the Nagata Conjecture
field: mathematics
tier: prose
statement: For $r\geq9$, does the Nagata conjecture for the blowup $X_r$ of $\mathbb P^2$ at $r$ general points imply the existence of an ample line bundle on $X_r$ whose Seshadri constant at a very general point is irrational?
