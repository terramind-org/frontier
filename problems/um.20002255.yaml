title: Strong-homology additivity and one universal earring test
field: mathematics
tier: prose
statement: |-
  Its exact `problem` field is:

  The old statement about \(\mathfrak d\) is preserved exactly above, but Section 2 treats it as a historical heuristic rather than a theorem.

  There are two scope distinctions that are essential to recovering the mathematical question.

  1. **Additivity is Milnor's axiom.** For a class \(\mathcal C\), every family \(\{X_\alpha:\alpha\in I\}\) for which all \(X_\alpha\) and the topological coproduct \(\coprod_{\alpha\in I}X_\alpha\) belong to \(\mathcal C\) must induce isomorphisms
     \[
     \bigoplus_{\alpha\in I}\overline H_p(X_\alpha)
     \longrightarrow
     \overline H_p\!\left(\coprod_{\alpha\in I}X_\alpha\right)
     \quad(p\geq 0).
     \]
     This is not the group-law assertion suggested by the ordinary-language word “additive.”
  2. **The general clause includes nonseparable spaces.** Every closed subspace of a finite-dimensional Euclidean space is locally compact and separable metrizable, but an arbitrary locally compact metric space need not be separable and may have arbitrarily large weight. The modern solution separates these cases.

  The literature used below works with the standard integral strong homology groups \(\overline H_p(-;\mathbb Z)\); that coefficient convention is adopted throughout. No assertion is made here that the same consistency statement simultaneously holds for every coefficient group. Strong homology agrees with Steenrod homology on metric compacta but is a different extension beyond compacta; it is not silently replaced by singular, Steenrod--Sitnikov, or Borel--Moore homology.
