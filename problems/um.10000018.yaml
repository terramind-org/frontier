id: um.10000018
title: Large identical neighborhoods and vertex transitivity
field: mathematics
tier: prose
statement: Let $G$ be an $n$-vertex graph whose rooted balls of size $k$ are all isomorphic. If $k>n/2$, or if $k$ is within a fixed constant of $\operatorname{diam}(G)$, must $G$ be vertex-transitive? Separately, for odd $n$, is the degree of a uniformly chosen vertex-transitive graph on $n$ vertices concentrated near $(n-1)/2$?
