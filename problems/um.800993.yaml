title: Open Problems in Mathematical Logic — Problem 5
field: mathematics
tier: prose
statement: |-
  Is there an injective one-way function on the reals? More precisely,
  is there a partial computable real function $f$ such that

  (i) $f$ is injective and preserves randomness,

  (ii) the domain of $f$ has positive Lebesgue measure, and

  (iii) $f(x)<_T x$
  for a positive-measure set of reals $x$ in the domain of $f$?
