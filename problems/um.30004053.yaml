title: Ryser–Brualdi–Stein Transversals in Latin Squares
field: mathematics
tier: prose
statement: Does every Latin square of order $n$ have a partial transversal of size $n-1$, and a full transversal when $n$ is odd? Equivalently, does every proper $n$-edge-coloring of $K_{n,n}$ contain a rainbow matching of size $n-1$?
