title: Generic Transitivity and Projective Linear Actions
field: mathematics
tier: prose
statement: Let $(X,G)$ be a transitive, generically $(n+2)$-transitive permutation group of finite Morley rank, with $G$ connected and $\operatorname{rk}(X)=n$. Is $(X,G)$ equivalent to $(\mathbb P^n(K),\operatorname{PGL}_{n+1}(K))$ for some algebraically closed field $K$?
