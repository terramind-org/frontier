title: Horn Spectral Data in Finite $\mathrm{II}_1$ Factors
field: mathematics
tier: prose
statement: Let $M$ be a finite $\mathrm{II}_1$ factor with normalized trace $\tau$, and let $a,b\in M$ be self-adjoint with prescribed spectral distributions. Characterize the possible spectral distribution of $a+b$. Equivalently, characterize the spectral data of self-adjoint $a,b,c\in M$ satisfying $a+b+c=0$.
