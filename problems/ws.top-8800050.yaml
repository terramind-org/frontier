  \item[\hypertarget{source:statement:2}{S2}] Everett W. Howe, \emph{Low-genus curves over finite fields: Problems and variations}, IPAM Number Theory and Cryptography: Open Problems workshop (9--13 October 2006), PDF pages 39--41. \url{https://helper.ipam.ucla.edu/publications/SCWS1/SCWS1_6237.pdf}.
