title: Low-Volume and Asymptotic Hyperbolic-Invariant Maximizers
field: mathematics
tier: prose
statement: For connected oriented closed hyperbolic $n$-manifolds of volume at most $v$, determine the low-volume maximizers and large-$v$ asymptotics of the maximal systole, kissing number, first positive Laplace eigenvalue, and its multiplicity. In dimension two, does the Bolza surface maximize the first positive eigenvalue and its multiplicity among genus-two surfaces?
