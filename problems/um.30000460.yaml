title: Schur-Algebra Models for Symmetric-Group Blocks
field: mathematics
tier: prose
statement: Every block of a symmetric group over $\mathcal{O}$ should be equivalent to a quotient of the deformation of the double of the Schur algebra of $\mathcal{O}Q$ and to the analogous quotient for its Koszul dual.
