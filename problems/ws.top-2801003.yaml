statement: |-
  \section{10 Lectures and 42 Open Problems — Tightness of the Multireference Alignment SDP}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $L,N\ge1$, and write $\mathbb Z_L=\mathbb Z/L\mathbb Z$. For $a\in\mathbb Z_L$, $R_a$ cyclically shifts the coordinates of $\mathbb R^L$. Observe $y_i=R_{\ell_i}x+\xi_i$, $1\le i\le N$, where $x\in\mathbb R^L$ and the shifts $\ell_i\in\mathbb Z_L$ are unknown and the $\xi_i$ are independent $\mathcal N(0,\sigma^2 I_L)$ random vectors. No prior distribution on the shifts is imposed. Define $C_{ia,jb}=\langle R_{-a}y_i,R_{-b}y_j\rangle$ for $a,b\in\mathbb Z_L$. The maximum-likelihood alignment objective is $\max_{a_1,\ldots,a_N}\sum_{i,j}C_{ia_i,ja_j}$. Its semidefinite relaxation maximizes $\operatorname{tr}(CV)$ over real symmetric $NL\times NL$ matrices satisfying \[V\succeq0,\quad V_{ia,jb}\ge0,\quad V_{ia,ib}=0\ (a\ne b),\quad \sum_{a,b\in\mathbb Z_L}V_{ia,jb}=1\ (i,j\in[N]).\] A shift assignment gives a feasible matrix $u u^\mathsf T$, where $u_{ia}=\mathbf1_{\{a=a_i\}}$; averaging its $L$ global cyclic translates is also feasible with the same objective. Tightness means that the optimal relaxed value equals the discrete alignment value, equivalently an optimal integral matrix exists. It does not mean the noisy maximum-likelihood shifts equal the true shifts.
  \paragraph{Statement recorded in the supplied source.}
  Determine the noise levels $\sigma$ for which this multireference-alignment semidefinite relaxation is tight, including its dependence on the number of observations, dimension and underlying signal. In probabilistic asymptotic regimes, determine when tightness occurs with probability tending to one. \sref{statement}{2}
  \subsection{Short English statement}
  Determine when the multireference-alignment SDP exactly optimizes the discrete alignment objective, despite the noise.
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] A. S. Bandeira, M. Charikar, A. Singer and A. Zhu, Multireference Alignment using Semidefinite Programming (2013), Sections 1--3, equations (1), (6)--(8), and Section 6, pp.2,4--6 and11. \url{https://arxiv.org/pdf/1308.5256}.
  \end{description}
