title: Visibility Graphs of Points, Segments and Polygons — Problem 31
field: mathematics
tier: prose
statement: |-
  Given a graph $G$ in adjacency matrix form along with a Hamiltonian cycle $C$ of $G$,
  determine whether $G$ is the visibility graph of a simple polygon $P$ whose boundary corresponds
  to the given Hamiltonian cycle $C$.
