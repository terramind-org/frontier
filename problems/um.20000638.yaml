title: Fixed-shift cancellation and a four-detector residual ledger
field: mathematics
tier: prose
statement: |-
  For a holomorphic or a Hecke--Maass cusp form \(f\), with \(n\)-th Fourier coefficient \(\lambda_f(n)\), obtain cancellation in

  \[
  \sum_{n\leq N}\lambda_f(n)\lambda_f(n+1)
  \]

  using (i) the Duke--Friedlander--Iwaniec delta method, (ii) a trivial delta method, (iii) the \({\rm GL}_2\) Petersson trace formula as a delta method, and (iv) the \({\rm GL}_3\) Kuznetsov trace formula as a delta method. The record adds that an explicit \({\rm GL}_3\) Kuznetsov formula with arbitrary level and nebentypus was not yet available.
