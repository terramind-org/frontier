title: Hyperbolicity and Imprimitivity in Vertex-Transitive Graphs
field: mathematics
tier: prose
statement: For every connected locally finite graph $\Gamma$ with a vertex-transitive automorphism group $G$, either $G$ has a finite-block imprimitivity system with finite induced stabilizer, or $\Gamma$ is hyperbolic.
