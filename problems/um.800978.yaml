title: Open Problems and Questions about Geodesics — Question 59
field: mathematics
tier: prose
statement: |-
  The previous question is related to the other questions in this section because of the following observation from [Mat-Top1998]: one can use the second metric to construct an integral of the geodesic flow of the first one. If both metrics are Riemannian, the integral is quadratic in velocities and the affirmative answer follows from [Kolokoltsov1983]; see [Mat-Top2000].

  *Does there exist a non-Riemannian Finsler metric satisfying the Landsberg condition
  on a surface of genus $\ge 2$?*
