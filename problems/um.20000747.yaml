title: Support-gap obstructions and a local-discrepancy converse for zeta
field: mathematics
tier: prose
statement: |-
  Traditionally, analytic information about the zeta-function has been
  used to derive upper bounds for differences between consecutive primes.
  Y. Motohashi asked whether this process can be reversed.  For example,
  what (if anything) can be said about \(\zeta(s)\) in the critical strip
  under (H)?
