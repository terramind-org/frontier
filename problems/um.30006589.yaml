title: Kernel Presentation for Multiple Eisenstein Relations
field: mathematics
tier: prose
statement: Let $G$ map words in $H^{\geq 2}=\mathbb Q\langle z_2,z_3,\ldots\rangle$ to multiple Eisenstein series, and set $\operatorname{DR}^*=\operatorname{span}_{\mathbb Q}\{\theta^n(R(u,v))*w:n\geq 0,\ u,v,w\in H^{\geq 2}\}$. Prove that $\operatorname{DR}^*=\ker G$.
