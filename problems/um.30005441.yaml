title: Centrally Nilpotent Skew Braces of Maximal Class
field: mathematics
tier: prose
statement: Study centrally nilpotent skew braces of maximal nilpotency class, using the lower central series $$\Gamma_{n+1}(B)=\sum_{i=1}^{n}\bigl(\Gamma_i(B)*\Gamma_{n+1-i}(B)+[\Gamma_i(B),\Gamma_{n+1-i}(B)]_+\bigr).$$ Classify the braces that attain maximal class.
