statement: For a fixed $k$, how large can the $k$th Steklov eigenvalue $\sigma_k$ be when boundary measure is normalized; equivalently, what is the maximum of $\sigma_k(g)|\Sigma|_g^{1/n}$ over smooth Riemannian metrics?
