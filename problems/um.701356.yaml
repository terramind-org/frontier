title: Kourovka Notebook Problem 17.54
field: mathematics
tier: prose
statement: |-
  Does there exist a non-hereditary local formation ${\mathfrak{F}}$ of
  finite groups such that in every finite group the set of all
  ${\mathfrak{F}}$-subnormal subgroups is a sublattice of the subgroup
  lattice?

  A negative answer would solve 9.75, since all the hereditary local
  formations with the same property are already known.
