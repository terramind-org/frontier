title: Evolution-Semigroup Generators for Nonautonomous Operator Families
field: mathematics
tier: prose
statement: |-
  For a family of generators $A(t)$ on a Banach space $X$, consider $X_0=C_0(\mathbb R,X)$ and

  $$(\mathcal Af)(s)=-f'(s)+A(s)f(s)$$

  on an appropriate domain. Under what conditions on $A(\cdot)$, and for which domain, is $\mathcal A$ the generator of a $C_0$-semigroup?
