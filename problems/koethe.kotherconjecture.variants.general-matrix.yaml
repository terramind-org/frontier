lean:
  module: FormalConjectures.Wikipedia.Koethe
  decl: Koethe.KotherConjecture.variants.general_matrix
  statement: |-
    theorem KotherConjecture.variants.general_matrix {I : TwoSidedIdeal R} (hI : IsNil I)
        (n : Type*) [Fintype n] : IsNil (matrix n I)
  context:
    - open Koethe
    - open Koethe.KotherConjecture
    - open Koethe.KotherConjecture.variants
    - open Ideal TwoSidedIdeal Polynomial
    - open Matrix
    - open scoped Classical
    - local notation "Nil* " R => KotheRadical R
  definitions:
    - name: Koethe.IsNil
      kind: def
      text: |-
        /-- Say a subset `I` of a ring `R` is nilpotent if all its elements are nilpotent. -/
        def IsNil {S : Type*} [SetLike S R] (I : S) := ∀ i ∈ I, IsNilpotent i
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/Wikipedia/Koethe.lean#L40
