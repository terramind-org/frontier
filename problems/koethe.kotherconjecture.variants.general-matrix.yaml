id: koethe.kotherconjecture.variants.general-matrix
title: "Köthe conjecture (variant: general_matrix)"
field: mathematics
tier: proof
statement: |-
  The **Köthe conjecture**: for any nil ideal `I` of `R`, the matrix ideal `M_n(I)` is a nil ideal
  of the matrix ring `M_n(R)`.
ams:
  - 16
