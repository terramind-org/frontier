statement: For solvable Lie groups $G$, show that solvsolitons are the only local maxima of the Ricci pinching functional $g\mapsto F(g)=\frac{Scal(g)^2}{|Ric(g)|^2}$ on left-invariant Riemannian metrics on $G$.
