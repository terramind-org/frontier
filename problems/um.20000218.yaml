title: Matroid classification and a sharp four-factor Cohen-Macaulay obstruction
field: mathematics
tier: prose
statement: |-
  Let $X$ be a variety in a generalized flag manifold $G/P$, with Schubert varieties $X_w$ ($w \in W/W_P$). Say that $X$ is *multiplicity-free* if in cohomology $[X] = \sum_{s \in S} [X_s]$ for a subset $S \subset W/W_P$. By a theorem of Brion, if $X$ is reduced, irreducible, and multiplicity-free, then $X$ admits a flat degeneration to the reduced union $\bigcup_{s \in S} X_s$, and this union is Cohen--Macaulay.

  **Problem 2.2 (Knutson).** Classify subsets $S \subset W/W_P$ that deform to irreducibles (i.e., such that $\bigcup_{s \in S} X_s$ is the special fiber of a flat degeneration of an irreducible subvariety $X \subset G/P$). For example, is it sufficient that $\bigcup_{s \in S} X_s$ be Cohen--Macaulay? The first case to try is $G/P \cong (\mathbb{P}^1)^n$.
