id: oeisa232616.conjecture-2
title: "Least $m > 0$ such that $\\{2^k - k : k = 1, \\dots, m\\}$ covers all residues modulo $n$ (conjecture_2)"
field: mathematics
tier: proof
statement: |-
  Conjecture (ii), first equation: The Diophantine equation $x^n - n = y^m$ with $m, n, x, y > 1$
  only has two integral solutions: $2^5 - 5 = 3^3$ and $2^7 - 7 = 11^2$.
