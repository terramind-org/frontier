lean:
  module: FormalConjectures.Wikipedia.MinimalPrime
  decl: MinimalPrime.base_seventeen_f19_family_minimal_prime_question
  statement: |-
    theorem base_seventeen_f19_family_minimal_prime_question :
        ∃ k : ℕ, IsMinimalPrimeInBase 17
          (15 * 17 ^ (k + 1) + 17 ^ k + ∑ i ∈ Finset.range k, 9 * 17 ^ i)
  context:
    - open MinimalPrime
  definitions:
    - name: MinimalPrime.IsMinimalPrimeInBase
      kind: def
      text: |-
        /-- Prime $p$ is minimal in base $b \ge 2$ when no prime $q \neq p$ has `Nat.digits b q` as a
        sublist of `Nat.digits b p`. -/
        def IsMinimalPrimeInBase (b p : ℕ) : Prop :=
          2 ≤ b ∧ p.Prime ∧ ¬∃ q : ℕ, q.Prime ∧ q ≠ p ∧ (Nat.digits b q).Sublist (Nat.digits b p)
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/MinimalPrime.lean#L45
