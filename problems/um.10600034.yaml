title: Virtual-knot problem 34 — Create a combinatorial homotopy theory for Khovanov homology so that the Khovanov homology of a knot or link is equiv…
field: mathematics
tier: prose
statement: |-
  Create a combinatorial homotopy theory for Khovanov homology so that
  the Khovanov homology of a knot or link is equivalent to the
  homotopy type of an abstract complex (or category) associated with
  the knot of link. This problem is meant in the sprit of Bar-Natan's
  reformulation of Khovanov homology as an abstract chain homotopy
  class of a categorical chain complex associated with the knot or
  link. Recent work of Lifshitz and Sarkar goes very far
  in this direction. Of course we would like a deeper connection, and
  we would like to have the theory working for virtual knots and
  links.
