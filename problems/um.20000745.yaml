title: Signed large and recurrent fixed second differences of consecutive primes
field: mathematics
tier: prose
statement: |-
  T. D. Wooley proposed the following problem: How often are the second differences
  \[
  p_{n+2}-2p_{n+1}+p_n
  \]
  small (large)? He noted that Erdős has proved that
  \[
  |p_{n+2}-2p_{n+1}+p_n|\ge (1+\delta)\log p_n \tag{3}
  \]
  infinitely often. A. Balog added that he had thought about the problem in the past and had convinced himself that the left side of (3) is infinitely often as large as the largest known gap between consecutive primes.
