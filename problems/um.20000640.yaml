title: Exact-conductor projectors as the finite bridge from trivial delta to automorphic kernels
field: mathematics
tier: prose
statement: |-
  **Relationship between Trivial delta method and Nelson's Kernel method.** Let \(f\) be a holomorphic or Hecke--Maass cusp form of level \(1\) and \(\chi\) be a Dirichlet character of level \(p\). For fixed \(f\), a level aspect Burgess-type bound for \(L(f\times\chi,1/2)\) can be obtained by (among many others) these two methods: (1) Trivial delta method, (2) Using the Kernel
  \[
  K(z,w)=\sum_{\gamma\in\Gamma_0(p)}\omega(z^{-1}\gamma w)
  \]
  for \(z,x\in\mathbb H\) and \(\omega\) a smooth bump function, defined appropriately. Find a precise relationship between the two methods.
