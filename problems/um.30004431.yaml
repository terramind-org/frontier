title: Equivalence of Gibbs Measures and $g$-Measures
field: mathematics
tier: prose
statement: For an equilibrium state $\mu$ of a potential $f$, is the existence of a positive continuous eigenfunction equivalent to $\mu$ being a $g$-measure? More generally, are Gibbs measures and $g$-measures equivalent?
