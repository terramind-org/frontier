title: Iwasawa Reciprocity in Sharifi’s Conjecture
field: mathematics
tier: prose
statement: Construct an isomorphism of Iwasawa $\Lambda$-modules $\varphi:X_K^-\to Y^-/IY^-$ such that, for $\Xi=\varphi\otimes\psi^-$, $$\Xi\bigl(\Psi_K(1-\zeta)^-\bigr)=\mathcal L^-\pmod{IY^-\otimes\Lambda^-}.$$ Does the candidate $\sigma\mapsto\overline b(\sigma)(\alpha)$ obtained from Galois action and twisted Poincaré duality have this property?
