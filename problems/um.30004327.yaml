title: Bounded Negativity Conjecture for Complex Projective Surfaces
field: mathematics
tier: prose
statement: Does every smooth projective surface $X$ over the complex numbers have bounded negativity; that is, does there exist $b(X)$ such that $C^2\geq-b(X)$ for every reduced irreducible curve $C\subset X$?
