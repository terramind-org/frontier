title: Balanced power-sum obstructions and the one-sign Behrend family
field: mathematics
tier: prose
statement: |-
  Wooley), asks whether Behrend's construction can be generalized to give large sets \(S\subset [N]\) having no solutions of
  \[
    \sum_{i=1}^{s}a_i x_i=0,
    \qquad \sum_{i=1}^{s}a_i=0,
    \qquad |a_i|<A,
  \]
  and asks the analogous question for
  \[
    \sum_{i=1}^{t}a_i x_i^2=0. \]
  The PDF then records N. Alon's two negative examples: coefficients \(1,1,-1,-1\) force a Sidon-type \(O(\sqrt N)\) bound, while fifty \(+1\)'s and fifty \(-1\)'s in the quadratic equation force \(O(N^{1/25})\). It also records that the linear construction works when only one coefficient has one sign, and points to Ruzsa's Acta Arithmetica papers.

  The following source issues matter mathematically.

  Thus this report treats the prompt as a family/classification question rather than a single yes/no proposition.
