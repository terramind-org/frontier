statement: |-
  (A. Mader).
  ``Standard $B$'', that is, $B={\mathbb{Z}(p) \oplus {\mathbb{Z}(p^2 ) \oplus
  \cdots$, is slender as a module over its endomorphism ring
  (A. Mader, in: *Abelian Groups and Modules,
  Proc., Udine, 1984*, Springer, 1984, 315--327). Which
  abelian $p $-groups are slender as modules over their endomorphism
  rings?
