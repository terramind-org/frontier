title: Malle Conjecture for Number Field Counts
field: mathematics
tier: prose
statement: For a number field $k$ and a transitive permutation group $G\subseteq S_n$, determine the asymptotic behavior of $$N_k(G,X)=\#\{K/k:\operatorname{Gal}(K/k)\simeq G,\ \operatorname{Disc}(K/k)<X\}.$$ In the cases where Malle's original logarithmic exponent is valid, is $$N_k(G,X)\sim C(G,k)X^{1/a(G)}(\log X)^{b(G,k)-1}$$?
