  statement: |-
    theorem erdos_695 :
        ∀ {q : ℕ → ℕ},
          StrictMono q →
          (∀ i, (q i).Prime) →
          (∀ i, q (i + 1) % q i = 1) →
          Tendsto (fun k => (q k : ℝ) ^ (1 / k : ℝ)) atTop atTop
