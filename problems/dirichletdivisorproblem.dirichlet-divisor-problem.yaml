lean:
  module: FormalConjectures.Wikipedia.DirichletDivisorProblem
  decl: DirichletDivisorProblem.dirichlet_divisor_problem
  statement: |-
    theorem dirichlet_divisor_problem :
        ∀ ε > (0 : ℝ), divisorError =O[atTop] fun x => x ^ ((1 : ℝ) / 4 + ε)
  context:
    - open DirichletDivisorProblem
    - open Filter Asymptotics Real
  definitions:
    - name: DirichletDivisorProblem.divisorError
      kind: def
      text: |-
        /-- The error term $\Delta(x) = D(x) - x \log x - (2\gamma - 1) x$ in the divisor summatory
        asymptotic, where $\gamma$ is the Euler–Mascheroni constant. -/
        noncomputable def divisorError (x : ℝ) : ℝ :=
          divisorSummatory x - x * Real.log x - (2 * eulerMascheroniConstant - 1) * x
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/DirichletDivisorProblem.lean#L57
