title: Kourovka Notebook Problem 20.77
field: mathematics
tier: prose
statement: |-
  (O. I. Tavgen').
  A group is said to be *boundedly generated* if it is a
  product of finitely many cyclic groups.
  Is it true that every boundedly generated residually finite group is linear over a field
  of characteristic zero?

  This is true for residually finite-soluble groups (L. Pyber, D. Segal, *J. Reine Angew. Math.*, **612** (2007), 173--211).
