title: Problem 5.5 — Explore ΓC for other free subgroups G< MCG (S), for example free subgroups generated by high powers of Dehn twists ab…
field: mathematics
tier: prose
statement: Explore ΓC for other free subgroups G< MCG (S), for example free subgroups generated by high powers of Dehn twists about a pair of filling curves. IfG is not free then [ Mos03a] contains a result more general than Theorem 5.3, with QI(Γ G) replaced by a group QI f (ΓG) constructed from quasi-isometries Γ G→ ΓG which coarsely preserve the family of cosets of π1(S) < ΓG. The point of G being free is that in this case one can use methods of coarse algebraic topology to prove that QI f (ΓG) = QI(Γ G); see e.g. [ FM00]. In the case that G =MCG (S) covered in Theorem 5.2, Whyte’s homological methods are used to prove that QI f (ΓG) = QI(Γ G). One might be able to use Whyte’s homological methods for other subgroups G <MCG (S), particularly when G is a Bieri-Eckmann duality group which is not a Poincar´ e duality group, such as G =MCG (S) [ Har86]. Unfortunately, none of these methods will work when G is a Leininger–Reid group, because in this case, G is a 2-dimensional Poincar´ e duality group, which rules out the methods of [ FM00] 16. Problems in the geometry of surface group extensions 269 as well as Whyte’s homological methods. We do not have any idea of how to overcome this obstacle. Nonetheless it should still be interesting to calculate Γ C = QI f (ΓG) for a Leininger–Reid subgroup G.
