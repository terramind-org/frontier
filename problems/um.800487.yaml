title: Billiards and Quantitative Symplectic Geometry — Serge Tabachnikov — Problem 9
field: mathematics
tier: prose
statement: |-
  **Optical transformations of the space of oriented lines..** The billiard (optical) reflection is a (local) symplectic transformation of the space of oriented lines (rays of light); this space carries a symplectic structure induced by the canonical symplectic structure of the cotangent bundle of the ambient $n$-dimensional space via symplectic reduction.

  The space of oriented lines has dimension $2n-2$, and its symplectic transformation depends on a smooth function of $2n-2$ variables (for example, an infinitesimal symplectic transformation, i.e., a Hamiltonian vector field, is defined by its Hamiltonian function).

  On the other hand, a smooth mirror is a hypersurface, locally the graph of a function of $n-1$ variables. Such functions constitute a minuscule part of the space of smooth functions of $2n-2$ variables. Thus, one expects the *optical* set of (local) symplectic transformations of the space of rays that are realized by a finite collection of mirrors to be a very small part of the set of all (local) symplectic transformations of the space of rays.

  Problem: *how to characterize this optical symplectic transformation within the space of all symplectic transformations of the space of oriented lines?*

  See [PTT,Pe,Ta20,Gl1] for some results in this direction.
