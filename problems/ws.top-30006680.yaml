title: Tate Conjecture for Algebraic Cycles
field: mathematics
tier: prose
statement: |-
  \section*{\texorpdfstring{Tate Conjecture for Algebraic Cycles}{Tate Conjecture for Algebraic Cycles}}\label{30006680}
  \subsection{Definitions and mathematical statement}
  Let $\bar X=X\times_k\bar k$, $G_k=\operatorname{Gal}(\bar k/k)$, and $\ell\ne\operatorname{char}k$. The Chow group $\operatorname{CH}^i(X)$ consists of codimension-$i$ cycles modulo rational equivalence. The Tate twist ${\mathbb{Q}}_\ell(i)$ is the $i$-fold tensor power of the cyclotomic representation. The assertion is surjectivity of
  \[
   \operatorname{cl}_\ell:\operatorname{CH}^i(X)\otimes{\mathbb{Q}}_\ell
   \longrightarrow H^{2i}_{\mathrm{\acute et}}(\bar X,{\mathbb{Q}}_\ell(i))^{G_k}
  \]
  for every smooth geometrically irreducible projective $X/k$, every $i$, and every $k$ finitely generated over its prime field. The domain uses cycles over $k$, and the coefficients are ${\mathbb{Q}}_\ell$, not ${\mathbb{Z}}_\ell$.
  \par\smallskip\textit{Formulation and concept references:} \href{https://www.math.columbia.edu/~chaoli/docs/TateConjecture.html}{[S1]}.

  \subsection{Short English statement}
  Are all arithmetic-symmetry-invariant even cohomology classes generated by algebraic cycles defined over the base field?
  \subsection{Sources}
  \begin{itemize}
  \item[S1]Li, What is the Tate conjecture?, map (2) and Conjecture 1 (2013).
  \url{https://www.math.columbia.edu/~chaoli/docs/TateConjecture.html}.
  \textit{Formulation source. Consulted 24 September 2026: Cycle-class map and Conjecture 1.}
  \item[S2]An approach to the Tate conjecture for surfaces over a finite field — Bruno Kahn (2025).
  \url{https://arxiv.org/abs/2505.07337}.
  \textit{Further reference; not a proof endorsement.}
  \item[S3]On the integral Tate conjecture for abelian varieties — J. S. Milne (September 8, 2025).
  \url{https://arxiv.org/abs/2509.06707}.
  \textit{Further reference; not a proof endorsement.}
  \item[S4]An approach to the Tate conjecture for surfaces over a finite field — Bruno Kahn, full text.
  \url{https://arxiv.org/html/2505.07337v1}.
  \textit{Further reference; not a proof endorsement.}
  \end{itemize}
