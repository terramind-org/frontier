  decl: OeisA218585.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 12 < n) :
        ∃ x : ℕ, 0 < x ∧ 3 * x < n ∧ Nat.Prime (n * x + (n - x) ^ 2)
