title: Partitions $n = x + y$ with $x^2 + xy + y^2$ prime (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture: The number of primes of the form $nx + (n - x)^2$
  with $0 < x < n / 3$ is positive for $n > 12$.
  - _Zak Seidov_, Sep 25 2013
