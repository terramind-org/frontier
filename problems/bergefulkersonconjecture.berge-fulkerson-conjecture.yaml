lean:
  module: FormalConjectures.Wikipedia.BergeFulkersonConjecture
  decl: BergeFulkersonConjecture.berge_fulkerson_conjecture
  statement: |-
    theorem berge_fulkerson_conjecture :
        ∀ {V : Type} [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj],
          IsCubic G → G.IsBridgeless →
          ∃ M : Fin 6 → G.Subgraph, IsPerfectMatchingCover G 6 2 M
  context:
    - open BergeFulkersonConjecture
    - open SimpleGraph Finset
    - "variable {V : Type*} [Fintype V] [DecidableEq V]"
  definitions:
    - name: BergeFulkersonConjecture.IsCubic
      kind: def
      text: |-
        /-- A graph is **cubic** if every vertex has degree `3`. -/
        def IsCubic (G : SimpleGraph V) [DecidableRel G.Adj] : Prop :=
          ∀ v, G.degree v = 3
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/BergeFulkersonConjecture.lean#L46
    - name: BergeFulkersonConjecture.IsPerfectMatchingCover
      kind: def
      text: |-
        /-- A family of `k` perfect matchings of `G` **covers every edge exactly `m` times** if each
        member is a perfect matching and every edge of `G` lies in exactly `m` of them. -/
        def IsPerfectMatchingCover (G : SimpleGraph V) (k m : ℕ) (M : Fin k → G.Subgraph) : Prop :=
          (∀ i, (M i).IsPerfectMatching) ∧
            ∀ e ∈ G.edgeSet, (univ.filter fun i => e ∈ (M i).edgeSet).card = m
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/BergeFulkersonConjecture.lean#L51
