id: um.20002358
title: Density-zero localizations do not force rank-small integral points
field: mathematics
tier: prose
statement: Let \(E\) be an elliptic curve over \(\mathbb Q\) of rank 2. Can we find a subset \(S\) of (infinitely many) primes such that the subgroup generated by \(E(\mathbb Z[S^{-1}])\) has rank one? If \(S\) is finite, the Siegel--Mahler theorem states that \(E(\mathbb Z[S^{-1}])\) is finite. Suppose \(S\) is infinite, but of density 0. Is \(E(\mathbb Z[S^{-1}])\) still “small”?
