title: Research Problems in Function Theory — Problem 7.19
field: mathematics
tier: prose
statement: For what sets $\Omega$ of lattice points $(m_k, n_k)$ do the monomials $x^{m_k}y^{n_k}$ span $L^2$ or $C_0$ on the unit square $0\leq x\leq1$, $0\leq y\leq1$? It is conjectured that the condition $\sum\frac{1}{m_kn_k}=\infty$ is sufficient for sets $\Omega$ in an angle $\varepsilon x \leq y \leq x/\varepsilon$, $\varepsilon>0$. Hellerstein has shown that the condition is not necessary. (J. Korevaar)
