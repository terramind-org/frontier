title: Finite-Growth Hopf Algebras in Yetter–Drinfeld Categories
field: mathematics
tier: prose
statement: Let $G$ be a finitely generated group. Classify, or at least characterize, all coradically graded connected Hopf algebras $E=\bigoplus_{n\in\mathbb{N}_0}E_n$ in the Yetter–Drinfeld category ${}^{\mathbb{C}G}_{\mathbb{C}G}\mathcal{YD}$ such that $\operatorname{GKdim}(E\#\mathbb{C}G)<\infty$.
