title: Patchworking and Twisted Real Quintics
field: mathematics
tier: prose
statement: Does Viro patchworking of the Newton polytope of a quintic in $\mathbb P^4$, with the rays on its two-dimensional faces assigned the same sign as the interior point, produce a real quintic diffeomorphic to the connected $(M-2)$ real quintic obtained by twisting the corresponding real Lagrangian torus fibration?
