title: Local Lifting Properties of Free-Group Product $C^*$-Algebras
field: mathematics
tier: prose
statement: Does the full group $C^*$-algebra $C^*(F_2\times F_2)$ have the local lifting property or the lifting property? More generally, does a $C^*$-algebra $A$ have the local lifting property if and only if $\operatorname{Ext}(A)$ is a group?
