  definitions:
    - name: OeisA236998.a
      kind: def
      text: |-
        /-- $a(n)$ is the number of integers $0 < k < n/2$ such that $\phi(k)\phi(n-k)$ is a square. -/
        def a (n : ℕ) : ℕ :=
          ∑ k ∈ Finset.Icc 1 ((n - 1) / 2),
            if IsSquare (k.totient * (n - k).totient) then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/236998.lean#L34
