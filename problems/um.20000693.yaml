title: Multiplicity-sensitive moments of products of Dirichlet L-functions
field: mathematics
tier: prose
statement: |-
  Develop a heuristic for moments of imprimitive \(L\)-functions, or if your \(L\)-function factors into degree \(1\) factors, e.g.
  \[
  \int |L(\tfrac{1}{2}+it,\chi_1)\cdots L(\tfrac{1}{2}+it,\chi_k)|^2\,dt
  \]
  (or different powers).
