  \section{Exact zero-Kerr spectrum and high-energy Kerr localization}\label{20002495}
  {\small UnsolvedMath ID 20002495 · Mathematical Physics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$; the standard number fields have their usual meanings. All additional conventions are stated locally.


  \paragraph{Definitions and notation.}In the standard bosonic Fock representation, $a|n\rangle=\sqrt n\,|n-1\rangle$, $a^\dagger|n\rangle=\sqrt{n+1}\,|n+1\rangle$, $[a,a^\dagger]=I$ and the number operator is $N=a^\dagger a$. Thus $aa^\dagger=N+I$. The displayed Hamiltonian is generally unbounded on its natural operator domain. Its spectral behavior depends on the real parameters, including zero-parameter cases.

  \paragraph{Catalogue wording retained for traceability.}
  Determine the distribution of eigenvalues of $H=\omega a^\dagger a+\chi(a^\dagger a)^2-i\gamma aa^\dagger+\beta(a^\dagger+a)$, with $\omega,\chi,\gamma,\beta\in\mathbb R$, as asked by the source.
  \paragraph{Scope and source qualification.}The source calls a and its adjoint raising and lowering in the opposite order to the standard convention. The displayed Hamiltonian is retained and the convention is made explicit. No positivity, nonzero-parameter restriction, or compact-resolvent claim is inserted. The catalogue title/status was paired with a machine-generated research attempt; that attempt is not peer-reviewed evidence of settlement. The statement covers the original source questions rather than only the title’s subcase.
  \subsection{Short English statement}
  Determine the eigenvalue distribution of the damped, driven Kerr-type bosonic Hamiltonian.
