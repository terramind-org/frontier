title: Open Problems in Mathematical Logic — Problem 36
field: mathematics
tier: prose
statement: |-
  Nies, Segal, and Tent 2021 [NST] studied expressiveness of f.o. logic for profinite group. Many such groups are axiomatised by single sentence in the language of groups, among this reference class.

  For a f.o. sentence $\varphi$, what is the possible complexity of $\{G : G \models \varphi\}$?
