title: Foliations and Diffeomorphism Groups — Question 26
field: mathematics
tier: prose
statement: Suppose we are given an $**S**^3$-bundle $**S**^3\to E\xrightarrow{p} M$ over a $4$-manifold $M$ with nontrivial Euler class and $p_1$. Mather-Thurston's theory says we can find a bordism of this bundle to a $C^0$-flat bundle $**S**^3\to E'\to M'$. Can one bound the simplicial volume of $M'$ so that it does not depend on the bundle map $p$?
