title: Moments of L-functions — Moments of the Riemann zeta function — Problem 7
field: mathematics
tier: prose
statement: |-
  Improve Chandee's [Ch, Theorem 1.2].
  \begin{theorem}
  Let $k_i$ be positive real numbers. Let $\alpha_i=\alpha_i(T)$ be real-valued functions of $T$ such that $\alpha_i =o(T)$. Assume that $\lim_{T\rightarrow \infty} \alpha_i\log T$ and $\lim_{T\rightarrow \infty} (\alpha_i-\alpha_j)\log T$ exist or equal $\pm \infty$. Assume that for $i\neq j$, $\alpha_i\neq \alpha_j$ and $\alpha_i-\alpha_j =O(1)$.
  Then the Riemann Hypothesis implies that for $T$ sufficiently large, one has
  $$
  M_{**k**}(T, **\alpha**)\ll_{**k**,\varepsilon} T(\log T)^{k_1^2 + \cdots k_m^2 +\varepsilon} \prod_{i<j} \left( \min\left\{\frac{1}{|\alpha_i-\alpha_j|}, \log T \right\}\right)^{2k_ik_j}
  $$
  where
  \[
  M_{**k**}(T, **\alpha**)
  = \int_{0}^{T} |\zeta(\tfrac{1}{2} + (t+\alpha_1) )|^{2 k_1} \cdots |\zeta( \tfrac{1}{2} + (t+\alpha_m)|^{2 k_m} dt.
  \]
  \end{theorem}
  Use Harper's method [Ha] to remove the $\varepsilon$. Note that the case of two shifts ($m=2$ and $k_1=k_2$) has been dealt with in [NSW]. \\
  (N. Ng, Lethbridge)
