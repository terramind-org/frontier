title: Universal Triangulations with Prescribed Boundary
field: mathematics
tier: prose
statement: For a simplicial $(d-1)$-sphere $T$ linearly embedded in $\mathbb{R}^d$, characterize universal triangulations, construct algorithmically a universal $d$-ball $U$ with prescribed boundary $T$, and bound the size of $U$. The case $d=2$ is known, but higher dimensions remain open.
