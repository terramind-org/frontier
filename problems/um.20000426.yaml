title: Two explicit new divisor classes on the level-4 surface modulo 3
field: mathematics
tier: prose
statement: (J. Ellenberg, D. Ulmer) Let \(X\) be a modular curve, which parametrizes elliptic curves with some level structure, and let \(E\) be the universal family of elliptic curves over \(X\). This defines an elliptic surface, typically over \(\mathbb Q\). It often happens that, for many primes \(p\), the reduction modulo \(p\) of this surface acquires new Tate classes, not coming from characteristic zero. Can we find algebraic cycles (living in characteristic \(p\)), which account for such Tate classes?
