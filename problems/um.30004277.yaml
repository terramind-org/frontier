title: Essential Spectrum of Sign-Indefinite Transmission Laplacians
field: mathematics
tier: prose
statement: Let $L=-\nabla\cdot(h\nabla)$ on a bounded domain $\Omega$, where $h=1$ on $\Omega_+$ and $h=-\mu$ on $\Omega_-$, with interface $\Sigma$. When $\mu=1$, can the essential spectrum of $L$ contain more than one point or a nonempty interval? If it is a singleton, how do eigenvalues accumulate? Can boundary-triple methods be developed without assuming $\Omega_-\subseteq\Omega$, and for nonsmooth $\Sigma$?
