statement: |-
  \section*{Bounded-degree coboundary expanders in each dimension at least three}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every integer $d>=3$, do constants $D,\epsilon >0$ and connected pure finite d-dimensional simplicial complexes with vertex counts tending to infinity exist such that each vertex belongs to at most D top faces and every $F_2$ cochain below top dimension satisfies ||delta $f||>=\epsilon $ dist(f,B)?
  \subsection{Short English statement}
  For every integer $d>=3$, do constants $D,\epsilon >0$ and connected pure finite d-dimensional simplicial complexes with vertex counts tending to infinity exist such that each vertex belongs to at most D top faces and every $F_2$ cochain below top dimension satisfies ||delta $f||>=\epsilon $ dist(f,B)?
