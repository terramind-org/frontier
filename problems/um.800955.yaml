title: Open Problems and Questions about Geodesics — Question 35
field: mathematics
tier: prose
statement: |-
  We use $C^k$-topology either locally or on closed manifolds, where we may
  assume that the atlas is finite and the gluing functions have all derivatives bounded. Then the convergence in the topology means the following: a sequence $g^{(1)},g^{(2)},\dots$ of metrics converges to a metric $g$ in the topology $C^k$ if in local charts the entries $g^{(m)}_{ij}$ (viewed as local functions in this chart) and their partial derivatives $\frac{\partial g^{(m)}_{ij}}{\partial x_\ell},
  \frac{\partial^2 g^{(m)}_{ij}}{\partial x_\ell \partial x_s},\ldots $ up to order $k$ converge to those of $g_{ij}$.

  Assume $M$ is closed.
  Do the metrics with positive entropy form a $C^k$-dense subset of $\mathcal{G}(M)$?
