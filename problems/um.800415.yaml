title: Open Problems in Arithmetic Dynamics — Question 38 (Vague Motivating Question)
field: mathematics
tier: prose
statement: |-
  If we let $f$ range over $\operatorname{End}_{\mathsf{Set}}(S)$ or $\operatorname{Aut}_{\mathsf{Set}}(S)$ and let
  $\#S\to\infty$, then there are known statistics for $\#\operatorname{Per}(f,S)$ and
  for various natural quantities associated to the graph $\Gamma_f$ such
  as its number of components, its largest component, its largest cycle,
  and many others. See for example [MR1083961,MR0119227,MR0062973].
  In particular, Flajolet and Odlyzko [MR1083961] analyze a large
  number of properties for average random maps, and one may ask whether
  similar statistics hold if one restricts to maps defined by
  polynomials.

  To what extent do polynomial maps behave like random set maps?
