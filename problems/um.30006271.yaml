title: K-Theory Equivalence of Hall and Quasi-BPS Categories
field: mathematics
tier: prose
statement: Prove that the algebraic or topological $K$-theory of $D\text{-}\operatorname{mod}_{\mathrm{coh}}(\mathcal{X}(d))_{w/d}$ is isomorphic, under the specialization map, to the $K$-theory of the quasi-BPS category $\mathbb{T}(d)_w$. Establish the corresponding slope-zero Hall-category equivalence.
