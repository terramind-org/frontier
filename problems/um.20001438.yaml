title: Low-period multiplier-locus conspiracies
field: mathematics
tier: prose
statement: |-
  Let \(\mathop{Per}_n(\lambda)\) be the locus in the moduli space of
  formal \(n\)-cycles with multiplier \(\lambda\).
  \(\mathop{Per}_n(\lambda)\) is in general an irreducible cubic,
  \(\\mathop{Per}_3(1)\) factors. Let
  \(\mathop{Per}^{\ast}_n(\lambda)\) be the same but with actual
  \(n\)-cycles instead of formal \(n\)-cycles.
  \(\mathop{Per}^{\ast}_3(1)=\mathop{Per}_2(-3)\) are the same line in
  \(\mathbb A^2\) (Milnor).
  \(\mathop{Per}_n(\lambda)\cap\mathop{Per}_m(\lambda')\) should be zero
  dimensional (need at least one multiplier outside the unit circle).
  Are there any other examples \(n,m,\lambda,\lambda'\) where the
  intersection is not zero dimensional?
