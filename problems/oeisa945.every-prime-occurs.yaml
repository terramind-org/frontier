lean:
  module: FormalConjectures.OEIS.«945»
  decl: OeisA945.every_prime_occurs
  statement: |-
    theorem every_prime_occurs :
        ∀ p, p.Prime → ∃ n ≥ 1, a n = p
  context:
    - open OeisA945
  definitions:
    - name: OeisA945.a
      kind: def
      text: |-
        /-- The Euclid-Mullin sequence, extended by `a 0 = 1`. -/
        def a : ℕ → ℕ
          | 0 => 1
          | n + 1 => Nat.minFac (b n + 1)
