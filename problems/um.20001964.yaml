title: Noncompact equivariant integration and the boundary at infinity
field: mathematics
tier: prose
statement: Let \((M,\omega)\) be a noncompact real-algebraic symplectic manifold. Let a compact torus \(T\), with Lie algebra \(\mathfrak t\), act Hamiltonianly on \(M\), with proper semialgebraic moment map \(\mu:M\to\mathfrak t^*\), and suppose the fixed set \(M^T\) is compact. For a smooth equivariant differential form \(\alpha:\mathfrak t\to\Omega^*(M)\) having the intended semialgebraic dependence (not necessarily polynomial) on the variables, can one geometrically define \(\int_M\alpha\), valued in smooth functions on \(\mathfrak t\), so that fixed-point localization holds?
