title: Polygonal Period Relations and Formal Multiple Zeta Values
field: mathematics
tier: prose
statement: Let $FC$ be the formal algebra generated by polygon pairs for periods on $M_{0,n}$, modulo symmetric-group invariance, one-point shuffle relations, and product-map relations. Is $FC$ isomorphic to the formal multiple-zeta-value algebra; equivalently, do these three families generate all relations among the corresponding periods?
