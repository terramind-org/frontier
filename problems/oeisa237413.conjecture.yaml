lean:
  module: FormalConjectures.OEIS.«237413»
  decl: OeisA237413.conjecture
  statement: "theorem conjecture (n : ℕ) (hn : 1 < n) : 0 < a n"
  context:
    - open OeisA237413
  definitions:
    - name: OeisA237413.a
      kind: def
      text: |-
        /-- $a(n)$ is the number of ways to write $n = k + m$ with $k > 0$ and $m > 0$ such that
        $p_k^2 - 2$, $p_m^2 - 2$, and $p_{p_m}^2 - 2$ are all prime. -/
        noncomputable def a (n : ℕ) : ℕ :=
          ∑ k ∈ Finset.Ico 1 n,
            if (Nat.nth Nat.Prime (k - 1) ^ 2 - 2).Prime ∧
               (Nat.nth Nat.Prime (n - k - 1) ^ 2 - 2).Prime ∧
               (Nat.nth Nat.Prime (Nat.nth Nat.Prime (n - k - 1) - 1) ^ 2 - 2).Prime then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/OEIS/237413.lean#L35
