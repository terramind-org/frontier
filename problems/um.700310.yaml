title: Kourovka Notebook Problem 5.26
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finite $p
  $-group with the minimal number
  of generators $d$, and let $r_1$ (respectively, $r_2$) be the
  minimal number of defining relations on $d$ generators in the
  sense of representing $G$ as a factor-group of a free discrete
  group (pro-$p
  $-group). It is well known that always
  $r_2 > d^2/4$. For each prime number $p$ denote by $c(p)$ the
  exact upper bound for the numbers $b(p)$ with the property that
  $r_2 \geq b(p)d^2$ for all finite $p
  $-groups.

  a) It is obvious that $r_1 \geq r_2$. Find a
  $p
  $-group with $r_1 > r_2$.

  b) *Conjecture:* $\lim\limits_{p\rightarrow
  \infty}
  c(p)=1/4$. It is proved
  (J. Wisliceny,
  *Math. Nachr.*,
  **102** (1981), 57--78) that
  $\lim\limits_{d\rightarrow \infty} r_2\left/ d^2\right. =1/4$.
