title: Smooth Lifts of the Dehn-Twist Braid Relation
field: mathematics
tier: prose
statement: Let $a$ and $b$ be right Dehn twists about essential simple closed curves meeting once, so that $aba=bab$ in the mapping class group. Can they be lifted to homeomorphisms $A$ and $B$ satisfying $ABA=BAB$? Can such lifts be chosen of class $C^1$, or more generally $C^r$?
