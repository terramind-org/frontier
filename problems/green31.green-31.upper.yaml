lean:
  module: FormalConjectures.GreensOpenProblems.«31»
  decl: Green31.green_31.upper
  statement: |-
    theorem green_31.upper :
        (∃ᶠ N in atTop, F N ≤ green_31.upper.answer N) ∧
        ∃ c < (0.94349 : ℝ), ∃ C : ℝ, ∀ᶠ N in atTop, green_31.upper.answer N - Real.sqrt (N : ℝ) ≤ c *
          (N : ℝ) ^ (4⁻¹ : ℝ) + C
  context:
    - open Green31
    - open Green31.green_31
    - open Filter
  definitions:
    - name: Green31.F
      kind: def
      text: |-
        /-- Let $F(N)$ be the largest Sidon subset of $[N]$. -/
        noncomputable def F (N : ℕ) : ℝ := Finset.maxSidonSubsetCard (Finset.Icc 1 N)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/GreensOpenProblems/31.lean#L58
