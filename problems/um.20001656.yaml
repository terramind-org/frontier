title: The forward Lipschitz horoboundary and a rose-face orientation test
field: mathematics
tier: prose
statement: |-
  Problem 5.3. What is the closure X? What is X\X, the horofunction boundary of outer space in the Lipschitz metric?

  Thierry Coulbois asked if we know the horofunction boundary in the simplicial metric, and also if it is reasonable Busemann points could be the whole thing. For the latter, Cormac said yes, as it is true for Teichmüller space. Specifically, a Busemann point \(B_\sigma\) is determined by a 'good' ray

  \(\sigma:[0,\infty)\to X_n\) by \(B_\sigma(x)=\lim_{n\to\infty}(d(x,\sigma(n))-n)\). If \(X\) were CAT(0) or Teichmüller space 6 EDITED BY JOHANNA MANGAHAS

  with the Lipschitz metric, then X\X would consist entirely of Busemann points. However, warned Cormac, even for normed spaces you can get points that are not Busemann points.
