id: um.30003108
title: Lang–Silverman Height Bounds for Simple Abelian Varieties
field: mathematics
tier: prose
statement: |-
  For every integer $g\geq1$ and number field $K$, does there exist $c_2(K,g)>0$ such that every simple abelian variety $A/K$ of dimension $g$, every ample symmetric line bundle $L$ on $A$, and every nontorsion point $P\in A(K)$ satisfy

  $$\widehat h_{A,L}(P)\geq c_2(K,g)\max\{h_F(A/K),1\}$$?
