title: Cartan Subalgebras in Classifiable $C^*$-Algebras
field: mathematics
tier: prose
statement: Does the Razak–Jacelon algebra $\mathcal W$ have a Cartan subalgebra? Does the Jiang–Su algebra $\mathcal Z$ have a distinguished one-dimensional Cartan subalgebra? Do strongly self-absorbing Cartan pairs admit useful existence and uniqueness theorems? What $K$-theory map is induced by the inclusion of a Cartan subalgebra, what equivalence relation models Popa intertwining, and how do Cartan subalgebras interact with completely positive approximation? Does the CAR algebra have a Cartan subalgebra with connected spectrum? When does an equivariant embedding into $M_{2^\infty}$ have maximal-abelian image? Is every order-two automorphism of $\mathcal O_2$ strongly approximately inner?
