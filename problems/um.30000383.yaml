title: Decomposition of Well-Quasi-Orders into Better-Quasi-Orders
field: mathematics
tier: prose
statement: Is every well-quasi-order a countable union of better-quasi-orders? If $P$ is a well-quasi-order, must $P$ belong to $G_{\mathrm{bqo}}$, or at least $G_{\mathrm{wqo}}$, the classes whose poset algebras are respectively better-quasi-order-generated or well-quasi-order-generated?
