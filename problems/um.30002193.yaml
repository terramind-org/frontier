title: Classification of Simple Normal Surface Singularities
field: mathematics
tier: prose
statement: What are the simple normal surface singularities? The conjecture is that they are exactly the rational singularities whose resolution graphs arise from graphs of rational double points and rational triple points by making some vertex weights more negative; in particular, rigid normal surface singularities do not exist.
