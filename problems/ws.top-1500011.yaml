statement: |-
  % UnsolvedMath ID 1500011; source catalogue code AMR-014-0011
  \setcounter{section}{1500010}
  \section{Algebraic Stories — Hilbert series of other classes of ideals}\label{1500011}
  {\small\sffamily UnsolvedMath ID 1500011 · Algebra}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $S=\mathbb C[x_1,\ldots,x_n]$ with its usual total-degree grading. For a homogeneous quotient $R$, define
  \[\operatorname{Hilb}_R(t)=\sum_{e\geq0}(\dim_{\mathbb C}R_e)t^e.
  \]
  A generic tuple of forms has its coefficient vector in a suitable nonempty Zariski open subset of the product of the prescribed homogeneous pieces.Let $n,r,k\geq1$ and $d>1$. Choose generic $g_1,\ldots,g_r\in S_d$, and independently choose generic $f_1,\ldots,f_r\in S_{dk}$.
  \paragraph{Statement recorded in the supplied source.}
  Is
  \[\operatorname{Hilb}_{S/(g_1^k,\ldots,g_r^k)}(t)=\operatorname{Hilb}_{S/(f_1,\ldots,f_r)}(t)
  \]
  for all these parameters? \sref{1500011}{2}
  \subsection{Short English statement}
  Does taking powers of generic forms of degree at least two preserve the Hilbert series of fully generic generators of the resulting degree?
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:1500011:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 1500011 (AMR-014-0011). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:1500011:2}{S2}] R. Fröberg, S. Lundqvist, A. Oneto and B. Shapiro, \emph{Algebraic Stories from One and from the Other Pockets}, arXiv:1801.01692 (2018), §2.2, Conjecture 2.4. \url{https://arxiv.org/abs/1801.01692}.
  \end{description}
  \label{end:1500011}
