title: A slice–Bochner criterion for joint logarithmic potentials
field: mathematics
tier: prose
statement: |-
  If \(M\) is a \(\mathrm{II}_1\) factor, \(T_1,\ldots,T_n\in M\), \([T_i,T_j]=0\), then we have the “Brown Measure” defined as the unique measure on \(\mathbb C^n\) such that
  \[
  (*)\qquad
  \log\Delta\!\left(1-\sum_i\alpha_iT_i\right)
  =\int\log\!\left(1-\sum_i\alpha_i\zeta_i\right)
  d\mu_{T_1,\ldots,T_n}(\zeta_1,\ldots,\zeta_n).
  \]

  **Q:** Which functions on \(\mathbb C^n\) have an integral representation as in \((*)\)?
