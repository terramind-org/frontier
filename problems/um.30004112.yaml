title: Character Bounds beyond Split Levi Subgroups
field: mathematics
tier: prose
statement: Can character bounds currently available for split Levi subgroups be extended to non-split Levi subgroups? Can useful bounds be obtained for every $g\in G^F$ and every $\chi\in\operatorname{Irr}(G^F)$ when $G$ is simple and is not of type $A$?
