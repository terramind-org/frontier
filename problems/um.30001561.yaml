title: Infinite Words Avoiding Equal-Length, Equal-Sum Factors
field: mathematics
tier: prose
statement: Does there exist an infinite sequence over a finite subset of $\mathbb{Z}$ with no factor $x_1x_2$ such that $|x_1|=|x_2|$ and the sums of the letters in $x_1$ and $x_2$ are equal?
