title: Optimal Moment Conditions for Random Conductance Models
field: mathematics
tier: prose
statement: For random conductance models with stable-like jumps on $\mathbb{Z}^d$, determine the optimal integrability or moment condition replacing the sufficient bounds on positive and negative moments of the conductances that ensure the quenched invariance principle.
