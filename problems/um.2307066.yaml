title: Research Problems in Function Theory — Problem 7.66
field: mathematics
tier: prose
statement: "A continuous mapping $f:B^n\\to\\mathbb{R}^n$, where $B^n = \\{x : x\\in\\mathbb{R}^n,|x|<1\\}$, and $n\\geq2$, is said to be proper if $f^{-1}(K)$ is a compact subset of $B^n$ whenever $K$ is a proper subset of $f(B^n)$. Let \\[B_f = \\{z : z \\in B^n, f\\text{ is not a local homeomorphism at }z\\}.\\] Is it true that, if [(i)] ; $n\\geq3$, ; $f:B^n\\to\\mathbb{R}^n$ is proper and quasi-analytic, and [(iii)] ; $B_f$ is compact then $f$ is necessarily injective? Note that the mapping $f(z) = z^2$, where $z \\in B^2$, shows that the conjecture is false when $n = 2$. The conjecture is known to be true in the special case that $f(B^n) = B^n$, $n\\geq3$. The conjecture is a special case of a more general open problem in . (M. Vuorinen)"
