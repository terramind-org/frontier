  \item[\hypertarget{source:7200053:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 7200053 (AMR-071-0053). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
