title: Literal quotient is two-dimensional in the four-dimensional parity-even model
field: mathematics
tier: prose
statement: |-
  Problem 6: Is \(\mathcal L/(\mathcal L'+\mathcal L'')\) one-dimensional and generated by the class of \(Q\)?

  The exact AIM record is:

  The notation is recovered from the immediately preceding Problems 5a--5b and from Branson--Gover's workshop notes. On a closed even-dimensional Riemannian manifold, write a critical-weight local scalar invariant as the density
  \[
     \mathbf S_g=S_g\,dv_g. \]
  Problem 5b literally calls the space of such local invariants \(\mathcal L\). The subspace \(\mathcal L'\) consists of those \(\mathbf S\) having a **local conformal primitive**: there is a critical-weight local density \(\mathbf F\) such that, for every background metric and every \(\omega\),
  \[
   \left.\frac d{dt}\right|_{0}\int_M\mathbf F_{e^{2t\omega}g}
         =\int_M\omega\,\mathbf S_g. \tag{1}
  \]
  The space \(\mathcal L''\) consists of pointwise local conformal invariant densities. The source's displayed equation in Problem 5a suppresses the integral against \(\omega\); (1) is the unambiguous formula in the cited Branson--Gover notes.

  There is a consequential ambiguity. The same workshop document later asks, in Problem 30, for the corresponding decomposition only for natural \(n\)-forms \(\mathbf S\) whose integrals are conformally invariant. Branson's precise invariant-theoretic treatment also uses the smaller formally-self-adjoint space \(\mathcal X_{\rm FSA}\). Thus this report treats separately:

  1. the literal Problem 5b reading, where \(\mathcal L\) is the full critical-weight local-invariant space; and
  2. the conformal-index/formally-self-adjoint reading that appears to be the intended conjecture.

  All statements below concern densities, not bare scalars. The calculation is fixed-dimension, parity-even, polynomial invariant theory in dimension four. It does not silently assert a stable-dimensional or non-polynomial classification.
