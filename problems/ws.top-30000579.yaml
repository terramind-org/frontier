  \section{Linear Baroclinic Prediction of Ocean Eddies}\label{30000579}
  {\small UnsolvedMath ID 30000579 · Mathematical Physics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$; the standard number fields have their usual meanings. All additional conventions are stated locally.


  \paragraph{Definitions and conventions.} Baroclinic instability transfers potential energy from a stratified, vertically sheared mean flow into growing perturbations. Linear theory predicts growth rates and spatial structures by linearizing about that mean state. Oceanic eddy statistics include their horizontal scales and amplitudes; the deformation scale reflects the balance between stratification and rotation.

  \paragraph{Source scope and qualifications.} The source presents a null hypothesis and a model/data comparison program, not an exact equality or a universal prediction-error bound. The baseline mean state, observations, and meaning of largely predicted must be supplied in any quantitative follow-up.

  \paragraph{Catalogue mathematical target.}
  \paragraph{Catalogue wording retained for traceability.}
  Can observed ocean eddy structure be largely predicted and understood through linear baroclinic-instability theory?

  \paragraph{Saved literature context.} The supplied catalogue's assessment dated 2026-08-21 records: The report presents this as an open problem, conjecture, or unresolved research direction; targeted literature checking found no authoritative resolution of the extracted claim as of 2026-08-21. The assessment is retained as dated provenance; it is not a new comprehensive literature or open-status certification.
  \subsection{Short English statement}
  Determine how much observed ocean-eddy structure can be explained by the linear instability of the mean ocean.
