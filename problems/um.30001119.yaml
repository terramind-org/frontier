statement: For an infinite electrical network $G$ with energy space $\mathcal H_E$ and finite-energy harmonic subspace $\operatorname{Harm}$, what is the appropriate boundary $\partial G$, including its space and measure, whose integral represents the boundary term in the discrete Gauss–Green formula?
