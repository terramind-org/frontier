title: Kourovka Notebook Problem 17.61
field: mathematics
tier: prose
statement: |-
  The group \(\mathrm{CT}_{\mathcal{P}}(\mathbb{Z})\)
  is finitely generated if and only if \(\mathcal{P}\) is finite. If
  \(\mathcal{P} = \varnothing\), then it is isomorphic to the
  finitely presented (first) Higman--Thompson group
  (J. P. McDermott, see Remark 1.4 in S. Kohl, *J. Group Theory*, **20**, no. 5 (2017), 1025--1030).
  Is it always finitely presented if \(\mathcal{P}\) is finite?
