title: Sharp Gibbs status and exact proposal-sensitive Metropolis benchmarks
field: mathematics
tier: prose
statement: |-
  **Metropolis on $[0,1]^2$.** Consider the stationary distribution on
  $[0,1]^2$ given by
  \[
  \pi_A(p_1,p_2)=\mathcal Z^{-1}\exp(-A|p_1-p_2|^2),
  \]
  parametrized by $A\in[10,1000]$. Obtain a good bound on the mixing time
  of the Metropolis algorithm for this stationary distribution in terms of
  $A$. Generalize this to $[0,1]^d$.
