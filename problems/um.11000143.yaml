title: Problem 13 — What are the kernels of the Magnus representations?
field: mathematics
tier: prose
statement: What are the kernels of the Magnus representations? Finally in [48] by taking contractions of powers of our canonical one cocycle, new combinatorially explicit cycles and cocycles on M(F ) are constructed which on the other hand generate the tautological algebra. It is natural to wonder about the extension of these classes to the screen model for ¯M(F ) and to the combinatorial compactification, and to revisit [16,19,22] in this context.
