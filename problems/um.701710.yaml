title: Kourovka Notebook Problem 20.52
field: mathematics
tier: prose
statement: A famous result of Burnside states that if $k(G)$ is the number of conjugacy classes of a finite group $G$ of odd order, then $|G|- k(G)$ is divisible by 16. Is it true that for every integer $m > 0$ there exists a finite non-abelian group $G(m)$ of odd order such that $|G(m)| - k(G(m)) = 16m$?
