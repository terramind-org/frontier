statement: |-
  \section*{Constant-factor hardness of directed feedback vertex set}\label{30007452}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every fixed $A\geq 1$, is finding a directed feedback vertex set within factor A NP-hard on explicitly given unweighted digraphs, with a positive threshold and a deterministic polynomial-time gap reduction?
  \subsection{Short English statement}
  For every fixed $A\geq 1$, is finding a directed feedback vertex set within factor A NP-hard on explicitly given unweighted digraphs, with a positive threshold and a deterministic polynomial-time gap reduction?
