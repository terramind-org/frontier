title: Boundary and Hyperbolic Dimensions of Symmetric Spaces
field: mathematics
tier: prose
statement: Is $\dim\partial_\infty\Gamma=\operatorname{mdim}\partial_\infty\Gamma$ for a visual metric on the boundary of a Gromov-hyperbolic group? What is $\operatorname{hdim}(\mathbb{H}^2\times\mathbb{H}^2)$? More generally, is the hyperbolic dimension of every noncompact symmetric space without Euclidean factors at least its dimension?
