title: Delocalized Cyclic Pairings with Structure Sets
field: mathematics
tier: prose
statement: Let $(M,g)$ be a closed manifold with a metric of positive scalar curvature. Determine, in general, the pairing of delocalized continuous cyclic cocycles with the topological structure set; equivalently, compute the associated pairings $\tau_c\circ\rho(M,g)$.
