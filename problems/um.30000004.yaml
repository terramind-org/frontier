statement: For a three-dimensional smooth manifold $M$ with nonempty boundary and prescribed endpoint tangent data, is the natural map $\operatorname{Emb}(I,M;\partial)\to\operatorname{Tot}(X^\bullet)$ from long knots to the totalization of the compactified-configuration cosimplicial space a homotopy equivalence?
