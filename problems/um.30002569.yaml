id: um.30002569
title: Support Uncertainty for Finite Cyclic Short-Time Fourier Transforms
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finite cyclic group. Does there exist a nonzero window $\varphi\in\mathbb C^G$ such that the attainable support-size pairs

  $$\bigl(\lVert x\rVert_0,\lVert V_\varphi x\rVert_0\bigr)$$

  are exactly

  $$\bigl(\lVert x\rVert_0,\lvert G\rvert^2-\lvert G\rvert+\lVert\widehat x\rVert_0\bigr),\qquad x\in\mathbb C^G$$

  as $x$ ranges over $\mathbb C^G$?
