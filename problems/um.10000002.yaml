id: um.10000002
title: Finite groups in the property-T collapse window
field: mathematics
tier: prose
statement: In Gromov's density model with generators $a,a^{-1},b,b^{-1}$, choose $3^{nd}$ relators independently and uniformly from the reduced words of length $n$, for a density parameter $d$, and add the relators sequentially. The resulting quotient groups eventually collapse to the trivial group. Give an upper bound on the number of pairwise nonisomorphic finite nontrivial groups that can occur after the last infinite group and before the trivial group. In particular, prove the conjecture that this number is almost surely bounded uniformly in $n$.
