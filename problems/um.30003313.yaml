title: Composition and Elementary Equivalence in Surreal Differential Fields
field: mathematics
tier: prose
statement: Can a satisfactory composition operator be defined on all of $\mathbf{No}$? Are the EL-series elementarily equivalent to the omega-series field as differential fields? Does every $\kappa$-computable function on the Cauchy completion of $\mathbf{No}_\kappa$ satisfy the intermediate value theorem? Is there a Kaplansky differential embedding theorem for $\mathbb{R}((G))_\kappa$, and which functions $f$ satisfy $\lambda_{f(x)}=\kappa_x$?
