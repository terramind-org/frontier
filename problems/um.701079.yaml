title: Kourovka Notebook Problem 14.95
field: mathematics
tier: prose
statement: |-
  (C. R. Leedham-Green, P. M. Neumann,
  J. Wiegold). For a finite $p $-group $P$, denote by $c=c(P)$
  its nilpotency class and by $b=b(P)$ its *breadth*, that is,
  $p^b$ is the maximum size of a conjugacy class in $P$. *Class-Breadth Problem:* Is it true that $c\le b+1$ if $p\ne 2$?

  So far, the best known bound is $c <
  \frac{p}{p-1}b+1$ (C. R. Leedham-Green, P. M. Neumann,
  J. Wiegold, *J. London Math. Soc. (2)*, **1** (1969),
  409--420). For $p=2$ for every $n\in{\mathbb{N}$ there exists a
  $2$-group $T_n$ such that $c(T_n)\geq b(T_n)+n$ (W. Felsch,
  J. Neub\"user, W. Plesken, *J. London Math. Soc. (2)*,
  **24** (1981), 113--122).
