lean:
  module: FormalConjectures.OEIS.«237720»
  decl: OeisA237720.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) :
        a n = 1 ↔ n = 6 ∨ n = 23 ∨ n = 24 ∨ (111 ≤ n ∧ n ≤ 120)
  context:
    - open OeisA237720
  definitions:
    - name: OeisA237720.a
      kind: def
      text: |-
        /-- $a(n)$ is the number of primes $p \le \lfloor (n+1)/2 \rfloor$ with $\lfloor\sqrt{n-p}\rfloor$
        prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ p ∈ Finset.Icc 1 ((n + 1) / 2),
            if p.Prime ∧ (Nat.sqrt (n - p)).Prime then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/237720.lean#L34
