title: Coxeter Groups and Unimodality — Conjecture 2
field: mathematics
tier: prose
statement: |-
  Let $(W_1,S_1)$, $(W_2,S_2)$ be two Coxeter systems, and $u,v \in W_1$, $w,z \in W_2$ be such that $[u,v] \simeq [w,z]$ (isomorphic as posets). Then
  \begin{equation}

  P_{u,v}(q)=P_{w,z}(q).
  \end{equation}
