title: Curvature Rigidity of Complex Projective 3-Space Bundles
field: mathematics
tier: prose
statement: Let $M$ be a smooth fiber bundle over $S^1$ with fiber $\mathbb{CP}^3$. If $M$ admits a metric of nonnegative sectional curvature, must $M$ be diffeomorphic to $S^1\times\mathbb{CP}^3$ or $S^1\times_{\tau}\mathbb{CP}^3$? Does the same conclusion follow if its fibers admit a smoothly varying family of positively curved metrics?
