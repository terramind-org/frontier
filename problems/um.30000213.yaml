title: Coefficient Positivity in Stretched Tensor Multiplicities
field: mathematics
tier: prose
statement: For highest weights $\lambda,\mu,\nu$ of a classical Lie algebra, write the stretched Clebsch–Gordan multiplicity $C_{n\lambda,n\mu}^{n\nu}$ as its constituent polynomials $f_i(n)$. Must every coefficient of every $f_i$ be nonnegative?
