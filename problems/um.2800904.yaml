title: 10 Lectures and 42 Open Problems — Stability conditions for tightness of k-median LP and k-means SDP
field: mathematics
tier: prose
statement: Give conditions, based on **stability-type properties** of the data (in the sense that the data is "well-explained" by some $k$ clusters), under which the **$k$-median LP** and the **$k$-means SDP** relaxations are **tight (integral)**. I.e., relate integrality of these relaxations to clustering-stability assumptions (e.g., $(c,\varepsilon)$-stable instances of Bilu–Linial type), rather than to a specific generative model.
