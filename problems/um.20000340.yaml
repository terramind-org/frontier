id: um.20000340
title: A wall-free KSBA sector of quartic K3 degenerations
field: mathematics
tier: prose
statement: |-
  **Problem 4.6.** Can one work out a geometric compactification of polarized
  K3 surfaces or Calabi–Yau manifolds in general using the framework of
  Alexeev/Kollár/Shepherd-Barron? For example, let \((X,H)\) be a pair where
  \(X\) is a K3 surface and \(H\) is a very ample divisor with \(H^2=4\).
  Can the stable pairs occurring as degenerations of these objects be
  classified? Compare the resulting singularities with the work of Shah on
  GIT-semistable quartic surfaces. Also compare with Martin Olsson’s work on
  moduli of log K3 surfaces.
