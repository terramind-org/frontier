title: Deterministic Transport Under Mutual Multiphase Domination
field: mathematics
tier: prose
statement: Let $(X,\sigma)$ and $(Y,\eta)$ be atomless vector-valued measure spaces that mutually dominate each other in the multiphase-transport order. Must there be measurable maps $T:X\to Y$ and $S:Y\to X$ such that $T_\#\sigma_i=\eta_i$ and $S_\#\eta_i=\sigma_i$ for every component $i$?
