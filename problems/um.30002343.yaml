title: Optimal Pluricanonical Bounds for Stable Log Surfaces
field: mathematics
tier: prose
statement: For a stable log surface $(X,\Delta)$ with Gorenstein locus $U$, what is the optimal integer $r$ such that $rK_U$ induces a birational map or an embedding? Does there exist a stable log surface for which $5I(K_X+\Delta)$ is not very ample?
