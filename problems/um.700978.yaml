title: Kourovka Notebook Problem 13.60
field: mathematics
tier: prose
statement: |-
  If a locally graded group $G$ is a product of
  two subgroups of finite special rank, is $G$ of finite special
  rank itself? The answer is affirmative if both factors are
  periodic groups. (N. S. Chernikov, *Ukrain. Math. J.*, **42**, no. 7 (1990),
  855--861).
