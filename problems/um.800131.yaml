title: Foliations and Diffeomorphism Groups — Question 72
field: mathematics
tier: prose
statement: |-
  If a loop in $B\Gamma_H$ is freely homotopic to one that is
  transverse to the $\Gamma^\omega_1$ structure, it presents
  a non trivial element in $\pi_1(B\overline{\Gamma}^\omega_1)=\Gamma_H$
  which is of infinite order.

  Does there exist a homotopically non-trivial loop in
  $B\overline{\Gamma}^\omega_1$ which is not free-homotopic to
  a transverse one?
