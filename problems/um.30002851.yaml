title: Broué’s Abelian Defect Group Conjecture
field: mathematics
tier: prose
statement: If $B$ is a block of $\mathcal{O}G$ with abelian defect group $P$, then $B$ and its Brauer correspondent in $N_G(P)$ are derived equivalent.
