title: Vanishing Exceptional Curves in Class-VII Surface Degenerations
field: mathematics
tier: prose
statement: In the study of complex surfaces (such as minimal class $\mathrm{VII}$ surfaces with small $b_2$), consider a holomorphic deformation family $X \to D$ over the unit disk whose general fibers $X_t$ ($t \neq 0$) contain exceptional curves $E_{i,t}$, whereas the central fiber $X_0$ does not. What is the geometric limiting behavior of the exceptional curves $E_{i,t}$ as $t \to 0$ (for example, when their areas with respect to a family of Hermitian/Gauduchon metrics diverge to infinity), and why do they disappear in the central fiber?
