title: Scalar parameters for divisorial valuation rings
field: mathematics
tier: prose
statement: |-
  **Question 11 (Flenner).** Does there exist a formula \(\varphi(x,y)\) such that for any finitely generated field \(K\) and every rank one divisorial valuation \(v\) on \(K\), there exists a parameter \(a\) such that
  \[
  \mathcal O_v=\{b\in K\mid \varphi(b,a)\}?
  \]
