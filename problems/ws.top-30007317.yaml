title: Universal strong Kadison–Kastler stability for von Neumann algebras
field: mathematics
tier: prose
statement: |-
  \section*{Universal strong Kadison–Kastler stability for von Neumann algebras}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every $\varepsilon >0$, is there $\delta >0$ such that any two unital von Neumann algebras on the same complex Hilbert space, with the same identity and two-sided unit-ball Hausdorff distance below $\delta $, are conjugate by a unitary u satisfying $||u-1||<\varepsilon $? The bound must be independent of both algebras and of the Hilbert space.
  \subsection{Short English statement}
  For every $\varepsilon >0$, is there $\delta >0$ such that any two unital von Neumann algebras on the same complex Hilbert space, with the same identity and two-sided unit-ball Hausdorff distance below $\delta $, are conjugate by a unitary u satisfying $||u-1||<\varepsilon $? The bound must be independent of both algebras and of the Hilbert space.
