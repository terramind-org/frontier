title: Open Problems in Arithmetic Dynamics — Conjecture 17 (Dynamical Andr{\'e}--Oort Conjecture)
field: mathematics
tier: prose
statement: |-
  \textup{(Baker--DeMarco, ${}\approx2011$, [arxiv1211.0255,MR2884382])}
  Let $X\subseteq\mathcal{M}_d^{\mathrm{crit}}$ be an algebraic subvariety such that
  the PCF maps in $X$ are Zariski dense in $X$. Then $X$ is cut out by
  ``*critical orbit relations*.''
