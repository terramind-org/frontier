title: Irreducibility of Severi Varieties on Polarized K3 Surfaces
field: mathematics
tier: prose
statement: Let $\mathcal V_{p,n,\delta}$ be the universal Severi variety of triples $((X,L),C)$, where $(X,L)$ is a primitively polarized K3 surface of genus $p$ and $C\in|nL|$ is irreducible with exactly $\delta$ nodes. Is $\mathcal V_{p,n,\delta}$ irreducible?
