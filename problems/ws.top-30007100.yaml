statement: |-
  \section*{Five-colorability of the unit-distance plane}\label{30007100}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Does there exist a map $c:R^2->{1,2,3,4,5}$ such that $c(x)!=c(y)$ whenever $||x-y||=1$, with arbitrary color classes and ordinary ZFC?
  \subsection{Short English statement}
  Does there exist a map $c:R^2->{1,2,3,4,5}$ such that $c(x)!=c(y)$ whenever $||x-y||=1$, with arbitrary color classes and ordinary ZFC?
