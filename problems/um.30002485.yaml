title: Homology Comparison for Real Spherical Subalgebras
field: mathematics
tier: prose
statement: |-
  Let $\mathfrak h$ be a real spherical subalgebra, let $V$ be a Harish–Chandra module, and let $V^\infty$ be its smooth moderate-growth completion. Is the natural map
  $$\Phi_p:H_p(\mathfrak h,V)\longrightarrow H_p(\mathfrak h,V^\infty)$$
  an isomorphism for every $p$?
