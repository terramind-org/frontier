title: Forms and Multiloop Algebras in Nullity Two
field: mathematics
tier: prose
statement: Let $$R_n=\mathbb C[t_1^{\pm1},\ldots,t_n^{\pm1}]$$ and let $\mathfrak g$ be a finite-dimensional complex semisimple Lie algebra. Classify the $R_n$-forms of $\mathfrak g\otimes_\mathbb C R_n$ and characterize which are multiloop algebras. In nullity two, are the only non-multiloop examples of Margaux type?
