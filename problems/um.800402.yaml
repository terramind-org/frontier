title: Open Problems in Arithmetic Dynamics — Question 25
field: mathematics
tier: prose
statement: |-
  Let $f:\mathbb{P}^N\dashrightarrow\mathbb{P}^N$ be a dominant rational map. Do
  there exist a finite collection of constant coefficient linear
  recursions
  \[
  L_n^{(1)},L_n^{(2)},\ldots,L_n^{(r)}
  \]
  and an index function $\iota:\mathbb{N}\to\{1,2,\ldots,r\}$ so that for all $n\ge1$ we
  have
  \[

  \deg(f^n) = L_n^{(\iota_n)} ?
  \]
