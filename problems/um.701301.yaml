title: Kourovka Notebook Problem 16.110
field: mathematics
tier: prose
statement: |-
  (I. Kapovich, P. Schupp). Is there an
  algorithm which, when given two elements $u, v$ of a free group
  $F_n$, decides whether or not the cyclic length of $\phi(u)$
  equals the cyclic length of $\phi(v)$ for every automorphism
  $\phi$ of $F_n$?

  *Comment of 2009:* The answer was shown
  to be positive for $n=2$ in (D. Lee, *J. Group Theory*, **10** (2007), 561--569).
