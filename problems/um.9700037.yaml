statement: "For Aldous's self-similar random partition of the plane, determine its topological properties: in particular, do region boundaries have fractal dimension greater than one? Determine the area law and structural properties of the capital-city adjacency network, including planarity/crossings and whether analogues of the Lewis and Aboav–Weaire laws hold."
