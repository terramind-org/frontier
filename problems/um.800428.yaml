title: Open Problems in Arithmetic Dynamics — Conjecture 51
field: mathematics
tier: prose
statement: |-
  Let $f(x)\in\mathbb{Q}(x)$ be a rational function of degree at least $2$, and
  let $\alpha,\beta\in\mathbb{Q}$ be $f$-wandering points.
  Then the Zsigmondy set of ${\mathcal{A}}(f,\alpha,\beta)$ is finite.
