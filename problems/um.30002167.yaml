title: Short Hamiltonian Cycles and Matchings in Convex Bodies
field: mathematics
tier: prose
statement: If $B$ is the unit disk and $P$ is a finite point set in $B$, must $P$ admit a Hamiltonian cycle whose sum of squared edge lengths is at most $8$? If $|P|$ is even, must it admit a perfect matching with sum of squared edge lengths at most $4$? What analogues hold for other convex bodies $C$?
