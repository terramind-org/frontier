title: Polynomial Images of Subgroups and Function-Field Curve Points
field: mathematics
tier: prose
statement: For polynomials $f,g\in\mathbb F_p[X]$ and multiplicative subgroups $G,H\subseteq\mathbb F_p^*$, estimate $\#(f(G)\cap g(H))$. Separately, let $K=\mathbb F_q(T)$ and let $F\in K[X,Y]$ be absolutely irreducible of degree $d$. Bound the number of solutions to $F(x,y)=0$ with $x,y\in\mathbb F_q[T]$ of degree at most $n$ as $n\to\infty$.
