title: Lifting Mapping-Class Subgroups to Surface Homeomorphisms
field: mathematics
tier: prose
statement: Let $S$ be a closed oriented surface of genus $g\geq2$, and let $\operatorname{MCG}(S)$ be its mapping class group. Which subgroups $\Gamma\leq\operatorname{MCG}(S)$ admit a lift, namely a homomorphism $\Gamma\to\operatorname{Homeo}(S)$ or $\Gamma\to\operatorname{Diff}(S)$ whose composition with the natural map to $\operatorname{MCG}(S)$ is the inclusion?
