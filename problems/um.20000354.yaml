title: Degree sets on Skorobogatov's bielliptic surface
field: mathematics
tier: prose
statement: |-
  For a nice variety \(X/k\),

  $$
  \mathcal D(X/k)=\{d>0:X\text{ has a closed point of degree }d\},
  $$

  \(\delta(X/k)\) is the set of \(d>0\) for which degree-\(d\) closed points are Zariski dense, and

  $$
  \mathcal P(X/k)=\bigcup_{[k':k]<\infty}\delta(X/k'). $$

  The question concerns Skorobogatov's bielliptic surface \(S/\mathbb Q\), for which

  $$
  S(\mathbb A_{\mathbb Q})^{\operatorname{Br}}\ne\varnothing,
  \qquad S(\mathbb Q)=\varnothing. $$

  $$
  p(x)=x^2+1,\qquad q(x)=x^2+2,\qquad
  g(t)=3(t^4-54t^2-117t-243). $$

  The intended \(S\) is the smooth projective model of

  $$
  p(x)y^2=q(x)z^2=g(t). \tag{1}
  $$

  Equivalently, after setting \(\widetilde y=p(x)y\) and
  \(\widetilde z=q(x)z\), an affine chart is

  $$
  \widetilde y^2=g(t)p(x),\qquad
  \widetilde z^2=g(t)q(x). \tag{2}
  $$
