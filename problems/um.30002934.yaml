title: Index Bounds for Minimal-Hypersurface Volume
field: mathematics
tier: prose
statement: Let $M^n$ be a closed minimal hypersurface in a Riemannian manifold $N$ with strictly positive sectional curvature. If $\operatorname{index}(M)=I$, is $\mathcal H^n(M)\leq C(N,I)$? Consequently, must bounded-index sequences have uniformly bounded volume and volume-divergent sequences have index tending to infinity?
