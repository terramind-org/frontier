title: Computing Transversality Degrees of Graphs
field: mathematics
tier: prose
statement: For a graph $G$, let $\operatorname{TD}(G)$ be the minimum degree of a median graph whose transversality graph is isomorphic to $G$. Develop an algorithm to compute $\operatorname{TD}(G)$, and obtain structural or complexity bounds for this invariant.
