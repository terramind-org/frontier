  \item[\hypertarget{source:statement:2}{S2}] Ben Bielefeld (editor) and conference contributors, \emph{Conformal Dynamics Problem List}, arXiv:math/9201271v1 (1990), Curt McMullen, \S5, Geometrically finite rational maps, Problem 1, printed p. 11. \url{https://arxiv.org/abs/math/9201271v1}.
