title: The free-factor complex, recursive corank-one links, and a dynamical transfer test
field: mathematics
tier: prose
statement: |-
  Construct a \(\delta\)-hyperbolic graph on which \(\operatorname{Out}(F_n)\) acts so that:
  (1) every iwip \(\gamma\) has positive translation distance \((|\gamma|>0)\);
  (2) polynomially growing \(\gamma\) are elliptic \((|\gamma|=0)\);
  (3) the construction is elegant/beautiful/useful/truthful;
  (4) local structure allows for inductive arguments; and
  (5) the graph is highly connected, with highly connected links.
