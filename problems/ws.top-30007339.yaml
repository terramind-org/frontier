statement: |-
  \section*{Classification of every bounded stable Allen–Cahn solution in dimension seven}\label{30007339}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must every stable C2 solution $v:R^7\to [-1,1]$ of Delta $v=v^3-v$ be identically +1 or $-1$, or have the planar form $tanh((a\cdot x-b)/\operatorname{sqrt}(2))$ for a unit vector a and real b, without an energy-growth or asymptotic end-state assumption?
  \subsection{Short English statement}
  Must every stable C2 solution $v:R^7\to [-1,1]$ of Delta $v=v^3-v$ be identically +1 or $-1$, or have the planar form $tanh((a\cdot x-b)/\operatorname{sqrt}(2))$ for a unit vector a and real b, without an energy-growth or asymptotic end-state assumption?
