title: Alternating Signs in Equivariant Quantum K-Theory
field: mathematics
tier: prose
statement: Do the structure constants of the Schubert-basis product in $T$-equivariant quantum $K$-theory $QK_T(G/P)$ satisfy the conjectured alternating-sign property? Equivalently, does the corresponding Pontryagin product in the localized equivariant $K$-theory of the affine Grassmannian have this alternating-sign behavior?
