title: Moments of L-functions — Moments of the Riemann zeta function — Problem 41
field: mathematics
tier: prose
statement: |-
  Let $g$ be a primitive cusp form of weight $k$ for $\Gamma_{0}(N)$. Assume that $g$ is arithmetically normalized so that its first Fourier coefficient $a_g(1)=1$ and write $g(z)=\sum_{n=0}^{\infty}\lambda_{g}(n)n^{\frac{k-1}{2}}e(nz)$. Let $X, Y, P\geq 1$, and let $F(x,y)$ be a smooth weight function supported on $(X/4,4X]\times[Y/4,4Y]$ satisfying \[x^iy^j\frac{\partial^{i}}{\partial{x^i}}\frac{\partial^{j}}{\partial v^j}f(u,v)\ll P^{i+j}\] for all $i,j\geq0$.
  Consider the shifted convolution sum \[D_{g}(\ell_1,\ell_2;h)=\sum_{\ell_1m\pm \ell_2n=h}\lambda_g(n)\lambda_g(m)F(\ell_1m,\ell_2n),\] where $\ell_1$ and $\ell_2$ are coprime. Harcos [Harcos] proved an asymptotic upper bound for $D_{g}(\ell_1,\ell_2,h)$ where the implicit constants depend on $g$. Blomer and Harcos [BH] established an asymptotic bound for an averaged version of this shifted convolution sum in which the implicit constants also depend on $g$.
