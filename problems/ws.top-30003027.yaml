  \section{Packing and Covering for Infinite Matroids}\label{30003027}
  {\small UnsolvedMath ID 30003027 · Combinatorics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $M$ and $N$ be matroids on a common ground set $E$. Does there exist a partition $E=P\mathbin{\dot\cup}C$ such that the restrictions $M|P$ and $N|P$ have disjoint spanning sets, while the contractions $M.C$ and $N.C$ have independent sets whose union is $C$?
  \par\smallskip\textit{Formulation references:} \sref{30003027}{1}, \sref{30003027}{2}.
  \subsection{Short English statement}
  Let $M$ and $N$ be matroids on a common ground set $E$. Does there exist a partition $E=P\mathbin{\dot\cup}C$ such that the restrictions $M|P$ and $N|P$ have disjoint spanning sets, while the contractions $M.C$ and $N.C$ have independent sets whose union is $C$?
