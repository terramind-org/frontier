title: Cohen–Lenstra Moments for Narrow Class Groups
field: mathematics
tier: prose
statement: Let $D$ range over fundamental discriminants, let $C_D$ be the narrow class group of $\mathbb{Q}(\sqrt D)$, and put $\operatorname{rk}_\ell(A)=\dim_{\mathbb{F}_\ell}(A/A^\ell)$. If $M^-$ and $M^+$ denote means over negative and positive fundamental discriminants, respectively, is it true for every prime $\ell$ and integer $k>0$ that $M^-(\prod_{0\leq i<k}(\ell^{\operatorname{rk}_\ell(C_D^2)}-\ell^i))=1$ and $M^+(\prod_{0\leq i<k}(\ell^{\operatorname{rk}_\ell(C_D^2)}-\ell^i))=\ell^{-k}$?
