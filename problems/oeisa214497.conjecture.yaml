id: oeisa214497.conjecture
title: Twin primes of the form $(3^n - k) 2^n \pm 1$
field: mathematics
tier: proof
statement: |-
  Conjecture: There is always one such $k$ for each $n > 0$ such that
  $(3^n - k) 2^n - 1$ and $(3^n - k) 2^n + 1$ are a twin prime pair.
