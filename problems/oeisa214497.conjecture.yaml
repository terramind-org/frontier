lean:
  module: FormalConjectures.OEIS.«214497»
  decl: OeisA214497.conjecture
  statement: "theorem conjecture (n : ℕ) (hn : 0 < n) : (a n).isSome"
  context:
    - open OeisA214497
  definitions:
    - name: OeisA214497.a
      kind: def
      text: |-
        /-- Smallest $k \ge 0$ such that $(3^n - k) 2^n - 1$ and $(3^n - k) 2^n + 1$
        are both prime, or `none` if no such $k$ exists. -/
        def a (n : ℕ) : Option ℕ :=
          (List.range (3 ^ n)).find? fun k =>
            Nat.Prime ((3 ^ n - k) * 2 ^ n - 1) && Nat.Prime ((3 ^ n - k) * 2 ^ n + 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/OEIS/214497.lean#L34
