statement: |-
  \section*{Rational injectivity of reduced coarse assembly}\label{30007507}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every uniformly discrete bounded-geometry metric space X, is reduced coarse assembly $KX_{1}(X)\otimes Q\to K_{1}(C*(X))\otimes Q$ injective, including coarse disjoint unions of finite connected bounded-degree graphs?
  \subsection{Short English statement}
  For every uniformly discrete bounded-geometry metric space X, is reduced coarse assembly $KX_{1}(X)\otimes Q\to K_{1}(C*(X))\otimes Q$ injective, including coarse disjoint unions of finite connected bounded-degree graphs?
