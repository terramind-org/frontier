statement: |-
  \section*{Quasipolynomial stochastic mean-payoff decision}\label{30007485}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For explicitly encoded finite turn-based zero-sum stochastic mean-payoff games with binary rational rewards and transition probabilities, can the states of value at least zero be computed deterministically in quasipolynomial bit time in the total encoding length? The statement concerns threshold decision, without asserting polynomial time or exact value output.
  \subsection{Short English statement}
  For explicitly encoded finite turn-based zero-sum stochastic mean-payoff games with binary rational rewards and transition probabilities, can the states of value at least zero be computed deterministically in quasipolynomial bit time in the total encoding length? The statement concerns threshold decision, without asserting polynomial time or exact value output.
