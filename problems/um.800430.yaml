title: Open Problems in Arithmetic Dynamics — Question 53
field: mathematics
tier: prose
statement: |-
  Let $f:\mathbb{P}^N\to\mathbb{P}^N$ be a morphism of degree $d$ defined over $\mathbb{Q}$.
  \begin{parts}

  (a)
  For which $n\ge1$ is it true that $f$ has a point of exact
  period $n$ in $\mathbb{P}^N(\mathbb{Q})$ if and only if $f$ has a point of exact
  period $n$ in $\mathbb{P}^N(\mathbb{R})$ and in $\mathbb{P}^N(\mathbb{Q}_p)$ for all primes $p\/$\mathrm{?}

  (b)
  For which $n\ge1$ is it true that there are infinitely many
  primes $p$ such that the map $f$ has no points of exact period $n$
  in $\mathbb{P}^N(\mathbb{Q}_p)$\mathrm{?} Is this true for all
  $n\ge n_0(N,d)$\mathrm{?}
  \end{parts}
  More generally, we may ask the same questions for preperiodic points
  of type $(m,n)$, i.e., points with tails of exact length $m$ and
  periods of exact length $n$.
