title: A sharp product-prism family for Kuperberg's fixed-combinatorial-type question
field: mathematics
tier: prose
statement: |-
  **18. (G. Kuperberg)** In \(\mathbb R^3\), consider a class \(\mathcal A\) of
  centrally symmetric polytopes of a given combinatorial type, excluding the type of
  the cube and the octahedron. Then the conjecture is that the volume product does not
  have a local minimum in \(\mathcal A\). Furthermore, one may ask if each such
  \(\mathcal A\) has a unique critical point up to affine transformations, and it is a
  local maximum.
