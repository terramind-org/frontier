title: Open Problems in Wavelet Theory — Problem 7
field: mathematics
tier: prose
statement: |-
  A more recent problem was proposed by Christensen and his collaborators [CKK1, CKK2].

  Suppose $\psi$ is Bessel wavelet with bound $<1$. Does there exist $\psi'$ such that the combined wavelet system
  \[
  \{\psi_{j,k}: j,k \in {\mathbb{Z}}\} \cup \{\psi'_{j,k}: j,k \in {\mathbb{Z}}\}.
  \]
  generated by $\psi$ and $\psi'$ is a Parseval frame?
