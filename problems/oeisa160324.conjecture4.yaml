lean:
  module: FormalConjectures.OEIS.«160324»
  decl: OeisA160324.conjecture4
  statement: |-
    theorem conjecture4 (m : ℕ) (hm : 2 < m) (n : ℕ) :
        ∃ x1 x2 x3 r : ℕ, r ≤ m - 3 ∧
          n = polygonalNumber (m + 1) x1 + polygonalNumber (m + 2) x2 + polygonalNumber (m + 3) x3 + r
  context:
    - open OeisA160324
  definitions:
    - name: OeisA160324.polygonalNumber
      kind: def
      text: |-
        /-- $p_k(x) = \frac{(k-2)x(x-1)}{2} + x$ is the $x$-th $k$-gonal number. -/
        def polygonalNumber (k x : ℕ) : ℕ :=
          (k - 2) * (x * (x - 1) / 2) + x
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/160324.lean#L32
