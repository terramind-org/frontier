id: oeisa160324.conjecture4
title: Number of ways to express $n$ as sum of square, pentagonal, and hexagonal numbers (conjecture4)
field: mathematics
tier: proof
statement: |-
  Conjecture (Zhi-Wei Sun, Aug 21 2009):
  For any integer $m > 2$, each natural number $n$ can be expressed as
  $p_{m+1}(x_1) + p_{m+2}(x_2) + p_{m+3}(x_3) + r$ with $x_1, x_2, x_3 \in \mathbb{N}$ and
  $r \in \{0, \dots, m-3\}$.
