title: Nilpotent critical support and Hilbert-scheme Jordan strata
field: mathematics
tier: prose
statement: |-
  What is the interaction between cell theory and the Hilbert scheme?
  Matrix factorizations?

  In the affine Steinberg setting this corresponds to the stratification by
  nilpotent orbits. Does this have an analog for
  \(\mathscr X^{\mathrm{big}}\)?

  Is there a nilpotent-orbit support filtration of the
  Oblomkov--Rozansky matrix-factorization convolution category, does it
  descend to a partition stratification on the Hilbert-scheme model,
  and does that filtration agree with the Kazhdan--Lusztig cell
  filtration?
