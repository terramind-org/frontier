  \section{Parabolic intersections under nonpositive curvature assumptions}\label{20001564}
  {\small UnsolvedMath ID 20001564 · Group Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Are intersections of parabolic again parabolic when the Deligne complex has some notion of non-positive curvature? (i.e., systolic, injective, CUB, $\mathrm{CAT}(0)$)
  \par\smallskip\textit{Formulation references:} \sref{20001564}{1}, \sref{20001564}{2}.
