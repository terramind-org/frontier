  \item[\hypertarget{source:5300066:2}{S2}] Ben Bielefeld, Mikhail Lyubich and contributors, \emph{Problems in Holomorphic Dynamics}, arXiv:math/9205209v1 (1992), Robert Devaney, ``Open Questions in Non-Rational Complex Dynamics'', \S5, eighth Problem, printed p. 36. \url{https://arxiv.org/abs/math/9205209v1}.
