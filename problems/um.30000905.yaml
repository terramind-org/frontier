id: um.30000905
title: Jónsson Cardinals, Trace Filters, and Indecomposable Ultrafilters
field: mathematics
tier: prose
statement: Let $\kappa$ be a regular Jónsson cardinal. First, do there exist a function $c:[\kappa]^{<\kappa}\to\kappa$ and a uniform filter $\mathcal F$ on $\kappa$ such that, for every $A\in[\kappa]^\kappa$, the range of $c$ on $[A]^{<\omega}$ belongs to $\mathcal F$? Second, can a $C$-system on $\kappa$ have a nontrivial trace filter? Third, if $\lambda=\mu^+$ for a singular strong-limit cardinal $\mu$, is an indecomposable ultrafilter on $\lambda$ compatible with $2^\mu>\mu^+$?
