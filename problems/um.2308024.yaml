title: Research Problems in Function Theory — Problem 8.24
field: mathematics
tier: prose
statement: Let the sequence $\{M_k\}^\infty_0$ of positive numbers be such that \[M_0=1\hspace{1cm}\text{ and }\hspace{1cm}\frac{M_{k+j}}{M_kM_j}\geq\begin{pmatrix}k+j j\end{pmatrix}.\] Assume also the non-quasianalyticity condition that $\sum_k\big(M_k/M_{k+1}\big)<\infty$. Consider those functions $f$ on a compact set $X \subset\mathbb{C}$ that are limits of rational functions with poles of $X$ in the norm \[g\mapsto\sum^\infty_{k=0}\frac{1}{M_k}\sup_{X}|g^{(k)}|;\] these functions form a Banach algebra. Is $X$ its maximal ideal space? (The answer is `yes' if $X$ is the unit disc or the unit interval.) (A. G. O'Farrell)
