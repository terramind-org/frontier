title: Asymptotics of Higher-Dimensional General-Position Sets
field: mathematics
tier: prose
statement: For fixed $d$ and $k$, determine the asymptotic order of $\alpha_{d,k}(n)$, the maximum size of a subset of $[n]^d$ containing no $k+2$ points in a $k$-dimensional affine subspace. In particular, determine $\alpha_{4,2}(n)$.
