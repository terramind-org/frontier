title: Return Probabilities and Stability of the Liouville Property
field: mathematics
tier: prose
statement: If a symmetric random walk with step distribution $\mu$ on a group $G$ satisfies $\mu^{(2n)}(e)\geq\exp(-cn^{1/2})$, must $(G,\mu)$ have the Liouville property? For a finitely generated group, is the Liouville property stable under changing the finite generating set?
