title: "Squared-norm powers: exact Gram test and two complete special classifications"
field: mathematics
tier: prose
statement: |-
  Let \(R(z,\overline z)\) be a bihomogeneous polynomial. Find necessary and sufficient conditions such that there exists an integer \(N\) with
  \[
  (R(z,\overline z))^N=\sum_{j=1}^m |p_j(z)|^2.
  \]
  Here the \(p_j(z)\)'s are linearly independent holomorphic polynomials. See MR1682713 and MR2770459.
