statement: "Conjecture Let $p$ be a prime natural number. Find all primes $q\\equiv1\\left(\\mathrm{mod}\\: p\\right)$, such that $2^{\\frac{\\left(q-1\\right)}{p}}\\equiv1\\left(\\mathrm{mod}\\: q\\right)$."
