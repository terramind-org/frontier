title: Kourovka Notebook Problem 17.5
field: mathematics
tier: prose
statement: |-
  Is the nilpotency class of a nilpotent group
  generated by $d$ left $3$-Engel elements bounded in terms of $d$?
  A group generated by two left $3$-Engel elements is nilpotent of
  class at most $4$ (*J. Pure Appl. Algebra*, **188** (2004),
  1--6.)
