title: Finiteness Properties of Hyperbolic Tessellation Groups
field: mathematics
tier: prose
statement: Let $\Delta$ be a tessellation of the hyperbolic plane, let $S_\infty$ be the finitary symmetric group, and suppose that $\phi(\Delta)/S_\infty$ is isomorphic to Thompson's group $V$. Do $\phi(\Delta)$ and $\phi(\Delta)/S_\infty$ have the same finiteness properties?
