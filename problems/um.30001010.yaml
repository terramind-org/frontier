title: Vector-Bundle Invariants of Cuntz–Pimsner Fields
field: mathematics
tier: prose
statement: Let $E$ be a complex rank-$n$ vector bundle over a compact Hausdorff space $X$, and let $O_E$ be its associated locally trivial Cuntz–Pimsner continuous field with fiber $O_n$. Which invariants of $E$ are captured by the isomorphism class of $O_E$?
