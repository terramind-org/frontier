title: Lower Density of Wave-Packet Frames
field: mathematics
tier: prose
statement: If a wave-packet system generated by $\psi\in L^2(\mathbb{R})$ and a discrete parameter set $M$ has an upper frame bound, then the lower dimension of $M$ should equal $0$.
