id: um.20000020
title: Exact strict-subdimension cotangent families and a mirror obstruction
field: mathematics
tier: prose
statement: |-
  What can be said about the Rouquier dimension of non-toric varieties and/for their symplectic mirrors?

  - Toric varieties of dim \(n\) \(\longleftrightarrow\) (mirror) \((T^*T^n,\text{some stop})\).
  - What is known symplectically for \((T^*M,\text{stops})\) can be found in Bai–Côté, Hanlon–Hicks–Lazarev, Favero–Huang.

  E.g. is there a symplectic \((X^{2n},f)\) such that

  \[
  \operatorname{Rdim}\operatorname{Fuk}(X,f)\lneq n?
  \]

  (For instance by finding \((X,f)\) mirror to a singular \(Y\) with
  \(\operatorname{Rdim}D^b(Y)>\dim Y\).)
