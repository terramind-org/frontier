title: Virtual-knot problem 7 — Long Knots and Long Flat Knots
field: mathematics
tier: prose
statement: |-
  Long Knots and Long Flat Knots: Enlarge the long knot
  invariant structure proposed in . Can one get new
  classical knot invariants from the approach in this paper? Bring
  together the ideas from with the biquandle
  construction from to obtain more powerful invariants of
  long knots. Long flat virtual knots can be studied via a powerful
  remark due to Turaev (in conversation) to the effect that one can
  associate to a given long flat virtual knot diagram $F$ a descending diagram $D(F)$ (by always going over before going under
  in resolving the flat (non-virtual) crossings in the diagram). The
  long virtual knot type of $D(F)$ is an invariant of the long flat
  knot $F.$ This means that one can apply any other invariant $I$ of
  virtual knots that one likes to $D(F)$ and $I[D(F)]$ will be an
  invariant of the long flat $F.$ It is quite interesting to do sample
  calculations of such invariants and this situation underlines the
  deeper problem of finding a full classification of long flat knots.

  Bartholomew, Fenn, S. Kamada and N. Kamada have applied quaternion
  invariants to long virtual knots, see .

  See also Sec. the cited item for more questions about long
  virtual knots and long flat virtual knots.
