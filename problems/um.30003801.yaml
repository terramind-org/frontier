title: Motivic Equivalence and Similarity of Quadratic Forms
field: mathematics
tier: prose
statement: Let $q$ and $q'$ be quadratic forms of the same dimension whose projective quadrics have isomorphic Chow motives. Is equality of all Witt indices over every field extension equivalent to similarity of $q$ and $q'$? Can the motivic criterion be obtained using Grassmannians of isotropic subspaces instead of projective quadrics, and can it be extended to all semisimple groups through motives of projective homogeneous varieties?
