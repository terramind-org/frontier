title: Ramsey Numbers in Terms of Degeneracy
field: mathematics
tier: prose
statement: |-
  For every graph $H$ on $n$ vertices, is
  $$\log r(H)=\Theta(d(H)+\log n),$$
  where $d(H)$ is the degeneracy of $H$?
