  module: FormalConjectures.Wikipedia.SidorenkoConjecture
  decl: SidorenkoConjecture.tournament_anti_sidorenko_trees_conjecture
  statement: |-
    theorem tournament_anti_sidorenko_trees_conjecture :
        ∀ {V : Type*} [Fintype V] [DecidableEq V] (T : SimpleGraph V) [DecidableRel T.Adj],
          T.IsTree →
          ∃ (D : Digraph V),
            D.IsOrientation T ∧
            ∀ {W : Type*} [Fintype W] [DecidableEq W] [Nonempty W]
              (G : Digraph W) [DecidableRel G.Adj],
              G.IsTournament →
              Digraph.homDensity D G ≤ (1 / 2 : ℝ) ^ T.edgeFinset.card
  context:
    - open SidorenkoConjecture
    - open Finset SimpleGraph
    - open LimitObjects
    - open scoped Classical
    - "variable {V W : Type*}"
  definitions: []
