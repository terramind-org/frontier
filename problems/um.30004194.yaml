title: Persistence of Euler Vortex Filaments Under Binormal Flow
field: mathematics
tier: prose
statement: For the three-dimensional Euler equations with initial vorticity concentrated along a smooth spatial curve, does the vorticity remain concentrated around a curve for finite times, and can it remain close for a significant time to a filament evolving by binormal flow?
