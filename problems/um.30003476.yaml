title: Incidence Lower Bounds for Dense Points and Lines
field: mathematics
tier: prose
statement: Let $P\subset\mathbb R^2$ consist of $n$ points with minimum pairwise distance $1$ and diameter $O(\sqrt n)$, and let $L$ be a family of $n$ pairwise essentially different lines, where essential difference is measured by angular separation $1/n$ or disjoint $1/\sqrt n$-neighborhoods inside $\operatorname{conv}(P)$. Must $$\bigl|\{(p,\ell)\in P\times L:\operatorname{dist}(p,\ell)\leq1/\sqrt n\}\bigr|=\Omega(n^{4/3})$$?
