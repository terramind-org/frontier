title: Research Problems in Function Theory — Problem 7.23
field: mathematics
tier: prose
statement: 'The expression $u(z, \zeta)$ of Problem 6.57 is closely related to the Schwarzian derivative $\{f(z), z\}$, e.g. it is invariant under compositions with M\"obius transformations and \[\lim_{\zeta\to z}u(z,\zeta)=\frac{1}{6}\{f(z),z\}\] K\"uhnau (no citation) showed that if $f(z)$ is analytic in $\mathbb{D}$ and has a quasiconformal extension to the whole plane with \[|f_{\overline{z}}/f_z|\leq q<1\hspace{1cm}\text{ a.e.}\] then $$ |u(z,\zeta)|\leq q(1-|z|^2)^{-1}(1-|\zeta|^2)^{-1}. $$ Show that ([source label: C7.1]) is also sufficient for $f$ to have a quasi-conformal extension to the whole plane (possibly with $\frac{1}{3}\leq q < 1$). (J. G. Krzyz)'
