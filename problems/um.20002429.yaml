title: The solved J-equation criterion and a sharp chamber on the one-point blow-up
field: mathematics
tier: prose
statement: |-
  The displayed mathematics agrees with Lejmi--Székelyhidi's original formulation.

  The recovered statement is the following. Let \(M\) be a compact Kähler manifold of complex dimension \(n\), let \(\omega,\chi\) be Kähler forms, and set

  \[
    \omega_\varphi=\omega+\sqrt{-1}\,\partial\bar\partial\varphi>0,
    \qquad
    c=n\frac{[\omega]^{n-1}\cdot[\chi]}{[\omega]^n}. \]

  Determine whether

  \[
    \operatorname{tr}_{\omega_\varphi}\chi=c
  \]

  has a smooth solution exactly when, for every irreducible proper analytic subvariety \(V\subset M\) of complex dimension \(p\), where \(1\le p\le n-1\),

  \[
    \int_V\left(c\,\omega^p-p\,\omega^{p-1}\wedge\chi\right)>0. \tag{LS}
  \]

  For singular \(V\), the integral means pairing the closed form with the integration current \([V]\), equivalently integration after resolution. It depends only on the Kähler classes. Reducible subvarieties add no conditions beyond their irreducible components. The source phrase “all proper subvarieties” is conventionally restricted to positive dimensions \(1,\ldots,n-1\); zero-dimensional sets do not supply a J-positivity obstruction.
