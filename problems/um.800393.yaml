title: Open Problems in Arithmetic Dynamics — Question 16
field: mathematics
tier: prose
statement: |-
  The fact that the bound for $\operatorname{FOM/FOD}(1,d)$ does not depend on $d$ suggests
  the following question.

  For a given $N\ge1$, is
  \[
  \sup_{d\ge2} \operatorname{FOM/FOD}(N,d) < \infty?
  \]
  If so, what is its value as a function of $N$?
