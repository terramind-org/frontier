title: Hirzebruch's 1954 Problem List — Problem 5
field: mathematics
tier: prose
statement: |-
  Let $M^n$ be an almost-complex manifold. Choose an Hermitian structure and consider the numbers $h^{p,q}$ defined as above.
  Is $h^{p,q}$ independent of the choice of the Hermitian structure? If not, give some other definition of the $h^{p,q}$ of $M^n$ which
  depends only on the almost-complex structure and which generalizes the $h^{p,q}$ of a complex manifold.
