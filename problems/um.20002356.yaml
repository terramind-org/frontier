title: An affine-normalization criterion for infinitude of rational points
field: mathematics
tier: prose
statement: Is there an algorithm to decide whether \(f(x,y)=0\) has infinitely many \(\mathbb Q\)-rational solutions? This seems to be very hard for genus 1 curves. It has been done in other cases. Possible if \(\Sha\) is finite for all elliptic curves over \(\mathbb Q\).
