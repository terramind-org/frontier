id: um.30006530
title: Cycle Limits for Words in Random Permutations
field: mathematics
tier: prose
statement: Let $\sigma$ and $\tau$ be independent uniform random permutations and set $\pi=\sigma\tau\sigma^2\tau^2$. Does the normalized length $L_1/n$ of the cycle containing $1$ converge to the uniform distribution on $[0,1]$, and do the normalized ordered cycle lengths converge to the Poisson–Dirichlet distribution with parameter $1$? More generally, do these limits hold for every primitive word in $\sigma$ and $\tau$, and does the resulting permutation converge to uniformity in total variation?
