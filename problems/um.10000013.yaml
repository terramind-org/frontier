id: um.10000013
title: Scaling limit of random recursive square subdivision
field: mathematics
tier: prose
statement: Start with a unit square and repeatedly choose a current square uniformly and subdivide it into four squares. Let $D_n$ be the minimum number of current squares in a connected set joining the bottom-left corner to the top-right corner after $n$ subdivisions. Does there exist a deterministic scaling function $a_n$ such that $D_n/a_n$ converges to a nondegenerate random variable? Does a shortest crossing stabilize under further subdivisions?
