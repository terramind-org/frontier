  definitions:
    - name: OeisA17666.a
      kind: def
      text: |-
        /-- Denominator of sum of reciprocals of divisors of $n$. -/
        def a (n : ℕ) : ℕ :=
          if n = 0 then 1
          else n / Nat.gcd n (∑ d ∈ n.divisors, d)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/17666.lean#L36
