title: Categorical Noncommutative Neighborhoods of Toric Subvarieties
field: mathematics
tier: prose
statement: For a broad class of subvarieties $Y\subset X_\Sigma$, construct a deformation of categories whose generic fiber is $\operatorname{Coh}_{\mathrm{dg}}(X_\Sigma)$, an object in the special fiber deforming to $\mathcal{O}_Y$, a possibly singular nonpositively curved space $L_V$, and a noncommutative neighborhood described by a functor to $\operatorname{Perf}(\mathbb{C}[\pi_1(L_V)])$, suitably modified for singularities.
