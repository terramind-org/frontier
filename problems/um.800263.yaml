title: Several Complex Variables Problem List — Problem 62
field: mathematics
tier: prose
statement: |-
  Suppose that the polynomial equation
  $$F(w_0, w_1, ......, w_n)=1$$
  defines a smooth
  affine algebraic hypersurface (these are always parallellizable
  (Murthy, Swan, n=2; Suslin for general n). Can they be holomorphically
  immersed in
  $\mathbb{C}^n$?\\
  -R. Narasimhan, Dept. of Math., Univ. of Chicago, Chicago, IL 60637
