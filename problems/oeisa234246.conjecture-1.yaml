  definitions:
    - name: OeisA234246.a
      kind: def
      text: |-
        /--
        Number of integers $0 < k < n$ such that $k \phi(n - k) + 1$ is a square,
        where $\phi$ is Euler's totient function.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ k ∈ Finset.Ico 1 n,
            let m := k * (n - k).totient + 1
            if ∃ r ≤ m, r * r = m then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/234246.lean#L37
