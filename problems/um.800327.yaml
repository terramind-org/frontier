statement: |-
  One especially notable case of a combinatorial interpretation
  is the problem of computing the
  *Kronecker coefficients* of the symmetric group, which are defined by
  $$\chi^\lambda \cdot \chi^\mu = \sum_{\nu\vdash n}
  g(\lambda,\mu,\nu) \. \chi^\nu, \quad \text{where} \ \ \lambda,\mu \vdash n
  $$
  and $\chi^\lambda,
  of $S_n$.

  Find a combinatorial interpretation for the
  Kronecker coefficients
  $$\bigl\{ .$$
