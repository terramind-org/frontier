title: Research Problems in Function Theory — Problem 5.49
field: mathematics
tier: prose
statement: What kind of gaps can the Taylor expansion of a non-constant automorphic function have? For example, can it have Hadamard gaps? (Presumably the sharp answer would depend on the group concerned.) This is closely related to a theorem of R\'enyi (no citation) that a non-constant periodic entire function cannot have more than half of its coefficients zero. (L. A. Rubel)
