title: Unimodular Coverings of Adjoint Toric Polytopes
field: mathematics
tier: prose
statement: Let $X$ be a smooth projective toric variety of dimension $d$, let $A$ be ample and $B$ nef, and set $D=(d+2)A+B+K_X$. Assuming that the lattice polytope associated with $D$ is normal, must it also have a unimodular covering?
