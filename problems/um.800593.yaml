statement: |-
  Assume that $X$ satisfies $\mathsf{S}_1(\Omega,\Gamma)$ and $|D|<\mathfrak{p}$.
  Does $X\cup D$ satisfy $\mathsf{S}_1(\Omega,\Gamma)$? Is it true under Martin's Axiom{} when $|D|=\aleph_1$?
