schema: 1
id: witness.sorting-network-size-18
title: Sorting network on 18 inputs with fewer than 77 comparators
field: computer-science
tier: witness
statement: A sorting network on n wires is a fixed sequence of compare-exchange gates (i, j) with i < j, each putting the smaller value on wire i and the larger on wire j. It sorts every input exactly when it sorts all 2^n inputs of zeros and ones (the 0-1 principle). The smallest known network for 18 inputs has 77 gates, found by computer search, and the list of record networks gives 68 as the lower bound. Find an 18-input sorting network with 76 gates or fewer.
ams:
  - 68
  - 6
tags:
