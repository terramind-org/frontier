    note: "Page updated 2026-10-10 (read 2026-10-19): row \"18 (77, 12) (78, 11) 68...77 10...11 Size ubound: SorterHunter\". The history log has \"2020-07-04 Improved size for 18 inputs\" and \"2022-05-17 Minor improvements for 18 inputs\". The lower bound 68 is the page's; its derivation was not opened."
  format: 'A JSON object {"comparators": [[i, j], ...]}: the gates in order, each a pair of integers with 0 <= i < j < 18. Gates are applied left to right; the smaller value goes to wire i. Valid when the network sorts all 262144 inputs of zeros and ones into ascending order on wires 0..17. The value is the number of gates (at most 5000).'
