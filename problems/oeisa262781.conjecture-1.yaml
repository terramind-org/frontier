  module: FormalConjectures.OEIS.«262781»
  decl: OeisA262781.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : 6 < n) : 0 < a n"
  context:
    - open OeisA262781
  definitions:
    - name: OeisA262781.a
      kind: def
      text: |-
        /--
        Number of ordered ways to write $n$ as $x^2 + \phi(y^2) + \phi(z^2)$ ($x \ge 0$ and $0 < y \le z$)
        with $y$ or $z$ prime.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.range (n + 1),
            ∑ y ∈ Finset.Ico 1 (n + 1),
              ∑ z ∈ Finset.Ico y (n + 1),
                if (y.Prime ∨ z.Prime) ∧ x ^ 2 + Nat.totient (y ^ 2) + Nat.totient (z ^ 2) = n then
                  1
                else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/262781.lean#L34
