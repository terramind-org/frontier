title: Problem 17 — (Converse to dichotomy).
field: mathematics
tier: prose
statement: (Converse to dichotomy). Characterize translation surfaces for which (1) the set of minimal directions coincides with the set of uniquely ergodic directions; (2) the set of completely periodic directions coincides with the set of non-uniquely ergodic directions. 256 P. Hubert, H. Masur, T. Schmidt and A. Zorich Note that Property (2) implies Property (1). In genus g = 2 it is known that for every translation surface which is not a Veech surface there is a direction θ which is minimal and not uniquely ergodic [ ChMa]. On the other hand using work of Hubert–Schmidt [ HuSt2], B. Weiss has given an example of a surface which is not a Veech surface and yet for which Property (2) holds. (This surface is obtained as a ramified covering over a Veech surface with a single ramification point.) As mentioned above, a closed orbit avoiding the conical singularities of the flat surface deter- mines a cylinder of parallel lines, all of the same length. It is of interest to find the asymptotics for the number of cylinders (in all possible directions) of lengths less than a given number. In the case of the standard flat torus the number of cylinders of length at most L is asymptotic to 1 ζ(2)πL2. Each Veech surface also has quadratic asymptotics [ V e3] and the same is true for generic surfaces in each stratum [ EsMa].
