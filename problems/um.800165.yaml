title: Moments of L-functions — Moments of the Riemann zeta function — Problem 15
field: mathematics
tier: prose
statement: |-
  Prove third and fourth moment asymptotics with best possible error terms for $L(1/2,f)$ as $f$ runs over holomorphic Hecke eigenforms of weight $k_f \leq T$. It should be possible to show, using current technology, that
  \[\sum_{k_f \leq T} \frac{L\left(\frac{1}{2},f\right)^3}{L(1,\operatorname{ad}f)} = T^2 P_3(\log T) + O_{\varepsilon}(T^{1+\varepsilon})\]
  and
  \[\sum_{k_f \leq T} \frac{L\left(\frac{1}{2},f\right)^4}{L(1,\operatorname{ad}f)} = T^2 P_6(\log T) + O_{\varepsilon}(T^{4/3+\varepsilon}),\]
  where $P_j(x)$ denotes some polynomial of degree $j$ in $x$. For Hecke--Maass cusp forms, this is known for the fourth moment via work of Ivic, while Zhi Qi proved earlier this year the analogous result for the third moment.\\
  (Peter Humphries, Virginia)
