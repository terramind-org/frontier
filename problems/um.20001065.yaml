title: A convention-sensitive counterexample and a maximal-family obstruction certificate
field: mathematics
tier: prose
statement: |-
  **Conjecture 6.20 (Hoàng--Reed).** If \(G\) is a digraph with minimum outdegree \(r\), then there are directed cycles \(C_1,\ldots,C_r\) such that, for every \(\ell\),
  \[
  \left|V(C_\ell)\cap\left(\bigcup_{i=1}^{\ell-1}V(C_i)\right)\right|\leq 1.
  \]
