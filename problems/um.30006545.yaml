title: Polylogarithmic Treewidth in Induced-Subgraph-Free Graph Classes
field: mathematics
tier: prose
statement: For every positive integer $t$, does there exist an integer $d(t)$ such that every $n$-vertex graph in the hereditary class $\mathcal C_t^*$ has treewidth at most $(\log n)^{d(t)}$?
