title: Modular Structure of Exceptional Finite Lie-Type Groups
field: mathematics
tier: prose
statement: Determine the radical subgroups of exceptional groups of Lie type in bad characteristic; determine $p$-modular decomposition matrices for finite groups of Lie type, including basic sets, unitriangularity, and complete results for exceptional families; and determine the modular Harish–Chandra series for groups of Lie type.
