title: Operator Models for Higher-Rank Cowen–Douglas Flag Classes
field: mathematics
tier: prose
statement: |-
  For $n>2$, develop a natural higher-rank Cowen–Douglas flag class extending

  $$FB_2(\Omega)=\left\{\begin{pmatrix}T_0&S\\0&T_1\end{pmatrix}:T_i\in B_1(\Omega),\ T_0S=ST_1\right\},$$

  and determine its unitary invariants and reproducing-kernel model.
