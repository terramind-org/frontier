  \item[\hypertarget{source:9300006:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 9300006 (AMR-092-0006). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
