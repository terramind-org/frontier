title: Open Problems in Arithmetic Dynamics — Conjecture 54 (Dynamical Brauer--Manin Conjecture)
field: mathematics
tier: prose
statement: |-
  \textup{(Hsia--Silverman, 2009, [MR2537714])}
  Let $K$ be a number field, let $X/K$ be a variety, let $f:X\to X$ be
  a morphism defined over $K$, let $Y\subset X$ be a subvariety
  defined over $K$, and let $P\in X(K)$.
  Let ${\mathcal{A}}_K$ be the ring of adeles of $K$, and for any set $S$,
  let ${\mathcal{C}}(S)$ denote the adelic closure of $S$. Then
  \[
  {\mathcal{C}}\bigl(Y\cap\mathcal{O}_f(P)\bigr) = Y({\mathcal{A}}_K) \cap {\mathcal{C}}\bigl(\mathcal{O}_f(P)\bigr).
  \]
