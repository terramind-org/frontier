id: um.30001582
title: Residually Finite Torsion Groups with Restricted Subgroups
field: mathematics
tier: prose
statement: Does there exist an infinite finitely generated residually finite torsion group in which every subgroup is finite or of finite index? For a number field $K$, a prime $p$, and a finite set $S$ of primes, if $G=G_{K,p,S}$ has positive weighted deficiency, can one choose a valuation $W$ naturally described by the arithmetic of $K$ such that $\operatorname{def}_W(G)>0$?
