statement: If Q is a positive-definite quaternary quadratic form with discriminant $D(Q)$, is the largest positive integer n that is locally represented by Q but not represented by Q always $O_\varepsilon(D(Q)^{1+\varepsilon})$ for every $\varepsilon>0$?
