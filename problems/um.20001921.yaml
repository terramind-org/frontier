title: Sharp conformal projective systole and a volume-preserving Crofton obstruction
field: mathematics
tier: prose
statement: |-
  **Question 8.8.1 (Question 4.11 of [Gromov2001]).** Does a Riemannian metric on a real projective space with the same volume as the canonical metric have a closed geodesic with length \(\leq \pi\)?

  In dimension two, an affirmative answer is in [Gromov2001, Proposition 4.10].
