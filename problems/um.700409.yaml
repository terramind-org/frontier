title: Kourovka Notebook Problem 7.3
field: mathematics
tier: prose
statement: |-
  Prove that the periodic product of odd exponent $n \geq 665$ of
  non-trivial groups $F_1,\ldots ,F_k$ which do not contain
  involutions cannot be generated by less than $k$ elements. This
  would imply, on the basis of (S. I. Adian, *Sov. Math.
  Doklady*, **19**, (1978), 910--913), the existence of $ k
  $-generated simple groups which cannot be generated by less
  than $k$ elements, for any $k > 0$.
