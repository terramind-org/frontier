  \section{Optimal Feasible Sets from Quantized Trajectory Observations}\label{30001202}
  {\small\sffamily UnsolvedMath ID 30001202 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are denoted by $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$; index ranges, computational models and specialized notation follow the cited problem source and the definitions below.


  $f(S)=\{f(x):x\in S\}$ and $f^{-1}(S)=\{x:f(x)\in S\}$. A quantization region records the set in which a state lies. The recursive sets collect states consistent with forward or backward observation constraints.

  For a discrete random variable $X$, entropy is $H(X)=-\sum_xp(x)\log p(x)$, and mutual information is $I(X;Y)=H(X)+H(Y)-H(X,Y)$. Coding rates, capacities, and exponents depend on the stated channel or source model and error criterion.
  \paragraph{Statement recorded in the supplied source.}
  For $x(t+1)=f(x(t))$ and observed quantization regions $P(0),\ldots,P(T)$, define $Q^+(0)=P(0)$, $Q^+(t)=f(Q^+(t-1))\cap P(t)$, $Q^-(T)=P(T)$, $Q^-(t-1)=f^{-1}(Q^-(t))\cap P(t-1)$, and $Q(t)=Q^+(t)\cap Q^-(t)$. Under what conditions on $f$ are some $Q(t)$ small, and is $Q(t)$ the finest information about $x(t)$ obtainable from the quantized observations? \sref{30001202}{2}
  \paragraph{Scope qualification.}
  The meaning of small and finest, the metric, and whether observations concern one exact trajectory or independent feasible states are not fully specified.
  \paragraph{Source status.}
  The supplied catalogue labels this record open. Its source-status metadata was checked against the supplied snapshot on 2026-10-11. This import does not independently establish current open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Characterize when quantized observations localize states sharply and whether the stated intersected sets contain all obtainable information.
