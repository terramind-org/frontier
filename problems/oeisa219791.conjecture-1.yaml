lean:
  module: FormalConjectures.OEIS.«219791»
  decl: OeisA219791.conjecture_1
  statement: |-
    theorem conjecture_1 (n : ℕ) (hn : n > 0) (h1 : n ≠ 1) (h6 : n ≠ 6) (h16 : n ≠ 16) (h24 : n ≠ 24) :
        a n > 0
  context:
    - open OeisA219791
  definitions:
    - name: OeisA219791.a
      kind: def
      text: |-
        /-- Number of ways to write $n = x + y$ ($0 < x \le y$) with $(xy)^2 + 1$ prime. -/
        def a (n : ℕ) : ℕ :=
          (Finset.Icc 1 (n / 2)).filter (fun x : ℕ => Nat.Prime ((x * (n - x)) ^ 2 + 1)) |>.card
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/219791.lean#L33
