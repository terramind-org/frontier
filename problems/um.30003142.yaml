title: Geometric Interpretations of Lattice Modular Forms
field: mathematics
tier: prose
statement: Let $M$ be a primitive $2$-elementary Lorentzian sublattice of the K3 lattice $L_{K3}$, put $\Lambda=M^\perp\subset L_{K3}$, and let $F_\Lambda$ be the associated vector-valued modular form. What is the geometric meaning of $F_\Lambda$? In particular, does it arise as the elliptic genus of a bundle over a K3 surface beyond the cases where this is already known?
