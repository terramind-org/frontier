title: Open Problems in Arithmetic Dynamics — Conjecture 46
field: mathematics
tier: prose
statement: |-
  Let $K$ be a number field, let $f:\mathbb{P}^N\to\mathbb{P}^N$ be an endomorphism of
  degree at least $2$ defined over $K$, and let $P\in\mathbb{P}^N(K)$ be a
  point that is not periodic for $f$. Then $(f,P)$ is eventually stable
  over $K$.
