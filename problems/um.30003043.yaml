title: Exact Indices of Orthogonal Grassmannians
field: mathematics
tier: prose
statement: For every even $m\geq 18$, the index of the $\lfloor m/4\rfloor$-th orthogonal Grassmannian of any generic m-dimensional quadratic form $\varphi/F$ in $I^3_q$ is $2^{\lfloor m/4\rfloor}$.
