title: Explicit Semistable Reduction and Galois Actions for Curves
field: mathematics
tier: prose
statement: Given a smooth projective curve $Y$ over a discretely valued field $K$, compute a finite extension $L/K$, a semistable model of $Y_L$, and the action of $\operatorname{Gal}(L/K)$ on its special fiber. Develop an explicit method in arbitrary genus, beyond the classes for which such computations are already known.
