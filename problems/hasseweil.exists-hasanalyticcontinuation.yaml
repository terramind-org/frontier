schema: 1
id: hasseweil.exists-hasanalyticcontinuation
title: The Hasse--Weil conjecture for elliptic curves (exists_hasAnalyticContinuation)
field: mathematics
tier: proof
statement: |-
  The **Hasse--Weil conjecture** ([Tate1966], p. 416; [Gross2011], Conjecture 2.7): the
  $L$-series of an elliptic curve over a number field has an analytic continuation to $\mathbb{C}$.
