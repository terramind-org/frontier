title: Positive Degrees Within Truth Table and Many One Degrees
field: mathematics
tier: prose
statement: Can odd numbers other than $1$ occur as the number of positive degrees inside a truth-table degree? Does every many-one degree that is not recursive either consist of one one-one degree or contain an infinite antichain of one-one degrees?
