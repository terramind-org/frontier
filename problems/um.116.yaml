title: Gowers Box Norms over Finite Fields
field: mathematics
tier: prose
statement: "Let $p$ be an odd prime and suppose $f : \\mathbb{F}_p^n \\times \\mathbb{F}_p^n \\to \\mathbb{C}$ is bounded pointwise by 1. Suppose $\\mathbb{E}_h \\|\\Delta_{(h,h)}f\\|_\\square^4 \\geq \\delta$. Does $f$ correlate with a function of the form $a(x)b(y)c(x+y)(-1)^{q(x,y)}$?"
