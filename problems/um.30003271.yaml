title: Squarefree Group Orders in Elliptic-Curve Reductions
field: mathematics
tier: prose
statement: |-
  Let $E/\mathbb Q$ be an elliptic curve with $\operatorname{End}_{\mathbb Q}(E)\cong\mathbb Z$. Does there exist an explicit constant $\delta(E)$ such that

  $$\#\{p\leq x:\#E(\mathbb F_p)\text{ is square-free}\}\sim\delta(E)\pi(x)$$

  as $x\to\infty$?
