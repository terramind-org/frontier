title: Weak Uniqueness of Elementary-Embedding Square Roots at $\lambda$
field: mathematics
tier: prose
statement: Suppose $\lambda$ is a limit of supercompact cardinals, $X\subseteq V_{\lambda+1}$, and $j:L(X,V_{\lambda+1})\to L(X,V_{\lambda+1})$ is a proper elementary embedding. If square roots $k_1,k_2$ of $j$ agree on $V_\lambda$ and both map $L_\omega(X,V_{\lambda+1})$ to itself, must they agree below $\Theta^{L(X,V_{\lambda+1})}$?
