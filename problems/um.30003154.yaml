title: Higher-Codimension Weyl Laws and Equidistributed Min–Max Surfaces
field: mathematics
tier: prose
statement: Determine the constants $a(n)$; decide whether the Weyl law for $p$-widths extends to higher codimension, namely whether $\lim_{p\to\infty}\omega_p^k(M)p^{-(n+1-k)/(n+1)}=a(n,k)\operatorname{vol}(M)^{k/(n+1)}$; understand the analogous limits for Steenrod-power widths; and determine whether $p$-parameter min–max families yield minimal surfaces equidistributed as $p\to\infty$.
