title: Problem 4.5 — Try to understand the “topology at infinity” of T c g.
field: mathematics
tier: prose
statement: Try to understand the “topology at infinity” of T c g. In particular, try to compute Hk ∞(T c g ) for k in some range k≥do. Alternatively, try to compute the homology H•(T c g ) in lower degrees. Note that T c 2 is a manifold with boundary S5. The boundary of Jc 3 isS11. The first interesting case is in genus 3.
