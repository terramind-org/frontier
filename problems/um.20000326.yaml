title: An effective non-nef fixed-parent point-blowup locus
field: mathematics
tier: prose
statement: |-
  The paragraph
  beginning “Kollár's class of examples” is adjacent explanatory text after
  Problem 1.7 and before Problem 1.8; it is relevant motivation, but not part of
  the grammatical question.

  In
  the proved result below it means **linearly effective**:
  \(K_X\sim D\) for an effective integral divisor \(D\), equivalently
  \(H^0(X,\omega_X)\ne 0\). This is stronger than numerical
  pseudoeffectivity. No result for the merely pseudoeffective case is claimed.
