lean:
  module: FormalConjectures.ErdosProblems.«159»
  decl: Erdos159.erdos_159
  statement: |-
    theorem erdos_159 :
        ∃ (c : ℝ) (_ : 0 < c) (C : ℝ),
          ∀ (n : ℕ), 1 ≤ n →
            (SimpleGraph.graphRamsey (SimpleGraph.cycleGraph 4)
              (SimpleGraph.completeGraph (Fin n)) : ℝ) ≤ C * (n : ℝ) ^ (2 - c)
