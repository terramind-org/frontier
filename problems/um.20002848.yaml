title: What scalar Bergman commutators detect
field: mathematics
tier: prose
statement: Let \(\Omega\) be a smooth bounded pseudoconvex domain, let \(\mathbf B_\Omega\) denote the Bergman projection operator and \(M_\psi\) denote multiplication by \(\psi\). Suppose that \([\mathbf B_\Omega,M_\psi]\) is compact on \(L^2(\Omega)\) for all \(\psi\in C(\overline\Omega)\). Is \(N_1\) compact on \(L^2_{(0,1)}(\Omega)\)?
