title: Open Problems in Mathematical Logic — Problem 16
field: mathematics
tier: prose
statement: |-
  In 1954, [Mar] shows that for $E\subseteq \mathbb{R}^2$ an analytic set with Hausdorff dimension 1. Then, for almost all $\theta$, the projection of $E$ onto a line with slope $\theta$ has Hausdorff dimension 1. Later in 1969, [Dav] shows that CH could imply there is some $E\subseteq \mathbb{R}^2$ with Hausdorff dimension 1 and for all $\theta$, projection of $E$ onto a line of slope $\theta$ has Hausdorff dimension 0.

  Is there a Davies example provably in ZFC?
