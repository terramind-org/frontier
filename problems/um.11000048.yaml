title: Problem 4.11 — (Coarse Schottky problem).
field: mathematics
tier: prose
statement: (Coarse Schottky problem). Describe, as a subset of a g-dimensional Euclidean sector, the subset of Cone(Ag) determined by the Schottky locus in Ag. Points in Cone(Ag) are recording how the relative sizes of basis vectors of the tori are changing; it is precisely the “skewing parameters” that are being thrown away. It doesn’t seem unreasonable to think that much of the complexity in describing the Schottky locus is coming precisely from these skewing parameters, so that this coarsification of the Schottky problem, unlike the classical version, may have a reasonably explicit solution. There is a well-known feeling that the Schottky locus is quite distorted in Ag. Hain and Toledo (perhaps among others) have posed the problem of determining the second fundamental form of the Schottky locus, although they indicate that this would be a rather diﬃcult computation. We can coarsify this question by extending the definition of distortion of subgroups given in Subsection 3.2 above to the context of subspaces of metric spaces. Here the distortion of a subset S in a metric space Y is defined by comparing the restriction of the metric dY to S versus the induced path metric on S.
