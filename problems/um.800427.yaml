title: Open Problems in Arithmetic Dynamics — Conjecture 50
field: mathematics
tier: prose
statement: |-
  Let $K$ be a number field, let $f(x)\in K(x)$ be a rational function
  of degree at least $2$, let $\alpha\in K$ be a wandering point for $f$,
  let $\beta\in K$, and let $c$ be a constant. Then the set
  \[
  \left\{ n\ge0 : \sum_{{\mathfrak{p}}} \operatorname{ord}_{\mathfrak{p}}^{\scriptscriptstyle+}\bigl(f^n(\alpha)-\beta\bigr) \le c \right\}
  \quad\text{is finite.}
  \]
