title: Selection Principles in Mathematics — Problem 27
field: mathematics
tier: prose
statement: |-
  $\gimel(\Gamma)\subseteq\gimel(\mathrm{T})\subseteq\gimel(\Omega)$.
  $\mathsf{S}_{\mathrm{fin}}(\mathcal{O},\mathcal{O})=\mathsf{S}_{\mathrm{fin}}(\Omega,\mathcal{O})$ [coc1],
  $\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\Gamma)=\mathsf{S}_{\mathrm{fin}}(\Omega,\gimel(\Gamma))$ [coc7],
  and $\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\Omega)=\mathsf{S}_{\mathrm{fin}}(\Omega,\gimel(\Omega))$ [coc8].
  These results are generalized in [GlCovs].
  A positive answer to the following problem is consistent [SF2].

  Is $\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\mathrm{T})=\mathsf{S}_{\mathrm{fin}}(\Omega,\gimel(\mathrm{T}))$?
