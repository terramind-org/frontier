lean:
  module: FormalConjectures.OEIS.«242174»
  decl: OeisA242174.conjecture_2
  statement: |-
    theorem conjecture_2 (r : ℕ) (hr : 2 < r) :
        ∃ N : ℕ, ∀ n : ℕ, N ≤ n → primitivePrimeDivisorFranel r n ≠ 1
  context:
    - open OeisA242174
    - open Finset
  definitions:
    - name: OeisA242174.primitivePrimeDivisorFranel
      kind: def
      text: |-
        /-- Least prime divisor of $f_r(n)$ that does not divide $f_r(k)$ for any $1 \le k < n$,
        or $1$ if no such prime divisor exists. -/
        def primitivePrimeDivisorFranel (r n : ℕ) : ℕ :=
          let b := franel r
          ((b n).primeFactorsList.filter fun p =>
            (List.range' 1 (n - 1)).all fun k => !(p ∣ b k)).head?.getD 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/OEIS/242174.lean#L41
