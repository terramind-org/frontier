  \section{Jiang–Su Embeddings in Character-Free Central Sequence Algebras}\label{30002228}
  {\small UnsolvedMath ID 30002228 · Algebra}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  If $F(A)$ has no characters, must it contain a unital copy of $\mathcal Z$? Does $\mathcal Z$ embed unitally into $\bigotimes_{n=1}^{\infty}D$ for every unital $C^*$-algebra $D$ without characters?
  \par\smallskip\textit{Formulation references:} \sref{30002228}{1}, \sref{30002228}{2}.
  \subsection{Short English statement}
  If $F(A)$ has no characters, must it contain a unital copy of $\mathcal Z$? Does $\mathcal Z$ embed unitally into $\bigotimes_{n=1}^{\infty}D$ for every unital $C^*$-algebra $D$ without characters?
