title: Kourovka Notebook Problem 18.113
field: mathematics
tier: prose
statement: |-
  Let $\mathfrak{M}$ be a finite set of finite simple nonabelian
  groups. Is it true that a periodic group saturated with groups from $\mathfrak{M}$ (see 14.101) is isomorphic to one of groups in $\mathfrak{M}$? The case where $\mathfrak{M}$ is one-element is of special interest.
