lean:
  module: FormalConjectures.Wikipedia.RefactorableNumber
  decl: RefactorableNumber.zelinsky_refactorable_progression_conjecture
  statement: |-
    theorem zelinsky_refactorable_progression_conjecture :
        ∀ m n₀ : ℕ, 1 ≤ m → n₀.IsRefactorable →
          ∃ n : ℕ, n₀ < n ∧ n.IsRefactorable ∧ n ≡ n₀ [MOD m]
