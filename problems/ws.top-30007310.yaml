statement: |-
  \section*{Hyperinvariant subspaces for quasinilpotent Hilbert-space operators}\label{30007310}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must every nonzero quasinilpotent bounded operator on a separable infinite-dimensional complex Hilbert space have a nonzero proper closed subspace invariant under every bounded operator commuting with it?
  \subsection{Short English statement}
  Must every nonzero quasinilpotent bounded operator on a separable infinite-dimensional complex Hilbert space have a nonzero proper closed subspace invariant under every bounded operator commuting with it?
