id: um.20003054
title: A determinant-sensitive transfer theorem for directional measures
field: mathematics
tier: prose
statement: |-
  Given a pseudo-Anosov acting on a translation surface, what can be said
  about the measured laminations in the stable and in the unstable direction?
  In general, "How much of Thurston's notes goes through?"

  \(f\) is an affine automorphism of an infinite-type translation surface
  whose derivative has a real expanding and a real contracting
  eigendirection.
