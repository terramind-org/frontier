title: Partitions $2n + 1 = x + y$ with $x^4 + y^4$ prime (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture: If $x^4 + y^4$ in the definition of $a(n)$ is
  replaced by $x^2 + y^2$, then the count is positive for all $n \ge 1$.
  - _Thomas Ordowski_, Nov 03 2012
