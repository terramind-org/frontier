  decl: OeisA218656.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 1 ≤ n) :
        ∃ x : ℕ, 1 ≤ x ∧ x ≤ n ∧ Nat.Prime (x ^ 2 + (2 * n + 1 - x) ^ 2)
