title: Intrinsic-Flat and Sobolev Limit Spaces
field: mathematics
tier: prose
statement: Under the hypotheses of the IAS minimum-area compactness conjecture, if $g_j\to g_\infty$ in $W^{1,p}$, determine whether the intrinsic-flat limit is the metric completion of the nonsingular part of $(M,g_\infty)$; if not, characterize their relation and the consequences of distributional nonnegative scalar curvature.
