statement: |-
  \section{Morava K- and E-theory 5 — Find the shadow of the thick subcategory theorem in the K(n)-local category.}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Fix a prime $p$ and a positive chromatic height $n\ge1$. In the category of dualizable $K(n)$-local spectra at $p$, classify thick tensor ideals. A thick tensor ideal is closed under cofibers, retracts, and tensoring with any dualizable object. Does their inclusion order give the expected chromatic filtration analogous to the thick-subcategory theorem for finite spectra?
  \par\smallskip\textit{Formulation references:} \sref{statement}{1}, \sref{statement}{2}.
  \subsection{Short English statement}
