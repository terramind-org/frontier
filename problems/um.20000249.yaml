id: um.20000249
title: Generic-point abelianity and the naive-versus-genuine SU(2) correction
field: mathematics
tier: prose
statement: |-
  **Question (Anastasia Stavrova).** When \(G\) is a linear
  reduced/algebraic group, in a large number of cases, it is known on a
  case-by-case basis that \(\Pi^{\mathbb A^1}_0(G)\) is abelian. Is this
  always true? Can this be obtained in a uniform way when it is true?

  **Remark (Madhav Nori).** This is not always true e.g.
  \(G=SU(2,\mathbb R)\). In fact, the same reasoning should show that
  \(\Pi^{\mathbb A^1}_0(G)\) is not abelian for any anisotropic group
  \(G\) over \(\mathbb R\).
