title: Open Problems and Questions about Geodesics — Problem 40
field: mathematics
tier: prose
statement: |-
  Flag curvature is the Finslerian analogue of sectional curvature. It was shown in [Akbar-Zadeh1988] that: any closed Finsler surface with constant flag curvature zero is locally Minkowskian; any sufficiently smooth closed Finsler surface with constant negative curvature is Riemannian (there are non-Riemannian examples which are not sufficiently smooth); and any connected closed Finsler surface with constant positive flag curvature is homeomorphic to $S^2$ or $\mathbb{R} P^2$.
  The result for negative flag curvature also follows from [Foulon1997] and is true in all dimensions.

  *Describe Finsler metrics on $S^2$ of flag curvature $1$.*
