title: A central-quotient obstruction to metric ample generics
field: mathematics
tier: prose
statement: |-
  **Problem 16.** Study the existence of ample generics in the setting of \(\omega\)-stable separably categorical continuous theory.

  **Background.** Generalize the ideas of Hodkinson, Hodges, Lascar and Shelah presented in the paper “The small index property for \(\omega\)-stable, \(\omega\)-categorical structures and the random graph” to the setting of metric structures.
