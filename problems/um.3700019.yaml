statement: Let $F$ be entire in two variables and let a holomorphic germ $\phi$ satisfy $F(z,\phi(z))=0$ near a nonsingular point. Must $\phi$ admit analytic continuation along almost every ray from its base point, as inverse germs of entire functions do?
