title: "Largeness of Out(F_n): complete rank classification and quantitative transfer consequences"
field: mathematics
tier: prose
statement: |-
  **Problem 3.5.** Does there exist a finite-index subgroup \(\Gamma < \operatorname{Out}(F_n)\) such that \(\Gamma \to F_2\)?

  It then records discussion about applicable techniques, train tracks, an infinite torsion quotient, non-bounded generation, and bounded cohomology.

  Immediately before Problem 3.5 it says: “if \(n\ge4\), is \(\operatorname{Out}(F_n)\) large? Meaning, does there exist a finite-index subgroup which acts on a tree, thus maps onto a free group?” Therefore:

  - the intended rank range is \(n\ge4\);
  - \(F_2\) is the nonabelian free group of rank two;
  - the arrow is intended to be an **epimorphism**, so the reconstructed formula is \(\Gamma\twoheadrightarrow F_2\).

  This is the standard definition that \(\operatorname{Out}(F_n)\) is **large**. The phrase about acting on a tree is motivation, not a general equivalence: an epimorphism to \(F_2\) gives an action on its Cayley tree, but an arbitrary nontrivial tree action need not produce a free quotient.
