statement: "Compute the Spg(Z)-moduleHk c (T c,red g ) in some range k≥ko. 3. Finiteness and Torelli spaces 71 We already know that H 6g−7 c (T c,red g ) = H0(Bc g) and that there is a surjection H 6g−8 c (T c,red g )→ H1(Bc g), where Bc g denotes the normalization (i.e., disjoint union of the irreducible components) ofT c,red g. In concrete terms: Bc g = ⌊g/2⌋∐ h=1 ∐ φ∈Spg(Z)(T c h,1×T c g−h,1) φ ( T c h,1×T c g−h,1 ). Lurking in the background is the folk conjecture Hk(Tg)is finitely generated when k<g − 1. If true, this places strong conditions on the finiteness of the topology of T c g andT c,red g. It is worthwhile to contemplate (for g≥ 3) the Gysin sequence: ··· →→ H 6g−10 c (T c,red g ) →→ H3(Tg) →→ H3(T c g ) ↙↙←←←←←←←←←←←←←←←←←←←←←←←←←←←←← H 6g−10 c (T c g ) H 6g−9 c (T c,red g ) ↓↓↓↓ →→ H2(Tg) →→ H2(T c g ) ↙↙←←←←←←←←←←←←←←←←←←←←←←←←←←←←← H1(Bc g) H 6g−9 c (T c g ) H 6g−8 c (T c,red g ) →→ H1(Tg) τ →→ H1(T c g ) →→ 0 H0(Bc g) ( Λ3H ) /H Here τ denotes the Johnson homomorphism, realized as the map on H1 induced by the inclusion Tg ↪→T c g. Finally, it is interesting to study the topology of the branching locus of T c g →J c g. This is the locusHc g of hyperelliptic curves of compact type. Using A’Campo’s result [ 1] that the image of the hyperelliptic mapping class group 9 ∆g in Sp g(Z) contains the level two subgroup Spg(Z)[2] = {A∈ Spg(Z)[2]: A≡I mod 2} 9The hyperelliptic mapping class is the centralizer of a hyperelliptic involution in Γ g. It is the orbifold funda- mental group of the moduli space of smooth hyperelliptic curves of genus g. 72 R. Hain of Sp g(Z) and the fact that the image ∆ g in Sp g(F2) is S2g−2, the symmetric group on the Weierstrass points, one can see that Hc g has | Spg(F2)|/|S2g+2| = 2g2∏g k=1(22k− 1) (2g + 2)! components. Each component of Hc g is smooth and immerses in hg via the period mapping. The irreducible components of Hg are disjoint in Jg. In genus 3, Hc 3 has 36 components. Their images are cut out by the 36 even theta nulls ϑα: h3→ C."
