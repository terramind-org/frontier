statement: "(T. Kohno) Determine the image and the kernel of the above map τ. The space of conformal blocks in WZW model is defined as the spa ce of coin- variant tensors in the following way. Let p1,···, pn be marked points on Σ and H1,···, Hn be representations of the aﬃne Lie algebra ˆg. The space of conformal blocks is defined to be the set of linear forms φ: H1⊗···⊗Hn−→ C invariant under the action of meromorphic functions with va lues in g with poles at most at p1,···, pn, where the action is defined by the Laurent expansion at these points. There is a twisted version of the above constru ction, where the above meromorphic functions are replaced by meromorphic se ctions of a g local system."
