title: Boundaries of Groups and Kleinian Groups — Problem 23
field: mathematics
tier: prose
statement: Deﬁne a topology on the set of quasi geodesics in a (proper geodesic, or coarsely homogeneous, or cocompact) CAT (0) space which (1) has a description as an increasing union of compact metrizable spaces (2) has an inclusion of its visual boundary ∂∞X into it (3) is quasi-isometry invariant (4) has reasonable measure classes which are quasipreserved According to a theorem by Brian Bowditch and Gadde Swarup [13, 56], if G is a 1-ended hyperbolic group then ∂∞G has no cut points. For G a CAT(0) group, a theorem of Eric Swenson says that if c ∈ ∂∞G is a cut point, then there is an inﬁnite-torsion subgroup of G ﬁxing c.
