lean:
  module: FormalConjectures.OEIS.«113257»
  decl: OeisA113257.conjecture1
  statement: |-
    theorem conjecture1 :
        conjecture1.answer = a (sInf {n : ℕ | 2 < n ∧ (a n).Prime})
  context:
    - open OeisA113257
  definitions:
    - name: OeisA113257.a
      kind: def
      text: |-
        /-- a n is the ascending descending base exponent transform of squares -/
        def a (n : ℕ) : ℕ :=
          ∑ i ∈ Finset.Icc 1 n, (i ^ 2) ^ ((n - i + 1) ^ 2)
