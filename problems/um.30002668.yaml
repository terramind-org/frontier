title: Long Alternating Paths in Colored Line Arrangements
field: mathematics
tier: prose
statement: Given n red, n blue, and n green lines in general position in the plane, does the dual graph of the arrangement always contain an alternating path of length $\Theta(n^2)$, where consecutive crossed edges cannot have the same color?
