  \section*{Nonexpansive fixed points in reflexive Banach spaces}\label{30007184}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every real reflexive Banach space X, every nonempty norm-closed bounded convex C subset X, and every nonexpansive map $F:C->C$, must F have a fixed point?
  \subsection{Short English statement}
  For every real reflexive Banach space X, every nonempty norm-closed bounded convex C subset X, and every nonexpansive map $F:C->C$, must F have a fixed point?
