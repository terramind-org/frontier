title: Conjecture 12.10 — (D.
field: mathematics
tier: prose
statement: (D. Thurston) The shadow number of a 3-manifold is quasi-linear in its Gromov norm. That is, there exist consta nts c1 and c2 such that c1||M||≤ (shadow number of M )≤ c2||M|| for any 3-manifold M, where ||M|| denotes the Gromov norm of M.
