statement: For $0\leq q\leq1$ and fixed $A>0$, prove $\frac1{r-1}\sum_{\chi\bmod r}|\sum_{n\leq x}\mu(n)\chi(n)|^{2q}\ll(\frac{x}{1+(1-q)\sqrt{\log\log x}})^q$ for $x\leq r^A$, and $\frac1{2T}\int_{-T}^T|\sum_{n\leq x}\mu(n)n^{it}|^{2q}\,dt\ll(\frac{x}{1+(1-q)\sqrt{\log\log x}})^q$ for $x\leq T^A$.
