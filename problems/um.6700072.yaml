statement: 'Conjecture. Stability of Periodic Slabs. The only Zn−3-invariantmeanconvexdomainsin Rn withdisconnectedboundaries are slabs between parallel hyperplanes. Besides "thin and narrow" mean convex domainsY which surround codimension two subsets in Riemannian manifoldsX, there are also "thick" ones. For instance, let X be a complete Riemanniann-manifold, such that ○∞ X is connected at inﬁnity. ∞ voln−1(∂∞X) =∞, that is every proper continuous function f ∶X→R+ satisﬁes lim sup t→∞ voln−1(f−1(t))→∞. ¯●X is locally "(n−2)-thick": There existε> 0,α> 1 andc> 0, such that all(n−2)-cycles B ⊂X with diametersdiam(B) ≤ε and with voln−2(B) ≤εn−2 bound (n−1)-chains C, i.e. B = ∂C, such that voln−1(C) ≤c⋅voln−2(B)α. (An X which isuniformly bi-Lipschitz homeomorphic to Rn, or to any Riemannian homogeneous space, satisﬁes these three conditions.) Then, granted○∞, ∞, ¯●, every compact subsetY0 ⊂X is contained in asmooth compact mean convexdomain Y1 ⊂X. Sketch of the'
