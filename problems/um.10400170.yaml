statement: (Y. Kawahigashi) Suppose we have a semisimple ribbon cat- egory C1 with finitely many isomorphism classes of simple objects, bu t the S -matrix is not invertible. Then we can construct a new modula r category C2 containing C1 as a full subcategory by the “quantum double” construction [315, 316, 182], but there may be another extension of C1 to a modular cate- gory. Theorem 2.13 in [315] claims that we have a “minimal” ex tension in an “essentially unique” way. Do we indeed have existence and ce rtain uniqueness of such an extension? If so, what is the relation between the t wo TQFT’s arising from C1 and its minimal extension?
