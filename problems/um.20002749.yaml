title: A fixed quadratic tca presentation with square-root syzygy excess
field: mathematics
tier: prose
statement: |-
  **Bounds on syzygies of modules over degree two tca's.** Let
  \(A=\operatorname{Sym}(\operatorname{Sym}^2)\) or
  \(\bigwedge(\operatorname{Sym}^2)\), and let \(M\) be an \(A\)-module
  generated in degree \(d\) and related in degree \(r\). Are there any good
  bounds on the syzygies? In other words, bound generators of the terms of
  the free resolutions. Can start with characteristic \(0\).
