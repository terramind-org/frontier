lean:
  module: FormalConjectures.Wikipedia.Emirp
  decl: Emirp.infinitude_question
  statement: |-
    theorem infinitude_question :
        {p : ℕ | IsEmirp p}.Infinite
  context:
    - open Emirp
  definitions:
    - name: Emirp.IsEmirp
      kind: def
      text: |-
        /-- A natural number is an emirp if it and its distinct decimal reversal are both prime. -/
        def IsEmirp (p : ℕ) : Prop :=
          p.Prime ∧ (reverse10 p).Prime ∧ reverse10 p ≠ p
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/Wikipedia/Emirp.lean#L40
