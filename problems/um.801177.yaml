title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 4: Charney-Davis conjecture for Gorenstein* flag complexes"
field: mathematics
tier: prose
statement: |-
  Let $\Delta$ be a $(2e-1)$-dimensional Gorenstein* flag simplicial complex (i.e., a Gorenstein* complex in which every minimal non-face has two vertices) with $h$-vector $(h_0,h_1,\dots,h_{2e})$. Is it true that
  $$(-1)^e(h_0 - h_1 + h_2 - \cdots + h_{2e}) \ge 0?$$
