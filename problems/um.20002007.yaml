id: um.20002007
title: Abstract tropical spaces and the actual fibers of phase tropicalization
field: mathematics
tier: prose
statement: |-
  This record is Section C.2, “Basic definitions,” in the 14 January 2004 AIM workshop report *Amoebas and Tropical Geometry*. It records workshop proposals and questions, not a settled definition. The questions are:

  1. What should an abstract tropical variety or abstract idempotent variety be, including local models and gluing maps?
  2. For a non-Archimedean variety, how should valuation, phase, tropical, complex tropical, and real tropical images be distinguished?
  3. When is a complex/phase tropical limit homeomorphic or homotopy equivalent to a nearby classical fiber?
  4. Is there a tropical Hodge theory compatible with classical limiting Hodge theory?
  5. Can patchworking be refined to retain information about an individual hypersurface, and how should maps and bundles be defined?

  The source also prints: “The fiber of the projection from such a complex tropical variety to the corresponding tropical variety is a torus.” That statement is false in general. The modern fiber is a coamoeba (or its closure, depending on convention) of an initial degeneration. Section 5 gives the exact binomial case, and Section 7 gives a tropical-line counterexample.
