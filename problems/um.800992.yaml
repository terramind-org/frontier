title: Open Problems in Mathematical Logic — Problem 4
field: mathematics
tier: prose
statement: |-
  Toward a negative answer to Levin's Problem 1.2, are the following true?

  (1) Are there $2$-random reals $x<_T z$ such that
  \[
  x'\equiv_T z'?
  \]

  (2) Are there $2$-random reals $x<_T z$ such that
  \[
  \left|
  K(x\upharpoonright n)-K(z\upharpoonright n)
  \right|
  =
  O(1)?
  \]

  (3) Is there a Turing ideal $B$ generated by a chain of
  $2$-random reals such that $B$ contains no $x$-random real for
  any $x\in B$?

  (4) What are the jumps of $2$-random reals?
  See [BDN].
