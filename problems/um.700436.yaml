title: Kourovka Notebook Problem 7.39
field: mathematics
tier: prose
statement: |-
  Let $G=\left< a, b\mid a^p=(ab)^3=b^2=(a^{\sigma}ba^{2/\sigma
  }b)^2=1\right> ,$ where $p$ is a prime, $\sigma$ is an integer not
  divisible by $p$. The group $PSL_2(p)$ is a factor-group of $G$ so
  that there is a short exact sequence $1 \rightarrow N \rightarrow
  G \rightarrow PSL_2(p) \rightarrow 1 .$ For each $p > 2$ there is
  $\sigma$ such that $N=1$, for example, $\sigma =4$. Let $N^{ab}$
  denote the factor-group of $N$ by its commutator subgroup. It is
  known that for some $p$ there is $\sigma$ such that $N^{ab}$ is
  infinite (for example, for $p=41$ one can take $\sigma ^2 \equiv
  2 (\mathrm{mod} 41)$), whereas for some other $p$ (for example,
  for $p=43$) the group $N^{ab}$ is finite for every $\sigma$.

  a) Is the set of primes $p$ for which $N^{ab}$
  is finite for every $\sigma$ infinite?

  b) Is there an arithmetic condition on $\sigma$
  which
  ensures that $N^{ab}$ is finite?
