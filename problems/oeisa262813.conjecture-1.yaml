lean:
  module: FormalConjectures.OEIS.«262813»
  decl: OeisA262813.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : 0 < n) : 0 < a n"
  context:
    - open OeisA262813
  definitions:
    - name: OeisA262813.a
      kind: def
      text: |-
        /--
        Number of ordered ways to write $n$ as $x^3 + y^2 + \frac{z(z+1)}{2}$ with $x \ge 0$, $y \ge 0$,
        and $z > 0$.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.range (n + 1),
            ∑ y ∈ Finset.range (n + 1),
              ∑ z ∈ Finset.Ico 1 (n + 1),
                if x ^ 3 + y ^ 2 + Nat.triangular z == n then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/262813.lean#L34
