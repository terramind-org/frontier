title: Open Problems on Central Simple Algebras — Problem 4
field: mathematics
tier: prose
statement: |-
  Determine the smallest splitting group(s) of an $F$-division algebra $A$ arising
  from the Galois closure of a maximal subfield of $A$. Determine in particular whether
  every $A$ of degree $n$ has a separable maximal subfield whose Galois closure has group the alternating group $A_n$.
