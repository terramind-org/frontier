title: Kourovka Notebook Problem 20.49
field: mathematics
tier: prose
statement: |-
  Is it true that any finite group contains a 2-generated subgroup with the
  same exponent?

  An affirmative answer is known for soluble groups. It is also known that any finite group contains a 3-generated subgroup with the same exponent (E. Detomi, A. Lucchini, *J. London Math. Soc. (2)*, **87**, no. 3 (2013), 689--706).
