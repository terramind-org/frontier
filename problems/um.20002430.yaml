title: Regularity of weak geodesics on singular Kähler varieties
field: mathematics
tier: prose
statement: Let \(X\) be a compact singular Kähler variety, let \(\omega_0,\omega_1\) be cohomologous Kähler metrics on \(X\), and define their weak Mabuchi geodesic by the pluripotential Perron envelope on a resolution. Is that envelope \(C^{1,1}_{\mathrm{loc}}(X_{\mathrm{reg}}\times A)\), where \(A\) is the annulus encoding geodesic time?
