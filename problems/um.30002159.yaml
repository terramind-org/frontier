title: Random Isotropic Model for Selmer Exact Sequences
field: mathematics
tier: prose
statement: For $V=\mathbb Z_p^{2n}$, $W=\mathbb Z_p^n\times\{0\}$, and random $Z\in\operatorname{OGr}_n(\mathbb Z_p)$, let $R=(Z\cap W)\otimes\mathbb Q_p/\mathbb Z_p$, $S=(Z\otimes\mathbb Q_p/\mathbb Z_p)\cap(W\otimes\mathbb Q_p/\mathbb Z_p)$, and $T=S/R$. Does the limiting distribution as $n\to\infty$ of $0\to R\to S\to T\to0$ equal the distribution of the corresponding sequences for elliptic curves over $k$?
