statement: |-
  \section*{Colin de Verdière chromatic-number conjecture}\label{30007084}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Does every finite simple graph G satisfy $chi(G)<=\mu (G)+1$, where mu is the Colin de Verdière invariant?
  \subsection{Short English statement}
  Does every finite simple graph G satisfy $chi(G)<=\mu (G)+1$, where mu is the Colin de Verdière invariant?
