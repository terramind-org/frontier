title: Lück Approximation for Kernels over Arbitrary Fields
field: mathematics
tier: prose
statement: |-
  Let $F$ be a finitely generated free group, let $K\subseteq\mathbb C$ be a field, and let
  $$
  F\trianglerighteq N_1\trianglerighteq N_2\trianglerighteq\cdots
  $$
  be normal subgroups with $N=\bigcap_iN_i$, $G_i=F/N_i$, and $G=F/N$. For every $A\in\operatorname{Mat}_{n\times m}(K[F])$, is
  $$
  \lim_{i\to\infty}\dim_{G_i}\ker\phi_{G_i}^A=\dim_G\ker\phi_G^A
  $$
  hold?
