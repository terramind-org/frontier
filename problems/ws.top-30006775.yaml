title: L-space Conjecture
field: mathematics
tier: prose
statement: |-
  \section*{\texorpdfstring{L-space Conjecture}{L-space Conjecture}}\label{statement}
  \subsection{Definitions and mathematical statement}
  A rational homology three-sphere $Y$ has $H_*(Y,{\mathbb{Q}})\cong H_*(S^3,{\mathbb{Q}})$; irreducibility means every embedded two-sphere bounds a ball. An L-space has
  $\operatorname{rank}\widehat{HF}(Y)=|H_1(Y,{\mathbb{Z}})|$ in the Heegaard Floer convention of the source. A group is left-orderable if it has a strict total order preserved by left multiplication. A codimension-one foliation is coorientable if its normal line bundle is orientable, and taut if every leaf meets a closed transversal. For closed oriented irreducible rational homology three-spheres, the conjecture equates: not being an L-space; having a nontrivial left-orderable fundamental group; and admitting a coorientable taut foliation. The explicit nontriviality clause excludes the trivial-group convention from changing the statement.
  \par\smallskip\textit{Formulation and concept references:} \href{https://web.ma.utexas.edu/users/vandyke/notes/princeton_rtg_notes/hanselman/hanselman.pdf}{[S1]}.

  \subsection{Short English statement}
  Are three descriptions of a rational homology three-sphere equivalent: nonminimal Floer homology, an orderable nontrivial fundamental group, and a coorientable taut foliation?
  \subsection{Sources}
  \begin{itemize}
  \item[S1]J. Hanselman, "L-spaces, foliations, and left-orderability," Princeton RTG lecture, notes by J. Van Dyke; conjecture due to Boyer-Gordon-Watson (Math. Ann. 356 (2013)) and Juhasz.
  \url{https://web.ma.utexas.edu/users/vandyke/notes/princeton_rtg_notes/hanselman/hanselman.pdf}.
  \textit{Formulation source.}
  \end{itemize}
