title: Asymptotic Enumeration of Arithmetic-Progression-Free Sets
field: mathematics
tier: prose
statement: For fixed $k\geq3$, is the number of $k$-term-AP-free subsets of $[n]$ equal to $2^{(1+o(1))r_k(n)}$ as $n\to\infty$, where $r_k(n)$ is the maximum size of a $k$-term-AP-free subset of $[n]$?
