title: Automorphy Conjecture for Motives
field: mathematics
tier: prose
statement: Let $G$ be a quasi-split connected reductive group over a number field $F$, let $r$ be a representation of its L-group, and let $\varphi_v$ be the local Langlands parameters attached to a motive $M$. Does there exist an irreducible automorphic representation $\pi=\bigotimes_v\pi_v$ of $G(\mathbb{A}_F)$ such that $L(s,\pi,r)=L(M,s)$, each $\pi_v$ lies in $\Pi_{\varphi_v}$, $\pi$ is cuspidal when $M$ is absolutely irreducible, and $\pi$ is tempered and essentially unitary?
