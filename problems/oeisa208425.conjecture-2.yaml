id: oeisa208425.conjecture-2
title: Expansion of $\sum_{n \ge 0} \frac{(3n)!}{n!^3} \frac{x^{2n}}{(1-x)^{3n+1}}$ (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii), part 1: For any prime $p \equiv 1 \pmod{3}$, we have
  $\sum_{k=0}^{p-1} a(k) \equiv \binom{2(p-1)/3}{(p-1)/3} \pmod{p^2}$.
  - _Zhi-Wei Sun_, Nov 12 2016
