title: Problem 2.3 — Work out the details of this construction of the completion Yg of Yg.
field: mathematics
tier: prose
statement: Work out the details of this construction of the completion Yg of Yg. Show that L:Yg→ [0,∞) extends to L:Yg→ [0,∞) and is a proper map. Ideally, inclusion Yg→Yg should be a homotopy equivalence (and Yg−Yg should be the boundary of the manifold with corners Yg). Study L as a “Morse” function. Critical points of L are most likely not isolated; however, explain the change in the homotopy type of L −1 [0,t ] as t passes through a critical value. For example, take the case g = 2. Spaces added at infinity are Y 1 1×Y 1 1×S1 = H2× H2×S1 and the restriction of L to such a set factors through H2× H2 where it has a unique minimum and no other critical points. Thus this set contains a “mincircle”. Hope. A point of Y 2 is a local minimum of L iﬀ it belongs to one of these mincircles. In addition there are isolated critical points of index 1 that connect up these circles in a tree-like pattern. Thus Y 2 and Y2 are homotopy equivalent to a wedge of circles, one circle for every splitting, recovering the theorem of Mess mentioned above. 2the smallest dimension of a space homotopy equivalent to Yg 1. Four questions about mapping class groups 7
