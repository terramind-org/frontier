statement: |-
  \section*{Linear hitting-time variance for random clause size at least four}\label{30007384}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each fixed $k\geq 4$, let $H_n$ be the first unsatisfiable time under independent proper uniformly signed k-clauses sampled with replacement. Is $Var(H_n)=Theta_k(n)$? Ask also $Var(min(H_n,floor(Bn)))=Theta_{k,B}(n)$ for $B>\log (2)/(-\log (1-2^{-k}))$.
  \subsection{Short English statement}
  For each fixed $k\geq 4$, let $H_n$ be the first unsatisfiable time under independent proper uniformly signed k-clauses sampled with replacement. Is $Var(H_n)=Theta_k(n)$? Ask also $Var(min(H_n,floor(Bn)))=Theta_{k,B}(n)$ for $B>\log (2)/(-\log (1-2^{-k}))$.
