lean:
  module: FormalConjectures.OEIS.«219838»
  decl: OeisA219838.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : n > 1157) :
        ∃ x y : ℕ, 0 < x ∧ 0 < y ∧ x + y = n ∧
          Nat.Prime ((x * y) ^ 2 + x * y - 1) ∧ Nat.Prime ((x * y) ^ 2 + x * y + 1)
  context:
    - open OeisA219838
  definitions: []
