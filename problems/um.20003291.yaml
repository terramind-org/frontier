id: um.20003291
title: An endpoint Fourier-moment and cusp-tail reduction
field: mathematics
tier: prose
statement: |-
  **Conjecture 21 (Marklof--Strömbergsson).** Let \(f\) be a continuous function on \(T^1X\), subject to a specified cusp-growth condition from [MS]. If \(\alpha\) is badly approximable and \(0<c_1<c_2\), then
  \[
  \frac1M\sum_{m=1}^M f(u_y(m\alpha))
  \longrightarrow \int_{T^1X} f\,d\lambda
  \]
  uniformly for \(c_1M^{-2}\leq y\leq c_2M^{-2}\), where \(\lambda\) is normalized Liouville measure.
