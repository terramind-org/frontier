lean:
  module: FormalConjectures.Paper.ManickamMiklosSinghiConjecture
  decl: ManickamMiklosSinghiConjecture.manickam_miklos_singhi_conjecture
  statement: |-
    theorem manickam_miklos_singhi_conjecture :
        ∀ (n k : ℕ), 1 ≤ k → 4 * k ≤ n → ∀ x : Fin n → ℝ, ∑ i, x i = 0 →
          (n - 1).choose (k - 1) ≤ nonnegSubsetCount n k x
  context:
    - open ManickamMiklosSinghiConjecture
    - open Finset
  definitions:
    - name: ManickamMiklosSinghiConjecture.nonnegSubsetCount
      kind: def
      text: |-
        /-- The number of `k`-element subsets of `Fin n` on which the real weights `x` have
        nonnegative sum. -/
        noncomputable def nonnegSubsetCount (n k : ℕ) (x : Fin n → ℝ) : ℕ :=
          ((univ : Finset (Fin n)).powersetCard k).filter (fun S => 0 ≤ ∑ i ∈ S, x i) |>.card
