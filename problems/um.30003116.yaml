title: Quantitative Entropy of Rational Multiplicative Orbits
field: mathematics
tier: prose
statement: For multiplicatively independent integers $a,b$, do there exist $N,M,K$ depending only on $a,b$ such that, whenever $(s,ab)=(s,r)=1$, the set $A=\{a^n b^k r/s\bmod 1:n,k\leq M\log s\}$ satisfies $\log N(A,(\log s)^{-N})\geq K\log\log s$?
