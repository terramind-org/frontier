title: Foliations and Diffeomorphism Groups — Question 51
field: mathematics
tier: prose
statement: |-
  We can ask the same question, say, in $\mathrm{Diff}_0^\infty(**S**^2)$.
  Here is a variation on $\mathrm{Diff}_0^\infty(\Sigma_g)$, where $\Sigma_g$ is surface of genus $g \geq 1$. After the work of Bowden, Hensel and Webb using their fine curve graph [bowden2022quasi], we know that the stable commutator length is unbounded on these groups.

  Can we find $f \in \mathrm{Diff}_0^\infty(\Sigma_g)$ such that $\mathrm{scl}(f) = 0$ but $f$ is not a commutator? What about $\mathrm{Homeo}_0(\Sigma_g)$?
