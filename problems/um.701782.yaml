title: Kourovka Notebook Problem 20.124
field: mathematics
tier: prose
statement: |-
  A *Rota--Baxter operator* on a group $G$ is a mapping $B : G \to G$ such that
  $B(g) B(h) = B\left(gB(g)hB(g)^{-1} \right)$ for all $g, h \in G$.
  Let $F$ be a non-abelian free group. Is there a Rota--Baxter operator on $F$ such that its image is equal to the derived subgroup $[F, F]$?
