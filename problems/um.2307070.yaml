title: Research Problems in Function Theory — Problem 7.70
field: mathematics
tier: prose
statement: Using arguments due to Ahlfors (see, for example ) any M\"obius transformation in $\mathbb{R}^n$ can be written in the form $(ax + b)(cx+d)^{-1}$, where $x\in\mathbb{R}^n$ and $a, b, c, d$ are elements of a Clifford algebra $A_n$ that satisfies certain constraints. It can be shown that the linear differential equations whose solution spaces are conformally invariant are of the type \[D^kf_k((ax+b)(cx+d)^{-1})=0,\hspace{1cm} k\in\mathbb{N},\] where $D$ is the Euclidean Dirac operator, and the associated conformal weight is \[J_k(cx+d)= \begin{cases} (cx+d)\ast |cx+d|^{-n-1+k}&\text{for }k=2p-1, |cx+d|^{-n+k}&\text{for }k=2p, \end{cases}\] where $\ast$ is the involution described in . ; What are the non-linear differential equations whose solution spaces are conformally invariant? ; Can their conformal weights also be expressed in terms of $cx + d$, and what relationship do these solutions have to the linear conformally-invariant differential equations? (J. Ryan)
