title: Dimensions of Planar Spline Spaces in Intermediate Degrees
field: mathematics
tier: prose
statement: For a triangulated planar polygonal subdivision $\Delta \subset \mathbb{R}^2$, let $S_d^r(\Delta)$ denote the vector space of piecewise polynomial splines on $\Delta$ of degree at most $d$ and global smoothness $C^r$. Determine the exact dimension $\dim S_d^r(\Delta)$ throughout the intermediate degree range $r + 1 \leq d \leq 3r$.
