title: Index Divisibility in p-Power Pullbacks of Curves
field: mathematics
tier: prose
statement: Let $X$ be a smooth projective curve of genus at least $2$ embedded in an abelian variety $A$ over a finite extension $k/\mathbb Q_p$, and assume that $X$ contains no torsion point of order prime to $p$. For all sufficiently large $n$, is the index of the inverse image of $X$ under $[p^n]:A\to A$ divisible by $p$?
