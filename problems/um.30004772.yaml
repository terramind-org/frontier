title: Compact Graph Representations of Permutation Groups
field: mathematics
tier: prose
statement: For permutation groups represented by graphs, determine which classes admit representations with $|V|+|E|$ of order $|\Omega|$, $|\Omega|\log|\Omega|$, or a low-order polynomial in $|\Omega|$; develop construction methods and fast algorithms; and determine whether low-index supergroups can be represented when the group itself cannot be compactly represented.
