title: A quantitative arcsine bound for permutation-walk occupation time
field: mathematics
tier: prose
statement: |-
  It is visibly truncated and is not a syntactically complete mathematical statement.

  The lost AIM text was not recovered literally. The intended formulation can nevertheless be identified, up to the harmless choice between a permutation of size \(n\) with \(n-1\) increments and one of size \(n+1\) with \(n\) increments, from the primary paper that arose from this workshop. Fang et al. define a uniform permutation

  \[
  \pi=(\pi_1,\ldots,\pi_{n+1})\in S_{n+1},\qquad
  X_k=\begin{cases}
  +1,&\pi_k<\pi_{k+1},\\
  -1,&\pi_k>\pi_{k+1},
  \end{cases}
  \]

  and \(S_0=0,\ S_k=\sum_{i=1}^kX_i\). They define the strict-positive occupation count

  \[
  \Gamma_n=\sum_{k=1}^n \mathbf 1\{S_k>0\}. \]

  Their uniform-permutation corollary proves

  \[
  \frac{\Gamma_n}{n}\ \Rightarrow\ Z,
  \qquad Z\sim\operatorname{Beta}(1/2,1/2),
  \]

  and the paper then asks for error bounds. This verifies the reconstruction used here; it does not show that the missing AIM characters had exactly this typography.
