statement: |-
  \section{Random-walk displacement on circle-packed doubling graphs}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $G$ be an infinite connected locally finite planar graph, or a planar triangulation, with uniform polynomial volume growth of exponent $d>2$: there are $0<c<C<\infty$ such that
  \[c r^d\le |B_G(v,r)|\le C r^d\quad\text{for every vertex }v\text{ and integer }r\ge1.\]
  Let $(X_t)_{t\ge0}$ be discrete-time simple random walk starting at a root $o$; distance means unit-edge graph distance.
  \paragraph{Statement recorded in the supplied source.}
  Prove that there exist $\alpha<1/2$ and $K<\infty$ such that $\mathbb E_o d_G(o,X_t)\le Kt^\alpha$ for all integers $t\ge1$. Is the bound valid with exponent $\alpha=1/d$? \sref{statement}{2}
  \subsection{Short English statement}
  Does random walk on a planar graph with uniformly more than quadratic polynomial growth move subdiffusively, with exponent at most the reciprocal of the growth dimension?
