title: The three-measure Katok Finsler flow
field: mathematics
tier: prose
statement: |-
  **Conjecture 9 (A. Katok).** The only ergodic probability measures for this example are the smooth measure and the measures supported on periodic orbits.

  “This example” is defined by the immediately preceding paragraph: Katok's 1973 non-reversible Finsler metric on \(S^2\), whose geodesic flow is ergodic and has two periodic phase-space orbits. The hyphen in “ex-ample” is only line breaking. The appended sentence beginning “3.3. Since a polygonal billiard ...” starts the next subsection and belongs with AIM-OTHER-0084, not Conjecture 9.

  The referent is an approximation-by-conjugation existence construction, not one uniquely specified formula. Katok starts with the round geodesic flow and an \(S^1\)-isometry action, constructs an ergodic energy-level Hamiltonian flow, proves there are no periodic trajectories outside the exceptional set, and identifies its closed geodesics with the round geodesics invariant under the isometry action. For axial rotations of \(S^2\), these are the two oriented phase-space lifts of the equator. Katok explicitly notes that orientation counting matters for a non-symmetric metric.

  This is not the elementary integrable irrational-wind/ellipsoid model also often called a Katok or Katok--Ziller example. Those explicit models transparently have two closed geodesics but have extra first integrals and are not the full-bundle ergodic construction selected by AIM.
