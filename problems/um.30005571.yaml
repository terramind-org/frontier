title: Eisenstein Maps and Modular Symbols in Cyclotomic K-Theory
field: mathematics
tier: prose
statement: Let $I$ be the Eisenstein ideal and let $\widetilde\Pi$ and $\Pi$ be the modular-symbol maps in the cyclotomic K-theory construction. Is $\widetilde\Pi$ Eisenstein, meaning $\widetilde\Pi\circ T=0$ for every $T\in I$? Is $\Pi\bmod I$ an isomorphism?
