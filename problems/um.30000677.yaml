title: Mordell–Lang for Semiabelian Varieties in Positive Characteristic
field: mathematics
tier: prose
statement: Let $L$ be an algebraically closed field of characteristic $p>0$, let $G$ be a semiabelian variety over $L$, let $X\subset G$ be an irreducible subvariety, and let $\Lambda\leq G(L)$ be a finite-rank subgroup. If $X(L)\cap\Lambda$ is Zariski dense in $X$, must $X$ be special, meaning that $X=g+h^{-1}(X_0)$ for some $g\in G(L)$, a surjective homomorphism $h:G'\to G_0$ from an algebraic subgroup $G'$ of $G$ to a semiabelian variety $G_0$ defined over $\overline{\mathbb F}_p$, and a subvariety $X_0\subset G_0$ defined over $\overline{\mathbb F}_p$?
