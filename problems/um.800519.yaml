title: Linear Systems and Eigenvalue Problems — Problem 28
field: mathematics
tier: prose
statement: |-
  Consider a general nonnormal matrix $A = V \Lambda V^{-1}$ with largest eigenvalue magnitude $\lambda_1$ and finite eigenvector condition number $\kappa_V = \|V\| \|V^{-1}\|$.
  Is there an algorithm that uses $\mathrm{poly}(\log(n\kappa_V),1/\epsilon)$ matrix-vector products with $A$ and returns $\lambda$ so that $|\lambda - \lambda'| \le \epsilon |\lambda_1|$, where $\lambda'$ is any eigenvalue of $A$ with $|\lambda' | \ge (1-\epsilon)\mleft|\lambda_1\mright|$?
