  \item[\hypertarget{source:statement:2}{S2}] Jonathan Rosenberg, \emph{Novikov's Conjecture} (2015), arXiv:1506.05408v1, Section 1, Definition 1.1 and Conjecture 1.2, pp. 3--4. \url{https://arxiv.org/abs/1506.05408v1}.
  \end{description}
