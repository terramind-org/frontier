title: Finite-Level Selmer Distributions from Isotropic Intersections
field: mathematics
tier: prose
statement: For fixed $e\geq1$, does the distribution of $\operatorname{Sel}_{p^e}(E)$ over elliptic curves $E$ equal, in the limit $n\to\infty$, the distribution of $Z\cap W$ for independently chosen random maximal isotropic direct summands $Z,W\in\operatorname{OGr}_n(\mathbb Z/p^e\mathbb Z)$?
