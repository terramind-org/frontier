title: Lifshitz Tails for Sign-Changing Alloy Potentials
field: mathematics
tier: prose
statement: For a sign-changing alloy-type random Schrödinger operator whose coupling distribution is supported on $[a,b]$, let $E_-(\lambda)$ denote the bottom Neumann ground-state energy at coupling $\lambda$. Do Lifshitz tails occur at the bottom of the spectrum unless the coupling distribution is Bernoulli and $E_-(a)=E_-(b)$?
