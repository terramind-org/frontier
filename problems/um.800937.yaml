title: Open Problems and Questions about Geodesics — Question 17 (Boundary rigidity problem)
field: mathematics
tier: prose
statement: |-
  The questions above are closely related to the boundary rigidity problem, which we now recall.
  Given a compact manifold $M$ with smooth boundary $N$, a
  Riemannian metric $g$ on $M$ induces a non-negative real valued function $d$
  on
  $N \times N$ where $d(p, q)$ is the distance in $(M, g)$ between $p$ and $q$.
  We call $(M,g)$ boundary rigid if a Riemannian manifold $g'$ on $M$
  that induces the same function on $N \times N$ must be isometric to $g'$.

  *What conditions on $M$, $N$ and $g$
  imply boundary rigidity?*
