title: Uniform Torsion Bounds for Chow Groups in Families
field: mathematics
tier: prose
statement: For a family $\pi:X\to S$ and a degree bound $d$, does there exist a positive integer $C$, depending only on $\pi$ and $d$, such that $C\,\operatorname{CH}^i(X_s)_{\mathrm{tors}}=0$ for every number field $k/\mathbb{Q}$ of degree at most $d$, every $i>0$, and every $k$-point $s\in S$?
