statement: |-
  \section{The Quantitative Pyjama Covering Problem}\label{statement}


  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Unless a section says otherwise, $\N=\{1,2,\ldots\}$,
  $\Z$ is the ring of integers, $\Q,\R,\C$ are the rational, real, and complex
  fields, $[N]=\{1,\ldots,\lfloor N\rfloor\}$, and $\log$ is the natural
  logarithm. For real functions of a parameter tending to infinity,
  $f\ll g$ and $f=O(g)$ mean $|f|\leq Cg$ eventually for some fixed $C$;
  $f\gg g$ reverses this comparison; $f=o(g)$ means $f/g\to0$;
  $f\sim g$ means $f/g\to1$; and $f\asymp g$ means both order bounds.
  A subscript on $O$ or $\ll$ specifies allowed constant dependence.
  The expression $n^{o(1)}$ in an upper bound means growth smaller than
  $n^\epsilon$ for each fixed $\epsilon>0$. Local definitions govern any
  exception, finite-field convention, or use of the same symbol for another
  object. An asymptotic claim is not automatically an effective algorithm.



  For $0<\varepsilon<1/2$, let $P_\varepsilon=\{(x,y):\min_{m\in\Z}|x-m|\leq\varepsilon\}$. A permitted motion is a rotation $R_\theta$ about the origin, with no translation. Let $m(\varepsilon)$ be the minimum size of a finite family of angles for which $\bigcup_j R_{\theta_j}P_\varepsilon=\R^2$, taking $m=\infty$ if none exists. Determine this number or its sharp growth as $\varepsilon\downarrow0$. \sref{statement}{1} \sref{statement}{2}

  \paragraph{Statement recorded in the supplied source.}
  How many rotated (about the origin) copies of the "pyjama set" $\{(x, y) \in \mathbb{R}^2 : \operatorname{dist}(x, \mathbb{Z}) \leq \varepsilon\}$ are needed to cover $\mathbb{R}^2$? \sref{statement}{1}

  \paragraph{Residual task reported by the archive.}

  The embedded review (2026-08-17) records: Obtain substantially smaller upper bounds, such as epsilon\textasciicircum{}{-C}, and nontrivial matching lower bounds for the minimum covering number. \sref{statement}{1}

  \subsection{Short English statement}

  How many differently rotated families of narrow periodic strips are needed to cover the whole plane?

