statement: |-
  \section*{Power improvement over the planar unit-distance exponent four thirds}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Do absolute constants $\epsilon >0$ and $C>0$ exist such that every n-point set in $R^2$ has at most C $n^{4/3-\epsilon }$ unordered pairs at Euclidean distance one?
  \subsection{Short English statement}
  Do absolute constants $\epsilon >0$ and $C>0$ exist such that every n-point set in $R^2$ has at most C $n^{4/3-\epsilon }$ unordered pairs at Euclidean distance one?
