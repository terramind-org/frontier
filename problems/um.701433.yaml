title: Kourovka Notebook Problem 18.4
field: mathematics
tier: prose
statement: |-
  (A. Rhemtulla, S. Sidki). a) Is a group of the form $G=ABA$ with cyclic subgroups $A$ and $B$ always soluble? (This is known to be true if $G$ is finite.)

  b) The same question when in addition $A$ and $B$ are conjugate in $G$.
