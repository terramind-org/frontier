title: Representation of Quadratic Forms by Lattices and Genera
field: mathematics
tier: prose
statement: For a lattice $\Lambda$ and $T_d=\{T:\det(T)=d\}$, study which forms in subsets $S_d\subseteq T_d$ are represented by $\Lambda$ or by every $\Lambda'\in\operatorname{gen}(\Lambda)$, determine how many $T\in T_d$ a given $\Lambda$ represents, and determine the average and asymptotics of $r(\Lambda,T)$ over $T\in T_d$.
