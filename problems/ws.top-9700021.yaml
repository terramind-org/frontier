  \item[\hypertarget{source:9700021:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, record 9700021 (AMR-096-0021). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:9700021:2}{S2}] David J. Aldous, \emph{Empires and Percolation}, problem discussed with Vlada Limic in 2001, Process definition and first PROBLEM. \url{https://www.stat.berkeley.edu/~aldous/Research/OP/empires.html}.
