title: Dihedral Rigidity and Offsets of Nonconvex Polytopes
field: mathematics
tier: prose
statement: For a polytope with fixed combinatorics, are all face angles determined by its dihedral angles in the nonconvex case? If $P$ is a nonconvex three-dimensional polytope with spherical boundary, does an offset polytope $P_\varepsilon$ exist for every sufficiently small $\varepsilon>0$, with each face translated outward by $\varepsilon$ and no additional faces?
