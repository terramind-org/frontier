id: um.30001521
title: Free Toral Rank versus Free $p$-Rank
field: mathematics
tier: prose
statement: For a finite connected complex $X$ whose fundamental group is abelian and acts trivially on higher homotopy, and whose rational homotopy is finite-dimensional, compare $$\operatorname{rk}_T(X)=\max\{r:(S^1)^r\text{ acts freely on }X\}$$ with $$\operatorname{rk}_p(X)=\max\{r:(\mathbb Z/p)^r\text{ acts freely on }X\}$$.
