title: Foliations and Diffeomorphism Groups — Question 14
field: mathematics
tier: prose
statement: Consider a $4$-manifold endowed with a codimension-$1$ foliation $\mathcal{F}$. Suppose moreover that there is a plane field $\xi \subset T\mathcal{F}$ that is a leafwise contact structure. Assume that $\xi$ splits as a sum of line fields. Can this data be perturbed to an Engel structure?
