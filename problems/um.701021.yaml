title: Kourovka Notebook Problem 14.36
field: mathematics
tier: prose
statement: |-
  A group $G$ is called a *$T$-group* if every
  subnormal subgroup of $G$ is normal, while $G$ is said to be a {\it
  $ \overline{\! T}$-group} if all of its subgroups are $T$-groups.
  Is it true that every non-periodic locally graded $ \overline{\!
  T}$-group must be abelian?
