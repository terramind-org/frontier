title: Borderline Sobolev Blowup Criteria for Hyperdissipative Flow
field: mathematics
tier: prose
statement: |-
  For a possible finite-time blowup of the $d$-dimensional hyperdissipative flow, does the borderline conjecture

  $$\lVert u(t)\rVert_{H^{(d+2)/6}(\mathbb R^d)}^2\to\infty\quad\text{as }t\to t_*$$

  hold? Equivalently, is finiteness of this norm on $[0,T]$ sufficient for regularity?
