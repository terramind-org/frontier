title: Pro-l Congruence Subgroup Problem for Mapping Class Groups
field: mathematics
tier: prose
statement: Let $\Gamma_{g,r}$ be the mapping class group of a surface of genus $g$ with $r$ punctures, and for a prime $\ell$ let $\rho^{\ell\text{-csp}}_{g,r}$ denote the pro-$\ell$ congruence-subgroup representation induced by the action of $\Gamma_{g,r}$ on the pro-$\ell$ completion of the surface fundamental group. For which $(g, r, \ell)$ is $\rho^{\ell\text{-csp}}_{g,r}$ injective?
