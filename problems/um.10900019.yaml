title: 3.11 (Walsh) — Unbounded CAT(0) cubical dimension
field: mathematics
tier: prose
statement: The CAT(0) cubical dimension of a group $G$ is the least dimension of a CAT(0) cubical space on which $G$ acts geometrically. Is there a sequence of closed hyperbolic $3$-manifold groups whose CAT(0) cubical dimensions tend to infinity? More generally, is there a sequence of CAT(0) groups for which the difference between CAT(0) dimension and CAT(0) cubical dimension tends to infinity?
