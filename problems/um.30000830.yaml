title: Spectral Remainder Bounds for Liouville Tori
field: mathematics
tier: prose
statement: Let $M$ be a torus with a Liouville metric. Do the Weyl-law remainder $R(\lambda)$, the pointwise remainder $R_x(\lambda)$, and the off-diagonal spectral function $N_{x,y}(\lambda)$ all satisfy $O(\lambda^{1/2+\varepsilon})$ for every $\varepsilon>0$ and every pair $x\neq y$ in $M$?
