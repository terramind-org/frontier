title: Linear Systems and Eigenvalue Problems — Problem 40
field: mathematics
tier: prose
statement: |-
  Let $\Pi_{2^m}^*$ be the set of univariate polynomials whose corresponding matrix function can be computed with $m$ matrix-matrix multiplications and an arbitrary number of matrix additions and scalings.
  We consider the problem of determining the best such polynomial that approximates the sign function in $I:=[-1,-\delta]\cup [\delta,1],$
  \begin{equation}
  \epsilon_{m}^*=\min_{p\in\Pi_{2^m}^*} \max_{x\in I} |p(x)-\mathrm{sign}(x)|.
  \end{equation}

  What is the asymptotic error $\epsilon_m^*$ as a function of $m$ and $\delta$?
