title: Embedding Classification of Piecewise-Linear Interval Groups
field: mathematics
tier: prose
statement: For finitely generated subgroups of Thompson's group $F$ and of $\mathrm{PL}_o(I)$ ordered by homomorphic embedding, is there a substantial classifiable initial segment and where does the quasiorder become intractable? Which finitely generated subgroups are comparable with every finitely generated subgroup, and does $F$ have this property; must a subgroup of $\mathrm{PL}_o(I)$ not containing $F$ be elementary amenable; and are the finitely generated subgroups of $F$ well quasiordered?
