id: um.30002650
title: Knot Volume Conjecture
field: mathematics
tier: prose
statement: |-
  For every knot $K$, does the volume conjecture hold in the form

  $$\lim_{N\to\infty}\frac{\log\left\lvert J_N\!\left(K;\exp(2\pi i/N)\right)\right\rvert}{N}=\frac{\operatorname{Vol}(S^3\setminus K)}{2\pi},$$

  where $J_N$ is the $N$-colored Jones polynomial and $\operatorname{Vol}$ is the simplicial volume of the knot complement?
