title: Immediate Descendants of Elliptic-Curve p-Groups
field: mathematics
tier: prose
statement: For which pairs $(E,P)$ does the associated class-two group $G_{E,P}(\mathbb{F}_p)$ admit a central extension $1\to\mathbb{Z}/p\mathbb{Z}\to G\to G_{E,P}(\mathbb{F}_p)\to1$ with $|G|=p^{10}$ and nilpotency class three? Determine whether the total number of immediate descendants, summed over the relevant isomorphism classes, is a PORC function of $p$.
