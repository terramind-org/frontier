title: Extremal Independent-Neighborhood Hypergraphs of Uniformity Five and Six
field: mathematics
tier: prose
statement: "Let $f(n,k)$ be the maximum number of edges in an $n$-vertex $k$-uniform hypergraph whose every neighborhood is independent. Let $b(n,k)$ be the maximum number of edges in an odd $n$-vertex $k$-uniform hypergraph, where odd means that some bipartition $X\\cup Y$ meets every edge in an odd number of vertices of $Y$. Conjecture: for $k\\in\\{5,6\\}$ and all sufficiently large $n$, $f(n,k)=b(n,k)$."
