title: The Haldane Conjecture on Spectral Gaps of Antiferromagnetic Quantum Spin Chains
field: physics
tier: prose
statement: |-
  \section*{\texorpdfstring{The Haldane Conjecture on Spectral Gaps of Antiferromagnetic Quantum Spin Chains}{The Haldane Conjecture on Spectral Gaps of Antiferromagnetic Quantum Spin Chains}}\label{30006733}
  \subsection{Definitions and mathematical statement}
  A spin-$S$ site has Hilbert space ${\mathbb{C}}^{2S+1}$ and angular-momentum operators $S^x,S^y,S^z$. In the usual even-length periodic approximation, the antiferromagnetic chain is
  \[
   H_L=J\sum_{j=1}^{L}\mathbf S_j\cdot\mathbf S_{j+1},\qquad J>0,\quad\mathbf S_{L+1}=\mathbf S_1.
  \]
  Let $\Delta_L$ be the energy difference between the ground energy and the next distinct energy. The proposed thermodynamic behavior is a positive gap for integer $S\ge1$, and gaplessness for $S\in\tfrac12+{\mathbb{Z}}_{\ge0}$. Periodic or infinite-chain conventions avoid confusing boundary edge modes with a bulk gap. The precise infinite-volume spectral statement is the one in the source.
  \par\smallskip\textit{Formulation and concept references:} \href{https://re.public.polimi.it/retrieve/2332a1fb-6d7b-4ef7-a66f-1cbb552b76f8/lemm-lucia-2025-on-the-critical-finite-size-gap-scaling-for-frustration-free-hamiltonians.pdf}{[S1]}.

  \subsection{Short English statement}
  Does the isotropic antiferromagnetic Heisenberg chain have a bulk energy gap exactly for integer, rather than half-integer, spin?
  \subsection{Sources}
  \begin{itemize}
  \item[S1]Marius Lemm and Angelo Lucia, On the critical finite-size gap scaling for frustration-free Hamiltonians, Review of Mathematical Physics 37 (2025), introduction.
  \url{https://re.public.polimi.it/retrieve/2332a1fb-6d7b-4ef7-a66f-1cbb552b76f8/lemm-lucia-2025-on-the-critical-finite-size-gap-scaling-for-frustration-free-hamiltonians.pdf}.
  \textit{Formulation source.}
  \end{itemize}
