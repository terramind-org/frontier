  \section{Convexity of Injectivity Loci Under MTW}\label{30000998}
  {\small UnsolvedMath ID 30000998 · Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For a complete Riemannian manifold satisfying the Ma--Trudinger--Wang curvature condition for squared distance, must every tangent injectivity locus be convex? At $x$, this locus consists of tangent vectors for which the radial geodesic remains minimizing up to its endpoint before the cut locus; convexity is in the vector space $T_xM$.
  \par\smallskip\textit{Formulation references:} \sref{30000998}{1}, \sref{30000998}{2}.
  \subsection{Short English statement}
