title: Polar Cylinders and Affine Complements of Del Pezzo Surfaces
field: mathematics
tier: prose
statement: For a del Pezzo surface $S$ in its ambient weighted projective space $P$, is the absence of a $(-K_S)$-polar cylinder equivalent to the affine complement $P\setminus S$ being non-cylindrical? The implication from no polar cylinder to non-cylindricity is known.
