title: Optimal Descent Degrees in Reduced Hurwitz Spaces
field: mathematics
tier: prose
statement: Let $\Pi:H(C)\to H^{\mathrm{rd}}(C)$ be the quotient from the Hurwitz space of $G$-covers with inertia data $C$ to the reduced Hurwitz space. Given $p^{\mathrm{rd}}\in H^{\mathrm{rd}}(C)(k)$, find an optimal upper bound for $m_k(p^{\mathrm{rd}})=\min_{p\in\Pi^{-1}(p^{\mathrm{rd}})}[k(p):k]$.
