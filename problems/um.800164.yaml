title: Moments of L-functions — Moments of the Riemann zeta function — Problem 14
field: mathematics
tier: prose
statement: |-
  Can the conjectural lower order terms for $I_k(T)$ (due to CFKRS [CFKRS] and Diaconu-Goldfeld-Hoffstein [DGH]) be recovered by refining the splitting conjecture in the Gonek-Hughes-Keating [GHK] hybrid Euler-Hadamard product? \\
  (Anurag Sahay, Rochester)
