title: Movable versus divisorial canonicity in degrees four and five
field: mathematics
tier: prose
statement: |-
  The record comes from Problem 17 (Cheltsov) in the AIM workshop list *Numerical
  invariants of singularities and higher-dimensional algebraic varieties*.

  Let \(X\) be a smooth Fano variety with \(\operatorname{Pic}X=\mathbb Z\). Is
  birational superrigidity equivalent to

  \[
    \tag{1}
    \text{for every movable }\mathcal M\subset |-mK_X|,\qquad
    \left(X,\frac1m\mathcal M\right)\text{ is canonical}
  \]

  for every \(m>0\)? Here “movable” is the phrase “with no fixed components” in
  the source. A second condition is

  \[
    \tag{2}
    \text{for every }D\in |-mK_X|,\qquad
    \left(X,\frac1mD\right)\text{ is canonical (or plt)}
  \]

  for every \(m>0\). The note then says that if (1) and (2) hold, the only Mori
  fibre structures on \(X\times\mathbb P^1\) are the two projections, and adds:
  “More precisely, every birational map from \(X\times\mathbb P^1\) to another
  Mori fiber space is an isomorphism.”  Finally it cites Pukhlikov for (1) and (2)
  on a sufficiently general hypersurface

  \[
    X_N\subset\mathbb P^N,\qquad \deg X_N=N,\qquad N\geq 6,
  \]

  and asks what happens for \(N=4\) and \(N=5\). Thus \(X_4\) is a quartic
  threefold and \(X_5\) is a quintic fourfold.

  They are treated separately below. All
  varieties are over \(\mathbb C\).
