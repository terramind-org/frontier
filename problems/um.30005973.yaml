title: Stable Reduction of Plane Quartics from Cayley Octads
field: mathematics
tier: prose
statement: Prove that the combinatorial data of the configuration of the eight points in a Cayley octad determines the stable reduction type of the associated smooth plane quartic, analogously to the way a cluster picture determines stable reduction in the hyperelliptic case.
