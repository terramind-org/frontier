title: Is it possible to choose 2n points in an n by n grid in the plane so that no three are collinear
field: mathematics
tier: prose
statement: "Dudeney: Is it possible to choose 2n points in an n by n grid in the plane so that no three are collinear? Conjecture: no. In fact, it is conjectured that the answer is still \"no\" unless 2 is changed to something less than Ŕ/\x1a3 = 1.813799.... However, this problem dates back to 1917 and little is known about it. See this."
