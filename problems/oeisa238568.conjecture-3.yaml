title: Number of positive integers $k < n$ such that $n^2 - \pi(k n)$ is prime (conjecture_3)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): For any integer $n > 6$, there is a positive integer $k < n$ with
  $n^2 + \pi(k n) - 1$ prime.
