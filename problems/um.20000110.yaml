statement: "**Recovered question.** Fix \\(n\\geq1\\) and \\(d\\geq 2\\lceil(n+3)/3\\rceil\\). Is there a number \\(P(n,d)\\) such that, for every prime \\(p>P(n,d)\\), the very general smooth degree-\\(d\\), \\(n\\)-dimensional hypersurface \\(X_d\\subset\\mathbb P^{n+1}\\) in characteristic \\(p\\) is (i) irrational, (ii) not stably rational, and (iii) not ruled?"
