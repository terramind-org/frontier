title: Kourovka Notebook Problem 17.128
field: mathematics
tier: prose
statement: |-
  Let $T$ be a finite $p$-group admitting an
  elementary abelian group of automorphisms $A$ of order $p^{2}$
  such that in the semidirect product $P=TA$ every element of
  $P\setminus T$ has order $p$. Does it follow that $T$ is of
  exponent $p$?
