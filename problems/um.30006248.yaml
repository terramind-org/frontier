title: Optimal Character Bounds for Almost Quasisimple Groups
field: mathematics
tier: prose
statement: Let $G$ be a finite almost quasisimple group and $g\in G\setminus Z(G)$. Find an explicit exponent $0\leq\alpha(g)<1$, as small as possible, such that $|\chi(g)|\leq\chi(1)^{\alpha(g)}$ for every irreducible complex character $\chi$ of $G$.
