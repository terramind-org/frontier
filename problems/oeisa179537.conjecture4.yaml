id: oeisa179537.conjecture4
title: Central binomial sum $a(n) = \sum_{k=0}^n \binom{n}{k}^2 \binom{n-k}{k}^2 (-16)^k$ (conjecture4)
field: mathematics
tier: proof
statement: |-
  $\sum_{k=0}^{p-1} (42k + 37) (-1)^k a(k) \equiv p(21(p/7) + 16) \pmod{p^2}$ for any prime $p \ne 7$.
  - _Zhi-Wei Sun_, Jul 17 2010
