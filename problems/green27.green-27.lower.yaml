lean:
  module: FormalConjectures.GreensOpenProblems.«27»
  decl: Green27.green_27.lower
  statement: |-
    theorem green_27.lower :
        (lowerBest =o[primesAtTop] green_27.lower.answer) ∧ (green_27.lower.answer =O[primesAtTop] m)
  context:
    - open Green27
    - open Green27.green_27
    - open Asymptotics Filter
  definitions:
    - name: Green27.m
      kind: def
      text: |-
        /--
        This is $m(p)$ in [Be23]: the size of the smallest set $A \subset \mathbb{Z} / p\mathbb{Z}$ (with
        at least two elements) for which no element in the sumset $A + A$ has a unique representation.
        -/
        noncomputable def m (p : ℕ) : ℝ :=
          (sInf { (A.card) | (A : Finset (ZMod p)) (_ : 2 ≤ A.card) (_ : HasNoUniqueRepresentation A) } : ℝ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/GreensOpenProblems/27.lean#L44
    - name: Green27.primesAtTop
      kind: def
      text: |-
        /-- `atTop` restricted to prime numbers. -/
        def primesAtTop : Filter ℕ := atTop ⊓ 𝓟 {p : ℕ | p.Prime}
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/GreensOpenProblems/27.lean#L51
    - name: Green27.lowerBest
      kind: def
      text: |-
        /-- Bedert's lower bound [Be23, Theorem 3]. This was the best known bound when Green's list was
        written; it has since been improved, see `green_27.lower`. -/
        noncomputable def lowerBest (p : ℕ) : ℝ :=
          (Real.sqrt (Real.log (Real.log (Real.log (p : ℝ)))) /
           Real.log (Real.log (Real.log (Real.log (p : ℝ))))) * Real.log (p : ℝ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/GreensOpenProblems/27.lean#L54
    - name: Green27.green_27.lower.answer
      kind: def
      text: "noncomputable def green_27.lower.answer : ℕ → ℝ := fun p ↦ Real.log p * Real.log (Real.log p)"
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/GreensOpenProblems/27.lean#L74
