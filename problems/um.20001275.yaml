title: The sharp symmetric 2n-vertex case of the Euclidean-ball vertex-index conjecture
field: mathematics
tier: prose
statement: |-
  Prove that the vertex index of the \(n\)-dimensional Euclidean ball \(B_2^n\) is \(2n^{3/2}\), where the vertex index of a centrally-symmetric convex body \(K=-K\subset\mathbb R^n\) is defined as
  \[
  \operatorname{vein}(K)=\inf\left\{\sum_i\|p_i\|_K:K\subset\operatorname{conv}\{p_i\}\right\}.
  \]
