title: Rank-one monoidal equivalence and the graph-generation bottleneck
field: mathematics
tier: prose
statement: |-
  Prove that MF$((\mathscr{X}^{\mathrm{big}})^{\mathrm{stable}},w)$ is
  equivalent as a monoidal category to
  K$^b(\mathbb{S}\mathrm{Bim}_n)$, where
  $\mathscr{X}^{\mathrm{big}}=\mathfrak g\times G\times\mathfrak n
  \times G\times\mathfrak n$.
