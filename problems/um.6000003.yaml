title: Dually Flat Structures on Riemannian Manifolds
field: mathematics
tier: prose
statement: Given a Riemannian manifold $(M,g)$, can one always introduce a symmetric $(0,3)$-tensor $T$ so that $(M,g,\nabla,\nabla^*)$ is dually flat? If the construction is not unique, characterize the class of resulting spaces.
