title: Connectivity and Hamilton Circles in Locally Finite Graphs
field: mathematics
tier: prose
statement: Does there exist a function $f$ such that every locally finite graph whose vertices and ends have degree at least $f(k)$ contains a $k$-connected subgraph? Does every $4$-connected planar locally finite graph, and the square of every $2$-connected locally finite graph, have a Hamilton circle?
