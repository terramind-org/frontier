title: The Correct Parameter for Local Graph Removal
field: mathematics
tier: prose
statement: For every graph $H$, is there an integer $a(H)$ such that an $n$-vertex graph is $o(1)$-close to being $H$-free in $L_\infty$ if and only if every set of $a(H)$ vertices extends to $o(n^{v(H)-a(H)})$ copies of $H$? Is the proposed local-cover parameter the correct value of $a(H)$?
