title: Kourovka Notebook Problem 6.1
field: mathematics
tier: prose
statement: |-
  A subgroup $H$
  of an arbitrary group $G$ is said to be *$ C $-closed* if
  $H=C^2(H)=C(C(H))$, and *weakly $C $-closed* if $C^2(x) \leq
  H$ for any element $x$ of $H$. The structure of the finite groups
  all of whose proper subgroups are $ C $-closed was studied by
  Gasch\"utz. Describe the structure of the locally finite groups
  all of whose proper subgroups are weakly $C $-closed.
