id: erdos604.erdos-604.variants.sqrt-log
title: "Erdős Problem 604 (variant: sqrt_log)"
field: mathematics
tier: proof
statement: |-
  Given $n$ distinct points $A\subset\mathbb{R}^2$, must there be a point $x\in A$ such that
  $$\#\{ d(x,y) : y \in A\} \gg \frac{n}{\sqrt{\log n}}?$$
