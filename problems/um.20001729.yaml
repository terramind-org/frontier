title: A BCFT shortcut on equilibrium slopes and an obstruction at infinity
field: mathematics
tier: prose
statement: Can one find a simplified proof of Burns-Gelfert in Burns--Gelfert (*Discrete Contin. Dyn. Syst.* 34, 2014, MR3124716, on the Lyapunov spectrum and thermodynamics of geodesic flows of rank-$1$ nonpositively curved surfaces) using Burns--Climenhaga--Fisher--Thompson (*Geom. Funct. Anal.* 28, 2018, MR3856792, on unique equilibrium states for geodesic flows in nonpositive curvature under the pressure-gap condition $P_{\mathrm{sing}}(\varphi) < P(\varphi)$), possibly with stronger conclusions? Similarly for the results of Paulin-Pollicott-Schapira in Paulin--Pollicott--Schapira (*Astérisque* 373, 2015, MR3444431, on equilibrium states in negative curvature).
