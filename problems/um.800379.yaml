title: Open Problems in Arithmetic Dynamics — Conjecture 2
field: mathematics
tier: prose
statement: |-
  In view of Northcott's theorem, it is natural to inquire as to the
  possible size of the finite set $\operatorname{PrePer}\bigl(f,\mathbb{P}^N(K)\bigr)$, which
  leads to the following fundamental conjecture.

  Fix integers $N\ge1$, $d\ge2$, and $D\ge1$. There is a constant
  $C(N,d,D)$ such that for all degree $d$ morphisms $f:\mathbb{P}^N\to\mathbb{P}^N$
  defined over a number field $K$ of degree $[K:\mathbb{Q}]=D$, the number
  of $K$-rational preperiodic points is uniformly bounded,
  \[
  \#\operatorname{PrePer}\bigl(f,\mathbb{P}^N(K)\bigr) \le C(N,d,D).
  \]
