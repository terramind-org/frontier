lean:
  module: FormalConjectures.ErdosProblems.«456»
  decl: Erdos456.erdos_456.parts.ii
  statement: |-
    theorem erdos_456.parts.ii :
        ∃ A : Set ℕ, Tendsto (fun N ↦ (count (· ∈ A) N : ℝ) / (N : ℝ)) atTop (𝓝 1) ∧
          Tendsto (fun n ↦ (p n : ℝ) / (m n : ℝ)) (atTop ⊓ 𝓟 A) atTop
  context:
    - open Erdos456
    - open Erdos456.erdos_456
    - open Erdos456.erdos_456.parts
    - open Nat Filter
    - open scoped Topology Asymptotics
    - open scoped Classical
  definitions:
    - name: Erdos456.p
      kind: def
      text: |-
        /--
        Let $p_n$ be the smallest prime $\equiv 1\pmod{n}$.
        -/
        noncomputable def p (n : ℕ) : ℕ :=
          sInf { k | k.Prime ∧ k ≡ 1 [MOD n] }
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/456.lean#L35
    - name: Erdos456.m
      kind: def
      text: |-
        /--
        Let $m_n$ be the smallest integer such that $n\mid \phi(m_n)$.
        -/
        noncomputable def m (n : ℕ) : ℕ :=
          sInf { k | 0 < k ∧ n ∣ totient k }
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/456.lean#L41
