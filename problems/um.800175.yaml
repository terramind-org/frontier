title: Moments of L-functions — Moments of the Riemann zeta function — Problem 26
field: mathematics
tier: prose
statement: |-
  Investigate the dependence of zero-density on moments of the zeta-function? More specifically, Ingham’s zero-density estimate makes use of the fourth moment $\int_{T}^{2T} |\zeta(1/2 + it)|^{4} dt$. Can we use other non-trivial moments (like, say, Heath-Brown’s estimate of the 12th moment) in such zero-density results, and can we generalise this to other L-functions?

  (Timothy Trudgian, UNSW Canberra)

  \section*{Bounds for $L$-functions}
