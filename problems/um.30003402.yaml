id: um.30003402
title: Consistency and Structure of Strongly Surjective Linear Orders
field: mathematics
tier: prose
statement: For strongly surjective linear orders, is it consistent that one has cardinality greater than $\aleph_2$, or that one contains no minimal strongly surjective suborder? Does $\mathrm{MA}_{\aleph_1}$ imply the existence of an uncountable strongly surjective order $L\subseteq\mathbb R$? If $L$ is strongly surjective, must $L\setminus\{x\}$ be strongly surjective for every $x\in L$? Do strongly surjective Countryman lines exist under $\mathrm{MA}_{\aleph_1}$ or PFA?
