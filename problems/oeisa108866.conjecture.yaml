schema: 1
id: oeisa108866.conjecture
title: Numerator of $\sum_{k=1}^n 2^k/k$.
field: mathematics
tier: proof
statement: |-
  Conjecture: for $n > 3$,
  $\textrm{numerator}(-2/n + \sum_{k=1}^{n} \frac{2^k}{k}) == 0 (\textrm{mod} n^2)$
  if and only if n is prime.
