title: Weak Knaster Conjecture
field: mathematics
tier: prose
statement: Does there exist an integer $n=n(\ell)$ such that for every set of $\ell$ points $X=\{x_{1},\ldots,x_{\ell}\}$ on $S^{n-1}$ and every continuous $f:S^{n-1}\to\mathbb{R}$, some rotation $\rho\in O(n)$ satisfies $f(\rho x_{1})=\cdots=f(\rho x_{\ell})$?
