  decl: Erdos342.erdos_342.parts.iii
  statement: |-
    theorem erdos_342.parts.iii :
        ∀ a : ℕ → ℕ, IsUlamSequence a →
          Set.upperDensity (Set.range a) = 0
  context:
    - open Erdos342
    - open Erdos342.erdos_342
    - open Erdos342.erdos_342.parts
    - open Nat Set Filter
    - open scoped Topology
  definitions:
    - name: Erdos342.IsUlamSequence
      kind: def
      text: |-
        /-- `IsUlamSequence a` means that $a$ is the Ulam sequence (OEIS A002858):
        $a(0) = 1$, $a(1) = 2$, and for each $n \geq 2$, $a(n)$ is the least integer
        greater than $a(n-1)$ that has a unique representation as $a(i) + a(j)$
        with $i < j < n$. -/
        def IsUlamSequence (a : ℕ → ℕ) : Prop :=
          a 0 = 1 ∧ a 1 = 2 ∧
          ∀ n, 2 ≤ n →
            a (n - 1) < a n ∧
            UniqueUlamSum a n (a n) ∧
            ∀ m, a (n - 1) < m → m < a n → ¬ UniqueUlamSum a n m
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/342.lean#L42
