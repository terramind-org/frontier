title: Kühnel Conjecture for Embedded Simplicial Skeletons
field: mathematics
tier: prose
statement: "Kühnel's conjecture: if the k-skeleton $\\Delta_n^{(k)}$ embeds in a compact $(k-1)$-connected 2k-manifold with kth Betti number b over $\\mathbb{Z}_2$, then $\\binom{n-k-1}{k+1}\\leq\\binom{2k+1}{k+1}b$."
