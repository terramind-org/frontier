  definitions:
    - name: OeisA233566.a
      kind: def
      text: |-
        /--
        Number of primes $p < n$ such that $p \phi(n - p) - 1$ is also prime,
        where $\phi$ is Euler's totient function.
        -/
        def a (n : ℕ) : ℕ :=
          Finset.card <| Finset.filter (fun p =>
            p.Prime ∧ Nat.Prime (p * (n - p).totient - 1)
          ) (Finset.range n)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/OEIS/233566.lean#L34
