title: Homeomorphism Conjecture for Moduli of Fundamental Groups
field: mathematics
tier: prose
statement: For pointed stable curves of type $(g,n)$ over algebraically closed fields of characteristic $p>0$, is the natural continuous map $\pi_{g,n}^{\mathrm{adm}}:\mathcal M_{g,n}^{\mathrm{adm}}\twoheadrightarrow\Pi_{g,n}$ from Frobenius-equivalence classes of curves to isomorphism classes of their admissible fundamental groups a homeomorphism?
