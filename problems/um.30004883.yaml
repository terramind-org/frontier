title: Primitive Generators of Preprojective Cohomological Hall Algebras
field: mathematics
tier: prose
statement: Let $Q$ be a quiver with preprojective algebra $\Pi_Q$, let $\mathcal{A}_{\Pi_Q}$ be its cohomological Hall algebra (CoHA), and for a dimension vector $d$ let $\operatorname{IC}(X_d)$ denote the intersection cohomology of the coarse moduli space $X_d$ of semisimple $\Pi_Q$-modules of dimension vector $d$. Does $\operatorname{IC}(X_d)$ form a complete space of primitive degree-$d$ generators for the preprojective cohomological Hall algebra $\mathcal{A}_{\Pi_Q}$?
