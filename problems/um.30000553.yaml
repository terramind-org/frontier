title: Conjugacy-Class Growth in Locally Symmetric Lattices
field: mathematics
tier: prose
statement: For a symmetric space $X$ and a uniform or nonuniform lattice $\Gamma$, what is the growth rate of the number $P(T)$ of conjugacy classes in $\Gamma$ of length less than $T$, especially for $SL(n,\mathbb Z)<SL(n,\mathbb R)$?
