title: Monotonicity of Opinion Distributions in Median Dynamics
field: mathematics
tier: prose
statement: In median dynamics on a graph $G=(V,E)$, each vertex starts with an independent uniform opinion in $[0,1]$ and updates at rate one to the median of its neighbors' opinions, including its own opinion when the degree is even. If $\mu_t(x)$ is the marginal opinion measure at vertex $x$ at time $t$, is $t\mapsto\mu_t(x)$ monotone non-decreasing for every $x\in V$ and every $\alpha>1/2$?
