title: Boundaries of Groups and Kleinian Groups — Problem 70
field: mathematics
tier: prose
statement: For any proper metric space it is possible to associate a kind of incidence geometry at inﬁnity via horofunctions, halfspaces and their limits called stars. For the CAT(0) case, this structure is intimately connected with the Tits geometry, and for Teichm¨ uller space it should relate well with the curve complex. In which situations do homomorphisms induce “incidence preserving” maps between these geometries at inﬁnity? Same problem for quasi-isometries.
