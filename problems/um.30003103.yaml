title: Refined Local Langlands Correspondence for Quasi-Split Groups
field: mathematics
tier: prose
statement: For a quasi-split connected reductive group $G$ over a local field and a tempered Langlands parameter $\varphi$, does the associated packet admit an injective Whittaker-dependent parametrization by the irreducible representations of the component group of the centralizer of $\varphi$, bijective over non-Archimedean local fields, with the trivial representation corresponding to the unique Whittaker-generic constituent and with the expected endoscopic character identities?
