title: Finite-torus stationarity and the infinite-bulk gap
field: mathematics
tier: prose
statement: |-
  **Interacting particle systems**

  Bulk of \(q\)-Whittaker \(2d\) dynamics. Invariant measure.

  The AIM page was unavailable (HTTP 502 on 2026-08-12), and nearby records only confirm that this item belongs to the q-TASEP/q-Whittaker interacting-particle-system cluster of the workshop. The fragment omits the state space, update rule, boundary conditions, and meaning of “bulk.” There are at least three plausible readings:

  1. **Triangular-array reading.** The continuous-time push-block dynamics on Gelfand--Tsetlin arrays from Macdonald-process theory. Its q-Whittaker measures are evolving fixed-time laws, not automatically invariant laws.
  2. **Periodized bulk reading.** Transplant the same local rule away from the triangular boundary to interlacing particles on a two-dimensional torus and find a stationary measure. This is the reading most directly matched by Corwin--Toninelli (2016).
  3. **Infinite-plane reading.** Construct a translation-invariant process and invariant Gibbs measure on an infinite interlacing array, or obtain these as a thermodynamic limit of tori.

  The finite-torus reading was solved after the workshop. The infinite-plane reading is stronger and is not a formal corollary because a jump may push a vertically aligned string whose length grows with the volume. This report states the finite theorem precisely enough to identify the model and gives a rigorous finite-to-infinite reduction plus a height-gauge obstruction.
