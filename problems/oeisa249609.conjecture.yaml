lean:
  module: FormalConjectures.OEIS.«249609»
  decl: OeisA249609.conjecture
  statement: |-
    theorem conjecture (n : ℕ) :
        a n = 0 ↔ n ∈ ({0, 1, 2, 7, 8} : Finset ℕ)
  context:
    - open OeisA249609
    - open Nat List
  definitions:
    - name: OeisA249609.a
      kind: def
      text: |-
        /-- Smallest $1 \le m \le n$ such that $\binom{n}{m}$ is evil,
        or $0$ if no such $m$ exists. -/
        def a (n : ℕ) : ℕ :=
          ((List.range' 1 n).find? fun m => isEvil (n.choose m)).getD 0
