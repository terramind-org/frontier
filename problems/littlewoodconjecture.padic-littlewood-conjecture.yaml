  decl: LittlewoodConjecture.padic_littlewood_conjecture
  statement: |-
    theorem padic_littlewood_conjecture (α : ℝ) (p : ℕ) (hp : p.Prime) :
        atTop.liminf (fun (n : ℕ) ↦ n * padicNorm p n * distToNearestInt (n * α)) = 0
