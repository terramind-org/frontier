title: Positivity and split-lift obstructions for categorified colored-Jones recursions
field: mathematics
tier: prose
statement: |-
  Lift the recursion relation of the colored Jones Polynomial to categorified CJP.

  The record does not specify a knot, a normalization, or which recursion is meant.

  There are two mathematically plausible readings.

  1. **Color-recursion/AJ reading (used below).** For a fixed knot, the colored Jones sequence is annihilated by a noncommutative polynomial in the color-shift and multiplication operators. Lift such an annihilator to maps, cones, or a filtered acyclic totalization of colored-Jones complexes.
  2. **Jones--Wenzl-projector reading.** Lift the recursive construction of the Jones--Wenzl projectors used to define the colored invariant.

  The second reading has a substantial known answer: Cooper--Krushkal construct chain complexes categorifying Jones--Wenzl projectors and give an inductive construction modeled on the Frenkel--Khovanov recursion. The first reading remains the sharper unresolved interpretation, and it is the subject of this report.

  We fix the reduced normalization, with the colored Jones polynomial of the unknot equal to 1, only to avoid irrelevant units. All statements below apply after fixing any normalization and a particular recurrence presentation.
