title: Maximal-degree characters from rank vectors
field: mathematics
tier: prose
statement: |-
  The AIM problem list for the workshop *Supercharacters and combinatorial Hopf algebras* gives:

  The PDF places a line break after “super-”.

  The phrase “as supercharacters” is potentially stronger than merely asking for large constituents of supercharacters. This report distinguishes:

  1. ordinary irreducible characters of maximal degree;
  2. standard Diaconis--Isaacs supercharacters which happen to be irreducible;
  3. the degree of a reducible supercharacter.

  They need not agree for a general pattern group. The main theorem below gives a class in which they do agree completely.
