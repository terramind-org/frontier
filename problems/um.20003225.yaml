title: Common toggle energy and obstructions for locomotion
field: mathematics
tier: prose
statement: |-
  Perhaps it is better to approach the birational toggle group from above. Certain algebraic combinations of the variables are invariant under all the birational toggles.

  **Problem 4.9.** Can we say what those combinations are? Can we then characterize the birational toggle group as being precisely the group of birational transformations that preserve those algebraic combinations?

  Apropos of invariance under toggling, we mention the case of the full toggle group on the poset \([2]\times[2]\). Of the 24 orders in which one can compose all 4 toggles, 8 are not conjugate to rowmotion or promotion or their inverses; indeed, the PL and birational versions of these compositions were shown by Einstein to be of infinite order. Nevertheless, there are things to be proved about the map (called “locomotion” for present purposes). For instance, the pictures at http://jamespropp.org/locomotion.pdf, which shows some projections of an orbit of locomotion strongly suggests that the orbit lies in a 2-dimensional surface in \(\mathbb R^4\); that is, there are two conserved quantities, of which we know only one. Likewise, experimental studies suggest that other quantities are homomesic under locomotion, in an appropriately asymptotic sense of the word “average.” (Similar, polyhedral pictures appear when one replaces birational locomotion by PL locomotion.)
