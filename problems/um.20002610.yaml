statement: "**Kac's random walk.** For a vector \\(v\\in\\mathcal S^n\\), choose two coordinates uniformly, choose an angle uniformly on \\([0,2\\pi)\\), and rotate in the circle generated by those coordinates. Does this walk exhibit cutoff? Does the analogous walk on \\(SO(n)\\) exhibit cutoff?"
