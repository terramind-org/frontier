title: Research Problems in Function Theory — Problem 5.79
field: mathematics
tier: prose
statement: "[(a)] ; Let $f$ be a non-constant analytic function in $\\mathbb{D}$, $m$ be a positive integer, and define $\\psi = (f)^mf'$. Then it is shown by Sons () that, when $f$ and $\\psi$ both belong to MacLane's class $A$ , either [(i)] ; $f$ has finite asymptotic values on a dense subset of $\\mathbb{T}$, or ; $\\psi$ assumes every finite value infinitely often. What replacements can be found for $(i)$ (to give another correct theorem)? Can $\\psi$ be taken to be of the form \\[\\psi=(f)^{m_0}(f')^{m_1}\\ldots(f^{(k)})^{m_k},\\] whenever $k,m_0,m_1,\\ldots,m_k\\in\\mathbb{N}\\cup\\{0\\}$? ; It is known that the conclusion in part $(a)$ is true when $\\psi$ is replaced by \\[\\psi=f^{(l)}+\\sum^{i-1}_{\\nu=0}a_\\nu f^{(\\nu)},\\] where $l\\in\\mathbb{N}$ and the $a_\\nu$ are analytic functions in $\\{|z| < 1 +r\\}$, for some positive $r$. What replacements can be found in this case for $(i)$ to give another correct theorem? Can the $a_\\nu$ be taken as functions analytic in $\\mathbb{D}$ with $T(r,a_\\nu) = o(T(r,f))$ as $r\\to1$? (For both parts, compare Problem 1.38.) (L. R. Sons)"
