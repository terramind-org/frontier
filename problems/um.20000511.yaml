id: um.20000511
title: Polynomial density, multivariable defect kernels, and boundary models for de Branges--Rovnyak spaces
field: mathematics
tier: prose
statement: |-
  Let \(b\in H^\infty(\Delta)\) with \(\|b\|_{H^\infty}\leq 1\). Define
  \(H(b):=(I-T_bT_{\overline b})^{1/2}H^2(\Delta)\), where \(T_b\) denotes multiplication by \(b\).

  1. When are polynomials dense in \(H(b)\)? (known in affirmative for non-extremal \(b\) or inner \(b\))
  2. How to generate the \(H(b)\)s as reproducing kernel Hilbert spaces to the polydisk or the ball in \(\mathbb C^n\)?
  3. Find integral representations of these spaces in settings beyond the unit disk \(\Delta\).
