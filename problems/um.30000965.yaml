title: Linear Response for Stationary Random Fields
field: mathematics
tier: prose
statement: Under general hypotheses such as exponential decay of correlations and finite exponential moments, do stationary random fields satisfy a moderate-deviation principle and the linear-response limit $\frac{1}{r^2\varepsilon^2}\log \mathbb{E}\exp(\varepsilon r^2 Z_0(h_r))\to \frac{\sigma^2}{2}\lVert\Delta h\rVert^2$ as $r\to\infty$ and $\varepsilon(\log r)^2\to0$?
