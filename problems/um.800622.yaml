title: Selection Principles in Mathematics — Problem 51 ([SFT])
field: mathematics
tier: prose
statement: |-
  Assume that $X$ satisfies $\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\Omega)$.
  Does it follow that
  $$G=\{g\in\mathbb{N} : (\exists k)(\exists f_1,\dots,f_k\in Y)\ g\le^* \max\{f_1,\dots,f_k\}\}$$
  satisfies $\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\Omega)$?
