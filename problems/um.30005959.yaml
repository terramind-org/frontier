title: Kähler Shafarevich-Tate Twists
field: mathematics
tier: prose
statement: Let $\pi:X\to B$ be a Lagrangian fibration on an irreducible holomorphic symplectic manifold, and let $X^\phi\to B$ be the Shafarevich-Tate twist associated with a class $\phi$. Characterize the classes $\phi$ for which $X^\phi$ is Kähler.
