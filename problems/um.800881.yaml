title: Open Problems in Pluripotential Theory — Question 12
field: mathematics
tier: prose
statement: |-
  We now focus on the case of *bounded* and *continuous* plurisubharmonic functions.
  Although it is the setting of the original breakthrough of Bedford and Taylor [BT76,BT82],
  the range of the complex Monge-Amp\`ere operator acting on bounded/continuous (quasi-)psh functions
  is yet not characterized (despite rather sharp sufficient conditions [Kol98]).
  We recall the following question from [Bed93, p. 70]:

  [Bedford]
  Is the range of the complex Monge-Amp\`ere operator acting on $PSH \cap L_{loc}^{\infty}$
  characterized by a uniform integrability condition ?
