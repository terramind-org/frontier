title: Branko Grunbaum in Many Dimensions — Conjecture 3
field: mathematics
tier: prose
statement: |-
  Still, this leaves the question open for genus $g$ with $1 \le g \le 4$. In particular, the following seems to be open.

  If $ G $ is a simple loopless triangulation of a torus, then the dual graph of $ G $ is 3-edge-colorable.
