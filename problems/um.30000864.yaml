title: Functorial Lifts of Siegel Modular Forms
field: mathematics
tier: prose
statement: Let $f$ and $g$ be Siegel modular forms of genus $2m$ and weights $k>2m$ and $l=k-2m$, with Satake parameters $(\alpha_i)$ and $(\beta_i)$. Does there exist a Siegel modular form $F$ of genus $4m$ and weight $k$ whose Satake parameters satisfy $\gamma_0=\alpha_0\beta_0$, $\gamma_i=\alpha_i$ for $1\leq i\leq2m$, and $\gamma_{2m+j}=\beta_j$ for $1\leq j\leq2m$?
