title: Explicit saturated aperiodic locally jammed ball packings
field: mathematics
tier: prose
statement: |-
  **Aperiodic Jammed Packings**
  Find aperiodic jammed packings in $\mathbb{R}^2$. In $\mathbb{R}^3,$ find a saturated jammed maximal packing that is aperiodic in all directions.

  Construct congruent-unit-ball packings with trivial translation stabilizer that are locally jammed; in dimension $3$, also require saturation, equivalently inclusion-maximality.
