title: Kourovka Notebook Problem 14.94
field: mathematics
tier: prose
statement: |-
  For each positive integer $r$ find the
  $p $-cohomological dimension $\mathrm{cd}_p(H_r)$ where $H_r$ is
  the closed subgroup of $N({\mathbb{Z}/p{\mathbb{Z})$ consisting of
  the series \ $x\left( 1 + \sum\limits_{i=1}^{\infty} a_ix^{p^ri}\right)
  $, $a_i\in {\mathbb{Z}/p{\mathbb{Z}$.
