title: Spectral Thickness of Fibonacci Hamiltonians
field: mathematics
tier: prose
statement: What can careful computations reveal about the spectral structure of Fibonacci Hamiltonians? In particular, is the thickness of the spectrum a monotone decreasing function of $\lambda$ that behaves like $1/\lambda$ as $\lambda\to0$?
