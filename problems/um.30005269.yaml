title: Gonek’s Conjecture on Shifted Negative Zeta Moments
field: mathematics
tier: prose
statement: For fixed $k>0$, determine the uniform asymptotic order of $I_{-k}(\alpha,T)=T^{-1}\int_T^{2T}|\zeta(\tfrac12+\alpha+it)|^{-2k}\,dt$ throughout $0<\alpha\leq1$, including every transition regime near $\alpha=1/\log T$.
