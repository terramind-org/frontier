title: Extremal H-Constants of Line Arrangements
field: mathematics
tier: prose
statement: For line arrangements, determine the most negative possible H-constant among arrangements defined over $\mathbb Q$, among complex arrangements, and among complex supersolvable arrangements. In particular, is $H(C)>-3$ for every complex supersolvable line arrangement?
