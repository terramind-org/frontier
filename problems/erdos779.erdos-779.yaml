  module: FormalConjectures.ErdosProblems.«779»
  decl: Erdos779.erdos_779
  statement: |-
    theorem erdos_779 (n : ℕ) (hn : n ≥ 1): let P := ∏ i ∈ range (n + 1), nth Nat.Prime i
        ∃ p, p.Prime ∧ (P + p).Prime ∧ nth Nat.Prime n < p ∧ p < P
  context:
    - open Erdos779
    - open Finset Nat
  definitions: []
