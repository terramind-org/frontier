title: Profinite Reconstruction of Complex Projective Varieties
field: mathematics
tier: prose
statement: Let $X$ be a smooth complex projective variety. Can its homeomorphism type be recovered from its algebraic fundamental group $\pi_1^{\mathrm{alg}}(X)$? Can its topological fundamental group $\pi_1(X)$ be recovered up to isomorphism from $\pi_1^{\mathrm{alg}}(X)$?
