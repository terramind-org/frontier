title: AGNES Open Problems in Algebraic Geometry — Q5
field: mathematics
tier: prose
statement: |-
  Donaldson--Thomas invariants are defined only in dimension $3$
  because a virtual fundamental class for the moduli space of sheaves
  is required.
  Deformations are given by $\operatorname{Ext}^1(E,E)$, obstructions by $\operatorname{Ext}^2(E,E)$,
  and to define the virtual fundamental class we need (roughly) the
  vanishing
  $$\operatorname{Ext}^i(E,E)=0 \ \ \text{for}\ \ i>2 \ .$$
  On $3$-folds, the vanishing can often be obtained
  using Serre duality and stability.
  However, there are parallel examples of enumerative computations
  in higher dimensions in Gromov-Witten theory [klp,pz]. Moreover,
  many aspects of Joyce's counting theory are valid in higher dimensions
  [J].

  Define Donaldson--Thomas invariants in dimensions $>3$.
