title: Problem 7 — (Algorithm for Veech groups).
field: mathematics
tier: prose
statement: (Algorithm for Veech groups). Is there an algorithm for determining the Veech group of a general translation surface or quadratic diﬀerential? An interesting class of Veech surfaces are the square-tiled surfaces. These surfaces can be represented as a union of glued squares all of the same size, see [ Zo3], [ HuLe1].
