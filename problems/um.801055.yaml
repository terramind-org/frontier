title: "Henon Maps: Open Problems — Question 7"
field: mathematics
tier: prose
statement: |-
  When $|b|$ is larger but smaller than $1/4$ (so that it is mildly dissipative),
  [CPT] describes the dynamics of $f_{c,b}\in \mathcal{E}_0$.
  In particular, all maps $f_{c,b}\in \partial \mathcal{E}_0$ are infinitely renormalizable (with renormalization periods eventually equal to $2$), solving a conjecture by Tresser (which is still open when we don't assume the mild dissipation).
  One may wonder if the converse holds.

  Let us consider any infinitely renormalizable mildly dissipative map $f_{c,b}\in\mathcal{E}_0$.
  Is it the limit of maps with positive entropy? Is it the limit of Morse-Smale maps?
