title: Kourovka Notebook Problem 8.3
field: mathematics
tier: prose
statement: |-
  Let $m$ and $n$ be positive integers and $p$ a
  prime. Let $P_n({\mathbb{Z}_{p^m})$ be the group of all $n \times n$
  matrices $(a_{ij})$ over the integers modulo $p^m$ such that
  $a_{ii} \equiv 1$ for all $i$ and $a_{ij} \equiv 0 (\mathrm{mod}
  p)$ for all $i > j$. The group $P_n({\mathbb{Z}_{p^m})$ is a finite
  $p
  $-group. For which $m$ and $n$ is it regular?

  *Editors' comment (2001):* The group
  $P_{n}({\mathbb{Z}_{p^m})$ is known to be regular if $mn<p$
  (Yu. I. Merzlyakov, *Algebra i Logika*, **3**, no. 4
  (1964), 49--59 (Russian)). The case $m=1$ is completely done by
  A. V. Yagzhev in (*Math. Notes*, **56**, no. 5--6 (1995),
  1283--1290), although this paper is erroneous for $m>1$. The case
  $m=2$ is completed in (S. G. Kolesnikov, *Issledovaniya in
  analysis and algebra*, no. 3, Tomsk Univ., Tomsk, 2001, 117--125
  (Russian)). *Editors' comment (2009):*
  The group $P_{n}({\mathbb{Z}_{p^m})$ was shown to be regular for any
  $m$ if
  $n^2<p$ (S. G. Kolesnikov, *Siberian Math. J.*, **47**, no. 6 (2006), 1054--1059).
