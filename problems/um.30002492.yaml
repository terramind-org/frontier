title: Maeda Conjecture for Level-One Cusp Forms
field: mathematics
tier: prose
statement: For every normalized Hecke eigenform $f\in S_k(1)$, is $[\mathbb Q_f:\mathbb Q]=\dim S_k(1)=m_k$, with the Galois group of the normal closure of $\mathbb Q_f/\mathbb Q$ isomorphic to the symmetric group $S_{m_k}$?
