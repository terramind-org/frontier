title: "Erdős-Selfridge Classification: Infinitely Many Primes in Each Class"
field: mathematics
tier: prose
statement: In the Erdős-Selfridge classification of primes, are there infinitely many primes in each class? Prime $p$ is in class 1 if the only prime divisors of $p+1$ are 2 or 3; and $p$ is in class $r$ if every prime factor of $p+1$ is in some class $\le r-1$, with equality for at least one prime factor.
