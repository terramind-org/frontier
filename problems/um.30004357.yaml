title: Symmetric Intersecting Families in Discrete Product Spaces
field: mathematics
tier: prose
statement: For intersecting families $A\subseteq[k]^n$ with $k\geq3$, what bounds follow when highly asymmetric, single-coordinate extremal examples are forbidden? In particular, how small must $A$ be when its automorphism group acts transitively on the coordinates?
