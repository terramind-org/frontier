title: Quadratic density, diagonal quotients, and correspondence components
field: mathematics
tier: prose
statement: |-
  Let \(C,D\) be hyperelliptic curves of genus \(\ge2\) over a number field \(k\). Must \(2\in\delta(C\times D/k)\)? Must it be in \(\mathcal P(C\times D/k)\)?

  More generally, let \(Z\subset C\times D\) be the closure of the degree \(d\) points. When is there a component of \(Z\) which dominates both \(C\) and \(D\)?
