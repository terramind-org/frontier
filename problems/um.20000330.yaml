id: um.20000330
title: Factor persistence and the limits of single-summand Arakelov equality
field: mathematics
tier: prose
statement: |-
  Let \(U\) be a smooth variety, étale over a moduli stack \(M_H\) of
  polarized manifolds. Let \(Y\) be a log compactification of \(U\), and put
  \(\Gamma=Y\setminus U\).

  Assume that \(M_H\) is a moduli stack for abelian varieties or for a class
  of manifolds for which local Torelli holds. There is a variation of Hodge
  structures. Take an irreducible subvariation with Higgs bundle
  \(E^{1,0}\oplus E^{0,1}\). Then
  \[
  \frac{\deg E^{1,0}}{\operatorname{rk}E^{1,0}}
  -
  \frac{\deg E^{0,1}}{\operatorname{rk}E^{0,1}}
  \leq
  \frac{\deg\Omega_Y^1(\log\Gamma)}{\dim Y},
  \]
  where \(\omega_Y(\Gamma)\) is nef and big and degree is taken with
  respect to this sheaf. Determine when equality holds. A conjecture in
  this direction is that \(U\) is a Shimura variety. The source says that
  this is true when \(Y\) is a curve and for \(A_g\) for small \(g\).
