title: Kourovka Notebook Problem 19.106
field: mathematics
tier: prose
statement: Let $G$ be a uniformly locally finite group (which means that there is a function $f$ on the natural numbers such that any subgroup generated by $n$ elements has size at most $f(n)$). Suppose that for any two definable subgroups $H$ and $K$, the intersection $H\cap K$ has finite index either in $H$ or in $K$. Is $G$ necessarily nilpotent-by-finite? Or even finite-by-abelian-by-finite?
