id: algebraicnormality.irrational-algebraic-normal-in-some-base
title: Normality of Irrational Algebraic Numbers (irrational_algebraic_normal_in_some_base)
field: mathematics
tier: proof
statement: |-
  The weaker normality conjecture: every irrational algebraic real is normal in at least one
  integer base `b ≥ 2`.
