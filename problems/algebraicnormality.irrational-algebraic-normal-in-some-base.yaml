lean:
  module: FormalConjectures.Wikipedia.AlgebraicNormality
  decl: AlgebraicNormality.irrational_algebraic_normal_in_some_base
  statement: |-
    theorem irrational_algebraic_normal_in_some_base :
        ∀ x : ℝ, IsIrrationalAlgebraic x → ∃ b : ℕ, 2 ≤ b ∧ IsNormalInBase b x
  context:
    - open AlgebraicNormality
    - open NormalNumber
  definitions:
    - name: AlgebraicNormality.IsIrrationalAlgebraic
      kind: def
      text: |-
        /-- A real number is irrational algebraic if it is algebraic over `ℚ` but not rational. -/
        def IsIrrationalAlgebraic (x : ℝ) : Prop :=
          IsAlgebraic ℚ x ∧ Irrational x
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/AlgebraicNormality.lean#L53
