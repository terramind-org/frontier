lean:
  module: FormalConjectures.OEIS.«109845»
  decl: OeisA109845.conjecture
  statement: "theorem conjecture : Set.Infinite {n : ℕ | (a n).Prime}"
  context:
    - open OeisA109845
  definitions:
    - name: OeisA109845.a
      kind: def
      text: |-
        /--
        $a(1) = 2$; $a(2n)$ = lcm of all previous terms + 1; $a(2n+1)$ = lcm of all previous terms - 1.
        The sequence is correctly generated by the recurrence relation $a(1)=2$, $a(2)=3$,
        and for $n \ge 3$:
        $$a(n) = a(n-1)^2 + (-1)^n a(n-1) + (-1)^n.$$
        We use $0$-based indexing here, so $a(n)$ corresponds to the OEIS sequence $a(n+1)$.
        -/
        def a : ℕ → ℕ
          | 0 => 2
          | 1 => 3
          | n + 2 =>
            let prev := a (n + 1)
            if n % 2 = 0 then
              prev * prev - (prev + 1)
            else
              prev * prev + prev + 1
