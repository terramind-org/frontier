  definitions:
    - name: Erdos1063.n
      kind: def
      text: |-
        /--
        Let $n_k$ be the least $n \ge 2k$ such that all but one of the integers $n - i$ with
        $0 \le i < k$ divide $\binom{n}{k}$.
        -/
        noncomputable def n (k : ℕ) : ℕ :=
          sInf {m | 2 * k ≤ m ∧ ∃ i0 < k, ¬ (m - i0) ∣ m.choose k ∧
            ∀ i < k, i ≠ i0 → (m - i) ∣ m.choose k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/1063.lean#L42
