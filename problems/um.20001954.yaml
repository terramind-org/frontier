title: Kernel, cokernel, and a top-degree obstruction for contact Kirwan maps
field: mathematics
tier: prose
statement: |-
  **Recovered Question 3.1 (E. Lerman).** Let
  \[
   S^1\curvearrowright S^3\subset\mathbb C^2,\qquad
   \lambda\cdot(z_1,z_2)=(\lambda z_1,\lambda^{-1}z_2).
  \]
  The action is free, so \(H^*_{S^1}(S^3)\) is the ordinary cohomology of
  \(S^3/S^1\cong\mathbb P^1\). For the standard invariant contact form, the
  contact moment map is
  \[
   \mu(z_1,z_2)=|z_1|^2-|z_2|^2,
  \]
  and the contact quotient is \(\mu^{-1}(0)/S^1\cong S^1\). Thus the restriction
  map cannot be surjective. What are its kernel and cokernel?

  **Recovered Comment 3.2 (C. Boyer).** Determine conditions under which a
  contact Kirwan surjectivity theorem might hold, possibly for a class of
  3-Sasakian spaces and perhaps only through a dimension range.
