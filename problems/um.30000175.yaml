title: Pfaffian Conditions for Graphs on Orientable Surfaces
field: mathematics
tier: prose
statement: "For a graph $G$ and a nonnegative integer $g$, are the following equivalent: (1) $G$ has a drawing on an orientable surface of genus $g$ such that $\\operatorname{cr}(M)$ is even for every perfect matching $M$; (2) $G$ is $4^g$-Pfaffian; and (3) $G$ is $(4^{g+1}-1)$-Pfaffian?"
