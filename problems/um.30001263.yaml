title: Farrell–Jones Assembly Maps for Torsion-Free Groups
field: mathematics
tier: prose
statement: Let $G$ be a torsion-free discrete group and $R$ a regular ring. Are the algebraic $K$- and $L$-theory assembly maps $$H_n(BG;\mathbf K_R)\longrightarrow K_n(RG),\qquad H_n(BG;\mathbf L_R^{\langle-\infty\rangle})\longrightarrow L_n^{\langle-\infty\rangle}(RG)$$ bijective for every $n\in\mathbb Z$?
