title: Kourovka Notebook Problem 19.86
field: mathematics
tier: prose
statement: |-
  Suppose that a finite group $G$ has a
  $\sigma_{i}$-Hall subgroup for every $i \in I$. Suppose that a subgroup $A\leq G$ is such that $A\cap H$ is a
  $\sigma_{i}$-Hall subgroup of $A$ for every $i\in I$ and every $\sigma_{i}$-Hall subgroup $H$ of $G$ (see 19.84 in Archive). Is it true that then $A$ is ${\sigma}$-subnormal in $G$?

  An affirmative answer is known if $\sigma =\{\{2\}, \{3 \}, \ldots \}$
  and if $G$ is $\sigma$-soluble.
