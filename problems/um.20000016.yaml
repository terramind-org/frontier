title: An explicit interval in the Orlov spectrum of products of projective lines
field: mathematics
tier: prose
statement: |-
  What can be said about the Orlov spectrum of a toric variety (or any
  \(X\))? (e.g. about gaps, sequences, etc.)

  Known:
  - \(OrSpec(\mathbb P^1)=\{1,2\}\).
  - On a toric surface, there exists full arbitrary large consecutive
    sequence.
  - More generally, after replacing \(D^b(X)\) by a category \(\mathcal C\),
    there is \(OrSpec(\mathcal C)\); spectra for representations of quivers
    of types A/D have been computed.
