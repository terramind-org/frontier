title: Toeplitz corner tests and a PF-to-positroid support rule
field: mathematics
tier: prose
statement: |-
  Consider $TN$ Toeplitz matrices. What are the allowed patterns of
  zero and nonzero minors (i.e., which positroid cells contain
  Toeplitz matrices)? How does this relate to P\'olya frequency
  sequences? (Check work by Rietsch for the lower triangular
  Toeplitz case.)
  Is it enough to check all the corner minors to identify $TN$
  Toeplitz matrices?
