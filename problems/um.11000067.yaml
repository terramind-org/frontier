title: Problem 5.23 — Compute H1(Modg[L]; Z).
field: mathematics
tier: prose
statement: Compute H1(Modg[L]; Z). McCarthy and (independently) Hain proved that H1(Modg[L], Z) is finite for g≥ 3; see, e.g. Proposition 5.2 of [ Ha2]7. As discussed in §5 of [ Ha2], the following conjecture would imply that the (orbifold) Picard group for the moduli spaces of level L structures has rank one; this group is finitely-generated by the Hain and McCarthy result just mentioned. 7Actually, Hain proves a much stronger result, computing H 1(Modg[L], V ) for V any finite-dimensional sym- plectic representation. 2. Some problems on mapping class groups and moduli space 45
