  \section{Long-Range Order for the Quantum Heisenberg Model}\label{7800004}
  {\small UnsolvedMath ID 7800004 · Mathematical Physics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  (A) Prove long-range order for the quantum Heisenberg ferromagnet in dimension $D>2$ at temperature $T>0$. (B) Prove long-range order for spin $1/2$ in two dimensions in the ground state. (C) Find a robust proof for these continuous-symmetry cases that does not require exact translation invariance.
  \par\smallskip\textit{Formulation references:} \sref{7800004}{1}, \sref{7800004}{2}.
  \subsection{Short English statement}
  (A) Prove long-range order for the quantum Heisenberg ferromagnet in dimension $D>2$ at temperature $T>0$. (B) Prove long-range order for spin $1/2$ in two dimensions in the ground state. (C) Find a robust proof for these continuous-symmetry cases that does not require exact translation invariance.
