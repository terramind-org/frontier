title: Kourovka Notebook Problem 17.123
field: mathematics
tier: prose
statement: |-
  Do there exist finite groups $G_1, G_2$ such
  that $\pi _e(G_1)=\pi _e(G_2)$, \ $h(\pi _e(G_1))<\infty$, and
  each non-abelian composition factors of each of the groups
  $G_1, G_2$ is not isomorphic to a section of the other?

  For definitions see Archive, 13.63.
