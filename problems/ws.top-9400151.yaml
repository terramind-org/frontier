title: Are there infinitely many Kynea primes
field: mathematics
tier: prose
statement: |-
  \section{Are there infinitely many Kynea primes}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For integers $n\ge0$, define $K_n=(2^n+1)^2-2=4^n+2^{n+1}-1$. A Kynea prime is a prime value $K_n$.
  \paragraph{Statement recorded in the supplied source.}
  Are there infinitely many $n\ge0$ for which $K_n$ is prime? \sref{statement}{2}
  \subsection{Short English statement}
  Are infinitely many Kynea numbers prime?
