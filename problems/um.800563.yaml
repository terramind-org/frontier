title: Visibility Graphs of Points, Segments and Polygons — Problem 37
field: mathematics
tier: prose
statement: |-
  \begin{unsolved}
  Given the visibility graph $G$ of a simple polygon $P$ along with the Hamiltonian cycle in $G$
  corresponding to the boundary of $P$, determine the maximum hidden set of $G$.
  \end{unsolved}

  Design an approximation algorithm for computing maximum hidden set of visibility graph.
