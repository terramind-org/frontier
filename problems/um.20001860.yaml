title: A decomposition-group criterion and a local-global ramification gap
field: mathematics
tier: prose
statement: |-
  **11. (Owen) Specialization:** When is the Galois group of a particular rigid
  framework a subgroup of the Galois group of the graph?  When is
  \(\mathcal G(G,p)\subseteq \mathcal G(G)\) for any \(p\) with \((G,p)\)
  isostatic?  (Isostatic is sufficient but not necessary).  Here \(p\) generic
  means \(p=x_1,\ldots,x_n\) are algebraically independent over \(\mathbb Q\).
