title: Foliations and Diffeomorphism Groups — Question 70
field: mathematics
tier: prose
statement: |-
  Also, it is tempting to think about the analog of Milnor's conjecture for PL homeomorphisms. Recall that for a finite dimensional Lie group $G$, Milnor conjectured that
  \[
  H_*(BG^{\delta}; \mathbb{F}_p)\to H_*(BG; \mathbb{F}_p)
  \]
  is an isomorphism in all degrees. Here, $\mathbb{F}_p$ is the finite field with $p$ elements, $BG$ is the classifying space of the Lie group $G$ and $BG^{\delta}$ is the classifying space of $G$ made discrete. The work of Greenberg on PL foliations seems to suggest that the classifying space of PL Haefliger structures is inductively built out of classifying spaces of Lie groups made discrete. So it might be reasonable to expect the following.

  Is the map
  \[
  H_*(B\mathrm{PL}(M)^{\delta}; \mathbb{F}_p)\to H_*(B\mathrm{PL}(M); \mathbb{F}_p)
  \]
  an isomorphism in all degrees?
