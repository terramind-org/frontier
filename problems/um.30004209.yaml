title: Freely Complemented and Maximal Amenable MASAs
field: mathematics
tier: prose
statement: Let $p=(p_1,\ldots,p_d)$ be evaluated on a semicircular $d$-tuple $S$. Under what conditions does $p_1(S)$ generate a freely complemented masa? Is this generic? Are most masas in $L(F_d)$ maximal amenable, and is every maximal amenable masa freely complemented?
