lean:
  module: FormalConjectures.OEIS.«238585»
  decl: OeisA238585.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 0 < n) :
        a n = 1 ↔ n ∈ ({4, 5, 7, 10, 11, 12, 19, 21, 22, 31, 42, 44} : Set ℕ)
  context:
    - open OeisA238585
    - open Finset
  definitions:
    - name: OeisA238585.a
      kind: def
      text: |-
        /-- Number of primes $p < n$ with $\text{prime}(p)^2 + (\text{prime}(n) - 1)^2$ prime. -/
        noncomputable def a (n : ℕ) : ℕ :=
          ∑ p ∈ Ico 1 n,
            if p.Prime ∧ Nat.Prime (Nat.nth Nat.Prime (p - 1) ^ 2 + (Nat.nth Nat.Prime (n - 1) - 1) ^ 2)
            then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/238585.lean#L39
