title: Genuine Finite-Growth Nichols Algebras over Nonabelian Groups
field: mathematics
tier: prose
statement: Find a genuine Nichols algebra over a nonabelian group whose support is nonabelian, whose dimension is infinite, and whose Gelfand–Kirillov dimension is finite. In particular, for the rack of transpositions in $S_3$, what is the Nichols algebra corresponding to the constant cocycle $1$?
