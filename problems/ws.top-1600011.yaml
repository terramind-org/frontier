  \item[\hypertarget{source:1600011:2}{S2}] G. Farkas, \emph{Progress on syzygies of algebraic curves}, arXiv:1703.08056v2 (2017), §2 and §4, Definition 4.2 and Conjecture 4.4. \url{https://arxiv.org/abs/1703.08056}.
  \end{description}
  \label{end:1600011}
