  % UnsolvedMath ID 2306068; source catalogue code AMR-022-6068
  \setcounter{section}{2306067}
  \section{Research Problems in Function Theory — Problem 6.68}\label{2306068}
  {\small\sffamily UnsolvedMath ID 2306068 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  The exterior class $\Sigma$ consists of holomorphic injective functions on $\{z:|z|>1\}$ with Laurent expansion $f(z)=z+b_0+\sum_{j=1}^{\infty}b_jz^{-j}$. For locally injective holomorphic $f$, put $P_f=f''/f'$ and $S_f=P_f'-\tfrac12P_f^2$, its pre-Schwarzian and Schwarzian derivatives.
  \paragraph{Statement recorded in the supplied source.}
  For every $f\in\Sigma$ and sequence $(f_n)\subset\Sigma$, does \[\sup_{|z|>1}(|z|^2-1)^2|S_{f_n}(z)-S_f(z)|\longrightarrow0\] imply \[\sup_{|z|>1}(|z|^2-1)|P_{f_n}(z)-P_f(z)|\longrightarrow0?\] \sref{2306068}{2}
  \subsection{Short English statement}
  Does convergence of exterior Schwarzians in their weighted uniform norm imply convergence of pre-Schwarzians in the corresponding weaker norm?
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:2306068:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, record 2306068 (AMR-022-6068). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:2306068:2}{S2}] W. K. Hayman and E. F. Lingham, \emph{Research Problems in Function Theory} (2018), Chapter 6, Problem 6.68 and its complete update; Chapter 6 initial notation. \url{https://arxiv.org/abs/1809.07200}.
  \end{description}
