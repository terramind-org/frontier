title: Efficient Extraction of Interval Summands
field: mathematics
tier: prose
statement: Given a pointwise finite-dimensional representation $M$ of $\mathbb R^d$, determine efficiently whether $M$ has interval summands and, when it does, extract them, preferably by local and readily checkable conditions rather than by decomposing $M$ completely.
