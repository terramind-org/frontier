id: um.20001132
title: A linear unit-distance bound for algebraically concentrated p-point sets
field: mathematics
tier: prose
statement: |-
  **Problem 4.1 (T. Tao).** Suppose that \(S\subseteq\mathbb F_p^2\) with
  \(|S|=p\). How many pairs of points of distance one apart can there be? That
  is, how large can
  \[
  \#\{(x,y)\in S\times S:(x_1-x_2)^2+(y_1-y_2)^2=1\}
  \]
  be?

  **Remark.** The trivial upper bound is \(p^{3/2}\). The best lower-bound
  example is of size \(p\).
