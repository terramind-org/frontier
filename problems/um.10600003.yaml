title: Virtual-knot problem 3 — The Flat Hierarchy
field: mathematics
tier: prose
statement: |-
  The Flat Hierarchy: The flat hierarchy is constructed for any
  ordinal $\alpha$. We label flat crossings with members of this
  ordinal. In a flat third Reidemeister move, a line with two $a$
  labels can slide across a crossing labeled $b$ only if $a$ is
  greater than $b.$ This generalizes the usual to theory of flat
  virtual diagrams to a system with arbitrarily many different types
  of flat crossings. Classify the diagrams in this hierarchy. This
  concept is due to Kauffman (unpublished). A first step in working
  with the flat hierarchy can be found in .
