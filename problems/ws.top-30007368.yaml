statement: |-
  \section*{Diameter, local mass and covering exponents of fixed-length honeycomb walks}\label{30007368}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For a uniformly sampled rooted n-step honeycomb self-avoiding walk, do the following hold with exceptional probability at most $C_{\delta ,k}n^{-k}$ for every $\delta ,k>0:$ diameter between $n^{3/4-\delta }$ and $n^{3/4+\delta }$; visited-vertex count in every radius-s ball centered on the walk between $n^{-\delta }min(n,s^{4/3})$ and $n^\delta $ $min(n,s^{4/3})$; and its radius-s covering number between $n^{-\delta }(1+ns^{-4/3})$ and $n^\delta (1+ns^{-4/3})$, simultaneously for all $1\leq s\leq n$?
  \subsection{Short English statement}
  For a uniformly sampled rooted n-step honeycomb self-avoiding walk, do the following hold with exceptional probability at most $C_{\delta ,k}n^{-k}$ for every $\delta ,k>0:$ diameter between $n^{3/4-\delta }$ and $n^{3/4+\delta }$; visited-vertex count in every radius-s ball centered on the walk between $n^{-\delta }min(n,s^{4/3})$ and $n^\delta $ $min(n,s^{4/3})$; and its radius-s covering number between $n^{-\delta }(1+ns^{-4/3})$ and $n^\delta (1+ns^{-4/3})$, simultaneously for all $1\leq s\leq n$?
