statement: (a) It is known from [33] that H2(Mod3; Z) and H2(Mod1 3; Z) are either Z or Z⊕ Z2. What are they? Also compute H2(PModb 3,p; Z) for all p and b. (b) It is also known that H2(Mod2; Z)∼= H2(Mod1 2; Z)∼= Z2. Compute H2(PModb 2,p; Z) for b≥ 2 and for all p.
