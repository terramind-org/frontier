title: Coxeter Groups and Unimodality — Conjecture 13
field: mathematics
tier: prose
statement: |-
  Let $(W,S)$ be a Coxeter system. It is of interest, and difficult, to obtain
  properties of the
  rank generating function of Bruhat intervals $[u,v]$, $u,v \in W$ (see, e.g., [BjoEke]).
  In this respect, I feel that the following holds.

  Let $W$ be a Weyl group, and $u,v \in W$. Then $[u,v]$ is rank log-concave.
