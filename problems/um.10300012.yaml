title: Sublaminations and superlaminations — Question 6.2
field: mathematics
tier: prose
statement: |-
  Suppose $\Lambda$ is a full genuine lamination; i.e. it has some complementary region
  which is an ideal polygon bundle over a circle. Suppose $M$ is hyperbolic. Is the core
  circle of this region isotopic to a geodesic? Does it have a noncoalescable insulator
  family?
