title: "Odd Brauer torsion on K3 surfaces: status and a Picard-rank filter"
field: mathematics
tier: prose
statement: |-
  The record is Problem 8 in the AIM workshop list *Rational and integral points on higher-dimensional varieties*, dated May 28, 2014. I interpret \(\operatorname{Br}(X)[u]\) as the subgroup killed by the odd integer \(u\).

  1. Can a K3 surface \(X/\mathbb Q\) have odd-order torsion in \(\operatorname{Br}(X)\) that obstructs the Hasse principle? Can this happen already in
     \[
     \operatorname{Br}_1(X)=\ker\bigl(\operatorname{Br}(X)\to
     \operatorname{Br}(\overline X)\bigr)?
     \]
  2. For a smooth quartic K3 surface \(X\subset \mathbb P^3\), does
     \[
     \bigl(\operatorname{Br}(X)/\operatorname{Br}(\mathbb Q)\bigr)[2]=0
     \]
     imply the Hasse principle? What happens to weak approximation?
  3. What is the corresponding situation for a degree-six K3 surface \(X\subset \mathbb P^4\)? In the K3 context this is the genus-four polarization; for a smooth nondegenerate model it is the familiar quadric--cubic complete intersection.

  The source also sketches a zero-cycle argument: an odd class on a quartic can be made orthogonal to local zero-cycles of degree one, and the degree-one zero-cycle conjecture invoked by Colliot-Thélène would then produce a global zero-cycle of degree one. The remaining issue is that index one does not by itself produce a rational point.
