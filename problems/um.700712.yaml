title: Kourovka Notebook Problem 11.19
field: mathematics
tier: prose
statement: |-
  (C. Sims). Is the $n$th
  term of the lower central series of an absolutely free group the
  normal closure of the set of basic commutators (in some fixed free
  generators) of weight exactly $n$?

  D. Jackson announced a
  positive answer for $n\leq 5$.
