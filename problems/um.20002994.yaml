title: Parabolic flag kernels as braid-stratified projectors
field: mathematics
tier: prose
statement: |-
  Are there “braid variety analogues” of projectors?

  Its mathematical ambiguity is real, however: neither “projector” nor the category in which it should be idempotent is specified. The official workshop report supplies the missing context. It discusses annular closures of Elias–Hogancamp categorified projectors, used to color link components, and separately records the workshop construction of parabolic braid varieties [AIM]. Thus the intended target appears to be a geometric object attached to braid varieties that plays some role analogous to a Jones–Wenzl/Young/Soergel categorical projector.

  This report gives a rigorous partial answer in one precise category. For a standard parabolic subgroup, a proper correspondence assembled from braid relative-position strata has an idempotent structure-sheaf kernel under coherent convolution. It also gives the expected absorption law for nested colors. This does **not** identify that finite kernel with the infinite Soergel complexes used in colored HOMFLYPT homology.
