title: Kourovka Notebook Problem 20.44
field: mathematics
tier: prose
statement: |-
  The definition of \(\mathrm{CT}(\mathbb{Z})\) is given in 17.57. Is it true that a finitely generated subgroup of \(\mathrm{CT}(\mathbb{Z})\) either has
  only finitely many orbits on \(\mathbb{Z}\) or there is a set of representatives for its orbits
  on \(\mathbb{Z}\) which has positive density?
