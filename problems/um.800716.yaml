title: Open Problems on Central Simple Algebras — Problem 30
field: mathematics
tier: prose
statement: |-
  Suppose $(a,b)_n$ and $(c,d)_n$ are symbol algebras
  of degree $n$ over $F$, and $(a,b)_n \otimes_F (c,d)_n$ has index $< n^2$.
  Are there necessarily symbol algebras $(a',b')_n$ and $(c',d')_n$ that share a common maximal
  subfield and such that $(a, b)_n \otimes_F (c, d)_n \cong (a',b')_n \otimes_F (c', d')_n$?
