title: Generalized Kato Classes at Vanishing Artin-Twisted L-Values
field: mathematics
tier: prose
statement: For an elliptic curve $E$ over $\mathbb{Q}$ and an Artin representation $\rho$, assuming $L(E,\rho,1)=0$, does the generalized Kato class lie in $E(H)_\rho\otimes\mathbb{Q}_p$ and become trivial when the equivariant analytic rank is greater than $2$, with the rank-$2$ class given by the proposed $p$-adic-period formula?
