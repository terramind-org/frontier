lean:
  module: FormalConjectures.ErdosProblems.«883»
  decl: Erdos883.erdos_883.parts.i
  statement: |-
    theorem erdos_883.parts.i :
        ∀ (n : ℕ) (A : Finset ℕ),
          A ⊆ Finset.Icc 1 n →
          n / 2 + n / 3 - n / 6 < A.card →
          ∀ l : ℕ, Odd l → 3 ≤ l → l ≤ n / 3 + 1 →
            l ∈ (coprimeGraph.induce (A : Set ℕ)).oddCycleLengths
  context:
    - open Erdos883
    - open Erdos883.erdos_883
    - open Erdos883.erdos_883.parts
    - open Filter
  definitions:
    - name: Erdos883.coprimeGraph
      kind: def
      text: |-
        /--
        The coprime graph on $\mathbb{N}$: two integers are joined by an edge if they are coprime.
        -/
        def coprimeGraph : SimpleGraph ℕ :=
          SimpleGraph.fromRel Nat.Coprime
