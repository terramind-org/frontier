title: Elliptic-billiard invariant k_{907,b}
field: mathematics
tier: prose
statement: Fix an ellipse with center $O$ and foci $f_1,f_2$, and let $P=(P_i)_{i=1}^N$ range over its Poncelet family of $N$-periodic billiard orbits tangent to a fixed confocal caustic. Let $P'$ be the outer polygon formed by consecutive tangent intersections and $P''$ the inner polygon of caustic tangency points; write $A,A',A''$ for their areas. For $j\in\{1,2\}$ invert the vertices of $P$ in the unit circle centered at $f_j$; denote the resulting polygon by $P_j^\dagger$, with perimeter $L_j^\dagger$, area $A_j^\dagger$, and angles $\theta_{j,i}^\dagger$. Primes refer to $P'$. Let $A^\otimes$ and ${A'}^\ominus$ be the areas after elliptic inversion of $P$ in its caustic and of $P'$ in the billiard ellipse. Let $A_{j,pol},A_{j,dual},A_{j,ant}$ be focal polar, dual, and antipedal areas, and $w_i,\psi_{j,i}$ the dual side lengths and polar angles. Subscripts $1,2$ distinguish the two foci; double primes refer to $P''$, and $A_j'^\ddagger$ is the area obtained by inverting $P'$ about a focus of its own elliptic vertex locus. Prove that, for even $N$, the quantity $A_{1,dual}^\dagger/A_{2,dual}^\dagger=1$ is constant as $P$ varies through the family. The source labels this assertion invariant code k_{907,b}.
