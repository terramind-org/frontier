statement: Let $X$ be a finitary factor of an independent and identically distributed process with exponentially decaying coding-radius tails. Must $X$ also be a finitary factor of a finite-valued independent process having entropy arbitrarily close to that of $X$ and exponentially decaying coding-radius tails?
