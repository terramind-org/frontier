title: Kourovka Notebook Problem 11.115
field: mathematics
tier: prose
statement: |-
  Suppose that $X$ is a
  free non-cyclic group, $N$ is a non-trivial normal subgroup of $X$
  and $T$ is a proper subgroup of $ X$ containing $N$. Is it true
  that $[T,N] < [X,N]$ if $N$ is not maximal in $X$?
