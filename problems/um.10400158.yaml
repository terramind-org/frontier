title: Problem 8.12 — (T.
field: mathematics
tier: prose
statement: "(T. Kerler) [Cyclotomic integer TQFT’s] (1) Find explicit/computable bases for the Vp(Σ g) as free modules over Z[ζp]. (2) Show that Vp can be extended to all cobordisms as a half-projective TQFT with x = (ζp− 1) p−3 2 ∈ R = Z[ζp]. (3) Determine the structure of the V [j] p (M ) and in how far they have lifts from Fp to Z, analogous to the Ohtsuki invariants for closed 3-manifold s. (4) Find a universal TQFT that combines all Vp, at least perturbatively, into one. In the case of p = 5 the program for items (1)–(3) has been mostly carried out in [213], for primes p≥ 7 not much is known though. Some explicit bases have been found for genus g = 1 by Gilmer, but the situation for higher genera g≥ 3 is unknown. An immediate application of item (2) is that the quantum order, as introduced in [92], is also an upper bound for the cu t-number of a 3-manifold. A closely related statement for (2) would also y ield a very diﬀerent proof for the fact that the Ohtsuki invariants are of finite ty pe. In item (3) the “lift” must depend on p since the dimensions of the vector spaces do, and must also involve further quotients that arise since the irreduc ible TQFT’s over Z do not match the required dimensions either, but they become reducible when reduced to Fp. Item (4) is rather vague at this point, indicating for some s ort of infinite filtered space with finite graded components. Any TQFTV: Cob→ R-mod implies a sequence of representation V[g]: Γ g→ GLR(V(Σ g)) of the mapping class groups. We say that a TQFT is homological if each of these representations factors through the quotie nt Γ g−։ Sp(2g, Z) (given by the action on H1(Σ g)), and we say it is strictly homological if each of the Sp(2 g, Z)-representations is algebraic, i.e. either faithful or ze ro. A par- ticular example of strictly homological TQFT’s over R = Z are the Lefschetz componentsV (j) of the Frohman-Nicas TQFT, see [128, 214]. From these we can generate a larger family Q 0 of such TQFT’s by taking all direct sums of V (j) ’s. For example all the TQFT’s constructed in [110] lie in Q 0. An even larger family Q∗ is found by taking also tensor products and their irreducibl e summands."
