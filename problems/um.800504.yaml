title: Linear Systems and Eigenvalue Problems — Problem 13
field: mathematics
tier: prose
statement: Find an interesting (nonselfdajoint resp. nonsymmetric) model problem, where the theoretical result on the eigenvalue distribution of the preconditioned matrix indeed corresponds to the actual convergence behavior of GMRES (e.g., $M^{-1}A$ has $m$ eigenvalue clusters and an acceptable approximate solution is obtained by GMRES in ${\mathcal{O}(m)$ steps). Determine which particular properties of the problem implied this correspondence.
