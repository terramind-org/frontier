title: Open Problems in Pluripotential Theory — Question 37
field: mathematics
tier: prose
statement: |-
  The point in the example above is that there is no differential test from above for $\varphi$ along the line
  $(w=0)$. A simpler example in any dimension is provided by $\varphi(z)=||z||$: there is no differential test from above at the origin; the function is strictly plurisubharmonic in the viscosity sense, but not in the classical sense.

  [Guedj-Zeriahi]
  Let $\varphi$ be a plurisubharmonic function. What can be said about the set of points at which $\varphi$ does not admit a differential test from above ?
