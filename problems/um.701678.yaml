title: Kourovka Notebook Problem 20.20
field: mathematics
tier: prose
statement: |-
  Let $E(l,m,n)$ be a group on generators $a,b$ with the presentation
  $\langle a,b\mid a^l= 1,\;(ab)^m=b^n\rangle$, where $l,m,n$ satisfy $1/l + 1/m + 1/n < 1$.
  Are there any values for $l,m,n$ such that $E(l,m,n)$ is shortlex automatic?

  It is known that $E(6,2,6)$ is not shortlex automatic.
