title: Selection Principles in Mathematics — Problem 31 (Zdomskyy)
field: mathematics
tier: prose
statement: |-
  The product of a $\sigma$-compact $X$ with
  $Y$ satisfying $\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\mathscr{B})$ ($\mathscr{B}\in\{\mathcal{O},\Omega,\Gamma\}$) satisfies
  $\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\mathscr{B})$ [SFT, AddQuad].

  Assume that $X$ is compact and $Y$ satisfies $\mathsf{Split}(\Lambda,\Lambda)$.
  Does $X\times Y$ satisfy $\mathsf{Split}(\Lambda,\Lambda)$?
