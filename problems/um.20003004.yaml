title: Digital pi_2, clique realization, and the octahedral sphere
field: mathematics
tier: prose
statement: |-
  **Higher homotopy groups**

  Define higher homotopy groups in digital topology. As a test case, one should verify that $\pi_2(S^2, *) = \mathbb{Z}$, where $S^2$ is the digital 2-sphere, i.e., a graph with six vertices appropriately embedded in $\mathbb{Z}^3$.
