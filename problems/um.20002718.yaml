title: A conjugacy-class coalgebra and Hopf completion for Cayley intervals
field: mathematics
tier: prose
statement: |-
  The record is Problem 4.4, attributed to D. Armstrong, in the AIM workshop list *Braid groups, clusters and free probability*. Let \(G\) be generated by a finite set \(T\) that is closed under conjugation, let \(\ell=\ell_T\), and order \(G\) by
  \[
   u\le_T v\quad\Longleftrightarrow\quad
   \ell(v)=\ell(u)+\ell(u^{-1}v). \]
  For \(g\in G\), put \(P_g=[1,g]\). The problem observes that these intervals are locally self-dual and that conjugate elements give isomorphic intervals. It asks for the structure of the map from conjugacy classes to the Ehrenborg function and, in particular, whether a Hopf structure is preserved.

  There are three source-recovery issues.

  1. The corpus starts with the duplicated OCR text `Problem 4.\n4.`; the PDF heading is **Problem 4.4**.
  2. The displayed sum in the PDF/corpus has the bounds \(1\le g_0\le\cdots\le g_k\le g\), while its monomial contains only the jumps \(g_{i-1}^{-1}g_i\). Taken literally, this omits both boundary jumps and permits arbitrarily many zero jumps, so it is not the Ehrenborg series and does not have finite coefficients. Stanley's precise definition anchors both endpoints and requires the top to occur exactly once. The mathematically coherent recovered formula is therefore
     \[
     F(P_g)=\sum_{k\ge1}\ \sum_{1=g_0\le g_1\le\cdots\le g_{k-1}<g_k=g}
     x_1^{\ell(g_0^{-1}g_1)}\cdots
     x_k^{\ell(g_{k-1}^{-1}g_k)},                                      \tag{1}
     \]
     with \(F(P_1)=1\). Equivalently, and without zero-part conventions,
     \[
     F(P_g)=\sum_{1=h_0<h_1<\cdots<h_r=g}
     M_{(\ell(h_0^{-1}h_1),\ldots,\ell(h_{r-1}^{-1}h_r))},              \tag{2}
     \]
     where \(M_\alpha=\sum_{i_1<\cdots<i_r}x_{i_1}^{\alpha_1}\cdots
     x_{i_r}^{\alpha_r}\). Formula (1) is Stanley's equation (1), specialized to \(P_g\); formula (2) is Ehrenborg's strict-chain definition.
  3. Everything beginning with the heading `5. Free Probability` is spill from the next section and is not part of Problem 4.4. In particular, reference [47] belongs to that spill. Reference [49] is Stanley's paper cited below.
