title: Kourovka Notebook Problem 15.20
field: mathematics
tier: prose
statement: |-
  (B. Hartley). An infinite transitive permutation group
  is said to be *barely transitive* if each of its proper
  subgroups has only finite orbits. Can a locally finite barely
  transitive group coincide with its derived subgroup?

  Note that there are no simple locally finite
  barely transitive groups (B. Hartley, M. Kuzucuo\v{g}lu, *Proc.
  Edinburgh Math. Soc.*, **40** (1997), 483--490), any locally finite
  barely transitive group is a $p $-group for some prime $p$, and if
  the stabilizer of a point in a locally finite barely transitive group
  $G$ is soluble of derived length $d$, then $G$ is soluble of derived
  length bounded by a function of $d$ (V. V. Belyaev,
  M. Kuzucuo\v{g}lu, *Algebra and Logic*, **42** (2003),
  147--152).
