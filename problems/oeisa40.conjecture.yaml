lean:
  module: FormalConjectures.OEIS.«40»
  decl: OeisA40.conjecture
  statement: |-
    theorem conjecture (n : ℕ) (hn : 0 < n) :
        Real.log (Real.log (a (n + 1) : ℝ)) - Real.log (Real.log (a n : ℝ)) < 1 / (n : ℝ)
  context:
    - open OeisA40
  definitions:
    - name: OeisA40.a
      kind: def
      text: |-
        /-- The sequence of prime numbers, with $a(0) = 0$ and $a(n) = p_n$ for $n \ge 1$. -/
        noncomputable def a (n : ℕ) : ℕ :=
          match n with
          | 0 => 0
          | n' + 1 => Nat.nth Nat.Prime n'
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/40.lean#L33
