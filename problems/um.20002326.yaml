title: Finite-horizon robustness under automorphism perturbation
field: mathematics
tier: prose
statement: |-
  **Problem 1.** Let \(T\) be a complete superstable metric theory, let \(\sigma\) be a new symbol for a unitary function, and let

  \[
  T_\sigma=T\cup\{\text{“\(\sigma\) is an automorphism”}\}.
  \]

  Assume that \(T_A\), the model companion of \(T_\sigma\), exists. Is \(T_A\) supersimple up to perturbations of the automorphism?

  The AIM source PDF was checked directly. The recovered statement owned by this record is only **Problem 1**:

  The PDF confirms the notation \(T_\sigma\) and \(T_A\). The hyphenated strings “perturba-tions,” “supersta-ble,” and “automorp-hism” are line-break artifacts. The remainder of the input beginning “2. The Ehrenfeucht constructions…” is a separate problem and is not analyzed here.
