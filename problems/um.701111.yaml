title: Kourovka Notebook Problem 15.23
field: mathematics
tier: prose
statement: |-
  A transitive permutation group is
  said to be *totally imprimitive* if every finite set of points
  is contained in some finite block of the group. Do there exist
  totally imprimitive barely transitive groups that are not locally
  finite?
