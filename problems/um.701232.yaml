title: Kourovka Notebook Problem 16.40
field: mathematics
tier: prose
statement: |-
  Let $\Delta$ be a subgroup of the automorphism
  group of a free pro-$p$ group of finite rank $F$ such that
  $\Delta$ is isomorphic (as a profinite group) to the group $Z_p$
  of $ p $-adic integers. Is the subgroup of fixed points of
  $\Delta$ in $F$ finitely generated (as a profinite group)?
