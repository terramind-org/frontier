title: Rank Varieties of Specht Modules
field: mathematics
tier: prose
statement: For partitions whose parts are divisible by $p$, characterize the associated Specht modules through their rank varieties. Is the multiplicity integer in the rank-variety formula always $1$, and what is the sharp upper bound for the degree of the projectivized rank variety?
