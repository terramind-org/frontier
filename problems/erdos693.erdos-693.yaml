  module: FormalConjectures.ErdosProblems.«693»
  decl: Erdos693.erdos_693
  statement: |-
    theorem erdos_693 : ∃ C : ℕ, ∀ k ≥ 2, ∀ᶠ n in atTop,
        MaxGapAtMost (divisorWindowSet k n) ((Real.log (n : ℝ)) ^ C)
  context:
    - open Erdos693
    - open Filter
  definitions:
    - name: Erdos693.divisorWindowSet
      kind: def
      text: |-
        /-- The finite set $A \subseteq [n,n^k]$ from Erdős problem 693. -/
        def divisorWindowSet (k n : ℕ) : Finset ℕ :=
          (Finset.Icc n (n ^ k)).filter fun x ↦
            ((Finset.Ioo n (2 * n)).filter fun d ↦ d ∣ x).Nonempty
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/ErdosProblems/693.lean#L39
    - name: Erdos693.MaxGapAtMost
      kind: def
      text: |-
        /-- The maximum gap in the finite set $A$ is at most $B$. -/
        def MaxGapAtMost (A : Finset ℕ) (B : ℝ) : Prop :=
          ∀ x y, ConsecutiveIn A x y → (y - x : ℝ) ≤ B
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/ErdosProblems/693.lean#L49
