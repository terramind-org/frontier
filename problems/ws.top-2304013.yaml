  \section{Research Problems in Function Theory — Problem 4.13}\label{2304013}
  {\small UnsolvedMath ID 2304013 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For $P(z)=\sum_{k=1}^n\varepsilon_kz^k$ with $\varepsilon_k\in\{-1,1\}$, is there an absolute $A>0$ such that
  \[\max_{|z|=1}|P(z)|>(1+A)\sqrt n\]
  for all such polynomials? This asks for a uniform gap above the square-root scale.
  \par\smallskip\textit{Formulation references:} \sref{2304013}{1}, \sref{2304013}{2}.
  \subsection{Short English statement}
  For $P(z)=\sum_{k=1}^n\varepsilon_kz^k$ with $\varepsilon_k\in\{-1,1\}$, is there an absolute $A>0$ such that
  \[\max_{|z|=1}|P(z)|>(1+A)\sqrt n\]
  for all such polynomials? This asks for a uniform gap above the square-root scale.
