title: Arithmetic-fracture coefficient decompletions of TP(F_p)
field: mathematics
tier: prose
statement: |-
  **Long Term.** Can we construct a decompleted version of the Tate spectrum?

  Construct a spectrum mapping to \(TP(\mathbf F_p)\), preferably an
  \(E_\infty\)-ring, whose homotopy ring is
  \(\mathbf Z_{(p)}[v^{\pm1}]\) or
  \(\mathbf Z_{(p)}^h[v^{\pm1}]\), and whose derived \(p\)-completion
  recovers \(TP(\mathbf F_p)\).
