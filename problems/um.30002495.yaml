id: um.30002495
title: Real-Variable Proof of the Nyman Criterion
field: mathematics
tier: prose
statement: |-
  Give a real-variable proof of the equivalence between the following assertions: for every $\varepsilon>0$,
  $$\pi(x)=\operatorname{li}(x)+O(x^{1/2+\varepsilon});$$
  and, for every $\delta>0$, there are coefficients $c_\alpha$, with $\alpha>1$, such that
  $$\int_0^\infty\left|\chi(t)-\sum_\alpha c_\alpha e_\alpha(t)\right|^2\frac{dt}{t^2}<\delta,$$
  where $\chi(t)=1$ for $t>1$ and $0$ otherwise, and $e_\alpha(t)=\{t/\alpha\}$.
