title: Complete Bipartite Subgraphs and Connected Matchings at $\alpha=2$
field: mathematics
tier: prose
statement: Is there a constant $c>0$ such that every $n$-vertex graph $G$ with $\alpha(G)=2$ contains both (1) a complete bipartite graph $K_{n^c,n^c}$ and (2) a connected matching of size $cn$?
