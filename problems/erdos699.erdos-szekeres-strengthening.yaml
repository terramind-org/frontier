lean:
  module: FormalConjectures.ErdosProblems.«699»
  decl: Erdos699.erdos_szekeres_strengthening
  statement: |-
    theorem erdos_szekeres_strengthening :
        ∃ E : Finset (ℕ × ℕ × ℕ), ∀ n i j : ℕ,
          1 ≤ i →
          i < j →
          j ≤ n / 2 →
          (n, i, j) ∉ E →
          ∃ p : ℕ, p.Prime ∧ i < p ∧ p ∣ Nat.gcd (Nat.choose n i) (Nat.choose n j)
  context:
    - open Erdos699
  definitions: []
