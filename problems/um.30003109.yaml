title: Regulator Finiteness from Lang–Silverman Heights
field: mathematics
tier: prose
statement: Assume the Lang–Silverman height conjecture. For a fixed number field $K$ and integer $g\geq1$, are there only finitely many $\mathbb Q$-isomorphism classes of simple abelian varieties over $K$ of dimension $g$, bounded positive Mordell–Weil rank, and bounded regulator?
