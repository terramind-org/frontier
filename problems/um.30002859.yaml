title: Baire Category of Purely Singular Copulas
field: mathematics
tier: prose
statement: |-
  Let $\mathcal C_d$ be the space of $d$-dimensional copulas equipped with the metric

  $$D_1(C_1,C_2)=\int_{[0,1]^d}\lvert C_1(u)-C_2(u)\rvert\,du.$$

  Is the subset of purely singular copulas nonmeager in $(\mathcal C_d,D_1)$?
