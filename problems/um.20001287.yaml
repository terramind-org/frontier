title: A sharp wedge-orthant family for the spherical simplex volume product
field: mathematics
tier: prose
statement: |-
  For \(Q\subset S^{n-1}\), define
  \[
  Q^\circ=\{x\in S^{n-1}:\langle x,y\rangle>0\ \text{for all }y\in Q\}
  \]
  and \(P(Q)=\operatorname{vol}(Q)\operatorname{vol}(Q^\circ)\). For a spherical simplex \(\Delta_n\subset S^{n-1}\) determined by \(n\) distinct hyperplanes through the origin, is
  \[
  P(\Delta_n)\leq P(\mathbb R_+^n\cap S^{n-1})?
  \]
  The source adds: "In particular, if \(n=3\), it is true."
