title: Kourovka Notebook Problem 17.103
field: mathematics
tier: prose
statement: |-
  Does there exist a continuum of sets $\pi$ of primes for which
  every finite group possessing a Hall $\pi$-subgroup is a
  $D_\pi$-group?

  *Comment of 2025*:
  It has been proved that, for any integer $x$, if $\pi$ is the set of all prime numbers $p>x$, then any finite group containing a Hall $\pi$-subgroup is a $D_\pi$-group (K. A. Ilenko, N. V. Maslova, *Siberian Math. J.*, **62**, no. 1 (2021), 44--51).
