title: Dixmier Traces of Commutators on Bidisk Quotient Modules
field: mathematics
tier: prose
statement: Let $M\subset H^2(\mathbb D^2)$ be an invariant subspace generated by homogeneous polynomials, and let $S_f$ denote compression of multiplication by $f$ to the quotient module $M^\perp$. Classify the quotient modules for which all cross-commutators among $S_z,S_w,S_z^*,S_w^*$ belong to the trace class, the Macaev class, or a weak Schatten class, and compute the Dixmier traces of powers of $[S_f^*,S_f]$ whenever such powers lie in the weak trace class.
