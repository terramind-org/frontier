id: um.20002213
title: Loop-group factorization and normalization obstructions for 2 by 2 totally nonnegative block Toeplitz matrices
field: mathematics
tier: prose
statement: |-
  Let
  $$
  M_{\mathbf A}=
  \begin{pmatrix}
  A_0&0&0&\cdots\\
  A_1&A_0&0&\cdots\\
  A_2&A_1&A_0&\cdots\\
  \vdots&\vdots&\vdots&\ddots
  \end{pmatrix}\in TN,
  $$
  and let $F(t)=A_0+tA_1+t^2A_2+\cdots\in M_2[[t]]$, where $A_0$ is invertible. Is there an AESW-type factorization for $F(t)$?
