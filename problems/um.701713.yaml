title: Kourovka Notebook Problem 20.55
field: mathematics
tier: prose
statement: |-
  Are there soluble finite groups $G$ and $H$, of derived lengths 2 and 4 and having identical character tables?

  Pairs of nonisomorphic soluble finite groups with identical character tables and with derived
  lengths $n$ and $n+1$ for any $n\ge 2$ were constructed in (S. Mattarei, *J. Algebra*, **175** (1995) 157--178).
