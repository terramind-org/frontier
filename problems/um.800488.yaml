title: Billiards and Quantitative Symplectic Geometry — Bernhard Albach, Umberto Hryniewicz, and Alexandru Oancea — Problem 1
field: mathematics
tier: prose
statement: |-
  **Conjecture 1.** For a Reeb flow on a closed connected $3$-manifold, either there are exactly two periodic orbits, or $$ \liminf_{T\to+\infty} \frac{\log P(T)}{\log T} \geq 2 $$ holds.

  The conjecture above, which is also cited in [DanCG], has been confirmed in [Albach] for geodesic flows of reversible Finsler metrics on $S^2$. This significantly improves the best known growth rate $$ \liminf_{T\to+\infty} P(T)\frac{\log T}{T} > 0 $$ which was due to Hingston [Hingston1993]. In fact, in this case there is always quadratic growth since the number of closed geodesics is always infinite. On closed connected orientable reversible Finsler surfaces of genus $\geq 1$, Conjecture 1 is long known to be true for the geodesic flow. Hence, there is always quadratic growth of closed geodesics in any reversible Finsler closed surface -- orientable or not. Geodesic flows on $S^2$ can be lifted to Reeb flows on the standard contact $3$-sphere. It should be noted that the results from [Albach] cover a significantly larger class of such Reeb flows.

  One might wonder if the same holds for a general low-dimensional symplectic dynamical system, which means either a symplectic diffeomorphism on a compact symplectic surface (with or without boundary), or the Hamiltonian flow on a $3$-dimensional compact regular energy level without boundary. In [Albach] it is also proved, via a simple argument based on the transverse foliations by Le Calvez and Tal [LeCalvez-Tal], that the same dichotomy as in Conjecture 1 holds for any symplectic diffeomorphism on $S^2$.

  The confirmation of Conjecture 1 is, however, **not** the problem proposed here. Instead, we would like to propose the problem of investigating whether the same phenomenon holds in any dimension.
