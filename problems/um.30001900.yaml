title: Classification of Unitary Drinfeld Twists
field: mathematics
tier: prose
statement: Let $G$ be a compact semisimple Lie group and let $G_q$ be its Drinfeld--Jimbo $q$-deformation ($0 < q < 1$). How can unitary Drinfeld $2$-cocycle twists (up to coboundary equivalence) for the compact quantum group $G_q$ be classified or explicitly described?
