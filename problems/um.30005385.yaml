title: Cancellation and Fixed-Form Stable Classes of Manifolds
field: mathematics
tier: prose
statement: Can boundaries of thickened even-dimensional complexes be used systematically to produce manifolds with arbitrarily large fixed-form homotopy stable class $\mathcal S_{\lambda}^{\mathrm{st},h}(M)$? For which fundamental groups is $\mathcal S_{\lambda}^{\mathrm{st},h}(M)$ trivial, finite, or infinite, particularly for closed four-manifolds?
