title: Displacement-Energy Bound for Plank Coverings
field: mathematics
tier: prose
statement: Let $K$ be a convex body covered by finitely many planks whose relative widths sum to $w$, and let $B^\circ$ be the polar of the unit ball for the norm used to measure those widths. Must the displacement energy satisfy $e(K\times B^\circ)\leq 2w$?
