id: um.30004328
title: Unbounded Semi Effective Orders on Projective Surfaces
field: mathematics
tier: prose
statement: Does there exist a smooth projective surface $X$ carrying primitive classes $F_n$ whose semi-effective orders $k_n$, defined as the least positive $k$ for which $kF_n$ is numerically equivalent to an effective divisor, tend to infinity? Is the analogous phenomenon possible when the effective divisors are irreducible curves?
