statement: |-
  \section{General position subsets}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A finite subset of $\mathbb R^2$ is in general position if it contains no three collinear points. For $n\geq3$ define
  \[f(n)=\min\bigl\{N\in\mathbb N:\ \forall P\subset\mathbb R^2\text{ finite},\ |P|\geq N\Longrightarrow\bigl(\exists\text{ a line containing }n\text{ points of }P\bigr)\ \text{or}\ \bigl(\exists S\subseteq P,\ |S|=n,\ S\text{ in general position}\bigr)\bigr\}.\]
  \paragraph{Statement recorded in the supplied source.}
  Determine $f(n)$, including its asymptotic growth. In particular, is there an absolute $C$ such that $f(n)\leq Cn^2$ for all $n\geq3$? \sref{statement}{2}
  \subsection{Short English statement}
  How many planar points force either n collinear points or n points with no three collinear, and is a quadratic number always enough?
