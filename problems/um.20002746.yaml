title: Indecomposable injective FI-modules in characteristic zero
field: mathematics
tier: prose
statement: "**Classify torsion free injectives.** What's the injective hull of the trivial \\(\\mathrm{FI}\\)-modules (\\(V_n=\\mathrm{triv}_n\\) for each \\(n\\))? In general, classify all indecomposable injectives. Is it true that these indecomposable injectives are degree-wise finitely generated (same question over a more general combinatorial category)?"
