title: Brauer–Manin Obstructions for Rationally Connected Fibrations
field: mathematics
tier: prose
statement: Let $k$ be a number field and $f:X\to\mathbb P^1_k$ a projective surjective morphism with geometrically rationally connected generic fibre. If the Brauer–Manin obstruction is the only obstruction to the Hasse principle for every smooth fibre of $f$, is it also the only obstruction for $X$?
