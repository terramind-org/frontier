title: Orbit Closures of Full Cartan Torus Actions
field: mathematics
tier: prose
statement: Let $G$ be an abelian subgroup of $\operatorname{SL}_d(\mathbb Z)$ of rank at least two that contains a totally irreducible toral automorphism and is maximal in rank among abelian subgroups containing it. Classify the orbit closures of the diagonal $G$-action on $\mathbb T^d\times\mathbb T^d$.
