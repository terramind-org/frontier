  \item[\hypertarget{source:statement:2}{S2}] Michel Waldschmidt, \emph{Open Diophantine Problems}, arXiv:math/0312440v2 (24 January 2004), Conjecture 4.20 and preceding torus formulation, p.43. \url{https://arxiv.org/abs/math/0312440v2}.
  \end{description}
  \label{end:statement}
