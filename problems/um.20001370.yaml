title: Power twists obstruct arithmetic reconstruction from the preperiodic-point field
field: mathematics
tier: prose
statement: |-
  What do you need to know about \(K_f\) to figure out what \(f\) was (or how close to \(f\) can you get)?

  The archived AIM page supplies the missing definition verbatim: for a number field \(K\) and \(f(z)\in K(z)\) of degree at least two,
  \[
  K_f=K(\text{all preperiodic points of }f). \]
  The next AIM item separately introduces \(K_f'=K(\text{all periodic points of }f)\), confirming that \(K_f\) in this problem means the field generated by **preperiodic**, not merely periodic, points. The official workshop summary likewise distinguishes dynatomic fields generated by periodic points from arboreal fields generated by backward orbits, but it does not discuss Problem 7.2 specifically.

  There is a second ambiguity: “conjugate” may mean conjugate by \(\operatorname{PGL}_2(K)\) or by \(\operatorname{PGL}_2(\overline K)\). The distinction is essential below. The neighboring Problem 7.1 explicitly suggests the equivalence types “conjugate, an iterate, or conjugate to something that commutes,” and asks only for commensurability of \(K_f\) and \(K_g\). We therefore analyze exact equality and commensurability of embedded extensions, and distinguish arithmetic from geometric conjugacy.
