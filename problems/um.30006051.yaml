title: Completeness of Unzipped-Link Invariants for Spatial Theta Graphs
field: mathematics
tier: prose
statement: For a spatial theta-graph $\Gamma\subset S^3$, let $L_\Gamma$ consist of its three constituent knots and all two-component links obtained by unzipping one edge with every possible linking number. Does $L_\Gamma$ determine $\Gamma$ up to isotopy, and what minimal sublist of $L_\Gamma$ suffices?
