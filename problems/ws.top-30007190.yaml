statement: |-
  \section*{Hyperbolicity of one-relator groups without Baumslag–Solitar subgroups}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For finite X and any $r\in F(X)$, is $\langle X|r\rangle $ word-hyperbolic whenever it contains no subgroup isomorphic to BS(m,n) for any nonzero integers m,n?
  \subsection{Short English statement}
  For finite X and any $r\in F(X)$, is $\langle X|r\rangle $ word-hyperbolic whenever it contains no subgroup isomorphic to BS(m,n) for any nonzero integers m,n?
