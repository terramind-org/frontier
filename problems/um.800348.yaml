title: Enumeration of Matchings — Problem 19
field: mathematics
tier: prose
statement: |-
  One can also look at graphs that are bipartite but not planar.
  A natural example is the $n$-cube (that is, the $n$-dimensional cube
  with all sides of length 2). It has been shown that the number
  of perfect matchings of the $n$-cube goes like $1$, $2$, $9=3^2$,
  $272=16 \cdot 17$,
  $589185=3^2 \cdot 5 \cdot 13093$, $\dots$.

  Find a formula for the number of perfect matchings
  of the $n$-cube.

  (This may be intractable; after all, the graph has exponentially
  many vertices.)
