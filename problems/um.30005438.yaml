title: Trivialization Structures for Nondegenerate Cycle Sets
field: mathematics
tier: prose
statement: For a nondegenerate cycle set $X$, develop a trivialization theory relating $X$ to $X_{\mathrm{tr}}$. Determine the relations between $S(X)$ and $S(X_{\mathrm{tr}})$ and between $G(X)$ and $G(X_{\mathrm{tr}})$, decide whether they admit a brace-like description, and study the $L$-algebra trivialization defined by $$x\mathbin{\cdot_{\mathrm{tr}}}y=\begin{cases}e,&x\leq y,\\y,&x\nleq y.\end{cases}$$ Determine the resulting structure.
