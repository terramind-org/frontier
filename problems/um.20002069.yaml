title: A Morita shadow of contact homology and a dualizability obstruction
field: mathematics
tier: prose
statement: "**Question 1.11.** Generalizing the theme of computing things, one could try to extend symplectic field theory to an “extended field theory”. Recall that a TQFT assigns to an \\(n\\)-manifold (possibly with some extra structure) a number, and to an \\((n-1)\\)-manifold a vector space, satisfying various axioms which allow one to compute the invariant of an \\(n\\)-manifold by cutting it up along \\((n-1)\\)-manifolds. But then one is left with the problem of understanding the \\((n-1)\\)-dimensional invariant. In an extended TQFT, one can compute the latter by cutting along \\((n-2)\\)-dimensional manifolds, to each of which is assigned a category. (One can continue by assigning 2-categories to \\((n-3)\\)-manifolds and so forth, so that the manifolds get simpler while the theory gets more complicated...) Now the question is, how can one do this for SFT?"
