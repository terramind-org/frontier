title: Virtual-knot problem 24 — Does it follow that $K$ and $K'$ are equivalent as classical knots?
field: mathematics
tier: prose
statement: |-
  Let $VKT/Z$ denote virtual knot theory modulo $Z$-equivalence, as
  defined in the section above on virtual knot theory. Recall that two
  virtual diagrams that are $Z$-equivalent have the same Jones
  polynomial. It is known that classical knot theory embeds in virtual
  knot theory. Does classical knot theory embed in $VKT/Z?$ That is,
  suppose that $K$ and $K'$ are classical knot diagrams, and suppose
  that $K$ and $K'$ are equivalent using virtual moves and $Z$-moves.
  Does it follow that $K$ and $K'$ are equivalent as classical
  knots?
