title: Kourovka Notebook Problem 20.110
field: mathematics
tier: prose
statement: |-
  Are there residually finite hereditarily just infinite groups that are

  a) amenable but not solvable?

  b) amenable but not elementary amenable?

  c) of intermediate word growth?

  d) of intermediate subgroup growth?

  All examples that we know are either linear (hence Tits Alternative applies), or have a quotient with property (T) (hence cannot be amenable).
