schema: 1
id: rudinsconjecture.rudins-conjecture-strong
title: Rudin's conjecture on squares in arithmetic progressions (rudins_conjecture_strong)
field: mathematics
tier: proof
statement: |-
  A stronger form of Rudin's conjecture: for every $N \ge 6$, the arithmetic progression
  $24 n + 1$ attains the maximum $Q(N)$.
ams:
  - 11
tags:
  - wikipedia
references:
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Rudin%27s_conjecture
