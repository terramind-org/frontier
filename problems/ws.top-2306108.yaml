  \item[\hypertarget{source:2306108:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 2306108 (AMR-022-6108). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
