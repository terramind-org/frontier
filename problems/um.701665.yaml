statement: (W. Boone and G. Higman) Does every finitely generated group with solvable word problem embed into a finitely presented simple group? It is known that every such group embeds into a simple subgroup of a finitely presented group (W. Boone, G. Higman, *J. Austral. Math. Soc.*, **18**, no. 1 (1974), 41--53).
