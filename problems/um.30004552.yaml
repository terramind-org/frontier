title: Incompleteness and Self-Consistency Below Robinson Arithmetic
field: mathematics
tier: prose
statement: Let $R$ be Robinson’s arithmetic, and let $\mathcal D$ be the set of recursively axiomatizable consistent theories $T\lhd R$ for which $G1$ holds, meaning that every recursively axiomatizable consistent theory interpreting $T$ is incomplete. Such theories are known to exist. Is the interpretability ordering $(\mathcal D,\lhd)$ well founded? Finally, does $G2$ hold for $R$, meaning $R\nvdash\operatorname{Con}(R)$?
