title: Dimension repair and a sharp ellipsoid stability formula
field: mathematics
tier: prose
statement: |-
  **Question by Makai and Martini.** It is known that if for any direction \(u\in S^{n-1}\), a parallel section function \(A_{K,u}(t)\) has maximum at \(t=0\), then body \(K\) is symmetric.

  What if we pose the same question but replacing volumes by surface areas, that is
  \[
  \widetilde A_{K,u}(t)=\left|\partial\left(K\cap\{tu+u^\perp\}\right)\right|_{n-1},
  \]
  is body \(K\) still symmetric?
