title: Rationally Connected Cycles on Hyperkähler Manifolds
field: mathematics
tier: prose
statement: Let $X$ be a projective hyperkähler manifold of dimension $2n$. Does $X$ contain a rationally connected subscheme of pure dimension $n$? If $Y_1,Y_2\subset X$ are rationally connected subschemes of dimension $n$, do arbitrary points $y_i\in Y_i$ determine the same class $c_X\in CH_0(X)$?
