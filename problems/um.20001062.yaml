title: Trace equivalence and a triple-overlap obstruction
field: mathematics
tier: prose
statement: |-
  Conjecture 6.17. The following were all presented by Seymour, with no other attributions given. For the following questions, matrices are assumed to be \(n\times n\) \(0\)-\(1\) matrices such that \(a_{ij}=1\) implies \(a_{ji}\ne1\), and all diagonal elements equal \(1\).

  The original AIM PDF verifies that the fragment is actually **items 3 and 4 of Conjecture 6.17**, in Section 6.3, “Matrices.” The stray definition of spectral radius and terminal “8” belong to the transition to Conjecture 6.18, not to this problem.

  The following source text is verified directly from page 8 of the PDF.

  Item 2, immediately preceding the assigned fragment, supplies the shared quantitative hypotheses:
  \[
  A_1,\ldots,A_t,\qquad
  \text{row sums of }A_i\text{ at least }r_i+1,\qquad
  \sum_{i=1}^t r_i\ge n,
  \tag{1.1}
  \]
  and asks whether
  \[
  \operatorname{tr}(A_1A_2\cdots A_t)>n. \tag{1.2}
  \]
  The source explicitly says that this is equivalent to Conjecture 6.5.

  Item 3 forms \(t+1\) copies of the common vertex set \(V\), puts horizontal edges between equal vertices in consecutive copies, and puts the \(A_k\)-edges between copies \(k\) and \(k+1\). It asks for a nonhorizontal path from the first copy of some \(u\) to the last copy of the same \(u\). Item 4 squashes the layers onto \(V\), colors an edge from layer \(k\) by \(k\), and asks for a nontrivial rainbow directed cycle whose colors appear in increasing order.

  The diagonal \(1\)'s are the horizontal waiting steps. Put
  \[
  B_i=A_i-I,\qquad
  E_i=\{(u,v):u\ne v,\ (B_i)_{uv}=1\}. \tag{1.3}
  \]
  Then \(B_i\) is a zero-diagonal \(0\)-\(1\) matrix, every \(E_i\) is an oriented edge set, and
  \[
  \delta^+(E_i)\ge r_i. \tag{1.4}
  \]
  The wording of item 3 can be read as adding a matrix diagonal edge on top of the already specified horizontal edge. Whether those coincident edges are viewed as one edge or two does not affect the existence question. The matrix model counts the diagonal choice once, and that is the convention used here.

  An “increasing” colored cycle means that one can choose a cyclic starting vertex so that the distinct colors encountered along the directed traversal are
  \[
  i_1<i_2<\cdots<i_s. \tag{1.5}
  \]
  This is exactly the convention forced by the layered construction.
