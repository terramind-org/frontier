title: Kourovka Notebook Problem 11.36
field: mathematics
tier: prose
statement: |-
  Let $G=B(m,n)$ be the
  free Burnside group of rank $m$ and of odd exponent $n \gg 1$. Are
  the following statements true?

  a) Every 2-generated subgroup of $G$ is
  isomorphic to the Burnside $n$-product of two cyclic groups.

  b)
  Every automorphism $\varphi$ of $G$ such that
  $\varphi ^n=1$ and $b^{\varphi}\cdot b^{\varphi ^2} \cdots
  b^{ \varphi ^n}=1$ for all $b \in G$ is an inner
  automorphism (here $m > 1$).

  *Editors' comment:* for large prime $n$ this follows from
  (E. A. Cherepanov, *Int. J. Algebra Comput.*, **16** (2006), 839--847), for prime $n\geq 1009$ from
  (V. S. Atabekyan, *Izv. Math.*, **75**, no. 2 (2011), 223--237);
  this is also true for odd $n\geq 1003$ if in addition the order of $\varphi$ is a prime power (V. S. Atabekyan,
  *Math. Notes*, **95**, no. 5 (2014), 586--589).

  c) The group $G$ is Hopfian if $m < \infty$.

  d) All retracts of $G$ are free.

  [Archived solved part(s) of 11.36:]
  e) Let $G=B(m,n)$ be the
  free Burnside group of rank $m$ and of odd exponent $n \gg 1$. Is it true that
  all zero divisors in the group ring ${\mathbb{Z}G$ are trivial? which means that if $ab=0$ then $a=a_1c$,
  $b=db_1$ where $a_1, c, b_1, d \in {\mathbb{Z}G$, \ $cd=0$, and the
  set \ $\mathrm{supp} c \cup \mathrm{supp} d$ \ is contained in a cyclic subgroup
  of $G$.
