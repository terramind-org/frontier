statement: |-
  \section*{Uniform variance-influence bound for hypergraph properties}\label{30007094}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each fixed $r>=3$, does $C_r$ exist such that for every $n>=r$, every p in (0,1), and every Boolean property of r-uniform hypergraphs invariant under vertex relabeling, $Var_p(f)<=C_r$ $I_p(f)/(\log $ $n)^(r/(r-1))$?
  \subsection{Short English statement}
  For each fixed $r>=3$, does $C_r$ exist such that for every $n>=r$, every p in (0,1), and every Boolean property of r-uniform hypergraphs invariant under vertex relabeling, $Var_p(f)<=C_r$ $I_p(f)/(\log $ $n)^(r/(r-1))$?
