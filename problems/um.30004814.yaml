title: The Weak Gordon–Luecke Conjecture
field: mathematics
tier: prose
statement: Let $K_1$ and $K_2$ be knots in a closed oriented irreducible $3$-manifold $Y$, neither a rational unknot in a lens space. Prove that $Y\setminus K_1$ and $Y\setminus K_2$ are orientation-preservingly homeomorphic if and only if an orientation-preserving self-homeomorphism of $Y$ takes $K_1$ to $K_2$.
