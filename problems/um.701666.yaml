title: Kourovka Notebook Problem 20.8
field: mathematics
tier: prose
statement: |-
  Suppose $K < H < F$ are free groups of finite rank such that
  $\operatorname{rank}(H) < \operatorname{rank}(K)$, but all proper subgroups of $H$ which contain $K$ have ranks ${}\geq \operatorname{rank}(K)$. Then is the inclusion of $H$ in $F$ the only homomorphism $H\rightarrow F$ fixing all elements of $K$?
