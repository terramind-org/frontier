title: Steenrod stability, parity summands, and the Satake fiber
field: mathematics
tier: prose
statement: |-
  1. What is the representation-theoretic meaning of the Steenrod algebra action on mod-\(p\) cohomology? For example, on the cohomology of \(Gr\)?
  2. Does the Steenrod algebra act on the cohomology of any parity sheaf? (Note: examples of Goresky show that this fails for mod-\(p\) IC sheaves.)
