title: "Tight 5-cycle minus an edge: solved density and a recursive deficit identity"
field: mathematics
tier: prose
statement: "**Conjecture (Tight $5$-cycle minus an edge).** Let the $3$-uniform hypergraph $C_5^-$ be obtained from the tight $5$-cycle $C_5^3$ by removing one edge. An example of a $C_5^-$-free $3$-graph can be obtained by taking a complete $3$-partite $3$-graph and repeating this construction recursively within each of the three parts, giving edge density $1/4$ in the limit. Prove that the Turán density $\\pi(C_5^-) = \\lim_{n \\to \\infty} \\operatorname{ex}(n, C_5^-) / \\binom{n}{3}$ satisfies $\\pi(C_5^-) = 1/4$."
