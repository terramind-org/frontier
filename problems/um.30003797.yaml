title: Finiteness of Tate–Shafarevich Sets for Algebraic Groups
field: mathematics
tier: prose
statement: |-
  Let $G$ be an absolutely almost simple group over a finitely generated field $K$ of good characteristic, and let $S$ be a finite set of places. Is the Tate–Shafarevich set given by the fiber over the distinguished point of
  $$
  H^1(K,G)\longrightarrow\prod_{v\notin S}H^1(K_v,G)
  $$
  finite?
