title: Integral Points over Almost All Primitive Number Fields
field: mathematics
tier: prose
statement: Let $X/\mathbb Q$ be a hyperbolic curve with a model over $\mathbb Z$, and let $n\geq1$. When primitive degree-$n$ number fields $K$ are ordered by discriminant, does $X(\mathcal O_K)=X(\mathbb Z)$ for $100$ percent of them?
