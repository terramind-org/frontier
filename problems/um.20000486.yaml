title: All-coupling reverse Robin inequality for tangential domains
field: mathematics
tier: prose
statement: |-
  “...with a boundary parameter $\alpha0$ centred at the origin.”

  This record is item 1.2, “Bareket's conjecture,” in the AIM list from the workshop *Shape optimization with surface interactions*.

  The enumerated conjecture that follows is intact.

  1. If $d=2$, $\alpha<0$, and $\Omega$ is bounded and simply connected, then the disk $B_R$ with $|B_R|=|\Omega|$ satisfies
     \[
     \lambda_1(\Omega,\alpha)\leq \lambda_1(B_R,\alpha).
     \]
  2. If $d\geq3$, $\alpha<0$, and $\Omega$ is bounded and convex, then the ball $B_R$ with $|B_R|=|\Omega|$ satisfies the same inequality.

  Here and below the sign convention is
  \[
  -\Delta u=\lambda u\quad\hbox{in }\Omega,
  \qquad \partial_\nu u+\alpha u=0\quad\hbox{on }\partial\Omega,
  \qquad \alpha<0. \]
  Only the damaged prose before the displayed list has been reconstructed. No mathematical symbol missing from the two-part conjecture is needed below.
