id: um.20001129
title: A singleton obstruction to the Katz critical-set question
field: mathematics
tier: prose
statement: |-
  **Problem 3.17 (N. Katz).** Does there exist a finite subset \(A\subset\mathbb Z\), \(|2A|=k|A|\), so that for the function \(f(n,k)\) defined in the previous problem every proper \(A'\subset A\) satisfies
  \[
  |nA'|\geq f(n,k)|A'|?
  \]

  Suppose \(A\subseteq\mathbb Z\). If \(|2A|<k|A|\), describe the sumset \(|nA|\) as \(n\) tends to infinity. Find \(f(n,k)\), which is the smallest number such that
  \[
  |nA|\leq f(n,k)|A|
  \]
  for all \(A\) such that \(|2A|<k|A|\).

  For a fixed integer \(n\geq2\) and real \(k>1\), does there exist a nonempty finite \(A\subset\mathbb Z\), preferably \(|A|\geq2\), with \(|2A|=k|A|\) and the stated property for every proper subset?
