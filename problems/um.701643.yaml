statement: Let $G_\Gamma$ be a partially commutative soluble group of derived length $n \geq 3$ with defining graph $\Gamma$ (the definition is similar to the case of $n=2$, see 17.104). Is it true that the centralizer of any vertex of the graph is generated by its adjacent vertices?
