title: Open Problems on Central Simple Algebras — Conjecture 24 (Tate's Conjecture T)
field: mathematics
tier: prose
statement: |-
  Let $\ell\neq p$ be a prime. Let $P_2(X,t)$ be the characteristic
  polynomial of the action of the (geometric) Frobenius morphism on the
  $\ell$-adic cohomology ${\text\mathrm{H}}^2(\overline{X},{\mathbb{Q}}_{\ell}(1))$, where $\overline{X} = X
  \times_{k} k_{{\mathrm{sep}}}$. Let $\operatorname{NS}(X) = \mathrm{Pic}(X)/\mathrm{Pic}^0(X)$ denote the
  *N\'eron--Severi group* of $X$ and $\rho(X) = \operatorname{rank}_{{\mathbb{Z}}} \operatorname{NS}(X)$ its
  *Picard number*. Tate [Ta65, \mathbb{S}3] has earlier conjectured
  a relationship between the Picard number and this characteristic
  polynomial for surfaces.

  The Picard number of $X$ is equal to the multiplicity of the root
  $t=q^{-1}$ in the polynomial $P_2(X,t)$.
