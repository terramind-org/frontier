title: Dual-Frame Completion of Bessel Wavelet Systems
field: mathematics
tier: prose
statement: Given two Bessel dyadic wavelet systems generated by $\psi_1$ and $\widetilde\psi_1$, can $\psi_2$ and $\widetilde\psi_2$ always be chosen so that the two two-generator systems are dual frames? Equivalently, does Han's conjectured tight-frame completion hold for every sufficiently large bound $K$?
