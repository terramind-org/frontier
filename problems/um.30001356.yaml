title: Finite-Topology Embedded Minimal Surfaces
field: mathematics
tier: prose
statement: For every nonnegative integer $g$, does there exist a unique non-planar complete embedded minimal surface in $\mathbb{R}^3$ with genus $g$ and one end; more generally, does a finite-topology surface of genus $g$ with $n\geq2$ ends embed minimally and completely in $\mathbb{R}^3$ exactly when $n\leq g+2$?
