title: A conservation-aware calibration of PDE Arnold diffusion
field: mathematics
tier: prose
statement: 5. (Paul Rabinowitz) Is there a reasonable PDE analogue of Arnold's diffusion? It seems that a version of finite dimensional transition chains is not the right mech-anism for PDE. There are results of Kuksin which prove "diffusion" for PDE with respect to high order Sobolev norms. The same problem for infinite lattices like Fermi-Pasta-Ulam system. 2
