id: oeisa262781.conjecture-3
title: Representations of $n$ as $x^2 + \phi(y^2) + \phi(z^2)$ (conjecture_3)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): For any integer $n > 4$, we can write $2n$ as $\phi(p^2) + \phi(x^2) + \phi(y^2)$
  with $p$ prime and $p \le x \le y$.
