title: Quadratically Many Essentially Different Lines in Dense Point Sets
field: mathematics
tier: prose
statement: Let $P\subset\mathbb R^2$ consist of $n$ points with minimum pairwise distance $1$ and diameter $O(\sqrt n)$. Must $P$ determine $\Omega(n^2)$ pairwise essentially different lines, where two lines are essentially different if their directions differ by at least $1/n$ or their $1/\sqrt n$-neighborhoods do not intersect inside $\operatorname{conv}(P)$?
