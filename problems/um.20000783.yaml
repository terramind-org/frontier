title: Affine automorphism-orbit finiteness and a two-class torus example
field: mathematics
tier: prose
statement: |-
  **Recovered question.** Fix a variety $X$ and $\alpha\in\operatorname{Br}(X)$. Is
  \[
  \mathcal E_X(\alpha)=
  \{\beta\in\operatorname{Br}(X):D^b(X,\beta)\simeq D^b(X,\alpha)\}
  \]
  finite?
