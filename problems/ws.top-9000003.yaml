  \item[\hypertarget{source:9000003:2}{S2}] Nikita Kalinin and Mikhail Shkolnikov, \emph{The number $\pi$ and summation by $SL(2,\mathbb Z)$}, Arnold Mathematical Journal (2018) \S4, Questions, pp. 5--6. \url{https://amj.math.stonybrook.edu/html-articles/Files-2015-2024/17-75/index.html}.
  \item[\hypertarget{source:9000003:3}{S3}] Nikita Kalinin and Mikhail Shkolnikov, \emph{Tropical formulae for summation over a part of $SL(2,\mathbb Z)$}, arXiv:1711.02089 (updated version) \S1.6, Petrov's comment and Remark 7, pp. 6--7. \url{https://arxiv.org/pdf/1711.02089}.
