title: Kourovka Notebook Problem 16.90
field: mathematics
tier: prose
statement: |-
  Is it true that the automorphism group
  $\text{Aut} F$ of an infinitely generated free group $F$ is

  a) the normal closure of a single element?

  b) the normal closure of some involution in $\text{Aut} F$?

  For a free group $F_n$ of
  finite rank $n$ \ M. Bridson and K. Vogtmann
  have recently shown
  that $\text{Aut} F_n$ is the normal closure of some involution,
  which permutes some basis of $F_n$. It is also known that the
  automorphism groups of infinitely generated free nilpotent groups
  have such involutions.
