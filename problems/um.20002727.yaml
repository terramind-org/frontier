title: Exact matrix recurrence and the irrational-exponent obstruction in noncrystallographic type
field: mathematics
tier: prose
statement: |-
  Remarks:

  • (N. Reading, D. Speyer) Early calculations suggest that there are “approximate” recurrences, that one returns close to, but bounded away from the original matrix.

  Choose an orientation and a real skew-symmetrizable exchange matrix whose
  Cartan companion encodes a noncrystallographic finite Coxeter diagram.
  What do its matrix and variable mutations do?  Are their orbits finite,
  periodic, or approximately recurrent?
