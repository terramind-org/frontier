title: Open Problems and Questions about Geodesics — Question 34 (Benjamin Schmidt)
field: mathematics
tier: prose
statement: |-
  \begin{align*}
  T_b &:=\{ v\in SM\mid \textrm{ any lift of $\gamma_v$ stays in a bounded subset of $\widetilde M$}\}, \\
  T_p &:=\{ v\in SM\mid \textrm{ any lift of $\gamma_v$
  is unbounded, and approaches infinity properly}\}, \\
  T_i &:=TM\setminus (T_b \cup T_p).
  \end{align*}

  All three sets are measurable and invariant under the geodesic flow. By ergodicity one of them has full measure.

  *Which of these sets has full measure?*
