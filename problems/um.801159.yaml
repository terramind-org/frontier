title: Nijenhuis Geometry and Integrable Systems — Problem 12
field: mathematics
tier: prose
statement: |-
  \begin{Problem}
  Certain Frobenius manifolds seem to give examples of geometric Poisson bracket of order 3
  (at least, the WDVV equation does it). Is Frobenius structure projectively invariant? Can one replace, in the definition of Frobenius structure, the flat metric by a metric of constant curvature?
  \end{Problem}

  As we mentioned above, geometric Poisson brackets of order 3 are essentially the same as Killing tensors whose covariant derivative satisfies a certain relation, and certain Forbenius manifolds were used to construct such Killing tensors. Does there exists a construction of a Killing tensor by a Frobenius manifold?
