title: Weight Conjectures for Spetsial Reflection Groups
field: mathematics
tier: prose
statement: For a spetsial $\mathbb Z_\ell$-reflection group $W$, prove analogues of the Alperin weight conjecture and Robinson's ordinary weight conjecture that relate the unipotent principal-block invariants of $W$ to the fusion-system invariants of $\ell$-compact groups with Weyl group $W$.
