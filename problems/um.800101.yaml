title: Foliations and Diffeomorphism Groups — Question 42
field: mathematics
tier: prose
statement: |-
  Consider a group action $\Phi: G\to \text{Homeo}^+(\mathbb{R}^2)$ on the plane preserving 2 transverse (maybe with prong singularities) foliations $\mathcal{F}^+$ and $\mathcal{F}^-$.
  This action always extends [bonatti2024action] to *the circle at infinity* associated to the pair of foliations $(\mathcal{F}^+,\mathcal{F}^-)$, as an action $\varphi: G\to Homeo^+(**S**^1)$ called *the action induced by $\Phi$*.

  Can we see on the induced action $\varphi$ if $\Phi$ is smoothable or not?
