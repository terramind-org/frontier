title: Sharp Polynomial-Time Upper Bounds for Minimum Bisection
field: mathematics
tier: prose
statement: Construct polynomial-time computable bounds $\operatorname{UB}(G)$ for the minimum-bisection objective $\operatorname{OPT}(G)$ such that $\operatorname{OPT}(G)\leq\operatorname{UB}(G)$ for every graph $G$ and $\operatorname{UB}(G)$ is asymptotically sharp on random graphs.
