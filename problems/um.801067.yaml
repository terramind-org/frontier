title: "Henon Maps: Open Problems — Question 19"
field: mathematics
tier: prose
statement: |-
  Recall the following standard definitions (see [BS]). Let $K^\pm$ denote the set of points with bounded forward orbits for $f^\pm$. We denote $J^\pm:= \partial K^\pm$. We also define $J:= J^+ \cap J^-$ and $J^*$ to be the closure of ${\mathcal{S}}$ (hence $J^* \subset J$).

  If $f$ is quasi-hyperbolic, then is $\mathrm{int}(K^+)$ the union of a finite number of basins of sink orbits?
