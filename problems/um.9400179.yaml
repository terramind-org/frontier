title: Greenberg's pseudo-null conjecture
field: mathematics
tier: prose
statement: Let $F$ be totally real, let $\widetilde F$ be the compositum of all $\mathbb Z_p$-extensions of $F$, let $\widetilde L$ be its maximal unramified abelian pro-$p$ extension, and set $\widetilde X=\operatorname{Gal}(\widetilde L/\widetilde F)$. Is $\widetilde X$ pseudo-null over $\widetilde\Lambda=\mathbb Z_p[[\operatorname{Gal}(\widetilde F/F)]]$?
