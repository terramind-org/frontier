title: Kourovka Notebook Problem 11.31
field: mathematics
tier: prose
statement: |-
  Is a radical group
  polycyclic if it is a product of two polycyclic subgroups? The
  answer is affirmative for soluble and for hyperabelian groups
  (D. I. Zaitsev, *Math. Notes*, **29**, no. 4 (1981),
  247--252; \ J. C. Lennox, J. E. Roseblade, *Math. Z.*,
  **170** (1980), 153--154).
