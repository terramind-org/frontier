statement: |-
  Large data global wellposedness for 2D Burgers with hyper-dissipation

  Prove the global existence of (strong) solutions to the 2D Burgers' equation with hyperviscosity; namely, \(\partial_tu+u\cdot\nabla u=-\nu\Delta^2u\).
