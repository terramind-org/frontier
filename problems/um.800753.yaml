title: Banach Spaces and Ramsey Theory — Problem 17
field: mathematics
tier: prose
statement: |-
  Recall that a *support set* in a Banach space $X$ is a nonempty convex set
  $C$ with the property that every point $x$ of $C$ is its support point, i.e. there
  is a functional $f$ of $X$ such that
  \[ f(x)=\inf\{f(y): y\in C\}<\sup\{f(y): y\in C\}. \]
  The existence of a support set in every non-separable Banach space is an old problem
  of S. Rolewicz [Rol] who showed that separable Banach spaces do not admit
  support sets and who noticed that many of the non-separable Banach spaces
  do admit support sets.

  *(S. Rolewicz [Rol])*
  Which Banach spaces admit support sets? Do all non-separable Banach spaces
  have support sets?
