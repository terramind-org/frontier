title: Closed Cantor strata in the perfect kernel of Sub(F)
field: mathematics
tier: prose
statement: The derivative of a subset \(S\) of a topological space \(X\), denoted \(S'\), is the set of limit points of \(S\). By transfinite induction, one defines the \(\alpha\)-derivative of \(S\) for every ordinal \(\alpha\). The Cantor-Bendixon rank of \(S\) is the smallest ordinal \(\beta\) such that the \(\beta\)-derivative of \(S\) and the \((\beta+1)\)-derivative of \(S\) coincide. What is the Cantor-Bendixon rank of the space of Subgroups of \(F\)?
