title: "Inner-form transfer for covering groups: a center-radical and central-sector audit"
field: mathematics
tier: prose
statement: |-
  Make sense of transferring representation from $\widetilde G_F$ to
  $\widetilde {G'}_F$, where the two linear groups $G_F$ and $G'_F$ are
  inner forms of each other.

  Possible trouble: centres of $\widetilde G_F$ and
  $\widetilde {G'}_F$ can be different.
