title: Local-Energy Classes of Summable Lattice-Gas Interactions
field: mathematics
tier: prose
statement: For translation-invariant lattice-gas interactions $\Phi$ on $\mathbb{N}^{\mathbb{Z}^d}$, let $\mathcal{A}_S$ consist of the local energy functions generated by interactions in $S=\{\Phi:\sum_{\Lambda\ni0}\lVert\Phi_\Lambda\rVert_\infty<\infty\}$, and let $\mathcal{R}_d=\{f:\sum_{n\geq1}n^d\delta_n(f)<\infty\}$. Given $\mathcal{R}_d\subseteq\mathcal{A}_S\subseteq\mathcal{R}_{d-1}$, is either inclusion an equality, or are both strict? If both are strict, characterize $\mathcal{A}_S$ by the modulus of continuity of the local energy.
