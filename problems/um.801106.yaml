title: Ultraproduct II_1 Factors — Problem 7
field: mathematics
tier: prose
statement: |-
  Recall that an embedding of $\iota: N\hookrightarrow M$ is existential if there is an embedding of $M\subset N^{\mathcal{U}}$ that restricts to the diagonal embedding under $\iota$. One can define this notion similarly for inclusions of groups.

  Does there exist a separable $N$ admitting an existential embedding $L(\mathbb{F}_2)\subset N$ and moreover satisfies $N$ is not isomorphic to a non trivial free product?
