title: Compatible Polynomial Interpolation on Algebraic Varieties
field: mathematics
tier: prose
statement: Given algebraic varieties $V_1,\ldots,V_m\subseteq\mathbb C^d$ and polynomials $p_1,\ldots,p_m$, when does a polynomial $f\in\mathbb C[x_1,\ldots,x_d]$ exist such that $f|_{V_j}=p_j|_{V_j}$ for every $j$?
