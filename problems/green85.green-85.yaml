lean:
  module: FormalConjectures.GreensOpenProblems.«85»
  decl: Green85.green_85
  statement: |-
    theorem green_85 :
      ∃ c > 0, ∀ A : Set (ℝ × ℝ),
        IsOpen A →
        A ⊆ Icc 0 1 ×ˢ Icc 0 1 →
        A.Nonempty →
        let α := (volume A).toReal
        ∃ x₁ x₂ y₁ y₂,
          {(x₁, y₁), (x₂, y₁), (x₂, y₂), (x₁, y₂)} ⊆ A ∧
          c * α ^ 2 ≤ |x₁ - x₂| * |y₁ - y₂|
  context:
    - open Green85
    - open Filter MeasureTheory Set Topology
  definitions: []
