title: Open Problems in Arithmetic Dynamics — Question 14
field: mathematics
tier: prose
statement: |-
  Let $G_{d,m,n}(c)\in\mathbb{Z}[c]$ be the Gleason polynomial of $x^d+c$.
  \begin{parts}

  (a)
  Is it true that $G_{2,m,n}$ is irreducible in $\mathbb{Q}[c]$ for all $m\ge0$
  and $n\ge1$?

  (b)
  For which $(d,m,n)$ is $G_{d,m,n}$ irreducible in $\mathbb{Q}[c]$?

  (c)
  More generally, what is the complete factorization of $G_{d,m,n}$
  in $\mathbb{Q}[c]$?
  \end{parts}
