statement: (T. Kohno) Construct explicitly a universal invariant of finite type for links in Σ × [0, 1] with values in AΣ. In the case of genus 0 the above problem is solved by Kontsevic h integral. In higher genus case a suggestion for a construction of a univer sal invariant was given by Deligne at Oberwolfach meeting 1995. In the case of a punctured surface the problem was solved by Andersen, Mattes and Reshe tikhin. Let G be a simple Lie group and MG(Σ) the moduli space of G flat connections on Σ. The space of smooth functions on MG(Σ) denoted by C(MG(Σ)) has a structure of a Poisson algebra coming from a symplectic stru cture on MG(Σ). The algebraAΣ has also a Poisson algebra structure (see [8]). If each compo nent ofAΣ is colored by a representation of G, then there is a natural Poisson algebra homomorphism τ:AΣ → C(MG(Σ)). Problem 3.23 is related to the following problem.
