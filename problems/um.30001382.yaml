title: Nonmonotonicity of Expected Random Simplex Volume
field: mathematics
tier: prose
statement: In $\mathbb{R}^3$, let $L$ be the convex hull of the half unit ball $\{x:\|x\|_2\leq1,\ x_1\geq0\}$ and the point $(-\varepsilon,0,0)$, and let $K=L\cap\{x:x_1\geq-\varepsilon+\delta\}$, where $\varepsilon,\delta>0$ are small. Is $K\subset L$ a counterexample to monotonicity of expected random-simplex volume; that is, is the expected volume of the convex hull of four independent uniform points of $K$ greater than the corresponding expectation for $L$?
