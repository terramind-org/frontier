id: um.20002222
title: Fisk's higher Toeplitz-minor transform in degree at most three
field: mathematics
tier: prose
statement: |-
  Is Fisk's conjecture true for $3\times3$ minors / $n\times n$ minors?  If
  $\sum_{k=0}^d a_kz^k$ is real-rooted with all $a_k>0$, Br\"and\'en proved
  that
  \[
  \sum_{k\geq0}
  \left|\begin{matrix}a_k&a_{k-1}\\a_{k+1}&a_k\end{matrix}\right|z^k
  \]
  is real-rooted.  Is the analogous polynomial
  \[
  \sum_{k\geq0}
  \left|\begin{matrix}
  a_k&a_{k-1}&a_{k-2}\\
  a_{k+1}&a_k&a_{k-1}\\
  a_{k+2}&a_{k+1}&a_k
  \end{matrix}\right|z^k
  \]
  also real-rooted, and likewise for higher-order minors?
