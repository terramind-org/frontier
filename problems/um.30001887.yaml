title: Multiple Cover Decomposition Thresholds for Planar Sets
field: mathematics
tier: prose
statement: A planar set $P \subset \mathbb{R}^2$ is called *cover-decomposable* if there exists an integer $m = m_2(P)$ such that every $m$-fold covering of the plane (or any subset) by translates of $P$ can be decomposed into $2$ coverings. For every cover-decomposable planar set $P$ and every integer $k \geq 2$, does the $k$-decomposition number $m_k(P)$ (such that every $m_k(P)$-fold covering by translates of $P$ decomposes into $k$ coverings) exist?
