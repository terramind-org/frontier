id: um.30003396
title: Variance Conjecture for Isotropic Convex Bodies
field: mathematics
tier: prose
statement: |-
  Does there exist an absolute constant $C$ such that every random vector $X$ uniformly distributed on an isotropic convex body in $\mathbb R^n$ satisfies
  $$
  \operatorname{Var}(|X|_2^2)\leq C\sup_{\theta\in S^{n-1}}\mathbb E\langle X,\theta\rangle^2\,\mathbb E|X|_2^2
  $$?
