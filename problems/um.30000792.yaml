title: Generic Finite Complexity in Multidimensional Dispersing Billiards
field: mathematics
tier: prose
statement: For finite-horizon dispersing billiard configurations in a $d$-dimensional flat torus, is the subset satisfying the finite-complexity condition generic in the $C^3$ topology? Equivalently, does a typical configuration have no phase point whose trajectory undergoes tangential collisions more than $2d-2$ times?
