title: Universal Faber Series Versus Universal Taylor Series
field: mathematics
tier: prose
statement: Let $\Omega=\mathbb{C}\setminus K$, where $K$ is compact and connected and $\Omega$ is connected, and let $Y$ be the family of Faber-expansion sets $\Gamma\subset\Omega$. Is the inclusion $\bigcap_{\Gamma\in Y}U(\Omega,\Gamma)\subseteq\bigcap_{\zeta\in\Omega}U(\Omega,\zeta)$ strict? Equivalently, does there exist a function universal for every Taylor-series center $\zeta\in\Omega$ but not for every Faber-expansion set $\Gamma\in Y$?
