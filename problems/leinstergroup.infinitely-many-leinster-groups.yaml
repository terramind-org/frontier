lean:
  module: FormalConjectures.Wikipedia.LeinsterGroup
  decl: LeinsterGroup.infinitely_many_leinster_groups
  statement: |-
    theorem infinitely_many_leinster_groups :
        ¬∃ n : ℕ, ∀ G : Type, ∀ (_ : Group G) (_ : Fintype G),
          IsLeinster G → Fintype.card G < n
  context:
    - open LeinsterGroup
  definitions:
    - name: LeinsterGroup.IsLeinster
      kind: def
      text: |-
        /--
        A finite group `G` is a **Leinster group** if the sum of the orders of all its normal subgroups
        equals twice the group's order.
        -/
        def IsLeinster (G : Type*) [Group G] [Fintype G] : Prop :=
          ∑ H : {H : Subgroup G // H.Normal}, Nat.card H = 2 * Fintype.card G
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/LeinsterGroup.lean#L44
