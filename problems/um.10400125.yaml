statement: (The growth rate conjecture) Let d = max{d0,..., dn}. Then|Z G r (M )| = O(rd). It is well known that the quantum invariants only grows like r to some power. The power is bounded from above by some simple function (depe nding on G) of the Heegaard genus of the manifold.
