title: Quantitative opposite-end divergence under convex distance
field: mathematics
tier: prose
statement: |-
  If \(\alpha\ne\beta\) are complete unit-speed geodesics in a complete simply connected Riemannian manifold without conjugate points and
  \[
  d(\alpha(t),\beta(t))\longrightarrow0\qquad(t\to-\infty),
  \]
  must their equal-time distance tend to infinity as \(t\to+\infty\)?
