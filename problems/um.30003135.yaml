title: Minimum Triangular Edges above Turán Density
field: mathematics
tier: prose
statement: |-
  For $e>n^2/4$, let $\operatorname{Tr}(n,e)$ be the minimum number of edges lying in triangles among all $n$-vertex graphs with $e$ edges. For integers $a,b,c\geq0$ with $a+b+c=n$, let $\operatorname{Tr}(a,b,c)$ denote the family of graphs whose vertex set is partitioned as $A\cup B\cup C$, where $|A|=a$, $|B|=b$, and $|C|=c$; $B$ and $C$ are independent; every edge between $B$ and $C$ is present; vertices of $C$ have no neighbors in $A$; and the edges inside $A$ and between $A$ and $B$ form an almost-complete graph with more than $\binom{a-1}{2}+ab$ edges. Set
  $$
  g(n,e)=\min\left\{e-bc:a+b+c=n,\ \binom a2+ab+bc\geq e\right\}.
  $$
  Is $\operatorname{Tr}(n,e)=g(n,e)$, and must every extremal graph belong to some family $\operatorname{Tr}(a,b,c)$?
