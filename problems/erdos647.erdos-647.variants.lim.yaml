id: erdos647.erdos-647.variants.lim
title: "Erdős Problem 647 (variant: lim)"
field: mathematics
tier: proof
statement: |-
  Erdős says 'it is extremely doubtful' that there are infinitely many such $n$, and in
  fact suggests that
  $$
    lim_{n\to\infty} \max_{m < n}(\tau(m) + m − n) = \infty.
  $$
