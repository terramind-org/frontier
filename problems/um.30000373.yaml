title: Analytic Preorders from Colored Countable Linear Orders
field: mathematics
tier: prose
statement: Let $P$ be a well-quasi-order that is not a better-quasi-order. For colored countable total orders $(\sqsubseteq,\varphi),(\sqsubseteq',\varphi')\in LO\times\mathbb{N}^{\mathbb{N}}$, let $(\sqsubseteq,\varphi)\preccurlyeq_P(\sqsubseteq',\varphi')$ if an order embedding $g:\mathbb{N}\to\mathbb{N}$ preserves colors up to $P$. Classify the analytic preorder $\preccurlyeq_P$.
