title: Kourovka Notebook Problem 20.40
field: mathematics
tier: prose
statement: |-
  Let $G$ be a $\kappa$-existentially closed group of cardinality $\lambda > \kappa$, where $\kappa$ is a regular cardinal. Is it true that $|Aut(G)|=2^{\lambda}$?

  The answer is known to be affirmative if $\lambda=\kappa$ (B. Kaya, M. Kuzucuo\u{g}lu, P. Longobardi, M. Maj,
  *J. Algebra*, **666** (2025), 840--849).
