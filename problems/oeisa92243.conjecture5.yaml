  definitions:
    - name: OeisA92243.a
      kind: def
      text: |-
        /-- Score at stage $n$ in "tug of war" between prime gap increases vs. prime gap decreases. -/
        noncomputable def a (n : ℕ) : ℤ :=
          if n ≤ 1 then 0
          else
            ∑ k ∈ Finset.Icc 2 n,
              ((primeGap k : ℤ) - (primeGap (k - 1) : ℤ)).sign
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/92243.lean#L39
