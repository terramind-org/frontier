title: Kourovka Notebook Problem 6.5
field: mathematics
tier: prose
statement: |-
  Is
  it the case that every soluble group $G$ of type $(FP)_{\infty}$
  is *constructible* in the sense of (G. Baumslag, R. Bieri,
  *Math. Z.*, **151**, no. 3 (1976), 249--257)? In other
  words, can $G$ be built up from the trivial group in terms of
  finite extensions and $HNN $-extensions?
