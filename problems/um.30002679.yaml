title: Landmark Kernel Approximation on Algebraic Manifolds
field: mathematics
tier: prose
statement: Let $\mathcal M\subset\mathbb R^n$ be an algebraic manifold of dimension $D$ and let $k$ be a degree-$d$ polynomial kernel. For fixed $x,y\in\mathcal M$ and i.i.d. standard-normal landmark points $z_1,\ldots,z_m$ with $m\geq\lambda Dd\log n$, prove an asymptotic bound of compressed-sensing type for $k(x,y)-K(x,Z)K(Z,Z)^{-1}K(Z,y)$, such as $\Pr\bigl(\lvert k(x,y)-K(x,Z)K(Z,Z)^{-1}K(Z,y)\rvert\geq\varepsilon\bigr)\leq C\varepsilon^{-c\lambda}$.
