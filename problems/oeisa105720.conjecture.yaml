lean:
  module: FormalConjectures.OEIS.«105720»
  decl: OeisA105720.conjecture
  statement: |-
    theorem conjecture :
        ∀ n : ℕ, 0 < n → (IsSquare (a n) ↔ (n = 3 ∨ n = 6 ∨ n = 4072))
  context:
    - open OeisA105720
    - open Nat Finset
  definitions:
    - name: OeisA105720.a
      kind: def
      text: |-
        /--
        The primary defining sequence `a`.
        $a(n)$ is the sum of primes from the $n$-th prime to the $2n$-th prime, with $p_1=2$.
        For $n=0$, we define $a(0) = 0$.
        -/
        noncomputable def a (n : ℕ) : ℕ :=
          if n = 0 then 0
          else ∑ i ∈ Ico (n - 1) (2 * n), Nat.nth Nat.Prime i
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/105720.lean#L35
