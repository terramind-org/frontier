id: oeisa105720.conjecture
title: Triangular matchstick numbers in the class of prime numbers
field: mathematics
tier: proof
statement: |-
  Terms are squares at only(?) three values of $n = 3, 6, 4072$:
  corresponding terms are 6^2, 13^2, and 15735^2.
