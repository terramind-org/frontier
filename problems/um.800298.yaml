title: Group Actions on 1-Manifolds — Question 13
field: mathematics
tier: prose
statement: |-
  Given $0 < \alpha < \beta < 1$, does there exist a finitely-generated group of $C^{1+\alpha}$ diffeomorphisms
  of the circle/interval that does not embed into the group of $C^{1+\beta}$ diffeomorphisms ?
