title: Research Problems in Function Theory — Problem 4.18
field: mathematics
tier: prose
statement: If $f$ is any polynomial or rational function of degree $N$, find the least upper bound $\phi(N)$ of \[\frac{1}{r}\int^r_0dt\int^\pi_{-\pi}\frac{|f'(re^{i\theta})|}{1+|f|^2}\,d\theta,\] for varying $r$ and $f$. It is known only that $\phi(N)=O(N^{\frac{1}{2}})$, $\phi(N)\neq O(\log N)^{\frac{1}{2}-\varepsilon}$, as $N\to\infty$. The upper bound for varying $f$ of \[\int^\infty_0dt\int^\pi_{-\pi}\frac{|f'|}{1+|f|^2}\,dr\, d\theta\] should not be much larger than $\phi(N)$, but there is no proof that it is not $+\infty$. The special cases $N=2, 3, \ldots$ would be of interest. See Littlewood .
