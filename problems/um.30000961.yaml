title: Recursive Ideals and Knot Character Varieties
field: mathematics
tier: prose
statement: For a knot $K\subset S^3$ and a complex reductive group $G$ with Lie algebra $\mathfrak g$, is the zero set of $\varepsilon(I^W_{\mathfrak g,K})$ equal to the Zariski closure of the image of $$X_G(S^3\setminus K)\longrightarrow X_G(T)?$$ Equivalently, is $\sqrt{\varepsilon(I^W_{\mathfrak g,K})}=A_{G,K}$?
