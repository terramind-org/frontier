id: um.30000831
title: Spectral Remainders on Negatively Curved Surfaces
field: mathematics
tier: prose
statement: Let $M$ be a generic negatively curved Riemannian surface. Does the Weyl-law remainder satisfy $R(\lambda)=O(\lambda^\varepsilon)$, while the pointwise remainder and off-diagonal spectral function satisfy $R_x(\lambda)=O(\lambda^{1/2+\varepsilon})$ and $N_{x,y}(\lambda)=O(\lambda^{1/2+\varepsilon})$, for every $\varepsilon>0$ and all $x\neq y$ in $M$?
