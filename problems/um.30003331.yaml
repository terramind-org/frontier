id: um.30003331
title: Minimum-Difference Representations of Random Graphs
field: mathematics
tier: prose
statement: |-
  For a graph $G$ on vertices $1,\ldots,n$, let $f_{\min}(G)$ be the least $k$ for which sets $A_1,\ldots,A_n$ can be chosen so that
  $$
  ij\in E(G)\quad\Longleftrightarrow\quad\min\{|A_i\setminus A_j|,|A_j\setminus A_i|\}\geq k.
  $$
  For fixed $0<p<1$, does $G\in G(n,p)$ satisfy $f_{\min}(G)=\Omega(n/\log n)$ with high probability? What is the maximum of $f_{\min}(G)$ over all $n$-vertex graphs, and is $f_{\min}(G)=o(n)$ for every $G\in\mathcal G(n)\cup\mathcal G(n,n)$?
