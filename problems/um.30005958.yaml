title: Uniform Primary Brauer Bounds for K3 Surfaces
field: mathematics
tier: prose
statement: Let $K$ be a number field and $p$ a prime. Is there a uniform upper bound, depending only on $K$ and $p$, for $|\operatorname{Br}'(X)[p^\infty]|$ as $X$ ranges over all K3 surfaces over $K$?
