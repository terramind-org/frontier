    - name: DisjointNPPairs.IsCompleteCoNPPair
      kind: def
      text: |-
        /-- `(A, B)` is a **complete disjoint coNP pair**. -/
        def IsCompleteCoNPPair (A B : DecisionProblem) : Prop :=
          IsDisjointCoNPPair A B ∧ ∀ A' B', IsDisjointCoNPPair A' B' → PairReducible A' B' A B
