lean:
  module: FormalConjectures.OEIS.«219055»
  decl: OeisA219055.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : (Even n ∧ 8012 < n) ∨ (Odd n ∧ 15727 < n)) : a n > 0"
  context:
    - open OeisA219055
  definitions:
    - name: OeisA219055.a
      kind: def
      text: |-
        /-- Number of ways to write $n = p + q(3 - (-1)^n)/2$ with $p > q$ and $p, q, p - 6, q + 6$ all
        prime. -/
        def a (n : ℕ) : ℕ :=
          (Finset.range n).filter (fun q : ℕ =>
            ((1 + n % 2) + 1) * q < n ∧
            q.Prime ∧
            (q + 6).Prime ∧
            (n - (1 + n % 2) * q).Prime ∧
            (n - (1 + n % 2) * q - 6).Prime
          ) |>.card
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/219055.lean#L33
