statement: Is Teich(Σg), endowed with the Teichm¨ uller metric, almost convex? Note that Cannon proves in [ Ca] that fundamental groups of closed, negatively curved man- ifolds are almost convex with respect to any generating set. He conjectures that this should generalize both to the finite volume case and to the nonpositively curved case.
