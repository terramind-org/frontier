title: Noncommutative Alexander Polynomials and the Thurston Norm
field: mathematics
tier: prose
statement: Let $M$ be a closed aspherical $3$-manifold and let $\Lambda=\mathbb Z[H_1(M;\mathbb Z)/\mathrm{torsion}]$. Does there exist a noncommutative Alexander polynomial $\widetilde\Delta(M)$ whose abelianization is the classical Alexander polynomial, which satisfies the natural involution symmetry, whose support width computes the Thurston norm, and for which a cohomology class $\xi$ is represented by a nonsingular one-form exactly when $\widetilde\Delta(M)$ is invertible in the corresponding Novikov completion?
