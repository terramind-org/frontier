title: Kourovka Notebook Problem 11.62
field: mathematics
tier: prose
statement: |-
  Describe the groups over
  which any equation is soluble. In particular, is it true that this
  class of groups coincides with the class of torsion-free groups?
  It is easy to see that a group, over which every equation is
  soluble, is torsion-free. On the other hand, S. D. Brodskiĭ
  (*Siberian Math. J.*, **25**, no. 2 (1984), 235--251)
  showed that any equation is soluble over a locally indicable
  group.
