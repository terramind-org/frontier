title: Two-Term Weyl Asymptotics and Ivrii's Billiard Conjecture
field: mathematics
tier: prose
statement: |-
  For every smooth planar domain $\Omega$, does the eigenvalue counting function satisfy
  $$
  N(\lambda)=\frac{\operatorname{Area}(\Omega)}{4\pi}\lambda+C\ell(\partial\Omega)\lambda^{1/2}+o(\lambda^{1/2})?
  $$
  Also, does every smooth planar billiard domain have periodic trajectories of measure zero?
