title: Sharp Bounds for Exceptional Dehn-Filling Slopes
field: mathematics
tier: prose
statement: For every hyperbolic knot manifold $M$, let $E(M)$ be its exceptional filling slopes and $\Delta(E(M))$ their maximum pairwise distance. Is $\#E(M)\leq10$ and $\Delta(E(M))\leq8$? Moreover, unless $M\in\{M_1,M_2,M_3,M_4\}$, is $\#E(M)\leq7$ and $\Delta(E(M))\leq5$?
