  \section{Exact Bayesian evidence and prediction for finite latent discrete models}\label{20001221}
  {\small\sffamily UnsolvedMath ID 20001221 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are denoted by $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$; index ranges, computational models and specialized notation follow the cited problem source and the definitions below.


  For latent variables $Z$, parameters $\theta$, and observed data $D$, a Bayesian predictive distribution integrates the conditional observable distribution over the posterior law of $\theta$ and, where necessary, over $Z$. Identifiability asks whether distinct parameters produce the same observable distribution.
  \paragraph{Statement recorded in the supplied source.}
  Problem 45 (Fienberg). Computing the full distributions for observables using Bayesian extensions. Predictive distributions. Dinwoodie: How might you use algebra to pursue Bayesian directions in model fit criteria? Sturmfels: How to you compute this in Macaulay 2? What is Bayesian algebraic geometry? Fienberg: Taking mixtures of things the different models we have discussed at this conference. Meek: Finding the modes of the posterior distributions could be an interesting research problem. Pistone: You could use moment generating functions and cumulant generating func-tions for these problems. Fienberg: Identifiability is a big issue in the Bayesian context. Wynn: How may Edgeworth corrections play a role in this problem? \sref{20001221}{2}
  \paragraph{Scope qualification.}
  The source bundles questions on posterior modes, mixtures, identifiability, and computational methods. It specifies no unique prior or universal symbolic formula.
  \paragraph{Source status.}
  The supplied catalogue labels this record partially solved. Its source-status metadata was checked against the supplied snapshot on 2026-10-11. This import does not independently establish current open status or mathematical correctness.
  \subsection{Short English statement}
  Can algebraic methods help compute Bayesian observable and predictive distributions in the model families discussed at the workshop?
