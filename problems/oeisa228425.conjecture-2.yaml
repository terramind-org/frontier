id: oeisa228425.conjecture-2
title: Partitions of $n$ into $x + y$ with $x(x+1)/2 + y^2$ prime (conjecture_2)
field: mathematics
tier: proof
statement: |-
  We also conjecture that any integer $n > 1$ can be written as $x + y$ ($x, y > 0$) with
  $p_k(x) + p_{k+1}(y)$ prime, if and only if $k$ is among $3, 39, 99$.
