lean:
  module: FormalConjectures.OEIS.«228425»
  decl: OeisA228425.conjecture_2
  statement: |-
    theorem conjecture_2 (k : ℕ) (hk : 3 ≤ k) :
        (∀ n : ℕ, 1 < n → ∃ x y : ℕ, 0 < x ∧ 0 < y ∧ x + y = n ∧
          Nat.Prime (Nat.polygonalNumber k x + Nat.polygonalNumber (k + 1) y)) ↔
        k = 3 ∨ k = 39 ∨ k = 99
  context:
    - open OeisA228425
