title: Homology and Projective Fraïssé Limits
field: mathematics
tier: prose
statement: Develop a homology theory for projective Fraïssé limits based on projective-Fraïssé simplices and their boundary maps, and determine how it behaves under the projective Fraïssé limit operation. In particular, can such a theory identify canonical quotients arising from projective-Fraïssé constructions of universal Menger compacta?
