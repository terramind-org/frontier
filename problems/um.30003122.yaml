title: Distinct Number Fields from Fibers of Rational Functions
field: mathematics
tier: prose
statement: Let $X/\mathbb Q$ be a curve of genus $g$ and $t\in\mathbb Q(X)$ a nonconstant rational function of degree $\nu\geq2$. For $t(P_n)=n$, are at least $c(g,\nu)N$ of the fields $\mathbb Q(P_1),\ldots,\mathbb Q(P_N)$ distinct for all sufficiently large $N$?
