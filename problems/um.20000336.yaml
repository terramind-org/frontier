title: A formal local model at a type-2b stable numerical quintic
field: mathematics
tier: prose
statement: |-
  **Problem 4.2.** Understand the geometry of the moduli space of stable
  surfaces better. Here it is probably necessary to find some nice components
  and study their geometry. In general, after fixing even the differentiable
  structure of the underlying four-manifolds, the moduli space is disconnected,
  its connected components are reducible, and its irreducible components may be
  everywhere nonreduced. In addition, the boundary may not be a divisor, and
  the next best substitute is not a normal crossings divisor. Also, Vakil shows
  that the moduli space of canonically polarized surfaces is arbitrarily
  singular (in a precise sense).
