  definitions:
    - name: Erdos507.α
      kind: def
      text: |-
        /--
        $\alpha(n)$ is the supremum of `minTriangleArea S` over all sets `S` of $n$ points in the unit disk.
        -/
        noncomputable def α (n : ℕ) : ℝ :=
          sSup (minTriangleArea '' { S : Finset ℝ² |
            S.card = n ∧ ↑S ⊆ Metric.closedBall (0 : ℝ²) 1 ∧ ¬ Collinear ℝ (S : Set ℝ²) })
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/507.lean#L51
    - name: Erdos507.upperBarrier
      kind: def
      text: |-
        /--
        The "Barrier" function: n^(-7/6) used for the best upper bound [CPZ24].
        -/
        noncomputable def upperBarrier (n : ℕ) : ℝ := 1 / (n : ℝ) ^ ((7 : ℝ) / 6)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/507.lean#L63
