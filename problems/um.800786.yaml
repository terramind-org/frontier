title: Local Discrete Holomorphic Dynamics — Open Problem OP4
field: mathematics
tier: prose
statement: |-
  *Give an effective procedure for deciding whether two germs tangent to the
  identity are holomorphically locally conjugated.*

  Clearly, a similar question can be asked for parabolic germs; in that case another (topological, formal and holomorphic) invariant is the multiplier, and one has to replace the multiplicity
  by a suitably defined parabolic multiplicity, and the index by a suitably defined parabolic index
  (or, better yet, by \'Ecalle's iterative residue).
  Then the multiplier and the parabolic multiplicity are a complete set of topological invariants,
  the multiplier, the parabolic multiplicity and the iterative residue are a complete set of
  formal invariants, and adding suitably adjusted \'Ecalle-Voronin functional invariants one obtains a
  complete set of holomorphic invariants. Again, most of the times the computation of the
  functional invariants is hopeless, and thus we have the following generalization of
