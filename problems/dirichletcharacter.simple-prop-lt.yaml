schema: 1
id: dirichletcharacter.simple-prop-lt
title: Simple zeros of the Riemann zeta function on the critical line (DirichletCharacter.simple_prop_lt)
field: mathematics
tier: proof
statement: |-
  Is the proportion of simple zeros of `L(s, χ)`, `χ` primitive, on the critical line
  unconditionally larger than the Montgomery–Taylor bound `2 - c_MT⁻¹ = 0.6725…`?
ams:
  - 11
tags:
  - paper
references:
  - label: pdf
    url: https://www-cdn.anthropic.com/95c246936988e43127bc6b2ceb7077c1dad2d68e.pdf
  - label: Lean formalisation
    url: https://github.com/anthropics/zeta-23-lean
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Riemann_hypothesis#Zeros_on_the_critical_line
source:
  name: formal-conjectures
  repo: https://github.com/google-deepmind/formal-conjectures
  commit: 2207c54d0dbe960de591d280f997b195bf3f6e28
  path: FormalConjectures/Paper/RiemannZetaZeros.lean
  url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Paper/RiemannZetaZeros.lean#L193
  licence: Apache-2.0
upstream_status: open
lean:
  module: FormalConjectures.Paper.RiemannZetaZeros
  decl: DirichletCharacter.simple_prop_lt
  statement: |-
    theorem simple_prop_lt (hχ : χ.IsPrimitive) : ∃ c > 2 - montgomeryTaylorConst⁻¹, ∃ o : ℝ → ℝ,
        o =o[atTop] (1 : ℝ → ℝ) ∧
        ∀ T > 0, (c - o T) * N (LFunction χ) T (2 * T) ≤ Ns (LFunction χ) T (2 * T)
  context:
    - open DirichletCharacter
    - open Filter
    - open ZetaZeros
    - "variable {M : ℕ} [NeZero M] {χ : DirichletCharacter ℂ M}"
  definitions:
    - name: ZetaZeros.N
      kind: def
      text: |-
        /-- `N(T₁, T₂)`: the nontrivial zeros of `f` with imaginary part in `(T₁, T₂]`, counted with
        multiplicity. -/
        noncomputable def N (f : ℂ → ℂ) (T₁ T₂ : ℝ) : ℕ :=
          ∑ᶠ s ∈ nontrivialZeros f T₁ T₂, (analyticOrderAt f s).toNat
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Paper/RiemannZetaZeros.lean#L53
    - name: ZetaZeros.Ns
      kind: def
      text: |-
        /-- `Ns(T₁, T₂)`: the number of simple zeros of `f` on the critical line with imaginary part in
        `(T₁, T₂]`. -/
        noncomputable def Ns (f : ℂ → ℂ) (T₁ T₂ : ℝ) : ℕ :=
          {s ∈ nontrivialZeros f T₁ T₂ | s.re = 1 / 2 ∧ analyticOrderAt f s = 1}.ncard
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Paper/RiemannZetaZeros.lean#L62
    - name: ZetaZeros.montgomeryTaylorConst
      kind: def
      text: |-
        /-- The Montgomery–Taylor constant `c_MT = √2 tan(1/√2) / (1 + tan(1/√2)/√2)`, so that
        `c_MT⁻¹ = 1/2 + cot(1/√2)/√2 = 1.3274…`. -/
        noncomputable def montgomeryTaylorConst : ℝ := √2 * (1 / √2).tan / (1 + (1 / √2).tan / √2)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Paper/RiemannZetaZeros.lean#L67
