  decl: DirichletCharacter.simple_prop_lt
  statement: |-
    theorem simple_prop_lt (hχ : χ.IsPrimitive) : ∃ c > 2 - montgomeryTaylorConst⁻¹, ∃ o : ℝ → ℝ,
        o =o[atTop] (1 : ℝ → ℝ) ∧
        ∀ T > 0, (c - o T) * N (LFunction χ) T (2 * T) ≤ Ns (LFunction χ) T (2 * T)
