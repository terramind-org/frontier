title: Selection Principles Milestone Problems — Problem 46 ([SakaiRez, Question 2.9])
field: mathematics
tier: prose
statement: |-
  If all finite powers of $X$ satisfy $\mathsf{U}_{\mathrm{fin}}(\Gamma,\Gamma)$,
  then every open $\omega$-cover of $X$ is $\omega$-shrinkable [SakaiRez],
  thus a positive solution to the following problem would suffice.

  Assume that $C_p(X)$ is a Pytkeev space. Is it true that all finite powers of
  $X$ satisfy $\mathsf{U}_{\mathrm{fin}}(\Gamma,\Gamma)$?
