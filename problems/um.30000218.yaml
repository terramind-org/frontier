statement: For the bilinear controlled Schrödinger equation $i\partial_t\Psi=(H_0-\varepsilon(t)\mu)\Psi$ with $\Psi(0)=\Psi_0$, characterize the attainable final states in infinite dimension and give implementable criteria for the appropriate notions of controllability.
