title: Research Problems in Function Theory — Problem 6.116
field: mathematics
tier: prose
statement: "Let $D$ be a domain in $\\mathbb{C}$ containing the origin $0$; for $t>0$, let $\\Omega_t$ be the component of $D \\cap\\{|z|\\leq t\\}$ containing $0$. In the usual notation for harmonic measure, define the function $\\omega = \\omega_D:[0, \\infty)\\to[0,1]$ by the formula \\[\\omega(t)=\\omega\\big(0,\\partial\\Omega_t\\cap\\{|z|=t\\},\\Omega_t\\big).\\] What can be said about $\\omega$ and about its relations with $D$? For instance: [(a)] ; What are necessary and sufficient conditions on a function to be $\\omega_D$ for some $D$? ; If $\\omega_{D_1 }\\equiv \\omega_{D_2}$, are $D_1$ and $D_2$ essentially the same? (That is, will $D_1$ be a rotation or reflection of $D_2$? Or will $D_1$ and $D_2$ differ only on sets of capacity zero?) What happens if $\\omega_{D_1 }\\equiv \\omega_{D_2}$ only on some subinterval of $[0,1]$? ; Given a function $\\omega_D$, can one `reconstruct' $D$? ; Can one infer such properties as connectivity of $D$ fromthe behaviour of $\\omega_D$? One might start by dealing with domains $D$ that are circularly symmetric. (K. Stephenson)"
