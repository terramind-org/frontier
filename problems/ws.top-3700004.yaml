  \item[\hypertarget{source:statement:2}{S2}] Ben Bielefeld and Mikhail Lyubich (editors); Alexandre Eremenko and Mikhail Lyubich (problem authors), Problems in Holomorphic Dynamics (1992), Eremenko–Lyubich, Wandering Domains for Holomorphic Maps, Question 1, pp.39–40. \url{https://arxiv.org/abs/math/9205209}.
