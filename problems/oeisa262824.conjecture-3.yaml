title: Sums of a square and three weighted cubes (conjecture_3)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): Every nonnegative integer $n$ can be written as $w^2 + x^3 + 2y^3 + 3z^4$
  for some nonnegative integers $w, x, y, z$.
