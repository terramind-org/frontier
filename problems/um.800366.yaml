title: Coxeter Groups and Unimodality — Conjecture 4
field: mathematics
tier: prose
statement: |-
  Let $W$ be a Weyl group of type $A$ and $u,v \in W$, $u \leq v$. Then
  \begin{equation}

  P_{u,v}(q) = \widetilde{P}_{u,v,z}(q)
  \end{equation}
  for any hypercube decomposition $[u,z]$ of $[u,v]$.
