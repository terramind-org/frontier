statement: Let $\mathfrak o=k[[t]]$, where $k$ is finite or $k=\mathbb C$. Is the derived category of $G(\mathfrak o)$-equivariant constructible sheaves on $X(F)$ equivalent to the differential graded category of $\check G$-equivariant coherent sheaves on $$\check M\simeq\check V_X\times_{\check G_X}\check G$$?
