title: A direct full-Wick spatial-mollifier construction
field: mathematics
tier: prose
statement: "**Stochastic analysis.** Consider the multi-layer extension of the stochastic heat equation introduced by O'Connell and Warren. It is defined via chaos series -- show that it can also be defined by spatially smoothing white-noise and then making sense of the Wick exponential in its formulation as a partition function for non-intersecting Brownian bridges in a space time white-noise environment."
