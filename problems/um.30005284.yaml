title: Forking Degree and Generic Transitivity
field: mathematics
tier: prose
statement: Control $\alpha$-forking degree for arbitrary ordinals via Borovik–Cherlin-type bounds; find model-theoretic applications of generalized generic transitivity; extend Borovik–Cherlin theory to supersimple groups and Kolchin polynomials; and relate definable primitivity of binding groups to geometric stability, differential algebraic geometry, and compact complex manifolds.
