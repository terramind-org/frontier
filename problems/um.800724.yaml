title: Open Problems on Central Simple Algebras — Conjecture 39
field: mathematics
tier: prose
statement: |-
  The ``if'' direction can be found in [Vos, p. 186]. The full theorem amounts to combining the results from ibid.\ with [Gille:KT, Th. 5.9]. Gille's theorem furthermore shows that the conditions are equivalent to the abstract group $\operatorname{SL}_r(A)(L)$ being ``projectively simple" for every extension $L/F$ and every $r \ge 2$.

  The main problem from this point of view is to prove the following converse to Wang's result:

  [Suslin \protect{[Suslin:SK1, p. 75]}] If $\operatorname{SK}_1(A \otimes L) = 0$ for every extension $L/F$, then the index of $A$ is square-free.
