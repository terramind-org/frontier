title: Binomial Bounds for Gamma Vectors of Flag Spheres
field: mathematics
tier: prose
statement: Let $\Delta$ be a flag homology sphere with gamma-vector $(\gamma_0,\gamma_1,\ldots)$ and $\gamma_1=\ell$. Must $$0\leq\gamma_i\leq\binom{\ell}{i}\qquad\text{for every }i\geq2$$?
