title: Universal Gaussian Mean Estimation under Adversarial Corruption
field: mathematics
tier: prose
statement: Are there estimators other than the empirical mean with the intended universal estimation property? Is the empirical mean's property explained by its being a sufficient statistic? Can universal estimation be extended beyond Gaussian samples, including to the $\varepsilon$-adversarial corruption model, and what is the largest tolerable corruption proportion $\varepsilon$?
