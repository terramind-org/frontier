title: Intrinsic versus modular bad reduction for quadratic COR curves
field: mathematics
tier: prose
statement: |-
  Bad reduction for models of critical orbit relation curves. e.g. $M_2$.

  **Recovered question.** For COR curves in $M_2$, determine bad primes separately for the abstract normalized curve, its punctures, and its critical/portrait marking; explain which bad primes are intrinsic and which are artifacts or necessary degenerations of a chosen modular model.
