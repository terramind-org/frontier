lean:
  module: FormalConjectures.ErdosProblems.«669»
  decl: Erdos669.erdos_669.parts.i
  statement: |-
    theorem erdos_669.parts.i :
        ∀ k : ℕ, 3 ≤ k → ∀ x : ℝ,
          erdos_669.parts.i.answer k = some x ↔
            Tendsto (fun n : ℕ => (maxLinesAtLeast k n : ℝ) / (n : ℝ) ^ 2) atTop (𝓝 x)
  context:
    - open Erdos669
    - open Erdos669.erdos_669
    - open Erdos669.erdos_669.parts
    - open Filter
    - open scoped Topology EuclideanGeometry
  definitions:
    - name: Erdos669.maxLinesAtLeast
      kind: def
      text: |-
        /--
        $F_k(n)$: the largest number of distinct lines passing through at least $k$ of the points, over
        all sets of $n$ points in $\mathbb{R}^2$. This is the least $m$ such that any $n$ points have at
        most $m$ such lines. See `Erdos669.lineCountsAtLeast_bddAbove`.
        -/
        noncomputable def maxLinesAtLeast (k n : ℕ) : ℕ :=
          sSup (lineCountsAtLeast k n)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/669.lean#L111
