  module: FormalConjectures.ErdosProblems.«950»
  decl: Erdos950.erdos_950.variants.sum_primes
  statement: |-
    theorem erdos_950.variants.sum_primes :
        (fun x : ℕ ↦ ∑ p ∈ (Finset.range x).filter Prime, (f p) ^ 2) ~[atTop]
          fun x ↦ (π x : ℝ)
  context:
    - open Erdos950
    - open Erdos950.erdos_950
    - open Erdos950.erdos_950.variants
    - open Filter
    - open scoped Asymptotics Nat.Prime
  definitions:
    - name: Erdos950.f
      kind: def
      text: |-
        /--
        Let $f(n) = \sum_{p<n}\frac{1}{n-p}$.
        -/
        noncomputable def f (n : ℕ) : ℝ :=
          ∑ p ∈ (Finset.range n).filter Prime, (1 : ℝ) / (n - p : ℝ)
