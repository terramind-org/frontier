title: Uniform Polynomial Bases for Stabilizer Modules
field: mathematics
tier: prose
statement: Let $\lambda\vdash n$, let $U\leq\operatorname{GL}_n(q)$ be the lower unitriangular subgroup, and decompose the restricted permutation module $\operatorname{Res}^{\operatorname{GL}_n(q)}_U M(\lambda)$ into summands indexed by row-standard $\lambda$-tableaux. For a basis $B$ of the Specht module $S(\lambda)$ adapted to this decomposition, write $B_s$ for the basis vectors whose last nonzero component is indexed by the standard tableau $s\in\operatorname{St}(\lambda)$. Can $B$ be chosen independently of the coefficient field $K$ so that $\lvert B_s\rvert=p_s(q)$ for polynomials $p_s\in\mathbb Z[x]$ with $p_s(1)=1$? Can one moreover choose $p_s\in\mathbb Z_{\geq0}[x-1]$?
