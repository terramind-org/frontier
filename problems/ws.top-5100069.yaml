  \item[\hypertarget{source:5100069:2}{S2}] Dan Reznik, Ronaldo Garcia and Jair Koiller, \emph{Eighty New Invariants in the Elliptic Billiard}, arXiv:2004.12497v11 (29 October 2020), Section 2 and Section 3.9, Table 10, row $k_{908,b}$, pp. 3, 9--12. \url{https://arxiv.org/abs/2004.12497v11}.
  \end{description}
