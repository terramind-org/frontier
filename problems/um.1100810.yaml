title: Questions in Geometric Group Theory — Q 8.10
field: mathematics
tier: prose
statement: Suppose $H=F/N$ is finitely presented and contains $C^n$ for every $n$. Write $G_n=H*_{C^n}H=F*F/N_n$. If $C$ is nontrivial and finite, is $$\lim_{n\to\infty}d_{F*F}(N_n)=\infty?$$
