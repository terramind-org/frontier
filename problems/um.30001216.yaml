title: Yangian Realization of Universal Affine Verma Modules
field: mathematics
tier: prose
statement: Let $M$ be the localized equivariant cohomology representation of the moduli spaces of parabolic sheaves on $\mathbb{P}^1\times\mathbb{P}^1$, equipped with the affine Yangian action. Is $M$ isomorphic, as an affine Yangian module, to the universal Verma module over $U(\widehat{\mathfrak{gl}}_n)$, with the affine Gelfand–Tsetlin fixed-point basis specializing to bases of integrable modules?
