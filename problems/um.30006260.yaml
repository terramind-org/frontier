title: Acting Groups and Identity-Component Automorphisms
field: mathematics
tier: prose
statement: Let $X=G/P$, where $G$ is simple adjoint and $P$ is a nonreduced parabolic subgroup scheme. When is the natural homomorphism $G\hookrightarrow\operatorname{Aut}^0(X)$ an isomorphism, and what is the structure of $\operatorname{Aut}^0(X)$ when the inclusion is strict?
