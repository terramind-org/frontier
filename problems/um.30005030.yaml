title: Spatial Regularity Versus Time Integrability for Fractional SDEs
field: mathematics
tier: prose
statement: For the stochastic differential equation $$dX_t=b(t,X_t)\,dt+dW_t^H$$ driven by fractional Brownian motion of Hurst parameter $H$, can higher time integrability $b\in L_t^qC_x^\alpha$ lower the spatial regularity threshold below $\alpha>1-1/(2H)$ in accordance with the scaling prediction?
