title: Entire Curves in General Type Orbifolds
field: mathematics
tier: prose
statement: Let $(X/\Delta)$ be a smooth projective orbifold of general type. Does there exist a proper subvariety $Y\subsetneq X$ such that every orbifold morphism $f:\mathbb{C}\to(X/\Delta)$ has image contained in $Y$?
