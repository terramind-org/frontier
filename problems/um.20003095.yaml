title: Stretch lines and subsurface active intervals
field: mathematics
tier: prose
statement: |-
  **Problem 2.5 (K. Rafi).** Assume that \(G(\lambda)\) is a stretch line
  directed by a maximal geodesic lamination \(\lambda\), then how does the
  geodesic \(G(\lambda)\) look like? Moreover, if the projection of
  \(G(\lambda)\) to the arc and curve graph of a subsurface \(Y\) is large,
  can we expect that an interval of time where each boundary component
  \(\beta\) of \(Y\) has bounded length and \(\beta\) is close to a geodesic
  on \(Y\)?
