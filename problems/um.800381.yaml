title: Open Problems in Arithmetic Dynamics — Conjecture 4
field: mathematics
tier: prose
statement: |-
  [Manes, 2008, [MR2407816]]

  A $\mathbb{Q}$-rational periodic point of a map of the form $bx+cx^{-1}$ with
  $b,c\in\mathbb{Q}^*$ has period $1$, $2$, or $4$. Further,
  \[
  \sup_{b,c\in\mathbb{Q}^*} \#\operatorname{PrePer}\bigl(bx+cx^{-1},\mathbb{P}^1(\mathbb{Q})\bigr) = 12.
  \]
