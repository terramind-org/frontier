statement: "**Bodmann's question.** Can the explicit mixed/multivariate characteristic-polynomial machinery used after the Kadison--Singer theorem be replaced by a Bourgain--Tzafriri-style rank-one perturbation argument? More specifically, can one reproduce the relevant multivariate argument using resolvents and rank-one updates instead of manipulating the polynomials themselves?"
