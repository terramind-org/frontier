title: The Refined Unstable-Module Realization Conjecture
field: mathematics
tier: prose
statement: Let $X$ be a space for which the unstable module $H^*(X;\mathbb F_2)$ does not belong to the locally finite subcategory $\mathcal U_0$. Does the unbounded strong realization conjecture hold, and is $S(H^*(X))\leq N(H^*(X))$, where $S$ is the first nilpotence-filtration level whose quotient belongs to no $\mathcal U_n$ and $N$ is the invariant determined by Steenrod operations?
