title: Boundaries of Groups and Kleinian Groups — Problem 104
field: mathematics
tier: prose
statement: Suppose that Y is a compact ﬁnitedimensional locally CAT (0) metric space of rank n ≥ 2. Then either the universal cover of Y splits (nontrivially) as a Riemannian direct product or it is isometric to a Euclidean building. This problem is most natural in the context of piecewise-Euclidean metric cell complexes. The conjecture was proven in the case of 2-dimensional and 3-dimensional complexes by Ballmann and Brin [2, 3]. Cogrowth. Let H ⊂ G be a subgroup of a ﬁnitely-generated group G. The cogrowth of H in G is the growth of the Shreier graph Γ G/H, where Γ G is a Cayley graph of G.
