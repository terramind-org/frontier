title: Exact prime-support endpoints over F_q(T)
field: mathematics
tier: prose
statement: |-
  Let $K=\mathbb F_q(T)$, let $f\in K(z)$ have degree at least two (or $f\in K[z]$ in the polynomial version), and let $\alpha\in K$. Replace rational primes by finite places of $K$. How large is the set of places dividing a nonzero numerator of some $f^n(\alpha)$? What analogues hold over other fields?

  Taken literally, $f(z)\in\mathbb F_q(T)$ omits the variable in which $f$ is iterated. The two preceding records remove the ambiguity. Problem 1.1 defines
  \[
   N(x)=\#\{p\le x:p\mid f^n(\alpha)\text{ for some }n\}
  \]
  and asks for its growth; Problem 1.2 asks how that growth differs for PCF and non-PCF maps. Accordingly, the minimal reconstruction of Problem 1.3 is:

  For $K=\mathbb F_q(T)$ and a monic irreducible $P\in\mathbb F_q[T]$, write $v_P$ for its normalized valuation. We use the degree cutoff
  \[
   \mathcal P_f(\alpha)=\{P:v_P(f^n(\alpha))>0
       \text{ for some }n\ge0\text{ with }f^n(\alpha)\ne0\},
   \qquad
   N_{f,\alpha}(D)=\#\{P\in\mathcal P_f(\alpha):\deg P\le D\}. \]
  The corresponding norm cutoff is $N_{f,\alpha}^{\rm norm}(X)=
  N_{f,\alpha}(\lfloor\log_qX\rfloor)$. Divisors of denominators instead measure visits to $\infty$, so numerator and denominator conventions must not be conflated.
