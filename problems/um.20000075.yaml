title: A residual parity-defect criterion for the fourth grading on HHH
field: mathematics
tier: prose
statement: |-
  On HHH\(^{\mathrm{geom}}\) of a braid \(\beta\) there is a mysterious 4th
  \(\mathbb Z\)-grading coming from the \(\mathbb Z/2\)-grading on matrix
  factorizations. Construct the analog for HHH of \(\beta\).
