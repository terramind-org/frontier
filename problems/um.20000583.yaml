title: A strict critical-dimension obstruction for Heisenberg snowflakes
field: mathematics
tier: prose
statement: "**Snowflake embeddings of the Heisenberg group into low-dimensional Euclidean spaces.** Let $d_{cc}$ denote the Carnot--Carathéodory metric. Does there exist $\\epsilon<1$ so that the first Heisenberg group $\\mathbb H^1$, equipped with $d_{cc}^{\\epsilon}$, bi-Lipschitz embeds into $\\mathbb R^5$?"
