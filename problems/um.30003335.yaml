id: um.30003335
title: Maximum-to-Average Independence Ratios in Triangle-Free Graphs
field: mathematics
tier: prose
statement: In every triangle-free graph, is the ratio of the maximum independent-set size to the average size of a uniformly random independent set at least $4/3$? In every triangle-free graph of minimum degree $d$, is that ratio at least $2-o_d(1)$?
