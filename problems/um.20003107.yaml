title: Opposition-symmetric lifts and boundary scalarizations of the Thurston metric
field: mathematics
tier: prose
statement: |-
  **Problem 3.4 (K. Rafi).** Is the Thurston metric a degeneration of some better
  vector-valued symmetric distance on Teichmüller space?

  It is introductory text for Problem 3.5, not part of
  Problem 3.4. It is nevertheless directly relevant notation.

  The source list works with the Teichmüller space \(\mathcal T(S)\) of a finite-type
  surface \(S\) admitting complete finite-area hyperbolic metrics. We assume that
  \(\mathcal T(S)\) is nontrivial. With \(\mathcal C(S)\) the set of essential
  simple closed curves and \(\ell_X(\alpha)\) the \(X\)-length of \(\alpha\), the
  Thurston metric is
  \[
   d(X,Y)=d_{\rm Th}(X,Y)
   =\log\sup_{\alpha\in\mathcal C(S)}
         \frac{\ell_Y(\alpha)}{\ell_X(\alpha)}. \]

  The workshop report supplies useful context for the word “vector-valued”: the
  talk immediately preceding the problem session was M. Kapovich's
  “Vector-valued metrics on higher-rank Riemannian symmetric spaces (Cartan
  projections, conditions for triangular inequality).” In that setting reversal
  is governed by the opposition involution of a Weyl chamber, rather than by
  literal equality of oriented vector distances. This report makes that analogy
  precise and also records what cannot hold under a stricter interpretation.
