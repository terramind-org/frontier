statement: |-
  \section*{No infinite critical clusters for three-dimensional site and bond percolation}\label{30007419}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For independent nearest-neighbor bond percolation and independent site percolation on $Z^3$ at their respective critical parameters, is the probability that the origin belongs to an infinite open cluster zero?
  \subsection{Short English statement}
  For independent nearest-neighbor bond percolation and independent site percolation on $Z^3$ at their respective critical parameters, is the probability that the origin belongs to an infinite open cluster zero?
