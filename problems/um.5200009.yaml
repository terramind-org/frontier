title: Open Problems on Billiards and Geometric Optics
field: mathematics
tier: prose
statement: Let $C\subset\mathbb{R}^2$ be a curve and translate it through an $\varepsilon$-square lattice, recording a click whenever it meets a lattice point. Can the shape of $C$ be recovered from the distribution of click parameters, either for $C$ alone or for all its rotations? Is there a Fourier-type transform that extracts curvature patterns from this click distribution? Analyze the cases of a segment, a polygon, and a circle.
