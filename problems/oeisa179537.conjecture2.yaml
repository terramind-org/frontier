id: oeisa179537.conjecture2
title: Central binomial sum $a(n) = \sum_{k=0}^n \binom{n}{k}^2 \binom{n-k}{k}^2 (-16)^k$ (conjecture2)
field: mathematics
tier: proof
statement: |-
  If $p$ is a prime with $(p/7) = -1$, then
  $\sum_{k=0}^{p-1} (-1)^k a(k) \equiv 0 \pmod{p^2}$.
  - _Zhi-Wei Sun_, Jul 17 2010
