lean:
  module: FormalConjectures.OEIS.«179537»
  decl: OeisA179537.conjecture2
  statement: |-
    theorem conjecture2 (p : ℕ) [Fact p.Prime] (hp7 : p ≠ 7)
        (h_leg : letI : Fact (Nat.Prime 7) := ⟨by decide⟩; legendreSym 7 p = -1) :
        (∑ k ∈ Finset.range p, (-1 : ℤ) ^ k * a k) ≡ 0 [ZMOD (p : ℤ) ^ 2]
  context:
    - open OeisA179537
  definitions:
    - name: OeisA179537.a
      kind: def
      text: |-
        /-- The sequence $a(n) = \sum_{k=0}^n \binom{n}{k}^2 \binom{n-k}{k}^2 (-16)^k$. -/
        def a (n : ℕ) : ℤ :=
          ∑ k ∈ Finset.range (n + 1), (n.choose k : ℤ) ^ 2 * ((n - k).choose k : ℤ) ^ 2 * (-16 : ℤ) ^ k
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/179537.lean#L35
