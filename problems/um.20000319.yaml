title: "Kähler invariance of plurigenera: current boundary and a pseudoeffective-chamber reduction"
field: mathematics
tier: prose
statement: |-
  (Siu) Let \(\pi:X\to\Delta\) be a holomorphic family of compact Kähler
  manifolds over the open unit \(1\)-disk \(\Delta\) with fiber \(X_t\). Then is
  the dimension of \(H^0(X_t,mK_{X_t})\) independent of \(t\in\Delta\)?
  This is the Kähler case of Siu's famous invariance of plurigenera theorem for
  projective smooth varieties. One of the difficulties in using similar ideas
  from the algebraic case is that we cannot use an auxiliary ample line bundle.
