schema: 1
id: wieferichmirimanoffprime.ismirimanoffprime-iff
title: Can a prime $p$ satisfy $2^{p-1} \equiv 1 \pmod{p^2}$ and $3^{p-1} \equiv 1 \pmod{p^2}$? (isMirimanoffPrime_iff)
field: mathematics
tier: proof
statement: |-
  Are $11$ and $1006003$ the only Mirimanoff primes? They are the only known ones: Dorais and Klyve
  found no other below $9.7 \times 10^{14}$.
