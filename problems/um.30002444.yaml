title: Homogeneity from Legendrian Varieties of Minimal Rational Tangents
field: mathematics
tier: prose
statement: Let $X$ be a Fano manifold with $b_2(X)=1$. If its variety of minimal rational tangents at a general point is a connected nonlinear Legendrian submanifold of the contact projective space, must $X$ be homogeneous, or at least quasi-homogeneous? Likewise, if the variety is a nonlinear smooth hypersurface, must $X$ be homogeneous, or at least quasi-homogeneous?
