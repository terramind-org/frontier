title: Type-B extreme diameters and a dihedral meander determinant
field: mathematics
tier: prose
statement: |-
  **Problem 2.4 (H. T. Hall).** Suppose that a stream has \(2n\) bridges across it. A classical meander is (the homotopy class of) a closed path which crosses each bridge once without intersecting itself. On each side of the stream, the meander is given by a noncrossing pairing of the set
  \[
  [2n]:=\{1,2,\ldots,2n\}.
  \]
  Noncrossing pairings are naturally in bijection with type \(A\) noncrossing partitions of the set \([n]\).

  Every ordered pair of noncrossing partitions defines a path (with possibly multiple components) which crosses each bridge exactly once. There is a bijection which says that the meanders (the paths with only one connected component) correspond exactly to pairs of noncrossing partitions that are maximally separated in the Hasse diagram of \(NC_{A_{n-1}}\) (they are diameters in the graph-theoretical sense). Does this bijection suggest a new way to count meanders?

  One may also use this bijection to define meanders of type \(W\) (they are the ordered diameters of the Hasse diagram of \(NC_W\)). Is there some combinatorial object that this corresponds to? Is there a type \(B\) meander?

  **Remark (A. Nica and J. Scott).** In type \(A\), one may build a “meander determinant” which is known to factor as a product of Chebyshev polynomials. Similarly, one may define a type-\(W\) meander determinant. What factorization properties does it have? Meanders are related to chromatic polynomials of graphs and the Temperley--Lieb algebra. What is the significance of type-\(W\) meanders in this context?
