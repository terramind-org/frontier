statement: "Problem Extend the concept ofSc > 0 to singular Fano Varieties. For example, work out a deﬁnition ofSc(X) along the lines suggested in Question 1 of the previous section, such that the non-strict positivitySc(X) ≥0 of generalised scalar curvature would be stable under deformations of smooth Fano varieties, e.g. of hypersurfacesXreg ⊂CPm+1 of low degrees, to singular ones. Noticethatthevolumesofsmallballsatsingularpointsinalgebraicvarieties, especially where they are not normal (locally reducible) are signiﬁcantly greater thanthevolumesofballsattheregularpointswhichindicateofnon-applicability of the deﬁnition of scalar curvature via volumes of balls to singular spaces. (Compare with [11]-Basilio+ Sewing Riemannian Manifolds 2017].) Further example of manifolds withSc > 0 are obtained with codimension 2 surgeryon n-dimensional manifolds, i.e. surgery based on submanifolds (e.g embedded spheres) of dimensions≤n−3, since codimension 2 surgery can be(rather naturally)performed in the Riemannian category of manifolds withSc > σ. (See [122]-Walsh Metrics of positive scalar 2008] and references therein.) For instance,connected sumsof n-manifolds withSc > 0 carry metrics with Sc > 0 for alln ≥3 and all orientable manifolds withSc > 0 of dimension ≥4 can made simply connectedby attaching2-handles, while keepingSc > 0. To see geometrically how this works, look at a smallε-neighbourhood Xε = Uε(P) of a compact smooth submanifoldP in a Riemannin manifoldW.6 Ifcodim(P) ≥3 then the boundary∂Uε(P) is ﬁbered byε-spheres of dimensionsk ≥2 the scalar curvatures of which are approximatelyk(k−1) ε2 which blows up to+∞for ε→0 and Sc(Xε) ≍ε−2→+∞ as well. 5A complex manifoldX is Fanoif theanticanonical line bundleLac(X), i.e. the top exterior power of the tangent bundleT(X), isample: some powerLN ac is generated by holomorphic sections. 6Topologically, a surgery over a manifoldX results in a manifoldW with two boundary components where the the ﬁrst one isX and the second one is the result of the surgery. The geometric construction we describe may be performed in thisW with a cylindrical Riemannian metric nearX ⊂W. 9 Now, more generally, letP ⊂W be a piecewise smooth polyhedral subset,…"
