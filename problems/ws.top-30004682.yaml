  \section{High-Dimensional Regression and PDE Learning Without Dimensional Curse}\label{30004682}
  {\small\sffamily UnsolvedMath ID 30004682 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  For squared-loss regression, the usual target is the conditional mean $m(x)=\mathbb E[Y\mid X=x]$, when defined, and approximation error may be measured by $\mathbb E[(\widehat m(X)-m(X))^2]$. Other losses or norms define other targets. A PDE method approximates a solution $u$ of a specified differential equation, with initial or boundary data, in a chosen error norm. The curse of dimensionality refers to sample or computation requirements growing exponentially with dimension, for example $\epsilon^{-c d}$ to obtain error $\epsilon$ in dimension $d$. Training data fit the estimator; validation data estimate its performance under a specified sampling distribution.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  Source-record limitation: This is a broad deep-learning research agenda without a specified regression class, PDE, sampling model, error criterion, or dimensional dependence. There is no determinate mathematical target to preserve.
  \paragraph{Statement recorded in the supplied source.}
  What error bounds can be obtained for regression of high-dimensional nonsmooth functions, how can PDEs be solved without the curse of dimensionality, and what training and validation data sizes and distributions are efficient and effective for deep learning? \sref{30004682}{2}
