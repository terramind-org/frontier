title: Intrinsic-Volume Deficits of Random Spherical Polytopes
field: mathematics
tier: prose
statement: Let $K$ be a spherically convex body in an open hemisphere and $P_n$ the spherical convex hull of $n$ independent uniform random points of $K$. Is $\mathbb E[U_j(K)-U_j(P_n)]$ of order $n^{-(d+1-j)}$ as $n\to\infty$ for every $j=1,\ldots,d$?
