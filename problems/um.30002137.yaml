title: Hofer Norms on Fundamental Groups of Symplectic Manifolds
field: mathematics
tier: prose
statement: For a symplectic manifold $(M,\omega)$, a ball $B$, and the induced Hofer norm $\lVert\gamma\rVert_B$ on $\pi_1(M)$, what can be said about this conjugation-invariant norm? Is it bounded, and is it equivalent to word length?
