title: Exceptional Galois Images of Non-CM Elliptic Curves
field: mathematics
tier: prose
statement: For non-CM elliptic curves over $\mathbb Q$, is the known list of $22$ exceptional $\ell$-adic Galois images complete? Equivalently, must every counterexample arise from an unexpected rational point on $X_{\mathrm{ns}}^+(N)$ for $N\in\{33,5^2,7^2,11^2\}$ or a prime $\ell\geq17$, or on one of the two level-$49$ genus-$9$ modular curves?
