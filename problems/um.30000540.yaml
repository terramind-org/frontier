statement: Is there a uniform constant $C$ such that every diffeomorphism of $T^2$ isotopic to the identity is a product of at most $C$ disk-supported diffeomorphisms? Is the analogous fragmentation norm bounded on the compactly supported identity component of the open Möbius strip?
