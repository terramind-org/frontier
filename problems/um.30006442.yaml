title: Uniform Bounds for Transcendental Rational Points
field: mathematics
tier: prose
statement: Let $X\subseteq\mathbb{C}_p^n$ be definable in a Hensel-minimal structure. Can $\#X^{\mathrm{trans}}(\mathbb{Q},H)$ be bounded uniformly for all $H\geq1$, with bounds analogous to those known in dimension one?
