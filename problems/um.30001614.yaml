title: Extreme Points and Fermat Equations in Star-Invariant Spaces
field: mathematics
tier: prose
statement: For an inner function $\theta$ and $K^{p}_{\theta}=H^{p}\cap\theta H^{p}_{0}$, characterize the extreme points of the unit ball of $K^{\infty}_{\theta}$; and prove or disprove the Fermat equation $f^{n}+g^{n}=h^{n}$ in $K^{p}_{\theta}$ for $n\geq3$, except when $f,g,h$ span a one-dimensional subspace.
