  \item[\hypertarget{source:statement:2}{S2}] Brad Rodgers and Terence Tao, \emph{The de Bruijn--Newman constant is non-negative}, arXiv:1801.05914v5 (2021) Abstract and Introduction, equations (3)--(4), pp. 1--3. \url{https://arxiv.org/pdf/1801.05914}.
