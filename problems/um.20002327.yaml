title: From stable norms to stable theories
field: mathematics
tier: prose
statement: |-
  **Problem 3.** Find connections between different notions of stability: quantifier-free stability, stability of structures, stability of theories. What does each of these notions imply?

  **Background.** Assume \(M\) is a normed space. If the norm of \(M\) is a stable formula, then there is an isometric copy of \(\ell_p\) inside an ultrapower of \(M\) for some \(p\geq 1\) (Krivine). The group working on “Definable norms and stable Banach spaces” worked on this subject.
