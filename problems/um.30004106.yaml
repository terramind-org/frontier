title: Symmetry of Completed Finite-Group Representation Rings
field: mathematics
tier: prose
statement: Let $G$ be a finite group and let $k$ be a field of characteristic $p$. Write $a_{\mathbb C}(G)=\mathbb C\otimes_{\mathbb Z}a(G)$ for the complexified Green ring of finite-dimensional $kG$-modules, give $\sum_i a_i[M_i]$ the norm $\sum_i|a_i|\dim M_i$, and let $\widehat a(G)$ be its completion with involution induced by module duality. Is $\widehat a(G)$ a symmetric Banach $*$-algebra?
