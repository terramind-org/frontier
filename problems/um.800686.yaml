title: Holomorphic Foliation Theory — Problem 13
field: mathematics
tier: prose
statement: |-
  Consider a complex manifold $M$ of dimension $n$ which is homogeneous under the action of a Lie group $G$. Let $\mathscr{M}$ denote the space of holomorphic maps from $M$ to $\mathbb{P}^n$, endowed with the topology of uniform convergence on compact sets. The group $G$ acts on this space.

  (i) Under which conditions this action admits a dense orbit ?

  (ii) Extend the construction by B. Weiss to this context.
