statement: |-
  \section{Open Problems in Integrable Systems — Superintegrable systems}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For a smooth Riemannian metric $g$ on $M$, a natural Hamiltonian on the canonical symplectic cotangent bundle $T^*M$ is \[H(x,p)=\tfrac12\sum_{i,j}g^{ij}(x)p_ip_j+U(x),\] with smooth potential $U$ and inverse metric coefficients $g^{ij}$. A polynomial integral of degree $d$ is a smooth function $F(x,p)$ polynomial of degree $d$ in the cotangent variables $p$, satisfying $\{H,F\}=0$. Following the source, integrals which are functions of $H$ alone are trivial. A geodesic flow is the case $U=0$.
  \paragraph{Statement recorded in the supplied source.}
  Construct a natural system on $S^2$ with nonconstant potential $U$ and polynomial integrals $F,G$, each of degree at least $3$, such that $dH,dF,dG$ are linearly independent almost everywhere on $T^*S^2$, while every polynomial integral of degree $1$ or $2$ is trivial. This is maximal superintegrability for a two-dimensional configuration manifold; $F,G$ need not Poisson commute with each other. \sref{statement}{2}
  \subsection{Short English statement}
  Find a polynomially superintegrable natural system on the sphere with nonconstant potential and no nontrivial linear or quadratic integral.
