title: A product criterion and a bowtie obstruction for Cayley interval lattices
field: mathematics
tier: prose
statement: Given a group \(G\) generated by a finite conjugacy-closed set \(T\), intervals in the Cayley graph give quasi-Garside structures. Find natural conditions on \((G,T)\) implying that these intervals are lattices, or a natural class in which the presence or absence of the lattice property has a group-theoretic explanation.
