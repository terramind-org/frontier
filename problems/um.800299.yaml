title: Group Actions on 1-Manifolds — Question 14
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finitely-generated group of $C^2$ circle diffeomorphisms. Assume that $G$ admits an exceptional minimal set
  $\Lambda$. Is the Lebesgue measure of $\Lambda$ equal to zero ?
