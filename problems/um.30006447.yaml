title: Motivic Igusa Series of Plane Curves
field: mathematics
tier: prose
statement: For a smooth curve $f$, compute the motivic Igusa series $Q_f(s,T)$; ultimately compute it for every reduced plane curve. For a reduced plane curve, also find an exponential relation between the cohomology of its restricted contact loci $X_{f,n}^0$ and its punctual Hilbert schemes $\operatorname{Hilb}_n(f)_0$.
