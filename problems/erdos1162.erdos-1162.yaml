      text: |-
        /-- `f n` is the number of subgroups of the symmetric group $S_n$, realised as
        `Equiv.Perm (Fin n)`. All subgroups are counted, not only conjugacy classes. -/
        noncomputable def f (n : ℕ) : ℕ := Nat.card (Subgroup (Equiv.Perm (Fin n)))
