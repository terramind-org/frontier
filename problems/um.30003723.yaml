title: Finiteness of Two-Dimensional Sandpile Avalanches
field: mathematics
tier: prose
statement: For the infinite-volume Abelian sandpile model on $\mathbb{Z}^2$ with stationary measure $\nu$, are avalanches finite almost surely? A sufficient route is to prove that the number of topplings at the addition site is finite $\nu-almost$ surely.
