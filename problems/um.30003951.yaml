title: Collected Problems in Higher Teichmüller and Representation Theory
field: mathematics
tier: prose
statement: |-
  Resolve the following problems in higher Teichmüller and representation theory.

  1. Define a cluster superalgebra incorporating spin structures and a Laurent phenomenon, and determine whether spectral networks have a super analogue in higher super-Teichmüller theory.

  2. Is the direct sum of a quasi-Fuchsian representation and a geometrically infinite representation stable under small deformations in $\operatorname{SO}(6,2)$, $\operatorname{SO}(4,4)$, or $\operatorname{SL}(8,\mathbb R)$? More generally, construct stable discrete faithful representations that are not Anosov.

  3. For a finite graph $\Gamma$, determine the least $n$ for which the right-angled Artin group $A(\Gamma)$ embeds in $\operatorname{SL}_n(\mathbb R)$, including the unipotent, axial, and pentagon cases.
