title: Kegel–Wielandt Theory for Skew Braces
field: mathematics
tier: prose
statement: For skew left braces, is the sum of a trivial skew left brace and a right-nilpotent skew left brace right-nilpotent? Can the Kegel–Wielandt theorem be adapted to skew left braces? Can Huppert's result that finite sums of finite cyclic groups are supersolvable be adapted to skew left braces, and what are the corresponding notions' impacts on Yang–Baxter solutions?
