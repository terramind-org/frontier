id: um.20000351
title: Exact-degree points from automorphism orbits
field: mathematics
tier: prose
statement: |-
  Let \(X\) be a variety. Suppose one has a diagram
  \[
  X\dashleftarrow Y\dashrightarrow \mathbb P^n,
  \]
  where \(Y\dashrightarrow\mathbb P^n\) is finite of degree \(d\). Then, as a
  consequence of Hilbert irreducibility, \(X\) will have a Zariski dense set of
  degree \(d\) points.

  Can we give a method to construct a Zariski dense set of degree \(d\) points
  on a variety different from the one just mentioned?

  * Maybe one can replace \(\mathbb P^n\) with another sort of variety?
  * Maybe one can do something totally different and give a construction not
    coming from a correspondence.
