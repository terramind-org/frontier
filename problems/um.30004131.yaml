title: Large-Deviation Asymptotics for Triangle Counts
field: mathematics
tier: prose
statement: Let $X$ be the number of triangles in $G_{n,p}$. Determine the logarithmic lower-tail asymptotics $$-\log\Pr\!\left(X\leq(1-\delta)\mathbb EX\right)$$ throughout the unresolved sparse regimes, particularly when $p=O(n^{-1/2})$.
