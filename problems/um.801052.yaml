statement: |-
  It is natural to ask whether the third condition is superfluous. The recent result [OC23] suggests that this may be the case.

  Is there a real, conservative, polynomial H\'enon map with an annular rotation domain?
  Is there an open set of such real, conservative, polynomial H\'enon maps?
