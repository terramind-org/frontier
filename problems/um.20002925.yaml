title: Essential tight bypasses in Ustilovsky five-sphere layers
field: mathematics
tier: prose
statement: |-
  For \(k\ge0\), choose and mark two disjoint small Darboux balls \(B_-,B_+\subset(S^5,\xi_k)\). Give an ordered list of Honda--Huang bypass attachment data on the evolving convex \(S^4\) levels whose stacked contact cobordism is contactomorphic, relative to both marked boundary collars, to
  \[
  L_k=(S^5\setminus\operatorname{Int}(B_-\cup B_+),\xi_k).
  \]
