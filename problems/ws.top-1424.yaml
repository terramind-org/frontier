  \item[\hypertarget{source:statement:3}{S3}] Jiangdong Ai and Xiaopan Lian, An improved finite bound for oriented trees in tournaments, arXiv:2608.11667 (2026). \url{https://arxiv.org/abs/2608.11667}. Bibliographic information from the supplied record.

