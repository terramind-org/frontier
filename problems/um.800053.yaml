title: Hirzebruch's 1954 Problem List — Problem 2
field: mathematics
tier: prose
statement: |-
  A Pfaffian equation in $M^{2k+1}$ can be locally reduced to the normal form
  $$
  dx_{2k+1}+x_1dx_{k+1}+\ldots+x_rdx_{k+r}=0\ , \ \ \ \ 0\leq r\leq k\ ,
  $$
  where $r$ is the only local invariant, $2r+1$ being what is usually called the class of the local Pfaffian equation. The number $r$
  being fixed, give a criterion to determine whether $M^{2k+1}$ admits a Pfaffian equation in the large whose class is $2r+1$ everywhere.
