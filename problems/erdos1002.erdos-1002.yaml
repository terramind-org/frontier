  module: FormalConjectures.ErdosProblems.«1002»
  decl: Erdos1002.erdos_1002
  statement: |-
    theorem erdos_1002 :
        ∃ g : ℝ → ℝ, Monotone g ∧
        Tendsto g atBot (𝓝 0) ∧
        Tendsto g atTop (𝓝 1) ∧
        letI f :=  fun (α : ℝ) (n : ℕ) ↦
          (1 / log n) * ∑ k ∈ Icc (1 : ℕ) n, (1 / 2 - Int.fract (α * k))
        ∀ c : ℝ, Tendsto (fun (n : ℕ) ↦ (volume { α | α ∈ Ioo (0 : ℝ) 1 ∧ f α n ≤ c }).toReal)
          atTop (𝓝 (g c))
