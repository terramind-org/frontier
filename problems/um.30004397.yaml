title: CAT(0) Geometry and Retraction of the Bestvina Complex
field: mathematics
tier: prose
statement: For a group $G$ equipped with the Bestvina and Davis complexes arising from a strictly developable simple complex of groups, does the Bestvina complex admit a $G$-invariant CAT(0) metric? Is it a $G$-equivariant deformation retract of the Davis complex?
