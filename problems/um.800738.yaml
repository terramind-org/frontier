title: Banach Spaces and Ramsey Theory — Problem 1
field: mathematics
tier: prose
statement: |-
  Recall that the *Banach-Mazur distance* between two isomorphic Banach spaces
  $X$ and $Y$ (not necessarily infinite-dimensional) is defined by
  \[ d_{BM}(X,Y)=\inf\big\{\|T\|\cdot\|T^{-1}\|: T:X\to Y \text{ is an isomorphism}\big\}.\]
  For every $n\in\mathbb{N}$ define
  \[ R^n_\infty=\max\big\{ d_{BM}(X,\ell^n_\infty): \mathrm{dim}(X)=n\big\}.\]

  \emph{(Distance from the cube -- A. Pe{\l}czy\'{n}ski [Pe2])}
  Determine the asymptotic behavior of $R^n_\infty$ as $n$ tends to infinity.
