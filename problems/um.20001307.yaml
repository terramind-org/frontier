title: Small Fourier data do not force simplicial facets without local normalization
field: mathematics
tier: prose
statement: |-
  **11. (S. Robins)**
  **(a)** Let \(K\) be a polytope and consider the expansion of \(h_K\) in spherical harmonics. If all of the coefficients have small absolute value, are all the facets of \(K\) simplices or close to simplices?
  **(b)** If, for each integer frequency, the Fourier transform of the indicator function \(1_K\) is small, does the same conclusion hold? (This conjecture is made by analogy with pseudorandom number sequences which exhibit this behavior in dimension 1, and the intuition here is that the given hypothesis on the coefficients should exhibit a “random” polytope in some sense.)
