title: Galois Semisimplicity of Cohomology over Finitely Generated Fields
field: mathematics
tier: prose
statement: For every smooth projective $X$ over a finitely generated field $K$ of characteristic zero, every $i,n$, and every prime $\ell$, is $H^i(X)(n)$ semisimple as a representation of the absolute Galois group $\Gamma_K$?
