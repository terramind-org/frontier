title: Kourovka Notebook Problem 13.37
field: mathematics
tier: prose
statement: |-
  Let $G$ be a torsion-free pro-$p
  $-group, $U$ an open subgroup of $G$. Suppose that $U$ is a
  pro-$p
  $-group with a single defining relation. Is it
  true that then $G$ is also a pro-$p
  $-group with a
  single defining relation?
