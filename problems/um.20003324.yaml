title: A critical imbalance parameter for the B_s interpolation
field: mathematics
tier: prose
statement: |-
  Write \(\|x\|\) for the distance from \(x\) to the nearest integer. The statement verified against the source PDF is

  \[
  B_s=\left\{(\alpha,\beta)\in\mathbb R^2:
  \inf_{n\geq 1}n\bigl(\min\{\|n\alpha\|,\|n\beta\|\}\bigr)^s
  \bigl(\max\{\|n\alpha\|,\|n\beta\|\}\bigr)^{2-s}>0\right\}. \]

  **Question.** Compute \(\dim_H B_s\) for \(0<s<1\).

  The source adds that \(B_0\) is the set of badly approximable vectors and has Hausdorff dimension \(2\), whereas \(B_1\) is the exceptional set for Littlewood's conjecture and has Hausdorff dimension \(0\).

  Comparison with the PDF shows that the problem ends after the preceding endpoint sentence. The quantum-chaos text is unrelated and is not used here.
