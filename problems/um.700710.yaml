title: Kourovka Notebook Problem 11.17
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finite group
  and let $d=d(G)$ be the least positive integer such that $G$
  satisfies a law $[x, _ry]=[x, _{r+d} y]$ for some nonnegative
  integer $r=r(G)$.

  a) Let $e=1$ if $d(G)$ is even and $e=2$
  otherwise. Is it true that the exponent of $G/F(G)$ divides $e\cdot
  d(G)$?

  b) If $G$ is a nonabelian simple group, does the exponent of $G$ divide $d(G)$?

  Part a) is true for soluble groups (N. D. Gupta,
  H. Heineken, *Math. Z.*, **95** (1967), 276--287). I have
  checked part b) for ${\mathbb{A}_n$, $PSL(2,q)$, and a number of
  sporadic groups.
