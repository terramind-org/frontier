id: um.30003399
title: Limit Laws for Random-Simplex Volume Statistics
field: mathematics
tier: prose
statement: Let $P_{d+1}^K$ be the convex hull of $d+1$ independent uniform points in a $d$-dimensional convex body $K$. Can one prove central limit theorems as $d\to\infty$ for the volumes of $P_{d+1}^K$ when $K$ is the Euclidean ball, a regular simplex, a cube, or a cross-polytope? Separately, if $P_n^d$ is the convex hull of $n$ independent uniformly random vertices of the cube $[0,1]^d$, determine the asymptotic behavior of $\mathbb E f_\ell(P_n^d)$ for $2\leq\ell\leq d-2$.
