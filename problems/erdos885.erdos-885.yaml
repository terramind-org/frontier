lean:
  module: FormalConjectures.ErdosProblems.«885»
  decl: Erdos885.erdos_885
  statement: |-
    theorem erdos_885 : ∀ k ≥ 1,
        ∃ Ns : Finset ℕ,
          (∀ n ∈ Ns, 1 ≤ n) ∧
          Ns.card = k ∧
          (⋂ n ∈ Ns, factorDifferenceSet n).ncard ≥ k
  context:
    - open Erdos885
    - open Nat Set Finset
  definitions:
    - name: Erdos885.factorDifferenceSet
      kind: def
      text: |-
        /--
        For integer $n \geq 1$ we define the factor difference set of $n$ by
        $D(n) = \{|a-b| : n=ab\}$.
        -/
        def factorDifferenceSet (n : ℕ) : Set ℕ :=
          {d | ∃ a b : ℕ, n = a * b ∧ (d : ℤ) = |(a : ℤ) - b|}
