statement: |-
  \section{Dubner's conjecture}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A prime $p$ is a twin member if at least one of $p-2$ and $p+2$ is prime. The two chosen summands need not come from the same twin pair and need not be distinct.
  \paragraph{Statement recorded in the supplied source.}
  For every even integer $N>4208$, do there exist primes $p,q$ with $N=p+q$ such that each of $p$ and $q$ is a twin member? \sref{statement}{2}
  \subsection{Short English statement}
  Can every even integer above four thousand two hundred eight be expressed as a sum of two primes, each belonging to some twin-prime pair?
