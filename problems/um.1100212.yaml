title: Questions in Geometric Group Theory — Q 2.12
field: mathematics
tier: prose
statement: (Kim Ruane) Let $G$ be a Coxeter group, for example a right-angled Coxeter group, acting properly discontinuously by isometries on a CAT(0) space $X$. How is $X$ different from the Coxeter complex? Specifically, if $H$ is a special subgroup of $G$, is there a closed convex subset of $X$ on which $H$ acts cocompactly?
