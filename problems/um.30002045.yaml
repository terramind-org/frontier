title: Effective Thue–Mahler Equations over Finitely Generated Domains
field: mathematics
tier: prose
statement: Let $F\in A[X,Y]$ be a binary form of degree at least $3$ without multiple factors over a finitely generated domain $A$. Given that $F(x,y)\in A^*$ has only finitely many solution classes under simultaneous multiplication by units, can representatives $(x_i,y_i)$ of every class be determined effectively?
