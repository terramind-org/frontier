title: Open Problems on Central Simple Algebras — Problem 37
field: mathematics
tier: prose
statement: |-
  Let $F$ be a field and $G$ a finite group.
  We say $G$ is *$F$-admissible* if there exists a
  $G$-crossed product $F$-division algebra $A$.

  Determine which groups are $F$-admissible, for a field $F$.
