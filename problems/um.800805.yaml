title: Geometric Hydrodynamics in Open Problems — Problem 4
field: mathematics
tier: prose
statement: |-
  Is it possible to extend Arnold's geodesic framework
  from the group of diffeomorphisms $\mathscr{D}(M)$ to the semigroup of maps ${\mathcal{M}ap}(M)$
  that would capture both smooth solutions and their continuations beyond emergence of shock waves
  for Burgers-like and compressible fluid equations?
