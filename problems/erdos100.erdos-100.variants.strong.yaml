lean:
  module: FormalConjectures.ErdosProblems.«100»
  decl: Erdos100.erdos_100.variants.strong
  statement: |-
    theorem erdos_100.variants.strong :
        ∀ᶠ n in atTop, ∀ A : Finset ℝ²,
          A.card = n →
          DistancesSeparated A →
          diam (A : Set ℝ²) ≥ n - 1
  context:
    - open Erdos100
    - open Erdos100.erdos_100
    - open Erdos100.erdos_100.variants
    - open Set Metric Filter Real
    - open scoped EuclideanGeometry
  definitions:
    - name: Erdos100.DistancesSeparated
      kind: def
      text: |-
        /-- If two distances in A differ, they differ by at least 1. -/
        def DistancesSeparated (A : Finset ℝ²) : Prop :=
          ∀ p₁ q₁ p₂ q₂, p₁ ∈ A → q₁ ∈ A → p₂ ∈ A → q₂ ∈ A →
            dist p₁ q₁ ≠ dist p₂ q₂ →
            |dist p₁ q₁ - dist p₂ q₂| ≥ 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/100.lean#L36
