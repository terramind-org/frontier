title: Discrete Ricci flow
field: mathematics
tier: prose
statement: Let the metric of a Markov space evolve by $$\frac{d}{dt}d(x,y)=-\kappa(x,y)d(x,y),$$ where $\kappa$ is computed from the current metric, with either a fixed or suitably evolving transition kernel. What can be said about the existence, behavior, and limiting geometry of this discrete Ricci flow?
