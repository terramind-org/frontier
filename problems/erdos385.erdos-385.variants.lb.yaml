lean:
  module: FormalConjectures.ErdosProblems.«385»
  decl: Erdos385.erdos_385.variants.lb
  statement: |-
    theorem erdos_385.variants.lb : ∃ (e : ℕ → ℝ) (he : e =o[atTop] (1 : ℕ → ℝ)),
        ∀ n, n + (1 - e n) * √n ≤ F n
  context:
    - open Erdos385
    - open Erdos385.erdos_385
    - open Erdos385.erdos_385.variants
    - open Filter
  definitions:
    - name: Erdos385.F
      kind: def
      text: |-
        /-- Let $F(n) := \max\{m + p(m) \mid  \textrm{$m < n$ composite}\}\}$ where $p(m)$ is the least
        prime divisor of $m$. -/
        noncomputable def F (n : ℕ) : ℕ := sSup {m + m.minFac | (m < n) (_ : m.Composite)}
