title: Cartan-Hadamard Theorem without Uniform Local Medianity
field: mathematics
tier: prose
statement: Let $X$ be a complete simply connected path-metric space in which every point has a neighborhood where each triple has a unique median. Must $X$ be a median space even when the radii of these neighborhoods are not uniformly bounded below?
