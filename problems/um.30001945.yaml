title: Chain-Independent Homology Growth over Arbitrary Fields
field: mathematics
tier: prose
statement: |-
  For which groups $G$ does

  $$\lim_i\frac{b_1(G_i;K)}{[G:G_i]}$$

  exist for every inverse system of finite-index normal subgroups $G_i$ with trivial intersection, independently of the system and the field $K$?
