title: A cyclotomic audit and the complete type-A2 family
field: mathematics
tier: prose
statement: |-
  **Problem 2.8 ([CLS14]).** Prove a cyclic sieving phenomenon for
  multitriangulations, using the analogue of Cambrian rotation and the
  polynomial
  \[
  P_{W,k}(q)=
  \prod_{0\le j<k}\prod_{1\le i\le n}
  \frac{[d_i+h+2j]_q}{[d_i+2j]_q}.
  \tag{1}
  \]
