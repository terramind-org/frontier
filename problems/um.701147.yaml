title: Kourovka Notebook Problem 15.59
field: mathematics
tier: prose
statement: |-
  Does there exist a
  profinite group $G$ that is not free but can be represented as
  a projective limit $G=\lim\limits_{\longleftarrow}(G/N_{\alpha})$, where
  all the $G/N_{\alpha}$ are free profinite groups of finite ranks?

  The finiteness condition on the ranks of the
  $G/N_{\alpha}$ is essential. Such a group $G$ cannot satisfy the first
  axiom of
  countability (O. V. Mel'nikov, *Dokl. AN BSSR*, **24**, no. 11 (1980), 968--970 (Russian)).
