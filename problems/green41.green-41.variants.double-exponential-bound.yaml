lean:
  module: FormalConjectures.GreensOpenProblems.«41»
  decl: Green41.green_41.variants.double_exponential_bound
  statement: |-
    theorem green_41.variants.double_exponential_bound :
        ∃ C : ℝ, ∃ ε₀ > 0, ∀ ε ∈ Ioc 0 ε₀, (minCopies ε : ℝ) ≤ Real.exp (Real.exp (ε ^ (-C)))
  context:
    - open Green41
    - open Green41.green_41
    - open Green41.green_41.variants
    - open Complex Set Pointwise
  definitions:
    - name: Green41.minCopies
      kind: def
      text: |-
        /-- The minimal number of rotated copies of the pyjama set of width ε needed to cover the plane. -/
        noncomputable def minCopies (ε : ℝ) : ℕ :=
          sInf (coveringCopies ε)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/GreensOpenProblems/41.lean#L48
