title: Research Problems in Function Theory — Problem 5.76
field: mathematics
tier: prose
statement: Let $\gamma$ be a non-tangential arc that lies in $\mathbb{D}$ except for one endpoint at $z = 1$, and define \[\gamma_\theta=e^{i\theta\gamma},\hspace{1cm}\theta\in[0,2\pi).\] Does there exist a function $g\in H^\infty$ such that \[\lim_{z\to e^{i\theta},\,z\in\gamma_\theta}g(z)\] exists for no value of $\theta$? (See Rudin .) If $\gamma$ is tangential, the answer is `yes', see Collingwood and Lohwater . (W. Rudin; communicated by K. F. Barth)
