id: um.10000052
title: Critical probability of polynomial-growth disk triangulations
field: mathematics
tier: prose
statement: Let $G$ be a bounded-degree triangulation of an open disk with polynomial volume growth. Prove that its Bernoulli site-percolation critical probability satisfies $p_c(G)\ge 1/2$. Under natural sparsity hypotheses on vertices of degree greater than six, is $p_c(G)=1/2$?
