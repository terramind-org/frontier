title: Kourovka Notebook Problem 15.50
field: mathematics
tier: prose
statement: |-
  Let $G$ be a group of automorphisms of an abelian
  group of prime exponent. Suppose that there exists $x\in G$ such that
  $x$ is regular of order 3 and the order of $[x,g]$ is finite for
  every $g\in G$. Is it true that $\langle x^G\rangle$ is locally
  finite?
