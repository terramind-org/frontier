title: Ruling and weave stratifications for Legendrian (-1)-closures
field: mathematics
tier: prose
statement: |-
  Given a positive braid, the front projection of a Legendrian link which is its rainbow closure has an augmentation variety with a ruling stratification into \((\mathbb C^k)\times(\mathbb C^*)^l\) pieces. This stratification is the same as the one coming from the cluster variety.

  Let \(\beta\in\operatorname{Br}_n^+\) have Demazure product \(w_0\), and let \(\Lambda(\beta\Delta)\) be the Legendrian \((-1)\)-closure appearing in the braid-variety/augmentation-variety correspondence, where \(\Delta\) is the positive half twist. Under the isomorphism between \(X(\beta)\) and \(\operatorname{Aug}(\Lambda(\beta\Delta))\), does the normal-ruling decomposition of the augmentation variety coincide piece by piece with a weave/cluster decomposition of the braid variety?
