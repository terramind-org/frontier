title: Socle Filtrations from Duflo–Serganova Kernels
field: mathematics
tier: prose
statement: |-
  For $k\leq\min(m,n)$, let $K^k_{m\mid n}$ be generated by the objects annihilated by every Duflo–Serganova functor $\operatorname{DS}_x$ with $x\in X_k$. Is the equality

  $$\operatorname{soc}_kK_{m\mid n}=K^k_{m\mid n}$$

  valid?
