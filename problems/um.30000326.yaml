title: Arakelov Self-Intersection Formula for Arithmetic Curves
field: mathematics
tier: prose
statement: For a regular arithmetic model $\mathcal X$ of a smooth projective curve $X/K$, with dualizing sheaf $\omega$ carrying the Arakelov metric, is $\widehat{\deg}(\omega^2)$ equal to $a_1(2g-2)\log|\Delta_{K/\mathbb Q}|+a_2\sum_{x\in\mathcal X_{\rm sing}}\log\#k(x)+\sum_{\sigma:K\hookrightarrow\mathbb C}\delta_{\rm Fal}(X_\sigma(\mathbb C))+a_3$ for constants $a_1,a_2,a_3\in\mathbb R$?
