title: Forest Analogues of Schubert-Polynomial Properties
field: mathematics
tier: prose
statement: Find forest counterparts of the structural and positivity properties of Schubert polynomials. In particular, for an indexed forest $F$, give explicit coefficients $a^G_{i,F}$ in $(x_1+\cdots+x_i)P_F=\sum_Ga^G_{i,F}P_G$.
