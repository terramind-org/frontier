title: Moments of L-functions — Moments of the Riemann zeta function — Problem 23
field: mathematics
tier: prose
statement: |-
  Determine a polynomial $P$ of degree 10 such that
  \begin{equation}

  \sum_{0 < d < X} L(\tfrac{1}{2}, \chi_{8d})^4 = X P(\log X) + o(X)
  \end{equation}
  where $d$ ranges through odd square-free numbers and $\chi_{8d}$ denotes the quadratic character associated to the fundamental discriminant $8d$.
  Can the error term $o(X)$ be replaced by a power savings error term? Can the Multiple Dirichlet series method be used to obtain the first coefficients of $P$ (for instance see [DPP]). \\
  (Nathan Ng, Lethbridge)
