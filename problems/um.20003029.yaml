title: A two-defect completion obstruction to topological homology concordance
field: mathematics
tier: prose
statement: |-
  Concordance of knots in homology spheres.

  Is every knot in every integer homology sphere topologically concordant in some integer homology cobordism to a knot in $S^3$? (i.e. is $\phi_{top}$ surjective?)

  In the smooth category, the answer is `No' due to work of Levine (Levine 2016, MR3589337)
  The answer is 'Yes' modulo every term of the $n$-solvable filtration, due to work of Davis (arXiv:1803.01086).
