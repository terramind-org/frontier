title: Circumscribed $2n$-Facet Polytopes around the Unit Ball
field: mathematics
tier: prose
statement: Let $B^n$ be the Euclidean unit ball and let $P_{2n}\supseteq B^n$ be an $n$-dimensional polytope with $2n$ facets. Is $\max_{x\in P_{2n}}d(0,x)\geq\sqrt n$, with equality exactly when $P_{2n}$ is a cube circumscribed about $B^n$?
