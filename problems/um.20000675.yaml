title: Sparse-orbit counterexamples and the exact Polynomial Chowla implication
field: mathematics
tier: prose
statement: |-
  1. **Polynomial Sarnak 1 (PS1).** If \((X,T)\) is minimal and has zero entropy, then
     \[
     \sum_{n\leq N}\lambda(n)f(T^{p(n)}x)=o(N).
     \]
  2. **Polynomial Sarnak 2 (PS2).** If \(p\in\mathbb Z[t]\) is not a constant multiple of the square of a polynomial, then
     \[
     \sum_{n\leq N}\lambda(p(n))f(T^n x)=o(N).
     \]
  3. **Polynomial Chowla (PC).** Under the same nonsquare condition,
     \[
     \sum_{n\leq N}\lambda(p(n))=o(N).
     \]

  The question is whether the two Polynomial Sarnak statements are true and whether either follows from Polynomial Chowla. The source uses \(X\) both for the phase space and the summation cutoff; this report uses \(N\) for the cutoff. We extend \(\lambda\) to \(\mathbb Z\) by \(\lambda(-m)=\lambda(m)\) and \(\lambda(0)=0\), as is standard in the polynomial Chowla literature. Polynomial zeros affect only finitely many summands.

  The archived source contains two later remarks. The name “Z. Liang” in one remark is a typo: the cited author is **Zhengxing Lian**, with Ruxi Shi. The source also states that PS2 follows from PC by the usual Chowla-to-Sarnak argument. Section 7 below supplies the algebraic and ergodic details needed to justify that assertion from the displayed, one-polynomial formulation of PC.
