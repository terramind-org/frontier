title: Moments of L-functions — Moments of the Riemann zeta function — Problem 13
field: mathematics
tier: prose
statement: |-
  In [CFKRS] a conjectural method known as the `recipe' is introduced. The `recipe' was used to produce (conjecturally) a full asymptotic formula for $I_k(T)$.
  Can the `recipe' be made rigorous in the case of the fourth moment? That is, can we give a new proof of the asymptotic formula with power savings error term for $I_2(T)$
  following the `recipe' method. \\
  (Nathan Ng, Lethbridge) \\
