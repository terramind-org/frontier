title: "Nonperiodic 2-by-2 products: a literal factorization diagnostic, exact commuting asymptotics, and a no-limit obstruction"
field: mathematics
tier: prose
statement: |-
  Consider
  \[
  \prod_{i=1}^N
  \begin{bmatrix}1&a_i z\\ b_i&1\end{bmatrix},
  \]
  for constants \(a_i,b_i\). Suppose Wiener-Hopf factorization has no partial indices. Study the behavior as \(N\to\infty\). The asymptotics are known if the \(a_i\)'s and \(b_i\)'s are periodic. What happens in the more general case?
