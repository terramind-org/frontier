title: Sign normalization and a degree-dependent cut bound for polynomial S-curves
field: mathematics
tier: prose
statement: |-
  **$S$-curves for complex potentials in the scalar case**

  Analysis of existence and properties of $S$-curves in the scalar case when the potential is $\phi(z)=\textrm{Re}\,z^p$, for $p\geq 3$, and we take $\tau$ as the set of continua that join neighboring valleys of $\phi(z)$ (where $\phi(z)\to-\infty$) in the complex plane. In particular, prove that the support of the equilibrium measure on a curve with the $S$-property is one-cut case, or give bounds on the number of cuts depending on $p$.
