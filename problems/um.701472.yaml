title: Kourovka Notebook Problem 18.43
field: mathematics
tier: prose
statement: |-
  a) Do there exist elements $u,v$ of a 2-generator free group $F(a,b)$ such that $u,v$ are not conjugate in $F(a,b)$ but for any matrices $A,B\in GL(3, \mathbb{C})$ we have $trace(u(A,B))= trace(v(A,B))$?

  b) The same question if we replace $GL(3,\mathbb{C})$ by $SL(3,\mathbb{C})$.
