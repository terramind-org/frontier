title: Kourovka Notebook Problem 15.73
field: mathematics
tier: prose
statement: |-
  Is it true that for every finite lattice $L$ there
  exists a finite group $G$ and a subgroup $H \le G$ such that the
  interval $Int(H;G)$ in the subgroup lattice of $G$ is isomorphic to
  $L$? (Probably not.)
