title: "Off-diagonal van der Waerden numbers: refuted quadratic conjecture and a difference-sensitive transversal criterion"
field: mathematics
tier: prose
statement: |-
  Let \(W(k,\ell)\) be the minimum \(n\) so that any red/blue coloring of \(\{1,\cdots,n\}\) has either a red \(k\)-AP or a blue \(\ell\)-AP. The following conjecture is supported by numerical evidence:
  \[
  W(3,\ell)=\ell^{2+o(1)}.
  \]
