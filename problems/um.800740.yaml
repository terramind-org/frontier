statement: |-
  *(Rosenthal basis problem -- H. P. Rosenthal [FPR])*
  Is it true that every Rosenthal basis $(x_n)$ is equivalent to the standard
  unit vector basis of $c_0$ or $\ell_p$ for some $1\leqslant p<+\infty$?
