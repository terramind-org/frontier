lean:
  module: FormalConjectures.GreensOpenProblems.«75»
  decl: Green75.green_75
  statement: |-
    theorem green_75 :
        ∀ X : Finset (ℝ × ℝ), 2 ≤ #X → ∃ p ∈ X, ∃ q ∈ X, p ≠ q ∧ imbalance X p q ≤ 100
  context:
    - open Green75
    - open scoped Finset
  definitions:
    - name: Green75.imbalance
      kind: def
      text: |-
        /--
        `imbalance X p q` is the absolute difference between the numbers of points of `X` on the two sides
        of the line through
        `p` and `q`. The points of `X` on the line itself are on neither side.
        -/
        noncomputable def imbalance (X : Finset (ℝ × ℝ)) (p q : ℝ × ℝ) : ℤ :=
          |(leftCount X p q : ℤ) - (rightCount X p q : ℤ)|
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/GreensOpenProblems/75.lean#L53
