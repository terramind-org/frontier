statement: |-
  % UnsolvedMath ID 3278; source catalogue code OPG-47031
  \setcounter{section}{3277}
  \section{Edge-disjoint Hamilton cycles in highly strongly connected tournaments.}\label{3278}
  {\small\sffamily UnsolvedMath ID 3278 · Graph Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A finite tournament is a digraph having exactly one of $u\to v$ and $v\to u$ for every pair of distinct vertices. It is strongly $r$-connected if it has more than $r$ vertices and deleting any set of fewer than $r$ vertices leaves a strongly connected digraph. A directed Hamilton cycle visits every vertex exactly once. A regular tournament of order $n$ has indegree and outdegree $(n-1)/2$ at every vertex.
  \paragraph{Statement recorded in the supplied source.}
  For every integer $k\geq2$, does there exist an integer $f(k)$ such that every strongly $f(k)$-connected tournament contains $k$ pairwise arc-disjoint directed Hamilton cycles? The accompanying regular-tournament question (Kelly's conjecture) asks whether every regular tournament of order $n$ has an arc decomposition into $(n-1)/2$ directed Hamilton cycles. \sref{3278}{2} \sref{3278}{3}
  \subsection{Short English statement}
  The historical questions ask for many disjoint Hamilton cycles from sufficiently high connectivity, and for a full Hamilton decomposition of every regular tournament.
  \subsection{Sources}
