  \item[\hypertarget{source:3278:2}{S2}] Open Problem Garden, Edge-disjoint Hamilton cycles in highly strongly connected tournaments., node 47031, original problem page. Original question and full discussion. \url{https://www.openproblemgarden.org/op/edge_disjoint_hamilton_cycles}.
