  \item[\hypertarget{source:1413:3}{S3}] Y. Ishida, No involutions in the missing Moore graph, arXiv:2606.29183 (2026). \url{https://arxiv.org/abs/2606.29183}. Bibliographic information from the supplied record.

  \item[\hypertarget{source:1413:4}{S4}] A. A. Makhnev, Moore graph with parameters (3250,57,0,1) does not exist, arXiv:2010.13443 (2020). \url{https://arxiv.org/abs/2010.13443}. Bibliographic information from the supplied record.

