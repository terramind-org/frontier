title: Vogan Conjecture for Quasisplit Classical Groups
field: mathematics
tier: prose
statement: For $G=\operatorname{GL}_n$, $\operatorname{SO}_{2n+1}$, or $\operatorname{Sp}_{2n}$, prove that local Arthur packets equal the corresponding ABV packets and that Arthur's stable distributions and their endoscopic transfers are computed by the normalized vanishing-cycle functors predicted by Vogan's conjecture.
