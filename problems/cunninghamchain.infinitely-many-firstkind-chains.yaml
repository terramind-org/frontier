id: cunninghamchain.infinitely-many-firstkind-chains
title: Cunningham chains — Jones's conjecture (infinitely_many_firstKind_chains)
field: mathematics
tier: proof
statement: |-
  Jones's conjecture (first kind): for every positive integer $k$, there are
  infinitely many primes $p$ that start a first-kind Cunningham chain of
  exactly length $k$.
