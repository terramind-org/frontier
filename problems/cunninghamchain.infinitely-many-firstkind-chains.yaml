lean:
  module: FormalConjectures.Arxiv.«1104.1579».CunninghamChain
  decl: CunninghamChain.infinitely_many_firstKind_chains
  statement: |-
    theorem infinitely_many_firstKind_chains (k : ℕ) (hk : 0 < k) :
        Set.Infinite {p : ℕ | IsFirstKindChainOfLength p k}
  context:
    - open CunninghamChain
  definitions:
    - name: CunninghamChain.IsFirstKindChainOfLength
      kind: def
      text: |-
        /-- `p` starts a first-kind Cunningham chain of exact positive length `k`. -/
        def IsFirstKindChainOfLength (p k : ℕ) : Prop :=
          0 < k ∧ (∀ i < k, (firstKindTerm p i).Prime) ∧ ¬(firstKindTerm p k).Prime
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Arxiv/1104.1579/CunninghamChain.lean#L53
