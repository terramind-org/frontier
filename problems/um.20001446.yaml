title: Comparable truncators and a radial reduction for the localized Santalo conjecture
field: mathematics
tier: prose
statement: |-
  **Conjecture due to D. Cordero-Erausquin.** If \(K\) and \(L\) symmetric
  convex bodies in \(\mathbb R^n\), then

  \[
  |K\cap L|\,|K^\circ\cap L|
  \le |B_2^n\cap L|\,|B_2^n\cap L|,
  \]

  where
  \[
  K^\circ=\{y\in\mathbb R^n:\ \langle x,y\rangle\le1
  \text{ for every }x\in K\}
  \]
  is the polar body of \(K\).
