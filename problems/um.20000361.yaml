title: Del Pezzo irrationality values and a global-field quartic characteristic dichotomy
field: mathematics
tier: prose
statement: |-
  For a variety \(X/F\), define its degree of irrationality \(\operatorname{irr}(X)\) to be the minimum degree of a rational map \(X\dashrightarrow\mathbb P^2\) (defined over \(F\)).

  Compute \(\operatorname{irr}(X/F)\) for a del Pezzo surface \(X\) over a general field \(F\).
