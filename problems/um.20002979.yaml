title: A double-line test package for geometric Khovanov homology
field: mathematics
tier: prose
statement: |-
  For Khovanov homology develop analogues of

  a) The Oblomkov--Rasmussen--Shende conjecture.

  b) Braid varieties.

  c) \(\operatorname{Hilb}^n(\mathbb C^2)\) should be \(\operatorname{Hilb}^n(x^2=0)\).
