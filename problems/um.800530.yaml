title: Linear Systems and Eigenvalue Problems — Problem 39
field: mathematics
tier: prose
statement: |-
  Given any choice of $m$-node tree tensor network (e.g., tensor train or Tucker) and choice of ranks (dimensions of edges in the tensor network), let the set of representable tensors in this tensor network be $S\subset \mathbb{R}^{d_1\times \cdots \times d_n}$.
  Find a polynomial-time algorithm that takes as input any tensor $\mathcal{A}\in\mathbb{R}^{d_1\times \cdots \times d_n}$ and yields an approximation $\mathcal{X}\in\mathbb{S}$ such that
  \[\|\mathcal{X}-\mathcal{A}\|_F^2 < (m-1)\min_{\mathcal{Y}\in S}\|\mathcal{Y}-\mathcal{A}\|_F^2,\]
  or show that an $(m-1)$-approximation is optimal under complexity-theoretic assumptions.
