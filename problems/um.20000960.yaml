title: Two-colored planes and the exact stripe spectrum
field: mathematics
tier: prose
statement: |-
  Conjecture. In any 2-coloring of E^2, every 3-point set X occurs monochromatically (as some congruent copy), except possibly for the three points that form some specific equilateral triangle.

  (Example coloring: half-open horizontal stripes of height sqrt(3)/2 in alternating colors will stop the three vertices of a unit equilateral triangle from occurring monochromatically).

  Known: If T is a set of 3 collinear points, then there exists a 16-coloring of E^N with no monochromatic copy of T.
