title: Ordinary Degree-d Curves Through Finite Point Sets
field: mathematics
tier: prose
statement: For a finite set $P\subset\mathbb{P}^2(\mathbb{R})$ and a positive integer $d$, must either $P$ lie on a degree-$d$ curve or some degree-$d$ curve contain exactly $(d^2+3d)/2$ points of $P$ and be uniquely determined by them?
