title: Rank-two verification and peripheral reductions for the relatively hyperbolic LERF conjecture
field: mathematics
tier: prose
statement: |-
  **Relatively hyperbolic case.** If \(G\) is a LERF relatively hyperbolic free-by-cyclic group which is not hyperbolic then \(G\) is the fundamental group of a hyperbolic 3-manifold.

  Here “hyperbolic” in the hypothesis means word-hyperbolic, while “hyperbolic 3-manifold” in the conclusion means a manifold with a complete hyperbolic metric.

  The workshop report supplies important intended context: it discusses free-by-cyclic groups hyperbolic relative to a **nonempty collection of \(\mathbb Z^2\) subgroups**, and identifies such groups as analogues of cusped finite-volume hyperbolic 3-manifold groups. Accordingly, throughout the mathematical results below, “relatively hyperbolic” means non-elementary strong relative hyperbolicity with respect to a finite nonempty family of proper subgroups isomorphic to \(\mathbb Z^2\). This convention is necessary: allowing the degenerate structure relative to the group itself would make the statement ill-posed. The intended conclusion is a finite-volume cusped hyperbolic 3-manifold. The source does not specify orientability, so none is silently imposed.

  Write
  \[
  G_\phi=F_n\rtimes_\phi\mathbb Z
  =\langle F_n,t\mid txt^{-1}=\phi(x),\ x\in F_n\rangle,
  \]
  where \(\Phi=[\phi]\in\operatorname{Out}(F_n)\). The exact conclusion is an isomorphism \(G_\phi\cong\pi_1(M)\), not merely a virtual identification.
