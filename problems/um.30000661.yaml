title: Generalized Tameness of an Explicit Polynomial Automorphism
field: mathematics
tier: prose
statement: Let $\Delta=x^2y+z^2$ and define $\gamma\in\operatorname{Aut}\mathbb{C}[x,y,z]$ by $\gamma(x)=x$, $\gamma(z)=z+x\Delta$, and $\gamma(y)=y-2xyz-\Delta^2+2(3z^2\Delta+3xz\Delta^2+x^2\Delta^3)$. Is $\gamma$ generalized tame, that is, in the subgroup generated by tame and exponential automorphisms?
