title: Squarefree Kernel Counts Outside the Established Range
field: mathematics
tier: prose
statement: |-
  Let $k(n)$ be the squarefree kernel of $n$ and

  $$N(x,y)=\#\{n\leq x:k(n)\leq y\}.$$

  Determine the asymptotic behavior of $N(x,y)$ outside

  $$H_\varepsilon=\{(x,y):\exp((\log\log x)^\varepsilon)\leq y\leq x\},$$

  apart from the known small-$y$ range.
