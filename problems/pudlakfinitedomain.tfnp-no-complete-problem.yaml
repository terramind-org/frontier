  module: FormalConjectures.Paper.PudlakFiniteDomainConjectures
  decl: PudlakFiniteDomain.tfnp_no_complete_problem
  statement: "theorem tfnp_no_complete_problem : ¬∃ T : TFNPProblem, T.IsComplete"
  context:
