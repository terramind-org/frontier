  definitions:
    - name: PudlakFiniteDomain.TFNPProblem
      kind: structure
      text: |-
        /-- A **total NP search problem**: a polynomial-time relation `R` such that every input `x` has
        a solution `y` of length at most `p |x|`. -/
        structure TFNPProblem where
          /-- The polynomial-time verification relation. -/
          R : List Bool × List Bool → Bool
          /-- The bound on solution lengths. -/
          p : Polynomial ℕ
          polyTime : IsPolyTime R
          total : ∀ x, ∃ y : List Bool, y.length ≤ p.eval x.length ∧ R (x, y)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Paper/PudlakFiniteDomainConjectures.lean#L83
    - name: PudlakFiniteDomain.TFNPProblem.IsComplete
      kind: def
      text: |-
        /-- `T` is a **complete** total NP search problem. -/
        def TFNPProblem.IsComplete (T : TFNPProblem) : Prop :=
          ∀ S : TFNPProblem, S.Reduces T
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Paper/PudlakFiniteDomainConjectures.lean#L101
