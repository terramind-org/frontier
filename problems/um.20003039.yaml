statement: "**Surgeries and concordance.** Suppose \\(K\\) and \\(J\\) are knots in \\(S^3\\) such that for all \\(p/q\\in\\mathbb Q\\), the Dehn surgeries \\(S^3_{p/q}(K)\\) and \\(S^3_{p/q}(J)\\) are integer homology cobordant. Must \\(K\\) and \\(J\\) be concordant?"
