id: um.30005436
title: Structure Groups of Anisotropic Bilinear Forms
field: mathematics
tier: prose
statement: Let $b(v,w)=v^{\mathsf T}Aw$ be an anisotropic, not necessarily symmetric, bilinear form on $K^n$. Find a representation of the structure group $G(X(b))$ that generalizes the pure paraunitary model $$G(X(b))\cong\{\varphi(t)\in\operatorname{GL}_n(K[t,t^{-1}]):\varphi(t^{-1})^{\mathsf T}A\varphi(t)=A,\ \varphi(1)=I\}$$ available in the symmetric case.
