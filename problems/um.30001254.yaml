title: Local–Global Principles for Homogeneous Spaces
field: mathematics
tier: prose
statement: Let $K$ be a complete discretely valued field and $F$ a one-variable function field over $K$. If $Y$ is a homogeneous space of a connected linear algebraic group over $F$ and $Y(F_v)\neq\varnothing$ for every rank-one discrete valuation $v$ of $F$, must $Y(F)\neq\varnothing$?
