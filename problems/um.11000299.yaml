title: Question 6.3 — Establish finiteness properties of the kernel IA(n) of the map from Out(Fn) to GL(n, Z).
field: mathematics
tier: prose
statement: Establish finiteness properties of the kernel IA(n) of the map from Out(Fn) to GL(n, Z). In particular, determine whether IA(n) is finitely presentable for n> 3. The subgroup IA( n) is analogous to the Torelli subgroup of the mapping class group of a surface, which also remains quite mysterious in spite of having been extensively studied.
