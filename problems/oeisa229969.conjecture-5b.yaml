id: oeisa229969.conjecture-5b
title: Ways to write $n = x + y + z$ with six linear and quadratic forms prime (conjecture_5b)
field: mathematics
tier: proof
statement: |-
  Conjecture (iii), part 2: Any integer $n > 2$ not equal to $16$ can be written as $x + y + z$
  ($x, y, z > 0$) with $xy+1, xz+1, yz+1$ all prime and $x$ among $1, 2, 6$.
  - _Zhi-Wei Sun_
