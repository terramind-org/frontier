lean:
  module: FormalConjectures.OEIS.«229969»
  decl: OeisA229969.conjecture_5b
  statement: |-
    theorem conjecture_5b (n : ℕ) (hn : n > 2) (hne : n ≠ 16) :
        ∃ x y z : ℕ, 0 < x ∧ 0 < y ∧ 0 < z ∧ x + y + z = n ∧
          x ∈ ({1, 2, 6} : Finset ℕ) ∧
          (x * y + 1).Prime ∧ (x * z + 1).Prime ∧ (y * z + 1).Prime
  context:
    - open OeisA229969
  definitions: []
