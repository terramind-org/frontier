title: Problem 7.3 — Compute L(Modg) explicitly for small g≥ 2.
field: mathematics
tier: prose
statement: Compute L(Modg) explicitly for small g≥ 2. In principle L(Modg) can be computed for any given g. The point is that one can first bound the degree of L(Modg), then give bounds on the smallest possible value λ(α), where α ranges over all algebraic integers of a fixed range of degrees, and λ(α) denotes the largest root of the minimal polynomial of α. One then finds all train tracks on Σ g, and starts to list out all pseudo-Anosovs. It is possible to give bounds for when the dilatations of these become large. Now one tries to match up the two lists just created, to find the minimal dilatation pseudo-Anosov on Σ g. Of course actually following out this procedure, even for small g, seems to be impracticable.
