title: Open Problems and Questions about Geodesics — Conjecture 31 (Burago-Kleiner)
field: mathematics
tier: prose
statement: |-
  Consider the product of a closed surface $M^2$ of genus $\ge 2$ with the circle $S$. Let $g$ be a Riemannian metric on $M\times S$ with no conjugate points.

  {\it The metric on the $\mathbb{Z}$-cover corresponding to $S^1$ factor is a direct product: $(M\times \mathbb{R}, g)=(M, g_1)\times (\mathbb{R}, dt^2)$. }
