title: Kalai–Sarkaria Algebraic-Shifting Conjecture
field: mathematics
tier: prose
statement: Let $K$ be a simplicial complex on $n$ vertices that embeds in the $(d-1)$-sphere. Its symmetric or exterior algebraic shifting should satisfy $\Delta(K)\subseteq\Delta(d,n)$, where $\Delta(d,n)$ is the symmetric shifting of the cyclic $d$-polytope on $n$ vertices.
