title: Gaussian Extremizers for Strichartz Inequalities
field: mathematics
tier: prose
statement: |-
  Do Gaussian functions extremize the Strichartz inequality
  $$
  \lVert u\rVert_{L^{2+4/d}(\mathbb R^{d+1})}\leq C\lVert f\rVert_{L^2(\mathbb R^d)}
  $$
  for solutions $u$ of the free Schrödinger equation in every dimension?
