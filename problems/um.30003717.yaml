title: Shortest Piecewise-Smooth Scaling–Rotation Curves
field: mathematics
tier: prose
statement: For symmetric positive-definite matrices $X$ and $Y$, does the scaling–rotation advantage persist when smooth curves are replaced by piecewise-smooth curves? Give algebraic criteria for the minimal piecewise-smooth scaling–rotation curves to be shortest among all such curves.
