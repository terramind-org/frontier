title: Kourovka Notebook Problem 17.90
field: mathematics
tier: prose
statement: |-
  (G. Baumslag). A group is *parafree* if it is residually nilpotent and has the same lower
  central quotients as a free group. Is it true that $H_2(G)=0$ for
  any finitely generated parafree group $G$?
