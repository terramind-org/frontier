title: The Lyapin's Notebook — Problem 9
field: mathematics
tier: prose
statement: |-
  (G. Mashevitzky)
  Is the set of finite finitely based completely 0-simple semigroups over Abelian groups, in particular, over a two-element group, recursive?\\
  An infinite chain of varieties, generated by completely 0-simple semigroups over the two-element group, in which finitely based and non-finitely based varieties alternate, was constructed in [M4].
