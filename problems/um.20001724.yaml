id: um.20001724
title: Convexity obstruction and a fat-Cantor geometric embedding
field: mathematics
tier: prose
statement: |-
  Can one identify a geometric example of a system for which the set of phase transitions has positive Lebesgue measure?

  It does not name a parameter or define “phase transition.” The immediately preceding problem 3.3 asks about the inverse-temperature family $\{q\varphi\}_{q\in\mathbb R}$ and the pressure of the geometric potential for a nonpositively curved surface. The best-supported reconstruction is therefore: for a geometrically defined system and a distinguished potential $\varphi$, can the exceptional set for $q\mapsto P(q\varphi)$ have positive one-dimensional Lebesgue measure?

  Four inequivalent exceptional sets must be separated:

  1. **first-order:** $P(q\varphi)$ is not differentiable;
  2. **analytic:** $P(q\varphi)$ is not real analytic in any neighborhood of $q$;
  3. **coexistence:** $q\varphi$ has multiple equilibrium states;
  4. **recurrence/existence:** an equilibrium state appears, disappears, or changes recurrence class.
