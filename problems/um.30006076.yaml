statement: For a hyperbolic curve $X/\mathbb Q$ and a prime $p$ of good reduction, do the refined Chabauty–Kim sets eventually equal the rational points; that is, is $X(\mathbb Q_p)_n=X(\mathbb Q)$ for all sufficiently large $n$?
