title: Exact cylinder pressure and explicit Hölder gap certificates
field: mathematics
tier: prose
statement: Let $S$ be a surface which has a flat cylinder of parallel periodic orbits. In Burns--Climenhaga--Fisher--Thompson (*Geom. Funct. Anal.* 28, 2018, MR3856792, on unique equilibrium states for geodesic flows in nonpositive curvature under the pressure-gap condition $P_{\mathrm{sing}}(\varphi) < P(\varphi)$), a criterion for the existence and uniqueness of equilibrium states includes a pressure gap, $P_{\operatorname{sing}}(\varphi)<P(\varphi)$. Can this be made explicit for the surface $S$?
