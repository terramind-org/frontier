id: um.20000670
title: A quantized gap for the Liouville Goldbach correlation
field: mathematics
tier: prose
statement: |-
  Show that
  \[
  \left|\sum_{1\le n<N}\lambda(n)\lambda(N-n)\right|<N-1.
  \]

  Here \(\lambda(n)=(-1)^{\Omega(n)}\) is the Liouville function. Write
  \[
  \mathcal L_\lambda(N):=\sum_{1\le n<N}\lambda(n)\lambda(N-n). \]

  Mangerel's published paper identifies it as AIM Problem 5.1 and records the intended reading as “for every sufficiently large \(N\).”  The natural domain used here is integers \(N\ge2\). This convention matters: at \(N=1\) the sum is empty and the asserted strict inequality would read \(0<0\).
