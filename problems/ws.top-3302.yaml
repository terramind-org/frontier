  \item[\hypertarget{source:statement:2}{S2}] Open Problem Garden, Universal highly arc transitive digraphs, node 677, original problem page. Original question and full discussion. \url{https://www.openproblemgarden.org/op/universal_highly_arc_transitive_digraphs}.
