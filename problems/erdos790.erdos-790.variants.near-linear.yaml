  decl: Erdos790.erdos_790.variants.near_linear
  statement: |-
    theorem erdos_790.variants.near_linear :
        ∀ ε : ℝ, 0 < ε → ∀ᶠ n : ℕ in atTop,
          (n : ℝ) ^ (1 - ε) ≤ (l n : ℝ)
