title: "Projection-body eigenbodies: exact planar classification and product formulas"
field: mathematics
tier: prose
statement: "**Problem 21 (W. Weil).** Let \\(\\Pi K\\) be the projection body of \\(K\\). It is known that if \\(K\\) is a polytope and \\(\\Pi\\Pi K\\) is homothetic to \\(K\\), then \\(K\\) is a direct sum of planar polygons (in even dimensions) or a direct sum of planar polygons and a segment (in odd dimensions). If \\(K\\) is an arbitrary convex body and \\(\\Pi\\Pi K\\) is homothetic to \\(K\\), what can we conclude about \\(K\\)?"
