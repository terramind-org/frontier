title: Diagram Folding and Structural Equivalence of Hopf Algebras
field: mathematics
tier: prose
statement: What does diagram folding of Nichols algebras represent under the associated representation-theoretic correspondence? If $H'$ is the maximal pointed Hopf subalgebra of a Hopf algebra $H$, does there exist a Hopf ideal $I$ such that $H=H'\oplus I$, and which algebraic and homological relations connect $H$ and $H'$? If two Hopf algebras have the same set of Frobenius–Schur indicator values, are their module categories gauge equivalent?
