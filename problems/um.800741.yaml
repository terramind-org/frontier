title: Banach Spaces and Ramsey Theory — Problem 4
field: mathematics
tier: prose
statement: |-
  *(Unique spreading model problem -- S. A. Argyros [AOST])*
  Let $X$ be a reflexive Banach space such that $|\mathrm{SP_w}(X)/\sim|=1$ (i.e. all
  normalized weakly null sequences in $X$ generate a unique spreading model
  up to equivalence). Is it true that the unique spreading model is equivalent
  to the standard unit vector basis of $c_0$ or $\ell_p$ for some
  $1\leqslant p<+\infty$?
