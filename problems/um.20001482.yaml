title: A Borel-categorical framework and an isotropy-loss lemma
field: mathematics
tier: prose
statement: |-
  What is the right set-theoretic framework to deal with functorial
  classification?

  Which measurable/categorical objects and comparison maps simultaneously
  record (i) the descriptive complexity of assigning invariants to coded
  objects and (ii) the action of an invariant on isomorphisms, or more general
  morphisms?
