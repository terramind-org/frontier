title: Hilbert-Square Zero Loci of Homogeneous Bundles
field: mathematics
tier: prose
statement: Let $V_{10}$ be a $10$-dimensional complex vector space, let $\sigma \in \bigwedge^3 V_{10}^*$ be a general $3$-form defining a Debarre--Voisin fourfold $Y_\sigma \subset G(6, V_{10})$ (the zero locus of the global section $\sigma$ of $\bigwedge^3 \mathcal{U}^*$), and let $S^{[2]}$ be the Hilbert square of a degree-$22$ K3 surface $S$. Find explicit sections $\sigma$ for which $Y_\sigma \cong S^{[2]}$, and find other globally generated homogeneous vector bundles on rational homogeneous varieties whose general zero locus is an irreducible holomorphic symplectic manifold.
