statement: |-
  \section*{Anticanonical nonvanishing from smooth semipositivity}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every smooth connected projective complex X, if $-K_X$ admits a smooth Hermitian metric with semipositive Chern curvature, must $H^{0}(X,-mK_X)\neq 0$ for some positive integer m?
  \subsection{Short English statement}
  For every smooth connected projective complex X, if $-K_X$ admits a smooth Hermitian metric with semipositive Chern curvature, must $H^{0}(X,-mK_X)\neq 0$ for some positive integer m?
