title: Weighted Yamabe Heat-Trace Comparison
field: mathematics
tier: prose
statement: Let $Y$ be the conformal Laplacian on the round sphere $S^n$, let $W>0$ be smooth with $\int_{S^n}W^{n/2}$ equal to the round-sphere volume, and set $Y_W=W^{-1/2}YW^{-1/2}$. For $n\geq3$, is $\max_{t>0}t^{n/2}\operatorname{Tr}(e^{-tY_W})\leq\max_{t>0}t^{n/2}\operatorname{Tr}(e^{-tY})$?
