title: Consistency Strength of Almost Effective Equivalence Reductions
field: mathematics
tier: prose
statement: What is the consistency strength of $E_{\omega_1}\leq_{a\Delta^1_1}F_{\omega_1}$? Does such an almost-$\Delta^1_1$ reduction imply the existence of a real whose admissibility spectrum is sufficiently sparse that its admissible ordinals are $L$-cardinals and $0^\#$ can be recovered?
