title: Sharp Group-Order Bounds from Small Brauer Degrees
field: mathematics
tier: prose
statement: Let $G$ be a finite group with $O_p(G)=1$ such that $\beta(1)_p\leq p$ for every irreducible $p$-Brauer character $\beta$. Is $\lvert G\rvert_2\leq2^7$ when $p=2$? Is $\lvert G\rvert_p\leq p^2$ when $p\geq5$, or when $p=3$ and $A_7$ is not involved in $G$? Is $\lvert G\rvert_3\leq3^3$ when $p=3$ and $A_7$ is involved in $G$?
