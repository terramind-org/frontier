title: Weak Compactness in HOD from Iterated Embeddings
field: mathematics
tier: prose
statement: Suppose $(V,j)\models\mathrm{ZF}$ and $j:V\to V$ is elementary. Form the iterates $M_0=(V,j)$ and $M_\alpha=(N_\alpha,j_\alpha)$ by setting $M_{\alpha+1}=(N_\alpha,j_\alpha(j_\alpha))$ and taking direct limits at limit ordinals. If $\lambda=\sup_{n<\omega}\sup(\operatorname{crit}(j^n))$, is $\lambda$ weakly compact in $\mathrm{HOD}$?
