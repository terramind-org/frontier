title: Square-Root-Scale Cancellation in Short Möbius Sums
field: mathematics
tier: prose
statement: Prove cancellation in $\sum_{x<n\leq x+y}\mu(n)$ for intervals of length $y$ at the square-root scale or below. A concrete range arising from the proposed fractional-moment bound is $\sqrt{x}/(\log\log x)^{1/4}\ll y\leq x^{1-\epsilon}$.
