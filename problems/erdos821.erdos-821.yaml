  module: FormalConjectures.ErdosProblems.«821»
  decl: Erdos821.erdos_821
  statement: |-
    theorem erdos_821 :
        ∀ ε > (0 : ℝ), { n : ℕ | (g n : ℝ) > (n : ℝ) ^ (1 - ε) }.Infinite
  context:
    - open Erdos821
    - open Nat Filter
  definitions:
    - name: Erdos821.g
      kind: def
      text: |-
        /--
        Let $g(n)$ count the number of $m$ such that $\phi(m)=n$.
        -/
        noncomputable def g (n : ℕ) : ℕ :=
          { m : ℕ | totient m = n }.ncard
