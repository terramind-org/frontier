title: Nonpositively Curved Cusped Manifolds from Tropical Curves
field: mathematics
tier: prose
statement: Given a tropical curve represented by $\Sigma^{(1)}\subset\Sigma_{\mathbb{P}^n}$, construct a nonpositively curved cusped manifold $L_{\Sigma^{(1)}}$ whose boundary is a union of $n+1$ real tori of dimension $n-1$.
