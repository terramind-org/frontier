title: Question I — s it true that any normal subgroup is commensurable with such a subgroup?
field: mathematics
tier: prose
statement: s it true that any normal subgroup is commensurable with such a subgroup? Recall that two subgroups Γ 1, Γ2 of a group G are commensurable if the intersection Γ 1∩ Γ2 has finite index in both Γ 1 and Γ 2. This problem was suggested by a discussion with H. Bass.
