title: Semidegree Thresholds for Directed Cycles
field: mathematics
tier: prose
statement: For each fixed positive integer $\ell$ divisible by 3, determine the minimum semidegree that forces every sufficiently large $n$-vertex oriented graph to contain a directed cycle of length $\ell$, without requiring the cycle to contain a prescribed vertex.
