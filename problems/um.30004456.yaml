title: $L^2$ Euler Characteristics and HNN Splittings
field: mathematics
tier: prose
statement: |-
  Let $G=F_n\rtimes_\alpha\mathbb Z$ be free-by-cyclic and let $\phi:G\to\mathbb Z$ be a character. Is

  $$-\chi^{(2)}(\ker\phi)=\min\{-\chi(A):G=A*_{B}\text{ is an HNN splitting inducing }\phi,\ A,B\text{ finitely generated}\}$$?
