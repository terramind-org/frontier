lean:
  module: FormalConjectures.ErdosProblems.«287»
  decl: Erdos287.erdos_287
  statement: |-
    theorem erdos_287 :
        ∀ (k : ℕ) (hk : 2 ≤ k) (s : Fin k → ℕ),
        StrictMono s → 1 < s ⟨0, by omega⟩ →
        ∑ i : Fin k, 1/ (s i : ℝ) = 1 →
        3 ≤ max_gap k s
  context:
    - open Erdos287
  definitions:
    - name: Erdos287.max_gap
      kind: def
      text: |-
        /-- The maximum gap between consecutive terms of a finite sequence `s : Fin k → ℕ`,
        i.e., $\max_{0 \le i < k-1} (s(i+1) - s(i))$. -/
        def max_gap (k : ℕ) (s : Fin k → ℕ ) : ℕ  :=
           Finset.sup Finset.univ (fun i : Fin (k - 1) =>
              s  ⟨i.val + 1, by omega⟩ - s ⟨i.val, by omega⟩)
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/ErdosProblems/287.lean#L31
