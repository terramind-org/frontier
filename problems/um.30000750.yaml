title: Reduced Length and Mahler-Measure Inequality
field: mathematics
tier: prose
statement: Let $L(R)$ be the sum of the absolute values of the coefficients of a real polynomial $R$, let $\ell(P)=\inf_{Q\in\mathbb{R}[x]\text{ monic}}L(PQ)$ be the reduced length, and let $M(P)$ be the Mahler measure. Is $\ell((x^2+tx+1)P(x))\geq2M(P)$ for every $t\in[-2,2]$ and every $P\in\mathbb{R}[x]$?
