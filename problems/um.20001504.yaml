statement: |-
  If a group $G$ is quasi-isometric to a free-by-cyclic group then is it true that $G$ is virtually free-by-cyclic?

  Suppose that $H$ is virtually RFRS and quasi-isometric to a free-by-cyclic group $G$. Then H is virtually free-by-cyclic.
