  decl: OeisA70518.conjecture
  statement: |-
    theorem conjecture :
        conjecture.answer =
          if h : ∃ n, 28341 < n ∧ ¬ Squarefree (a n) then
            some (sInf {n | 28341 < n ∧ ¬ Squarefree (a n)})
