lean:
  module: FormalConjectures.OEIS.«70518»
  decl: OeisA70518.conjecture
  statement: |-
    theorem conjecture :
        conjecture.answer =
          if h : ∃ n, 28341 < n ∧ ¬ Squarefree (a n) then
            some (sInf {n | 28341 < n ∧ ¬ Squarefree (a n)})
          else
            none
  context:
    - open OeisA70518
    - open Polynomial
    - open scoped Classical
  definitions:
    - name: OeisA70518.a
      kind: def
      text: |-
        /-- Value of the $n$-th cyclotomic polynomial at $n$. -/
        noncomputable def a (n : ℕ) : ℕ :=
          ((cyclotomic n ℤ).eval (n : ℤ)).natAbs
