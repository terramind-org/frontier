title: Linearization of Markov Inverse Problems on Networks
field: mathematics
tier: prose
statement: Characterize multiterminal directed networks with known topology whose unknown one-step Markov transition probabilities can be recovered from the zeroth and first moments of boundary input-output travel times by analytically reducing the nonlinear inverse equations to a linear system and solving up to the natural gauge freedom.
