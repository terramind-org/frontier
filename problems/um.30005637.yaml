title: Fields of Definition under Gluing of Hurwitz Components
field: mathematics
tier: prose
statement: In the arithmetic geometry of Hurwitz spaces parametrizing branched covers of curves with fixed monodromy group and conjugacy classes, let $K$ be a number field over which two irreducible components of Hurwitz spaces are defined. Are the irreducible components of higher-degree Hurwitz spaces obtained by topological gluing of components defined over $K$ themselves defined over $K$ (Seguin)?
