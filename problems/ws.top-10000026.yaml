statement: |-
  \section{Linear finite models for locally finite transitive graphs}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For an infinite locally finite vertex-transitive graph $G$, let
  \[m_G(r)=\inf\{\operatorname{diam}(H):H\text{ is finite, connected, vertex-transitive and }B_H(v,r)\cong B_G(o,r)\},\]
  where the infimum of an empty set is $+\infty$ and balls are induced rooted graphs for unit-edge distance. Vertex-transitive means its automorphism group is transitive on vertices. The source calls $G$ $f(r)$-sofic when $m_G(r)=f(r)<\infty$ for every positive integer $r$.
  \paragraph{Statement recorded in the supplied source.}
  If $m_G(r)<\infty$ for every $r$, must $m_G(r)\le cr$ for some constant $c=c(G)<\infty$? More uniformly, for each degree $d$, is there $c(d)<\infty$ such that every radius-$r$ rooted ball occurring in a finite $d$-regular vertex-transitive graph occurs in one of diameter at most $c(d)r$? Determine the smallest possible constants $c(d)$. \sref{statement}{2}
  \subsection{Short English statement}
  Are finite transitive models of a local neighborhood always available with diameter at most a constant times its radius?
