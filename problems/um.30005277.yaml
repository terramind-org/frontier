title: Zero–One Laws in Simultaneous Diophantine Approximation
field: mathematics
tier: prose
statement: Let $f:\mathbb R^d\to\mathbb R^m$, put $n=d+m$ and $\alpha_{d+j}=f_j(\alpha_1,\ldots,\alpha_d)$, and let $A(h)$ consist of points admitting denominators $q_j\leq h$ with $\|q_j\alpha_j\|\leq\psi(h)$. Under suitable nondegeneracy assumptions on $f$, prove that the limsup $A^*$ has measure zero or full measure according as $\sum_{h=1}^\infty h^{n-1}\psi(h)$ converges or diverges.
