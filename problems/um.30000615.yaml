title: Logical Phase Transitions for Graph-Minor Principles
field: mathematics
tier: prose
statement: For $f_r(i)=r\sqrt{\log i}$, let $\mathrm{GM}_{f_r}$ assert that every sufficiently long sequence of simple graphs $G_i$ with $|G_i|<K+f_r(i)$ contains $i<j$ such that $G_i$ is a minor of $G_j$. Is $\mathrm{GM}_{f_r}$ provable in $\mathrm I\Delta_0+\exp$ for $r\leq2$ and unprovable in PA for $r>2$?
