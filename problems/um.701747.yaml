title: Kourovka Notebook Problem 20.89
field: mathematics
tier: prose
statement: |-
  An element $g$ of a group $G$ is said to be *almost Engel* if there is a finite subset $E(g)$ of $G$ such that for every $x\in G$ all sufficiently long commutators $[...[[x, g], g], \dots , g]$ belong to $E(g)$, that is,
  there is a positive integer $n(x, g)$ such that $[...[[x, g], g], \dots ,g]\in E(g)$ if $g$ is repeated ${}\geq n(x, g)$ times. An element $g$ is Engel if we can take $E(g)=\{1\}$. The set of Engel elements of a linear group is a subgroup by a well-known result of Gruenberg (*J. Algebra*, **3** (1966), 291--303). Is the set of almost Engel elements of a linear group a subgroup?

  A linear group in which all elements are almost Engel is finite-by-hypercentral (P. Shumyatsky, *Monatsh. Math.*, **186** (2018), 711--719).
