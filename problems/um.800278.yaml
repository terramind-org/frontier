title: Several Complex Variables Problem List — Problem 78
field: mathematics
tier: prose
statement: |-
  Consider the following statement: `` Let Y be a compact subset of $\mathbb{C}^2$
  which lies over the circle $|\lambda|= 1$, and let U be an open
  neighborhood of K, the polynomially convex hull of Y. Then there exists a finitely
  sheeted Riemann surface S lying over $|\lambda| < 1$ as a branched covering such
  that $S\subset U$.'' Is this statement true for every choice of Y and U?\\
  -H. Alexander, u22330@uicvm.bitnet and J. Wermer, Brown University.
