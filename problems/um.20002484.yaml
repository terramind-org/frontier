id: um.20002484
title: Intermediate-dimensional minimizing currents and a flat-torus obstruction
field: mathematics
tier: prose
statement: |-
  Let \(M^n\) be a compact Riemannian manifold and let \(C_qM\) be the
  set of closed \(q\)-currents
  \[
  C_qM=\{T\in(\Omega^q(M))^*:T(d\alpha)=0\text{ for all }
  \alpha\in\Omega^{q-1}(M)\}.
  \]
  A closed current determines \([T]\in H_q(M,\mathbb R)\) and has a
  mass. Every real homology class has a mass-minimizing representative.
  For \(q=1\), supports of minimizers consist of minimal geodesics; for
  \(q=n-1\), minimizers are measured laminations by minimizing
  hypersurfaces, possibly with singularities. What can be said for
  \(1<q<n-1\)?
