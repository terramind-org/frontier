title: Eigenvalue Motion under Ginibre Perturbations
field: mathematics
tier: prose
statement: |-
  Let $M_N$ and $M_N'$ be independent complex Ginibre matrices and set
  $$
  M_N(\theta)=\cos\theta\,M_N+\sin\theta\,M_N'.
  $$
  How do the eigenvalues $\lambda_i(\theta)$ vary with $\theta$?
