title: Sharp Thresholds in Bootstrap Percolation
field: mathematics
tier: prose
statement: For bootstrap percolation on a growing sequence of finite graphs $G_n$, let $p_\varepsilon(n)=\inf\{p:\mathbb P(G_n,p)>\varepsilon\}$. Does $p_{1-\varepsilon}(n)-p_\varepsilon(n)\to0$, and in particular does $p_{1-\varepsilon}(n)/p_\varepsilon(n)\to1$ as $n\to\infty$ for every $\varepsilon>0$?
