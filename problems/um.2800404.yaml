statement: "Part (3) of the problem: Let $s\\leq d\\leq m$ and $z_1,\\dots,z_m\\in \\mathbb{R}^d$ i.i.d. random vectors with i.i.d. entries $\\left( z_k\\right)_j = \\left\\{ \\begin{array}{rcc} -\\frac1{\\sqrt{s}} & \\text{ with probability } & \\frac{s}{2m} \\\\ 0 & \\text{ with probability } & 1-\\frac{s}{m} \\\\ \\frac1{\\sqrt{s}} & \\text{ with probability } & \\frac{s}{2m} \\end{array} \\right.$ Note that $\\mathbb{E} z_kz_k^T = \\frac1m I_{d\\times d}.$ The conjecture is that, there exists $c_1$ and $c_2$ positive universal constants such that $\\mathrm{Prob}\\left\\{ \\left\\| \\sum_{k=1}^m \\left[z_k z_k^T - \\mathbb{E} z_k z_k^T\\right] \\right\\| \\geq \\varepsilon \\right\\} < \\delta,$ for $m\\geq c_1 \\frac{d+\\log\\left( \\frac1{\\delta} \\right)}{\\varepsilon^2}$ and $s\\geq c_2 \\frac{\\log\\left( \\frac{d}{\\delta} \\right)}{\\varepsilon^2}$."
