title: Mouse-Set Property Without a Cone Restriction
field: mathematics
tier: prose
statement: Assume $\mathrm{ZF}+\mathrm{AD}+V=L(\mathbb R)$. Let $[\alpha,\gamma]$ be a weak $\Sigma_1$ gap, or let $\gamma=\beta+1$ for a strong gap $[\alpha,\beta]$, and let $e$ be least such that $\rho_{e+1}^{J_\gamma(\mathbb R)}=\mathbb R$. Is $\mathrm{OD}^{*\mathbb R}_{\gamma,e+2}$ a mouse set without restricting to a cone of reals; that is, does it equal $\mathbb R\cap M$ for some mouse $M$?
