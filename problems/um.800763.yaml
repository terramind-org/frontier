title: Open Problems in the Theory of Ample Fields — Question 6
field: mathematics
tier: prose
statement: |-
  A field $K$ is called **radically closed** if the multiplicative group $K^\times$ is divisible.
  Any radically closed field contains all roots of unity and hence, by Kummer theory, has no solvable finite Galois extensions.
  One would like to know the following:

  Is every radically closed field ample?
