id: um.20002869
title: "Fixed harmonic parts: exact low-degree breakpoints and a deformation criterion"
field: mathematics
tier: prose
statement: |-
  Let \(S(z,\bar z)\) be a harmonic Hermitian polynomial of bidegree \((d,d)\) on \(\mathbb C^n\). For a given \(k\), how many Hermitian polynomials \(A(z,\bar z)\) of bidegree \((d-1,d-1)\) exist such that
  \[
  S(z,\bar z)+A(z,\bar z)\|z\|^2
    =\sum_{j=1}^{k}|f_j(z)|^2?
  \]
  Which properties of \(S\) determine this number?

  If \(S=0\) and \(k<n\), the only solution is \(A=0\), by a lemma of Huang. If \(S\) is arbitrary and \(k<n/2\), there is at most one solution.
