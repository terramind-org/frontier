  \section{Long-time existence and behavior of the Calabi flow}\label{20002434}
  {\small UnsolvedMath ID 20002434 · Partial Differential Equations}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  What is the behavior of $g_{j \overline k}(t)$ solving the Calabi flow,
  \[\frac \partial {\partial t} g_{j \overline k} = \partial_j \partial_{\overline k} R?\]
  Can long time existence be established for toric surfaces?
  \par\smallskip\textit{Formulation references:} \sref{20002434}{1}, \sref{20002434}{2}.
  \subsection{Short English statement}
