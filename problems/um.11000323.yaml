title: Problem 11.2 — Study the central extension (20) from the point of view of group cohomology as well as geometric topology.
field: mathematics
tier: prose
statement: "Study the central extension (20) from the point of view of group cohomology as well as geometric topology. In particular determine the Euler class of this central extension which is an element of the group H 2(Hg,1; Θ 3 Z)∼= Hom(H2(Hg,1), Θ3 Z)⊕ ExtZ(H1(Hg,1), Θ3 Z). This should be an extremely diﬃcult problem. Here we would like to indicate a possible method of attacking it, and in particular a possible way of obtaining additive invariants for the group Θ 3 Z, very briefly. Details will be given in a forthcoming paper. 372 S. Morita Using the traces, we can define a series of certain cohomology classes ˜t2k+1∈H 2(lim←−Aut0(Γ/Γm)) ( k = 1, 2,··· ). These are the “group version” of the elements t2k+1 ∈ H 2(hQ g,1)Sp defined in §6 (Definition 6.1). The homomorphism σ is trivial on Θ 3 Z so that we have the induced homomorphism ¯ σ: Hg,1→ lim←−Aut0(Γ/Γm)."
