title: Characterization of Graphical Apiculate and Generalized Median Algebras
field: mathematics
tier: prose
statement: A ternary algebra is called apiculate if it is the apex algebra of an apiculate graph, and graphical if it and all of its subalgebras are apiculate algebras. Characterize the apiculate graphs whose apex algebras are graphical. Likewise, characterize the generalized median graphs whose generalized median algebras are graphical.
