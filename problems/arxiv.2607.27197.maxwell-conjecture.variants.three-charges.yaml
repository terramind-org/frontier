lean:
  module: FormalConjectures.Arxiv.«2607.27197».MaxwellConjecture
  decl: Arxiv.«2607.27197».maxwell_conjecture.variants.three_charges
  statement: |-
    theorem maxwell_conjecture.variants.three_charges :
        ∀ (q : Fin 3 → ℝ) (a : Fin 3 → EuclideanSpace ℝ (Fin 3)), Function.Injective a →
          (∀ j, q j ≠ 0) →
          (∀ x ∈ equilibria q a, HasNondegenerateHessianAt (potential q a) x) →
          (equilibria q a).encard ≤ 4
  context:
    - open Arxiv
    - open Arxiv.«2607.27197»
    - open Arxiv.«2607.27197».maxwell_conjecture
    - open Arxiv.«2607.27197».maxwell_conjecture.variants
    - open scoped Gradient
  definitions:
    - name: Arxiv.«2607.27197».potential
      kind: def
      text: |-
        /-- The Coulomb potential $V(x) = \sum_j q_j / \|x - a_j\|$ generated by $n$ point charges of
        strengths $q_j$ located at the points $a_j$ of Euclidean $3$-space. It is genuinely defined
        away from the charge locations $a_j$. -/
        noncomputable def potential {n : ℕ} (q : Fin n → ℝ) (a : Fin n → EuclideanSpace ℝ (Fin 3)) :
            EuclideanSpace ℝ (Fin 3) → ℝ :=
          fun x => ∑ j, q j / dist x (a j)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Arxiv/2607.27197/MaxwellConjecture.lean#L50
    - name: Arxiv.«2607.27197».HasNondegenerateHessianAt
      kind: def
      text: |-
        /-- The Hessian of $V$ at $x$ is non-singular, i.e. the symmetric bilinear form
        $(v, w) \mapsto D^2V(x)[v, w]$ is non-degenerate. -/
        def HasNondegenerateHessianAt (V : EuclideanSpace ℝ (Fin 3) → ℝ)
            (x : EuclideanSpace ℝ (Fin 3)) : Prop :=
          ∀ v ≠ 0, ∃ w, iteratedFDeriv ℝ 2 V x ![v, w] ≠ 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Arxiv/2607.27197/MaxwellConjecture.lean#L57
    - name: Arxiv.«2607.27197».equilibria
      kind: def
      text: |-
        /-- The equilibria of the field of $n$ point charges: the points where the electric field
        $-\nabla V$ vanishes, i.e. the critical points of the potential $V$, away from the charges
        themselves. -/
        def equilibria {n : ℕ} (q : Fin n → ℝ) (a : Fin n → EuclideanSpace ℝ (Fin 3)) :
            Set (EuclideanSpace ℝ (Fin 3)) :=
          {x | x ∉ Set.range a ∧ ∇ (potential q a) x = 0}
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Arxiv/2607.27197/MaxwellConjecture.lean#L63
