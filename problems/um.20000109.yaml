id: um.20000109
title: Expected dimension and Frobenius defects for rational curves on hypersurfaces
field: mathematics
tier: prose
statement: |-
  Let \(k\) be an algebraically closed field of characteristic \(p>0\),
  let \(X=X_d\subset\mathbb P^n_k\) be a smooth degree-\(d\)
  hypersurface, and fix
  \(e=\deg f^*\mathcal O_X(1)\). Determine the dimensions of
  \(\operatorname{Hom}_e(\mathbb P^1,X)\),
  \(\overline{\mathcal M}_{0,0}(X,e)\), and, where relevant, the
  Hilbert locus of embedded smooth rational curves. Determine which
  characteristic-zero arguments survive.
