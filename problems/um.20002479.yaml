title: Generic Mather measures, periodic support, and rational locking flats
field: mathematics
tier: prose
statement: |-
  Mañé proved that for a generic positive definite Lagrangian
  \(L:TM\times\mathbb T\to\mathbb R\) and generic
  \(c\in H^1(M,\mathbb R)\), the minimizing measure in the Mather set
  \(\mathcal M_c\) is unique. For generic \(L\) and \(c\), is this unique
  minimizing measure supported on a periodic orbit? Jeff Xia conjectured
  that, for generic \(L\) and every \(c\in H^1(M,\mathbb R)\), the number
  of ergodic invariant measures in \(\mathcal M_c\) is finite.
