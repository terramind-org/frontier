witness:
  verifier: superperm
  params:
    n: 7
  objective: minimize
  best_known:
    value: 5905
    reference:
      label: Superpermutators group post by Andrei Teodorescu, 2026-08-17
      url: https://groups.google.com/g/superpermutators/c/D5sKkV2jBuc
    note: 'Wikipedia (read 2026-10-19): "On 17 August 2026, Andrei Teodorescu further improved n = 7 to length 5905, reducing the previous upper bound by one"; the previous 5906 is Egan and Houston, 27 February 2019. The group thread itself was not opened; four 5905-character attachments from it were downloaded and each checked exactly. Higher lower bounds than 5884 are claimed in a third-party README and were not verified. The record is moving, so re-read the group before an attempt.'
  format: 'A JSON object {"word": "..."}: a string of the digits 1..7 only, without spaces or newline. Valid when all 5040 orderings of the digits 1..7 occur as 7 consecutive characters. The value is the number of characters (at most 2000000).'
added: 2026-10-19
