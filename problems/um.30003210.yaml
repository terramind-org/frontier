title: Sublinear Generator Growth of Higher-Rank Lattices
field: mathematics
tier: prose
statement: Let $G$ be a higher-rank simple Lie group and $(M_i)$ a sequence of lattices in $G$ with unbounded covolume. Is $\lim_{i\to\infty}(d(M_i)-1)/\operatorname{vol}(G/M_i)=0$?
