title: Research Problems in Function Theory — Problem 1.40
field: mathematics
tier: prose
statement: Let $f$ be a function meromorphic in $\mathbb{D}$ of finite order $\rho$. Shea and Sons have shown that \[\sum_{a\neq\infty}\delta(a,f)\leq\delta(0,f')\big(1+k(f)\big)+\frac{2}{\lambda}(\rho+1),\] where \[k(f)=\limsup_{r\to1}\frac{\overline{N}(r,\infty,f)}{T(r,f)+1}\hspace{1cm}\text{ and }\hspace{1cm}\lambda(f)=\liminf_{r\to\infty}\frac{T(r,f)}{\log(1/(1-r))}.\] Can the factor $2$ be eliminated? (If so, the result is then best possible). (L. R. Sons)
