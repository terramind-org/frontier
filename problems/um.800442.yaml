title: Analysis of Boolean Functions — Noise Sensitivity of Intersections of Halfspaces
field: computer-science
tier: prose
statement: Let $f \colon \{-1,1\}^n \to \{-1,1\}$ be the intersection (AND) of $k$ linear threshold functions. Then $\NS_\delta[f] \leq O(\sqrt{\log k}) \cdot \sqrt{\delta}$.
