title: Intrinsic Diophantine Exponents of Submanifolds
field: mathematics
tier: prose
statement: |-
  For a nondegenerate $k$-dimensional submanifold $M\subset\mathbb R^d$, define
  $$
  \omega(M)=\inf_{x\in M}\limsup_{p/q\in M}\frac{-\log|x-p/q|}{\log q},
  $$
  and let $\omega(k,d)$ be the supremum over such $M$. Can the available upper bound be improved, can $\omega(k,d)$ be computed exactly for more pairs $(k,d)$, and does the essential-infimum variant $\omega'(k,d)$ equal $\omega(k,d)$?
