schema: 1
id: koethe.kotherconjecture.variants.two-by-two-matrix
title: "Köthe conjecture (variant: two_by_two_matrix)"
field: mathematics
tier: proof
statement: |-
  The **Köthe conjecture**: for any nil ideal `I` of `R`, the matrix ideal `M_2(I)` is a nil ideal
  of the matrix ring `M_2(R)`.
ams:
