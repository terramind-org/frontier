lean:
  module: FormalConjectures.Wikipedia.Koethe
  decl: Koethe.KotherConjecture.variants.two_by_two_matrix
  statement: |-
    theorem KotherConjecture.variants.two_by_two_matrix {I : TwoSidedIdeal R} (hI : IsNil I) :
        IsNil (matrix (Fin 2) I)
  context:
    - open Koethe
    - open Koethe.KotherConjecture
    - open Koethe.KotherConjecture.variants
    - open Ideal TwoSidedIdeal Polynomial
    - open Matrix
    - "variable {R : Type*}"
    - variable [Ring R]
    - local notation "Nil* " R => KotheRadical R
  definitions:
    - name: Koethe.IsNil
      kind: def
      text: |-
        /-- Say a subset `I` of a ring `R` is nilpotent if all its elements are nilpotent. -/
        def IsNil {S : Type*} [SetLike S R] (I : S) := ∀ i ∈ I, IsNilpotent i
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/Koethe.lean#L40
