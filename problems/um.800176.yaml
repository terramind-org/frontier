title: Moments of L-functions — Moments of the Riemann zeta function — Problem 27
field: mathematics
tier: prose
statement: |-
  Chandee and Soundararajan [CS] proved that the Riemann Hypothesis implies
  \[
  |\zeta(\tfrac{1}{2}+it)|
  \ll \exp \left( (C_0 +o(1)) \frac{\log t}{\log \log t} \right)
  \]
  with $C_0 = \frac{\log 2}{2}= 0.1505 \ldots $. Reduce the value of $C_0$. \\
  (N. Ng, Lethbridge)
