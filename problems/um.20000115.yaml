title: A separable odd-degree parametrization of the characteristic-2 Fermat cubic
field: mathematics
tier: prose
statement: |-
  For an algebraically closed field \(k\) of characteristic \(p>0\), does there
  exist a smooth cubic threefold \(X\subset \mathbf P^4_k\) admitting a dominant
  rational map \(\mathbf P^3_k\dashrightarrow X\) of odd total degree?
