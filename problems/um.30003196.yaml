title: Jump Loci for Motivic Complexity in Families
field: mathematics
tier: prose
statement: Given a smooth morphism $f$ from $X$ to $S$ of quasi-projective varieties, can one describe the locus of points $s\in S$ where the motive of the fiber $X_s$ is simpler than that of a very general fiber, in the sense that $X_s$ and its powers contain more algebraic cycles?
