title: Principality of Artin–Schreier Deformation Ideals
field: mathematics
tier: prose
statement: Let $\pi:C\to\mathbb{P}^1$ be a wildly ramified Artin–Schreier cover with a single branch point at infinity, and let $R_\pi$ be its universal deformation ring. When $p=3$, one has $R_\pi=R_\infty=W[[t_1,t_2]]/I$ with $I\neq0$. Is $I$ principal?
