title: Splitting Schemes for Rough Stochastic Heat Equations
field: mathematics
tier: prose
statement: For the fully discrete Lie-Trotter scheme applied to $\partial_tu=\partial_{xx}u+g(u)\dot W$ on $[0,1]$ with homogeneous Dirichlet data, extend positivity and mean-square convergence of order $1/4$ to rougher nonlinearities $g$, and determine a weak convergence rate.
