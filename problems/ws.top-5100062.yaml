  \section{Elliptic-billiard invariant $k_{903,a}$}\label{5100062}
  {\small\sffamily UnsolvedMath ID 5100062 · Dynamical Systems}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Fix $a>b>0$ and the ellipse $E:x^2/a^2+y^2/b^2=1$, with foci $f_1,f_2$. Fix an inner confocal elliptic caustic $C$ admitting a Poncelet family of $N$-periodic billiard polygons $P=(P_i)_{i=1}^N$: vertices lie on $E$, sides are tangent to $C$, and consecutive sides satisfy the billiard reflection law. Indices are cyclic and polygons retain their cyclic order. The family and its caustic stay fixed while the starting vertex varies. All areas are signed: for $W=(W_i)$,
  \[\mathcal A(W)=\frac12\sum_{i=1}^N(x_i y_{i+1}-x_{i+1}y_i),\qquad W_i=(x_i,y_i).\]
  Write $A=\mathcal A(P)$. Unit-circle inversion about $F$ is $I_F(X)=F+(X-F)/\lVert X-F\rVert^2$; set $P_j^\dagger=(I_{f_j}(P_i))$ and $A_j^\dagger=\mathcal A(P_j^\dagger)$, for $j=1,2$. Quotients are considered where their denominators and the polygon constructions are defined.
  \paragraph{Statement recorded in the supplied source.}
  Prove that, for odd $N$, the quantity $A_1^\dagger A_2^\dagger$ is constant as $P$ varies through the family. \sref{5100062}{2}
  \subsection{Short English statement}
  Show that, for odd $N$, the quantity $A_1^\dagger A_2^\dagger$ is constant as $P$ varies through the family. The constant may depend on the fixed ellipse and caustic. These are the experimentally recorded assertions of the cited 2020 version.
  \subsection{Sources}
