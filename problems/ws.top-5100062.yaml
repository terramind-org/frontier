  \item[\hypertarget{source:5100062:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 5100062 (AMR-050-0062). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:5100062:2}{S2}] Dan Reznik, Ronaldo Garcia and Jair Koiller, \emph{Eighty New Invariants in the Elliptic Billiard}, arXiv:2004.12497v11 (29 October 2020), Section 2 and Section 3.9, Table 10, row $k_{903,a}$, pp. 3, 9--12. \url{https://arxiv.org/abs/2004.12497v11}.
  \end{description}
