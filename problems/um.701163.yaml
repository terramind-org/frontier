statement: |-
  b) Consider the sequence $u_1 = [x,y],\ldots$, $ u_{n+1} =
  [[u_n, x],[u_n,y]]$. Is it true that an arbitrary finite group is
  soluble if and only if it satisfies one of these identities $u_n =
  1$?

