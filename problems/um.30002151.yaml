statement: For a number field $k$ and a smooth, geometrically connected curve $X$ over $k$ with nonabelian geometric fundamental group, is the map from $X(k)$ to conjugacy classes of sections of the fundamental-group exact sequence a bijection onto the noncuspidal sections?
