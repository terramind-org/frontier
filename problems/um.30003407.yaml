title: Candidate Inner Models for HOD Under Determinacy
field: mathematics
tier: prose
statement: Assume $\Delta^1_3$-determinacy. Let $N$ be the iterate arising from the directed system of suitable premice, let $\delta^N$ be its Woodin cardinal, and let $\pi^*$ be the induced cofinal map. For a cone of reals $x$, is $$L[N\mid\delta^N,\pi^*]\equiv\operatorname{HOD}^{L[x]}$$?
