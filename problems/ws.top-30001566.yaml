statement: |-
  \section{Fundamental-Domain Choice in Symmetric Integer Programming}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A symmetry group acts on feasible points by transformations preserving the optimization problem. A fundamental domain selects representatives of its orbits. Branching in integer optimization partitions a feasible region into subproblems using an integrality disjunction.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The source does not define a performance objective or a mathematical comparison between fundamental domains.

  Source-record limitation: A qualitative branching-efficiency comparison is requested without a mathematical criterion.
  \paragraph{Statement recorded in the supplied source.}
  In symmetry-aware linear or integer programming, does the choice among multiple minimal fundamental domains affect the results or efficiency, especially when a variable is a good symmetry-based branching candidate but a poor integer-programming branching candidate? \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Understand whether the selected symmetry representatives improve or hinder branching.
