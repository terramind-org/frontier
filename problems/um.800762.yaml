title: Open Problems in the Theory of Ample Fields — Question 5
field: mathematics
tier: prose
statement: |-
  Trivially, every ample field is virtually ample, and every virtually ample field is weakly ample.
  One could think that every virtually ample field should be ample,
  but no proof is known.
  As evidence one usually refers to the fact that similar descent properties hold for
  Henselian valued fields.
  We want to ask more generally:

  What is the relation between ample, virtually ample, and weakly ample fields?
  Is every weakly ample field virtually ample? Is every virtually ample field ample?
