title: Theoretical Certification of Crossing-Number Optimality
field: mathematics
tier: prose
statement: Let $D$ be a touching-free drawing of a simple graph $G$ in which two edges cross at most once and adjacent edges do not cross. For which graphs can one prove theoretically, rather than by exhaustive search, that for every choice of sets $A_e\subseteq V(G)\setminus e$, the number of crossing nonadjacent pairs with $|e\cap A_f|+|f\cap A_e|$ odd does not exceed the corresponding number of noncrossing pairs, and hence that $D$ realizes $\operatorname{cr}(G)$?
