title: Muckenhoupt Thresholds for Integer-Translate Schauder Bases
field: mathematics
tier: prose
statement: |-
  Let $\psi\in L^2(\mathbb R)$, let $B_\psi=\{\psi(\cdot-k):k\in\mathbb Z\}$ be a Schauder basis for its closed linear span, and set

  $$p_\psi(\xi)=\sum_{k\in\mathbb Z}|\widehat\psi(\xi+k)|^2,\qquad q_\psi=\inf\{p>1:p_\psi\text{ is an }A_p\text{-weight}\}.$$

  For each $q$ with $1\leq q<2$, which properties of $B_\psi$ characterize the equality $q_\psi=q$?
