title: Scattering for the Quintic Resonant System
field: mathematics
tier: prose
statement: |-
  For a sequence $\vec u=(u_j)_{j\in\mathbb Z^2}$ governed by the quintic resonant system

  $$i\partial_tu_j+\partial_{xx}u_j=\sum_{(j_1,\ldots,j_5)\in\mathcal R(j)}u_{j_1}\overline{u}_{j_2}u_{j_3}\overline{u}_{j_4}u_{j_5},$$

  where

  $$\mathcal R(j)=\left\{(j_1,\ldots,j_5)\in(\mathbb Z^2)^5:\ j_1-j_2+j_3-j_4+j_5=j,\ |j_1|^2-|j_2|^2+|j_3|^2-|j_4|^2+|j_5|^2=|j|^2\right\},$$

  define

  $$E_{\mathrm{ls}}(\vec u)=\frac12\sum_{j\in\mathbb Z^2}\langle j\rangle^2\lVert u_j\rVert_{L^2(\mathbb R)}^2.$$

  For every $E>0$ and every smooth initial datum with $E_{\mathrm{ls}}(\vec u_0)\leq E$, does there exist a global solution conserving $E_{\mathrm{ls}}$ that scatters as $t\to\pm\infty$?
