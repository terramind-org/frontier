title: Weak approximation for finite quotients with a controlled auxiliary branch point
field: mathematics
tier: prose
statement: "**Question 35 (recovered).** Study weak approximation over \\(L\\). It was known for a connected linear algebraic group. For a homogeneous space \\(G/H\\), it was suggested that the same method should work when \\(H\\) is connected. In particular, decide whether weak approximation holds for \\(\\mathrm{GL}_n/G\\) when \\(G\\) is a finite subgroup of \\(\\mathrm{GL}_n\\). A further claim attributed to de Jong was that every smooth projective geometrically rationally connected \\(L\\)-variety satisfies weak approximation, although this was not in the de Jong--Starr paper. Finally, an Enriques surface over \\(\\mathbb C(t)\\) with a rational point but without weak approximation was mentioned."
