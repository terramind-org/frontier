title: Free-Group Word-Measure Conjecture
field: mathematics
tier: prose
statement: Let $F$ be a nonabelian free group of finite rank, and let $w,w'\in F$. If $w$ and $w'$ induce the same word measure on every finite group, prove that some $\varphi\in\operatorname{Aut}(F)$ satisfies $\varphi(w)=w'$.
