title: Isomorphism and Torsion-Unit Problems for Group Algebras
field: mathematics
tier: prose
statement: If $G$ is a finite $p$-group whose group algebra $kG$ has $G$ as a complement factor in its unit group and $kG\cong kH$ as $k$-algebras, must $G\cong H$? For $G=\operatorname{GL}_n(k)$ over a finite field, is the partial augmentation $\varepsilon_{\pi(u)}(u)$ nonzero for every torsion unit $u\in V(\mathbb{Z}G)$? Finally, if the torsion units $u_p$ constructed from central primitive idempotents of localized cyclotomic group algebras are mutually conjugate by units of $\mathbb{C}G$, must one, and hence every, $u_p$ be conjugate to an element of $G$ by a unit of $\mathbb{C}G$?
