title: Open Problems and Questions about Geodesics — Question 8 (Paternain)
field: mathematics
tier: prose
statement: |-
  Let $p, q$ be points in a Riemannian manifold. The space $\Omega_T(p,q)$ of paths from $p$ to $q$ with length $\leq T$ has the homotopy type of a finite complex (see e.g.\ [Milnor1963]),
  and hence the sum of its Betti numbers is finite for each $T$. The same is true for the space $\Lambda_TM$ of loops with length at most $T$.

  *How do the sums of the Betti numbers for $\Lambda_TM$ and $\Omega(_T(p,q)$ grow as $T\to \infty$? Does the growth depend on the metric?*
