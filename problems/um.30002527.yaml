title: Generic Simplicity of Hyperbolic Dirichlet Tilings
field: mathematics
tier: prose
statement: Let $\Gamma<\operatorname{PO}(3,1)$ be discrete and torsion-free. For a generic base point $x\in\mathbb H^3$, is its Dirichlet tiling $D_x$ simple, with exactly three facets meeting along every edge and exactly four facets meeting at every vertex?
