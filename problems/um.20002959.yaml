id: um.20002959
title: Compression-body quotients and a classical boundary-support obstruction
field: mathematics
tier: prose
statement: |-
  Given a left module \(N\) over the Kauffman bracket skein algebra
  \(\mathscr A(\Sigma)=\mathscr S(\Sigma\times I)\), find necessary and
  sufficient conditions for the existence of a compact oriented 3-manifold
  \(M\), with a parametrized boundary component \(f:\Sigma\to\partial M\),
  such that \(N\cong\mathscr S(M)\) and the module action is induced by a
  collar of \(f(\Sigma)\).
