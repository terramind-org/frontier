statement: |-
  \section*{The sharp one-dimensional finite-matrix Lieb–Thirring inequality}\label{30007234}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every finite matrix size m, every $1/2<\gamma <3/2$ and measurable nonnegative Hermitian W with integral $\operatorname{tr}(W^{\gamma +1/2})$ finite, is $\operatorname{Tr}(-d^2/dx^2-W)_-^\gamma $ bounded by $C_\gamma $ integral $\operatorname{tr}(W^{\gamma +1/2})$, where $C_\gamma =((\gamma -1/2)/(\gamma +1/2))^{\gamma -1/2}$ Gamma(gamma+1)/(sqrt(pi) Gamma(gamma+3/2)) is optimal?
  \subsection{Short English statement}
  For every finite matrix size m, every $1/2<\gamma <3/2$ and measurable nonnegative Hermitian W with integral $\operatorname{tr}(W^{\gamma +1/2})$ finite, is $\operatorname{Tr}(-d^2/dx^2-W)_-^\gamma $ bounded by $C_\gamma $ integral $\operatorname{tr}(W^{\gamma +1/2})$, where $C_\gamma =((\gamma -1/2)/(\gamma +1/2))^{\gamma -1/2}$ Gamma(gamma+1)/(sqrt(pi) Gamma(gamma+3/2)) is optimal?
