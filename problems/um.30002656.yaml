title: Economical Toroidal Resolutions of Log Canonical Pairs
field: mathematics
tier: prose
statement: For every $n>0$, does there exist $s=s(n)$ such that each $n$-dimensional log canonical pair $(X,\Delta)$ admits a projective birational morphism $\pi:Y\to X$ with the following properties? Writing $\Gamma=\widetilde\Delta+E$, the pair $(Y,\Gamma)$ is quotient-dlt near the generic point of every non-klt center, $\pi$ has at most $s$ exceptional divisors, and every exceptional divisor has log discrepancy zero.
