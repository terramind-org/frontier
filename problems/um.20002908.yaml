title: The LLT/generalized-Kostka bridge and its limits
field: mathematics
tier: prose
statement: Suspicions were voiced at the workshop that the two gradings of products of Schur functions - one from LLT polynomials and one from Morse and Lapointe's \(t\)-statistic - may be related. Can this relationship be stated precisely? What role does the affine Hecke algebra play? What is the connection between \(q\)-Littlewood-Richardson coefficients, Macdonald polynomials, and the definition of \(k\)-Schur functions via generalized Kostka polynomials?
