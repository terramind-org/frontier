title: Several Complex Variables Problem List — Problem 72
field: mathematics
tier: prose
statement: Let $f:\mathbb{P}^2 \rightarrow \mathbb{P}^2$ be a holomorphic map of degree $d \geq 2$. Assume K is a totally invariant set. Let C denote the critical set of $f$. Assume $\overline{\bigcup_{n=1}^{\infty} f^n(C)} \bigcap K = \emptyset$. Is f hyperbolic on K?
