title: Uniform Frobenius exponents and all-good-fiber algebraicity cases
field: mathematics
tier: prose
statement: |-
  (D. Ramakrishnan) The following question is due to P. Deligne. Let \(X\) be a variety defined over a (finitely-generated) field of characteristic 0. Given a Tate class on \(c\) on \(X\), is there a prime \(p\) such that, upon reducing \(X\) mod \(p\), the reduction of \(c\) is algebraic?

  **Recovered Problem 19.** Let \(X\) be a variety over a finitely generated field of characteristic zero. Given a Tate class \(c\) on \(X\), is there a prime \(p\) such that, after reducing \(X\) modulo \(p\), the specialized class \(c_p\) is algebraic?
