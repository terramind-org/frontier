title: Trisection Distance Bounds from Nonseparating Hypersurfaces
field: mathematics
tier: prose
statement: Suppose a smooth $4$-manifold $X$ contains a nonseparating $3$-manifold $Y$, and $\Sigma$ is the central surface of a trisection of $X$. Can the topology of $Y$ and the induced loop in the three disk sets be used to bound the trisection distance $d(\Sigma)$ from above?
