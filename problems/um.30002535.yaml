title: Finiteness of Minimal Models of Terminal Threefolds
field: mathematics
tier: prose
statement: For every terminal projective threefold $Y$, are there only finitely many minimal models reachable by the $K_Y$-minimal model program? In particular, are there only finitely many when the program is run with scaling by an ample divisor $H$ on $Y$?
