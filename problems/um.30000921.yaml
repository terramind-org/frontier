title: Polynomial Stability of Hypercyclic Entire Functions
field: mathematics
tier: prose
statement: Let $HC(D)$ denote the entire functions whose sequence of derivatives is dense in $H(\mathbb{C})$, equivalently the hypercyclic vectors for differentiation. If $f\in HC(D)$ and $p$ is a nonconstant polynomial, is $pf\in HC(D)$?
