title: The Hilbert--Chow zero-degree face of the surface cone of a Hilbert square
field: mathematics
tier: prose
statement: |-
  Effective cones of Hilbert schemes and Moduli Spaces

  It is natural to try to compute effective cones in the case of Hilbert
  schemes or moduli spaces. One natural Hilbert scheme to consider first is the
  Hilbert scheme of length \(n\) subscheme of a smooth surface \(S\), denoted
  by \(S^{[n]}\). A great deal is known about these Hilbert schemes. In recent
  years there has been a lot of exciting work on the effective cones of
  divisors and curves of the Hilbert schemes
  \(\operatorname{Eff}^1(S^{[n]})\) and
  \(\operatorname{Eff}_1(S^{[n]})\). See for example Bayer and Macri's work on
  Hilbert schemes of K3 surfaces or Huizenga's work on Hilbert schemes of
  \(\mathbb P^2\). It is then natural to ask how to compute the effective cone
  of surfaces or the codimension 2 effective cones.

  What is the effective cone of surfaces
  \(\operatorname{Eff}_2(S^{[n]})\)? What is the codimension 2 effective cone
  \(\operatorname{Eff}^2(S^{[n]})\)? What about higher dimension/codimension?
