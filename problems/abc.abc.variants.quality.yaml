lean:
  module: FormalConjectures.Wikipedia.ABC
  decl: ABC.abc.variants.quality
  statement: |-
    theorem abc.variants.quality (ε : ℝ) (hε : 0 < ε) :
        {(a, b, c) : ℕ × ℕ × ℕ | 0 < a ∧ 0 < b ∧ 0 < c ∧ ({a, b, c} : Set ℕ).Pairwise Nat.Coprime ∧
        a + b = c ∧ quality a b c > (1 + ε)}.Finite
  context:
    - open ABC
    - open ABC.abc
    - open ABC.abc.variants
  definitions:
    - name: ABC.quality
      kind: def
      text: |-
        /--
        Quality `q(a, b, c)` of the triple `(a, b, c)` is defined as `q(a,b,c) = log (c) / log (rad(abc))`.
        -/
        noncomputable def quality (a b c : ℕ) : ℝ := (c : ℝ).log / (radical <| a * b * c : ℝ).log
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/ABC.lean#L54
