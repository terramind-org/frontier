title: Local Discrete Holomorphic Dynamics — Open Problem OP7
field: mathematics
tier: prose
statement: |-
  \emph{Let $f\in\mathop\mathrm{End}\nolimits(\mathbb{C}^n,O)$ be a superattracting germ, and let $H$ be the first
  non-zero
  term in the homogeneous expansion of $f$. Assume that $H$ is degenerate, that is there exists
  $v\in\mathbb{C}^n\setminus\{O\}$ such that $H(v)=O$. Is it still true that if the postcritical set of $f$ is
  an analytic cone then $f$ is holomorphically locally conjugated to $H$?}
