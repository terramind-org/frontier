title: Effective Mordell–Vojta Conjecture
field: mathematics
tier: prose
statement: Let $K$ be a number field and $X/K$ a smooth projective curve. For every $\varepsilon>0$, does there exist $\kappa(\varepsilon)$ such that $h_\omega(P)\leq(1+\varepsilon)d(P)+\kappa(\varepsilon)$ for every algebraic point $P\in X(\overline K)$, where $h_\omega$ is the normalized dualizing-sheaf height and $d(P)$ is the logarithmic discriminant of $K(P)$?
