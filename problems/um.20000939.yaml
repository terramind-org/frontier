title: Degree-sensitive semi-algebraic Ramsey bounds
field: mathematics
tier: prose
statement: |-
  Question (Bukh--Matoušek): Can this be improved to a constant number of logs?

  Known: In dimension 1, two logs suffice, and this is tight.

  (Conlon--Fox--Pach--Sudakov--Suk) \(r_f(n)\geq c\log\cdots\log n\), with \(k-2\) logarithms.

  If the dimension is high enough, this is sharp (in \(\mathbb R^{c(k)}\)).

  Variant: the unbalanced \(R_f^{(k)}(s,n)\).
