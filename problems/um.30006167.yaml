statement: Is it consistent with ZFC that the HOD hypothesis holds and there are cardinals $\kappa<\lambda$ such that $\kappa$ is $<\lambda$-extendible, $\lambda$ is a strong-limit cardinal with $\operatorname{cf}(\lambda)=\omega_1$, and $(\lambda^+)^{\mathrm{HOD}}<\lambda^+$?
