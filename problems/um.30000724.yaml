title: Strong Element-Connected Orientations with Steiner Vertices
field: mathematics
tier: prose
statement: If the terminal set $T$ is $2k$-element-connected in an undirected graph $G$, does $G$ have a Steiner strongly $k$-element-connected orientation? Here element-connectivity counts paths disjoint in their edges and Steiner vertices, with a specified root in $T$.
