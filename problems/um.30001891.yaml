title: Projectively Unique Polytopes and Their Realization Spaces
field: mathematics
tier: prose
statement: For a fixed dimension $d$, are there only finitely many combinatorial types of projectively unique $d$-dimensional convex polytopes? More generally, how does the dimension of the realization space of a $d$-polytope grow with its size?
