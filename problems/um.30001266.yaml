title: Stable Cohomology of Higher-Dimensional Diffeomorphism Groups
field: mathematics
tier: prose
statement: Does there exist a homotopy-commutative monoid $M$, constructed from classifying spaces of diffeomorphism groups of oriented $d$-manifolds with boundary and with multiplication induced by gluing, such that $$H^*(\Omega_0^\infty MTSO(d);\mathbb Q)\longrightarrow H^*(M;\mathbb Q)^{\pi_0(M)}$$ is surjective and has zero kernel when $d$ is even, while for odd $d$ its kernel is the ideal generated by $s\,\mathrm{th}(L_k)$ for $4k\geq d$, with $L_k$ the degree-$4k$ component of the Hirzebruch $L$-class?
