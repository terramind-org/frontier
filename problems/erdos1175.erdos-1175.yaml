  module: FormalConjectures.ErdosProblems.«1175»
  decl: Erdos1175.erdos_1175
  statement: |-
    theorem erdos_1175 :
        ∀ (κ : Cardinal), ℵ₀ < κ →
          ∃ (μ : Cardinal),
            ∀ (V : Type*) (G : SimpleGraph V), G.chromaticCardinal = μ →
              ∃ (H : G.Subgraph), H.coe.CliqueFree 3 ∧ H.coe.chromaticCardinal = κ
  context:
    - open Erdos1175
    - open Cardinal SimpleGraph
