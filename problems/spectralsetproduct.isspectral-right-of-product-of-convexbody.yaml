id: spectralsetproduct.isspectral-right-of-product-of-convexbody
title: Spectral sets and weak tiling (isSpectral_right_of_product_of_convexBody)
field: mathematics
tier: proof
statement: |-
  [KLM2023, Problem 7.2] For every positive dimension $n$, a convex body $A$ and a bounded,
  measurable set $B$, must spectrality of $A \times B$ imply spectrality of $B$?
