statement: |-
  \section*{Additive indecomposability of finite modifications of the primes}\label{30007271}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For any two subsets A,B of the nonnegative integers, each containing at least two elements, must their sumset differ from the prime set at infinitely many integers?
  \subsection{Short English statement}
  For any two subsets A,B of the nonnegative integers, each containing at least two elements, must their sumset differ from the prime set at infinitely many integers?
