title: Kourovka Notebook Problem 19.15
field: mathematics
tier: prose
statement: |-
  For a class of groups $M$, let $L(M)$ denote the class of all groups $G$ in which
  the normal closure $\langle a^G\rangle $ of any element $a\in G$ is contained in $M$. Let $qA$ be the quasivariety generated by a finite nilpotent group $A$. Can the quasivariety $L(qA)$ contain a non-nilpotent group?
