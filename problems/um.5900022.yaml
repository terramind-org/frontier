title: Sharp Isoperimetric Constant for Bubble Clusters
field: mathematics
tier: prose
statement: Find the best constant $C$ in the inequality $A\leq C(\int_B H+L)^2$ for a bubble cluster of area $A$, mean curvature $H$, and boundary length $L$. Determine the analogues for other norms and higher dimensions.
