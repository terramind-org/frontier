statement: In the global Gan–Gross–Prasad setting, is nonvanishing of the relevant $H$-period on an irreducible cuspidal automorphic representation equivalent to nonvanishing of every corresponding local Hom space together with the central Rankin–Selberg value $L_E(1/2,\pi_1\times\pi_2)$?
