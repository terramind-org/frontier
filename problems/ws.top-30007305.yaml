statement: |-
  \section*{Equality of microstates and nonmicrostates free entropy}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every bounded finite self-adjoint tuple in a tracial von Neumann algebra for which both entropies are finite, must classical microstates free entropy $\chi $, with its original operator-norm cutoff and limsup convention, equal nonmicrostates free entropy $\chi *$?
  \subsection{Short English statement}
  For every bounded finite self-adjoint tuple in a tracial von Neumann algebra for which both entropies are finite, must classical microstates free entropy $\chi $, with its original operator-norm cutoff and limsup convention, equal nonmicrostates free entropy $\chi *$?
