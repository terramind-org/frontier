title: Ultraproduct II_1 Factors — Problem 37
field: mathematics
tier: prose
statement: |-
  The reduced $C^*$-algebra version of this problem has been settled in the negative in the recent work [elayavalli2025negativeresolutioncalgebraictarski].

  The problem below is due to S. Popa:

  Let $N$ be a Connes embeddable separable II$_1$ factor. Does it admit an embedding into $R^\mathcal{U}$ with factorial commutant?
