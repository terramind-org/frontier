title: Question 3.6 — Is there a map Out(Fn)→ Out(Fm) that induces an isomorphism on homology in the stable range?
field: mathematics
tier: prose
statement: "Is there a map Out(Fn)→ Out(Fm) that induces an isomorphism on homology in the stable range? A number of the questions in this section and (2.2) ask whether certain quotients of Out( Fn) or Aut( Fn) are necessarily finite. The following quotients arise naturally in this setting: define Q(n,m ) to be the quotient of Aut( Fn) by the normal closure of λm, where λ is the Nielsen move defined on a basis {a1,...,a n} bya1↦→a2a1. (All such Nielsen moves are conjugate in Aut( Fn), so the choice of basis does not alter the quotient.) The image of a Nielsen move in GL( n, Z) is an elementary matrix and the quotient of GL( n, Z) by the normal subgroup generated by the m-th powers of the elementary matrices is the finite group GL( n, Z/m). But Bridson and Vogtmann [ 21] showed that if m is suﬃciently large then 20. Automorphism groups of free, surface and free abelian groups 327 Q(n,m ) is infinite because it has a quotient that contains a copy of the free Burnside group B(n− 1,m ). Some further information can be gained by replacing B(n− 1,m ) with the quotients of Fn considered in subsection 39.3 of A.Yu. Ol’shanskii’s book [ 73]. But we know very little about the groups Q(n,m ). For example:"
