title: Horizontal enstrophy budgets and a Couette orientation obstruction
field: mathematics
tier: prose
statement: |-
  Consider the 2D Euler equation with horizontal viscosity on \(\mathbb T\times[0,1]\):
  \[
  \partial_t\omega+u\cdot\nabla\omega=\nu\partial_{xx}\omega,
  \qquad
  u=\nabla^\perp\Delta^{-1}\omega.
  \]
  How large can \(\nu\int_\Omega|\partial_x\omega|^2\) get as \(\nu\to0\) and \(t\to\infty\)?
