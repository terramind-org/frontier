title: Kourovka Notebook Problem 17.1
field: mathematics
tier: prose
statement: |-
  (I. M. Isaacs). Does there exist a finite group
  partitioned by subgroups of equal order not all of which are
  abelian? (Cf. 15.26.) It is known that such a group must be of
  prime exponent (I. M. Isaacs, *Pacific J. Math.*, **49**
  (1973), 109--116).
