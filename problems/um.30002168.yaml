title: Orthogonality-Avoiding Sets and Coulomb Local Minima
field: mathematics
tier: prose
statement: For a measurable set $A\subset S^2$ with $\langle x,y\rangle\ne0$ for all $x,y\in A$, what is the largest possible measure of $A$, and can the upper bound $1/3$ be improved? Separately, if $L_n$ is the number of local minima of the Coulomb potential for $n$ points on $S^2$, is $L_n>1$ for every sufficiently large $n$?
