title: An integral free core and cyclotomic quotient for connected sums of lens spaces
field: mathematics
tier: prose
statement: |-
  **KBSM of connected sum of Lens space**

  Compute the Kauffman Bracket Skein Module of $\#$ Lens space (Haken manifold of finite type) over $\mathbb{Z}[A^{\pm}]$.

  **Recovered problem.** For a finite connected sum
  \[
   M=\mathop{\#}_{i=1}^{r}L(p_i,q_i),\qquad r\geq 2,
  \]
  of standard closed lens spaces, with $p_i>0$ and $\gcd(p_i,q_i)=1$, compute the Kauffman bracket skein module over
  \[
   R=\mathbb Z[A,A^{-1}]=\mathbb Z[A^{\pm1}].
  \]
