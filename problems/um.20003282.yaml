title: Literal counterexamples and an exact torus model for sparse unipotent samples
field: mathematics
tier: prose
statement: |-
  Let \(G\) be a Lie group, \(\Gamma\) a lattice in \(G\), and \(U=\{u(t)\}\subset G\) a one-parameter Ad-unipotent subgroup. Suppose that, for \(x\in G/\Gamma\), the orbit \(Ux\) is dense in \(G/\Gamma\).

  Section 4.1 fixes the following setting:

  Question 15 (attributed to G. Margulis) then asks for equidistribution of
  \[
     \{u(t_n)x\}_{n\geq 1}
  \]
  for each of
  \[
    \text{(1) }t_n=\lfloor n^\alpha\rfloor\quad(\alpha>1),\qquad
    \text{(2) }t_n=\lfloor P(n)\rfloor,qquad
    \text{(3) }t_n=p_n,
  \]
  where \(P\) is a polynomial and \(p_n\) is the \(n\)-th prime.

  The continuation on the next page says that A. Venkatesh had suggested a proof of (1) for \(\alpha\) close to 1, recalls almost-everywhere pointwise ergodic results for these sequences, and explicitly warns that \(\lfloor n^\alpha\rfloor\) and \(n^\alpha\) behave differently. Thus the floor in the recovered question is intentional.
