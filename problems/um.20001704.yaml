title: A canonical Poisson compactification and a boundary test for all-braid correspondences
field: mathematics
tier: prose
statement: |-
  Braid varieties are compactified by Brick manifolds. The strata here relate to positive braids.

  Is there a compactification of the cotangent bundle of Bott-Samelson varieties or the cotangent bundle of Brick manifolds related to all braids?
