schema: 1
id: lemoine.lemoine-conjecture-extension
title: Lemoine's conjectures (lemoine_conjecture_extension)
field: mathematics
tier: proof
statement: |-
  For all odd integers $n ≥ 9$ there are odd prime numbers $p,q,r,s$ and natural numbers $a,b$
  such that $p+2q = n$, $2+pq = 2^a+r$, $2p+q = 2^b+s$
