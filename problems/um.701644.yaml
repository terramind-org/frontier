title: Kourovka Notebook Problem 19.96
field: mathematics
tier: prose
statement: |-
  Let $M$ be a free metabelian group of finite rank $r \geq 2$, and let $P$ be the set of its primitive elements. (An element of a relatively free group is said to be primitive if it can be included in a basis of the group.)

  a) Is $P$ a first-order definable set?

  b) Is the set of bases
  of the group
  $M$ a first-order definable set?
