statement: Let $(G_n)$ and $(H_n)$ converge to the same graph limit, and let $(T_n)$ be a convergent sequence with each $T_n$ a spanning tree of $G_n$. Do there exist spanning trees $P_n$ of $H_n$ converging to the same limit as $(T_n)$?
