title: A graded fixed-point cone and the complete chain case
field: mathematics
tier: prose
statement: |-
  When \(P\) is minuscule or coincidental, is there a cyclic sieving
  phenomenon [for] the integer points of \(kO(P)\) under the induced actions of
  promotion/rowmotion?

  This record is Problem 4.5 in the pre-workshop document for the AIM workshop
  *Dynamical algebraic combinatorics*. The source text, with line-break
  hyphenation removed and the visibly omitted word “for” supplied in brackets,
  asks:

  Here \(O(P)\) is the order polytope. The paragraph following the question
  describes, for the type \(A\) positive-root poset, a statistic defined after
  applying Stanley's transfer map. If \(x_1,\ldots,x_p\) are the resulting
  chain-polytope coordinates, then the exponent is a linear form
  \(\lambda(x)\) that weights entries in column \(j\) of the enlarged
  triangular array by \(j-n-1\), for \(1\le j\le 2n+1\). The source proposes
  a \(q\)-Ehrhart interpretation of this column-weighted statistic and asks
  whether one can combine all dilations into one cone. This \(\lambda\) is
  distinct from the ordinary size statistic used later in this report for the
  separate minuscule-chain special case.

  The preceding source paragraph fixes the intended action. The lattice points
  of \(kO(P)\) are height-\(k\) \(P\)-partitions, and the action is obtained by
  extending the usual order-ideal toggles piecewise-linearly. Although the same
  set can be encoded, up to reversing \(P\), as order ideals of
  \(P\times[k]\), this induced piecewise-linear action is generally **not**
  ordinary combinatorial rowmotion on that product.
