statement: |-
  [P\u aun]
  Can one find $h=e^{-\varphi}$ a hermitian metric of ${\mathcal{L}}$ on ${\mathcal{X}}$ which is a semi-positive extension of $\varphi_0$, i.e.
  such that $dd^c \varphi \geq 0$ and $\varphi_{|X_0}=\varphi_0$ ?
