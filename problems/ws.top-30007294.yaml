statement: |-
  \section*{Abstract Cuntz-semigroup criterion for Jiang–Su absorption}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every separable nuclear complex C*-algebra A, is $A\cong A\otimes Z$ equivalent to an abstract isomorphism $Cu(A)\cong Cu(A\otimes Z)$ in the category Cu, without requiring that isomorphism to arise from the first-factor inclusion or any star-homomorphism?
  \subsection{Short English statement}
  For every separable nuclear complex C*-algebra A, is $A\cong A\otimes Z$ equivalent to an abstract isomorphism $Cu(A)\cong Cu(A\otimes Z)$ in the category Cu, without requiring that isomorphism to arise from the first-factor inclusion or any star-homomorphism?
