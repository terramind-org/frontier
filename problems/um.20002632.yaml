title: Positive-temperature structure and a finite-rank gap criterion
field: mathematics
tier: prose
statement: |-
  What is the structure which replaces determinantal point processes and correlation functions and which allows for such computations?

  The AIM record asks what replaces determinantal point processes and correlation functions for triangular arrays associated with positive-temperature polymers. These arrays arise as limits of Macdonald processes. Their fixed-level laws resemble GUE/LUE eigenvalue ensembles, but are not determinantal; nevertheless, Laplace transforms of an extremal coordinate can have Fredholm determinant formulas. The question asks for a structure making all analogous eigenvalues, especially joint gap probabilities, accessible.

  Its concluding question is:

  In modern terminology, geometric or birational RSK is the positive-temperature lift, while tropical RSK is the zero-temperature limit in which a scaled logarithm changes sums into maxima. The positive-temperature level laws are Whittaker measures or related Macdonald degenerations. This report preserves the source wording but calls the finite-temperature variables “Whittaker coordinates.”
