title: Furstenberg Classification of Times-$p$ and Times-$q$ Invariant Measures
field: mathematics
tier: prose
statement: Let $p,q\geq 2$ be multiplicatively independent. Are the probability measures on $\mathbb R/\mathbb Z$ invariant under both $T_p(x)=px\pmod 1$ and $T_q(x)=qx\pmod 1$ precisely the finitely supported invariant measures, Lebesgue measure, and their convex combinations?
