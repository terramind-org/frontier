title: Question 6.2 — (Rigidity of the Mod g,1 action on S1).
field: mathematics
tier: prose
statement: "(Rigidity of the Mod g,1 action on S1). Is any faithful action ρ: Mod g,1→ Homeo+(S1) conjugate in Homeo+(S1) to the standard action, given in (19)? What about the same question for finite index subgroups of Modg,1? Perhaps there is a vastly stronger, topological dynamics characterization of Mod g,1 inside Homeo+(S1), in the style of the Convergence Groups Conjecture (theorem of Tukia, Casson- Jungreis and Gabai), with “asymptotically source – sink” being replaced here by “asymptotically source – sink – ··· – source – sink”, or some refinement/variation of this. Now, the group of lifts of elements of Homeo +(S1) to homeomorphisms of R gives a central extension 1→ Z→ ˜Homeo(S1)→ Homeo+(S1)→ 1 which restricts via (19) to a central extension 1→ Z→ ˜Modg,1→ Modg,1→ 1 (20) Note that Mod g,1 has torsion. Since ˜Homeo(S1)⊂ Homeo+(R) which clearly has no torsion, it follows that (20) does not split. In particular the extension (20) gives a nonvanishing class ξ∈ H 2(Modg,1, Z). Actually, it is not hard to see that ξ is simply the “euler cocycle”, which assigns to any pointed map Σ h→M g the euler class of the pullback bundle of the “universal circle bundle” over Mg. The torsion in Mod g,1 and in Mod g preclude each from having a left-ordering, or acting faithfully on R. As far as we know this is the only obstruction; it disappears when one passes to appropriate finite index subgroups."
