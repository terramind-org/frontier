  \section*{Kaplansky quasitrace additivity conjecture}\label{30007304}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Is every normalized two-quasitrace on every unital complex C*-algebra additive on the positive cone and therefore a tracial state, including separable algebras without exactness or nuclearity?
  \subsection{Short English statement}
  Is every normalized two-quasitrace on every unital complex C*-algebra additive on the positive cone and therefore a tracial state, including separable algebras without exactness or nuclearity?
