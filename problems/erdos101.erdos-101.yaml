  module: FormalConjectures.ErdosProblems.«101»
  decl: Erdos101.erdos_101
  statement: "theorem erdos_101 : (fun n => (numLinesWithFourPointMax n : ℝ)) =o[atTop] (fun n => (n : ℝ)^2)"
  context:
