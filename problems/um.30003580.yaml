id: um.30003580
title: Keating–Snaith Distribution of Central L-Values
field: mathematics
tier: prose
statement: In each standard family of central $L$-values, is the logarithm of the central value asymptotically Gaussian with the Keating–Snaith mean and variance? More precisely, for primitive characters modulo $q$, are the mean and variance asymptotic to $0$ and $\tfrac12\log\log q$; for quadratic characters $\chi_d$, to $\tfrac12\log\log X$ and $\log\log X$; and for root-number-$1$ quadratic twists $f\otimes\chi_d$, to $-\tfrac12\log\log X$ and $\log\log X$?
