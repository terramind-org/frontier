title: Displacement-Energy Bounds for Poisson Brackets of Open Covers
field: mathematics
tier: prose
statement: |-
  Let $(M,\omega)$ be a closed symplectic manifold and let $\mathcal U=\{U_i\}_{i\in I}$ be a finite open cover by displaceable sets. Is there a constant $C(M,\omega)>0$ such that
  $$
  pb(\mathcal U)e(\mathcal U)\geq C(M,\omega),
  $$
  where $e(\mathcal U)=\max_i e(U_i)$?
