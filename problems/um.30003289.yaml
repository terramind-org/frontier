title: Johnson-Filtration Images of Stable Heegaard Splittings
field: mathematics
tier: prose
statement: For the Johnson-filtration images $V_k(3)$ of stable Heegaard splittings of integral homology $3$-spheres, describe $V_k(3)$ and determine whether $V_k(3)=V_1(3)$ for every $k\geq1$. If $\varphi\in A_{g,1}(k)$ and $\psi\in B_{g,1}$ agree modulo $\Gamma_{k+1}$ on $\pi$, does some $\mu\in AB_{g,1}$ satisfy $\mu(x)=\varphi(x)=\psi(x)$ modulo $\Gamma_{k+1}$ for every $x$?
