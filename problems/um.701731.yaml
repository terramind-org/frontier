title: Kourovka Notebook Problem 20.73
field: mathematics
tier: prose
statement: |-
  Can every countable group $G$ be factorized $G=AB$ into infinite subsets $A, B$ such that every
  element $g\in G$ has a unique representation $g = ab$ for $a\in A$, $b \in B$?

  This is true if $G$ is topologizable.
