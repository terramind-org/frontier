title: Confluent Slater quotients and the first kurtosis obstruction
field: mathematics
tier: prose
statement: |-
  Let $p_k(z)$ be the polynomials orthogonal with respect to $\Phi$ on
  $(-\infty,\infty)$. Define

  \[
  P_n(z):=\frac{\det[p_i(z_j)]_{i,j=1}^n}
  {\det[z_i^{j-1}]_{i,j=1}^n},\qquad
  Q_n(z):=\frac{\det[p_i(z_j)]_{i,j=2}^n}
  {\det[z_i^{j-2}]_{i,j=2}^n}.
  \]
  Investigate the zeros of $P_n$ and $Q_n$.
