statement: |-
  Suppose that a group $G$ has a composition
  series and let $\mathrm{Fit}(G)$ be the Fitting class generated by
  $G$. Is the set of all Fitting subclasses of $\mathrm{Fit}(G)$
  finite? Cf. 14.31.
