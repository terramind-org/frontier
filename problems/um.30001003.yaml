title: Yau Stability Conjecture for Constant Scalar Curvature Metrics
field: mathematics
tier: prose
statement: Let $(X,L)$ be a polarized compact Kähler manifold with Kähler class $[\omega_0]$. Is $[\omega_0]$ represented by a Kähler metric of constant scalar curvature if and only if the polarization $L\to X$ is stable in the sense of geometric invariant theory?
