title: Kourovka Notebook Problem 16.3
field: mathematics
tier: prose
statement: |-
  Is it true that if $G$ is a finite group with
  all conjugacy classes of distinct sizes, then $G\cong {\mathbb{S}_3$?

  This is true if $G$ is solvable (J. Zhang,
  *J. Algebra*, **170** (1994), 608--624); it
  is also known that $F(G)$ is nontrivial (Z. Arad,
  M. Muzychuk, A. Oliver, *J. Algebra*, **280** (2004), 537--576).
