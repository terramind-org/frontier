title: Category Bounds for Positive Nonlinear Schrödinger Solutions
field: mathematics
tier: prose
statement: Let $-\Delta u+(\lambda^2a(x)+1)u=|u|^{p-1}u$ on $\mathbb{R}^N$, where the zero-potential region is the disjoint union $\Omega_1\cup\Omega_2$. For sufficiently large $\lambda$, are there at least $\operatorname{cat}(\Omega_1)+\operatorname{cat}(\Omega_2)+\operatorname{cat}(\Omega_1)\operatorname{cat}(\Omega_2)$ positive solutions?
