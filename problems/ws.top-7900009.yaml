  % UnsolvedMath ID 7900009; source catalogue code AMR-078-0009
  \setcounter{section}{7900008}
  \section{Bounded Excess Electrons}\label{7900009}
  {\small UnsolvedMath ID 7900009 · Mathematical Physics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For the $N$-electron Coulomb Hamiltonian with nuclear charge $Z$, let $N_0(Z)$ be the least $N$ after which adding electrons no longer lowers the ground-state energy. Prove that $N_0(Z)-Z$ remains bounded as $Z\to\infty$.
  \par\smallskip\textit{Formulation references:} \sref{7900009}{1}, \sref{7900009}{2}.
  \subsection{Short English statement}
  For the $N$-electron Coulomb Hamiltonian with nuclear charge $Z$, let $N_0(Z)$ be the least $N$ after which adding electrons no longer lowers the ground-state energy. Prove that $N_0(Z)-Z$ remains bounded as $Z\to\infty$.
