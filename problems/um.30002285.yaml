title: Cohomological Stability for Moduli of Curves with Group Actions
field: mathematics
tier: prose
statement: Fix a finite group $G$ and a topological action type $\rho$ on curves, and let $g'$ denote the genus of the quotient curve. Do the cohomology groups of the corresponding moduli spaces $\mathcal M_{g,G,\rho}$ stabilize as $g'\to\infty$?
