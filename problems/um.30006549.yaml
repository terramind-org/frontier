title: Efficient Algorithms for Large Hypergraph Independent Sets
field: mathematics
tier: prose
statement: For some absolute $c>0$, give a polynomial-time algorithm that finds an independent set of size at least $c\,\mathbb E|I|$ in every large-girth, $d$-regular, $r$-uniform hypergraph, where $I$ is the independent set produced by the random-ordering construction.
