title: One partially hyperbolic element can hide an entire higher-rank factor
field: mathematics
tier: prose
statement: |-
  **Conjecture 5.** Every action of a connected semisimple Lie group of higher rank (i.e., all simple factors have real rank at least 2) or its lattice, which that has an element which acts non-trivially uniformly partially hyperbolicly, is \(C^\infty\)-conjugate to an algebraic action.

  Every action of a connected semisimple Lie group of higher rank (that is, every simple factor has real rank at least \(2\)), or of a lattice in such a group, that has an element acting nontrivially and uniformly partially hyperbolically, is \(C^\infty\)-conjugate to an algebraic action.
