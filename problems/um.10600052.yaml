title: Virtual-knot problem 52 — If $X$ is the free rack, is $\Gamma X$ a cat(0) space?
field: mathematics
tier: prose
statement: |-
  If $X$ is the free rack, is $\Gamma X$ a cat(0) space? A positive
  answer would imply that all its higher homotopy groups are trivial.
