title: Move Complexity and Surplus in Maker Games
field: mathematics
tier: prose
statement: For Maker's graph-construction game on $K_\infty$, if $R_M(n)$ is the minimum number of moves needed to claim a copy of $K_n$ and $2^{n/2}\leq R_M(n)\leq c2^n$, can the gap be closed or reduced? For a $d$-regular $n$-vertex graph $G$, is there a constant $c>1$ such that $R_M(G)\geq c^dn$? In the Maker–Breaker game on an $n\times n^2$ grid, can the trivial upper bound $n$ on Maker's surplus in a row or column be improved, and is the correct order $\Theta(\sqrt{n\log n})$?
