title: Nonvanishing Statistics of Twisted Central L-Values
field: mathematics
tier: prose
statement: Fix a modular form $f$ of weight $k\geq2$ and an integer $d\geq1$. If $K_d(X)$ is the set of primitive Dirichlet characters of order $d$ and conductor at most $X$, what is the asymptotic behavior of $\#\{\chi\in K_d(X):L(f,\chi,k/2)\neq0\}$ as $X\to\infty$?
