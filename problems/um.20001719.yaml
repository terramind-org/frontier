id: um.20001719
title: Square-locus transfer and the canonical-cover obstruction
field: mathematics
tier: prose
statement: |-
  Generalize the results of Bufetov and Gurevich in Bufetov--Gurevich (*Sb. Math.* 202, 2011, MR2857792, on existence and uniqueness of the measure of maximal entropy for the Teichmüller flow on strata of Abelian differentials) to the space of quadratic differentials.

  A. I. Bufetov and B. M. Gurevich, “Existence and uniqueness of the measure of maximal entropy for the Teichmüller flow on the moduli space of Abelian differentials,” *Sbornik: Mathematics* 202 (2011), no. 7, 935–970, MR2857792, DOI 10.1070/SM2011v202n07ABEH004172.

  For every connected component \(\mathcal C\) of a unit-area stratum of quadratic differentials, prove that the normalized Masur–Veech probability is the unique invariant Borel probability of maximal entropy for the Teichmüller flow on \(\mathcal C\), and identify its entropy.
