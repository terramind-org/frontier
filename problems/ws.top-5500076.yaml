statement: |-
  \section{Equiprojective Polyhedra}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A polyhedron is $k$-equiprojective when orthogonal projection onto a plane gives a polygon with exactly $k$ sides for every projection direction not parallel to any face. The integer $k$ is independent of direction. For example, a cube is $6$-equiprojective.
  \paragraph{Statement recorded in the supplied source.}
  Identify or construct all $k$-equiprojective polyhedra, for all possible integers $k$. \sref{statement}{2}
  \subsection{Short English statement}
  Identify or construct all $k$-equiprojective polyhedra, for all possible integers $k$.
