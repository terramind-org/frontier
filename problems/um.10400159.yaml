title: Problem 8.13 — (T.
field: mathematics
tier: prose
statement: "(T. Kerler) [Homological TQFT’s] (1) Find the irreducible components and ring structure (w.r.t ⊕ and⊗) of Q∗. (2) Determine whether all strictly homological TQFT’s lie in Q ∗. (3) Identify the homological TQFT’s that arise from the gauge th eory of higher rank groups (such as P SU (n) in [129]) with elements in Q ∗. (4) Identify the irreducible factors of the constant orders V [0] p of the cyclo- tomic integer expansion of the Reshetikhin-Turaev theory w ith elements in Q∗. The first item is in some sense about finding the representatio n ring of Sp(2, Z)× Sp(4, Z)×...× Sp(2g, Z)×... equipped with further generators and relations given by the standard handle attachments. The constraints g iven by the latter may be just good enough to ensure that the answer to item (2) is positive. The application of (3) is a better understanding and possibl y a closed form for the polynomials from [129] that express the P SU (n)-invariants in terms of the coeﬃcients of the Alexander polynomial. Evidence seems to s uggest that the TQFT’s from (4) stem from p−3 2 -fold symmetric products of elements in Q 0. A plausible corollary would be that for a closed manifold wit h b1(M )≥ 1 we have Vp(M ) = ( ζp− 1) p−3 2 P p−3 2 (λCW L(M )) + O((ζp− 1) p−1 2 ), (46) where λCW L is the Casson-Walker-Lescop invariant, and Pj is a polynomial of degree j with integer coeﬃcients. (Note our normalization Vp(S3) = 1). As remarked in [212] the identity in (46) is true for p = 5 and general M with b1(M )≥ 1. Moreover, work in progress shows that (46) holds also for g eneral p if M is a torus-bundle over a circle. The homological TQFT’s are the starting point for a more gene ral, pertur- bative view point on TQFT’s that should parallel and extend t hat of the fi- nite type theory of homology-3-spheres. At least for fixed p one can under- stand, for example, the Reshetikhin-Turaev theory as defor mation of the Q ∗ - theories. The notion that is somewhat parallel to that of fini te type for closed 3-manifolds is what we shall call finite length. More precisely, the representa- tionsV[g]: Γ g→ GLR(V(Σ g)) of the mapping class groups extend linearly to homomorphismsV[g]: Z[Γ g]→ EndR(V(Σ g)). Denote by IIg⊂ Z[Γ g] the aug- mentation ideal of the Torelli group. The length ofV is the maximal L∈ N such thatV[g]((IIg)L+1) = 0. Clearly, the L = 0-theories are just the homological ones. The L = 1-theories can be thought of as elements of some Ext( V,W) with V,W∈ Q ∗. Restricted to representations of the Γ g ’s they factor (in char̸= 2) through the Johnson-Morita-homomorphism Γ g→ ⋀ 3 H1(Σ g) ⋊ Sp(2g, Z), for which such extension are explicitly constructible [211]."
