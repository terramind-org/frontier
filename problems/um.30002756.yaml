title: Congruence from Complete Robin and Dirichlet Spectra
field: mathematics
tier: prose
statement: Let $\Omega_1$ and $\Omega_2$ be Lipschitz domains whose Robin Laplacians have the same eigenvalue sequence for every $\beta \geq 0$ and for Dirichlet boundary conditions. Must $\Omega_1$ and $\Omega_2$ be congruent?
