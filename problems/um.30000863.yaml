title: Minimaxity and Admissibility Under Ensemble Risks
field: mathematics
tier: prose
statement: In estimating a $p$-dimensional normal mean vector $\theta$ with squared-error risk $R(\theta,\delta)=\mathbb{E}_\theta[\lVert\delta(X)-\theta\rVert^2]$, define $R_{\gamma^2}(\delta)$ by averaging this risk over a centered $p$-dimensional normal distribution for $\theta$, and define $R_{\mathrm{order}}(\theta_{(\cdot)},\delta)$ by averaging over all permutations of $\theta$'s coordinates. Are standard shrinkage estimators minimax and nearly admissible for both ensemble risks, and is a suitably chosen hierarchical Bayes estimator minimax and admissible?
