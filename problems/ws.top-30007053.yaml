statement: |-
  \section*{Virasoro constraints for projective complete intersections}\label{30007053}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every smooth complete intersection X in complex projective space, does its ordinary unreduced total descendant potential satisfy every Virasoro constraint in every genus and curve class, allowing arbitrary complex cohomology insertions?
  \subsection{Short English statement}
  For every smooth complete intersection X in complex projective space, does its ordinary unreduced total descendant potential satisfy every Virasoro constraint in every genus and curve class, allowing arbitrary complex cohomology insertions?
