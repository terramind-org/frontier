statement: (N. Sato) Construct a well-defined state sum type invariant from a strongly amenable subfactor. Note that, unlike the Ponzano-Regge model, we do not have an a symptotic description of the quantum 6 j -symbols in general. (Recall that 6 j -symbols of SU (2) have an asymptotic description.) Let us consider the Turaev-Viro-Ocneanu invariant for a clo sed 3-manifold constructed from a subfactor. Then, this invariant can be co nsidered as a Reshetikhin-Turaev type invariant constructed from a subf actor by passing the initial subfactor through the Longo-Rehren construction. If we start with a subfactor which has a non-degenerate braiding in particula r, then this Turaev- Viro-Ocneanu invariant splits into a Reshetikhin-Turaev i nvariant and its com- plex conjugate. The following question will open a way to est ablish a theory of the minimal non-degenerate extension of a degenerate braid ing.
