title: Unimodality and Log-Concavity under Integer Decomposition
field: mathematics
tier: prose
statement: For a lattice polytope $P$, does the integer-decomposition property imply that $h^*(P;z)$ is unimodal or log-concave? Do either of these conclusions follow if $P$ is both Gorenstein and has the integer-decomposition property?
