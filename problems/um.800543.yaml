title: Visibility Graphs of Points, Segments and Polygons — Conjecture 14
field: mathematics
tier: prose
statement: |-
  {
  (a) The cycle $C=(p_1, p_{10}, p_9, p_8, p_7, p_5, p_4, p_6, p_3, p_2, p_1)$ is Hamiltonian
  but is self-intersecting.
  (b) The cycle $C=(p_1, p_9, p_{10}, p_7, p_8, p_6, p_5, p_4, p_3, p_2, p_1)$ is a Hamiltonian
  circuit as it forms a boundary of a simple polygon.
  (c) There is no alternating cycle as both endpoints of the segment $p_9p_{10}$ belong
  to the convex hull of the segments [rit-cscf-90].

  }{fhamilton1.eps}

  Every segment visibility graph $G$ contains a Hamiltonian cycle $C$.
