title: Positive Markov Kernels with Dirichlet Stationary Measures
field: mathematics
tier: prose
statement: For the Dirichlet or Poisson–Dirichlet transition-density expansion $p_t(x,dy)=d\pi_\theta(y)\{1+\sum_{n\geq1}a_n(\theta)Q_n^{(\theta)}(x,y)\}$, characterize all nonzero coefficient sequences $a_n(\theta)$ that make the kernel nonnegative. In particular, are the standard diffusion coefficients $\rho_n^{(|\theta|)}(t)$ the only time-dependent choices that yield a Markov transition function?
