title: Minimally Ramified Extensions with Prescribed Galois Group
field: mathematics
tier: prose
statement: Given a finite nontrivial group $G$ and a positive integer $g$, does there exist a $G$-extension of $\mathbb{Q}$ ramified at $g$ primes, including the infinite prime, and if so how many; conjecturally, existence is equivalent to $g$ being at least the minimal number of generators of $G^{\mathrm{ab}}$?
