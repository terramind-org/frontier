title: Noise sensitivity under the Schaeffer bijection
field: mathematics
tier: prose
statement: Generate a quadrangulation from $2n$ bits using the Schaeffer bijection and independently resample each bit with probability $\varepsilon$. Determine the noise sensitivity of natural geometric observables; in particular, estimate the probability that the diameter crosses its median after the perturbation.
