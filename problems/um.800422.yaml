title: Open Problems in Arithmetic Dynamics — Conjecture 45
field: mathematics
tier: prose
statement: |-
  \textup{(Jones--Levy, 2017, [MR3704363, Conjecture 1.2])} Let $K$
  be a number field, let $f(x)\in K(x)$ be a rational function of degree
  at least $2$, and let $\alpha\in K$ be a point that is not periodic
  for $f$. Then $(f,\alpha)$ is eventually stable over $K$.
