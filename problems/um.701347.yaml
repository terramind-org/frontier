field: mathematics
tier: prose
statement: |-
  c) A subgroup $H$ of a group $G$ is called *pronormal* if $H$
  and $H^g$ are conjugate in $\langle H,H^g\rangle$ for every $g\in
  G$. We say that $H$ is *strongly pronormal* if $L^g$ is
  conjugate to a subgroup of $H$ in $\langle H,L^g\rangle$ for every
  $L\leq H$ and $g\in G$.

  In a finite group, is a Hall subgroup with a Sylow tower always strongly pronormal?

  Notice that there
  exist finite (non-simple) groups with a non-pronormal Hall
  subgroup. Hall subgroups with a Sylow tower are known to be
  pronormal.

  [Archived solved part(s) of 17.45:]
  A subgroup $H$ of a group $G$ is called *pronormal* if $H$
  and $H^g$ are conjugate in $\langle H,H^g\rangle$ for every $g\in
  G$. We say that $H$ is *strongly pronormal* if $L^g$ is
  conjugate to a subgroup of $H$ in $\langle H,L^g\rangle$ for every
  $L\leq H$ and $g\in G$.

  a) In a finite simple group, are Hall subgroups always pronormal?

  An affirmative answer is known modulo
  CFSG for Hall subgroups of odd order (F. Gross, *Bull. London
  Math. Soc.*, **19**, no. 4 (1987), 311--319).

  b) In a finite simple group, are Hall subgroups always strongly pronormal?

  Notice that there
  exist finite (non-simple) groups with a non-pronormal Hall
  subgroup. Hall subgroups with a Sylow tower are known to be
  pronormal.
