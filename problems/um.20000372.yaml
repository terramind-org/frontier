title: Arithmetic surjectivity forces recurrence of locally soluble fibers
field: mathematics
tier: prose
statement: |-
  **Problem 4. Viray:** Let \(\phi:X\to E\) be a fibration over an elliptic curve of positive rank over \(\mathbb Q\) whose generic fiber is smooth and geometrically irreducible. Let
  \[
  Z=\{p\in E(\mathbb Q)\mid X_p=\phi^{-1}(p)\text{ has points everywhere locally}\}.
  \]
  What can we say about \(Z\)? Is \(|Z|<\infty\) with \(Z\ne\varnothing\) possible?

  The motivation is that work of Poonen, Skorobogatov–Harpaz and Colliot-Thélène–Pál–Skorobogatov constructs \(X\) failing the Hasse principle such that none of the known obstructions apply. All of these use a map \(X\to C\) to a curve with \(0<|C(\mathbb Q)|<\infty\).

  **Browning:** The case where \(\phi\) is a conic bundle may already be interesting.
