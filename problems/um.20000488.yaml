title: All-coupling Robin bound states for compact graph deformations in dimensions two and three
field: mathematics
tier: prose
statement: |-
  Consider the Robin Laplacian with a negative boundary parameter \(\alpha\)
  on a locally perturbed half-space (its boundary is a hyperplane away from a
  bounded region). The essential spectrum is expected to be
  \([-\alpha^2,\infty)\). Prove or disprove that there are always negative
  eigenvalues below \(-\alpha^2\).

  Its mathematical
  content is:

  The source does not specify the ambient dimension, regularity, whether the
  zero deformation is excluded, or whether “always” means every attractive
  coupling and every nontrivial deformation. These distinctions matter:

  - the undeformed half-space itself has no eigenvalue below its threshold;
  - in dimension two every sufficiently regular nontrivial deformation with
    the same straight line on both tails is already known to bind for every
    attractive coupling;
  - in higher dimensions the answer depends on the class of deformation, and
    recurrence of the tangential directions stops after ambient dimension
    three.

  Accordingly, the intended version is taken to ask for at least one discrete
  eigenvalue for every attractive parameter and every **nontrivial** sufficiently
  regular local deformation. The result below proves this for compactly
  supported graph deformations in ambient dimensions two and three and gives a
  capacity criterion in every dimension. It does not assert a full answer for
  all higher-dimensional or non-graph perturbations.

  To avoid a sign collision with the literature, set
  \(\beta=-\alpha>0\). Thus
  \[
    \partial_\nu u=\beta u,
    \qquad
    q_\beta[u]=\int_\Omega |\nabla u|^2\,dz
         -\beta\int_{\partial\Omega}|u|^2\,dS,
  \]
  and the flat threshold is \(-\beta^2=-\alpha^2\).
