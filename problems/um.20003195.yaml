title: Canonical, finite-order, and rowmotion primitives for zero-mesies
field: mathematics
tier: prose
statement: |-
  **Problem 1.2.** Find simple and uniform constructions for such functions \(g\) for a wide range of \(0\)-mesies \(f\).

  - \(T\) acts invertibly on a set \(X\), with every orbit finite;
  - \(f:X\to\mathbb R\) is a \(0\)-mesy, so its sum on each orbit is zero;
  - one seeks \(g:X\to\mathbb R\) such that \(f(x)=g(x)-g(Tx)\).

