title: Detecting Abelian Sylow Subgroups from Character Tables
field: mathematics
tier: prose
statement: For a finite group $G$ and a Sylow $p$-subgroup $P$, does the $p$-element submatrix $X_p(G)$ of the character table determine whether $P$ is abelian in all cases, as it does when $p\notin\{3,5\}$?
