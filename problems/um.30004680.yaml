title: Weihrauch Determinacy and Degree Structure Questions
field: mathematics
tier: prose
statement: What are the exact Weihrauch relations among $\Sigma^0_1\text{-DS}$, $\Sigma^0_1\text{-BSLQO}$, $\Sigma^0_1\text{-BSPO}$, $\Sigma^0_1\text{-BS}$, and $\Delta^0_2\text{-DS}$? Does Turing determinacy imply dependent choice for reals, and does Turing determinacy together with dependent choice imply strong Turing determinacy? Given a properly $2$-c.e. degree $D$, does there exist a c.e. set $A$ with $D\not\leq_T A$ such that every c.e. $W\leq_T D$ also satisfies $W\leq_T A$; and does the analogous extension property characterize superlow c.e. degrees?
