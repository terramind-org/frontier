title: Several Complex Variables Problem List — Problem 86
field: mathematics
tier: prose
statement: |-
  Prove that if $\Omega$ is a smooth bounded pseudoconvex domain in $\mathbb{C}^n$
  which is finite type in the sense of D'Angelo, then it is of finite
  type in the sense of Kohn (ideal type).\\
  Prize \$50 -J. McNeal, mcneal@math.princeton.edu
