title: Morava K- and E-theory 8 — Understand the relationship between the K(n)-local category and some sort of (algebraic) derived categ…
field: mathematics
tier: prose
statement: Understand the relationship between the K(n)-local category and some sort of (algebraic) derived category of E_*-S-modules. Jens Franke has claimed there is an equivalence there, but I don't really understand what he does. (This is likely a deficiency in me) In particular, I don't even know what the right algebraic category is. E_*E is a Hopf algebroid, so maybe we should consider comodules over it. But it is really pi_* L_K(n)(E smash E) that we should be considering, and I don't know what sort of algebraic gadget that is.
