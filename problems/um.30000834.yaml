title: Divergent Conductivity in Low-Dimensional Stochastic Lattices
field: mathematics
tier: prose
statement: For an energy–momentum-conserving stochastic lattice model in a nonequilibrium stationary state, what is the divergence order of the conductivity in low-dimensional unpinned systems? Green–Kubo computations predict order $\sqrt{N}$ for $d=1$ and $\log N$ for $d=2$. How do random masses, random interactions, nonlinear interactions, and the noise strength $\gamma$ affect the conductivity and its divergence order?
