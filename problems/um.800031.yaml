title: The Lyapin's Notebook — Problem 33
field: mathematics
tier: prose
statement: |-
  (S.I. Kublanovsky)
  Let $\mathbb{K}$ be one of the operators $\mathbb{H}\mathbb{P}, \mathbb{H}\mathbb{P}\mathbb{S}, \mathbb{S}\mathbb{H}\mathbb{P}, \mathbb{S}\mathbb{H}\mathbb{P}\mathbb{S}$, and let $\Phi$ be an arbitrary finite class of finite semigroups. Is the class $Cor(\mathbb{K}(\Phi))$ decidable?

  For all other Birkhoff operators the answer is positive (see [Kubl6]).
