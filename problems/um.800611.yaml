title: Selection Principles in Mathematics — Problem 39 ([Sakai06])
field: mathematics
tier: prose
statement: |-
  A topological space $Y$ is *$\kappa$-Fr\'echet* if it satisfies $\binom{O(\Omega_x)}{\Gamma_x}$,
  where $O(\Omega_x)$ is the family of elements of $\Omega_x$ which are open.

  What is the minimal cardinality of a set $X\subseteq\mathbb{R}$ such that $C_p(X)$ does not satisfy $\binom{O(\Omega_x)}{\Gamma_x}$?
