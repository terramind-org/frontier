title: Static-class criterion for generic Hamilton-Jacobi uniqueness
field: mathematics
tier: prose
statement: |-
  4. (Albert Fathi) Is it true that for generic \(L\in C^\infty\) there exists only a one-parameter family of viscosity solutions of the corresponding Hamilton-Jacobi equation?

  The sentence is not self-contained. The preceding item supplies the intended weak-KAM setting: \(M\) is compact; \(L:\mathbb T\times TM\to\mathbb R\) is a smooth time-periodic Lagrangian satisfying the usual Mather assumptions (strict fiberwise convexity, superlinearity, and completeness); and one works at a cohomology class \(c\). The autonomous convention \(\mathbb T=\{0\}\) is included in the same formalism. If \(\eta_c\) is a closed one-form representing \(c\), the critical equation is

  \[
   u_t+H(t,x,\eta_c(x)+D_xu)=\alpha_L(c)
   \tag{HJ}_{L,c}
  \]

  on \(\mathbb R/\mathbb Z\times M\); in the autonomous case it is

  \[
   H(x,\eta_c(x)+Du)=\alpha_L(c). \]

  Adding a constant to a solution produces another solution. Thus “only a one-parameter family” is recovered as **uniqueness modulo additive constants**, or equivalently uniqueness after a normalization such as \(u(z_0)=0\).

  The source does not say whether “generic” means a residual subset of the full space of Tonelli Lagrangians or Mañé genericity under smooth potential perturbations, and it does not quantify over \(c\). These distinctions matter. The standard theorem recovered below uses: a fixed strong Tonelli Lagrangian \(L_0\), a fixed class \(c\), and a residual set of potentials \(f\in C^\infty(\mathbb T\times M)\) in the \(C^\infty\) Fréchet topology, applied to \(L_0-f\). No conclusion for every uncountably many \(c\) is silently inserted.
