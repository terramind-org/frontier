title: Conjecture 5.24 — (Picard number one conjecture for level L structures).
field: mathematics
tier: prose
statement: (Picard number one conjecture for level L structures). Prove that H2(Modg[L]; Q) = Q when g≥ 3. More generally, compute H2(Modg[L]; Z) for all g≥ 3,L≥ 2. Harer [ Har2] proved this conjecture in the case L = 1. This generalization was stated (for Picard groups) as Question 7.12 in [ HL]. The case L = 2 was claimed in [ F o], but there is apparently an error in the proof. At this point even the ( g,L ) = (3, 2) case is open. Here is a possible approach to Conjecture 5.24 for g≥ 4. First note that, since Mod g[L] is a finite index subgroup of the finitely presented group Mod g, it is finitely presented. As we have a lot of explicit information about the finite group Sp(2 g, Z/LZ), it seems possible in principle to answer the following, which is also a test of our understanding of Mod g[L].
