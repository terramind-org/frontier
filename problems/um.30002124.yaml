id: um.30002124
title: Discrete Green Kernels, Escaping Geodesics, and Random Triangulations
field: mathematics
tier: prose
statement: |-
  Three independent questions are considered. First, under mild regularity assumptions on orthogonal dual planar graphs $\Gamma$ and $\Gamma^*$, can one prove the uniform asymptotics

  $$G(u;u_0)=\frac{1}{2\pi}\log|u-u_0|+O(1),\qquad K(v;z_0)=O(|v-z_0|^{-1})?$$

  Second, from every point of a metrically complete noncompact Euclidean cone surface with finitely many negatively curved cone singularities, is there a geodesic ray that avoids every singularity and escapes to infinity? Third, what is the typical graph diameter obtained by gluing two independent uniform triangulations of an $n$-gon, conjecturally $n^{1/4+o(1)}$?
