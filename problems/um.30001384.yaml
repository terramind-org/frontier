id: um.30001384
title: Positive-Definite Functions of Minkowski Functionals
field: mathematics
tier: prose
statement: Let $Y$ be a random variable. Call $X=(X_1,\ldots,X_n)$ an $n$-dimensional version of $Y$ if there is a positive function $\gamma$ on $\mathbb{R}^n\setminus\{0\}$ such that $\sum_i a_iX_i$ and $\gamma(a)Y$ have the same distribution for every $a\neq0$. Characterize all such versions and all possible functions $\gamma$. Equivalently, for an origin-symmetric star body $K$, characterize the continuous real-valued functions $f$ on the nonnegative real axis for which $f(\|\cdot\|_K)$ is positive definite, and characterize those $K$ for which the resulting function class is nontrivial.
