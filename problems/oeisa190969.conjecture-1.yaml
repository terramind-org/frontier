id: oeisa190969.conjecture-1
title: Linear recurrence $a(n) = 5a(n-1) - 8a(n-2)$ with $a(0)=0, a(1)=1$ (conjecture_1)
field: mathematics
tier: proof
statement: |-
  Conjecture: Let $S(p) := \sum_{k=0}^{p-1} a(4k) \binom{2k}{k}^3 / (-4096)^k$.
  Then $S(p) \equiv 0 \pmod{p^2}$ for every odd prime $p$.
  - _Zhi-Wei Sun_, Mar 13 2013
