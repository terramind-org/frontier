  definitions:
    - name: OeisA190969.sMod
      kind: def
      text: |-
        /--
        The modular sum $S(p) = \sum_{k=0}^{p-1} \frac{a(4k) \binom{2k}{k}^3}{(-4096)^k}$ evaluated in
        $\mathbb{Z}/p^m\mathbb{Z}$.
        -/
        def sMod (p m : ℕ) : ZMod (p ^ m) :=
          ∑ k ∈ Finset.range p,
            (a (4 * k) : ZMod (p ^ m)) * ((2 * k).choose k : ZMod (p ^ m)) ^ 3 *
              ((-4096 : ZMod (p ^ m)) ^ k)⁻¹
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/190969.lean#L59
