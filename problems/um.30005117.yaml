title: Petersen-Graph Counts in Sparse Pseudorandom Graphs
field: mathematics
tier: prose
statement: Let $G$ be an $n$-vertex, $C_4$-free graph with edge density $p\gtrsim n^{-1/2}$ such that $$|e_G(A,B)-p|A||B||=o(pn^2)$$ for all $A,B\subseteq[n]$. Is the number of copies of the Petersen graph in $G$, up to a constant factor, at least its expected number in $G(n,p)$?
