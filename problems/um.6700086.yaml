title: "Scalar Curvature Question [?90]: Hyperbolic Volume Inequality"
field: mathematics
tier: prose
statement: Conjecture. Hyperbolic Volume Inequality.Then every continuous mapf0∶X→X0 is homotopic to a mapf, such that voln(f(X)) ≤vol(X) where, moreover, this inequality can be made strict, unlessX has a constant negative curvature and the mapf0 is homotopic to a locally isometric map. Notice that ifX as well asX0 has constant sectional curvature -1, this conjecture, which generalisesthe Mostow’s rigidity theorem, is proved by evaluating the simplicial volumeof X. Recall thatsimpl.vol(X) is a non-negative numerical invariant of compact orientable topological manifoldsX such that continuous maps between equidimensional manifolds,X→Y of degreed, satisfy simpl.vol(X) ≥d⋅simpl.vol(Y ), withtheequality simpl.vol(X) =d⋅simpl.vol(Y ) ford-sheetedcoverings X→Y. The simplicial volume of anX is known to be non-zero ifX admits a metric with negative sectional curvatures.
