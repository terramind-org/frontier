statement: |-
  \section*{Pure-power Hilbert functions for complex Artinian complete intersections}\label{30006989}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If $I\subset C[x_{1},\dots ,x_{n}]$ is homogeneous and contains a regular sequence of degrees $2\leq a_{1}\leq \cdots \leq a_{n}$, does some homogeneous ideal J containing $x_{1}^{a_{1}},\dots ,x_{n}^{a_{n}}$ have the same quotient Hilbert function as I?
  \subsection{Short English statement}
  If $I\subset C[x_{1},\dots ,x_{n}]$ is homogeneous and contains a regular sequence of degrees $2\leq a_{1}\leq \cdots \leq a_{n}$, does some homogeneous ideal J containing $x_{1}^{a_{1}},\dots ,x_{n}^{a_{n}}$ have the same quotient Hilbert function as I?
