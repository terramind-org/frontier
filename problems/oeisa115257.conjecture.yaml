lean:
  module: FormalConjectures.OEIS.«115257»
  decl: OeisA115257.conjecture
  statement: |-
    theorem conjecture :
      ∀ (n : ℕ), 1 ≤ n → Irreducible (polyP n) ∧ Irreducible (polyQ n)
  context:
    - open OeisA115257
    - open Polynomial
  definitions:
    - name: OeisA115257.polyP
      kind: def
      text: |-
        def polyP (n : ℕ) : Polynomial ℚ :=
          (Finset.range (n + 1)).sum (fun k => C ((Nat.centralBinom k : ℚ) ^ 2) * X ^ k)

        /-- The polynomial $\sum_{k=0}^{n} \frac{\binom{2k}{k}^2}{k+1} x^k$ over $\mathbb{Q}$. -/
        noncomputable
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/115257.lean#L56
    - name: OeisA115257.polyQ
      kind: def
      text: |-
        def polyQ (n : ℕ) : Polynomial ℚ :=
          (Finset.range (n + 1)).sum (fun k => C (((Nat.centralBinom k : ℚ) ^ 2) / (k + 1 : ℚ)) * X ^ k)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/115257.lean#L61
