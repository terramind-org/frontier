title: Local finiteness before asymptotics
field: mathematics
tier: prose
statement: |-
  Come up with reasonable counting problems and analogues of geodesic currents.

  A possible counting problem is as follows. Fix a hyperbolic metric \(R\) on the blooming \(3\)--pod surface. Fix a curve \(\alpha\) and a basepoint \(x \in R\), then does there exists \(p(L)\) such that
  \[
  \frac{ | \phi(\alpha) : \ell_R(\phi(\alpha)) < L | }{p(L)} \simeq
  \text{Vol}(B_L(x))?
  \]
