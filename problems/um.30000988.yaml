id: um.30000988
title: Natural Boundaries of Polynomial Euler Products
field: mathematics
tier: prose
statement: Let $W(x,y)=\sum_{n,m}a_{n,m}x^ny^m$ be integral with $W(x,0)=1$, and define $D(s)=\prod_pW(p,p^{-s})$. Is $D$ meromorphically continuable to the whole plane iff it is a finite product of Riemann zeta-functions? Conjecturally, otherwise $\operatorname{Re}(s)=\beta$, where $\beta=\max\{(n+1)/m:a_{n,m}\neq0,\ m>0\}$, is its natural boundary.
