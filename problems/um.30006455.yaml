title: Moments of the Riemann Zeta Function
field: mathematics
tier: prose
statement: For every integer $k\geq1$, prove that there is an explicit polynomial $P_k$ of degree $k^2$ such that $\frac{1}{T}\int_0^T|\zeta(1/2+it)|^{2k}\,dt=P_k(\log T)+o(1)$ as $T\to\infty$.
