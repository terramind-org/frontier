statement: |-
  \section{Do any odd noncototients exist}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Euler's totient is $\varphi(n)=\#\{a\in\mathbb N:1\le a\le n,\ \gcd(a,n)=1\}$. A positive integer $m$ is a noncototient if $n-\varphi(n)\ne m$ for every $n\in\mathbb N$.
  \paragraph{Statement recorded in the supplied source.}
  Does there exist an odd positive integer $m$ such that $n-\varphi(n)\ne m$ for every $n\in\mathbb N$? \sref{statement}{2}
  \subsection{Short English statement}
  Can a positive odd integer fail to occur as the difference between a number and its totient?
