title: Inversion Monotonicity for 1324-Avoiding Permutations
field: mathematics
tier: prose
statement: Let $\operatorname{Av}_{n,k}(\tau)$ denote length-n permutations avoiding $\tau$ with exactly k inversions. For every n and k, is $|\operatorname{Av}_{n,k}(1324)|\le |\operatorname{Av}_{n+1,k}(1324)|$? Does the analogous inequality hold for $\operatorname{Av}_{n,k}(1324,231)$?
