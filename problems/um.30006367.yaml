title: The N-or-Infinity Conjecture for Reeb Pseudo-Rotations
field: mathematics
tier: prose
statement: Let $M$ be the smooth boundary of a star-shaped domain in $\mathbb R^{2n}$. If its Reeb flow has only finitely many prime closed orbits, must it have exactly $n$?
