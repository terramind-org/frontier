id: um.20000130
title: Weak finite-set interpolation on unirational surfaces
field: mathematics
tier: prose
statement: |-
  If \(X\) is separably rationally connected, there exists
  \(N(\dim X,\deg X,m)\) such that, for any
  \(p_1,\ldots,p_m\in X(\mathbb F_p)\), there exists a rational curve \(C\)
  defined over \(\mathbb F_{p^N}\) containing all \(p_i\). (due to Kollar)

  Can you do this without lifting the cardinality of field tend to \(\infty\)?

  Let \(X\) be a cubic surface over \(\mathbb F_q\).
  Can you find a rational curve defined over \(\mathbb F_q\) through each point?
