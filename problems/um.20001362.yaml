title: PCFness, specialization, and the Basilica boundary case
field: mathematics
tier: prose
statement: |-
  Take $f(z)\in\mathbb Q[z]$, assume $0$ is not periodic. Consider two groups
  \[
  G:=\lim_{n\to\infty}\operatorname{Gal}(f^n),\qquad
  G':=\lim\operatorname{Gal}(f^n(z)-t).
  \]

  **Recovered question.** How does postcritical finiteness of $f$ affect the finite-index comparison between the specialized iterated Galois group at the target $0$ and the generic iterated Galois group? How does this comparison control the prime-divisor question in Problem 1.1? Analyze the Basilica polynomial $f(z)=z^2-1$ first.
