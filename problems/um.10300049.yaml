title: Foliated Teichmüller theory — Question 11.3
field: mathematics
tier: prose
statement: |-
  Suppose $M$ is atoroidal and $\mathscr{F}$ arises from a slithering over $S^1$. Let $X$
  be pseudo–Anosov transverse to $\mathscr{F}$, such that the time $1$ flow $Z$ takes
  $\mathscr{F}$ to itself. Lift to $\widetilde{M}$ and let $\lambda, Z^n(\lambda)$ be leaves of $\widetilde{\mathscr{F}}$,
  both uniformized as $\mathbb{H}^2$ by Candel's theorem.
  Can $Z$ be approximated by mapping class elements between compact surfaces? That is,
  are there integers $n_i$, a sequence $\Sigma_i$ of hyperbolic surfaces and
  $\phi_i:\Sigma_i \to \Sigma_i$ Teichmüller representatives for the
  isotopy class $[\phi_i]$ such that the composition
  $$\widetilde{\phi_i^{-1}}Z^{n_i}:\mathbb{H}^2 \to \mathbb{H}^2$$
  is a $k_i$–quasi–isometry, where $k_i \to 1$?
