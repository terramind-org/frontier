title: Problem 3.1 — Study, systematically and with the help of computers, the finite quotients of Mg which do not factor through Sp (2g, Z).
field: mathematics
tier: prose
statement: "Study, systematically and with the help of computers, the finite quotients of Mg which do not factor through Sp (2g, Z). We remark that Problem 3.1 would simply have been impossible in the days before high-speed computers, but it is within reach now. A fairly simple set of defining relations for Mg,0,0 can be found in [ 52]. As for checking whether any homomophism so-obtained factors through Sp(2 g, Z), there is are two additional relations to check, namely the Dehn twist on a genus 1 separating curve for g≥ 2, and the Dehn twist on a genus 1 bounding pair (see [ 23]) for g≥ 3. One method of organization is to systematically study homomorphisms of Mg (maybe starting with g = 3) into the symmetric group Σ n, beginning with low values of n and gradually increasing n. One must check all possible images of the generators of Mg in Σ n, asking (for each choice) whether the defining relations in Mg and Sp(2 g, Z) are satisfied. Note that if one uses Dehn twists on non- separating curves as generators, then they must all be conjugate, which places a big restriction. There are additional restrictions that arise from the orders of various generating sets, for example in [ 7] it is proved that Mg is generated by 6 involutions. Of course, as one proceeds with such an investigation, tools will present themselves and the calculation will organize itself, willy-nilly. We do not mean to suggest that non-finite quotients are without interest, so for completeness we pose a related problem:"
