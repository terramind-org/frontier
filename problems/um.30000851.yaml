title: Graded Dimensions of Tautological Rings of General Curves
field: mathematics
tier: prose
statement: For a general curve $C$ of genus $g$, does the tautological ring $R$ satisfy $\dim_{\mathbb Q}R=p(g+1)$ and $\dim R^i_{(j)}=p(i,g+1-i,j)$, where $p(i,g+1-i,j)$ counts partitions of $i$ with $i-j$ parts, all at most $g+1-i$?
