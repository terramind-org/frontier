title: Generating Sets Realizing Minimal Growth
field: mathematics
tier: prose
statement: Let $G=F_n\rtimes_\phi\mathbb Z$ be a free-by-cyclic group, and let $\xi(G)=\{e(G,X):X\text{ is a finite generating set of }G\}$. Characterize the finite generating sets $X$ for which $e(G,X)=\min\xi(G)$.
