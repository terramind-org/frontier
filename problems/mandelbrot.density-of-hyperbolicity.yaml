lean:
  module: FormalConjectures.Wikipedia.Mandelbrot
  decl: Mandelbrot.density_of_hyperbolicity
  statement: |-
    theorem density_of_hyperbolicity :
        mandelbrotSet ⊆ closure {c | ∃ m z, IsAttractingCycle (fun z ↦ z ^ 2 + c) m z}
  context:
    - open Mandelbrot
    - open Topology Set Function Filter Bornology Metric MeasureTheory
  definitions:
    - name: Mandelbrot.mandelbrotSet
      kind: abbrev
      text: |-
        /-- The Mandelbrot set is the special case of the multibrot set for n = 2. In other words, it is the
        set of all parameters `c : ℂ` for which `0` does not escape to infinity under repeated application
        of `z ↦ z ^ 2 + c`. -/
        abbrev mandelbrotSet := multibrotSet 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/Mandelbrot.lean#L46
    - name: Mandelbrot.IsAttractingCycle
      kind: def
      text: |-
        /-- We say that `z : ℂ` is part of an attracting cycle of period `n` of `f : ℂ → ℂ` if it is an
        `n`-periodic point (i.e. `f^[n] z = z`), `f^[n]` is differentiable at `z`, `‖deriv f^[n] z‖` is
        strictly less than one, and `n > 0`. -/
        def IsAttractingCycle (f : ℂ → ℂ) (n : ℕ) (z : ℂ) : Prop :=
          (0 < n) ∧ f.IsPeriodicPt n z ∧ DifferentiableAt ℂ f^[n] z ∧ ‖deriv f^[n] z‖ < 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/Mandelbrot.lean#L121
