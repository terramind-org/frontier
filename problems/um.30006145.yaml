title: Conditions Forcing Long Induced Paths
field: mathematics
tier: prose
statement: For a graph class $\mathcal{G}$, let $f_{\mathcal{G}}(n)$ be the maximum integer $k$ such that every member of $\mathcal{G}$ containing an $n$-vertex path also contains an induced $k$-vertex path. What natural conditions on $\mathcal{G}$ ensure that $f_{\mathcal{G}}(n)\to\infty$?
