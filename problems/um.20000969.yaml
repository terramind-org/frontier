title: A quotient-root formula for every parking/toppling Betti number
field: mathematics
tier: prose
statement: |-
  **Sam Hopkins.** “This question concerns a recent preprint of Venkatesh and Viswanath [34], which shows that for a finite graph \(G\) on \(n\) vertices, the dimension of the root space associated to the root that is the sum of all simple roots in the Kac–Moody algebra having Cartan matrix \(2I_n-A(G)\) is the number of maximal \(G\)-parking functions. (Here \(A(G)\) is the adjacency matrix of \(G\).) Can this be exploited further? Are all \(G\)-parking functions present somewhere? Does the sandpile group act on some such root space?”

  (a) **Sam Hopkins.** “I should also mention that there is a natural labeling of a basis of this root space by maximal parking functions.”

  (b) **Anton Dochtermann.** “The number of maximal parking functions is also the number of last syzygies in a minimal free resolution of the toppling ideal, and also the number of chambers of a certain slice of the graphic arrangement. Can we connect the Lie theory to commutative algebra or hyperplane arrangements?”
