title: Ultraproduct II_1 Factors — Problem 49
field: mathematics
tier: prose
statement: Suppose $I,J$ are finite sets, and $\{N_i\}_{i\in I}, \{M_j\}_{j\in J}$ are separable II$_1$ factors such that $*_{i\in I}N_i^\mathcal{U}\cong *_{j\in J}M_j^\mathcal{U}$, then is $I\cong J$ and the factors are mutually elementarily equivalent up to permutation?
