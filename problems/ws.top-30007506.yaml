  \section*{Pure cosmetic surgery for knots in the three-sphere}\label{30007506}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If K is a nontrivial smooth knot in $S^{3}$ and Dehn fillings along slopes r and s are orientation-preservingly homeomorphic, must $r=s$?
  \subsection{Short English statement}
  If K is a nontrivial smooth knot in $S^{3}$ and Dehn fillings along slopes r and s are orientation-preservingly homeomorphic, must $r=s$?
