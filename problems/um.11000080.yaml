title: Question 7.4 — Is there a unique (up to conjugacy) minimal dilation pseudo-Anosov in Modg?
field: mathematics
tier: prose
statement: Is there a unique (up to conjugacy) minimal dilation pseudo-Anosov in Modg? Note that this is true for g = 1; the unique minimum is realized by the conjugacy class of the matrix ( 2 1 1 1 ). Here is a natural refinement of the problem of finding L(Modg). Fix a genus g. Fix a possible r-tuple ( k1,...,k r) of singularity data for Σ g. By this we mean to consider possible foliations withr singularities with k1,...,k r prongs, respectively. For a fixed g, there are only finitely many possible tuples, as governed by the Poincare-Hopf index theorem. Masur-Smillie [ MS] proved that, for every admissible tuple, there is some pseudo-Anosov on Σ g with stable foliation having the given singularity data. Hence the following makes sense. 2. Some problems on mapping class groups and moduli space 51
