  \section{The Dirac-Brown invariant-subspace problem: a defect-attainment reduction}\label{20002687}
  {\small UnsolvedMath ID 20002687 · Probability}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $\Gamma$ be a type $\mathrm{II}_1$ factor with faithful trace $\tau$, and let $T\in\Gamma$ have Brown measure $\mu_T=\delta_0$. Must there exist a projection $P\in\Gamma$, $0<P<1$, whose range is invariant under $T$, equivalently $(1-P)TP=0$?
  \par\smallskip\textit{Formulation references:} \sref{20002687}{1}, \sref{20002687}{2}.
  \subsection{Short English statement}
  Let $\Gamma$ be a type $\mathrm{II}_1$ factor with faithful trace $\tau$, and let $T\in\Gamma$ have Brown measure $\mu_T=\delta_0$. Must there exist a projection $P\in\Gamma$, $0<P<1$, whose range is invariant under $T$, equivalently $(1-P)TP=0$?
