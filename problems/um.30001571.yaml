title: Almost Aleph-One-Categoricity of Compact Kähler Spaces
field: mathematics
tier: prose
statement: Is the first-order theory of the many-sorted structure formed by compact complex spaces of Kähler type almost $\aleph_1$-categorical, in the sense that it is stable and nonmultidimensional and every $U$-rank-one type is nonorthogonal to a Morley-rank-one type?
