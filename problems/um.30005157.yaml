title: Uniform Intermediate-Norm Square-Function Estimates
field: mathematics
tier: prose
statement: |-
  For the moment curve in dimension two, let $E$ be the Fourier extension operator and let $\mathcal I(\delta)$ partition the parameter interval into intervals of length $\delta$. Does there exist some $2<p<4$ and a constant $C_p$, independent of $\delta$, such that

  $$\|Ef\|_{L^p(B_{\delta^{-2}})}\leq C_p\left\|\left(\sum_{I\in\mathcal I(\delta)}|E_If|^2\right)^{1/2}\right\|_{L^p(w_{B_{\delta^{-2}}})}?$$

  Equivalently, can the logarithmic losses in the known estimates be removed?
