title: An exact quantitative shadow-system model
field: mathematics
tier: prose
statement: |-
  2. (S. Reisner) Quantify the shadow movement theorem (see [MR]).

  **22. (S. Reisner) Quantify the shadow movement theorem (see [MR]).**

  Here [MR] is Meyer and Reisner, *Shadow systems and volumes of polar convex bodies*. Their Theorem 1 is the precise qualitative theorem meant by the AIM question: if `(K_t)_{t in I}` is a nondegenerate shadow system, then

  \[
   F(t):=|K_t^*|^{-1}
  \]

  is convex. The star denotes polarity about the Santaló point, not polarity about a fixed origin in general. The AIM phrase "shadow movement theorem" is informal; it is not the title of a theorem in [MR].

  This report interprets "quantify" as asking for a positive lower bound on a Jensen deficit, after normalizing the shadow speed and removing the affine equality directions. It gives an exact nontrivial model calculation and explains why those qualifications are unavoidable. It does **not** claim a general quantitative Meyer--Reisner theorem.
