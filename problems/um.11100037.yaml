title: Axiomatic stable homotopy 5 — John Palmieri has determined the E_2 term of the Adams spectral sequence up to nilpotence--at least he…
field: mathematics
tier: prose
statement: John Palmieri has determined the E_2 term of the Adams spectral sequence up to nilpotence--at least he has found a computable ring which is f-isomorphic to the E_2 term. I think this is only at p=2. Will his methods work in other specific non-Noetherian stable homotopy categories? Haynes Miller suggested trying to use John's methods to calculate group cohomology of GL(infinity) up to f-isomorphism.
