title: Imaginary-Axis Geodesics in Period-Matrix Loci
field: mathematics
tier: prose
statement: In the universal Teichmüller space $T(1)$, let $H^+(U)$ denote the period-matrix locus in the Siegel upper half-space associated to the unitary-type subspace $U$. Is the imaginary axis in $H^+(U)$ the image under the period mapping of a Teichmüller geodesic?
