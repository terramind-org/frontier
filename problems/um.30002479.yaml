id: um.30002479
title: Strong Invariant Universality at Singular Cardinals
field: mathematics
tier: prose
statement: For generalized trees of size $\kappa$, is $\kappa^\kappa=\kappa$ necessary for embeddability to be strongly invariantly universal among $\kappa$-analytic quasi-orders? For singular $\kappa$, what is the descriptive-set-theoretic complexity of embeddability on $\operatorname{Mod}_\kappa(\varphi)$, and can it consistently be strongly invariantly universal? Can generalized trees be replaced by linear orders or groups while preserving strong invariant universality?
