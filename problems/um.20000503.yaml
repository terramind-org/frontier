id: um.20000503
title: The Pólya–Szegő buckling conjecture and a radial projection gap on balls
field: mathematics
tier: prose
statement: |-
  Let \(\Omega\subset\mathbb R^2\) be a bounded domain and let \(\Lambda _1(\Omega)\) be the lowest eigenvalue of
  \[
  \Delta^2u+\Lambda _1(\Omega)\Delta u=0\quad\hbox{in }\Omega,
  \qquad u=\partial_\nu u=0\quad\hbox{on }\partial\Omega.
  \]
  Prove that \(\Lambda _1(\Omega)\) is minimized by the disk among all simply connected sets of equal area.
