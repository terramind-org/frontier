id: um.30005433
title: Finiteness and Goodness for Property-S Skew Braces
field: mathematics
tier: prose
statement: Let $B=(B,+,\circ)$ be a skew brace, write $a*b=-a+a\circ b-b$, and define $$\operatorname{Fix}^r(x)=\{b\in B:x*b=0\},\qquad \operatorname{Fix}^l(x)=\{b\in B:b*x=0\}.$$ Say that $B$ has property $(S)$ when, for every $x\in B$, both $$[(B,+):\operatorname{Fix}^r(x)\cap C_x^+]\quad\text{and}\quad[(B,\circ):\operatorname{Fix}^l(x)\cap C_x^\circ]$$ are finite, where $C_x^+$ and $C_x^\circ$ are the centralizers of $x$ in the two groups. Is every finitely generated ideal of such a $B$ finite? If an ideal $I$ is called good when every finitely generated ideal $J\subseteq I$ is finitely generated as a skew brace, is every skew brace with property $(S)$ good?
