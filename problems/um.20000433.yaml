title: Height-window bounds and modern status for random hypersurface solubility
field: mathematics
tier: prose
statement: |-
  \[
  \mathcal F_{d,n}(H)=\{f\in\mathbb Z[x_0,\ldots,x_n]_d:\max_I |a_I|\le H\},
  \qquad m=\binom{n+d}{d},
  \]

  where \(f=\sum_Ia_Ix^I\) is homogeneous of degree \(d\). Then

  \[
  N_{\rm tot}(H)=\#\mathcal F_{d,n}(H)=(2\lfloor H\rfloor+1)^m,
  \]

  \(N(H)\) counts the members having a nonzero integral zero (equivalently a rational point on \(f=0\subset\mathbb P^n\)), and \(N_{\rm loc}(H)\) counts those having a point over every completion of \(\mathbb Q\).

  1. If \(d>n+1\), does \(N(H)/N_{\rm tot}(H)\to0\), and does this follow from Lang's conjectures?
  2. Is \(N_{\rm loc}(H)/N_{\rm tot}(H)\) bounded below by a positive constant?
  3. For a random plane cubic, how likely is a rational point?
  4. For cubic surfaces, and more generally in the Fano range \(d\le n\), is
     \[
     \frac{N(H)}{N_{\rm tot}(H)}\sim
     \frac{N_{\rm loc}(H)}{N_{\rm tot}(H)}?
     \]

  The PDF literally says "max coefficient". This reconstruction is verified by the definitions in Poonen--Voloch, the update linked from the AIM record. Their paper also makes precise that counting primitive equations or projective hypersurfaces instead of all integral equations does not alter the limiting ratios.
