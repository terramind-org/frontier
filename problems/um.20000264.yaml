title: Divisorial finite generation, Q-Cartierizations, and a two-ray reduction
field: mathematics
tier: prose
statement: |-
  Suppose that \(X\) is an \(F\)-regular variety (maybe not
  \(\mathbb Q\)-Gorenstein). If \(D\) is a Weil divisor, must
  \(\bigoplus_{m\geq 0}\mathcal O_X(mD)\) be finitely generated?
