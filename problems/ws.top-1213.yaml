  \item[\hypertarget{source:1213:2}{S2}] Andrii Arman, Andriy Bondarenko and Andriy Prymak, \emph{On Hadwiger\textquotesingle s covering problem in small dimensions}, arXiv:2404.00547v1 (2024), Section 1. \url{https://arxiv.org/pdf/2404.00547}.
  \end{description}
