lean:
  module: FormalConjectures.ErdosProblems.«272»
  decl: Erdos272.erdos_272.variants.szabo_strong
  statement: |-
    theorem erdos_272.variants.szabo_strong :
        (fun N ↦ (maxArithInterCard N - N ^ 2 / 2 : ℝ)) =O[atTop] fun N : ℕ ↦ (N : ℝ)
  context:
    - open Erdos272
    - open Erdos272.erdos_272
    - open Erdos272.erdos_272.variants
    - open Filter Asymptotics Finset
  definitions:
    - name: Erdos272.maxArithInterCard
      kind: def
      text: |-
        /-- For each $N > 0$, let $t$ be the largest size of an arithmetic
        intersection set. -/
        noncomputable def maxArithInterCard (N : ℕ) : ℕ :=
          sSup {#A | (A : _) (_ : IsArithInterSet N A)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/272.lean#L40
