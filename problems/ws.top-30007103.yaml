statement: |-
  \section*{Sharp logarithmic exponents for fixed off-diagonal Ramsey numbers}\label{30007103}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every fixed integer $s>=5$ and every $\epsilon >0$, is r(s,t) bounded below by $t^{s-1}/(\log $ $t)^{s-2+\epsilon }$ for all sufficiently large t and above by $C_s$ $t^{s-1}/(\log $ $t)^{s-2}$, for a constant $C_s$ depending only on s?
  \subsection{Short English statement}
  For every fixed integer $s>=5$ and every $\epsilon >0$, is r(s,t) bounded below by $t^{s-1}/(\log $ $t)^{s-2+\epsilon }$ for all sufficiently large t and above by $C_s$ $t^{s-1}/(\log $ $t)^{s-2}$, for a constant $C_s$ depending only on s?
