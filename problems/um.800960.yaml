title: Open Problems and Questions about Geodesics — Problem 41
field: mathematics
tier: prose
statement: |-
  Moreover, the Finsler metrics satisfying (i) necessary admit a Killing vector field and are quite well understood. Applying the Zermelo transformation to such metrics (see e.g. [Fou-Mat2018]), one obtains non-Zoll metrics satisfying (ii). Moreover, any such metric (of flag curvature $1$ on $S^2$ and satisfying (ii)) admitting a Killing vector field can be obtained by this procedure. Unfortunately, no other examples of non-Zoll metrics satisfying (ii) are known.

  *Construct examples of Finsler metrics of constant curvature on $S^2$ that are not Zoll and such that they admit no Killing vector field. *
