title: Exceptional Rational Directions of Zero-Entropy Finsler Tori
field: mathematics
tier: prose
statement: For a zero-topological-entropy Finsler metric on $T^2$, let $E_\xi$ be the set of nonminimal geodesics having rational asymptotic direction $\xi$. Does some rational $\xi$ satisfy $E_\xi=\varnothing$? Is $\{\xi\in S^1:\xi\text{ is rational and }E_\xi\neq\varnothing\}$ finite?
