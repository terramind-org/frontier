title: "Curve-orbit limits: an exact no-escape and uniqueness criterion"
field: mathematics
tier: prose
statement: |-
  This was proposed as an "easier version" of the previous problem.

  Given an (irreducible) big mapping class \(f\) and a simple closed curve
  \(\alpha\), do \(f^n(\alpha)\) and \(f^{-n}(\alpha)\) converge to a
  lamination?

  The exact AIM record asks:

  Source: AIM workshop *Surfaces of infinite type*, section “Classification
  of elements of big mapping class groups,” Problem 1.3
  (AIM-TOPOLOGY-0139, source index 138).

  The preceding record, Problem 1.1, supplies the workshop's provisional
  meaning of reducibility: a big mapping class is reducible when it preserves
  a possibly infinite discrete collection of pairwise disjoint essential
  simple closed curves and proper arcs, where discrete means no accumulation
  inside the surface.

  1. whether curves are replaced by geodesic representatives;
  2. which topology is meant by “converge”;
  3. whether an empty lamination is allowed.

  This report uses the standard geodesic reading made explicit by Bestvina,
  Fanoni, and Tao: \(S\) carries a complete first-kind hyperbolic metric
  \(m\) (no funnels or half-planes), each curve is replaced by its
  \(m\)-geodesic representative, and convergence is local
  Hausdorff/Chabauty--Fell convergence on finite-type compact windows. A
  “limit lamination” below is required to be nonempty. With the convention
  that the empty set is a lamination, an orbit escaping every compact set
  would otherwise give a vacuous affirmative example.
