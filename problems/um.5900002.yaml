title: Standard k-Bubble Conjectures
field: mathematics
tier: prose
statement: For $k\leq n+1$ and prescribed volumes in $\mathbb{R}^n$, prove that the standard $k$-bubble is uniquely area-minimizing. For $n=3$, are standard clusters the only strictly stable $k$-bubbles for $k\leq4$? Is there a strictly stable six-bubble cluster with a nonspherical interface but no such cluster with fewer bubbles?
