title: Geometric 1-motives versus integral Jacobian splittings
field: mathematics
tier: prose
statement: |-
  (a) Let \(K\) be an algebraically closed field, \(X/K\) an abelian variety. The Voevodsky motive \(F\) is given as a sheaf of groups \(F(S)=\operatorname{Mor}_K(S,X)\). Is \(F\) geometric (i.e. in the triangulated subcategory generated by smooth projective varieties)?

  (b) (This is a stronger variant of (a)): Is every principally polarized abelian variety a direct summand of a Jacobian integrally (as an abelian variety)?
