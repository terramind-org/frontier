title: A non-Morse obstruction certificate and the contact sphere
field: mathematics
tier: prose
statement: |-
  Question 5.8 (E. Lerman) Can we prove Kirwan surjectivity without Morse theory? The motivation for this question comes from the fact that two fundamental results in the theory of symplectic moment maps - connectedness and convexity, which were originally proved using Morse theory have an alternative proof [CDM88]. This alternative approach works well in the contact setting (equivalently in the setting of symplectic cones) where Morse theory fails. The reasons for the failure in the contact setting are due to the fact are that the contact moment maps are not Morse and that there is no relationship between critical points and isotropy groups. In the equivalent setting of symplectic cones the moment maps are not proper.

