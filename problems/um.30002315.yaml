title: Strict Graph-Invariant Bounds and Farber-Chain Rank Gradients
field: mathematics
tier: prose
statement: |-
  Let $\mathcal G=(G_n)$ be a sequence of connected graphs of uniformly bounded degree. For a field $K$, let $C_K(G)$ be the cycle space of $G$, let $C_K^q(G)$ be the subspace generated by cycles of length less than $q$, and define

  $$s_K^q(\mathcal G)=\liminf_{n\to\infty}\frac{|E(G_n)|-\dim_K C_K^q(G_n)-|V(G_n)|}{|V(G_n)|},\qquad \beta_K(\mathcal G)=\inf_q s_K^q(\mathcal G).$$

  Can either known inequality $\beta_{\mathbb Q}(\mathcal G)\geq\beta_{\mathbb F_p}(\mathcal G)$ or $\beta_K(\mathcal G)+1\leq c(\mathcal G)$ be strict for some graph sequence, where $c(\mathcal G)$ is its combinatorial cost? If $\Gamma$ is finitely generated and residually finite, does the rank gradient associated with a Farber chain of normal finite-index subgroups depend on the chain, or only on $\Gamma$?
