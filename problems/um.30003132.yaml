id: um.30003132
title: Three-Event Correlation Inequalities in Product Spaces
field: mathematics
tier: prose
statement: |-
  Characterize the realizable joint probabilities of three increasing events $A,B,C$ in a finite product probability space. In particular, is
  $$
  2\mathbb P(A\cap B\cap C)-\mathbb P(A\cap B)\mathbb P(C)-\mathbb P(A\cap C)\mathbb P(B)-\mathbb P(B\cap C)\mathbb P(A)+\mathbb P(A)\mathbb P(B)\mathbb P(C)\geq0
  $$
  always true?
