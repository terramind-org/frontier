title: Open Problems in Wavelet Theory — Problem 10
field: mathematics
tier: prose
statement: |-
  Does Calder\'on's formula
  \begin{equation}
  \sum_{j\in{\mathbb{Z}}} |\hat \psi((A^T)^j \xi)|^2=1 \qquad\text{for a.e. }\xi \in \mathbb{R}^n
  \end{equation}
  hold for any orthonormal (or Parseval) wavelet $\psi$ associated with $(A,\Gamma)$?
