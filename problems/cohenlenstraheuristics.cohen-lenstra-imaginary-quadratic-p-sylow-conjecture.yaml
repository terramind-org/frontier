lean:
  module: FormalConjectures.Wikipedia.CohenLenstraHeuristics
  decl: CohenLenstraHeuristics.cohen_lenstra_imaginary_quadratic_p_sylow_conjecture
  statement: |-
    theorem cohen_lenstra_imaginary_quadratic_p_sylow_conjecture (p : ℕ) [Fact p.Prime] (hp : p ≠ 2)
        (G : Type*) [CommGroup G] [Fintype G] (hG : IsPGroup p G) :
        Filter.Tendsto
          (fun X : ℕ =>
            (((imagQuadRadicandsUpTo X).filter (HasQuadPSylowIso p G)).card : ℝ) /
              ((imagQuadRadicandsUpTo X).card : ℝ))
          Filter.atTop (nhds (cohenLenstraWeight p 0 G))
  context:
    - open CohenLenstraHeuristics
    - open NumberField
    - open scoped NumberField
    - open scoped Classical
  definitions:
    - name: CohenLenstraHeuristics.imagQuadRadicandsUpTo
      kind: def
      text: |-
        /-- Negative squarefree radicands $d < 0$ with $|D(d)| \le X$. -/
        noncomputable def imagQuadRadicandsUpTo (X : ℕ) : Finset ℤ :=
          (Finset.Icc (-(X : ℤ)) (-1)).filter (fun d => Squarefree d ∧ (quadFundDisc d).natAbs ≤ X)
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/CohenLenstraHeuristics.lean#L51
    - name: CohenLenstraHeuristics.HasQuadPSylowIso
      kind: def
      text: |-
        /-- Predicate that $d \ne 1$ is squarefree and the $p$-Sylow subgroup of
        $\operatorname{Cl}(\mathcal{O}_{\mathbb{Q}(\sqrt{d})})$ is isomorphic to $G$. -/
        def HasQuadPSylowIso (p : ℕ) (G : Type*) [CommGroup G] (d : ℤ) : Prop :=
          ∃ (hsf : Squarefree d) (hne : d ≠ 1),
            letI : Fact (Squarefree d) := ⟨hsf⟩
            letI : Fact (d ≠ 1) := ⟨hne⟩
            ∃ P : Sylow p (ClassGroup (𝓞 (QuadraticAlgebra ℚ d 0))), Nonempty (P ≃* G)
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/CohenLenstraHeuristics.lean#L60
    - name: CohenLenstraHeuristics.cohenLenstraWeight
      kind: def
      text: |-
        /-- Cohen–Lenstra $p$-Sylow probability weight
        $w_{p, u}(G) = \frac{\prod_{k=1}^\infty (1 - p^{-(k+u)})}{|G|^u \cdot |\operatorname{Aut}(G)|}$
        at unit rank $u$ ($u = 0$ in the imaginary case, $u = 1$ in the real case). -/
        noncomputable def cohenLenstraWeight (p u : ℕ) (G : Type*) [CommGroup G] [Finite G] : ℝ :=
          (∏' k : ℕ, (1 - (p : ℝ) ^ (-((k + u + 1 : ℕ) : ℤ)))) /
            (((Nat.card G) ^ u * Nat.card (G ≃* G) : ℕ) : ℝ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/CohenLenstraHeuristics.lean#L68
