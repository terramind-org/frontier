  \section{Homogeneity of Fano Contact Manifolds}\label{30002442}
  {\small UnsolvedMath ID 30002442 · Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Must every smooth Fano contact manifold be homogeneous? Fano means that the anticanonical bundle is ample; a contact structure is a maximally nonintegrable holomorphic hyperplane distribution. Homogeneous means that a complex algebraic group acts transitively.
  \par\smallskip\textit{Formulation references:} \sref{30002442}{1}, \sref{30002442}{2}.
  \subsection{Short English statement}
  Must every smooth Fano contact manifold be homogeneous? Fano means that the anticanonical bundle is ample; a contact structure is a maximally nonintegrable holomorphic hyperplane distribution. Homogeneous means that a complex algebraic group acts transitively.
