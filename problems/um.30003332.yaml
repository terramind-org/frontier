title: Enumeration and Structure of Higher-Dimensional Permutations
field: mathematics
tier: prose
statement: |-
  A $d$-dimensional permutation of order $n$ is a $\{0,1\}$-valued array on $[n]^{d+1}$ with exactly one entry equal to $1$ on every axis-parallel line. For each fixed $d\geq3$, is the number of such arrays
  $$
  \left((1+o(1))\frac{n}{e^d}\right)^{n^d}
  $$
  as $n\to\infty$?
