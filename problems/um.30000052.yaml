title: Expected Discrepancy of Generalized Lattice Point Sets
field: mathematics
tier: prose
statement: For even $p$, let $M_n^{z,\Delta}=\{jz+\Delta\pmod 1:0\leq j<n\}$ with $z,\Delta\in[0,1]^d$. Is $\mathbb E_{z,\Delta}[\operatorname{disc}_p^p(M_n^{z,\Delta})]\leq\mathbb E[\operatorname{disc}_p^p(M_n)]$ for $n$ independent uniformly distributed points $M_n$?
