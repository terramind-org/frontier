title: Virtual-knot problem 26 — surface arrow invariant
field: mathematics
tier: prose
statement: |-
  The arrow polynomial generalizes to a more powerful invariant of
  virtual knots by defining a version of it for knots in specific
  thickened surfaces. The arrow polynomial for a knot in a thickened
  surface has state variables that take into account the isotopy class
  of the state curve and its arrow number as well. This gives a very
  strong invariant of knots in thickened surfaces and it can be
  applied to virtual knots by using a minimal surface representative
  for the virtual knot. Investigating this surface arrow
  invariant generalizes previous work on the surface bracket
  polynomial .
