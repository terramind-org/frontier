title: Sharp Reinforcement Thresholds for Tree and Whisker Components
field: mathematics
tier: prose
statement: For supercritical reinforcement, improve the threshold $\alpha>2$ guaranteeing that every surviving connected component is a tree, and the threshold $\alpha>25$ guaranteeing, under $p(v)=1$, that every component is a whisker. Is $\alpha>4/3$ sharp for both conclusions?
