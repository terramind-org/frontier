title: 10 Lectures and 42 Open Problems — Tightness of k-median LP
field: mathematics
tier: prose
statement: "The **$k$-median** problem admits a natural **Linear Programming (LP)** relaxation (the facility-location-type LP with variables indicating whether a point is opened as a center / assigned to a center). Is the **$k$-median LP tight** — i.e., does its integrality gap equal $1$ and its optimum recover an integral $k$-median solution — even for point clouds sampled from **generative models that do not have a community (cluster) structure**? (The motivation is the SBM-tightness style of analysis: for data coming from mixture models, e.g. over many well-separated clusters $\\le k$, the LP/SDP is often tight w.h.p.; here the question is whether tightness extends to non-cluster generative models.)"
