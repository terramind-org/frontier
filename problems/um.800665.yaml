title: Selection Principles Milestone Problems — Problem 38 ([SchLuzin, Problem 4])
field: mathematics
tier: prose
statement: |-
  Recall that $\mathcal{K}$ is the collection of families $\mathcal{U}$ of open sets such that $\{\overline{U}:U\in\mathcal{U}\}$
  is a cover of $X$. Let $\mathcal{K}_\Omega$ be the collection of all $\mathcal{U}\in\mathcal{K}$
  such that no element of $\mathcal{U}$ is dense in $X$, and for each
  finite $F\subseteq X$, there exists $U\in\mathcal{U}$ such that
  $F\subseteq\overline{U}$.
  In [SchLuzin] it is proved that
  $X$ satisfies $\mathcal{K}_\Omega\rightarrow(\mathcal{K})^2_2$, then $X$ is a Luzin set.

  Does the partition relation $\mathcal{K}_\Omega\rightarrow(\mathcal{K})^2_2$ characterize
  Luzin sets?
