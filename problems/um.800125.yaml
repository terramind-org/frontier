title: |-
  Foliations and Diffeomorphism Groups — Question 66 (E. Ghys, appendix to
  [molino1988riemannian])
field: mathematics
tier: prose
statement: |-
  This amounts to asking if
  any (framed)
  Haefliger structure whose microfoliation has
  the zero section as a leaf is homotopically trivial.
  Tsuboi answered positively for $q=1$.

  \

  i) Is every codimension-$q$ Riemannian
  foliation homotopically trivial in $B\Gamma_q$ ?

  ii) Is every codimension-$q$ Lie
  foliation homotopically trivial in $B\bar\Gamma_q$ ?
