title: Separation Between Higher Graph Equivalence Levels
field: mathematics
tier: prose
statement: If graphs $H,H'$ are $2$-equivalent, must they be $3$-equivalent? More generally, can two graphs be $100$-equivalent but not $101$-equivalent? Why do the known pairs that are $3$-equivalent but not $2$-equivalent include a disconnected graph?
