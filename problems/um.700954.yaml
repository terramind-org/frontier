title: Kourovka Notebook Problem 13.36
field: mathematics
tier: prose
statement: |-
  For a finitely generated pro-$p
  $-group $G$ set $a_n(G)=\mathrm{dim}_{ {\mathbb{F}_p}I^n/I^{n+1}$,
  where $I$ is the augmentation ideal of the group ring
  ${\mathbb{F}_p[[G]]$.
  We define the *growth* of $G$ to be the growth of the
  sequence
  $\{ a_n(G)\} _{n\in {\mathbb{N}}$.

  a) If the growth of $G$ is exponential, does it
  follow that $G$ contains a free pro-$p
  $-subgroup of
  rank
  2?

  c) Do there exist pro-$p
  $-groups of
  finite cohomological dimension which are not $p
  $-adic
  analytic, and whose growth is slower than an exponential one?

  [Archived solved part(s) of 13.36:]
  b) (A. Lubotzky,
  A. Shalev). For a finitely generated pro-$p
  $-group $G$ set $a_n(G)=\mathrm{dim}_{ {\mathbb{F}_p}I^n/I^{n+1}$,
  where $I$ is the augmentation ideal of the group ring
  ${\mathbb{F}_p[[G]]$.
  We define the *growth* of $G$ to be the growth of the
  sequence
  $\{ a_n(G)\} _{n\in {\mathbb{N}}$.
  Is the growth of $G$
  exponential if $G$ contains a finitely generated closed
  subgroup of exponential growth?
