title: The Lyapin's Notebook — Problem 27
field: mathematics
tier: prose
statement: |-
  (G. Mashevitzky)

  - Describe transformation semigroups that are closed in the pointwise topology.

  - Describe endomorphism semigroups that are closed in a topology of Zarisky type.

  Motivation and definitions can be found in [Cameron], [Mash1], [MPP], [Mash2]. Transformation semigroups closed in the pointwise topology are precisely the semigroups of endomorphisms of mathematical structures (see [Mash2]). It was shown in [Mash1] that the Zariski-type topology is weaker than the pointwise topology and conditions were obtained under which these topologies coincide. Several special cases of the problem were solved in [Mash2].
