title: A point-critical entropy-carrier obstruction to smooth integrability
field: mathematics
tier: prose
statement: |-
  **Question 10.1.1 (Bangert).** Does there exist a Riemannian metric on a closed surface of genus \(\geq 2\) whose geodesic flow is completely integrable?

  The answer may depend on what we understand by “completely integrable”: whether the integral is functionally independent of the Hamiltonian on an open everywhere dense subset, or we additionally assume that the subset has full measure.
