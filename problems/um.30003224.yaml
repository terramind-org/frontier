title: Mond's Conjecture for Finite Map Germs
field: mathematics
tier: prose
statement: For an $\mathcal A$-finite map germ $f:(\mathbb C^n,S)\to(\mathbb C^{n+1},0)$ in nice dimensions, is the $\mathcal A_e$-codimension of $f$ at most its image Milnor number $\mu_I(f)$, with equality when $f$ is weighted homogeneous?
