  module: FormalConjectures.OEIS.«227923»
  decl: OeisA227923.conjecture_4
  statement: |-
    theorem conjecture_4 (n : ℕ) (hn : n > 1) :
        ∃ x y : ℕ, 0 < x ∧ 0 < y ∧ x + y = n ∧
          (6 * x - 1).Prime ∧ (12 * x - 1).Prime ∧
          (6 * y - 1).Prime ∧ (6 * y + 5).Prime
