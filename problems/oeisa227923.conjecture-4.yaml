id: oeisa227923.conjecture-4
title: Representations using Sophie Germain primes and twin prime pairs (conjecture_4)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii), sexy prime variant: Any integer $n > 1$ can be written as $x + y$
  ($x, y > 0$) such that $6x - 1$ is a Sophie Germain prime and $\{6y - 1, 6y + 5\}$ is a
  sexy prime pair.
