title: Isomorphism and Commensurability of Panel-Regular Building Lattices
field: mathematics
tier: prose
statement: Given the combinatorial data used to construct panel-regular lattices in buildings of type $\widetilde{A}_2$ and $\widetilde{C}_2$, can two different data sets produce isomorphic buildings or commensurable lattices? It is also open whether the corresponding buildings are classical or exotic.
