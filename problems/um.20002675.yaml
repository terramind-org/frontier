title: Smooth-witness and semicircular-attractor obstructions to free strong unimodality
field: mathematics
tier: prose
statement: What are examples or conditions for freely strongly unimodal variables, meaning unimodal random variables whose free additive convolution with every unimodal variable remains unimodal? Here “unimodal” means that the law has a smooth density with a unique maximum; examples include the Gaussian and semicircle laws.
