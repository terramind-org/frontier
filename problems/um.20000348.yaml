title: A Cox-restriction bridge for the perfect-cone compactification
field: mathematics
tier: prose
statement: |-
  **(Shepherd-Barron) Questions on \(A_g\) and the first Voronoi
  compactification \(A_g^F\).**

  1. Run the MMP on \(A_g^F\) when \(g\leq 10\); in particular, flip its
     extremal ray. If \(g\geq 12\), \(A_g^F\) is the canonical model of
     \(A_g\), and when \(g=11\) it is a minimal model.
  2. There is a family of natural inclusions
     \(A_g^F\rightarrow A_{g+1}^F\) parameterized by the \(j\)-line. Does
     \(H^*(A_g^F,\mathbb C)\) stabilize? To what?
  3. Let \(M\) be the bundle of weight 1 modular forms and \(D\) the boundary
     divisor. Compute the intersection numbers \(M^aD^b\) and the
     plurigenera of \(A_g^F\).
  4. Is the total coordinate ring of \(A_g^F\) finitely generated?
  5. Is the divisor \(12M-D\) semi-ample for \(g\geq 12\)?
  6. Find the effective cone of \(A_g^F\). This is the well-known question
     of finding the possible slopes of Siegel cusp forms.
