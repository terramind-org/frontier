title: Galois Representations from Hecke Maximal Ideals
field: mathematics
tier: prose
statement: For every maximal ideal $\mathfrak m$ of the Hecke algebra $\mathbb T_S(K)$, does there exist a continuous semisimple Galois representation $\bar\rho_{\mathfrak m}$ with the prescribed Hecke characteristic polynomials, maximally odd complex conjugation, and Fontaine–Laffaille Hodge–Tate weights? If $\mathfrak m$ is non-Eisenstein, does this representation have a lift $\rho_{\mathfrak m}$ with analogous properties, and is the Taylor–Wiles deformation map $R_S\to\mathbb T_S(K)_{\mathfrak m}$ an isomorphism?
