  \item[\hypertarget{source:7500121:2}{S2}] Antonio Montalbán, Open Questions in Reverse Mathematics, author preprint (17 August 2010), Question 21, Section 4.2, p. 9. \url{https://math.berkeley.edu/~antonio/papers/questionsRM.pdf}.
  \item[\hypertarget{source:7500121:3}{S3}] Antonio Montalbán, Fraïssé's conjecture in $\Pi^1_1$-comprehension, author preprint (compiled 2017), Theorem 1.1. \url{https://math.berkeley.edu/~antonio/papers/FraisseDeltaBQO.pdf}.
  \end{description}
