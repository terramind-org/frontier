title: Problem 12.8 — Construct an invariant of KTG’s from configuration space in- tegrals in a natural way.
field: mathematics
tier: prose
statement: "Construct an invariant of KTG’s from configuration space in- tegrals in a natural way. Turaev [388] introduced a presentation of 3-manifolds as S1 -bundles over “sha- dow surfaces”, as follows (for details see [388, 40, 384]). A fake surface is a singular surface such that a neighborhood of each point is ho meomorphic to an open subset of the cone over a tetrahedron. A S1 -bundle over a fake surface can appropriately be defined and its isomorphism class is det ermined by the Chern number, which is an integer or half-integer associate d to each face; we call the Chern number the gleam. A shadow surface is a fake surface with gleams associated to the faces. Every (closed) 3-manifold c an be presented by a S1 -bundle over a (closed) shadow surface. The pentagon and hex agon relations (see [388, Figure 1.1 of Chapter VIII]) are moves among shado w surfaces which present a homeomorphic 3-manifold, though they are not enou gh to characterize a homeomorphism class of 3-manifolds. Exercise 12.9 Find a complete set of moves among shadow surfaces which present a homeomorphic 3-manifold. We obtain a shadow surface as a time evolution of a sequence of KTG’s given by KTG operations. Thus, we have relations among links, 3-ma nifolds, KTG’s and shadow surfaces as in the commutative diagram in Figure 2 2; for detailed statements see [40, 384]. Motivated by a complexity of 3-manifolds discussed in [279, 272, 273], D. Thurston introduced the shadow number of 3-manifolds. The shadow num- ber is defined to be the minimal number of vertices of a shadow surf ace. All graph manifolds have shadow number 0 and all surgeries on the Borromean rings have shadow number 1. The volume conjecture might be re lated to the following conjecture. Framed links -exterior Framed link exteriors -surgery Closed 3-manifolds presentation 6 by making S1 -bundle 6 by making S1 -bundle 6 Certain sequences of KTG’s - time evolution Collapsible shadow surfaces - cap oﬀ ∂ Closed shadow surfaces Figure 22: Links, 3-manifolds, KTG’s, and shadow surfaces"
