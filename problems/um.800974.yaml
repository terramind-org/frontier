title: Open Problems and Questions about Geodesics — Question 55 ([Sanchez2015])
field: mathematics
tier: prose
statement: |-
  We refer to the paper [Sanchez2015] for a list of interesting results on this topic and for a list of open questions from which we repeat here only:

  *Assume that a compact Lorentzian manifold is globally conformal to a
  manifold of constant curvature. Must it be geodesically complete?*
