title: Problem 3.3 — (Fast conjugacy problem).
field: mathematics
tier: prose
statement: (Fast conjugacy problem). Find a polynomial time algorithm to solve the con- jugacy problem in Modg. Is there a quadratic time algorithm, as for the word problem? As explained in the example on page 11, a solution to Problem 3.3 would be a major step in finding a polynomial time algorithm to solve the homeomorphism problem for 3-manifolds that fiber over the circle. Almost convexity. In [ Ca] Cannon initiated the beautiful theory of almost convex groups. A group Γ with generating set S is almost convex if there exists C >0 so that for each r >0, and for any two points x,y ∈ Γ on the sphere of radius r in Γ with d(x,y ) = 2, there exists a path γ of length at most C connectingx toy and lying completely inside the ball of radius r in Γ. There is an obvious generalization of this concept from groups to spaces. One strong consequence of the almost convexity of Γ is that for such groups one can recursively build the Cayley graph of Γ near any point x in the n-sphere of Γ by only doing a local computation involving elements of Γ lying (universally) close to x; see [ Ca]. In particular one can build each n-ball, n≥ 0, and so solve the word problem in an eﬃcient way. 3The second ingredient, crucial but ignored by some authors, is the computability of the Thurston norm. 2. Some problems on mapping class groups and moduli space 25
