title: Abelian Root Groups in Special Moufang Sets
field: mathematics
tier: prose
statement: Let $M=M(U,\tau)$ be a Moufang set whose little projective group $G^\dagger$ is not sharply two-transitive on $X$. Is $M$ special if and only if $U$ is abelian? If $M$ is special with $U$ abelian, must it arise as $M(J,U,1)$ from a quadratic Jordan division algebra over a commutative field?
