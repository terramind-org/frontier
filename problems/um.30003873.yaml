title: Resolvent Degrees of Universal Polynomials
field: mathematics
tier: prose
statement: Hilbert's conjecture asserts that for $n\geq 6$ the resolvent degree of the universal degree-$n$ polynomial cover $\widetilde{P}_n\to P_n$ satisfies $\operatorname{RD}(\widetilde{P}_n\to P_n)\geq 2$; for $n=6,7,8,9$ the values are conjectured to be $2,3,4,4$, respectively.
