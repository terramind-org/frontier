title: Problem 2.6 — (Holomorphic representatives).
field: mathematics
tier: prose
statement: "(Holomorphic representatives). Find an algorithm or a group-theoretic invariant which determines or detects whether or not a given representation ρ: π1Σh → Modg has a holomorphic representative. 2. Some problems on mapping class groups and moduli space 19 Note that a necessary, but not suﬃcient, condition for a representation ρ:π1Σh→ Modg to be holomorphic is that it be irreducible, i.e. there is no essential isotopy class of simple closed curve α in Σ g such that ρ(π1Σh)(α) = α. I believe it is not diﬃcult to give an algorithm to determine whether or not any given ρ is irreducible or not. We would like to construct and classify (up to conjugacy) such ρ. We would also like to compute their associated invariants, such as ν(ρ):= ∫ Σh f ∗ωWP whereωWP is the Weil-Petersson 2-form on Mg, and where f: Σ h→M g is any map with f∗ =ρ. This would give information on the signatures of surface bundles over surfaces, and also on the Gromov co-norm of [ ωWP]∈H ∗(Mg, R). The classification question is basically impossible as stated, since e.g. surface groups surject onto free groups, so it is natural to first restrict to injective ρ. Using a technique of Crisp-Wiest, J. Crisp and I show in [ CF] that irreducible, injective ρ are quite common."
