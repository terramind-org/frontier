  \item[\hypertarget{source:statement:2}{S2}] Michel Waldschmidt, Open Diophantine Problems, arXiv:math/0312440v2 (24 January 2004), Conjecture 4.7 and preceding definition of delta. \url{https://arxiv.org/abs/math/0312440}.
  \end{description}
