title: Research Problems in Function Theory — Problem 5.46
field: mathematics
tier: prose
statement: A non-constant function $f$ analytic in $\mathbb{D}$, is said to be in the MacLane class $\mathcal{A}$ if the set of points of the unit circle $\mathbb{T}$ at which $f$ has an asymptotic value is a dense subset of $\mathbb{T}$ (see MacLane ). A function $f$ is said to have an arc tract if there exists a sequence $\{\gamma_n\}$ of arcs, $\gamma_n\subset \mathbb{D}$, and a non-degenerate subarc $\gamma$ of $\mathbb{T}$ such that $\gamma_n\to\gamma$ (in the obvious fashion) and $\min\{|f(z)| :z\in\gamma_n\}\to\infty$ as $n\to\infty$. Does there exist a function $f\in\mathcal{A}$ with an arc tract and with non-zero derivative (see MacLane )? (K. F. Barth)
