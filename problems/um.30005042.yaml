title: Weak Moment Conditions and Branching-Process Limit Laws
field: mathematics
tier: prose
statement: For the coupled branching process driven by a nondecreasing integer-valued offspring process $X(\lambda)$, determine whether convergence to its martingale limit persists under an $X\log X$ condition, and characterize the law of the limiting process $W$ from its distributional fixed-point equation.
