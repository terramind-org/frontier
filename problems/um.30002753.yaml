title: Optimal Geodesic Curvature for Random Transpositions
field: mathematics
tier: prose
statement: For the random transposition model on the symmetric group $S_n$, determine the correct order in $n$ of the optimal geodesic-convexity constant $\kappa$, known to satisfy $4/(n^2-n) \leq \kappa \leq 2/(n-1)$.
