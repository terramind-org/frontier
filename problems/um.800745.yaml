title: Banach Spaces and Ramsey Theory — Problem 8
field: mathematics
tier: prose
statement: |-
  Let $X$ be a separable Banach space which fails to have type $2-
  $ (or fails
  to have co-type $2+
  $) for some $
  >0$. Is it true that $X$ contains
  continuum many pairwise non-isomorphic subspaces?
