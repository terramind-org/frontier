title: Foliations and Diffeomorphism Groups — Question 56
field: mathematics
tier: prose
statement: |-
  Let's consider the group $\mathcal{G}^r$ of germs of $C^r$ diffeomorphisms about the origin in $\mathbb{R}$, where $r$ is at least $1$ (the reason for excluding $r=0$ is that, in the continuous setting, every 1-dimensional germ -or homeomorphism- is a distortion element, because every nontrivial element is conjugate to its square, for example). Here, $r$ can be also equal to $\omega$, which means that we also consider the real-analytic case.

  What are the distortion elements of $\mathcal{G}^r$?
