title: Kourovka Notebook Problem 17.15
field: mathematics
tier: prose
statement: |-
  Construct an algorithm which, for a given polynomial $f \in
  {\mathbb{Z}}[x_1, x_2, \ldots, x_n]$, finds (explicitly, in terms of
  generators) the maximal subgroup $G_f$ of the group $Aut ({\mathbb{Z}}[x_1, x_2, \ldots, x_n])$ that leaves $f$ fixed. This question
  is related to description of the solution set of the Diophantine
  equation $f = 0$.
