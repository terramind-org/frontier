title: Clique-Sequence Rank and Generic Rigidity Matroids
field: mathematics
tier: prose
statement: |-
  For $F\subseteq E(K_n)$, define

  $$r_t(F)=\min_{(C_1,\ldots,C_k)}\left(\left\lvert F\cup\bigcup_{i=1}^kC_i\right\rvert-k\right),$$

  where the minimum ranges over proper $K_t$-sequences in $K_n$. Is $r_t$ submodular, so that $(E(K_n),r_t)$ is a matroid? In particular, is $(E(K_n),r_5)$ the generic $3$-rigidity matroid?
