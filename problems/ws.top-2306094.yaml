  \section{Research Problems in Function Theory — Problem 6.94}\label{2306094}
  {\small UnsolvedMath ID 2306094 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $\Omega\subseteq\mathbb C$ be simply connected with at least two boundary points, and let $\phi:\Omega\to\mathbb D$ be a conformal bijection. Determine the exponents $p$ for which
  \[\int_\Omega|\phi'(z)|^p\,dA(z)<\infty\]
  holds for every such domain. In particular, is the universal sharp range $4/3<p<4$?
  \par\smallskip\textit{Formulation references:} \sref{2306094}{1}, \sref{2306094}{2}.
  \subsection{Short English statement}
  Let $\Omega\subseteq\mathbb C$ be simply connected with at least two boundary points, and let $\phi:\Omega\to\mathbb D$ be a conformal bijection. Determine the exponents $p$ for which
  \[\int_\Omega|\phi'(z)|^p\,dA(z)<\infty\]
  holds for every such domain. In particular, is the universal sharp range $4/3<p<4$?
