title: Kourovka Notebook Problem 6.38
field: mathematics
tier: prose
statement: |-
  b) Is it true that
  an arbitrary subgroup of $GL_n(k)$
  that intersects every conjugacy class is parabolic? How far is the
  same statement true for subgroups of other groups of Lie type?

  [Archived solved part(s) of 6.38:]
  a)
  Let $k$ be a (commutative) field. Find all irreducible subgroups
  $G$ of $GL_n(k)$ having the property that $G \cap C \ne
  \varnothing$ for every conjugacy class $C$ of $GL_n(k)$.
  I conjecture that $ G=GL_n(k)$ except in case $n=\mathrm{char}
  k=2$, the field $k$ is quadratically closed, and $G$ is conjugate
  to the group of all matrices of the form
  $\left(\!\!\begin{array}{cc}\alpha &0\cr
  0&\beta\end{array}\!\!\right)$,
  $\left(\!\!\begin{array}{cc}0&\alpha \cr \beta
  &0\end{array}\!\!\right)$ where $\alpha \ne 0$ and $\beta \ne 0$.
