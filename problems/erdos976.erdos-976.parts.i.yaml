lean:
  module: FormalConjectures.ErdosProblems.«976»
  decl: Erdos976.erdos_976.parts.i
  statement: |-
    theorem erdos_976.parts.i :
        ∀ f : ℤ[X], Irreducible f → 2 ≤ f.natDegree →
          ∃ c > (0 : ℝ), (fun n : ℕ ↦ (n : ℝ) ^ (1 + c)) =O[atTop] fun n ↦ (F f n : ℝ)
  context:
    - open Erdos976
    - open Erdos976.erdos_976
    - open Erdos976.erdos_976.parts
    - open Filter Asymptotics Polynomial
  definitions:
    - name: Erdos976.F
      kind: def
      text: |-
        /-- $F_f(n)$, the greatest prime divisor of $\prod_{1\leq m\leq n} f(m)$. If $f$ has no integer
        root the product is nonzero; `Nat.maxPrimeFac` of $0$ or $1$ is a junk value that does not
        matter for large $n$. -/
        noncomputable def F (f : ℤ[X]) (n : ℕ) : ℕ :=
          (∏ m ∈ Finset.Icc 1 n, f.eval (m : ℤ)).natAbs.maxPrimeFac
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/976.lean#L41
