statement: |-
  The Kauffman bracket polynomial of a virtual diagram can have the
  leading term, i.e., the term having the highest possible degree,
  equal to zero.

  Assume that we have a diagram for which the Kauffman bracket
  polynomial has the nonzero leading term. Classify moves
  (compositions of the generalized Reidemeister moves) establishing
  the equivalence in the class of diagrams with nonzero leading terms.
