  \item[\hypertarget{source:statement:2}{S2}] Zarathustra Brady, \emph{Sums of seven octahedral numbers}, arXiv:1509.04316v2 (2015), Section 1, Pollock conjecture and definition of octahedral numbers, pp. 1--2. \url{https://arxiv.org/pdf/1509.04316}.
