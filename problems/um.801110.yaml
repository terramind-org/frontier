title: Ultraproduct II_1 Factors — Problem 11
field: mathematics
tier: prose
statement: |-
  For the definition of bi-exactness see the work [ding2023biexactvonneumannalgebras]. The above behavior was observed in $L(\mathbb{F}_2)$, see [Sridiagonal].

  Let $N$ be a non amenable II$_1$ factor with Haagerup property, and $N\subset M$ existentially. Then can $M$ have property (T)?
