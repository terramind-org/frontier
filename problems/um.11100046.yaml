title: Equivariant homotopy 4 — As a simpler model of the equivariant stable homotopy category, construct a derived category of Mackey…
field: mathematics
tier: prose
statement: As a simpler model of the equivariant stable homotopy category, construct a derived category of Mackey functors over a Green functor, and analyze its properties. We know a lot about the derived category of a Noetherian ring--thick, localizing, and colocalizing subcategories are completely classified (See Amnon Neeman's paper on the derived category, though in my opinion you should also see Hovey-Palmieri-Strickland for simpler proofs of most of his results). Can we say analogous things about Mackey functors? Gaunce Lewis has thought about this problem a bit.
