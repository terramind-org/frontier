title: Kourovka Notebook Problem 7.50
field: mathematics
tier: prose
statement: |-
  Study the structure of the primitive permutation groups (finite
  and infinite), in which the stabilizer of any three pairwise
  distinct points is trivial. This problem is closely connected with
  the problem of describing those group which have a Frobenius group
  as one of maximal subgroups.
