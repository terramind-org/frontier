title: Kourovka Notebook Problem 20.6
field: mathematics
tier: prose
statement: |-
  (W. Kimmerle).
  The prime graph (or Gruenberg--Kegel graph) $\Gamma(X)$ of a group $X$ has vertices labeled by primes appearing as orders of elements in $X$; two distinct primes $p$ and $q$ are adjacent in $\Gamma(X)$ if and only if $X$ contains an element of order $pq$.
  Denote by $\mathrm{V}(\mathbb{Z}G)$ the group of normalized units of the integral group ring of a group $G$. Is it true that for each finite group $G$ the prime graphs of $G$ and $\mathrm{V}(\mathbb{Z}G)$ coincide?

  This question has been reduced to almost simple groups (W. Kimmerle, A. Konovalov, *Internat. J. Algebra Comput.*, **27** (2017), 619--631).
