title: "Goldberg conjecture: corrected statement and counterexample sieve"
field: mathematics
tier: prose
statement: Let \((M^{2n},g,J,\omega)\) be compact and almost Kähler, meaning that \(J^2=-\mathrm{Id}\), \(g(JX,JY)=g(X,Y)\), and the fundamental form \(\omega(X,Y)=g(JX,Y)\) is closed. If \(g\) is Einstein, must \(J\) be integrable (and hence the structure Kähler)?
