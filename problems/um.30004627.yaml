title: Fixed Points, Expanding Combings, and Lattices in Metric Geometry
field: mathematics
tier: prose
statement: Does every locally elliptic action of a finitely generated group on a finite-dimensional CAT(0) space, in particular on a Euclidean building of arbitrary dimension, have a global fixed point; does the analogous statement hold for finite-dimensional Helly complexes; do central extensions of hyperbolic groups admit coherent expanding combings; how can one construct an automatic group without an expanding combing; are the listed automatic structures expanding; and are irreducible lattices in products of two trees and non-uniform lattices in two-dimensional right-angled hyperbolic buildings finitely generated?
