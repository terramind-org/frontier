title: Kourovka Notebook Problem 8.19
field: mathematics
tier: prose
statement: |-
  Which of the following properties of (soluble)
  varieties of groups are equivalent to one another:

  1) to satisfy the minimum condition for
  subvarieties;

  2) to have at most countably
  many subvarieties;

  3) to have no infinite independent system of
  identities?
