title: Constant-Dimension Framings of Simple Locally Finite Localities
field: mathematics
tier: prose
statement: Let $\mathcal{L}$ be a simple locally finite locality at a prime $p$. Prove that $\mathcal{L}$ admits a framing by injective homomorphisms of finite localities $\mathcal{L}_n\to\mathcal{L}_{n+1}$ such that every $\mathcal{L}_n$ is simple and $\dim_p(\mathcal{L}_n)$ is independent of $n$.
