title: Long-Time Behavior of Degenerate Keller–Segel Equations
field: mathematics
tier: prose
statement: For the degenerate-diffusion Keller–Segel equation $$\partial_t\rho=\Delta(\rho^m)-\nabla\!\cdot\!\bigl(\rho\nabla(N*\rho)\bigr)$$ in dimension $d>2$, determine the long-time behavior of solutions, including whether they converge to stationary states or lose mass at infinity.
