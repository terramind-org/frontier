title: Tensor Products and Extensions of Specht-Filtered Modules
field: mathematics
tier: prose
statement: Assume $p>3$, and let $M$ and $N$ be indecomposable self-dual $k\Sigma_d$-modules having both Specht and dual Specht filtrations. Must $M\otimes N$ be a direct sum of signed Young modules, and must $\operatorname{Ext}^i_{k\Sigma_d}(M,N)=0$ for $1\leq i\leq p-2$?
