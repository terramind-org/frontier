  statement: |-
    theorem erdos_450 (ε : ℝ) (hε : 0 < ε) (n : ℕ) :
        windowThreshold ε n = erdos_450.answer ε n
  context:
    - open Erdos450
  definitions:
    - name: Erdos450.windowThreshold
      kind: def
      text: |-
        /-- The least window length `y₀` such that every window `(x, x+y)` with `y ≥ y₀` is
        `ε`-sparse, or `⊤` if no such `y₀` exists. -/
        noncomputable def windowThreshold (ε : ℝ) (n : ℕ) : ℕ∞ :=
          ⨅ y : {y : ℕ // ∀ z ≥ y, UniformlySparse ε n z}, (y.1 : ℕ∞)
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/ErdosProblems/450.lean#L47
