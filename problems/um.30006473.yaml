title: Poonen-Rains Selmer Distributions in Twist Families
field: mathematics
tier: prose
statement: Let $E/K$ be an elliptic curve and let $E_d$ range through a natural family of twists. Prove that the dimensions of the $p$-Selmer groups $\operatorname{Sel}_p(E_d/K)$ have the Poonen–Rains limiting distribution for the full family, beyond the currently proved primes, fields, and conditional regimes.
