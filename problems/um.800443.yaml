title: Analysis of Boolean Functions — Non-Interactive Correlation Distillation with Erasures
field: computer-science
tier: prose
statement: Let $f \colon \{-1,1\}^n \to \{-1,1\}$ be an unbiased function. Let $\mathbf{z} \sim \{-1,0,1\}^n$ be a ``random restriction'' in which each coordinate $\bz_i$ is (independently) $\pm 1$ with probability $p/2$ each, and $0$ with probability $1-p$. Assuming $p < 1/2$ and $n$ odd, is it true that $\mathbb{E}_{\mathbf{z}}[|f(\mathbf{z})|]$ is maximized when $f$ is the majority function? (Here we identify $f$ with its multilinear expansion.)
