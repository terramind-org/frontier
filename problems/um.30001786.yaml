title: Laurent Coefficients and Rotational Components of Singular One-Forms
field: mathematics
tier: prose
statement: Let $\omega=f(z)\,dz$ be a holomorphic one-form on the punctured unit disk, with an essential singularity at $z=0$ and Laurent expansion $f(z)=\sum_{k=-\infty}^{\infty}a_kz^k$. Can the coefficients $(a_k)$ determine the rotational components of the linear-approach space $L(0)$?
