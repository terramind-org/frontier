title: Selection Principles Milestone Problems — Problem 34 ([coc4, Problem 1])
field: mathematics
tier: prose
statement: |-
  Let $\mathcal{K}$ denote the families $\mathcal{U}\in\mathcal{D}$ such that $\{\overline{U} : U\in\mathcal{U}\}$ is a cover of $X$.
  In [tkachuk] Tkachuk shows that the Continuum Hypothesis{} implies that ONE has a winning
  strategy in $\mathsf{G}_1(\mathcal{K},\mathcal{D})$ on any space of uncountable cellularity.
  In [coc4], Scheepers defines $\mathfrak{j}$ as the minimal cardinal $\kappa$
  such that ONE has a winning strategy in $\mathsf{G}_1(\mathcal{K},\mathcal{D})$ on
  each Tychonoff space with cellularity at least $\kappa$, and shows that
  $\mathsf{cov}(\mathcal{M})\le\mathfrak{j}\le\mathsf{non}(SMZ)$.

  Is $\mathfrak{j}$ equal to any standard cardinal characteristic of the continuum?
