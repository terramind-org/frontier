title: Dyadic rigidity and non-discreteness for the endpoint grope pseudometric
field: mathematics
tier: prose
statement: |-
  **Grope metric.** Understand the grope metric \(d_1\) defined by Cochran--Harvey--Powell (Cochran--Harvey--Powell 2017, MR3665407).

  A closely related question is whether there exists a non smoothly slice knot which bounds an infinite height symmetric grope where all surfaces have genus 1, and whether such a knot must be topologically slice.
