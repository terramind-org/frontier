title: Research Problems in Function Theory — Problem 6.89
field: mathematics
tier: prose
statement: "Let $S^*(\\frac{1}{2})$ denote the class of functions $g$ analytic in $\\mathbb{D}$ and such that $\\text{Re}\\, (zg'/g) > \\frac{1}{2}$ in $\\mathbb{D}$. Is it true that, if $f\\in S^*(\\frac{1}{2})$, $r\\in (0,1)$ and $\\theta\\in[0,2\\pi)$, then $$ \\frac{1}{|f(re^{-i\\theta})|}\\int^r_0|f'(te^{i\\theta})|\\,dt\\leq\\frac{\\arcsin r}{r}? $$ (The left-hand-side of ([source label: J6.89]) is the ratio of the length of the image of a radius and the distance between the endpoints of that image (as the crow flies).) Inequality ([source label: J6.89]) is true when $f(z) = z/(1-z)$; in addition, the left-hand-side of ([source label: J6.89]) never exceeds $\\pi/2$ for any $r$ or $f$. Let $z_1,z_2$ lie in $\\mathbb{D}$. Then, in the smaller class of convex functions $f$, what can be said about \\[\\frac{1}{|f(z_1)-f(z_2)|}\\int^{z_2}_{z_1}|f'(t)|\\,|dt|?\\] (R. R. Hall)"
