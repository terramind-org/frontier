title: Harbourne Constants, Symbolic Powers, and Resurgence of Line Arrangements
field: mathematics
tier: prose
statement: For complex line arrangements $C$, must $H(C)=\widetilde C^2$ divided by the number of singular points be at least $-225/67$, and what is the infimum of $H(C)$ over rational line arrangements? Also, which finite sets $Z\subset\mathbb{P}^2$ satisfy $I_Z^{(3)}\not\subset I_Z^2$, and can the resurgence of the singular-point ideal be computed for line arrangements, at least for supersolvable ones?
