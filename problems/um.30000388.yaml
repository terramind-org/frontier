title: Upper Bounds for Low-Level Hemisphere Arrangements
field: mathematics
tier: prose
statement: If $\mathcal A$ is an arrangement of $n$ great hemispheres in $S^d$ and $0\leq\ell<(n-d)/2$, is the number of vertices at level at most $\ell$ at most $v(\ell,n,d)$, the corresponding number for the arrangement polar-dual to a cyclic $d$-polytope on $n$ vertices? A vertex's level is the number of hemispheres not containing it.
