title: Kourovka Notebook Problem 15.99
field: mathematics
tier: prose
statement: |-
  Let $f(n)$ be the number of isomorphism classes of finite groups
  of order $n$. Is it true that the equation $f(n)=k$ has a solution
  for any positive integer $k$? The answer is affirmative for all $k
  \leq 1000$ (G. M. Wei, *Southeast Asian Bull. Math.*, **22**, no. 1 (1998), 93--102).
