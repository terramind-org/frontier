title: Holomorphic Foliation Theory — Problem 12
field: mathematics
tier: prose
statement: |-
  Recently, Benjamin Weiss has proved the existence of non-trivial probability measures on $\mathscr{H}$ which are invariant by the above translation operator, see [Weiss]. These measures are studied in particular by Buhovsky, Gl\"ucksam, Logunov and Sodin [BGLS]. A measure is *non-trivial* if it gives zero measure to the set of constant maps. Using standard results from ergodic theory, one gets the existence of non-trivial
  ergodic measures, i.e. measures such that the only invariant measurable subsets are of zero or full measure.

  Given such a measure $\mu$ on $\mathscr{H}$ as above, what we can say about $\mu(\mathscr{U})$ ?
