title: Growth Functions of Finitely Generated Groups
field: mathematics
tier: prose
statement: Let $A$ be a finite generating set of an infinite group $G$, and let $B(t)$ count the elements expressible as products of at most $t$ elements of $A$. How does $B(t)$ grow as $t\to\infty$?
