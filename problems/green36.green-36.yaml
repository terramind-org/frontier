  module: FormalConjectures.GreensOpenProblems.«36»
  decl: Green36.green_36
  statement: |-
    theorem green_36 :
        ∀ ε > (0 : ℝ), ∃ᶠ n in atTop,
          ∃ (H : Type) (_ : AddCommGroup H) (_ : Finite H) (A B : Fin n → Finset H),
            (n : ℝ) ^ (2 - ε) ≤ Nat.card H ∧ Nat.card H ≤ (n : ℝ) ^ (2 + ε) ∧
            (∀ i, (n : ℝ) ^ (2 - ε) ≤ (A i).card * (B i).card) ∧
            Green36Property A B
  context:
    - open Green36
    - open Filter
    - open scoped Pointwise
  definitions:
