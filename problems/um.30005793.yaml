title: Stability and Alternative Costs in Spherical Optimal Transport
field: mathematics
tier: prose
statement: Can stability of spherical semigeostrophic solutions be proved as the curvature $\kappa\to0$? Is there another cost $c(x,y)$ on $S^2$ for which the transport map $c\text{-}\exp_x(\nabla p_t(x))$ yields a continuity equation for the transported density that does not involve the velocity $u_t$?
