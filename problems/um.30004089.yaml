title: Admissibility and Finite Length on the Drinfeld Tower
field: mathematics
tier: prose
statement: Let $F$ be a $p$-adic field, let $G=\operatorname{GL}_2(F)$, and let $\Sigma_n$ be the level-$n$ space in the Drinfeld tower. For every $n\geq0$, is $\mathcal O(\Sigma_n)^*$ an admissible locally analytic representation of $G$, and does it have finite length?
