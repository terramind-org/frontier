title: Fargues-Scholze Categorical Local Langlands Equivalence
field: mathematics
tier: prose
statement: Let $E/\mathbb{Q}_p$ be finite and let $G/E$ be quasisplit reductive. Construct the conjectural equivalence between $D_{\mathrm{lis}}(\operatorname{Bun}_G,\overline{\mathbb{Q}}_\ell)$ and the ind-coherent sheaves on the stack of $L$-parameters, normalized by a Whittaker datum, and prove that it intertwines Hecke operators with tensoring by the corresponding vector bundles.
