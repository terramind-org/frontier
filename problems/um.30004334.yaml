title: Bounded Negativity for Root of Unity Blowups
field: mathematics
tier: prose
statement: Let $\varepsilon$ be a primitive $m$th root of unity, let $Z(m)$ be the points $(1:\varepsilon^\alpha:\varepsilon^\beta)$ in $\mathbb{P}^2$ for $1\leq\alpha,\beta\leq m$, and let $X(m)$ be the blowup of $\mathbb{P}^2$ at $Z(m)$. Is negativity bounded on $X(m)$, and if so what is its bound $b(X(m))$?
