title: Targeted punctured curves versus full SFT, with a Liouville-period bridge to Clifford boundary rigidity
field: mathematics
tier: prose
statement: |-
  With those corrections, the question asks how much of Eliashberg's proposed SFT proofs of (i) the Audin conjecture and (ii) weak boundary rigidity of the Clifford torus in \(S^3\) truly needs the then-unfinished foundations of symplectic field theory. It suggests replacing holomorphic curves with boundary on \(L\) by punctured curves asymptotic in \(T^*L\), reducing a recurring part of the analysis to curves in \(T^*(T^n)\). It also asks, without formulating a precise conjecture, whether CR structures can be useful.

  The preceding questions fix the intended statements:

  1. **Audin conjecture.** Every Lagrangian torus \(L\subset\mathbb C^n\) has minimal Maslov number \(N_L=2\).
  2. **Weak boundary rigidity in dimension four.** Let
     \[
     \Lambda=S^1(1/\sqrt2)\times S^1(1/\sqrt2)
         \subset \partial\overline B^4(1)=S^3.
     \]
     If a Lagrangian torus \(K\subset\overline B^4(1)\) is Hamiltonian isotopic to \(\Lambda\) through the ball, must \(K\subset S^3\)?

  The official PDF and the nearby Questions 1.19 and 1.25 were checked directly. The phrase about CR structures has no sufficiently precise mathematical target, so no theorem is claimed about it here.
