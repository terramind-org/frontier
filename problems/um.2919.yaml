title: Kirby Problem 4.43
field: mathematics
tier: prose
statement: Let K be a knot on the boundary of $X \setminus B^{\circ 4}$, where X is a negative definite, smooth 4-manifold. Suppose K bounds a smoothly embedded, nullhomotopic surface $\Sigma$ in $X \setminus B^{\circ 4}$. Is the following inequality $2g(\Sigma) \geq$ |s(K)| (8) always satisfied? Here $s(K)$ denotes Rasmussen’s s-invariant [Ras10].
