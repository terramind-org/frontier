title: A finite certificate for crossing the one-half stable 4-genus barrier
field: mathematics
tier: prose
statement: |-
  **Small stable 4-genera.** The stable 4-genus of a knot \(K\), in either
  category, is defined as
  \[
  g_4^{\mathrm{st}}(K)=\lim_{n\to\infty}\frac{g_4(nK)}{n},
  \]
  see Livingston. Find a knot \(K\) with
  \(0<g_4^{\mathrm{st}}(K)<1/2\).
