title: A prefix-cut obstruction for an NCQSym supercharacter realization
field: mathematics
tier: prose
statement: |-
  **Problem 1.2.** Can one construct a nested supercharacter theory that
  would realize the Hopf algebra NCQSym (indexed by ordered partitions)?

  **Remark.** Nested means a projective system of groups. See *Algebraic
  structures on Grothendieck groups of a tower of algebras*, by H. Li.
