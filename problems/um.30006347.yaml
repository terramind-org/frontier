title: Constructive Product Criteria for Alternating-Group Conjugacy Classes
field: mathematics
tier: prose
statement: Given three conjugacy classes $C_1,C_2,C_3$ in $A_n$, decide constructively whether $C_1C_2\supseteq C_3$. Prove effective large-class criteria, such as the proposed bounds in terms of $|C_i|=|A_n|^{\eta_i}$, or give explicit counterexample families. Also determine whether, for every normal subset $S\subseteq A_n$ and every conjugacy class $C$, the product $SC$ contains at least as many conjugacy classes as $S$.
