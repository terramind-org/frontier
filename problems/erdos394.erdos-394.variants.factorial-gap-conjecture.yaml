lean:
  module: FormalConjectures.ErdosProblems.«394»
  decl: Erdos394.erdos_394.variants.factorial_gap_conjecture
  statement: |-
    theorem erdos_394.variants.factorial_gap_conjecture :
        Set.Infinite { n : ℕ | ∀ k, 2 ≤ k → k < n →
        t k (n !) < t (k - 1) (n !) - 1 }
  context:
    - open Erdos394
    - open Erdos394.erdos_394
    - open Erdos394.erdos_394.variants
    - open Nat Filter Finset
    - open scoped Asymptotics Topology Nat
  definitions:
    - name: Erdos394.t
      kind: def
      text: |-
        /--
        Let $t_k(n)$ denote the least $m$ such that $n\mid m(m+1)(m+2)\cdots (m+k-1).$
        -/
        noncomputable def t (k n : ℕ) : ℕ :=
          sInf { m : ℕ | 0 < m ∧ n ∣ ∏ i ∈ range k, (m + i) }
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/394.lean#L38
