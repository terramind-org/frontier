  \section*{Hausdorff dimension of four-dimensional Kakeya sets}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must every subset E of $R^4$ that contains a unit line segment in every direction have Hausdorff dimension four?
  \subsection{Short English statement}
  Must every subset E of $R^4$ that contains a unit line segment in every direction have Hausdorff dimension four?
