  \section{Condition-Number-Robust Low-Rank Matrix Completion}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  The rank of a matrix is the dimension of its column space. Matrix completion reconstructs a low-rank matrix from a subset of its entries; matrix sensing reconstructs it from specified linear measurements. Tensor decomposition represents a multiway array as a sum of simple outer products.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  Source-record limitation: The target is matching unspecified empirical behavior; no sampling distribution, recovery condition, algorithm or condition-number bound is fixed.
  \paragraph{Statement recorded in the supplied source.}
  Derive recovery guarantees for factorization-based low-rank matrix-completion algorithms whose dependence on matrix condition numbers matches their empirical performance. \sref{statement}{2}
