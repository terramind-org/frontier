title: Positive Scalar Curvature Through Odd-Order Finite Covers
field: mathematics
tier: prose
statement: Let $M$ be a closed connected smooth manifold of dimension at least $5$ whose fundamental group is finite of odd order. If the universal cover of $M$ admits a metric of positive scalar curvature, must $M$ admit one as well?
