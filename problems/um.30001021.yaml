title: Global Generation of Relative Pluricanonical Pushforwards
field: mathematics
tier: prose
statement: Let $f:X\to Y$ be an algebraic fiber space between smooth projective varieties, with $f$ surjective and fibers connected. Is $f_*\mathcal{O}_X(mK_{X/Y})$ globally generated outside the discriminant locus of $f$ for every sufficiently large $m$?
