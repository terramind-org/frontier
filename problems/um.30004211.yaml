title: Realizing Lower Semicontinuous Trace Functions by Positive Elements
field: mathematics
tier: prose
statement: |-
  Let $A$ be a separable, unital, simple, exact $C^*$-algebra, and let $f\in\operatorname{LAff}(T(A))_{++}$. Does there exist $a\in(A\otimes\mathcal K)^+$ such that

  $$d_\tau([a])=f(\tau)$$

  for every $\tau\in T(A)$?
