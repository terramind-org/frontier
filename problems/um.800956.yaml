title: Open Problems and Questions about Geodesics — Question 36
field: mathematics
tier: prose
statement: |-
  Assume $M$ is closed.
  If $\dim(M)\ge 3$, do the metrics for which the geodesic flow is
  transitive (i.e.\ has an orbit whose closure is $SM$) form a dense subset of $\mathcal{G}(M)$?
