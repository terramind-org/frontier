title: The 6R lower bound and a three-contact regularity criterion
field: mathematics
tier: prose
statement: |-
  In 3 dimensions, it is known that if all $10R$ clusters are equivalent, the Delone set is regular.

  Can this result be improved for $\rho < 10R$, e.g. $\rho = 4R$? Is it possible to show similar results for full dimensional $r$-sets with conditions weaker than the $R$ condition?
