title: Labeled subgroups of subshift full groups
field: mathematics
tier: prose
statement: |-
  Let \(\Omega\subseteq B^{\mathbb Z}\) be a two-sided subshift with shift \(\sigma\), and let \(\{\delta_a:a\in A\}\) be a specified finite family in the topological full group \([[\sigma]]\). Study the subgroup \(H=\langle\delta_a:a\in A\rangle\).

  That page gives Problem 2.4 no introduction, proposer, status, remarks, or bibliography. In particular, it does not define:

  - the space or action whose topological full group is intended;
  - the alphabet or index set \(A\);
  - the homeomorphisms \(\delta_a\); or
  - the probability measure and convention meant by “Liouville property.”

  The preceding Problem 2.2 on the same page defines a two-sided subshift \(\Omega\subseteq A^{\mathbb Z}\), the shift \(\sigma\), and its topological full group \(F(\Omega)\). It is plausible that Problem 2.4 was intended to inherit that setting, but the page contains no cross-reference. Problem 2.1 uses different named generators \(\varphi_a\), not \(\delta_a\), and gives no identification between them.

  The official 2024 AIM workshop report has a section on the structure of topological full groups and reproduces Problems 2.1 and 2.2 as Questions 0.3 and 0.4. It then moves to the entropy problem as Question 0.5 and does not reproduce Problem 2.4. Therefore neither the official report nor the archived source recovers \(\delta_a\).

  The literal prompt has no determinate truth value. The conservative reconstruction analyzed below is explicitly conditional:

  The symbol \(B\) is used for the subshift alphabet and \(A\) only for generator labels, since the source does not establish that they coincide.
