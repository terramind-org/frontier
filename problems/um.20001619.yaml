title: Pair correlations in inverted orbits
field: mathematics
tier: prose
statement: |-
  \(G\curvearrowright X\), \(p,x,y\in X\).
  What can be said on
  \(P(x\in O_\Lambda(p)\operatorname{ and }y\in O_\Lambda(p))\)?
  Are these events positively/negatively correlated?
  (Here \(O_\Lambda(p)\) is the inverted orbit of \(p\).)
