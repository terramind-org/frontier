title: Big Divisor Geometry Relative to Subvarieties
field: mathematics
tier: prose
statement: Let $X$ be a smooth complex projective variety, let $V\subset X$ be a subvariety, and let $D$ be a big $\mathbb Q$- or $\mathbb R$-divisor. Determine the positivity and birational geometry of the numerical class of $D$ relative to $V$.
