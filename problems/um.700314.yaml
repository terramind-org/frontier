title: Kourovka Notebook Problem 5.30
field: mathematics
tier: prose
statement: |-
  (Well-known problem). Suppose that $G$ is a finite soluble group, $A
  \leq \mathrm{Aut} G$, $C_G(A)=1$, the orders of $G$ and $A$ are
  coprime, and let $|A|$ be the product of $n$ not necessarily distinct
  prime numbers. Is the nilpotent length of $G$ bounded above by $n$?
  This is proved for large classes of groups (E. Shult, F. Gross,
  T. Berger, A. Turull), and there is a bound in terms of $n$ if $A$
  is soluble (J. G. Thompson's $\leq 5^n$, H. Kurzweil's $\leq 4n$,
  A. Turull's $\leq 2n$), but the problem remains open.
