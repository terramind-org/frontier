title: A direct algebraic S-infinity model for configuration cohomology
field: mathematics
tier: prose
statement: |-
  Let \(S_\infty=\bigcup_nS_n\) be the group of finitary permutations of \(\mathbb N\). For fixed \(i\), form the canonical FI-colimit
  \[
  \mathcal H^i_\infty=\varinjlim_{S\subset\mathbb N,\ |S|<\infty}
  H^i(\operatorname{PConf}_S(\mathbb C);\mathbb Q),
  \]
  compute it as an algebraic \(S_\infty\)-representation directly from the Arnol'd algebra, and compare it with stable finite \(S_n\)-decompositions.
