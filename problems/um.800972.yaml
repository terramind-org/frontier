title: Open Problems and Questions about Geodesics — Question 53
field: mathematics
tier: prose
statement: |-
  *Can there exist a complete semi-Riemannian metric $g$ and a non-trivial 1-form $\eta$ on a closed manifold such
  that for every light-like geodesic $\gamma(t)$
  the function $\eta(\dot\gamma(t))$ grows linearly in both directions: i.e. for every light-like geodesic there exist $C_1 \neq 0, C_2 $ such that
  $\eta(\dot\gamma(t))= C_1\cdot t + C_2$?*
