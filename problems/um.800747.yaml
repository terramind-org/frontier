title: Banach Spaces and Ramsey Theory — Problem 10
field: mathematics
tier: prose
statement: |-
  *(Fixing properties of operators on $C[0,1]$ -- H. P. Rosenthal [Ro2])*
  Let $T:C[0,1]\to C[0,1]$ be a bounded linear operator and $X$ be a separable Banach
  space not containing a copy $c_0$. Assume that the operator $T$ fixes a copy of $X$.
  Is it true that $T$ fixes a copy of $C[0,1]$? Equivalently, is it true that the dual
  operator $T^*$ of $T$ has non-separable range?
