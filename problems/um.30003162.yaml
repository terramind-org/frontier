title: Structure-Preserving Variational Closures of Kinetic Equations
field: mathematics
tier: prose
statement: For a kinetic equation reduced by a closure $f^{\star}(W(x,t),c)$, what test functions $\phi_{\alpha}(x,t,c)$ should be used in the variational formulation so that the reduced equations retain the physical conservation laws, and what can be said about the resulting evolution equations for $W(x,t)$, in particular whether they are symmetric hyperbolic balance laws with an entropy?
