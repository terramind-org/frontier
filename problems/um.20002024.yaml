title: A Helmholtz test and a scale-descent obstruction for conformal primitives
field: mathematics
tier: prose
statement: "**Problem 5b.** What characterizes such curvature invariants? A related problem is posed by T. Branson: On \\(M^n\\), \\(Q\\)-curvature is a local invariant (of density weight \\(-n\\)) which does not have a conformal primitive. The local invariants that have conformal primitives form a vector subspace, say \\(\\mathcal L'\\), of the space of local invariants \\(\\mathcal L\\). Thus the quotient space \\(\\mathcal L/\\mathcal L'\\) is the space which measures “how many things” do not have a conformal primitive. There are also local conformal invariants, \\(\\mathcal L''\\), say."
