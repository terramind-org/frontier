title: Virtual-knot problem 10 — The Fundamental Biquandle
field: mathematics
tier: prose
statement: |-
  The Fundamental Biquandle: Does the fundamental biquandle,
  see classify virtual links up to mirror images? (We know
  that the biquandle has the same value on the orientation reversed
  mirror image where the mirror stands perpendicular to the plane
  (see ).

  Are there good examples of weak biquandles which are not strong?
  This problem is solved in .

  We would like to know more about the algebra with 2 generators
  $A,\,B$ and one relation $[B,(A-1)(A,B)]=0$ (see ). It is
  associated to the linear case.
