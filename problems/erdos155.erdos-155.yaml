id: erdos155.erdos-155
title: Erdős Problem 155
field: mathematics
tier: proof
statement: |-
  Is it true that for every $k \geq 1$ we have
  $$
  F(N + k) \leq F(N) + 1
  $$
  for all sufficiently large $N$?
