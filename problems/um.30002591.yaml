title: Nonvanishing of Derived Categories for Gorenstein Algebras
field: mathematics
tier: prose
statement: Let $A$ be a connected graded Artin--Schelter Gorenstein algebra with Nakayama automorphism $\mu$, and for a graded algebra automorphism $\varepsilon$ of $A$ let $D_\varepsilon(A)$ be the triangulated category of $\varepsilon$-skew Calabi--Yau / twisted Cohen--Macaulay modules introduced by Reyes, Rogalski, and Zhang. For every Artin--Schelter Gorenstein algebra $A$, is $D_\varepsilon(A)$ nonzero for some (or every) twisting automorphism $\varepsilon$?
