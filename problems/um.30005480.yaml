title: Characterizations of Symmetrically Hyperbolic Hook-Shaped Polynomials
field: mathematics
tier: prose
statement: For a diagonal map $T:\mathbb R[t]_{n,0}\to\mathbb R[t]_{d,0}$, prove that $T((x-1)^{n-1}(x+n-1))$ is real-rooted with $d-1$ roots of one sign exactly when $T$ preserves zero-sum hyperbolicity. Also prove that a hook-shaped symmetric polynomial $p$ is symmetrically hyperbolic exactly when $\Delta_{\mathbf 1,\mathbf 1}p$ is a sum of squares.
