title: Linear Systems and Eigenvalue Problems — Problem 5
field: mathematics
tier: prose
statement: |-
  *Complexity for sparse matrices.* Importantly, the matrix-vector product model is most relevant for sparse matrices, in which case the extra cost paid by the Krylov solver is only $\tilde O(\mathrm{nnz}(A)\cdot k)$, where $\mathrm{nnz}(A)$ is the number of non-zero entries in $A$ (although, importantly, additional costs arise in finite precision arithmetic). Many randomized linear algebra methods can also leverage input sparsity for faster running time, so it is natural to expect that a similar improvement may be attainable in the direct access model.

  Can we solve an $(n,k,0,\kappa)$ linear system $Ax=b$ to high accuracy using $\tilde O(k^\omega + \mathrm{nnz}(A)\kappa)$ arithmetic operations?
