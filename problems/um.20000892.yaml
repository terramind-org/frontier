statement: "**Rudin's problem for $\\mathbb F_p[x]$, $p>2$.** Suppose $A\\subset \\mathbb F_p[x]$ is of finite size, and every element of $A$ is a square. Show that $|A+A|\\geq |A|^{1+\\epsilon}$ for some constant $\\epsilon$."
