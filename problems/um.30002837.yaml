title: Conformal Field Theories Representing TMF Classes
field: mathematics
tier: prose
statement: Under the Stolz–Teichner identification of the moduli space of $\operatorname{Fer}(n)$-twisted extended two-dimensional field theories with $\mathrm{TMF}^{-n}$, how much of the field-theory side can conformal field theories detect, and can they produce interesting classes in $\pi_n(\mathrm{TMF})$? Here $\operatorname{Fer}(n)$ denotes $n$ real chiral free fermions.
