lean:
  module: FormalConjectures.OEIS.«260194»
  decl: OeisA260194.conjecture
  statement: |-
    theorem conjecture :
        ∀ d > 0, ∃ n, a (n + 1) = a n + d
  context:
    - open OeisA260194
  definitions:
    - name: OeisA260194.a
      kind: def
      text: |-
        /--
        OEIS A260194, shifted so that Lean index zero is the first OEIS term, with recurrence
        $a(n+3) = a(n+2) + \gcd(a(n+2),a(n))$ and initial values $a(0)=a(1)=a(2)=1$.
        -/
        def a : ℕ → ℕ
          | 0 => 1
          | 1 => 1
          | 2 => 1
          | n + 3 => a (n + 2) + Nat.gcd (a (n + 2)) (a n)
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/260194.lean#L35
