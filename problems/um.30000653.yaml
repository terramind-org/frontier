title: Commuting Locally Nilpotent Derivations Conjecture
field: mathematics
tier: prose
statement: If $D_1,\ldots,D_{n-1}$ are pairwise commuting locally nilpotent derivations of $\mathbb{C}[x_1,\ldots,x_n]$ that are linearly independent over that ring, is their common kernel $\mathbb{C}[f]$ for some coordinate $f$?
