  \section{Kirby Problem 2.42}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A translation surface is a surface with Euclidean coordinate charts whose transition maps are translations. Its straight-line flow in direction $\theta\in[0,2\pi)$ is locally translation by $t(\cos\theta,\sin\theta)$, away from singularities, and preserves Euclidean area. The flow is ergodic for area measure if every measurable invariant set has either zero area or full area.

  The standard Chamanara surface is obtained from a unit square by repeatedly pairing, by translations, the right half of the remaining top edge with the left half of the remaining bottom edge, and the upper half of the remaining right edge with the lower half of the remaining left edge; corners, cut points and their identifications are omitted. This fixes parameter $\alpha=1/2$. \sref{statement}{2}

  For the Bruin--Lukina surfaces, define the dyadic interval exchange $a$ to send each interval $I_j=(1-2^{1-j},1-2^{-j})$ by translation to $(2^{-j},2^{1-j})$, for $j\geq1$. Glue the top of the unit square to the bottom by $(x,1)\sim(a(x),0)$, removing cut endpoints and corners. Identifying $(1,y)\sim(0,y)$ gives their basic surface $L$. More generally take $q\geq2$, a permutation $\pi\in S_q$ of $\{0,\ldots,q-1\}$, and an integer $p\geq q$. Set $r=p\bmod q$, $s(i)=q-1-i$, $t(i)=i+r\bmod q$, and $\pi'=s\circ t^{-1}\circ\pi\circ s^{-1}$. Divide both vertical sides into $p$ open intervals of length $1/p$, numbered from bottom to top. Match left interval $j$ to right interval $\pi'(j)$ for $0\leq j<q$, and match left interval $j$ to right interval $j$ for $q\leq j<p$, always by translations; remove all singular endpoints. Together with the same horizontal gluing this defines $L_{\pi,p}$. \sref{statement}{3}
  \paragraph{Statement recorded in the supplied source.}
  Is the straight-line flow on the standard Chamanara surface ergodic with respect to area for Lebesgue-almost every $\theta\in[0,2\pi)$? Does the same almost-every-direction assertion hold for the basic Bruin--Lukina surface $L$ and for their family $L_{\pi,p}$ with the parameters above? \sref{statement}{2}
  \subsection{Short English statement}
  Do almost all directional geodesic flows preserve no nontrivial measurable subsets on the Chamanara surface and on the related finite-area infinite-genus surfaces of Bruin and Lukina?
