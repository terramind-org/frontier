title: Open Problems and Questions about Geodesics — Conjecture 1 (Long, Bangert, Problem 15 from [Alvarez2006])
field: mathematics
tier: prose
statement: |-
  V. Bangert and Y. Long in [Ban-Lon2010] and [Long2006] proved that there are always at least 2 distinct prime closed geodesics for every irreversible
  Finsler metric on $S^2$.

  *Every irreversible Finsler metric on $S^2$ has either
  exactly $2$ or infinitely many distinct prime closed geodesics.*
