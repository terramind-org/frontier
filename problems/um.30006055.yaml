statement: Is the topological volume of the three-torus equal to twice the volume $v_8$ of a regular ideal octahedron, with the minimum realized by the three-component link whose complement is homeomorphic to the Borromean-rings complement; that is, is $\operatorname{vol}_t(T^3)=2v_8$?
