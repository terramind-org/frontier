title: Holomorphic Foliation Theory — Problem 3
field: mathematics
tier: prose
statement: |-
  Let $\mathscr{H}_d$ denote the set of foliations of degree $d$ with only hyperbolic singularities. This is an open real Zariski dense set in $\mathscr{B}_d$. It is easy to show that $\mathscr{B}_d^{a}\cap\mathscr{H}_d$ is an analytic set [FS3] because one can bound the degree of the curve, when all singularities are hyperbolic.
  Let $\mathscr{B}_d^{c}$ denote the set of foliations which admit directed positive closed currents. It is clearly a closed set in $\mathscr{B}_d$.
  Part of Theorem 3.1 can be stated as $ \mathscr{B}_d^{c}\cap\mathscr{H}_d=\mathscr{B}_d^{a}\cap\mathscr{H}_d$.

  Is the space $\mathscr{B}_d^{c}$ a countable union of proper analytic subsets of $\mathscr{B}_d$, when $d\geq2$ ?
