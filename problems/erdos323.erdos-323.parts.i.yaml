  module: FormalConjectures.ErdosProblems.«323»
  decl: Erdos323.erdos_323.parts.i
  statement: |-
    theorem erdos_323.parts.i :
        ∀ k ≥ 1, ∀ ε > (0 : ℝ),
          (fun (x : ℕ) ↦ (x : ℝ) ^ (1 - ε)) =O[atTop] (fun (x : ℕ) ↦ (f k k x : ℝ))
  context:
    - open Erdos323
    - open Erdos323.erdos_323
    - open Erdos323.erdos_323.parts
    - open Filter
    - open scoped Asymptotics
  definitions:
    - name: Erdos323.f
      kind: def
      text: |-
        /--
        Let $1\leq m\leq k$ and $f_{k,m}(x)$ denote the number of integers $\leq x$ which are the sum of
        $m$ many nonnegative $k$th powers.
        -/
        noncomputable def f (k m x : ℕ) : ℕ :=
          { n : ℕ | n ≤ x ∧ ∃ (v : Fin m → ℕ), n = ∑ i, v i ^ k }.ncard
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/323.lean#L33
