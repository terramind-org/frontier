  \section*{Complex square and rectangular multiplication bounds}\label{30007448}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Over C, do the arithmetic matrix-multiplication exponents satisfy $\omega <2.258$, the dual rectangular exponent $\alpha >0.465$, and $w(0.709)<2.092$, using exact arithmetic operations?
