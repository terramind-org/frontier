title: Degeneration and Moduli of Logarithmic Linear Series
field: mathematics
tier: prose
statement: When a smooth curve $C$ degenerates to a nodal curve $C_0$, how do the line bundle $L$ and subspace $V$ of a linear series $(L,V)$ degenerate? Describe the moduli space of linear series on $C_0$. How can one detect whether a linear series on $C_0$ is the limit of linear series on smooth curves?
