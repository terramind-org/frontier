title: Open Problems in Arithmetic Dynamics — Question 32
field: mathematics
tier: prose
statement: |-
  Given a family of maps $f:\mathbb{P}^N\to\mathbb{P}^N$ and a family of
  points $P$, parametrized by $B$, describe the map
  \[
  B(K_v)\longrightarrow\mathbb{R}\cup\{\infty\},\quad
  t \longmapsto \hat\lambda_{f_t,v}(P_t).
  \]
  In particular, to what extent is it a Weil function associated to some
  divisor in $\operatorname{Div}(B)\otimes\mathbb{R}$?
