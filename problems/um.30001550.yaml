title: Extremal Bounds Relating Word Period Parameters
field: mathematics
tier: prose
statement: Does $|w|>\frac{7}{3}\tau(w)-4$ imply $\tau(w)=\pi(w)$? What is the infimum of $d$ for which a counterexample satisfies $|w|\geq\frac{7}{3}\tau(w)-d$? Must such extremal words be Assous–Pouzet words, and, for fixed $\delta$, how can all words satisfying $\tau(w)<\pi(w)$ and $|w|\geq\frac{7}{3}\tau(w)-\delta$ be described?
