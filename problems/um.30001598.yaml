id: um.30001598
title: Decidability of Semieffective Divisors on Blown-Up Projective Space
field: mathematics
tier: prose
statement: Given $D=dH-\sum_i m_iE_i$ on the blowup $X\to\mathbb{P}^{N}$ of finitely many points, is there a procedure to decide whether $D$ is semi-effective, i.e. whether $h^{0}(X,kD)>0$ for some $k>0$? Equivalently, can one decide whether a degree-$td$ form vanishes at each point $p_i$ to order at least $tm_i$ for some $t$?
