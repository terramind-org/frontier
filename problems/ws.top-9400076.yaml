  \item[\hypertarget{source:9400076:3}{S3}] T. Makoto Minamide, Yoshio Tanigawa and Nigel Watt, On the sum of $\Delta_k(n)$ in the Piltz divisor problem for k3 and4, arXiv2412.11069v1 (2024) Introduction equation1.1 p1. \url{https://arxiv.org/pdf/2412.11069}.
