schema: 1
id: oeisa4290.conjecture
title: Least positive multiple of $n$ in base 10 with digits 0 and 1
field: mathematics
tier: proof
statement: |-
  It is known that $a(10^k - 1) = (10^{9k} - 1) / 9$ for all $k$.
  Is $a(n) < a(10^k - 1)$ for all $n < 10^k - 1$?
  - David Radcliffe, Aug 01 2025
ams:
  - 11
tags:
  - oeis
