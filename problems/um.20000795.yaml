title: An explicit cyclic cubic counterexample from an A4-extension
field: mathematics
tier: prose
statement: |-
  Let
  \[
  \nu(F)=\max\{n\mid I^n\ne0\}.
  \]
  If \(\nu(F)<\infty\), is it true that \(\nu(F')<\nu(F)+1\) for all finite \(F'/F\)?
