title: Perturbation Stability of Jiang–Su Absorption for $C^*$-Algebras
field: mathematics
tier: prose
statement: Does there exist $\delta>0$ such that, if a separable $C^*$-algebra $A$ absorbs the Jiang–Su algebra tensorially, $A\cong A\otimes\mathcal Z$, and $d(A,B)<\delta$, then $B\cong B\otimes\mathcal Z$?
