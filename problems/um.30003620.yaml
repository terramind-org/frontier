title: Exponential Separation of Roots of Bounded Coefficient Polynomials
field: mathematics
tier: prose
statement: Let $\mathcal P_d$ be the set of polynomials of degree at most $d$ whose coefficients all lie in $\{-1,0,1\}$. Does there exist a constant $s>0$, independent of $d$, such that any distinct roots $\alpha$ and $\beta$ of polynomials in $\mathcal P_d$ satisfy $|\alpha-\beta|>s^d$?
