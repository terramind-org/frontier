title: Automaton Kernel Series and $\ell^2$-Betti Values
field: mathematics
tier: prose
statement: Fix integers $n$ and $C$, and let $A$ be an automaton whose letters are $n\times n$ integer matrices with entries in $\{-C,-C+1,\ldots,C\}$. Say that a matrix $M$ of dimension at least $n$ is recognized by $A$ if its entries vanish outside the $n$-neighborhood of the diagonal and $A$ recognizes the word of consecutive $n\times n$ minors along the diagonal. Enumerate the recognized matrices as $M_1,M_2,\ldots$, and let $d(M)$ be the dimension of $M$. What values can $$F_A(x)=\sum_{i\geq1}\dim\ker(M_i)x^{d(M_i)}$$ take at rational $x$? In particular, can $F_A(q)$ be an irrational algebraic number for some automaton $A$ and rational $q$?
