id: um.20000780
title: A toric-pencil obstruction to irrational curve subfields
field: mathematics
tier: prose
statement: Consider $\mathbb{C}(u,v)=\mathbb{C}(\mathbb{P}^2)$. Look at the cyclic algebra $A=(u,v)_n$, defined to be $\mathbb{C}(u,v)\langle x,y \rangle/(x^n-u, y^n-v,xy-\zeta yx)$ with $\zeta$ a primitive $n$th root of unity. Does there exist a transcendence degree 1 subfield of $A$ (also a $\mathbb{C}$-subalgebra) which is not rational? Geometrically, can we find a branched cover $S$ of $\mathbb{P}^2$ corresponding to a maximal subfield of the cyclic algebra, which has a rational map to an irrational curve?
