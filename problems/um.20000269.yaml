title: KL projection under Bayesian misspecification
field: mathematics
tier: prose
statement: |-
  Let us assume that the true probability distribution \(q\) of a
  data generating process is outside the family of models
  \(\mathcal M\) that are being considered. Under what conditions
  does the posterior distribution converge to a distribution with
  smallest KL divergence to the true distribution \(q\)?
