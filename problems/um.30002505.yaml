id: um.30002505
title: Averaging Times for $H^p$ Dirichlet Polynomials
field: mathematics
tier: prose
statement: |-
  For $C>1$, let $T_p(N,C)$ be the least $T$ such that
  $$\frac1T\int_0^T|f(it)|^p\,dt\leq C\|f\|_p^p$$
  for every Dirichlet polynomial $f(s)=\sum_{n=1}^N a_n n^{-s}$ of degree at most $N$. How does $T_p(N,C)$ depend on $p$? In particular, is $T_p(N,C)=O(N)$ for $1\leq p<2$?
