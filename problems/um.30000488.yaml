title: Unramified Pro-$p$ Galois Groups over Infinite Extensions
field: mathematics
tier: prose
statement: Let $F$ be a number field and $L/F$ a pro-$p$ Galois extension unramified outside a finite set $S$ containing the primes above $p$. Determine the Galois group $G_L$ of the maximal unramified pro-$p$ extension of $L$ and its maximal abelian quotient $X_L$.
