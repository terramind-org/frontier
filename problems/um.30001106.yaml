title: Spherical Plancherel Decomposition of $p$-Adic Symmetric Varieties
field: mathematics
tier: prose
statement: For a p-adic symmetric variety $X_v=H_v\backslash G_v$ with fixed invariant measure and maximal compact subgroup $K_v$, decompose $L^2(X_v)^{K_v}$ as a direct integral of irreducible representations and determine the representations and Plancherel density occurring in the decomposition.
