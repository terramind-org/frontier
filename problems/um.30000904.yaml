title: Almost-Disjointness Numbers at Singular Cardinals
field: mathematics
tier: prose
statement: For infinite $\kappa$, let $\mathfrak a_\kappa$ be the least size of a maximal almost-disjoint family of members of $[\kappa]^\kappa$, subject to $\mathfrak a_\kappa\geq\operatorname{cf}(\kappa)$, and write $\mathfrak a=\mathfrak a_\omega$. Is it consistent that $\mathfrak a_{\aleph_\omega}<\mathfrak a$ while $\mathfrak a>\aleph_\omega$? Is it consistent that $\mathfrak a_{\aleph_{\omega_1}}<\mathfrak a_{\aleph_1}$?
