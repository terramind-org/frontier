title: Open Problems in Arithmetic Dynamics — Conjecture 34
field: mathematics
tier: prose
statement: |-
  Let $f\in\mathbb{C}_v(z)$ be a rational function of degree at least $2$, and
  let ${\mathcal{J}}_f\subset\mathsf{P}_{\mathrm{Berk}}^1$ be the Julia set
  of $f$. Then ${\mathcal{J}}_f\cap\mathbb{P}^1(\mathbb{C}_v)$ is equal to the closure
  in $\mathbb{P}^1(\mathbb{C}_v)$ of the set of Type I repelling periodic points
  of $f$.
