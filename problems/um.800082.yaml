title: Foliations and Diffeomorphism Groups — Question 23
field: mathematics
tier: prose
statement: Suppose $\epsilon>0$ is a small number. We have a representation $\rho\colon \pi_1(\Sigma_g) \to \mathrm{Diff}_0(**S**^1)$ such that for a generating set $S$ of $\pi_1(\Sigma_g)$, the set $\rho(S)$ are diffeomorphisms that are at most $\epsilon$ away from $\mathrm{PSL}_2(\mathbb{R})$. Can we bound the GV class for the representation $\rho$ in terms of $g$ and $\epsilon$?
