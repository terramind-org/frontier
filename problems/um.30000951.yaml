title: Spectral and Product Growth in Graphs and Groups
field: mathematics
tier: prose
statement: For a graph, bound the gap between its two largest adjacency eigenvalues. For a finite subset $A$ of an abelian group, bound $|A+A|$ in terms of $|A|$. For a finite subset $A$ of an arbitrary group, bound $|AAA|$ in terms of $|A|$.
