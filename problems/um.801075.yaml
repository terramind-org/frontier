title: "Henon Maps: Open Problems — Question 27"
field: mathematics
tier: prose
statement: |-
  Several articles attempt at giving lower bounds for topological entropy of real H\'enon maps, e.g., [NBGM,NP]. Among others, the paper [NBGM] rigorously showed that $h_{\mathrm{top}}(f_{c, b}|_{\mathbb{R}^2})>0.46469$ for the classical H\'enon's parameter, and this bound is believed to be close to optimal. For upper bounds, the paper [BLS] has shown that $h_{\mathrm{top}}(f_{c, b}|_{\mathbb{R}^2})<\log 2$ if and only if the Julia set of $f_{c, b}$ (as a complex dynamical system) is not contained in $\mathbb{R}^2$. However, there is no algorithm which provides rigorous (non-trivial) upper bounds.

  We thus propose the following problem.

  Construct an algorithm to compute a rigorous upper bound for the topological entropy of a real H\'enon map $f_{c, b}|_{\mathbb{R}^2}$.
