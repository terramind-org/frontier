title: Open Problems on Central Simple Algebras — Problem 12
field: mathematics
tier: prose
statement: |-
  If $F$ is finitely generated over a field $F_0$ with $\operatorname{Br.\!dim}(F_0)$ finite, is $\operatorname{Br.\!dim}(F)$ necessarily finite?

  It is natural to start by considering only certain fields $F_0$. For example, suppose that $F$ has prime characteristic $p$ and we take $F_0$ to be its prime field, so $\operatorname{Br.\!dim}(F_0) = 0$. If $F$ has transcendence degree 1 over $F_0$, then $F$ is global and $\operatorname{Br.\!dim}(F) = 1$. If $F$ has transcendence degree 2 over $F_0$, then $\operatorname{Br.\!dim}(F) \le 3$ by [Lieblich:PI].
