title: Weighted Riesz Transform Inequalities for General Laguerre Expansions
field: mathematics
tier: prose
statement: Let $d\mu_m(r)=\prod_{j=1}^n r_j^{2m_j+1}\,dr_j$. Does the weighted estimate $\int_{\mathbb{R}_+^n}|R_{j,m}f(r)|^p\prod_{j=1}^n r_j^{m_j(p-2)}\,d\mu_m(r)\leq C_p\int_{\mathbb{R}_+^n}|f(r)|^p\prod_{j=1}^n r_j^{m_j(p-2)}\,d\mu_m(r)$ hold for $1<p<\infty$, with $C_p$ independent of $n$ and $m$, for Laguerre expansions of arbitrary type?
