title: Braid-Group Extensions of Zamolodchikov Actions
field: mathematics
tier: prose
statement: Let $\Delta$ and $\Delta'$ be simply laced Dynkin diagrams with Coxeter numbers $k$ and $n-k$. Does the cyclic action generated by the Zamolodchikov transformation on the cluster algebra $\mathcal A(\Delta\square\Delta')$ extend to an action of the extended braid group $\widetilde{\operatorname{Br}}_d$, where $d=\gcd(k,n)$?
