title: The local inverse-zeta fingerprint of a forced rational point
field: mathematics
tier: prose
statement: Consider a family of elliptic curves with a known rational point. Evaluate moments of $L$-functions in this family at certain points. How does the fixed rational point analytically affect calculations? E.g. $y^2=x^3+ax+b^2$ with $a,b$ integers having $|a|,|b|\leq X$ (or in $\mathbb F_q[t]$).
