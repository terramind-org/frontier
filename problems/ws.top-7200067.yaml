statement: |-
  % UnsolvedMath ID 7200067; source catalogue code AMR-071-0067
  \setcounter{section}{7200066}
  \section{The values of the Hermite constants for dimensions other than 1–8 and 24}\label{7200067}
  {\small\sffamily UnsolvedMath ID 7200067 · Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For $d\geq1$, a full-rank lattice is $L=B\mathbb Z^d\subset\mathbb R^d$ for an invertible real $d\times d$ matrix $B$. Let $\operatorname{covol}(L)=|\det B|$ and $\lambda_1(L)=\min\{\|v\|:v\in L\setminus\{0\}\}$, using Euclidean length. The Hermite constant is
  \[\gamma_d=\sup_L\frac{\lambda_1(L)^2}{\operatorname{covol}(L)^{2/d}}.\]
  The historically listed question concerns dimensions other than $1,\ldots,8$ and $24$. The cited 2026 version reports $\gamma_9=2$, addressing the nine-dimensional instance of that historical request.
  \paragraph{Statement recorded in the supplied source.}
  Determine the exact values of $\gamma_d$ in the dimensions $d\notin\{1,2,\ldots,8,24\}$, with the source-supported value $\gamma_9=2$ already available. \sref{7200067}{2}
  \subsection{Short English statement}
  Determine the exact Hermite constants outside dimensions one through eight and twenty-four. The cited version supplies the value two in dimension nine.
  \subsection{Sources}
