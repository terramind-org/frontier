  \item[\hypertarget{source:7200067:2}{S2}] Mathieu Dutour Sikirić and Wessel van Woerden, The lattice packing problem in dimension 9 by Voronoi’s algorithm (arXiv:2508.20719v2, 2026). Section 1, Corollary 1, and Section 2.1, pp. 1–4. \url{https://arxiv.org/pdf/2508.20719v2}.
