title: Boundary Maps for Distorted Hyperbolic Subgroups
field: mathematics
tier: prose
statement: Let $H$ be a Gromov-hyperbolic subgroup of a Lie group $G$, without assuming that $H$ is undistorted. Is there an asymptotically continuous map from the Gromov boundary of $H$ to $G/P$? In rank one, is $H$ asymptotically embedded even when it is not convex cocompact?
