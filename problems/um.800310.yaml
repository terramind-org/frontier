title: Group Actions on 1-Manifolds — Question 27
field: mathematics
tier: prose
statement: |-
  Let $f$ be a $C^2$ circle diffeomorphism of irrational rotation number $\rho$. Given $\varepsilon > 0$, let $M_{\varepsilon}$
  be the *mapping torus* of $f$ over $\mathrm{S}^1 \times [0,\varepsilon]$, that is, the surface obtained by identifying $(x,0) \sim (f(x), \varepsilon)$.
  Let $\rho (\varepsilon) \in \mathbb{R} / \mathbb{Z}$ be such that $M_{\varepsilon}$ corresponds to the elliptic curve
  $\mathbb{C} / ( \mathbb{Z} + i \rho(\varepsilon) \mathbb{Z})$.
  Does $\rho(\varepsilon)$ converges to $\rho$ as $\varepsilon \to 0$ ?
