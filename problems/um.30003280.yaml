title: Euclid-Type Expressions for Primes Congruent to Three Modulo Four
field: mathematics
tier: prose
statement: Let $p_1<p_2<\cdots$ be all primes and $q_1<q_2<\cdots$ the primes congruent to $3$ modulo $4$. Writing $P_k=\prod_{i=1}^kp_i$ and $Q_k=\prod_{i=1}^kq_i$, can one construct a Euclid-type expression in $Q_k$ whose least prime divisor is $q_{k+1}$?
