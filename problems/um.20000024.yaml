statement: "**The \\(K\\)-theory of Johnson--Wilson theory.** The algebraic \\(K\\)-theory of Johnson--Wilson theory \\(E(n)\\) is closely related to the topological cyclic homology of the connective cover of the two periodic Johnson--Wilson theory \\(E'(n)\\). Compute something about \\(\\mathrm{TC}\\) (and related invariants such as \\(\\mathrm{TP},\\mathrm{THH}\\)) of \\(\\tau_{\\geq0}E'(n)\\), where \\(E'(n)\\) is the \\(2\\)-periodic Johnson--Wilson theory."
