statement: Suppose $f(z)=z+\sum^\infty_{n=2}a_nz^n$ is univalent and bounded by $M$ in $\mathbb{D}$. Find \[\sup_t \max_{0\leq t\leq 2\pi}|s_n(e^{it})|,\] where \[s_n(z)=z+\sum^n_{k=2}a_kz^k.\] (F. Holland)
