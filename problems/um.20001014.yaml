title: Curvature versus clustering in regular networks
field: mathematics
tier: prose
statement: |-
  **Problem.** “Is curvature related to clustering?”

  **Remark.** “What is meant by clustering?”

  For a simple unweighted graph with hop distance and uniform neighbor measures, compare non-lazy Ollivier edge curvature, and its vertex average, with the Watts--Strogatz local triangle coefficient. What quantitative relation holds, and does either quantity determine the other?
