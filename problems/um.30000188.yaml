title: Metrics and Coordinate Rings on Voronoi Compactifications
field: mathematics
tier: prose
statement: Let $U_g\to\mathcal{A}_g$ be the universal abelian $g$-fold, let $\overline{U}_g$ be its compactification as the boundary divisor $D\subset\mathcal{A}_{g+1}^F$, and let $L=D|_{\overline{U}_g}$. Does $L$ admit a metric whose restriction to the generic fiber of $U_g\to\mathcal{A}_g$ has translation-invariant curvature? Is $\operatorname{TC}(\mathcal{A}_g^F)$, or its subring $\bigoplus_{a,b\geq0}H^0(\mathcal{A}_g^F,\mathcal{O}(aM-bD))$, finitely generated?
