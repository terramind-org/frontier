title: Virtual-knot problem 49 — Turaev constructed the map from the set of long flat knots to the set of long virtual knots.
field: mathematics
tier: prose
statement: |-
  Turaev constructed the map from the set of long flat knots to the
  set of long virtual knots. Can one construct any map from the set of
  long free knots to the set of long virtual knots? This question can
  be extended and one can try to construct any map which “enlarge”
  the structure.
