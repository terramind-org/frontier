id: um.20000556
title: Constructive syndetic partitions via restricted DFT matroids and irrational rotations
field: mathematics
tier: prose
statement: |-
  **Recovered constructive problem.** Given a measurable set
  \(S\subset\mathbb T\) of positive measure, construct a finite coloring
  \(\mathbb Z=\bigsqcup_{j=1}^r\Lambda_j\) such that every \(\Lambda_j\) is
  syndetic and \(\{e^{2\pi i n x}:n\in\Lambda_j\}\) is a Riesz sequence in
  \(L^2(S)\). Ideally, give effective membership rules, a gap bound, and
  verifiable Riesz bounds.
