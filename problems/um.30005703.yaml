title: Integral Finiteness from Rational or Modular Finiteness
field: mathematics
tier: prose
statement: Let $G$ be of type $\mathrm{FP}_n(F)$ for $F\in\{\mathbb Q,\mathbb F_p:p\text{ prime}\}$. For which classes of groups must $G$ be of type $\mathrm{FP}_n(\mathbb Z)$? Does this hold when there is an exact sequence $G\to H\to\mathbb Z$ with $H$ of type $F$?
