title: Kourovka Notebook Problem 11.29
field: mathematics
tier: prose
statement: |-
  Let $F$ be a free group
  and ${\mathfrak{f}}={\mathbb{Z}F(F - 1)$ the augmentation ideal of the
  integral group ring ${\mathbb{Z}F$. For any normal subgroup $R$ of
  $F$ define the corresponding ideal ${\mathfrak{r}}={\mathbb{Z}F(R - 1)=
  _{\mathrm{id}} (r - 1\mid r \in R)$. One may identify, for instance,
  $F \cap (1 + {\mathfrak{r}} {\mathfrak{f}})=R'$, where $F$ is naturally
  imbedded into ${\mathbb{Z}F$ and $1 + {\mathfrak{r}} {\mathfrak{f}}=\{ 1 +
  a\mid a \in {\mathfrak{r}}{\mathfrak{f}}\} $.

  Identify in an analogous way in terms of
  corresponding subgroups of $F$

  a) $F \cap (1 + {\mathfrak{r}}_1 {\mathfrak{r}_2}\cdot
  \cdot \cdot {\mathfrak{r}}_n)$, where $R_i$ are normal subgroups of $F$,
  $i=1, 2,\ldots ,n$;

  b) $F \cap (1 + {\mathfrak{r}}_1{\mathfrak{r}}_2{\mathfrak{r}}_3)$;

  c) $F \cap (1 + {\mathfrak{f}} {\mathfrak{s}} + {\mathfrak{f}}^n)$, where $F/S$ is finitely generated nilpotent;

  d) $F \cap (1 + {\mathfrak{f}}{\mathfrak{s}}{\mathfrak{f}} +
  {\mathfrak{f}}^n)$;

  e) $F \cap (1 + {\mathfrak{r}}(k) + {\mathfrak{f}}^n)$, $n
  > k \geq 2$, where
  ${\mathfrak{r}}(k)={\mathfrak{r}}{\mathfrak{f}}^{k-1} + {\mathfrak{f}}{\mathfrak{r}} {\mathfrak{f}}^{k-2} + \cdots + {\mathfrak{f}}^{k-1}{\mathfrak{r}}$.

  [Archived solved part(s) of 11.29:]
  f) Let $F$ be a free group and ${\mathfrak{f}}={\mathbb{Z}F(F - 1)$ the augmentation ideal of the integral group ring
  ${\mathbb{Z}F$. For any normal subgroup $R$ of $F$ define the
  corresponding ideal ${\mathfrak{r}}={\mathbb{Z}F(R - 1)= _{\mathrm{id}} (r
  - 1\mid r \in R)$. One may identify, for instance, $F \cap (1 +
  {\mathfrak{r}} {\mathfrak{f}})=R'$, where $F$ is naturally imbedded into
  ${\mathbb{Z}F$ and $1 + {\mathfrak{r}} {\mathfrak{f}}=\{ 1 + a\mid a \in {\mathfrak{r}}{\mathfrak{f}}\} $. Is the quotient group $(F \cap (1 + {\mathfrak{r}} +
  {\mathfrak{f}}^n))/R\cdot \gamma _n(F)$ always abelian?
