title: Gauss-Bonnet Defect of a Complete Manifold
field: mathematics
tier: prose
statement: Let $M$ be a complete Riemannian manifold of even dimension. Suppose that its Euler characteristic $\chi(M)$ and the convergent Gauss--Bonnet curvature integral $C(M)$ both exist. Find a geometrical interpretation of the difference $\delta(M)=\chi(M)-C(M)$.
