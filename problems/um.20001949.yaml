id: um.20001949
title: Flow-closed hyperkähler norm squares and an equivariantly perfect exhaustion criterion
field: mathematics
tier: prose
statement: |-
  **Conjecture 1.1.** Let $X$ be a hyperkähler manifold with a hyper-Hamiltonian action of a compact Lie group $G$. Let $f$ denote the norm-square of the hyperkähler moment map. Suppose that for every $x\in X$, the forward trajectory of $x$ under the negative gradient flow of $f$ is contained in a compact subset of $X$. Then there is a surjection
  \[
  H_K^*(X)\longrightarrow H_K^*(\mu_{HK}^{-1}(0))
  \]
  in $K$-equivariant cohomology.
