title: Open Problems in Mathematical Logic — Problem 9
field: mathematics
tier: prose
statement: |-
  Determine the equivalence classes of quantifier patterns at the
  fourth level of the arithmetical hierarchy:

  (1) How many $\equiv_m$-equivalence classes of
  $\Sigma^0_4$ quantifier patterns are there?

  (2) How many $\equiv_m$-equivalence classes of
  $\Pi^0_4$ quantifier patterns are there?

  (3) How many $\equiv_{dm}$-equivalence classes of
  $\Sigma^0_4$ quantifier patterns are there?
