title: Open Problems in Mathematical Logic — Problem 58
field: mathematics
tier: prose
statement: |-
  Let $\alpha$ be a free, probability measure preserving (p.m.p.) and ergodic action of $\mathbb{F}_2$ on measure space $(X,\mu)$.

  - If $e \neq x \in \mathbb{F}_2$, is there a free, p.m.p action $\beta$ such that $E_\alpha = E_\beta$ and $x$ acts ergodically?

  - (Miller--Tserunyan). Is there a free, p.m.p action $\beta$ such that every nontrivial element of $\mathbb{F}_2$ acts ergodically?
