title: Heart-Independent Hochschild Characteristic Homomorphisms
field: mathematics
tier: prose
statement: If $\mathcal A$ is the heart of a $t$-structure in a $K$-linear triangulated category $\mathcal T$, does there exist a characteristic homomorphism from $HH^*(\mathcal A)$ to the graded centre of $\mathcal T$, and is it heart-independent? In the geometric setting, does the analogue hold for an analytic space or scheme $X$, replacing $D(\mathcal A)$ by $D(X)$ and using $HH^*(X)$?
