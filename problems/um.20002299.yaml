title: "Equal degree in polynomial rings: parameters and the place at infinity"
field: mathematics
tier: prose
statement: |-
  **Question 15 (Demeyer).** For various fields \(K\), consider the relation on \(K[t]\) defined by
  \[
  R(f,g)\Longleftrightarrow \deg(f)=\deg(g).
  \]
  (a) Is this relation (existentially) definable for \(K=\mathbb C\)?
  (b) For \(K=\mathbb F_p\), is there an existential definition, uniform in \(p\)?
