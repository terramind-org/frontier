lean:
  module: FormalConjectures.Wikipedia.ReconstructionConjecture
  decl: ReconstructionConjecture.reconstruction_conjecture
  statement: |-
    theorem reconstruction_conjecture {V W : Type} [Fintype V] [Fintype W]
        (hV : 3 ≤ Fintype.card V) (G : SimpleGraph V) (H : SimpleGraph W)
        (h : Hypomorphic G H) : Nonempty (G ≃g H)
  context:
    - open ReconstructionConjecture
    - "variable {V W : Type*}"
  definitions:
    - name: ReconstructionConjecture.Hypomorphic
      kind: def
      text: |-
        /-- Two graphs are **hypomorphic** if there is a bijection `σ` between their vertex sets such
        that the vertex-deleted subgraphs `G - v` and `H - σ v` are isomorphic for every vertex `v`;
        i.e. `G` and `H` have the same deck of vertex-deleted subgraphs. -/
        def Hypomorphic (G : SimpleGraph V) (H : SimpleGraph W) : Prop :=
          ∃ σ : V ≃ W, ∀ v : V, Nonempty (G.induce {v}ᶜ ≃g H.induce {σ v}ᶜ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/ReconstructionConjecture.lean#L45
