title: Vanishing Subsequences for Unbounded Operators
field: mathematics
tier: prose
statement: Can an unbounded operator $T$ have the property that, for every infinite-dimensional closed subspace $E_0$ and every sequence $(n_k)$, some $x_0\in E_0$ satisfies $T^{n_k}x_0\to0$?
