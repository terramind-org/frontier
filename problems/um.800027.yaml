title: The Lyapin's Notebook — Problem 28
field: mathematics
tier: prose
statement: |-
  (S.I. Kublanovsky)
  Let $C_0$ be a class of finite $0$-simple semigroups.
  Is the class $ \mathbb{K}(C_0)$ decidable, where $\mathbb{K}$ is one of the operators $\mathbb{H}\mathbb{P}, \mathbb{H} \mathbb{P}\mathbb{S}, \mathbb{S}\mathbb{H}\mathbb{P}\mathbb{S}$?\\
  For all other Birkhoff operators, the answer has been obtained in [Kubl6]).
