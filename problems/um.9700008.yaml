title: Relaxation time of Metropolis chains on Cayley graphs
field: mathematics
tier: prose
statement: For the Metropolis chain on a finite Cayley graph with stationary law $\mu(p)$ obtained by stopping random walk at a geometric time, analyze its relaxation time $\tau(p)$. Is $\tau(p)$ decreasing in $p$? Is it universally bounded by a constant times its endpoint value, and can one give decreasing bounds using $p$, the graph size, and standard graph parameters?
