lean:
  module: FormalConjectures.OEIS.«251758»
  decl: OeisA251758.conjecture
  statement: |-
    theorem conjecture :
        IsLeast {x : ℕ | 2 ≤ x ∧ a x = 8}
          (Nat.kthPrimorial 12 / Nat.kthPrimorial (Nat.primeCounting' 8))
  context:
    - open OeisA251758
    - open Nat List
  definitions:
    - name: OeisA251758.a
      kind: def
      text: |-
        /-- $\lfloor n^2 / s \rfloor$, where $s$ is the sum of products of consecutive divisors of $n$ in
        increasing order. -/
        def a (n : ℕ) : ℕ :=
          let divisorsList : List ℕ := (List.range (n + 1)).filter (· ∣ n)
          let sList : List ℕ :=
            (divisorsList.zip divisorsList.tail).map (fun p : ℕ × ℕ => p.fst * p.snd)
          let s : ℕ := sList.sum
          if s = 0 then 0 else n ^ 2 / s
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/251758.lean#L37
