title: Long-Time Dynamics of Randomized Mass-Subcritical NLS
field: mathematics
tier: prose
statement: |-
  Let $d\geq1$, $2/d<p<4/d$, and $\phi\in L^2(\mathbb R^d)$. For

  $$i\partial_tu-\Delta u=\lvert u\rvert^pu,\qquad u(0)=\phi^\omega,$$

  what is the long-time asymptotic behavior beyond free scattering profiles?
