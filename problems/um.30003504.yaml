title: Monotone Cylindrical Decompositions of Compact Sets
field: mathematics
tier: prose
statement: For a compact set $K\subset\mathbb R^n$ and a function $f:K\to\mathbb R$, does there exist a partition of $K$ into monotone cylindrical cells, possibly using different coordinate orders, such that $f$ restricted to every cell is monotone?
