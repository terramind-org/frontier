title: Reducible-Fiber Bounds for Higher-Dimensional Linear Systems
field: mathematics
tier: prose
statement: For pencils of plane curves, at most four completely reducible fibers can occur. What analogous upper bounds hold for linear systems in higher dimensions, and what analogous bounds hold for curves of degree greater than one in the space of hypersurfaces or homogeneous polynomials?
