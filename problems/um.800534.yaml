title: Visibility Graphs of Points, Segments and Polygons — Conjecture 4
field: mathematics
tier: prose
statement: |-
  For all integers $k \geq 2$ and $\ell \geq 2$, there is an integer $h(k,\ell)$ such that any
  point set $P$ of at least $h(k,\ell)$ points in the plane contains
  $\ell$ collinear points, or $k$ mutually visible points.
