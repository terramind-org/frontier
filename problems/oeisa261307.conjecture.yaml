id: oeisa261307.conjecture
title: Prime values in recurrence $a(n+1) = |a(n) - \gcd(a(n), 7n+6)|$
field: mathematics
tier: proof
statement: |-
  It is conjectured that for all $n > 2$, $a(n) = 0$ implies that $7n+6 = a(n+1)$ is prime,
  cf. A186259.
