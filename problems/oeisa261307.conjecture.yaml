lean:
  module: FormalConjectures.OEIS.«261307»
  decl: OeisA261307.conjecture
  statement: "theorem conjecture (n : ℕ) (hn : 2 < n) (ha : a n = 0) : Nat.Prime (7 * n + 6)"
  context:
    - open OeisA261307
  definitions:
    - name: OeisA261307.a
      kind: def
      text: |-
        /--
        The sequence $a(n)$ defined by $a(1) = 1$ and $a(n+1) = |a(n) - \gcd(a(n), 7n+6)|$.
        For $n = 0$, $a(0)$ is set to $0$.
        -/
        def a : ℕ → ℕ
          | 0 => 0
          | 1 => 1
          | n + 2 =>
            let prev := a (n + 1)
            Int.natAbs ((prev : ℤ) - (Nat.gcd prev (7 * (n + 1) + 6) : ℤ))
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/261307.lean#L33
