statement: |-
  \section*{Bounded approximation in uniformly discrete Lipschitz-free spaces}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If a pointed metric space M is uniformly discrete and its real Lipschitz-free Banach space has the approximation property, must that free space have the bounded approximation property for some finite constant?
  \subsection{Short English statement}
  If a pointed metric space M is uniformly discrete and its real Lipschitz-free Banach space has the approximation property, must that free space have the bounded approximation property for some finite constant?
