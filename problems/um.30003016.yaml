title: Adelic Harmonic Metrics on Line Bundles
field: mathematics
tier: prose
statement: Does every line bundle $M$ on $X$ have an admissible adelic metrization $\overline{M}$ whose metric at each place has harmonic curvature and satisfies $\overline{M}\cdot\omega^n=\lambda(M)\omega^{n+1}$, unique up to multiplication by a degree-zero element of $\operatorname{Div}(K)$?
