title: Finiteness of Algebraic Forms with Good Reduction
field: mathematics
tier: prose
statement: For a field $K$ and an absolutely almost simple simply connected or adjoint algebraic $K$-group $G$, when can $K$ be equipped with a natural set $V$ of discrete valuations such that, for every finite $S\subset V$, only finitely many $K$-isomorphism classes of inner $K$-forms of $G$ have good reduction at all $v\in V\setminus S$?
