title: Asymptotic Enumeration of Rank-Three Matroids
field: mathematics
tier: prose
statement: |-
  Let $p(n,3)$ count rank-$3$ matroids and $p'(n,3)$ count rank-$3$ paving matroids with no hyperplane larger than $4$. Is there a constant $c>-2$ such that

  $$\log p(n,3)\sim\log p'(n,3)=\frac1{n-2}\binom n3\bigl(\log(n-2)+c\bigr)$$

  as $n\to\infty$?
