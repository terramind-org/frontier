title: Divisor-complete intermediate full-twist actions for Hurwitz cyclic sieving
field: mathematics
tier: prose
statement: "**Problem 3.8 (recovered).** The polynomial \\(F_W(q)\\) appears, when evaluated at roots of unity, to prescribe orbit sizes for other multiples \\(ph\\) of \\(h\\) between \\(h\\) and \\(nh\\). Can Conjecture 3.7 be generalized by describing corresponding Hurwitz actions? Such elements should be related to solutions of \\(\\boldsymbol w^p=\\boldsymbol c^n\\) in the braid group \\(B_n\\). The endpoint examples are \\(\\boldsymbol w_0^2=\\boldsymbol c^n\\) and \\(\\boldsymbol c^p=\\boldsymbol c^n\\) for \\(p=n\\)."
