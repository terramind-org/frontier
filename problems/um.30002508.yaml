title: Continuity and Strict Monotonicity of Nyman–Beurling Distances
field: mathematics
tier: prose
statement: |-
  In $L^2((0,\infty),t^{-2}dt)$, let $\chi(t)=\mathbf 1_{(1,\infty)}(t)$, let $e_\alpha(t)=\{t/\alpha\}$, and define
  $$D(\lambda)=\operatorname{dist}\!\left(\chi,\operatorname{span}\{e_\alpha:1\leq\alpha\leq\lambda\}\right),\qquad\lambda>1.$$
  Is $D(\lambda)$ continuous? Is it strictly decreasing?
