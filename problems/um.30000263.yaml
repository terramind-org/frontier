title: Discrete Interaction-Matrix Inequalities in Three Dimensions
field: mathematics
tier: prose
statement: For distinct points $a_1,\ldots,a_p\in\mathbb{R}^3$, let $A=(\alpha_{ij})$ be given by $\alpha_{ii}=0$ and $\alpha_{ij}=|a_i-a_j|^{-1}$ for $i\neq j$. Prove that there exists $c(p)>0$ such that, for every $u\in\mathbb{R}^p$, $\sup_{i,k}|u^{\mathsf T}(\partial A/\partial a_i^k)u|+|Au|^2\geq c(p)\sum_{i\neq j}u_i^2/|a_i-a_j|^2$.
