id: um.20000555
title: A half-measure Fourier frame with no two-Riesz partition
field: mathematics
tier: prose
statement: |-
  Does there exist a measurable \(E\subset\mathbb T=\mathbb R/\mathbb Z\), with \(|E|=1/2\), such that for every partition \(\mathbb Z=A\sqcup B\), at least one of \(\mathcal E_E(A)\) and \(\mathcal E_E(B)\) fails to be a Riesz sequence in \(L^2(E)\)?

  It appears under Darrin Speegle's name.

  The preceding lines say that \(E\subset[0,1]\) is measurable and that the displayed family is an exponential frame. The standard notation in Speegle's work and the surrounding sentence recover the intended family unambiguously as

  \[
  \mathcal E_E(\mathbb Z)
   =\{e_n\chi_E:n\in\mathbb Z\},
   \qquad e_n(x)=e^{2\pi i n x},
  \]

  viewed either in \(L^2(\mathbb T)\) with support in \(E\), or canonically in \(L^2(E)\). Thus the question is:

  This report answers **yes**. The set can be chosen compact and contained strictly inside one representative interval \([0,1)\).
