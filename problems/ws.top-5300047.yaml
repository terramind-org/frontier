statement: |-
  \section{Image of a geometric coding tree}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $U\subset\widehat{\mathbb C}=\mathbb C\cup\{\infty\}$ be open and $f:U\to f(U)$ holomorphic and proper (inverse images of compact sets are compact), with $f(U)\supset U$. Choose a root $z\in f(U)$, $d\geq2$ distinct preimages $z^1,\ldots,z^d\in U$, and curves $\gamma^i\subset f(U)$ from $z$ to $z^i$. Here $\mathbb N_0=\{0,1,2,\ldots\}$ and $\Sigma_d=\{1,\ldots,d\}^{\mathbb N_0}$, with left shift $\sigma$. A geometric coding tree consists of choices of successive lifted curves $\gamma_n(\alpha)$ satisfying $\gamma_0(\alpha)=\gamma^{\alpha_0}$, $f\circ\gamma_{n+1}(\alpha)=\gamma_n(\sigma\alpha)$ and $\gamma_{n+1}(\alpha)(0)=\gamma_n(\alpha)(1)$. Write $z_n(\alpha)=\gamma_n(\alpha)(1)$, $D(z_\infty)=\{\alpha:z_n(\alpha)\text{ converges in }\overline U\}$ and $z_\infty(\alpha)=\lim_n z_n(\alpha)$. The construction does not impose absence of critical values when suitable lifts can be chosen.
  \paragraph{Statement recorded in the supplied source.}
  How large can the image $z_\infty(D(z_\infty))\subset\overline U$ be in this general geometric-coding-tree setting? \sref{statement}{2}
  \subsection{Short English statement}
  How much of the limiting region can be reached by convergent branches of a geometric coding tree?
