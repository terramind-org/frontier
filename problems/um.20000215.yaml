title: Vertical tangents and the cubic jumping wall for plane curves
field: mathematics
tier: prose
statement: |-
  The displayed map is
  \[
   \pi:\mathcal M_{g,n}(\mathbf P^r,\beta)\longrightarrow
   \operatorname{Conf}(\mathbf P^r,n),
  \]
  and the question asks for the possible dimensions of its fibers and
  vertical tangent spaces, especially when the map is known to be
  dominant.

  There is a genuine notational inconsistency in the PDF: the sentence before
  the display says that the curve lies in \(\mathbf P^n\), whereas the display,
  the degree \(d\), and the rest of the problem use the ambient dimension
  \(r\). I therefore recover the intended ambient space as \(\mathbf P^r\)
  and write \(\beta=d[\text{line}]\). Since the marked points are ordered, I
  interpret \(\operatorname{Conf}(\mathbf P^r,n)\) as the open subset of
  \((\mathbf P^r)^n\) consisting of ordered pairwise-distinct points. Passing
  to an unordered configuration space is a finite étale quotient away from
  coincident points and does not change the local tangent calculation.

  The source does not specify a compactification or a particular component. The dominance papers cited below use the Brill--Noether component of the
  stable-map space. On this locus the
  stable-map moduli problem is locally the incidence problem for embedded
  curves and marked points. No assertion below extends without modification
  to nodal maps, ramified maps, multiple covers, or contracted components.
