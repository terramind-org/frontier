title: Entropy Rigidity for Hyperbolic Group Actions
field: mathematics
tier: prose
statement: Let $X$ be a proper geodesic hyperbolic space with a geometric group action by $\Gamma$ and boundary a topological $n$-sphere, and let $e(\Gamma)$ be the critical exponent of the action. Is $e(\Gamma)\geq n$, with equality if and only if $X$ is rough-isometric to real hyperbolic space $\mathbb H^{n+1}$?
