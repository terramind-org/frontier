  module: FormalConjectures.OEIS.«229232»
  decl: OeisA229232.conjecture_3
  statement: |-
    theorem conjecture_3 (n : ℕ) (hn : n > 0) (hne : n ≠ 4) :
        ∃ π : Equiv.Perm (Fin n), ∀ i : Fin n,
          (2 * ((π i).val + 1) * ((π ⟨(i.val + 1) % n, Nat.mod_lt _ hn⟩).val + 1) + 1).Prime
