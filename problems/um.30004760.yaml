title: Regularity of Varifolds for Anisotropic Energies
field: mathematics
tier: prose
statement: Does the regularity theorem for rectifiable varifolds with generalized mean curvature bounded in $L^p$, where $p$ is greater than the varifold dimension, extend to anisotropic energies $\Sigma_\Psi(V)=\int\Psi(T_z\Gamma)\theta(z)\,d\mathcal{H}^m(z)$, under the corresponding density-ratio hypothesis?
