title: Kourovka Notebook Problem 18.10
field: mathematics
tier: prose
statement: A formation $\mathfrak{F}$ of finite groups satisfies the *Wielandt property for residuals* if whenever $U$ and $V$ are subnormal subgroups of $\langle U, V\rangle $ in a finite group $G$, then the $\mathfrak{F}$-residual $\langle U, V\rangle ^{\mathfrak{F}}$ of $\langle U, V\rangle $ coincides with $\langle U^{\mathfrak{F}}, V^{\mathfrak{F}}\rangle $. Does every Fitting formation $\mathfrak{F}$ satisfy the Wielandt property for residuals?
