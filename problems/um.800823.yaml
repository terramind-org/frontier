title: Geometric Hydrodynamics in Open Problems — Problem 22
field: mathematics
tier: prose
statement: |-
  Justify the phenomenon observed in {\rm [ModViv19, ModViv21]} that integrable cases of point vortices
  seem to be attractors for 2D Euler flows with generic smooth initial vorticity in 2D (for small numerical viscosity).
  Design a model of dissipation in the 2D Euler equation which would produce such an integrable dynamics at large times.
