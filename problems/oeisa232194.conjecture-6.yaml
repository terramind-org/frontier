title: Ways to write $n = x + y$ with $nx + y$ and $ny - x$ both prime (conjecture_6)
field: mathematics
tier: proof
statement: |-
  Conjecture (iv): Any integer $n > 5$ can be written as $p + q$ ($q > 0$) with $p$ and $nq^2 + 1$
  both prime.
