id: um.20002283
title: Type and projection obstructions for a malformed side-condition problem
field: mathematics
tier: prose
statement: |-
  There is a coloring $F:[\aleph_2]^2 \rightarrow {0,1}$ of pairs from
  $\aleph_2$ in $2$ colors so that the poset of finite approximations to a
  $0$- or $1$-homogeneous set has the $\aleph_2$-chain condition. (We mean
  either the poset $\mathbb P$ of finite functions
  $f:\omega \rightarrow F^{-1}(0)$ or the poset of
  $f:\omega \rightarrow F^{-1}(0)$, ordered by inclusion)

  Can this forcing be made proper using side conditions? Does this preserve
  the $\aleph_2$-chain condition?
