title: Coloring Dense Triangle-Free Graphs and Hajós' Conjecture
field: mathematics
tier: prose
statement: Does there exist a bound $f(1/3)$ on the chromatic number of every triangle-free $n$-vertex graph of minimum degree at least $n/3$; in particular, is $f(1/3)=4$? Is Hajós' conjecture true for triangle-free graphs?
