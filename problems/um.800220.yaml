title: Several Complex Variables Problem List — Problem 16
field: mathematics
tier: prose
statement: |-
  Let $\Omega \subset \subset \mathbb{C}^n$ be a smooth pseudoconvex
  domain. Assume that $\bar\Omega$ has a Stein neighborhood basis. Is
  every function in $A^{\infty}(\bar\Omega)$ uniformly approximable
  by holomorphic functions in a neighborhood of $\bar\Omega$?\\
  -N. Sibony, sibony@anh.matups.fr
