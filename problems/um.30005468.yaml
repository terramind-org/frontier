title: Rational Certificates for Truncated Moment Nonrepresentability
field: mathematics
tier: prose
statement: Let $K=\{x\in\mathbb R^n:g_1(x),\ldots,g_r(x)\geq0\}$ and let $Q(g)$ be the quadratic module generated by $g_1,\ldots,g_r$. For a rational truncated moment vector that is not representable by a measure on $K$, can there be a rational separating polynomial $p\in1+Q(g)$ for which every sum-of-squares certificate of membership in $1+Q(g)$ requires irrational coefficients?
