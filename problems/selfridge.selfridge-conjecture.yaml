  definitions:
    - name: Selfridge.IsSelfridge
      kind: structure
      text: |-
        /-- A number `p` satisfies the *Selfridge condition* if
        1. `p` is odd,
        2. `p ≡ ± 2 (mod 5)`,
        3. `2^(p-1) ≡ 1 (mod p)`
        4. `(p+1).fib ≡ 0 (mod p)`


        This is the condition that is tested in the PSW conjecture.
        Note: this is non-standard terminology. -/
        @[mk_iff]
        structure IsSelfridge (p : ℕ) where
          is_odd : Odd p
          mod_5 : p ≡ 2 [MOD 5] ∨ p ≡ 3 [MOD 5]
          pow_2 : 2^(p-1) ≡ 1 [MOD p]
          fib : (p+1).fib ≡ 0 [MOD p]
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/Selfridge.lean#L33
