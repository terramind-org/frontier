title: Ultraproduct II_1 Factors — Problem 23
field: mathematics
tier: prose
statement: |-
  For the next few problems, recall the equivalence relation of sequantial commutation [elayavalli2023sequential] on the haar unitaries in a II$_1$ factor. For $u,v\in \mathcal{H}(N)$ haar unitaries, say that $u\sim_{N^\mathcal{U}} v$ if there exists a finite set $w_1, \cdots, w_n$ of haar unitaries in $N^{\mathcal{U}}$, such that $[u, w_1]=[w_1,w_2]= \cdots = [w_{n-1}, w_n]= [w_n,v]=0$. In the case that there is a unique orbit among haar unitaries, additionally recall the commutation diameter $\mathfrak{O}(M) := \sup_{u,v\in \mathcal{H}(N)} p_N(u,v)$, where $p_N(u,v)$ denotes the length of the shortest path of sequentially commuting haar unitaries in the ultrapower connecting $u$ and $v$.

  Does there exist a non Gamma factor with unique sequential commutation orbit, and has sequential diameter equal to $n$, $n\in \mathbb{N}$?
