    - open Erdos357.erdos_357.variants.monotone.parts
    - open Filter Asymptotics
  definitions:
    - name: Erdos357.h
      kind: def
      text: |-
        /-- Let $h(n)$ be the maximal $k$ such that there exist integers $1 \le a_1 \leq \dotsc \leq a_k \le n$
        such that all sums of the shape $\sum_{u \le i \le v} a_i$ are distinct. -/
        noncomputable def h (n : ℕ) : ℕ :=
          sSup {k : ℕ | ∃ a : Fin k → ℤ, Set.range a ⊆ Set.Icc 1 n ∧ Monotone a ∧ HasDistinctSums a}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/357.lean#L158
