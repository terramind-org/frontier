lean:
  module: FormalConjectures.ErdosProblems.«357»
  decl: Erdos357.erdos_357.variants.monotone.parts.i
  statement: "theorem erdos_357.variants.monotone.parts.i : (fun n ↦ (h n : ℝ)) =o[atTop] (fun n ↦ (n : ℝ))"
  context:
