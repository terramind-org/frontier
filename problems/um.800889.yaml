title: Open Problems in Pluripotential Theory — Question 20
field: mathematics
tier: prose
statement: |-
  Let $\alpha \in H^{1,1}(X,{\mathbb{R}})$ be a big cohomology class, $\mu$ a smooth volume form and let $T$ be the unique finite energy current in $\alpha$ such that
  $\langle T \rangle^n=\mu$.
  Is $T$ smooth in $Amp(\alpha)$ ?
