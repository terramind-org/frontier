statement: |-
  **Question 6.1.1.** Is the geodesic flow of a metric of nonpositive curvature on a closed surface of genus at least \(2\) ergodic with respect to the Liouville measure?

  Matveev, *Open problems and questions about geodesics*, §6.1, Question 6.1.1. Its mathematical question is:

  The source explains that the flow is ergodic on the invariant set of geodesics meeting the negative-curvature locus. Its complement consists of vectors \(v\) such that

  \[
  K(\gamma_v(t))=0\qquad\text{for every }t\in\mathbb R. \]

  It asks whether this complementary set has Liouville measure zero. It also records the analogous higher-dimensional rank-one question, warns that several 1980s claims of a solution used an incorrect proof that the higher-rank set has measure zero, and distinguishes Liouville measure from Knieper's unique measure of maximal entropy.

  Zero curvature geodesics and flat strips. Comparison with the original PDF shows that §6.2 starts there. It is not part of Question 6.1.1.
