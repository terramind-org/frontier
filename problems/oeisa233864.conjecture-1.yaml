lean:
  module: FormalConjectures.OEIS.«233864»
  decl: OeisA233864.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : 3 < n) : 0 < a n"
  context:
    - open OeisA233864
    - open ArithmeticFunction
    - open scoped ArithmeticFunction.sigma
  definitions:
    - name: OeisA233864.a
      kind: def
      text: |-
        /--
        Number of integers $m$ with $0 < m < 2n$ such that $m = \sigma(k)$ for some $k > 0$,
        and both $2n - 1 - m$ and $2n - 1 + m$ are prime, where $\sigma(k)$ is the sum of the positive
        divisors of $k$.
        -/
        def a (n : ℕ) : ℕ :=
          if n = 0 then 0
          else
            let twiceN : ℕ := 2 * n
            let bigN : ℕ := twiceN - 1
            let kDomain : Finset ℕ := Finset.Ico 1 twiceN
            let sigmaValues : Finset ℕ := kDomain.image (σ 1)
            (sigmaValues.filter (fun m : ℕ =>
              m < bigN ∧
              (bigN - m).Prime ∧
              (bigN + m).Prime
            )).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/233864.lean#L38
