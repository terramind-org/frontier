id: um.30001480
title: Infinite Cycles and Bose–Einstein Condensation
field: mathematics
tier: prose
statement: |-
  For the interacting spatial random-permutation model in dimension $d\geq3$, is the loss of probability mass into infinitely long cycles for an optimizer $P$ of $\chi^{(\leq)}(\beta,\rho)$ equivalent to

  $$\chi^{(\leq)}(\beta,\rho)\neq\chi^{(=)}(\beta,\rho)$$

  and to the appearance of Bose–Einstein condensation? More specifically, for fixed $\beta$, is this loss absent for sufficiently small density $\rho$ and present for sufficiently large $\rho$?
