  module: FormalConjectures.OEIS.«232194»
  decl: OeisA232194.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) :
        a n = 1 ↔ n ∈ ({3, 4, 6, 20, 24} : Finset ℕ)
  context:
    - open OeisA232194
  definitions:
    - name: OeisA232194.a
      kind: def
      text: |-
        /-- Number of ways to write $n = x + y$ ($x, y > 0$) with $nx + y$ and $ny - x$ both prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.Ico 1 n,
            let y := n - x
            if (n * x + y).Prime ∧ (n * y - x).Prime then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/232194.lean#L33
