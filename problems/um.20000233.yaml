title: Euler parity and complete cubic cancellation profiles for plane Welschinger counts
field: mathematics
tier: prose
statement: |-
  **Recovered statement.**  Fix a generic conjugation-invariant configuration
  \(\boldsymbol p\subset \mathbb P^2\) consisting of \(d_1\) real points and
  \(d_2\) pairs of complex-conjugate points, where
  \[
               d_1+2d_2=3d-1.
  \]
  Let \(\mathcal R_d(\boldsymbol p)\) be the finite set of irreducible real
  rational degree-\(d\) plane curves through \(\boldsymbol p\).  For generic
  constraints these curves are nodal.  If \(s(C)\) is the number of solitary
  (elliptic) real nodes of \(C\), define
  \[
   W_2(d,d_2)=\sum_{C\in\mathcal R_d(\boldsymbol p)}(-1)^{s(C)}.
  \]
  Welschinger's theorem makes this signed count independent of the generic
  configuration.  The question in Remark 9.1 is to understand its sign as a
  function of \(d_1,d_2\); the source suggests a sign-reversing injection as a
  possible explanation.
