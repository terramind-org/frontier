id: um.20002892
title: Boundary and Milnor obstructions to deformation into a ball
field: mathematics
tier: prose
statement: |-
  Let \(n\geq 3\), and let \(V\subset\mathbb C^n\) be a complex analytic subvariety of codimension one. Assume that \(0\in V\) is an isolated singularity and that \(\partial V\) is compact and smooth. Can \(V\) be “deformed” into \(\mathbb B^{\,n-1}\subset\mathbb C^{n-1}\)? A smooth deformation \((V_t,\partial V_t)\), for \(t\) in an interval \(I\), is required to have the following local descriptions. Near every \((p_0,t_0)\) with \(p_0\in V_{t_0}\), there is a function \(F(p,t)\), smooth in \((p,t)\) and holomorphic in \(p\), such that \(V_t=\{F(\cdot,t)=0\}\). Near every boundary point there is also a smooth real function \(r(p,t)\) such that locally
  \[
  V_t=\{F(\cdot,t)=0,\ r(\cdot,t)<0\},
  \]
  and the indicated \(p\)-derivatives of \(F\) and \(r\) are linearly independent.
