title: A dual heat-tail certificate and exact zero-free Epstein zeta examples
field: mathematics
tier: prose
statement: |-
  **Problem 2.** Does there exist in each dimension a lattice $L$ for which $E(L,s)$ has no zeroes in $(0,\infty)$?
  *(Note: One can show that if a lattice $L'$ is a local minimizer of $E(L,s)$ for all positive $s$, then at least $E(L',s)$ has no odd order zero in $s$ on $(0,\infty)$.)*
