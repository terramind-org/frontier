title: "Canonical supercharacter products: an exact divisibility criterion"
field: mathematics
tier: prose
statement: |-
  Let \(G\) be a finite group. Let \(\mathcal X\) be a partition of
  \(\operatorname{Irr}(G)\) defining a supercharacter theory, and put
  \(\sigma_X=\sum_{\chi\in X}\chi(1)\chi\). When is the product of two
  such \(\sigma\)'s a positive integer combination of the \(\sigma\)'s?
