title: Competing First-Passage Percolation in Hostile Environments
field: mathematics
tier: prose
statement: For first-passage percolation in a hostile environment on a bounded-degree graph, when does an infinite connected $F_\lambda$ cluster exist? On $\mathbb Z^d$, for $\lambda\in(0,1)$, is there an interval of initial red-particle densities $\mu$ for which infinite $F_1$ and $F_\lambda$ clusters coexist?
