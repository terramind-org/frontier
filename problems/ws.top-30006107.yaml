  \section{Finite Strategies in the Distance Game}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A linear program optimizes $c^Tx$ over a polyhedron $\{x:Ax\leq b\}$. In the simplex method a pivot moves between adjacent basic feasible solutions; a pivot rule chooses the next such move.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  Source-record limitation: The delta-distance property and exact permitted simplex replacement moves are not defined, so neither legal play nor the required terminating strategy can be recovered from this extraction.
  \paragraph{Statement recorded in the supplied source.}
  In the $\delta$-distance game, Peter chooses a leaving vertex of a simplex in the unit ball, and Roland chooses a replacement vertex that preserves the $\delta$-distance property and crosses the opposite face; the game ends when the simplex contains the origin. Does Peter have a strategy that always terminates, and can he force termination within $\operatorname{poly}(d,\delta^{-1})$ rounds? \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-22.
