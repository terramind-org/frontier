title: Minimal Separations Among Lattice Points on Circles
field: mathematics
tier: prose
statement: Let $n$ be a product of distinct primes congruent to $1$ modulo $4$, and consider the lattice points on $x^2+y^2=n$. Can three such points attain separation of order $R^{1/3}$, where $R=\sqrt n$, and how small can the separation be for configurations of $k$ such points?
