title: Asymptotics of Online Random Ramsey Numbers
field: mathematics
tier: prose
statement: Does the diagonal online random Ramsey number satisfy $$\widetilde r_{\mathrm{rand}}(n,n)=2^{(1+o(1))(2/3)n}$$? For every fixed $m\geq3$, does the off-diagonal number satisfy $$\widetilde r_{\mathrm{rand}}(m,n)=n^{(1+o(1))(2/3)m}$$ as $n\to\infty$?
