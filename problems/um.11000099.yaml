title: Question I — s there a constant NS, depending only on S, such that the following holds?
field: mathematics
tier: prose
statement: "s there a constant NS, depending only on S, such that the following holds? Let f∈ ModS and let t =t±1 α1◦t±1 α2◦···◦ t±1 αn is a Dehn multi-twist. If A ={fm(αi): 1 ≤i≤n,m∈ Z} fills S (i.e. for any nontrivial circle γ there exist an α∈ A such that i(γ,α )̸= 0 ), then only a finite number of elements of the form tj◦f, j∈ Z are not pseudo-Anosov, and they are among NS consecutive elements of this family. 4. Fifteen problems about the mapping class groups 77 By a theorem of A. Fathi [ F ath], if t is a Dehn twist, then this is true for NS = 7. A weaker version of this question is still interesting: under the same conditions, is it true that no more than NS elements among tj◦f are not pseudo-Anosov? The initial motivation for this question was that the positive answer would allow to prove the Conjecture 4 in some nontrivial cases. This motivation is now (completely?) obsolete, but I still consider this question as interesting. I believe that Fathi’s paper [ F ath] is one of the deepest and the most underappreciated works in the theory of the mapping class groups. In fact, I am aware of only one application of his results: the author’s theorem [ I2] to the eﬀect that the mapping class groups have rank 1 in an appropriate sense; see [ I7], Section 9.4 for a discussion. The above question may be considered as a test of our understanding of the Fathi’s ideas."
