title: The Lyapin's Notebook — Problem 26
field: mathematics
tier: prose
statement: |-
  (G. Mashevitzky)
  Describe the endomorphism semigroup and the tower of endomorphisms (automorphisms)

  - for endomorphism semigroups of semigroups free in basic classes of semigroups, in particular in the classes of idempotent, commutative Clifford, and Clifford semigroups;

  - for endomorphism semigroups of algebras free in basic classes of mathematical structures.

  For the class of all semigroups and inverse semigroups, the description of semigroups of endo-
  morphisms were obtained in [MS] and [MSZ]. Towers of automorphisms of free inverse
  semigroups are described in [Mash3].
