  % UnsolvedMath ID 7800005; source catalogue code AMR-077-0005
  \setcounter{section}{7800004}
  \section{Extended States with Extensive Disorder}\label{7800005}
  {\small UnsolvedMath ID 7800005 · Mathematical Physics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Establish, in some energy range, the existence of extended eigenstates or continuous spectrum for linear operators with extensive disorder, such as a discrete Schrödinger operator with an i.i.d. random potential acting on $\ell^2(\mathbb{Z}^d)$. Also clarify the borderline case $d=2$.
  \par\smallskip\textit{Formulation references:} \sref{7800005}{1}, \sref{7800005}{2}.
  \subsection{Short English statement}
  Establish, in some energy range, the existence of extended eigenstates or continuous spectrum for linear operators with extensive disorder, such as a discrete Schrödinger operator with an i.i.d. random potential acting on $\ell^2(\mathbb{Z}^d)$. Also clarify the borderline case $d=2$.
