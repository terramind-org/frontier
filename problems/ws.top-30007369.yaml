statement: |-
  \section*{Critical honeycomb polygon diameter and length exponents}\label{30007369}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For simple unoriented honeycomb polygon translation classes with critical weight $w(P)=\rho _v^{|P|}$, define $A(r)=sum_(diam$ $P\geq r)w(P)$, $P(r)=sum_(diam$ $P\geq r)|P|w(P)$ and $M_2(r)=sum_(diam$ $P\leq r)|P|^2w(P)$. Are $A(r)=r^(-2+o(1))$, $P(r)=r^(-2/3+o(1))$ and $M_2(r)\leq r^(2/3+o(1))$, with every indicated sum finite?
  \subsection{Short English statement}
