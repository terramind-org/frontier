title: Length Spectra of Periodic Convex Billiard Trajectories
field: mathematics
tier: prose
statement: For a bounded strictly convex smooth planar domain $\Omega$, determine the length spectrum of periodic billiard trajectories, including the asymptotic behavior of $T_{m,n}=\sup L(\Gamma(m,n))$ and $t_{m,n}=\inf L(\Gamma(m,n))$ as $n\to\infty$.
