  \section{Generator-invariant local efficacy for phylogenetic invariants}\label{20001208}
  {\small\sffamily UnsolvedMath ID 20001208 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A phylogenetic model assigns a probability distribution to observed leaf states on a tree using hidden internal states and stochastic transition matrices along edges. A phylogenetic invariant is a polynomial vanishing on that model. Flattening groups tensor indices into blocks to produce a matrix or lower-order tensor; rank constraints can then give polynomial minors. The exact constraints depend on the mutation model and state cardinality.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  No tree model, data law, significance measure, or comparison criterion is given. The usefulness question remains a methodological prompt rather than an optimization claim. The supplied catalogue marks this record partially solved; its present research status was not independently checked.
  The source text below is rendered literally where necessary; damaged formulas and composite extracts are not silently repaired into a new mathematical claim.
  \paragraph{Statement recorded in the supplied source.}
  Problem 32. "Finding good invariants": Do some of the invariants have more of a statis-tical/biological significance than others? \sref{20001208}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record partially solved; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness.
  \subsection{Short English statement}
  The source asks which phylogenetic invariants have stronger statistical or biological usefulness.
