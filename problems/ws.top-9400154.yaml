title: Are there infinitely many Newman–Shanks–Williams primes
field: mathematics
tier: prose
statement: |-
  \section{Are there infinitely many Newman–Shanks–Williams primes}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $S_0=1$, $S_1=7$ and $S_{n+2}=6S_{n+1}-S_n$ for $n\ge0$. Thus $S_n=\bigl((1+\sqrt2)^{2n+1}+(1-\sqrt2)^{2n+1}\bigr)/2$. These are the Newman--Shanks--Williams numbers; an NSW prime is a prime value $S_n$.
  \paragraph{Statement recorded in the supplied source.}
  Are there infinitely many $n\ge0$ with $S_n$ prime? \sref{statement}{2}
  \subsection{Short English statement}
  Are infinitely many Newman–Shanks–Williams numbers prime?
