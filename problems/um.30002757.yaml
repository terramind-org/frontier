title: Canonical Endpoint Normalizations for Singular Sturm–Liouville Problems
field: mathematics
tier: prose
statement: Formulate satisfactory normalizations of a fundamental system of solutions near endpoints of limit-point or limit-circle type that are not regular singular points, for example for the Lennard–Jones potential $q(x)=4\epsilon((\sigma/x)^{12}-(\sigma/x)^6)$, with $\epsilon>0$ and $\sigma>0$.
