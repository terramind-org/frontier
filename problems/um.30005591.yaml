title: Rigidity and Symmetry of Steady Ricci Solitons
field: mathematics
tier: prose
statement: Prove that two three-dimensional flying-wing steady gradient Ricci solitons with the same asymptotic cone angle are isometric up to rescaling; determine whether $O(2)$-symmetry holds for three-dimensional ancient Ricci flows and higher-dimensional positive-curvature steady solitons, and whether all noncollapsed four-dimensional steady solitons have $O(3)$-symmetry.
