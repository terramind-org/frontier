title: Open Problems in Arithmetic Dynamics — Conjecture 36
field: mathematics
tier: prose
statement: |-
  [[MR1781331]]
  Let $K$ be a locally compact subfield of $\mathbb{C}_v$, and suppose that the
  algebraic closure $\bar{K}$ of $K$ is dense in $\mathbb{C}_v$.
  Let $f\in{K}(z)$ be a rational function of degree at least $2$.
  Then $f$ has no wandering domains.
