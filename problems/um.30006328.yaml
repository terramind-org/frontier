title: Arithmetic Identities from Geometric Trace Formulas
field: mathematics
tier: prose
statement: For a cuspidal Hecke eigensheaf with trace function $f_\phi$, does the geometric trace formula give the predicted arithmetic identity equating the normalized global period of $f_\phi$ with the normalized sheared $L$-value attached to the dual parameter $\phi$?
