title: Magnetic Lieb–Thirring Constants and Geometric Critical Exponents
field: mathematics
tier: prose
statement: For magnetic Schrödinger operators, can the Li–Yau/Lieb–Thirring bound hold for arbitrary magnetic fields when $1\leq\gamma<3/2$? Can a magnetic field change the optimal constant, in particular for $n=3$ and $\gamma=1$? More broadly, do Lieb–Thirring inequalities hold on manifolds, and do their critical exponents depend on the geometry?
