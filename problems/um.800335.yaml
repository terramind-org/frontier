title: Enumeration of Matchings — Problem 6
field: mathematics
tier: prose
statement: |-
  Digressing for a moment from the topic of lozenge tilings,
  I point out that
  in general, the Kasteleyn matrix $K$ is not canonically defined,
  in the sense that there may be many ways of modifying the
  signs of certain entries of the bipartite adjacency matrix
  of a graph so that all non-zero contributions to the
  determinant have the same sign. Thus, one should not expect
  the eigenvalues of $K$ to possess combinatorial significance.
  However, the spectrum of $K$ times its adjoint $K^*$ is independent
  of which Kasteleyn matrix $K$ one chooses (independently shown
  by David Wilson and Horst Sachs). Thus, it is natural to ask:

  What is the significance of the spectrum of
  $K K^*$, where $K$ is any Kasteleyn matrix associated with a
  bipartite planar graph?
