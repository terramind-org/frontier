title: Power Variations of Volatility-Modulated Gaussian Processes
field: mathematics
tier: prose
statement: Determine the weak limit of normalized power variations of a Gaussian process with centered stationary increments. For the volatility-modulated moving-average process $X_t=\int_{-\infty}^t g(t-s)\sigma_s\,dW_s$, determine the asymptotic behavior of its power variations and establish a central limit theorem.
