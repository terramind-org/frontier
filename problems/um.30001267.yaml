title: Compression, Amenability, and Uniform Embeddability of Groups
field: mathematics
tier: prose
statement: What is the Hilbert-space compression of Grigorchuk’s group of intermediate growth? Can an amenable group have Hilbert-space compression less than $1/2$? Is every uniformly embeddable group weakly amenable? Does a finitely generated group exist with no uniform embedding into any uniformly convex Banach space?
