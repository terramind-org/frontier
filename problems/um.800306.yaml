title: Group Actions on 1-Manifolds — Question 23
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finitely-generated group of circle homeomorphisms whose action is $C^0$ structurally stable.
  Suppose that $G$ admits infinitely many non semiconjugate actions on the circle. Does $G$ contain a free subgroup in two generators ?
