id: um.97
title: Almost Sum-Free Sets
field: mathematics
tier: prose
statement: Suppose that $A \subset [N]$ has no more than $\varepsilon N^2$ solutions to $x + y = z$. Can one remove $\varepsilon' N$ elements to leave a sum-free set, where $\varepsilon' \to 0$ as $\varepsilon \to 0$, with a reasonable bound?
