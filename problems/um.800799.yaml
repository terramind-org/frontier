title: Branko Grunbaum in Many Dimensions — Conjecture 6 (Ramos's conjecture)
field: mathematics
tier: prose
statement: |-
  According to Florian Frick, there is reason to think that the answer is yes. Let $\Delta(j,k)$ denote the minimum dimension $d$ such that every set of $j$ objects in $\mathbb{R}^d$ can be simultaneously partitioned into $2^k$ equal pieces by $k$ hyperplanes.

  For every $j, k \ge 1$, $$\Delta(j,k) = \left\lceil \frac{2^k - 1}{k} j \right\rceil.$$
