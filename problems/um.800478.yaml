title: Billiards and Quantitative Symplectic Geometry — Alfonso Sorrentino — Problem 1
field: mathematics
tier: prose
statement: |-
  **Problem:** *Provide examples of real-world systems (from physics, mechanics, biology, economics, etc\ldots) that can be modeled as locally conformal symplectic flows or maps.*

  In the following, we provide some material that could be useful to address this question. We begin by recalling the formal setting, starting from the well-understood *global* conformally symplectic case, namely when the ambient manifold is a symplectic manifold. We then introduce the *local* conformally symplectic case and provide some remarks and computations that may be useful for identifying and constructing the sought-after examples.
