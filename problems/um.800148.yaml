title: Comparative Prime Number Theory — Problem 2
field: mathematics
tier: prose
statement: |-
  **Problem 1**: Numerically compute some further three-way (or higher) races.

  Fiorilli and Martin [FiM] determined the 117 most biased two-way races.

  Determine the $100$ (for example) most biased three-way races.

  It could be more challenging to bound the densities in three-way races sufficiently well to verify that such a list is exhaustive: as Lamzouri [Lam] showed, the rate of convergence of three-way race densities to $\frac16$ is only $O(1/\log q)$, as opposed to a $q^{-1/2+o(1)}$ rate of convergence to $\frac12$ for densities in the two-way case.

  - (Greg Martin, University of British Columbia)
