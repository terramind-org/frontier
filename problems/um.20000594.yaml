title: A five-state area-preserving bi-Lipschitz counterexample to product rigidity
field: mathematics
tier: prose
statement: "**Product quasiconformal mappings of the plane.** Let $f$ be a quasiconformal map of the plane. Suppose at a.e. point, the differential of $f$ either preserves both the $x$-direction and the $y$-direction, or switches the two directions. Does this imply $f$ is a product map?"
