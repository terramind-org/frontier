statement: |-
  \section*{Logarithmic correspondence-coloring bound for fixed forbidden cliques}\label{30007083}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each fixed $r>=4$, do constants $C_r,Delta_r$ exist such that every finite $K_r-subgraph-free$ graph of maximum degree $Delta>=Delta_r$ has correspondence chromatic number at most $ceil(C_r$ Delta/log Delta)?
  \subsection{Short English statement}
  For each fixed $r>=4$, do constants $C_r,Delta_r$ exist such that every finite $K_r-subgraph-free$ graph of maximum degree $Delta>=Delta_r$ has correspondence chromatic number at most $ceil(C_r$ Delta/log Delta)?
