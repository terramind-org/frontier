title: Conjecture — For every finitely generated subgroups G of ModS, the group Φf (G) is nilpotent.
field: mathematics
tier: prose
statement: For every finitely generated subgroups G of ModS, the group Φf (G) is nilpotent. For a a little bit more detailed discussion, see [ I4], Section 10.10. I repeated here this old problem in order to stress that our understanding of the subgroups of finite index in Mod S is rather limited.
