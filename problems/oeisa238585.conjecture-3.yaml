id: oeisa238585.conjecture-3
title: Number of primes $p < n$ with $\text{prime}(p)^2 + (\text{prime}(n) - 1)^2$ prime (conjecture_3)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): If $n > 2$ is not equal to $9$, then
  $\text{prime}(n)^2 + (\text{prime}(p) - 1)^2$ is prime for some prime $p < n$.
