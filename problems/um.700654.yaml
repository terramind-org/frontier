field: mathematics
tier: prose
statement: |-
  a) Is the membership problem soluble for the
  subgroup $E_n(R)$ of $SL_n(R)$ where $R$ is a commutative ring?

  b) Is the word problem soluble for the groups
  $K_i(R)$ where
  $K_i$ are the Quillen $K $-functors and $R$ is a commutative
  ring?
