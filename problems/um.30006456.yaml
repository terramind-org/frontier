statement: For every integer $k\geq1$, prove that there is an explicit polynomial $Q_k$ of degree $k(k+1)/2$ such that $\frac1N\sum_{|d|\leq N,\ d\text{ squarefree}}L(1/2,\chi_d)^k=Q_k(\log N)+o(1)$.
