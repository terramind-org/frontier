title: Foliations and Diffeomorphism Groups — Question 36
field: mathematics
tier: prose
statement: |-
  Elon Lima proved that commuting vector fields for the trivial representation have a common zero.
  I build an example of $C^1$ commuting pair of vector fields with no common zero, equivariant by $\rho$ if $\rho(\pi_1(S))$ is generated by a unique hyperbolic matrix.

  This question is essentially equivalent to the following problem:

  Consider a torus $T^2$ bundle over S. Under what hypothesis on the monodromy $\rho$ can we find a foliation with no compact leaves close to a fiber?
