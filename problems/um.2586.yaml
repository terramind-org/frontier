title: Kourovka Notebook Problem 21.77
field: mathematics
tier: prose
statement: Let $d$ be an integer that is not divisible by $n$-th powers of primes, let $x^n-d$ be an irreducible polynomial over $\mathbb Q$, let $\theta=\sqrt[n]{d}$, and let $K=\mathbb Q(\theta)$ be the radical extension of degree $n$ of the field $\mathbb Q$. The multiplicative group $K^*$ of the field $K$ is canonically embedded into the group $\operatorname{Aut}_{\mathbb Q}(K)$ of all invertible $\mathbb Q$-linear mappings of the $\mathbb Q$-space $K$; let $T$ be the image of $K^*$ under this embedding. In the natural basis $1,\theta,\theta^2,\ldots,\theta^{n-1}$ of the $\mathbb Q$-space $K$ the group $\operatorname{Aut}_{\mathbb Q}(K)$ corresponds to $G=\operatorname{GL}(n,\mathbb Q)$, and the subgroup $T$ to a subgroup $T(d)$ (unsplit maximal torus). Every subgroup $H$ of $G$ containing $T(d)$ and some one-dimensional transformation is rich in elementary transvections and thus defines a net $\sigma=\sigma(H)$. Let $E(\sigma)$ denote the subgroup generated by all transvections in the net group $G(\sigma)$. Is it true that $H\leqslant N_G(E(\sigma))$?
