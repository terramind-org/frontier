title: Exact virtual-RFRS criterion for a non-hyperbolic triangular family
field: mathematics
tier: prose
statement: |-
  **RFRS.** A group \(G\) is *residually finite rationally solvable (RFRS)* if there exists a non-ascending residual chain \((H_i)_{i\in\mathbb N}\) of finite index normal subgroups \(N_i\trianglelefteq G\) with \(H_0=G\), such that \(\ker\alpha_i\leq H_{i+1}\) for every \(i\), where \(\alpha_i:H_i\to H_i^{\mathrm{fab}}\) is the free abelianisation map.

  Characterise the non-hyperbolic free-by-cyclic groups which are virtually RFRS.
