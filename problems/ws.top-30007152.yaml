statement: |-
  \section*{Bounded holomorphic functions under one-sided negative curvature}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must a complex domain diffeomorphic to $R^{2m}$, $m\geq 2$, carrying a complete smooth Kähler metric with $sec\leq -1$ possess a nonconstant bounded holomorphic function? No finite lower bound on sectional curvature is imposed.
  \subsection{Short English statement}
  Must a complex domain diffeomorphic to $R^{2m}$, $m\geq 2$, carrying a complete smooth Kähler metric with $sec\leq -1$ possess a nonconstant bounded holomorphic function? No finite lower bound on sectional curvature is imposed.
