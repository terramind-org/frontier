title: Boundaries of Groups and Kleinian Groups — Problem 61
field: mathematics
tier: prose
statement: For a hyperbolic group G, ACD (∂∞G) = inf G↷X {Hdim(∂∞X, visual)}, where the inﬁmum is taken over all geometric actions of G on metric spaces X. A bolder conjecture would be that, when the inﬁmum is attained, it is attained by a visual metric.
