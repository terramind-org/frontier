title: Kourovka Notebook Problem 20.104
field: mathematics
tier: prose
statement: |-
  (Well-known questions).
  Suppose that a group $G$ is finitely generated and decomposable into a direct product $G = G_1 \times G_2$.

  a) Is it true that the elementary theory of $G$ is decidable if and only if the elementary theories of the groups $G_1$ and $G_2$ are decidable?

  b) Is it true that the universal theory of $G$ is decidable if and only if the universal theories of the groups $G_1$ and $G_2$ are decidable?

  An affirmative answer to question a) for almost soluble groups follows from (G. A. Noskov, *Izv. Akad. Nauk SSSR, Ser. Mat.*, **47**, no. 3 (1983), 498--517).
