title: Negative Dependence for Random Spanning Forests
field: mathematics
tier: prose
statement: Let $G=(V,E)$ be a graph and let $\mathcal F$ be its family of spanning forests. Does the generating polynomial $p_{\mathcal F}(x)=\sum_{F\in\mathcal F}x^F$ satisfy the negative-dependence property $R(1,\{1\})$? More broadly, is there a class between real-stable and Lorentzian polynomials for which $R(c,\mathbb R_{\geq0})$ holds for some $c\in[1,2]$?
