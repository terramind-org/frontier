title: Density Threshold for Rainbow Clique Subdivisions
field: mathematics
tier: prose
statement: For fixed $m\geq2$, what is the smallest $c$ such that every sufficiently large properly edge-colored graph on $n$ vertices with $\Omega(n(\log n)^c)$ edges contains a rainbow subdivision of $K_m$? In particular, does $c=1$ suffice?
