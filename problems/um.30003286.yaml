title: Processes Associated with Regular Representations of Dirichlet Forms
field: mathematics
tier: prose
statement: Let $(\mathcal E,W)$ be a Dirichlet form on $L^2(\mathbb R^d,\rho(x)\,dx)$, let $(\mathcal E,H)$ be its closed realization, and suppose a regular representation of $(\mathcal E,W)$ is given. Which stochastic process is associated with the regular representation, and how is it related to the process associated with $(\mathcal E,H)$?
