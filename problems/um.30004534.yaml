title: Eventual Lefschetz Dichotomies for Symmetric Ideal Chains
field: mathematics
tier: prose
statement: "Let $(I_n)$ be a $\\operatorname{Sym}$-invariant chain of Artinian ideals. Is each Lefschetz property eventually constant along the chain: either $I_n$ has the strong, respectively weak, Lefschetz property for every sufficiently large $n$, or it fails that property for every sufficiently large $n$?"
