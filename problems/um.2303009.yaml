title: Research Problems in Function Theory — Problem 3.9
field: mathematics
tier: prose
statement: If $D$ is a convex domain in space of $3$ or more dimensions, can we assert any inequalities for the Green's function $g(P,Q)$ of $D$ which generalise the results of $2$ dimensions, that follow from the classical inequalities for convex univalent functions? Gabriel proved that the level surfaces $G(P,Q)=\lambda>0$ are convex, but the proof is long. It would be interesting to find a simpler proof, and also to obtain definite inequalities for the curvatures. It may be conjectured that half-space gives the extreme case. (G. E. H. Reuter)
