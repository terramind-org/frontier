title: Smeariness, Stability, and Strong Consistency on Manifolds
field: mathematics
tier: prose
statement: Determine whether a non-positively curved manifold can exhibit only non-positive $k$-smeariness; determine how manifold stability and stickiness are related on a non-Hausdorff Lie-group quotient; and determine whether the inclusion in Ziezold's strong consistency result, $\bigcup_{n=1}^{\infty}\bigcap_{k=n}^{\infty}\widehat E_\rho^{(k)}\subset E_\rho$, can be strict.
