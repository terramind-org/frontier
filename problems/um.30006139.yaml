title: Minkowski Problem for Asymptotic Convex Sets
field: mathematics
tier: prose
statement: Characterize the Borel measures on the spherical domain $\Omega$ that arise as surface-area measures of $C$-asymptotic convex sets in dimensions greater than two. In particular, prove or disprove the conjectured necessary condition $\int_0^{\pi/2}S_K(\omega_\alpha)^{1/(n-1)}\,d\alpha<\infty$.
