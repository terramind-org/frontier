lean:
  module: FormalConjectures.Wikipedia.SternPrime
  decl: SternPrime.isSternPrime_iff
  statement: |-
    theorem isSternPrime_iff :
        ∀ q : ℕ, IsSternPrime q ↔ q ∈ ({2, 3, 17, 137, 227, 977, 1187, 1493} : Set ℕ)
  context:
    - open SternPrime
  definitions:
    - name: SternPrime.IsSternPrime
      kind: def
      text: |-
        /-- Predicate asserting that $q$ is prime and fails `HasPrimePlusTwiceSquare`. -/
        def IsSternPrime (q : ℕ) : Prop :=
          q.Prime ∧ ¬ HasPrimePlusTwiceSquare q
