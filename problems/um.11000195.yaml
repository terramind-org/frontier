title: Problem 3.2 — Find general conditions which ensure that (10) is proper.
field: mathematics
tier: prose
statement: Find general conditions which ensure that (10) is proper. The level set R3∩κ−1(2) consists of characters of abelian representations, and ModΣ is ergodic on each of the four connected components of the smooth part of R3∩κ−1(2). When 2 <t ≤ 18, the ModΣ-action on R3∩κ−1(t) is ergodic. Fort> 18, the level sets R3∩κ−1(t) display both proper dynamics and chaotic dynamics. The region (−∞,−2]3 consists of characters of discrete embeddings ρ where the quotient hyperbolic surface H2/ρ(π) is homeomorphic to a three-holed sphere. Every homotopy equivalence Σ −→ P, where P is a hyperbolic surface homeomorphic to a three-holed sphere, determines such a character. Furthermore these determine closed triangular regions which are freely permuted by ModΣ. On the complement of these wandering domains the action is ergodic. WhenG = PGL(2, R), the group of (possibly orientation-reversing) isometries of H2, a similar analysis was begun by Stantchev [ 94, 52 ]. One obtains similar dynamical systems, where ModΣ acts now on the space of representations into the group G± = SL(2, C)∩ ( GL(2, R)∪ i GL(2, R) ) 13. Mapping class group dynamics on surface group representations 215 which doubly covers the two-component group PGL(2, R). These G±-representations are again parametrized by traces. They comprise four components, one of which is the subset of R3 parametrizing SL(2, R)-representations discussed above. The other three components are R×iR×iR, i R× R×iR, i R×iR× R respectively. Consider iR× R×iR. For −14≤t< 2, the ModΣ-action is ergodic, but when t< −14, wandering domains appear. The wandering domains correspond to homotopy-equivalences Σ−→P, where P is a hyperbolic surface homeomorphic to a two-holed projective plane. The action is ergodic on the complement of the wandering domains.
