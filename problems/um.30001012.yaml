title: Relative Commutants in Maximal Tensor Products
field: mathematics
tier: prose
statement: Let $H\cong\ell^2(\mathbb{N})$, let $C\subset B(H)$ be a maximal abelian self-adjoint algebra isomorphic to $L^\infty(0,1)$, and let $(C\otimes1)^c$ be its relative commutant in $B(H)\otimes_{\max}C_r^*(F_2)$. Is $(C\otimes1)^c=C\otimes C_r^*(F_2)$?
