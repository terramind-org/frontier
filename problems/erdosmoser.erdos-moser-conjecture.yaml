lean:
  module: FormalConjectures.Wikipedia.ErdosMoser
  decl: ErdosMoser.erdos_moser_conjecture
  statement: |-
    theorem erdos_moser_conjecture :
        ∀ k m : ℕ, 0 < k → 0 < m → powerSum k m = m ^ k → k = 1 ∧ m = 3
  context:
    - open ErdosMoser
  definitions:
    - name: ErdosMoser.powerSum
      kind: def
      text: |-
        /-- The power sum $S_k(m)=\sum_{i=1}^{m-1} i^k$. -/
        def powerSum (k m : ℕ) : ℕ :=
          ∑ i ∈ Finset.Ico 1 m, i ^ k
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/ErdosMoser.lean#L40
