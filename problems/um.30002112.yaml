title: Additive Eigenvalue Bounds for Domain Boundaries
field: mathematics
tier: prose
statement: For every dimension $m$, can the eigenvalue estimate for a smooth bounded domain $\Omega\subset\mathbb{R}^{m+1}$ with boundary $\Sigma$ be improved to $\lambda_k(\Sigma)\operatorname{Vol}(\Sigma)^{2/m}\leq A_m I(\Omega)^{1+2/m}+B_m k^{2/m}$, with constants $A_m,B_m$ depending only on $m$?
