title: Problem 5.11 — (Torelli finiteness).
field: mathematics
tier: prose
statement: "(Torelli finiteness). Determine the maximal number f (g) for which there is a K(Ig, 1) space with finitely many cells in dimensions ≤f (g). Here is what is currently known about Problem 5.11: (1) f (2) = 0 since I 2 is not finitely generated (McCullough-Miller [ McM]). (2) f (3)≤ 3 (Johnson-Millson, unpublished, referred to in [ Me]). (3) For g≥ 3, combining Johnson’s finite generation result [ Jo2] and a theorem of Akita (Theorem 5.13 below) gives 1 ≤f (g)≤ 6g− 5. One natural guess which fits with the (albeit small amount of) known data is that f (g) = g−2. As a special case of Problem 5.11, we emphasize the following, which is a folklore conjecture."
