title: Kourovka Notebook Problem 18.79
field: mathematics
tier: prose
statement: |-
  Let $K[G]$ be the group algebra of the finitely generated group $G$
  over the field $K$. Is the Jacobson radical
  ${\mathcal{J}}K[G]$ equal to the join of all nilpotent ideals of the ring? This is
  known to be true if $G$ is solvable or linear.
