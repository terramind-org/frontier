title: Semiclassical Correspondence of Primitive and Poisson Spectra
field: mathematics
tier: prose
statement: If an algebra $A$ is a suitably generic member of a flat family with semiclassical limit a Poisson algebra $R$, is the primitive ideal space of $A$ homeomorphic to the Poisson-primitive spectrum of $R$, and is the prime spectrum of $A$ homeomorphic to the Poisson-prime spectrum of $R$, with the homeomorphisms preserving the appropriate dimensions and group actions?
