title: Conjecture 7.9 — (Topological interpretations of the dj ’s) Let Mj be the union of components of the moduli space of flat connections…
field: mathematics
tier: prose
statement: (Topological interpretations of the dj ’s) Let Mj be the union of components of the moduli space of flat connections M which has Chern-Simons value cj. Then dj = 1 2 max A∈Mj (h1 A− h0 A), where max here means the maximum value that (h1 A−h0 A) assumes on a Zariski open subset of Mj. Note that this conjecture might be rather optimistic, and ma y only hold in the non-degenerate cases. However, we do not know of any cases wh ere it fails (see [136]).
