title: A formulation audit and ball-calibration obstruction for space-form quermassintegral problems
field: mathematics
tier: prose
statement: |-
  Isoperimetric type problems for quermassintegrals in hyperbolic or spherical space.

  It is item 1.5 in the “Inequalities” section of the 2019 AIM workshop *Symmetry and convexity in geometric inequalities*. The record contains no remarks or literature field.

  This sentence names a research direction, not a proposition with a truth value: it specifies neither dimension, normalization of quermassintegrals, pair of indices, admissible sets, convexity condition, inequality direction, nor equality case. I therefore classify this record as `context_only`, not as a solved or open theorem.

  A defensible modern decomposition is:

  1. the classical volume/surface-area isoperimetric inequality in a space form;
  2. pairwise Alexandrov--Fenchel inequalities between genuine quermassintegrals, with equality at geodesic balls;
  3. analogous inequalities for raw curvature integrals;
  4. variants under convexity, horospherical convexity, star-shapedness, or curvature-cone hypotheses;
  5. stability estimates measuring distance from a ball by the inequality deficit.

  These are different problems. Results for one class or normalization must not be reported as resolving all the others.
