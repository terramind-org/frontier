title: $p$-Adic Special-Value Formulas over Totally Real Fields
field: mathematics
tier: prose
statement: For a totally real number field $k$, an odd integer $n\geq2$, and any prime $p$, is $$L_p(n,\omega_p^{1-n},k)D_k^{1/2,p}=q_p(n,k)\operatorname{Eul}_p(n,k)R_{n,p}(k)$$ for some $q_p(n,k)\in\mathbb Q^*$, with $q_p(n,k)=q(n,k)$ from Borel's complex formula? Are $L_p(n,\omega_p^{1-n},k)$ and $R_{n,p}(k)$ nonzero?
