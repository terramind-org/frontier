title: A theta compactification and tropical obstructions for the rank-one braid
field: mathematics
tier: prose
statement: |-
  How does this relate to compactifications coming from tropical geometry?

  The pronoun “this” is not self-contained. The immediately preceding records ask:

  - 4.1 for a natural compactification of a braid variety whose smaller strata have cluster structures;
  - 4.2 whether brick manifolds can be obtained cluster-theoretically;
  - 4.3 how the construction relates to subword complexes.

  The AIM workshop report confirms this reconstruction. For a positive braid word \(\beta\), it considers
  \[
  X(\overline\beta;\delta(\beta))\subset\operatorname{brick}(\beta),
  \]
  and reports a proposed cluster compactification with potential
  \[
  W=z_1+\cdots+z_\ell. \]
  Thus problem 4.4 asks how the word-relative brick/cluster compactification and its subword strata compare with compactifications built from tropical data.

  There are at least four mathematically different meanings of “coming from tropical geometry,” so the comparison is meaningless unless they are separated:

  1. Tevelev’s closure of a very affine variety in a toric variety;
  2. a GHKK theta compactification obtained by taking Proj of a positive-set theta algebra;
  3. a toric degeneration associated with a seed valuation or Newton--Okounkov body;
  4. a toric variety constructed from an ordinary Newton, moment, or brick polytope.

  The main result below makes all four distinctions explicit for the nontrivial braid \(\beta=\sigma_1^3\).
