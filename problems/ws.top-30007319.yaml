tier: prose
statement: |-
  \section*{Stable amplitude blowup for a supercritical defocusing torus equation}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Does the defocusing power NLS i $partial_t$ u+Delta $u-|u|^{p-1}u=0$ on $T^12$ admit an odd $p\geq 3$, finite integer $k>8$ and a nonempty open set in $H^k$ such that every initial datum in that set has finite-time classical $H^k$ blowup? Require a point $x_*$ and $c_0>0$ with $(T-t)^(1/(p-1))|u(t,x_*)|\to c_0$.
  \subsection{Short English statement}
  Does the defocusing power NLS i $partial_t$ u+Delta $u-|u|^{p-1}u=0$ on $T^12$ admit an odd $p\geq 3$, finite integer $k>8$ and a nonempty open set in $H^k$ such that every initial datum in that set has finite-time classical $H^k$ blowup? Require a point $x_*$ and $c_0>0$ with $(T-t)^(1/(p-1))|u(t,x_*)|\to c_0$.
