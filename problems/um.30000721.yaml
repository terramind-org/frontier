title: Hamilton Circles in Squares and Cubes of Infinite Graphs
field: mathematics
tier: prose
statement: For a countable two-connected graph $G$, does the Freudenthal compactification $|G^2|$ contain a Hamilton circle? For a countable connected graph $G$, does $|G^3|$ contain a Hamilton circle? Here $G^k$ joins vertices at graph distance at most $k$, and a Hamilton circle contains every vertex and every end.
