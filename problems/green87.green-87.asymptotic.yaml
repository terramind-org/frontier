lean:
  module: FormalConjectures.GreensOpenProblems.«87»
  decl: Green87.green_87.asymptotic
  statement: |-
    theorem green_87.asymptotic :
        ∀ p : ℕ → ℝ, (∀ k, Tendsto (fun n ↦ i n k) atTop (𝓝 (p k))) →
          ∃ C : ℝ, 0 < C ∧
            p ~[atTop] fun k : ℕ ↦ C * (k : ℝ) ^ (-δ) * (Real.log k) ^ (-(3 / 2 : ℝ))
  context:
    - open Green87
    - open Green87.green_87
    - open Filter Asymptotics Topology
  definitions:
    - name: Green87.i
      kind: def
      text: |-
        /-- `i n k` is the proportion of permutations of $[n]$ that fix a set of size $k$, denoted
        $i(n, k)$ in [BW15] and [EFG16]. -/
        noncomputable def i (n k : ℕ) : ℝ :=
          (Nat.card {σ : Equiv.Perm (Fin n) // FixesSet σ k} : ℝ) / (Nat.card (Equiv.Perm (Fin n)) : ℝ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/GreensOpenProblems/87.lean#L46
    - name: Green87.δ
      kind: def
      text: |-
        /-- The Erdős–Ford–Tenenbaum constant $\delta = 1 - \frac{1 + \log \log 2}{\log 2} \approx 0.086$,
        called $\alpha$ in [Gr24]. -/
        noncomputable def δ : ℝ := 1 - (1 + Real.log (Real.log 2)) / Real.log 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/GreensOpenProblems/87.lean#L60
