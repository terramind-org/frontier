statement: (T. Kohno) Compute the holonomy of the space of conformal blocks of the twisted WZW model. In particular, determine th e action of the braid group of Σ on the space of conformal blocks for each G flat connection on Σ. There is also a notion of the algebra of chord diagrams on n strings with horizontal chord on Σ, which we shall denote by An(Σ).
