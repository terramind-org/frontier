title: Energy and spectral-gap gates for Lagrangian corners
field: mathematics
tier: prose
statement: "**Question 1.12.** In setting up such an extended field theory picture, it is important to formulate holomorphic curve theory for manifolds with boundary, or open manifolds with some asymptotic conditions. The basic idea is that when you replace boundary conditions with asymptotic conditions, you get more information about and control over how you approach the boundary. For example, if you are looking at holomorphic curves with boundary in a Lagrangian, it is sometimes better to consider curves with asymptotics in the unit cotangent bundle of the Lagrangian. More generally, for the extended field theory picture, one may need to consider holomorphic curves with boundary along some Lagrangian cylinders, and then you have holomorphic curves with corners, two different types of asymptotic conditions..."
