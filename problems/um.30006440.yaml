title: Extremal Diameters of Symmetric-Group Cayley Graphs
field: mathematics
tier: prose
statement: Prove the proposed upper bound $\frac{1}{2}n^2+4n$ for diameters of undirected Cayley graphs of $S_n$. Prove or disprove that the explicit square-with-whiskers generating families maximize the diameter for every $n$, extending the computations through $n=15$.
