  Note that only the presence of the large prime factor 73 makes one doubt
  that there is a general formula; the other prime factors are reassuringly
  small. Further data might make it clear what that 73 is doing there.

  Count the domino tilings of an Aztec diamond from which
  two close-to-central squares, related by a knight's move, have been
  deleted.
