title: Failure of Faber’s Conjecture in Genus Five
field: mathematics
tier: prose
statement: For $g\geq5$, determine whether the Faber conjecture fails; in particular, proving $\operatorname{RH}^4(M_5,V_{2222})\ne0$, together with the expected $\operatorname{RH}^2(M_5,V_{2222})=0$, would produce a counterexample.
