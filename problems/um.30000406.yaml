title: Strong Uniform Torsion Conjecture for Abelian Varieties
field: mathematics
tier: prose
statement: "Strong Torsion Conjecture: for every $g,d\\geq1$, does there exist $n(d,g)\\geq1$ such that no abelian variety of dimension at most $g$, defined over a number field of degree at most $d$, has a rational torsion point of order at least $n(d,g)$?"
