title: Self-Duality of Quasi-Supersingular Group Schemes
field: mathematics
tier: prose
statement: Let $G$ be a $p$-torsion finite flat commutative group scheme over the Witt vectors $W$ of rank $p^{2n}$ whose special fiber $\overline G$ is quasi-supersingular. For $n\geq3$, must $G$ and $\overline G$ be self-dual?
