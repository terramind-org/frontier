title: Quadratic Growth without Quadratic Control Regularization
field: mathematics
tier: prose
statement: For distributed optimal control of the $H^1$-critical defocusing wave equation on a bounded domain in $\mathbb R^3$, do the strong quadratic-growth property and the resulting stability estimates remain valid when $\beta_2=0$, so that the objective has no quadratic $L^2$ control penalty?
