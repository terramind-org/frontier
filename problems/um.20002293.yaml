title: Finite-fragment and ultraproduct criteria for transcendence-degree parity
field: mathematics
tier: prose
statement: |-
  **Question 9 (Flenner).** Is there a sentence \(\varphi\) in the language of rings
  such that
  \[
  \mathbb Q(t_1,\ldots,t_n)\models\varphi
  \quad\text{if and only if}\quad n\text{ is even}?
  \]
  Using ultrapowers, one might show this is not possible.
