title: Kourovka Notebook Problem 17.6
field: mathematics
tier: prose
statement: |-
  a) Is there a function $f:\mathbb{N}\times\mathbb{N}\rightarrow
  \mathbb{N}$ such that every nilpotent group generated by $d$ left
  $n$-Engel elements is nilpotent of class at most $f(n,d)$?

  b) Is there a function
  $g:\mathbb{N}\times\mathbb{N}\rightarrow \mathbb{N}$ such that
  every nilpotent group generated by $d$ right $n$-Engel elements is
  nilpotent of class at most $g(n,d)$?
