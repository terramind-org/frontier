id: dickson.infinite-safe-primes
title: Dickson's conjecture (infinite_safe_primes)
field: mathematics
tier: proof
statement: |-
  **The infinitude of Sophie Germain primes**
  There are infinitely many primes $p$ such that $2p + 1$ is prime.
