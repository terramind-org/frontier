title: Lyashko-Looijenga fibers, noncrossing chains, and a dihedral shuffle model
field: mathematics
tier: prose
statement: The Lyashko--Looijenga mapping associates to any complex-valued function on a manifold the polynomial in one variable whose roots are the critical values of the function. The main theorem in [34] states that this mapping is a ramified covering for some families of functions. There is a known relationship between the Lyashko--Looijenga covering of the complex sphere, and the combinatorial cacti of Ian Goulden and David Jackson [27]. Interpret the combinatorics of the type $A$ noncrossing partitions in terms of the Lyashko--Looijenga covering of the sphere. The degree of the covering is $n^{n-2}$, which is also the number of maximal chains in $NC_{A_{n-1}}$. This number is known to count many things, including labelled trees, and cacti. Do these combinatorics generalize to other types?
