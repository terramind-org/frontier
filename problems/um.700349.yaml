title: Kourovka Notebook Problem 6.2
field: mathematics
tier: prose
statement: |-
  The
  totality of $C $-closed subgroups of an arbitrary group $G$ is a
  complete lattice with respect to the operations
  $\; A \wedge B=A \cap B,\; \; \; A\vee B=C(C(A) \cap
  C(B)).$
  Describe the groups whose lattice of $C $-closed subgroups is a
  sublattice of the lattice of all subgroups.
