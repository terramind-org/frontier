title: Practical Criteria for Metrizable Universal Minimal Flows
field: mathematics
tier: prose
statement: Find a verifiable sufficient condition on a topological group $G$ that implies metrizability of its universal minimal flow $M(G)$ and is easier to check than the existence of a closed, co-precompact, extremely amenable subgroup of $G$. In particular, if $G$ is the automorphism group of a countable structure homogeneous in a finite relational language, must $M(G)$ be metrizable?
