  \section{5.16 (Walsh) — Hyperbolic groups with Kleinian-type boundaries}\label{10900041}
  {\small UnsolvedMath ID 10900041 · Group Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  If $G$ is a Gromov-hyperbolic group whose boundary is homeomorphic to the limit set of a convex-cocompact Kleinian group, is $G$ virtually a convex-cocompact Kleinian group?
  \par\smallskip\textit{Formulation references:} \sref{10900041}{1}, \sref{10900041}{2}, \sref{10900041}{3}.
  \subsection{Short English statement}
  If $G$ is a Gromov-hyperbolic group whose boundary is homeomorphic to the limit set of a convex-cocompact Kleinian group, is $G$ virtually a convex-cocompact Kleinian group?
