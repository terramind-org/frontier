lean:
  module: FormalConjectures.Wikipedia.Catalan
  decl: Catalan.pillais_conjecture
  statement: |-
    theorem pillais_conjecture (a b c : ℕ) (ha : 0 < a) (hb : 0 < b) (hc : 0 < c) :
        { (x, y, m, n) : (ℕ × ℕ × ℕ × ℕ) |
          1 < x ∧ 1 < y ∧ 1 < m ∧ 1 < n ∧ (m, n) ≠ (2, 2) ∧
          a * x^n - b * y^m = c }.Finite
  context:
    - open Catalan
  definitions: []
