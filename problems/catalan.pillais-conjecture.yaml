schema: 1
id: catalan.pillais-conjecture
title: Catalan's conjecture and related Diophantine equations (pillais_conjecture)
field: mathematics
tier: proof
statement: |-
  For positive integers a, b, and c, there are only finitely many positive solutions (x, y, m, n) to the
  equation $ax^n - by^m = c$ where $(m, n) \neq (2, 2)$ and $x, y > 1$.
