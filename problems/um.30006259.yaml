title: Orbit Decompositions in Wonderful Group Schemes
field: mathematics
tier: prose
statement: Let $x$ lie in a chamber $C$ of the Bruhat–Tits building, let $G(k)_{C,0}$ be the associated Iwahori subgroup, and let $G_{x,f}$ be the corresponding wonderful group scheme. Classify the $G(k)_{C,0}\times G(k)_{C,0}$-orbits in $G_{x,f}(\mathfrak{o})$, and describe its diagonal-stable pieces, in analogy with the Bruhat decomposition and stable-piece decomposition of the wonderful compactification.
