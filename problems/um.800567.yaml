title: Visibility Graphs of Points, Segments and Polygons — Problem 41
field: mathematics
tier: prose
statement: |-
  Although the most natural form of representation for visibility graphs would be to use coordinates
  of the points, this is not useful if we are looking for a space efficient representation. Lin and
  Skiena [ls-cavg-95] have proved that visibility graphs require endpoints to have
  exponential sized integers. However, it is not known whether singly exponential sized integers are
  sufficient. It is important because if we could guarantee that the number of bits in the integer is
  polynomial, then visibility graph recognition is in $NP$ [s-grep-03].

  Can all endpoints of a visibility graph be assigned integer coordinates such that the integers use
  a polynomial number of bits?
