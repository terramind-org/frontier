statement: |-
  \section*{Critical center magnetization in fixed-boundary XY boxes}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Assuming the explicitly scoped height, renormalization and spin-field companion inputs, is the center magnetization $a_n$ in the critical planar XY fixed-boundary box asymptotic to A $n^{-1/8}(\log $ $n)^{1/16}$, for a positive model-dependent A?
  \subsection{Short English statement}
  Assuming the explicitly scoped height, renormalization and spin-field companion inputs, is the center magnetization $a_n$ in the critical planar XY fixed-boundary box asymptotic to A $n^{-1/8}(\log $ $n)^{1/16}$, for a positive model-dependent A?
