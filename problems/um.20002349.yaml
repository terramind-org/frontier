title: A bounded-class obstruction for quotient Diophantine interpretations
field: mathematics
tier: prose
statement: |-
  **Question 12 (Cornelissen).** If \(\mathbb Z\) admits a Diophantine interpretation in \(\mathbb Q\) (that is, using an equivalence relation), does it follow that Mazur's conjecture is wrong?
  See Cornelissen--Zahidi, Contemp. Math. 270 253--260.

  For every variety \(X\) over \(\mathbb Q\), the closure of \(X(\mathbb Q)\)
  in \(X(\mathbb R)\), with the Euclidean topology, has only finitely many
  connected components.
