title: Open Problems in the Theory of Ample Fields — Question 4
field: mathematics
tier: prose
statement: |-
  Another Galois theoretic property that the local fields ${\mathbb{Q}}_p$, $\mathbb{R}$, and $\mathbb{C}$
  share, apart from having a prosovable absolute Galois group,
  is that their absolute Galois groups are all finitely generated (as topological groups).
  The following question occurs as a conjecture in [JunkerKoenigsmann]:

  Is every infinite field $K$ with finitely generated absolute Galois group $G_K$ ample?
