lean:
  module: FormalConjectures.Wikipedia.Firoozbakht
  decl: Firoozbakht.firoozbakht_conjecture
  statement: |-
    theorem firoozbakht_conjecture (n : ℕ) :
        firoozbakhtSeq (n+1) < firoozbakhtSeq n
  context:
    - open Firoozbakht
    - open Real
  definitions:
    - name: Firoozbakht.firoozbakhtSeq
      kind: def
      text: |-
        /--
        The sequence of $\sqrt[n]{p_n}$ where $p_n$ is the n:th prime number.
        -/
        noncomputable def firoozbakhtSeq (n : ℕ) : ℝ :=
          (n.nth Prime)^(1/(n + 1) : ℝ)
