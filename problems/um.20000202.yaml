id: um.20000202
title: Finite algebraic certificates for recognition by invariant signatures
field: mathematics
tier: prose
statement: |-
  **How can we use these signatures for object recognition?**

  The archived section introduction says: “From a differential geometry perspective we can assign invariants to a smooth curve or surface. This allows us to assign a signature curve to each curve.” The neighboring questions ask about completeness, degree, automorphism groups, realizability, and moduli of signature curves. The workshop report identifies the relevant day as “Shapes, silhouettes, and contours,” with talks by Matthew Trager, Peter Olver, and Irina Kogan. Thus “these signatures” means invariant signature curves of geometric boundaries, especially differential signatures, with algebraic signatures as a central workshop specialization.

  For an oriented regular planar curve under the proper Euclidean group \(SE(2)\), the classical smooth signature is
  \[
    s\longmapsto \bigl(\kappa(s),\kappa_s(s)\bigr),
  \]
  where \(s\) is Euclidean arc length. Analogous signatures use equi-affine or projective differential invariants. For algebraic curves it is advantageous to use a *rational classifying pair*. For example, Kogan--Ruddy--Vinzant use \((\kappa^2,\kappa_s)\) for the complexified \(SE(2)\)-action. They also give rational pairs for \(SA(2)\), \(A(2)\), and \(PGL(3)\).

  “Recognition” is interpreted mathematically as deciding whether two boundary curves lie in the same orbit of a specified transformation group \(G\). This is not the same as assigning a semantic label such as “car” or “chair.” A semantic classifier may use invariant signatures as features, but its statistical generalization is a separate question.

  The original live `aimpl.org` URL now redirects to a missing page.
