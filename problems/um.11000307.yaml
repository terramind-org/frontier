title: Problem 3.4 — Prove that all the secondary classes d2,d 3,··· are non-trivial.
field: mathematics
tier: prose
statement: Prove that all the secondary classes d2,d 3,··· are non-trivial. Here is a problem concerning the first class d1. Let C be a separating simple closed curve on Σg which divides Σ g into two compact surfaces of genera h and g−h and let τC ∈K g be the Dehn twist along C. Then we know that the value of d1 onτC∈K g ish(g−h) (up to a constant depending on g). This is a very simple formula. However at present there is no known algorithm to calculate the value d1(ϕ) for a given element ϕ∈K g, say by analyzing the action of ϕ onπ1Σg.
