statement: |-
  Problem 1.
  5. (Hassett) Prove the valuative criterion for properness for the moduli stack of stable surfaces in positive characteristic.

  **Problem 1.5 (Hassett).** Prove the valuative criterion for properness for the moduli stack of stable surfaces in positive characteristic.

  The exact mathematical sentence is:

  The source did not fix a characteristic, a volume, or a smoothability component. Thus its literal scope is all positive characteristics and the full stable-surface moduli problem.

  In a modern precise formulation one fixes numerical data, most commonly the volume
  \[
  v=K_S^2
  \]
  (and, for pairs, a coefficient set and corresponding Hilbert data), and uses the Kollár condition in the definition of a family. For a discrete valuation ring \(R\) with fraction field \(K\), the existence part of the valuative criterion asks that a stable surface over \(K\) extend to a stable family after replacing \(R\) by the integral closure in a finite extension of \(K\). The uniqueness part is separatedness. Properness is therefore stronger than algebraicity, finite type, separatedness, or projectivity of subspaces already known to be proper.
