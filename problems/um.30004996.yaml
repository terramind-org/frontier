title: Hyper-Aperiodic Colorings from Aperiodic SFT Colorings
field: mathematics
tier: prose
statement: Let $S\subseteq q^\Gamma$ be a subshift of finite type and let $f:\operatorname{Free}(k^\Gamma)\to q$ be a Borel aperiodic $S$-coloring. Must $\operatorname{Free}(k^\Gamma)$ also admit a Borel hyper-aperiodic $S$-coloring?
