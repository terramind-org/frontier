title: Harder Congruences and Yoshida-Type Siegel Modular Liftings
field: mathematics
tier: prose
statement: Let $f=\sum_{n\geq1}a(n)q^n$ be a normalized eigenform of weight $l+m+4$ for $\operatorname{SL}_2(\mathbb Z)$, and let $\ell$ be a sufficiently large prime in its coefficient field dividing $\Lambda(f,l+3)$. Must there exist a Siegel modular eigenform $F$ of weight $(l-m,m+3)$ whose Hecke eigenvalues satisfy $\lambda(p)\equiv p^{m+1}+a(p)+p^{l+2}\pmod{\ell^{\prime}}$ for a prime $\ell^{\prime}$ above $\ell$? If $f\in S_{l+m+4}(\Gamma_0(2))^{\mathrm{new}}$ and $g\in S_{l-m+2}(\Gamma_0(2))^{\mathrm{new}}$, must there exist a Siegel eigenform $F\in S_{l-m,m+3}(\Gamma_2[2])$ with $L(F,s)=L(f,s)L(g,s-m-1)$, with multiplicity five when the two newforms have the same $w_2$-eigenvalue and multiplicity one otherwise? Does the corresponding level-four lifting occur with multiplicity five in $S_{l-m,m+3}(\Gamma_2[2])$?
