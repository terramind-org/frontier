lean:
  module: FormalConjectures.Wikipedia.RepunitPrime
  decl: RepunitPrime.infinitely_many_repunit_primes
  statement: |-
    theorem infinitely_many_repunit_primes :
        {n : ℕ | (repunit10 n).Prime}.Infinite
  context:
    - open RepunitPrime
  definitions:
    - name: RepunitPrime.repunit10
      kind: def
      text: |-
        /-- The decimal repunit of length $n$, defined as $1 + 10 + \cdots + 10^{n-1}$. -/
        def repunit10 (n : ℕ) : ℕ :=
          ∑ i ∈ Finset.range n, 10 ^ i
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/RepunitPrime.lean#L37
