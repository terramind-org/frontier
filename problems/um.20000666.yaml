statement: Let $X_{\mu^2}=\overline{\{T^k(\mu^2):k\in\mathbb N\}}$ and $X_\mu=\overline{\{T^k(\mu):k\in\mathbb N\}}$, for $T$ the shift map. What are the pre-images of $f:X_\mu\to X_{\mu^2}$ given by $(x_i)\mapsto(x_i^2)$ in $X_{\mu^2}$?
