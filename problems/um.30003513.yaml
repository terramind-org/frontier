title: Geometric Description of Pure Local Arthur Packets
field: mathematics
tier: prose
statement: For every Arthur parameter $\psi$ of $G$, is the pure local Arthur packet $$\Pi^{\mathrm{pure},\psi}(G/F)=\{[\pi,\delta]\in\Pi^{\mathrm{pure}}(G/F):\operatorname{Ev}^0_\psi(P(\pi,\delta))\neq0\},$$ with pairing $$\langle a,[\pi,\delta]\rangle_\psi=\operatorname{Trace}\!\left(\operatorname{Ev}^0_\psi(P(\pi,\delta))(a)\right)\qquad(a\in A_\psi)$$?
