id: um.20002448
title: The differentiated Benjamin--Ono spectral problem
field: mathematics
tier: prose
statement: |-
  **Setup.** Consider the Benjamin--Ono equation
  \[
  u_t+u u_x-Ku_x=0,
  \qquad \widehat{Ku}(k)=|k|\widehat u(k).
  \]
  This equation supports travelling waves of the form
  \[
  \phi(z)=\frac{4}{1+z^2}.
  \]
  The resulting eigenvalue problem is
  \[
  (cv+Kv-\phi v)_z=\lambda v. \tag{A}
  \]

  **Open Problem.** What is the spectrum of (A) and how does it relate to
  the spectrum of
  \[
  cv+Kv-\phi v=\lambda v,
  \]
  which is well known. A possible approach would be to treat the eigenvalue
  equation as a two dimensional problem.

  The PDF confirms the coefficient \(4/(1+z^2)\), the multiplier \(|k|\), and
  the derivative outside the full parenthesis in (A). The K. Zumbrun material
  on strong viscous shocks starts the next presenter and is not part of this
  problem.

  It is useful to restore the speed parameter:

  \[
   \phi_c(x)=\frac{4c}{1+c^2x^2},\qquad c>0. \]

  At \(c=1\) this is the profile printed in the AIM source. Throughout this
  report \(D=|D|\) denotes the Fourier multiplier \(|\xi|\), and

  \[
   L_c=D+c-\phi_c,\qquad A_c=\partial_xL_c. \tag{1.1}
  \]

  The spectral parameter for \(A_c\) is denoted by \(\lambda\); a selfadjoint
  spectral parameter for \(L_c\) is denoted by \(\mu\). This prevents the two
  different eigenvalue problems from being conflated.
