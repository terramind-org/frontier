title: Conjecture 4.1 — (Inhomogeneity of all metrics).
field: mathematics
tier: prose
statement: (Inhomogeneity of all metrics). Let Teichg denote the Teichm¨ uller space of closed, genus g≥ 2 Riemann surfaces. Let h be any Riemannian metric (or any Finsler metric with some weak regularity conditions) on Teichg which is invariant under the action of the mapping 2. Some problems on mapping class groups and moduli space 31 class group Modg, and for which this action has finite covolume. Then Isom(Teichg,h ) is discrete; even better, it contains Modg as a subgroup of index C =C(g). Royden’s Theorem is the special case when h is the Teichm¨ uller metric (Royden gets C = 2 here). A key philosophical implication of Conjecture 4.1 is that the mechanism behind the inhomogeneity of Teichm¨ uller space is due not to fine regularity properties of the unit ball in Q(X) (as Royden’s proof suggests), but to the global topology of moduli space. This in turn is tightly controlled by the structure of Mod g. As one piece of evidence for Conjecture 4.1, I would like to point out that it would follow if one could extend the main theorem of [ FW1] from the closed to the finite volume case. In some sense looking at Mod g-invariant metrics seems too strong, especially since Mod g has torsion. Perhaps, for example, the inhomogeneity of Teich g is simply caused by the constraints of the torsion in Mod g. Suﬃciently large index subgroups of Mod g are torsion free. Thus one really wants to strengthen Conjecture 4.1 by replacing Mod g by any finite index subgroup H, and by replacing the constant C =C(g) by a constant C =C(g, [Modg:H]). After this one can explore metrics invariant by much smaller subgroups, such as Ig, and at least hope for discreteness of the corresponding isometry group (as long as the subgroup is suﬃciently large). If one can prove the part of Conjecture 4.1 which gives discreteness of the isometry group of any Modg-invariant metric on Teich g, one can approach the stronger statement that Cg = 1 or Cg = 2 as follows. Take the quotient of Teich g by any group Λ of isometries properly containing Mod g. By discreteness of Λ, the quotient Teich g/Λ is a smooth orbifold which is finitely orbifold-covered byMg.
