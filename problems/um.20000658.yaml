title: A quantitative negative-rectangle obstruction to bounded fixed-shift Liouville correlations
field: mathematics
tier: prose
statement: |-
  \[
   \left|\sum_{n\le X_k}\lambda(n)\lambda(n+h)\right|\longrightarrow\infty. \]

  It also suggests variants for multiplicative \(f:\mathbb N\to\{\pm1\}\), notes conditional arguments from four-point Chowla or arbitrarily long constant-sign strings, asks whether a Sudoku-type argument is possible, and observes that allowing the shift to vary should be easier. Here

  \[
   \lambda(n)=(-1)^{\Omega(n)}
  \]

  is the Liouville function. The repository record is internally unambiguous.

  \[
   b_h(n):=\lambda(n)\lambda(n+h),\qquad
   C_h(X):=\sum_{n\le X}b_h(n). \]

  The question is exactly whether \(\sup_X|C_h(X)|=\infty\). If the supremum is infinite, selecting successive record values gives the requested sequence \(X_k\).
