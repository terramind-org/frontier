title: Fractional Helly Theorems for Bounded HVC Dimension
field: mathematics
tier: prose
statement: "Let $\\mathcal K$ be a strongly hereditary class of simplicial complexes such that every $n$-vertex $K\\in\\mathcal K$ satisfies $\\sum_i b_i(K)<An^d$. Must $\\mathcal K$ have the fractional Helly property of order $d$: for every $t>0$, does there exist $s(t)>0$ such that $f_d(K)\\geq t\\binom{n}{d+1}$ implies $\\dim K\\geq s(t)n$?"
