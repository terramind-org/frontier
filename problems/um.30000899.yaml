title: Codegree Thresholds for Tight Hypergraph Hamilton Cycles
field: mathematics
tier: prose
statement: Let $H$ be a $k$-uniform hypergraph on $n$ vertices with $n\geq k+1\geq4$. If every $(k-1)$-element vertex set is contained in at least $\lfloor(n-k+3)/2\rfloor$ edges, must $H$ contain a tight Hamiltonian cycle?
