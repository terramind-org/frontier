id: um.20000133
title: The surface cone for split projective-plane bundles over K3 surfaces
field: mathematics
tier: prose
statement: |-
  What is the effective cone of surfaces \(\operatorname{Eff}^2(X)\) where \(X\) is a \(\mathbb P^2\)-bundle over a K3 surface?

  The preceding record says that \(X\) is a projective bundle \(\mathbb P(\mathcal E)\), and the following record separately asks about split vector bundles. I therefore use the following recovered interpretation.

  - \(S\) is a complex projective K3 surface.
  - \(E\) is a rank-three vector bundle on \(S\).
  - \(X=\mathbb P_S(E)\) is the Grothendieck projectivization of one-dimensional **quotients**, with projection \(\pi:X\to S\) and tautological quotient \(\pi^*E\twoheadrightarrow \mathcal O_X(1)\).
  - Since \(\dim X=4\), surfaces have both dimension and codimension two, so \(N_2(X)=N^2(X)\) and the notations \(\operatorname{Eff}_2(X)\) and \(\operatorname{Eff}^2(X)\) refer to the same numerical cone.

  A Brauer--Severi \(\mathbb P^2\)-fibration not arising as \(\mathbb P(E)\) is not covered; the surrounding AIM text supports the vector-bundle interpretation. I distinguish the cone generated by effective cycles from its closure, denoting the latter by \(\overline{\operatorname{Eff}}_2(X)\). The workshop summary uses “pseudo-effective” for the closed cone, and this is the convention most likely intended by the problem.

  The general problem for arbitrary \(E\) is not solved here. The main proof-level result is a complete answer for split rank-three bundles, followed by a three-ray formula when the K3 surface has Picard rank one.
