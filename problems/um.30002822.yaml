title: Self-Stress Identities for Sparse Graphs
field: mathematics
tier: prose
statement: For a planar wheel graph $G$ with $n$ vertices and $2n-2$ edges, suppose a self-stress $\omega$ and edge function $f_{ij}$ satisfy $\sum_{ij\in E(G)}\omega_{ij}f_{ij}=1$. Are there other graphs with $n$ vertices and $2n-2$ edges admitting such a self-stress? What general homological or cohomological phenomenon explains the identity?
