id: um.30000707
title: Exponential Auxiliary Systems for Four-Value-Sharing Meromorphic Functions
field: mathematics
tier: prose
statement: Let $f$ and $g$ be meromorphic functions sharing $a_1,a_2,a_3,a_4=\infty$, and define $$\psi_1=\frac{f'(f-g)}{\prod_{\nu=1}^3(f-a_\nu)},\qquad \psi_2=\frac{g'(f-g)}{\prod_{\nu=1}^3(g-a_\nu)}.$$ Classify the solutions of $\{\psi_1=e^z,\psi_2=e^{-z}\}$ and $\{\psi_1=e^{z^2},\psi_2=e^{-z^2}\}$, up to replacing $(f,g)$ by $(T\circ f(az+b),T\circ g(az+b))$, where $T$ is a Möbius transformation and $a\neq0$.
