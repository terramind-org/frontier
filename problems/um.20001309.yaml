title: Lattice facet-count constraints and nonsymmetric projection reconstruction
field: mathematics
tier: prose
statement: |-
  **Problem 13 (S. Robins), Minkowski's theorem in \(\mathbb Z^d\).** Given finitely many vectors \(\{\vec n_i\}\subset\mathbb Z^d\) and integers \(\alpha_i\in\mathbb Z\), is there a polytope such that the \(\vec n_i\) are normals to its facets and the number of integer points on the \(i\)-th facet is \(\alpha_i\)? Are extra constraints needed?

  **Problem 14.** Which projection and/or section data are needed to determine nonsymmetric convex bodies? Several known cases are listed: volumes and centers of gravity of sections through a fixed interior point; mean widths and Steiner points; brightness and illumination. The questions are: (a) (Schneider) Do the areas of projections together with their centers of gravity determine a body? (b) What is the dual version of the third known case (brightness plus illumination)?
