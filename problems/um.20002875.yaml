title: A stratified finite-jet criterion for smooth infinitesimal CR homogeneity
field: mathematics
tier: prose
statement: |-
  **Problem 4 (D. Zaitsev).** Let \(M\) be a locally homogeneous CR manifold. That is, suppose for any two points \(p,q\in M\), there exists a CR diffeomorphism
  \[
  h:(U,p)\longrightarrow (V,q)
  \]
  for some neighborhoods \(U\) of \(p\) and \(V\) of \(q\). Does it follow that the Lie algebra of infinitesimal automorphisms spans \(T_pM\) for one (and hence all) \(p\in M\)?
