title: Convergence of Arbitrary Steiner-Symmetrization Sequences
field: mathematics
tier: prose
statement: For every compact set $K\subset\mathbb R^n$ and every sequence of directions $(u_m)\subset S^{n-1}$, do the iterated Steiner symmetrals $S_{u_m}\cdots S_{u_1}K$ always converge in shape, without any assumption on the directions?
