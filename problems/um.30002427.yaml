title: Rational Points on Cartan Modular Curves
field: mathematics
tier: prose
statement: Let $X_G$ be the modular curve of level $N$ attached to a subgroup $G\subseteq\operatorname{GL}_2(\mathbb Z/N\mathbb Z)$ with full determinant. Describe $X_G(\mathbb Q)$, especially when $N=p$ is prime and $G$ is a Borel subgroup or the normalizer of a split or nonsplit Cartan subgroup.
