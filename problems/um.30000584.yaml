title: Packing Numbers of Automorphism Graphs on Curves
field: mathematics
tier: prose
statement: Let $B$ be a curve of genus $b\geq2$. A finite set $S\subset\operatorname{Aut}(B)$ is good when the union of the graphs of its elements is a smooth divisor in $B\times B$; define its packing number by $\alpha=|S|/(b-1)$. What is the maximal possible value of $\alpha$?
