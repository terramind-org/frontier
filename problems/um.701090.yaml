title: Kourovka Notebook Problem 15.2
field: mathematics
tier: prose
statement: |-
  By a theorem of W. Burnside, if $\chi \in \mathrm{Irr}(G)$ and $\chi(1)
  > 1$, then there exists $x \in G$ such that $\chi(x) = 0$, that is,
  only the linear characters are ``nonvanishing''. It is interesting to
  consider the dual notion of *nonvanishing
  elements* of a finite group $G$, that is, the elements $x \in G$ such
  that $\chi(x) \ne 0$ for all $\chi \in
  \mathrm{Irr}(G)$.

  a) It is proved (I. M. Isaacs, G. Navarro,
  T. R. Wolf,
  *J. Algebra*, **222**, no. 2 (1999), 413--423) that if $G$ is
  solvable and $x \in G$ is a nonvanishing element of odd order,
  then $x$ belongs to the Fitting subgroup $**F**( G)$. Is this
  true for elements of even order too? (M. Miyamoto showed in 2008
  that every nontrivial abelian normal subgroup of a finite group
  contains a nonvanishing element.)

  b) Which nonabelian simple groups have nonidentity
  nonvanishing elements? (For example, ${\mathbb{A}_7$ has.)
