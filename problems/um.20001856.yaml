title: Generic boundary anchoring, arbitrary pin cuts, and an equilateral six-triangle singularity
field: mathematics
tier: prose
statement: |-
  **7. (Thorpe)** Consider a network of corner-sharing triangles in the plane, with
  holes of size 5, 6, 7, 8, 9 (and an average hole size of 6). If this is an infinite
  network, it is isostatic.

  Now take a large finite piece of the framework. Experimentally, if we pin every
  other triangle boundary vertex (vertex of degree two) and run the pebble game, we
  get an isostatic network. Question: prove that this approach works in general and
  find other distributions of pins that also work.

  a) generic

  b) equilateral triangles

  Question (generalization): What about the class of graphs that have no proper rigid
  subgraphs, but that have more than two bodies at a pin? The underlying body-pin
  graph is no longer 3-regular.
