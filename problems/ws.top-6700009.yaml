  \section{Scalar Curvature Question [?9]: Identify the most general classes of geometric objects having properties analogous to those of $C^2$ Riemannia}\label{6700009}
  {\small\sffamily UnsolvedMath ID 6700009 · Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For a $C^2$ Riemannian metric $g$ on a manifold, $\operatorname{Sc}_g$ denotes the scalar curvature, the trace of its Ricci tensor. A lower bound $\operatorname{Sc}_g\geq\sigma$, for a real number $\sigma$, holds pointwise. The source asks about generalized geometric objects that retain analogous scalar-curvature features, including possible singular spaces obtained through limits or completions. It does not fix a particular singular category, convergence notion, or list of axioms in advance.
  \paragraph{Statement recorded in the supplied source.}
  Identify the most general classes of geometric objects displaying properties analogous to those of $C^2$ Riemannian manifolds with positive scalar curvature and, more generally, with scalar curvature bounded below by $\sigma$. \sref{6700009}{2}
  \subsection{Short English statement}
  Find the broadest geometric setting that retains the essential features of manifolds with positive or lower-bounded scalar curvature.
