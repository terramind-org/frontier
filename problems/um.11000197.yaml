statement: Find a point ρ∈ Hom(π, SL(2, C)) such that the closure of its orbit ModΣ· [ρ] meets both the image of the unitary characters Hom(π, SU(2)) and the closure QΣ of the quasi- Fuchsian characters. Homological actions. The action of ModΣ on the homology of Hom( π,G )/G furnishes another source of possibly interesting linear representations of ModΣ. With Neumann [ 51], we proved that for the relative SL(2, C)-character varieties of the one-holed torus and four-holed sphere, the action of ModΣ factors through a finite group. Atiyah-Bott [ 3] use infinite-dimensional Morse theory to analyze the algebraic topology of Hom(π,G )/G, when G is compact. For the nonsingular components their techniques imply that the ModΣ-action on the rational cohomology of Hom( π,G )/G factors through the symplectic representation of ModΣ on H ∗(Σ). In particular Biswas [ 9] proved that the Torelli group acts trivially on nonsingular components. In contrast, Cappell-Lee-Miller [ 17, 18 ] proved the surprising result that that the Torelli group acts nontrivially on the homology of the SU(2)-character variety when Σ is closed.
