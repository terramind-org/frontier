  % UnsolvedMath ID 3050; source catalogue code OPG-37230
  \setcounter{section}{3049}
  \section{Transversal achievement game on a square grid}\label{3050}
  {\small\sffamily UnsolvedMath ID 3050 · Combinatorics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $n\in\mathbb N$ and let $[n]=\{1,\ldots,n\}$. Two players alternately claim one unoccupied cell of $[n]\times[n]$, starting with player O. A transversal is a set $\{(i,\sigma(i)):i\in[n]\}$ for a permutation $\sigma$ of $[n]$. A player wins immediately upon owning every cell of a transversal; if the board fills without a winner the outcome is a draw. Both players have full information and seek a win, then a draw in preference to a loss.
  \paragraph{Statement recorded in the supplied source.}
  Determine, for every $n\geq1$, the outcome under optimal play: a forced win for O, a forced win for X, or a draw. \sref{3050}{2}
  \subsection{Short English statement}
  Determine the optimal-play outcome of the alternating square-grid game in which either player wins by occupying one cell in every row and column.
  \subsection{Sources}
