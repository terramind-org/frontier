title: AGNES Open Problems in Algebraic Geometry — Q1
field: mathematics
tier: prose
statement: |-
  Does $\pi_*[\overline{M}_g(X,\beta)]^{\operatorname{vir}}\in H^*(\overline{M}_g)$
  lie in the tautological ring in cohomology?

  **Q2**.
  When does $\pi_*[\overline{M}_g(X,\beta)]^{\operatorname{vir}}\in A^*(\overline{M}_g)$
  lie in the tautological ring in Chow?

  I would guess the answer to $**Q1**$ is yes. If $X$ is
  a curve, an affirmative answer to $**Q1**$ follows
  from the results of [fabp].
  We know $\pi_*[\overline{M}_g(X,\beta)]^{\operatorname{vir}}$ does not always lie
  in the tautological ring in Chow --- counterexamples can be found
  when $X$ is a curve. A wild speculation, motivated
  by the Bloch-Beilinson conjecture, is that the
  answer to **Q2** is yes when $X$ is defined over over $\overline{\mathbb{Q}}$.
