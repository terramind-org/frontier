title: Research Problems in Function Theory — Problem 6.92
field: mathematics
tier: prose
statement: "If $\\mathbb{R}^2_+=\\{(x,y)\\in\\mathbb{R}^2:y>0\\}$, suppose that $E\\subset\\mathbb{R}^2_+$, and let $f:\\mathbb{R}^2_+\\to B^2$ be analytic and conformal where $B^2 = \\{(x, y)\\in\\mathbb{R}^2_+: x^2 + y^2 < 1\\}$; assume also that \\[\\lim_{x\\to0,\\,x\\in E}f(x)=\\alpha.\\] Lindel\\\"of's theorem shows that $\\alpha$ is an angular limit of $f$ at $0$ if $E$ is a curve terminating at $0$. Vuorinen has shown that the same conclusion holds under much weaker hypotheses on $E$; for instance, the condition that \\[\\liminf_{r\\to0}m(A\\cap(0,r))/r>0,\\] where $A = \\{|x|: x \\in E\\}$, is sufficient (see Vuorinen ). This problem concerns a converse result. Denote by $\\mathcal{F}$ the class of all analytic and conformal maps of $\\mathbb{R}^2_+$ into $B^2$. Let $K$ be a subset of $\\mathbb{R}^2_+$ with the property that, whenever \\[\\lim_{x\\to0,\\,x\\in E}f(x)=\\alpha\\hspace{1cm}\\text{ and }\\hspace{1cm}f\\in\\mathcal{F},\\] then necessarily $f$ has an angular limit $\\alpha$ at $0$. Since $f$ is conformal it follows (see Vuorinen ) that \\[\\lim_{x\\to0,\\,x\\in K_1}f(x)=\\alpha,\\] where $K_1 = \\{(x,y)\\in\\mathbb{R}^2_+ : \\rho((x,y), K) < l\\}$ and $\\rho$ is the Poincar\\'e metric of $\\mathbb{R}^2_+$. What can be said about the thickness of $K_1$ at $0$? Is it true that $$ \\limsup_{r\\to0}m\\big(B^\\prime\\cap(0,r)\\big)/r>0, $$ where $B^\\prime = \\{(x^2 + y^2)^{1/2} : (x,y)\\in K_1\\}$? It is easy to see that ([source label: J6.92]) must hold if $K$ is contained in an angle with vertex at $0$ whose closure lies inside $\\mathbb{R}^2_+$. (M. Vuorinen)"
