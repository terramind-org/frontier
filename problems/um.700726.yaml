statement: |-
  b) Let $G(q)$ be a simple Chevalley group over a
  field of order $q$. Prove that there exists $m$ such that the
  restriction of every non-one-dimensional representation of
  $G(q^m)$ over a field of prime characteristic not dividing $q$ to
  $G(q)$ contains all irreducible representations of $G(q)$ as
  composition factors.

