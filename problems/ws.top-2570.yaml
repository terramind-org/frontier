  \begin{itemize}
  \item[S1] ULAM.AI and the UnsolvedMath Contributors, supplied problems.json, catalogue entry, Kourovka Notebook - New Problems, Issue 21. Catalogue identity and source transcription; CC BY 4.0.
  \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[S2] The Kourovka Notebook, 21st edition, new problems, Problem 21.61. Expanded formulation of the supplied catalogue statement.
  \url{https://arxiv.org/pdf/1401.0300v47}.
  \end{itemize}
