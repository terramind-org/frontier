title: Question 3.1 — (Fast word problem).
field: mathematics
tier: prose
statement: (Fast word problem). Is there a sub-quadratic time algorithm to solve the word problem in Modg? One might guess that n logn is possible here, as there is such an algorithm for certain relatively (strongly) hyperbolic groups (see [ F a3]), and mapping class groups are at least weakly hyperbolic, as proven by Masur-Minsky (Theorem 1.3 of [ MM1]). The conjugacy problem for Mod g is harder. The original algorithm of Hemion [ He] seems to give no reasonable (even exponential) time bound. One refinement of the problem would be to prove that Mod g is biautomatic. However, even a biautomatic structure gives only an exponential time algorithm to solve the conjugacy problem. Another approach to solving the conjugacy problem is the following.
