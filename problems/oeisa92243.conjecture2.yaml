  module: FormalConjectures.OEIS.«92243»
  decl: OeisA92243.conjecture2
  statement: "theorem conjecture2 : ∃ B : ℤ, ∀ n : ℕ, B ≤ a n"
  context:
    - open OeisA92243
  definitions:
    - name: OeisA92243.a
      kind: def
      text: |-
        /-- Score at stage $n$ in "tug of war" between prime gap increases vs. prime gap decreases. -/
        noncomputable def a (n : ℕ) : ℤ :=
          if n ≤ 1 then 0
          else
            ∑ k ∈ Finset.Icc 2 n,
              ((primeGap k : ℤ) - (primeGap (k - 1) : ℤ)).sign
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/92243.lean#L39
