  \section{Research Problems in Function Theory — Problem 6.52}\label{2306052}
  {\small\sffamily UnsolvedMath ID 2306052 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Write $\mathbb D=\{z\in\mathbb C:|z|<1\}$ and $\mathbb T=\partial\mathbb D$.A bounded univalent function is a holomorphic injective $g:\mathbb D\to\mathbb C$ with $\sup_{z\in\mathbb D}|g(z)|<\infty$; no normalization of $g$ is imposed.
  \paragraph{Statement recorded in the supplied source.}
  For every holomorphic surjection $f:\mathbb D\to\mathbb C$, does there exist such a $g$ for which $(f+g)(\mathbb D)=\mathbb C$? \sref{2306052}{2}
  \subsection{Short English statement}
  Can every holomorphic disc surjection onto the plane be perturbed by a bounded injective function while retaining its full range?
  \subsection{Sources}
