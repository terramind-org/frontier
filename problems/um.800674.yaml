title: Holomorphic Foliation Theory — Problem 1
field: mathematics
tier: prose
statement: |-
  Instead of considering the weighted current $\tau^a_r$, we can consider an un-weighted current (*Ahlfors current*)
  $$\sigma_r^a:={1\over A(r)} (\phi_a)_*[\mathbb{D}(r)] \qquad \text{with} \qquad A(r):=\int_{\mathbb{D}(r)} \phi_a^*(\omega).$$

  Do we have $\sigma_r^a\to T$ as $r$ tends to $1$ for $T$-almost every $a$ ?
