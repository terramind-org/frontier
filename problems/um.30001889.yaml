title: Sequence Bounds for the Function r of m
field: mathematics
tier: prose
statement: For $m \geq 1$, let $r(m)$ denote the minimum number of parts into which a convex body in $\mathbb{R}^d$ (or planar convex set) must be partitioned in the $m$-step covering/Tverberg-type geometric partition problem of Discrete Geometry (OWR 2011/44). Does the OEIS sequence A059522 ($\lfloor n \alpha \rfloor$ with $\alpha = 2 - \sqrt{2}$) give a valid lower bound for $r(m)$ for all $m$?
