  \section{Strongly Balanced Almost-Uniform Vector Permutations}\label{30000055}
  {\small UnsolvedMath ID 30000055 · Combinatorics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Does every finite set of $m$-dimensional vectors of Euclidean norm at most $1$, whose vector sum has norm at most $1$, admit a permutation whose every prefix sum has norm at most $\sqrt{2.7m}$ and whose block sums are uniformly bounded by an absolute constant?
  \par\smallskip\textit{Formulation references:} \sref{30000055}{1}, \sref{30000055}{2}.
  \subsection{Short English statement}
  Does every finite set of $m$-dimensional vectors of Euclidean norm at most $1$, whose vector sum has norm at most $1$, admit a permutation whose every prefix sum has norm at most $\sqrt{2.7m}$ and whose block sums are uniformly bounded by an absolute constant?
