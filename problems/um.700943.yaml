title: Kourovka Notebook Problem 13.25
field: mathematics
tier: prose
statement: |-
  Let $(G,\tau )$ be a topological group with
  finite semigroup $\tau (G)$ of ultrafilters converging to the
  identity (I. V. Protasov, *Siberian Math. J.*, **34**,
  no. 5 (1993), 938--951). Is it true that
  $\tau (G)$ is a semigroup of idempotents?

  *Comment of 2005:* This is proved for $G$
  countable
  (E. G. Zelenyuk, *Mat. Studii*, **14** (2000), 121--140).
