title: Profinite Congruence Subgroup Problem for Mapping Class Groups
field: mathematics
tier: prose
statement: "Let $\\Pi_{g,r}$ be the fundamental group of a hyperbolic topological surface of genus $g$ with $r$ punctures, let $\\Gamma_{g,r}$ be its mapping class group, and for a class of finite groups $P$ let $\\rho^P_{g,r} : \\widehat{\\Gamma}_{g,r} \\to \\operatorname{Out}(\\Pi_{g,r}^P)$ be the universal pro-$P$ outer monodromy representation (the pro-$P$ congruence subgroup problem for mapping class groups). Is $\\rho^P_{g,r}$ injective?"
