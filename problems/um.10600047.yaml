title: Virtual-knot problem 47 — It is well known that flat virtual knots are easily algorithmically recognizable, see .
field: mathematics
tier: prose
statement: |-
  It is well known that flat virtual knots are easily algorithmically
  recognizable, see . The absence of a geometric approach to
  the definition of free knots leads to the lack of the methods for
  solving the following three problems.


  Is it true that (any) connected sum of free knots is trivial?


  Are free knots algorithmically recognizable?


  Prove that free knots do not commute in the general case.

  In the first case we suggest that the answer is affirmative, and the
  proof should be a certain modification of the analogous proof for
  virtual knots (see, e.g., )

  In the second case we suggest that the answer is negative. It seems
  to us that free knots are a very complicated object, where one can
  construct models for many logical constructions.

  The third problem seems to be solvable by using (and, possibly,
  extending) standard methods in the free knot theory.
