title: Radial harmonic universality and linear-size zonotope approximation
field: mathematics
tier: prose
statement: |-
  **Problem 3 (R. Gardner).** Let \(\mathcal K^n\) be the convex bodies in \(\mathbb R^n\). A Minkowski class is closed in the Hausdorff metric and under Minkowski linear combinations and translations. A body \(K\) is a generalized \(\mathcal M\)-body if \(K+M_1=M_2\) for some \(M_1,M_2\in\mathcal M\). If \(\mathcal M_{B,G}\) is the smallest \(G\)-invariant Minkowski class containing \(B\), Schneider and F. Schuster's theorem says that, for nonsymmetric \(B\), every neighborhood of \(B\) contains an affine image \(B'\) of \(B\) for which the generalized \(\mathcal M_{B',SO(n)}\)-bodies are dense in \(\mathcal K^n\). The problem asks for a dual theorem, replacing generalized zonoids/Minkowski sums by generalized intersection bodies/radial sums.

  **Problem 4.** If \(K\subset\mathbb R^n\) is a zonoid and \(Z\) is a zonotope that is a sum of \(M\) segments, Talagrand obtained \(M=C(\varepsilon)n\log n\) under multiplicative distance \(d(Z,K)\leq 1+\varepsilon\), while the Euclidean ball admits \(M=C(\varepsilon)n\). Is the extra \(\log n\) necessary?
