title: Banach Spaces and Ramsey Theory — Problem 5
field: mathematics
tier: prose
statement: |-
  *(Countable spreading models problem -- S. J. Dilworth, E. Odell and B. Sari [DOS])*
  Let $X$ be a reflexive Banach space such that $|\mathrm{SP_w}(X)/\sim|\leqslant \aleph_0$.
  Does there exist a normalized weakly null sequence in $X$ generating a spreading model
  equivalent to the standard unit vector basis of $c_0$ or $\ell_p$ for some
  $1\leqslant p<+\infty$?
