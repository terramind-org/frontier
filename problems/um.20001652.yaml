title: A rose-symmetry obstruction and finite-image genus range
field: mathematics
tier: prose
statement: |-
  Does every homomorphism
  \(\phi:\operatorname{Out}(F_n)\to \operatorname{MCG}(S)\) have virtually
  abelian image?

  Its main question is:

  \[
   W_n=(\mathbb Z/2)^n\rtimes S_n=(\mathbb Z/2)\wr S_n,
   \qquad |W_n|=2^n n!. \]

  Thus `Z2 o S n` is the wreath product and `Zn · n!` is \(2^n\cdot n!\),
  not a product involving \(\mathbb Z^n\).

  There is, however, a missing logical qualification. The trivial homomorphism
  exists for every surface, so a genus lower bound cannot apply to *every*
  homomorphism. The statement must concern an injective map, a map faithful on
  the finite rose stabilizer, or (as proved below) a map with infinite image. The PDF does not say whether \(S\) is closed, orientable, punctured, or has
  boundary, nor whether `MCG` includes orientation-reversing classes. The main
  result below uses the standard group
  \(\operatorname{Mod}(S_g)\) of orientation-preserving mapping classes of a
  closed connected orientable surface of genus \(g\ge2\).
