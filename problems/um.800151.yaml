title: Comparative Prime Number Theory — Problem 20
field: mathematics
tier: prose
statement: |-
  - (Greg Martin, University of British Columbia)
  In 1959 Shanks [Shanks] made an observation that seems to have been overlooked since then: some combinatorial reasoning led him to assert that for each integer $k\ge1$, the odd numbers $n$ with $\Omega(n)=k$ should be biased towards the residue class $(-1)^k\mod4$, where the case $k=1$ is Chebyshev's original observation. In other words, $(-1)^{\Omega(n)}\chi_{-4}(n)$ should be biased towards $1$ over $-1$.

  Assuming GRH and LI, calculate the logarithmic density of the sets
  \[
  \{n\ge1\colon (-1)^{\Omega(n)}\chi_{-4}(n) = 1\} \quad\text{and}\quad \{n\ge1\colon (-1)^{\Omega(n)}\chi_{-4}(n) = -1\}.
  \]
  Presumably a similar phenomenon should hold for $(-1)^{\Omega(n)}\chi(n)$ for any quadratic character $\chi$; the case $\chi=\chi_{-3}$ (the nonprincipal Dirichlet character modulo $3$) might be particularly pronounced.

  By the way, [Shanks] also contains the timeless quip ``Since $\log\log\log n\to\infty$ (with great dignity)\dots.''

  - (Daniel R. Johnston, University of New South Wales--Canberra at ADFA).
  It has been shown [johnston2023average, Theorem 1.1] that RH is equivalent to
  \[
  {\mathfrak{A}}_1^\pi(x) = \int_0^x \bigl( \pi(t)-\mathop\mathrm{li}(t) \bigr) dt < 0 \quad\text{for all $x>2$.}
  \]
  Roughly, the reason this inequality holds under RH is that the constant $\sum_{\rho} 1/\rho(\rho+1)$ occuring in the explicit formula for ${\mathfrak{A}}_1^\pi(x)$ is too small to overcome the bias. However, Martin pointed out (private communication) that when looking at the analogous
  \[
  {\mathfrak{A}}_1^\pi(x;q,a) = \int_0^x \bigl( \phi(q)\pi(t;q,a)-\mathop\mathrm{li}(t) \bigr) dt,
  \]
  the corresponding sum over zeros of Dirichlet $L$-functions grows faster than the bias as $q$ increases, and thus at some point the inequality ${\mathfrak{A}}_1^\pi(x;q,a) < 0$ should fail when $q$ is large.
