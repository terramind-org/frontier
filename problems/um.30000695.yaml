title: Relevant Islands in the Parabolic Anderson Model
field: mathematics
tier: prose
statement: "In the parabolic Anderson model, whose long-time behavior is governed by relevant islands, determine: (1) how large the relevant islands are, and how large the potential and the solution are in them; (2) the shapes of the potential and solution in these islands; and (3) how many relevant islands there are and what can be said about their spatial distribution."
