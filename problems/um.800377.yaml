title: Coxeter Groups and Unimodality — Conjecture 15
field: mathematics
tier: prose
statement: |-
  For all $i,j,r \in \mathbb{N}$
  the determinant of the submatrix determined by the rows indexed by
  $i,i+1, \ldots , i+r$ and columns indexed by $j,j+1, \ldots , j+r$

  is a monotonically increasing function of $i \in \mathbb{N}$.
