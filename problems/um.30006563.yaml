title: Colorings Without Disjoint Color-Isomorphic Triangles
field: mathematics
tier: prose
statement: Let $g(n)$ be the fewest colors needed to edge-color $K_n$ with no two vertex-disjoint color-isomorphic triangles. Determine the order of growth of $g(n)$; in particular, is $g(n)=\Theta(n)$, or even $g(n)=n-O(1)$?
