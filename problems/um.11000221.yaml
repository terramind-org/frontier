title: Problem 14 — (Decomposition of surfaces).
field: mathematics
tier: prose
statement: (Decomposition of surfaces). Given a connected component of the stratum H(α) of Abelian diﬀerentials (or of quadratic diﬀerentials Q(β) find those configurations of homologous saddle connections (or homologous closed geodesics), which are present on every surface in the stratum. For quadratic diﬀerentials the notion of homologous saddle connections (homologous closed geodesics) should be understood in terms of homology with local coeﬃcients, see [ MaZo]. The last two problems in this section concern the Teichm¨ uller geodesic flow on the moduli spaces. This is the flow defined by the 1-parameter subgroup ( et 0 0 e−t ) t∈R onH(α1,...,α m). In any smooth dynamical system the Lyapunov exponents (see [ BaPe], [ F o2]) are important. Recently, A. Avila and M. Viana [ AvVi] have shown the simplicity of the spectrum for the cocycle related to the Teichm¨ uller geodesic flow (strengthening the earlier result of Forni on positivity of the smallest Lyapunov exponent).
