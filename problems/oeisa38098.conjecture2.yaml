lean:
  module: FormalConjectures.OEIS.«38098»
  decl: OeisA38098.conjecture2
  statement: |-
    theorem conjecture2 :
        (∀ m n : ℕ, 1 ≤ m → 1 ≤ n →
          (Nat.primeCounting (m ^ 2) : ℚ) / (m ^ 2 : ℚ) =
          (Nat.primeCounting (n ^ 2) : ℚ) / (n ^ 2 : ℚ) → m = n) ∧
        (∀ n : ℕ, 15646 < n →
          (Nat.primeCounting ((n + 1) ^ 2) : ℚ) / ((n + 1) ^ 2 : ℚ) <
          (Nat.primeCounting (n ^ 2) : ℚ) / (n ^ 2 : ℚ))
  context:
    - open OeisA38098
  definitions: []
