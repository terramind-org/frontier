lean:
  module: FormalConjectures.GreensOpenProblems.«74»
  decl: Green74.green_74.variants.order
  statement: |-
    theorem green_74.variants.order :
        ∀ d : ℕ, (fun N ↦ (maxNoFiveCoplanar d N : ℝ)) =Θ[atTop] green_74.variants.order.answer d
  context:
    - open Green74
    - open Green74.green_74
    - open Green74.green_74.variants
    - open Filter Asymptotics
    - open scoped Finset
  definitions:
    - name: Green74.maxNoFiveCoplanar
      kind: def
      text: |-
        /--
        `maxNoFiveCoplanar d N` is $f(d, N)$, the size of the largest subset of $[N]^d$ with no $5$
        points on a $2$-plane, where $[N] = \{1, \dots, N\}$. The set of possible sizes contains $0$ and is
        bounded by $N^d$ (`maxNoFiveCoplanar_le`), so the supremum is a maximum.
        -/
        noncomputable def maxNoFiveCoplanar (d N : ℕ) : ℕ :=
          sSup {m | ∃ A ⊆ Fintype.piFinset (fun _ : Fin d ↦ Finset.Icc 1 N), #A = m ∧ NoFiveCoplanar A}
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/GreensOpenProblems/74.lean#L46
