lean:
  module: FormalConjectures.Paper.BollobasEldridgeCatlinConjecture
  decl: BollobasEldridgeCatlinConjecture.bollobas_eldridge_catlin_conjecture
  statement: |-
    theorem bollobas_eldridge_catlin_conjecture :
        ∀ {V : Type} [Fintype V] [DecidableEq V] (G₁ G₂ : SimpleGraph V)
          [DecidableRel G₁.Adj] [DecidableRel G₂.Adj],
          (G₁.maxDegree + 1) * (G₂.maxDegree + 1) ≤ Fintype.card V + 1 → Packs G₁ G₂
  context:
    - open BollobasEldridgeCatlinConjecture
    - open SimpleGraph
    - "variable {V : Type*}"
  definitions:
    - name: BollobasEldridgeCatlinConjecture.Packs
      kind: def
      text: |-
        /-- Two graphs `G₁`, `G₂` on the same finite vertex set **pack** if some permutation of the
        vertices makes their edge sets disjoint. -/
        def Packs (G₁ G₂ : SimpleGraph V) : Prop :=
          ∃ σ : Equiv.Perm V, ∀ u v, G₁.Adj u v → ¬ G₂.Adj (σ u) (σ v)
