title: Local Count Thresholds for Bounded-Degree Embeddings
field: mathematics
tier: prose
statement: Determine the least $f_k(\Delta)$ such that matching all local $k$-uniform homomorphism counts for every graph on at most $f_k(\Delta)$ vertices forces embeddings of all $n$-vertex graphs of maximum degree at most $\Delta$.
