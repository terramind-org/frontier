title: Positively Curved Projective Varieties — Conjecture 2
field: mathematics
tier: prose
statement: |-
  The following conjecture posed by Yau can be regarded as
  an analogy of Mok's result for holomorphic sectional curvature.

  [Yau's conjecture, {[Yau82, Problem 47]}]
  If a compact K\"ahler manifold $X$ has positive holomorphic sectional curvature,
  then $X$ is projective and rationally connected.
