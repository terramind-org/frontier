statement: If connected graphs $H,H'$ are $3$-equivalent, must they be $2$-equivalent? For every $q\geq2$, do nonisomorphic connected $q$-equivalent graphs exist? Which graphs $H$ make $K_k$ and $K_k+H$ Ramsey equivalent?
