  decl: Erdos950.erdos_950.parts.i
  statement: |-
    theorem erdos_950.parts.i :
        atTop.liminf (fun n : ℕ ↦ (f n : EReal)) = 1
  context:
    - open Erdos950
    - open Erdos950.erdos_950
    - open Erdos950.erdos_950.parts
