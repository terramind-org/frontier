  \item[\hypertarget{source:statement:2}{S2}] Joshua Evan Greene, The Lens Space Realization Problem, arXiv:1010.6257v1 (2010), Section 1, Conjecture 1.1, Theorem 1.3 and Section 1.2 on Berge’s enumerated knots. \url{https://arxiv.org/pdf/1010.6257v1}.
  \item[\hypertarget{source:statement:3}{S3}] Kenneth L. Baker, Dorothy Buck and Ana G. Lecuona, Some Knots in S1×S2 with Lens Space Surgeries, arXiv:1302.7011v1 (2013), Section 1, first two paragraphs on the S3 Berge conjecture. \url{https://arxiv.org/pdf/1302.7011v1}.
