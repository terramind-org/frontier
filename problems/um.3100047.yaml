title: Is the 1/3-2/3 Conjecture for Pressing Sequences true
field: mathematics
tier: prose
statement: ": Is the 1/3-2/3 Conjecture for Pressing Sequences true? That is, if a graph G is not uniquely pressable, is it true that there much be two vertices x and y so that the probability that x comes before y in a uniform random pressing sequence of G is between 1/3 and 2/3? See this."
