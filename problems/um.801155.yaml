title: Nijenhuis Geometry and Integrable Systems — Problem 8
field: mathematics
tier: prose
statement: |-
  \begin{Problem}
  For each $\mathrm{gl}$-regular Nijenhuis operator $L$ in dimension 2, construct (explicitly) a geodesically compatible metric. \end{Problem}

  Generalise the above mentioned formula from [nijappl5] to an arbitrary coordinate system $x^1,\dots, x^n$ assuming that in this coordinate system we have a conservation law given as an explicit function $f(x^1,\dots, x^n)$.
