title: Optimal Product Structure for Planar Graphs
field: mathematics
tier: prose
statement: What is the smallest integer $k$ such that every planar graph is a subgraph of $H\boxtimes P$ for some path $P$ and some graph $H$ of treewidth at most $k$? Is the optimum between $3$ and $6$?
