  definitions:
    - name: Erdos1189.IsIrreducibleCoveringSet
      kind: def
      text: |-
        /-- `M` is an irreducible covering set: it is a covering set and no proper subset of it is. -/
        def IsIrreducibleCoveringSet (M : Finset ℕ) : Prop :=
          IsCoveringSet M ∧ ∀ N : Finset ℕ, N ⊂ M → ¬ IsCoveringSet N
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/1189.lean#L51
    - name: Erdos1189.largestModulus
      kind: def
      text: |-
        /-- The values taken by the largest modulus $n_k$ over the irreducible covering sets of size
        `k`. -/
        def largestModulus (k : ℕ) : Set ℕ :=
          {n | ∃ M : Finset ℕ, IsIrreducibleCoveringSet M ∧ M.card = k ∧ IsGreatest (M : Set ℕ) n}
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/1189.lean#L67
