lean:
  module: FormalConjectures.OEIS.«105210»
  decl: OeisA105210.conjecture_disjoint_starting_values
  statement: |-
    theorem conjecture_disjoint_starting_values :
        ∀ j k : ℕ,
          j ∈ ({1, 393, 412, 668, 932} : Set ℕ) →
          k ∈ ({1, 393, 412, 668, 932} : Set ℕ) →
          j ≠ k →
          sequenceSet j ∩ sequenceSet k = ∅
  context:
    - open OeisA105210
    - open Nat Finset
  definitions:
    - name: OeisA105210.sequenceSet
      kind: def
      text: |-
        /-- The set of all terms generated by the sequence starting at $k$. -/
        def sequenceSet (k : ℕ) : Set ℕ :=
          { m | ∃ n : ℕ, 1 ≤ n ∧ sequenceStartingAt k n = m }
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/105210.lean#L79
