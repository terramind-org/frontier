title: A response formula for the full two-replica overlap law
field: mathematics
tier: prose
statement: |-
  **Exact solvability**

  Study the overlap for replicated paths of a polymer with respect to the quenched Gibbs measure. What is the distribution of the intersection local time for the continuum polymer? Is there replica symmetry or replica breaking in the strong disorder regime or intermediate disorder regime? Try to use the Macdonald processes contour integral formulas to compute more than just the expected overlap.
