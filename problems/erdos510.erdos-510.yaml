lean:
  module: FormalConjectures.ErdosProblems.«510»
  decl: Erdos510.erdos_510
  statement: |-
    theorem erdos_510 :
        ∃ (c : ℝ) (hc : 0 < c),
          ∀ᶠ N in atTop, ∀ (A : Finset ℕ), 0 ∉ A → #A = N →
          ∃ θ, ∑ n ∈ A, cos (n * θ) < -c * sqrt N
  context:
    - open Erdos510
    - open Real Filter
    - open scoped Finset
  definitions: []
