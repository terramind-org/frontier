field: mathematics
tier: prose
statement: |-
  Let the group $G=AB$ be the product of two polycyclic subgroups
  $A$ and $B$, and assume that $G$ has an ascending normal series
  with locally nilpotent factors (i. e. $G$ is radical). Is it true
  that $G$ is polycyclic?
