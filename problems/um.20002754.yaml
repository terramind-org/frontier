title: Exact character formulas and minimal FI-generators via full label support
field: mathematics
tier: prose
statement: |-
  **Cohomology of \(\mathrm{PConf}^n\).** Find the Specht module decomposition for
  \(\mathrm H^i(\mathrm{PConf}^n\mathbb C)\), and its \(\mathrm{FI}\)-module generators. It
  might involve a derangement recurrence. Recurrence is going to involve both \(i\) and \(n\).
  (This question might relate to W. Chen's question.)
