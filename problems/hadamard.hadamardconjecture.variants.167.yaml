id: hadamard.hadamardconjecture.variants.167
title: "Hadamard's conjecture (variant: «167»)"
field: mathematics
tier: proof
statement: |-
  The smallest order for which no Hadamard matrix is presently known is $668 = 4 * 167$.
  Is `hadamardConstant` larger than $668$?
ams:
