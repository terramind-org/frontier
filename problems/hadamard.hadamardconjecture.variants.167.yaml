  context:
    - open Hadamard
    - open Hadamard.HadamardConjecture
    - open Hadamard.HadamardConjecture.variants
  definitions:
    - name: Hadamard.hadamardConstant
      kind: def
      text: |-
        /--
        The **smallest unsolved order** of the Hadamard conjecture: the smallest $n = 4k$ such that there
        is no Hadamard matrix of order $n$, or $\infty$ if there is none.
        -/
        @[optimization_constant "23a"]
        noncomputable def hadamardConstant : ℕ∞ :=
          ⨅ (k : ℕ) (_ : ¬ ∃ M, IsHadamard (n := 4 * k) M), (4 * k : ℕ∞)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/Hadamard.lean#L94
