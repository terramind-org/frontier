title: A Weakened Wills Inequality for Convex Bodies
field: mathematics
tier: prose
statement: Does there exist $c(n)$, depending only on $n$, such that $G(K)\leq V_n(K)+V_{n-1}(K)+c(n)\sum_{i=0}^{n-2}V_i(K)$ for every convex body $K\subset\mathbb R^n$?
