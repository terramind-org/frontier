title: Open Problems and Questions about Geodesics — Question 50
field: mathematics
tier: prose
statement: |-
  *Let $M$ be a closed manifold not covered by a sphere. Let $g$ be a metric on $M$ for which all geodesics are closed. Is $(M,g)$ a CROSS (=compact
  rank one symmetric) manifold (with the standard metric)?*
