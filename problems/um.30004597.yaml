title: Chemical Distances in Weighted Random Connection Models
field: mathematics
tier: prose
statement: For weight-dependent random connection models in the regime without ultrasmallness, determine the asymptotic chemical distance between two vertices; in particular, decide whether the known sublogarithmic lower bound is sharp or whether the distance is linear or polylogarithmic in different parameter regimes.
