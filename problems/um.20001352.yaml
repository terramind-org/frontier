title: Domain corrections and internal width bounds
field: mathematics
tier: prose
statement: |-
  Let \(G\) be \(F,T\) or \(V\) or a topological full group. Let \(\rho _1(g)\) be the commutator width of \(g\) and \(\rho _2(g)\) the minimum number of involutions in a factorization of \(g\).

  1. Prove that \(\rho _1\) and \(\rho _2\) are bounded.
  2. Prove that \(\rho _1=1\) and \(\rho _2=3\).
  3. Is there a finitely presented simple group with commutator width greater or equal to \(2\)?
