title: Perverse Intermediate Extensions at Parahoric Level
field: mathematics
tier: prose
statement: |-
  If $\pi_v$ is an irreducible cuspidal representation of $GL_g(F_v)$ whose mod-$\ell$ reduction is supercuspidal, does the conjectured isomorphism

  $${}^pj_{!*}\mathcal F_{\overline{\mathbb F}_\ell}(\pi_v,t)[d-tg]\simeq{}^{p+}j_{!*}\mathcal F_{\overline{\mathbb F}_\ell}(\pi_v,t)[d-tg]$$

  hold for every $1\leq t\leq\lfloor d/g\rfloor$?
