title: Research Problems in Function Theory — Problem 1.37
field: mathematics
tier: prose
statement: "Find criteria for and/or give explicit methods for the construction of meromorphic functions $f$ in $\\mathbb{C}$ with the following properties: [(a)] ; all poles of $f$ are of odd multiplicity; ; all zeros of $f$ are of even multiplicity. (Here `explicit methods' means that all computations must be practicable.) The background of this problem lies in the question of meromorphic solutions of the differential equation $y''+A(z)y=0$ in the whole plane. (J. Winkler)"
