title: Coincidence of Reduced and Topological Zeta Invariants
field: mathematics
tier: prose
statement: For a $d$-dimensional algebra $A$, define $m_{\mathrm{top}}(A)$ from the leading behavior of $Z_A^{\mathrm{top}}(s)$ at $s=0$ and $m_{\mathrm{red}}(A)$ from that of $Z_A^{\mathrm{red}}(T)$ at $T=1$. Prove that $m_{\mathrm{red}}(A)=m_{\mathrm{top}}(A)$ and that their common value is a positive rational number.
