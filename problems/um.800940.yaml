title: Open Problems and Questions about Geodesics — Question 20
field: mathematics
tier: prose
statement: |-
  An extensive list of results about the regularity of the Anosov splitting for the geodesic flow in negative curvature (and for other Anosov systems) can be found in the introduction to [Hasselblatt1994]. In dimension two, or if the curvature is $1/4$-pinched, the splitting is always at least $C^1$. In higher dimensions it is always H\"older continuous but typically not $C^1$. It is natural to ask:

  *Does there exist a closed Riemannian manifold of negative curvature such that $E^s $ and $ E^u$ are $C^1$ smooth, but the dimension is $> 2$ and the metric is not $1/4$-pinched*?
