statement: |-
  **Question 8. Question (Jean Fasel).** Let \(X\) be a smooth affine
  \(k\)-variety of odd dimension \(d\). Let \(P\) be a vector bundle of rank
  \(d\). Does \(c_d(P)\in CH^d(X)\) detect existence of a free summand of
  rank 1 for \(P\)?
