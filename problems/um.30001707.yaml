id: um.30001707
title: Multiplicity-Free Quantization and Orbit Counts
field: mathematics
tier: prose
statement: For a coadjoint orbit $O_{G}$ with quantization $Q(O_{G})$ and a subgroup $H$, is the restriction $Q(O_{G})|_{H}$ multiplicity-free exactly when $n(O_{G},O_{H})=\#(\mu^{-1}(O_{H})/H)\leq1$ for every $H$-coadjoint orbit $O_{H}$; and for a family $O_{G}^{\lambda}$, does multiplicity-freeness of the restrictions imply this orbit-count bound for every parameter $\lambda$?
