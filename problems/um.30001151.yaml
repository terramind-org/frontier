statement: For a smooth projective curve $X$ of genus at least $2$ over a number field $k$, is $X(k)\neq\varnothing$ equivalent to the existence of a continuous section of $$\pi_1(X/k)\longrightarrow\operatorname{Gal}(\overline k/k)$$?
