title: Orbit Closures and Stationary Measures of Random Walks
field: mathematics
tier: prose
statement: For a random walk generated by a probability measure $\mu$ acting on $X$ with semigroup closure $\Gamma$, describe all orbit closures $\Gamma x_0$; determine whether the empirical measures $\nu_n$ converge and identify their limits; prove no escape of mass; describe all $\mu$-stationary measures; and describe the topology of the set of $\mu$-ergodic $\mu$-stationary measures.
