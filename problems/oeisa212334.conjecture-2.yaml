id: oeisa212334.conjecture-2
title: Balanced walks on a 4-dimensional cubic lattice with neighbor steps (conjecture_2)
field: mathematics
tier: proof
statement: |-
  "Conjecture: for $r \ge 2$, and all primes $p \ge 5$,
  $a(p^r) \equiv a(p^{r-1}) \pmod{p^{3r+3}}$."
  - _Peter Bala_, Oct 13 2022
