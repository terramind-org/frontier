lean:
  module: FormalConjectures.OEIS.«212334»
  decl: OeisA212334.conjecture_2
  statement: |-
    theorem conjecture_2 (p r : ℕ) (hp : p.Prime) (hp5 : 5 ≤ p) (hr2 : 2 ≤ r) :
        a (p ^ r) % (p ^ (3 * r + 3)) = a (p ^ (r - 1)) % (p ^ (3 * r + 3))
  context:
    - open OeisA212334
  definitions:
    - name: OeisA212334.a
      kind: def
      text: |-
        /-- Number of words over a $4$-ary alphabet where each letter occurs $n$ times and adjacent
        letters are equal or neighbors, given by
        $a(n) = \sum_{k=0}^{n-1} \binom{n}{k} \binom{n-1}{k} \binom{n+k-1}{k}^2$ for $n \ge 1$ and
        $a(0) = 1$. -/
        def a (n : ℕ) : ℕ :=
          if n = 0 then 1
          else
            ∑ k ∈ Finset.range n, n.choose k * (n - 1).choose k * (n + k - 1).choose k ^ 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/212334.lean#L37
