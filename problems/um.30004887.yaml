title: Affine Springer Cohomology and Quantum-Group Centers
field: mathematics
tier: prose
statement: For an affine Springer fiber $\mathcal F\ell^J_\gamma$, a small quantum group $u^J_\zeta$, the coweight lattice $\check\Lambda$, and the affine Weyl group $W_{\mathrm{af}}$, are there canonical isomorphisms $$H^\bullet(\mathcal F\ell^J_\gamma)^{\check\Lambda}\cong Z(u^J_\zeta)^{\check T},\qquad H^\bullet(\mathcal F\ell^J_\gamma)^{W_{\mathrm{af}}}\cong Z(u^J_\zeta)^{\check G}$$?
