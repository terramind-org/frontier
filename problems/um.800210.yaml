title: Several Complex Variables Problem List — Problem 6
field: mathematics
tier: prose
statement: |-
  Let D be a bounded domain in $\mathbb{C}^n$ with smooth boundary, with
  envelope of holomorphy $D^{\sim}$.
  A)Is $D^{\sim}$ finitely sheeted over $\mathbb{C}^n$?
  B) Does $D^{\sim}$ have finite volume?\\
  -B. Stensones, berit@math.lsa.umich.edu.
