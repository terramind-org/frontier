title: Two-Reflective Automorphic Forms for Hyperbolic Lattices
field: mathematics
tier: prose
statement: For each of the $59$ even hyperbolic lattices $S$ whose $2$-reflection Weyl group has finite index and whose fundamental chamber admits a lattice Weyl vector, does there exist an integer $m$ and a positive-weight $2$-reflective holomorphic automorphic form $\Phi$ on $\Omega(U(m)\oplus S)$, with integral Fourier coefficients and divisor equal with multiplicity one to the rational quadratic divisors orthogonal to square-$2$ vectors?
