statement: |-
  \section{Mathematics of Quantum Computing}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  An $n$-qubit pure state is a unit vector in $(\mathbb C^2)^{\otimes n}$, considered up to global phase. Quantum gates act by the permitted unitary maps, and measurements produce classical outcomes according to the chosen measurement model. Entanglement means that a joint state cannot be represented as a product of subsystem states. Quantum error correction encodes logical information in a larger state space to protect it against a specified error class. A computation or control task must additionally specify its inputs, outputs and resources.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  This is DARPA Mathematical Challenge Twelve, a field-wide program. No fixed control system, quantum computational task, noise model or resource bound is supplied; the definitions explain its terminology rather than creating a new conjecture. The catalogue-linked mirror returned HTTP 404 during this preparation; its full original solicitation was not reverified. The supplied catalogue extract and historical attribution are documented with that access limitation.
  \paragraph{Statement recorded in the supplied source.}
  Develop the mathematics required to control the quantum world for computation. \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness.
  \subsection{Short English statement}
  Develop mathematical tools for using and controlling quantum systems in computation.
