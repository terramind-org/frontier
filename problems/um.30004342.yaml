title: Harder Congruences for Holomorphic Jacobi Forms
field: mathematics
tier: prose
statement: Assume $k\geq 3$, $j\geq 0$, and $j\equiv 2\pmod 4$. For a Hecke-eigen cusp form $f$ in $S_{2k+j-2}(\Gamma_1)$, let $\phi_0$ be the corresponding degree-one Jacobi form and $E(\phi_0)$ its degree-two Klingen lift. The holomorphic Jacobi-form version of Harder's conjecture asserts that there is a degree-two holomorphic Jacobi form $\Phi$ outside the lift and a prime ideal $\mathfrak l$ dividing $L^{\mathrm{alg}}(k+j,f)$ such that the Hecke eigenvalues of $\Phi$ and $E(\phi_0)$ are congruent modulo $\mathfrak l$ for every integral Hecke operator.
