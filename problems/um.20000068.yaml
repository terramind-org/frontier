title: Witt-index and odd-degree criteria for intersections of two quadrics
field: mathematics
tier: prose
statement: |-
  Hassett and Tschinkel showed that a complete intersection of two quadrics in
  \(\mathbb P^5\) over an arbitrary field \(k\) is rational if and only if it
  contains a line over \(k\).

  Give criteria for other geometrically rational Fano \(3\)-folds to be rational
  over a field \(k\).

  Give criteria for the complete intersection of two quadrics in
  \(\mathbb P^n\) to be rational over \(k\).
