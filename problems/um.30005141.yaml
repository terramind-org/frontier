title: Sobolev–Trace Minimizers in All Dimensions
field: mathematics
tier: prose
statement: Let $p\in(1,n)$, let $\Omega\subset\mathbb R^n$ be a bounded domain with $C^2$ boundary, and let $\Phi_\Omega(T)$ denote the optimal Sobolev–trace variational problem with prescribed boundary norm $T>0$. Does $\Phi_\Omega(T)$ admit a minimizer for every $T>0$ without the known restriction $n>2p$?
