title: Prime Quotients of Yang–Baxter Structure Algebras
field: mathematics
tier: prose
statement: For a prime ideal $P$ of $kM(X,r)$, determine the structure of $kM(X,r)/P$, including when it is a domain, a maximal order, Koszul, Auslander-regular, Cohen–Macaulay, or otherwise homologically well behaved. When does the quotient come from a related Yang–Baxter solution, and how do its properties affect $(X,r)$?
