title: Erdős–Pósa Properties of Induced Subdivisions
field: mathematics
tier: prose
statement: For which graphs $H$ do induced $H$-subdivisions have the Erdős–Pósa property? In particular, do even cycles have it, and what happens for $H=K_4$ or for a fan whose path has length $3$?
