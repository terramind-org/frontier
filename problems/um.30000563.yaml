title: Lagrangian Matching and Seiberg–Witten Invariants
field: mathematics
tier: prose
statement: For a homology-oriented closed $4$-manifold $X$ with $b_2^+(X)>1$ and a broken fibration $f$, the Lagrangian matching invariant $L_{X,f}(s)$ is conjectured to equal the Seiberg–Witten invariant $SW_X(s)$ for every admissible $\operatorname{Spin}^c$ structure $s$; hence $L_{X,f}$ should be independent of $f$.
