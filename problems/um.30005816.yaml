title: Extremal Bipartite Containment of B-t
field: mathematics
tier: prose
statement: Let $B_t$ have bipartition $L\sqcup R$, where $L=\{x_1,\ldots,x_t,y_1,\ldots,y_t,z_1,\ldots,z_t\}$, $R=\{w_{ijk}:1\leq i,j,k\leq t\}$, and $w_{ijk}$ is adjacent to $x_i,y_j,z_k$. Do there exist constants $\sigma<3$ and $C>0$ such that every sufficiently large bipartite graph $G=(A\sqcup B,E)$ with $|A|^\sigma<|B|$ and $|E|>C|B|$ contains $B_t$?
