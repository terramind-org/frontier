title: Holomorphic Foliation Theory — Problem 5
field: mathematics
tier: prose
statement: |-
  Let $\mathscr{F}$ be a holomorphic foliation on $\mathbb{P}^2$. Denote by $\mathrm{sing}(\mathscr{F})$ the singular set of $\mathscr{F}$ which is finite.

  Is it true that for every leaf $L$ of $\mathscr{F}$, we have $\overline L\cap \mathrm{Sing}(\mathscr{F})\not=\varnothing$ ?
