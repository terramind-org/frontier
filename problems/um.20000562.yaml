title: A mixed-discriminant reconstruction of the five-way spanning problem
field: mathematics
tier: prose
statement: |-
  There's an algorithm: start with k vectors in n-dimnl space. Can you partition them into 5 sets so that set spans the space. Take each vector, repeat it 5 times and augment those matrices by identity to get dimension k. You'll get k semi-def-pos. matrices. Now you check each matrix for some property xxxx. This is an algorithm to carry out Rado-Horn?

  * Mirko Visontai
