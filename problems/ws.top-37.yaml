  % UnsolvedMath ID 37; source catalogue code AG-002
  \setcounter{section}{36}
  \section{The Abundance Conjecture}\label{37}
  {\small UnsolvedMath ID 37 · Algebraic Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $X$ be a projective minimal model with nonnegative Kodaira dimension and nef canonical divisor $K_X$. Is $K_X$ semiample, meaning that a positive integral multiple of it is base-point-free?
  \par\smallskip\textit{Formulation references:} \sref{37}{1}, \sref{37}{2}.
  \subsection{Short English statement}
  Let $X$ be a projective minimal model with nonnegative Kodaira dimension and nef canonical divisor $K_X$. Is $K_X$ semiample, meaning that a positive integral multiple of it is base-point-free?
