title: Boundary Branch Singularities of Area-Minimizing Currents
field: mathematics
tier: prose
statement: Let $T$ be an area-minimizing two-dimensional current with analytic prescribed boundary curve $\Gamma\subset\mathbb R^{2+n}$. Is the set of branched singular points of $T$ at the boundary isolated, with $T$ having finite topology locally at each such point?
