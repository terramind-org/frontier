  definitions:
    - name: OeisA234360.a
      kind: def
      text: |-
        /--
        Number of integers $0 < k < n$ such that $(k + 1)^{\phi(n - k)} + k$ is prime,
        where $\phi$ is Euler's totient function.
        -/
        def a (n : ℕ) : ℕ :=
          (Finset.filter (fun k =>
            Nat.Prime ((k + 1) ^ (n - k).totient + k)
          ) (Finset.Ico 1 n)).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/234360.lean#L36
