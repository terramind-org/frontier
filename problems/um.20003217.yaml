title: Cyclic itinerary refinements for piecewise-linear rowmotion
field: mathematics
tier: prose
statement: "**Problem 4.1.** Explicitly describe the decomposition of \\(\\mathcal O(P)\\) under piecewise-linear promotion/rowmotion. Of particular interest are \\([a]\\times[b]\\) and the type \\(B_n\\) root poset. The case \\(P=[2]\\times[n]\\) is settled: the polytope is divided into Catalan-many simplices so that every power of the map restricts to a linear map on every simplex. The case \\(P=[3]\\times[n]\\) is more complicated and was unresolved."
