title: Density of Nodal Curves in Equigeneric Families
field: mathematics
tier: prose
statement: Let $V_g^\xi$ parametrize reduced curves of genus $g$ in class $\xi$ on a smooth projective surface. Is the locus of curves having only ordinary nodes dense in $V_g^\xi$? Can this be proved using the criterion that the equisingular ideal $I$ is properly contained in $A$ exactly for singularities worse than nodes?
