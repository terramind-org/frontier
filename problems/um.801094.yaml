title: "Henon Maps: Open Problems — Question 46"
field: mathematics
tier: prose
statement: Over a number field $K$, is it possible to construct infinite families of generalized H\'{e}non maps of algebraic degree $d$, and $K$-rational cycles of length at least $d+3$? Can one construct maps with $N_d$ periodic points, where $N_d- d\to \infty$, or even $N_d/d\to \infty$ as $d\to\infty$?
