title: Moments of L-functions — Moments of the Riemann zeta function — Problem 1
field: mathematics
tier: prose
statement: |-
  Give an explicit version of Harper's [Ha] upper bound for $I_k(T)$, assuming the Riemann hypothesis. That is, for $k >0$ determine $C_k$ such that
  \begin{equation}

  I_k(T) \le C_k T (\log T)^{k^2}
  \end{equation}
  for $T$ sufficiently large.
  Note that this is related to the following conjecture of Soundararajan [S2]
  for $k \ge 2$ and $T \ge 10$,
  \[
  I_k(T) \le T (\log T)^{k^2}.
  \]
  (Nathan Ng, Lethbridge) \\
