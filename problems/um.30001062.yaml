title: Density Thresholds for Finite-Field Configurations
field: mathematics
tier: prose
statement: Let $E\subseteq\mathbb{F}_q^d$, where $d\geq2$, and let $V=\{0,v_1,\ldots,v_{k-1}\}$ be a nondegenerate $k$-point configuration whose nonzero vectors span a $(k-1)$-dimensional subspace. How large must $E$ be to guarantee that it contains a congruent copy $\tau+O(V)$ for some $\tau\in\mathbb{F}_q^d$ and $O\in\operatorname{SO}_d(\mathbb{F}_q)$?
