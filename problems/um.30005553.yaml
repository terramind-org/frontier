title: Boundary Sparse Bounds for Planar Bochner–Riesz Means
field: mathematics
tier: prose
statement: For $0<\lambda<1/2$, do the planar Bochner–Riesz means $R_t^\lambda$ satisfy every sparse bound $\operatorname{Sp}(p,q)$ whose reciprocal-exponent pair $(1/p,1/q)$ lies on the boundary segment $P_2P_3$ of the necessary-condition trapezoid $T_2(\lambda)$?
