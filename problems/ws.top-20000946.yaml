  \section{Cycle--clique Ramsey numbers and an endpoint-fan certificate}\label{20000946}
  {\small UnsolvedMath ID 20000946 · Combinatorics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $r(C_m,K_n)$ be the least number of vertices that forces a red cycle of length $m$ or a blue clique of size $n$ in every red-blue edge-coloring of a complete graph. Is
  \[r(C_m,K_n)=(m-1)(n-1)+1\]
  for all $m\geq n$?
  \par\smallskip\textit{Formulation references:} \sref{20000946}{1}, \sref{20000946}{2}.
  \subsection{Short English statement}
  Let $r(C_m,K_n)$ be the least number of vertices that forces a red cycle of length $m$ or a blue clique of size $n$ in every red-blue edge-coloring of a complete graph. Is
