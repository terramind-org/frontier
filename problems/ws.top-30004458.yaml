  \section{Residual Finiteness and Minimal Presentations of Hyperbolic Groups}\label{30004458}
  {\small UnsolvedMath ID 30004458 · Group Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Is every hyperbolic group residually finite? Separately, what is the smallest total relator length in a presentation of an infinite hyperbolic group with Kazhdan property (T)?
  \par\smallskip\textit{Formulation references:} \sref{30004458}{1}, \sref{30004458}{2}.
