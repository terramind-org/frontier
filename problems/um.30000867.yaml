title: Automorphic Realization of Motivic L-Functions
field: mathematics
tier: prose
statement: Given number fields $E$ and $F$ and a motive $M$ over $F$ with coefficients in $E$, find a connected reductive algebraic group $G/F$, an automorphic representation $\pi$ of $G(\mathbb{A}_F)$, and a representation $r$ of the L-group of $G$ such that $L(M,s)=L(s,\pi,r)$. Find $G$ as small as possible.
