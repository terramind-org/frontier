id: um.20000440
title: A finite binary criterion for Brauer-compatible lifts to an Enriques K3 cover
field: mathematics
tier: prose
statement: |-
  Let \(X\) [be] an Enriques surface over a number field \(K\), and let
  \(p:Y\to X\) be the double cover, where \(Y\) is a K3 surface. Let
  \(X(\mathbb A_K)^{\operatorname{Br}}\) be the Brauer--Manin set. Take
  \(m=(m_v)\in X(\mathbb A_K)^{\operatorname{Br}}\), and lift it to an
  adelic point \(P=(P_v)\) on \(Y\). Under what assumptions on \(m\) will it
  be liftable to a point in \(Y(\mathbb A_K)^{\operatorname{Br}}\), or at
  least in \(Y(\mathbb A_K)^{\operatorname{Br}_1}\)?
