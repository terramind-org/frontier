title: Applications 3 — Investigate Voevodsky's stable homotopy category of schemes from a homotopy theorist's point of view.
field: mathematics
tier: prose
statement: Investigate Voevodsky's stable homotopy category of schemes from a homotopy theorist's point of view. This is obviously a huge, unstructured problem, but I think there is room for a serious algebraic topologist to make some inroads. In particular, Bousfield localization is really a great thing, and they have not exploited this at all so far, I believe. The drawback is having to learn so much algebraic geometry before you have a chance.
