title: Kourovka Notebook Problem 9.31
field: mathematics
tier: prose
statement: |-
  Let $k$ be a field of characteristic 0. According
  to (Yu. I. Merzlyakov, *Proc. Steklov Inst. Math.*, **167** (1986), 263--266), the family $\mathrm{Rep}_k(G)$ of all
  canonical matrix representations of a $k$-powered group $G$ over $
  k$ may be regarded as an affine $ k$-variety. Find an explicit
  form of equations defining this variety.
