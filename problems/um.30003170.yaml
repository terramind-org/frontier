title: Learning Related Structural Causal Models from Heterogeneous Data
field: mathematics
tier: prose
statement: Given observations $(x_1,\ldots,x_n)$ and a similarity measure $k(x_i,x_j)$ indicating whether data points come from the same distribution, how can this information be exploited to learn an overall collection of structural causal models when the data are non-identically distributed across related tasks?
