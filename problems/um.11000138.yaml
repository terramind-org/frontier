title: Problem 8 — [Contributed by the referee] Does Theorem 5 say anything about the structure of the end of Riemann’s moduli space?
field: mathematics
tier: prose
statement: "[Contributed by the referee] Does Theorem 5 say anything about the structure of the end of Riemann’s moduli space? For instance, what is the homology near the end? Take the one-point compactification F × of F = Fs g,r, where all of the s≥ 0 punctures of F are identified to a single point in F ×, so F × =F if and only if s≤ 1. Let ∂ denote the boundary mapping of the chain complex {Cp(Arc): p≥ 0} of Arc = Arc(F ). Suppose that α is an arc family in F with corresponding cell σ[α]∈Cp(Arc). A codimension-one face of σ[α] of course corresponds to removing one arc from α, and there is a dichotomy on such faces σ[β] depending upon whether the rank of the first homology of F ×−∪β agrees with or diﬀers by one from that of F ×−∪α. This dichotomy decomposes ∂ into the sum of two operators ∂ =∂1 +∂2, where ∂2 corresponds to the latter case. The operators ∂1,∂ 2 are a pair of anti-commuting diﬀerentials, so there is a spectral sequence converging to H∗(Arc) corresponding to the bi-grading E0 u,v ={chains on σ[α]∈Cp(Arc): v =−rank(H1(Fα)) and u =p−v}, where ∂1:E0 u,v→E0 u−1,v and the diﬀerential of the E0 term is ∂2:E0 u,v→E0 u,v−1. It is not quite fair to call it a problem, nor a theorem since the argument is complicated and has not been independently checked, but we believe that this spectral sequence collapses in its E1-term to its top horizontal row except in dimension zero. Thus, the homology of Arc is the ∂1-homology of the ∂2-kernels in the top row, and on the other hand, it follows from [31] that the∂1-homology of the top row itself agrees with that of uncompactified Riemann’s moduli space M(F ) As discussed in [30,46], the stratified structure of the arc complexes for bordered surfaces gives a corresponding stratified structure to A(F ) for punctured F. This may be enough to re-visit the calculations of [19] and [16,22] with an eye towards avoiding technical diﬃculties with the Deligne-Mumford compactification ¯M(F )."
