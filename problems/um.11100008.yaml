title: Major problems 8 — Say something general about the stable or unstable homotopy groups of spheres.
field: mathematics
tier: prose
statement: Say something general about the stable or unstable homotopy groups of spheres. For example, Ravenel has suggested that the size of the nth homotopy group of S^k grows polynomially in n, maybe even cubically. I presume he meant stable homotopy, but one could also ask the question unstably.
