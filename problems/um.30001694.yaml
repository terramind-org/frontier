title: Large Inscribed Lattice Squares in Polyomino Boundaries
field: mathematics
tier: prose
statement: Let $P$ be a polyomino whose boundary is a closed Jordan curve $J$ and whose unit-square vertices lie in the lattice. If the greatest axis-parallel open square in the bounded component of $\mathbb{R}^{2}\setminus J$ has side length $s$, must $J$ contain four lattice points forming a square of side at least $s/\sqrt{2}$ when $s$ is even, and at least $\sqrt{m^{2}+(m+1)^{2}}$ when $s=2m+1$?
