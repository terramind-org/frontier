title: Sharp Constrained-Drawing Bounds for Closure Operators
field: mathematics
tier: prose
statement: Let $\operatorname{cl}$ be a closure operator on $\mathbb R^2$ such that $\operatorname{cl}(S)$ has at most $b$ path-connected components for every finite $S\subset\mathbb R^2$. Are $kb+1$ points always sufficient to obtain a constrained drawing of the star $K_{1,k}$? What sharper bounds hold for constrained drawings of $K_n$, and can constrained-drawing arguments be extended to nontrivial homology or homotopy in higher dimensions?
