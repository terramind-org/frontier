title: Spaces with Lower Ricci Curvature — Conjecture 2
field: mathematics
tier: prose
statement: Let $\big(M^n_i,g_i,p_i\big)\to (X,d,p)$ satisfy $\mathrm{Ric}\geq -(n-1)$ and $\mathrm{Vol}(B_1(p_i))>v>0$, then the tangent cones of $X$ are unique away from a set of codimension three.
