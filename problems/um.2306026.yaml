title: Research Problems in Function Theory — Problem 6.26
field: mathematics
tier: prose
statement: "Suppose that $f(z)=\\sum^\\infty_{n=0}a_nz^n$ is circumferentially mean $p$-valent and $f(z)\\neq0$ in $\\mathbb{D}$. (This latter condition is a consequence of mean $p$-valency if $p<1$). It is conjectured that in this case, at least if $p\\geq 1$, we have $$ |a_n|\\leq A_{n,p} $$ where $$ F(z)=a_0\\Big(\\frac{1+z}{1-z}\\Big)^{2p}=\\sum^\\infty_{n=0}A_{n,p}z^{2n}. $$ The conjecture ([source label: 6.10]) is known to be true for $n=1$ and all $p$; and for $n=2, 3$ if $p=1$, by the results quoted in Problem 6.25. It is certainly false for small positive $p$, and large $n$, since it would imply $a_n=O(n^{\\varepsilon-1})$ for every positive $\\varepsilon$ as $n\\to\\infty$, for a bounded univalent function. For if $g(z)$ is bounded and univalent, and $\\varepsilon>0$, then if $K$ is a sufficiently large positive constant $g(z)+K$ is circumferentially mean $\\varepsilon$-valent. On the other hand, if $p>\\frac{1}{4}$ and $f(z)$ is fixed, ([source label: 6.10]) holds for all sufficiently large $n$, see Hayman . In the special case when $p=1$ and $f(z)$ is univalent, ([source label: 6.10]) reduces to the Littlewood conjecture $|a_n|\\leq4|a_0|n$. This conjecture is somewhat weaker than the Bieberbach conjecture. It was shown by Nehari (see also Bombieri ) that we have at any rate $|a_n|\\leq 4K_0|a_0|n$ if $f(z)$ is univalent, where $K_0$ is the constant of Problem 6.2. Thus, Littlewood's conjecture holds since $K_0=1$, as was pointed out in Update 6.2. It also seems likely that for $\\lambda p>1$ \\[I_\\lambda(r,f)\\leq I_\\lambda(r,F)\\] if $f(z)$ satisfies the above hypotheses, and $F(z)$ is given by ([source label: 6.11])."
