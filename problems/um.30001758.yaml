statement: Which curvature conditions on a closed manifold $M$ imply that some finite cover $\widetilde M$ splits as $T^k\times N$ with $N$ simply connected and satisfies $b_1(M)\leq k\leq\operatorname{cup}(\widetilde M)$, where $\operatorname{cup}$ denotes rational cuplength?
