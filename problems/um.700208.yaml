statement: |-
  The notion of the *$p
  $-length*
  of an arbitrary finite group was introduced in (L. A. Shemetkov,
  *Math. USSR Sbornik*, **1** (1968), 83--92). Investigate the
  relations between the $p
  $-length of a finite group and
  the invariants $c_p$, $d_p$, $e_p$ of its Sylow $p
  $-subgroup.
