title: Realization of Matricial Families by Tensor-Algebra Elements
field: mathematics
tier: prose
statement: Let $M$ be a $W^*$-algebra, let $E$ be a $W^*$-correspondence over $M$, and let $Z$ be an admissible sequence of weights defining the weighted tensor algebra $\mathcal T_+(E,Z)$. Every $F\in\mathcal T_+(E,Z)$ has a Berezin transform that forms a matricial family on the associated weighted intertwiner domains. Conversely, does every such matricial family arise as the Berezin transform of some $F\in\mathcal T_+(E,Z)$?
