statement: Once again, I am not sure whether this problem deserves to be called major, but it is annoying that the the R. Cohen - Goerss result proving that h_0 h_i is a permanent cycle in the Adams spectral sequence for all primes bigger than 3 is wrong. The flaw was found by Minami, and it appears to be fatal to their proof. So this problem is still open.
