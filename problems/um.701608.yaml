statement: Let $R$ be a principal ideal domain, let $d$ be a positive integer, and let $X_1, \ldots, X_m$ be members of $\mathrm{SL}(d,R)$ (or of $\mathrm{GL}(d,R)$). Is it decidable whether or not these $m$ matrices freely generate a free group? If it is, design an effective algorithm for computing the answer.
