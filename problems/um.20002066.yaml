title: Open-book chord dictionaries and a binding-intersection filtration
field: mathematics
tier: prose
statement: There was a fair bit of discussion on how to possibly compute contact homology in terms of (contact) open books. For example, Denis Auroux pointed out that if you have a Lagrangian \(L\) in a page, then this is a Legendrian in the open book, and the Reeb chords are the intersections of \(L\) with \(\phi^k(L)\), where \(\phi\) is the monodromy. This might be a starting point for computing the relative contact homology of \(L\), in the complement of the binding, in terms of things related to symplectic Floer homology of Lagrangians. There is then the problem of understanding what happens when one puts back the binding, but this might correspond to an “\(A_\infty\) deformation”.
