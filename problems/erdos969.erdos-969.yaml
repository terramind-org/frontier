      kind: def
      text: |-
        /-- The error term in `Q(x) = (6 / π^2) x + E(x)`. -/
        noncomputable def squarefreeCountingError (x : ℕ) : ℝ :=
          (squarefreeCounting x : ℝ) - 6 / Real.pi ^ 2 * x
