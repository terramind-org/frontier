title: Sharp Density of Parametric Regular Quadratic Extensions
field: mathematics
tier: prose
statement: |-
  The proportion $f(H)$ of parametric regular quadratic extensions is known to satisfy

  $$f(H)=1-O\!\left(\frac{\log H}{\sqrt H}\right)$$

  Can the error term be removed unconditionally?
