  note: "Laderman's rank 23 dates from 1976 and the fast matrix multiplication catalogue still lists no rank-22 scheme fifty years later."
witness:
  verifier: matmul
  params:
    field: Z
    n: 3
  objective: minimize
  best_known:
    value: 23
    reference:
      label: Fast matrix multiplication catalogue, <3x3x3:23>, taken from Laderman (1976)
      url: https://fmm.univ-lille.fr/3x3x3.html
    note: "Read on 2026-10-19: the catalogue entry credits Laderman, Bull. AMS, January 1976, and lists no scheme of rank 22. A lower bound of 19 (Blaeser, 2003) was seen only in a search summary and not confirmed for the integers; the gap 19 to 23 is the safe statement. The catalogue stores the third matrix of each triad transposed; this verifier takes c as it is added to C."
  format: 'A JSON object {"terms": [{"a": M, "b": M, "c": M}, ...]} where each M is a 3x3 array of arrays. Entries are integers. The scheme computes C = sum over terms of <a,A> <b,B> c, with <a,A> = sum of a[i][j]*A[i][j] and c added to C as stored (C[i][l] gets the coefficient of A[i][j]*B[j][l]). It is valid when this equals the 3x3 matrix product as a polynomial identity, checked exactly. The value is the number of terms (at most 1000).'
added: 2026-10-19
