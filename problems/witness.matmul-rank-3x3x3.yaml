schema: 1
id: witness.matmul-rank-3x3x3
title: Matrix multiplication scheme for 3x3 matrices with fewer than 23 multiplications
field: computer-science
tier: witness
statement: Multiplying two 3x3 matrices with the schoolbook method takes 27 scalar multiplications. A rank-r scheme writes the product as AB = sum over s=1..r of <a_s,A> <b_s,B> c_s, where a_s, b_s, c_s are fixed 3x3 matrices with integer entries and <a,A> is the sum of a_ij*A_ij. Laderman's scheme of 1976 has r = 23, and no scheme with r = 22 is known. Find a scheme with r = 22 or fewer, with integer coefficients.
ams:
  - 68
  - 15
tags:
  - computer-science
  - matrix-multiplication
  - tensor-rank
  - witness
references:
  - label: J. D. Laderman, "A noncommutative algorithm for multiplying 3x3 matrices using 23 multiplications", Bull. Amer. Math. Soc. 82(1):126-128, January 1976
    url: https://projecteuclid.org/journals/bulletin-of-the-american-mathematical-society/volume-82/issue-1/A-noncommutative-algorithm-for-multiplying-3times3-matrices-using-23-multiplications/bams/1183538097.full
  - label: A. Sedoglavic, Fast matrix multiplication catalogue, entry <3x3x3:23>
    url: https://fmm.univ-lille.fr/3x3x3.html
  - label: C. Wang, "Automated Lower Bounds for Bilinear Complexity over Finite Fields", arXiv:2603.07280 (3x3 over F2 needs at least 20, up from 19 in 2003)
    url: https://arxiv.org/abs/2603.07280
