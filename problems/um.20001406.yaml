title: Gluing blockwise martingale decompositions across seams
field: mathematics
tier: prose
statement: |-
  Problem 21. Can one use function spaces to get martingale decompositions and concatenations for some class of hyperbolic maps?

  Can one use generalized function spaces to get martingales for concatenations of random hyperbolic maps?

  No mathematical symbols are missing.

  This is a repeated workshop question. On the preceding day, Problem 15 asked:

  Problem 21 replaces “generalized function spaces” by “function spaces” and “martingales for concatenations” by “martingale decompositions and concatenations,” but the research intent is the same. Problem 27 on the following day repeats Problem 21 verbatim. The repetition is useful evidence that this was a persistent workshop theme rather than three unrelated questions.

  The completed analysis of Problem 15 (AIM-DYNAMICAL_SYSTEMS-0058) derived a global sequential Gordin recursion from summable transfer-cocycle memory. When do the local martingale–coboundary decompositions glue globally, and what precisely is paid at the seams?
