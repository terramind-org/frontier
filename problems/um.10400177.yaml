statement: (V. Turaev) Relate this surgery formula for the Casson-Wal- ker-Lescop invariant with that of Lescop [251]. 32The normalization here is that λ CW(M ) = 2 λ C(M ) for an integral homology 3-sphere M. 33The normalization here is that λ CWL(M ) = ( |H1(M; Z)|/ 2 ) λ CW(M ) for a rational ho- mology 3-sphere M. (C. Lescop) In 1984, Casson defined his invariant of integral homology 3- spheres as an integer that “counts” the SU (2)-representations of their funda- mental group in an appropriate way (see [3, 159]). Cappell, L ee and Miller [76] showed that the Casson way of counting SU (2)-representations of the π1 works for any compact Lie group and provides other invariants of in tegral homology spheres.
