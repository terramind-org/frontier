title: Perversity of normalized parity sheaves on flags and affine-Grassmannian truncations
field: mathematics
tier: prose
statement: |-
  1. For which primes \(p\) is it true that all indecomposable \(B\)-constructible parity \(\mathbb F_p\)-sheaves on \(G/B\) are perverse?
  2. Same question for \(I\)-constructible parity \(\mathbb F_p\)-sheaves on \(\mathrm{Gr}\).

  (Expect this to be true for large \(p\).)
