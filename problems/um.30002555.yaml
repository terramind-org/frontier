title: Veech Groups with Prescribed End Spaces
field: mathematics
tier: prose
statement: Let $X$ be a closed subspace of the Cantor set and let $G\leq\operatorname{GL}^+(2,\mathbb R)$ be a countable subgroup without contracting elements. Can $G$ be realized as the Veech group of a tame infinite-genus translation surface $S$ without planar ends and with $\operatorname{Ends}(S)\cong X$?
