title: Kourovka Notebook Problem 18.109
field: mathematics
tier: prose
statement: |-
  Is it true that a group satisfying Kazhdan's property (T) cannot homomorphically map onto infinitely many simple groups of Lie type of rank 1?

  It is known that a group which maps onto $PSL_2(q)$ for infinitely many $q$ does not have Kazhdan's property (T).
