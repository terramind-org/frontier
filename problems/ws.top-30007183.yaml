statement: |-
  \section*{Reflexive asymptotic midpoint renormability versus AUC}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must every infinite-dimensional real reflexive Banach space that admits an asymptotically midpoint uniformly convex norm also admit an equivalent asymptotically uniformly convex norm? Here midpoint uniform convexity means a positive finite-codimensional averaged two-sided modulus at every positive radius, whereas AUC requires the corresponding one-sided modulus positive.
  \subsection{Short English statement}
  Must every infinite-dimensional real reflexive Banach space that admits an asymptotically midpoint uniformly convex norm also admit an equivalent asymptotically uniformly convex norm? Here midpoint uniform convexity means a positive finite-codimensional averaged two-sided modulus at every positive radius, whereas AUC requires the corresponding one-sided modulus positive.
