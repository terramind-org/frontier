title: Bounded Conjugation-Invariant Metrics on Higher-Rank Lattices
field: mathematics
tier: prose
statement: Let $G$ be a lattice in a higher-rank simple Lie group with finite center, and let $d_S$ be the conjugation-invariant word metric induced by the union of all conjugates of a finite generating set. Is $d_S$ bounded?
