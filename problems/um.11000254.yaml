title: "Question 4.7 — Forg,h≥ 2, does there exist a short exact sequence: 1→π1(Σg)→ Γ→π1(Σh)→ 1 for which Γ is a word hyperbolic group?"
field: mathematics
tier: prose
statement: "Forg,h≥ 2, does there exist a short exact sequence: 1→π1(Σg)→ Γ→π1(Σh)→ 1 for which Γ is a word hyperbolic group? Arguing as in the proof of Theorem 4.2, it follows that such an extension defines a purely pseudo-Anosov surface subgroup of Γ g. However, even in this case, little is known. We make two comments in this regard. 1. One result is that Γ cannot be the fundamental group of a closed complex hyperbolic surface. As described in [ 20], this follows from [ 25], on showing that if Γ is as decribed, then there is a non-singular holomorphic fibration X = H2 C/Γ→ Σh that induces the short exact sequence (see also [ 17]). 2. The following idea to construct purely pseudo-Anosov surface subgroups was described to me by Ian Agol. In [ 40], Thurston proves the following result (see [ 40] for terminology and further details). 17. Surface subgroups of mapping class groups 283"
