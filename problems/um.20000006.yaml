title: Normal-bundle criteria for exceptional sheaves on toric strata
field: mathematics
tier: prose
statement: |-
  Does every smooth toric variety admits an exceptional collection of sheaves … More specifically, is it possible to find an exceptional collection from (push-forwards of) line bundles on toric strata?

  **Recovered question.** Over an algebraically closed field of characteristic zero, does every smooth projective toric variety \(X\) admit a full exceptional collection whose objects are coherent sheaves? Can the sheaves be chosen as \(i_*\mathcal L\), where \(i:V(\sigma)\hookrightarrow X\) includes a torus-orbit closure (allowing \(V(0)=X\)) and \(\mathcal L\) is a line bundle on \(V(\sigma)\)?
