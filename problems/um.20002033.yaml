title: Cauchy saturation and spin-structure obstruction for Lorentzian spinor kernels
field: mathematics
tier: prose
statement: |-
  **Problem 13.** Find all Lorentzian conformal structures \((M,[g])\) with \(t(g)>0\) or \(h(g)>0\).

  Fix a connected, oriented and time-oriented Lorentzian conformal spin manifold \((M^n,[g],\mathfrak s)\), \(n\geq3\), including a chosen spin structure \(\mathfrak s\). For smooth complex spinors, classify those for which \(\ker D_g\neq0\) or \(\ker P_g\neq0\).
