  \item[S2] American Institute of Mathematics, The Caccetta-Haggkvist conjecture, item 6.4. Original workshop question underlying AIM-COMBINATORICS-0164.
  \url{https://aimath.org/WWN/caccetta/caccetta.pdf}.
