title: Finite-dimensional local rigidity from central-section perimeters
field: mathematics
tier: prose
statement: |-
  **20. (R.J. Gardner) [G, Problem 7.6]** If \(K\) and \(L\) are
  origin-symmetric star bodies in \(\mathbb R^3\) whose sections by every plane
  through the origin have equal perimeters, is \(K=L\)? In particular, This was
  proved by R. Howard, F. Nazarov, D. Ryabogin and A. Zvavitch for bodies of
  revolution and by V. Yaskin for polytopes.
