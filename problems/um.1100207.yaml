title: Questions in Geometric Group Theory — Q 2.7
field: mathematics
tier: prose
statement: |-
  **Q 2.7 (D. Wise).** Let $G$ act properly discontinuously and cocompactly on a CAT(0) space (or let $G$ be
  automatic). Consider two elements $a, b$ of $G$. Does there exist $n > 0$ such that either the subgroup
  $\langle a^n, b^n\rangle$ is free or $\langle a^n, b^n\rangle$ is abelian?
