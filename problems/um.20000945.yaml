title: Skeletal degeneracy and an asymmetric Ramsey transfer
field: mathematics
tier: prose
statement: |-
  Call a \(k\)-uniform hypergraph \(d\)-degenerate if the 2-graph obtained by replacing every edge by a graph clique \(K_k^{(2)}\) is \(d\)-degenerate as a graph.

  For fixed \(k,d\), does every \(n\)-vertex \(k\)-uniform hypergraph \(H\), whose pair shadow is \(d\)-degenerate, satisfy \(r(H;2)=O_{k,d}(n)\)?
