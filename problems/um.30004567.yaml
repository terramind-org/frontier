title: Folded Ribbonlength Bounds and Knot Complexity
field: mathematics
tier: prose
statement: For folded ribbon knots and links, can one prove lower bounds for folded ribbonlength; can one find embeddings with $\operatorname{Rib}(K_w)\leq O(\operatorname{Cr}(K)^p)$ for some $1\leq p<3/2$ or families with superlinear folded ribbonlength in crossing number; and how does folded ribbonlength depend on ribbon equivalence and framing?
