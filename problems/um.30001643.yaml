title: Transferring Hypocoercivity to Larger Banach Spaces
field: mathematics
tier: prose
statement: Let $L$ be an operator on a Hilbert space $H$ such that, for some $a<0$, $\Sigma(L)\cap\{z:\operatorname{Re}z>a\}=\{0\}$, $\ker L$ is finite-dimensional, and $\|e^{tL}f-\Pi f\|_H\leq C_ae^{at}\|f\|_H$. For an extension of $L$ to a Banach space $E\supset H$, under what hypotheses do the same spectral-gap and semigroup-decay conclusions hold on $E$?
