title: Determining Wavenumbers Near Three-Dimensional Turbulence
field: mathematics
tier: prose
statement: For three-dimensional Navier–Stokes dynamics with intermittency dimension $d$ near $3$, is the time-averaged determining wavenumber $\langle\Lambda\rangle$ bounded by a constant multiple of the Kolmogorov dissipation wavenumber $\kappa_d$, as predicted by Kolmogorov turbulence theory?
