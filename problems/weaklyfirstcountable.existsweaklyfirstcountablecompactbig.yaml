lean:
  module: FormalConjectures.Paper.WeaklyFirstCountable
  decl: WeaklyFirstCountable.existsWeaklyFirstCountableCompactBig
  statement: |-
    theorem existsWeaklyFirstCountableCompactBig :
        ∃ (X : Type) (_ : TopologicalSpace X),
          WeaklyFirstCountableTopology X ∧ CompactSpace X ∧ T2Space X ∧
            𝔠 < #X
