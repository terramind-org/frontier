title: Kourovka Notebook Problem 16.76
field: mathematics
tier: prose
statement: |-
  We call a group $G$ *strictly real* if
  each of its non-trivial elements is conjugate to its inverse by
  some involution in $G$. In which groups of Lie type over a field
  of characteristic 2 the maximal unipotent subgroups are
  strictly real?
