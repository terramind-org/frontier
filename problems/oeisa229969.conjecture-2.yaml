id: oeisa229969.conjecture-2
title: Ways to write $n = x + y + z$ with six linear and quadratic forms prime (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Moreover, any integer $n > 6$ can be written as $x + y + z$ with $x$ among $3, 4, 6, 10, 15$ such
  that $2y-1, 2z-1, 2xy-1, 2xz-1, 2yz-1$ are prime.
