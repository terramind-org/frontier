title: Wrapped Fukaya Categories as Crepant Resolutions
field: mathematics
tier: prose
statement: For a maximally degenerate positive Calabi–Yau pair $(M,D)$ admitting a weak section, do the functors $\pi^*$ and $\pi_*$ make $\mathcal W(X)$ a categorical crepant resolution of $SH^0(X)$? In particular, is $\mathcal W(X)$ relatively Calabi–Yau over $SH^0(X)$?
