statement: "**Noetherianity of \\(\\mathrm{FI}\\)-algebras.** Let \\(V_n=\\mathbf k[x_1,x_2,\\ldots,x_n]\\). Find a concrete example of a sub-\\(\\mathrm{FI}\\)-algebra which is not noetherian. Is there a version for finitely presented modules? Does it depend on characteristic?"
