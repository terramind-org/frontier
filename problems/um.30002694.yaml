title: Curvature-Derivative Invariants of Homogeneous Spaces
field: mathematics
tier: prose
statement: For a homogeneous Riemannian manifold, let $k_o$ denote its constant Jacobi osculating rank, let $k_t$ be the least $k\geq0$ for which the completely traceless Cartan component $Y_0^{(k+3,2)}R$ vanishes, and let $k_S$ be its Singer invariant. Determine $k_t$ for $\operatorname{Sp}(2)/\operatorname{SU}(2)$, $(\operatorname{SO}(3)\times\operatorname{SU}(3))/U^\bullet(2)$, $\operatorname{SU}(3)/T^2$, and Kaplan's six-dimensional geodesic-orbit nilmanifold, and compute these invariants for further homogeneous spaces. Is $k_t$ finite for every naturally reductive, geodesic-orbit, or homogeneous Riemannian space, and does finite $k_t$ characterize complete homogeneous spaces? Is $k_o$ finite for every homogeneous Einstein manifold? When does equality hold in $k_t\leq k_o$, $k_S\leq k_o$, or, in the Einstein case, $k_S\leq k_t$?
