lean:
  module: FormalConjectures.ErdosProblems.«317»
  decl: Erdos317.erdos_317
  statement: |-
    theorem erdos_317 :
        ∃ c > 0, ∀ n ≥ 1, ∃ δ : Fin n → ℚ,
          Set.range δ ⊆ {-1, 0, 1} ∧
          letI lhs : ℝ := |∑ k, (δ k) / (k + 1)|
          0 < lhs ∧ lhs < c / 2^n
