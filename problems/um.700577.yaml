statement: |-
  A topological group is said to be *layer
  compact* if the full inverse images of all of its compacts under
  mappings $x \rightarrow x^n$, $n=1, 2, \ldots $, are
  compacts. Describe the locally compact locally soluble layer
  compact groups.
