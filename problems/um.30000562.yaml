title: Injectivity and Inversion of Restricted Spherical Radon Transforms
field: mathematics
tier: prose
statement: For the spherical Radon transform restricted to centers on a hypersurface $S$, determine injectivity, inversion formulas and their stability, the effect of incomplete data, and the range of $R_S$. In particular, does $R_Sf=0$ imply $f=0$ for compactly supported $f$?
