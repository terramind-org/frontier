title: Trimer Covers in the Triangular Grid — Problem 13
field: mathematics
tier: prose
statement: |-
  Is it true that $T_{112}(n+2,2n)$
  is the number of ``royal paths in a lattice of order $n$''
  (see OEIS entry A006319 (https://oeis.org/A006319))
  for all $n \geq 1$?
  Equality has been verified for $1 \leq n \leq 15$.
