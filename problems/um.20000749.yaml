title: A quantitative short-interval transfer for small values of ap-q
field: mathematics
tier: prose
statement: |-
  14. Small values of linear forms at prime arguments. A. Balog proposed the following problem: Show that the difference \(|ap-q|\), where \(p,q\) are primes and \(a>1\) is a fixed integer, can be small. More generally, consider the case when \(a\) is real, \(a,1\).”

  “More generally, consider the case when \(a\) is real, \(a\ne1\).
