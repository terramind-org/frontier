statement: For every noncomputable $A<_T\varnothing'$ that is not $K$-trivial, does there exist a Martin-Löf random $R<_T\varnothing'$ such that $A\oplus R\equiv_T\varnothing'$ and every $B\leq_T A,R$ is $K$-trivial?
