  % UnsolvedMath ID 9400059; source catalogue code AMR-093-0059
  \setcounter{section}{9400058}
  \section{Characterize all algebraic number fields that have some power basis}\label{9400059}
  {\small\sffamily UnsolvedMath ID 9400059 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $K/\mathbb Q$ be a finite field extension of degree $n=[K:\mathbb Q]$. A power basis of the field means a $\mathbb Q$-vector-space basis $1,\alpha,\ldots,\alpha^{n-1}$ for some $\alpha\in K$. Equivalently $K=\mathbb Q(\alpha)$. The primitive-element theorem gives such a basis for every number field. A power \emph{integral} basis would instead be a $\mathbb Z$-basis of the full ring of integers $\mathcal O_K$; that is a different condition.
  \paragraph{Statement recorded in the supplied source.}
  Characterize the number fields $K$ which admit a power basis in the displayed field sense. Under this definition the characterization is all finite extensions of $\mathbb Q$, by the primitive-element theorem. \sref{9400059}{2}
  \subsection{Short English statement}
  Which number fields have a basis given by powers of one element? With the field-basis definition in the cited source, every number field does.
