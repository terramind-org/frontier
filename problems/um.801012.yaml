title: Open Problems in Mathematical Logic — Problem 24
field: mathematics
tier: prose
statement: |-
  Let $L_x=\{z : z \leq_K^+ x\}$ and $U_x=\{z : z \geq_K x\}$. Are the following true?

  (1) $L_x$ is countable iff $\liminf_{n\to\infty}(K(x\upharpoonright n)-K(n))<\infty$;

  (2) $U_x$ is countable iff $\liminf_{n\to\infty}(K(n)+n-K(x\upharpoonright n))<\infty$.
