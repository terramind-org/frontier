title: Linked Skeletons of Convex Four-Polytopes
field: mathematics
tier: prose
statement: Does a convex four-polytope $P$ exist whose one-skeleton is linked in $\partial P\cong S^3$ but admits another embedding that is not linked? Here an embedding is linked if it contains two disjoint linked cycles.
