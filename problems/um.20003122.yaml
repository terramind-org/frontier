title: Normalized least-Lipschitz geometry beyond the hyperbolic locus
field: mathematics
tier: prose
statement: |-
  **Problem 5.4 (D. Dumas).** How does the “Lipschitz constant function”
  \[
  (g,h)\longmapsto\inf_{\phi:g\to h}\operatorname{Lip}(\phi)
  \]
  behave on a class of metrics larger than the set of hyperbolic metrics, for example, the set of negatively curved Riemannian metrics or its closure?
