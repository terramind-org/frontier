title: "Littlewood constants $\alpha$ and $\beta$"
field: mathematics
tier: prose
statement: For $\phi(n)=\sup_{\deg p=n}\int_{|z|<1}|p'|/(1+|p|^2)\,dm$, let $\alpha=\limsup\log\phi(n)/\log n$. For a regular compact set $E$, define $\beta_E$ from the growth of lengths of Green-function level curves, and let $\beta=\sup_E\beta_E$ over connected $E$. Is there a connection between $\alpha$ and $\beta$, and in particular is $\alpha=\beta$?
