lean:
  module: FormalConjectures.OEIS.«219023»
  decl: OeisA219023.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 3512 < n) :
        ∃ p : ℕ, p.Prime ∧ n < p ∧ p < 2 * n ∧
          Nat.Prime (n ^ 2 - n + p) ∧ Nat.Prime (n ^ 2 + n - p)
