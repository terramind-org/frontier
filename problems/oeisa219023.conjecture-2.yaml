id: oeisa219023.conjecture-2
title: Primes $p < n$ with $n^2 - n + p$ and $n^2 + n - p$ prime (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture: For $n > 3512$, there is a prime $p \in (n, 2n)$
  such that both $n^2 - n + p$ and $n^2 + n - p$ are prime.
  - _Zhi-Wei Sun_
