title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 12: Combinatorial interpretation of the row sums of the character table of S_n"
field: mathematics
tier: prose
statement: Let $S_n$ act on itself by conjugation, with character $\psi_{S_n}$. The multiplicity of an irreducible character $\chi^\lambda$ of $S_n$ in $\psi_{S_n}$ is equal to the row sum $\sum_K \chi^\lambda(K)$ over all conjugacy classes $K$ of $S_n$, which is therefore a nonnegative integer. Give a combinatorial interpretation of the row sums $\sum_K \chi^\lambda(K)$ of the character table of $S_n$, thereby combinatorially reproving that they are nonnegative.
