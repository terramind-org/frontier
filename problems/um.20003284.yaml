title: A two-gate effective reduction and a Diophantine torus model
field: mathematics
tier: prose
statement: |-
  **§4.2.** Let \(V\) be a connected Ad-unipotent subgroup of the Lie group \(G\) such that \(Vx\) is dense in \(G/\Gamma\) for some \(x\in G/\Gamma\).

  **Question 16 (G. Margulis [130]).** Show that for a “good” sequence of subsets \(A_n\subset V\) and every \(f\in C_c(G/\Gamma)\),
  \[
  \lim_{n\to\infty}\frac{1}{\operatorname{Vol}(A_n)}
  \int_{A_n}f(vx)\,dv=\int_{G/\Gamma}f\,d\mu
  \]
  with effective error term, where \(dv\) is a Haar measure on \(V\), and \(\mu\) is the probability Haar measure on \(G/\Gamma\).
