title: Axiomatic stable homotopy 2 — Characterize the stable homotopy category up to equivalence.
field: mathematics
tier: prose
statement: Characterize the stable homotopy category up to equivalence. This has been done for categories that are homotopy categories of model categories by Schwede, I think, and a lot is known in general. Margolis characterized the quotient category when phantoms are killed, and Christensen-Strickland characterized the phantom subcategory. So the category is determined up to a square 0 extension, but maybe there are tons of different such square 0 extensions.
