  % UnsolvedMath ID 9400143; source catalogue code AMR-093-0143
  \setcounter{section}{9400142}
  \section{Are there any Wieferich primes in base 47}\label{9400143}
  {\small\sffamily UnsolvedMath ID 9400143 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For an integer base $a\ge1$, a prime $p$ is Wieferich to base $a$ if $p\nmid a$ and $a^{p-1}\equiv1\pmod{p^2}$. Equivalently $p$ divides the integer Fermat quotient $(a^{p-1}-1)/p$.
  \paragraph{Statement recorded in the supplied source.}
  Does there exist a prime $p\ne47$ such that $47^{p-1}\equiv1\pmod{p^2}$? \sref{9400143}{2}
  \subsection{Short English statement}
  Does any prime satisfy the square-modulus Fermat congruence for base forty-seven?
