title: Trimer Covers in the Triangular Grid — Problem 12
field: mathematics
tier: prose
statement: |-
  Is it true that $T_{112}(n+2,2n+1)$
  is the ``$n$th large Schr\"oder number''
  (see OEIS entry A006318 (https://oeis.org/A006318))
  for all $n \geq 1$?
  Equality has been verified for $1 \leq n \leq 15$.
