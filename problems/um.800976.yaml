title: Open Problems and Questions about Geodesics — Question 57 (Paternain)
field: mathematics
tier: prose
statement: |-
  Ma\ n\'e showed that
  a Hamiltonian flow on surfaces is generically Anosov or has zero Liouville exponents [Mane1996]. This suggests that an easier version of the above question would be the following

  *Is there a Riemannian metric on a closed surface of genus $\ge 2$ whose geodesic flow has zero Liouville entropy?*
