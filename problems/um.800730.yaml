statement: |-
  The answer is positive provided $X$ has a base of the topology,
  consisting of pairwise homeomorphic clopen subsets, see
  [Pr1].

  Is the semigroup $S(X)$ right bounded
  for any zero-dimensional homogeneous space $X$?
