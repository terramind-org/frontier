statement: Does the above definition of a convex cocompact subgroup of Mg,m coincide with the definition of Farb and Mosher in [FMo]? Is the natural extension of such a group Γ by the fundamental group π1(S) of S word hyperbolic? Is there a convex cocompact subgroup of Mg,m which is isomorphic to the fundamental group of a closed surface of genus at least 2? A particular interesting class of subgroups of Mg,m arise from Veech surfaces. These surfaces are the projections to moduli space of the stabilizer of a complex geodesic in Teichm¨ uller space (which is a maximal embedded complex disc in the Teichm¨ uller space viewed as a bounded domain in C3g−3+m) with the additional property that this stabilizer is a lattice in PSL (2, R). Veech surfaces are surfaces of finite type with isolated singularities embedded in moduli space; they are never closed [V]. Thus their corresponding subgroup of Mg,m contains a free group of finite index with a distinguished family of conjugacy classes corresponding to the cusps of the curve. Veech surfaces have many beautiful algebraic and geometric properties (see e.g. [McM1], [McM2]). Elementary constructions of such surfaces and their coresponding subgroups of Mg,m are for example discussed in [L]. Veech surfaces can also be used to construct explicit subgroups of mapping class groups with prescribed geometric properties. A particularly beautiful result along this line was recently obtained by Leininger and Reid [LR].
