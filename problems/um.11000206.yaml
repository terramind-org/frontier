title: "Problem 7: — Is the mapping class group linear?"
field: mathematics
tier: prose
statement: Is the mapping class group linear? A locally compact group Γ is said to satisfy the Haagerup approximation property or is a-T- menable if there exists a continuous, isometric action α of Γ on some aﬃne Hilbert space H which is metrically proper. This means that for all bounded subsets B ofH, the set {g∈ Γ|α(g)B∩B̸=∅} is relatively compact in Γ. There are other equivalent characterizations of this property (see [CCJJV]) which can be viewed as a strong negation of the (perhaps more widely know) property (T) of Kazhdan. The class of a-T-menable groups contains for example all amenable groups, Coxeter groups and the isometry groups of real and complex hyperbolic spaces. It is also known that for a-T-menable groups the Baum-Connes conjecture holds (see [CCJJV]).
