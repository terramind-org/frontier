statement: Let $\pi:X\to\Delta$ be a complex-analytic family of compact complex manifolds such that $X_t$ is Kähler for every $t\in\Delta^*=\Delta\setminus\{0\}$. Must the central fiber $X_0$ belong to Fujiki class $\mathcal{C}$?
