id: um.800197
title: Holomorphic Symplectic Geometry — Conjecture 6
field: mathematics
tier: prose
statement: |-
  \mathrm{a)} Let $L$ be a nontrivial nef line bundle on $X$ with $q(L)=0$. There exists a Lagrangian fibration $f:X\rightarrow \mathbb{P}^r$ such that $L=f^*\mathcal{O}_{\mathbb{P}^r}(k)$ for some $k\geq 1$.
  \mathrm{b)} There exists a hyperk\"ahler manifold $X'$ bimeromorphic to $X$ and a Lagrangian fibration $X'\rightarrow \mathbb{P}^r$ if and only if $X$ admits a line bundle $L\neq \mathcal{O}_S$ with $q(L)=0$.
