statement: |-
  **Question 32 (Poonen).** Is it true that for all number fields $K$, there exists a variety $X$ (scheme of finite type) over $\mathbb Z$ such that

  1. $X(\mathbb Z)$ is infinite.
  2. $X(\mathcal O_K)=X(\mathbb Z)$.
