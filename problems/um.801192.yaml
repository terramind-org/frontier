title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 18: Stembridge's Schur-positivity conjecture for monomial immanants of Jacobi-Trudi matrices"
field: mathematics
tier: prose
statement: Let $\mu$ and $\nu$ be partitions with $\nu \subseteq \mu$ and $\ell(\mu) \le n$, and let $H_{\mu/\nu} = [h_{\mu_i - \nu_j + j - i}]_{i,j=1}^n$ be the Jacobi-Trudi matrix. For any partition $\lambda \vdash n$, is the monomial immanant $\operatorname{Imm}_{\phi^\lambda}(H_{\mu/\nu})$ Schur-positive ($s$-positive)?
