lean:
  module: FormalConjectures.OEIS.«228623»
  decl: OeisA228623.conjecture
  statement: "theorem conjecture (n : ℕ) (hn : n > 120) (hodd : Odd n) : a n ≠ 0"
  context:
    - open OeisA228623
    - open Matrix
  definitions:
    - name: OeisA228623.a
      kind: def
      text: |-
        /-- Determinant of the $n \times n$ matrix with $(i,j)$-entry ($i, j = 0, \dots, n - 1$) equal to
        $1$ or $0$ according as $n + i - j$ and $n - i + j$ are both prime or not. -/
        def a (n : ℕ) : ℤ :=
          let M : Matrix (Fin n) (Fin n) ℤ := fun i j =>
            let p₁ := n + i.val - j.val
            let p₂ := n + j.val - i.val
            if p₁.Prime ∧ p₂.Prime then 1 else 0
          M.det
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/OEIS/228623.lean#L36
