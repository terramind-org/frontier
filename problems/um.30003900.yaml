title: Implications Among Conjectures on Principally Polarized Abelian Varieties
field: mathematics
tier: prose
statement: |-
  Let $(A,\Theta)$ be an indecomposable principally polarized abelian variety, and let $X\subset A$ be a geometrically nondegenerate subvariety for which $\mathcal I_X(\Theta)$ is a generic-vanishing sheaf. Quantify a strengthening of this hypothesis sufficient to prove the bound

  $$\operatorname{mult}_x\Theta\leq\frac{\dim A+1}{2}$$

  for every $x\in\Theta$. Conversely, determine how that multiplicity bound can be used toward classifying $X$ as a minimal-class subvariety, namely a translate of $W_d(C)$ in a Jacobian or of the Fano surface in a five-dimensional intermediate Jacobian.
