title: Topology and Limits in the Asymptotic Spectrum of Graphs
field: mathematics
tier: prose
statement: |-
  For finite graphs, let $\Delta$ be the compact space of graph parameters $f$ satisfying

  $$f(G\sqcup H)=f(G)+f(H),\qquad f(G\boxtimes H)=f(G)f(H),$$

  monotonicity under cohomomorphisms, and $f(K_1)=1$. Is $\Delta$ connected? Does some $f\in\Delta$ satisfy $f(C_7)=\Theta(C_7)$? As primes $p\to\infty$, do the Haemers bounds satisfy

  $$h_{\mathbb F_p}^*\longrightarrow h_{\mathbb Q}^*,\qquad h_{\mathbb F_p}\longrightarrow h_{\mathbb Q}?$$

  Finally, if $C_{k,n}$ is the circular graph on the vertices of the $n$-cycle in which two vertices are adjacent exactly when their cyclic distance is less than $k$, are the functions $n/k\mapsto\Theta(C_{k,n})$ and $n/k\mapsto\vartheta(C_{k,n})$ continuous?
