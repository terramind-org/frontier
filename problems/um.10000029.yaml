id: um.10000029
title: Circle-packing measure of uniform random triangulations
field: mathematics
tier: prose
statement: Let $T_n$ be a uniform triangulation of the sphere with $n$ faces, normalize its circle packing by its conformal barycenter, and let $\mu_{P T_n}$ be the empirical measure of tangency points. Determine the support dimension and singularity of subsequential limits $\mu_\infty$; prove uniqueness in law; identify any relation to the Gaussian free field and KPZ; and determine how $\mu_\infty$ relates to the limiting random metric $d_\infty$.
