title: The Boundary Singer Conjecture
field: mathematics
tier: prose
statement: Let $B\Gamma$ be a finite $d$-dimensional complex and let $\Gamma$ be a residually finite CAT(0) or hyperbolic group. If the action of $\Gamma$ on $H^{\mathrm{st}}_{d-1}(\partial\Gamma;\mathbb F_2)$ has positive entropy, must the boundary $\partial\Gamma$ fail to embed in $S^{2d-2}$?
