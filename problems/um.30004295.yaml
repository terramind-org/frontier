title: Optimal Pólya–Vinogradov Constants Across Dirichlet Characters
field: mathematics
tier: prose
statement: For a prime $p$ and nonprincipal Dirichlet characters $\chi\pmod p$, determine the best constant $C$ such that $\min_{\chi}\max_{0\leq x\leq p}\left|\sum_{0<n\leq x}\chi(n)\right|<C\sqrt p$.
