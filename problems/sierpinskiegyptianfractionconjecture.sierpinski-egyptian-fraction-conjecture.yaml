lean:
  module: FormalConjectures.Wikipedia.SierpinskiEgyptianFractionConjecture
  decl: SierpinskiEgyptianFractionConjecture.sierpinski_egyptian_fraction_conjecture
  statement: |-
    theorem sierpinski_egyptian_fraction_conjecture {n : ℕ} (hn : 2 ≤ n) :
        HasSierpinskiDecomposition n
  context:
    - open SierpinskiEgyptianFractionConjecture
  definitions:
    - name: SierpinskiEgyptianFractionConjecture.HasSierpinskiDecomposition
      kind: def
      text: |-
        /-- `HasSierpinskiDecomposition n` holds when $5 / n = 1 / x + 1 / y + 1 / z$ for positive integers
        $x, y, z \ge 1$. -/
        def HasSierpinskiDecomposition (n : ℕ) : Prop :=
          ∃ x y z : ℕ, 1 ≤ x ∧ 1 ≤ y ∧ 1 ≤ z ∧
            (5 : ℚ) / (n : ℚ) = 1 / (x : ℚ) + 1 / (y : ℚ) + 1 / (z : ℚ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/SierpinskiEgyptianFractionConjecture.lean#L42
