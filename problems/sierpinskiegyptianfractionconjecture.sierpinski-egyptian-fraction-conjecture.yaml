id: sierpinskiegyptianfractionconjecture.sierpinski-egyptian-fraction-conjecture
title: Sierpiński's $5/n$ Egyptian Fraction Conjecture
field: mathematics
tier: proof
statement: |-
  **Sierpiński's $5 / n$ Conjecture** [Si56]: Each integer $n \ge 2$ admits positive integers
  $x, y, z \ge 1$ satisfying $5 / n = 1 / x + 1 / y + 1 / z$.
