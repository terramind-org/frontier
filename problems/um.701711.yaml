title: Kourovka Notebook Problem 20.53
field: mathematics
tier: prose
statement: |-
  A nonisotropic unitary graph $\Gamma$ is distance-regular with intersection array $\{q(q-1), (q+1)(q-2), q+1; 1, 1, q(q-2)\}$ for some prime power $q$. The group $G=Aut (\Gamma)$ acts transitively on the vertex set and on the edge set of $\Gamma$.
  It is known that $\Gamma$ is distance-transitive if $q=3$. Does there exist a distance-regular graph with such an intersection array if $q$ is not a prime power?
