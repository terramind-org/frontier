title: A cubic homological obstruction for the doubled standard q-tca
field: mathematics
tier: prose
statement: Berenstein--Zwicknagl define quantum analog of \(\operatorname{Sym}(\mathbf S_\lambda)\). For small \(\lambda\), this behaves like the classical case, but for large \(\lambda\) (and \(q\) generic) its isotypic decomposition has smaller multiplicities than the classical case. Are modules over this algebra (as \(q\)-tca's) equivalent to modules in the classical case (as tca's)?
