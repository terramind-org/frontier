title: Linear Systems and Eigenvalue Problems — Problem 8
field: mathematics
tier: prose
statement: Let $A$ be an $n\times n$ random matrix with i.i.d. Gaussian (or Rademacher, or Bernoulli) entries, and take any $n$-dimensional vector $b$. Is it possible (conditioned on a high-probability event) to solve the linear system $Ax=b$ to high accuracy faster than $O(n^\omega)$?
