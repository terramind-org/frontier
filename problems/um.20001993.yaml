title: A phase-enriched tropical certificate for Kwon's chamberwise real counts
field: mathematics
tier: prose
statement: "**A.11 Real Gromov--Witten invariants and tropical geometry.** Background: G. Tian and S. Kwon recently defined a real Gromov--Witten invariant on each chamber in the real Chow cycles' parameter space when the target space is CP 2. That is a real enumerative invariant, counting the number of intersection points of pull back of real Chow cycles in the real part of the Kontsevich's moduli space of stable maps from genus 0 curves. To use Mikhalkin's work on counting plane rational nodal curves, we showed that the classical nodal Severi variety is embedded as a Zariski open dense subset in the Kontsevich's moduli space. Question: It will be interesting to develop techniques to calculate real Gromov--Witten invariants by using tropical geometry. (contributed by Seongchun Kwon)"
