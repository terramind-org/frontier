title: Dimensional and spectral resolution map for planar Euler--Korteweg phase boundaries
field: mathematics
tier: prose
statement: The system admits a planar profile \((\bar\rho,\bar u)(x_1-ct)\), and the spectrum of the linearization about it lies on the imaginary axis. Are there eigenvalues on the imaginary axis? Is the planar profile spectrally stable or unstable? Does the linear information imply full nonlinear stability?
