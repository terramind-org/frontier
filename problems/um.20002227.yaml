title: Directed coding and a forcing bottleneck for the AIM invariant
field: mathematics
tier: prose
statement: |-
  Let $\kappa$ be an infinite cardinal and put $\lambda=\kappa^+$. Define
  \[
  u_2(\kappa)=\sup\left\{(\lambda^+)^{L[A]}:A\subseteq\kappa\right\}.
  \]
  1. Is $u_2(\omega_1)=\omega_3$ consistent with (sufficiently) large cardinals?
  2. How can one increase $u_2(\omega_1)$ without collapsing $\omega_1$ or $\omega_2$?
