title: A promise-to-total bridge for effective bounds on finite integral point sets
field: mathematics
tier: prose
statement: "**Question 18 (Rojas).** Is there a computable bound (in function of \\(f\\)) on the size of the largest integer solution to \\(f(x,y)=0\\), when there are finitely many solutions? This is already done for genus 1 curves. There exists an algorithm to decide finiteness of the set of solutions. For rational points, there are papers by Minhyong Kim from Arizona: “Relating decision and search algorithms for rational points on curves of higher genus”, *Arch. Math. Logic* 42 (2003), no. 6, 563–568; “On relative computability for curves”, arXiv:math.NT/0502224."
