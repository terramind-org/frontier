title: Exact lower witnesses in the complete-edge Weaver family
field: mathematics
tier: prose
statement: |-
  For the random MSS, there's a witness for the best bound, is there a conjecture for
  Weaver's conjecture? Weaver has a construction that \(\sqrt\eps\) is necessary but
  MSS has no constructive lower bound. Pete C. *does* have a constructive lower bound.

  Determine or conjecture the sharp quantitative two-color Weaver discrepancy, and
  seek explicit exact-Parseval families proving that a \(\sqrt\alpha\) term is
  necessary, while distinguishing this task from mixed-polynomial root optimality and
  from projection-paving/Riesz lower examples.
