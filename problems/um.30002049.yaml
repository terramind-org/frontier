title: Zilber Conjecture for Torsion-Anomalous Intersections
field: mathematics
tier: prose
statement: For every algebraic subset $W\subseteq\mathbb G_m^N$, is there a finite collection $\mathcal U_W$ of codimension-one torsion cosets such that, for every torsion coset $T_0$ and every irreducible component $Y$ of $W\cap T_0$ with $\dim Y>\dim W-\operatorname{codim}T_0$, some $T\in\mathcal U_W$ satisfies $Y\subseteq W\cap T$?
