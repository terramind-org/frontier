title: Ramification obstructions and the compact-potential inconsistency
field: mathematics
tier: prose
statement: |-
  Let \(X,Y\) be compact Riemann surfaces and let \(a_j\in X\) be points with positive finite multiplicities \(m_j\). Does there exist a holomorphic map \(f:X\to Y\) such that, in local coordinates at \(a_j\) and \(f(a_j)\),
  \[
  f(z)=z^{m_j+1},
  \]
  and \(f\) has no other critical points?
