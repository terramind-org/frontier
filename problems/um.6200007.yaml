title: Boundaries of Groups and Kleinian Groups — Problem 7
field: mathematics
tier: prose
statement: Suppose that Z is a compact metrizable topological space, G↷ Z is a convergence action which is topologically transitive, i.e. each G– orbit is dense in Z. Is there a Gromov-hyperbolic space X with the ideal boundary Z so that the action G ↷ Z extends to a uniformly quasi-isometric quasi-action G↷ X?
