title: Common twists, sparse families, and the marked-torsor bottleneck
field: mathematics
tier: prose
statement: |-
  Does Bhargava's machinery have implications for the Hasse principle for special surfaces? For example, let $F,G\in\mathbb Q[x,y]$ be homogeneous polynomials of degree $3$. Consider the cubic surface
  \[
  S=\{F(x,y)=G(z,w)\}\subset\mathbb P^3_{\mathbb Q}.
  \]
  The defining equation is equivalent to the system of equations
  \[
  u^3=tF(x,y),\qquad v^3=tG(z,w).
  \]
  This defines a family of cubic twists of curves of genus $1$ over the $t$-line. Swinnerton-Dyer has discussed how to search for $t$ such that this system is solvable over $\mathbb Q$ in the diagonal case [Ann. Sci. ENS]. Can we extend his work beyond the diagonal case? Similarly, consider Kummer K3 surfaces defined by
  \[
  z^2=f(x)g(y),
  \]
  where $f,g$ are quartic separable polynomials. This is equivalent to the family of quadratic twists of curves of genus $1$ defined by
  \[
  u^2=tf(x),\qquad v^2=tg(y).
  \]
  The goal is to eliminate the condition in Swinnerton-Dyer's work that (the $2$-primary part of) $\Sha$ has finite order for quadratic twists, using the recent work presented in Bhargava's talk.
