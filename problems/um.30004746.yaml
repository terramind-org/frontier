title: $\gamma$-Topology Limits of Hamiltonians with Singular Sets
field: mathematics
tier: prose
statement: Let $H$ be a continuous Hamiltonian on $M\setminus V$, approximated uniformly on compact subsets by smooth Hamiltonians $H_k$ with time-one maps $\phi_k$. Does $\phi_k$ converge in the $\gamma$-topology to an element of the Humilière completion of $\operatorname{Ham}(M,\omega)$?
