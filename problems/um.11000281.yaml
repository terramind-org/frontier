title: Question 3.1 — If n≥ 4 and g≥ 1, does every homomorphism from Aut(Fn) to Mod±(Sg) have finite image?
field: mathematics
tier: prose
statement: If n≥ 4 and g≥ 1, does every homomorphism from Aut(Fn) to Mod±(Sg) have finite image? By [ 21], one cannot obtain homomorphisms with infinite image unless Mod ±(Sg) contains the symmetric group Σ n+1. For large enough genus, you can realize any symmetric group; but the order of a finite group of symmetries is at most 84g-6, so here one needs 84 g− 6≥ (n + 1)!. 326 M. Bridson and K. Vogtmann There are no injective maps from Aut( Fn) to mapping class groups. This follows from the result of Brendle and Hamidi-Tehrani that we quoted earlier. For certain g one can construct homomorphisms Aut(F3)→Mod±(Sg) with infinite image, but we do not know the minimal such g.
