statement: "Find a topological construction of the polynomial P ′ K given above. = = = = a + b Figure 13: The multi-linear relations. Here, f (t), g(t)∈ S, and a, b are scalars. = Figure 14: The push relation The loop expansion in a general loop-degree is described as f ollows. Let R be a field, say Q, and let S be a subring of R(t) which is invariant under the involution t↦→t−1, where t is an indeterminate. A labeled Jacobi diagram on ∅ is a vertex-oriented trivalent graph, whose edges are label ed by pairs of local orientations and elements of S. We define AS(∅; R) to be the vector space over R spanned by labeled Jacobi diagrams on ∅ subject to the AS, IHX, multilinear, and push relations (see Figures 13 and 14). The loop-degree of a labeled Jacobi diagram is half the number of trivalent vertices of the Jacob i diagram. For a polynomial A(t) with A(1) = 1 and A(t) = A(t−1), we have a map AQ[t±1,1/A(t)](∅; Q)−→B, (29) defined by ↦−→c0 + c1 + c2 +···+ cn +···, where f (t)∈ Q[t±1, 1/A(t)] is written f (eh) = ∑ ∞ k=0 ckhk. In particular, the map AQ[t±1](∅; Q)−→B (30) is defined by ↦−→+ + 1 2 +···+ 1 n! +···. The loop expansion of the Kontsevich invariant is described by the rational Z invariant Z rat(K)∈A Q[t±1,1/∆ K (t)](∅; Q) which is taken to log ⊔ Z(K) by the map (29). In particular, when ∆ K(t) = 1, Z rat(K)∈ AQ[t±1](∅; Q). (The existence of Z rat(K) has been shown in [231], and the canonicality of Z rat(K) has been shown in [139].)"
