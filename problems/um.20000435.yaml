title: Solved intended local pencil problem and dyadic rank-seven annuli
field: mathematics
tier: prose
statement: |-
  Let \(f_1(x_0,\ldots,x_n)=f_2(x_0,\ldots,x_n)=0\) define a smooth complete intersection \(X_{2,2}\subset \mathbf P^n\) over a number field \(k\), for simplicity \(k=\mathbf Q\). If \(n\geq 8\), then \(X(\mathbf R)\ne\varnothing\) implies \(X(\mathbf Q)\ne\varnothing\). For \(n\geq 9\) (at least ten variables), this can be proved by the circle method. For \(n=7\), let \(k\) be a \(p\)-adic field and let \(f_1,f_2\) be quadratic forms in eight variables whose common projective zero locus is smooth, so that
  \[
  P(\lambda,\mu)=\det(\lambda f_1+\mu f_2)
  \]
  is separable. Does there exist \([\lambda:\mu]\in\mathbf P^1(k)\) for which \(\lambda f_1+\mu f_2\) contains three hyperbolic planes? A solution would give a local--global principle for \(n=7\).
