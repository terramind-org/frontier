statement: (T. Le, V. Turaev) For every element ξ∈ H 1(M, Z) construct an extension of Z L M O(M, ξ) of the LMO invariant such that when ξ = 0 one recovers the usual LMO invariant. The idea is that the usual LMO invariant corresponds only to t he trivial coho- mology class, and for manifolds with high Betti number, it is equal to 0. K. Habiro has an extension of the LMO invariant that might be a so lution to this problem.
