lean:
  module: FormalConjectures.Wikipedia.FactorialPrime
  decl: FactorialPrime.infinitely_many_factorial_primes
  statement: |-
    theorem infinitely_many_factorial_primes :
        Set.Infinite {p : ℕ | IsFactorialPrime p}
  context:
    - open FactorialPrime
  definitions:
    - name: FactorialPrime.IsFactorialPrime
      kind: def
      text: |-
        /-- A factorial prime is a prime one above or one below a factorial. -/
        def IsFactorialPrime (p : ℕ) : Prop :=
          p.Prime ∧ ∃ n : ℕ, p = n.factorial + 1 ∨ n.factorial = p + 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/FactorialPrime.lean#L35
