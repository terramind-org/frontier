statement: Suppose a $\mathbb Z^2$ action $\alpha$ has $\alpha^{\boldsymbol n}$ an SFT for some $\boldsymbol n$. Can $\alpha$ have infinitely many expansive components? Can an expansive component have a boundary on a line of irrational slope?
