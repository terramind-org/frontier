title: Compactness of Kőnig-property
field: mathematics
tier: prose
statement: A hypergraph $H=(V,E)$ has the Kőnig-property if there is a set $\mathcal{D}\subseteq E$ of pairwise disjoint hyperedges such that there is a vertex cover consisting of one vertex from each hyperedge in $\mathcal{D}$. (Using this terminology, Kőnig's theorem says that every finite bipartite graph has the Kőnig-property). R. Aharoni and N. Bowler conjectured independently the following. If $H=(V,E)$ is a hypergraph such that all of its hyperedges are finite and for all finite $E'\subseteq E$ the hypergraph $(V,E')$ has the Kőnig-property, then $H$ has the Kőnig-property as well ( p. 19. Problem 6.7).
