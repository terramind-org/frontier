statement: "Recall that we noted, earlier, that every genus g Heegaard splitting of every homology 3-sphere is obtained by allowing ϕ to range over Ig. We also noted that Morita proved in [36] that every genus g Heegaard splitting of every homology 3-sphere is obtained by allowing ϕ to range over Kg. For these reasons it might be very useful to find generators for Hg∩Ig and/or Hg∩Kg. Our next problem is in a diﬀerent direction. It concerns the classification of Heegaard splittings of graph manifolds:"
