title: Uniruledness and Generic Nefness of Tangent Bundles
field: mathematics
tier: prose
statement: For a projective manifold $X$, if a maximal covering family of curves $C_t$ has $\Omega_X^1|_{C_t}$ non-nef for general $t$, must $X$ be uniruled? Also, if $-K_X$ is nef, is $T_X$ generically nef with respect to some or all polarizations, where generic nefness is tested on Mehta–Ramanathan-general complete-intersection curves?
