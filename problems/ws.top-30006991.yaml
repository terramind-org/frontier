statement: |-
  \section*{Projectivity from simultaneous self-Ext and algebra-Ext vanishing}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every finite-dimensional algebra A over a field and every finite-dimensional left A-module M, does $Ext_A^i(M,M\oplus A)=0$ for all integers $i>0$ imply that M is projective?
  \subsection{Short English statement}
  For every finite-dimensional algebra A over a field and every finite-dimensional left A-module M, does $Ext_A^i(M,M\oplus A)=0$ for all integers $i>0$ imply that M is projective?
