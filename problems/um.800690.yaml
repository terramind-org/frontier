field: mathematics
tier: prose
statement: Is it always possible to approximate the foliation $\mathscr{F}$ by foliations in $\mathbb{C}^k$ or\break $\mathbb{P}^k$ ? More precisely, is it always possible to approximate the forms $\alpha_j$, uniformly on compact sets of $\mathbb{D}^k$, by entire forms (resp. polynomial forms) $\alpha_{j,n}$ which still satisfy the above Frobenius condition ?
