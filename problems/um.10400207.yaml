statement: (R. Benedetti) Are torsions actually sensitive only to the (pL)-homotopy immersion classes of (pL)-knots? If one fix a C - homotopy immersion class of knots, say α, then one can define the set of finite type invariants F(α) of the C -isotopy classes contained in α. If α0 is a class of Legendrian knots, one can take α1 = f1(α0) and α2 = f2(α1); a finite type invariant for αi lifts to a finite type invariant for αi−1. So one has natural maps F(α2) f ∗ 2 →F (α1) f ∗ 1 →F (α0). It is known [130] that, under certain hypotheses on W (for instance when W is a Z-homology sphere), f ∗ 1◦ f ∗ 2 is a bijection. On the oder hand, one can Section 12.1 was written by R. Benedetti. find in [380] examples where f ∗ 1◦ f ∗ 2 is not surjective and Legendrian finite type invariants can eventually distinguish some Legendrian kno ts which are isotopic as framed knots. In fact one can realize that for these exampl es f ∗ 2 is already not surjective and that (pL)-finite type invariants can even tually distinguish some (pL)-knots which are isotopic as framed knots. The foll owing conjecture is not in contradiction with all these known results on the su bject.
