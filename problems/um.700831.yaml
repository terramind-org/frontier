title: Kourovka Notebook Problem 12.11
field: mathematics
tier: prose
statement: |-
  Suppose that $G, H$ are countable or finite
  groups and $A$ is a proper subgroup of $G$ and $H$ containing no
  non-trivial subgroup normal in both $G$ and $H$. Can $G*_A H$ be
  embedded in $\mathrm{Sym} ({\mathbb{N})$ so that the image is highly
  transitive?

  *Comment of 2013:*
  for partial results, see (S. V. Gunhouse, *Highly
  transitive representations of free products on the natural numbers*, Ph. D. Thesis
  Bowling Green State Univ., 1993; \ K. K. Hickin, *J. London Math. Soc.
  (2)*, **46**, no. 1 (1992), 81--91).
