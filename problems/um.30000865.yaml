title: Direct Modularity from the Hypergeometric Partition Expansion
field: mathematics
tier: prose
statement: Let $$P(q)=\sum_{n\geq0}p(n)q^n=1+\sum_{n=1}^\infty\frac{q^{n^2}}{(1-q)^2(1-q^2)^2\cdots(1-q^n)^2}=\frac{q^{1/24}}{\eta(z)}.$$ Prove directly from the hypergeometric expansion that $P(q)$ is modular.
