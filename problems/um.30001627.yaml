title: Tempered Embeddings of Unimodular Quasi-Affine Spaces
field: mathematics
tier: prose
statement: Let $G$ be an algebraic group, let $H\subseteq G$ be algebraic, and suppose $Z=G/H$ is unimodular and quasi-affine. Does there exist a rational $G$-module $V$ and a $G$-equivariant embedding $Z\hookrightarrow V$ such that the pushforward of a $G$-invariant measure $\mu_Z$ is a tempered distribution on $V$?
