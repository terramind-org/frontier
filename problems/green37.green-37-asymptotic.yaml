lean:
  module: FormalConjectures.GreensOpenProblems.«37»
  decl: Green37.green_37_asymptotic
  statement: |-
    theorem green_37_asymptotic (k : ℕ) :
        ∀ᶠ N in atTop, (m N k : ℝ) = green_37_asymptotic.answer k N
  context:
    - open Green37
    - open Set Filter
    - open scoped Asymptotics
  definitions:
    - name: Green37.m
      kind: def
      text: |-
        /-- The minimum size of a subset of `ℕ` that contains, for each `d = 1, …, N`,
        an arithmetic progression of length `k` with common difference `d`. -/
        noncomputable def m (N k : ℕ) : ℕ :=
          sInf { m | ∃ A : Finset ℕ, A.card = m ∧ IsAPCover (A : Set ℕ) N k }
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/GreensOpenProblems/37.lean#L41
