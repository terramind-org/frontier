title: Kourovka Notebook Problem 18.69
field: mathematics
tier: prose
statement: |-
  Does there exist a relatively free group $G $
  containing a free subsemigroup and having $[G,G]$ finitely generated?

  Note that $G$ cannot be locally graded (*Publ. Math. Debrecen*, **81**, no. 3-4 (2012), 415--420.)
