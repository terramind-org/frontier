title: Optimal Character-Ratio Bounds for Almost Quasisimple Groups
field: mathematics
tier: prose
statement: For a finite almost quasisimple group $G$ and $g\notin Z(G)$, determine optimal explicit bounds for $|\chi(g)|/\chi(1)$ and for exponents $\alpha(g)$ satisfying $|\chi(g)|\leq\chi(1)^{\alpha(g)}$ for all irreducible characters $\chi$.
