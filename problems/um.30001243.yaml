title: a-Invariants of Quasi-Gorenstein Projective Cones
field: mathematics
tier: prose
statement: For a normal projective variety $X$, let $A(X)=\{a(R):R\text{ is quasi-Gorenstein graded and }\operatorname{Proj}R=X\}$. Classify the possible sets $A(X)$. In particular, if $-K_X$ is big, must $A(X)$ contain a negative integer? If $X$ is Fano of index $1$, is $A(X)$ the set of positive odd integers?
