id: oeisa234246.conjecture-6
title: Number of integers $0 < k < n$ such that $k \phi(n - k) + 1$ is a square (conjecture_6)
field: mathematics
tier: proof
statement: |-
  Conjecture (iv): If $n > 7$ is not equal to $10$ or $19$, then $(\phi(k) + \phi(n - k)) / 2$
  is a triangular number for some $0 < k < n$.
