id: um.20002001
title: Tropical determinantal bases and a 16-coordinate certificate quotient
field: mathematics
tier: prose
statement: |-
  Let \(I\subset \mathbb C[x_1,\ldots,x_n]\) be an ideal. Characterize or compute subsets \(J\subset I\) for which
  \[
  \mathcal T(I)=\bigcap_{f\in J}\mathcal T(f).
  \]
  It records that the \(3\times3\) minors of a generic \(n\times n\) matrix suffice to define the tropical variety of their ideal, and asks (Sturmfels) whether the \(4\times4\) minors of a generic \(5\times5\) matrix likewise suffice. It then asks for a characterization of a smaller sufficient set that is easier or better to compute.
