id: oeisa234246.conjecture-4
title: Number of integers $0 < k < n$ such that $k \phi(n - k) + 1$ is a square (conjecture_4)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): If $n > 60$, then $\sigma(k) + \phi(n - k)$ is a square for some $0 < k < n$,
  where $\sigma(k)$ is the sum of all positive divisors of $k$.
