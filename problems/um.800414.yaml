title: Open Problems in Arithmetic Dynamics — Conjecture 37
field: mathematics
tier: prose
statement: |-
  Let $K\subset\mathbb{C}_v$ be a discretely valued subfield whose algebraic
  closure $\bar{K}$ is dense in $\mathbb{C}_v$. Let $p\geq 0$ be the residue
  characteristic of $\mathbb{C}_v$, and let $f\in\mathbb{C}_v(z)$ be a rational
  function of degree at least $2$. Suppose that there are no
  points $\zeta\in\mathsf{P}_{\mathrm{Berk}}^1$ at which $f$ has local degree divisible
  by $p$. Then every wandering domain of $f$ lies in the attracting
  basin of a Type II Julia periodic point.
