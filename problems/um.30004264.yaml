title: Hall Multiplication on Principal Quiver Grassmannians
field: mathematics
tier: prose
statement: For principal quiver Grassmannians and the invariant-function space $A=\bigoplus_{[P],[I],e}\mathbb{Q}^{\operatorname{Aut}_{Q}(P\oplus I)}[\operatorname{Gr}_{e}(P\oplus I)]$, can one define a Hall-algebra-type multiplication making $A$ graded associative and inducing an isomorphism $U_q(\mathfrak b^+)\otimes U_q(\mathfrak b^+)\to A$?
