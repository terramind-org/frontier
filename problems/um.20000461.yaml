title: A local-defect lower bound for the 3-Selmer group over cyclic cubic fields
field: mathematics
tier: prose
statement: |-
  Let \(E/\mathbb Q\) be an elliptic curve, let \(P\in E(\mathbb Q)[3]\) with \(P\ne O\), and suppose that \({\rm rk}\,E(\mathbb Q)=0\). Let \(K/\mathbb Q\) be cyclic of degree \(3\), of conductor \(f\), and let \(\nu=\nu(f)\) be the number of distinct prime divisors of \(f\). Is
  \[
  3^{\nu-1}\mid \#\operatorname{Sel}_{3}(E/K)?
  \]
