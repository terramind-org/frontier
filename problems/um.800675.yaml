title: Holomorphic Foliation Theory — Problem 2
field: mathematics
tier: prose
statement: |-
  Assume that $\mathscr{F}$ is a foliation of degree $d\geq 2$ with non-hyperbolic singularities. Describe the
  ${dd^c}$-closed positive currents, directed by the foliation. In which case diffuse positive closed
  currents directed by the foliation do exist ?
