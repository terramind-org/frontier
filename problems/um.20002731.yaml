title: A normalization-safe sign and family obstruction for unitary central derivatives
field: mathematics
tier: prose
statement: |-
  **Non-vanishing of the central \(L\)-derivative for
  \(\mathrm{U}(n)\times\mathrm{U}(n-1)\).**

  Given an automorphic representation \(\pi\) of \(\mathrm{U}(n)\), show
  that there exists an automorphic representation \(\sigma\) of
  \(\mathrm{U}(n-1)\) such that
  \[
  L'(\pi\otimes\sigma,\tfrac12)\ne 0.
  \]
