id: um.20002862
title: Quantitative interior jet bounds and boundary determination regimes
field: mathematics
tier: prose
statement: |-
  Let \(n\geq 2\).

  - Given a proper rational map \(f:\mathbb B^n\to\mathbb B^N\), find the smallest number \(k(n,N)\) such that \(f\) is determined by its \(k\)-jet at the origin.
  - Let \(\Omega\subset\mathbb C^n\) and \(\Omega'\subset\mathbb C^N\) be strongly pseudoconvex domains. If \(f:\Omega\to\Omega'\) is a proper holomorphic map which extends smoothly to \(\partial\Omega\), does there exist a \(k\) such that \(f\) is determined by its \(k\)-jet at a point?
