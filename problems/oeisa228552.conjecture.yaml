  definitions:
    - name: OeisA228552.a
      kind: def
      text: |-
        /-- Square root of the absolute value of the determinant of the $n \times n$ matrix with
        $(i,j)$-entry ($1 \le i, j \le n$) equal to $1$ if $i + j$ is prime, and $0$ otherwise. -/
        def a (n : ℕ) : ℕ :=
          (OeisA69191.a n).natAbs.sqrt
