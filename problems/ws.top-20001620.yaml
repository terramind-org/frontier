  \section{Existence of infinite finitely presented torsion groups}\label{20001620}
  {\small UnsolvedMath ID 20001620 · Group Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Is there an infinite finitely presented torsion group, meaning a group in which every element has finite order? The stated Grigorchuk conjecture predicts that no such group exists.
  \par\smallskip\textit{Formulation references:} \sref{20001620}{1}, \sref{20001620}{2}.
  \subsection{Short English statement}
  Is there an infinite finitely presented torsion group, meaning a group in which every element has finite order? The stated Grigorchuk conjecture predicts that no such group exists.
