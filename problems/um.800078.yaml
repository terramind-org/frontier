title: Foliations and Diffeomorphism Groups — Question 19
field: mathematics
tier: prose
statement: |-
  By now, there are several constructions of simple orderable groups [hyde2019finitely,hyde2023finitely, hyde2023two,bon2020groups]. However, only the examples in [hyde2023finitely] of Hyde and Lodha are finitely presented. In fact, they are even of type $F_\infty$. Recall a group $G$ is of type $F_n$ if there is a $K(G,1)$ with finite $n$-skeleton, and it is of type $F_\infty$ if it is of type $F_n$ for any $n$.

  For any $n\geq 2$, is there a simple orderable group of type $F_n$ but not $F_{n+1}$?
