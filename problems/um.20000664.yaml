title: A binary strongly stationary compatibility model for the unipotent torus
field: mathematics
tier: prose
statement: |-
  Can a Liouville system be isomorphic to $(\mathbb T^2,m_{\mathbb T^2},T)$, where
  \[
  T(x,y)=(x+y,y)\pmod 1?
  \]

  The record is internally coherent. The transpose convention $T(s,t)=(s,t+s)$ occurs in Frantzikinakis--Host; exchanging the two coordinates conjugates it to the AIM convention.

  There is one terminological ambiguity worth preserving. A **Liouville system** is a Furstenberg system obtained from the Liouville sequence $\lambda\in\{-1,1\}^{\mathbb Z}$ by a subsequential weak-star limit of orbit averages. The averages may be Cesàro or logarithmic, and the two resulting systems need not agree. Frantzikinakis's original unqualified formulation is Cesàro, while much of the strongest unconditional structure theory is logarithmic. The AIM record does not specify the averaging convention. The construction below is a statement about the proposed target and is relevant to either convention; comparisons with proved Liouville correlations are explicitly labeled logarithmic.
