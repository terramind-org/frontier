id: um.30005512
title: Abelian Fields Generated by Height-Zero Characters
field: mathematics
tier: prose
statement: Let $p$ be prime and let $F$ be an abelian number field of conductor $n=p^am$ with $(m,p)=1$. Prove that $F=\mathbb Q(\chi)$ for some height-zero irreducible character $\chi$ in a $p$-block of a finite group if and only if $[\mathbb Q_n:\langle F,\mathbb Q_m\rangle]$ is coprime to $p$.
