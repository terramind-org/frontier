id: um.30002291
title: Variation Limits for Pure-Jump Semimartingales
field: mathematics
tier: prose
statement: |-
  Let

  $$X_t=X_0+\int_{-\infty}^t g(t-s)\,dL_s,$$

  where $L$ is a pure-jump Lévy process, $g(x)=x^\alpha f(x)$ with $0<\alpha<1/2$, and $f$ is smooth with exponential decay and $f(0)\neq0$. For

  $$V_t^n(X)=\sum_{i=1}^{\lfloor t/\Delta_n\rfloor}|X_{i\Delta_n}-X_{(i-1)\Delta_n}|^2,$$

  the compound-Poisson case satisfies

  $$\Delta_n^{-2\alpha}V_t^n(X)\xrightarrow{d_{\mathrm{st}}}f(0)^2\sum_{k:T_k\in[0,t]}|\Delta L_{T_k}|^2\sum_{l=1}^{\infty}\left|(l-U_k)_+^\alpha-(l-1-U_k)_+^\alpha\right|^2.$$

  Under suitable hypotheses, does the same stable limit hold when the driver is a sufficiently general pure-jump semimartingale?
