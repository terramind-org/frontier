title: Lower Bounds for Symplectic Resolvent Degrees
field: mathematics
tier: prose
statement: |-
  For $n\geq6$, choose an embedding $A_n\hookrightarrow\operatorname{Sp}_{2g}(\mathbb F_2)$ for which $A_n\cap U$ is a maximal elementary abelian $2$-subgroup of $A_n$, where $U$ is the unipotent radical of the Siegel parabolic, and put $e_{A_n}=\operatorname{rank}_{\mathbb F_2}(A_n\cap U)$. Let $\widetilde A_{g,2}\to A_g$ be the Galois closure of the universal $2$-torsion cover, and let $A_g^{A_n}=\widetilde A_{g,2}/A_n$. Is
  $$
  \operatorname{RD}(\widetilde A_{g,2}\to A_g^{A_n})\geq e_{A_n}
  $$
  ?
