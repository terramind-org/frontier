title: Rational weak relative Gorenstein duality at level 3 without perfectness
field: mathematics
tier: prose
statement: |-
  Can we find explicit ways to write \(S\in R\text{-Alg}\) as an \(R\)-module? What are objects that “untwist” when smashed together? (e.g. \(KU\simeq KO\wedge C(\eta)\), \(H\mathbb F_2\simeq ko\wedge\mathcal A(1)\)).

  A slightly easier question: Is \(tmf^{(n)}_0\to tmf^{(n)}_1\) relatively Gorenstein?
