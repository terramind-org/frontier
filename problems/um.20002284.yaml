title: A canonical diamond forcing, its exact omega_3 bottleneck, and small-forcing reflection
field: mathematics
tier: prose
statement: |-
  Suppose \(\aleph_\omega\) is a strong limit. Is there a poset \({\mathbb P}\) of size \(<\aleph_\omega\), which adds a club guessing sequence for \(S^{\omega_2}_{\omega_1}\), preserving \(\omega_1\), \(\omega_2\), and \(\omega_3\).

  Suppose \(\aleph_\omega\) is a strong limit. Is there a poset \(\mathbb P\) of size \(<\aleph_\omega\) which forces full club guessing on \(S^{\omega_2}_{\omega_1}\) while preserving \(\omega_1,\omega_2,\omega_3\) as regular cardinals?
