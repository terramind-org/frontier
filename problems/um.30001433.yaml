title: Weighted Min–Max Theorems for Disjoint Terminal Paths
field: mathematics
tier: prose
statement: |-
  Given an undirected graph $G=(V,E)$, terminals $S\subseteq V$, and a weight $w:\binom{S}{2}\to\mathbb N$, does the weighted maximum

  $$\sum_P w(s(P),t(P))$$

  over node-disjoint $S$-paths admit a Mader-type min–max characterization and a polynomial-time algorithm?
