  \section{A four-point Hamming barrier in Euclidean Ramsey theory}\label{20000956}
  {\small UnsolvedMath ID 20000956 · Combinatorics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  A finite subset $X$ of Euclidean space is Ramsey if, for every number of colors $r$, some dimension $N$ forces a monochromatic congruent copy of $X$ in every coloring of $\mathbb R^N$. Is every finite set lying on a sphere Ramsey?
  \par\smallskip\textit{Formulation references:} \sref{20000956}{1}, \sref{20000956}{2}.
