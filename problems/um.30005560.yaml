title: Vanishing Conjectures for Birational Cohomology of Projective Space
field: mathematics
tier: prose
statement: For every finite field $F$ of characteristic $p$ and every prime $\ell\neq p$, prove $H^{2i}(F_0\mathbb P_{\overline F}^n,\mathbb Q_\ell(i+1))^{G_F}=0$ and $H^{2i-1}(F_0\mathbb P_{\overline F}^n,\mathbb Q_\ell(i))^{G_F}=0$ for all $i,n\geq 2$.
