witness:
  verifier: kissing
  params:
    dim: 11
  objective: maximize
  best_known:
    value: 604
    reference:
      label: "Cohn, Kissing numbers table (dimension 11: 604, upper bound 868)"
      url: https://cohn.mit.edu/kissing-numbers
    note: "A 2026 preprint result, not peer reviewed. Read on 2026-10-21: arXiv:2606.10402 (Bianchi, Kwon, Pappu, Zou; submitted 9 Jun 2026, revised 26 Aug 2026) says \"As of May 2026, agents on EinsteinArena have discovered 12 new state-of-the-art results\" and \"the platform improved the best known lower bound from 593 to 604\"; Cohn's table lists 604 and 868 for dimension 11 and credits the lower bound to that preprint. No source for a month of the 604 record was found, so none is given. The table has moved recently; re-read it before claiming a record."
  format: 'A JSON object {"vectors": [[p0, q0, p1, q1, ..., p10, q10], ...]}: each vector has 22 integers and coordinate k is p_k + q_k*sqrt(2). Vectors are nonzero and distinct. Let R be the largest squared norm; every pair must satisfy |u - v|^2 >= R, checked exactly (the keys "n", "dim" and "description" of the EinsteinArena files are allowed). At most 2000 vectors; the value is the number of vectors.'
