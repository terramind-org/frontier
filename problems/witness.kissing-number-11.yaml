schema: 1
id: witness.kissing-number-11
title: Kissing configuration in dimension 11
field: mathematics
tier: witness
statement: Place as many non-overlapping unit balls as possible so that each touches one central unit ball in R^11. Equivalently, find many nonzero vectors in R^11 whose pairwise angles are all at least 60 degrees. The best known configuration has 604 balls (a 2026 preprint result, not peer reviewed) and the best known upper bound is 868. Find a configuration with more than 604 vectors.
ams:
  - 52
tags:
