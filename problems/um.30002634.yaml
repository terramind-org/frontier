title: Lichnerowicz Conjecture for Conformal Isometry Groups
field: mathematics
tier: prose
statement: Let $(M,g)$ be a compact Riemannian $n$-manifold, $n\geq 3$, that is not conformal to the round sphere. Does its conformal class contain a constant-scalar-curvature metric $\widetilde g$ satisfying $\operatorname{Isom}(M,\widetilde g)=\operatorname{Conf}(M,g)$?
