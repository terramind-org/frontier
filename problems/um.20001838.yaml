id: um.20001838
title: A quantitative construction calculus for ANCO manifolds
field: mathematics
tier: prose
statement: |-
  A closed smooth manifold \(M\) is ANCO if for every \(\epsilon>0\) there is a Riemannian metric \(g_\epsilon\) such that
  \[
  \lambda_{\min}(\mathcal R_{g_\epsilon})
  \operatorname{diam}(M,g_\epsilon)^2>-\epsilon,
  \]
  where the minimum is over all points and all eigenvalues of
  \(\mathcal R_g:\Lambda^2TM\to\Lambda^2TM\).
  Which closed manifolds are ANCO, and which construction operations preserve the property?
