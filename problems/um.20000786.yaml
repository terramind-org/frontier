title: CM factors force infinitely many nonordinary primes
field: mathematics
tier: prose
statement: |-
  Let $K$ be a number field, and let $A/K$ be an abelian variety. Do there
  exist infinitely many places $v$ of $K$ such that the reduction
  $A/\mathbb F_v$ is not ordinary? More strongly, do there exist infinitely
  many places $v$ of $K$ such that the reduction $A/\mathbb F_v$ is
  supersingular?
