title: Thermodynamic Reservoirs in Grid-Based Reduced Models
field: mathematics
tier: prose
statement: In extending thermostat-based reduced modeling to grid-based PDE methods, can the thermodynamic reservoir be taken to be the unresolved unknowns on a fine grid, with the reduced model represented by a subset of those unknowns? Can the full trajectory then be approximated weakly by the resulting reduced dynamics?
