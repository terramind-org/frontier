title: Hardy-Littlewood Conjecture F (Primes in Quadratic Polynomials)
field: mathematics
tier: prose
statement: For a polynomial $f(x) = ax^2 + bx + c$ with $a > 0$, $\gcd(a,b,c) = 1$, and discriminant $\Delta = b^2 - 4ac$ not a perfect square, the polynomial takes infinitely many prime values. Furthermore, the number $P(n)$ of primes of the form $f(x) \leq n$ satisfies an asymptotic formula $P(n) \sim A \cdot \frac{\sqrt{n}}{\log n}$ where $A$ depends on $a, b, c$ but not on $n$.
