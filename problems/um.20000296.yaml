title: A literal obstruction and an exact p-rank criterion for non-nilpotent Frobenius
field: mathematics
tier: prose
statement: |-
  Given a smooth, projective variety \(X\) over a number field, does there
  exist a dense set of primes for which the action of Frobenius on the
  coherent cohomology \(H^i(X_p,\mathcal O_{X_p})\) is not nilpotent?
