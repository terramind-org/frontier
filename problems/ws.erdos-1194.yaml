title: "Erdős Problem #1194"
field: mathematics
tier: prose
statement: Suppose $A\subseteq\mathbb N$ has exactly one ordered pair $(a_n,b_n)\in A^2$ satisfying $a_n-b_n=n$ for every positive integer $n$. Determine the growth that the ratios $a_n/n$ must exhibit, and how slowly they can grow across such perfect difference sets.
