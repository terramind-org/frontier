title: Set-Theoretic Cohen–Macaulay Ideals in Characteristic Zero
field: mathematics
tier: prose
statement: Let $K$ be a field of characteristic zero, let $R=K[w,x,y,z]$, and let $$\varphi:R\longrightarrow K[s^4,s^3t,st^3,t^4]$$ send $w,x,y,z$ to $s^4,s^3t,st^3,t^4$, respectively. Writing $\mathfrak{a}=\ker\varphi$, does there exist an ideal $\mathfrak{b}\subset R$ such that $\sqrt{\mathfrak{b}}=\mathfrak{a}$ and $R/\mathfrak{b}$ is Cohen–Macaulay?
