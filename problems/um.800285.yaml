title: Several Complex Variables Problem List — Problem 85
field: mathematics
tier: prose
statement: |-
  Prove that if $\Omega$ is strongly pseudoconvex then there is an
  absolute constant $K > 0$ such that the integrated Kobayashi distance
  between any two points can be realized by a Kobayashi chain of $K$
  discs. [For instance, on a convex domain, $K = 1.$] \\
  Prize \$50 -S. Krantz. sk @math.wustl.edu
