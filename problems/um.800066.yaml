title: Foliations and Diffeomorphism Groups — Question 7
field: mathematics
tier: prose
statement: |-
  Let $(\xi_-, \xi_+)$ be a pair of (co)oriented contact structures with opposite signs on $M$, and assume that their contact invariants pair to $1$:
  \begin{align}
  \langle c(\xi_-), c(\xi_+) \rangle = 1.
  \end{align}
  Does $M$ admit a Reebless foliation?
