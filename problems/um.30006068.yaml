title: Degeneration and Purity of Local-Field Adic Systems
field: mathematics
tier: prose
statement: Let $X$ be a smooth variety over a $p$-adic local field $K$, and let $\ell\neq p$. For pure $\mathbb Q_\ell$-adic local systems on $X$, do the systems degenerate to limiting mixed structures at ramification points, and is their cohomology pure?
