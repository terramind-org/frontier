title: Critical Biases in Positional Graph Games
field: mathematics
tier: prose
statement: In biased positional games on the edges of $K_n$, close the remaining gap for the Breaker bias at which Maker can build a Hamilton cycle. Determine the threshold biases for Maker to build a perfect matching or a $k$-connected graph, and determine whether a threshold bias exists for the Avoider–Enforcer Hamiltonicity game.
