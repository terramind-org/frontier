title: Gradient-Path Uniqueness in Persistence Pairings
field: mathematics
tier: prose
statement: Let $K$ be a filtered simplicial complex, let $P$ be a persistence pairing on $K$, and let $V_P$ be the discrete vector field formed from persistence pairs in which one simplex is a face of the other. If $\{\sigma,\tau\}$ is a persistence pair and $\sigma$ is not a face of $\tau$, is there exactly one gradient path from $\tau$ to $\sigma$ in $V_P$?
