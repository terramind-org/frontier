title: Boundaries of Groups and Kleinian Groups — Problem 105
field: mathematics
tier: prose
statement: "Compute cogrowth for notable subgroups $H\\subset G$, where cogrowth is the growth of the Schreier graph $\\Gamma_{G/H}$. In particular: prove that the cogrowth of $\\operatorname{SL}(n,\\mathbb Z)$ in $\\operatorname{SL}(n+1,\\mathbb Z)$ is exponential; compute cogrowth of special subgroups in Coxeter groups; and, if $\\Gamma_{G/H}$ is Gromov-hyperbolic, decide whether its cogrowth is necessarily constant, linear, or exponential."
