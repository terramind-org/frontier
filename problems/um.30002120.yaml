title: Nodal Counts for Fractional Schrödinger Eigenfunctions
field: mathematics
tier: prose
statement: Let $0<s<1$, let $(-\Delta)^s+V$ be a lower-semibounded fractional Schrödinger operator on $L^2(\mathbb R^m)$ with real $V$, and let $\psi_k$ be a continuous real eigenfunction associated with the $k$th eigenvalue below the essential spectrum. Bound the number of connected components of $\{\psi_k\ne0\}$ in terms of $k$.
