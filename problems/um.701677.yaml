title: Kourovka Notebook Problem 20.19
field: mathematics
tier: prose
statement: "A subgroup $H$ of a group $G$ is called *commensurated* if for all $g\\in G$, the index $|H : H \\cap gHg^{-1}|$ is finite. Can a non-abelian free group (or a non-elementary hyperbolic group) contain two infinite commensurated subgroups $A$, $B$ with a trivial intersection? The answer is negative if $A$ or $B$ is normal."
