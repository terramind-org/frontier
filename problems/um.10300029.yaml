title: Leaf spaces and transverse structures — Question 8.6
field: mathematics
tier: prose
statement: |-
  Is there a universal constant $c$ such that a hyperbolic $3$–manifold $M$
  whose fundamental group $\pi_1(M)$ can be ordered out to radius $c$ can be
  left–ordered? Or weaker, is there an effective method to compute such a
  $c(M)$ for a given $M$?
