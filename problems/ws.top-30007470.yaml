statement: |-
  \section*{Polynomial deterministic two-way simulation of one-way NFAs}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Can every n-state one-way nondeterministic finite automaton be simulated by a deterministic two-way finite automaton with only polynomially many states, with the polynomial independent of the input alphabet?
  \subsection{Short English statement}
  Can every n-state one-way nondeterministic finite automaton be simulated by a deterministic two-way finite automaton with only polynomially many states, with the polynomial independent of the input alphabet?
