  \item[\hypertarget{source:3089:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, record 3089 (OPG-59888). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
