title: Rank Completions of Crossed-Product Rings
field: mathematics
tier: prose
statement: For a measure-preserving action $\alpha$ of a countable group $\Gamma$, which invariants of the action are determined by the rank completion $A_\alpha$ of the regular closure of its crossed-product ring? For which nonamenable groups can this completion be independent of the action?
