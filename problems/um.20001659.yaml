title: Stabilizer lengths and rapid decay for tree and hyperbolic-graph actions
field: mathematics
tier: prose
statement: |-
  This record is the four-question list in Section 5, “RD for groups acting on
  special metric spaces,” of the AIM workshop notes *The property of rapid
  decay*.

  1. In the \(\widetilde A_2\)-building setting of RRS, for \(g\) supported on
     elements of shape \((m,n)\), their estimate is
     \[
       \|f*g\|_2\le p(m,n)\|f\|_2\|g\|_2,
       \qquad
       p(m,n)=\frac12(m+1)(n+1)(m+n+2)
                      \sqrt{\max\{m,n\}+1}.
     \]
     Is the square-root factor necessary?
  2. Does Wise's non-Hopfian group have property RD?  The presentation intended
     in the source is
     \[
       W=\langle a,b,s,t\mid [a,b]=1,\;
         sas^{-1}=(ab)^2,\;tbt^{-1}=(ab)^2\rangle .
     \]
  3. If \(\Gamma\) acts on a simplicial tree, what hypotheses on vertex and edge
     stabilizers characterize property RD?  The workshop notes suggest RD of
     stabilizers for the lengths induced from \(\Gamma\), with HNN extensions as
     an intended application.
  4. Can the tree be replaced by a bounded-degree \(\delta\)-hyperbolic graph?

  The
  equivalent five-generator presentation used by Barré--Pichot is
  \[
   \langle a,b,c,s,t\mid c=ab=ba,\;c^2=sas^{-1}=tbt^{-1}\rangle . \]
  Changing both stable letters to their inverses accounts for the opposite
  conjugation convention sometimes seen in print.
