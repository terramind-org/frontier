statement: |-
  (R. C. Lyndon). a) Does
  there exist an algorithm that, given a group word $ w(a,x)$,
  recognizes whether $a$ is equal to the identity element in the
  group $\left< a,x\mid a^n=1,\right.$ $\left. w(a,x)=1\right>$?

  [Archived solved part(s) of 11.10:]
  (R. C. Lyndon). b) Is it true
  that $a \ne 1$ in $G=\langle a,x\mid a^5=1,\;
  a^{x^2}=[a,a^x]\rangle $?
