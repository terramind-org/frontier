statement: "(J. Przytycki, see [286]) (1) There is a polynomial invariant of unoriented links, P1(L)∈ Z[x, t] which satisfies: (i) Initial conditions: P1(Tn) = tn, where Tn is a trivial link of n components. (ii) Skein relation P1(L0) + xP1(L1)− xP1(L2)− P1(L3) = 0 where L0, L1, L2, L3 is a standard, unoriented skein quadruple ( Li+1 is obtained from Li by a right-handed half twist on two arcs involved in Li; compare Figure 15.) (2) There is a polynomial invariant of unoriented framed links, P2(L) ∈ Z[A±1, t] which satisfies: (i) Initial conditions: P2(Tn) = tn, (ii) Framing relation: P2(L(1)) =−A3P2(L) where L(1) is obtained from a framed link L by a positive half twist on its framing. (iii) Skein relation: P2(L0) + A(A2 + A−2)P2(L1) + (A2 + A−2)P2(L2) + AP2(L3) = 0. (3) There is a rational function invariant of unoriented framed links, P3(L)∈ Z[a±1, x, y, (x + y + xy + y2)−1] which satisfies: (i) Initial conditions: P3(Tn) = ( −a3(x+y+xy+x2)+a7(x+y+1)2−a−1 x+y+xy+y2 )n−1, (ii) Framing relation: P3(L(1)) = aP3(L), (iii) Skein relation: P3(L0)+axP3(L1)+a2yP3(L2)−a3(x+y+1)P3(L3) = 0. (4) The invariant predicted in (1) (respectively (2) and (3)) is not uniquely defined (if it exists). Note that a solution to (3) becomes a solution to (1) under the substitution a = 1, x =−y and that a solution to (3) becomes a solution to (2) under the substitution a =−A3, x =−1− A−4, y = A−4 + A−8. As for the uniqueness of (4), note that all such invariants agree on trivial links and therefore they agree on the space spanned by trivial links in the related cubic ske in module. The above conjectures assume that b∞ = 0 in our skein relation. Let consider the possibility that b∞ is invertible in R. Using the “denominator” of our skein relation (the first line of Figure 16) we get the relation whic h allows to compute the eﬀect of adding a trivial component to a link L (we write tn for the trivial link Tn ): (a−3b3 + a−2b2 + a−1b1 + b0 + b∞t)L = 0. (33) When considering the “numerator” of the relation and its mir ror image (Figure 16) we obtain formulas for Hopf link summands, and because un oriented Hopf link is amphicheiral we can eliminate it from our equations t o get the formula (34): b3(L#H) + (ab2 + b1t + a−1b0 + ab∞)L = 0. b0(L#H) + (a−1b1 + b2t + ab3 + a2b∞)L = 0. ((b0b1− b2b3)t + (a−1b2 0− ab2 3) + (ab0b2− a−1b1b3) + b∞(ab0− a2b3))L = 0. (34) It is possible that (33) and (34) are the only relations in the module. Precisely, we ask whether S4,∞(S3; R) is the quotient ring R[t]/(I) where ti represents the trivial link of i components andI is the ideal generated by (33) and (34) for L = t. The substitution which realizes the relations is: b0 = b3 = a = 1, b1 = b2 = x, b∞ = y. This may lead to the polynomial invariant of unoriented lin ks in S3 with values in Z[x, y] and the skein relation L3+xL2+xL1+L0+yL∞ = 0."
