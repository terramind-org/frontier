title: Positively Curved Projective Varieties — Problem 1
field: mathematics
tier: prose
statement: |-
  MRC fibrations are almost holomorphic by definition,
  but they are not necessarily represented by holomorphic maps.
  In fact, there is a projective variety $Z$ with Picard number one,
  such that $Z$ is uniruled but not rationally connected,
  which was constructed by Fujita (see [EIM20, Example 6.5] for details).
  The variety $Z$ admits no non-trivial fibrations
  (in particular, no holomorphic MRC fibrations)
  since the Picard number of $Z$ is one.
  Note that $Z$ has bad singularities:
  $Z$ is neither log canonical nor $\mathbb{Q}$-factorial.
  The author does not know an example of smooth projective varieties (or varieties with mild singularities) admitting no holomorphic MRC fibration.
  Now we suggest the following problem:

  When do we choose an MRC fibration to be holomorphic from the ambiguities in the choices of $Y$?
