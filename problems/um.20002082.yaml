title: The Hofer diameter of equators and a bounded graphical chamber
field: mathematics
tier: prose
statement: |-
  This is Question 1.24 in Michael Hutchings's AIM outline *Holomorphic curves in contact geometry*, written with help from Yasha Eliashberg and John Etnyre.

  \[
  \operatorname{length}\{L_t\}
  :=\int_0^1\left(\max_{L_t}F_t-\min_{L_t}F_t\right)dt,
  \]
  and
  \[
  d(L_0,L_1):=\inf_{\gamma}\operatorname{length}(\gamma),
  \]
  where \(F(x,t)\) generates the Hamiltonian isotopy \(\{L_t\}\) and the
  infimum is over Hamiltonian paths from \(L_0\) to \(L_1\). The source then asks for the diameter of the
  space \(\mathscr L\) of smooth simple closed curves in \(S^2\) dividing it
  into two equal-area regions. It also asks about the analogous orbit of
  \(\mathbb RP^2\subset\mathbb CP^2\) and records the graph map
  \[
  \operatorname{Ham}(M,\omega)\longrightarrow
  \mathscr L(M\times M,\omega\oplus-\omega). \]

  No mean-zero normalization of \(F_t\) is needed for the displayed length:
  adding any time-dependent spatial constant changes neither maximum minus
  minimum. More generally, two generators of the same unparametrized Lagrangian
  motion have restrictions to the connected curve \(L_t\) that differ by a
  constant, so the integrand is intrinsic to the exact Lagrangian path.
