title: Attainable Sum Distributions and Joint Mixability
field: mathematics
tier: prose
statement: For given marginal distributions $F_1,\ldots,F_n$, characterize $D_n(F_1,\ldots,F_n)=\{\operatorname{cdf}(X_1+\cdots+X_n):X_i\sim F_i\}$ under arbitrary dependence, and find an analytical method to decide when $D_n$ contains a point mass (joint mixability).
