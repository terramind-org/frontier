schema: 1
id: poincareconjecture.poincare-conjecture.variants.smooth-other-cases
title: "The Poincaré Conjecture (variant: smooth_other_cases)"
field: mathematics
tier: proof
statement: |-
  It is conjectured that the only values of $n > 4$ for which the smooth version of the
  conjecture holds are $n = 5, 6, 12, 56, 61$. See Conjecture 1.17 in [Wang2017].
