title: Diophantine Definability of Rational Subfields
field: mathematics
tier: prose
statement: For the relation $S$ on $\mathbb F_p(t)$ defined by $S(f,g)$ if and only if $f\in\mathbb F_p(g)$, is $S$ Diophantine in the parameter-free ring language? In particular, is $\mathbb F_p(t^2)$ Diophantine with parameters in $\mathbb F_p(t)$?
