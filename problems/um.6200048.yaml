title: Boundaries of Groups and Kleinian Groups — Problem 48
field: mathematics
tier: prose
statement: "Study relationships between diﬀerent notions of conformal structure on ∂∞(G) for hyperbolic G. Here is an (incomplete) list of such notions: (1) 1-quasiconformal in the metric sense, i.e. H(f ) = 1. (2) preserving modulus of curves joining two compacta. (3) η-quasisymmetric with η as close to linear as we like. ( η are functions of the point x ∈ ∂∞G where we test f for conformality) (4) if Poincar´ e inequality holds for ∂∞G, then, using Cheeger cotangent bundle T ∗∂∞G, can give a notion of measurable bounded conformal structure µ such that Conf(∂∞G, µ) is a convergence group."
