title: Exact Green functions and zero leafwise critical measure on the Cayley fiber
field: mathematics
tier: prose
statement: |-
  Let \(C\) be the cubic surface defined by
  \[
  x^2+y^2+z^2-xyz=D,
  \]
  where \(D\) is a complex parameter. Let \(s_x:C\to C\) be defined by
  \[
  s_x(x,y,z)=(yz-x,y,z).
  \]
  The maps \(s_y,s_z\) are defined similarly.

  Consider, for example, the map \(S:=s_x\circ s_y\circ s_z\). It is known that \(S\) has non-zero entropy. Adapt the study of critical measure, etc. from the study of Hénon maps to that of \(F\).
