  \section{Subexponential Completeness Testing for Voronoi Cell Representatives}\label{30003267}
  {\small\sffamily UnsolvedMath ID 30003267 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A cell representative is a chosen member of a cell orbit under $\Gamma$. Completeness means that every $d$-cell orbit has a representative in the proposed collection. A Voronoi cell complex decomposes the relevant space using the source\textquotesingle s Voronoi construction.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The representation, size parameter, and fixed-versus-variable cell dimension are not specified.

  Source-record limitation: The complex/input encoding and size parameter for subexponential complexity are absent.
  \paragraph{Statement recorded in the supplied source.}
  Given a Voronoi cell complex $\operatorname{Vor}_\Gamma$ and a proposed set $C_d$ of representatives of its $d$-cells modulo $\Gamma$, is there a subexponential-time algorithm for deciding whether $C_d$ is complete? \sref{30003267}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Test completeness of the proposed cell representatives in subexponential time.
