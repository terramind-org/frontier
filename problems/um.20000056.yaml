title: Stein covers, MRC quotients, and the finite-cover diagonal obstruction
field: mathematics
tier: prose
statement: |-
  Let $X$ be a rationally connected $3$-fold which is a del Pezzo fibration over $\mathbb P^1$.
  Is there a component $M$ of the space of sections of the map $X \rightarrow \mathbb P^1$
  such that the Stein factorization of
  $\alpha: M \rightarrow J(X)$
  is the MRC fibration of $M$?

  Can we find an example of such a rationally connected $3$-fold $X$ with does not admit a decomposition of the diagonal
  and with the above property for the components of spaces of rational curves on X?

  The phrase “with does not” is visibly a typographical error; below it is read as “which does not.” Nothing else in the statement is changed. The record's “Sho” is identified as Sho Tanimoto through Lehmann--Tanimoto's theorem on Stein-factor stabilization [LT24].

  There are two minor interpretive points.

  1. A component of the section space is usually quasi-projective and may be singular. “Its MRC fibration” therefore means the MRC quotient of a smooth projective model of its Hilbert-scheme closure.
  2. “The Stein factorization is the MRC fibration” means that the **connected-fiber morphism** in the Stein factorization is the MRC quotient. It cannot mean the finite morphism to $J(X)$. This distinction is exactly what allows a nontrivial finite cover to evade Voisin's obstruction.

  The second question does not specify whether “a decomposition” is meant in the Chow or integral cohomological sense. These are distinguished below. The concrete example of [LT24, Example 10.5] has neither an integral Chow decomposition nor an integral homological (equivalently, in this complex setting, integral cohomological) decomposition.
