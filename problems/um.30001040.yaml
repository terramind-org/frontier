title: Torus Realizations of Adding Machines and Bernoulli Shifts
field: mathematics
tier: prose
statement: Can the adding machine and the Bernoulli shift each be realized on the two-torus $T^2$ as a minimal uniquely ergodic topological system $(T^2,\lambda,h)$, where $\lambda$ is an $h$-invariant ergodic measure of full support, in the sense of measurable conjugacy?
