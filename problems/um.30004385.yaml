title: Sharp Singularity Asymptotics for Sparse Bernoulli Matrices
field: mathematics
tier: prose
statement: |-
  Let $M_n$ be an $n\times n$ matrix with independent Bernoulli entries satisfying $\mathbb P(M_{ij}=1)=p_n$. Let $E_{\mathrm{zero}}$ be the event that $M_n$ has a zero row or column, and let $E_{\mathrm{equal}}$ be the event that it has two equal rows or two equal columns. In the sparse regime, is

  $$\mathbb P(M_n\text{ is singular})=(1+o_n(1))\mathbb P(E_{\mathrm{zero}}\cup E_{\mathrm{equal}})?$$

  In particular, when $\limsup p_n<1/2$, is this probability

  $$2n(1+o_n(1))(1-p_n)^n$$?
