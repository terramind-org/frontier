title: Growth and Order of Entire Functions with Newton Baker Domains
field: mathematics
tier: prose
statement: Let $f$ be an entire transcendental function and $N_f(z)=z-f(z)/f'(z)$ its Newton function. Suppose $N_f$ has an invariant Baker domain $U$, meaning $N_f(U)\subseteq U$ and its iterates tend to infinity. Must there be a constant $K>0$ and a curve $\gamma$ tending to infinity such that $|f(z)|\leq|z|^K$ for $z\in\gamma$? Must the order of $f$ be at least $1/2$?
