title: A degree-two saturation test for the unirational fourfold problem
field: mathematics
tier: prose
statement: |-
  Does there exist a unirational variety \(X\) of dimension at least \(4\) such that
  \[
  \frac{H^4(X,\mathbb Z)\cap H^{2,2}(X)}
  {(H^4(X,\mathbb Z)\cap H^{2,2}(X))_{\mathrm{tors}}}
  \]
  is non-algebraic? Here, the subscript tors denotes torsion classes.
  Does there exist such a variety of dimension exactly \(4\)?
