title: Local Fourier uniformity down to exponent 2/5 and spectral-moment transfer
field: mathematics
tier: prose
statement: |-
  How much can we lower \(H\) in the local Fourier uniformity conjecture
  \[
   \int_X^{2X} \sup_\alpha \left| \sum_{x\leq n\leq x+H}
   \lambda(n)e(n\alpha) \right|\,dx=o(HX)?
  \]
