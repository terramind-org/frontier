title: Sharp Constants for Multicolor Rainbow Triangles
field: mathematics
tier: prose
statement: For an integer $r$ such that no affine plane of order $r-1$ exists, determine the sharp constant in the maximum possible number of rainbow triangles in a simple $r$-edge-colored graph with $m$ edges. In particular, determine it for $r=7$ and $r=11$.
