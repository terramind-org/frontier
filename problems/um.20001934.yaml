title: Dense periodic directions force dense stationary-net crossing vertices
field: mathematics
tier: prose
statement: |-
  We call a stationary net nontrivial if it has at least one vertex of valency \(\geq 3\), in other words if it is not a disjoint union of simple closed geodesics.

  **Question 11.2.1 (Gromov).** Are nontrivial stationary nets dense on any closed Riemannian surface? In other words, for each nonempty open subset \(U\), is there a stationary net intersecting \(U\)?
