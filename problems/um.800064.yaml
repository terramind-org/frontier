title: Foliations and Diffeomorphism Groups — Question 5
field: mathematics
tier: prose
statement: |-
  Refinements of the Eliashberg--Thurston theorem by Colin and Bowden imply that any Reebless aspherical $C^0$-foliation approximates to such pairs. As a warm-up, one could investigate the following question raised by Colin and Firmo in [colin2011paires]:

  Let $(\xi_-, \xi_+)$ be a tight positive contact pair as in the previous question. Is $M$ irreducible?
