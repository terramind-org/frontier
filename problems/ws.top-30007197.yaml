  \section*{A nontrivial group free-product Z cannot be normally generated by one element}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every nontrivial group A and every $w\in A*Z$, is $(A*Z)/\langle \langle w\rangle \rangle $ nontrivial?
  \subsection{Short English statement}
  For every nontrivial group A and every $w\in A*Z$, is $(A*Z)/\langle \langle w\rangle \rangle $ nontrivial?
