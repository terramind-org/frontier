title: Divisible Chern data are realizable on finite-dimensional CW complexes
field: mathematics
tier: prose
statement: "**Question 13. Question (Madhav Nori).** Given positive integers \\(d,r\\) and \\(X\\) a CW complex with \\(\\dim X=d\\) and classes \\(c_i\\in H^{2i}(X,\\mathbb Z)\\) for \\(i=1,2,\\ldots,r\\), such that the image of \\(c_i\\) is \\(0\\) in \\(H^{2i}(X,\\mathbb Z/m\\mathbb Z)\\) for all \\(m\\), does there exist a complex vector bundle \\(E\\) with \\(\\operatorname{rank}(E)=r\\) and \\(c_i(E)=c_i\\)?"
