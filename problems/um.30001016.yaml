title: General Type of Orthogonal Modular Varieties
field: mathematics
tier: prose
statement: Let $L$ be an even integral lattice of signature $(2,n)$, and let $\mathcal{F}(L)$ be its modular variety. Is $\mathcal{F}(L)$ of general type for all sufficiently large $n$, in particular for every $n\geq36$?
