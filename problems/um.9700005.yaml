title: Low-density lineage limit of coalescing branching random walk
field: mathematics
tier: prose
statement: For the two stationary branching-coalescing models on $\mathbb{Z}^3$ described by Aldous, prove that as particle intensity tends to zero the suitably time-rescaled lineage process, ignoring spatial positions and short parent-daughter jitter, converges in finite-dimensional distributions to the stated Poisson split-and-merge lineage process.
