title: Exponential Boundary Growth in the Dirichlet Weak Product
field: mathematics
tier: prose
statement: Let $D_0$ be the Dirichlet space without constants, with orthonormal basis $n^{-1/2}z^n$, and let $D_0^{\odot2}$ consist of sums $F=\sum_jt_jf_jg_j$ with bounded $t_j\geq0$ and orthonormal bases $(f_j)$ and $(g_j)$. What boundary behavior do functions in $D_0^{\odot2}$ have? In particular, if $\|F\|<1$, how fast can $$\int_{|z|=r}\exp\!\left(\frac{|F(z)|^2}{\log(1/(1-r^2))}\right)$$ grow as $r\to1^-$?
