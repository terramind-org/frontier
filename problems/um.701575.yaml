title: Kourovka Notebook Problem 19.27
field: mathematics
tier: prose
statement: |-
  (Well-known question). A finitely generated group $G$ that acts on a tree in such a way that all vertex and edge stabilizers are infinite cyclic groups is called a generalized Baumslag--Solitar group. The Bass--Serre theory gives finite presentations of such groups. Is the isomorphism problem soluble for
  generalized Baumslag--Solitar groups?
