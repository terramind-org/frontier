title: Classification of Conformally Einstein Kähler Manifolds
field: mathematics
tier: prose
statement: Which Kähler manifolds are conformally Einstein? More precisely, classify Kähler manifolds $(M,g_0)$ for which there exist a smooth function $\sigma:M\to\mathbb{R}$ and an Einstein metric $g$ satisfying $g=e^\sigma g_0$.
