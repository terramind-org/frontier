statement: "**Recovered question.** Let $F\\in\\operatorname{Aut}(\\mathbb C^2)$ be one holomorphic automorphism, and let $p$ be an attracting fixed point (or an attracting periodic cycle). Can the proper full basin of attraction of $p$ have nonempty boundary which is globally an embedded $C^1$ real hypersurface of $\\mathbb R^4$?"
