  \section*{Uniformization with positive bisectional curvature}\label{30007147}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Is every connected noncompact complex n-manifold, $n\geq 1$, carrying a complete smooth Kähler metric with strictly positive holomorphic bisectional curvature biholomorphic to $C^{n}$?
  \subsection{Short English statement}
  Is every connected noncompact complex n-manifold, $n\geq 1$, carrying a complete smooth Kähler metric with strictly positive holomorphic bisectional curvature biholomorphic to $C^{n}$?
