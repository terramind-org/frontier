title: Fixed-diagram-safe reductions for finite equivariant posets
field: mathematics
tier: prose
statement: |-
  **Equivariant discrete homotopy theory**

  Develop equivariant discrete homotopy theory.

  **Scope.** Fix a finite group $G$ and work with finite posets carrying a left $G$-action by order automorphisms. Morphisms are equivariant monotone maps. Homotopies are finite fences of pointwise comparable equivariant maps.
