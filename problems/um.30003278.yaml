title: Elliptic-Curve Bijections and Additive Bases from Restricted Primes
field: mathematics
tier: prose
statement: |-
  Let $p>3$, let $t\not\equiv0\pmod p$, and put

  $$E_p(t)=\{(x,y)\in(\mathbb F_p^\times)^2:x+x^{-1}+y+y^{-1}=t\}.$$

  Is there an explicit bijection $E_p(t)\to E_p(16/t)$? Also, if $S$ is the set of positive integers all of whose prime divisors are congruent to $3$ modulo $4$, is every sufficiently large even integer a sum of two elements of $S$?
