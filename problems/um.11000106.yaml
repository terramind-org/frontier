title: Conjecture — LetS and R be closed surfaces.
field: mathematics
tier: prose
statement: LetS and R be closed surfaces. Let Γ be a subgroup of finite index in ModS. If the genus of R is less than the genus of S, then there is no homomorphism Γ→ ModR having as an image a subgroup of finite index in ModR. In fact, one may hope that any such homomorphism Γ → ModR has a finite image. But while the problem 7 about H 1(Γ) is unresolved, a more cautious conjecture seems to be more appropriate and more accessible, because if H 1(Γ) is infinite, Γ admits a homomorphism onto Z, and therefore, a lot of homomorphisms into Mod R, in partucular, with infinite image. In the special case when Γ = Mod S, the conjecture is recently proved by W. Harvey and M. Korkmaz [ HaK]. Their methods relay on the use of elements of finite order in Γ = Mod S, and therefore cannot be extended to general subgroupsΓ of finite index.
