title: Fixed Volume Magnetic Eigenvalue Minimizers in Three Dimensions
field: mathematics
tier: prose
statement: For a real magnetic parameter $\beta$ and a bounded open set $\Omega\subset\mathbb{R}^3$, can one find a fixed-volume $\Omega$ that minimizes the first Dirichlet eigenvalue $E_1$ of $\left(i\nabla+\frac{\beta}{2}(-x_2,x_1,0)\right)^2$?
