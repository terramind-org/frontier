title: Selection Principles in Mathematics — Problem 16 (Krawczyk)
field: mathematics
tier: prose
statement: |-
  Is it consistent (relative to ZFC) that
  there are uncountable sets of reals satisfying $\mathsf{S}_1(\Omega,\Gamma)$,
  but for each such set $X$ and each set $Y$ with Hausdorff dimension zero,
  $X\times Y$ has Hausdorff dimension zero?
