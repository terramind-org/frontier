title: Poisson Statistics for S5 Number-Field Extensions
field: mathematics
tier: prose
statement: Let $K$ be the function field of a curve over $\mathbb F_q$, and let $n(D)$ count $S_5$-extensions of $K$ with squarefree discriminant $D$. Does $n(D)$ follow a Poisson distribution with mean $1$, and can this prediction be tested experimentally? Does the analogous count over $\mathbb Q$ follow a Poisson distribution with expected mean $\frac{13}{120}\zeta(2)^{-1}$?
