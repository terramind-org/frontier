title: Cohomological Dimension of Meromorphic Function Fields
field: mathematics
tier: prose
statement: Let $S$ be a connected normal Stein space of complex dimension $n$. Is the cohomological dimension of its field of meromorphic functions equal to $n$, that is, does $\operatorname{cd}(\mathcal M(S))=n$ hold? The question remains open in dimensions $n\geq 3$.
