title: Quasiconvexity of Multiple-Valued Integrands
field: mathematics
tier: prose
statement: Let $f:B\times\operatorname{Hom}(\mathbb{R}^m,TM)\to\mathbb{R}_{\geq0}$ be quasiconvex and define $e_M(x,\nu_1,\ldots,\nu_Q,N_1,\ldots,N_Q)=\sum_{i=1}^Qf(x,\nu_i,N_i)$. Is $e_M$ quasiconvex on the space of $Q$-valued maps into $M$?
