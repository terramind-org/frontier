lean:
  module: FormalConjectures.GreensOpenProblems.«25»
  decl: Green25.green_25.lower
  statement: |-
    theorem green_25.lower :
        (bestLower =o[atTop] green_25.lower.answer) ∧
        (∀ᶠ N in atTop, 1 ≤ green_25.lower.answer N ∧ green_25.lower.answer N ≤ N) ∧
        ∀ k : ℕ → ℕ,
          (∀ᶠ N in atTop, 1 ≤ k N ∧ k N ≤ N) ∧
          ((fun N => (k N : ℝ)) ≪ green_25.lower.answer) →
          ∀ᶠ N in atTop, Property25 (k N) N
  context:
    - open Green25
    - open Green25.green_25
    - open Asymptotics Filter Finset
  definitions:
    - name: Green25.Property25
      kind: def
      text: |-
        /--
        For which values of $k$ is the following true: whenever we partition $[N] = A_1 \cup \dots \cup A_k$,
        $\left|\bigcup^k_{i=1} (A_i \hat{+} A_i)\right| \geq \frac{1}{10} N$?
        -/
        def Property25 (k N : ℕ) : Prop :=
          1 ≤ k ∧ k ≤ N ∧
          ∀ P : Finpartition (Icc 1 N), #P.parts = k →
          10 * #(P.parts.biUnion Finset.restrictedSumset) ≥ N
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/GreensOpenProblems/25.lean#L38
    - name: Green25.bestLower
      kind: def
      text: |-
        /-- The best-known lower bound [ESS89]. -/
        noncomputable def bestLower (N : ℕ) : ℝ := Real.log (Real.log N)
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/GreensOpenProblems/25.lean#L47
