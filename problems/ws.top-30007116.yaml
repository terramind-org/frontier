  \item[S1] OpenAI, manuscript citation page. Source of the formulation motivating this local problem.
  \url{https://github.com/openai/math/blob/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/Edit-Distance-in-l1-Matching-Bounds-up-to-Constants-in-the-Exponent-September-27-2026/README.md}.
