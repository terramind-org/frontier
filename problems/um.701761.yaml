statement: |-
  Let $G_\Gamma$ be a partially commutative soluble group
  of derived length $n \geq 3$ with defining graph $\Gamma$ (the
  definition is similar to the case of $n=2$, see 17.104). Is
  $G_\Gamma$ a torsion-free group?
