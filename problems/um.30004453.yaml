title: Euler Characteristic and Coherence of Random Few-Relator Groups
field: mathematics
tier: prose
statement: In the few-relators random-group model $G(n,m,\ell)$, is a random group of Euler characteristic $\chi$ coherent when $\chi\leq0$ and incoherent when $\chi>0$, in each case with probability tending to $1$ as $\ell\to\infty$?
