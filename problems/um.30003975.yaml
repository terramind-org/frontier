title: Stable Symbolic-Power Containments from a Single Containment
field: mathematics
tier: prose
statement: Let $R$ be a regular ring and let $I$ be a radical ideal of big height $h$. If $I^{(hk-C)}\subseteq I^k$ for some $k$, must $I^{(hn-C)}\subseteq I^n$ for all sufficiently large $n$?
