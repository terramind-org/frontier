title: Selection Principles Milestone Problems — Problem 21 ([reznicb, Problem 8])
field: mathematics
tier: prose
statement: |-
  In [coc7] it is proved that $X$ satisfies $\mathsf{S}_{\mathrm{fin}}(\Omega,\Omega^{gp})$ if, and only if,
  all finite powers of $X$ satisfy $\mathsf{U}_{\mathrm{fin}}(\Gamma,\Gamma)$, which we now know is the
  same as $\binom{\Lambda}{\Lambda^{gp}}$.

  Is $\mathsf{S}_{\mathrm{fin}}(\Omega,\Omega^{gp})$ equivalent to $\binom{\Omega}{\Omega^{gp}}$?
