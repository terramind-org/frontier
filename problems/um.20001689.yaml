title: A complete tropical and theta calculation for the braid variety X(sigma_1^3)
field: mathematics
tier: prose
statement: |-
  For each cluster torus, take a co-character lattice and glue them by
  piecewise linear maps coming from exchange relations. These tropical points
  label the Gross-Hacking-Keel-Kontsevich $\Theta$-basis.

  **What are the tropical points of the braid variety? What are the
  $\Theta$-functions on the braid variety?**
