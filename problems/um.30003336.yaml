title: Regular Graphs Beating Clique Homomorphism Densities
field: mathematics
tier: prose
statement: |-
  For graphs $G$ and $F$, let $d_x(G,F)$ be the largest minimum degree of an $F$-free spanning subgraph of $G$. Determine the graphs $F$ for which there exists $\varepsilon>0$ such that, for every sufficiently large $\Delta$, some $\Delta$-regular graph $G_\Delta$ satisfies
  $$
  d_x(G_\Delta,F)<(1-\varepsilon)d_x(K_\Delta,F)
  $$?
