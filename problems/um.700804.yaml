statement: |-
  Let $L=L(K(p))$ be the
  associated Lie ring of a free countably generated group $K(p)$ of
  the Kostrikin variety of locally finite groups of a given prime
  exponent $p$. Is it true that

  a) $L$ is a relatively free Lie ring?

  c) all identities of $L$ follow from a finite
  number of identities of $L$?

  [Archived solved part(s) of 11.112:]
