title: Open Problems in Arithmetic Dynamics — Question 42
field: mathematics
tier: prose
statement: |-
  Let $f:\mathbb{P}^N\to\mathbb{P}^N$ be a morphism of degree $d\ge2$ defined
  over $\mathbb{Q}$. Is it true that for every $\epsilon>0$, the set of primes
  \[
  \left\{ p : \operatorname{Comp}(\Gamma_{\tilde f\bmod p}) \le \operatorname{Comp}_{\mathrm{avg}}(p^{(1-\epsilon)N})\right\}
  \]
  is a set of density $0$? Similarly with $\mathbb{A}^N$ in place of $\mathbb{P}^N$? For
  which maps $f$ can one obtain stronger results, e.g.,
  $\operatorname{Comp}(\Gamma_{\tilde{f}\bmod p})\asymp\operatorname{Comp}_{\mathrm{avg}}(p^N)$ as $p\to\infty$?
