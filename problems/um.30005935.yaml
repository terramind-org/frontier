title: Positivity and Convergence of a Splitting Scheme
field: mathematics
tier: prose
statement: For the Lie-Trotter splitting scheme applied to $du=\Delta u\,dt+g(u)\,d\beta(t)$ with homogeneous Dirichlet data and the non-globally Lipschitz nonlinearity $g(v)=v^{1.25}$, prove positivity and mean-square convergence of order $1/2$. Also establish a weak convergence rate.
