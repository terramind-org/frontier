title: Smoothness on Products of Perfect Sets
field: mathematics
tier: prose
statement: Let $E$ be a Borel equivalence relation on $\mathbb{R}^\omega$ reducible to an orbit equivalence. Is there a product of perfect sets on which $E$ is smooth?
