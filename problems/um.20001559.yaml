title: Order-two nonembedding and the equivariant Burau implication
field: mathematics
tier: prose
statement: |-
  Does the $Br_4$ triangle complex embed in a (locally finite?) $\widetilde A_2$ building?

  Related to the Burau representation; if it doesn't embed, then the Burau rep is not faithful over a finite field.
