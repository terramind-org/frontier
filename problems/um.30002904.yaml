title: Generic Infinite Index Subgroups of Integral Special Linear Groups
field: mathematics
tier: prose
statement: For $G=\mathrm{SL}_n(\mathbb{Z})$ and $B_X=\{g\in G:\lVert g\rVert\leq X\}$, does the probability that $\langle g_1,g_2\rangle$ has infinite index tend to 1 as $X\to\infty$ when $g_1,g_2$ are chosen uniformly from $B_X$?
