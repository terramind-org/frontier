title: Kourovka Notebook Problem 19.17
field: mathematics
tier: prose
statement: |-
  (Well-known problem). Suppose that $G$ is a finitely presented group such that the set of first Betti numbers over all the
  finite index subgroups of $G$ is unbounded above. (Here, the first Betti number is the maximum $n$ for which there is a surjective homomorphism onto $\mathbb{Z}^n$.)

  a) Must $G$ have a finite index subgroup with a surjective
  homomorphism to a non-abelian free group?

  b) Can $G$ even be soluble?
