title: The Dynamical Mordell–Lang Conjecture for Endomorphisms
field: mathematics
tier: prose
statement: For an endomorphism $f:A\to A$ of a complex variety with $\deg(f)>1$, a subvariety $V\subseteq A$, and $P\in A(\mathbb C)$, is $\{n\in\mathbb N:f^n(P)\in V(\mathbb C)\}$ always a finite union of one-sided arithmetic progressions?
