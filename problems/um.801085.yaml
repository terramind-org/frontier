title: "Henon Maps: Open Problems — Question 37"
field: mathematics
tier: prose
statement: |-
  Do there exist norms
  for functions on the Julia set which are bounded on H\"older continuous functions, contract
  (on the complement of an
  invariant line) under the action of $f_*$ (or, more generally, of $f_* (e^{\phi-P(\phi)} \cdot)$),
  and such that the contraction is stable by perturbation of $\phi$?
