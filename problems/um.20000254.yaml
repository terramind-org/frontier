title: Positive-characteristic connectedness and an amplified Frobenius certificate
field: mathematics
tier: prose
statement: |-
  **Connectedness.** Is there a positive-characteristic analog of the
  connectedness lemma?

  **Recovered strong connectedness statement.**  Let
  \(f\colon (X,B)\to S\) be a contraction, meaning that \(f\) is projective
  and \(f_*\mathcal O_X=\mathcal O_S\).  If
  \[
               -(K_X+B)
  \]
  is \(f\)-nef and \(f\)-big, then the reduced non-klt locus
  \(\operatorname{Nklt}(X,B)\) is connected in a neighborhood of every fiber.
  Over a non-algebraically-closed residue field, the precise fiberwise
  conclusion is that each nonempty fiber is geometrically connected.
