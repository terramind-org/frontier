  definitions:
    - name: OeisA229969.a
      kind: def
      text: |-
        /-- Number of ways to write $n = x + y + z$ with $0 < x \le y \le z$ such that all the six numbers
        $2x-1, 2y-1, 2z-1, 2xy-1, 2xz-1, 2yz-1$ are prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.Icc 1 (n / 3),
            ∑ y ∈ Finset.Icc x ((n - x) / 2),
              let z := n - x - y
              if (2 * x - 1).Prime ∧ (2 * y - 1).Prime ∧ (2 * z - 1).Prime ∧
                 (2 * x * y - 1).Prime ∧ (2 * x * z - 1).Prime ∧ (2 * y * z - 1).Prime
              then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/229969.lean#L34
