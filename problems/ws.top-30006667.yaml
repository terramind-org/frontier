  \section{Inference and Training Effects of the Softmax Bottleneck}\label{30006667}
  {\small\sffamily UnsolvedMath ID 30006667 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  For logits $z_i$, softmax gives $p_i=e^{z_i}/\sum_j e^{z_j}$. Nucleus sampling restricts sampling to a chosen high-probability prefix. A softmax bottleneck constrains distributions representable through a low-dimensional output projection.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The performance measures, sampling threshold, data distribution, and asymptotic token/vocabulary regime are unspecified.

  Source-record limitation: Effects on unspecified performance measures are empirical prompts rather than a determinate mathematical statement.
  \paragraph{Statement recorded in the supplied source.}
  When nucleus sampling is used at inference time, do the probabilities of tokens outside the top one thousand have negligible effects on performance? Does the softmax bottleneck materially limit performance during training even when it does not significantly restrict the probabilities of the most likely tokens at inference time? \sref{30006667}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record partially solved; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-22.
  \subsection{Short English statement}
  Assess whether rare-token probabilities and output-rank constraints matter during training or sampling.
