title: Problem 11.4 — Determine the abelianization of the group Hg,1.
field: mathematics
tier: prose
statement: "Determine the abelianization of the group Hg,1. Is it trivial? Also determine the second homology group H2(Hg,1; Z). Is the rank of it equal to 1 given by the signature? If everything will be as expected, we would obtain non-trivial homomorphisms ˆt2k+1: Θ 3 Z−→Z as secondary invariants associated to the cohomology classes ˜t2k+1. There should be both similarity and diﬀerence between these cases and the situation where we interpreted the Casson invariant as the secondary invariant associated to the first Mumford-Morita-Miller class e1 (see [ 74]). More precisely, they are similar because they are all related to some cohomology classes in H 2(hQ g,1). They are diﬀerent because e1 is non-trivial in H 2(Hg,1) whereas we expect that the other classes σ∗(˜t2k+1) would be all trivial in the same group. Also recall here that Matumoto [ 67] and Galewsky and Stern [ 23] proved that every topological manifold (of dimension n≥ 7) is simplicially triangulable if and only if the homomorphism (21) splits. In view of this result, it should be important to investigate the mod 2 structure of the extension (20) keeping in mind the works of Birman and Craggs [ 3] as well as Johnson [ 44] for the case of the mapping class group. However we have come too far and surely many things have to be clarified before we would understand the structure of the group Hg,1. Finally we would like to propose a problem."
