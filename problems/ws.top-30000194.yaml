statement: |-
  \section{Intrinsic Nonlinear Model Reduction}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A state-space system evolves as $\dot x=f(x,u)$ with output $y=h(x,u)$. Model reduction seeks a lower-dimensional system preserving specified input-output properties. Observability distinguishes initial states from their output trajectories, while controllability concerns reachable states under allowed inputs.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The system class, energy functions, state embedding for restrictions, and meaning of intrinsic are source-dependent; neither function is replaced by a linear-system Gramian.

  Source-record limitation: The nonlinear system class, controllability/observability energy functions, and restriction embeddings are not defined.
  \paragraph{Statement recorded in the supplied source.}
  Is there an intrinsic scheme for nonlinear model reduction? Is there a scheme such that both the controllability and observability functions of the reduced-order model are the restrictions of the corresponding functions of the full-order model? \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record partially solved; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Find a coordinate-independent reduction that preserves both the nonlinear controllability and observability functions as restrictions.
