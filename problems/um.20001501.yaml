title: A canonical congruence-kernel reduction for Out(F_n)
field: mathematics
tier: prose
statement: |-
  **Congruence subgroup property**

  Let \(Q\) be a finite quotient of \(\mathrm{Out}(F_n)\) for \(n > 2\). Does there exist a finite index characteristic subgroup \(K\) of \(F_n\) such that the quotient \(\mathrm{Out}(F_n) \twoheadrightarrow Q\) factors the quotient \(\mathrm{Out}(F_n) \twoheadrightarrow \mathrm{Out}(F_n /K)\)?

  For every epimorphism \(q:\Gamma\twoheadrightarrow Q\) to a finite group, does there exist a characteristic finite-index subgroup \(K\leq F\) such that
  \[
  \ker\rho_K\leq\ker q?
  \]
  Equivalently, is there a homomorphism
  \(\bar q:\operatorname{im}\rho_K\to Q\) such that
  \[
  q=\bar q\circ\rho_K?
  \]
