title: Lattice Gases and Antiferromagnetic Potts Models — Question 5
field: physics
tier: prose
statement: |-
  \quad (a) What is the sharp bound $C_{opt}(\Delta)$?
  Might $2\Delta$ work? Is $C_{opt}(3) = 3$?
  What about regions of the $q$-plane other than discs centered at $q=0$?

  (b) Can ``second-largest degree'' be improved to ``max flow''?
  (See [Sokal_00a, Section 7] for details.)

  (c) Can one obtain a *sublinear*\/ bound for suitable
  subclasses of graphs?

  - For theta graphs $\Theta_{s_1,\ldots,s_p}$
  [consisting of a pair of endvertices connected by
  $p$ internally disjoint paths of lengths $s_1,\ldots,s_p$]
  the answer is *yes*\/: there is a bound of order $p/\log p$
  [Brown_et_al].

  - For series-parallel graphs, I conjecture that the answer is
  *yes*\/ (again $p/\log p$) for maximum degree,
  and *no*\/ for second-largest degree or max flow;
  I am currently trying to prove these claims.

  - For planar graphs, it is an open question.
