title: Equality of Finitistic and Big Test Ideals
field: mathematics
tier: prose
statement: |-
  For an $F$-finite Noetherian domain $R$ of characteristic $p>0$, a nonzero ideal $\mathfrak a$, and $t>0$, is

  $$\tau_{\mathrm{fg}}(\mathfrak a^t)=\tau_b(\mathfrak a^t).$$ 

  Does this equality hold?
