title: Extensive Amenability of Wobbling-Group Actions
field: mathematics
tier: prose
statement: |-
  Is the action of the wobbling group $W(\mathbb Z^d)$ on $\mathbb Z^d$ extensively amenable? Equivalently, for every symmetric finitely supported probability measure $\mu$ on $W(\mathbb Z^d)$, every $\varepsilon>0$, and all sufficiently large $n$, do the inverted orbits $O_n$ satisfy

  $$\mathbb P(\lvert O_n\rvert<\varepsilon n)\geq e^{-\varepsilon n}$$

  always hold?
