title: Erdős Problem 385 (i)
field: mathematics
tier: proof
statement: |-
  Let $F(n) := \max\{m + p(m) \mid m < n \textrm{ composite}\}$ where $p(m)$ is the least
  prime divisor of $m$. Is it true that $F(n)>n$ for all sufficiently large $n$?
