title: Newton divisors versus Hirzebruch--Zagier cycles on Hilbert modular surfaces
field: mathematics
tier: prose
statement: "**Problem 7 (K. Murty).** A Hilbert modular surface in characteristic \\(p\\) has interesting cycles parametrizing Hilbert--Blumenthal abelian varieties with specified Newton polygon behavior. Are these contained in the space of special cycles made up of (Hecke translates of) Hirzebruch--Zagier curves? How can we check this?"
