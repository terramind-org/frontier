title: Moment Vanishing and Polynomial Abel Equations
field: mathematics
tier: prose
statement: |-
  Let $\Omega\subset\mathbb R^n$ be a bounded domain and let $P$ and $q$ be polynomials. Determine necessary and sufficient conditions for all moments
  $$m_k=\int_\Omega P(x)^kq(x)\,dx,\qquad k=0,1,\ldots,$$
  to vanish. In particular, when $P'=p$, determine the corresponding closed-solution conditions for the polynomial Abel equation $y'=p(x)y^2+q(x)y^3$.
