title: Virtual-knot problem 37 — It has been pointed out that the chain complex for Knot Floer Homology (categorifying the Alexander–Conway polynomial…
field: mathematics
tier: prose
statement: |-
  It has been pointed out that the chain complex for Knot Floer
  Homology (categorifying the Alexander–Conway polynomial)
  is generated by the states described in Formal Knot
  Theory . These states involve an assignment of pointers to
  each region of the diagram (with two adjacent regions omitted) such
  that each pointer marks a unique crossing in the diagram. The key
  problem about this complex is that while the chain groups are
  described via knot diagram combinatorics, the differential in the
  complex seem to require high dimensional contact geometry. Even
  though there is now a combinatorial definition of Knot Floer
  homology via arc diagrams, this is an unsatisfactory state of
  affairs. The problem is to find a combinatorial definition of the
  differential on the complex generated by the Formal Knot Theory
  states.
