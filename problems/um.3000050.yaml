title: Making the union of two directed spanning trees strongly connected
field: mathematics
tier: prose
statement: Let D=(V,E) be a directed graph that is the union of two disjoint directed spanning trees. Can we characterize when does D have a directed spanning tree $T \subseteq E$ such that E-T is also a directed spanning tree and reversing the orientation of each edge of T results in a strongly connected digraph?
