  \item[\hypertarget{source:statement:2}{S2}] Feliks Przytycki, ``On Invariant Measures for Iterations of Holomorphic Maps'', in Ben Bielefeld and Mikhail Lyubich (eds.), Problems in Holomorphic Dynamics (1992), Problem 1.1, pp. 29--30; arXiv:math/9205209v1. \url{https://arxiv.org/pdf/math/9205209}.
