title: Quantifier audit and local stretch-factor reduction
field: mathematics
tier: prose
statement: |-
  Let \(R\) be a hyperbolic metric on \(S\) and \(\operatorname{Mod}(R)\) the Teichmüller modular group of \(R\).

  If \(f\in\operatorname{Map}(S)\) satisfies that there exists \(\lambda\) such that \(\forall\alpha,\beta\) and \(n\in\mathbb N\),
  \[
  i(f^n(\alpha),\beta)<c\lambda^n,
  \]
  is it true then that \(f\in\operatorname{Mod}(R)\) for some \(R\)?
