title: Gluing Primitive Ideal Spaces of Amenable Algebras
field: mathematics
tier: prose
statement: If $X$ is a locally compact sober space with an open subset $U$ such that both $U$ and $X\setminus U$ are homeomorphic to primitive ideal spaces of amenable $C^*$-algebras, is $X$ itself homeomorphic to the primitive ideal space of an amenable $C^*$-algebra?
