title: Next-Most-Probable Galois Groups of Random Polynomials
field: mathematics
tier: prose
statement: In the large-box model for random integer polynomials of fixed degree, determine the next-most-probable Galois group after the full symmetric group, including whether the alternating group or a point stabilizer dominates and with what asymptotic probability.
