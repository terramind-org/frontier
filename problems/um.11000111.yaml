title: Problem 2.6 — Let Γ be a finite index subgroup of Modg.
field: mathematics
tier: prose
statement: Let Γ be a finite index subgroup of Modg. Is it true that H 1(Γ; Z) = 0? There are some partial answers to Problem 2.6. If g≥ 3 and if Γ contains the Torelli group, it was proved by McCarthy [ 37] that H 1(Γ; Z) = 0. However, if g = 2, this is not true anymore; the first examples of finite index subgroups in Mod 2 with nontrivial first cohomology were constructed by McCarthy in [ 37] and by Taherkhani in [ 43]. Moreover, if g = 1 or 2, it was shown in [ 31] that for each positive integer n≥ 2 the mapping class group Mod g contains a subgroup Γ n of finite index which admits a homomorphism onto a free group of rank n. In particular, the rank of H 1(Γn; Z) is at least n. We note that a positive answer to Problem 1 (a) implies a positive answer to Problem 2.6. Note also that since there is a subgroup of finite index in Mod 2 mapping onto a finite index subgroup of Mod 1, the hypothesis g≥ 3 in Problem 1 is necessary. A special case of Problem 2.6 is still interesting. Suppose that g≥ 3 and that Γ is s subgroup of finite index in Mod g containing the Johnson group (or Johnson kernel) Kg, the subgroup of Modg generated of by Dehn twists about separating simple closed curves. Is it true that any homomorphism Γ → Z is trivial? 1After this paper is written up, Behrstock and Margalit announced in [] that there exists an isomorphism between finite index subgroups of Mod ∗ 1,2 which is not the restriction of an inner automorphism. 88 M. Korkmaz
