title: Exact finite Feichtinger partition count and a sharp ceiling obstruction
field: mathematics
tier: prose
statement: Let \((x_n)_{n\in\mathbb N}\) be a Parseval frame with \(\|x_n\|\geq \epsilon>0\) for every \(n\). Let \(N(\epsilon)\) be the least universal number of classes needed to partition the index set so that every class indexes a Riesz sequence. Determine \(N(\epsilon)\), especially its asymptotic behavior as \(\epsilon\downarrow0\).
