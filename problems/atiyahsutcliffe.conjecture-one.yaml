lean:
  module: FormalConjectures.Arxiv.«1102.4662».AtiyahSutcliffe
  decl: AtiyahSutcliffe.conjecture_one
  statement: |-
    theorem conjecture_one {n : ℕ} (x : Fin n → Point) (hx : Function.Injective x) :
        LinearIndependent ℂ (pointPolynomial x)
  context:
    - open AtiyahSutcliffe
    - open MvPolynomial
  definitions:
    - name: AtiyahSutcliffe.Point
      kind: abbrev
      text: |-
        /-- A point of Euclidean three-space. -/
        abbrev Point := EuclideanSpace ℝ (Fin 3)
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Arxiv/1102.4662/AtiyahSutcliffe.lean#L42
    - name: AtiyahSutcliffe.pointPolynomial
      kind: def
      text: |-
        /-- The polynomial associated to point `i` in a finite configuration `x`. -/
        def pointPolynomial {n : ℕ} (x : Fin n → Point) (i : Fin n) :
            MvPolynomial (Fin 2) ℂ :=
          ∏ j ∈ Finset.univ.erase i, linearFactor (directionLift (x j - x i))
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Arxiv/1102.4662/AtiyahSutcliffe.lean#L65
