title: Research Problems in Function Theory — Problem 8.23
field: mathematics
tier: prose
statement: In Pompeiu's formula, $f(z)$ and $\int_\Gamma f(\zeta)/(\zeta-z)\,d\zeta$ make sense for merely continuous functions, but \[\int\int_\Omega\frac{\partial f}{\partial\overline{\zeta}}\frac{1}{\zeta-z}\,d\zeta\,d\eta\] needs at least some weak differentiability of $f$. It would be useful to extend the validity of the formula, for example to cover the case of functions $f\in \text{Lip }\alpha$, $\alpha> 0$. This prompts the following question. For which Borel sets $\Omega$ is the inequality \[\Big|\left<\frac{\partial\chi_\Omega}{\partial\overline{z}},f\right>\Big|\leq C_\Omega\|f\|_{\text{Lip }\alpha}\] valid? Putting it another way, for which Borel sets $\Omega$ does $\chi_\Omega$ act on the Besov space $B^{\alpha-1}_{\infty,\infty}$? An interesting special case would be that when $\Omega$ is a `Swiss cheese'. (A. G. O'Farrell)
