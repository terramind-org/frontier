title: Termination of klt threefold flips in positive characteristic
field: mathematics
tier: prose
statement: |-
  **Termination in dimension 3.** Do klt flips terminate in dimension 3?

  The supplied literature note says:

  The record itself does not specify the ground field, projectivity, a base,
  \(\mathbb Q\)-factoriality, the coefficient field, or whether “terminate”
  means every sequence or only a specially directed MMP. These omissions
  matter. The preceding problem 1.1 explicitly works over an algebraically
  closed field of characteristic \(p>0\), and the AIM workshop description
  confirms that positive characteristic is the intended setting. I therefore
  use the following precise absolute version as the main modern reading:

  \[
  \tag{P}
  \begin{gathered}
  k\text{ is algebraically closed of characteristic }p>5,\\
  (X,B)\text{ is a projective }\mathbb Q\text{-factorial klt threefold
  with a }\mathbb Q\text{-boundary},\\
  \text{and }X=X_0\dashrightarrow X_1\dashrightarrow\cdots
  \text{ is an arbitrary sequence of }(K_X+B)\text{-flips.}
  \end{gathered}
  \]

  The question is whether every such sequence is finite. Relative and
  \(\mathbb R\)-boundary versions are recorded separately below. Hypothesis
  \(p>5\) is not silently read into the historical question; it is the range
  where the modern threefold MMP used in the analysis is available in its
  cleanest form.
