statement: |-
  \section{Base-encoded monomial-curve designs}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  For a finite design $D$, evaluation sends a polynomial $f$ to $(f(v))_{v\in D}$. Monomials in a model set $L$ are linearly independent modulo $I(D)$ precisely when their evaluation vectors are independent. Thus an evaluation matrix with columns indexed by $L$ has full column rank. Statistical design properties impose additional conditions beyond that rank test.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The special statistical properties and admissible designs are not specified. Full evaluation rank is a defined part of the source question; no particular base encoding or optimality criterion is assumed. The supplied catalogue marks this record partially solved; its present research status was not independently checked.
  The source text below is rendered literally where necessary; damaged formulas and composite extracts are not silently repaired into a new mathematical claim.
  \paragraph{Statement recorded in the supplied source.}
  Problem 63 (Riccomagno). Given a model L find a design D with special statistical prop-erties such that the monomials in L are linearly independent modulo I(D). \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record partially solved; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness.
  \subsection{Short English statement}
  The source asks for designs giving independent model monomials together with desired statistical properties.
