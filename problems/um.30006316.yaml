title: The Numerical Unramified Plancherel Conjecture
field: mathematics
tier: prose
statement: Let $G$ be a split connected reductive group over a nonarchimedean local field and let $X$ be a spherical $G$-variety with hyperspherical cotangent bundle. Is the unramified spherical Hecke module $C_c^\infty(X(F))^{G(\mathcal O)}$, with its $L^2$ inner product and basic vector, isometrically identified with functions on the dual spectral quotient, with Hecke operators acting by multiplication and Plancherel measure determined by the dual representation $V_X$?
