title: Boundary-mass obstructions for rooted principal-graph truncations
field: mathematics
tier: prose
statement: |-
  **Is there a polymer theory of principal graphs? What graphs can appear as
  subgraphs of principal graphs?**

  One would need a bound on the rank at each depth.

  Penneys: Note that there are examples of forbidden subgraphs, e.g., part of
  the bad seed.
