title: Additive Coverage by Boundedly Many Bases over $\mathbb F_p$
field: mathematics
tier: prose
statement: For a prime $p$, does a constant $r=r(p)$ exist such that, for every finite-dimensional vector space $V$ over $\mathbb F_p$ and every collection of $r$ bases $B_1,\ldots,B_r$ of $V$, each vector in $V$ is a $\{0,1\}$-linear combination of vectors from those bases?
