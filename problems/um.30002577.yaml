title: Structure and Classification Problems for Noetherian Hopf Algebras
field: mathematics
tier: prose
statement: Let $H$ be a noetherian Hopf algebra. Are the quotients $H/P$ by minimal prime ideals Morita equivalent, and if not, which properties do they share, including polynomial-identity status and Gelfand–Kirillov dimension? Is every noetherian Hopf algebra strongly noetherian? For extensions of enveloping algebras by finite-dimensional pointed Hopf algebras, classify the extensions with fixed $H$ or fixed Gelfand–Kirillov dimension and describe their root systems. Can every known finite-dimensional Nichols algebra be obtained from a diagonal one by diagram folding, and do folded liftings exhaust all liftings?
