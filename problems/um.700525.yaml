title: Kourovka Notebook Problem 8.77
field: mathematics
tier: prose
statement: |-
  Do there exist strongly regular graphs with
  parameters $\lambda =0$, \ $\mu =2$ of degree $k > 10$? Such graphs
  are known for $k=5$ and $ k=10$, their automorphism groups are
  primitive permutation groups of rank 3.
