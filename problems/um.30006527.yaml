title: Monotonicity of Hook Counts in Symmetric Partitions
field: mathematics
tier: prose
statement: For each fixed positive integer $t$, let $\operatorname{sc}^{\star}_t(n)$ and $\operatorname{dd}^{\star}_t(n)$ count the $t$-hooks in self-conjugate and doubled-distinct partitions of $n$. Is $\operatorname{sc}^{\star}_t(n)\geq\operatorname{sc}^{\star}_{t+1}(n)$ and $\operatorname{dd}^{\star}_t(n)\geq\operatorname{dd}^{\star}_{t+1}(n)$ for all sufficiently large $n$, with a threshold bounded uniformly in $t$?
