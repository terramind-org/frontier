title: Verma-to-Wakimoto Isomorphisms for Jet-Level Characters
field: mathematics
tier: prose
statement: For a jet-level character $\theta\in\mathfrak h_n^*$, construct a Wakimoto module $W(\chi_\theta)$ with a natural nonzero map $V(\theta)\to W(\chi_\theta)$, and characterize the conditions on $\theta$ under which this map is an isomorphism.
