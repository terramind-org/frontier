title: Exceptional Diophantine Approximation by Matrix Systems
field: mathematics
tier: prose
statement: For the Diophantine-approximation function $$\psi_L(k)=\inf_{\substack{\|q\|_\infty\leq k,\ q\in\mathbb Z^m,\ p\in\mathbb Z^\ell}}\|Lq-p\|_\infty$$ of a matrix $L\in M_{\ell,m}(\mathbb R)$, what exceptional behaviors relative to the generic case are possible, and how large are the corresponding exceptional sets?
