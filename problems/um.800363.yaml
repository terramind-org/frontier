title: Coxeter Groups and Unimodality — Problem 1
field: mathematics
tier: prose
statement: |-
  It is well known (see, e.g., [Hum, Prop. 5.12] or [BB, Cor. 7.1.4])
  that if $(W,S)$ is a Coxeter system then $\sum_{u \in W} x^{\ell(u)}$ is a rational generating function.
  The following problem was proposed by Stembridge in [Ste97].

  Let $(W,S)$ be a Coxeter system. Is it true that then
  \[
  \sum_{t \in T} x^{\ell(t)}
  \]
  is a rational generating function?
