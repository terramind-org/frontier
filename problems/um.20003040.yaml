title: Nilpotent blindness for meridians in zero-surgery cobordisms
field: mathematics
tier: prose
statement: |-
  **0-surgeries and concordance.** Suppose $K$ and $J$ are knots in $S^3$
  such that there is an integer homology cobordism $W$ between $S^3_0(K)$
  and $S^3_0(J)$ in which the positively oriented meridians $\mu_K$ and
  $\mu_J$ are freely homotopic. Must $K$ and $J$ be concordant?
