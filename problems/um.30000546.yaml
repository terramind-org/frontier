statement: Does some finitely generated group embed in $\operatorname{Ham}(\Sigma_g)$ but not in $\operatorname{Ham}(\Sigma_h)$ for $g>h$? Conversely, does every finitely generated subgroup of $\operatorname{Ham}(\Sigma_h)$ embed in $\operatorname{Ham}(\Sigma_g)$?
