title: Open Problems and Questions about Geodesics — Question 27
field: mathematics
tier: prose
statement: |-
  Let $\alpha$ and $\beta$ be two geodesics in a complete simply connected Riemannian manifold without conjugate points.

  *Suppose $\alpha(0)=\beta(0)$. Does $dist(\alpha(t), \beta(t)) \to \infty$ as $t\to \infty$?*
