title: Open Problems in Pluripotential Theory — Question 31 (Tosatti-Weinkove)
field: mathematics
tier: prose
statement: Let $z_1,\cdots,z_k$ be a collection of points on a Hermitian manifold $X$ and let $\tau_1,\cdots,\tau_k$ be a collection of positive numbers satisfying $\sum_{j=1}^k\tau_j^n<\int_X\omega^n$. Construct an $\omega$-plurisubharmonic function, so that $\phi(z)\leq \tau_j \log(||z-z_j||)+O(1)$ near $z_j$.
