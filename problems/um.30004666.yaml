title: Normal Schubert Varieties in Full Affine Flag Varieties
field: mathematics
tier: prose
statement: Let $G$ be absolutely simple over a Laurent-series field of characteristic $p>0$, with $p\mid|\pi_1(G)|$. Classify all normal Schubert varieties in the neutral component $\operatorname{Fl}_{G,a}^{\circ}$ of the full affine flag variety; equivalently, classify the corresponding affine Weyl-group elements or alcoves.
