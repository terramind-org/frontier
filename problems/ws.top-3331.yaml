statement: |-
  \section{Burnside problem}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For positive integers $r,n$, let $F_r$ be the free group on generators $x_1,\ldots,x_r$ and define\[ B(r,n)=F_r/\langle\!\langle w^n:w\in F_r\rangle\!\rangle, \] where double angle brackets denote normal closure. A group has exponent dividing $n$ if $g^n=1$ for every element $g$. Every group generated by at most $r$ elements with this property is a quotient of $B(r,n)$.
  \paragraph{Statement recorded in the supplied source.}
  Is every finitely generated group of finite exponent finite? Equivalently, is $B(r,n)$ finite for all positive integers $r,n$? This is the historical unrestricted Burnside question; the source discussion records infinite free Burnside groups for large exponents, so the universal assertion has a negative answer. \sref{statement}{2}
  \subsection{Short English statement}
  Must a group generated by finitely many elements be finite if all its element orders have one common finite bound? The historical universal assertion is false.
