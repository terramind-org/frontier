title: Question 4.6 — Does there exist a closed hyperbolic 4-manifold X for which no finite cover admits a symplectic structure?
field: mathematics
tier: prose
statement: "Does there exist a closed hyperbolic 4-manifold X for which no finite cover admits a symplectic structure? (ie X is not virtually symplectic.) We note that it is easy to construct non-symplectic hyperbolic 4-manifolds. For example it is easy to see that the Davis manifold D (see [ 9]) admits no symplectic structure using the following simple parity rule (see [ 14] Corollary 10.1.10): Suppose that (M,ω ) is a closed symplectic 4-manifold. Then 1−b1(M ) + b+ 2 (M ) is even. For the Davis manifold we have from [ 35] that b1(D) = 24 and b2(D) = 72. Since the signature of D is zero, b+ 2 (D) = 36, and so the parity condition fails. 4.3. A natural weakening of Question 4.1 is the following."
