id: um.20001538
title: Explicit outer automorphisms for a RAAG join family and a free-product obstruction
field: mathematics
tier: prose
statement: |-
  For an Artin group \(A\), when is \(\operatorname{Out}(A)\) finite/finitely generated? Find explicit generators.

  The record itself contains no qualifications on the Coxeter matrix. Thus it is a programmatic question about all finite-rank Artin groups, not a single yes/no conjecture. No corruption or ambiguity is visible in the source record. Throughout, an Artin group is assumed to have a finite standard generating set.

  This report separates three logically different requests:

  1. decide when \(\operatorname{Out}(A)\) is finite;
  2. decide when it is finitely generated (or finitely presented);
  3. give abstract group generators, which may be strictly more numerous than graph symmetries of a chosen Artin presentation.

  The strongest new work in this attempt is a complete, elementary outer-automorphism calculation for a two-parameter family of right-angled Artin groups and a free-product obstruction to finiteness.
