title: Explicit positive-area carpets with non-isometric quasisymmetries
field: mathematics
tier: prose
statement: |-
  A set $X\subset\mathbb R^n$ is quasisymmetrically rigid if every
  quasisymmetric map of $X$ onto itself is the restriction to $X$ of an
  isometry of $\mathbb R^n$.  Bonk and Merenkov showed that the usual
  $1/3$ Sierpiński carpet is quasisymmetrically rigid.  Which positive-area
  Sierpiński carpets are rigid, and which are nonrigid?
