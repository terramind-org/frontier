title: The Lyapin's Notebook — Problem 29
field: mathematics
tier: prose
statement: |-
  (S.I. Kublanovsky)

  - Is the class of finite $0$-simple semigroups over groups, belonging to a pseudovariety of groups with
  decidable universal theory, completely solvable?

  - The same question for the class of finite Brandt semigroups, under a similar restriction on maximal
  subgroups.
