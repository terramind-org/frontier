id: um.30003051
title: State-Dependent Koopman Operators for Switching Systems
field: mathematics
tier: prose
statement: |-
  Let $\mathcal M=\{A_0,A_1\}$, let $\widehat{\mathcal M}=\mathcal M/\rho(\mathcal M)$, and suppose $\widehat{\mathcal M}^{*}$ is bounded. Define
  $$
  f(x)=\begin{cases}
  A_0x,&\sup_{A\in\widehat{\mathcal M}^{*}}\lVert Ax\rVert_2=\sup_{A\in\widehat{\mathcal M}^{*}}\lVert AA_0x\rVert_2,\\
  A_1x,&\text{otherwise}.
  \end{cases}
  $$
  Is the Koopman operator induced by $f$ an appropriate operator for the switching system, and what information about the system does it encode?
