title: PDF-splice repair and a gap-scale reduction for two independent prime questions
field: mathematics
tier: prose
statement: |-
  **7. Small gaps between primes in thin sequences.** A. Kantorovich asked whether it is possible to prove the existence of small gaps between primes from the sequence
  \[
  \{p\leq x: p=\lfloor n\log n\rfloor\text{ for some }n\in\mathbb N\}.
  \]
  This is a thin set of primes:
  \[
  \#\{p\leq x: p=\lfloor n\log n\rfloor\text{ for some }n\in\mathbb N\}
  \sim \frac{x}{(\log x)^2}.
  \]
  Several participants suggested the analogous question for Piatetski--Shapiro primes.

  **8. Mersenne composites.** A. Granville asked whether it is possible to use the GPY method, assuming the Elliott--Halberstam conjecture if necessary, to prove that there are infinitely many composites of the form
  \[
  2^p-1.
  \]
  C. Elsholtz noted possible related work of M. R. Murty under Artin's primitive-root conjecture.
