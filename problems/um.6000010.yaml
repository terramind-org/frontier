title: Tangent-Bundle Symplectic and Almost Complex Structures
field: mathematics
tier: prose
statement: Characterize the symplectic manifolds with compatible almost complex structure which are locally obtained from a tangent bundle $T(M)$ by combining the canonical symplectic form induced by a Riemannian metric with the almost complex structure determined by a compatible torsion-free affine connection.
