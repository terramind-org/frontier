title: Period Conjecture for Nori Motives
field: mathematics
tier: prose
statement: For every motive $M$ in Nori's category, is the evaluation map from the formal period algebra $\widetilde P_{\langle M\rangle}$ to the period algebra $P_{\langle M\rangle}$ injective? Equivalently, does the associated formal period scheme have the conjectured connectedness and transcendence-degree dimension?
