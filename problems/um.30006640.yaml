title: Geometry and Sampling on Probability Manifolds
field: mathematics
tier: prose
statement: Compute geometric quantities, including Riemannian and sectional curvatures, for general thermodynamical probability manifolds arising from master equations, develop the associated network analysis of curvature tensors, and use these calculations to design sampling algorithms for distributions on simplices.
