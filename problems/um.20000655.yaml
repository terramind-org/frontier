title: A power-saving GL(4) short second moment
field: mathematics
tier: prose
statement: |-
  **Bound for short second moment of \(\mathrm{GL}_4\) \(L\)-functions.** Let \(f\) be a fixed Hecke--Maass cusp form for \(\mathrm{GL}_4(\mathbb Z)\), and let \(T\) and \(\Delta\) be parameters. Prove a non-trivial bound for
  \[
  \int_T^{T+\Delta}\left|L\!\left(\frac12+it,f\right)\right|^2\,dt
  \]
  for \(\Delta=T^\delta\) with some \(\delta<1\).
