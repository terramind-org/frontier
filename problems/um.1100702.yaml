title: Questions in Geometric Group Theory — Q 7.2
field: mathematics
tier: prose
statement: "(Swarup) Starting with a finitely presented group $G$, take maximal graph-of-groups decompositions alternately over finite and over two-ended edge groups, each time continuing with the resulting vertex groups. Conjecture 1: there is a finitely presented group for which this process never terminates. Conjecture 2 (Strong Accessibility): for hyperbolic groups, and for CAT(0) groups, this process always terminates."
