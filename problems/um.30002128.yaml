id: um.30002128
title: Rationality and Computation of Free-Group Rotation Suprema
field: mathematics
tier: prose
statement: Let $F$ be the rank-two free group, and let $R(w,r,s)$ be the supremum of the lifted rotation number of $\rho(w)$ over representations with rotation numbers $r$ and $s$ on the generators. Is $R(w,r,s)\in\mathbb Q$ for every $w\in F$ and $r,s\in\mathbb Q$, and can one give a practical method to compute or approximate it?
