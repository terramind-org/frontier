title: A genuine-character obstruction and packet test for lifts to covered inner forms
field: mathematics
tier: prose
statement: |-
  Is there a natural lifting from representations of $G_F$ to $\widetilde{G'}_F$?

  The exact AIM record asks:

  The record itself does not define $G'$, the cover, the class of representations, or the sense of “natural.” The immediately preceding AIM problem (3.3) asks for transfer from $\widetilde G_F$ to $\widetilde{G'}_F$ “where two linear groups $G_F$ and $G'_F$ are inner forms each other,” and warns that the centers of the covers may differ. I therefore use the following conservative reconstruction:

  * $F$ is a local field (the surrounding base-change problem specifies a characteristic-zero $p$-adic field);
  * $G$ and $G'$ are inner forms of a common quasi-split reductive group $G^*$;
  * $1\to A\to \widetilde{G'}\to G'(F)\to1$ is a finite central cover, normally of Brylinski--Deligne or étale-metaplectic origin;
  * a target representation is required to be $\epsilon$-genuine for a fixed injective character $\epsilon:A\hookrightarrow\mathbb C^\times$.

  This reconstruction is supported by the neighboring repository records, not by the unavailable web page: on 12 August 2026, `http://aimpl.org/autoformcovergp/3/` returned HTTP 502. No claim below depends on silently adding further structure.
