title: Atypicality Detection by Ambidextrous Modified Dimensions
field: mathematics
tier: prose
statement: |-
  Let $\mathfrak g$ be a basic classical Lie superalgebra, let $J$ be a simple $\mathfrak g$-supermodule admitting an ambidextrous trace, and let $L\in\mathcal I_J$ be simple. Is

  $$\operatorname{atyp}(L)=\operatorname{atyp}(J)$$

  if and only if $d_J(L)\neq0$?
