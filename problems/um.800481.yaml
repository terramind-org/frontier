title: Billiards and Quantitative Symplectic Geometry — Serge Tabachnikov — Problem 3
field: mathematics
tier: prose
statement: |-
  **Complexity of polygonal symplectic billiards..** Symplectic billiards were introduced in [AT]; the polygonal ones were studied in [ABSST,ALW].

  Label the sides of a polygon by some symbols and assign to a billiard trajectory its symbolic code, the corresponding bi-infinite word in these symbols. The set of all trajectories yields a collection of such words. The complexity function $p(n)$ is the number of different subwords of length $n$ in this collection.

  For the conventional polygonal billiards, it is known that the complexity function is sub-exponential (the literature on this subject is huge, starting with [Ka]), and it has polynomial, actually cubic, growth for rational billiards (whose angles are rational multiples of $\pi$). For polygonal outer billiards, the growth of the complexity function is polynomial, see [GT].

  Problem: *study the complexity of polygonal symplectic billiards*.

  Note that there are examples of such billiards with all trajectories being periodic; in such cases, the complexity function has a zero growth rate.
