title: Periodic Simple Modules and Periodic Algebras
field: mathematics
tier: prose
statement: Let $A$ be a finite-dimensional algebra. If every simple module in $\operatorname{mod}A$ is periodic, must $A$ be a periodic algebra? Classify periodic algebras up to Morita and derived equivalence.
