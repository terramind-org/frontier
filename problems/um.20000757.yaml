statement: In the formulation of the arithmetic fundamental lemma, arithmetic intersection numbers are only formulated for regular semi-simple orbits because of proper intersections of cycles. Is it possible to define arithmetic intersection numbers in case of improper intersections of cycles (and formulate a similar analytic side)?
