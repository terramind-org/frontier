title: Selection Principles Milestone Problems — Problem 45 ([SakaiRez, Question 2.8])
field: mathematics
tier: prose
statement: |-
  A family $\mathcal{P}$ of subsets of of a space $Y$ is a *$\pi$-network*
  at $y\in Y$ if every neighborhood of $y$ contains some element of
  $\mathcal{P}$.
  $Y$ is a *Pytkeev space* if for each $y\in Y$ and
  $A\subseteq Y$ such that $y\in\overline{A}\setminus A$,
  there exists a countable $\pi$-network at $y$
  which consists of infinite subsets of $A$.
  In [SakaiRez] it is proved that
  $C_p(X)$ is a Pytkeev space if, and only if,
  for each $\omega$-shrinkable open $\omega$-cover $\mathcal{U}$ of $X$
  there exist subfamilies $\mathcal{U}_n\subseteq\mathcal{U}$, $n\in\mathbb{N}$, such that
  $\bigcap_{n\in\mathbb{N}}\mathcal{U}_n$ is an $\omega$-cover of $X$.

  Can the term ``$\omega$-shrinkable'' be removed from Sakai's
  characterization of the Pytkeev property of $C_p(X)$?
