  definitions:
    - name: Erdos354.FloorMultiples
      kind: def
      text: |-
        /-- The sequence `⌊a⌋, ⌊γ * a⌋, ⌊γ ^ 2 * a⌋, ..., ⌊γ ^ i * a⌋, ...`. -/
        noncomputable def FloorMultiples (a γ : ℝ) (n : ℕ) : ℤ := ⌊γ ^ n * a⌋
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/354.lean#L33
    - name: Erdos354.FloorMultiples.interleave
      kind: def
      text: |-
        /-- The sequence `⌊a⌋, ⌊b⌋, ⌊γ * a⌋, ⌊γ * b⌋, ... ⌊γ ^ i * a⌋, ⌊γ ^ i * b⌋, ...` -/
        noncomputable def FloorMultiples.interleave (a b γ : ℝ) (n : ℕ) : ℤ :=
          if n % 2 = 0 then
            FloorMultiples a γ (n / 2)
          else
            FloorMultiples b γ (n / 2)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/354.lean#L36
