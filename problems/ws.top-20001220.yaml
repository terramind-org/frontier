  \section{When flattening and symmetry-aware collapse are informative}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A table flattening regroups a multiway array into a matrix. Category collapsing is a linear summation map. A group action on the table's coordinates can decompose a representation into invariant or irreducible components, providing alternative coordinate descriptions.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The data model and meaning of more useful are not defined. No universal superiority of a transform or preservation theorem is asserted. The supplied catalogue marks this record partially solved; its present research status was not independently checked.
  The source text below is rendered literally where necessary; damaged formulas and composite extracts are not silently repaired into a new mathematical claim.
  \paragraph{Statement recorded in the supplied source.}
  Question 44 (Landsberg). Why is flattening used so frequently in statistics? Might other linear transformations on categorical data be more useful? Why not project onto the irre-ducible representations of the symmetric group? What about other forms of collapsing data that takes into account group actions? \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record partially solved; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness.
  \subsection{Short English statement}
  The source asks why flattening is useful and whether symmetry-based transformations could be preferable.
