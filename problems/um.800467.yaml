statement: |-
  **Minkowski billiard..**

  The model of Minkowski and, more generally, Finsler billiards, was introduced and studied by Gutkin and Tabachnikov in [GUTKIN2002277]. It plays an important role in a recent study by Artstein-Avidan, Karasev, and Ostrover [Artstein_Avidan_2014] on Mahler's conjecture. Consider a smooth convex curve $\gamma\subset \mathbb{R}^2$, and a Minkowski (not necessarily symmetric) norm $N$. The Minkowski billiard in $\gamma$ with respect to the norm $N$ is defined as a twist map that corresponds to the generating function \[L(s_0,s_1)=N(\gamma(s_1)-\gamma(s_0)) ,\] and the corresponding variational principle $ \mathcal{L}\{s_n\}=\sum_{n} L(s_n,s_{n+1}),\ $ where $\gamma$ is parametrized by $N$-arc length parameter (meaning, $N(\dot{\gamma}(s))=1$). Thus, the Birkhoff billiard is a special case of the Minkowski billiard when $N$ is chosen to be a Euclidean norm.

  **Question 2.** (Communicated by Yaron Ostrover) *Suppose that the Minkowski billiard, corresponding to the norm $N$, in a unit ball of $N$ is totally integrable. Does this imply that the norm $N$ is necessarily Euclidean?*

  This question was answered affirmatively in [IMRN] for billiard tables with a finite symmetry group.
