title: A hybrid distance-to-tree and sparse separating families
field: mathematics
tier: prose
statement: |-
  Find (different) notions of distance on the space of graphs, or perhaps measures on this space. In particular: how far is a given graph from being a tree?

  Tree-width is not good enough. There is a relation to tree-length.
