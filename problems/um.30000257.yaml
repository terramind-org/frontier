title: Connected Concentration Sets and Solution Counts
field: mathematics
tier: prose
statement: Suppose $E_\varepsilon[u_\varepsilon]\leq C\varepsilon^{N-m}$ and the concentration set is connected. Must its limiting concentration set have dimension $m$? What is the optimal asymptotic bound on the number of solutions as $\varepsilon\to0$?
