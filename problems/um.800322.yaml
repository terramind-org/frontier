title: Complexity in Enumerative Combinatorics — Conjecture 6
field: mathematics
tier: prose
statement: |-
  Before we proceed to more combinatorial examples, let us mention that
  D-transcendental GFs are the subject of *Differential Galois Theory*,
  which goes back to Liouville, Lie, Picard and Vessiot in the 19th century
  (see e.g. [Ritt]), and continues to be developed [Put-S]. Some
  natural GFs are known to be D-transcendental, e.g.\ $\Gamma(z)$, $\zeta(z)$, etc.,
  but there are too few methods to prove this in most cases of interest.
  Here are some of our favorite open problems along these lines,
  unapproachable with existing tools.

  $\sum_{n\ge 1}
  are D-transcendental.
