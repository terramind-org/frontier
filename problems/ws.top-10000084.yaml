  \item[\hypertarget{source:statement:2}{S2}] Itai Benjamini and Oded Schramm, \emph{Percolation beyond $\mathbb Z^d$, many questions and a few answers}, Electronic Communications in Probability 1 (1996), 71--82, Section 2, boundary definition, p. 73; Section 3, Conjecture 3, p. 74. \url{https://emis.de/ft/41630}.
  \end{description}
