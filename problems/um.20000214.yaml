title: Graph spaces and multi-Rees models for continuous multiview geometry
field: mathematics
tier: prose
statement: |-
  What is the proper algebraic formulation for a continuous multiview variety?
  \(\mathbb{P}^1 \times \mathbb{P}^3 \to (\mathbb{P}^2)^n\)?
  \(Hom(\mathbb{A}^1,\text{essential matrices})\)? Kontsevich spaces?
  Or could we use points and optical flow data?
