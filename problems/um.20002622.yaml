title: Weighted image-charge reduction for Green S-curves
field: mathematics
tier: prose
statement: |-
  **Green's potential**

  Existence theory for \(S\)-curves in a general sense, if the logarithmic potential is replaced by Green's potential.

  Nearby AIM records concern scalar \(S\)-curves and max--min problems. The most faithful precise formulation is therefore: for a planar Greenian domain \(D\), external field \(\phi\), and Hausdorff-topologized class \(\mathcal F\) of admissible compact continua, first minimize weighted Green energy over probability measures on each \(F\), then maximize the equilibrium energy over \(F\), and ask whether a maximizer exists and has the Green \(S\)-property. This report distinguishes that free-boundary problem from the classical fixed-compact problem.
