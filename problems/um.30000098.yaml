title: Schanuel Conjecture
field: mathematics
tier: prose
statement: If $x_1,\ldots,x_n\in\mathbb{C}$ are linearly independent over $\mathbb{Q}$, then $\operatorname{trdeg}_{\mathbb{Q}}\mathbb{Q}(x_1,\ldots,x_n,e^{x_1},\ldots,e^{x_n})\geq n$.
