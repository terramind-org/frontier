id: um.20002932
title: Overtwisted contact germs from first-kind lcs data
field: mathematics
tier: prose
statement: |-
  For an lcs manifold \((M^{2n},\Phi,\vartheta)\), where \(d\vartheta=0\), \(\Phi^n\neq0\), and
  \[
  d\Phi=\vartheta\wedge\Phi,
  \]
  find an overtwistedness notion that is intrinsic under the intended lcs equivalences. Compare a local embedded-model definition with a definition using an associated contact germ, and state any extra primitive, covering, or first-kind data needed to construct that germ.
