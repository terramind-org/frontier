title: Branko Grunbaum in Many Dimensions — Question 5
field: mathematics
tier: prose
statement: Can every object in $\mathbb{R}^4$ be partitioned into $16$ equal parts with $4$ hyperplanes? In particular, can every set of $16n$ points in general position in $\mathbb{R}^4$ be separated into $16$ subsets of $n$ points, using 4 hyperplanes?
