title: Generic endpoint mismatch between maximal stretch laminations and Teichmuller foliations
field: mathematics
tier: prose
statement: |-
  **Problem 2.12 (K. Rafi).** Given two points in Teichmüller space, do we have
  a comparison between the maximal stretch laminations (which define the
  concatenation of stretch segments) and the vertical (horizontal) foliations
  of quadratic differential for the Teichmüller geodesic connecting them?
  Minsky has studied the approximate behavior of high-energy harmonic maps
  when the domain surface is varied, and compared the harmonic maps (which are
  stretched along the Hopf foliation) with Teichmüller maps and stretch maps.
