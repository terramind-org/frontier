title: Question 2.1 — (Ends spectrum).
field: mathematics
tier: prose
statement: "(Ends spectrum). What are the possibile values of ends(Modg,H ) for finitely- generated subgroups H <Modg? It is well-known that the moduli space Mg has one end. The key point of the proof is that the complex of curves is connected. This proof actually gives more: any cover of Mg has one end; see, e.g., [ FMa]. However, I do not see how this fact directly gives information about Question 2.1. Commensurators. Asking for two subgroups of a group to be conjugate is often too restrictive a question. A more robust notion is that of commensurability. Subgroups Γ 1, Γ2 of a group H are commensurable if there exists h ∈ H such that hΓ1h−1∩ Γ2 has finite index in both hΓ1h−1 and in Γ 2. One then wants to classify subgroups up to commensurability; this is the natural equivalence relation one studies in order to coarsify the relation of “conjugate” to ignore finite index information. The primary commensurability invariant for subgroups Γ < H is the commensurator of Γ in H, denoted Comm H (Γ), defined as: CommH (Γ):= {h∈H:hΓh−1∩ Γ has finite index in both Γ and hΓh−1} The commensurator has most commonly been studied for discrete subgroups of Lie groups. One of the most striking results about commensurators, due to Margulis, states that if Γ is an irreducible lattice in a semisimple 2 Lie group H then [Comm H (Γ): Γ] = ∞ if and only if Γ is arithmetic. In other words, it is precisely the arithmetic lattices that have infinitely many “hidden symmetries”. 2By semisimple we will always mean linear semisimple with no compact factors. 16 B. Farb"
