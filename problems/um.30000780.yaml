title: Artin-Twist Parity for Elliptic Curves
field: mathematics
tier: prose
statement: Let $p\geq5$, let $E/F$ be an elliptic curve, put $F_\infty=F(E[p^\infty])$ and $G=\operatorname{Gal}(F_\infty/F)$, and let $\rho:G\to GL_{d_\rho}(\overline{\mathbb Q}_p)$ be an irreducible self-dual Artin representation. If $s(E,\rho)$ is the multiplicity of $\rho$ in the Pontryagin dual of the Selmer group over a finite field through which $\rho$ factors, is $$w(E,\rho)=(-1)^{s(E,\rho)}$$?
