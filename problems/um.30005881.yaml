title: Babai’s Polylogarithmic Diameter Conjecture
field: mathematics
tier: prose
statement: If finite simple groups satisfy a diameter bound with exponent $c$, does there exist $c'(c)$ such that $\operatorname{diam}_{\mathrm{worst}}(G)\leq(\log|G|)^{c'(c)}$?
