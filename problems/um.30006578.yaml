title: Algebraic Effective-Period Complex Conjecture
field: mathematics
tier: prose
statement: Let $D=\{z\in\mathbb C:\lvert z\rvert\leq1\}$, and let $\widetilde{\Omega}_{\infty-\bullet}^{\mathrm{alg}}(D_\infty)$ be the boundary-vanishing complex of codegree forms on $D_\infty$ whose coefficients are holomorphic near the closed polydiscs and algebraic over $\mathbb Q(z_1,z_2,\ldots)$. Is this complex acyclic outside degree zero, and is the formal integration map $H_0\!\left(\widetilde{\Omega}_{\infty-\bullet}^{\mathrm{alg}}(D_\infty)\right)\to\mathbb C$ injective?
