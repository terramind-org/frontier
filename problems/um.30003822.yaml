title: Catalan-Power Divisibility of a Set-Partition Transition Determinant
field: mathematics
tier: prose
statement: Let $A=(a_{ij})_{1\leq i,j\leq n}$. For set partitions $P$ of $X=\{x_1,\ldots,x_n\}$ and $Q$ of $Y=\{y_1,\ldots,y_n\}$, call a set $S$ of edges $x_i y_j$ a transition from $P$ to $Q$ if adjoining $S$ to spanning trees on the blocks of $P$ produces a spanning forest of $X\cup Y$ in which every component meets $Y$ and the induced partition of $Y$ is $Q$. Give $S$ weight $\prod_{x_i y_j\in S}a_{ij}$, and define the Bell-number-sized matrix $T$ by letting $T_{P,Q}$ be the sum of the weights of all transitions from $P$ to $Q$. Is $(\det A)^{C_n}$ always a factor of $\det T$, where $$C_n=\frac{1}{n+1}\binom{2n}{n}$$ is the $n$-th Catalan number?
