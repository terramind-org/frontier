title: The solid-torus quantum handlebody ideal
field: mathematics
tier: prose
statement: |-
  Let $\Sigma, H$ as above.

  i) $\mathcal{O}(\mathcal{M}_{B})\xrightarrow{def. quant.}\mathcal{A}_{q}$

  ii) $\mathcal{L}\subset\mathcal{M}_{B}\Rightarrow \mathcal{I_{L}}\subset\mathcal{O}
  $(\mathcal{M}_{B})\xrightarrow{def. quant.}\mathcal{I_{L}^{q}}<\mathcal{A}_{q}$ (left ideal)

  iii) $\mathcal{I_{L}^{q}}$ acts on $H^{0}(\mathbb{L}^{k},Bun_{G}(\Sigma))$ and this algebra annihilates $v_{H}\in H^{0}(\mathbb{L}^{k},Bun_{G}(\Sigma))$.

  Therefore the following reconstruction is explicit rather than silently substituted.

  * $\Sigma=\partial H$ is a closed oriented surface and $H$ is a handlebody.
  * $\mathcal M_B(\Sigma,G)=\operatorname{Hom}(\pi_1\Sigma,G)//G$ is the Betti character variety.
  * $\mathcal L_H\subset\mathcal M_B(\Sigma,G)$ is the locus of boundary local systems that extend over $H$.
  * One seeks a deformation quantization $\mathcal A_q$ of $\mathcal O(\mathcal M_B)$ and a quantum **left** ideal $\mathcal I_H^q$ deforming the classical vanishing ideal $\mathcal I_H$.
  * Under the quantum algebra action on the level-$k$ state space, normally written $H^0(Bun_G(\Sigma),\mathbb L^k)$, the ideal should annihilate the handlebody state $v_H$.

  This report proves that program in the smallest nontrivial case: $G=\mathrm{SL}_2(\mathbb C)$ and $H=S^1\times D^2$. It also states carefully what transfers to a root-of-unity TQFT state and what remains unproved about the holomorphic-section realization.
