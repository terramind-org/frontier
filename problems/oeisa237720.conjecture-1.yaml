  definitions:
    - name: OeisA237720.a
      kind: def
      text: |-
        /-- $a(n)$ is the number of primes $p \le \lfloor (n+1)/2 \rfloor$ with $\lfloor\sqrt{n-p}\rfloor$
        prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ p ∈ Finset.Icc 1 ((n + 1) / 2),
            if p.Prime ∧ (Nat.sqrt (n - p)).Prime then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/237720.lean#L34
