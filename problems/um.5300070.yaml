id: um.5300070
title: Degenerate-flow limits of bad Newton polynomials
field: mathematics
tier: prose
statement: Call a polynomial bad if its Newton map has an attracting cycle that is not a root. Prove that every bad degree-$d$ polynomial $f_1$ belongs to a one-parameter family $f_h$, $0<h\le1$, bad for the relaxed Newton maps $N_{h,f_h}(z)=z-hf_h(z)/f_h'(z)$, such that as $h\to0$ the Newton flows tend to a degenerate flow.
