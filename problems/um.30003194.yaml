title: Dense Frobenius Eigenvectors in Completed Enveloping Algebras
field: mathematics
tier: prose
statement: |-
  Let $X$ be a variety over a finite field $k$, let $\ell$ be a prime, and let $I$ be the augmentation ideal in $\mathbb Z_\ell[[\pi_1^{\mathrm{\acute et},\ell}(X_{\overline k},\overline x)]]$. Assume $I^n/I^{n+1}$ is torsion-free for every $n$. Does there exist $r>0$ such that the convergent group algebra

  $$\mathbb Q_\ell[[\pi_1^{\mathrm{\acute et},\ell}(X_{\overline k},\overline x)]]^{\leq\ell^{-r}}$$

  admits Frobenius eigenvectors whose span is dense?
