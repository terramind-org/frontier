statement: For a toric degeneration parameter space $Z$ with discriminant $D$, does the rational homotopy type of $Z\setminus D$ determine the gaps in the category spectrum, and do the big loops in $\pi_1(Z\setminus D)$ determine wall-crossings of the category?
