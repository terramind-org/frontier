title: The surviving arboreal tree at a degree-drop boundary
field: mathematics
tier: prose
statement: |-
  1. (Want to look at a curve in \(M_2\)). For
  \[
  f(z)=\frac{z^2-1}{z^2-c},
  \]
  there is a collection of PCF maps which approach \(c=1\) on the curve. Compare the arboreal representation for \(f\) to the representation of the limit map.
  2. More generally, how do these representations behave as you deform to the boundary?
