title: Independent Sets in Pseudorandom Regular Graphs
field: mathematics
tier: prose
statement: |-
  Does there exist an absolute constant $C>0$ such that every $(n,d,\lambda)$-graph with $\lambda>(\log n)^2$ has at most

  $$\left(\frac{4e^2\lambda}{\log n}\right)^t$$

  independent sets of size $t=Cn\log n/(d+1)$?
