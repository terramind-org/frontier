  \item[\hypertarget{source:statement:2}{S2}] W. K. Hayman and E. F. Lingham, \emph{Research Problems in Function Theory} (2018), Chapter7, Problem7.26 and its complete update. \url{https://arxiv.org/abs/1809.07200}.
