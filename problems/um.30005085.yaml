title: Finkelberg–Mirković Equivalence in Modular Geometric Satake
field: mathematics
tier: prose
statement: |-
  Let $k$ have characteristic $p$, let $G$ be reductive with Weyl group $W$, and let $\operatorname{Rep}^{\mathrm{ext}}_0(G_k^\vee)$ be the Serre subcategory generated by the modules $L(\lambda)$ for $\lambda\in W\mathbin{\cdot}0\cap X^+$. Does an equivalence
  $$
  Q:\operatorname{Perv}_{\mathrm{Iw}}(\operatorname{Gr}_G,k)\longrightarrow\operatorname{Rep}^{\mathrm{ext}}_0(G_k^\vee)
  $$
  exist that geometrically realizes Frobenius twist?
