id: um.30004592
title: Percolation Thresholds During Planar Majority Dynamics
field: mathematics
tier: prose
statement: For majority dynamics on $\mathbb{Z}^2$ with i.i.d. Bernoulli-$p$ initial opinions, let $p_c(t)$ be the critical probability for an infinite opinion-1 cluster at time $t$. Is $p_c(t)$ strictly decreasing in $t$? Is $t\mapsto p_c(t)$ continuous at $\infty$, and is $p_c(\infty)=1/2$? For the hexagonal lattice, is $p_c(t)=1/2$ for every $t$, and are there exceptional times?
