id: um.30002206
title: Convergence Criteria for Hardy-Field Multiple Ergodic Averages
field: mathematics
tier: prose
statement: |-
  Let $T$ be a measure-preserving transformation, let $f_1,\ldots,f_k\in L^\infty$, and let $a_1,\ldots,a_k$ be functions in a common Hardy field with polynomial growth. Consider
  $$\frac1N\sum_{n=1}^N T^{\lfloor a_1(n)\rfloor}f_1\cdots T^{\lfloor a_k(n)\rfloor}f_k.$$
  Do these averages converge if and only if every nonzero $a\in\operatorname{span}(a_1,\ldots,a_k)$ satisfies at least one of the following: $|a(t)-cp(t)|\succ\log t$ for every $c\in\mathbb R$ and $p\in\mathbb Z[t]$; $a(t)-cp(t)\to d$ for some $c,d\in\mathbb R$ and $p\in\mathbb Z[t]$; or $|a(t)-t/m|\ll\log t$ for some $m\in\mathbb Z$?
