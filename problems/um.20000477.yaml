title: Real-linear small-norm criteria for conjugate dbar and additive jump problems
field: mathematics
tier: prose
statement: |-
  For planar orthogonal polynomials, we know that
  \[
  \overline{\partial}Y=\overline Y
  \begin{bmatrix}0&w\\0&0\end{bmatrix}
  \]
  and
  \[
  \int p_j\overline{p_k}w\,dA=h_j\delta_{j,k}.
  \]
  Is there an analogue of small norm theory of such \(\overline\partial\)-problems (i.e.
  \(\overline\partial A=\overline A W+AV\)?) Or small norm theory for
  \(A_+-A_-=\overline{A_-}V_C+A_-V_n\)?
