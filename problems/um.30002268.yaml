title: Reed’s Chromatic Number Conjecture
field: mathematics
tier: prose
statement: |-
  Does every graph $G$ satisfy Reed's conjectured bound? Specifically, must

  $$\chi(G)\leq\left\lceil\frac12\bigl(\Delta(G)+1+\omega(G)\bigr)\right\rceil$$

  hold?
