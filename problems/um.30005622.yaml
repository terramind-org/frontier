title: Third Neumann Eigenvalue Maximization Under Curvature Bounds
field: mathematics
tier: prose
statement: Among simply connected surfaces with curvature bounded above by $K$, prove that the third Neumann eigenvalue is maximized by a disjoint union of two constant-curvature-$K$ disks when $K\neq 0$.
