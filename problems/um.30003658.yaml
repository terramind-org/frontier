title: Fixed Complexity Separations in Bounded Arithmetic
field: mathematics
tier: prose
statement: Is there a fixed $k$ such that $T_{2n+1}(\alpha)$ can be separated from $T_{2n}(\alpha)$ by a $\forall\Sigma_k^b(\alpha)$ sentence? In particular, is there a $\forall\Sigma_1^b(\alpha)$ sentence provable in some $T_{2n}(\alpha)$ but not in $\mathrm{APC}_2(\alpha)$?
