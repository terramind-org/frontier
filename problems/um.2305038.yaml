statement: "Tao-Shing Shah has shown that if $g(z)\\prec f(z)$ in $\\mathbb{D}$, $g'(0)/f'(0)$ is real, and $f$ in $S$ then $$ |g(z)|\\leq|f(z)|\\text{ for }|z|\\leq\\frac{1}{2}(3-\\sqrt{5}), $$ $$ |g'(z)|\\leq|f'(z)|\\text{ for }|z|\\leq3-\\sqrt{8}. $$ Both constants are `best-possible'. Shah's proofs are technically very involved and it would be nice to have simpler proofs. Goluzin gave simpler proofs but with worse constants in each case. His methods appear to be incapable of yielding ([source label: C5.1]) and ([source label: C5.2]). (P. L. Duren)"
