lean:
  module: FormalConjectures.ErdosProblems.«10»
  decl: Erdos10.erdos_10
  statement: "theorem erdos_10 : ∃ k, ∀ᶠ n : ℕ in atTop, n ∈ sumPrimeAndTwoPows k"
  context:
    - open Erdos10
    - open Filter
  definitions:
    - name: Erdos10.sumPrimeAndTwoPows
      kind: abbrev
      text: |-
        /--
        The set of natural numbers that can be written as a sum
        of a prime and at most $k$ powers of $2$.
        -/
        abbrev sumPrimeAndTwoPows (k : ℕ) : Set ℕ :=
          { p + (pows.map (2 ^ ·)).sum | (p : ℕ) (pows : Multiset ℕ) (_ : p.Prime)
            (_ : pows.card ≤ k)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/ErdosProblems/10.lean#L38
