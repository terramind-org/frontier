title: Definable Maximal Almost Disjoint Families
field: mathematics
tier: prose
statement: Are $a_{\mathrm{Borel}}=a_{\mathrm{closed}}$ and $a_{\mathrm{Borel}}>\mathfrak b$ consistent? Is it consistent that $\mathfrak b>\aleph_1$ and there is a $\Pi^1_1$ mad family? Is the existence of a $\Pi^1_1$ mad family equivalent to that of a $\Sigma^1_2$ mad family? Does the Ramsey property for $\Sigma^1_2$ sets imply that there is no $\Sigma^1_2$ mad family?
