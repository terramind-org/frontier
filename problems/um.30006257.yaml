title: Centers of Small Quantum Groups
field: mathematics
tier: prose
statement: Let $W_P\subseteq W$ be the stabilizer of a weight $\lambda$, and let $DR_W^{W_P}$ be the canonical quotient of the diagonal coinvariant algebra. Is the $G$-invariant part $z_\lambda^G$ of the corresponding block of the small-quantum-group center isomorphic to $DR_W^{W_P}$ as a bigraded vector space?
