lean:
  module: FormalConjectures.OEIS.«167918»
  decl: OeisA167918.conjecture1
  statement: |-
    theorem conjecture1 (M : ℕ) :
        ∃ n : ℕ, n ≥ M ∧ n > 0 ∧ S (a n) = 2 * S n
  context:
    - open OeisA167918
  definitions:
    - name: OeisA167918.S
      kind: def
      text: |-
        /-- $S(i) = p_i + p_{i+1}$. -/
        noncomputable def S (i : ℕ) : ℕ := P i + P (i + 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/167918.lean#L33
    - name: OeisA167918.a
      kind: def
      text: |-
        /-- Smallest index $k > n$ such that $S(n) \mid S(k)$. -/
        noncomputable def a (n : ℕ) : ℕ :=
          if n = 0 then 0
          else sInf { k : ℕ | k > n ∧ S n ∣ S k }
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/167918.lean#L36
