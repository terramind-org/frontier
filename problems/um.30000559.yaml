title: Entropy Spectra of Maximal-Rank Abelian Actions
field: mathematics
tier: prose
statement: Let $\alpha$ be a $C^{1+\varepsilon}$ action of $\mathbb Z^k$ on a $(k+1)$-manifold with an ergodic invariant measure, no proportional Lyapunov exponents, and at least one element of positive entropy. What values can the entropies of elements of $\alpha$ take? Are they algebraic integers of degree at most $k+1$?
