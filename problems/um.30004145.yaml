title: Embedding Spaces of Divisors on Real Cubics
field: mathematics
tier: prose
statement: Let $X$ be a plane projective $M$-curve of degree $3$, and let $A$ be a transverse real divisor of degree $9$. Is $\pi_1(\operatorname{Emb}(A,X))$ trivial, and how does the answer depend on the distribution of $A$ among the connected components of $X(\mathbb R)$?
