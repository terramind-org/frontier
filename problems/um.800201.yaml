title: Holomorphic Symplectic Geometry — Conjecture 10
field: mathematics
tier: prose
statement: Let $D_1,\ldots ,D_k$ in $\operatorname{Pic}(X)$, and let $z\in CH(X)$ be a class which is a polynomial in $D_1,\ldots ,D_k$ and the Chern classes $c_i(X)$. If $z=0$ in $H^*(X,\mathbb{Z})$, then $z=0$.
