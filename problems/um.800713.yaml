title: Open Problems on Central Simple Algebras — Conjecture 27 (BSD Conjecture)
field: mathematics
tier: prose
statement: |-
  Let $K$ be a global field of characteristic $p$, $A$ an abelian
  $K$-variety, and $L^*(A,s)$ the $L$-function of $A$ with respect to a
  suitably normalized Tamagawa measure. Then $L^*(A,s)$ has an analytic
  continuation to the complex plane and
  $$
  \lim_{s\to 1} \frac{L^*(A,s)}{(s-1)^{r}} = \frac{|\mathrm{III}(A)|
  |\det(h_A)|}{|A(K)_{\mathrm{tors}}| |\hat{A}(K)_{\mathrm{tors}}|}
  $$
  where $h_A$ is the N\'eron--Tate height pairing on $A(K)$ modulo
  torsion, $\hat{A}$ is the dual abelian variety, and $r = \operatorname{rank}_{{\mathbb{Z}}}A(K)$
  is the rank of the Mordell--Weil group.
