title: Unstable Motivic Homotopy Exact-Sequence Conjecture
field: mathematics
tier: prose
statement: |-
  For every $n\geq 4$, is there an exact sequence of strictly $\mathbb A^1$-invariant sheaves

  $$K^M_{n+2}/24\longrightarrow \pi_n^{\mathbb A^1}(\mathbb A^n\setminus\{0\})\longrightarrow GW_{n+1}^n,$$

  which becomes short exact after $n$-fold contraction?
