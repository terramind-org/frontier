title: Definable valuations on the anisotropic real conic
field: mathematics
tier: prose
statement: |-
  **Question 26 (Moret-Bailly).** Is there a nontrivial valuation ring
  \[
  R\subset \operatorname{Frac}\!\left(
        \frac{\mathbb R[x,y]}{(x^2+y^2+1)}
                          \right)
  \]
  which is definable? Same question for “semi-local ring” (finite intersection
  of valuation rings) instead of “valuation ring”? This is equivalent with the
  problem for valuation rings.
