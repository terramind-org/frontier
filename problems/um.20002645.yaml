title: A finite-window Burke identity and quenched obstruction for a marked Brownian--Poisson polymer
field: mathematics
tier: prose
statement: |-
  **Exact solvability**

  Motivated by success in solvable positive temperature polymers, try to study the polynuclear growth model with an underlying Brownian path measure -- is there a Burkes theorem in this setting? Specifically, study the Poissonian last passage model but at positive temperature and with the Poisson points having random weights.
