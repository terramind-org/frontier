statement: |-
  % UnsolvedMath ID 9400172; source catalogue code AMR-093-0172
  \setcounter{section}{9400171}
  \section{\texorpdfstring{For any given integer a > 0, are there infinitely many primes p such that a\textasciicircum{}\{p − 1\} $\equiv$ 1 (mod p\textasciicircum{}\{2\})}{For any given integer a > 0, are there infinitely many primes p such that a\textasciicircum{}\{p − 1\} congruent to 1 (mod p\textasciicircum{}\{2\})}}\label{9400172}
  {\small\sffamily UnsolvedMath ID 9400172 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Fix an integer $a>0$. A prime $p$ satisfies the base-$a$ Wieferich condition when $a^{p-1}\equiv1\pmod{p^2}$. The congruence itself excludes primes dividing $a$. For $a=1$ it holds for every prime.
  \paragraph{Statement recorded in the supplied source.}
  For every fixed integer $a>0$, are there infinitely many primes $p$ with $a^{p-1}\equiv1\pmod{p^2}$? \sref{9400172}{2}
  \subsection{Short English statement}
  Does every positive integer base have infinitely many Wieferich primes? The base one case holds for all primes.
