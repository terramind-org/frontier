schema: 1
id: artinprimitiverootsconjecture.artin-primitive-roots.parts.ii
title: Artin's conjecture on primitive roots (ii)
field: mathematics
tier: proof
statement: |-
  **Artin's Conjecture on Primitive Roots**, second half.
  Write $a = a_0 b^2$ where $a_0$ is squarefree. Under the conditions that $a$ is not a perfect
  power and $a_0\not\equiv 1\pmod{4}$ (sequence A85397 in the OEIS), the density of the set
  $S(a)$ of primes $p$ such that $a$ is a primitive root modulo $p$ is independent of $a$ and
  equals Artin's constant.
ams:
  - 11
tags:
  - wikipedia
references:
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Artin%27s_conjecture_on_primitive_roots
  - label: A85397
    url: https://oeis.org/A85397
  - label: LMS14
    url: https://arxiv.org/pdf/1112.4816
