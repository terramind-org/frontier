id: um.30002470
title: Spanning Near-Squares of Odd Cycles
field: mathematics
tier: prose
statement: For every odd $n\geq7$, does every $n$-vertex graph with minimum degree at least $\lceil n/2\rceil$ contain a spanning graph formed from the square of an $n$-cycle by deleting alternate peripheral edges until exactly three consecutive vertices have degree $4$ and the remaining $n-3$ vertices have degree $3$?
