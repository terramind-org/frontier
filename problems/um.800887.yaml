title: Open Problems in Pluripotential Theory — Question 18
field: mathematics
tier: prose
statement: |-
  If the form $\omega$ is merely semi-positive and big (i.e. $\int_X\omega^n>0$) then solutions to the Monge-Amp\`ere equations with $L^p$- right hand sides are continuous as shown in [EGZ11] by using viscosity techniques (solutions are then unique up to an additive constant). Further regularity is then largely open. In particular the following is an important problem:

  [Eyssidieux-Guedj-Zeriahi]
  Assume $\omega$ is merely semi-positive and big and
  $$
  (\omega+dd^c \varphi)^n=f dV,\ f\in L^p,\ p>1.
  $$

  Is $\varphi$ H\"older continuous on $X$ ?
