title: Cubulation of Hyperbolic Surface-by-Free Groups
field: mathematics
tier: prose
statement: If $1\to\pi_1(S)\to G\to Q\to1$ is exact, $S$ is a closed surface of genus greater than one, $G$ is hyperbolic, and $Q$ is finitely generated free, is $G$ cubulable, meaning that it acts freely, properly, and cocompactly on a $\operatorname{CAT}(0)$ cube complex?
