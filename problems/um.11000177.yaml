title: Problem 3.6 — Study the double coset HφH inM, using new finite or infinite quotients of M.
field: mathematics
tier: prose
statement: "Study the double coset HφH inM, using new finite or infinite quotients of M. In this regard we stress finite, because a principle diﬃculty when this project was attempted earlier was in recognizing the image of H in infinite quotients of M, however if the quotient is finite and not too big, it suﬃces to know generators of H⊂M. Since a presentation for H was found by Waynryb in [51], we can compute the associated subgroup. Some of the open questions which might be revealed in a new light are: (1) How many times must one stabilize before two inequivalent Heegaard splittings become equivalent? (2) How can we tell whether a Heegaard splitting is not of minimal genus? (3) How can we tell whether a Heegaard splitting is stabilized? (4) Are any of the representations that we noted earlier useful in answering (1), (2) or (3) above? While we have stressed the search for good working quotients of Mg, we should not forget that in the case of homology spheres, we have already pointed out that any homology sphere may be defined by a Heegaard splitting with the Heegaard glueing map (now redefined with a new ‘base point’ ) ranging over Ig. Even more, as was proved earlier, Morita has shown in [ 36] that it suﬃces to let the glueing map range over Kg. This leads us to ask:"
