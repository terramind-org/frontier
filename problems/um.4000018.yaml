title: L2 Bonnet–Myers and dimension
field: mathematics
tier: prose
statement: Under the strengthened transport estimate $$T_1(m_x^{*t},m_{x'}^{*t'})\leq e^{-\kappa\min(t,t')}d(x,x')+C\frac{(\sqrt t-\sqrt{t'})^2}{2d(x,x')},$$ the diameter is at most $\pi\sqrt{C/(2\kappa)}$. Is $C$ intrinsically related to a dimension, in particular to the parameter $n$ in the Bakry–Émery condition $CD(K,n)$?
