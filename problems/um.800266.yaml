title: Several Complex Variables Problem List — Problem 65
field: mathematics
tier: prose
statement: |-
  The Fatou Set of a Polynomial Automorphism of $\mathbb{C}^2$.
  Let $f$ be a polynomial automorphism of $\mathbb{C}^2$, and suppose that $f$ is
  not conjugate to an elementary map. Let $\Omega$ be a connected component of
  the set of points where the forward iterates $\lbrace f^n:n=1,2,3,...\rbrace $
  are locally bounded, which is the Fatou set of $f$. Let us suppose that
  $\Omega$
  is periodic, i.e. $f^n\Omega=\Omega$ for some $n\ne0$.
  Let us first consider the case in which $\Omega$ is recurrent, i.e. $\Omega$
  contains a point whose orbit does not converge to $\partial\Omega$. In
  this case $\Omega$ is either (a) a basin of attraction of a sink orbit, (b) the
  basin of attractin of a Siegel disk, or (c) the basin of a Herman ring. It is
  not hard to construct examples of (a) and (b).\\
  (i) Can case (c) occur?
  Nothing at all seems to be known about periodic domains which are not
  recurrent.\\
  (ii) If $\Omega$ is not recurrent, does there exist
  $P\in\partial\Omega$ such that $\lim_{k\to\infty}f^{nk}(Q)=P$ for all
  $Q\in\Omega$?\\
  (iii) If $\Omega$ is not recurrent, does there exist
  $P\in\partial\Omega$ such that $f^nP=P$, and one of the eigenvalues of $DF(P)$
  is $e^{2\pi ip/q}$?\\
  -E. Bedford, bedford@iubacs.bitnet or bedford@ucs.indiana.edu.
