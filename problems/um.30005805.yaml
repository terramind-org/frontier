title: Simultaneous Embeddings of Random Planar Graphs
field: mathematics
tier: prose
statement: Let $\mathcal T_n$ be the family of labeled stacked triangulations obtained by starting from $K_4$ on vertices $v_1,\ldots,v_4$ and, for each $i=4,\ldots,n-1$, inserting $v_{i+1}$ into one of the current $2i-4$ triangular faces and joining it to that face's three vertices. If $G_1,G_2$ are sampled independently and uniformly from $\mathcal T_n$, what is the probability, for large $n$, that some $n$-point set in the plane supports crossing-free straight-line embeddings of both graphs?
