title: Stein fillability, augmentation, and the curvature defect of cylindrical contact homology
field: mathematics
tier: prose
statement: "Conjecture: for any Stein fillable contact manifold, the cylindrical contact homology is defined. (As some have used it in the past, CCH is defined if there exists a contact form with no contractible Reeb orbits of certain Maslov indices. If such a form exists, then any two such forms give the same CCH. For this conjecture, one might not be able to eliminate bad contractible orbits, but one could hope that one can make them somehow “algebraically cancel”.) If so, then counting pairs of pants etc. gives operations on the CCH, as in Floer theory of symplectomorphisms."
