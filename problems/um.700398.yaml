title: Kourovka Notebook Problem 6.56
field: mathematics
tier: prose
statement: |-
  Let $G=F\cdot \left< a\right>$ be a Frobenius group with the
  complement $\left< a\right> $ of prime order.

  a) Is $G$ locally finite if it is binary finite?

  b) Is the kernel $F$ locally finite if the
  groups $\left< a, a^g\right> $ are finite for all $g \in G$?
