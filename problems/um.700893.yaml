title: Kourovka Notebook Problem 12.75
field: mathematics
tier: prose
statement: |-
  (B. Jonsson). Is the class $N$ of the lattices
  of normal subgroups of groups a variety? It is proved
  (C. Herrman,
  W. Poguntke, *Algebra Univers.*,
  **4**, no. 3 (1974), 280--286) that $N$ is an infinitely based
  quasivariety.
