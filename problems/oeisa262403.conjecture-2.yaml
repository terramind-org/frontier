lean:
  module: FormalConjectures.OEIS.«262403»
  decl: OeisA262403.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 4 < n) :
        a n = 1 ↔ n ∈ singletons
  context:
    - open OeisA262403
  definitions:
    - name: OeisA262403.a
      kind: def
      text: |-
        /--
        Number of ways to write $\pi(T(n)) = \pi(T(k)) + \pi(T(m))$ with $1 < k < m < n$.
        -/
        def a (n : ℕ) : ℕ :=
          let target := primeCountTriangular n
          ∑ k ∈ Finset.Icc 2 (n - 2),
            ((Finset.Icc (k + 1) (n - 1)).filter (fun m =>
              target = primeCountTriangular k + primeCountTriangular m)).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/262403.lean#L41
    - name: OeisA262403.singletons
      kind: def
      text: |-
        /-- The set of exceptional integers $n > 4$ for which $a(n) = 1$. -/
        def singletons : Finset ℕ :=
          {5, 6, 7, 10, 12, 32, 38, 445, 727}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/262403.lean#L68
