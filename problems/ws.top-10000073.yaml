  \section{Absence of bigeodesics in first-passage percolation}\label{10000073}
  {\small UnsolvedMath ID 10000073 · Probability}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Prove that natural i.i.d. first-passage-percolation models on $\mathbb{Z}^d$, including exponential edge lengths, almost surely contain no two-sided infinite geodesic.
  \par\smallskip\textit{Formulation references:} \sref{10000073}{1}, \sref{10000073}{2}, \sref{10000073}{3}.
  \subsection{Short English statement}
  Prove that natural i.i.d. first-passage-percolation models on $\mathbb{Z}^d$, including exponential edge lengths, almost surely contain no two-sided infinite geodesic.
