title: Duality, epipoles, and a Segre cubic from four correspondences
field: mathematics
tier: prose
statement: |-
  For any of the standard varieties considered it might be possible to study
  the projective dual. What can we learn from studying these objects?

  Source: <http://aimpl.org/algvision/2/>. The live page was checked on
  2026-07-23; it has exactly this wording and no status, introduction, or
  remarks.

  “The standard varieties” is not enumerated on that page. Nearby records in
  the preceding “Reconstruction” section explicitly mention the essential
  variety, the trifocal tensor variety, the fundamental matrix, and the Hurwitz
  form of the essential variety. I therefore interpret the prompt as a program
  for such camera and tensor varieties, not as a request about every projective
  variety.

  To obtain a rigorous result rather than a broad catalogue, this report focuses
  on the uncalibrated two-view **fundamental-matrix variety**
  \[
  X=\{[F]\in\mathbb P(\operatorname{Mat}_{3\times3}(\mathbb C)):
  \det F=0\}\subset\mathbb P^8. \]
  Its projective dual can be determined completely. More importantly, its dual
  points are exactly the rank-one coefficient matrices of point-correspondence
  constraints. This leads to an explicit theorem: four point correspondences
  that form projective frames cut \(X\) in a Segre cubic threefold with ten
  ordinary double points, split canonically into six rank-one inherited nodes
  and four rank-two dual-contact nodes.

  This is a developed special case and not a solution of the entire open-ended
  program for essential, trifocal, quadrifocal, and multiview varieties.
