title: Whittaker-Normalized Functors for Reductive Groups
field: mathematics
tier: prose
statement: |-
  For every reductive triple $(G,B,T)$ with Whittaker datum $\psi$, does there exist a fully faithful $Z_G$-linear functor
  $$
  R_G^\psi:D^+(\operatorname{Rep}_{[T,1]}G)\longrightarrow D^+\operatorname{QCoh}([\mathcal X_{\check G}/\check G])
  $$
  that is compatible with parabolic induction for every $B\subset P\subset G$, agrees with the canonical equivalence in the torus case, and sends the compactly induced Whittaker object to the structure sheaf?
