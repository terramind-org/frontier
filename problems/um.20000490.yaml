title: The spectral Mahler functional on the planar cube orbit
field: mathematics
tier: prose
statement: |-
  A hypercube in \(\mathbb R^n\) is an attainer for
  \[
  \sup_{K\in\mathcal K^n_\star}\
  \inf_{T\in\mathsf{GL}_n}
  \lambda _1(TK)\lambda _1((TK)^\circ).
  \]

  Harrell and its status note.

  Let \(\mathcal K^n_\star\) denote the centrally symmetric bounded convex domains in \(\mathbb R^n\), and for \(K\in\mathcal K^n_\star\) let
  \[
   K^\circ=\{x\in\mathbb R^n:x\mathbin\cdot y\leq 1\text{ for every }y\in K\}. \]
  Writing \(\lambda _1(\Omega)\) for the first Dirichlet eigenvalue of \(-\Delta\) on the interior of \(\Omega\), the conjecture is:

  Central symmetry forces the center to be the origin in this formulation. We harmlessly identify a bounded convex domain with its closure when taking the polar; its Dirichlet eigenvalue is that of its interior. No corruption of the mathematical statement was found.
