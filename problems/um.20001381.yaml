title: Functorial operations on arboreal representations
field: mathematics
tier: prose
statement: Define a category containing the rooted inverse-image Galois actions attached to pointed finite dynamical systems $(X,f,\alpha)$. Determine which standard operations on these actions are induced by coordinate conjugacy, semiconjugacy, iteration, extension of the ground field, and products of dynamical systems; identify exact obstructions to treating these operations as unrestricted operations on abstract tree representations.
