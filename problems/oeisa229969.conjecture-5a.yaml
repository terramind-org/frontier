id: oeisa229969.conjecture-5a
title: Ways to write $n = x + y + z$ with six linear and quadratic forms prime (conjecture_5a)
field: mathematics
tier: proof
statement: |-
  Conjecture (iii), part 1: Every integer $n > 5$ can be written as $x + y + z$ ($x, y, z > 0$) with
  $xy-1, xz-1, yz-1$ all prime and $x$ among $2, 6, 10$.
  - _Zhi-Wei Sun_
