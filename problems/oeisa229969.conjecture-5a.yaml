lean:
  module: FormalConjectures.OEIS.«229969»
  decl: OeisA229969.conjecture_5a
  statement: |-
    theorem conjecture_5a (n : ℕ) (hn : n > 5) :
        ∃ x y z : ℕ, 0 < x ∧ 0 < y ∧ 0 < z ∧ x + y + z = n ∧
          x ∈ ({2, 6, 10} : Finset ℕ) ∧
          (x * y - 1).Prime ∧ (x * z - 1).Prime ∧ (y * z - 1).Prime
  context:
    - open OeisA229969
  definitions: []
