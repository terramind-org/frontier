title: Nonpolishability and Borel Reducibility of Orbit Relations
field: mathematics
tier: prose
statement: For a Borel group $H$, is nonpolishability equivalent to the existence of a Polish $H$-space $X$ such that $E_1$ Borel-reduces to $E_H^X$? Here $E_1$ is eventual equality on sequences in $2^{\mathbb{N}}$.
