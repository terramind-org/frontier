  \section{Formal Verification of AI-Generated Mathematical Proofs}\label{30006437}
  {\small\sffamily UnsolvedMath ID 30006437 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A formal proof assistant checks expressions and inference steps against an explicit type theory or logic. Autoformalization translates mathematical text into that formal language; successful type checking alone does not establish that the translation expresses the intended prose assertion.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The source requests a verification workflow. No formal input language, completeness, semantic-preservation criterion, or complexity target is supplied.

  Source-record limitation: This is proof-verification workflow design, without a formal completeness, soundness, or complexity target.
  \paragraph{Statement recorded in the supplied source.}
  Develop a reliable workflow that translates AI-generated mathematical arguments into Lean, checks every inferential detail, and diagnoses gaps rather than accepting persuasive but invalid prose. Determine how much of this verification and repair process can itself be automated. \sref{30006437}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-22.
  \subsection{Short English statement}
  Automate rigorous translation and checking of AI-generated mathematical arguments.
