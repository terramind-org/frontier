title: Measure of Rational-Direction Geodesics on Finsler Tori
field: mathematics
tier: prose
statement: |-
  For a zero-topological-entropy Finsler metric on $T^2$, is
  $$
  \mu_L\left(\bigcup_{\substack{\xi\in S^1\\ \xi\text{ rational}}}E_\xi\right)<\mu_L(ST^2),
  $$
  where $\mu_L$ is Liouville measure and $E_\xi$ is the set of geodesics with rational asymptotic direction $\xi$?
