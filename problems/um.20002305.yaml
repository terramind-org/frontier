title: Effective presentations of interpreted groups and a constant-fiber no-jump criterion
field: mathematics
tier: prose
statement: |-
  The original AIM problem list places Question 3 in the following section:

  The next two questions ask conversely for a presentation of \(M\) from \(G\), and then discuss a three-to-one map from a strongly minimal group \((M,\oplus)\) to \((\mathbb Q,+)\). This confirms that “presentation” is meant in the computable-model-theoretic sense and that finite covers/quotients are central.

  The wording is intentionally qualitative and omits three choices that materially change the answer:

  1. whether an interpretation scheme (domain, quotient equality, and group-law formulas) is supplied or must be discovered;
  2. whether its finite parameter tuple is supplied or must be selected uniformly from a copy of \(M\);
  3. whether “in terms of” asks only for some copy of \(G\), or for a uniform quotient map/functor compatible with copies and isomorphisms.

  This report makes those choices explicit rather than silently replacing the question by one formalization.
