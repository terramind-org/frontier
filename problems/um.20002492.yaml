title: Flat-germ obstruction to large minimal periods and genuine quasi-periodicity
field: mathematics
tier: prose
statement: |-
  **36. (Massimiliano Berti)** For a nonlinear wave equation
  \[
  u_{tt}-u_{xx}=f(u),\qquad f(0)=f'(0)=0,
  \]
  with Dirichlet boundary conditions and general nonlinearity there exist a large number of small-amplitude periodic orbits with fixed period. Could one find small-amplitude periodic orbits of large period and quasi-periodic solutions for the wave equation?
