lean:
  module: FormalConjectures.ErdosProblems.«979»
  decl: Erdos979.erdos_979
  statement: |-
    theorem erdos_979 :
        ∀ k ≥ 2, Filter.limsup (fun n => (solutionSet n k).encard) Filter.atTop = ⊤
  context:
    - open Erdos979
  definitions:
    - name: Erdos979.solutionSet
      kind: def
      text: |-
        def solutionSet (n k : ℕ) : Set (Multiset ℕ) :=
          {P | P.card = k ∧ (∀ p ∈ P, Nat.Prime p) ∧ n = (P.map (. ^ k)).sum}
