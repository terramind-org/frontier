title: Goldman-Type Theorem for Sharply Transitive Permutation Groups
field: mathematics
tier: prose
statement: Let $G$ be a sharply $k$-transitive finite permutation group with point stabilizer $H$, and let $\Gamma_{G>H}$ be the principal graph of the group-subgroup subfactor $R\rtimes G\supset R\rtimes H$. Prove that every subfactor $P\supset Q$ with principal graph $\Gamma_{G>H}$ is itself of the form $R\rtimes_\alpha G\supset R\rtimes_\alpha H$ for an outer action $\alpha$ of $G$ on a factor $R$.
