statement: Study the first non-integrable cases for a small number of point vortices on non-orientable surfaces. Describe the full set of Casimirs and finite-dimensional approximations for the group of area-preserving diffeomorphisms of non-orientable surfaces, analogous to the ones in the orientable cases.
