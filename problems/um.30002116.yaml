title: Round-Sphere Maximization of the First Boundary Eigenvalue
field: mathematics
tier: prose
statement: For every integer $m\geq3$, does the round sphere maximize $\lambda_1(\Sigma)|\Sigma|^{2/m}$ among convex hypersurfaces $\Sigma^m\subset\mathbb R^{m+1}$, where $\lambda_1(\Sigma)$ is the first nontrivial Laplace–Beltrami eigenvalue?
