lean:
  module: FormalConjectures.OEIS.«237578»
  decl: OeisA237578.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) :
        a n = 1 ↔ n = 5 ∨ n = 8 ∨ n = 13
  context:
    - open OeisA237578
  definitions:
    - name: OeisA237578.a
      kind: def
      text: |-
        /-- $a(n)$ is the number of integers $0 < k < n$ such that $\pi(k \cdot n)$ is prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ k ∈ Finset.Ico 1 n,
            if (Nat.primeCounting (k * n)).Prime then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/237578.lean#L34
