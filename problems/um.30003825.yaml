title: Ideals in the Positive Witt Algebra
field: mathematics
tier: prose
statement: For the positive Witt algebra $W_+$ with $[e_i,e_j]=(j-i)e_{i+j}$, prove or disprove that every nonzero ideal $I$ of $U(W_+)$ gives a quotient of finite Gelfand–Kirillov dimension, and that the two-sided ideals of $U(W_+)$ satisfy the ascending chain condition.
