lean:
  module: FormalConjectures.ErdosProblems.«881»
  decl: Erdos881.erdos_881
  statement: |-
    theorem erdos_881 :
        ∀ (k : ℕ) (A : Set ℕ),
          IsMinimalAsymptoticAddBasisOfOrder k A →
            ∃ (B : Set ℕ), B ⊆ A ∧ B.Infinite ∧
              (A \ B).IsAsymptoticAddBasisOfOrder (k + 1)
