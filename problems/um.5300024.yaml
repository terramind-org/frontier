title: Taylor-coefficient regularity of a Siegel conjugacy
field: mathematics
tier: prose
statement: For $P_\rho'(z)=\lambda(1-z)^\rho$, $P_\rho(0)=0$, let $h$ linearize the Siegel disk and write $h'(\zeta)/(1-h(\zeta))=\sum_{\nu\ge0}a_\nu\zeta^\nu$. Make rigorous the observed approximation of these coefficients by those of the simplified equation, at least for small $\rho$; in particular for $\theta=(\sqrt5-1)/2$ and $\rho=1$, prove a uniform bound such as $|a_\nu-2/3|<0.1$.
