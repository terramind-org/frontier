title: The degree-four quaternionic Toledo invariant
field: mathematics
tier: prose
statement: |-
  **Question 4.2 (Oscar García-Prada).** Consider a real group \(G\) with a
  symmetric space \(X=G/K\) of quaternion-Kähler type. Let \(\Omega\) be a
  4-form on \(X\), \(M\) a 4-manifold and
  \(\rho:\pi_1(M)\to G\). Study the Toledo invariant
  \[
      \langle f^*\Omega,[M]\rangle.
  \]
  An interesting special case is when \(M\) is a Kähler surface.
