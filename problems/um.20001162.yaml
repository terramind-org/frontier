title: A scope trichotomy for the balanced-skew-partition class problem
field: mathematics
tier: prose
statement: |-
  **Problem 3.** Find a class \(\mathcal C_3\) of 4-uniform hypergraphs such
  that

  1. the \(P_4\)-structure of every graph with a balanced skew partition
     belongs to \(\mathcal C_3\);
  2. no odd ring belongs to \(\mathcal C_3\);
  3. \(\mathcal C_3\) belongs to NP.

  That is a distinct, unnumbered research
  question: it changes the invariant and is not one of the three requirements on
  \(\mathcal C_3\). The official HTML likewise places it after Problem 3.

  There is a crucial wording difference in the source. Immediately before the
  three numbered problems, the desired basic-graph class is required to have **no
  member containing an induced odd ring**. Problem 3 itself merely says that **no
  odd ring belongs**. These are not equivalent without a heredity requirement. The distinction controls the answer.
