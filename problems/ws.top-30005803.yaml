  \section{Borsuk Partition Problem in Dimensions Four Through Sixty-Three}\label{30005803}
  {\small UnsolvedMath ID 30005803 · Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For each $4\leq d\leq 63$, determine whether every bounded set $S\subseteq\mathbb R^d$ can be partitioned into at most $d+1$ subsets of diameter strictly smaller than $\operatorname{diam}(S)$.
  \par\smallskip\textit{Formulation references:} \sref{30005803}{1}, \sref{30005803}{2}.
  \subsection{Short English statement}
  For each $4\leq d\leq 63$, determine whether every bounded set $S\subseteq\mathbb R^d$ can be partitioned into at most $d+1$ subsets of diameter strictly smaller than $\operatorname{diam}(S)$.
