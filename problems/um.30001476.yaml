title: Homological Area Minimizers in Compact Flat Three-Manifolds
field: mathematics
tier: prose
statement: In the Tri, Tetra, and Hexa Cosms, is a horizontal planar surface the mod-two area minimizer for one range of the height parameter and, for the complementary range, respectively the catenoid-like surface rPD, tP, or H? In the two remaining nonzero homology classes of the Tetra Cosm, are the minimizers respectively the CLP and tD minimal surfaces?
