title: Foliations and Diffeomorphism Groups — Question 48
field: mathematics
tier: prose
statement: |-
  The known examples of groups with a veering pair of invariant laminations are the fundamental groups of 3-manifolds with either a pseudo-Anosov flow without perfect fits or a veering triangulation. The following is a natural question from this.

  Classify all 3-manifolds whose fundamental group admits an action on $**S**^1$ with a veering pair of invariant laminations.
