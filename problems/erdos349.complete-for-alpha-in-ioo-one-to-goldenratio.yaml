lean:
  module: FormalConjectures.ErdosProblems.«349»
  decl: Erdos349.complete_for_alpha_in_Ioo_one_to_goldenRatio
  statement: |-
    theorem complete_for_alpha_in_Ioo_one_to_goldenRatio :
        ¬ ∀ t α : ℝ, 0 < t → α ∈ Set.Ioo 1 ((1 + √5) / 2) → IsGoodPair t α
  context:
    - open Erdos349
    - open Set Filter Real Nat Function
  definitions:
    - name: Erdos349.IsGoodPair
      kind: def
      text: |-
        /--
        This defines the core property of the problem: For what values of $t,\alpha \in (0,\infty)$
        is the sequence $\lfloor t\alpha^n\rfloor$ complete?
        -/
        def IsGoodPair (t α : ℝ) : Prop :=
          IsAddComplete (range (fun n ↦ ⌊t * α ^ n⌋))
