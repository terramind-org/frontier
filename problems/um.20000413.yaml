title: Two Tate lines and the missing adjoint correspondence
field: mathematics
tier: prose
statement: |-
  Let \(F\) be a real quadratic field, let \(\pi\) be an automorphic form over \(\mathbf Q\), and let \(\Pi\) be its base change to \(F\). Then \(\Pi\) contributes a subspace \(H^2(\Pi)\) to \(H^2(S_F)\) for a Hilbert modular surface \(S_F\) for \(\mathrm{GL}_2(F)\), while \(H^1(\pi)\) occurs in \(H^1(M)\) for a modular curve \(M\). As \(\operatorname{Gal}(\overline{\mathbf Q}/F)\)-modules,

  \[
  H^2(\Pi)\simeq H^1(\pi)\otimes H^1(\pi).
  \]

  Take two real quadratic fields \(F_1,F_2\), the base changes \(\Pi_1,\Pi_2\) of \(\pi\), and associated Hilbert modular surfaces \(S_{F_1},S_{F_2}\). The summand

  \[
  H^2(\Pi_1)\otimes H^2(\Pi_2)\subset H^4(S_{F_1}\times S_{F_2})
  \]

  becomes \(H^1(\pi)^{\otimes4}\) over \(\operatorname{Gal}(\overline{\mathbf Q}/F_1F_2)\). One therefore expects codimension-two cycles on \(S_{F_1}\times S_{F_2}\), defined over \(F_1F_2\). What are they?
