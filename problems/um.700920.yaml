title: Kourovka Notebook Problem 13.2
field: mathematics
tier: prose
statement: |-
  Does there exist a finitely
  based variety of groups
  ${\mathfrak{V}}$ such that the word problem is solvable
  in $F_n({\mathfrak{V}})$ for every positive integer $n$,
  but is unsolvable in
  $F_{\infty}({\mathfrak{V}})$ (with respect to a free
  generating system)?
