statement: |-
  \section*{Smooth anisotropic conductivity uniqueness from a single proper patch}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each compact connected smooth n-manifold $n\geq 3$ with smooth nonempty boundary, and every nonempty proper relatively open patch Gamma, does equality of the localized scalar Laplace–Beltrami Dirichlet-to-Neumann maps for two smooth metrics imply that they differ by a smooth boundary-through diffeomorphism fixing every point of Gamma?
  \subsection{Short English statement}
  For each compact connected smooth n-manifold $n\geq 3$ with smooth nonempty boundary, and every nonempty proper relatively open patch Gamma, does equality of the localized scalar Laplace–Beltrami Dirichlet-to-Neumann maps for two smooth metrics imply that they differ by a smooth boundary-through diffeomorphism fixing every point of Gamma?
