title: Selection Principles Milestone Problems — Problem 29 ([GT1], [GTpseq, Problem 0.10])
field: mathematics
tier: prose
statement: |-
  For an ultrafilter $p$, we write $x = {p\mbox{-}\lim}{} x_n$ when for each neighborhood $U$ of $x$,
  $\{n : x_n\in U\}\in p$.
  A space $Y$ is *$p$-sequential* if we replace
  $\lim$ by ${p\mbox{-}\lim}$ in the definition of sequential.

  Assume that $C_p(X)$ is $p$-sequential. Must $X$ satisfy $\binom{\Omega}{\mathcal{O}_p}$?
