title: Equivariant Ax Problem for Affine Varieties
field: mathematics
tier: prose
statement: Let $X$ be a normal affine $\mathbb{C}$-variety with an effective algebraic action of $G$, let $\varphi:X\to X$ be a $G$-equivariant endomorphism, and let $\psi:X//G\to X//G$ be induced. If $\psi$ is an automorphism, must $\varphi$ be an automorphism without assuming $\varphi$ is unramified?
