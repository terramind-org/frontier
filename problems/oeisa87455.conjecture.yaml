  statement: "theorem conjecture : SatisfiesBenford a"
  context:
    - open OeisA87455
  definitions:
    - name: OeisA87455.a
      kind: def
      text: |-
        /-- The primary defining sequence `a`, satisfying $a(n) = 2 a(n-1) - 3 a(n-2)$ for $n \ge 2$,
        with initial values $a(0)=1$ and $a(1)=1$. -/
        def a : ℕ → ℤ
          | 0 => 1
          | 1 => 1
          | n + 2 => 2 * a (n + 1) - 3 * a n
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/87455.lean#L34
    - name: OeisA87455.SatisfiesBenford
      kind: def
      text: |-
        /-- A sequence of integers satisfies Benford's law if, for every $t \in [1, 10)$, the asymptotic
        relative frequency of terms whose decimal significand is at most $t$ equals $\log_{10} t$
        (Berger-Hill). This is strictly stronger than the law for the leading digit alone. -/
        def SatisfiesBenford (s : ℕ → ℤ) : Prop :=
          ∀ t ∈ Set.Ico (1 : ℝ) 10,
            Filter.Tendsto
              (fun N : ℕ =>
                ((Finset.range N).filter (fun n => significand (s n) ≤ t)).card / (N : ℝ))
              Filter.atTop
              (nhds (Real.logb 10 t))
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/87455.lean#L46
