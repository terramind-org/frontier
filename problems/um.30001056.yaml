title: Higher-Dimensional Enumeration and Tensor-Rank Problems
field: mathematics
tier: prose
statement: Improve the asymptotic bounds for the number $L_n$ of $n\times n$ Latin squares. Formulate and solve higher-dimensional analogues of this enumeration problem. Are there higher-dimensional analogues of the gamma function? What is the maximum rank of a real $n\times n\times n$ tensor, and is it $(1+o(1))n^2/2$?
