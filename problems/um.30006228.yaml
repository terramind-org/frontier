title: Landis Unique-Continuation Conjecture
field: mathematics
tier: prose
statement: Let $V\in L^\infty(\mathbb R^N)$ satisfy $\|V\|_\infty\leq 1$, and let $u$ solve $(-\Delta+V)u=0$ on $\mathbb R^N$. If $u$ decays at least as fast as $e^{-k|x|}$ for some $k>1$, must $u\equiv 0$ without assuming positivity of the Schrödinger operator?
