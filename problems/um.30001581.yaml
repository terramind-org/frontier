title: Homological Torsion Growth in Arithmetic Hyperbolic Towers
field: mathematics
tier: prose
statement: Let $M$ be the arithmetic hyperbolic three-manifold associated with a quaternion division algebra over an imaginary quadratic field, and let $(M_N)$ be any residual chain of congruence covers. Does $$\frac{\log\#H_1(M_N,\mathbb Z)_{\mathrm{tors}}}{\operatorname{vol}(M_N)}\longrightarrow\frac{1}{6\pi}$$ as $N\to\infty$?
