title: Corner structure and chamberwise product topology for variable-length planar polygons
field: mathematics
tier: prose
statement: |-
  **4. (Holmes-Cerfon)** Consider the configuration space of planar \(n\)-gons such
  that
  \[
  L_i-\varepsilon\leq \ell_i\leq L_i+\varepsilon.
  \]
  \(M_{L,\varepsilon}\) is a manifold with boundary.  Question: Understand its
  topology and volume.
