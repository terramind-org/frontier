title: Upward Closure of Grothendieck Schubert Supports
field: mathematics
tier: prose
statement: Let $G_w$ be a Grothendieck polynomial. If $u\in\operatorname{Supp}_S(G_w)$ and $\ell(u)<\deg(G_w)$, must there exist $v\in\operatorname{Supp}_S(G_w)$ with $u<_L v$?
