title: Realization of Rapidly Growing Følner Functions
field: mathematics
tier: prose
statement: Let $f:\mathbb{N}\to\mathbb{N}$ be nondecreasing with $f(n)\geq\exp(n)$. Is there a finitely generated group $G$ whose Følner function satisfies $\operatorname{Fol}_G(n)\asymp f(n)$?
