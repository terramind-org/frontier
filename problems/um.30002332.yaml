title: Linear Ropelength Bounds in Crossing Number
field: mathematics
tier: prose
statement: For every knot $K$, is its ropelength $O(\operatorname{Cr}(K))$, where $\operatorname{Cr}(K)$ is the crossing number? If not, do infinitely many knots have faster growth? Do alternating knots have a ropelength lower bound of linear order in crossing number?
