title: Group Actions with Differentiability Obstructions
field: mathematics
tier: prose
statement: Does there exist a countable or finitely generated group $\Gamma_{r,M}\leq\operatorname{Diff}^r(M)$ such that, for every $s>r$, every action of $\Gamma_{r,M}$ on $M$ by $C^s$ diffeomorphisms is trivial or has a large kernel?
