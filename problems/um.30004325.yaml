title: Rationality of Seshadri Constants on Plane Blowups
field: mathematics
tier: prose
statement: For a smooth projective surface $X$ obtained by blowing up $\mathbb{P}^2$ at very general points and an ample line bundle $L$ on $X$, is the global Seshadri constant $\varepsilon(X,L)$ always rational, or can it be irrational?
