title: Stable Prasad Multiplicity Conjecture
field: mathematics
tier: prose
statement: In the $p$-adic Galois-pair setting, let $\phi$ be a discrete $L$-parameter with stable representation $\Pi_\phi$. Is the multiplicity given by $$m(\Pi_\phi,\chi)=|\ker^1(F;H,G)|^{-1}\sum_\psi\frac{|Z(\phi)|}{|Z(\psi)|},$$ where the sum ranges over compatible lifts $\psi$ through $H^\vee_\chi\to{}^LG$?
