title: Questions in Geometric Group Theory — Q 13.10
field: mathematics
tier: prose
statement: Let $G$ be a one-relator group whose relator $W$ is a cyclically reduced word in the generators, and let $P$ be the submonoid of $G$ generated by all prefixes of $W$. Is the membership problem for $P$ in $G$ decidable?
