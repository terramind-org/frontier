title: Number of Cliques in Minor-Closed Classes
field: mathematics
tier: prose
statement: |-
  \section{Number of Cliques in Minor-Closed Classes}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  All graphs are finite, undirected and simple. A $K_t$ minor is obtained by deleting vertices or edges and contracting edges; equivalently there are $t$ disjoint connected vertex sets pairwise joined by an edge. A clique is any set of pairwise adjacent vertices, without maximality; let $\kappa(G)$ count all cliques, including the empty set. For $t\geq2$ set
  \[c_* =\inf\bigl\{c>0:\kappa(G)\leq c^t|V(G)|\ \text{for every nonempty }K_t\text{-minor-free graph }G\text{ and every }t\geq2\bigr\}.\]
  \paragraph{Statement recorded in the supplied source.}
  Is $c_*<\infty$? More explicitly, is there one absolute constant $c$ such that every $n$-vertex $K_t$-minor-free graph has at most $c^t n$ cliques for all $n\geq1,t\geq2$? Determine the minimum universal constant, and the optimal asymptotic exponential rate as $t\to\infty$. \sref{statement}{2}
  \subsection{Short English statement}
  Is there one exponential-in-t bound, linear in the number of vertices, on all cliques in graphs excluding a complete minor, and what is the smallest possible exponential constant?
