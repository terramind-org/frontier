title: Ideal Theory of Witt and Virasoro Enveloping Algebras
field: mathematics
tier: prose
statement: "For the full Witt algebra $W$ and the Virasoro algebra $V$, do their enveloping algebras have the following properties: every nonzero ideal has a quotient of finite Gelfand–Kirillov dimension, two-sided ideals satisfy the ascending chain condition, and an ideal containing a quadratic expression in the generators has a quotient of finite Gelfand–Kirillov dimension?"
