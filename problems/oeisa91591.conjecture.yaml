lean:
  module: FormalConjectures.OEIS.«91591»
  decl: OeisA91591.conjecture
  statement: |-
    theorem conjecture :
        ∀ n : ℕ, n > 122 → a n > 0
  context:
    - open OeisA91591
  definitions:
    - name: OeisA91591.a
      kind: def
      text: |-
        /-- Number of pairs of twin primes $(p, p+2)$ strictly between $n^2$ and $(n+1)^2$. -/
        def a (n : ℕ) : ℕ :=
          (((Finset.Ioo (n ^ 2) ((n + 1) ^ 2)).filter
            fun p => p.Prime ∧ (p + 2).Prime ∧ p + 2 < (n + 1) ^ 2)).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/91591.lean#L35
