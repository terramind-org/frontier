id: um.30006084
title: Wasserstein Velocities for Boltzmann Curves
field: mathematics
tier: prose
statement: Given a family $f_t:\mathbb R^d\to\mathbb R$ and the Boltzmann densities $\rho_t=e^{-f_t}/Z_t$, find general conditions ensuring a globally integrable velocity field $v_t$ satisfying $\partial_t\rho_t+\nabla\cdot(\rho_t v_t)=0$. Equivalently, determine when the Fisher-Rao curve $(\rho_t)$ is absolutely continuous in Wasserstein space.
