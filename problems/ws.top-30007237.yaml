  \section*{Generic C2 future inextendibility near rotating subextremal Kerr}\label{30007237}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every fixed rotating subextremal Kerr datum, do future C2-extendible vacuum maximal developments form a meagre set in a sufficiently small neighborhood in the specified weighted smooth initial-data topology?
  \subsection{Short English statement}
  For every fixed rotating subextremal Kerr datum, do future C2-extendible vacuum maximal developments form a meagre set in a sufficiently small neighborhood in the specified weighted smooth initial-data topology?
