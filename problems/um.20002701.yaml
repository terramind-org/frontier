title: A dihedral symmetry barrier for noncrystallographic nonnesting
field: mathematics
tier: prose
statement: |-
  Determine how far the nonnesting partitions $NN_W$, the positive-root order, and their enumerative relatives extend from Weyl groups to noncrystallographic finite Coxeter groups. Construct such objects where possible, identify essential barriers where not, and explain what the noncrystallographic $H$-triangle counts.

  This is not a standalone Problem 6.5.

