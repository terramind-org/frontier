title: Exact ODE realization by a flow-defect delay equation
field: mathematics
tier: prose
statement: |-
  **(5)** Global bifurcations in differential equations with state-dependent delay.

  Some related issues are

  - continuation for homoclinic or heteroclinic solutions;
  - continuation of (rapidly oscillating) periodic solutions for all relevant parameters.

  **(6)** Analyticity of solutions of analytic delay differential equation (especially, with respect to the delay).

  In particular, the “Whiskey Problem” suggested by Roger.

  **(7)** Study of differential equations with unbounded finite delays as for instance arising in echo control.

  Some particular aspects are

  - equations with unbounded state-dependent delay;
  - equation with delay given by an infinite integral.

  **(8)** How can a given ODE dynamics be realized in a class of differential equations with delay?
