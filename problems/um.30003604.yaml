title: Volume Bounds for Clean Lattice Tetrahedra
field: mathematics
tier: prose
statement: For a clean tetrahedron in $\mathbb{R}^3$ with $k>0$ interior lattice points, is Duong's volume conjecture true when the interior points are collinear? If they are not collinear, is the volume then strictly below the maximum?
