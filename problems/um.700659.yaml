title: Kourovka Notebook Problem 10.44
field: mathematics
tier: prose
statement: |-
  Let $R$ and $S$ be associative rings with
  identity such that 2 is invertible in $S$. Prove that every standard homomorphism $\Lambda$
  of $ E_n(R) \subset GL_n(R)=GL(V)$ into $E_m(S) \subset
  GL_m(S)=GL(W)$ originates from a collineation and a correlation,
  that is, has the form $\Lambda x=(g^{-1}xg)f + (h^{-1}xh)(1 - f),$
  where $g$ is a semilinear isomorphism $V_R \rightarrow W_S$
  (collineation) and $h$ is a semilinear isomorphism $V_R
  \rightarrow _S\! W'_{S^0}$ (correlation).
