  module: FormalConjectures.Wikipedia.Mersenne
  decl: Mersenne.new_mersenne_conjecture.variants.prime
  statement: |-
    theorem new_mersenne_conjecture.variants.prime (p : ℕ) (hp : p.Prime) (h : Odd p) :
        NewMersenneConjectureStatement p
  context:
    - open Mersenne
    - open Mersenne.new_mersenne_conjecture
    - open Mersenne.new_mersenne_conjecture.variants
  definitions:
    - name: Mersenne.NewMersenneConjectureStatement
      kind: def
      text: |-
        /--
        A natural number `p` satisfies the statement of the New Mersenne Conjecture if whenever
        two of the following conditions hold,
        then all three must hold:
        1. $2^p-1$ is prime
        2. $(2^p+1)/3$ is prime
        3. Exists a number `k` such that $p = 2^k \\pm 1$ or $p = 4^k \\pm 3$
        -/
        def NewMersenneConjectureStatement (p : ℕ) : Prop :=
          ((mersenne p).Prime ∧ p.GivesWagstaffPrime → p.IsSpecialForm) ∧
          ((mersenne p).Prime ∧ p.IsSpecialForm → p.GivesWagstaffPrime) ∧
          (p.GivesWagstaffPrime ∧ p.IsSpecialForm → (mersenne p).Prime)
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/Mersenne.lean#L59
