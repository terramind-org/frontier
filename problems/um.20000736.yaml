title: Mock forms as boundary pieces of twisted Nahm sums
field: mathematics
tier: prose
statement: |-
  Extend the Nahm-sum, Bloch-group, and asymptotic framework so that it can recognize mock modular \(q\)-hypergeometric series, their shadows, and their controlled failure of holomorphic modularity.

  The pronoun “this” is resolved by the immediately preceding source context. Section 2 of the 2010 AIM problem list introduces

  \[
  f_{A,B,C}(\tau)=
  \sum_{\boldsymbol n\in\mathbb Z_{\geq0}^r}
  \frac{q^{\frac12\boldsymbol n^tA\boldsymbol n+B^t\boldsymbol n+C}}
  {(q;q)_{n_1}\cdots(q;q)_{n_r}},
  \qquad q=e^{2\pi i\tau},
  \]

  where \(A\) is rational, symmetric, and positive definite, \(B\in\mathbb Q^r\), and \(C\in\mathbb Q\). The section discusses Nahm's proposed connection between modularity and the Bloch-group element obtained from the Nahm equations. Problems 2.1--2.4 concern the possible \(B\)'s, asymptotic jumps, higher-rank modular examples, and a Bailey-pair/Bloch-group dictionary; Problem 2.6 asks about quantum dilogarithms.

