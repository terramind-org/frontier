title: Congruent numbers in residue classes 5, 6, and 7 modulo 8
field: mathematics
tier: prose
statement: |-
  \section{Congruent numbers in residue classes 5, 6, and 7 modulo 8}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A positive rational number $q$ is \emph{congruent} if there are positive rational numbers $a,b,c$ with $a^2+b^2=c^2$ and $ab/2=q$; thus $q$ is the area of a right triangle with rational side lengths.
  \paragraph{Statement recorded in the supplied source.}
  Is every positive integer $n$ with $n\equiv5,6,$ or $7\pmod8$ congruent? \sref{statement}{2}
  \subsection{Short English statement}
  Does every positive integer in residue class five, six or seven modulo eight occur as the area of a rational right triangle?
