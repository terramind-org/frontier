  \item[\hypertarget{source:statement:2}{S2}] Christian Wuthrich, \emph{Open problems in number theory}, lecture slides (December 2011) slides headed Congruent number problem and Conjecture (following the triangle examples). \url{https://www.maths.nottingham.ac.uk/plp/pmzcw/download/open.pdf}.
