title: Fixed-end connectivity and Morse walls for Weinstein potentials
field: mathematics
tier: prose
statement: |-
  (a) Make a theory of “Weinstein spaces”, as opposed to Weinstein manifolds,
  by analogy with Stein manifolds and Stein spaces.
  (b) Is the space of psh functions on a Weinstein manifold connected? (No
  critical points at infinity.) What if we assume the same contact structure
  at infinity? There exists an example of a manifold diffeomorphic to
  \(\mathbb C^n\) for which there is more than 1 critical point for any psh
  function, and this bears on uniqueness.
