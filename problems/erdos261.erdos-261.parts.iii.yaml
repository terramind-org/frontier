lean:
  module: FormalConjectures.ErdosProblems.«261»
  decl: Erdos261.erdos_261.parts.iii
  statement: |-
    theorem erdos_261.parts.iii : ∃ x : ℚ,
        𝔠 ≤ #{a : ℕ → ℕ | Erdos261InfiniteRepresentation x a}
  context:
    - open Erdos261
    - open Erdos261.erdos_261
    - open Erdos261.erdos_261.parts
    - open scoped Cardinal
  definitions:
    - name: Erdos261.Erdos261InfiniteRepresentation
      kind: def
      text: |-
        /-- A canonical infinite representation of a rational number $x$ by positive integers. The
        denominators are strictly increasing so that reorderings are not counted as different
        representations. -/
        def Erdos261InfiniteRepresentation (x : ℚ) (a : ℕ → ℕ) : Prop :=
          StrictMono a ∧ (1 ≤ a) ∧ Summable (fun k => (a k) / (2 ^ (a k) : ℚ)) ∧
            x = ∑' k, (a k) / (2 ^ (a k) : ℚ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/261.lean#L46
