title: Selection Principles Milestone Problems — Problem 10 ([AddQuad])
field: mathematics
tier: prose
statement: |-
  The general problem is to determine the additivity numbers of the
  properties in question in terms of well known cardinal characteristics
  of the continuum (like ${\mathfrak{b}}$, ${\mathfrak{d}}$, etc.). See [LecceSurvey] for
  a list of properties for which the problem is still open.
  Three of the more interesting ones among these are the following.

  Is $\mathsf{add}(\mathsf{U}_{\mathrm{fin}}(\Gamma,\mathcal{O}))={\mathfrak{b}}$?
