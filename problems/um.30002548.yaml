title: Algebraicity and D-Finiteness of Group-Algebra Series
field: mathematics
tier: prose
statement: Let $G$ be a group, let $u\in\mathbb ZG$, define $f_u(n)=[1]u^n$ to be the coefficient of the identity in $u^n$, and set $F_u(x)=\sum_{n\geq 1}f_u(n)x^n$. Is $F_u(x)$ D-finite for every $u$ when $G=\operatorname{GL}(d,\mathbb Z)$? More generally, for which groups $G$ is $F_u(x)$ algebraic for every $u\in\mathbb ZG$, and for which groups is it always D-finite?
