title: Moments of L-functions — Moments of the Riemann zeta function — Problem 9
field: mathematics
tier: prose
statement: |-
  Soundararajan [S] proved the following lower bound for $I_3(T)$:
  \[
  I_3(T) \ge \frac{20.26 a_3}{9!} (1+o(1)) T (\log T)^9,
  \]
  for $T$ sufficiently large. Improve the value of 20.26. The best possible result would be 42.
  (Likewise improve the lower bounds for $I_k(T)$ for $k >3$.) Note that the works [BBLR], [BCR], and [HY] are now available and could be useful. \\
  (Nathan Ng, Lethbridge)
