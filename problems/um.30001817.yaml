title: The p-Adic Variational Hodge Conjecture
field: mathematics
tier: prose
statement: Let $W$ be the Witt ring of a perfect field of characteristic $p>0$, let $X$ be smooth and projective over $W$ with special fiber $X_1$, and let $\xi_1\in CH^r(X_1)_{\mathbb Q}$. If its crystalline cycle class lies in the Hodge filtration $F^rH^{2r}_{\mathrm{dR}}(X/W)_{\mathbb Q}$, must there exist $\xi\in CH^r(X)_{\mathbb Q}$ whose restriction to $X_1$ has crystalline cycle class equal to that of $\xi_1$?
