title: Question 6.1 — Is there a set of simple Steinberg-type relations for the mapping class group?
field: mathematics
tier: prose
statement: Is there a set of simple Steinberg-type relations for the mapping class group? There is also a presentation of Aut( Fn) coming from the action of Aut( Fn) on the subcomplex of Auter space spanned by graphs of degree at most 2. This is simply-connected by [ 48], so Brown’s method [ 22] can be used to write down a presentation. The vertex groups are stabilizers of marked graphs, and the edge groups are the stabilizers of pairs consisting of a marked graph and a forest in the graph. The quotient of the subcomplex modulo Aut( Fn) can be computed explicitly, and one finds that Aut( Fn) is generated by the (finite) stabilizers of seven specific marked graphs. In addition, all of the relations except two come from the natural inclusions of edge stabilizers into vertex stabilizers, i.e. either including the stabilizer of a pair (graph, forest) into the stabilizer of the graph, or into the stabilizer of the quotient of the graph modulo the forest. Thus the whole group is almost (but not quite) a pushout of these finite subgroups. In the terminology of Haefliger (see [ 19], II.12), the complex of groups is not simple.
