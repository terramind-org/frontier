title: Finite Generation and Separation in Invariant Rings
field: mathematics
tier: prose
statement: For a linear algebraic group $G$ acting on an affine variety $X$, is $K[X]^G$ finitely generated? If so, find generators; determine structural properties of $K[X]^G$; and determine whether invariant functions separate distinct $G$-orbits.
