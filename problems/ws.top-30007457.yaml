statement: |-
  \section*{Unconditional time lower bounds for fixed-dimensional WL}\label{30007457}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Are there $c>0,k_{0}$ such that, for every fixed $k\geq k_{0}$, every correct deterministic decider of k-WL equivalence has worst-case time at least $n^{ck}$ for every sufficiently large n, even on connected simple uncolored graphs of diameter $\leq 2$, for both joint and separate refinement on multitape machines or the specified sequential logarithmic-word RAM?
  \subsection{Short English statement}
  Are there $c>0,k_{0}$ such that, for every fixed $k\geq k_{0}$, every correct deterministic decider of k-WL equivalence has worst-case time at least $n^{ck}$ for every sufficiently large n, even on connected simple uncolored graphs of diameter $\leq 2$, for both joint and separate refinement on multitape machines or the specified sequential logarithmic-word RAM?
