title: Kourovka Notebook Problem 10.52
field: mathematics
tier: prose
statement: |-
  (R. Mines). It is well known that the topology
  on the completion of an abelian group under the $ p
  $-adic topology is the $p
  $-adic topology. R. Warfield
  has shown that this is also true in the category of nilpotent
  groups. Find a categorical setting for this theorem which includes
  the case of nilpotent groups.
