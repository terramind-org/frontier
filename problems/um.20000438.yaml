id: um.20000438
title: Mixed resolution of the quartic K3 questions and an exact 2-adic separation lemma
field: mathematics
tier: prose
statement: |-
  (a) Is there a K3 surface \(X/\mathbb Q\) such that
  \(0<\#X(\mathbb Q)<\infty\)?

  (b) Is there a nonsingular quartic surface with this property?

  (c) Find a third rational point on
  \[
  X_1^4+2X_2^4=X_3^4+4X_4^4.
  \]
  (The source says that there are only two points of height at most \(2^{15}\).)

  (d) Find a smooth quartic \(X_4\subset\mathbb P^3\) with
  \(\operatorname{Pic}(\overline X_4)\cong\mathbb Z\) and \(X_4(K)\) infinite.
