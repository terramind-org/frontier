title: Local Discrete Holomorphic Dynamics — Open Problem OP2
field: mathematics
tier: prose
statement: |-
  The Brjuno function is clearly quite an irregular function, diverging at a $G_\delta$-dense set
  of irrational numbers . A surprising fact is that, on the contrary,
  numerical experiments (see, e.g., [Car] and references therein) as well as theoretical
  results (see [MMY])
  suggest that $\log r+B$ is more regular, even better than continuous. More specifically,
  Marmi, Mattei and Yoccoz proposed the following problem:

  *Does $\log r+B$ admit a $1/2$-H\"older
  continuous extension to $[0,1)$?*
