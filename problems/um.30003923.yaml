statement: If $\Omega$ is a rank-one rotation domain, is $(f|_\Omega,\Omega)$ biholomorphically conjugate to $(L,D)$, where $D\subset\mathbb C^2$ and $$L=\operatorname{diag}(\alpha^p,\alpha^q),\qquad\gcd(p,q)=1,$$ with $|\alpha|=1$ and $\alpha$ not a root of unity?
