title: Higher Structure Map Criterion for LICCI Ideals
field: mathematics
tier: prose
statement: Let $I$ be a perfect codimension-$3$ ideal over a local Gorenstein ring $R$. Is $I$ LICCI if and only if a higher structure map in $W(d_1)$ has a unit entry; and do unit entries in $W(d_2)$ and $W(d_3)$ characterize linkage to ideals with smaller resolution formats?
