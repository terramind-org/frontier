title: MV versus theta bases on unipotent groups and cells
field: mathematics
tier: prose
statement: |-
  **Problem 4.6.** Let \(U\) be a unipotent cell. Then \(U\) can be thought of as a braid variety. Also \(\mathbb C[U]\) has a Mirkovi\'c--Vilonen basis. Does the MV basis equal the \(\Theta\)-basis?

  **Comment.** See the appendix of Baumann--Kamnitzer--Knutson.
