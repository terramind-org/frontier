id: um.30002474
title: Triangle Abundance Forcing Large Clique Blow-Ups
field: mathematics
tier: prose
statement: |-
  For every constant $C>0$, does there exist $\gamma=\gamma(C)>0$ such that every sufficiently large $n$-vertex graph with at least
  $$\frac{n^{3/2}}{\exp(C\sqrt{\log n})}$$
  triangles contains a $t$-blow-up of $K_3$ with $t\geq\gamma\sqrt{\log n}$?
