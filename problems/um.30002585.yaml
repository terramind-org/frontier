statement: For a homogeneous variety $V\subset\mathbb{C}^d$ and $M=\{f\in H_d^2:f(z)=0\text{ for all }z\in V\cap\mathbb B_d\}$, do the compressed coordinate commutators satisfy $[S_j,S_k^*]\in\mathcal S^q$ for every $q>\dim_{\mathbb C}V$?
