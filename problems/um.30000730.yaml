title: Poincaré-Function Limits Characterizing Exceptional Polynomials
field: mathematics
tier: prose
statement: Let $p$ be a real polynomial of degree $d>1$ with $p'(0)=\lambda>1$, and let $f$ be the entire solution of $f(\lambda z)=p(f(z))$, $f(0)=0$, $f'(0)=1$. With $N_f(x)=\#\{\xi:f(\xi)=0,\ |\xi|<x\}$, $\mu$ the associated harmonic measure, and $\rho=\log_\lambda d$, does the existence of either limit $\lim_{x\to\infty}x^{-\rho}N_f(x)$ or $\lim_{t\to0}t^{-\rho}\mu(B(0,t))$ characterize polynomials linearly conjugate to a Chebyshev polynomial or a pure power?
