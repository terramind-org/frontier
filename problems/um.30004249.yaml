title: Combinatorial Deformations of Toric Fano Varieties
field: mathematics
tier: prose
statement: Let $P$ be a reflexive polytope and let $X_P$ be the toric Fano variety associated with its face fan. Characterize the combinatorial data on $P$ that produce deformations or smoothings of $X_P$, and determine the general fibers of the resulting families.
