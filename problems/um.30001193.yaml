title: Thick Subcategories of Noetherian Derived Categories
field: mathematics
tier: prose
statement: For a noetherian ring $A$, classify the thick subcategories of $D_f(A)$, the derived category of $A$-modules with finitely generated cohomology. Equivalently, via compact objects in $K(\operatorname{Inj}A)$, classify the localizing subcategories of the homotopy category of complexes of injective $A$-modules.
