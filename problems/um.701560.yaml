title: Kourovka Notebook Problem 19.12
field: mathematics
tier: prose
statement: |-
  A finite group $G$ is called conjugacy-expansive if for every normal
  subset $N$ and conjugacy class $C$ of $G$ the normal set $NC$ contains at least
  as many conjugacy classes of $G$ as $N$ does. Is it true that every finite
  simple group is conjugacy-expansive?
