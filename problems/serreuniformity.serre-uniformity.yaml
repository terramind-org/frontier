schema: 1
id: serreuniformity.serre-uniformity
title: Serre's uniformity conjecture over the rationals
field: mathematics
tier: proof
statement: |-
  **Serre's uniformity question over $\mathbb{Q}$** [Ser72, Lem17]: is there a bound
  $C$ such that every non-CM elliptic curve over $\mathbb{Q}$ has surjective mod-$p$
  Galois representation for every prime $p > C$?
ams:
  - 11
  - 14
tags:
  - paper
references: []
source:
  name: formal-conjectures
  repo: https://github.com/google-deepmind/formal-conjectures
  commit: 86a2f58a4d7a3a0637d15d5b2ce627592b54b956
  path: FormalConjectures/Paper/SerreUniformity.lean
  url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Paper/SerreUniformity.lean#L68
  licence: Apache-2.0
upstream_status: open
lean:
  module: FormalConjectures.Paper.SerreUniformity
  decl: SerreUniformity.serre_uniformity
  statement: |-
    theorem serre_uniformity :
        ∃ C : ℕ, ∀ (E : WeierstrassCurve ℚ) [E.IsElliptic], E.j ∉ cmJInvariants →
          ∀ p : ℕ, p.Prime → C < p → HasFullTorsionAction E p
  context:
    - open SerreUniformity
  definitions:
    - name: SerreUniformity.cmJInvariants
      kind: def
      text: |-
        /--
        The thirteen rational CM $j$-invariants.
        -/
        def cmJInvariants : Finset ℚ :=
          {0, 1728, -3375, 8000, -32768, 54000, 287496, -884736,
            -12288000, 16581375, -884736000, -147197952000, -262537412640768000}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Paper/SerreUniformity.lean#L45
    - name: SerreUniformity.HasFullTorsionAction
      kind: def
      text: |-
        /--
        Every additive automorphism of $E[p]$ is induced by a Galois automorphism.
        For elliptic $E$ and prime $p$, this means that the mod-$p$ representation is surjective.
        -/
        def HasFullTorsionAction (E : WeierstrassCurve ℚ) (p : ℕ) : Prop :=
          let T := AddSubgroup.torsionBy (E.baseChange (AlgebraicClosure ℚ)).toAffine.Point (p : ℤ)
          ∀ f : T ≃+ T, ∃ σ : AlgebraicClosure ℚ ≃ₐ[ℚ] AlgebraicClosure ℚ,
            ∀ P : T, WeierstrassCurve.Affine.Point.map (W' := E) σ.toAlgHom P.val = (f P).val
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Paper/SerreUniformity.lean#L53
