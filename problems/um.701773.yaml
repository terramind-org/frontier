title: Kourovka Notebook Problem 20.115
field: mathematics
tier: prose
statement: |-
  Let $\chi$ be a complex irreducible character of a finite group $G$. If $\chi(x)\ne 0$ for some $x\in G$, must the order $o(x)$ of $x$ divide $|G|/\chi(1)$?

  This is known to be true if $G$ is solvable, and it is known that $(o(x)\chi(1))^4$ divides $|G|^5$ for arbitrary $G$.
