title: Conjecture 3.4 — Z(K) = Z(−K) for any oriented knot K, where −K de- notes K with the opposite orientation.
field: mathematics
tier: prose
statement: Z(K) = Z(−K) for any oriented knot K, where −K de- notes K with the opposite orientation. (See Conjecture 2.7 for an eq uivalent statement of this conjecture.) 3.3 Characterization and interpretation of the Kontsevich in- variant The space A(S1) is an algebra with the product given by connected sum of Jacobi diagrams on S1. Since the Kontsevich invariant Z(K) of a knot K is group-like in A(S1), its logarithm log Z(K) belongs to A(S1)conn, where A(S1)conn denotes the vector subspace of A(S1) spanned by Jacobi diagrams on S1 with connected uni-trivalent graphs.
