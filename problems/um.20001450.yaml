title: Sharp Kähler-angle classification for two-dimensional unitary projection averages
field: mathematics
tier: prose
statement: |-
  Consider a convex body in $\mathbb{C}^n$ and fix a real subspace $E$ of $\mathbb{C}^n$. Define $V_E(K) = \int_{U(n)} |K|\phi(E)|\,d\phi$, where $U(n)$ is a unitary group. Does Brunn--Minkowski type inequality hold for such quantities:
  \[
  V_E(K+L)^{1/i}\geq V_E(K)^{1/i}+V_E(L)^{1/i}?
  \]
  Also, for what type of subspaces $E$ this will work?
