title: Counterexamples to naive balance and a fixed-multidegree interpolation family
field: mathematics
tier: prose
statement: |-
  Let \(X=Z_1\cup Z_2\) be obtained by gluing two rational curves at
  \(g+1\) general pairs of points. Does \(X\) have a
  \(g^r_{d_1,d_2}\) if and only if
  \(\rho(g,r,d_1+d_2)\geq 0\), subject to a condition that
  \((d_1,d_2)\) be “relatively balanced”?
