id: um.800518
title: Linear Systems and Eigenvalue Problems — Problem 27
field: mathematics
tier: prose
statement: |-
  Let $B$ be an $n \times n$ (upper) bidiagonal matrix. Is there an algorithm that, in $O(kn)$ operations, can produce $k$ triples $(\sigma_i,v_i,u_i)$ such that $\sigma_i \geq 0$, $v_i, u_i \in {\mathbb{C}}^n$ are unit vectors, and, for machine precision $\epsilon$,

  - $\|Bv_i-\sigma_iu_i\|_2 = O(\epsilon n\|B\|_2)$;

  - $|v_i^Hv_j|$, $|u_i^Hu_j| = O(\epsilon n)$ if $i \neq j$.
