title: CFKRS Formula for Shifted Zeta Function Moments
field: mathematics
tier: prose
statement: "The CFKRS conjecture predicts an asymptotic formula for smoothed averages of products of zeta-functions with small complex shifts: the main term is the sum of all equal-cardinality swap terms, with Dirichlet-series factor $B(C,D)=\\sum_{n\\geq 1}\\tau_C(n)\\tau_D(n)/n$, and an error $O(T^{1-\\delta})$ as $T\\to\\infty$."
