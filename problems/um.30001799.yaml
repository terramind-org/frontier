title: Beilinson–Soulé Vanishing Conjecture
field: mathematics
tier: prose
statement: For every regular ring $R$, is $K_m(R)=F^\gamma_nK_m(R)$ for $m\geq\max\{2n-1,1\}$, equivalently, does the Adams eigenspace $K_m(R)^{(n)}$ vanish in the excluded range except for $K_0(R)^{(0)}$ (the Beilinson–Soulé vanishing conjecture)?
