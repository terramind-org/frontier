title: Equality Cases for Singularities of Theta Divisors
field: mathematics
tier: prose
statement: Let $(A,\Theta)$ be an indecomposable principally polarized abelian variety. If $\dim\operatorname{Sing}_m(\Theta)=\dim A-2m+1$ for some $m\geq2$, must $A$ be either a hyperelliptic Jacobian or the intermediate Jacobian of a cubic threefold?
