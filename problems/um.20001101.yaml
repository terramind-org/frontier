title: Pure-diagonal deficits in Lev's restricted Scherk conjecture
field: mathematics
tier: prose
statement: |-
  Thus the recovered problem is:

  **Lev's restricted Scherk conjecture.** Let \(A,B\) be finite subsets of an abelian group \(G\), with
  \[
   A\cap(-B)=\{0\}. \]
  For
  \[
   A\mathbin{\dot+}B:=\{a+b:a\in A,\ b\in B,\ a\ne b\},
  \]
  prove or disprove
  \[
   |A\mathbin{\dot+}B|\ge |A|+|B|-3. \tag{1}
  \]

  The hypothesis says that \(0\in A\cap B\) and that \(0=0+0\) is the unique representation of zero from \(A\times B\).
