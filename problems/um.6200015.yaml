title: Boundaries of Groups and Kleinian Groups — Problem 15
field: mathematics
tier: prose
statement: Suppose that ( N1, ∆1) and (N2, ∆2) are closed 3-manifolds equipped with ﬂag-triangulations, so that ∂∞C(N1, ∆1) = ∂∞C(N2, ∆2). Does it follow that every prime connected sum summand of Ni appears as a connected sum summand of Ni+1, i = 1, 2? What can be said in higher dimensions?
