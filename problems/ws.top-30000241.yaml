  \section{Arithmetic-Formula Lower Bounds for Permanent and Determinant}\label{30000241}
  {\small UnsolvedMath ID 30000241 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Prove superpolynomial lower bounds for the arithmetic-formula size of an explicit polynomial, in particular the permanent or determinant.
  \par\smallskip\textit{Formulation references:} \sref{30000241}{1}, \sref{30000241}{2}.
