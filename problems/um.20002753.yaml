id: um.20002753
title: Color-shear Ext classes and the annulus filtration correction
field: mathematics
tier: prose
statement: |-
  It asks for naturally occurring nontrivial
  \(\mathrm{FI}_2\)-modules. For a manifold \(X\) with two specified boundary
  components it claims that

  \[
   V_n=H_i(\operatorname{PConf}^n(X))
  \]

  has an \(\mathrm{FI}_2\)-module structure. For the cylinder
  \(X=S^1\times I\) and \(i=1\), it records

  \[
   0\longrightarrow \widetilde M(1)\longrightarrow V
   \longrightarrow\widetilde M(2)\longrightarrow0,
  \]

  where the tildes mean pullback from \(\mathrm{FI}\), says that \(V\) has an
  ordinary \(\mathrm{FI}\)-structure but is not such a pullback, and asks:

  1. what generally happens for \(H_i(\operatorname{PConf}(X))\); and
  2. whether \(\operatorname{Ext}(M,N)\) can be calculated in
     \(\mathrm{FI}_2\)-modules.

  The literature note attributes to Andrew Snowden the observation that Koszul
  resolutions calculate these Ext groups and cites Church--Ellenberg--Farb
  [CEF].

  Two corrections are necessary before doing mathematics.

  **Notation correction.** CEF define \(M(a)=k[\operatorname{Inj}([a],-)]\),
  the free module generated by the regular \(S_a\)-representation, and more
  generally \(M(W)\). Literal \(M(2)\) has dimension \(n(n-1)\). But

  \[
   \operatorname{rank}H_1(\operatorname{PConf}_n(S^1\times I))
   =n+\binom n2. \]

  Thus the cylinder statement can only use the module induced from the trivial
  \(S_2\)-representation, of dimension \(\binom n2\). We denote this unambiguously
  by

  \[
   M_{(2)}(S)=k\binom S2,
   \qquad M_{(1)}(S)=kS. \]

  Presumably the partition \((2)\), or its Young diagram, was flattened in the
  source.

  **Filtration correction.** Under the standard homology stabilization by
  inserting points at boundary collars, pair-collision meridians are preserved. They therefore form the \(M_{(2)}\) submodule.

  \[
   \boxed{0\longrightarrow\widetilde M_{(2)}\longrightarrow H_1
   \longrightarrow\widetilde M_{(1)}\longrightarrow0,}
  \]

  the reverse of the recorded display. This is proved in §7. If a different
  variance or dual convention was intended, it must be stated; it is not the
  covariant homology stabilization in the record.

  Here \(\operatorname{PConf}_n(X)\) means ordered configurations of \(n\)
  distinct interior points. Replacing the compact cylinder by its interior does
  not change the homotopy calculation and identifies it with \(\mathbf C^*\).
