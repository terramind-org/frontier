statement: |-
  \section{Stationary and Optimal Linear Differential Behaviors}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are denoted by $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$; index ranges, computational models and specialized notation follow the cited problem source and the definitions below.


  A linear time-invariant differential behavior is a space of trajectories satisfying constant-coefficient linear differential equations. For a polynomial matrix $R$, $\ker R(d/dt)$ denotes trajectories annihilated by its associated differential operator. $\succeq0$ means positive semidefinite.

  A state-space system evolves as $\dot x=f(x,u)$ with output $y=h(x,u)$. Model reduction seeks a lower-dimensional system preserving specified input-output properties. Observability distinguishes initial states from their output trajectories, while controllability concerns reachable states under allowed inputs.
  \paragraph{Statement recorded in the supplied source.}
  Characterize the linear time-invariant differential behaviors $\mathcal{B}\in\mathcal{L}^w$ for which there exists a symmetric two-variable polynomial matrix $\Phi\in\mathbb{R}^{w\times w}[\zeta,\eta]$ satisfying $$\mathcal{B}=\ker\Phi\!\left(-\frac{d}{dt},\frac{d}{dt}\right).$$ These are the stationary behaviors. Characterize also the optimal ones, for which one can additionally require $\Phi(-i\omega,i\omega)\succeq0$ for every $\omega\in\mathbb{R}$. \sref{statement}{2}
  \paragraph{Scope qualification.}
  The trajectory regularity and interpretation of the two-variable operator are the report\textquotesingle s conventions.
  \paragraph{Source status.}
  The supplied catalogue labels this record partially solved. Its source-status metadata was checked against the supplied snapshot on 2026-10-11. This import does not independently establish current open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Characterize which linear differential behaviors arise as stationary ones and which satisfy the additional frequency-domain positivity condition.
