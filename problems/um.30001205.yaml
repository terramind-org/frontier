title: Pisot Substitution Conjecture for Pure Point Spectrum
field: mathematics
tier: prose
statement: Does every primitive substitution on a finite alphabet whose inflation multiplier is a Pisot–Vijayaraghavan number, under the usual irreducibility assumptions, produce a continuous dynamical system with pure point dynamical spectrum? Can this be proved by showing that its geometric point-set realization is a regular model set?
