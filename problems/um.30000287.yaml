title: Invariant Subspaces of Weighted Translation Operators
field: mathematics
tier: prose
statement: Let $\omega=(\omega(n))_{n\in\mathbb Z}$ be positive and satisfy $c^{-1}\leq\omega(n+1)/\omega(n)\leq c$ for all $n$. Must the translation-invariant Hilbert space $\ell_\omega^2(\mathbb Z)$ have a nontrivial translation-invariant subspace?
