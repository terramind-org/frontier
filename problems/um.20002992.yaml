title: Forgetting full flags and the local geometry of parabolic braid varieties
field: mathematics
tier: prose
statement: |-
  Relate ordinary braid varieties built from complete flags in $G/B$ to parabolic (or “singular,” in the singular-Soergel sense) braid varieties built from partial flags in $G/P$.

  It is item 6.3 in the section “Braid varieties” of the 2023 AIM workshop *Algebra, geometry, and combinatorics of link homology*. The record gives no definition of “singular braid varieties.” The live problem-list endpoint returned an internal error on 2026-08-13.

  The official workshop report removes much of the ambiguity. Its corresponding working group is titled **Parabolic braid varieties** and says that the group defined a parabolic analogue of braid varieties, proved its affineness, and verified that every parabolic Richardson variety is a special case. Smoothness, Deodhar decompositions, and cluster structures were left as future directions. Thus the best-supported reading is:

  This terminology must be separated from two other readings:

  1. a **scheme-singular closure** of a smooth ordinary braid variety; and
  2. the **singular braid monoid** from classical knot theory.

  No evidence was found that item 6.3 uses the second meaning. Scheme singularities do arise after taking orbit/Richardson closures and projections, but “singular” in the workshop context primarily means parabolic or nonregular.
