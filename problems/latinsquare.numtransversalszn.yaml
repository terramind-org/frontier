schema: 1
id: latinsquare.numtransversalszn
title: Conjectures about Latin Squares (numTransversalsZn)
field: mathematics
tier: proof
statement: |-
  Conjecture 6.7 in [Wa2011]:
  There exist real constants $0 < c_1 < c_2 < 1$ such that
  $$
  c_1^n n! \leq z_n \leq c_2^n n!
  $$
  for all odd $n \geq 3$.
