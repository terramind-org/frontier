lean:
  module: FormalConjectures.Paper.LatinSquare
  decl: LatinSquare.numTransversalsZn
  statement: |-
    theorem numTransversalsZn :
          ∃ᵉ (c₁ > (0 : ℝ)) (c₂ < (1 : ℝ)) (_ : c₁ < c₂),
          ∀ n ≥ 3, Odd n →
            (z n : ℝ) ∈ Set.Icc (c₁ ^ n * n.factorial) (c₂ ^ n * n.factorial)
