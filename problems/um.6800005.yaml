title: Branch points of area-minimizing surfaces
field: mathematics
tier: prose
statement: "1. Does ${\\rm Sing}_b (T)$ have zero $(m-1)$-dimensional Hausdorff measure? 2. If yes, does ${\\rm Sing}_b (T)$ have (Hausdorff) dimension at most $m-2$? 3. A related question is: can we find an example as in where the sequence of accumulating singularities $\\{P_k\\}\\subset {\\rm Sing}_b (T)$ are of branching type? If yes, then one could imagine a Cantor type construction giving a negative answer to 2. 4. White in conjectures that if a $2$-dimensional area-minimizing currents spans a real analytic closed curve, then it has finitely many (interior and boundary) singularities and hence finite topological type. 5. The example in is topologically a disk. Is it possible to give an example of a smooth closed curve $\\Gamma \\subset \\mathbb R^{2+n}$ which bounds an area-minimizing $2$-dimensional current with infinite topology?"
