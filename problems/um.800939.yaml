title: Open Problems and Questions about Geodesics — Conjecture 19 ([Katok1982])
field: mathematics
tier: prose
statement: |-
  Katok [Katok1982] showed that if $g$ is an arbitrary metric and $g_0$ a metric of constant negative curvature on a surface of genus $\geq 2$ such that $\text{area}(g) = \text{area}(g_0)$, then
  $$
  h_{Liou}(g) \leq h_{Liou}(g_0) =h_{top}(g_0) \leq h_{top}(g)
  $$
  and both inequalities are strict unless $g$ also has constant negative curvature. He explicitly formulated the following influential and still open conjecture:

  $h_{top} = h_{Liou}$ for a metric of negative curvature on a compact manifold if and only if it is locally symmetric.
