title: Subgraph Query Complexity for Fixed Pattern Graphs
field: mathematics
tier: prose
statement: Let $f(H,p)$ be the minimum number of adaptive adjacency queries needed to reveal a copy of a fixed graph $H$ in a hidden countably infinite Erdős–Rényi graph $G(\mathbb N,p)$ with probability at least $1/2$. What is the growth of $f(H,p)$ as $p\to0$, and for which $H$ is it of order $p^{-c}$ for some constant $c$?
