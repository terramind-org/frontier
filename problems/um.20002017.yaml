id: um.20002017
title: Two-channel metric variation and a transverse Einstein certificate
field: mathematics
tier: prose
statement: "**Problem 1a:** Given any functional of the metric that is well understood conformally, is there information that can arise going across conformal classes? If the functional is the integral of a local invariant we can obtain information by computing its anti-conformal variation. If the functional is a nonlocal spectral invariant, like the functional determinant, then it is even a challenge to compute the anti-conformal deformation."
