statement: |-
  \section{Decidability of Symmetric Polynomial Nonnegativity}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A symmetric polynomial is invariant under the specified permutations of its variables. Nonnegativity means its value is at least zero throughout the designated domain. A decidability question requires an effective encoding and quantification over the family of domains.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The supplied wording omits uniformity over variable or matrix sizes. Finite-variable polynomial nonnegativity and the source uniform family question must not be silently identified.

  Source-record limitation: The cleaned question omits uniformity over variable or matrix sizes, which is essential to distinguish the cited problem from ordinary decidable finite polynomial nonnegativity.
  \paragraph{Statement recorded in the supplied source.}
  Determine whether nonnegativity of a symmetric polynomial is decidable when there is only one group of variables, and whether the analogous problem is decidable for a single matrix variable. \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-22.
  \subsection{Short English statement}
  Study decidability of the source uniform symmetric-nonnegativity setting.
