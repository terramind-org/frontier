title: Unique Harmonic Metrizations of Line Bundles
field: mathematics
tier: prose
statement: |-
  Let $X$ be a projective variety over an algebraically closed, complete, nontrivially valued field, and let $\omega$ be a normalized positive form on $X$. Does every line bundle $M$ on $X$ admit a difference-of-semipositive metrization $\overline M$, unique up to a scalar multiple, such that $c_1(\overline M)$ is $\omega$-bounded and

  $$c_1(\overline M)\,\omega^{n-1}=\lambda(M)\omega^n,$$

  where $n=\dim X$ and $\lambda(M)=c_1(M)\cdot[\omega]^n$?
