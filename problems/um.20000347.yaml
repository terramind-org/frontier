statement: |-
  **Problem 6.1 (Grushevsky).**
  (1) Construct divisors on \(\mathcal A_g\) of small slope.
  (2) Find explicit complete subvarieties of \(\mathcal A_g\). There is a bound on the codimension of such a variety in [KS03].
