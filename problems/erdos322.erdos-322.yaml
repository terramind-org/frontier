lean:
  module: FormalConjectures.ErdosProblems.«322»
  decl: Erdos322.erdos_322
  statement: |-
    theorem erdos_322 :
        ∀ k : ℕ, 3 ≤ k → ∃ c > (0 : ℝ),
          {n : ℕ | (n : ℝ) ^ c < representationCount k n}.Infinite
  context:
    - open Erdos322
  definitions:
    - name: Erdos322.representationCount
      kind: def
      text: |-
        /-- For `k ≥ 3`, the number of ordered representations of `n` as a sum of `k` many `k`th
        powers of positive integers. The bases can be restricted to the interval from `1` to `n`,
        since `x ≤ x ^ k` for positive `x`. -/
        def representationCount (k n : ℕ) : ℕ :=
          ((Finset.univ : Finset (Fin k → Fin (n + 1))).filter
            (fun a ↦ (∀ i, 0 < (a i : ℕ)) ∧ ∑ i, (a i : ℕ) ^ k = n)).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/322.lean#L38
