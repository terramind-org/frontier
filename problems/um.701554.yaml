title: Kourovka Notebook Problem 19.6
field: mathematics
tier: prose
statement: |-
  Let $G=A\ast_{H}B$ be the generalized free product of groups $A$ and $B$ with amalgamated subgroup $H$.

  a) *Conjecture :* If both $A$ and $B$ are
  nilpotent, then $\mu(G)\leq H$.

  b) *Conjecture :* If $G$ is residually finite, and $H$
  satisfies a nontrivial identical relation, then $\lambda(G)\leq H$.
