title: Square Discriminants and Minimal Ramification of Alternating Group Powers
field: mathematics
tier: prose
statement: Let $$\mathcal M_n=\left\{X^n+\sum_{i=0}^{n-1}\varepsilon_iX^i:\varepsilon_i\in\{\pm1\}\right\}.$$ Does the proportion of polynomials in $\mathcal M_n$ with square discriminant tend to zero as $n\to\infty$, and can the number of such polynomials be bounded by $O(1)$? Separately, for $G=A_5^n$, is the Boston–Markin prediction $$m(G)=\max\{d(G/[G,G]),1\}=1$$ valid?
