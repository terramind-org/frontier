title: Stability Beyond Unstable Population-Process Fluid Limits
field: mathematics
tier: prose
statement: In the two-chunk deterministic-first-chunk peer-to-peer population process, the large-system-limit dynamical system is unstable while simulations suggest that the stochastic process is stable. Prove or disprove this stability conjecture, and hence determine whether instability of a population process can fail to follow from instability of its large-system limit.
