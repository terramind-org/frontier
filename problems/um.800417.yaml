title: Open Problems in Arithmetic Dynamics — Question 40
field: mathematics
tier: prose
statement: |-
  Let $f:\mathbb{P}^N\to\mathbb{P}^N$ be a morphism of degree $d\ge2$ defined over
  $\mathbb{Q}$, and let $P\in\mathbb{P}^N(\mathbb{Q})$ be a point whose $f$-orbit
  $\mathcal{O}_f(P)$ is Zariski dense in $\mathbb{P}^N$.
  Under what conditions on $f$ is it true that for every $\epsilon>0$, the
  set of primes
  \[
  \bigl\{ p : \#\mathcal{O}_{\tilde f}(\tilde P\bmod p) \le p^{(1/2+\epsilon)N} \bigr\}
  \]
  is a set of density $1$?
