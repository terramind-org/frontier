title: Kourovka Notebook Problem 19.107
field: mathematics
tier: prose
statement: |-
  Let $\mathscr{AE}$ be the smallest class of locally compact groups such that
  \begin{itemize}
  \item[(1)] $\mathscr{AE}$ contains the compact groups and the discrete amenable groups;
  \item[(2)] $\mathscr{AE}$ is closed under taking closed subgroups, Hausdorff quotients, directed unions of open subgroups, and group extensions.
  \end{itemize}
  Is every amenable locally compact group an element of $\mathscr{AE}$?

  (A negative answer would follow from a positive answer to 19.21.)
