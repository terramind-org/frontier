title: Lines Tangent to Four Unit Balls
field: mathematics
tier: prose
statement: Given a set of $n$ unit-radius balls in $\mathbb{R}^3$, what is the number of lines that are tangent to four of the balls in the set, and miss all the others? (The balls are not necessarily disjoint.)
