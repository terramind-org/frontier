title: Intrinsic Gerstenhaber Brackets from Projective Resolutions
field: mathematics
tier: prose
statement: Given a projective resolution $P\to A\to0$ of $A$ over $A^e$, how can the Gerstenhaber Lie bracket on $\operatorname{HH}^*(A)$ be expressed in terms of $P$, and how can one intrinsically define a bimap on $D(A^e)(A,\Sigma^*A)$ that corresponds to this bracket under $\operatorname{HH}^*(A)\cong D(A^e)(A,\Sigma^*A)$?
