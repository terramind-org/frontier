title: Positive Energy Conditions and Spaces of Initial Data
field: mathematics
tier: prose
statement: Do known results for nonnegative or positive scalar curvature generalize to initial data sets $(g,k)$ satisfying the strict dominant energy condition? In particular, do nontrivial homotopy classes detected for the space of positive-scalar-curvature metrics yield nontrivial classes in the corresponding space of initial data sets?
