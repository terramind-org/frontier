title: First Failure of Coherent Realization in a Steel Array
field: mathematics
tier: prose
statement: Let $\langle N_\xi\mid\xi\leq\Theta\rangle$ be a Steel array in which $e$-robustness is the criterion for adding extenders. What is the first $N_\xi$ that fails to permit a coherent realization for some countable $\sigma_0:P\prec N_\xi$ and countable normal iteration $I$ of $P$? Does this $N_\xi$ have an iteration with an alternating chain?
