  \section*{Integer multiplication below n log n}\label{30007461}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Is there a uniform exact deterministic multitape Turing-machine algorithm multiplying n-bit binary integers in O(n(log $n)^{1-2^{-182}})$ bit operations, for all sufficiently large n?
  \subsection{Short English statement}
  Is there a uniform exact deterministic multitape Turing-machine algorithm multiplying n-bit binary integers in O(n(log $n)^{1-2^{-182}})$ bit operations, for all sufficiently large n?
