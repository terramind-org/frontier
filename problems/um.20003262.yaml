title: Centralizer models and root-wall obstructions for split-Cartan restrictions
field: mathematics
tier: prose
statement: |-
  **Conjecture 1.** Let \(G\) be a connected semisimple Lie group, \(\Gamma\)
  an irreducible lattice in \(G\), and \(A\) a closed subgroup of a split
  Cartan subgroup of \(G\) with \(\dim A>1\). Then any \(C^1\)-small
  perturbation of the action of \(A\) on \(G/\Gamma\) is
  \(C^\infty\)-conjugate to the action of \(A\) defined by a continuous
  homomorphism from \(A\) to the centralizer of \(A\) in \(G\).

  We also state one of important partial cases of Conjecture 1:
