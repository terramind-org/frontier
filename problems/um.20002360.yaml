title: Certificate escape for CM j-invariants in the complex rational function field
field: mathematics
tier: prose
statement: |-
  **Question 23 (Pheidas).** Consider the elliptic curve
  \[
  E:Y^2=X^3+aX+b.
  \]
  The following statement is Diophantine: “\(\operatorname{End}(E)/(2\operatorname{End}(E))\) has more than 2 elements”. Because \(\operatorname{End}(E)\) is a free finitely generated \(\mathbb Z\)-module, this is equivalent with “\(\operatorname{End}(E)\neq\mathbb Z\)”. So, we can existentially define the following set in \(\mathbb C(Z)\):
  \[
  \{j\in\mathbb C\mid j\text{ is the }j\text{-invariant of a CM elliptic curve}\}.
  \]
  Can we do anything with this set?
