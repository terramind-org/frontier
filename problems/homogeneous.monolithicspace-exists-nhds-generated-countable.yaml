lean:
  module: FormalConjectures.Paper.Homogenous
  decl: Homogeneous.monolithicSpace_exists_nhds_generated_countable
  statement: |-
    theorem monolithicSpace_exists_nhds_generated_countable :
        ∀ (X : Type) (_ : TopologicalSpace X), T2Space X → CompactSpace X →
          Nonempty X → MonolithicSpace X → ∃ x : X, (𝓝 x).IsCountablyGenerated
  context:
    - open Homogeneous
    - open TopologicalSpace Topology Filter Set
    - open scoped Cardinal
  definitions:
    - name: Homogeneous.MonolithicSpace
      kind: class
      text: |-
        /-- A topological space is *monolithic* (see [Ar1987]; [Ar2013] uses the term without
        defining it) if every subspace has network weight at most its density. -/
        class MonolithicSpace (X : Type*) [TopologicalSpace X] : Prop where
          networkWeight_le_density : ∀ Y : Set X, networkWeight Y ≤ density Y
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Paper/Homogenous.lean#L107
