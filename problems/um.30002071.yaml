title: Heat-Trace Asymptotics on Singular and Noncompact Manifolds
field: mathematics
tier: prose
statement: For an elliptic operator $P$ on a possibly noncompact or singular manifold, give criteria ensuring that $e^{-tP}$ is trace class and that its heat trace has an asymptotic expansion $\sum_{\alpha,k}a_{\alpha,k}t^\alpha(\log t)^k$ as $t\to0$.
