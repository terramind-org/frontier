id: um.20001824
title: Scalar-Type-I dilation limits and an entropy-defect certificate
field: mathematics
tier: prose
statement: |-
  Let $(M^n,g_t)_{t\in[0,T)}$ be a Ricci flow with $T<\infty$. Assume
  $R< \frac{C}{T-t}$. Characterize $(T-t)^{-1} g_t$ as $t\to T$.
  This is related to the Hamilton-Tian conjecture. Note that the Kahler Ricci
  flow on Fano manifolds satisfies $R< \frac{C}{T-t}$.
