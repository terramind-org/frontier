title: Geometric Hydrodynamics in Open Problems — Problem 5
field: mathematics
tier: prose
statement: |-
  Find a variational description of the system of material particles, moving in $\mathbb{R}^d$ with $ d>1$ and sticking upon collision,
  for both potential and non-potential fluid flows.
  This formulation should be sufficiently flexible to describe the formation and development of shock waves
  in the system described by the multi-dimensional Burgers equation.
