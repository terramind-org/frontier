  \section*{Superreflexivity from nontrivial Markov type}\label{30007181}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must every real Banach space with Markov type p for some $p>1$ be superreflexive, equivalently admit an equivalent uniformly convex norm?
