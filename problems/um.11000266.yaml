statement: "Does the Teichm¨ uller space for Sg admit an equivariant deformation retraction onto a cocompact spine whose dimension is equal to 4g− 5, the virtual cohomological dimension of Mod±(Sg)? 1if g ≥ 2 then the curvature will be negative 20. Automorphism groups of free, surface and free abelian groups 321 Further questions of a similar nature are discussed in (2.1). The issues involved in using these symmetric space analogs to prove purely group theoretic properties are illustrated in the proof of the Tits alternative, which holds for all three classes of groups. A group Γ is said to satisfy the Tits alternative if each of its subgroups either contains a non-abelian free group or else is virtually solvable. The strategy for proving this is similar in each of the three families that we are considering: inspired by Tits’s original proof for linear groups (such as GL( n, Z)), one attempts to use a ping-pong argument on a suitable boundary at infinity of the symmetric space. This strategy ultimately succeeds but the details vary enormously between the three contexts, and in the case of Out( Fn) they are particularly intricate ([ 4, 3 ] versus [ 9]). One finds that this is often the case: analogies between the three classes of groups can be carried through to theorems, and the architecture of the expected proof is often a good guide, but at a more detailed level the techniques required vary in essential ways from one class to the next and can be of completely diﬀerent orders of diﬃculty. Let us return to problems more directly phrased in terms of the geometry of the symmetric spaces. The symmetric space for GL( n, Z) has a left-invariant metric of non-positive curvature, the geometry of which is relevant to many areas of mathematics beyond geometric group theory. Teichm¨ uller space has two natural metrics, the Teichm¨ uller metric and the Weyl-Petersen metric, and again the study of each is a rich subject. In contrast, the metric theory of Outer space has not been developed, and in fact there is no obvious candidate for a natural metric. Thus, the following question has been left deliberately vague:"
