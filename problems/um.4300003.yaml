title: Analogues of Pesin theory
field: mathematics
tier: prose
statement: Is there an analogue of Pesin theory for suitably defined smooth maps of the objects that arise naturally in algebraic dynamical systems—compact sets locally resembling a manifold times a Cantor set, or totally disconnected compact sets? Can any algebraic $\mathbb{Z}^d$-systems with $d>1$ be perturbed in a meaningful way?
