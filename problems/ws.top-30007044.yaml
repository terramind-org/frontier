statement: |-
  \section*{Maximal multipoint Seshadri constants in higher complex dimension}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each smooth connected projective complex n-fold X of $n\geq 3$ and ample line L, does there exist $r_{0}(X,L)$ such that for all $r\geq r_{0}$, the multipoint Seshadri constant at very general distinct r-tuples is $(L^n/r)^{1/n}$?
  \subsection{Short English statement}
  For each smooth connected projective complex n-fold X of $n\geq 3$ and ample line L, does there exist $r_{0}(X,L)$ such that for all $r\geq r_{0}$, the multipoint Seshadri constant at very general distinct r-tuples is $(L^n/r)^{1/n}$?
