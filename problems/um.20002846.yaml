title: A weighted planar reduction for the logarithmic test function on the smooth worm
field: mathematics
tier: prose
statement: |-
  Let \(\mathcal W\) be the smooth Diederich--Fornæss worm domain in \(\mathbb C^2\), and let \(\mathbf B_{\mathcal W}\) be its Bergman projection. Prove or disprove that
  \[
  \mathbf B_{\mathcal W}(\log \overline{z_1})\in C^\infty(\overline{\mathcal W}).
  \]
  If it is not smooth up to the boundary, this gives an alternative proof that Condition R fails on \(\mathcal W\).
