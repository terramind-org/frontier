title: Congruences for Extremal Modular Forms
field: mathematics
tier: prose
statement: Let $f(\tau)=1+\sum_{i\geq1}a_iq^i$ be the extremal modular form of weight $12\mu$, and let $p$ be a prime such that $p$ divides $a_i$ whenever $p$ does not divide $i$, while not every $a_i$ is divisible by $p$. Must there be a modular form $g$ of smaller weight such that $f(\tau)\equiv g(p\tau)\pmod p$? Moreover, can $g$ be chosen extremal and can one obtain $f(\tau)\equiv g(p^r\tau)\pmod p$ for some $r\in\mathbb{N}$?
