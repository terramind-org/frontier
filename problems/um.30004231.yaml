title: Shellability and Homology of Totally Mixed Face Posets
field: mathematics
tier: prose
statement: Let $P_1,P_2\subset\mathbb R^n$. A face $F=F_1+F_2$ of $P_1+P_2$ is totally mixed if $F_i\subset P_i$, $\dim F_i>0$, and $\dim F=\dim F_1+\dim F_2$. Is the poset of totally mixed faces shellable, and does its geometric realization have the rational homology of a wedge of $(n-2)$-spheres?
