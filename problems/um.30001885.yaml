title: Asymptotic Enumeration of Higher-Dimensional Permutations
field: mathematics
tier: prose
statement: For fixed d, let $S_{d,n}$ be the d-dimensional permutations of order n. Is $|S_{d,n}|=\left(n/e^d+o(n)\right)^{n^d}$ as $n\to\infty$?
