title: Kourovka Notebook Problem 7.33
field: mathematics
tier: prose
statement: |-
  An
  elementary $TI $-subgroup $V$ of a finite group $G$ is said to
  be a *subgroup of non-root type* if $1 \ne N_V(V^g) \ne V$
  for some $g \in G$. Describe the finite groups $G$ which contain a
  2-subgroup $V$ of non-root type such that $[V, V^g]=1$ implies
  that all involutions in $VV^g$ are conjugate to elements of $V$.
