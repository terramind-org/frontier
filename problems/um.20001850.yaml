title: Noncontractible equilateral trefoil components after rotation reduction
field: mathematics
tier: prose
statement: |-
  **1. (Farber) Configuration spaces of closed polygons in \(\mathbb R^3\).** Let
  \(\ell=(\ell_1,\ldots,\ell_n)\) be the length vector defining a closed polygon.
  The configuration space is
  \[
  M_\ell\setminus\Sigma=\bigsqcup U_i,
  \]
  where \(U_i\) are the connected components, and \(\Sigma\) is the set of
  configurations with self-intersections. Questions: Are the \(U_i\)
  contractible? What can we say about their topology?
