title: Boundaries of Groups and Kleinian Groups — Problem 33
field: mathematics
tier: prose
statement: If G is ﬁnitely generated with asymptotic dimension ≥ n, and X is a subset of the Cayley graph with asymptotic dimension ≤ n − 2 that coarsely separates the Cayley graph, then G splits over some subgroup H ≤ G with asymptotic dimension ≤ n − 1. A homogeneous continuum is a locally connected compact metric space whose group of homeomorphisms acts transitively. Papasoglu showed that every simply connected homogeneous continuum has the property that no simple arc separates it.
