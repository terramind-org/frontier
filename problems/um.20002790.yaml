title: Residue isolation and an exact finite-field hyper-Kloosterman transform
field: mathematics
tier: prose
statement: '(1) Isolate contributions of the continuous "special" representations on the geo-metric side of the trace formula. Here, special refers to larger poles of rela-tive L-functions. Some special cases may be related to the Rankin-Selberg integral method, for instance, the doubling integral method of Piatetski-Shapiro and Rallis on GL n or GL 2.(2) Take the current literature on beyond endoscopy, and make a list of the precise local and global statements required. For example: local matching and global matching. (3) Arthur has introduced the so-called r-trace formula. Describe (and name!) the r-"beyond endoscopy" groups and discuss the meaning of geometric matching. (4) How does the functional equation give an expression for the r-trace formula? In other words, how does the r-Fourier transform play roles here? (5) Isolate the contribution of hyperkloosterman sums to the Kuznetsov trace formula and explain it spectrally.'
