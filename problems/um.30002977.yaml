statement: For a general polarized K3 surface $(X,L)$ and an irreducible component $V\subset V_{n,\delta}(X)$, is the moduli map $\psi_{X,n,\delta}|_V$ generically finite, or birational when $g>1$, onto its image in $M_g$?
