title: Martinez–Maure Support Functions as Singular Minimizers
field: mathematics
tier: prose
statement: |-
  Is the support function $R$ of the Martínez–Maure example a Lipschitz singular minimizer of

  $$\int_{B_1}F(\nabla u)\,dx$$

  for some integrand $F$ whose singular set $D_F$ consists exactly of the four noncoplanar cusps?
