title: Open Problems in Integrable Systems — Topology of integrable systems, Lagrangian fibrations, and their invariants
field: mathematics
tier: prose
statement: Describe the symplectic invariants of stable rank-one singularities described by V. V. Kalashnikov. For such singularities, one of the action variables, say $I_1$, is smooth, and the other $I_2$ is singular. Is it true that $I_1$ and $I_2$ are sufficient for the symplectic classification? Here is an almost equivalent version of this question. Assume that we have two functions $H$ and $F$ that commute with respect to two different symplectic structures $\omega_1$ and $\omega_2$ and define (in both cases) a stable rank-one singularity described by V. V. Kalashnikov. Assume that the action variables $I_1$ and $I_2$ are the same for $\omega_1$ and $\omega_2$. This condition is equivalent to the relation $$ \oint_\gamma \alpha_1 = \oint_\gamma \alpha_2 $$ for any cycle $\gamma$ on any regular fiber $\mathcal L_{f,h}=\{ F=f, H=h\}$ and appropriately chosen $1$-forms $\alpha_i$ such that $d\alpha_i = \omega_i$, $i=1,2$. Is it true that, under these conditions, there exists a smooth map $\psi$ that preserves the functions $F$ and $H$ and such that $\psi^*(\omega_2)=\omega_1$? The source notes that the simplest case is known.
