title: The Lyapin's Notebook — Problem 5
field: mathematics
tier: prose
statement: |-
  (S. Kublanovsky)
  Describe locally residually finite varieties of semigroups for known predicates.\\
  In the global case, such description is obtained in [Kubl1], [Kubl2]. For the equality predicate in the local case, the description is obtained in [Sapir]. Locally residually finite varieties of rings were described in [Kubl3].
