id: um.800439
title: Analysis of Boolean Functions — Fourier Entropy--Influence Conjecture
field: computer-science
tier: prose
statement: There is a universal constant $C$ such that for any $f \colon \{-1,1\}^n \to \{-1,1\}$ it holds that $\mathbb{H}[\widehat{f}^2] \leq C \cdot \mathbf{I}[f]$, where $\mathbb{H}[\widehat{f}^2] = \sum_{S} \widehat{f}(S)^2 \log_2\frac{1}{\widehat{f}(S)^2}$ is the spectral entropy and $\mathbf{I}[f]$ is the total influence.
