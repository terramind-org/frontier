id: um.30001951
title: Complex Structures on Polyhedral Kähler Manifolds
field: mathematics
tier: prose
statement: If a nonnegatively curved, nonflat polyhedral manifold $M$ has irreducible holonomy and $b_2(M)>0$, does $M$ have a natural holomorphic structure, is it biholomorphic to $\mathbb{CP}^n$, and is its metric a singular Kähler metric? More generally, does every polyhedral Kähler manifold $M^{2n}$ have a natural complex structure, specifically one making it PL-diffeomorphic to a complex analytic space with complex singularities of complex codimension at least $3$ and biholomorphic outside the metric singularities?
