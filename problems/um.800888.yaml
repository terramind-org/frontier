title: Open Problems in Pluripotential Theory — Question 19 (Berman)
field: mathematics
tier: prose
statement: |-
  Let $\mu_S$ denote the normalized $n$-dimensional Hausdorff measure on a smooth totally real manifold $S \subset X$ of maximal real dimension $n$.
  It has been shown by Sadullaev in [Sad] that $S$ is non pluripolar, hence $\mu_S$ is the Monge-Amp\`ere measure
  $\mu_S=(\omega+dd^c \varphi_S)^n$ of a unique function $\varphi_S \in {\mathcal{E}}(X,\omega)$ normalized by $\sup_X \varphi_S=0$.

  What is the optimal regularity of $\varphi_S$ ?
