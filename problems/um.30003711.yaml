title: Schwarz Genus of the Flex-Point Cover
field: mathematics
tier: prose
statement: Let $X$ be the space of smooth complex homogeneous cubic polynomials in three variables modulo $\mathbb C^\times$, and let $Y=\{(F,p):p\in\mathbb{CP}^2\text{ is a flex of }F=0\}$. The map $Y\to X$ is a degree-nine covering; determine its Schwarz genus.
