title: A ramification-bias criterion for predicted mean point counts
field: mathematics
tier: prose
statement: |-
  **Question 20 (Melanie Matchett Wood). When do (A) and (B) predict an interesting average value of \(\#C(\mathbb F_q)\)?**

  Thus the verified
  typeset question is

  The three-page problem sheet does **not** define Principles (A) and (B). The workshop report says
  that Wood's opening talk asked when point counts in a family can be modeled by a sum
  of independent identically distributed fiber variables. Questions 3--7 also connect
  (A), (B), automorphism weights, local behavior of field extensions, the counting
  invariant, and independence. Wood's contemporaneous papers make the following a
  natural contextual reconstruction, but it is not textually verified as the workshop's
  exact labeling:

  - **Reconstructed (A), local marginal/mass principle:** at a rational place, a local
    degree-\(n\) algebra \(L\) has relative mass
    \(1/(|\operatorname{Aut}L|\,|D_L|)\), or the corresponding structured
    centralizer-weighted version when a monodromy group is fixed.
  - **Reconstructed (B), independence principle:** local types at distinct rational
    places become asymptotically independent (and are identically distributed when
    the geometry has no distinguished rational places).

  Everything proved below is therefore a rigorous answer to this explicitly labeled
  reconstruction. Recovering Wood's workshop slides or notes could change which label
  is attached to which principle, and possibly the exact normalization. No claim below
  depends on calling the two principles A or B; it depends only on the stated mass and
  independence hypotheses.
