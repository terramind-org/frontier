title: Local Discrete Holomorphic Dynamics — Open Problem Q5
field: mathematics
tier: prose
statement: |-
  \emph{Find normal forms and invariants with respect to the relation
  of formal conjugacy for holomorphic local dynamical systems at $O\in\mathbb{C}^n$.}

  In the rest of this paper we shall describe a few specific open problems,
  both in one and in several complex variables; we
  refer to [A5,A6] and [Br2] for surveys on the theory of discrete holomorphic local dynamical systems, and for more details on the known answers to the previous questions and on background of the open problems we selected.
