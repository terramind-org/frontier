title: Invariance certificates and obstructions for representation-ball averages
field: mathematics
tier: prose
statement: |-
  What is the limiting distribution of \(\mu_T\) as \(T\to\infty\)?

  The exact Question 19 occupies the end of Section 4.3; all text beginning with “4.4. For irrational \(\alpha\), the sequence \(\{\alpha n^2\pmod 1\}\) ...” belongs to the next section and is not part of this record.

  The preceding paragraph supplies the missing setup. Let \(G\) be a semisimple Lie group acting linearly on a finite-dimensional real vector space \(V\), equipped with a norm. Fix \(p\in V\), and put
  \[
   R_T=\{g\in G:\|gp\|<T\}. \tag{1.1}
  \]
  The AIM text assumes that the stabilizer \(G_p\) is finite, says that this makes \(R_T\) compact, fixes a lattice \(\Gamma<G\), and defines \(\mu_T\) to be the pushforward to \(G/\Gamma\) of normalized Haar measure on \(R_T\). Question 19, contributed by N. Shah, is:

  The next sentence says that examples are known in references [53, 73] and motivates the problem by distribution of \(\Gamma\)-orbits on \(G/H\), either when \(\Gamma\cap H\) is a lattice in \(H\) or when \(\Gamma H\) is dense in \(G\). The official bibliography identifies [53] as Eskin--Mozes--Shah (1996) and [73] as the 2004 preprint of Gorodnik--Weiss, published in 2007.
