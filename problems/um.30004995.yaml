title: Borel Extensions of Hyper-Aperiodic Coloring Theorems
field: mathematics
tier: prose
statement: Let $S\subseteq q^\Gamma$ be a subshift of finite type and let $f:\operatorname{Free}(k^\Gamma)\to q$ be an $S$-coloring whose coding map has no nonidentity element of $\Gamma$ fixing its entire image. Determine additional hypotheses ensuring that, when $f$ is Borel rather than continuous, every free Borel $\Gamma$-action still admits a Borel hyper-aperiodic $S$-coloring.
