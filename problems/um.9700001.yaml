title: Martingale for practical purposes
field: mathematics
tier: prose
statement: Give a mathematically useful definition of a process being a 'martingale for practical purposes', so that failure means it is practical to find a stopping time $T$ with $\mathbb{E}X_T\ne\mathbb{E}X_0$. For a discrete process $X_0,\ldots,X_n$, can a natural polynomial-size collection of stopping-time constraints define a tractable such class?
