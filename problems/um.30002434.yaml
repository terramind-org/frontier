title: Polynomial Asymptotics for Shifted Divisor Correlations
field: mathematics
tier: prose
statement: |-
  For $r\geq 3$ and fixed $h\neq 0$, is

  $$D_r(X;h)=\sum_{n\leq X}d_r(n)d_r(n+h)\sim X P_{2(r-1)}(\log X;h),$$

  where $P_{2(r-1)}(u;h)$ is a polynomial of degree $2(r-1)$ in $u$?
