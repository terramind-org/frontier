title: A cohomological target and periodic certificates for contact dissipation
field: mathematics
tier: prose
statement: |-
  Let \((M,\xi)\) be a closed contact manifold and let
  \(\varphi\in\operatorname{Cont}(M,\xi)\). Suppose that the induced
  action on contact homology \(CH(M,\xi)\) is hyperbolic, in a sense
  still to be defined. Then \(\varphi\) is strongly dissipative: there
  is no smooth \(\varphi\)-invariant volume form.

  The bracketed comments and, in particular, the warning that “hyperbolic” still has to be formulated are in the source itself.

  The recovered conjecture is:

  The source then places the conjecture in the “functor” from smooth topology to contact topology: a manifold gives its unit cotangent bundle, a submanifold gives its unit conormal, and a diffeomorphism gives a lifted contactomorphism. The question asks how much smooth information survives these constructions.

  Throughout the mathematical results below, \(M^{2n+1}\) is closed and \(\xi\) is cooriented, \(\alpha\) is a positive contact form with \(\ker\alpha=\xi\), and \(\varphi\) preserves the coorientation. This is the standard setting for the contact-homology algebra and for Polterovich's paper. For a coorientation-reversing map, an invariant volume for \(\varphi\) would also be invariant under \(\varphi^2\), so obstructions may instead be applied to the square.
