statement: |-
  \section{Complex Bohr-Sommerfeld action and a stability obstruction}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$; the standard number fields have their usual meanings. All additional conventions are stated locally.


  \paragraph{Definitions and notation.}Let $a$ be the analytic symbol on a two-dimensional phase space specified in the source, $h>0$ the semiclassical parameter and $a^w(x,hD)$ its Weyl quantization. For a self-adjoint one-degree-of-freedom Hamiltonian, the classical action around an energy curve underlies Bohr--Sommerfeld quantization, with a Maslov correction. For a complex symbol the corresponding cycles and actions may be complex.

  \paragraph{Catalogue wording retained for traceability.}
  Bohr-Sommerfeld

  Is there a Bohr-Sommerfeld quantization rule for $a^w(x,hD)$? Is there a link to the usual Bohr-Sommerfeld rule for Hermitian operators?
  \paragraph{Scope and source qualification.}The source leaves the analytic symbol’s global assumptions and admissible cycles unspecified. The Hermitian rule is explanatory context, not an assertion that an unchanged real-action formula holds for arbitrary non-Hermitian operators. The catalogue title/status was paired with a machine-generated research attempt; that attempt is not peer-reviewed evidence of settlement. The statement covers the original source questions rather than only the title’s subcase.
  \subsection{Short English statement}
  Find a complex Bohr--Sommerfeld eigenvalue rule and relate it to the Hermitian rule.
