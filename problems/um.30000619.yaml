title: Bounded-Depth Pigeonhole Proofs and Prime Infinitude
field: mathematics
tier: prose
statement: (i) Do the propositional pigeonhole-principle tautologies $\mathrm{PHP}_n^{2n}$ and $\mathrm{PHP}_n^{n^2}$ have polynomial-size, constant-depth LK proofs? (ii) Let $\pi(x)$ be the number of primes at most $x$, and let $\mathrm I\Delta_0(\pi)$ be $\mathrm I\Delta_0$ augmented by $\pi$ and its natural recursive definition. Does $\mathrm I\Delta_0(\pi)$ prove that there are arbitrarily large primes?
