lean:
  module: FormalConjectures.ErdosProblems.«338»
  decl: Erdos338.erdos_338.variants.eq_order
  statement: |-
    theorem erdos_338.variants.eq_order :
        ∀ A : Set ℕ, (∃ h, HasOrder A h) →
          (restrictedOrder A = basisOrder A ↔ erdos_338.variants.eq_order.answer A)
  context:
    - open Erdos338
    - open Erdos338.erdos_338
    - open Erdos338.erdos_338.variants
    - open Filter
  definitions:
    - name: Erdos338.HasOrder
      kind: def
      text: |-
        /-- `HasOrder A h` means that $A$ is a basis of order $h$: every sufficiently large natural number
        is a sum of at most $h$ elements of $A$, with repetition allowed.

        The summands form a `Multiset`, so repetition is allowed. Allowing at most $h$ summands makes the
        notion independent of whether $0 \in A$. With exactly $h$ summands, as in
        `Set.IsAsymptoticAddBasisOfOrder`, this notion is `(insert 0 A).IsAsymptoticAddBasisOfOrder h`. -/
        def HasOrder (A : Set ℕ) (h : ℕ) : Prop :=
          ∀ᶠ m in atTop, ∃ S : Multiset ℕ, (∀ x ∈ S, x ∈ A) ∧ S.card ≤ h ∧ S.sum = m
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/338.lean#L46
    - name: Erdos338.basisOrder
      kind: def
      text: |-
        /-- The order of $A$: the least $h$ with `HasOrder A h`, or `⊤` if $A$ is not a basis. -/
        noncomputable def basisOrder (A : Set ℕ) : ℕ∞ :=
          ⨅ (h : ℕ) (_ : HasOrder A h), (h : ℕ∞)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/338.lean#L63
    - name: Erdos338.restrictedOrder
      kind: def
      text: |-
        /-- The restricted order of $A$: the least $t$ with `HasRestrictedOrder A t`, or `⊤` if no such
        $t$ exists. -/
        noncomputable def restrictedOrder (A : Set ℕ) : ℕ∞ :=
          ⨅ (t : ℕ) (_ : HasRestrictedOrder A t), (t : ℕ∞)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/338.lean#L67
    - name: Erdos338.erdos_338.variants.eq_order.answer
      kind: def
      text: "def erdos_338.variants.eq_order.answer : Set ℕ → Prop := sorry"
