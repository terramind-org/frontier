title: Kourovka Notebook Problem 11.14
field: mathematics
tier: prose
statement: |-
  Is every finite simple
  group characterized by its Cartan matrix over an algebraically
  closed field of characteristic 2? In (R. Brandl, *Arch.
  Math.*, **38** (1982), 322--323) it is shown that for any given
  finite group there exist only finitely many finite groups with
  the same Cartan matrix.
