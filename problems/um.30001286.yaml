title: Left Exactness of n-Motivic Sheaf Inclusions
field: mathematics
tier: prose
statement: In Voevodsky's theory of homotopy invariant Nisnevich sheaves with transfers over a perfect field $k$, let $HI(k)$ denote the abelian category of homotopy invariant sheaves with transfers and let $HI^{\leq n}(k)$ be the full subcategory of $n$-motivic (slice-filtration $\leq n$) sheaves. Is the inclusion functor $HI^{\leq n}(k) \hookrightarrow HI(k)$ left exact?
