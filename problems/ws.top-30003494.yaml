  \item[\hypertarget{source:statement:2}{S2}] Algebraic Groups (2017), Oberwolfach Reports, DOI 10.4171/owr/2017/21, pp. 1281--1347. Primary report accessed 2026-10-11; relevant PDF pages 50.
