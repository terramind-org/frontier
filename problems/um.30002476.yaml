title: Diagonal Signings and Real Eigenvalues of Random Matrices
field: mathematics
tier: prose
statement: For a random $n\times n$ matrix $M_n$ with entries in $\{\pm1\}$, does the probability tend to $1$ that no choice of signs for its diagonal entries makes it singular? Does $M_n$ have at least two real eigenvalues with probability $1-o(1)$?
