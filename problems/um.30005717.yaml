title: Even-Dimensional Stress-Space Reconstruction
field: mathematics
tier: prose
statement: Let $d=2k\geq 4$, and let $P$ be a simplicial $d$-polytope in its natural embedding with no missing faces of dimension at least $d-k+1$. Prove that the space of affine $k$-stresses determines $P$ up to affine equivalence.
