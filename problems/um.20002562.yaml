title: Topology-dependent continuum limits of square binary RBMs
field: mathematics
tier: prose
statement: |-
  Characterize the limiting set of distributions for
  \(\lim_{n\to\infty}RBM_{n,n}\).

  Consider the limit as \(n\to\infty\) for \(RBM_{n,n}\). It was suggested
  that this limiting set of distributions can be seen as a set of measures on
  the unit interval. Do all possible measures belong to this set? If not,
  which ones do?
