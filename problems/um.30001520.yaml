title: Homotopy-Theoretic Subgroups and Cohomology of $\operatorname{Baut}(X)$
field: mathematics
tier: prose
statement: For a finite simply connected CW complex $X$ and the monoid $\operatorname{Baut}(X)$ of self-homotopy equivalences, how many homotopy-theoretic subgroups are there, how large can such a subgroup be, and what is the cohomology of $\operatorname{Baut}(X)$?
