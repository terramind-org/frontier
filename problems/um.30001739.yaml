title: Multiplicity of Galois-Invariant Imprimitive Products
field: mathematics
tier: prose
statement: Let $E/F$ be a quadratic extension of local fields, let $\tau$ be its nontrivial Galois involution, set $G=\operatorname{GL}_n(E)$, and let $X$ be the variety of nonsingular Hermitian matrices over $E/F$ with its natural right $G$-action. If $\pi_1,\ldots,\pi_k$ are $\tau$-invariant imprimitive representations and $\pi=\pi_1\times\cdots\times\pi_k$ is irreducible, is $\dim\operatorname{Hom}_G(X,\pi^*)=2^k$?
