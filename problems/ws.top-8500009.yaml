  \section{Existence of a strong rational Diophantine quadruple}\label{8500009}
  {\small\sffamily UnsolvedMath ID 8500009 · Graph Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For $q\in\mathbb Q$, a rational $D(q)$-$m$-tuple is a set $A=\{a_1,\ldots,a_m\}\subset\mathbb Q\setminus\{0\}$ of distinct numbers such that $a_i a_j+q$ is a square in $\mathbb Q$ for every $i<j$. Elements may have either sign; zero squares are allowed. A strong rational $D(1)$-tuple additionally satisfies $a_i^2+1\in\mathbb Q^2$ for every $i$, so the square condition holds for all pairs including equal indices.
  \paragraph{Statement recorded in the supplied source.}
  Does there exist a strong rational $D(1)$-quadruple? \sref{8500009}{2}
  \subsection{Short English statement}
  Can four distinct nonzero rationals satisfy all pairwise and all four diagonal square conditions?
