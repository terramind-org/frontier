title: Shokurov Finite-Generation Conjecture
field: mathematics
tier: prose
statement: Let $(X,B)$ be a pair and let $A=A(X,B)$ be its discrepancy b-divisor. A system $D_\bullet$ of b-divisors on $X$ is asymptotically canonically saturated if, for all $i,j$, there is a model $Y(i,j)\to X$ such that $$\operatorname{Mob}\left\lceil(jD_i+A)_Y\right\rceil\leq j(D_j)_Y$$ on every model $Y\to Y(i,j)$. Let $(X,B)$ be klt and let $f:X\to Z$ be a pl flipping contraction for $K_X+S+B$, with $Z$ affine. If $D_\bullet$ is an asymptotically canonically saturated, positive, convex, bounded characteristic system of b-divisors on $X$, is the pbd-algebra $R(X,D_\bullet)$ finitely generated?
