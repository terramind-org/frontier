title: Euler Characteristic and Integral Approximation from Simplicial Volume
field: mathematics
tier: prose
statement: |-
  Let $M$ be an oriented closed connected aspherical manifold with simplicial volume $\lVert M\rVert=0$. Must $\chi(M)=0$? More strongly, if $\pi_1(M)$ is residually finite, does

  $$\lVert M\rVert_{\mathbb Z}^{\infty}=\lVert M\rVert$$?
