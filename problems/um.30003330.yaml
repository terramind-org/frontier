title: Gyárfás–Sumner Conjecture for Forest-Free Graphs
field: mathematics
tier: prose
statement: For every forest $H$, does there exist a function $f_H$ such that every $H$-free graph $G$ satisfies $\chi(G)\leq f_H(\omega(G))$?
