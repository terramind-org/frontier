title: Projective Normality of Smooth Toric Varieties
field: mathematics
tier: prose
statement: Let $X_\Sigma$ be a smooth projective toric variety and let $L$ be ample. Is the embedding defined by the complete linear series of $L$ projectively normal? Equivalently, is $\operatorname{Sym}^kH^0(X_\Sigma,L)\to H^0(X_\Sigma,L^k)$ surjective for every $k\geq1$?
