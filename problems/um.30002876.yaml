title: Steinberg Tensor Products with Good Filtrations
field: mathematics
tier: prose
statement: Let $G$ be a simple algebraic group over an algebraically closed field of characteristic $p > 0$, let $X^+$ be the set of dominant weights, let $L(\lambda)$ be the simple rational $G$-module of highest weight $\lambda \in X^+$, and let $\mathrm{St}_r = L((p^r - 1)\rho)$ be the $r$-th Steinberg representation. For which dominant weights $\lambda \in X^+$ does the tensor product $\mathrm{St}_r \otimes L(\lambda)$ admit a good filtration (i.e., a filtration with dual-Weyl / costandard quotients $\nabla(\mu)$) as a rational $G$-module?
