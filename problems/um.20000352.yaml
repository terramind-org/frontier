title: "Albanese sums of symmetric powers: thresholds, arithmetic reduction, and explicit fibers"
field: mathematics
tier: prose
statement: |-
  With some hypotheses on \(X\) and
  \(X\to\operatorname{Alb}(X)\), study the image of
  \(\operatorname{Sym}^d(X)\to\operatorname{Alb}(X)\) for some small
  \(d\).

  What are examples of \(X\) for which the fibers of
  \(\operatorname{Sym}^dX\to\operatorname{Alb}(X)\) are
  “well-understood”? For example, when are they finite or rational?
