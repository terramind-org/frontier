title: Adding transfers in motivic homotopy theory and a quadratic framing-loss obstruction
field: mathematics
tier: prose
statement: |-
  **Long Term.** Do we have a motivic description akin to adding transfers?

  Can a motivic or equivariant-motivic stable homotopy category be constructed
  from a more naive motivic category by freely adjoining coherent additive
  transfers, in analogy with spectral Mackey descriptions of genuine
  equivariant spectra?
