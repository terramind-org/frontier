lean:
  module: FormalConjectures.Arxiv.«0912.2382».CurlingNumberConjecture
  decl: Arxiv.«0912.2382».curling_number_conjecture
  statement: "theorem curling_number_conjecture (S₀ : List ℤ) (h : S₀ ≠ []) : ∃ m, k (S S₀ m) = 1"
  context:
