title: Open Problems in Pluripotential Theory — Question 21 (DiNezza-Lu)
field: mathematics
tier: prose
statement: |-
  Let $(X,\omega)$ be a compact $n$-dimensional K\"ahler manifold.
  Assume $\varphi \in {\mathcal{E}}(X,\omega)$ solves the equation $(\omega+dd^c \varphi)^n=f\omega^n$, with $f\in L^1$ being
  smooth off a divisor $D\subset X$. Is the function $\varphi$ smooth on $X\setminus D$?
