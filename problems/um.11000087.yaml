statement: ( Topological Schottky Problem). Understand the homotopy type of Jc g and use it to compute H •(Jc g ) and H • c (Jc g ). The first interesting case is when g = 4, where Jc g is a singular divisor in h4. It would also be interesting and natural to compute the intersection homology of Jc g. 3. Finiteness and Torelli spaces 69 A knowledge of the topology of Jg,Jc g orQc g should help with the computation of the σ- invariant homology H•(Tg)⟨σ⟩.7 When 2 is invertible in the coeﬃcient ring R, we can write H•(Tg;R) = H•(Tg;R)+⊕H•(Tg;R)− where σ acts as the identity on H•(Tg;R)+ and as −1 on H•(Tg;R)−.
