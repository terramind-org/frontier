title: Kourovka Notebook Problem 9.75
field: mathematics
tier: prose
statement: |-
  Find all local formations ${\mathfrak{F}}$ of finite
  groups such that, in every finite group, the set of ${\mathfrak{F}}$-subnormal subgroups forms a lattice.

  *Comment of 2015*: Subgroup-closed formations with this property are described in (Xiaolan Yi, S. F. Kamornikov, *J. Algebra*, **444** (2015),
  143--151).
