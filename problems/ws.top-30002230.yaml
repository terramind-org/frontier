  \section{Comparison Properties and Jiang–Su Absorption}\label{30002230}
  {\small UnsolvedMath ID 30002230 · Algebra}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For every nonelementary, stably finite, simple, separable, unital, nuclear $C^*$-algebra, are $\mathcal Z$-absorption, local weak comparison, and strict comparison equivalent? In particular, are local weak comparison and strict comparison equivalent?
  \par\smallskip\textit{Formulation references:} \sref{30002230}{1}, \sref{30002230}{2}.
  \subsection{Short English statement}
  For every nonelementary, stably finite, simple, separable, unital, nuclear $C^*$-algebra, are $\mathcal Z$-absorption, local weak comparison, and strict comparison equivalent? In particular, are local weak comparison and strict comparison equivalent?
