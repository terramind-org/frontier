title: Tensor-Bundle Parametrization of Diffusion Densities
field: mathematics
tier: prose
statement: For diffusion PCA on a Riemannian manifold, prove or disprove the conjecture that the family $\Gamma$ of point-sourced diffusion densities can be parametrized by the bundle of symmetric positive-definite covariant tensors of order $2$.
