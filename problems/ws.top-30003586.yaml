  \section{\texorpdfstring{Uniform Property Gamma for Nuclear $C^*$-Algebras}{Uniform Property Gamma for Nuclear C\textasciicircum{}*-Algebras}}\label{30003586}
  {\small UnsolvedMath ID 30003586 · Algebra}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Does every simple separable unital nuclear $C^*$-algebra have uniform property $\Gamma$; that is, for every $k\geq2$, does its central sequence algebra contain $k$ pairwise orthogonal positive contractions whose trace is $1/k$ for every limit trace?
  \par\smallskip\textit{Formulation references:} \sref{30003586}{1}, \sref{30003586}{2}.
