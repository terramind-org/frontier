title: Selection Principles Milestone Problems — Problem 42 ([CpHure, Problem 2])
field: mathematics
tier: prose
statement: |-
  The *monotonic sequence selection property* is defined like the SSP
  with the additional assumption that for each $n$ the sequence $\{f^n_k\}_{k\in\mathbb{N}}$
  converges pointwise *monotonically* to $\mathbf{0}$.

  Does the monotonic sequence selection property of
  $C_p(X)$ imply the weak sequence selection property?
