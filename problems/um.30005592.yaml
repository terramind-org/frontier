title: Classification of Noncollapsed Four-Dimensional Steady Solitons
field: mathematics
tier: prose
statement: Prove that the only noncollapsed four-dimensional steady gradient Ricci solitons with nonnegative curvature operator are the Bryant soliton and the $\mathbb Z_2\times O(3)$-symmetric family, and that every soliton in the latter family has a ray as its blow-down.
