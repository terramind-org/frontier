title: Kourovka Notebook Problem 13.52
field: mathematics
tier: prose
statement: |-
  The *dimension* of a finitely based variety of
  algebras
  ${\mathcal{V}}$ is defined to be the maximal length of
  a *basis* (that is, an independent generating set) of the
  $SC $-theory $SC({\mathcal{V}})$, which consists of the strong Mal'cev
  conditions satisfied on ${\mathcal{V}}$. The dimension is defined to
  be infinite if the lengths of bases in $SC({\mathcal{V}})$ are not
  bounded.
  Does every finite abelian group generate a variety of finite
  dimension?
