  module: FormalConjectures.OEIS.«2326»
  decl: OeisA2326.conjecture1
  statement: |-
    theorem conjecture1 (p : ℕ) (hp : p.Prime) (hp_odd : p ≠ 2) :
        a ((p ^ 3 - 1) / 2) = p * a ((p ^ 2 - 1) / 2)
