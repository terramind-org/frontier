  module: FormalConjectures.OEIS.«227923»
  decl: OeisA227923.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : n > 4) (h13 : n ≠ 13) :
        ∃ x y : ℕ, 1 < x ∧ 1 < y ∧ x ≠ y ∧ x + y = n ∧
          (6 * x - 1).Prime ∧ (12 * x - 1).Prime ∧
          (6 * y - 1).Prime ∧ (6 * y + 1).Prime
