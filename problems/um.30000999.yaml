title: Inverse Wasserstein Stability of the Geodesic Radon Transform
field: mathematics
tier: prose
statement: Let $\mathcal R$ be the geodesic Radon transform on probability measures on $S^{n-1}$, sending a measure to its equator averages, and let $d_{W_p}$ be Wasserstein-$p$ distance. Does there exist a uniform reverse inequality $d_{W_p}(\mu,\nu)\leq C'(p,n)d_{W_p}(\mathcal R\mu,\mathcal R\nu)$ for all probability measures $\mu,\nu$?
