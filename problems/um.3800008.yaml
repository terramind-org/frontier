title: Medial surfaces and Voronoi diagrams of lines
field: mathematics
tier: prose
statement: Determine the worst-case complexity of the medial surface and of an offset surface of an $n$-feature polyhedron, and of the Voronoi diagram of $n$ lines in three-space. The known upper bounds are superquadratic while quadratic lower-bound constructions are known.
