title: Open Problems in Arithmetic Dynamics — Conjecture 39
field: mathematics
tier: prose
statement: |-
  \begin{parts}

  (a)
  Let $f:\mathbb{P}^N\to\mathbb{P}^N$ be a morphism of degree $d\ge2$ defined over
  $\mathbb{Q}$, and let $P\in\mathbb{P}^N(\mathbb{Q})$ be a point whose $f$-orbit
  $\mathcal{O}_f(P)$ is Zariski dense in $\mathbb{P}^N$. Then for every $\epsilon>0$, the
  set of primes
  \[
  \bigl\{ p : \#\mathcal{O}_{\tilde f}(\tilde P\bmod p) \ge p^{(1/2-\epsilon)N} \bigr\}
  \]
  is a set of density $1$.

  (b)
  Let $f:\mathbb{A}^N\to\mathbb{A}^N$ be a polynomial automorphism defined over $\mathbb{Q}$,
  i.e., the map $f$ is defined by polynomials, and it has an inverse
  defined by polynomials. Let $P\in\mathbb{A}^N(\mathbb{Q})$ be a point whose
  $f$-orbit $\mathcal{O}_f(P)$ is Zariski dense in $\mathbb{A}^N$. Then for
  every $\epsilon>0$, the set of primes
  \[
  \bigl\{ p : \#\mathcal{O}_{\tilde f}(\tilde P\bmod p) \ge p^{(1-\epsilon)N} \bigr\}
  \]
  is a set of density $1$.
  \end{parts}
