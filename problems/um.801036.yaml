statement: Consider a tree $T$ which is $\Pi^0_1(\emptyset')$ in $M$. Assume there is a $g \in [T]$ such that $M[g] \models \text{B}\Sigma_2$. Is there a definable path $h \in [T]$ such that $M[h] \models \text{B}\Sigma_2$?
