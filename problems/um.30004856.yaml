title: Negativity of Log Divisors on Q-Acyclic Surfaces
field: mathematics
tier: prose
statement: |-
  If $S$ is a complex $\mathbb Q$-acyclic surface and $(X,D)$ is a log-smooth completion, is
  $$
  \kappa\!\left(K_X+\frac12D\right)=-\infty
  $$
  ?
