title: Scalar-Curvature Rigidity on Wrapped Sphere Complements
field: mathematics
tier: prose
statement: Let $\Sigma$ be a subset of the standard unit sphere $S^n$ with the wrapping property, and let $X=S^n\setminus\Sigma$ with its standard metric $g_0$. If a possibly incomplete metric $g$ on $X$ satisfies $g\geq g_0$ and $\operatorname{Sc}(g)\geq n(n-1)=\operatorname{Sc}(g_0)$, must $g=g_0$?
