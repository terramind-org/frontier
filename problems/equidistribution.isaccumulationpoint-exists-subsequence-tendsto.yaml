lean:
  module: FormalConjectures.Books.UniformDistributionOfSequences.Equidistribution
  decl: Equidistribution.isAccumulationPoint_exists_subsequence_tendsto
  statement: |-
    theorem isAccumulationPoint_exists_subsequence_tendsto
        (x : ℝ) (s : ℕ → ℝ) (hx : IsAccumulationPoint x s) :
        ∃ (u : ℕ → ℕ), StrictMono u ∧ Filter.atTop.Tendsto (s ∘ u) (𝓝 x)
  context:
    - open Equidistribution
    - open scoped Topology
  definitions:
    - name: Equidistribution.IsAccumulationPoint
      kind: def
      text: |-
        /--
        A point `x` is an accumulation point of a sequence `s_0, s_1, ...`
        if any neighbourhood of `x` contains a point of the sequence distinct
        from `x`.
        -/
        def IsAccumulationPoint (x : ℝ) (s : ℕ → ℝ) : Prop :=
          x ∈ closure (Set.range s \ {x})
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Books/UniformDistributionOfSequences/Equidistribution.lean#L43
