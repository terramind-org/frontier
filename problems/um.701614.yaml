title: Kourovka Notebook Problem 19.66
field: mathematics
tier: prose
statement: |-
  We say that a variety $\Theta$ is of *Tarski type* if any two non-abelian $\Theta$-free groups of finite rank are elementarily equivalent.

  a) Find examples of Tarski type varieties distinct from the variety of all groups.

  b) Is it true that the {Burnside variety $B_n$} of all groups of exponent $n$, where $n$ is big enough, is of Tarski type?

  c) Is it true that the *$n$-Engel variety $E_n$* of all groups satisfying the identity $[[[x,\underbrace{y],y],\ldots,y}_{n}]\equiv 1$, where $n$ is big enough, is of Tarski type?
