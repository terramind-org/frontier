title: Frobenius–Schur Indicators in Real Nilpotent Blocks
field: mathematics
tier: prose
statement: Let $B$ be a real nilpotent nonprincipal $2$-block with defect pair $(D,E)$. Prove that there is a height-preserving bijection $\Gamma:\operatorname{Irr}(D)\to\operatorname{Irr}(B)$ such that $\epsilon(\Gamma(\lambda))=|D|^{-1}\sum_{e\in E\setminus D}\lambda(e^2)$ for every $\lambda\in\operatorname{Irr}(D)$.
