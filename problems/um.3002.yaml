title: Kirby Problem 4.126
field: mathematics
tier: prose
statement: |-
  (a) If M is a closed, orientable hyperbolic 4-manifold then it always has signature 0, because its Pontryagin class vanishes [Che55]. This implies that M bounds a compact, orientable 5-manifold. Is M always a geometric boundary?

  (b) For general n, suppose that M is a closed hyperbolic n-manifold. Is M a geometric boundary?
