title: Local Discrete Holomorphic Dynamics — Open Problem Q1
field: mathematics
tier: prose
statement: |-
  *What is the topological structure of (the germ at $p$ of) $K_f$?*

  For instance, does $K_f$ have non-empty interior? Is it locally connected at $p$?
  Is $K_f\setminus\{p\}$ connected? What is the topological (homological, cohomological) structure
  of $U\setminus K_f$? And so on.

  \begin{remark}
  Both the definition of stable set and Question 1 are topological in character;
  we might also state them for local dynamical systems which are continuous only. However, the *answers* might (and usually will) strongly depend on the
  holomorphicity of the dynamical system.
  \end{remark}

  Clearly, the stable set $K_f$ is completely $f$-invariant, and thus
