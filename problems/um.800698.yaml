title: Open Problems on Central Simple Algebras — Problem 8
field: mathematics
tier: prose
statement: |-
  - *$F$ contains a primitive $n$-th root of unity.* This was pointed out above.
  The Merkurjev-Suslin theorem, which establishes an isomorphism between
  $K^M_2(F) / nK^M_2(F)$ and ${\text\mathrm{H}}^2(F,\mu_n^{\otimes 2})$, is now
  a special case of the recently-proved Bloch--Kato Conjecture.

  The smallest open case for $n$ prime is therefore:

  Is $\operatorname{Br}_p[7](F)$ generated by cyclic algebras of degree $7$ when
  $\operatorname{char} F\neq 7$ and $F$ does not contain a primitive $7$-th root of unity?
