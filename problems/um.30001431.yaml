id: um.30001431
title: Sharp Connectivity-Preserving Tree Deletion Bounds
field: mathematics
tier: prose
statement: |-
  For every positive integer $k$ and every tree $T$, let $g_k(T)$ be the least nonnegative integer such that every $k$-connected graph $G$ with

  $$\delta(G)\geq \left\lfloor\frac{3k}{2}\right\rfloor-1+g_k(T)$$

  contains a copy $S\cong T$ satisfying $\kappa(G-V(S))\geq k$. Is $g_k(T)=|T|$?
