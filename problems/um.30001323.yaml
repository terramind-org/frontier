title: Equivalence of Sznitman Ballisticity Conditions
field: mathematics
tier: prose
statement: For a uniformly elliptic i.i.d. random walk in random environment in dimension $d\geq2$, and every $\gamma\in(0,1)$, is Sznitman's condition $(T)_\gamma$ relative to $\ell$ equivalent to condition $(T')$ relative to $\ell$, where $(T')$ means that $(T)_\gamma$ holds for every $\gamma\in(0,1)$?
