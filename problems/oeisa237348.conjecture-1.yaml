lean:
  module: FormalConjectures.OEIS.«237348»
  decl: OeisA237348.conjecture_1
  statement: |-
    theorem conjecture_1 (d : ℕ) (hd : 1 ≤ d) :
        ∃ N : ℕ, 0 < N ∧ ∀ n : ℕ, N < n →
          ∃ k m : ℕ, 0 < k ∧ 0 < m ∧ n = k + m ∧
            (Nat.nth Nat.Prime (k - 1) + 2 * d).Prime ∧
            (Nat.nth Nat.Prime (Nat.nth Nat.Prime (m - 1) - 1) + 2 * d).Prime
  context:
    - open OeisA237348
  definitions: []
