title: "Three atomic singular inner functions: source diagnosis, pair selection, and point reconstruction"
field: mathematics
tier: prose
statement: |-
  Define
  \[
  u_{\xi,\alpha(z)}=e^{-\alpha\left(\frac{\xi+z}{\xi-z}\right)},
  \]
  for \(\alpha>0\) and \(|\xi|=1\). Given \(\xi_1,\xi_2,\xi_3\) and
  \(\alpha_1,\alpha_2,\alpha_3\), can we approximate
  \[
  \sum_{m=0}^{\infty}c_m^{(1)}u_1^m+c_m^{(2)}u_2^m+c_m^{(3)}u_3^m?
  \]
