title: Breuil–Mézard Multiplicity Formula
field: mathematics
tier: prose
statement: For a residual representation $\bar\rho:G_K\to\operatorname{GL}_2(\mathbb F)$, do there exist nonnegative integers $\mu_a(\bar\rho)$, independent of the regular $p$-adic Hodge type $\lambda$ and inertial type $\tau$, such that $e(R_{\lambda,\tau}/\pi_E R_{\lambda,\tau})=\sum_a n(a)\mu_a(\bar\rho)$ for every $\lambda$ and $\tau$?
