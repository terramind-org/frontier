title: Solid-torus loci in the genus-one Hitchin system
field: mathematics
tier: prose
statement: |-
  Let $\Sigma$ a surface and $H$ a handlebody. Then:
  \[
  \mathcal{L}\subset \mathcal{M}_{B} (holomorphic) \Rightarrow
  \mathcal{L}\subset \mathcal{M}_{Dol} (real \, Lagrangian)
  \]
  for $X^{3},\partial(X)=\Sigma$.

  Questions:

  i) $H(\mathcal{L}_X)$ is a subvariety of $B$ of half dimension. What is the intersection of $\mathcal{L}$ and fibres of the Hitchin map, i.e. the connected components of $H^{-1}(b)\cap \mathcal{L}_X$? [do genus 1 at least]

  ii) $RFM(\mathcal{L})=?$
