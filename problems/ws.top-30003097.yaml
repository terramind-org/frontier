  \section{Multistationarity and Permanence in MESSI Reaction Networks}\label{30003097}
  {\small UnsolvedMath ID 30003097 · Dynamical Systems}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For MESSI mass-action biochemical systems, characterize when a stoichiometric compatibility class can contain more than one positive steady state with the same conserved quantities, and determine the related permanence and invariant-subspace properties.
  \par\smallskip\textit{Formulation references:} \sref{30003097}{1}, \sref{30003097}{2}.
  \subsection{Short English statement}
  For MESSI mass-action biochemical systems, characterize when a stoichiometric compatibility class can contain more than one positive steady state with the same conserved quantities, and determine the related permanence and invariant-subspace properties.
