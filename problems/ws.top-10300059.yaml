statement: |-
  \section{Numerical invariants — Question 13.6}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A codimension-one foliation $\mathcal F$ decomposes a $3$-manifold $M$ into surface leaves, locally as the horizontal slices of a product chart. In the terminology of the source, it is taut if a closed curve transverse to $\mathcal F$ meets every leaf. A minimal foliation means that every leaf is dense; a minimal surface means a surface with vanishing mean curvature for the specified Riemannian metric. These two uses of minimal are distinct.
  \paragraph{Statement recorded in the supplied source.}
  For a family of deformations of a foliation, determine useful local order structures and whether they furnish coordinates on a deformation space of a taut foliation. Investigate orders obtained from numerical invariants and from monotone gluing maps in cut-and-shear families; neither a particular deformation space nor one proposed order is prescribed as the final answer. \sref{statement}{2}
  \subsection{Short English statement}
  Find local orders on deformation families and use them, if possible, to give coordinates for taut-foliation deformations.
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Danny Calegari, \emph{Problems in foliations and laminations of 3-manifolds}, version 0.78 (2002), Question 13.6; Definitions 1.1--1.10 and local definitions and remarks. \url{https://arxiv.org/abs/math/0209081v1}.
  \end{description}
  \label{end:statement}
