title: Strong Atiyah Conjecture for Free-Group Quotients
field: mathematics
tier: prose
statement: Let $F$ be finitely generated free, $N\triangleleft F$, $G=F/N$, and $K\subset\mathbb C$. If $G$ has bounded finite-subgroup orders, must every $A\in\operatorname{Mat}_{n\times m}(K[F])$ satisfy $\dim_G\ker\phi_G^A\in(1/\operatorname{lcm}(G))\mathbb Z$?
