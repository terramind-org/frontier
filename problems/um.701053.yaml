title: Kourovka Notebook Problem 14.68
field: mathematics
tier: prose
statement: |-
  (Well-known problem). Suppose that $F$ is an
  automorphism of order $2$ of the polynomial ring $R_n= {\mathbb{C}
  [x_1, \ldots ,x_n]$, $n> 2$. Does there exist an automorphism $G$
  of $R_n$ such that $G^{-1}FG$ is a linear automorphism?

  This is true for $n=2$.
