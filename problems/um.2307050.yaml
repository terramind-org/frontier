title: Research Problems in Function Theory — Problem 7.50
field: mathematics
tier: prose
statement: Let $U$ be a connected open set in $\mathbb{R}^n$. Brelot and Choquet showed that the set of points on the boundary of $U$ which are accessible from the interior by (finite length) rectifiable paths supports harmonic measure. It is natural, in view of polygonal path connectedness of finely open sets, to ask if the same is true for finely open sets and the Keldysh measure. (T. Lyons and B. \O ksendal)
