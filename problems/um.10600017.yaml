title: Virtual-knot problem 17 — Crossing number problems
field: mathematics
tier: prose
statement: |-
  Crossing number problems: For each virtual link $L$, there are
  three crossing numbers: the minimal number $C$ of classical
  crossings, the minimal number $V$ of virtual crossings, and the
  minimal total number $T$ of crossings for representatives of $L$.
  There are also a number of unknotting numbers: The classical
  unknotting number is the number of crossing switches needed to
  unknot the knot (using any diagram for the knot). The virtual
  unknotting number is the number of crossings one needs to convert
  from classical to virtual (by direct flattening) in order to unknot
  the knot (using any virtual diagram for the knot). Very little is
  known. Find out more about the virtual unknotting number.

  What is the relationship between the least number of virtual
  crossings and the least genus in a surface representation of the
  virtual knot.

  Is it true that $T=V+L$?

  Is there any algorithm for finding $V$ for some class of virtual
  knots. For $T$, this is partially done for two classes of links:
  quasialternating and some other, see . For classical
  links and alternating diagrams see .

  Are there some (non–trivial) upper and lower bounds for $T,\,V,\,L$
  coming from virtual knot polynomials (see )?
