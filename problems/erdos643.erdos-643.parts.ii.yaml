  module: FormalConjectures.ErdosProblems.«643»
  decl: Erdos643.erdos_643.parts.ii
  statement: |-
    theorem erdos_643.parts.ii :
        ∀ t : ℕ, 3 ≤ t →
        (fun n ↦ (forcingThreshold n t : ℝ)) ~[atTop]
            (fun n ↦ (n.choose (t - 1) : ℝ))
  context:
    - open Erdos643
    - open Erdos643.erdos_643
    - open Erdos643.erdos_643.parts
    - open Filter Asymptotics
  definitions:
    - name: Erdos643.forcingThreshold
      kind: def
      text: |-
        /-- The least number of edges forcing two distinct disjoint pairs with the same union.
        It is one more than the maximum size of an avoiding family. -/
        noncomputable def forcingThreshold (n t : ℕ) : ℕ :=
          Hypergraph.extremalNumber n t (fun H ↦ ¬ H.HasRepeatedDisjointUnion) + 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/643.lean#L39
