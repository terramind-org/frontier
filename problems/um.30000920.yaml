title: Polynomial Stability of Universal Taylor Series
field: mathematics
tier: prose
statement: Let $U(D,0)$ denote universal Taylor series in the unit disk. If $f\in U(D,0)$ and $a\in\mathbb{C}$ with $|a|\geq1$, is $(z-a)f(z)$ again in $U(D,0)$? More generally, for a nonconstant polynomial $p$, is $pf\in U(D,0)$? Is $f'\in U(D,0)$? Does there exist an inner function $f\in U_1(D,0)$?
