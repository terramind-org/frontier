title: A Wasserstein rate dictionary for local-update generators
field: mathematics
tier: prose
statement: |-
  Problem 29. How can one bound rates of convergence, using the Wasserstein distance, for Markov generators of the type,

  `LA (x1,..., x n) = ∑`

  `> i`

  `∫`

  `ωi(x, dy )[ A(y) − A(x)],`

  which involve only a finite number of x′s and y′s near i.
