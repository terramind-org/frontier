title: Equivariant homotopy 3 — Figure out how to do equivariant stable homotopy theory without restriction on the group.
field: mathematics
tier: prose
statement: Figure out how to do equivariant stable homotopy theory without restriction on the group. Here you are going to have to change the current setup a lot, I think. Mike Mandell has some ideas about this. He points out that a lot of the crucial problems in mathematics concern infinite discrete groups, like the Novikov conjecture, and so it may be of value to figure out this problem.
