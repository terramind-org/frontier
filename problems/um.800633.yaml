title: Selection Principles Milestone Problems — Problem 5 ([ideals, Problem 4], [MilNonGamma, Question 6])
field: mathematics
tier: prose
statement: |-
  A property is (provably) *hereditary* if for each space $X$ satisfying the property,
  all subsets of $X$ satisfy that property.
  Most of the properties considered in this paper may be considered intuitively
  as notions of smallness, thus it is somewhat surprising that none of the properties involving
  open covers is hereditary [ideals].
  However, the property $\mathsf{S}_1(\mathcal{B},\mathcal{B})$ as well as all properties of the form $\Pi(\mathcal{B}_\Gamma,\mathcal{B})$
  are hereditary [ideals] (but $\mathsf{S}_1(\mathcal{B}_\Omega,\mathcal{B}_\Gamma)$ is not [MilNonGamma]).

  Is any of the properties $\mathsf{S}_1(\mathcal{B}_\Omega,\mathcal{B}_\Omega)$ or $\mathsf{S}_{\mathrm{fin}}(\mathcal{B}_\Omega,\mathcal{B}_\Omega)$ hereditary?
