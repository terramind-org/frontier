title: Evans diagnostics for primary and secondary cubic-autocatalysis front instability
field: mathematics
tier: prose
statement: |-
  **S. Malham (Biscale chaos).** Consider the cubic-autocatalysis system
  \[
  u_t=\delta\Delta u-uv^2,
  \qquad
  v_t=\Delta v+uv^2.
  \]
  Here \(u\) is the fuel/reactant, \(v\) is the autocatalyst, and \(\delta\) is the ratio of their molecular diffusivities. When \(\delta\sim8\), small perturbations of a planar front evolve into a complex wrinkled front. Malevanets, Careta, and Kapral, *Biscale chaos in propagating fronts*, Phys. Rev. E 52 (1995), 4724--4735, suggested that its spatiotemporal chaos has two length scales.

  **Open problem.** What are the stability properties of the planar front? Can we understand the secondary instability by getting an Evans function for the front that arises from the [primary] instability?
