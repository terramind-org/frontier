title: Major problems 1 — The biggest problem, in my opinion, is to come up with a specific vision of where homotopy theory shou…
field: mathematics
tier: prose
statement: The biggest problem, in my opinion, is to come up with a specific vision of where homotopy theory should go, analogous to the Weil conjectures in algebraic geometry or the Ravenel conjectures in our field in the late 70s. You can't win the Fields Medal without a Fields Medal-winning problem; Deligne would not be DELIGNE without the Weil conjectures and Mike Hopkins would not be MIKE HOPKINS without the Ravenel conjectures. We can't all be Deligne or Mike, but making the conjectures requires different talents than proving them, and more of us might have a chance. This was actually my motivation for making this list; to provide a forum for conjectures so that we might collectively be able to form a program analogous to the Weil conjectures. This would make a huge difference to our field, I think. Of course, they have to be somewhat accessible conjectures, which the problems below may not be!
