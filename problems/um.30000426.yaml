title: Algebraic Models for Rational Compact Lie-Group Spectra
field: mathematics
tier: prose
statement: For every compact Lie group $G$, does there exist an abelian category $\mathcal{A}(G)$ of injective dimension $\operatorname{rank}(G)$ and a Quillen equivalence $G\text{-spectra}/\mathbb{Q}\simeq\mathrm{dg}\mathcal{A}(G)$, where objects of $\mathcal{A}(G)$ are sheaves of modules over the space of closed subgroups of $G$, assembled from Borel-theory fibers by localization and inflation, and the model of a cohomology theory is determined by its values on spheres together with limited extra structure?
