title: Equivariant Stable Connectivity in Higher Representation Dimension
field: mathematics
tier: prose
statement: Let $G$ be a finite group with an irreducible representation of dimension greater than one. If a spectral presheaf on smooth $G$-schemes is Nisnevich-locally connected, must its equivariant $\mathbb A^1$-localization remain connected?
