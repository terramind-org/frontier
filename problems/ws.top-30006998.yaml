  \section*{Integral K3 injectivity for regular local domains}\label{30006998}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every Noetherian regular local domain A with fraction field F, is the canonical map $K_{3}(A)\to K_{3}(F)$ injective on integral algebraic K-theory, including ramified mixed characteristic?
  \subsection{Short English statement}
  For every Noetherian regular local domain A with fraction field F, is the canonical map $K_{3}(A)\to K_{3}(F)$ injective on integral algebraic K-theory, including ramified mixed characteristic?
