title: Boundary Uniqueness on Lipschitz Domains
field: mathematics
tier: prose
statement: Let $\Omega\subset\mathbb R^n$ be an arbitrary Lipschitz domain, let $u\in C(\overline\Omega)$ be harmonic in $\Omega$, and suppose that $u$ vanishes on a relatively open boundary patch $\Sigma$. If $\mathcal H^{n-1}(\{x\in\Sigma:\nabla u(x)=0\})>0$, must $u\equiv 0$?
