title: Kourovka Notebook Problem 18.73
field: mathematics
tier: prose
statement: |-
  a) Does every finitely generated solvable group of derived length $l\ge 2$ embed
  into a $2$-generated solvable group of length $l+1$?

  *Comment of 2021*: It is proved that any countable solvable group of derived length $l$ with torsion-free abelianization embeds in a 2-generated solvable group of derived length $l+1$ (V. A. Roman'kov, *Proc. Amer. Math. Soc.*, **149** (2021), 4133--4143).

  [Archived solved part(s) of 18.73:]
  b) Does every finitely generated solvable group of derived length $l\ge 2$ embed
  into some $k$-generated $(l+1)$-solvable group, where $k=k(l)$?
