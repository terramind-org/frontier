title: A homological gate at the first unresolved target rank
field: mathematics
tier: prose
statement: |-
  The second paragraph begins “In the other direction” and is the lead-in to the separately displayed Problem 4.2. This report therefore studies

  \[
    \operatorname{Hom}(\operatorname{Mod}(S_g),\operatorname{Out}(F_n))
  \]

  and injectivity, while auditing the reverse-direction paragraph only as source context.

  The PDF does not state the surface convention. We use the standard one in this literature: \(S_g\) is a connected, closed, orientable surface of genus \(g\), and

  \[
    \operatorname{Mod}(S_g)=\pi_0\operatorname{Homeo}^+(S_g). \]

  Extended or nonorientable mapping class groups are different questions. We take \(n\geq 1\).
