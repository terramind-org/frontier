title: Boundary-sensitive extensions of the Thurston metric
field: mathematics
tier: prose
statement: |-
  **Problem 3.8.** Let \(S\) be a hyperbolic surface with ideal boundary. Can we
  define the Thurston metric on the non-reduced Teichmüller space of \(S\)?

  There is no omitted attribution or
  remark in the PDF.

  The nearby context is essential. Immediately before this question, Problems
  3.6--3.7 discuss the **reduced**, finite-dimensional Teichmüller space of a
  compact bordered surface and its arc metric. Problem 3.8 changes both the
  boundary geometry and the equivalence relation:

  - The **ideal boundary** is the conformal boundary of a hyperbolic Riemann
    surface. In a Fuchsian model it is \(\Omega_\Gamma/\Gamma\). Equivalently, in
    the 2024 terminology of Alekseev--Meinrenken, the interior carries a
    conformally compact hyperbolic or hyperbolic \(0\)-metric; its ends are funnels
    or trumpets and their boundary circles lie at infinite hyperbolic distance.
  - A reduced Teichmüller point is a marked surface modulo a conformal comparison
    map in the ordinary homotopy class. In the **non-reduced** (or unreduced)
    space, that homotopy is required to be relative to the ideal boundary. Thus
    boundary parametrizations are retained. For nonempty ideal boundary the
    resulting space is infinite-dimensional.

  These meanings agree with the explicit definitions in Fortier Bourque and with
  the hyperbolic \(0\)-metric model of Alekseev--Meinrenken. They are distinct from
  the geodesic-boundary arc-metric theory of Liu--Papadopoulos--Su--Théret.
