title: Clustered Colorings of Triangulated Grids
field: mathematics
tier: prose
statement: For a $d$-dimensional triangulated grid $T_n^d$, let $\xi_k(G)$ be the least $m$ for which the vertices of $G$ can be colored with $k$ colors so that every monochromatic connected subgraph has at most $m$ vertices, and let $L_n^d(i)=\{x\in[n]^d:\sum_jx_j=i\}$. Is the worst-case value of $\xi_2(T_n^d)$ equal to $|L_n^d(i_{1/2})|$, making the diagonal-layer coloring optimal? For fixed $d$ and $3\leq k\leq d-1$, is $\xi_k(T_n^d)$ of order $n^{d-k+1}$?
