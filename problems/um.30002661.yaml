title: Bang Plank Conjecture for Nonsymmetric Convex Bodies
field: mathematics
tier: prose
statement: If a convex body $K\subset\mathbb{R}^n$ is covered by planks $P_1,\ldots,P_m$, must the sum of their relative widths, measured in the norm whose unit ball is $K-K$, be at least $1$?
