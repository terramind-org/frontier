title: Igusa Bounds for Finite-Ring Exponential Sums
field: mathematics
tier: prose
statement: |-
  Let $f\in\mathbb Z[x_1,\ldots,x_n]$ be nonconstant of degree $d>1$, let $f_d$ be its highest-degree homogeneous part, and let $s$ be the dimension of the critical locus of $f_d$. For every $\varepsilon>0$ and prime $p$, is there a $C_{p,\varepsilon}>0$ such that
  $$
  |E_f(p,m)|\leq C_{p,\varepsilon}p^{m(-(n-s)/d+\varepsilon)}
  $$
  for every $m\geq1$, with $C_{p,\varepsilon}=1$ for all sufficiently large $p$?
