title: Critical Fixation Threshold for Zero-Temperature Glauber Dynamics
field: mathematics
tier: prose
statement: For zero-temperature Glauber dynamics on $\mathbb{Z}^d$, started from i.i.d. Bernoulli-$p$ opinions with fair-coin tie breaking, is the critical threshold $p_c(d)$ separating eventual fixation from infinite opinion changes equal to $1/2$ for every $d\geq 2$, in particular for $\mathbb{Z}^2$?
