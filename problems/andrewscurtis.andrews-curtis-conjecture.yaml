lean:
  module: FormalConjectures.Wikipedia.AndrewsCurtis
  decl: AndrewsCurtis.andrews_curtis_conjecture
  statement: |-
    theorem andrews_curtis_conjecture (n : ℕ) (r : RelatorTuple n)
        (hr : NormallyGenerates r) :
        Equivalent r (standardRelators n)
  context:
    - open AndrewsCurtis
  definitions:
    - name: AndrewsCurtis.RelatorTuple
      kind: abbrev
      text: |-
        /-- An `n`-tuple of relators in the free group on `n` generators. -/
        abbrev RelatorTuple (n : ℕ) := Fin n → FreeGroup (Fin n)
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/Wikipedia/AndrewsCurtis.lean#L37
    - name: AndrewsCurtis.standardRelators
      kind: def
      text: |-
        /-- The standard relator tuple, consisting of the free generators themselves. -/
        def standardRelators (n : ℕ) : RelatorTuple n :=
          fun i ↦ FreeGroup.of i
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/Wikipedia/AndrewsCurtis.lean#L40
    - name: AndrewsCurtis.Equivalent
      kind: def
      text: |-
        /-- Andrews-Curtis equivalence is the equivalence relation generated by elementary moves. -/
        def Equivalent {n : ℕ} : RelatorTuple n → RelatorTuple n → Prop :=
          Relation.EqvGen Move
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/Wikipedia/AndrewsCurtis.lean#L58
    - name: AndrewsCurtis.NormallyGenerates
      kind: def
      text: |-
        /--
        A relator tuple normally generates the free group when the normal closure of its
        range is the whole free group. Equivalently, the associated balanced presentation
        presents the trivial group.
        -/
        def NormallyGenerates {n : ℕ} (r : RelatorTuple n) : Prop :=
          Subgroup.normalClosure (Set.range r) = ⊤
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/Wikipedia/AndrewsCurtis.lean#L62
