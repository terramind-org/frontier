    url: https://en.wikipedia.org/wiki/Andrews%E2%80%93Curtis_conjecture
  - label: A. D. Myasnikov, A. G. Myasnikov and V. Shpilrain, *On the Andrews-Curtis equivalence*
    url: https://arxiv.org/abs/math/0302080
