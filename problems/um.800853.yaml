title: Randomstrasse101 Open Problems (2025) — Conjecture 1
field: mathematics
tier: prose
statement: |-
  Let $\omega(G_p)$ denote the clique number of $G_p$ i.e. the size of the largest set of nodes that are all pairwise connected by an edge.
  Since $G_p$ is isomorphic to its complement this is the same as $\alpha(G_p)$ the independence number of $G_p$ (the size of the largest set of nodes that have no edges between them). We will focus on the clique number of ease of exposition. A random graph of the same degree has logarithmic clique number, which motivates the following well known conjecture (see, e.g., Open Problem 8.4 in [Afonso10L42P])

  Let $\omega(G_p)$ denote the clique number of the Paley Graph for $p \equiv 1 \pmod{4}$ prime.
  \[
  \omega(G_p)=O(\mathrm{polylog(p)}).
  \]
