id: um.20000971
title: Volume and resistance crossover for the proposed parabolic IDLA domains
field: mathematics
tier: prose
statement: |-
  For internal diffusion-limited aggregation (IDLA), repeatedly launch explorers from the origin. On \(\mathbb Z^d\) the limiting shape is round, with radius of order \(n^{1/d}\) after \(n\) explorers. The quoted fluctuation scales are \(\sqrt{\log n}\) for \(d\geq 3\), \(\log n\) for \(d=2\), and \(\sqrt n\) for \(d=1\). Are there growth models with intermediate fluctuation scales? In particular, what happens on a wedge in \(\mathbb Z^2\), or on the induced lattice region
  \[
      |y|\leq x^{1/\gamma},
  \]
  and, more generally, on \(|y|\leq f(x)\)?
