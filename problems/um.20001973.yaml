title: A perversity-closure diagnostic for intersection-cohomology rings
field: mathematics
tier: prose
statement: |-
  **Question 9.1 (N. Proudfoot).** The intersection cohomology of singular hypertoric varieties has a “seemingly natural” ring structure (as a quotient of the equivariant cohomology $H_T^*(T^*\mathbb C^n)$ of the original space). Is there, in general, a natural ring structure on the intersection cohomology group of a singular hyperkähler quotient?

  **Comment 9.2 (N. Proudfoot).** One setting in which one gets a ring structure on intersection cohomology is when one has a small resolution, but in the hypertoric examples, Nick is not aware of any such small resolution.
