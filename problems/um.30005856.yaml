title: Higher-Dimensional Hamilton-Lott Conjecture
field: mathematics
tier: prose
statement: Let $(M^n,g)$ be complete, Ricci-pinched, and $2$-pinched, so that $\operatorname{Ric}(g)\geq cR_g g\geq 0$ and the sum of the two smallest curvature-operator eigenvalues is at least $cR_g$. Without assuming noncollapse, prove that $(M,g)$ is either flat or compact.
