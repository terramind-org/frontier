title: Kourovka Notebook Problem 8.78
field: mathematics
tier: prose
statement: |-
  It is known that there exists a countable locally
  finite group that contains a copy of every other countable locally
  finite group. For which other classes of countable groups does a
  similar ``largest'' group exist? In particular, what about periodic
  locally soluble groups? periodic locally nilpotent groups?
