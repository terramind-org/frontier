lean:
  module: FormalConjectures.ErdosProblems.«400»
  decl: Erdos400.erdos_400.parts.ii
  statement: |-
    theorem erdos_400.parts.ii :
        ∀ᵉ (k ≥ 2), ∃ c : ℝ, ∀ ε > 0,
          Tendsto (fun x : ℕ ↦
            (((Icc 1 x).filter (fun n ↦
              |(g k n : ℝ) - c * Real.log x| ≤ ε * Real.log x)).card : ℝ) / x)
            atTop (𝓝 1)
  context:
    - open Erdos400
    - open Erdos400.erdos_400
    - open Erdos400.erdos_400.parts
    - open Nat Filter Finset
    - open scoped Asymptotics Topology
  definitions:
    - name: Erdos400.g
      kind: def
      text: |-
        /--
        For any $k\geq 2$ let $g_k(n)$ denote the maximum value of $(a_1+\cdots+a_k)-n$
        where $a_1,\ldots,a_k$ are integers such that $a_1!\cdots a_k! \mid n!$.
        -/
        noncomputable def g (k n : ℕ) : ℕ :=
          sSup { ((∑ i, a i) - n) | (a : Fin k → ℕ) (_ : (∏ i, (a i) !) ∣ n !) }
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/ErdosProblems/400.lean#L33
