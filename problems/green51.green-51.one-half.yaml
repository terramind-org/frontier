lean:
  module: FormalConjectures.GreensOpenProblems.«51»
  decl: Green51.green_51.one_half
  statement: |-
    theorem green_51.one_half :
        ∀ (k : ℝ), 0 < k →
          ∃ (c : ℕ), ∀ᶠ (n : ℕ) in atTop,
            ∀ (α : ℝ), α > (1/2 : ℝ) - k / sqrt (n : ℝ) → α ≤ 1 →
              n ≤ guaranteedMaxCosetDim n α + c
  context:
    - open Green51
    - open Green51.green_51
    - open Filter Real
    - open scoped Pointwise
  definitions:
    - name: Green51.guaranteedMaxCosetDim
      kind: def
      text: |-
        /-- The largest dimension of a coset guaranteed to be contained in $2A$ for $A \subseteq \mathbb{F}_2^n$ with density $\alpha$. -/
        noncomputable def guaranteedMaxCosetDim (n : ℕ) (α : ℝ) : ℕ :=
          sInf { maxCosetDim (ZMod 2) (𝔽₂ n) ↑(A + A) | (A : Finset (𝔽₂ n)) (_h : A.dens ≥ α) }
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/GreensOpenProblems/51.lean#L42
