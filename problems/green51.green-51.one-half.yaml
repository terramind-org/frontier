lean:
  module: FormalConjectures.GreensOpenProblems.«51»
  decl: Green51.green_51.one_half
  statement: |-
    theorem green_51.one_half :
        ∀ (k : ℝ), 0 < k →
          ∃ (c : ℕ), ∀ᶠ (n : ℕ) in atTop,
            ∀ (α : ℝ), α > (1/2 : ℝ) - k / sqrt (n : ℝ) → α ≤ 1 →
              n ≤ guaranteedMaxCosetDim n α + c
