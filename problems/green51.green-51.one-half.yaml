schema: 1
id: green51.green-51.one-half
title: Green's Open Problem 51 (one_half)
field: mathematics
tier: proof
statement: |-
  Suppose that $A \subset \mathbb{F}_2^n$ has density $\alpha > 1/2 - C/\sqrt{n}$.
  Does $A + A$ contain a subspace of co-dimension $O_C(1)$? [Sa11, Question 5.1]
ams:
  - 5
  - 11
tags:
  - greens-open-problems
references:
