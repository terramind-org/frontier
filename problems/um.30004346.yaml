title: Algebraicity of Rigid Cocycle Values at Real Multiplication Points
field: mathematics
tier: prose
statement: If $J$ is a rigid meromorphic cocycle, then there is a finite extension $H_J$ of $\mathbb{Q}$ such that for every real-multiplication point $\tau$, the value $J[\tau]$ lies in the compositum $H_JH_\tau$, where $H_\tau$ is the narrow ring class field attached to $\tau$.
