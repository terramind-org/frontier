title: A one-coordinate unlockability certificate for open chains in three-space
field: mathematics
tier: prose
statement: |-
  **2. (Streinu)** Same as the previous question, but with an open arm in \(\mathbb R^3\), and \(\ell_1=\ell_2=\cdots=\ell_n\). **Question:** Is the space of non-intersecting configurations connected?

  The original AIM problem-list PDF reads:

  The preceding item defines the self-intersection locus for closed polygons. More decisively, the AIM workshop report restates Item 2 as the three-dimensional Carpenter's Rule problem: can an arbitrary open chain of unit-length bars be unfolded to a straight line by non-crossing motions? Thus the intended object is an **equilateral open polygonal chain with universal joints**, not a fixed-angle chain and not merely a topological arc.

  The source does not specify whether rigid motions have been quotiented out or whether tangential contact is admitted. The standard strict model is adopted below; the convention issue is discussed in Section 3.
