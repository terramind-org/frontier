title: Open Problems in Wavelet Theory — Problem 8
field: mathematics
tier: prose
statement: |-
  The last problem illustrates the difficulty of determining whether a function is a frame wavelet or not. The following problem was proposed by Weber and the first author [BW].

  For $0<b<1$ define $\psi_b \in L^2(\mathbb{R})$ by $\hat \psi_b =
  \mathbf 1_{(-1,-b) \cup (b, 1)}$.
  For what values of $1/8< b \le 1/6$, is $\psi_b$ a frame wavelet?
