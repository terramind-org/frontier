title: Dimension Constraints for Quadratic Forms over Quadric Fields
field: mathematics
tier: prose
statement: Let $p$ and $q$ be anisotropic quadratic forms over a field $F$, let $F(p)$ be the function field of the projective quadric $p=0$, let $s$ be the unique integer such that $2^s<\dim(p)\leq 2^{s+1}$, and put $k=\dim(q)-2i_0(q_{F(p)})$. Must $k\geq0$, and must there be $a\in\mathbb N$ and $\epsilon\in\mathbb Z$ with $-k\leq\epsilon\leq k$ such that $\dim(q)=a2^{s+1}+\epsilon$?
