title: Loss Thresholds in Two-Round Random Edge Coloring
field: mathematics
tier: prose
statement: In the two-round online edge-coloring game in which the edges of $G(n,p)$ are first colored offline and then $N$ additional random edges are colored online, is it true that for every $0\leq\alpha\leq1/6$, if $p=\Omega(n^{-1/2-\alpha})$ and $N=\omega(n^{8\alpha})$, then the player loses?
