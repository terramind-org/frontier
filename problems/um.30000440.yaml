title: Twisted Dirac Kernels Under Homotopy Equivalence
field: mathematics
tier: prose
statement: Given homotopy-equivalent closed Riemannian manifolds $f:M'\to M$, is there $\delta>0$ such that every vector bundle $(E,\nabla)$ on $M$ with curvature norm at most $\delta$ has $\ker D_E\cong\ker D_{f^*E}$?
