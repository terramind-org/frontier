title: Finite-Growth Nichols Algebras over Finitely Generated Groups
field: mathematics
tier: prose
statement: Let $G$ be a finitely generated group. Classify all Yetter–Drinfeld modules $V\in{}^{\mathbb{C}G}_{\mathbb{C}G}\mathcal{YD}$ such that the bosonized Nichols algebra satisfies $\operatorname{GKdim}(\mathcal{B}(V)\#\mathbb{C}G)<\infty$.
