title: Quadratic Toric Ideals and Unimodular Triangulations
field: mathematics
tier: prose
statement: If $P$ is a lattice polytope whose projective toric variety $X_P$ is smooth, is its defining ideal $I_P$ generated by quadrics? Also, for each dimension $d$, is there an integer $n(d)$ such that every $d$-dimensional lattice polytope has a regular unimodular triangulation after multiplication by $n(d)$?
