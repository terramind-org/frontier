statement: |-
  \section*{Rigidity of circle domains with removable boundary}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If every sphere homeomorphism conformal off the boundary of a circle domain D is a Mobius map, must every conformal bijection from D to another circle domain be the restriction of a Mobius map?
  \subsection{Short English statement}
  If every sphere homeomorphism conformal off the boundary of a circle domain D is a Mobius map, must every conformal bijection from D to another circle domain be the restriction of a Mobius map?
