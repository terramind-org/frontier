title: What the critical group sees of a harmonic action
field: mathematics
tier: prose
statement: |-
  “If you have a graph with a harmonic action, then its critical group comes
  with some extra structure, namely a group of automorphisms of the graph. That
  extra object might be worth studying.”

  This is item (41), attributed to Lionel Levine, in the AIM workshop list
  *Generalizations of chip-firing and the critical group*:

  There is no missing formula and
  no question mark to reconstruct. The item is a research suggestion rather than
  a proposition or a question with fixed quantifiers. The precise object suggested
  by the remark is the finite \(\mathbb Z[G]\)-module
  \(\operatorname{Jac}(X)\), where \(G\) acts harmonically on \(X\) and hence acts
  on degree-zero divisors and their quotient by principal divisors.

  There is one important correction to a literal reading of “a group of
  automorphisms”: a faithful action on the graph need not induce a faithful action
  on its critical group. Thus the extra datum is a representation
  \[
   \rho_X:G\longrightarrow \operatorname{Aut}(\operatorname{Jac}(X)),
  \]
  together with its kernel, not automatically an embedded copy of \(G\).
