title: Epstein zeta minimizers and a two-sided theta transfer principle
field: mathematics
tier: prose
statement: "Question 0: For a fixed s, which L yields the minimum value of E(L, s )? For s → ∞ this becomes the familiar densest lattice packing problem. For n = 2 Rankin and Cassels showed that the hexagonal lattice is the unique minimizer for all s > 0. What we can show is that D4 (when n = 4), L = E8 (when n = 8) and the Leech lattice (when n = 24) are local optima for E(L, s ), for every s > 0."
