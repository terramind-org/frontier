title: Subconvex prime-twist families for GL4xGL2 and GL3xGL3
field: mathematics
tier: prose
statement: |-
  **Subconvexity bound for Rankin-Selberg \(L\)-functions.** Obtain a subconvexity bound for a \({\rm GL}_n\times {\rm GL}_m\) Rankin--Selberg \(L\)-function when \(n\) and \(m\) are not coprime.

  The simplest first cases would be obtaining a subconvexity bound (in any aspect) for a \({\rm GL}_4\times {\rm GL}_2\) \(L\)-function or a \({\rm GL}_3\times {\rm GL}_3\) \(L\)-function.
