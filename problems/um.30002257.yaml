title: Higher-Arity VC-Density Bounds in NIP Theories
field: mathematics
tier: prose
statement: Assume a theory $T$ has NIP and every formula $\varphi(x;y)$ with $|x|=1$ satisfies $\operatorname{vc}^*(\varphi)\leq k$. For every $n$, does there exist a bound $k(n)$ such that $\operatorname{vc}^*(\varphi(x;y))\leq k(|x|)$ for every formula with $|x|=n$?
