title: Pleating-Ray Tilings of the Representation-Space Complement
field: mathematics
tier: prose
statement: |-
  Let $\mathcal R$ be the Riley slice for the marked groups generated by

  $$A=\begin{pmatrix}1&1\\0&1\end{pmatrix},\qquad B_\omega=\begin{pmatrix}1&0\\\omega&1\end{pmatrix}.$$

  Is $\mathbb C^*\setminus\overline{\mathcal R}$ naturally tiled by quadrilaterals $\mathcal R_c(r)$ indexed by $r\in\mathbb Q/2\mathbb Z$, each containing the extended pleating ray of slope $r$ as a diagonal and arising from restrictions of holonomy representations of Dehn fillings of $S^3\setminus(K(r^*)\cup\alpha_r)$?
