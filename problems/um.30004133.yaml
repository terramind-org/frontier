title: Polynomial Induced Removal Bounds for Graph Pairs
field: mathematics
tier: prose
statement: For graphs $H_1,H_2$, let $\delta_{H_1,H_2}(\varepsilon)$ be the largest $\delta$ such that every graph that is $\delta$-close to being induced-$H_i$-free for each $i\in\{1,2\}$ is $\varepsilon$-close to being induced-$\{H_1,H_2\}$-free. Is $\delta_{H_1,H_2}(\varepsilon)$ polynomial in $\varepsilon$ for every pair? For every $a>0$, do some $H_1,H_2$ satisfy $\delta_{H_1,H_2}(\varepsilon)=O(\varepsilon^a)$?
