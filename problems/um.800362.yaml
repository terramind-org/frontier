title: Iwahori-Hecke Algebras — Problem 3
field: mathematics
tier: prose
statement: |-
  Assume that $W$ is finite and that $L=||$. Let $C$ be a conjugacy class in $W$; let
  $C_{min}$ be the set of all $w\in C$ such that $|w|$ is minimal. For $w\in C$ let $N^w\in A$
  be the trace of the
  $A$-linear map $H@>>>H$, $h\mapsto v^{2|w|}T_whT_{w\i}$. We have $N^w\in\mathbb{Z}[v^2]$. (Note that $N^w|_{v=1}$ is the
  order of the centralizer of $w$ in $W$.) From [GP] one can deduce that for $w\in C_{min}$, $N^w$ depends
  only on $C$, not on $w$. We say that $C$ is *positive* if $N^w\in\mathbb{N}[v^2]$.
  For example, if $C$ is an elliptic regular conjugacy classes (in the sense of [S74]) then
  $C$ is positive (see [L18]). If $W$ is of type $A_n$, the positive conjugacy classes are $\{1\}$ and the
  class of the Coxeter element. In the case where $W$ is a Weyl group of exceptional type a complete list of
  positive conjugacy classes in $W$ is given in [L18].

  (d) *Make a list of all positive conjugacy classes in $W$ assuming that $W$ is a Weyl group of type $B_n$
  or $D_n$.*

  \widestnumber\key{L78}
