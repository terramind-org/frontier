title: Ultraproduct II_1 Factors — Problem 32
field: mathematics
tier: prose
statement: Suppose $M$ is a separable subfactor admitting two embeddings $\pi_i:M\to N^\mathcal{U}$ and further suppose $\varphi_n:N\to N$ are a sequence of unital completely positive maps, such that $\Phi= (\varphi_n)_{\mathcal{U}}$ conjugates $\pi_1$ to $\pi_2$. Then does there exist a unitary $u\in N^\mathcal{U}$ that conjugates $\pi_1$ and $\pi_2$?
