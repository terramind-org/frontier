    - open Filter Asymptotics
    - open scoped Nat Topology
  definitions:
    - name: Green97.numQueens
      kind: def
      text: |-
        /--
        `numQueens n` is $Q(n)$, the number of ways to place $n$ non-attacking queens on an $n \times n$
        chessboard (`IsQueens`). For $n = 0$ there is one (empty) placement.
        -/
        def numQueens (n : ℕ) : ℕ :=
          (Finset.univ.filter fun σ : Equiv.Perm (Fin n) ↦ IsQueens σ).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/GreensOpenProblems/97.lean#L60
