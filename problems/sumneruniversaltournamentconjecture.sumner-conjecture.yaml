id: sumneruniversaltournamentconjecture.sumner-conjecture
title: Sumner's universal tournament conjecture (1971)
field: mathematics
tier: proof
statement: |-
  **Sumner's universal tournament conjecture (1971).**

  Every tournament on $2n - 2$ vertices contains every oriented tree on $n \ge 2$ vertices as a
  subgraph.
ams:
