title: Equilateral Sets in Finite-$p$ Metric Tori
field: mathematics
tier: prose
statement: For each finite $p\geq1$, is there a constant $C_p$ such that the largest equilateral subset of the metric torus $T_p^n$ has size at most $C_p n$? If $2n+1$ is prime, is this maximum exactly $2n+1$?
