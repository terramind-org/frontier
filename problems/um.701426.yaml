title: Kourovka Notebook Problem 17.125
field: mathematics
tier: prose
statement: |-
  Does every finite group $G$ contain a pair of
  conjugate elements $a,b$ such that $\pi(G)=\pi(\langle
  a,b\rangle)$? This is true for soluble groups.

  *Comment of 2013:*
  it was proved in (A. Lucchini, M. Morigi, P. Shumyatsky, *Forum Math.*, **24** (2012), 875--887) that every finite group $G$ contains a 2-generator subgroup $H$ such that $\pi(G)=\pi(H)$.
