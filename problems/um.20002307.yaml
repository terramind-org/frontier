title: Finite-cover coordinates for a strongly minimal group
field: mathematics
tier: prose
statement: |-
  Consider a three-to-one map \((\mathbb Q,+)\leftarrow(M,\oplus)\) where \((M,\oplus)\) is strongly minimal.
  **Question 5.** Must \(\oplus\) be definable in some \(\mathbb Q\times F\), where \(F\) is a finite set?
