id: um.20001004
title: Fixed-graph recognition and a rotation certificate for maximal harmonic actions
field: mathematics
tier: prose
statement: |-
  Gregg Musiker: “Can we characterize which genus \(g\) graphs have a maximal
  harmonic group (in the sense of Corry [15]) of size \(6(g-1)\)?” Scott Corry
  notes that a maximal graph group can be used to construct a graph by a
  Cayley-graph variation; Musiker asks for the converse, fixed-graph question:
  “But if I hand you a graph, can you tell me if it has a group of size
  \(6(g-1)\) that acts harmonically on it?”
