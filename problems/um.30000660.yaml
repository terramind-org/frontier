title: Étale-Local Equivalence of Fiberwise Isomorphic Families
field: mathematics
tier: prose
statement: Let $p:S\to X$ and $q:T\to X$ be morphisms of varieties over an algebraically closed field $k$, and suppose every schematic fiber $S_x$ is isomorphic to $T_x$. Does there always exist a dominant étale morphism $U\to X$ such that $S\times_XU\simeq T\times_XU$ over $U$? If not, can one give counterexamples over fields such as $\mathbb{F}_p$ or $\mathbb{Q}$?
