lean:
  module: FormalConjectures.ErdosProblems.«1»
  decl: Erdos1.erdos_1.variants.weaker
  statement: |-
    theorem erdos_1.variants.weaker : ∃ C > (0 : ℝ), ∀ (N : ℕ) (A : Finset ℕ)
        (_ : IsSumDistinctSet A N), N ≠ 0 → C * 2 ^ A.card / A.card < N
  context:
    - open Erdos1
    - open Erdos1.erdos_1
    - open Erdos1.erdos_1.variants
    - open Filter
    - open scoped Topology Real
  definitions:
    - name: Erdos1.IsSumDistinctSet
      kind: abbrev
      text: |-
        /--
        A finite set of naturals $A$ is said to be a sum-distinct set for $N \in \mathbb{N}$ if
        $A\subseteq\{1, ..., N\}$ and the sums $\sum_{a\in S}a$ are distinct for all $S\subseteq A$
        -/
        abbrev IsSumDistinctSet (A : Finset ℕ) (N : ℕ) : Prop :=
            A ⊆ Finset.Icc 1 N ∧ (fun (⟨S, _⟩ : A.powerset) => S.sum id).Injective
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/1.lean#L34
