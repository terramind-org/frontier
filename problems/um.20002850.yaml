title: "Compactness versus Stein neighborhoods: a two-axis criterion and a converse counterexample"
field: mathematics
tier: prose
statement: Describe the relation between compactness of the \(\overline\partial\)-Neumann operator and existence of a Stein neighborhood basis. In particular, does the geometric sufficient condition for compactness in Straube (*Ann. Inst. Fourier* 54, 2004, MR2097419, on geometric vector-field conditions implying compactness of the $\bar{\partial}$-Neumann operator) imply existence of a Stein neighborhood basis?
