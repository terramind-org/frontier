title: Albanese Kernels over $p$-Adic Fields
field: mathematics
tier: prose
statement: "Let $V$ be a smooth projective variety over a $p$-adic local field $k$, and let $\\varphi_V : \\mathrm{CH}_0(V)_{\\deg 0} \\to A_V(k)$ be the Albanese map on zero-cycles of degree zero. Is the Albanese kernel $\\ker(\\varphi_V)$ the direct sum of a finite group and a divisible group?"
