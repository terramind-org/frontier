title: The Global Monodromy Conjecture for Calabi–Yau Varieties
field: mathematics
tier: prose
statement: For every Calabi–Yau variety $X/K$, does its motivic zeta function $Z_X(T)$ admit a rational expression with finitely many denominator factors $1-\mathbb L^aT^b$ such that, for each occurring pair $(a,b)$, the cyclotomic polynomial whose order is the order of $a/b$ in $\mathbb Q/\mathbb Z$ divides the characteristic polynomial of tame monodromy on some $\ell$-adic cohomology group of $X$?
