title: Prime-Entry Matrices of Fixed Determinant
field: mathematics
tier: prose
statement: Let $B_T$ be the norm ball in the variety of $2\times2$ real matrices of determinant $2$. Are there infinitely many integral matrices in $B_T$ whose four entries are prime? More quantitatively, is their number asymptotic to $CT^2/(\log T)^4$ for some $C>0$ as $T\to\infty$?
