title: A reverse compatibility certificate from spectral curves to equilibrium measures
field: mathematics
tier: prose
statement: |-
  The AIM record asks whether string equations, spectral curves, Lax pairs, and WKB asymptotics can be connected explicitly to vector equilibrium problems in two-matrix or external-source models, and whether string equations plus asymptotic spectral-curve data can heuristically recover the equilibrium measure.

  This is a broad connection problem, not a single conjecture. The precise issue is logical direction:
  \[
  \text{finite-}N\text{ recurrences/string equation}
  \Longrightarrow \text{Lax system}
  \Longrightarrow \text{semiclassical spectral curve},
  \]
  whereas reconstructing an equilibrium measure from the curve requires additional real and variational data.
