title: The Hexagonal Conjecture for Spectral Minimal Partitions
field: mathematics
tier: prose
statement: Let $\mathcal L_k(S^2)$ be the optimal maximal first Dirichlet eigenvalue over $k$-partitions of the standard unit sphere, and let $\mathcal L_{k,1}(S^2)$ be the corresponding optimal arithmetic-mean energy. If $\operatorname{Hexa}_1$ is the unit-area regular hexagon, is the scale-corrected Hexagonal Conjecture true, namely $$\lim_{k\to\infty}\frac{\mathcal L_k(S^2)}{k}=\lim_{k\to\infty}\frac{\mathcal L_{k,1}(S^2)}{k}=\frac{\lambda(\operatorname{Hexa}_1)}{4\pi}$$?
