    - name: OpenQuantumProblem35.ExistsAME
      kind: def
      text: |-
        /-- Existence of an $\mathrm{AME}(n,d)$ state. -/
        def ExistsAME (n d : ℕ) : Prop :=
          ∃ ψ : StateVector n d, IsAME (n := n) (d := d) ψ
