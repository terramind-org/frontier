title: The Generalized Hamada p-Rank Conjecture
field: mathematics
tier: prose
statement: |-
  Among all combinatorial designs with the same parameters as a subspace design

  $$t\text{-}(v,k,\lambda)_q,$$

  does the induced design with parameters

  $$2\text{-}\left(\binom{v}{1}_q,\binom{k}{1}_q,\lambda\right)$$

  have minimum $p$-rank?
