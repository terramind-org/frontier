title: A lift-dependent Martin formula and a sharp middle-degree obstruction
field: mathematics
tier: prose
statement: |-
  **Question 2.4 (T. Hausel)** Is there a Martin theorem for 3-Sasakian quotients? What about for Sasakian quotients? Getting a Martin-type formula requires Kirwan surjectivity, but perhaps surjectivity "up to middle dimension" would be enough to get a Martin-type theorem for the 3-Sasakian case.

  **Comment 2.5 (J. Munn)** Martin's theorem probably should be extendable analytically in the polysymplectic case. Since 3-Sasakian manifolds can arise as boundaries of hyperK¨ ahler manifolds, we can look at compact cohomology based on the 3-Sasakian manifold (regarded as a boundary). Here we can ignore cone points and do integration theory.
