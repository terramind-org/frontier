title: Almost-Disjoint Geometric Triangles in Three-Space
field: mathematics
tier: prose
statement: Let $t(n)$ be the maximum number of geometric triangles in $\mathbb R^3$ on an $n$-point vertex set such that two triangles are either disjoint or meet in one common vertex. Prove or disprove that $t(n)=o(n^2)$.
