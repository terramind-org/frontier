title: Torsion of Strongly p-Divisible Cohomology Classes
field: mathematics
tier: prose
statement: Let $U$ be a smooth rigid analytic (or dagger/affoid) variety over a $p$-adic field, and let $H^i(\widehat{U})$ denote the completed de Rham / pro-étale cohomology of the completion $\widehat{U}$. In the $p$-adic Green--Griffiths--Hawking--Scholze ($p$-GGHS) setting, are all strongly $p$-divisible elements of $H^i(\widehat{U})$ torsion?
