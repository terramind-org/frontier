title: Endpoint Spectral-Cluster Improvements on Product Manifolds
field: mathematics
tier: prose
statement: For an arbitrary $d$-dimensional product manifold $M=X\times Y$, do the logarithmically improved spectral-cluster bounds with window width $\varepsilon(\lambda)=(\log\lambda)^{-1}$ extend to the endpoint $q_d=2(d+1)/(d-1)$ and to the range $2<q<q_d$?
