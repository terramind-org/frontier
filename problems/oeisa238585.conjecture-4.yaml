  module: FormalConjectures.OEIS.«238585»
  decl: OeisA238585.conjecture_4
  statement: |-
    theorem conjecture_4 (n : ℕ) (hn : 3 < n) :
        ∃ p : ℕ, p < n ∧ p.Prime ∧
          Nat.Prime (Nat.nth Nat.Prime (p - 1) + Nat.nth Nat.Prime (n - 1) + 1)
