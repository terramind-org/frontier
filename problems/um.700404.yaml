title: Kourovka Notebook Problem 6.62
field: mathematics
tier: prose
statement: |-
  Is
  a (conjugacy, $p
  $-conjugacy) biprimitively finite
  group finite if it has a finite maximal subgroup ($p
  $-subgroup)? There are affirmative answers for conjugacy
  biprimitively finite $p
  $-groups and for 2-conjugacy
  biprimitively finite groups (V. P. Shunkov, *Algebra and
  Logic*, **9**, no. 4 (1970), 291--297; **11**, no. 4 (1972),
  260--272; **12**, no. 5 (1973), 347--353), while the statement
  does not hold for arbitrary periodic groups, see Archive, 3.9.
