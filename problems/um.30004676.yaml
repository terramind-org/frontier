title: Admissible Sets and Their Jump Structures
field: mathematics
tier: prose
statement: For every admissible set $A$, is $A$ $\Sigma$-equivalent to its jump structure $J(A)$ if and only if every structure $B$ that is $\Sigma$-definable in $A$ satisfies $B\leq_\Sigma A$?
