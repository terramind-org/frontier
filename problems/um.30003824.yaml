title: Derived Decomposition of Fixed-Determinant Bundle Moduli
field: mathematics
tier: prose
statement: |-
  Let $C$ be a smooth projective curve of genus $g$, let $L$ be a line bundle of degree one, and let $M_C(2,L)$ be the moduli space of rank-two bundles with determinant $L$. Does its bounded derived category admit the semiorthogonal decomposition
  $$
  D^b(M_C(2,L))=\left\langle D^b(k),D^b(k),D^b(C),D^b(C),\ldots,D^b(\operatorname{Sym}^{g-2}C),D^b(\operatorname{Sym}^{g-2}C),D^b(\operatorname{Sym}^{g-1}C)\right\rangle
  $$
  ?
