title: Research Problems in Function Theory — Problem 5.78
field: mathematics
tier: prose
statement: Let $H^1$ denote Hausdorff one-dimensional measure on $\mathbb{C}$, and $\mathbb{T}$; let $g:\mathbb{T}\to[-\infty,\infty]$ denote an arbitrary Borel function. Does there exist a corresponding function $f$, analytic in $\mathbb{D}$ and with bounded Taylor coefficients, such that \[\lim_{r\to1^-}f(rz)=g(z)\] for $H^1$-almost all $z$ in $\mathbb{T}$? For work on related questions, see Ortel and Schneider . (M. Ortel and W. J. Schneider)
