title: Extending Generator Maps to Finite Group Homomorphisms
field: mathematics
tier: prose
statement: Given $G=\langle g_1,\ldots,g_k\rangle\leq\operatorname{SL}(n,\mathbb{Z})$ and a map on the generators sending them to a generating set of a finite group $H$, determine whether the map extends to a homomorphism $G\to H$, including the case where it does not factor through a congruence homomorphism.
