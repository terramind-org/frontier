title: Open Problems in Mathematical Logic — Problem 23
field: mathematics
tier: prose
statement: |-
  Natural questions about $A \mapsto I(A)$:

  - Does the range of $I$ have the same cardinality as $2^{\mathbb{R}}$? (Seems yes under GCH.)

  - If we consider the closed set $C$, $I(C)$ is arithmetic ($\mathbf{\Sigma}_2^0$). What's the complexity of the set
  $$\big\{\mathbf{\Sigma}_2^0 \text{ formula } \varphi : \varphi \text{ defines an } I(C) \text{ for some } C\big\}?$$ Is it $\mathbf{\Sigma}_2^1$-complete? (It is $\mathbf{\Pi}_1^1$-hard.)

  - Is the answer to "Borel hierarchy is proper w.r.t. the range of $I$" independent of ZFC?

  - Is it consistent with ZFC that for every $f$ and $A\subseteq \mathbb{R}$, if $H^f(A)>0$, then there is a subset $A_0$ such that $H^f(A_0)$ is finite and positive?
