lean:
  module: FormalConjectures.GreensOpenProblems.«59»
  decl: Green59.green_59
  statement: |-
    theorem green_59 :
        ∀ ε : ℝ, 0 < ε → ∀ᶠ N : ℕ in atTop, ∀ n ∈ Finset.Icc 2 N, ∃ a b : ℕ, 0 < a ∧ 0 < b ∧
          a + b = n ∧ IsSmooth ((N : ℝ) ^ ε) a ∧ IsSmooth ((N : ℝ) ^ ε) b
  context:
    - open Green59
    - open Filter
  definitions:
    - name: Green59.IsSmooth
      kind: def
      text: |-
        /--
        `IsSmooth y m` says that every prime factor of `m` is at most `y`.

        The numbers $0$ and $1$ have no prime factors (`Nat.primeFactors`), so they are `y`-smooth for
        every `y`.
        -/
        def IsSmooth (y : ℝ) (m : ℕ) : Prop :=
          ∀ p ∈ m.primeFactors, (p : ℝ) ≤ y
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/GreensOpenProblems/59.lean#L42
