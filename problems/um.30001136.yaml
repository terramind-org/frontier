title: Positive Self-Stress Functionals on Planar $K_{4}$ Embeddings
field: mathematics
tier: prose
statement: For a general-position planar embedding of $K_4$, let $\omega$ be its self-stress and let $f$ assign a number to each segment. Characterize the functions $f$ for which $\sum_{i<j}\omega_{ij}f_{ij}>0$ for every such embedding. Are all of them obtained, up to positive scaling and addition of a function in the rigidity-map range, from $f_{ij}=[ap_ip_j][bp_jp_i]$?
