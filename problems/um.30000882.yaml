title: Centers, Normalizers, and Units of Integral Group Rings
field: mathematics
tier: prose
statement: If the centers of the integral group rings $\mathbb{Z}G$ and $\mathbb{Z}H$ of finite groups $G$ and $H$ are isomorphic, must $G$ and $H$ have equivalent character tables, with class sums corresponding? For a torsion-free group $G$, is the unit group $U(KG)$ trivial? If the normalizer problem holds for every finite normal subgroup of $G$, must it hold for $G$, and can the groups satisfying it be classified? For the finite-dimensional algebra $A$ arising from a noncentral finite-conjugacy center of the unit group of a $\mathbb{Z}$-order, what can be said about $A$ and its Wedderburn–Malcev decomposition?
