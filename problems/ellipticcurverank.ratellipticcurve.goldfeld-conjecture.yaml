lean:
  module: FormalConjectures.Wikipedia.EllipticCurveRank
  decl: EllipticCurveRank.RatEllipticCurve.goldfeld_conjecture
  statement: |-
    theorem goldfeld_conjecture (E : RatEllipticCurve) (r : ℕ) (hr : r = 0 ∨ r = 1) :
        atTop.Tendsto
          (fun H ↦ ({d ∈ twistIndexLE H | E.twistRank d = r}.ncard / (twistIndexLE H).ncard : ℝ))
          (𝓝 (1 / 2))
  context:
    - open EllipticCurveRank
    - open EllipticCurveRank.RatEllipticCurve
    - open Module (finrank)
    - open WeierstrassCurve
    - open scoped Topology
    - open Filter (atTop)
  definitions:
    - name: EllipticCurveRank.RatEllipticCurve
      kind: structure
      text: |-
        /-- A data structure representing isomoprhism classes of elliptic curves over ℚ.
        Every elliptic curve over ℚ is isomorphic to one with Weierstrass equation `y² = x³ + Ax + B`,
        and the pair `(A,B)` is unique if it satisfy the `reduced` condition below.
        See Section 5.1 in [PPVW2016]. -/
        structure RatEllipticCurve : Type where
          A : ℤ
          B : ℤ
          reduced (p : ℕ) : p.Prime → ¬ ((p ^ 4 : ℤ) ∣ A ∧ (p ^ 6 : ℤ) ∣ B)
          Δ_ne_zero : 4 * A ^ 3 + 27 * B ^ 2 ≠ 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L46
    - name: EllipticCurveRank.RatEllipticCurve.twistRank
      kind: abbrev
      text: |-
        /-- The rank of the quadratic twist $E^d$ of an elliptic curve $E$ over $\mathbb{Q}$. -/
        noncomputable abbrev twistRank (E : RatEllipticCurve) (d : ℤ) : ℕ :=
          finrank ℤ (E.quadraticTwist d).Point
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L166
    - name: EllipticCurveRank.RatEllipticCurve.twistIndexLE
      kind: def
      text: |-
        /-- The set of nonzero integers $d$ with $|d| \leq H$, which index the quadratic twists $E^d$
        ordered by $|d|$. By `naiveHeight_quadraticTwist` this is the same as ordering them by height. -/
        def twistIndexLE (H : ℕ) : Set ℤ := {d : ℤ | d ≠ 0 ∧ |d| ≤ (H : ℤ)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L170
