title: Koszul Differentials in Bousfield–Kuhn Homology
field: mathematics
tier: prose
statement: Let $E$ be Morava $E$-theory of height $n$, let $q$ be odd, and identify $$E_q^{\wedge}\!\left(\Sigma^kD_{2^k}(\operatorname{Id})(S^q)\right)\cong C[k]_{-q}^{\vee}.$$ Under this isomorphism, is the map $(\Phi_n\beta_k)_*$ on $E$-homology the differential in the Koszul resolution of $\widetilde E_q(S^q)$?
