title: Conjecture 2.1 — Let Ω∗(Hom(π,G )/G) be the de Rham algebra consisting of all measurable diﬀerential forms on Hom(π,G )/G.
field: mathematics
tier: prose
statement: "Let Ω∗(Hom(π,G )/G) be the de Rham algebra consisting of all measurable diﬀerential forms on Hom(π,G )/G. Then the symplectic structures ωB generate the subalgebra of Ω∗(Hom(π,G )/G) consisting of ModΣ-invariant forms. Since the µ-measure of Hom( π,G )/G is finite, the representation of ModΣ on H:=L2(Hom(π,G )/G,µ )) is unitary. Andersen has informed me that he has proved vanishing of the first cohomology group H 1(ModΣ, H), and has raised the following conjecture generalizing Conjecture 2.1:: 13. Mapping class group dynamics on surface group representations 209"
