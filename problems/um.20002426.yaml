title: Mabuchi distances in a big class and their homothety calibration
field: mathematics
tier: prose
statement: Let \(X\) be a compact Kähler manifold of complex dimension \(n\), let \(\theta\) be a smooth closed real \((1,1)\)-form whose class is big, and let \(p\geq1\). Does the full non-pluripolar Monge--Ampère mass finite-energy space \(\mathcal E^p(X,\theta)\) carry a complete metric \(d_p\), agreeing with the Mabuchi--Darvas \(L^p\) metric when the class is Kähler, such that weak pluripotential Mabuchi geodesics are constant-speed metric geodesics?
