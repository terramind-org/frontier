title: Graphical Non-Abelian Hodge Correspondence
field: mathematics
tier: prose
statement: For a quiver $\Gamma$ and dimension vector $v$, let $C_{\Gamma,v}$ be the projective curve with one rational component of multiplicity $v_i$ per vertex and nodal intersections along the edges, let $J_v$ be its compactified Jacobian, and let $\mathcal M_v$ be the Crawley–Boevey–Shaw character variety. Do graphical non-Abelian Hodge isomorphisms $H^*(J_v)\cong H^*(\mathcal M_v)$ identify $W_{2k}H^*(\mathcal M_v)$ with $P_kH^*(J_v)$ and yield $$P(H;J_v;t)=P(P;\mathcal M_v;t)=t^{2d_v}A_\Gamma(v,t^{-2})$$?
