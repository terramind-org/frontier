title: Transcendental dilate sumsets and an exact digit-box construction
field: mathematics
tier: prose
statement: |-
  **Problem 4.8 (I. Łaba).** Suppose that \(\alpha\) is transcendental, and \(|A|=n\). What is the best lower bound for \(|A+\alpha A|\)?

  **Remark(s).** Konyagin and Łaba have shown that this cardinality is
  \[
  \gg \frac{n\log n}{\log\log n}.
  \]
  The best example (lowest known cardinality) is
  \[
  n e^{c\sqrt{\log n}}.
  \]
