id: um.30001658
title: Functional Inequality on the Boolean Cube
field: mathematics
tier: prose
statement: For every nonempty $A\subseteq\{0,1\}^n$ and every $f:\{0,1\}^n\to\mathbb{R}$, conjecture $E(f,f)+4\sum_x f(x)^2\geq2\left(\frac{\log_2(2^n/|A|)}{|A|}\sum_{x\in A}|f(x)|\right)^2$, where $E(f,f)=\sum_{x\sim y}(f(x)-f(y))^2$.
