title: Lie Structure of Formal $q$-Zeta Algebras
field: mathematics
tier: prose
statement: Prove that the balanced quasi-shuffle relations and $\tau$-invariance generate all algebraic relations among balanced multiple $q$-zeta values, giving $\mathcal G^{\mathrm f}\cong\mathcal G=\mathcal Z_q$. Prove that the primitive space $\mathfrak{bm}_0$ is a Lie algebra under its proposed bracket and establish $\mathcal G^{\mathrm f}\cong\widetilde M_{\mathbb Q}(\operatorname{SL}_2(\mathbb Z))\otimes U(\mathfrak{bm}_0)^\vee$.
