title: Problem 8.16 — (T.
field: mathematics
tier: prose
statement: (T. Kerler) [3-dim cobordisms from Hopf algebras] (1) Find further relations on Alg, besides the ones arising from the axiomat- ics of Hopf algebras, that would make Alg→ Cob• an isomorphism. (2) Find relations on Alg such that the maps AutAlg(A⊗g)→ Γ g∼ = AutCob •(Σ g,1) are isomorphisms. (3) Relate this to obstructions, such as Steinberg and Whitehea d groups, via stratified function spaces. (4) What are the analogous algebraic structures in higher dimen sions. The first problem is easily stated, but presumably very diﬃcu lt as it implies a faithful translation of 3-dimensional topology into an alg ebraic gadget. In this respect it is vaguely parallel to the geometrization and Poi ncar´ e conjectures. The easier problem stated in item (2) can, in theory, be attac ked head-on, given the known presentations of the mapping class groups. T he third point hints to the fact that the generators in Alg correspond to Morse-theoretically elementary cobordisms, and the relations can be interprete d, similarly, in terms of handle slides and cancellation. This is, thus, reminisce nt of the definitions of, e.g. Steinberg groups of 3-manifolds. The problem in item (4 ) is, again, easily stated but even in 4 dimensions lingers in almost complete to tal darkness. It is not hard to understand that higher category theory has to b e invoked and not just one “object” A suﬃces as a “generator”. Any partial answers may open the possibility of constructing functorial 4-manifol d invariants by “linear representation” of such structures. In [216] ETQFT’s V are defined as double functors from the double category of relative, 2-framed 1+1+1-dim cobordisms Cob∗ to the double category of linear, abelian categories over a perfect field. (The “E” sta nds for “extended to surfaces with boundaries”). Applied to a single circle, t hought of as a 0- object in Cob∗, it yields an abelian category C V = V (S1), which we call the associated circle category. The main result of [216] is a construction of a V C, for each given modular tensor category C (meaning a bounded, ribbon, braided tensor category with some additional properties) s uch that C V C =C. The construction is made for all semisimple C, and is extended, in the case of non-semisimpleC, to both to the situation of connected surfaces with boundar y as well as disconnected, closed surfaces using the previous ly mentioned notion of half-projective TQFT’s.
