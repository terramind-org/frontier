  module: FormalConjectures.ErdosProblems.«642»
  decl: Erdos642.erdos_642
  statement: |-
    theorem erdos_642 :
        (fun n : ℕ => (maxEdges n : ℝ)) =O[atTop] (fun n : ℕ => (n : ℝ))
  context:
