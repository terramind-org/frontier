title: Recurrence and Diffusion in Alternating-Drift Walks
field: mathematics
tier: prose
statement: For the $H$-walk on $\mathbb Z^d$, whose cookie-induced drift alternates between left and right, determine whether the walk is recurrent in dimension 2 and transient in dimension 3. Determine the analogous behavior for the $Y$-walk, and whether the two-walker Slugs model in dimension 2 is diffusive and transient.
