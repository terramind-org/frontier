title: Matrix-Algebra Formalisms for Interacting Particle Models
field: mathematics
tier: prose
statement: For exponential bricklayers' processes and related locally infinite-state particle models, can one construct matrix-product or quantum matrix-algebra formalisms analogous to those for simple exclusion, relate the stationary and random-walk shock measures, and determine whether the latter is a Markovian integrated law of the second-class particle?
