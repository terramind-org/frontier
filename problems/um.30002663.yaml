title: Subadditivity of Symplectic Capacities Under Convex Covers
field: mathematics
tier: prose
statement: If a convex body $X\subset\mathbb{R}^{2n}$ is covered by finitely many convex bodies $X_i$, is there a symplectic capacity $c$ for which $\sum_i c(X_i)\geq c(X)$?
