lean:
  module: FormalConjectures.ErdosProblems.«865»
  decl: Erdos865.erdos_865.variants.sos
  statement: |-
    theorem erdos_865.variants.sos :
        ∀ᵉ (k : ℕ) (hk : 2 ≤ k),
        (fun N ↦ (f N k : ℝ)) ~[atTop] (fun N ↦ (1 / 2 : ℝ) * (1 + ∑ r ∈ Icc 1 (k - 2),
          (1 / 4 : ℝ) ^ r) * N)
