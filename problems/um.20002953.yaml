statement: For an ideal triangulation \(\lambda\) of a punctured finite-type surface, determine the additive indecomposable nonzero integral points of the \(SL_3\) KTGS cone, and identify the corresponding parallel-equivalence classes of reduced (nonelliptic) \(SL_3\)-webs.
