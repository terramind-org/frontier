title: A rank-two obstruction and denominator-growth separator for tame versus wild
field: mathematics
tier: prose
statement: |-
  **Problem 6.5 (A. Zelevinsky).** Describe a classification of infinite type cluster algebras as tame or wild. This should generalize the notions of tame/wild Artin groups, tame/wild quivers, etc.

  **Remark.** Affine types are certainly tame.
