title: Uniform Integral Multiples of Zariski Decompositions
field: mathematics
tier: prose
statement: Does every projective surface $X$ admit an integer $m$, depending only on $X$, such that the Zariski decomposition of $mD$ is integral for every effective divisor $D$ on $X$?
