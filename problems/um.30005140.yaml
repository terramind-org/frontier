title: Gaussian-Free-Field Maxima on Percolation Clusters
field: mathematics
tier: prose
statement: Consider the discrete Gaussian free field on the infinite cluster of two-dimensional Bernoulli bond percolation with parameter $p>1/2$. Does its centered maximum over a box of side length $N$ converge in distribution as $N\to\infty$ for every $p>1/2$, rather than only for $p$ sufficiently close to $1$?
