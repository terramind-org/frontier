  % UnsolvedMath ID 72; source catalogue code DARPA-013
  \setcounter{section}{71}
  \section{Game Theory at Scale}\label{72}
  {\small\sffamily UnsolvedMath ID 72 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  In a differential game a state follows dynamics such as $\dot x=F(t,x,u_1,\ldots,u_m)$, with each player choosing controls or a strategy to optimize its own specified payoff. A strategy may depend on observed histories under the information convention. A Nash equilibrium is a strategy profile at which no single player can improve its payoff by changing only its own strategy. Partial differential equations arise in value-function and equilibrium descriptions under additional assumptions. Scalability concerns how computational resources depend on the state dimension, player count and required accuracy.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  This is DARPA Mathematical Challenge Thirteen. Dynamics, information, payoffs, equilibrium notion, scaling regime and accuracy are not fixed by the source agenda; the illustrative dynamics do not impose a new source problem. The catalogue-linked mirror returned HTTP 404 during this preparation; its full original solicitation was not reverified. The supplied catalogue extract and historical attribution are documented with that access limitation.
  \paragraph{Statement recorded in the supplied source.}
  Create scalable mathematics for differential games, replacing traditional PDE approaches. \sref{72}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness.
  \subsection{Short English statement}
  Develop methods for large differential games and identify alternatives to solving their full partial differential equations.
