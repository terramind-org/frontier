lean:
  module: FormalConjectures.GreensOpenProblems.«17»
  decl: Green17.green_17.variants.exponential
  statement: |-
    theorem green_17.variants.exponential :
        ∃ c : ℝ, 0 < c ∧ c < 1 ∧ ∀ᶠ n : ℕ in atTop, ∀ A : Finset (𝔽₃ n),
          (1 - c) ^ n * 3 ^ n ≤ (A.card : ℝ) → HasRestrictedAP A
  context:
    - open Green17
    - open Green17.green_17
    - open Green17.green_17.variants
    - open Filter Asymptotics
  definitions:
    - name: Green17.HasRestrictedAP
      kind: def
      text: |-
        /--
        `HasRestrictedAP A` says that `A` contains a 3-term progression whose common difference is a
        nonzero vector in $\{0, 1\}^n$.
        -/
        def HasRestrictedAP {n : ℕ} (A : Finset (𝔽₃ n)) : Prop :=
          ∃ x d, IsRestrictedAP A x d
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/GreensOpenProblems/17.lean#L46
