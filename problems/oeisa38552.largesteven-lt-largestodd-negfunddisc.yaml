schema: 1
id: oeisa38552.largesteven-lt-largestodd-negfunddisc
title: Conjectures associated with A038552 (largestEven_lt_largestOdd_negFundDisc)
field: mathematics
tier: proof
statement: |-
  For even class number $n$, let $k$ be the largest odd number such that the quadratic field
  with discriminant $-k$ has class number $n$, and let $k'$ be the largest even such number, when
  they exist. Then $k > k'$.
