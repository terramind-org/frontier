lean:
  module: FormalConjectures.OEIS.«38552»
  decl: OeisA38552.largestEven_lt_largestOdd_negFundDisc
  statement: |-
    theorem largestEven_lt_largestOdd_negFundDisc {n k k' : ℕ} (hn : Even n)
        (hk : IsGreatest {m : ℕ | Odd m ∧ IsFundamentalDiscr (-m : ℤ) ∧
          classNumberOfDiscriminant (-m : ℤ) = n} k)
        (hk' : IsGreatest {m : ℕ | Even m ∧ IsFundamentalDiscr (-m : ℤ) ∧
          classNumberOfDiscriminant (-m : ℤ) = n} k') : k' < k
  context:
    - open OeisA38552
    - open NumberField Polynomial
  definitions:
    - name: OeisA38552.classNumberOfDiscriminant
      kind: def
      text: |-
        /-- The class number of the quadratic field with discriminant $d$. -/
        noncomputable def classNumberOfDiscriminant (d : ℤ) : ℕ :=
          haveI := Classical.dec (Irreducible (X ^ 2 - C (d : ℚ)))
          if h : Irreducible (X ^ 2 - C (d : ℚ)) then
            haveI := Fact.mk h
            NumberField.classNumber (AdjoinRoot (X ^ 2 - C (d : ℚ)))
          else 0
