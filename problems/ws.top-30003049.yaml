  \section{Polynomial Algorithms for Mean-Payoff Games and Linear Programming}\label{30003049}
  {\small UnsolvedMath ID 30003049 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Does there exist a polynomial-time algorithm for solving mean-payoff games? Does there exist a strongly polynomial algorithm for linear programming?
  \par\smallskip\textit{Formulation references:} \sref{30003049}{1}, \sref{30003049}{2}.
