lean:
  module: FormalConjectures.ErdosProblems.«32»
  decl: Erdos32.erdos_32
  statement: |-
    theorem erdos_32 : ∃ A : Set ℕ,
        IsAdditiveComplementToPrimes A ∧
        (fun N => (((Finset.Icc 1 N).filter (· ∈ A)).card : ℝ)) =o[atTop]
          fun N => (Real.log N) ^ 2
  context:
    - open Erdos32
    - open scoped Nat
    - open Filter Set Asymptotics
    - open scoped Classical
  definitions:
    - name: Erdos32.IsAdditiveComplementToPrimes
      kind: def
      text: |-
        /-- A set $A \subseteq \mathbb{N}$ is an _additive complement to the primes_ if every sufficiently
        large natural number can be written as $p + a$ for some prime $p$ and $a \in A$. -/
        def IsAdditiveComplementToPrimes (A : Set ℕ) : Prop :=
          ∀ᶠ n in atTop, ∃ p, p.Prime ∧ ∃ a ∈ A, n = p + a
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/32.lean#L39
