title: A semi-flat period and weighted-geodesic reduction for fibred special Lagrangians
field: mathematics
tier: prose
statement: |-
  **1. Elliptically fibred CY manifolds and their SLAG submanifolds.** What can be said about SLAGs in a CY 3-fold that happens to be elliptically fibred or K3 fibred? Are there nice characterizations? Are such SLAGs fibred? More specifically, if a real six-manifold $M^6$ is a Calabi--Yau threefold fibred over $\mathbb{CP}^1$ by K3 surfaces, can a real three-dimensional special Lagrangian $L^3$ be assembled over a curve $C\subset\mathbb{CP}^1$ from real two-tori in the K3 fibres? In an adiabatically collapsing family $M_t\to B$, what is the limiting base curve, and can the limit control the special Lagrangians?

  The primary three-page PDF is an AIM Workshop on Calibrations problem list compiled by Spiro Karigiannis in 2006. Lines 9--30 of page 1 form one numbered item:

  The primary source starts a distinct numbered item “2. Yau--Zaslow number for K3 manifolds” at line 31, followed by separately numbered items on Bäcklund transformations, $G_2$ Floer analogues, Bernstein problems, geometric measure theory, special Lagrangian cones, and regularity. Those later items are preserved as source provenance but are outside the mathematical ownership of this attempt.

  There is also an apparent source typo in the fifth bullet. It first defines $B$ as the base and $C\subset B$ as the curve, then asks “What is the curve $B$ in the limit?” The coherent reading is “What is the curve $C$ in the limit?” Both the literal wording and this reconstruction are recorded.
