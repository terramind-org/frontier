title: Pythagoras Numbers of Real Function Fields
field: mathematics
tier: prose
statement: For the function field $F$ of a variety over a real closed field, determine its Pythagoras number $p(F)$, or obtain good lower bounds, where $p(F)$ is the least $n$ such that every sum of squares in $F$ is a sum of $n$ squares.
