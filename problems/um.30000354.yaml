title: Reducibility Dichotomies for Liouville Quasiperiodic Cocycles
field: mathematics
tier: prose
statement: Let $\alpha$ be Liouville and $A$ a smooth $SL(2,\mathbb R)$-valued cocycle over rotation by $\alpha$. Is it true that for Lebesgue-almost every $\theta$, the cocycle $(\alpha,R_\theta A)$ is either nonuniformly hyperbolic or rotations-reducible? More generally, does the corresponding almost-rotations-reducibility dichotomy hold for every irrational $\alpha$?
