  \section*{Linear c0 detection from bi-Lipschitz absorption}\label{30007178}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If a separable real Banach space Z is bi-Lipschitz equivalent to Z direct-sum-infinity c0, must Z contain a closed linear subspace isomorphic to c0?
  \subsection{Short English statement}
  If a separable real Banach space Z is bi-Lipschitz equivalent to Z direct-sum-infinity c0, must Z contain a closed linear subspace isomorphic to c0?
