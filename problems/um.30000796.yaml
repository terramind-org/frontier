title: Uniform Rank Bounds for Elliptic Function Fields
field: mathematics
tier: prose
statement: For a nonconstant elliptic curve $E$ over $F(T)$, with $F$ an arbitrary field of characteristic zero and in particular $F\subseteq\mathbb C$, is the rank of $E(F(T))$ bounded uniformly as $E$ and/or $F$ vary? More generally, what can be said about the rank of elliptic curves over $F(T)$ for general fields $F$?
