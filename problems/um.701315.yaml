title: Kourovka Notebook Problem 17.13
field: mathematics
tier: prose
statement: |-
  Let $G$ be a totally imprimitive $p$-group of
  finitary permutations on an infinite set. Suppose that the support
  of any cycle in the cyclic decomposition of every element of $G$
  is a block for $G$. Does $G$ necessarily contain a minimal
  non-$FC$-subgroup?
