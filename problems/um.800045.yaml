title: The Lyapin's Notebook — Problem 47
field: mathematics
tier: prose
statement: |-
  (G. Mashevitzky)
  Does there exist a finite semigroup that generates an inclusive variety with an infinite lattice of inclusive subvarieties?

  The lattice of inclusive subvarieties of an inclusive variety, generated by a finite group or a finite nilsemigroup is finite (see [M3]).
