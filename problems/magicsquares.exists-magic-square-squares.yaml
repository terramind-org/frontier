lean:
  module: FormalConjectures.Wikipedia.MagicSquares
  decl: MagicSquares.exists_magic_square_squares
  statement: |-
    theorem exists_magic_square_squares :
        ∃ m : Fin 3 → Fin 3 → ℕ, ∃ t : ℕ,
           m.Injective2 ∧
           (∀ i j, 0 < (m i j) ∧ IsSquare (m i j)) ∧
           (∀ i, ∑ j, m i j = t) ∧
           (∀ j, ∑ i, m i j = t) ∧
           m 0 0 + m 1 1 + m 2 2 = t ∧
           m 0 2 + m 1 1 + m 2 0 = t
  context:
    - open MagicSquares
  definitions: []
