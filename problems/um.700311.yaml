statement: |-
  Prove that if $G$ is a torsion-free pro-$p
  $-group with
  a single defining relation, then $\mathrm{cd} G=2$. This has been
  proved for a large class of groups in (J. P. Labute, *Inv.
  Math.*, **4**, no. 2 (1967), 142--158).
