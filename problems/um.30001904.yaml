title: The Bismut–Lott Transfer Index Conjecture
field: mathematics
tier: prose
statement: |-
  Let $\pi:W\to B$ be a proper submersion with Riemannian structure $g$, and let $(V,h^V)$ be a local system of finitely generated projective modules over a number ring, equipped with metrics. If $\operatorname{index}^{\mathrm{top}}(V,h^V)$ is the differential Becker–Gottlieb transfer index and $\operatorname{index}^{\mathrm{an}}(V,h^V)$ is the analytic index corrected by the Bismut–Lott torsion form, is

  $$\delta=\operatorname{index}^{\mathrm{top}}(V,h^V)-\operatorname{index}^{\mathrm{an}}(V,h^V)=0?$$

  Equivalently, do the two index classes agree?
