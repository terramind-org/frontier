title: Integral-Point Non-Density on Plane-Divisor Complements
field: mathematics
tier: prose
statement: Let $D\subset\mathbb P^2_{\mathbb Q}$ be a normal-crossing divisor of degree at least four, set $X=\mathbb P^2_{\mathbb Q}\setminus D$, choose an affine embedding $X\hookrightarrow\mathbb A^n_{\mathbb Q}$, and let $S$ be a finite set of primes. Are the $S$-integral points on $X$ non-Zariski-dense?
