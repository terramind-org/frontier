title: Vertex Sets Meeting Every Edge Color
field: mathematics
tier: prose
statement: Let $r\geq3$, and let $H$ be a three-colored $(r-1)$-uniform hypergraph with $R$, $G$, and $B$ edges of the three colors. What is the maximum number of $r$-vertex sets $S$ for which $H[S]$ contains an edge of every color?
