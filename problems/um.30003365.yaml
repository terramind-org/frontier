title: Flat Bands on Nonpositively Curved Surfaces
field: mathematics
tier: prose
statement: Let $(S,g)$ be a nonpositively curved surface of genus at least 2, and let $K$ be the set of rank-2 unit tangent vectors whose geodesics encounter only zero curvature. Must $K$ have measure zero, and must it consist of finitely many flat bands of closed geodesics?
