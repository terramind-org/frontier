title: Orbifold Lifts of Deligne Mostow Forgetful Maps
field: mathematics
tier: prose
statement: For two Deligne–Mostow weight systems $\mu$ and $\nu$ satisfying the integrality condition, consider the forgetful map between their open moduli spaces of weighted configurations. When does this map extend to the metric completions of these moduli spaces? When an extension exists, can it be lifted to a map of orbifolds, equivalently to suitable torsion-free manifold covers?
