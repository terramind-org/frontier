title: Generic minimum density degree and a quartic counterexample
field: mathematics
tier: prose
statement: |-
  The following is asked as an analogue of a result due to Debarre and Klassen (arXiv:alg-geom/9210004).

  Let $X_d\subset\mathbb P^3_k$ ($k$ a number field) be a smooth surface of degree $d$. Are the degree $\le d-3$ points not Zariski dense? What is $\min\delta(X_d/k)$?

  You probably want to assume that $d$ is sufficiently large.

  One can also ask this question for the generic degree $d$ hypersurface, defined over the field of rational functions in the appropriate number of variables.

  For $d$ small, can we construct surfaces such that the degree $\le d-3$ points *are* Zariski dense?
