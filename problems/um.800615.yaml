title: Selection Principles in Mathematics — Problem 43 ([BG])
field: mathematics
tier: prose
statement: |-
  Say that $G\le{{\mathbb{Z}}^{\mathbb{N}}}$ is *bounded* if $\{|g| : g\in G\}$ is bounded (with respect to $\le^*$),
  where $|g|$ denotes the absolute value of $g$.
  For subgroups of ${{\mathbb{Z}}^{\mathbb{N}}}$:

  - $G$ satisfies $\mathsf{S}_1(\Omega_{\mathrm{nbd}},\Gamma)$ if, and only if, $G$ is bounded [Bab05].

  - $G$ satisfies $\mathsf{S}_1(\mathcal{O}_{\mathrm{nbd}},\mathcal{O}_{\mathrm{nbd}})$ if, and only if, $G$ has strong measure zero [coc11].

  Is it consistent that there is $G\le{{\mathbb{Z}}^\mathbb{N}}$
  such that $G$ has strong measure zero, is unbounded, and
  does not satisfy $\mathsf{S}_{\mathrm{fin}}(\mathcal{O},\mathcal{O})$?
