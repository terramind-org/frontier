title: Linear Systems and Eigenvalue Problems — Problem 31
field: mathematics
tier: prose
statement: |-
  Consider selecting $r = \mathcal{O}(k)$ uniformly random row indices $I$ and then choosing column indices $\tilde{J}$ so that $A(I,:) \approx A(I,\tilde{J}) \tilde{T}$.
  What are sufficient conditions on $r$ and on the kernel $f$ which guarantee that
  \begin{equation}
  \|\Pi_{\tilde{J}} A - A\|_F \leq c(n, m, k) \|\Pi_J A - A\|_F
  \end{equation}
  with high probability, where $c(n, m, k)$ grows at most logarithmically in its arguments? In other words, when does column selection on a random subset of the rows perform similarly to column selection on the full matrix?
