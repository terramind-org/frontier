title: Several Complex Variables Problem List — Problem 50
field: mathematics
tier: prose
statement: |-
  Let $\Omega \subset \subset \mathbb{C}^n$ be pseudoconvex with smooth boundary.
  For $K \subset \bar\Omega$ compact, let $\hat K:= \lbrace z \in \bar \Omega ;
  \phi(z) \leq sup_K \phi, \phi$ continuous on $\bar \Omega, \phi$
  plurisubharmonic on $\Omega \rbrace$. Assume $\hat K \cap \partial \Omega = K
  \cap \partial \Omega$.
  Then $\bar \Omega$ has a Stein neighborhood basis.\\
  -N. Sibony, sibony@anh.matups.fr
