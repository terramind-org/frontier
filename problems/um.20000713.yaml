title: Location-sensitive asymptotics for sparse fourth moments
field: mathematics
tier: prose
statement: |-
  Evaluate
  \[
  \sum_j\int_{t_j}^{t_j+T^{7/8}}
        \left|\zeta\!\left(\tfrac12+it\right)\right|^4\,dt,
  \]
  where the sum is over a set of $t_j$'s with modulus at most $T$, spaced more than $T^{7/8}$ apart (related to work of Heath-Brown and Zavorotnyi).
