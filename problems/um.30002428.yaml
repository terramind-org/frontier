title: Lang–Trotter Asymptotics for Fixed Frobenius Fields
field: mathematics
tier: prose
statement: |-
  Let $E/\mathbb Q$ be a non-CM elliptic curve and let $K$ be an imaginary quadratic field. Is

  $$\Pi_E(K;x)\sim c(E,K)\frac{\sqrt{x}}{\log x}$$

  for some $c(E,K)>0$, where $\Pi_E(K;x)$ counts ordinary primes of good reduction $p\leq x$ for which $\mathbb Q(\pi_p(E))\cong K$?
