title: Hilbert-Smith Conjecture
field: mathematics
tier: prose
statement: |-
  \section*{\texorpdfstring{Hilbert-Smith Conjecture}{Hilbert-Smith Conjecture}}\label{1482}
  \subsection{Definitions and mathematical statement}
  A faithful continuous action of a locally compact Hausdorff group $G$ on a connected topological manifold $M$ is a jointly continuous map $G\times M\to M$ satisfying the action laws, whose only element fixing every point is the identity. The Hilbert--Smith assertion says every such $G$ is a finite-dimensional Lie group. Its standard obstruction formulation excludes faithful actions of
  \[
   {\mathbb{Z}}_p=\varprojlim_m{\mathbb{Z}}/p^m{\mathbb{Z}}
  \]
  by homeomorphisms for every prime $p$. Here $M$ has the usual finite-dimensional manifold conventions, and ${\mathbb{Z}}_p$ is the compact additive group of $p$-adic integers, not the field ${\mathbb{Q}}_p$. No differentiability or Lipschitz regularity of the action is assumed.
  \par\smallskip\textit{Formulation and concept references:} \href{https://www.math.stonybrook.edu/~jpardon/manuscripts/13_hs2d.pdf}{[S1]}.

  \subsection{Short English statement}
  Must every locally compact group acting continuously and faithfully on a connected manifold be a Lie group, even when its action is only by homeomorphisms?
  \subsection{Sources}
  \begin{itemize}
  \item[S1]John Pardon, "Totally disconnected groups (not) acting on two-manifolds," manuscript of 6 July 2018 (surveying the Hilbert-Smith Conjecture; published in proceedings on Breadth in Contemporary Topology).
  \url{https://www.math.stonybrook.edu/~jpardon/manuscripts/13_hs2d.pdf}.
  \textit{Formulation source.}
  \end{itemize}
