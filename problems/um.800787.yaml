title: Local Discrete Holomorphic Dynamics — Open Problem OP5
field: mathematics
tier: prose
statement: |-
  \emph{Let $f\in\mathop\mathrm{End}\nolimits(\mathbb{C}^n,O)$ be non-invertible and dominant. Is it true that $c_\infty=c_\infty(f)$ is an
  algebraic integer of order at most $n$, i.e., there are integers $a_0,\ldots, a_{n-1}\in\mathbb{Z}$ such that $c^n_\infty+a_{k-1} c_\infty^{k-1}+\cdots+a_0=0$? Moreover, does there exist
  $\delta\in(0, 1]$ such that $\delta c^k_\infty\le c(f^k)\le c^k_\infty$
  for all $k\ge 1$?}

  Roughly speaking, the order of a germ may be thought of as a sort of analog of the degree
  of a polynomial map: the former somewhat measure the rate of attraction of the origin, while
  the latter measure the rate of attraction of infinity. For the sequence of the degree of the
  iterates of a polynomial map, Favre and Jonsson [FJ2] have proved the following

  \begin{theorem}[Favre-Jonsson, 2011 [FJ2]]

  Let $F\colon\mathbb{C}^2\to\mathbb{C}^2$ be a polynomial map. Then the sequence $\{\deg F^j\}_{j\in\mathbb{N}}$
  satisfies a linear recursion formula with integer coefficients.
  \end{theorem}

  We can then wonder whether a similar property holds for the sequence of orders of the iterates
  of a germ:
