title: Chromatic Number of Almost-Linear Graph Unions
field: mathematics
tier: prose
statement: Let $G_1,\ldots,G_n$ be graphs with $\chi(G_i)\leq n-1$ such that every two have at most one vertex in common. How large can $\chi(G_1\cup\cdots\cup G_n)$ be?
