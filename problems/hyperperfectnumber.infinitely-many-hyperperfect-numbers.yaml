lean:
  module: FormalConjectures.Wikipedia.HyperperfectNumber
  decl: HyperperfectNumber.infinitely_many_hyperperfect_numbers
  statement: |-
    theorem infinitely_many_hyperperfect_numbers :
        {n : ℕ | ∃ k ≥ 2, IsHyperperfect k n}.Infinite
  context:
    - open HyperperfectNumber
  definitions:
    - name: HyperperfectNumber.IsHyperperfect
      kind: def
      text: |-
        /-- Predicate asserting that $n > 1$ is $k$-hyperperfect ($k \ge 1$):
        $n = 1 + k \cdot (s(n) - 1)$ where $s(n)$ sums the proper divisors of $n$. -/
        def IsHyperperfect (k n : ℕ) : Prop :=
          0 < k ∧ 1 < n ∧ n = 1 + k * ((∑ d ∈ n.properDivisors, d) - 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/HyperperfectNumber.lean#L50
