title: Exactification and radial obstructions for the compact cardinality problem
field: mathematics
tier: prose
statement: |-
  It is a fact that a compact Hausdorff space \(X\) is countably tight if and only if \(X\) contains no \(\omega_1\)-free sequence.

  Suppose \(X\) is a compact Hausdorff space of tightness \(\aleph_1\) (i.e. there are no \(\omega_2\)-free sequences) and density \(\aleph_1\). Is it true that \(|X|\leq 2^{\aleph_1}\)?
