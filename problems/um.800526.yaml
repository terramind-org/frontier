title: Linear Systems and Eigenvalue Problems — Problem 35 (Regression in the $\ell_p$ norm)
field: mathematics
tier: prose
statement: |-
  Consider the $\ell_p$ linear regression problem

  \begin{equation*}
  \operatorname{minimize}_{x \in\mathbb{R}^d} \|Ax - b\|_{\ell_p}
  \end{equation*}

  for a matrix \(A \in \mathbb{R}^{n \times d}\) and a vector \(b\in\mathbb{R}^{n}\).
  For a sketching matrix \(\Omega \in \mathbb{R}^{n \times k}\), the sketch-and-solve solution is \[\tilde x \in \operatorname{argmin}_{x \in\mathbb{R}^d} \|(\Omega^\top Ax)-(\Omega^\top b)\|_{\ell_p}.\]
  Formulate a generalization of the OSI property to the $\ell_p$ regression problem which ensures that this procedure succeeds to constant-factor accuracy
  \[
  \|A \tilde x - b \|_{\ell_p}
  \leq \mathrm{const}\cdot \min_{x \in \mathbb{R}^d}\|Ax - b\|_{\ell_p}.
  \]
