id: um.30003626
title: Sharp Eigenvalue Bounds for Nonselfadjoint Jacobi Perturbations
field: mathematics
tier: prose
statement: |-
  Let $E\subset\mathbb R$ be a finite-gap set, let $J_0\in\mathcal T_E$, and let $J=J_0+\delta J$ be a compact nonselfadjoint Jacobi perturbation. Does the bound

  $$\sum_{z\in\sigma_d(J)}\frac{\operatorname{dist}(z,E)^{p+\varepsilon}(1+\lvert z\rvert)^{1/2-2\varepsilon}}{\operatorname{dist}(z,\partial E)^{1/2}}\leq L_{\varepsilon,p,E}\sum_{n=-\infty}^{\infty}\left(\lvert\delta a_n\rvert^p+\lvert\delta b_n\rvert^p+\lvert\delta c_n\rvert^p\right)$$

  remain valid for $\varepsilon=0$? Can the denominator $\operatorname{dist}(z,\partial E)^{1/2}$ be replaced by $\operatorname{dist}(z,E)^{1/2}$?
