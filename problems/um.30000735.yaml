title: Breaking Points in Diameter Positional Games
field: mathematics
tier: prose
statement: For the biased diameter games $D_d(a:b)$ on $E(K_n)$, is the breaking point, up to a polylogarithmic factor, asymptotic to the known biases at which Breaker wins? In particular, is the breaking point for $D_3(3:b)$ of order $n^{2/3}\operatorname{polylog}(n)$, and what is it for $D_3(2:b)$?
