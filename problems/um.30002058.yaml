title: Finite-Ring Solutions of Thurston Equations
field: mathematics
tier: prose
statement: Let $M$ be a compact $3$-manifold. For every nontrivial $\gamma\in\pi_1(M)$, is there a finite commutative ring $R$ with identity and a homomorphism $\pi_1(M)\to\operatorname{PSL}(2,R)$ that does not send $\gamma$ to the identity? If $M$ is closed, oriented, and not $S^3$, does some one-vertex triangulation of $M$ have Thurston equations solvable over such a finite ring?
