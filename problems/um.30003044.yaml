title: Kato Cohomology Kernels of Quadratic Pfister Forms
field: mathematics
tier: prose
statement: Let $Q=\langle 1,a_1\rangle\otimes\cdots\otimes\langle 1,a_m\rangle\otimes[1,b]$ be an anisotropic quadratic Pfister form over $F$. Is the Kato-cohomology kernel $H_2^{n+1}(F(Q)/F)$ equal to $b\,\frac{d a_1}{a_1}\wedge\cdots\wedge\frac{d a_m}{a_m}\wedge\nu_F(n-m)$ when $n\geq m$, and zero when $n<m$?
