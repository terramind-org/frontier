title: Open Problems in Wavelet Theory — Conjecture 2
field: mathematics
tier: prose
statement: |-
  Let $\mathscr D$ be any wavelet dimension function, i.e., $\mathscr D$ satisfies (D1)--(D4). Then, the collection of o.n. wavelets with the same dimension function
  \[
  \{\psi \in L^2(\mathbb{R}): \psi \text{ is an o.n. wavelet and } \mathscr D_\psi=\mathscr D\}.
  \]
  is a path connected subset of $L^2(\mathbb{R})$.
