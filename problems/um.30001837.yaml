title: Large-Image Even Galois Representations
field: mathematics
tier: prose
statement: Does there exist an absolutely irreducible continuous even representation $\rho:G_{\mathbb Q}\to\operatorname{GL}_2(\mathbb F_p)$ that is unramified outside $p$ and whose image contains $\operatorname{SL}_2(\mathbb F_p)$? In particular, is there at most one prime $p<10^6$ for which such a representation exists?
