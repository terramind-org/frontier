title: Hexagonal Extremizers for a Geometric Uncertainty Principle
field: mathematics
tier: prose
statement: |-
  For a finite measurable partition $[0,1]^2=\bigcup_{i=1}^N\Omega_i$, define

  $$\mathcal A(\Omega_i)=\inf_{|B|=|\Omega_i|}\frac{|\Omega_i\mathbin\triangle B|}{|\Omega_i|},\qquad \mathcal D(\Omega_i)=\frac{|\Omega_i|-\min_j|\Omega_j|}{|\Omega_i|},$$

  where the infimum is over disks $B$. Is the minimum of

  $$\sum_{i=1}^N|\Omega_i|\mathcal A(\Omega_i)+\sum_{i=1}^N|\Omega_i|\mathcal D(\Omega_i)$$

  asymptotically attained by a hexagonal partition, with suitable modifications along the boundary?
