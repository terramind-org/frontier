title: Kourovka Notebook Problem 18.5
field: mathematics
tier: prose
statement: |-
  Let the (soluble) group $G=AB$ with finite
  torsion-free rank $r_0(G)$ be the product of two subgroups $A$ and $B$.
  Is the equation $r_0(G) = r_0(A) + r_0(B) - r_0(A \cap B)$ valid in this case?
  It is known that the inequality $\leq$ always holds.
