title: Comparative Prime Number Theory — Problem 7
field: mathematics
tier: prose
statement: |-
  Localize the first negative value for $\Delta_{\mathbb{K}}(x)$ when $\mathbb{K}$ is $\mathbb{Q}(\sqrt{5})$, $\mathbb{Q}(\sqrt{13})$, or some other simple number field. In general, obtain an upper bound for the first sign change of $\Delta_{\mathbb{K}}(x)$ for a family of number fields $\mathbb{K}$.

  - (Alexandre Bailleul, Université Paris--Saclay) There exist highly biased races, such as the (appropriately normalized) race between quadratic residues and nonresidues for composite moduli $q$. Fiorilli [Fio] formulated a conjecture for the Skewes's number of this race between residues and nonresidues (the smallest real number for which the counting function for primes that are quadratic residues overcomes the bias): it is roughly of the form $\exp\bigl( \exp\bigl( {\rho(q)}/\log{\mathrm{rad}(q)} \bigr) \bigr)$, where $\rho(q)$ is the index of the subgroup of squares in $(\mathbb{Z}/q\mathbb{Z})^{\times}$ and $\mathrm{rad}(q)$ is the radical (largest squarefree divisor) of $q$.

  More recently, Fiorilli and Jouve [FJ] and Bailleul [Bai] have investigated similar highly-biased races in number fields.
