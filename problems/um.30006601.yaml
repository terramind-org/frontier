statement: For every finite-dimensional algebra $\Lambda$, prove that the configuration spaces defined by its universal $F$-polynomials and its $u$-equations satisfy $\widetilde{\mathcal M}_\Lambda=\widetilde{\mathcal U}_\Lambda$ and $\mathcal M_\Lambda=\mathcal U_\Lambda$.
