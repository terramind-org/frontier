title: Finite-relator detection of the free-subgroup cover property
field: mathematics
tier: prose
statement: |-
  Let $A$ be a finite alphabet and $\Omega$ be a 2-sided subshift, i.e., a closed subset of $A^\mathbb{Z}$ that is invariant under the shift map $\sigma$. An element $g \in Homeo(\Omega)$ belong to the full group of the shift ($F(\Omega)$) if each point in $\Omega$ has an open neighborhood $U$ such that $g|_U = (\sigma^n)|_U$ for some $n \in \mathbb{Z}$ depending on $U$ is equal to resembles a power of the shift map.

  Is it true that for all finitely generated subgroup $H \leq F(\Omega)$, $H$ is either elementary amenable or for any $K$ finitely presented subgroup such that $K \twoheadrightarrow H$, $K$ contains a free subgroup?

  **Recovered question.** Let $[[\sigma]]$ be the topological full group of $(\Omega,\sigma)$. Is every finitely generated subgroup $H\leq[[\sigma]]$ either elementary amenable, or does it have the property
  \[
   \mathcal C(H):\quad
   \text{every finitely presented group $K$ admitting an epimorphism
   $K\twoheadrightarrow H$ contains a nonabelian free subgroup $F_2$?}
  \]
