lean:
  module: FormalConjectures.ErdosProblems.«1057»
  decl: Erdos1057.erdos_1057
  statement: |-
    theorem erdos_1057 :
        Tendsto (fun x ↦ Real.log (carmichaelCounting x) / Real.log x) atTop (𝓝 1)
  context:
    - open Erdos1057
    - open Nat Real Filter Set
    - open scoped Topology Asymptotics
  definitions:
    - name: Erdos1057.carmichaelCounting
      kind: def
      text: |-
        /--
        Let $C(x)$ count the number of Carmichael numbers in the interval $[1,x]$.
        -/
        noncomputable def carmichaelCounting (x : ℝ) : ℝ :=
          ({n : ℕ | IsCarmichael n ∧ (n : ℝ) ≤ x}.ncard : ℝ)
