title: Eigenvector Volumes and Angles in Ginibre Matrices
field: mathematics
tier: prose
statement: For left and right eigenvectors of an $N\times N$ complex Ginibre matrix, what is the volume of the parallelepiped formed by eigenvectors whose eigenvalues lie near fixed deterministic parameters $\nu_1,\ldots,\nu_\ell$ as $N\to\infty$? How does the minimum angle between eigenvectors depend on $N$?
