title: Kourovka Notebook Problem 15.104
field: mathematics
tier: prose
statement: |-
  Let $n$ be a positive integer and let
  $w$ be a
  group word in the variables $x_1, x_2,\ldots $.
  Suppose that a residually finite group $G$ satisfies the identity $
  w^n=1$.
  Does it follow that the verbal subgroup $w(G)$ is
  locally finite?

  This is the Restricted Burnside Problem if
  $w=x_1$. A positive answer was obtained also in a number of other
  particular cases (P. V. Shumyatsky, *Quart. J. Math.*, **51**, no. 4 (2000), 523--528).
