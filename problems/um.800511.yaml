id: um.800511
title: Linear Systems and Eigenvalue Problems — Problem 20 (Deterministic Pseudospectral Shattering)
field: mathematics
tier: prose
statement: |-
  Give a provably correct and efficient *deterministic* algorithm for the following task: on input $A\in\mathbb{C}^{n\times n}$ and $\delta>0$, output a perturbation $E$ with $\|E\|\le \delta$ such that $\kappa_{eig}(A+E)\le C(\delta/n)^c$,
  where $C,c$ are universal constants.
  In this context, efficient means $O(n^3\log^c(n/\delta))$ arithmetic operations, either in exact arithmetic or, more ambitiously, in finite arithmetic with $O(\log^c(n/\delta))$ bits of precision.
