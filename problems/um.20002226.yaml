title: Weak square after collapsing a successor of a singular
field: mathematics
tier: prose
statement: |-
  Suppose \(\kappa\) is singular with cofinality \(\omega_1\). Let \(\lambda=\kappa^+\). Must \(\square_{\omega_1}^*\) hold in a forcing extension where \(\lambda\) is \(\aleph_2\)?

  If \(V\subseteq W\), \(\lambda\) is a successor of a singular in \(V\), and \(\lambda=\aleph_2^W\), must weak square hold at \(\lambda\) in \(W\)?
