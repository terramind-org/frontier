title: A smooth-modulus 21/40 small-residue maximum and a weight-quantifier audit
field: mathematics
tier: prose
statement: |-
  The record is Problem 16 in the AIM workshop list *Gaps between primes* (2005). With
  \[
   \psi(x;q,a)=\sum_{\substack{n\le x\\n\equiv a\pmod q}}\Lambda(n),
  \]
  the three questions attributed to J. B. Friedlander are:

  1. Show, for some fixed \(\theta>1/2\) and \(D=x^\theta\), that
     \[
     \sum_{\substack{d\le D\\(d,a)=1}}\mu(d)
     \left(\psi(x;d,a)-\frac{x}{\phi(d)}\right)
     \ll x(\log x)^{-A}.
     \]
  2. Prove anything beyond the Bombieri--Vinogradov theorem for
     \[
     \sum_{d\le D}\max_{\substack{(a,d)=1\\|a|<(\log x)^{2005}}}
     \left|\psi(x;d,a)-\frac{x}{\phi(d)}\right|.
     \]
  3. For any “reasonable” weights \(\lambda_d\), show, for some fixed
     \(\theta>1/2\) and \(D=x^\theta\), that
     \[
     \sum_{\substack{d\le D\\(d,a)=1}}\lambda_d
     \left(\psi(x;d,\bar a)-\frac{x}{\phi(d)}\right)
     \ll x(\log x)^{-A},
     \qquad a\bar a\equiv1\pmod d.
     \]

  The item continues with two broader prompts: obtain Bombieri--Vinogradov-type theorems for arithmetic functions other than \(\Lambda\), and formulate a reasonable zeros-of-\(L\)-functions conjecture implying \(\mathrm{EH}(\theta)\) for some \(\theta>1/2\).

  The PDF displays \(A\) without a quantifier. The standard and useful reading, adopted below, is “for every fixed \(A>0\),” with constants allowed to depend on fixed parameters. This is a reconstruction, not a literal quantifier in the source.
