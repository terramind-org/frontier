title: Excluding prime Frobenius--Perron dimension 37
field: mathematics
tier: prose
statement: |-
  Suppose \(\mathcal C\) is a finite tensor category over \(\mathbb C\) with prime Frobenius--Perron dimension. Is \(\mathcal C\) fusion?

  (Hence, it would be of the form \(\operatorname{Vect}(\mathbb Z/p,\omega)\). This would be an extension of a result in Hopf algebras.)
