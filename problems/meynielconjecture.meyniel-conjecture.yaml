lean:
  module: FormalConjectures.Wikipedia.MeynielConjecture
  decl: MeynielConjecture.meyniel_conjecture
  statement: |-
    theorem meyniel_conjecture :
        ∃ C : ℝ, 0 < C ∧ ∀ (V : Type) [Fintype V] (G : SimpleGraph V), G.Connected →
          (copNumber G : ℝ) ≤ C * Real.sqrt (Fintype.card V)
  context:
    - open MeynielConjecture
    - open Filter
    - "variable {V : Type*}"
  definitions:
    - name: MeynielConjecture.copNumber
      kind: def
      text: |-
        /-- The **cop number** `c(G)`: the least number of cops that can guarantee to catch the
        robber on `G`. -/
        noncomputable def copNumber (G : SimpleGraph V) : ℕ :=
          sInf {k | CopsWin G k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/MeynielConjecture.lean#L64
