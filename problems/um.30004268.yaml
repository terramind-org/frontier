title: Rank Stratifications and KLR Actions on Flag Degenerations
field: mathematics
tier: prose
statement: For the flat family $F_U\to U$ of linear degenerations, study the stratification by the rank conditions defining $S(A)$. Describe $H_*^{\mathrm{BM}}(F_U\times_U F_U)$ as a quotient of a quiver Hecke, or KLR, algebra, together with its standard representations indexed by Motzkin paths.
