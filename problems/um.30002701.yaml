title: Unstable Invariance of Multiple-Correlation Limits
field: mathematics
tier: prose
statement: Are all weak-$L^2$ accumulation points of the multiple-correlation sequence $\varphi_1\circ f^{n_1}\,\varphi_2\circ f^{n_1+n_2}\cdots\varphi_k\circ f^{n_1+\cdots+n_k}$, as all $n_i\to\infty$, also $W^u$-invariant, given that they are $W^s$-invariant?
