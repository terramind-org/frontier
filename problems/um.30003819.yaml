title: Stanley Rank-Size Bounds for Differential Posets
field: mathematics
tier: prose
statement: For every $r$-differential poset with rank sizes $p_n$, improve the bound $$p_n\leq1+r\sum_{k=0}^{n-2}p_k+(r-1)p_{n-1}$$ toward Stanley's conjectured inequality $p_n\leq rp_{n-1}+p_{n-2}$.
