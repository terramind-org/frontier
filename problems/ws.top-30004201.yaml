  \section{Chromatic Fixed-Point Implications for Finite p-Groups}\label{30004201}
  {\small UnsolvedMath ID 30004201 · Topology}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $H<G$ be subgroups of a finite $p$-group and let $m,n$ be nonnegative integers. For which pairs $(m,n)$ does $$K(m)_*(\Phi^H X)=0\quad\Longrightarrow\quad K(n)_*(\Phi^G X)=0$$ hold for every finite $G$-spectrum $X$?
  \par\smallskip\textit{Formulation references:} \sref{30004201}{1}, \sref{30004201}{2}.
  \subsection{Short English statement}
  Let $H<G$ be subgroups of a finite $p$-group and let $m,n$ be nonnegative integers. For which pairs $(m,n)$ does $$K(m)_*(\Phi^H X)=0\quad\Longrightarrow\quad K(n)_*(\Phi^G X)=0$$ hold for every finite $G$-spectrum $X$?
