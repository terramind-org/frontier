title: Injective cubes require noninjective relations
field: mathematics
tier: prose
statement: |-
  **Computation of cubical homology**

  When computing cubical homology of a simple graph \(X\), one builds a cubical set \(MX\) whose \(n\)-cubes are maps
  \[
  I_1^{\square n}\longrightarrow X
  \]
  and then takes the usual cubical homology of this cubical set.

  Can cubical homology of a graph be computed using only injective maps \(I_1^{\square n}\to X\)? Should this restriction be made at the cubical set or chain complex level?
