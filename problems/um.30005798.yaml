title: Higher Fano Manifolds as Higher Rational-Connectedness Conditions
field: mathematics
tier: prose
statement: For every $k$, prove that $k$-Fano manifolds are covered by rational $k$-folds and that a proper family over a $k$-dimensional base whose fibers are $k$-Fano admits a rational section, modulo the Brauer obstruction.
