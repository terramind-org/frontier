lean:
  module: FormalConjectures.GreensOpenProblems.«33»
  decl: Green33.green_33
  statement: |-
    theorem green_33 :
        ∀ ε : ℝ, 0 < ε →
          ∃ᶠ q : ℕ+ in atTop,
            ∃ A : Finset (ZMod q),
              A + A = Finset.univ ∧
              |((A.card : ℝ) / Real.sqrt q - Real.sqrt 2)| < ε
