title: Proper Minimal Embeddings of Open Surfaces
field: mathematics
tier: prose
statement: Let $M$ be an open surface. Does $M$ admit a complete proper minimal embedding in some smooth bounded domain $D\subset\mathbb R^3$ if and only if $M$ has finitely many nonorientable ends and every end of $M$ has infinite genus?
