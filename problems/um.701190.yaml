title: Kourovka Notebook Problem 15.102
field: mathematics
tier: prose
statement: |-
  (W. Magnus). An
  element $r$ of a free group $F_n$ is called a *normal root* of
  an element $u\in F_n$ if $u$ belongs to the normal closure of $r$
  in $F_n$.
  Can an element $u$ that lies outside the commutator
  subgroup $[F_n, F_n]$ have infinitely many non-conjugate normal
  roots?
