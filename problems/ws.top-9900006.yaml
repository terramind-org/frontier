  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Hermann Thorisson, \emph{Some Open Probability Problems}, author preprint; original Universidad de Buenos Aires copy preserved in Internet Archive capture of 27 March 2024, Section 3, coupling definitions, p. 3, and Problem 3.2, p. 4. \url{https://web.archive.org/web/20240327021031id_/http://cms.dm.uba.ar/depto/public/Some%20Open%20Problems-preprint.pdf}.
  \end{description}
