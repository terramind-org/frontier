statement: |-
  \section*{One signing for all Euclidean prefixes}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Does an absolute C exist such that every finite prescribed-order sequence $v_{1},\dots ,v_N$ in the Euclidean unit ball of $R^{d}$ admits one signing $\varepsilon _i\in {-1,1}$ for which $max_{0\leq k\leq N}\Vert \Sigma _{i\leq k}\varepsilon _i$ $v_i\Vert _{2}\leq C\surd d$? No zero-total condition is assumed, and signs may depend on the whole sequence.
  \subsection{Short English statement}
  Does an absolute C exist such that every finite prescribed-order sequence $v_{1},\dots ,v_N$ in the Euclidean unit ball of $R^{d}$ admits one signing $\varepsilon _i\in {-1,1}$ for which $max_{0\leq k\leq N}\Vert \Sigma _{i\leq k}\varepsilon _i$ $v_i\Vert _{2}\leq C\surd d$? No zero-total condition is assumed, and signs may depend on the whole sequence.
