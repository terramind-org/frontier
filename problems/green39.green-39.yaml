lean:
  module: FormalConjectures.GreensOpenProblems.«39»
  decl: Green39.green_39
  statement: |-
    theorem green_39 :
        Tendsto
          (fun p : {q : ℕ // q.Prime} ↦
            let k := Nat.sqrt p
            let c := 100 * k
            (proportionCoverable p k c : ℝ))
          atTop (𝓝 1)
  context:
    - open Green39
    - open Filter Topology
    - open scoped Pointwise
  definitions:
    - name: Green39.proportionCoverable
      kind: def
      text: |-
        /--
        The proportion of subsets of $\mathbb{Z}/p\mathbb{Z}$ of size $k$ that can cover
        $\mathbb{Z}/p\mathbb{Z}$ using at most $c$ translates.

        If p = 0 or k > p, return 0 by convention.
        -/
        def proportionCoverable (p k c : ℕ) : ℚ :=
          if h : p = 0 then 0
          else if k > p then 0
          else
            have : NeZero p := ⟨h⟩
            let S : Finset (Finset (ZMod p)) := Finset.powersetCard k Finset.univ
            let coverable := S.filter (fun A => ∃ T : Finset (ZMod p), T.card ≤ c ∧ A + T = Finset.univ)
            (coverable.card : ℚ) / (S.card : ℚ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/GreensOpenProblems/39.lean#L38
