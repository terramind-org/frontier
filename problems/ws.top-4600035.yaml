  \item[S2] Boyle - Open Problems in Symbolic Dynamics (2008), Problem/Question/Conjecture 22.1. Original source indexed by AMR-045-0035.
  \url{https://www.math.umd.edu/~mboyle/papers/openfinalsub3nov2007.pdf}.
  \item[S3] Hochman, Groups of automorphisms of SFTs; precise abstract-group formulation.
  \url{https://math.huji.ac.il/~mhochman/problems/automorphisms.pdf}.
  \end{itemize}
