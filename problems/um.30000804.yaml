title: Reproducing Subgroups of Metaplectic–Heisenberg Representations
field: mathematics
tier: prose
statement: For the metaplectic–Heisenberg representation on $L^2(\mathbb{R}^d)$, which subgroups $H$ of the ambient group $G$ admit an analyzing window $\varphi\in L^2(\mathbb{R}^d)$ such that $f=\int_H\langle f,\widetilde{\mu}_e(h)\varphi\rangle\widetilde{\mu}_e(h)\varphi\,dh$ for every $f\in L^2(\mathbb{R}^d)$?
