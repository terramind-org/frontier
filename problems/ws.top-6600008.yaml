statement: |-
  \section{U. Grimm: Diffraction of a Pinwheel Tiling — Problem}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A pinwheel tiling is the Conway--Radin substitution tiling by right triangles of side lengths $1,2,\sqrt5$: inflating by $\sqrt5$ yields five congruent original triangles in the standard pinwheel subdivision. Choose on each triangle the point whose coordinates from the right-angle vertex along its perpendicular unit axes are $(1/2,1/2)$, and let $\Lambda$ be all these points. The uniform Dirac comb is $\omega=\sum_{x\in\Lambda}\delta_x$. Its volume-averaged autocorrelation is
  \[\gamma=\lim_{R\to\infty}\frac{\omega|_{B_R}*\widetilde{\omega|_{B_R}}}{\operatorname{area}(B_R)},\]
  in the vague topology; the tilde reflects and conjugates a measure. The positive diffraction measure is its Fourier transform $\widehat\gamma$, with kernel $e^{-2\pi i k\cdot x}$. This measure is rotationally invariant. A sharp ring at radius $r>0$ is a nonzero component $I_r\sigma_r$ of $\widehat\gamma$, where $\sigma_r$ is normalized uniform measure on the circle $\{|k|=r\}$. Its intensity $I_r$ is its total measure; such a ring is an atom of the radial measure even though it is singular continuous as a measure on the plane.
  \paragraph{Statement recorded in the supplied source.}
  Determine all sharp-ring radii of pinwheel diffraction and their intensities. \sref{statement}{2}
  \subsection{Short English statement}
  Locate the sharp circular diffraction rings and calculate how much intensity each carries.
