  \begin{itemize}
  \item[S1] ULAM.AI and the UnsolvedMath Contributors, supplied problems.json, catalogue entry, AIM Workshop Problem Lists. Catalogue identity and source transcription; CC BY 4.0.
  \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[S2] American Institute of Mathematics, Manifolds with nonnegative sectional curvature, item 28. Original workshop question.
  \url{https://aimath.org/WWN/nnsectcurvature/nnsectcurvature.pdf}.
  \end{itemize}
