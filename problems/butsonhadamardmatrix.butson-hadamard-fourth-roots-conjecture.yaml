lean:
  module: FormalConjectures.Wikipedia.ButsonHadamardMatrix
  decl: ButsonHadamardMatrix.butson_hadamard_fourth_roots_conjecture
  statement: |-
    theorem butson_hadamard_fourth_roots_conjecture (m : ℕ) (hm : 1 ≤ m) :
        ∃ M, IsButsonHadamard (n := 2 * m) 4 M
  context:
    - open ButsonHadamardMatrix
  definitions:
    - name: ButsonHadamardMatrix.IsButsonHadamard
      kind: def
      text: |-
        /-- `M` is a **Butson-type Hadamard matrix** $H(k, n)$ if $k > 0$, every entry satisfies
        $z^k = 1$, and $M M^* = n I_n$. -/
        def IsButsonHadamard {n : ℕ} (k : ℕ) (M : Matrix (Fin n) (Fin n) ℂ) : Prop :=
          0 < k ∧ (∀ i j, M i j ^ k = 1) ∧ M * M.conjTranspose = (n : ℂ) • 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/ButsonHadamardMatrix.lean#L52
