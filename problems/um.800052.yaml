title: Hirzebruch's 1954 Problem List — Problem 1
field: mathematics
tier: prose
statement: |-
  At the beginning of June,1953, Hirzebruch proved what he then called the ``index theorem'':
  $$
  \tau (M) = \langle L(p_1,\ldots,p_k),[M]\rangle \ ,
  $$
  where $M$ is any closed smooth oriented manifold, $\tau (M)$ is its index or signature, and $L(p_1,\ldots,p_k)$ is the $L$-polynomial
  in the Pontrygain classes of $M$. Later on the term ``index'' became monopolized by the Fredholm index appearing in the
  Atiyah--Singer index theorem, and so $\tau (M)$ is now usually called the signature, and the ``index theorem'' has become the
  Hirzebruch signature theorem.

  Give an elementary proof of the index theorem and explain the geometrical meaning of the functional equation valid for $\tau$.
