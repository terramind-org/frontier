title: Charge on LS galleries and paths
field: mathematics
tier: prose
statement: Define a charge statistic on galleries. Recall that the tableaux form a subset of the galleries under a natural injection, so the new statistic should restrict to the usual charge statistic on tableaux. Galleries, in turn, can be viewed as Littelmann paths, so one could even ask for a charge statistic on the latter objects.
