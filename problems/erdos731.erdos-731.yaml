  decl: Erdos731.erdos_731
  statement: |-
    theorem erdos_731 : ∀ ε > (0 : ℝ),
        {n : ℕ | |(leastNonDivisor n : ℝ) / erdos_731.answer n - 1| < ε}.HasDensity 1
  context:
    - open Erdos731
  definitions:
    - name: Erdos731.leastNonDivisor
      kind: def
      text: |-
        /-- The least integer $m \geq 1$ such that $m \nmid \binom{2n}{n}$, denoted $A(n)$ in [EGRS75].
        The set is nonempty, since it contains $\binom{2n}{n}+1$ (see `leastNonDivisor_spec`), so `sInf`
        is the true minimum. The condition `0 < m` excludes `m = 0`. -/
        noncomputable def leastNonDivisor (n : ℕ) : ℕ :=
          sInf {m : ℕ | 0 < m ∧ ¬ m ∣ n.centralBinom}
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/ErdosProblems/731.lean#L34
