title: Explicit Reduction Theory for Rank-One Unitary Arithmetic Groups
field: mathematics
tier: prose
statement: |-
  Let $L=\mathbb Q(\sqrt{-d})$ with $d>0$ square-free, let

  $$G(\mathbb Q)=\{g\in\operatorname{SL}_3(L):g^*Jg=J\}$$

  be a $\mathbb Q$-rank-one unitary group, and let $\Gamma\leq G(\mathbb Q)$ be an arithmetic subgroup. Can one carry out explicit reduction theory for $\Gamma$?
