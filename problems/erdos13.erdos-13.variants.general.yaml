  module: FormalConjectures.ErdosProblems.«13»
  decl: Erdos13.erdos_13.variants.general
  statement: |-
    theorem erdos_13.variants.general : ∀ r : ℕ, ∃ C : ℝ, ∀ N : ℕ,
        ∀ A ⊆ Icc 1 N,
        (∀ a ∈ A, ∀ (b : Fin r → ℕ), (∀ i, b i ∈ A) → (∀ i, a < b i) →
          ¬ (a ∣ ∑ i, b i)) →
        (A.card : ℝ) ≤ (N : ℝ) / (r + 1) + C
