title: Post Correspondence and Matrix Commutators in Infinite Groups
field: mathematics
tier: prose
statement: Determine whether the Post correspondence problem is decidable for free groups, even in rank $2$, and for an infinite linear group $G$ such as $\operatorname{SL}(n,\mathbb{Z})$ or $\operatorname{GL}(n,\mathbb{Z})$, determine whether a given matrix $M\in G$ can be written as a commutator $M=[A,B]$ with $A,B\in G$.
