title: Fiber Genus of Rational Maps from Newton Hypersurfaces
field: mathematics
tier: prose
statement: Let $\Delta\subset\mathbb Z^n$ be a Newton polyhedron and $H$ a generic hypersurface with Newton polyhedron $\Delta$. For a dominant rational map $f:H\dashrightarrow\mathbb P^{n-2}$, determine the genus of the generic fiber $f^{-1}(x)$ for $x\in\mathbb P^{n-2}$.
