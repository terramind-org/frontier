title: Multiplicative Generation of Rational K-Theory
field: mathematics
tier: prose
statement: For $X$ smooth and proper over a field $F$ of characteristic $p$, is rational $K$-theory multiplicatively generated by $K_0(X)_{\mathbb Q}$ and Milnor $K$-theory of $F$; equivalently, what is the kernel of the surjection $CH^n(X)_{\mathbb Q}\otimes K^M_{i-n}(F)_{\mathbb Q}\twoheadrightarrow H_M^{i+n}(X,\mathbb Q(n))$?
