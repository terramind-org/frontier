title: "Dar's conjecture: homogeneous repair and Cartesian-product closure"
field: mathematics
tier: prose
statement: |-
  **Dar's conjecture.** Let \(\mu(K,L)\) is defined by
  \[
  \mu(K,L)=\max_{x\in\mathbb R^n}|K\cap(x+L)|.
  \]
  Then for convex bodies \(K,L\subset\mathbb R^n\),
  \[
  |K+L|^{1/n}\geq \mu(K,L)+
  \frac{|K|^{1/n}|L|^{1/n}}{\mu(K,L)}. \tag{AIM}
  \]
