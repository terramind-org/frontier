title: "Erdős Problem #1182"
field: mathematics
tier: prose
statement: Let $R(H,G)$ denote the two-colour Ramsey number. For each $n$, define $f(n)$ as the greatest edge count of a connected $n$-vertex graph $G$ satisfying $R(K_3,G)=2n-1$. Define $F(n)$ as the greatest threshold such that every connected $n$-vertex graph with at most $F(n)$ edges satisfies this equality. Determine the asymptotic sizes of $f(n)$ and $F(n)$. The original questions include whether $F(n)/n\to\infty$.
