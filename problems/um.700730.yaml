title: Kourovka Notebook Problem 11.37
field: mathematics
tier: prose
statement: |-
  a) Can the free Burnside
  group $ B(m,n)$, for any $m$ and $ n$, be given by defining relations
  of the form $v^n=1$ such that for any natural divisor $d$ of $n$
  distinct from $n$ the element $v^d$ is not trivial in $B(m,n)$? This
  is true for odd $n \geq 665$, and for all
  $n\geq 2^{48}$ divisible by
  $2^9$.

  [Archived solved part(s) of 11.37:]
  b) Can the free Burnside group $ B(m,n)$, for
  any $m$ and $ n=2^l \gg 1$, be given by defining relations of the
  form $v^n=1$ such that for any natural divisor $d$ of $n$ distinct
  from $n$ the element $v^d$ is not trivial in $B(m,n)$?
