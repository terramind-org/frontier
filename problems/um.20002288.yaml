title: A generic-section obstruction for defining the constants in Q(t)
field: mathematics
tier: prose
statement: "**Question 4 (Pheidas).** Is \\(\\mathbb Q\\) existentially definable inside \\(\\mathbb Q(t)\\), in the language of rings expanded by a constant symbol naming \\(t\\)? It is known to be first-order definable, even without naming \\(t\\). Using elliptic curves, one can easily existentially define dense subsets of \\(\\mathbb Q\\)."
