title: Kourovka Notebook Problem 19.77
field: mathematics
tier: prose
statement: |-
  *The Stable Small Cancellation Conjecture*: If $ F$ is a free group of rank $r\geq 2$, then, for any fixed $n > 0$, there exists a generic subset $S$ of $F^n$ such that,
  for any automorphism $\phi$ of $F$, the set $\phi(S)$ satisfies the small cancellation condition $C'(1/6)$.
