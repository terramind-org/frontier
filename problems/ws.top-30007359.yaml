statement: |-
  \section*{Critical square-lattice FK interfaces below random-cluster weight one}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every fixed $q\in (0,1)$, do square-lattice FK Dobrushin interfaces at the self-dual critical edge parameter converge, as unparametrized ordered curves in smooth marked Jordan domains, to chordal SLE with $\kappa =4\pi /arccos(-\operatorname{sqrt}(q)/2)$?
  \subsection{Short English statement}
  For every fixed $q\in (0,1)$, do square-lattice FK Dobrushin interfaces at the self-dual critical edge parameter converge, as unparametrized ordered curves in smooth marked Jordan domains, to chordal SLE with $\kappa =4\pi /arccos(-\operatorname{sqrt}(q)/2)$?
