id: oeisa227923.conjecture-3
title: Representations using Sophie Germain primes and twin prime pairs (conjecture_3)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii), cousin prime variant: Any integer $n > 1$ can be written as $x + y$
  ($x, y > 0$) such that $6x - 1$ is a Sophie Germain prime and $\{6y + 1, 6y + 5\}$ is a
  cousin prime pair.
