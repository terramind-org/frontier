title: Galois-moving point-Hilbert components via constant-field transfer
field: mathematics
tier: prose
statement: |-
  **Problem 6.** (1) Give an explicit example (or show it does not happen) of a geometrically irreducible component of \(\operatorname{Hilb}^{d}(\mathbb A^{n})\), which is not fixed under the action of \(\operatorname{Gal}(\overline{\mathbb Q}/\mathbb Q)\).
  (2) Same question for the Hilbert schemes of curves in \(\mathbb P^{3}\).
