id: um.30003256
title: Definability in Automata-Presentable Ring Expansions
field: mathematics
tier: prose
statement: |-
  Let $R$ be a Euclidean ring with Euclidean function $\delta$, let $\preccurlyeq$ be the preorder induced by $\delta$, and for a noninvertible $r\in R$ let $V_r$ denote the highest power of $r$ dividing an element and $\mathbin{\cdot_r}$ the multiplication relation restricted according to powers of $r$. For multiplicatively independent noninvertible elements $r,s\in R$, characterize the subsets of $R$ definable in both $(R,+,-,0,\preccurlyeq,V_r,\mathbin{\cdot_r})$ and $(R,+,-,0,\preccurlyeq,V_s,\mathbin{\cdot_s})$. Separately, let
  $$
  \mathcal F=(\mathbb F_p[[X]],+,0,V_X,\lambda_X,\prec,(\mathbin{\cdot_C})_{C\in\mathbb F_q[X]})
  $$
  and let $\mathcal F_0$ be its substructure of power series algebraic over $\mathbb F_p(X)$. Is the theory of $\mathcal F_0$ decidable?
