title: Holomorphic Symplectic Geometry — Conjecture 11
field: mathematics
tier: prose
statement: |-
  \[X=\sd_{s\ \mathrm{ even} }X_s \quad\hbox{where }\ X_s :=\{x\in X\ |\ \operatorname{rk} \tau (x)=s\}\ .
  \]

  The following conjecture is due to Bondal ([Bd], see also [P]):

  If $X$ is Fano and $s$ even, $X_{\leq s}:=\sd_{k\leq s}X_k$ contains a component of dimension $>s$.
