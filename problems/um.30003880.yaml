title: Parametrization of Supersingular Cohomology Modules
field: mathematics
tier: prose
statement: Let $G = \mathrm{GL}_n(\mathbb{Q}_p)$ (or a reductive $p$-adic group), let $B_s^b$ be a Deligne--Lusztig-type or Bruhat--Tits stratum in the $p$-adic period domain, and let $H_s^{(1)}$ be the pro-$p$ Iwahori--Hecke algebra at a supersingular parameter $s$. Can the supersingular $H_s^{(1)}$-modules appearing in the $\bmod\, p$ cohomology of $B_s^b$ be canonically parametrized by the central parameter $t$?
