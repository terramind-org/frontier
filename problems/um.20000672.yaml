title: Moving-cutoff smooth-number correlations and a weighted mean-value consequence
field: mathematics
tier: prose
statement: |-
  What can we say about correlations with itself of
  \[
  \mathbb{1}_{p^+(n)\leq n^\delta},
  \]
  with \(\delta\to0\)? Here \(p^+(n):=\max\{p:p\mid n\}\). Even upper bounds would be welcome. This kind of result would imply sharp mean values for Dirichlet polynomials supported on smooth numbers.
