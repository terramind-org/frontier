title: Kourovka Notebook Problem 16.20
field: mathematics
tier: prose
statement: |-
  Let $M$ be a quasivariety of groups. The *dominion*
  $\mathrm{dom}^M_A(H)$ of a subgroup $H$ of a group $A$ (in
  $M$) is the set of all elements $a\in A$ such that for any two
  homomorphisms $f,g:A\rightarrow B\in M$, if $f,g$ coincide on $H$,
  then $f(a)=g(a)$. Suppose that the set $\{ \mathrm{dom}^N_A(H)\mid N
  \mbox{ is a quasivariety}, N\subseteq M\} $ forms a lattice with
  respect to set-theoretic inclusion. Can this lattice be modular
  and non-distributive?
