id: um.30003759
title: Uniform Minimal Control Time for Advection–Diffusion
field: mathematics
tier: prose
statement: |-
  Fix $L,T>0$ and $M\neq0$. For $0<\varepsilon\ll1$, consider

  $$\partial_t y^\varepsilon-\varepsilon\partial_{xx}y^\varepsilon+M\partial_xy^\varepsilon=0$$

  on $(0,L)\times(0,T)$, with $y^\varepsilon(0,t)=v^\varepsilon(t)$, $y^\varepsilon(L,t)=0$, and $y^\varepsilon(\cdot,0)=y_0^\varepsilon\in H^{-1}(0,L)$. Determine the minimal time $T_M$ for which null controls $v^\varepsilon\in L^2(0,T)$ can be chosen with cost uniformly bounded as $\varepsilon\to0$.
