title: Kourovka Notebook Problem 15.36
field: mathematics
tier: prose
statement: |-
  For a class $M$ of groups let
  $L(M)$ be the class of groups $G$ such that the normal subgroup
  $\left< a^G\right>$ generated by an element
  $a$ belongs to $M$ for any $a\in G$. Is it true that the class
  $L(M)$ is finitely axiomatizable if $M$ is the quasivariety
  generated by a finite group?
