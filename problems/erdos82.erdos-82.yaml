lean:
  module: FormalConjectures.ErdosProblems.«82»
  decl: Erdos82.erdos_82
  statement: "theorem erdos_82 : Tendsto (fun n => F n / Real.log n) atTop atTop"
  context:
    - open Erdos82
    - open SimpleGraph Filter
    - "variable {V : Type*} [Fintype V]"
  definitions:
    - name: Erdos82.F
      kind: def
      text: |-
        /--
        $F(n)$ is the maximal integer such that every graph on $n$ vertices
        contains a regular induced subgraph on at least $F(n)$ vertices.
        -/
        noncomputable def F (n : ℕ) : ℕ :=
          sSup {k | ∀ (G : SimpleGraph (Fin n)), ∃ S : Subgraph G,
            IsRegularInduced S ∧ k ≤ S.verts.ncard}
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/82.lean#L41
