lean:
  module: FormalConjectures.GreensOpenProblems.«17»
  decl: Green17.green_17.parts.ii
  statement: |-
    theorem green_17.parts.ii :
        ∀ α : ℝ, 0 < α → ∃ c : ℝ, 0 < c ∧ ∀ᶠ n : ℕ in atTop, ∀ A : Finset (𝔽₃ n),
          α * 3 ^ n ≤ (A.card : ℝ) → c * 6 ^ n ≤ (numRestrictedAPs A : ℝ)
  context:
    - open Green17
    - open Green17.green_17
    - open Green17.green_17.parts
    - open Filter Asymptotics
  definitions:
    - name: Green17.numRestrictedAPs
      kind: def
      text: |-
        /--
        `numRestrictedAPs A` is the number of pairs $(x, d)$ with $x \in \mathbb{F}_3^n$ and
        $d \in \{0, 1\}^n \setminus \{0\}$ such that $x, x + d, x + 2d \in A$. There are
        $3^n (2^n - 1)$ such pairs in all, which is about $6^n$.
        -/
        noncomputable def numRestrictedAPs {n : ℕ} (A : Finset (𝔽₃ n)) : ℕ :=
          Nat.card {p : 𝔽₃ n × 𝔽₃ n // IsRestrictedAP A p.1 p.2}
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/GreensOpenProblems/17.lean#L53
