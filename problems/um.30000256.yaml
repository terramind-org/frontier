title: Dimensions of Energy-Concentration Sets
field: mathematics
tier: prose
statement: For positive solutions $u_\varepsilon$ of $\varepsilon^2\Delta u-u+u^p=0$ in a bounded smooth domain $\Omega$, with $\partial u/\partial\nu=0$ on $\partial\Omega$ and $E_\varepsilon[u_\varepsilon]\leq C\varepsilon^{N-m}$, must the energy-concentration set have dimension $m$?
