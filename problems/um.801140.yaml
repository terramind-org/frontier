title: Ultraproduct II_1 Factors — Problem 42
field: mathematics
tier: prose
statement: |-
  The above ``*ultrapower-bicommutant* problem'' is credited to S. Popa, see [Popaindep].

  If $M$ is a II$_1$ factor, then does $\mathbb{M}_2(\mathbb{C}) \otimes M$ always embed into $M^\mathcal{U}$? (Note this is immediate if $M$ is Connes embeddable.)
