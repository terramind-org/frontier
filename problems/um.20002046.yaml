title: The Branson cocycle and its Weyl-scale obstruction
field: mathematics
tier: prose
statement: |-
  Do Weyl structures help in this regard? Tom Branson has suggested that, for two metrics \(g\) and \(\widehat g=\Omega^2g\) in the same conformal class on a compact manifold \(M\), one should consider
  \[
  \mathcal H[\widehat g,g]=\int_M (\log\Omega)(\widehat Q+Q).
  \]
  The cocycle identity
  \[
  \mathcal H[\widehat{\widehat g},\widehat g]
  +\mathcal H[\widehat g,g]
  =\mathcal H[\widehat{\widehat g},g]
  \]
  is easily seen to be equivalent to self-adjointness of the GJMS operator \(P\).
