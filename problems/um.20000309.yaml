id: um.20000309
title: A finite inverse criterion for surface mld divisors
field: mathematics
tier: prose
statement: |-
  (1) What kind of exceptional divisor over \(X\) (with mild singularities)
  gives a minimal log discrepancy which is nonnegative for some \((X,D)\)?
  (2) What about over a surface \(X\)? Let \(E\) be an exceptional divisor of
  the minimal resolution \(X'\to X\) of \(X\). Does \(E\) compute some
  \(\operatorname{mld}\geq 0\)?
