title: Randomstrasse101 Open Problems (2024) — Conjecture 4 (Density threshold for Global Synchrony)
field: mathematics
tier: prose
statement: |-
  Another elusive question about global synchrony is the ``extremal combinatorics'' version of the question.

  For any $\varepsilon>0$, there exists $n>0$ and a graph $G$ on $n$ nodes such that the minimum degree of $G$ is at least $\left(\frac34-\varepsilon\right)n$ and $G$ is not globally synchronizing.
