title: Exceptional-Unit Bounds by Algebraic Degree
field: mathematics
tier: prose
statement: Let $E_0(\alpha)$ be the largest $n$ such that $\alpha^j-1$ is a unit for every $1\leq j\leq n$, or $0$ if $\alpha-1$ is not a unit, and let $e(d)=\max E_0(\alpha)$ over algebraic integers $\alpha$ of degree $d$. Is $e(d)<d$ for every $d\geq7$?
