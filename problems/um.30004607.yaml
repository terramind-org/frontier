title: Homotopy Generators from Elliptic Artin Noncancellativity
field: mathematics
tier: prose
statement: |-
  Let $A(R,G)^+$ be the elliptic Artin monoid and let $S_{\mathrm{ell}}\setminus D_{\mathrm{ell}}$ be its elliptic discriminant complement. For pairs of noncancellative quadruples $(a,b,c,d)$ and $(a',b,c,d')$, do all difference classes
  $$
  a\backslash R(abd,acd)/d-a'\backslash R(a'bd',a'cd')/d'
  $$
  generate $\pi_2(S_{\mathrm{ell}}\setminus D_{\mathrm{ell}},*)$?
