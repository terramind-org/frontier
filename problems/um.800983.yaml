title: Open Problems and Questions about Geodesics — Question 64
field: mathematics
tier: prose
statement: |-
  *Suppose a closed manifold $(M,g)$ admits a non-zero
  $(1,1)$-tensor field that is self-adjoint with respect to $g$, parallel and nilpotent. Does this manifold or its double cover admit a non-zero light-like parallel vector field?*
