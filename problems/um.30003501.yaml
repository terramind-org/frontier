title: Sobolev Sheaves on Subanalytic Sites
field: mathematics
tier: prose
statement: Does there exist a Sobolev sheaf complex $H^s$ on the subanalytic Grothendieck topology of a manifold $M$ such that, on every relatively compact Lipschitz open set $U$, $H^s(U)$ is concentrated in degree zero and equals the Sobolev space $H^s(U)$, particularly for $s\geq1/2$?
