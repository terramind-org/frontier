title: Oda and Sturmfels Conjectures for Smooth Toric Varieties
field: mathematics
tier: prose
statement: Let $X$ be a smooth projective toric variety, $L$ ample, and $L'$ nef. Is $H^0(X,L)\otimes H^0(X,L')\to H^0(X,L\otimes L')$ always surjective? If the section ring $R(X,L)$ is normal, is its ideal of relations generated in degree two?
