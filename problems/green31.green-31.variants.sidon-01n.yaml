  module: FormalConjectures.GreensOpenProblems.«31»
  decl: Green31.green_31.variants.sidon_01n
  statement: |-
    theorem green_31.variants.sidon_01n :
        ∃ S : (n : ℕ) → Finset (𝔽₂ n),
          (∀ n, IsBinarySidon (S n : Set (𝔽₂ n))) ∧
          ∀ᶠ n in atTop, ((2 : ℝ) ^ n) ^ (0.51 : ℝ) ≤ (S n).card
