title: "Ben Green's Open Problem 31 (variant: sidon_01n)"
field: mathematics
tier: proof
statement: |-
  Another very nice old problem is whether there is a Sidon subset of $\{0, 1\}^n$ of size $N^{0.51}$,
  where $N = 2^n$ [Gr24].
