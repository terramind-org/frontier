title: Gauge integrals, cube sections, and profile universality
field: mathematics
tier: prose
statement: |-
  Take $a_1, \dots, a_n \in \mathbb R$ and $v_1, \dots, v_n \in \mathbb R^n$ and define
  $$
  f(t)=\int_{\mathbb R^k}e^{-\max_{1\leq i\leq n}e^{a_it}|\left |}\,dx.
  $$
  Then $f(t)$ is log-concave is equivalent to log-Brunn-Minkowski. What is possible $f$ that we can use for Brunn-Minkowski?
