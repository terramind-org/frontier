title: Selection Principles in Mathematics — Problem 52 ([BrownCox83])
field: mathematics
tier: prose
statement: |-
  $X\subseteq\mathbb{R}$ is a *$\nu$-set* if for each $Y\subseteq X$ which is nowhere dense in $X$,
  $Y$ is countable (i.e., $X$ is Luzin relative to itself).
  Every continuous image of a $\nu$-set has the property
  assumed in the following problem.

  Assume that $X\subseteq\mathbb{R}$, and for each $Y\subseteq X$, $Y$ is concentrated on
  a countable subset of $Y$. Does it follow that $X$ is a continuous image of
  a $\nu$-set?
