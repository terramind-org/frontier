title: Polygon Development and Higher-Dimensional Discrete Integrability
field: mathematics
tier: prose
statement: Given a simple piecewise-geodesic curve on $S^2$, when does its planar development with unchanged lengths and angles avoid self-intersection, and what happens for star-shaped polygons? Do discrete integrable systems exist in dimensions at least four, with consistent restrictions to every $n$-face of an $(n+1)$-cube?
