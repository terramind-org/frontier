title: Foliations and Diffeomorphism Groups — Question 47
field: mathematics
tier: prose
statement: |-
  Related to the Anosov-like action conjecture, Baik-Wu-Zhao [baik2024reconstruction] recently defined a flowable group action on the bifoliated plane, and showed that if a group admits a flowable orientation-preserving action on a bifoliated plane, the group is the fundamental group of a 3-manifold with a pseudo-Anosov flow and the bifoliated plane is the orbit space of the flow. The set of axioms is slightly different, but the most important condition in both settings is the hyperbolicity (topologically expanding one leaf and contracting another leaf when two leaves cross).

  Is every Anosov-like action flowable? If not, what are counterexamples and what is the precise difference between two actions?
