statement: For $d$-dimensional lattice polytopes $P_1,\ldots,P_d\subset\mathbb R^d$ with normalized mixed volume $V(P_1,\ldots,P_d)=m$, is the sharp upper bound for the normalized volume of $P_1+\cdots+P_d$ equal to $(m+d-1)^d$?
