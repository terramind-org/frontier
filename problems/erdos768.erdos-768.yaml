  module: FormalConjectures.ErdosProblems.«768»
  decl: Erdos768.erdos_768
  statement: |-
    theorem erdos_768 : ∃ c > 0, ∃ error : ℕ → ℝ,
        error =o[atTop] (fun _ ↦ (1 : ℝ)) ∧ ∀ᶠ N in atTop,
          erdos768Density N = Real.exp (-(c + error N) * erdos768Scale N)
  context:
    - open Erdos768
    - open Filter Asymptotics
  definitions:
    - name: Erdos768.erdos768Density
      kind: def
      text: |-
        /-- The normalized density $\lvert A \cap [1,N]\rvert/N$. -/
        noncomputable def erdos768Density (N : ℕ) : ℝ :=
          (erdos768Count N : ℝ) / (N : ℝ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/768.lean#L64
    - name: Erdos768.erdos768Scale
      kind: def
      text: |-
        /-- The scale $\sqrt{\log N}\log\log N$ appearing in the conjecture. -/
        noncomputable def erdos768Scale (N : ℕ) : ℝ :=
          Real.sqrt (Real.log (N : ℝ)) * Real.log (Real.log (N : ℝ))
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/768.lean#L68
