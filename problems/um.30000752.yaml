title: Linear Independence Across Tschakaloff Parameters
field: mathematics
tier: prose
statement: For the Tschakaloff function $T_q(z)=\sum_{\nu\geq0}q^{-\nu(\nu+1)/2}z^\nu$, where $|q|>1$ and $z$ is rational, prove that the values $T_q(z)$ corresponding to distinct admissible parameters $q$ are linearly independent over $\mathbb{Q}$.
