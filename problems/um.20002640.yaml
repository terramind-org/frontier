title: A localization-and-stability route to KPZ fixed-point attraction
field: mathematics
tier: prose
statement: |-
  Prove that the fixed point is attractive (i.e., universal in some class of models).

  This is problem 11.8 in the section “Big picture questions” from the AIM workshop *The Kardar-Parisi-Zhang equation and universality class*. The record is sparse: it does not name the fixed point, a scaling, a model class, an initial-data space, or a topology.

  A model-dependent height function \(H\) should first be centered, tilted, and put under \(1{:}2{:}3\) scaling. Schematically, with nonuniversal constants suppressed,

  \[
  h_N(t,x)=N^{-1/3}\bigl(H(Nt,vNt+N^{2/3}x)-cNt-\ell N^{2/3}x\bigr). \]

  The constants and even the sign convention depend on the model. A precise attraction statement must specify them.
