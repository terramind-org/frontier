title: Spectrum of Boundary Problems with Noncompact Multiplier Weights
field: mathematics
tier: prose
statement: |-
  Let $P$ be an $n$-term self-similar function of zero spectral order such that its generalized derivative $P'$ is a noncompact Sobolev multiplier. For the singular Sturm–Liouville problem

  $$-y''=\lambda P'y,\qquad y(0)=y(1)=0,$$

  does the spectrum consist of $n-1$ possibly overlapping intervals of continuous spectrum, with at most one eigenvalue in each gap and at most $n-2$ eigenvalues in total?
