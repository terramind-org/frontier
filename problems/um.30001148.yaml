title: Local–Global Principles for Homogeneous Spaces over Semi-Global Fields
field: mathematics
tier: prose
statement: Let $K$ be a complete discretely valued field with residue field $k$, let $F$ be the function field of a curve over $K$, and let $F_v$ be the completion at a discrete valuation $v$ of $F$. If an $F$-variety $Y$ is a homogeneous space of a connected linear $F$-group and $Y(F_v)\neq\varnothing$ for every $v$, must $Y(F)\neq\varnothing$?
