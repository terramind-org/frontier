statement: Let $f \colon \{-1,1\}^n \to \mathbb{R}^{\geq 0}$ have $\mathbb{E}[f] = 1$. Fix any $0 < \rho < 1$. Then $\operatorname{Pr}[\mathbb{T}_\rho f \geq t] < o(1/t)$.
