title: Open Problems on Ind-Groups of Automorphisms
field: mathematics
tier: prose
statement: Let $X$ be an affine variety. Determine whether the following assertions hold. First, if $G\subseteq\operatorname{Aut}(X)$ is connected and closed and $N\triangleleft G$ is proper and closed, then $\operatorname{Lie}(N)\subsetneq\operatorname{Lie}(G)$. Second, if closed subgroups $H,G\subseteq\operatorname{Aut}(X)$ satisfy that $G$ is connected, $\operatorname{Lie}(G)\subseteq\operatorname{Lie}(H)$, and every element of $G$ is algebraic, then $G\subseteq H$. Third, a closed subgroup consisting of algebraic elements, and more generally the closure of any such subgroup, is nested. Fourth, if $\operatorname{Aut}(X)^\circ$ is nontrivial, it contains a positive-dimensional algebraic subgroup. Fifth, the normalizer of the tame subgroup $\langle\operatorname{SAff}_n,\operatorname{SJonq}_n\rangle$ is dense in $\operatorname{SAut}(\mathbb A^n)$.
