id: um.800388
title: Open Problems in Arithmetic Dynamics — Conjecture 11
field: mathematics
tier: prose
statement: |-
  [Dynamical Mordell--Lang Conjecture:
  Bell, 2006, [MR2225492];
  Denis, 1994, [MR1259107];
  Ghioca--Tucker, 2009, [arxiv0805.1560]]

  Let $X/\mathbb{C}$ be a quasi-projective variety, let $f:X\to X$ be a morphism,
  let $P\in X$ be a point, and let $Y\subseteq X$ be a subvariety of $X$.
  Then
  \[
  \{ n\ge 0 : f^n(P)\in Y \}
  \]
  is a finite union of arithmetic progressions.
