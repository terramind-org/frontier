title: Randomstrasse101 Open Problems (2024) — Conjecture 2 (Globally Synchronizing Regular Graphs)
field: mathematics
tier: prose
statement: |-
  Abdalla, Bandeira, Kassabov, Souza, Strogatz, and Townsend [ABKSST-SynchExpander] recently showed that a random Erd\mathbb{H}{o}s-R\'enyi graph is globally synchronizing above the connectivity threshold with high probability (you can also see the Quanta article covering this at https://www.quantamagazine.org/new-proof-shows-that-expander-graphs-synchronize-20230724/). The same paper also shows that a uniform $d$-regular graph is globally synchronizing with high probability for $d\geq 600$, but it leaves open the following question.

  A uniform random $3$-regular graph is globally synchronizing with high probability (probability going to $1$ as $n\to\infty$).
