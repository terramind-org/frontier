lean:
  module: FormalConjectures.OEIS.«64313»
  decl: OeisA64313.conjecture
  statement: |-
    theorem conjecture (n : ℕ) (hn : 3 ≤ n) :
        a n = (Int.floor ((n : ℝ) ^ 2 / (4 * Real.pi) - Real.pi / 12)).toNat
  context:
    - open OeisA64313
  definitions:
    - name: OeisA64313.a
      kind: def
      text: |-
        /-- Integer part of area of a regular polygon with $n$ sides each of length 1. -/
        noncomputable def a (n : ℕ) : ℕ :=
          (Int.floor (area n)).toNat
