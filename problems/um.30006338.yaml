title: Mixed-Chromatic Cohomology Beyond the Extreme Case
field: mathematics
tier: prose
statement: In chromatic homotopy theory, let $L_{K(n)} S$ be the $K(n)$-local sphere spectrum at height $n$ and prime $p$. Extend the mixed-chromatic / prismatic cohomology comparison isomorphism for the rationalization of the $K(n)$-local sphere from chromatic level $t = n - 1$ to arbitrary $t$, and remove the completed-perfection term from the $t = n - 1$ comparison isomorphism.
