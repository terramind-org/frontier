title: Kourovka Notebook Problem 21.123
field: mathematics
tier: prose
statement: Is it true that the extension of the A. Agrachev--R. Gamkrelidze construction of groups from pre-Lie rings suggested in Definition 66 produces groups from pre-Lie rings? If this extended construction does give a group, then it also gives a brace, and so an affirmative answer to this question would have consequences for the theory of set-theoretic solutions of the Yang--Baxter equation and for the theory of braces.
