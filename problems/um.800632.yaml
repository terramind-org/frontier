title: Selection Principles Milestone Problems — Problem 4 ([pawlikowskireclaw], [CBC, Problem 45], [ideals])
field: mathematics
tier: prose
statement: |-
  Borel's Conjecture, which was proved to be consistent by Laver,
  implies that each set of reals satisfying $\mathsf{S}_1(\mathcal{O},\mathcal{O})$ (and the classes below it) is
  countable.
  From our point of view this means that there do not exist ZFC examples
  of sets satisfying $\mathsf{S}_1(\mathcal{O},\mathcal{O})$.
  A set of reals $X$ is a *$\sigma$-set* if each $G_\delta$ set in $X$
  is also an $F_\sigma$ set in $X$.
  In [CBC] it is proved that every element of $\mathsf{S}_1(\mathcal{B}_\Gamma,\mathcal{B}_\Gamma)$
  is a $\sigma$-set.
  According to a result of Miller [Mil79Len],
  it is consistent that every $\sigma$-set of
  real numbers is countable. Thus, there do not exist uncountable
  ZFC examples satisfying $\mathsf{S}_1(\mathcal{B}_\Gamma,\mathcal{B}_\Gamma)$.
  The situation for the other classes, though addressed by top
  experts, remains open. In particular, we have the following.

  Does there exist (in ZFC) an uncountable set of reals satisfying $\mathsf{S}_1(\mathcal{B}_\Gamma,\mathcal{B})$?
