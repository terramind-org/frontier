title: Affine zero obstructions for powers that are squared norms
field: mathematics
tier: prose
statement: |-
  Find necessary and sufficient conditions on a real-valued polynomial
  \(R(z,\bar z)\) such that there exists \(N\) with
  \[
  R(z,\bar z)^N=\sum_{j=1}^{k}|p_j(z)|^2.
  \]
