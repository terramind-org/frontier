title: Bilax Monoidal Structures for Stable Morita Equivalences
field: mathematics
tier: prose
statement: For a stable equivalence of Morita type $(M,N,\varphi,\psi)$ between algebras $A$ and $B$, can the functor $M\otimes_B(-)\otimes_B N:\operatorname{Mod}(B^{\mathrm{ev}})\to\operatorname{Mod}(A^{\mathrm{ev}})$ be made bilax monoidal with split-surjective unit map $M\otimes_B N\twoheadrightarrow A\oplus P\to A$?
