id: um.30003394
title: Explicit Low-Discrepancy Sets and Efficient Dispersion
field: mathematics
tier: prose
statement: |-
  Let
  $$
  \operatorname{disc}^*(n,d)=\inf_{|P|=n}\sup_{x\in[0,1]^d}\left|\frac{|P\cap[0,x]|}{n}-x_1\cdots x_d\right|.
  $$
  Can the gap between the bounds $c\,d/n\leq\operatorname{disc}^*(n,d)\leq C\sqrt{d/n}$ be closed? Can point sets satisfying the upper bound be constructed explicitly, or with less randomness than independent uniform sampling? For dispersion, what is the optimal order of the largest empty axis-parallel box, and what is the complexity of finding one?
