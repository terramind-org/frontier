title: 10 Lectures and 42 Open Problems — Positive PCA tightness
field: mathematics
tier: prose
statement: |-
  In **Positive Principal Component Analysis (PCA)**, the goal is $\max_{x\succ 0,\|x\|=1}x^TWx$ for a symmetric matrix $W$ (equivalently, computing the top eigenvector with a **nonnegativity/sign constraint**). Its **Semidefinite Programming (SDP)** relaxation is
  $$ \max_{X\succeq0,\,X_{ii}=1}\langle W,X\rangle. $$
  **Is this SDP tight with high probability when $W$ is a (Gaussian) Wigner matrix with a planted low-rank (positive) spike / perturbation** — i.e., does the SDP optimum recover the planted positive spike/top eigenvector for signals above a threshold?
