title: Kourovka Notebook Problem 17.49
field: mathematics
tier: prose
statement: |-
  Is it consistent with ZFC that every
  non-discrete topological group contains a nonempty nowhere dense
  subset without isolated points? Under Martin's Axiom, there are
  countable non-discrete topological groups in which each nonempty
  nowhere dense subset has an isolated point.
