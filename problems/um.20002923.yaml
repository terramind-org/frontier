statement: "**Recovered question (hyperplane-section reading).** Can convex hypersurface theory give a proof that if \\((X^{2n},\\omega)\\) is closed and \\([\\omega/2\\pi]\\) is integral, then, for all sufficiently large integers \\(k\\), there is a symplectic hypersurface \\(W\\subset X\\) Poincaré dual to \\(k[\\omega/2\\pi]\\), with the connectivity and Weinstein-complement properties of a Donaldson--Giroux hyperplane section?"
