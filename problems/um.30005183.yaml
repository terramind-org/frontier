title: Exotic Four-Manifolds and the Smooth Poincaré Conjecture
field: mathematics
tier: prose
statement: Decide whether $S^4$ has an exotic smooth structure, whether $S^1\times S^3$ or a definite four-manifold can be exotic, and whether every genus $g$ has a unique smooth surface $\Sigma\subset S^4$ whose complement satisfies $\pi_1(S^4\setminus\Sigma)\cong\mathbb Z$.
