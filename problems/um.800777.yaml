title: Positively Curved Projective Varieties — Conjecture 12
field: mathematics
tier: prose
statement: |-
  The MRC fibration is defined only by $X$,
  and thus it does not reflect information on the boundary $\Delta$.
  On the other hand,
  the slope rationally connected quotient (sRC quotient for short),
  introduced in [Cam16],
  gives a generalization of MRC fibrations reflecting the boundary $\Delta$ (see [Cam04, Cam16]).
  The following conjecture concerns a structure theorem for sRC quotients.
  This conjecture was solved when $(X, \Delta)$ is a log smooth surface in [CCM19, Theorem 1.6],
  but it is still open in the general case.

  [{[CCM19, Conjecture 1.5]}]

  Let $(X, \Delta)$ be a klt pair such that $X$ is smooth and $- (K_X +\Delta)$ is nef.
  Then there exists an orbifold morphism $\rho : (X, \Delta)\rightarrow (R, \Delta_R)$ with the following properties$:$

  $\bullet$ $(R, \Delta_R)$ is a klt pair such that $R$ is smooth and $c_1(K_R+ \Delta_R)=0$.

  $\bullet$ General orbifold fibers $(X_r, \Delta_r )$ are slope rationally connected.

  $\bullet$ The fibration is locally trivial with respect to pairs, namely, for any small open set $U \subset R$, we have the isomorphism over $U \subset Y$$:$
  $$
  (\rho^{-1} (U), \Delta)\cong (U, \Delta_R |_U) \times (X_r, \Delta_{X_r}),
  $$
  where $X_r$ is a general fiber of $\rho$.
