title: Normal Complements in Integral Group-Ring Units
field: mathematics
tier: prose
statement: For a finite nilpotent group $G$, does $G$ have a normal complement in the normalized unit group $U_1(\mathbb Z[G])$? If so, can the complement be chosen torsion-free?
