title: Rotation Domains and Solenoid Models in Higher-Dimensional Dynamics
field: mathematics
tier: prose
statement: Does there exist a Siegel ball whose boundary is homeomorphic to the 3-sphere? Does there exist a rotation domain analytically equivalent to the product of an annulus and a complex plane? What does the domain of convergence of the linearizing map for a two-dimensional rotation domain look like? For a complex Hénon map with connected Julia set $J$, when is the natural map from $J^-\setminus K$ to the complex solenoid one-to-one; when is $J$ a quotient of a solenoid, and which equivalence relations occur? Find a good characterization of connectedness of the Julia set for Hénon-like maps.
