title: Morton–Silverman Uniform Boundedness Conjecture
field: mathematics
tier: prose
statement: |-
  \section*{\texorpdfstring{Morton–Silverman Uniform Boundedness Conjecture}{Morton–Silverman Uniform Boundedness Conjecture}}\label{statement}
  \subsection{Definitions and mathematical statement}
  A degree-$d$ morphism $\phi:{\mathbb{P}}^N_K\to{\mathbb{P}}^N_K$ is represented by homogeneous degree-$d$ forms with no common projective zero. A point $P$ is preperiodic when $\{\phi^m(P):m\ge0\}$ is finite, equivalently when $\phi^a(P)=\phi^b(P)$ for some $0\le a<b$. For fixed $N\ge1,d\ge2,D\ge1$, the conjecture is
  \[
   \exists C(N,d,D)<\infty\quad
   \#\operatorname{PrePer}(\phi,K)\le C(N,d,D)
  \]
  for all number fields of degree at most $D$ and every such morphism. The bound cannot depend on the coefficients of $\phi$ or the individual field. Rational maps with points of indeterminacy are outside the selected scope.
  \par\smallskip\textit{Formulation and concept references:} \href{https://arxiv.org/pdf/1806.04980v2}{[S1]}.

  \subsection{Short English statement}
  Are the numbers of rational preperiodic points uniformly bounded when projective dimension, map degree, and number-field degree are fixed?
