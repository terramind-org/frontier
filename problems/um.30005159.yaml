statement: For each $d\geq4$, is $f_\star(\tau,\xi)=e^{-|\tau|}$ a global maximizer of the $p=2$ Fourier adjoint-restriction inequality on the one-sheeted cone $K_d^+=\{(\tau,\xi):\tau=|\xi|\}$?
