lean:
  module: FormalConjectures.ErdosProblems.«338»
  decl: Erdos338.erdos_338
  statement: |-
    theorem erdos_338 :
        ∀ A : Set ℕ, (∃ h, HasOrder A h) → ((∃ t, HasRestrictedOrder A t) ↔ erdos_338.answer A)
  context:
    - open Erdos338
    - open Filter
  definitions:
    - name: Erdos338.HasOrder
      kind: def
      text: |-
        /-- `HasOrder A h` means that $A$ is a basis of order $h$: every sufficiently large natural number
        is a sum of at most $h$ elements of $A$, with repetition allowed.

        The summands form a `Multiset`, so repetition is allowed. Allowing at most $h$ summands makes the
        notion independent of whether $0 \in A$. With exactly $h$ summands, as in
        `Set.IsAsymptoticAddBasisOfOrder`, this notion is `(insert 0 A).IsAsymptoticAddBasisOfOrder h`. -/
        def HasOrder (A : Set ℕ) (h : ℕ) : Prop :=
          ∀ᶠ m in atTop, ∃ S : Multiset ℕ, (∀ x ∈ S, x ∈ A) ∧ S.card ≤ h ∧ S.sum = m
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/338.lean#L46
    - name: Erdos338.HasRestrictedOrder
      kind: def
      text: |-
        /-- `HasRestrictedOrder A t` means that every sufficiently large natural number is a sum of at most
        $t$ distinct elements of $A$.

        The summands form a `Finset`, so they are distinct. A summand $0$ never helps, so the notion does
        not depend on whether $0 \in A$. -/
        def HasRestrictedOrder (A : Set ℕ) (t : ℕ) : Prop :=
          ∀ᶠ m in atTop, ∃ S : Finset ℕ, (∀ x ∈ S, x ∈ A) ∧ S.card ≤ t ∧ ∑ x ∈ S, x = m
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/338.lean#L55
    - name: Erdos338.erdos_338.answer
      kind: def
      text: "def erdos_338.answer : Set ℕ → Prop := sorry"
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/338.lean#L72
