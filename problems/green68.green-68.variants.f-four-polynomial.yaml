lean:
  module: FormalConjectures.GreensOpenProblems.«68»
  decl: Green68.green_68.variants.f_four_polynomial
  statement: |-
    theorem green_68.variants.f_four_polynomial :
        ∀ ε : ℝ, 0 < ε → ∃ C : ℝ, ∀ (p : ℕ) [Fact p.Prime],
          (maxNoThreeCollinear 4 p : ℝ) ≤ C * (p : ℝ) ^ (2 + ε)
  context:
    - open Green68
    - open Green68.green_68
    - open Green68.green_68.variants
  definitions:
    - name: Green68.maxNoThreeCollinear
      kind: def
      text: |-
        /--
        `maxNoThreeCollinear d p` is $f_d(p)$, the size of the largest subset of $\mathbb{F}_p^d$ with no
        three points on a line. The set of possible sizes is nonempty (it contains $0$) and bounded by
        $p^d$, so the supremum is the maximum.
        -/
        noncomputable def maxNoThreeCollinear (d p : ℕ) [Fact p.Prime] : ℕ :=
          sSup {k : ℕ | ∃ A : Finset (Fin d → ZMod p), A.card = k ∧ MeetsLinesInAtMost 2 A}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/GreensOpenProblems/68.lean#L52
