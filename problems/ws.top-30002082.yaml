  \section{Uniqueness of Tangent Flows in Mean Curvature Flow}\label{30002082}
  {\small UnsolvedMath ID 30002082 · Partial Differential Equations}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Do mean-curvature-flow singularities have unique tangent flows, and more generally can the full asymptotic-symmetry conjecture for finite-time geometric PDE singularities be proved?
  \par\smallskip\textit{Formulation references:} \sref{30002082}{1}, \sref{30002082}{2}.
  \subsection{Short English statement}
  Do mean-curvature-flow singularities have unique tangent flows, and more generally can the full asymptotic-symmetry conjecture for finite-time geometric PDE singularities be proved?
