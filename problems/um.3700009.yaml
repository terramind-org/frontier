title: Hypotheses for analytic invariant curves
field: mathematics
tier: prose
statement: Let $C$ be an analytic invariant curve of a rational function $f$, suppose $f:C\to C$ is not a homeomorphism, and assume $C$ contains a repelling fixed point, lies in $J(f)$, and contains neither critical points nor rational fixed points. A theorem concludes that either $f$ is a Lattès function or $C$ is algebraic. Which of these hypotheses can be removed?
