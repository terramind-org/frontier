title: Exact identities and rounding loss for induced directed paths
field: mathematics
tier: prose
statement: |-
  **Conjecture 6.32 (Thomassé).** If \(G\) is a loopless digon-free digraph, the maximum number of induced directed 2-edge paths is
  \[
  \frac{n^3}{15}+O(n^2).
  \]
