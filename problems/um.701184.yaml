title: Kourovka Notebook Problem 15.96
field: mathematics
tier: prose
statement: |-
  An automorphism $\varphi $ of a group $G$ is
  called a *splitting automorphism of order
  $n$* if $\varphi ^n=1$ and $xx^{\varphi}x^{\varphi
  ^{2}}\cdots x^{\varphi ^{n-1}}=1$ for any $x\in G$.

  a) Is it true that the derived length of a
  $d$-generated nilpotent $p $-group admitting a splitting
  automorphism of order $p^n$ is bounded by a function of $d$,
  $p$, and $n$? This is true for $n=1$, see Archive, 7.53.

  b) The same question for $p^n=4$.
