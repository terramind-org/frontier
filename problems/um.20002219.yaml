title: Schur-ratio minima on bounded interval boxes
field: mathematics
tier: prose
statement: |-
  It was recently shown that if $\lambda,\mu$ are $N$-tuples of positive integers, then the ratio of Schur polynomials $s_\lambda/s_\mu$, when evaluated at $N$ real variables with values in $(0,1]^N$ (the “log-negative orthant”), is minimized at $(1,\dots,1)$ if and only if $-\lambda$ weakly majorizes $-\mu$.

  The analogous statement, in which the minimum over the entire positive orthant $(0,\infty)^N$ is achieved at $(1,\dots,1)$, is equivalent to $\lambda$ majorizing $\mu$.

  What can one say these domains are replaced by $I^N$ for other intervals $I\subset(0,\infty)$?

  What can one say **when** these domains are replaced by $I^N$ for other intervals $I\subset(0,\infty)$?
