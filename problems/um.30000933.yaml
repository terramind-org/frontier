title: Stokes Eigenfunctions with Constant Boundary Pressure
field: mathematics
tier: prose
statement: For the Stokes eigenvalue problem $-\Delta u+\nabla p=\lambda u$, $\operatorname{div}u=0$ in $\Omega$, and $u=0$ on $\partial\Omega$, does constancy of $p$ on a boundary portion imply that $u=0$ and $p$ is constant in $\Omega$? Is the disk the only domain admitting a nonzero eigenfunction with $p=0$? Establish the related unique-continuation statement for nonsmooth boundaries.
