title: An exact one-harmonic threshold for polar-zonoid candidates
field: mathematics
tier: prose
statement: |-
  **Problem 1 (R. Schneider).** Let \(Z_n\subset\mathbb R^n\) be a zonoid whose polar \(Z_n^\circ\) is also a zonoid. Let \(d\) denote the Banach--Mazur distance. Does
  \[
  d(Z_n,B_2^n)\longrightarrow 1
  \]
  as \(n\to\infty\)?
