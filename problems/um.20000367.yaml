title: An exact nonrational double-cover source for dense quadratic points
field: mathematics
tier: prose
statement: |-
  The following is asked in analogy with a result of Harris and Silverman showing that, for a curve $C/k$, $2\in\delta(C/k)\iff C$ is a double cover of $\mathbb P^1$ or a positive rank elliptic curve (see https://www.ams.org/journals/proc/1991-112-02/S0002-9939-1991-1055774-0/S0002-9939-1991-1055774-0.pdf).

  Classify surfaces $X/k$ of general type with $2\in\delta(X/k)$, possibly using geometric and/or dynamical constructions.

  Vojta has prove that for a hyperelliptic curve $C/k$ of genus $\ge4$, all but finitely many degree $2$ points are contracted by its hyperelliptic map.

  If $\operatorname{irr}(X)=2$, there exists a dominant map $X\dashrightarrow\mathbb P^2$ of degree $2$. What conditions on $X$ guarantee that the set of quadratic points on $X$ not arising from this map is not Zariski dense?
