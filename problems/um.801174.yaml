title: Open Problems in Wavelet Theory — Problem 13
field: mathematics
tier: prose
statement: |-
  We end by stating not that serious, yet curious problem. The only known construction of wavelets in the Schwartz class is a Meyer wavelet which is a band-limited function. Hence, it is natural ask the following question.

  Suppose $\psi$ is an orthonormal wavelet such that $\psi$ belongs to the Schwartz class. Is
  $\hat\psi$ necessarily compactly supported?
