title: A uniform-connectivity criterion for the spectral motivic filtration on p-typical TR
field: mathematics
tier: prose
statement: "**Motivic filtration on \\(\\mathrm{TR}\\).** \\([\\mathrm{HRW}]\\) gives a motivic filtration on \\(\\mathrm{THH},\\mathrm{TC},\\mathrm{TC}^{-},\\mathrm{TP}\\) of ring spectra, generalizing previously defined motivic filtrations such as \\([\\mathrm{BMS}]\\). Remark 1.13 of that work says that its techniques can additionally define a motivic filtration on \\(\\mathrm{TR}\\) of discrete rings. Can one define a well-behaved motivic filtration on the \\(\\mathrm{TR}\\) of ring spectra? Can one compute it in good cases?"
