title: Spectral Remainder Bounds on Surfaces of Revolution
field: mathematics
tier: prose
statement: Let $M$ be a generic Riemannian $2$-sphere with a metric of revolution. For the Weyl-law remainder $R(\lambda)$, the pointwise remainder $R_x(\lambda)$ away from a pole, and the off-diagonal spectral function $N_{x,y}(\lambda)$ when at least one of $x,y$ is not a pole, do the bounds $R(\lambda)=O(\lambda^{1/2+\varepsilon})$, $R_x(\lambda)=O(\lambda^{1/2+\varepsilon})$, and $N_{x,y}(\lambda)=O(\lambda^{1/2+\varepsilon})$ hold for every $\varepsilon>0$?
