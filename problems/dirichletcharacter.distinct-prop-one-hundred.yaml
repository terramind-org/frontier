id: dirichletcharacter.distinct-prop-one-hundred
title: Simple zeros of the Riemann zeta function on the critical line (DirichletCharacter.distinct_prop_one_hundred)
field: mathematics
tier: proof
statement: Almost all nontrivial zeros of `L(s, χ)`, `χ` primitive, are simple.
