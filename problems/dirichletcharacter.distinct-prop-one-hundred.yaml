lean:
  module: FormalConjectures.Paper.RiemannZetaZeros
  decl: DirichletCharacter.distinct_prop_one_hundred
  statement: |-
    theorem distinct_prop_one_hundred (hχ : χ.IsPrimitive) : ∃ o : ℝ → ℝ, o =o[atTop] (1 : ℝ → ℝ) ∧
        ∀ T > 0, (1 - o T) * N (LFunction χ) T (2 * T) ≤ Nd (LFunction χ) T (2 * T)
  context:
    - open DirichletCharacter
    - open Filter
    - open ZetaZeros
    - "variable {M : ℕ} [NeZero M] {χ : DirichletCharacter ℂ M}"
  definitions:
    - name: ZetaZeros.N
      kind: def
      text: |-
        /-- `N(T₁, T₂)`: the nontrivial zeros of `f` with imaginary part in `(T₁, T₂]`, counted with
        multiplicity. -/
        noncomputable def N (f : ℂ → ℂ) (T₁ T₂ : ℝ) : ℕ :=
          Complex.zeroCountOn f (nontrivialZeros f T₁ T₂)
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Paper/RiemannZetaZeros.lean#L55
    - name: ZetaZeros.Nd
      kind: def
      text: |-
        /-- `N_d(T₁, T₂)`: the number of distinct nontrivial zeros of `f` with imaginary part in
        `(T₁, T₂]`. -/
        noncomputable def Nd (f : ℂ → ℂ) (T₁ T₂ : ℝ) : ℕ := (nontrivialZeros f T₁ T₂).ncard
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Paper/RiemannZetaZeros.lean#L60
