title: Research Problems in Function Theory — Problem 6.81
field: mathematics
tier: prose
statement: Let $G$ be the set of functions analytic and not univalent in $\mathbb{D}$. Set, for $f\in G$, \[M_f=\sup\{|f'(z)|:|z|<1\},\hspace{1cm}m_f=\inf\{|f'(z)|:|z|<1\}\] and put \[\gamma=\inf\Big\{\frac{M_f}{m_f}:f\in G\Big\}.\] Find $\gamma$. John has proved that $\gamma\geq e^{\pi/2}\approx4.7$ and Yamashita has shown that $\gamma\leq e^\pi\approx 23.1$. (G. M., J. M. and T. M. Rassias)
