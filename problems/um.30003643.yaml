title: Fourier Uniqueness from Spherical Zero Sets
field: mathematics
tier: prose
statement: Let $f\in\mathcal S(\mathbb R^n)$. If $f$ vanishes on every sphere $|x|=r_j$ and its Fourier transform $\widehat f$ vanishes on every sphere $|\xi|=\rho_j$, where $r_j,\rho_j\to\infty$, must $f\equiv0$?
