id: um.20001068
title: A counterexample to the unqualified weak-weight formulation
field: mathematics
tier: prose
statement: |-
  **Conjecture 6.23 (Bollobás & Scott).** Let
  \(p:E(G)\to[0,1]\). If
  \[
    \sum_{v\in N_G^+(u)}p(uv)\ge 1
    \quad\text{and}\quad
    \sum_{v\in N_G^-(u)}p(vu)\ge 1
  \]
  for all \(u\in V(G)\), there is a directed cycle in \(G\) of
  total weight at least \(1\).

  **Note.** There is a nice proof that there is a dipath of total
  weight at least \(1\).
