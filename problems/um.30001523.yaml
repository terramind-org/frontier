title: Bounds on Cohomological Exponents of Finite $p$-Groups
field: mathematics
tier: prose
statement: For a finite $p$-group $P$, is $e(P)\leq2n(P)-c(P)$, where $c(P)$ is the rank of its maximal central elementary abelian $p$-subgroup and $n(P)$ is the minimal dimension of a faithful complex representation of $P$?
