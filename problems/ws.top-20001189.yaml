  \paragraph{Statement recorded in the supplied source.}
  Question 13. What is the family of distributions that has margins and conditionals as sufficient statistics? What should the stationary distribution be for MCMC? Jon Forster asked, "Is it safe to release full conditionals that have been perturbed?" Aleksandra replied, "Probably not."

  Luis Garcia

  Luis Garcia spoke about the algebraic structure of the probability distributions which arise from graphical models with hidden variables. Chris Meek asked, "What is the algebraic characterization of the Verma constraints? (non-independence constraints)" Mathias Drton asked, "Are these the same constraints described by Richardson and Spirtes (Annals of Statistics 2002)?" Henry Wynn asked, "How do inequalities play a role in this problem?"

  Henry Wynn

  Henry Wynn spoke about formulae relating cumulants to moments. \sref{statement}{2}
