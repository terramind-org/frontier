statement: |-
  \section{Problem 1.17 — (A.}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A knot or link is a smooth oriented embedding of one or more circles in the oriented $3$-sphere, considered up to orientation-preserving ambient isotopy. Write $O$ for the unknot, which bounds an embedded disk. The Conway polynomial $\nabla_L(z)$ is normalized by $\nabla_O=1$ and $\nabla_{L_+}-\nabla_{L_-}=z\nabla_{L_0}$ for the oriented skein triple. Write $\nabla_k(L)=[z^k]\nabla_L(z)$. The crossing number $c(L)$ is the least crossing count of a link diagram.
  \paragraph{Statement recorded in the supplied source.}
  For every oriented link $L$ and integer $k\ge0$, is
  \[|\nabla_k(L)|\le \frac{c(L)^k}{2^k k!}?\]
  For $k=0$ the right side is $1$, including when $c(L)=0$. Investigate the source's refinements: whether the bound follows from Kontsevich--Drinfel'd methods and the Conway weight systems, whether parallel-oriented $(2,n)$ torus links attain the largest coefficients, and the corresponding coefficient bounds for other finite-type families such as Jones derivatives at $t=1$. \sref{statement}{2}
  \subsection{Short English statement}
  Bound every Conway coefficient by the proposed crossing-number expression, and investigate the extremal links and finite-type extensions suggested in the source.
  \subsection{Sources}
