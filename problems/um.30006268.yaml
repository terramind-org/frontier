title: Lagrangian p-Supports of Holonomic Quantization Modules
field: mathematics
tier: prose
statement: Let $X$ be a conical symplectic singularity, let $A_\lambda$ be a quantization, and let $M$ be a holonomic finite $A_\lambda$-module. Prove that for all sufficiently large primes $p$, the support of the reduction $M_p$ over the $p$-center is Lagrangian.
