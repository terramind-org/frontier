title: Hitchin Curves and Weil–Petersson Boundary Dynamics
field: mathematics
tier: prose
statement: Find an ordinary differential equation describing at least some finite-dimensional families of $C^1$ curves arising from Hitchin representations. For universal Weil–Petersson Teichmüller space, determine the limit points in the Thurston boundary of Weil–Petersson geodesics, or construct analogues of earthquake paths.
