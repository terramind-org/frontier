title: Ultraproduct II_1 Factors — Problem 6
field: mathematics
tier: prose
statement: Denote by $\mathbb{S}^{\mathcal{U}}=\prod_{i\to \mathcal{U}}\mathbb{S}_n$, the ultraproduct of the symmetric groups with the normalized Hamming distance. Clearly, $\mathbb{S}^{\mathcal{U}}\subset \mathbb{M}^\mathcal{U}$ in a trace preserving way (where the trace on $\mathbb{S}^{\mathcal{U}}$ is given by one minus the ultralimit of the Hamming distance to the identity elements). Denote by $W^*(\mathbb{S}^{\mathcal{U}})$ the von Neumann subalgebra of $\mathbb{M}^\mathcal{U}$ generated by $\mathbb{S}^{\mathcal{U}}$. Does $W^*(\mathbb{S}^{\mathcal{U}})$ contain a copy of a matrix ultraproduct?
