title: Positive curvature up to delta
field: mathematics
tier: prose
statement: Define curvature up to $\delta$ by $$T_1(m_x,m_y)\leq(1-\kappa(x,y))d(x,y)+\delta.$$ Which theorems for positive coarse Ricci curvature extend to this setting? Can one choose a discrete subset and redefine its random walk naturally so that it has genuinely positive Ricci curvature?
