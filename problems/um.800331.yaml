title: Enumeration of Matchings — Problem 2
field: mathematics
tier: prose
statement: |-
  \end{verbatim}
  These are similar to the numbers one gets from counting lozenge-tilings
  of an $n,n,n,n,n,n$ hexagon, in that the largest prime factor seems to
  be bounded by a linear function of $n$, and it ought to be possible to
  come up with a conjectural exact formula. What might be harder is
  proving it.

  Enumerate the lozenge-tilings of the region obtained
  from the $n,n+1,n,n+1,n,n+1$ hexagon by removing the central triangle.
