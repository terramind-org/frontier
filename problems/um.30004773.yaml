title: Character Degrees of Graph-Defined Exponent-$p$ Groups
field: mathematics
tier: prose
statement: For a finite simple graph $\Gamma$ and an odd prime $p$, determine the ordinary representation theory of the exponent-$p$, nilpotency-class-two group $G_\Gamma(\mathbb F_p)$. For each $i\geq1$, how does the number of its irreducible characters of degree $p^i$ depend on $p$?
