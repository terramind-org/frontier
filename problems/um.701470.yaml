title: Kourovka Notebook Problem 18.41
field: mathematics
tier: prose
statement: |-
  Let $F$ be a free group of rank 2.

  a) It is known that $scl(g)=0$ only for $g=1$, and $scl(g)\ge 1/2$ for all $1\ne g\in [F,F]$. Is $1/2$ an isolated value?

  b) Are there any intervals $J$ in ${\mathbb{R}$ such that the set of values of $scl$ on $[F,F]$ is dense in $J$?

  c) Is there some $T\in {\mathbb{R}$ such that every rational number ${}\ge T$ is a value of $scl(g)$ for $g\in [F,F]$?
