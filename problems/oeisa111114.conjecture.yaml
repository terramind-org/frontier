id: oeisa111114.conjecture
title: Integer part of $\mathrm{prime}(n)/\pi(n)$
field: mathematics
tier: proof
statement: |-
  Conjecture: As $n \rightarrow \infty$, there are infinitely many n's such that
  $a(n)$ is greater than $a(n+1)$.
