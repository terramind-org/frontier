lean:
  module: FormalConjectures.OEIS.«111114»
  decl: OeisA111114.conjecture
  statement: "theorem conjecture : ∃ᶠ n in atTop, a n > a (n + 1)"
  context:
    - open OeisA111114
    - open Nat
    - open Filter
  definitions:
    - name: OeisA111114.a
      kind: def
      text: |-
        /--
        `a n` is the integer part of $\mathrm{prime}(n)/\pi(n)$.
        Here $\mathrm{prime}(n)$ is the $n$-th prime number, and $\pi(n)$ is the prime-counting function.
        The sequence is defined for $n \ge 2$.
        -/
        noncomputable def a (n : ℕ) : ℕ :=
          (Nat.nth Nat.Prime (n - 1)) / (Nat.primeCounting n)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/111114.lean#L35
