title: Exact radial gluing and symmetric star-body rigidity
field: mathematics
tier: prose
statement: |-
  **Rogers's theorem (1965).**  Suppose that \(2\leq k\leq n-1\) and that
  \(K,L\) are compact convex sets in \(\mathbb R^n\) containing the origin in
  their relative interiors.  If, for every \(S\in G(n,k)\), the corresponding
  sections \(K\cap S\) and \(L\cap S\) are homothetic (respectively,
  translates), then \(K,L\) are homothetic (respectively, translates).

  **Problem.**  Does the theorem remain true for star bodies, or perhaps more
  generally?
