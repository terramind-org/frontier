title: Open Problems and Questions about Geodesics — Conjecture 22
field: mathematics
tier: prose
statement: |-
  Let $(M, g)$ be a closed Riemannian manifold with negative sectional curvatures. It is known [Margulis2004] that the number $N(T)$ of closed geodesics of length $\le T$ grows
  asymptotically as ${e^{hT}}/{hT}$.

  {\it $N(T)= (1+ O(e^{-\varepsilon T})) \displaystyle \int_2^{e^{hT}} \frac{du}{\log u} $. }
