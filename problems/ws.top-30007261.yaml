statement: |-
  \section*{Odd regular Fontaine-Mazur over Q at two}\label{30007261}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must every continuous irreducible odd two-dimensional representation of the absolute Galois group of Q over $Qbar_2$, unramified outside finitely many primes and de Rham at two with distinct Hodge-Tate weights, be a Tate twist of the representation of a classical cuspidal eigenform?
  \subsection{Short English statement}
  Must every continuous irreducible odd two-dimensional representation of the absolute Galois group of Q over $Qbar_2$, unramified outside finitely many primes and de Rham at two with distinct Hodge-Tate weights, be a Tate twist of the representation of a classical cuspidal eigenform?
