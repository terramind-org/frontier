title: Foliations and Diffeomorphism Groups — Question 9
field: mathematics
tier: prose
statement: |-
  The group of Engel automorphisms of the local model is very rich: it is isomorphic to the group of contactomorphisms of standard tight $\mathbb{R}^3$. However, automorphisms do not globalize (we cannot ``cut them off''). In fact, it is known, due to work of R. Montgomery, that there are Engel manifolds with very small automorphism group. He posed the question of whether there exists an Engel manifold with trivial automorphism group. One such example was recently found by Koji Yamazaki, but the ambient manifold is non-compact. The following question remains open:

  Is there a closed Engel manifold with trivial automorphism group?
