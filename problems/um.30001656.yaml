title: Erdős–Hajnal Conjecture for Tournaments
field: mathematics
tier: prose
statement: For every tournament $H$, there exists $\varepsilon<1$ and a constant $c$ such that every $H$-free tournament $G$ satisfies $\chi(G)\leq c|V(G)|^{\varepsilon}$, where $\chi(G)$ is the minimum number of transitive subtournaments partitioning $V(G)$.
