title: Kadison–Kaplansky projection conjecture
field: mathematics
tier: prose
statement: |-
  \section*{Kadison–Kaplansky projection conjecture}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every torsion-free discrete group G, are 0 and 1 the only projections in the scalar reduced group C*-algebra C*r(G)? This concerns the completed complex C*-algebra, rather than the algebraic group ring or only matrix projections.
  \subsection{Short English statement}
  For every torsion-free discrete group G, are 0 and 1 the only projections in the scalar reduced group C*-algebra C*r(G)? This concerns the completed complex C*-algebra, rather than the algebraic group ring or only matrix projections.
