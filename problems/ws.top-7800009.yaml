  \item[\hypertarget{source:7800009:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 7800009 (AMR-077-0009). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:7800009:2}{S2}] Giovanni Gallavotti, Separatrix Splitting for a Quasi Periodically Forced Pendulum (6 November 1998), Hamiltonian, definition of Delta, Diophantine sequence, and final Question. \url{https://web.math.princeton.edu/~aizenman/OpenProblems_MathPhys/9805.separatrix.tex}.
  \end{description}
