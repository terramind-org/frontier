schema: 1
id: ellipticcurverank.ratellipticcurve.twentyone-le-rank-height-count-asymptotic
title: Some conjectures about ranks of elliptic curves over ℚ (twentyone_le_rank_height_count_asymptotic)
field: mathematics
tier: proof
statement: |-
  [PPVW2016] 8.2(c): the number of elliptic curves over ℚ with rank ≥ 21 and naïve height
  at most `H` is asymptotically at most `H ^ o(1)`.
ams:
  - 11
  - 14
tags:
  - wikipedia
references:
