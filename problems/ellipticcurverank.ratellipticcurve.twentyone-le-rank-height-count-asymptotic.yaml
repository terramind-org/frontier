lean:
  module: FormalConjectures.Wikipedia.EllipticCurveRank
  decl: EllipticCurveRank.RatEllipticCurve.twentyone_le_rank_height_count_asymptotic
  statement: |-
    theorem twentyone_le_rank_height_count_asymptotic :
        ∃ f : ℕ → ℝ, atTop.Tendsto f (𝓝 0) ∧
          ∀ H : ℕ, 1 < H → {E ∈ heightLE H | 21 ≤ E.rank}.ncard ≤ (H : ℝ) ^ f H
  context:
    - open EllipticCurveRank
    - open EllipticCurveRank.RatEllipticCurve
    - open Module (finrank)
    - open WeierstrassCurve
    - open scoped Topology
    - open Filter (atTop)
  definitions:
    - name: EllipticCurveRank.RatEllipticCurve.rank
      kind: abbrev
      text: |-
        /-- The rank of an elliptic curve over ℚ. -/
        noncomputable abbrev rank (E : RatEllipticCurve) : ℕ := finrank ℤ E.toWeierstrass.Point
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L78
    - name: EllipticCurveRank.RatEllipticCurve.heightLE
      kind: def
      text: |-
        /-- The set of elliptic curves over ℚ with naïve height less than or equal to a given height. -/
        def heightLE (H : ℕ) : Set RatEllipticCurve := {E : RatEllipticCurve | E.naiveHeight ≤ H}
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L91
