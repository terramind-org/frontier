title: Kourovka Notebook Problem 5.54
field: mathematics
tier: prose
statement: |-
  Let $p,q,r$ be distinct primes and $ u(x,y,z)$ a
  commutator word in three variables. Prove that there exist
  (infinitely many?) natural numbers $n$ such that the alternating
  group ${\mathbb{A}_n$ can be generated by three elements $\xi , \eta ,
  \zeta$ satisfying $\xi ^p= \eta ^q= \zeta ^r=\xi \eta \zeta \cdot
  u(\xi , \eta , \zeta )=1$
