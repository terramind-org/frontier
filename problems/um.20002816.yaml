title: An elementary-generator characterization of the André–Yan theory
field: mathematics
tier: prose
statement: |-
  Characterize the André–Yan theory of \(U_n(q)\) intrinsically in terms of its elementary, single-box irreducible characters, and determine whether it is the coarsest supercharacter theory in which those characters remain individual supercharacters.

  The original PDF was checked directly. It gives the same wording (with André printed without the accent) and no additional remark.

  The dependence on the preceding item is essential. Problem 1.3 reads:

  The following Problem 1.6 also records the key structural fact that, for \(U_n\), every supercharacter is a product of supercharacters that happen to be irreducible. Thus the most literal precise reconstruction of Problem 1.4 is:

  This report proves such a characterization. Since the source request is open-ended and never defines what class of “characterizations” is intended, the result is conservatively classified as a rigorous partial result rather than as an unconditional full solution to every possible reading.

  The list came from the AIM workshop *Supercharacters and combinatorial Hopf algebras*, held May 17–21, 2010.
