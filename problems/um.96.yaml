title: Ulam's Sequence
field: mathematics
tier: prose
statement: Define Ulam's sequence $1, 2, 3, 4, 6, 8, 11, 13, 16, 18, 26, 28, 36, \ldots$ where $u_1 = 1, u_2 = 2$, and $u_{n+1}$ is the smallest number uniquely expressible as $u_i + u_j$ for $i < j \leq n$. Does this sequence have positive density? Can one explain its curious Fourier properties?
