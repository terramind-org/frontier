title: Polynomial-Density Hales–Jewett Problem for Graph Families
field: mathematics
tier: prose
statement: If $\mathcal{F}$ is a family of graphs on $[n]$ such that $F_1\triangle F_2$ is not a clique for any distinct $F_1,F_2\in\mathcal{F}$, must $|\mathcal{F}|=o(2^{\binom n2})$?
