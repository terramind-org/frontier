title: Open Problems and Questions about Geodesics — Question 58
field: mathematics
tier: prose
statement: "*Let $F_1$, $F_2$ be Finsler metrics on a closed surface of genus $\\ge 2$. Assume every (unparameterized) $F_1$-geodesic is an $F_2$-geodesic. Must $F_1$ be obtained from $F_2$ by multiplication by a constant and adding a closed form? *"
