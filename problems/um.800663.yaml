statement: |-
  Assume that $\mathfrak{V}\in\{\Omega,\Omega^{gp}\}$.
  Is it true that ONE does not have a winning strategy in
  $\mathsf{G}_{fin}(\{\mathcal{O}_n\}_{n\in\mathbb{N}},\mathfrak{V})$ if, and only if, $\mathsf{S}_{\mathrm{fin}}(\Omega,\mathfrak{V})$ holds?
