title: Kourovka Notebook Problem 11.61
field: mathematics
tier: prose
statement: |-
  Let $F$ be a non-abelian
  free pro-$p
  $-group. Is it true that the subset $\{ r
  \in F\mid \mathrm{cd} (F/(r)) \leq 2\} $ is dense in $F$? Here $
  (r)$ denotes the closed normal subgroup of $F$ generated by $r$.
