statement: Given a subgroup $H\subset\pi_1(S^3\setminus K)$ and an element $\sigma\notin H$, can one bound the index of a subgroup $G\subset\pi_1(S^3\setminus K)$ such that $H\subset G$ but $\sigma\notin G$?
