title: Selected Lifting and Perturbation Problems in Operator Algebras
field: mathematics
tier: prose
statement: Is there an automorphism $\alpha$ of $\mathcal{O}_\infty\otimes\mathcal{K}$ that fixes the diagonal and induces $-\mathrm{id}$ on $K_0$, and can such an automorphism have the Rokhlin property? Does there exist a relatively free group $G$ for which $C_r^*(G)$ is selfless? Does there exist a simple $C^*$-algebra that is not $K_1$-injective? Is every approximate $C^*$-algebra close to an actual $C^*$-algebra?
