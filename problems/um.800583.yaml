title: Selection Principles in Mathematics — Problem 9 ([MilNonGamma])
field: mathematics
tier: prose
statement: |-
  All constructions mentioned above can be carried out using
  Martin's Axiom{}. Except perhaps Setting (n).

  Does Martin's Axiom{} imply the existence of a set of reals of cardinality continuum,
  satisfying $\mathsf{S}_1(\mathrm{B}_\Omega,\mathrm{B}_\Gamma)$?
