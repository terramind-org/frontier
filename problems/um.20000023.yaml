title: Tate-completion obstruction and finite torsion windows for the motivic filtration on TC of the sphere
field: mathematics
tier: prose
statement: |-
  The motivic filtration on the algebraic \(K\)-theory of the sphere spectrum

  Due to work of Rognes, Blumberg--Mandell, and others, we understand the algebraic K-theory of the sphere spectrum fairly well. Recent work of Hahn--Raksit--Wilson gives a motivic filtration on TC of \(\mathbb E_\infty\)-rings which is closely related to the motivic filtration on algebraic K-theory in motivic homotopy theory.

  Can one understand the motivic filtration (or motivic spectral sequence) on the \(\mathrm{TC}\) of the sphere spectrum? What about for the motivic filtration on related invariants such as \(\mathrm{THH}\), \(\mathrm{TP}\)?
