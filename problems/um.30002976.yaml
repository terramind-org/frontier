title: Irreducibility of Nodal-Curve Spaces on K3 Surfaces
field: mathematics
tier: prose
statement: Let $(X,L)$ be a general primitively polarized K3 surface of genus $p$, and let $0<\delta<n^2(p-1)+1$. Is the Severi variety $V_{n,\delta}(X)$ of irreducible $\delta$-nodal curves in $|nL|$ irreducible?
