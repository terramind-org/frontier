title: A pinching and Riccati-occupation obstruction to typical Lyapunov spread beyond two
field: mathematics
tier: prose
statement: |-
  **Question 5.4.2.** Is there a metric of negative curvature for which the ratio of largest positive Lyapunov exponent to smallest positive Lyapunov exponent is greater than 2 for typical geodesics (not just exceptional closed geodesics)?

  The Anosov splitting is \(C^\infty\) if and only if the metric is locally symmetric. For surfaces, if one stable or unstable foliation is \(C^{1+o(x\log|x|)}\), then the splitting is \(C^\infty\). In higher dimensions the conjectural implication \(C^2\Rightarrow C^\infty\) was open.
