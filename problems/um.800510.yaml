statement: |-
  Extend Paige's analysis of the Lanczos algorithm [paige_76,paige_80] to the block Lanczos algorithm.
  The exact analysis will depend on the use of an orthogonalization scheme used within blocks, so either specify certain assumptions on the accuracy of the scheme, or analyze a standard ``good'' algorithm.
