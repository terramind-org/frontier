lean:
  module: FormalConjectures.Wikipedia.EulerBrick
  decl: EulerBrick.perfect_euler_brick_existence
  statement: |-
    theorem perfect_euler_brick_existence :
        ∃ a b c : ℕ+, IsPerfectCuboid a b c
  context:
    - open EulerBrick
  definitions:
    - name: EulerBrick.IsPerfectCuboid
      kind: def
      text: |-
        /--
        A **perfect cuboid** is an Euler brick with an integer space diagonal.
        -/
        def IsPerfectCuboid (a b c : ℕ+) : Prop :=
          IsEulerBrick a b c ∧ IsSquare (a^2 + b^2 + c^2)
