title: Conjecture 3.16 — d(Ig) = 0.
field: mathematics
tier: prose
statement: d(Ig) = 0. Even better would be to determine dlog(Ig). Conjecture 3.16 would imply that d(Ig(m)) = 0 for each m≥ 2. It is not hard to see that Ig(m) has exponential growth for each g≥ 2,m≥ 1, and one wants to understand how the various exponential growth rates compare to each other. In other words, one wants to know how common an occurence it is, as a function of k, for an element of Mod g to act trivially on the first k terms of the lower central series of π1Σg.
