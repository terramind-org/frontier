lean:
  module: FormalConjectures.OEIS.«7406»
  decl: OeisA7406.conjecture
  statement: |-
    theorem conjecture (n : ℕ) (hn : 3 < n) :
        Nat.gcd n (a (n - 1)) = OeisA89026.a n
  context:
    - open OeisA7406
  definitions:
    - name: OeisA7406.a
      kind: def
      text: |-
        /-- Wolstenholme numbers: numerator of $\sum_{k=1}^n \frac{1}{k^2}$. -/
        def a (n : ℕ) : ℕ :=
          (∑ k ∈ Finset.Icc 1 n, (1 : ℚ) / (k : ℚ) ^ 2).num.natAbs
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/7406.lean#L34
