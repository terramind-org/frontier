statement: |-
  - Is there a recursion theoretical proof for the above theorem of Velickovic--Woodin?

  - Is the following true: For any $\Sigma_1^1(y)$ set $A$, if there is $x \in A$ such that $\omega_1^{CK(x)} > \omega_1^{CK(y)}$, then the Velickovic--Woodin theorem holds for $A$?
