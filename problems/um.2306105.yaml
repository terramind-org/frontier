title: Research Problems in Function Theory — Problem 6.105
field: mathematics
tier: prose
statement: "What are the convolution multipliers $\\phi^*:K_H\\to K_H$, where $K_H$ is the subclass of functions $f$ in $S_H$ with convex images $f(\\mathbb{D})$? A particularly interesting case is the radius of convexity problem: for which values of $r$ in $(0,1)$ is the function $z\\mapsto f(rz)$ convex in $\\mathbb{D}$, when $f$ is convex in $\\mathbb{D}$? (It is known that $r\\leq\\sqrt(2)-1$, see Clunie and Sheil-Small .) (T. Sheil-Small)"
