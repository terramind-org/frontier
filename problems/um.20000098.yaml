title: Characteristic-zero specialization and an odd-index theorem for cubic fourfolds
field: mathematics
tier: prose
statement: |-
  “If the general member of a family of smooth cubic is rational, is the special fiber also rational?”

  The statement leaves four mathematically important choices unspecified:

  1. “cubic” could mean a cubic curve, surface, threefold, fourfold, or an arbitrary cubic hypersurface;
  2. “general” could mean the generic fiber, the geometric generic fiber, every point of a dense open set, a very general point, or merely a dense set of points;
  3. rationality could mean rationality over the stated residue field or geometric rationality after algebraic closure;
  4. the base could be a curve over a field or a mixed-characteristic trait.

  The immediately preceding AIM Problem 3.07 explicitly concerns reductions of a cubic fourfold, and the workshop is about positive characteristic. It is therefore plausible that cubic fourfolds in positive or mixed characteristic were intended, but the source does not verify this. This report treats the two most useful precise readings:

  - a smooth proper family over a characteristic-zero curve whose (geometric) generic fiber is rational;
  - a DVR family of smooth cubic fourfolds, possibly in positive or mixed characteristic, for which rationality is witnessed by projection from a plane and an odd-degree multisection.

  Dimension checks confirm why the fourfold reading is natural. A smooth plane cubic is geometrically a genus-one curve and is not rational. A smooth cubic surface over an algebraically closed field is rational, so the geometric question is automatic in dimension two. Over \(\mathbb C\), every smooth cubic threefold is irrational. Cubic fourfold rationality is the first classical case in this sequence for which the general rationality problem remains genuinely subtle.
