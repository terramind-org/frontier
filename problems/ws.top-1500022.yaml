statement: |-
  \section{Algebraic Stories — Polynomial generation}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $p$ be a prime, and put $V_p=\{f\in\mathbb F_p[x]:\deg f\leq p-1\}$, including the zero polynomial. For $a\in\mathbb F_p$ let $\bar a\in\{0,\ldots,p-1\}$ be its integer representative. Define the $\mathbb F_p$-linear bijection
  \[\psi:V_p\longrightarrow V_p,\qquad\psi(f)=\sum_{a\in\mathbb F_p}f(a)x^{\bar a}.
  \]
  The evaluation map on all $p$ field elements is bijective in this degree range, so $\psi$ has finite order.
  \paragraph{Statement recorded in the supplied source.}
  For every prime $p$, find the smallest positive integer $q$ for which $\psi^q=\operatorname{Id}_{V_p}$. \sref{statement}{2}
  \subsection{Short English statement}
  Determine the order of the stated invertible polynomial-evaluation map for every prime.
  \subsection{Sources}
