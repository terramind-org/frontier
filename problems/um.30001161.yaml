title: Sharp Geometric Constants for Simply Connected Planar Domains
field: mathematics
tier: prose
statement: For arbitrary simply connected planar domains, identify the optimal universal constants $C_1,C_2,C_3,C_4$ and the geometry of extremal domains in the four inequalities relating, respectively, the Hardy integral to the distance-to-boundary function, the first Dirichlet eigenvalue to the inradius, the expected Brownian exit time to the inradius, and the hyperbolic metric density to the inradius.
