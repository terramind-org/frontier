lean:
  module: FormalConjectures.OEIS.«105210»
  decl: OeisA105210.conjecture
  statement: |-
    theorem conjecture :
      ∃ K : Set ℕ,
        Set.Infinite K ∧
        (∀ k ∈ K, 1 ≤ k) ∧
        (∀ j k : ℕ,
          j ∈ K → k ∈ K → j ≠ k →
          sequenceSet j ∩ sequenceSet k = ∅)
  context:
    - open OeisA105210
    - open Nat Finset
  definitions:
    - name: OeisA105210.sequenceSet
      kind: def
      text: |-
        /-- The set of all terms generated by the sequence starting at $k$. -/
        def sequenceSet (k : ℕ) : Set ℕ :=
          { m | ∃ n : ℕ, 1 ≤ n ∧ sequenceStartingAt k n = m }
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/105210.lean#L79
