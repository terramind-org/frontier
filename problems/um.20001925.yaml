id: um.20001925
title: A compact normalized-null-cone obstruction
field: mathematics
tier: prose
statement: |-
  Can there exist a complete semi-Riemannian metric \(g\) of indefinite signature and a nontrivial one-form \(\eta\) on a closed manifold such that, for every lightlike geodesic \(\gamma(t)\), there are constants \(C_1\ne0,C_2\) for which
  \[
  \eta_{\gamma(t)}(\dot\gamma(t))=C_1t+C_2?
  \]
