statement: If $u\in W^{1,2}_{\mathrm{loc}}(\Omega)$ solves $\operatorname{div}(A(x)\nabla u)=0$, where $A$ is bounded measurable and uniformly elliptic with fixed constants, does $\nabla u$ belong locally to $L^{2+\varepsilon}$ for some $\varepsilon>0$ depending only on dimension and ellipticity?
