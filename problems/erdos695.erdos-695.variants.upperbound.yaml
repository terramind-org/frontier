id: erdos695.erdos-695.variants.upperbound
title: "Erdős Problem 695 (variant: upperBound)"
field: mathematics
tier: proof
statement: |-
  Is there a sequence of primes $q_1 < q_2 < \cdots$ such that $q_{i + 1} \equiv 1 \pmod{q_i}$ and
  $$
  q(k) \leq \exp(k (\log k)^{1 + o(1)})?
  $$
