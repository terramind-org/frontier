title: Complete Graph Minors from Homological Graph Dimension
field: mathematics
tier: prose
statement: For a finite graph $G$, let $\gamma(G)$ be the largest integer $q$ for which some connected family of induced subgraphs of $G$ has a nerve with nonzero $q$-dimensional homology. For every positive integer $d$, is $\gamma(G)\geq d$ equivalent to the existence of a $K_{d+2}$ minor in $G$?
