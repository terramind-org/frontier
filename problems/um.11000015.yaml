title: Problem 2.12 — Forg≥ 2, determine the irreducible factors of the graded pieces of the Malcev Lie algebra tg ofIg as Sp-modules.
field: mathematics
tier: prose
statement: Forg≥ 2, determine the irreducible factors of the graded pieces of the Malcev Lie algebra tg ofIg as Sp-modules. While Hain gives in [ Ha3] an explicit and reasonably simple presentation for tg when g >6, Problem 2.12 still seems to be an involved problem in classical representation theory. As Chris Leininger pointed out to me, all of the questions above have natural “virtual versions”. For example, one can ask about the classification of normal subgroups of finite index subgroups of Mod g. Another variation is the classification of virtually normal subgroups of Mod g, that is, subgroups whose normalizers in Mod g have finite index in Mod g.
