title: Integrality of Constrained Polytope Families
field: mathematics
tier: prose
statement: Fix $r>0$ and let $B$ and $R$ be the integral matrices defining type-$A_r$ hive polytopes. Must every nonempty polytope $\{h\in\mathbb R^{(r+1)(r+2)/2}:Bh=b,\ Rh\leq c\}$ with integral $b$ and $c$ contain an integral point?
