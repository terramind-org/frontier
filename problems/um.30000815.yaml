title: Detecting Nonnormal Smooth Lattice Polytopes
field: mathematics
tier: prose
statement: For lattice polytopes $P$, find examples for which the number of lattice points in $P$ is substantially smaller than the number in $2P$, preferably with $P$ smooth; test smooth polytopes arising from smooth Fano toric varieties and small projective embeddings; and determine whether useful invariants, including Ehrhart functions, detect nonnormality.
