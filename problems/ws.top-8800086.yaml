  \section{Finiteness of a Shafarevich–Tate group needed by the lifting method}\label{8800086}
  {\small UnsolvedMath ID 8800086 · Graph Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Prove finiteness of the Shafarevich–Tate group of the elliptic-curve lift required by the Huang–Raskind method, in the general cases where it is not known.
  \par\smallskip\textit{Formulation references:} \sref{8800086}{1}, \sref{8800086}{2}.
