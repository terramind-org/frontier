title: A compact-tail reduction for adelic unipotent measure rigidity
field: mathematics
tier: prose
statement: |-
  **Problem 7 (L. Silberman).** Extend the results on measure rigidity of unipotent flows to adelic setting.

  It seems natural to expect (and is known in some cases) that the set of finite ergodic invariant measures for other dynamical systems with parabolic behavior has a manageable structure, which is possible to described in algebraic terms.

  Suppose that \(H\) is a connected semisimple Lie subgroup of a Lie group \(G\), and let \(P\) be a parabolic subgroup of \(H\). One of manifestations of the measure rigidity of unipotent flows is the fact that every finite \(P\)-invariant measure on \(G/\Gamma\) is \(H\)-invariant (see [146]).
