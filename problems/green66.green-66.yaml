lean:
  module: FormalConjectures.GreensOpenProblems.«66»
  decl: Green66.green_66
  statement: |-
    theorem green_66 :
        ∀ᶠ X : ℝ in atTop,
          ∃ n : ℕ, IsSumOfTwoSquares n ∧
            (n : ℝ) ∈ Set.Icc (X - (1 / 10 : ℝ) * X ^ (1 / 4 : ℝ)) X
  context:
    - open Green66
    - open Filter
  definitions:
    - name: Green66.IsSumOfTwoSquares
      kind: def
      text: |-
        /-- A natural number is a sum of two squares if it can be written as `a ^ 2 + b ^ 2`. -/
        def IsSumOfTwoSquares (n : ℕ) : Prop :=
          ∃ a b : ℕ, n = a ^ 2 + b ^ 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/GreensOpenProblems/66.lean#L32
