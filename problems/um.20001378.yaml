title: A gcd law for dynatomic-field intersections
field: mathematics
tier: prose
statement: |-
  “Describe $K_n\cap K_{n'}$. Prove that this is small.”

  It is problem 11.2 in the section “Formal period $n$” of the 2016 AIM workshop *The Galois theory of orbits in arithmetic dynamics*. The preceding record asks, “When is the image maximal?”, but neither record defines $K_n$. The workshop report confirms that dynatomic Galois groups were intended: Jones discusses Galois groups of fields generated by periodic points, and Krumm writes $\Phi_n(c,x)$ for the $n$th dynatomic polynomial of $x^2+c$ and studies its splitting field over $\mathbb Q(c)$ [AIM16]. Still, the fragment does not say whether the map is generic or specialized, whether the base is a number field or function field, or whether $K_n$ means the exact/formal-period field or the field of all points whose period divides $n$.

  We use the following explicit reconstruction. Let $K$ be a characteristic-zero field and $f\in K[x]$ have degree at least two. Define the dynatomic polynomial
  \[
  \Phi^*_{f,n}(x)
  =\prod_{r\mid n}\bigl(f^r(x)-x\bigr)^{\mu(n/r)},
  \tag{1.1}
  \]
  which is a polynomial despite its quotient presentation. Let
  \[
  K_n(f/K)=\text{the splitting field over $K$ of }\Phi^*_{f,n}(x). \tag{1.2}
  \]
  When repeated roots occur, “splitting field” means the field generated by the distinct roots. Roots can have formal period $n$ but smaller exact period in parabolic cases [MP94, MS95]; this distinction is kept explicit. The question is meaningful for distinct $n,n'$. If $n=n'$, the intersection is tautologically $K_n$.

  The proved slice below takes $f(x)=x^d$ over $\mathbb Q$, with $d$ even. In this family all relevant polynomials are separable and formal period equals exact period. Moreover, the splitting field of $f^n(x)-x$ is the same field as (1.2), so the answer is insensitive to the second ambiguity above.
