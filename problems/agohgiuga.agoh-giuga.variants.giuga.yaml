  definitions:
    - name: AgohGiuga.AgohGiugaSum
      kind: def
      text: |-
        /--
        The **Agoh-Giuga Conjecture**, Giuga's formulation.
        An integer `p ≥ 2` is prime if and only if it satisfies the congruence
        `∑_{i=1}^{p-1} i^{p-1} ≡ -1 [MOD p]`.
        -/
        def AgohGiugaSum : Prop := ∀ p ≥ 2, p.Prime ↔
          p ∣ 1 + ∑ i ∈ Finset.Ioo 0 p, i^(p - 1 : ℕ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/AgohGiuga.lean#L55
