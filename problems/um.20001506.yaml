title: An explicit lamination-depth gap for the AIM free-by-cyclic pair
field: mathematics
tier: prose
statement: |-
  Let \(F = F(a,b,c,d,e)\) be a free group of rank five. Define an automorphism \(\phi \in \mathrm{Aut}(F)\) such that
  \[
  \begin{split}
  \phi \colon F(a,b,c,d,e) &\to F(a,b,c,d,e) \\
  a &\mapsto b\\
  b &\mapsto c\\
  c &\mapsto ab\\
  d &\mapsto ea \\
  e &\mapsto ed
  \end{split}
  \]
  Let \(F'\) be the free factor of \(F\) generated by \(\{a,b,c\}\). Let \(G = F \rtimes_{\phi} \mathbb{Z}\) be the mapping torus of \(\phi\), and let \(\Gamma\) be the mapping torus of the restriction of \(\phi\) to \(F'\). Then \(\Gamma\) and \(G\) are not quasi-isometric.
