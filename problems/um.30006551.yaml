title: Small Maximal Partial Ovoids in Polar Spaces
field: mathematics
tier: prose
statement: For odd $q$, do the hyperbolic quadrics $Q^+(2n+1,q)$, parabolic quadrics $Q(2n,q)$, and elliptic quadrics $Q^-(2n+1,q)$ have no maximal partial ovoids of size $O(q)$?
