title: Global weak normalization implies strong normalization in pure type systems
field: mathematics
tier: prose
statement: |-
  \section*{Global weak normalization implies strong normalization in pure type systems}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every pure type system with arbitrary sorts, axioms and rules, if every legal expression in every valid context has some terminating $\beta$-reduction sequence, must every $\beta$-reduction sequence of each such expression terminate? Reduction includes type annotations and the specification need not be functional.
  \subsection{Short English statement}
  For every pure type system with arbitrary sorts, axioms and rules, if every legal expression in every valid context has some terminating $\beta$-reduction sequence, must every $\beta$-reduction sequence of each such expression terminate? Reduction includes type annotations and the specification need not be functional.
