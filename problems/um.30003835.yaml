title: Smoothability of Group Actions on One-Manifolds
field: mathematics
tier: prose
statement: Let $M$ be a connected one-dimensional manifold and let $G<\operatorname{Homeo}^+(M)$ act on $M$. Does the abstract group $G$ admit a faithful action by $C^r$ diffeomorphisms on $M$? Is the given action topologically conjugate to a $C^r$ action, and what obstructs such actions on one-dimensional manifolds? Also, does an infinite Kazhdan group admit a faithful action by homeomorphisms on the circle?
