title: Homotopy Groups of Definable Quotients
field: mathematics
tier: prose
statement: Let $X$ be definable in an o-minimal structure and let $E$ be a type-definable equivalence relation of bounded index. Give $X/E$ the logic topology. Suppose $X/E$ is locally contractible and every $E$-class is the intersection of a countable decreasing family of definably contractible sets. Is $\pi_n^{\mathrm{def}}(X)\cong\pi_n(X/E)$ for every $n$?
