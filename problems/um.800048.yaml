title: The Lyapin's Notebook — Problem 50
field: mathematics
tier: prose
statement: |-
  (E.S. Lyapin)

  - Characterize pargoids of projections (idempotents in the semigroup of all transformations).

  - Characterize the pargoids of matrix units.

  - Characterize the pargoids of idempotents of the basic classes of semigroups.

  Some classes of pargoids were characterized in the paper [ESL5].
