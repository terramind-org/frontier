title: Trigonometric-Polynomial Feedback for Nonlinear Stabilization
field: mathematics
tier: prose
statement: Let $\dot x=f(x,u)$ be smooth near $(x,u)=(0,0)$ with $f(0,0)=0$. Assume the Lie algebra rank condition holds at the origin, the origin is locally continuously reachable in arbitrarily small time, and the state dimension is not $2$ or $3$. Can one construct a stabilizing feedback $u=k(x,t)$ that is a trigonometric polynomial in $t$ with coefficients depending on $x$?
