title: Pseudoconvex Domains and Their Cores
field: mathematics
tier: prose
statement: For a domain $\Omega$ in a complex manifold, let $c(\Omega)$ be the set where the Levi form of every bounded-above plurisubharmonic function on $\Omega$ degenerates. How are geometric properties of $\Omega$ related to those of $c(\Omega)$; in particular, how is pseudoconvexity of $\Omega$ related to pluripolarity of its core?
