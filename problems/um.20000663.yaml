title: Constant Liouville runs and the diagonal-progression barrier
field: mathematics
tier: prose
statement: Can we show arbitrarily large patterns $++\ldots+$ or $--\ldots -$ in $(\lambda(n))_{n \in \mathbb N}$? An approach through the entropy decrement argument (roughly) reduces this to showing the existence of arbitrarily large progressions $n,n+p,\dots,n+kp$ with $\lambda(n)=\lambda(n+p)=\dots=\lambda(n+kp)$.
