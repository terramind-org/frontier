title: Geometric Hydrodynamics in Open Problems — Problem 19
field: mathematics
tier: prose
statement: |-
  Consider an ideal fluid in a periodic channel $M=\mathbb{T} \times (0,a)$.
  Assume that its initial velocity $u_0$ is $C^1$ close to that of a plane-parallel flow
  whose velocity profile $v=v(x_2)$ satisfies
  $v'>0$ and $v''>0$ in $(0,a)$.
  Suppose that the level lines of $\omega_0 = \mathrm{curl} u_0$ satisfy $\nabla\omega_0 \neq 0$ in $M$
  and that one of the lines $\omega_0 = \text{const}$ has a ``kink".

  Show that the ``kink" does not disappear as the fluid evolves in time.
