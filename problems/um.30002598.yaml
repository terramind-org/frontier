title: Weighted $q$-Boundaries for Presimplicial Modules
field: mathematics
tier: prose
statement: Given a presimplicial module with boundary $\partial_n=\sum_{i=0}^n(-1)^i d_i$, what useful homological structure can be extracted from the weighted operator $\partial_n^q=\sum_{i=0}^n q^i d_i$ on $C_n^q=C_n\otimes_k\mathbb Z[q]$, despite the fact that these operators do not generally form a chain complex?
