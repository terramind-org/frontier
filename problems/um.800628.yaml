title: Selection Principles in Mathematics — Problem 57 (Bartoszy\'nski)
field: mathematics
tier: prose
statement: |-
  Assume that $X\subseteq\mathbb{N}$ is nonmeager and $Y\subseteq\mathbb{N}$ is dominating.
  Is there a Borel set $H\subseteq\mathbb{N}\times\mathbb{N}$ such that
  every meager set is contained in $H_x$ for some $x\in X\cup Y$?
