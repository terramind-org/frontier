title: Marked Length Spectrum Rigidity
field: mathematics
tier: prose
statement: Let a group $G$ act by isometries on metric spaces $X$ and $Y$, and define the marked length spectrum by $\ell_X(g)=\inf_{x\in X}d(x,gx)$. Under which hypotheses does $\ell_X=\ell_Y$ imply that $X$ and $Y$ are $G$-equivariantly isometric?
