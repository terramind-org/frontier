title: Component obstructions to cluster augmentation varieties
field: mathematics
tier: prose
statement: |-
  For more general Legendrians, is the augmentation variety cluster?

  **Recovered question.** Let \(\Lambda\subset(\mathbb R^3,\xi_{\mathrm{st}})\) be a Legendrian link, let \(T\) contain one marked point on each component, fix a Maslov grading and a field \(k\), and let
  \[
  \operatorname{Aug}^{\mathrm{gr}}_k(\Lambda,T)
  \]
  be the classical graded augmentation scheme of its marked Chekanov--Eliashberg DGA. For which \(\Lambda\) is its coordinate ring a Fomin--Zelevinsky cluster algebra, preferably equal to its upper cluster algebra, with filling or weave tori as cluster charts?
