lean:
  module: FormalConjectures.ErdosProblems.«30»
  decl: Erdos30.erdos_30.variants.O_one
  statement: |-
    theorem erdos_30.variants.O_one :
        (fun N => h N - (N : ℝ).sqrt) =O[atTop] fun _ => (1 : ℝ)
  context:
    - open Erdos30
    - open Erdos30.erdos_30
