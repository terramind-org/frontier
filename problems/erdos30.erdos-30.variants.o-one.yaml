id: erdos30.erdos-30.variants.o-one
title: "Erdős Problem 30 (variant: O_one)"
field: mathematics
tier: proof
statement: |-
  A stronger conjecture: is it true that $h(N) = \sqrt N + O(1)$?
  Erdős thought this was perhaps too optimistic.
