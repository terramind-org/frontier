title: Strominger–Yau–Zaslow Mirror-Symmetry Conjecture
field: mathematics
tier: prose
statement: Given a manifold with a singular special Lagrangian torus fibration over a base $B$, should its mirror be the dual torus fibration over the same base, equipped with a holomorphic complex-valued superpotential $W$ that appropriately counts holomorphic discs with boundary on the fibres of the original fibration?
