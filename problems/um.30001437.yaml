title: Conjugacy Rigidity from Group-Measure-Space Factors
field: mathematics
tier: prose
statement: Let $\Gamma\curvearrowright(X,\mu)$ be a Bernoulli action of a countable ICC group with an infinite normal subgroup whose inclusion has relative property (T). If a free ergodic action $\Lambda\curvearrowright(Y,\nu)$ has an isomorphic group-measure-space von Neumann algebra, must $\Lambda\curvearrowright Y$ be conjugate to $\Gamma\curvearrowright X$?
