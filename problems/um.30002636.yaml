title: Yamabe Solutions on Products of Spheres
field: mathematics
tier: prose
statement: For $n,m\geq 2$ and $T>0$, consider the conformal class $[g_0^n+Tg_0^m]$ on $S^n\times S^m$. As $T$ varies, is the full space of solutions of the Yamabe equation connected? Does every solution lie on a branch bifurcating from a constant solution? Are there solutions that depend nontrivially on both sphere variables?
