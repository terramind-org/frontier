title: A multiplicity- and cusp-safe QUE certificate
field: mathematics
tier: prose
statement: |-
  **Conjecture 38, multiplicity-safe compact form.** Let \(X\) be a closed negatively curved Riemannian manifold and let \(dV\) be normalized volume. For every sequence of \(L^2\)-normalized Laplace eigenfunctions \(\phi_j\), with eigenvalues tending to infinity,
  \[
  |\phi_j|^2dV\Longrightarrow dV.
  \]
  Equivalently, for every \(a\in C(X)\),
  \[
  \int_X a|\phi_j|^2\,dV\longrightarrow\int_X a\,dV.
  \]
