statement: For billiards inside an oval in the Lorentz plane with metric $ds^2=dx^2-dy^2$, is there an analogue of Birkhoff's theorem, with separate existence statements for space-like and time-like periodic trajectories? What happens for multidimensional pseudo-Euclidean billiards?
