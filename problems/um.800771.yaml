title: Positively Curved Projective Varieties — Problem 6
field: mathematics
tier: prose
statement: |-
  [cf.{[Mat18b, Problem 5.3]}]

  \

  $\bullet$ Does the blow-up of Hirzebruch surfaces admit
  a positive holomorphic sectional curvature?

  $\bullet$ Can we classify all the varieties of fixed dimension $($e.g., dimension two or three$)$
  with semi-positive $($or positive$)$ holomorphic sectional curvature?

  $\bullet$ Can we find an analog of semi-positive $($or positive$)$ holomorphic sectional curvatures in algebraic geometry?
