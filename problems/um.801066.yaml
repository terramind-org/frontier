title: "Henon Maps: Open Problems — Question 18"
field: mathematics
tier: prose
statement: |-
  Assume $H_2$ has a Herman ring with bounded type rotation number $\theta$. Is it possible to find parameters $a\in \mathbb{D}\smallsetminus \{0\}$ arbitrarily close to $1$ such that the dissipative H\'enon map $H\colon\mathbb{C}^2\to \mathbb{C}^2$ defined by
  \[H(x,y) = \left(ay,x+y^2\right).\]
  has a Herman ring with rotation number $\theta$?
