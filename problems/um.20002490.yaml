title: A quantitative primal-dual certificate for stochastic Mather measures
field: mathematics
tier: prose
statement: Investigate possible extensions of the techniques used in the Aubry--Mather theory and Monge--Kantorovich problems to study linear programming problems in infinite dimensions. An example of such extensions are the stochastic Mather measures which can be used to analyze second order Hamilton--Jacobi equations.
