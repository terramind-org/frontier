title: Thresholds and Traces for Supercritical Lane–Emden Blowup
field: mathematics
tier: prose
statement: For the supercritical Lane–Emden heat flow $u_t-\Delta u=|u|^{p-2}u$ on a smooth bounded domain $\Omega\subset\mathbb R^n$, $p>2^*=2n/(n-2)$, can the complete-blow-up threshold be chosen as $M=\alpha(n-2-\alpha)$, $\alpha=2/(p-2)$, for sufficiently small $p>2^*$; and does every finite-time blow-up solution with bounded energy have a trace $u(T)\in L^{p,\lambda}_0(\Omega)$?
