title: Discreteness of the Dirichlet $p$-Laplacian Spectrum
field: mathematics
tier: prose
statement: Is the spectrum of the Dirichlet $p$-Laplacian on a bounded domain discrete? In particular, do higher eigenvalues have finite multiplicity, and is there at least one number above the second eigenvalue that is not an eigenvalue?
