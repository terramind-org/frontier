title: Alternating Cyclic-Quotient Identities over Commutative Fields
field: mathematics
tier: prose
statement: Let $K$ be a commutative field and let $A_1,\ldots,A_n,A'_1,\ldots,A'_n\in K^2$. Define $$\alpha(A_1,\ldots,A_nmid A'_1,\ldots,A'_n)=\frac{[A_1A_2]\cdots[A_nA_1]}{[A'_1A'_2]\cdots[A'_nA'_1]}.$$ Is $$\sum_{\substack{\pi=(1,\pi_2,\ldots,\pi_n)\in S_n}}\operatorname{sgn}(\pi)\,\alpha(\pi(A_1,\ldots,A_n)mid\pi(A'_1,\ldots,A'_n))=0$$ for every $n$?
