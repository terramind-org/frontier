title: Fillability of Bartnik Boundary Data Under Scalar Curvature Bounds
field: mathematics
tier: prose
statement: Given a closed $(n-1)$-dimensional Riemannian manifold $(Y,h)$, a smooth function $\varphi$ on $Y$, and $\sigma$, find necessary and sufficient conditions for a complete $n$-dimensional manifold $(X,g)$ with boundary $Y$ and scalar curvature $R_g\geq\sigma$ to realize the Bartnik data $(g^\top,H_g)=(h,\varphi)$.
