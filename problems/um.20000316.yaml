title: Frobenius contraction and a log-canonical non-F-pure stress test for the symbolic cube
field: mathematics
tier: prose
statement: |-
  Let \((R,\mathfrak m)\) be a regular local ring of characteristic \(p\) and
  \(\mathfrak p\subset R\) a prime ideal of height \(2\). If
  \(\operatorname{Spec}R/\mathfrak p\) has only log canonical singularities, then
  \(\mathfrak p^{(3)}\subset \mathfrak p^2\)?
