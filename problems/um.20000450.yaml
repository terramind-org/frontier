title: The infinity 5-torsion line and Kummer quotient of the pentagonal quintic
field: mathematics
tier: prose
statement: Draw a regular pentagon \(P\), construct the circle through the 5 vertices \(C\), and consider the curve \(E:P+\lambda C^2=0\). This is a quintic curve with 5 double points, and therefore has geometric genus 1. This curve has five points at \(\infty\) (given by the slopes of the lines). Compute the 5-torsion of \(E\). (McCallum)
