statement: |-
  \section*{An irreducible tensor square containing every symmetric-group representation}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each positive integer n outside\{2,4,9\}, does $S_{n}$ have an irreducible complex representation V such that $V\otimes V$ contains every irreducible complex representation of $S_{n}$?
  \subsection{Short English statement}
  For each positive integer n outside\{2,4,9\}, does $S_{n}$ have an irreducible complex representation V such that $V\otimes V$ contains every irreducible complex representation of $S_{n}$?
