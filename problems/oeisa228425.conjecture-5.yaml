schema: 1
id: oeisa228425.conjecture-5
title: Partitions of $n$ into $x + y$ with $x(x+1)/2 + y^2$ prime (conjecture_5)
field: mathematics
tier: proof
statement: |-
  The only pairs $(k, m)$ with $2 < k \le 10$ and $k < m \le 100$ such that any integer $n > 1$ can
  be written as $x + y$ ($x, y > 0$) with $p_k(x) + p_m(y)$ prime, are the $31$ pairs in
  `sunPolygonalPairs`.
  - _Zhi-Wei Sun_
