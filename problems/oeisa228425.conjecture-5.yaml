lean:
  module: FormalConjectures.OEIS.«228425»
  decl: OeisA228425.conjecture_5
  statement: |-
    theorem conjecture_5 (k m : ℕ) (hk : 2 < k) (hk10 : k ≤ 10) (hm : k < m) (hm100 : m ≤ 100) :
        (∀ n : ℕ, 1 < n → ∃ x y : ℕ, 0 < x ∧ 0 < y ∧ x + y = n ∧
          Nat.Prime (Nat.polygonalNumber k x + Nat.polygonalNumber m y)) ↔
        (k, m) ∈ sunPolygonalPairs
  context:
    - open OeisA228425
  definitions:
    - name: OeisA228425.sunPolygonalPairs
      kind: def
      text: |-
        /-- The set of pairs $(k, m)$ with $2 < k \le 10$ and $k < m \le 100$ conjectured by Zhi-Wei Sun
        to satisfy the property that any $n > 1$ can be written as $x + y$ ($x, y > 0$) with
        $p_k(x) + p_m(y)$ prime. -/
        def sunPolygonalPairs : Finset (ℕ × ℕ) :=
          {(3, 4), (3, 6), (3, 28), (3, 46), (3, 52), (3, 82), (3, 88),
           (4, 7), (4, 15), (4, 25), (4, 27), (4, 37), (4, 43), (4, 63), (4, 67), (4, 97),
           (6, 25), (6, 43), (6, 73),
           (7, 10), (7, 18), (7, 100),
           (10, 15), (10, 19), (10, 27), (10, 37), (10, 55), (10, 75), (10, 79), (10, 87), (10, 99)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/228425.lean#L98
