title: Exact special cases and a defect reduction for the chi-star change-of-variables problem
field: mathematics
tier: prose
statement: |-
  **Question.** Does the change of variables formula for \(\chi\) also hold for \(\chi^*\)?

  The nearby questions fix the intended context. The preceding item asks whether conjugate variables lie in the \(L^2\)-closure of cyclic gradients. The following item asks for a path-process change-of-variables rule for a causal free SDE. Thus the question concerns the multivariable microstates formula for an invertible noncommutative functional calculus, not merely the elementary scalar identity for one classical density.

  In the standard analytic version, \(X=(X_1,\ldots,X_n)\) is a self-adjoint tuple, \(F=(F_1,\ldots,F_n)\) and \(G\) are mutually inverse tuples of convergent self-adjoint noncommutative power series, and
  \[
  \mathscr JF(X)=\bigl(\partial_jF_i(X)\bigr)_{i,j}
  \in M_n\bigl(M\bar\otimes M^{\mathrm{op}}\bigr)
  \]
  is the free Jacobian. Voiculescu's microstates formula is
  \[
  \chi(F(X))
  =\chi(X)+
  (\operatorname{Tr}_n\otimes\tau\otimes\tau^{\mathrm{op}})
  \bigl(\log|\mathscr JF(X)|\bigr). \tag{1.1}
  \]
  Here \(\operatorname{Tr}_n\) is the **unnormalized** matrix trace. Equivalently, if the Fuglede--Kadison determinant is defined with the normalized trace \(\operatorname{tr}_n\), the last term is
  \[
  n\log\Delta_{\operatorname{tr}_n\otimes\tau\otimes\tau^{\mathrm{op}}}
  (\mathscr JF(X)). \]
  This normalization distinction is essential.
