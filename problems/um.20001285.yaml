title: Few-vertex Mahler bounds and pyramid cores
field: mathematics
tier: prose
statement: |-
  **Problem 21 (S. Reisner).** Improve the following theorem by finding a
  number \(N(n)>n+3\).

  **Theorem (M. Meyer--S. Reisner).** Let \(K\) be a convex polytope in
  \({\mathbb R}^n\), with at most \(n+3\) vertices (or, alternatively, at
  most \(n+3\) facets) and nonempty interior. Then
  \[
  {\cal P}(K)\geq \frac{(n+1)^{n+1}}{(n!)^2},
  \]
  with equality if and only if \(K\) is an \(n\)-dimensional simplex.
