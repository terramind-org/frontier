title: Are all Euclid numbers square-free
field: mathematics
tier: prose
statement: |-
  \section{Are all Euclid numbers square-free}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $p_1=2<p_2=3<\cdots$ enumerate primes and $P_n=\prod_{j=1}^{n}p_j$ for $n\ge1$. Put $E_n=P_n+1$, the $n$th Euclid number. A positive integer is squarefree when no prime square divides it.
  \paragraph{Statement recorded in the supplied source.}
  Is $q^2\nmid E_n$ for every $n\ge1$ and every prime $q$? \sref{statement}{2}
  \subsection{Short English statement}
  Does every primorial plus one have no repeated prime factor?
