title: Spray and holonomy classifications for affinely equivalent Finsler metrics
field: mathematics
tier: prose
statement: |-
  **Problem 12.0.4.** Describe all affinely equivalent Finsler metrics.

  The primary Burns--Matveev PDF first defines affine equivalence in the preceding lines: two Finsler metrics are affinely equivalent when a geodesic of the first, with its constant-speed affine parametrization, is a geodesic of the second. It then states the entire target:

  Affine changes of a parameter along one geodesic are harmless because a spray is two-homogeneous. In particular, multiplying a Finsler metric by a positive constant does not change its spray.
