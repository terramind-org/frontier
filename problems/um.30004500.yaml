title: Lower Bounds for Function-Field Quaternionic Periods
field: mathematics
tier: prose
statement: |-
  Fix a quaternion algebra $D$ over $\mathbb F_q(t)$. Let $F/\mathbb F_q(t)$ vary over quadratic extensions of genus $g$, let $K\subset D^\times(\mathbb A_F)$ be compact, and let $m$ be the index of $K\cap D^\times(\mathbb A_{\mathbb F_q(t)})$ in a maximal compact subgroup. For every normalized Hecke eigenfunction $f$ on

  $$D^\times(F)\backslash D^\times(\mathbb A_F)/(KZ(\mathbb A_F)),$$

  is its period over $D^\times(\mathbb F_q(t))\backslash D^\times(\mathbb A_{\mathbb F_q(t)})$ bounded below by $\Omega(m^{-C}q^{g/2})$ for a constant $C$ depending only on $q$ and $D$?
