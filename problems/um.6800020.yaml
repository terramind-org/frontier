title: Homogeneous Riemannian manifolds with nontrivial nullity
field: mathematics
tier: prose
statement: 1. If the normal holonomy group of an irreducible and full homogeneous submanifold $M^n$ of the sphere with $n \geq 2$ does not act transitively, then $M$ is the orbit of an $s$-representation. 2. The index of an irreducible symmetric space which is different from $G_2/SO(4)$ (or its symmetric dual) coincides with its reflective index,. 3. Open questions about homogeneous Riemannian manifolds with nontrivial nullity.; Are there examples which are not topologically trivial?; Are there examples $M = G/H$, with $G$ non-solvable?; Are there K\"ahler examples?; Are there examples in any dimension $d \geq 5$?
