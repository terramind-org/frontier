title: Contractibility of Quotient Curves from Additive-Group Actions
field: mathematics
tier: prose
statement: Let $X$ be a smooth affine contractible complex threefold with a nontrivial $\mathbb{G}_a$-action, let $\pi:X\to S=X//\mathbb{G}_a$ be the quotient, and let $\Gamma\subset S$ be a minimal closed curve such that $\pi^{-1}(S\setminus\Gamma)\simeq(S\setminus\Gamma)\times\mathbb{C}$ over $S\setminus\Gamma$. If $\Gamma$ is connected, is $\Gamma$ contractible?
