title: Exactification and the marked/unmarked cotangent boundary
field: mathematics
tier: prose
statement: "**Question 1.30 (Eliashberg).** Do symplectic and contact invariants of the cotangent bundle of a smooth manifold \\(M\\) remember the topology of \\(M\\)? For example, if \\(M_1\\) and \\(M_2\\) are homeomorphic but not diffeomorphic (e.g. exotic spheres), can one detect this by showing that \\(T^*M_1\\) and \\(T^*M_2\\) are not symplectomorphic, or that \\(ST^*M_1\\) and \\(ST^*M_2\\) are not contactomorphic? Related question: is the natural map from knots in \\(S^3\\) to Legendrian tori in \\(ST^*S^3\\cong S^3\\times S^2\\) injective? Ng's work is the first result in this direction."
