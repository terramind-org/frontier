title: A certified short-curve criterion and punctured-torus itinerary
field: mathematics
tier: prose
statement: |-
  **Problem 2.4 (K. Rafi).** Identify curves that are short along the preferred
  path (G_{X,Y}).

  F. Kassel and K. Rafi prove that, for any (X,Y\in\mathcal T(S)), there is
  a Thurston geodesic (G_{X,Y}), parametrized linearly in Thurston's shear
  (cataclysm) coordinates associated with a canonical lamination
  (\lambda(X,Y)), such that lengths of all simple closed curves along
  (G_{X,Y}) are convex functions (up to reparametrization).
