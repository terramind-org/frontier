lean:
  module: FormalConjectures.ErdosProblems.«509»
  decl: Erdos509.erdos_509
  statement: |-
    theorem erdos_509 : ∀ (f : ℂ[X]), f.Monic → f.natDegree ≠ 0 →
        ∃ (ι : Type), Nonempty (BoundedDiscCover {z | ‖f.eval z‖ ≤ 1} 2 ι)
  context:
    - open Erdos509
    - open Polynomial
    - open scoped Real
  definitions:
    - name: Erdos509.BoundedDiscCover
      kind: structure
      text: |-
        /-- An $r$-bounded disc cover of a subset of a metric space $M$
        is an indexed family of closed discs whose radii sum to at most $r$. -/
        structure BoundedDiscCover (S : Set M) (r : ℝ) (ι : Type v) where
          (C : ι → M)
          (R : ι → ℝ)
          (h_cover : S ⊆ ⋃ (i : ι), Metric.closedBall (C i) (R i))
          (h_summable : Summable (fun i : ι => R i))
          (h_bdd : ∑' i, R i ≤ r)
          (h_pos : ∀ i, 0 < R i)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/509.lean#L39
