title: Generating families, augmentations, and the missing quantifiers
field: mathematics
tier: prose
statement: |-
  (a) Is Linearized Contact Homology always equal to Generating Function Homology [definition?] for a (compact?) Legendrian \(L\subset J^1(\mathbb R^n)\)? As evidence for this conjecture, it was proved in the case where \(L\) is the double of a compact \(n\)-manifold with boundary \(M\subset\mathbb R^n\).

  (b) For a Legendrian \(L\subset\mathbb R^n\), does \(L\) admit a generating function [satisfying what restrictions?] if / only if the Linearized Contact Homology of \(L\) is (uniquely) defined?

  The official AIM PDF uses the convention
  \[
  J^1(M)=\mathbb R_u\times T^*M,
  \qquad \alpha=du-p\,dq,
  \]
  which is the usual \(T^*M\times\mathbb R_z\) with contact form \(dz-p\,dq\), up to the order and name of the coordinates. It prints Question 1.4 as follows (typographical line-break hyphens suppressed, but the tentative brackets preserved):

  Literally, however, that phrase does not specify a contact structure or the appropriate Legendrian dimension. The surrounding definition and part (a) strongly suggest the intended ambient space was \(J^1(\mathbb R^n)\). All mathematical conclusions below explicitly state their ambient space.

  The appended “Theme 1.5” begins on the next page and expressly says that it is not asking a question. It is neighboring workshop context, not part of Question 1.4.
