title: Kourovka Notebook Problem 17.126
field: mathematics
tier: prose
statement: |-
  Suppose that $G$ is a residually finite group
  satisfying the identity $[x,y]^n=1$. Must $[G,G]$ be locally
  finite?

  An equivalent question: let $G$ be a finite
  soluble group satisfying the identity $[x,y]^n=1$; is the Fitting
  height of $G$ bounded in terms of $n$? Cf. Archive, 13.34
