title: A boundary-frontier sieve for virtually abelian moduli bases
field: mathematics
tier: prose
statement: |-
  **Problem 2.1 (Viehweg).** Let \(M_H\) denote a moduli stack of
  canonically polarized manifolds. Can \(\pi_1(M_H)\) be almost abelian
  (almost abelian means having an abelian subgroup of finite index)? More
  precisely, if \(U\) is a nonsingular variety (not a point) mapping
  generically finitely to the moduli stack, can \(\pi_1(U)\) be almost
  abelian. The conjecture is no. The result is known for \(M_g\), and can be
  verified whenever some sort of local Torelli theorem holds. A \(U\) as
  above cannot be the complement in \(\mathbb P^n\) of a normal crossings
  divisor with fewer than \(n\) components. At present this is only known if
  the number of components of \(H\) is strictly smaller than \(n\) (see
  [VZ02]). The following two questions are motivated by work of Viehweg and
  Zuo [VZ02] and [VZ05].
