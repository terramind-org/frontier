title: Finite-colength covectors and a critical-rank punctured-spectrum counterexample
field: mathematics
tier: prose
statement: |-
  1. Let \((R,\mathfrak m)\) be a local ring of dimension \(d\), and let
     \(U=\operatorname{Spec}(R)\setminus\{\mathfrak m\}\). What is an obstruction
     theory for splitting vector bundles on \(U\), especially bundles of rank
     \(d-1\)?
  2. For a scheme \(X\) and vector bundle \(E\), what obstructs a surjection
     \(E\twoheadrightarrow\mathcal O_X\)?
  3. Can affine obstruction theory for projective modules be extended to more
     general classes of modules?
  4. Is there an Euler class group for reflexive modules over a regular local
     ring?
  5. What role does \(A^1\)-homotopy theory play in the non-affine case?

  The associated remarks ask whether a Jouanolou affine replacement is useful,
  warn that isomorphism classes of vector bundles on non-affine schemes are not
  in general \(A^1\)-invariant, and ask whether pullback along the incidence
  Jouanolou device
  \[
   p_1:J(V):=\mathbf P(V)\times\mathbf P(V^\vee)\setminus H
         \longrightarrow \mathbf P(V)
  \]
  is surjective on isomorphism classes of vector bundles. They also ask about
  Nisnevich/étale topology and realization to equivariant topological bundles.
