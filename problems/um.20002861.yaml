title: Hessian growth and the weighted dbar-Neumann spectrum
field: mathematics
tier: prose
statement: Let \(\phi:\mathbb C^n\to\mathbb R\) be a \(C^2\) plurisubharmonic function. Determine the relation between the eigenvalues of the complex Hessian of \(\phi\) and the compactness of the \(\bar\partial\)-Neumann operator on \(L^2_{(0,q)}(\mathbb C^n,e^{-\phi})\). See [Haslinger 2012] for \(n=1\). Determine the relation between the spectrum of the complex Laplacian \(\Box_\phi\) and the weight function \(\phi\). In particular, understand the bottom (infimum) of the essential spectrum.
