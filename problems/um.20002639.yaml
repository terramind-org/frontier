title: KPZ fixed-point status and a scaling-centering obstruction certificate
field: mathematics
tier: prose
statement: |-
  **Universality of the KPZ universality class:**
  Prove the existence and uniqueness of the KPZ universality class fixed point introduced by Corwin-Quastel in 1 spatial dimension. That is to say, consider any growth process \(h(t,x)\) and show that for an appropriate centering function \(\overline h_\epsilon\),
  \[
  \lim_{\epsilon\rightarrow\infty}\epsilon^{1/2}h(\epsilon^{-3/2}t,\epsilon^{-1}x)-\overline h_\epsilon
  \]
  has a limit as \(\epsilon\to0\) as a space-time process? Then show that the properties of this process identify it uniquely (see the conjectured properties in Corwin-Quastel).
