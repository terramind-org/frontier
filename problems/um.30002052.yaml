title: Hodge Structures on Periodic Cyclic Homology
field: mathematics
tier: prose
statement: For a smooth complex algebraic variety $X$, does $\operatorname{Perf}(X)$ remember any part of the mixed Hodge structure on its de Rham cohomology? More generally, does the periodic cyclic homology of every differential graded category carry a functorial Hodge-like structure?
