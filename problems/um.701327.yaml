title: Kourovka Notebook Problem 17.25
field: mathematics
tier: prose
statement: |-
  (S. P. Farbman). Let $X$ be the set of
  complex numbers $\alpha$ such that the group generated by the two
  $2\times 2$ matrices $I+\alpha e_{12}$ and $I+ e_{21}$ is not free
  on those generators.

  a) Does $X$ contain all rational numbers in the
  interval $(-4,4)$?

  b) Does $X$ contain any rational number in the
  interval $[27/7,4)$?

  Cf. 4.41 in Archive, 15.83, and (S. P. Farbman, *Publ. Mat.*, **39**
  (1995) 379--391).
