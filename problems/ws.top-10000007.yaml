title: Nonamenable subgraphs under uniform exponential growth
field: mathematics
tier: prose
statement: |-
  \section*{Nonamenable subgraphs under uniform exponential growth}\label{statement}

  \subsection{Definitions and mathematical statement}
  Let $G$ be an infinite connected graph of bounded degree, and let $B_G(v,n)$ be its graph-metric balls. Assume uniform volume growth in the source's sense: there is $C<\infty$ such that
  \[
  |B_G(v,n)|\le C|B_G(w,n)|\qquad(v,w\in V(G),\ n\ge1).
  \]
  Assume also exponential growth, so that for some $o\in V(G)$, $a>1$, and $b>0$, one has $|B_G(o,n)|\ge ba^n$ for every $n\ge1$. The first condition then supplies a uniform exponential lower bound at every center.

  Must there be an infinite connected subgraph $H\subseteq G$ and a constant $\varepsilon>0$ such that every nonempty finite $A\subset V(H)$ satisfies
  \[
  |\{y\in V(H)\setminus A:y\text{ is adjacent in }H\text{ to }A\}|
  \ge\varepsilon |A|?
  \]
  Can such an $H$ always be chosen acyclic, hence a tree? The subgraph need not be induced and its expansion is measured internally, using only edges retained in $H$.

  The uniformity hypothesis compares equal-radius balls at arbitrary vertices by one constant independent of their radius. Merely requiring a common exponential lower bound is weaker and is not the intended hypothesis: graphs formed from finite expanding branches can satisfy that lower bound without containing any nonamenable infinite subgraph. This problem asks whether uniform comparability of all ball volumes can replace vertex transitivity in the corresponding nonamenable-subgraph question.
  \subsection{Short English statement}
  Does uniform exponential volume growth force a nonamenable infinite subgraph or tree?
