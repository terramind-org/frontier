title: Several Complex Variables Problem List — Problem 47
field: mathematics
tier: prose
statement: |-
  Given a compact complex hypersurface X in $\mathbb{P}^n$ with degree at least $n+2$ and
  only normal crossing singularities. Show that the infinitesimal Kobayashi
  pseudometric
  on $\mathbb{P}^n \setminus X$ is degenerate at most on a complex hypersurface.\\
  -N. Sibony, sibony@anh.matups.fr
