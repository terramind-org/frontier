title: Kourovka Notebook Problem 4.24
field: mathematics
tier: prose
statement: |-
  Suppose $T$ is a non-abelian Sylow 2-subgroup
  of a finite simple group $G$.

  a) Suppose $T$ has nilpotency class $n$. The
  best possible bound for the exponent of the center of $T$ is
  $2^{n-1}$. This easily implies the bound $2^{n(n-1)}$ for the
  exponent of $T$, however, this is almost certainly too crude. What
  is the best possible bound?

  d) Find a ``small number'' of subgroups
  $T_1,\ldots ,T_n$ of $T$ which depend only on the isomorphism
  class of $T$ such that $\{ N_G(T_1), \ldots , N_G(T_n)\}$
  together control fusion in $T$ with respect to $G$ (in the sense
  of Alperin).

  [Archived solved part(s) of 4.24:]
  Suppose that $T$ is a non-abelian Sylow 2-subgroup of a finite
  simple group $G$.

  b) Is it possible that $T$ is the direct product of two proper
  subgroups?

  c) Is $T'=\Phi (T)$?
