lean:
  module: FormalConjectures.Other.GerstenhaberThreeMatrices
  decl: Gerstenhaber.finrank_adjoin_triple_le
  statement: |-
    theorem finrank_adjoin_triple_le :
        ∀ (K : Type*) [Field K] (n : ℕ) (A B C : Matrix (Fin n) (Fin n) K),
          ({A, B, C} : Set (Matrix (Fin n) (Fin n) K)).Pairwise Commute →
            Module.finrank K (Algebra.adjoin K {A, B, C}) ≤ n
  context:
    - open Gerstenhaber
    - "variable {K : Type*} [Field K] {n : ℕ}"
  definitions: []
