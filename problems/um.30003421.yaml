title: Support Ideals in Constructible-Function Convolution Algebras
field: mathematics
tier: prose
statement: |-
  For the convolution algebra of constructible functions associated with quiver data $\Pi$, is the direct sum of the homogeneous subspaces consisting of functions $f$ such that
  $$
  \dim\operatorname{supp}(f)<\dim G(d)-q_D^C(d/D)
  $$
  an ideal?
