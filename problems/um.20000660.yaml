title: Endpoint variation and a correlation-budget criterion for Liouville short sums
field: mathematics
tier: prose
statement: |-
  Can we obtain lower bounds for
  \[
  \int_X^{2X}\left|\sum_{x\le n\le x+H}\lambda(n)\right|\,dx?
  \]
  In particular, can we get a lower bound of the form
  \(XH^{1/2-\epsilon}\)?
