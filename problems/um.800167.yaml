title: Moments of L-functions — Moments of the Riemann zeta function — Problem 17
field: mathematics
tier: prose
statement: |-
  Jutila proved the Weyl-strength twelfth moment bound
  \[\sum_{t_f \leq T} \frac{L\left(\frac{1}{2},f\right)^{12}}{L(1,\operatorname{ad}f)} \ll_{\varepsilon} T^{4 + \varepsilon},\]
  where the sum is over Hecke--Maass cusp forms of level 1 and spectral parameter at most $T$. Can one prove a level-aspect analogue of this, where one sums over Hecke--Maass cusp forms of level $q$ and bounded spectral parameter?\\
  (Peter Humphries, Virginia)
