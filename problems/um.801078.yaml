title: "Henon Maps: Open Problems — Question 30"
field: mathematics
tier: prose
statement: |-
  Under which circumstances is it possible that there exist saddle points $p$ and $q$, and relative
  open subsets $U\subset W^u(p)$ and $V\subset W^u(q)$
  such that $U\cap K^+$ is biholomorphic to $V\cap K^+$?
