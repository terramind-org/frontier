id: green16.zhao-question
title: Ben Green's Open Problem 16 (zhao_question)
field: mathematics
tier: proof
statement: |-
  From [Yufei Zhao]: Is there a subset of $\{1, \ldots, N\}$ of size
  $N^{1/3 - o(1)}$ with no nontrivial solutions to $x + 2y + 3z = x' + 2y' + 3z'$?
ams:
  - 5
  - 11
tags:
  - greens-open-problems
references:
  - label: Ben Green's Open Problem 16
    url: https://people.maths.ox.ac.uk/greenbj/papers/open-problems.pdf#problem.16
