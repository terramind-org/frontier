  licence: Apache-2.0
upstream_status: open
lean:
  module: FormalConjectures.GreensOpenProblems.«16»
  decl: Green16.zhao_question
  statement: |-
    theorem zhao_question :
        ∃ h : ℕ → ℝ, Tendsto h atTop (𝓝 0) ∧
          ∀ᶠ N in atTop, (g N : ℝ) ≥ (N : ℝ) ^ (1 / 3 - h N)
  context:
    - open Green16
    - open Finset Real Filter Topology
  definitions:
    - name: Green16.g
      kind: def
      text: |-
        /-- The maximum size of a Zhao-solution-free subset of $[N]$. -/
        noncomputable def g (N : ℕ) : ℕ :=
          sSup {k : ℕ | ∃ A : Finset ℕ, A ⊆ Icc 1 N ∧ ZhaoSolutionFree A ∧ A.card = k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/GreensOpenProblems/16.lean#L79
