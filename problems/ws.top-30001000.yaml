statement: |-
  \section{Wolff Cone-Decomposition and Local-Smoothing Conjectures}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For functions $f_k$ whose Fourier supports lie in $\delta$-plates of the truncated light cone in $\mathbb{R}^{d+1}$, does $\lVert\sum_k f_k\rVert_p\leq C_\varepsilon\delta^{-\alpha(p)-\varepsilon}(\sum_k\lVert f_k\rVert_p^p)^{1/p}$ hold for $p>2(d+1)/(d-1)$, where $\alpha(p)=d(1/2-1/p)-1/2$? Does the stronger mixed-norm version with $(\sum_k\lVert f_k\rVert_p^2)^{1/2}$ and exponent $\beta(p)=(d-1)/4-(d+1)/(2p)$ hold for $p>2+4/(d-1)$? Do the associated Sogge local-smoothing and cone-multiplier estimates hold in their conjectured ranges?
  \par\smallskip\textit{Formulation references:} \sref{statement}{1}, \sref{statement}{2}.
  \subsection{Short English statement}
  For functions $f_k$ whose Fourier supports lie in $\delta$-plates of the truncated light cone in $\mathbb{R}^{d+1}$, does $\lVert\sum_k f_k\rVert_p\leq C_\varepsilon\delta^{-\alpha(p)-\varepsilon}(\sum_k\lVert f_k\rVert_p^p)^{1/p}$ hold for $p>2(d+1)/(d-1)$, where $\alpha(p)=d(1/2-1/p)-1/2$? Does the stronger mixed-norm version with $(\sum_k\lVert f_k\rVert_p^2)^{1/2}$ and exponent $\beta(p)=(d-1)/4-(d+1)/(2p)$ hold for $p>2+4/(d-1)$? Do the associated Sogge local-smoothing and cone-multiplier estimates hold in their conjectured ranges?
