schema: 1
id: rudinsconjecture.rudins-conjecture-unique
title: Rudin's conjecture on squares in arithmetic progressions (rudins_conjecture_unique)
field: mathematics
tier: proof
statement: |-
  The strongest form of Rudin's conjecture also asserts *uniqueness*: for $N \ge 6$, any non-trivial
  arithmetic progression attaining the maximum $Q(N)$ has common difference $24$. (Its initial term
  is then forced by $\gcd(24, a) = 1$; the progression $24n + 1$ is the canonical representative.)
ams:
  - 11
tags:
  - wikipedia
references:
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Rudin%27s_conjecture
