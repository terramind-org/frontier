statement: |-
  Let $D0$ denote the class of finite groups of
  deficiency zero, i. e. having a presentation $\left< X\mid
  R\right>$ with $|X|=|R|$.

  a) Does $D0$ contain any 3-generator
  $p
  $-group for $p \geq 5$?

  c) Do soluble $D0
  $-groups have bounded
  derived length?

  d) Which non-abelian simple groups can occur
  as composition
  factors of $D0
  $-groups?

  [Archived solved part(s) of 8.12:]
  b) Let $D0$ denote the class of finite groups of deficiency zero,
  i. e. having a presentation $\left< X\mid R\right>$ with
  $|X|=|R|$. Are the central factors of nilpotent $D0
  $-groups 3-generated?
