title: Existence of Irreducible Hecke Eigensheaves
field: mathematics
tier: prose
statement: For every irreducible local system $E$ for the Langlands dual group on a smooth projective curve, does there exist a nonzero Hecke eigensheaf $F$ on $\operatorname{Bun}_G$ with eigenvalue $E$ whose restriction to every irreducible component of $\operatorname{Bun}_G$ is an irreducible perverse sheaf?
