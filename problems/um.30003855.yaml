title: Sharp Normalized Steklov Supremum in Higher Dimensions
field: mathematics
tier: prose
statement: Among smooth bounded domains $\Omega\subset\mathbb R^n$ with $n\geq3$, determine the supremum of $$\sigma_1(\Omega)|\partial\Omega|^{1/(n-1)}$$ and characterize the domain, or degenerating sequence of domains, on which it is attained.
