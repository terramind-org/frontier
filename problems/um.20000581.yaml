statement: "**Curvature conditions and bi-Lipschitz embeddings.** Let $X$ be a doubling metric space. Can one formulate a curvature-type condition which, if satisfied by $X$, ensures that $X$ admits a bi-Lipschitz embedding into some finite-dimensional Euclidean space?"
