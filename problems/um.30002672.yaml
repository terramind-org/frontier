title: Line Discrepancy Centers and Orthic-Triangle Coverings
field: mathematics
tier: prose
statement: Two independent questions are posed. First, for every $\alpha>0$, does there exist $\beta<\alpha$ such that every two-colored $n$-point set $P\subset\mathbb{R}^2$ with line discrepancy at most $\alpha n$ has a point $q$ through which every line has discrepancy at most $\beta n$? Second, if an acute triangle $T$ is covered by acute triangles $S_1,\ldots,S_N$, must $\xi(T)\leq\sum_{i=1}^N\xi(S_i)$, where $\xi$ denotes the perimeter of the orthic triangle?
