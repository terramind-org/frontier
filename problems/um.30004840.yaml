title: Morita Classification of Quantum SU-Two Projective Representations
field: mathematics
tier: prose
statement: If $(M_F,\alpha_F)$ is an ergodic coaction of $L^\infty(FO_F)$, does there exist $G\in F_q$ such that $M_G$ is equivariantly $W^*$-Morita equivalent to a coideal von Neumann subalgebra of $L^\infty(FO_G)$? If not, can such coactions be characterized? If $(M,\alpha)$ is an ergodic coaction of $L^\infty(SU_q(2))$ on a type-I von Neumann algebra, is it equivariantly $W^*$-Morita equivalent to a coideal von Neumann subalgebra?
