id: um.30002386
title: Fluctuation Order in First-Passage Percolation
field: mathematics
tier: prose
statement: |-
  Determine the order of the fluctuations of the first-passage-percolation metric

  $$\rho(x,y)=\inf_{(u_j):x\leadsto y}\sum_j W(u_j)$$

  on $\mathbb Z^d$, where the vertex or edge weights $W(u_j)$ are random and nonnegative.
