title: Spaces with Lower Ricci Curvature — Conjecture 7 (energy identity)
field: mathematics
tier: prose
statement: |-
  Let $(M^n_j,g_j,x_j)\to (X,d,x)$ satisfy $\mathrm{Ric}_j\geq -\lambda$ and the noncollapsing condition $\mathrm{Vol}(B_1(x_j))\geq v>0$, then as measures the scalar curvature converges
  \begin{gather*}
  R_j \mathrm{d}v_j\to R_X \mathcal{H}^n+2\theta_x \mathcal{H}^{n-1}_\Sigma+2\pi(1-r_x)\mathcal{H}^{n-2}_S ,
  \end{gather*}
  where $R_X\colon X\to {\mathbb{R}}$ is a locally $L^1$ function which is bounded from below, $\Sigma$ is an $n-1$ rectifiable set with $\theta_x\leq 1$, and $2\pi(1-r_x)\mathcal{H}^{n-2}_S$ is an $n-2$-rectifiable measure supported on the top stratum of the singular set $\operatorname{Sing}(X)$.
