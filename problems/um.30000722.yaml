title: Rotational Dimension and Colin de Verdière Invariants
field: mathematics
tier: prose
statement: Let $\operatorname{dim}_{\mathrm{rot}}(G)$ be the rotational dimension and $\mu(G)$ the Colin de Verdière invariant. Is $\operatorname{dim}_{\mathrm{rot}}(G)\leq\mu(G)$ for every graph $G$? If $G_1\cap G_2$ is complete, is $\operatorname{dim}_{\mathrm{rot}}(G_1\cup G_2)\leq\max\{\operatorname{dim}_{\mathrm{rot}}(G_1),\operatorname{dim}_{\mathrm{rot}}(G_2),|G_1\cap G_2|+1\}$? Finally, is $\operatorname{dim}_{\mathrm{rot}}(G)\leq3$ exactly when $G$ has no $K_5$ minor?
