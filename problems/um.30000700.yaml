title: IM-Sharing Variants of Theorem H for Entire Functions
field: mathematics
tier: prose
statement: Let $f$ be a nonconstant entire function, let $k\geq2$, and let $a,b\in\mathbb{C}$ with $b\neq0$ and $b\neq a$. Suppose that $f$ and $f'$ share the value $a$ ignoring multiplicity, and that $f^{(k)}(z)=b$ whenever $f'(z)=b$. Must $f(z)=de^{cz}+c^{-1}a$ for nonzero constants $c,d$ satisfying $c^{k-1}=1$?
