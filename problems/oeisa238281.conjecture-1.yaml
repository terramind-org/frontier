lean:
  module: FormalConjectures.OEIS.«238281»
  decl: OeisA238281.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : 1 < n) : 0 < a n"
  context:
    - open OeisA238281
  definitions:
    - name: OeisA238281.a
      kind: def
      text: |-
        /-- $a(n)$ is the number of integers $0 < k < n$ such that the two intervals $(kn, (k+1)n)$ and
        $((k+1)n, (k+2)n)$ contain the same number of primes. -/
        def a (n : ℕ) : ℕ :=
          ∑ k ∈ Finset.Ico 1 n,
            if Nat.primeCounting ((k + 1) * n) - Nat.primeCounting (k * n) =
               Nat.primeCounting ((k + 2) * n) - Nat.primeCounting ((k + 1) * n) then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/238281.lean#L35
