title: Open Problems and Questions about Geodesics — Question 32 (Paternain)
field: mathematics
tier: prose
statement: |-
  *Consider a magnetic flow on a closed surface of genus $\ge 2$ and an energy level such that the topological entropy vanishes. Suppose that the magnetic geodesics on this level do not have conjugate points. Is the system locally symmetric in the sense that the metric has constant curvature and the magnetic form
  is a constant multiple of the volume form?*
