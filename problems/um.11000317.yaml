title: Problem 4.11 — Determine whether the natural homomorphisms ˜H ∗(AutF2g; Q)−→˜H ∗(Mg,1; Q) ˜H ∗(OutF2g; Q)−→˜H ∗(Mg,∗; Q) induced by…
