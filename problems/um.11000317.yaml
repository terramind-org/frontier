statement: Determine whether the natural homomorphisms ˜H ∗(AutF2g; Q)−→˜H ∗(Mg,1; Q) ˜H ∗(OutF2g; Q)−→˜H ∗(Mg,∗; Q) induced by the inclusions Mg,1→AutF2g, Mg,∗→OutF2g are trivial or not. We refer to a result of Wahl [ 107] for a homotopy theoretical property of the homomorphism Mg,1→AutF2g where g tends to ∞.
