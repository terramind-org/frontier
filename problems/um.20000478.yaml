title: Scalar dbar normalization and planar Hermite multipoles for the elliptic Gaussian
field: mathematics
tier: prose
statement: |-
  Analyze the condition given by
  \[
  \overline{\partial}\phi=\overline{H_n}e^{-NQ},
  \]
  where \(Q=|z|^2+2t\operatorname{Re}(z^2)\) and where
  \(\overline{H_n}\) is Hermite.
