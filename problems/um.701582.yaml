title: Kourovka Notebook Problem 19.34
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finitely generated group such that for every element $g\in G$ the set of commutators $\{[x,g]\mid x\in G\}$ is a subgroup of $G$. Is it true that $G$ is residually nilpotent?

  The answer is affirmative if $G$ is finite.
