title: Hiraga–Ichino–Ikeda Degrees for Essentially Discrete Series
field: mathematics
tier: prose
statement: For an essentially discrete-series representation $\pi$ of $G$ with extended parameter $(\phi,\rho)$, prove the Hiraga–Ichino–Ikeda formula $d(\pi,\nu_G)=\frac{\dim\rho}{|S_\phi|}\lvert\gamma(0,\phi,\operatorname{Ad}_G)\rvert$.
