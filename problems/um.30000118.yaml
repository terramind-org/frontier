title: Entropy Numbers of Vector-Valued Sequence Operators
field: mathematics
tier: prose
statement: "Let $T : X \\to Y$ be a bounded linear operator between Banach spaces, and let $\\widetilde{T} : \\ell_p^N(X) \\to \\ell_q^N(Y)$ be its coordinatewise lift $(x_1, \\ldots, x_N) \\mapsto (Tx_1, \\ldots, Tx_N)$. How do the entropy numbers $e_k(\\widetilde{T})$ of $\\widetilde{T} : \\ell_p^N(X) \\to \\ell_q^N(Y)$ relate quantitatively to the entropy numbers $e_k(T)$ of $T : X \\to Y$?"
