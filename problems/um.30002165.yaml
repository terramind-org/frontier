title: Weighted Condenser-Energy Minimizers
field: mathematics
tier: prose
statement: Let $\mathbf A=(A_i)_{i\in I}$ be a countable condenser of pairwise disjoint nonempty closed subsets of $\mathbb R^n$, let $\mathbf f=(f_i)$ be an admissible external field, let $\mathbf a=(a_i)$ satisfy $a_i>0$ and $\sum_i a_i<\infty$, and let $g\in C(\mathbb R^n)$ satisfy $0<c_1<g<c_2<\infty$. If $G_{\mathbf f}(\mathbf A,\mathbf a,g)<\infty$, does there exist $\boldsymbol\lambda\in\mathcal E_{\mathbf f}^+(\mathbf A,\mathbf a,g)$ with $G_{\mathbf f}(\boldsymbol\lambda)=G_{\mathbf f}(\mathbf A,\mathbf a,g)$?
