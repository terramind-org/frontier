title: Absolute Continuity for Symplectic $\mathbb Z^2$-Actions
field: mathematics
tier: prose
statement: Let $\alpha_0$ be the action on $\mathbb T^4$ of a real-diagonalizable maximal abelian subgroup of $\operatorname{Sp}(4,\mathbb Z)$, and let $\alpha$ be a $\mathbb Z^2$-action whose elements are homotopic to the corresponding elements of $\alpha_0$. If an $\alpha$-invariant Borel probability measure $\mu$ satisfies $h_*\mu=\lambda$ for the semiconjugacy $h$ and Lebesgue measure $\lambda$, prove that $\mu$ is absolutely continuous and $\mu=\omega\wedge\omega$ for a Lebesgue-measurable exterior two-form $\omega$ that is closed in an appropriate sense.
