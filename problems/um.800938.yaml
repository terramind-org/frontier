title: Open Problems and Questions about Geodesics — Conjecture 18
field: mathematics
tier: prose
statement: |-
  Two Riemannian manifolds $(M_1,g_1)$ and $(M_2,g_2)$ have $C^k$-conjugate geodesic flows if there is an invertible map $h: S^M_1 \to S^M_2$ such that $h$ and $h^{-1}$ are $C^k$ and
  $h \circ \phi^1_t = \phi^2_t \circ h$ for all $t$. Here $\phi^i_t$ is the geodesic flow for the metric $g_i$. A long standing conjecture is

  Compact Riemannian manifolds with negative curvature must be isometric if they have $C^0$-conjugate geodesic flows.
