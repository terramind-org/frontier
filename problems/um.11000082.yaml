title: Question 7.6 — Does spec(Ig(k)) have bounded multiplicity for k≥ 3?
field: mathematics
tier: prose
statement: Does spec(Ig(k)) have bounded multiplicity for k≥ 3? One way to get around unbounded multiplicities is to look at the simple length spectrum, which is the subset of spec(Mod g) coming from pseudo-Anosovs represented by simple (i.e. non- self-intersecting) geodesic loops in Mg.
