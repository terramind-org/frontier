lean:
  module: FormalConjectures.OEIS.«241898»
  decl: OeisA241898.conjecture_2
  statement: |-
    theorem conjecture_2 :
        ∀ n : ℕ, ∃ a b c d : ℕ,
          a ≠ 7 ∧ b ≠ 7 ∧ c ≠ 7 ∧ d ≠ 7 ∧ a ^ 2 + b ^ 2 + c ^ 2 + d ^ 2 = n
  context:
    - open OeisA241898
    - open Finset
  definitions:
    - name: OeisA241898.a
      kind: def
      text: |-
        /-- Largest integer $k$ such that $n = k^2 + \dots$ is a decomposition of $n$ into a sum
        of at most four nondecreasing squares. -/
        def a (n : ℕ) : ℕ :=
          ((Icc 1 n).filter (fun k => isValidBase n k)).max.getD 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/241898.lean#L45
