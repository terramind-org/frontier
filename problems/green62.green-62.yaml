lean:
  module: FormalConjectures.GreensOpenProblems.«62»
  decl: Green62.green_62
  statement: |-
    theorem green_62 :
        ∀ᶠ p in atTop, p.Prime →
          let A := (Finset.range p).filter Nat.Prime
          ∀ x : ℕ, 1 ≤ x ∧ x < p →
            ∃ a₁ ∈ A, ∃ a₂ ∈ A, (x : ZMod p) = (a₁ * a₂ : ZMod p)
  context:
    - open Green62
    - open Filter
  definitions: []
