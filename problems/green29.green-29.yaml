  decl: Green29.green_29
  statement: |-
    theorem green_29 :
        ∃ C c : ℝ, 0 < C ∧ 0 < c ∧
          ∀ {G : Type*} [Group G] [DecidableEq G] (K : ℝ) (A : Finset G),
            1 ≤ K → IsApproximateSubgroup K (A : Set G) →
              ∃ S : Finset G, C * K ^ (-c) * (A.card : ℝ) ≤ (S.card : ℝ) ∧
                S ^ 8 ⊆ A ^ 4
  context:
    - open Green29
    - open scoped Pointwise
  definitions: []
