title: Aggregate singular sets of minimizing laminations and the codimension-one stable norm
field: mathematics
tier: prose
statement: |-
  8. (Franz Auer) Conjecture: If $T\in C_{n-1}M$ is a minimizing closed current, then the Hausdorff dimension of the corresponding singularity set is at most $n-7$.

  **Problem 28 (Franz Auer).** If $M^n$ is a compact Riemannian manifold and $T\in C_{n-1}M$ is a minimizing closed real current, conjecturally the Hausdorff dimension of the corresponding singularity set is at most $n-7$.

  **Problem 29.** Define the stable norm on $H_q(M,\mathbb R)$ by
  \[
   \|h\|=\inf\{\mathbf M(T):[T]=h\}.
  \]
  This is an analogue of Mather's \(\beta\)-function. Study convexity and differentiability properties of
  \[
   B=\{h\in H_q(M,\mathbb R):\|h\|\leq 1\}.
  \]
