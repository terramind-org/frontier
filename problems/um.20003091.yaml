title: Hausdorff noncomputability and a certified punctured-torus classifier
field: mathematics
tier: prose
statement: |-
  **Problem 2.1.** Is there an algorithm to find the maximally stretch
  lamination?

  The long row
  of dots after the question is a printed separator. The following sentence,
  “Generically, a Thurston geodesic connecting two points in Teichmüller space
  is not unique,” introduces the envelope question numbered 2.2; it is not part
  of Problem 2.1.

  The implicit input is a pair of marked hyperbolic structures (X,Y) on a
  finite-type surface (S). The source does not specify either a representation
  of (X,Y) or a representation of the requested lamination. That omission is
  mathematically decisive: exact symbolic input, approximate numerical input,
  and a promised generic stratum lead to different algorithmic questions.
