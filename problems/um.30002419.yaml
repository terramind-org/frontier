title: The Optimal Constant in One-Dimensional Sequence Discrepancy
field: mathematics
tier: prose
statement: Let $I=\{x\in\mathbb R:0\leq x<1\}$. Determine the optimal constant $c^*=\sup\{c:\text{every sequence }(x_n)\subset I\text{ satisfies }D_N\geq c(\log N)/N\text{ for infinitely many }N\}$.
