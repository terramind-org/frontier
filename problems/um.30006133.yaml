title: Complex and Quaternionic Affine Quermassintegral Inequalities
field: mathematics
tier: prose
statement: |-
  Let $\mathbb F\in\{\mathbb C,\mathbb H\}$, put $p=\dim_{\mathbb R}\mathbb F$, let $1\leq m<n$, and let $K\subset\mathbb F^n$ be a convex body with nonempty interior. Write $\kappa_j$ for the volume of the Euclidean unit ball in $\mathbb R^j$, equip the Grassmannian $\operatorname{Gr}_m(n,\mathbb F)$ with Haar probability measure $dE$, and let $P_E$ be orthogonal projection onto $E$. Prove

  $$|K|^{-m}\geq\frac{(\kappa_{mp})^n}{(\kappa_{np})^m}\int_{\operatorname{Gr}_m(n,\mathbb F)}|P_EK|^{-n}\,dE,$$

  with equality exactly for real, complex, or quaternionic ellipsoids, and prove the associated projection inequality

  $$\frac{\kappa_{np}}{\kappa_{mp}}\int_{\operatorname{Gr}_m(n,\mathbb F)}|P_EK|\,dE\geq |K|^{m/n}$$.
