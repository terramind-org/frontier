statement: |-
  \section{Joint Design of Bridging Schedules and Transport Maps}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  Bridging densities form intermediate probability distributions between a base and target. An $\alpha$-divergence measures their discrepancy using the source\textquotesingle s chosen convention. A contraction factor $\omega<1$ bounds error reduction after one map-and-density step.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The divergence convention, contraction metric, map class, and exact scheduler are not specified in the supplied question.

  Source-record limitation: The schedule, map class, divergence convention, and contraction metric required by the target are absent.
  \paragraph{Statement recorded in the supplied source.}
  Combine an optimized schedule of bridging densities, minimizing successive $\alpha$-divergences, with a class of bridging densities and a parametrized transport map $T$ for which the contraction factor $\omega<1$ is guaranteed at every step. \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-22.
  \subsection{Short English statement}
  Jointly choose intermediate densities and transport maps with guaranteed contraction at every step.
