title: Effective Factorization in Monoid Rings
field: mathematics
tier: prose
statement: Let $R$ be a Dedekind domain, let $M$ be a submonoid of a rational vector space, and fix $n\geq3$, $c\geq2$, and $A\in SL_n(R[M])$. It is known that some $t\in\mathbb{N}$ satisfies $A\in E_n(R[M^{1/c^t}])$. Can one always take $t=1$? Can the effective factorization of $A$ into elementary matrices over a suitable root extension of $R[M]$ be accelerated?
