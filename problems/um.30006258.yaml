title: Invariant Centers of Small Quantum Groups
field: mathematics
tier: prose
statement: For a small quantum group of type $A$, is the invariant center $z(u_q(\mathfrak g))^G$ isomorphic to the full center $z(u_q(\mathfrak g))$? More generally, determine the bigraded and multiplicative structure of the center and construct a natural Weyl-group action compatible with its diagonal-coinvariant model.
