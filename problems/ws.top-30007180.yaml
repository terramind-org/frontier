  \section*{Metric Markov cotype two of ell1}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Does the real Banach space ell1 have finite metric Markov cotype two, uniformly over all finite stationary reversible Markov chains and all positive integer times?
