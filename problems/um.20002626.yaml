id: um.20002626
title: Finite-time tilt symmetry and the corrected Airy2 scaling
field: mathematics
tier: prose
statement: |-
  Compute multi-point (spatial) distribution for KPZ with various initial data. For example, with $\mathcal Z_0(x)=\delta_{x=0}$, let
  \[
  \mathcal Z(t,x)=e^{-x^2/(2t)+t^{1/3}A_t(t^{-2/3}x)-t/24}.
  \]
  What is the distribution $F(\xi_1,\xi_2)$ such that
  \[
  \mathbb P\bigl(A_t(x_1)\leq \xi_1,A_t(x_2)\leq \xi_2\bigr)=F(\xi_1,\xi_2)?
  \]
  Perhaps easier, show that as $t$ goes to infinity and space is scaled like $t^{2/3}x$, the process $A_t(t^{2/3}x)$ converges to the Airy$_2$ process in $x$.
