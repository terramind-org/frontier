lean:
  module: FormalConjectures.OEIS.«166944»
  decl: OeisA166944.conjecture
  statement: |-
    theorem conjecture (R : ℕ) (hR : 5 < R) (hrec : IsDifferenceRecord R) :
        IsGreaterTwinPrime R
  context:
    - open OeisA166944
  definitions:
    - name: OeisA166944.IsGreaterTwinPrime
      kind: def
      text: |-
        /-- A prime $p$ is the greater of a twin prime pair if $p$ and $p - 2$ are both prime. -/
        def IsGreaterTwinPrime (p : ℕ) : Prop := p.Prime ∧ (p - 2).Prime
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/166944.lean#L72
    - name: OeisA166944.IsDifferenceRecord
      kind: def
      text: |-
        /--
        A value $R$ is a difference record if there exists $n \ge 2$ such that $d(n) = R$ and $R$
        is strictly larger than all previous differences $d(k)$ for $2 \le k < n$.-/
        def IsDifferenceRecord (R : ℕ) : Prop :=
          ∃ n : ℕ, 2 ≤ n ∧ d n = R ∧ ∀ k : ℕ, 2 ≤ k → k < n → d k < R
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/166944.lean#L75
