id: um.30003470
title: Covering Balls by Translated Slabs
field: mathematics
tier: prose
statement: For $d>2$, does there exist a constant $C(d)$ such that, whenever $n_i\in S^{d-1}$ are unit directions and $\varepsilon_i>0$ satisfy $\sum_i\varepsilon_i>C(d)$, suitable translates of the slabs $$\{x\in\mathbb R^d:a_i\leq\langle x,n_i\rangle\leq a_i+\varepsilon_i\}$$ cover the unit ball?
