title: Kourovka Notebook Problem 10.45
field: mathematics
tier: prose
statement: |-
  Let $R$ be an associative ring with
  identity. Let $n \geq 3$ and suppose that $N$ is a
  subgroup of $ GL_n(R)$ which is normalized by $E_n(R)$. Prove that
  either $ N$ contains $E_n(R)$ or $\Lambda _I[N,E_n(R)]=1$ for a
  suitable ideal $I \ne R$ of $R$.
