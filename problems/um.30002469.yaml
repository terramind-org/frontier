title: Graph Blocks and Coset Partition Refinements
field: mathematics
tier: prose
statement: |-
  Which properties force a graph $G$ to contain a $k$-block, meaning a maximal set of at least $k$ vertices no two of which can be separated by fewer than $k$ other vertices? How does
  $$\beta(G)=\max\{k:G\text{ has a }k\text{-block}\}$$
  relate to other graph invariants?
