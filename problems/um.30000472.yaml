title: Aronszajn-Tree Models from Nonstationary-Ideal Forcing
field: mathematics
tier: prose
statement: Can an iteration of the nonstationary-ideal forcing method reprove Abraham's theorem that, if $\kappa<\lambda$, $\kappa$ is $\lambda$-supercompact, and $\lambda$ is weakly compact, then there is a generic extension with no $\aleph_2$- or $\aleph_3$-Aronszajn trees? At minimum, can it construct a model with no special Aronszajn trees on $\aleph_2$ or $\aleph_3$?
