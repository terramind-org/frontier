id: oeisa229232.conjecture-2
title: Undirected circular permutations with adjacent products minus one all prime (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture: For any integer $n > 1$, there is a permutation $\pi(1), \dots, \pi(n)$ of $1, \dots, n$
  such that the $n$ numbers $2\pi(1)\pi(2)-1, \dots, 2\pi(n-1)\pi(n)-1, 2\pi(n)\pi(1)-1$ are
  all prime.
  - _Zhi-Wei Sun_
