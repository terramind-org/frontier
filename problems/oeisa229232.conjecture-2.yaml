  module: FormalConjectures.OEIS.«229232»
  decl: OeisA229232.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : n > 1) :
        ∃ π : Equiv.Perm (Fin n), ∀ i : Fin n,
          (2 * ((π i).val + 1) *
            ((π ⟨(i.val + 1) % n, Nat.mod_lt _ (by omega)⟩).val + 1) - 1).Prime
