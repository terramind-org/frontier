lean:
  module: FormalConjectures.OEIS.«71532»
  decl: OeisA71532.conjecture2
  statement: |-
    theorem conjecture2 :
        ∃ N : ℕ, ∀ n : ℕ, N ≤ n → (a n : ℝ) > Real.sqrt (n : ℝ)
  context:
    - open OeisA71532
    - open Finset Filter
    - open scoped Asymptotics
  definitions:
    - name: OeisA71532.a
      kind: def
      text: |-
        /-- The sequence $a(n) = -\sum_{k=1}^n (-1)^{\lfloor (3/2)^k \rfloor}$. -/
        def a (n : ℕ) : ℤ :=
          - ∑ k ∈ Icc 1 n, (-1 : ℤ) ^ (3 ^ k / 2 ^ k)
