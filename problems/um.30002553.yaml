title: Unconditional Uniqueness for Critical Equivariant Wave Maps
field: mathematics
tier: prose
statement: |-
  Let $M^n$ and $N^\ell$ be rotationally symmetric manifolds with metrics $dr^2+h(r)^2d\omega^2$ and $d\phi^2+g(\phi)^2d\chi^2$, where $n\geq 3$, $k\geq 1$, and $\ell=k(k+n-2)$. For an admissible $M$, consider the equivariant wave-map equation

  $$\phi_{tt}-\phi_{rr}-(n-1)\frac{h'(r)}{h(r)}\phi_r+\frac{\ell}{h(r)^2}g(\phi)g'(\phi)=0.$$

  Does its Cauchy problem have unconditional uniqueness in the critical space $H^{n/2}\times H^{n/2-1}$, without imposing an additional Strichartz-space condition?
