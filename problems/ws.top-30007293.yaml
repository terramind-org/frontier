  \section*{Absolute bicentralizer conjecture for type III$_1$ factors}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every type $III_{1}$ factor M with separable predual and every faithful normal state $\varphi $, is its bicentralizer $BC(M,\varphi )$ equal to the scalar operators?
  \subsection{Short English statement}
  For every type $III_{1}$ factor M with separable predual and every faithful normal state $\varphi $, is its bicentralizer $BC(M,\varphi )$ equal to the scalar operators?
