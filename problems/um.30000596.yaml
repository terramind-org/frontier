id: um.30000596
title: Minimal-Filling Conjecture for Simple Riemannian Manifolds
field: mathematics
tier: prose
statement: "Every simple compact Riemannian manifold $M$ should be a minimal filling: for every orientable $M'$ with $\\partial M'=\\partial M$, if $d_{M'}(x,y)\\geq d_M(x,y)$ for all $x,y\\in\\partial M$, then $\\operatorname{vol}(M')\\geq\\operatorname{vol}(M)$. Moreover, equality should imply that $M'$ is boundary-preservingly isometric to $M$. Here simple means that the boundary is strictly convex, any two points are joined by a unique geodesic, and there are no conjugate points."
