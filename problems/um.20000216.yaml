title: Exact vertical tangent defects for canonical genus-four curves
field: mathematics
tier: prose
statement: |-
  **Problem 1.2.** Find examples where we can understand behavior distinct
  from the expected one. There is basically no hope of a general answer, so I
  mean this as an example-hunting suggestion.

  A specific application would be to extend the range in which we can say when
  \(\pi\) is dominant. If you have examples where the tangent space dimension
  is wrong, then you can degenerate to a curve where the tangent space
  dimension is wrong again.
