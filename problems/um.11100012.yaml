title: Morava K- and E-theory 2 — Show that the Picard group is finitely generated over the p-adics.
field: mathematics
tier: prose
statement: Show that the Picard group is finitely generated over the p-adics. I don't think this is known even for the algebraic Picard group, which is obtained purely through group cohomology. So I think there might be some room for some purely algebraic understanding of profinite group cohomology here.
