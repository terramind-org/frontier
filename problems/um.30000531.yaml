title: Complex and $p$-Adic Artin $L$-Value Formulas
field: mathematics
tier: prose
statement: In the totally-real/odd and CM/even parity cases for the Artin representation $\rho$ on $E[G]\pi$, prove $$L(n,\rho\otimes\operatorname{id},\mathbb Q)D(M_\pi^E)^{1/2,\infty}=e(n,M_\pi^E)R_{n,\infty}(M_\pi^E)$$ and $$L_p(n,\rho\otimes\omega_p^{1-n},\mathbb Q)D(M_\pi^E)^{1/2,p}=e_p(n,M_\pi^E)\operatorname{Eul}_p(n,\rho\otimes\operatorname{id},\mathbb Q)R_{n,p}(M_\pi^E),$$ with $e_p(n,M_\pi^E)=e(n,M_\pi^E)$, and prove that the $p$-adic $L$-value and regulator are nonzero.
