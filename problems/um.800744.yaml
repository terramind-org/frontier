title: Banach Spaces and Ramsey Theory — Problem 7
field: mathematics
tier: prose
statement: |-
  Although it is known that every separable non-Hilbertian Banach space contains
  two non-isomorphic subspaces, we point out that there are several
  related open problems. The following one is probably the most natural.

  *(G. Godefroy [Go])*
  Let $X$ be a separable non-Hilbertian Banach space. Is it true that there
  exists a sequence $(X_n)$ of subspaces of $X$ which are pairwise non-isomorphic?
