title: Kahn’s Matroidal Rota Basis Conjecture
field: mathematics
tier: prose
statement: Given a rank-$n$ matroid and bases $B_{i,j}$ for $1\leq i,j\leq n$, can representatives $b_{i,j}\in B_{i,j}$ be chosen so that every column $\{b_{1,j},\ldots,b_{n,j}\}$ and every row $\{b_{i,1},\ldots,b_{i,n}\}$ is a basis?
