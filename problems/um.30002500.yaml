title: Attainable Zero Counts of Nonnegative Bivariate Polynomials
field: mathematics
tier: prose
statement: Let $P(x,y)\geq0$ be a real polynomial of degree $n$ whose real zeros are isolated. Its number of real zeros is at most $n^2$, while examples give at least $\lfloor n^2/4\rfloor$. Can every integer between these two bounds occur as the number of real zeros of such a polynomial?
