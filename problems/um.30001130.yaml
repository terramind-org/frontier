title: Probe Displaceability and Floer Detection of Toric Fibers
field: mathematics
tier: prose
statement: For two-dimensional moment polytopes containing open sets of points that cannot be displaced by probes, are the corresponding toric fibers genuinely nondisplaceable, and can this be detected by a suitable Floer homology? More generally, for a Fano moment polytope, can every point except its special interior integral point be displaced by a probe?
