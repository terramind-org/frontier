statement: |-
  \section*{The Bochner-Riesz conjecture in dimension three}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every $1<p<infinity$, is the Fourier multiplier $(1-|\xi |^2/R^2)_+^\delta $ uniformly bounded on $L^p(R^3)$ for all $R>0$ whenever $\delta >max(3|1/p-1/2|-1/2,0)$, with the order-zero $L^2$ case also bounded?
  \subsection{Short English statement}
  For every $1<p<infinity$, is the Fourier multiplier $(1-|\xi |^2/R^2)_+^\delta $ uniformly bounded on $L^p(R^3)$ for all $R>0$ whenever $\delta >max(3|1/p-1/2|-1/2,0)$, with the order-zero $L^2$ case also bounded?
