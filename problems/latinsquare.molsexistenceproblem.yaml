lean:
  module: FormalConjectures.Paper.LatinSquare
  decl: LatinSquare.molsExistenceProblem
  statement: "theorem molsExistenceProblem : molsExistenceProblem.answer = {n : ℕ | HasCompleteMOLS n}"
  context:
    - open LatinSquare
  definitions:
    - name: LatinSquare.HasCompleteMOLS
      kind: def
      text: |-
        /--
        A complete set of mutually orthogonal latin squares (MOLS) of order `n` consists of `n - 1`
        latin squares of order `n`, pairwise orthogonal to each other.
        -/
        def HasCompleteMOLS (n : ℕ) : Prop :=
          0 < n ∧ ∃ L : Fin (n - 1) → LatinSquare n, MutuallyOrthogonal L
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Paper/LatinSquare.lean#L51
