title: Cotangent-bundle vanishing for projective-space parabolics
field: mathematics
tier: prose
statement: |-
  Let $P$ be a parabolic subgroup of $G$. Is it true in characteristic $p$ that
  \[
  R^i\operatorname{Ind}_P^G\operatorname{Sym}(\mathfrak n_P^\bullet)=0
  \qquad(i>0)?
  \]
  (Known for $P=B$ and for certain other parabolics. Possible connection with normality of nilpotent orbit closures.)
