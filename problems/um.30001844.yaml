title: Finite Secant–Tangent Generation on Cubic Surfaces
field: mathematics
tier: prose
statement: For a smooth cubic surface $S$ over a field $K$, does there always exist a finite subset $B\subseteq S(K)$ such that all $K$-points of $S$ can be generated from $B$ by successive secant and tangent constructions?
