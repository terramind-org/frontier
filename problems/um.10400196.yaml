statement: (F. Deloup) Is there a lift of arg γ(qσ) to a mod 16 invariant? This would give a finite type invariant of degree 1 in the spin c Goussarov-Habiro theory. 37A quadratic function q is a a map such that q(x + y) − q(x) − q(y) is bilinear in x and y. It is called homogeneous if q(nx) = n2q(x) for any n ∈ Z and x ∈ G. In fact, there is a canonical map σ ↦→qσ from spin c structures to quadratic functions and qσ is homogeneous if and only if σ actually comes from a spin structure. Note that not all spin c structures come from spin structures.
