statement: |-
  Virtual braids: Is there a birack such that its action on
  virtual braids is faithful?

  Is the invariant of virtual braids in , see
  also , faithful?

  The action defined by linear biquandles is not faithful. This
  almost certainly means that the corresponding linear invariants of
  virtual knots and links are not faithful (see
  also ).
