title: Torsion Growth and Hyperbolic Volume in Finite Covers
field: mathematics
tier: prose
statement: Let $X$ be an irreducible orientable $3$-manifold with empty or torus boundary, let $\operatorname{Vol}(X)$ be the sum of hyperbolic-piece volumes, and let $t(X,G)=|\operatorname{Tor}H_1(X_G,\mathbb Z)|$ for finite-index normal subgroups $G\triangleleft\pi_1(X)$. Is $\limsup_{G\to\infty}t(X,G)^{1/[\pi_1(X):G]}=\exp(\operatorname{Vol}(X)/(6\pi))$?
