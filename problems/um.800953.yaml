statement: |-
  The general problem is still wide open despite some reports of its solution (p. 87 of [Berger2000] and Section 10.9 of [Berger2003]).

  *Is there a Riemannian metric on a closed manifold with everywhere positive sectional curvatures and ergodic geodesic flow?*
