lean:
  module: FormalConjectures.Wikipedia.Jacobson
  decl: Jacobson.jacobson_conjecture
  statement: |-
    theorem jacobson_conjecture :
        ∀ (R : Type) [Ring R] [IsNoetherianRing R] [IsRightNoetherianRing R],
          JacobsonConjectureFor R
  context:
    - open Jacobson
    - open Ring
  definitions:
    - name: Jacobson.JacobsonConjectureFor
      kind: def
      text: |-
        /-- The Jacobson conjecture for a ring $R$: the infimum of the powers of the Jacobson radical
        $J$ is the zero ideal. -/
        def JacobsonConjectureFor (R : Type u) [Ring R] : Prop :=
          ⨅ n : ℕ, jacobson R ^ n = 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Wikipedia/Jacobson.lean#L42
