title: Comparative Prime Number Theory — Problem 1
field: mathematics
tier: prose
statement: |-
  - (Nathan Ng, University of Lethbridge)
  Feuerverger and Martin [FeM] numerically computed the densities for some three-way races, as well as for the four-way races for the moduli $5$, $8$, and $12$. Their paper contains a general formula for densities in races with any number of competitors; but there have been few (if any) subsequent computations of densities for races with three or more competitors.

  Numerically compute some further three-way (or higher) races.

  Fiorilli and Martin [FiM] determined the 117 most biased two-way races.
