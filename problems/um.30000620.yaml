title: Unbounded Representatives of the Chern–Connes Character
field: mathematics
tier: prose
statement: Let $(A,H,D)$ be a $p$-summable odd spectral triple and let $F=D|D|^{-1}$. Can the Chern–Connes character of its Fredholm module be constructed using only $D$ and commutators $[D,a]$ with elements $a\in A$?
