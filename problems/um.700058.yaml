title: Kourovka Notebook Problem 1.67
field: mathematics
tier: prose
statement: |-
  Suppose that $G$ is a finitely presented group,
  $F$ a free group whose rank is equal to the minimal number of
  generators of $G$, with a fixed homomorphism of $F$ onto $G$ with
  kernel $N$. Find a complete system of invariants of the
  factor-group of $N$ by the commutator subgroup $[F,N]$.
