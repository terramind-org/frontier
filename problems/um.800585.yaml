title: Selection Principles in Mathematics — Problem 11 ([ideals, MilNonGamma])
field: mathematics
tier: prose
statement: |-
  A property of sets of reals is *hereditary* if for each set of reals $X$ satisfying
  the property, all subsets of $X$ satisfy that property.
  None of the selective hypotheses involving open covers is
  provably hereditary [ideals]. However, the property $\mathsf{S}_1(\mathrm{B},\mathrm{B})$ as
  well as all properties of the form $\Pi(\mathrm{B}_\Gamma,\mathrm{B})$ are hereditary
  [ideals] (but $\mathsf{S}_1(\mathrm{B}_\Omega,\mathrm{B}_\Gamma)$ is not [MilNonGamma]).

  Is $\mathsf{S}_1(\mathrm{B}_\Omega,\mathrm{B}_\Omega)$ or $\mathsf{S}_{\mathrm{fin}}(\mathrm{B}_\Omega,\mathrm{B}_\Omega)$ hereditary?
