id: um.30001085
title: Structural Problems in One-Dimensional Complex Dynamics
field: mathematics
tier: prose
statement: Find a combinatorial description of Branner–Hubbard slices of cubic polynomials; determine whether every Cantor Julia set of a rational map has zero spherical area; decide whether the Brjuno condition is optimal for rational maps, entire transcendental maps, and relatively compact maximal Siegel disks; decide whether $\operatorname{area}(K_\lambda)$ for $P_\lambda(z)=\lambda z+z^2$ is bounded below by a constant $C>0$ when $|\lambda|\leq1$; determine whether every Siegel-disk boundary of a polynomial or rational map is a Jordan curve; determine whether Zakeri sets are Jordan arcs for cubic polynomials and for quadratic rational or more general bicritical maps, and quasi-arcs for bounded-type rotation numbers; decide whether generalized tuning can replace the closure of a $z\mapsto z^d$ basin of a rational map $R$ by the filled Julia set of any degree-$d$ polynomial $P$, and whether local connectivity transfers; determine whether almost every bifurcation-locus parameter in harmonic measure has a critical orbit dense in its Julia set; characterize when a topological mating is a sphere and a faithful model, and whether formal matings with arbitrarily long ray connections exist; determine whether the closure of the cubic rigidity locus is the Misiurewicz locus; decide whether the cubic connectedness loci satisfy $\mathcal{C}_3=\mathcal{C}_3^\circ$; and determine whether every wandering connected component of a rational map eventually becomes a point or a topological circle.
