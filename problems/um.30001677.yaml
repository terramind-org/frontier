title: Simplifying Borel Equivalence Relations on Positive Sets
field: mathematics
tier: prose
statement: Let $E$ be a Borel equivalence relation on a Polish space $X$ and $I$ a $\sigma$-ideal on $X$. Is there a Borel $I$-positive set $B\subset X$ such that the restricted equivalence relation $E\upharpoonright B$ is significantly simpler than $E$ on $X$?
