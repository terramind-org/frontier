title: A projective scalar quotient of VI and its module theory
field: mathematics
tier: prose
statement: |-
  **VI like categories**

  VI is obtained from FI by replacing finite sets with finite vector spaces. In
  combinatorics, often better to replace finite sets by finite projective spaces.

  Does this lead to an interesting analogue of VI-modules?
