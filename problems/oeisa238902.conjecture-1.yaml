  definitions:
    - name: OeisA238902.a
      kind: def
      text: |-
        /-- Number of integers $0 < k \le n$ such that $\pi(\pi(k n))$ is a square. -/
        def a (n : ℕ) : ℕ :=
          ((Icc 1 n).filter fun k =>
            let m := Nat.primeCounting (Nat.primeCounting (k * n))
            m.sqrt ^ 2 = m).card
