title: Finite Factorization Bases for Breaking Maps
field: mathematics
tier: prose
statement: Let $X$ be a smooth uniruled projective variety. Is there a finite set of breaking maps $f_i:Y_i\to X$ such that every breaking map to $X$ factors rationally through one of the $f_i$?
