title: Structural Properties of Geometric Means of Convex Bodies
field: mathematics
tier: prose
statement: Let A and B be convex bodies containing the origin, let $A^\circ$ be the polar body, D the Euclidean unit ball, and G and $G_p$ their geometric means. Determine whether $G(A,B)=D$ implies $B=A^\circ$; whether $A+B=A^\circ+B^\circ$ implies $B=A^\circ$; whether a convex body P representable as $G(A,B)$ for every A must be an ellipsoid; whether $G_p(A,B)=G_1(A,B)$; whether the upper elliptic envelope $E_u(A,B)$ equals $G(A,B)$; whether $|G(A,B)|^2\geq|A||B|$ under identifiable conditions; and whether an exponential map or the stated homogeneity identity exists.
