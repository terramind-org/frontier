title: Newton–Okounkov Bodies of Bott–Samelson Varieties
field: mathematics
tier: prose
statement: |-
  For a Bott–Samelson variety $X=R(i_1,\ldots,i_l)$ of $\operatorname{GL}_n$, does the Newton–Okounkov body for the indicated flag equal

  $$P=A_{i_1}T_{v_1}A_{i_2}\cdots T_{v_{l-1}}A_{i_l}(p)$$

  for suitable $p\in\mathbb R^d$ and $v_j\in\mathbb R^{d_{i_j}}$?
