title: Square Values of Primitive Binary Cubic Forms
field: mathematics
tier: prose
statement: Let $F$ be any primitive binary cubic form. Does $F$ primitively represent a square; that is, do there always exist coprime integers $x,z$ and an integer $y$ such that $F(x,z)=y^2$?
