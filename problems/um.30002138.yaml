title: Quasi-Isometry of Horospheres in Negative Curvature
field: mathematics
tier: prose
statement: If $(X^{n+1},g)$ is closed with negative sectional curvature, are all horospheres $(H,\widetilde g|_H)$ in its universal cover quasi-isometric to one another, and if so uniformly quasi-isometric?
