title: Spaces with Lower Ricci Curvature — Conjecture 9 (local Yau conjecture)
field: mathematics
tier: prose
statement: |-
  Finally, let us end by discussing the regularity of manifolds with lower Ricci bounds, potentially including those with small volume. The main conjecture out there is one due to Yau, and we state a local version of it below:

  Let $\big(M^n,g\big)$ satisfy $\mathrm{Ric}\geq -\lambda$, then $\int_{B_1(p)} R \leq C(n,\lambda)$.
