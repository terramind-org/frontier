statement: |-
  Characterize all groups (or at least all soluble
  groups) $G$ and fields $F$ such that every irreducible $ FG
  $-module has finite dimension over the centre of its endomorphism
  ring. For some partial answers see (B. A. F. Wehrfritz, *Glasgow Math. J.*, **24**, no. 1 (1983), 169--176).
