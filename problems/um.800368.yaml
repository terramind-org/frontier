title: Coxeter Groups and Unimodality — Problem 6
field: mathematics
tier: prose
statement: |-
  It is known ([Polo], see also [CasRep]) that if $P(q) \in \mathbb{N}[q]$ is such that $P(0)=1$ then there are $n \in \mathbb{P}$ and $u,v \in S_n$ such that $P(q)=P_{u,v}(q)$. The following related problem was posed by Bj\"{o}rner ([BjoPC]).

  Let $(W,S)$ be a Coxeter system and $u,v \in W$, $u \leq v$. Is it true that
  then there are a Coxeter system $(W',S')$ and $w \in W'$ such that
  \[
  P_{u,v}(q)=P_{e,w}(q) \; ?
  \]
