title: Isoperimetric profile and curvature at infinity
field: mathematics
tier: prose
statement: Suppose the global infimum of coarse Ricci curvature is zero, while its infimum on every finite-radius ball about an origin is positive. Is there a systematic relation between the rate at which curvature tends to zero at infinity and the isoperimetric profile? Analyze, for example, the $M/M/k$ queue.
