title: Question 2 — What are the equivalence classes of braids modulo the moves • ab↔ba, and • b↔σnι(b)?
field: mathematics
tier: prose
statement: What are the equivalence classes of braids modulo the moves • ab↔ba, and • b↔σnι(b)? In other words, what happens if the Markov move b↔σ−1 n ι(b) is omitted? This question was shown in [ OS03] to be equivalent to the important problem in contact geometry of classifying transversal links up to transversal isotopy. The Bennequin number of a braid b∈ Bn is e−n, where e is the sum of the exponents in a word in the generators σi representingb. The Bennequin number is invariant under the moves in Question 2. Thus it can be used to show that there are braids that are related by Markov moves, but not by the moves in Question 2. Birman and Menasco [ BM] and Etnyre and Honda [ EH] have independently found pairs of braids that are related by Markov moves and have the same Bennequin invariant, but are not related by the moves in Question 2. Their proofs are quite complicated, and it would be nice to have a new invariant that could distinguish their pairs of braids.
