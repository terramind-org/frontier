title: Three Problems on Triangulations
field: mathematics
tier: prose
statement: "Resolve the following triangulation problems: (1) do two triangulations with the same support always have a common iterated stellar subdivision; (2) are any two point configurations in $\\mathbb R^3$ or $\\mathbb R^4$ connected by bistellar flips; and (3) for every $d$, is there a constant $c_d$ such that $c_dP$ has a unimodular triangulation for every lattice polytope $P\\subseteq\\mathbb R^d$?"
