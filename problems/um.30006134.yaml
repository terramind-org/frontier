title: Growing-Parameter Limits for Convex-Body Functionals
field: mathematics
tier: prose
statement: Let $(d_j)$ and $(k_j)$ satisfy $0\leq k_j\leq d_j-1$, $2k_j>d_j+1$, and $d_j\to\infty$. Determine the asymptotic behavior of the standardized random variables $Y^*_{d_j,k_j}$. Find conditions, such as $k_j/d_j\to 1/2$, that imply convergence in distribution, and determine whether any limit is Gaussian.
