title: Kourovka Notebook Problem 11.81
field: mathematics
tier: prose
statement: |-
  A topological group is
  said to be *$F$-balanced* if for any subset $X$ and any
  neighborhood of the identity $U$ there is a neighborhood of the
  identity $V$ such that $VX \subseteq XU$. Is every $ F$-balanced group
  *balanced*, that is, does it have a basis of neighborhoods of
  the identity consisting of invariant sets?
