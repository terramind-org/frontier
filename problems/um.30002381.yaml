title: Efficient Relation Generation for Curve Class Groups
field: mathematics
tier: prose
statement: |-
  Can the heuristic expected running time
  $$\exp\!\left(O\!\left(\max\{\log q,\,n(\log q)^{1/2}\}\right)\right)$$
  for relation generation in the discrete-logarithm algorithm be achieved for broader families of elliptic curves, or for curves of any fixed genus, by weakening or removing the hypothesis $n\leq C\log q$?
