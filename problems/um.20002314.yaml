title: Computable copies for a finite dimension-vector spectrum
field: mathematics
tier: prose
statement: |-
  **Question 12.** (Assume \(V=L\) if it makes things easier.) Suppose that for all \(\lambda\geq\aleph_1\) a theory \(T\) has at most \(\lambda\)-many models of cardinality \(\lambda\). Must each such model have a \(\lambda\)-computable presentation?

  Such a \(T\) is necessarily \(\omega\)-stable and non-multidimensional. The question is true if \(T\) is \(\aleph_1\)-categorical.
