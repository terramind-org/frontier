title: Equal-entropy factors conjecture
field: mathematics
tier: prose
statement: Let $A,B$ be irreducible integer matrices of the same spectral radius. Suppose $\operatorname{tr}(A^n)>0$ implies $\operatorname{tr}(B^n)>0$ for every $n$, and the dimension module of $B$ is a quotient of a closed submodule of that of $A$. Prove that the shift $S_B$ is a factor of $S_A$.
