title: Kourovka Notebook Problem 17.91
field: mathematics
tier: prose
statement: |-
  Let $d(X)$ denote the derived length of a group
  $X$.

  a) Does there exist an absolute constant $k$
  such that $d(G)-d(M)\leq k$ for every finite soluble group $G$
  and any maximal subgroup $M$?

  b) Find the minimum $k$ with this property.
