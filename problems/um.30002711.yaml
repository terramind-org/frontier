title: Minimal Coefficient Rings for Cyclic Local Lifts
field: mathematics
tier: prose
statement: Let $k$ be an algebraically closed field of characteristic $p > 0$, and let $k[[z]] / k[[t]]$ be a cyclic $G$-Galois extension of power-series rings. In the local lifting problem for cyclic groups $G$ (which asks for a complete discrete valuation ring $R$ of characteristic $0$ with residue field $k$ and a $G$-Galois extension $R[[Z]] / R[[T]]$ reducing to $k[[z]] / k[[t]]$), can the lifting ring always be chosen as $R = W(k)[\zeta_{|G|}]$ (the ring of Witt vectors over $k$ adjoined a primitive $|G|$-th root of unity) for all cyclic groups $G$?
