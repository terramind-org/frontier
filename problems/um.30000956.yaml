title: Andersen–Masbaum–Ueno Conjecture
field: mathematics
tier: prose
statement: Let $\Sigma$ be a compact orientable surface with negative Euler characteristic, and let $\rho_k$ be a Reshetikhin–Turaev TQFT representation of its mapping class group at level $k$. Does a mapping class $\phi$ have a pseudo-Anosov piece if and only if there is $k_0(\phi)$ such that $\rho_k(\phi)$ has infinite order for every $k\geq k_0(\phi)$?
