schema: 1
id: cramerconjecture.cramer-conjecture.variants.strict-bound
title: "Cramér's Conjecture on Prime Gaps (variant: strict_bound)"
field: mathematics
tier: proof
statement: |-
  **Strong Numerical Cramér Inequality**: for every $n \ge 4$ ($p_n \ge 11$),
  $p_{n+1} - p_n < (\log p_n)^2$ (indices $n \in \{0, 1, 3\}$ fail; see
  `cramerRatio_small_index_bounds`, and compare `Firoozbakht.firoozbakht_conjecture_consequence` for
  the stronger bound $p_{n+1} - p_n < (\log p_n)^2 - \log p_n$ on the same range).
ams:
  - 11
tags:
  - wikipedia
  - variant
references:
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Cram%C3%A9r%27s_conjecture
