title: Numerical mirror data and a torsion-sector obstruction
field: mathematics
tier: prose
statement: |-
  How to find (algebraically, say) a mirror construction for fake projective planes (certain rigid surface of general type with same Hodge numbers as projective space, otherwise very different).

  - There exist 100 of them, but only 22 have known explicit equations.
  - Not complete intersections.
