title: AGNES Open Problems in Algebraic Geometry — Q6
field: mathematics
tier: prose
statement: |-
  What is the analogue of the tautological ring for $M^{K3}_{2n}$?

  A natural guess for **Q6** is the subring generated by the
  classes of the
  Noether--Lefschetz loci. The Noether-Lefschetz loci parameterize
  $K3$ surfaces with higher rank Picard lattices.
