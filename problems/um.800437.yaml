title: Analysis of Boolean Functions — Mansour's Conjecture
field: computer-science
tier: prose
statement: Let $f \colon \{-1,1\}^n \to \{-1,1\}$ be computable by a DNF of size $s > 1$ and let $\varepsilon \in (0,1/2]$. Then $f$'s Fourier spectrum is $\varepsilon$-concentrated on a collection $\mathcal{F}$ with $|\mathcal{F}| \leq s^{O(\log(1/\varepsilon))}$.
