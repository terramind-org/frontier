title: Donaldson Symplectic Calabi–Yau Equation
field: mathematics
tier: prose
statement: Given a compact symplectic 4-manifold $(M,J,\omega)$ with $b_2^+(M)=1$ and $F\in C^\infty(M)$ satisfying $\int_M e^F\omega^2=\int_M\omega^2$, does there exist a symplectic form $\widetilde{\omega}\in[\omega]$ such that $\widetilde{\omega}^2=e^F\omega^2$?
