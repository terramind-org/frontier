title: $L^p$ Cohomology at the Semisimple Rank Threshold
field: mathematics
tier: prose
statement: Let $F$ be a local field, let $G$ be the $F$-points of a semisimple algebraic group over $F$, and let $r=\operatorname{rk}_F(G)$. Is $H^k_{\mathrm{ct}}(G,L^p(G))=0$ for every $1<p<\infty$ and $k<r$? Does there exist $1<p<\infty$ such that $H^r_{\mathrm{ct}}(G,L^p(G))\neq 0$?
