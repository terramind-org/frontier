title: Chern and Degeneracy Classes of Coinvariant Bundles
field: mathematics
tier: prose
statement: For coinvariant bundles not arising from a cohomological field theory, compute their Chern classes; characterize when higher Chern classes are tautological or effective; realize extremal effective rays as first Chern classes; and determine degeneracy classes of natural maps between such bundles.
