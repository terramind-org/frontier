title: Symbolic Rees Rings and Nagata’s Conjecture
field: mathematics
tier: prose
statement: For pairwise coprime positive integers $a,b,c$, determine the relationship between finite generation of $R_s(P(a,b,c))=\bigoplus_{m\geq0}P(a,b,c)^{(m)}$ for the monomial curve $(t^a,t^b,t^c)$ and Nagata's Conjecture for general points in $\mathbb P^2$; in particular, characterize when this symbolic Rees ring is Noetherian.
