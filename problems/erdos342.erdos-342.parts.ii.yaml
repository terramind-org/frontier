lean:
  module: FormalConjectures.ErdosProblems.«342»
  decl: Erdos342.erdos_342.parts.ii
  statement: |-
    theorem erdos_342.parts.ii :
        ∀ a : ℕ → ℕ, IsUlamSequence a →
          let d (n : ℕ) : ℤ := a (n + 1) - a n
          ∃ p > 0, ∀ᶠ m in atTop, d (m + p) = d m
  context:
    - open Erdos342
    - open Erdos342.erdos_342
    - open Erdos342.erdos_342.parts
    - open Nat Set Filter
    - open scoped Topology
  definitions:
    - name: Erdos342.IsUlamSequence
      kind: def
      text: |-
        /-- `IsUlamSequence a` means that $a$ is the Ulam sequence (OEIS A002858):
        $a(0) = 1$, $a(1) = 2$, and for each $n \geq 2$, $a(n)$ is the least integer
        greater than $a(n-1)$ that has a unique representation as $a(i) + a(j)$
        with $i < j < n$. -/
        def IsUlamSequence (a : ℕ → ℕ) : Prop :=
          a 0 = 1 ∧ a 1 = 2 ∧
          ∀ n, 2 ≤ n →
            a (n - 1) < a n ∧
            UniqueUlamSum a n (a n) ∧
            ∀ m, a (n - 1) < m → m < a n → ¬ UniqueUlamSum a n m
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/342.lean#L42
