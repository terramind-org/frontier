title: "Scalar Curvature Question [?32]: Waist-Width Inequality"
field: mathematics
tier: prose
statement: 'Conjecture: Waist-Width Inequality. All complete Riemannian n-manifolds X satisfy widthn−1(X) ≤constn⋅waistn−k+1(X). Contractibility Radius. This "radius", denoted contr(X,r), r > 0, of a metric spaceX is the inﬁmum of the numbersR, such that everyr-ballBx(r) ⊂ X is contractible within the concentric ballBx(R) ⊃Bx(r) of radiusR. It is (almost) obvious that [41]: A. Complete Riemannian manifolds with cocompact isometry groups, e.g universal coverings of compact aspherical manifolds, havecontr(X,r) = ∞for all r > 0. B. If a completen-dimensional manifoldX satisﬁes contr(X,ri) ≤ri+1 for i= 1, 2,...,n and r1 ≤r2 ≤...≤rn+1 <∞, then fil.rad[X]≥r1/(n+ 1)!. C. It follows that the universal coverings ˜X of compact aspherical manifoldsX have fil.rad( ˜X) =∞. Consequently, these ˜X satisfy waistm( ˜X) =∞,m = 1, 2,...,n =dim(X), as well. 16 Standard Geometric and Topological Conjectures on Complete Manifolds with Positive Scalar Curvatures.'
