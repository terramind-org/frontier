title: Kourovka Notebook Problem 20.17
field: mathematics
tier: prose
statement: |-
  The *normal covering number* $\gamma(G)$ of a finite non-cyclic group $G$ is the minimum number of proper subgroups of $G$ such that $G$ is the union of their conjugates.

  (ae) What is the exact value of \ $\displaystyle\liminf_{n\ \mathrm{even}}\gamma(S_n)/n$?

  (ao) What is the exact value of \ $\displaystyle\liminf_{n\ \mathrm{odd}}\gamma(S_n)/n$?

  *Comment of 2025*: It belongs to $[1/12, 1/6]$ for $n$ odd (S. Eberhard, C. Mellon, *Bull. London Math. Soc.* (2025), https://doi.org/10.1112/blms.70154).

  (b) What are the exact values of \ $\displaystyle\liminf_{n\ \mathrm{even}}\gamma(A_n)/n$ \ and \ $\displaystyle\liminf_{n\ \mathrm{odd}}\gamma(A_n)/n$?

  *Comment of 2025*: These belong to $[1/18, 1/6]$ for $n$ even, and to $[1/6, 4/15]$ for $n$ odd (S. Eberhard, C. Mellon, *Bull. London Math. Soc.* (2025), https://doi.org/10.1112/blms.70154).

  (c) What is the exact value of $\displaystyle\limsup_{n\ \mathrm{even}}\gamma(S_n)/n$?

  It is known that $\displaystyle\limsup_{n\ \mathrm{odd}}\gamma(S_n)/n=1/2$.

  (d) What are the exact values of \ $\displaystyle\limsup_{n\ \mathrm{odd}}\gamma(A_n)/n$ \ and \ $\displaystyle\limsup_{n\ \mathrm{even}}\gamma(A_n)/n$?
