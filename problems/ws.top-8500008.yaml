  \item[\hypertarget{source:statement:2}{S2}] Andrej Dujella, Diophantine m-tuples, author-maintained survey (snapshot accessed 9 October 2026), Section 5.3, Rational D(q)-m-tuples. \url{https://raw.githubusercontent.com/dujella/dujella.github.io/master/ratio.html}.
