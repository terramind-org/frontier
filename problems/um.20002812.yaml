title: A Levi-defect criterion for Brylinski-Deligne covers of GL(r)
field: mathematics
tier: prose
statement: |-
  Study the residual spectrum for $\widetilde{GL}(n)$.

  -- Can the lifting of Levi subgroups be done over $p$-adic? If so, is it one of the Brylinski-Deligne extensions?

  -- Describe covers of $GL(n)$ not arising from Kazhdan-Petterson.
