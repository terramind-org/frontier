title: Question — Consider the Artin group A5 (the braid group on six strings) divided by the relation (a1a2a3a4)5 = a5a4a3a2a2 1a2a3a4a5.
field: mathematics
tier: prose
statement: Consider the Artin group A5 (the braid group on six strings) divided by the relation (a1a2a3a4)5 = a5a4a3a2a2 1a2a3a4a5. Is it true that every positive word in this group which is equal to ∆ 4 4 = (a1a2a3a4)10 must have either 40 or 30 or 20 letters and in fact must be Hurwitz equivalent (see [ 1]) to ∆ 4 4 or to ∆ 2 5 = (a1a2a3a4a5)6 or to h2 = (a5a4a3a2a2 1a2a3a4a5)2? 8. Relations in the mapping class group 127 A similar question on a closed surface has an aﬃrmative answer. Siebert and Tian proved in their recent paper (see [ 1]) that any genus two Symplectic Lefschetz Fibration without reducible fibers and with transitive monodromy is holomorphic. Therefore it corresponds to a monodromy factorization which is a product of conjugates of factorizations which are Hurwitz equivalent to ∆2 5 or to h2 (∆4 4 does not have transitive monodromy). On a surface with boundary each such factor is equal to the twist along the boundary so there may be only one factor if the product is equal to a single twist, but the equivalence on the closed surface is weaker, has bigger equivalence classes so the answer on the surface with boundary may be diﬀerent.
