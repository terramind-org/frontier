title: Kourovka Notebook Problem 20.50
field: mathematics
tier: prose
statement: |-
  For a positive integer $m$, let $G_m$ be the largest group generated by $m$ involutions such that $(xy)^4=1$ for any two involutions $x,y\in G_m$. What is the order of $G_4$?

  It is known that the order of $G_3$ is equal to $2^{11}$. Also cf. 18.58.
