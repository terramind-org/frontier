statement: |-
  Let $A$ be an elementary abelian 2-group which is a $ TI
  $-subgroup of a finite group $G$. Investigate the structure of
  $G$ under the hypothesis that the weak closure of $A$ in a Sylow
  2-subgroup of $G$ is abelian.
