title: The Lyapin's Notebook — Problem 49
field: mathematics
tier: prose
statement: |-
  (G. Mashevitzky)

  - Describe classes of semigroups in which elementary inclusive varieties form a sublattice of the lattice of inclusive varieties.

  - Describe nonelementary inclusive varieties that form an upper subsemilattice in the lattice of inclusive varieties within the class of periodic semigroups.

  Elementary inclusive varieties form a sublattice, and nonelementary inclusive varieties form an upper subsemilattice in the lattice of inclusive varieties of finite Abelian groups ([M3]).
