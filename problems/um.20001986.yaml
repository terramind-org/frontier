title: Global balancing as a recognition obstruction
field: mathematics
tier: prose
statement: |-
  Given such a homogeneous, value-group-rational, totally concave polyhedral complex, what further conditions are necessary for it to be the amoeba of a prime Laurent ideal?

  The AIM PDF and HTML recover this as follows. Let \(k\) be an algebraically closed non-archimedean field and let
  \[
  \mathfrak p\subset k[x_1^{\pm1},\ldots,x_d^{\pm1}]
  \]
  be prime. Its non-archimedean amoeba agrees with the Bieri--Groves set of
  \[
  A=k[x_1^{\pm1},\ldots,x_d^{\pm1}]/\mathfrak p. \]
  The source says that this set is a “homogeneous polyhedral complex,” has dimension \(\dim A\), is rational over the value group, and is totally concave. It asks:

  The historical terminology matters. Bieri and Groves define a polyhedron to be homogeneous when it admits a finite decomposition into convex polyhedra all having the dimension of the whole set. Thus “homogeneous” means pure-dimensional here, not invariant under scaling and not “homogeneous ideal.” Their total concavity condition says that at every \(u\) the convex hull of the local cone \(LC_u(S)\) is an affine subspace. Gubler later uses exactly this local-cone formulation.
