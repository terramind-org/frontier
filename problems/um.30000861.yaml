title: Period Formula for Special Orthogonal Automorphic Representations
field: mathematics
tier: prose
statement: Let $k$ be a global field of characteristic different from $2$, let $(V_0,Q_0)\subset(V_1,Q_1)$ be quadratic spaces of ranks $n$ and $n+1$, and set $G_i=\operatorname{SO}_{Q_i}$. For tempered cuspidal automorphic representations $\pi_i$ of $G_i$ and cusp forms $\varphi_i\in\pi_i$, does there exist an integer $\beta$ such that $\frac{|\langle\varphi_1|_{G_0},\varphi_0\rangle|^2}{\langle\varphi_1,\varphi_1\rangle\langle\varphi_0,\varphi_0\rangle}=2^\beta C_0\Delta_{G_1}^S P_{\pi_1,\pi_0}^S(1/2)\prod_{v\in S}\frac{I(\varphi_{1,v},\varphi_{0,v})}{\langle\varphi_{1,v},\varphi_{1,v}\rangle_v\langle\varphi_{0,v},\varphi_{0,v}\rangle_v}$, with the component-group normalization predicted for $\pi_1$ and $\pi_0$?
