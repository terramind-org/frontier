title: Finite Width of the 14-Triangle Complex Group
field: mathematics
tier: prose
statement: Let $G=\langle x,y\mid r_1,r_2,r_3\rangle$, where $r_1=yxyxyxy^{-3}x^{-3}$, $r_2=yx^{-1}y^{-1}x^{-3}y^2x^{-1}yxy$, and $r_3=y^3x^{-1}yxyx^2y^2xyx$, and let $\gamma_i(G)$ be its lower central series. For every $i\geq2$, is $[\gamma_i(G):\gamma_{i+1}(G)]=8$ when $i\equiv0$ or $1\pmod3$, and $[\gamma_i(G):\gamma_{i+1}(G)]=4$ when $i\equiv2\pmod3$? Equivalently, does $G$ have finite width $3$?
