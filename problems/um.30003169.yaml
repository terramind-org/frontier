title: Second-Order Bias in Kernel Level-Set Estimation
field: mathematics
tier: prose
statement: For the kernel estimator $\widehat L_h=\{x\in\mathbb R^d:\widehat f_h(x)\geq c\}$ of $L=\{x:f(x)\geq c\}$, with mean distance-in-measure risk $\operatorname{MDM}(h)=I_1(h)+I_2(h)$, does there exist $B=B(f,K,c)$ such that $h^{-2}I_2(h)\to B$ as $n\to\infty$ without assuming $nh^{d+4}\to0$?
