title: Sums of a square and three weighted cubes (conjecture_5)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): Every nonnegative integer $n$ can be written as $2w^2 + x^3 + 4y^3 + z^4$
  for some nonnegative integers $w, x, y, z$.
