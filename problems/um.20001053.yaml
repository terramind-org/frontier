title: Two-label extremality and the meaning of average reachability
field: mathematics
tier: prose
statement: "**Conjecture 6.10 (DeVos).** Let $G$ be a directed graph whose edge set is partitioned into $k$ color classes $E_1, \\ldots, E_k$, and let $G_i = (V(G), E_i)$. If $G$ has no rainbow directed cycle (a directed cycle with at most one edge from each $E_i$), must there exist a vertex $v \\in V(G)$ such that $\\sum_{i=1}^k d_{G_i}^+(v) \\cdot d_{G_i}^-(v) \\geq \\sum_{i \\neq j} d_{G_i}^+(v) \\cdot d_{G_j}^-(v)$?"
