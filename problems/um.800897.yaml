title: Open Problems in Pluripotential Theory — Question 28 (Dinew-Ko\l{}odziej)
field: mathematics
tier: prose
statement: |-
  Let $(X,\omega)$ be a compact Hermitian manifold of dimension greater or equal to $3$.
  Characterize the forms $\omega$ for which $\int_X(\omega+dd^c\varphi)^n=\int_X\omega^n$ for any bounded $\omega$-plurisubharmonic function
  $\varphi$.
