lean:
  module: FormalConjectures.OEIS.«210186»
  decl: OeisA210186.conjecture_2
  statement: "theorem conjecture_2 (n : ℕ) (hn : 1 < n) : a n < n ^ 2"
  context:
    - open OeisA210186
  definitions:
    - name: OeisA210186.a
      kind: def
      text: |-
        /-- Least integer $m > 1$ such that $m$ divides none of $P_i + P_j$ with $0 < i < j \le n$,
        where $P_k$ is the $k$-th primorial `Nat.kthPrimorial k`. -/
        noncomputable def a (n : ℕ) : ℕ :=
          sInf { m : ℕ | 1 < m ∧
            ∀ i j : ℕ, 1 ≤ i → i < j → j ≤ n → ¬ (m ∣ (Nat.kthPrimorial i + Nat.kthPrimorial j)) }
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/210186.lean#L34
