title: Open Problems in Pluripotential Theory — Question 11
field: mathematics
tier: prose
statement: |-
  [Phong]
  Let $X \stackrel{\pi}{\rightarrow} {\mathbb{C}}\mathbb{P}^2$ be the blow up of the complex projective plane at one point.
  This is a DelPezzo surface, hence its first Chern class is positive.
  Pick $\omega \in c_1(X)$ a K\"ahler form,
  $D$ a smooth anticanonical divisor, and let $\mu_D=\omega \wedge [D] /V$ denote a normalized
  Lebesgue measure along $D$. Can one find $\varphi_D \in DMA(X,\omega)$ such that
  $$
  MA(\varphi_D)=\mu_D \; \; ?
  $$
