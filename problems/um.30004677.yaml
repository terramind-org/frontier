title: Zigzagging Skips of Arithmetical Degrees
field: mathematics
tier: prose
statement: Does there exist an arithmetical degree $\mathbf a$ such that, for every $n$, the $n$th skip of $\mathbf a$ is not below the $(n+1)$st skip, equivalently every $n$th skip is nontotal? Can the HYP degrees be characterized as the degrees bounded by all skip $2$-cycles?
