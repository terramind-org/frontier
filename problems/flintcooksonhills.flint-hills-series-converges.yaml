schema: 1
id: flintcooksonhills.flint-hills-series-converges
title: Convergence of the Flint Hills and Cookson Hills series (flint_hills_series_converges)
field: mathematics
tier: proof
statement: |-
  The Flint Hills series summing $csc(n)^2 / n^3$ from $n=1$ to $\infty$ converges.
  (Note that we 0-index the series below.)
