  \item[\hypertarget{source:2879:2}{S2}] R. İnanç Baykur, Robion C. Kirby and Daniel Ruberman (editors), \emph{K3: A New Problem List in Low-Dimensional Topology}, Mathematical Surveys and Monographs 295 (2026), Problem 4.3, p. 193 and following remarks; original author version. \url{https://math.berkeley.edu/sites/default/files/surv-295-ruberman-watermarked-author-pdf.pdf}.
  \end{description}
