lean:
  module: FormalConjectures.Wikipedia.ErdosUlamProblem
  decl: ErdosUlamProblem.erdos_ulam_problem
  statement: |-
    theorem erdos_ulam_problem :
        ∃ S : Set (EuclideanSpace ℝ (Fin 2)), Dense S ∧ PairwiseRationalDistances S
  context:
    - open ErdosUlamProblem
    - open EuclideanSpace
  definitions:
    - name: ErdosUlamProblem.PairwiseRationalDistances
      kind: def
      text: |-
        /-- A set of points of the plane has **pairwise rational distances** if the distance between any
        two of its points is a rational number. -/
        def PairwiseRationalDistances (S : Set (EuclideanSpace ℝ (Fin 2))) : Prop :=
          ∀ p ∈ S, ∀ q ∈ S, ∃ r : ℚ, dist p q = (r : ℝ)
