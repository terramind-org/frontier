title: Kourovka Notebook Problem 15.67
field: mathematics
tier: prose
statement: |-
  Which adjoint Chevalley groups (of
  normal type) over the integers are generated by three involutions
  two of which commute?

  The groups $SL_n({\mathbb{Z})$, $n>13$, satisfy
  this condition (M. C. Tamburini, P. Zucca, *J. Algebra*,
  **195**, no. 2 (1997), 650--661). The groups
  $PSL_n({\mathbb{Z})$ satisfy it if and only if
  $n>4$ (N. Ya. Nuzhin, *Vladikavkaz. Mat. Zh.*, **10**,
  no. 1 (2008), 68--74 (Russian)). The group
  $PSp_4({\mathbb{Z})$ does not satisfy it, which follows from the
  corresponding fact for $PSp_4(3)$, see Archive, 7.30.
  The group $G_2$
  satisfies it (I. A. Timofeenko, *J. Siberian Fed. Univ. Ser. Math. Phys.*, **8**, no. 1 (2015), 104--108. The group $E_l$ satisfies it (I. A. Timofeenko, *Sibrsk. \`Electron. Mat. Izv.*, **14** (2017), 807--820 (Russian)).
