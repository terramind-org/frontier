title: Open Problems in Pluripotential Theory — Question 16
field: mathematics
tier: prose
statement: |-
  [Zeriahi]
  Let $\mu$ be a probability measure in a bounded pseudoconvex domain $\Omega \subset {\mathbb{C}}^n$.
  Assume there is a H\"older continuous subsolution to the Dirichlet problem, i.e. there is a
  H\"older continuous psh function $u$ in $\Omega$ such that $u_{|\partial \Omega} =0$ and
  $\mu \leq (dd^c u)^n$ in $\Omega$.
  Is there a H\"older continuous psh function $\varphi$ such that $\varphi_{|\partial \Omega} =0$ and
  $\mu = (dd^c \varphi)^n$ in $\Omega$ ?
