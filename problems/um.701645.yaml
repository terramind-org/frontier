title: Kourovka Notebook Problem 19.97
field: mathematics
tier: prose
statement: |-
  Let $G$ be an $m$-generated group the elementary theory of which $Th(G)$ coincides with the elementary theory
  $Th(F)$ of a free soluble group $F$ of derived length $n
  \geq 3$ of finite rank $r \geq 2$. Must the groups $G$ and
  $F$ be isomorphic?

  The answer is affirmative if $m \leq r$ or $n=2$
