title: Spectrum Comparison for Finite Tensor Categories
field: mathematics
tier: prose
statement: Let $\mathcal T$ be a finite tensor category, let $\underline{\mathcal T}$ be its stable category, and let $C_{\mathcal T}^{\bullet}$ be the categorical center of its cohomology ring. Is the continuous central-support comparison map $$\rho:\operatorname{Spc}(\underline{\mathcal T})\longrightarrow\operatorname{Proj} C_{\mathcal T}^{\bullet}$$ from the Balmer spectrum of the stable category to the projective spectrum of the categorical center a homeomorphism for every $\mathcal T$?
