title: Sharp Korn–Sobolev Constants and Shape-Preserving Approximation
field: mathematics
tier: prose
statement: For the endpoint Korn–Sobolev inequality $$\left(\int_{\mathbb R^n}|u|^{n/(n-1)}\,dx\right)^{(n-1)/n}\leq C\int_{\mathbb R^n}|\varepsilon(u)|\,dx$$ for compactly supported vector fields, determine the best constant and an isoperimetric interpretation. Also determine whether a $C^2$ approximation to a convex, respectively subharmonic, function can itself be chosen convex, respectively subharmonic.
