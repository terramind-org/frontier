statement: |-
  **Question 2 (Christ).** On $\mathbb R^d$, let $E\subset\mathbb R^d$ with $|E|=1$. Given $q>2$, describe the set $E$ that maximises the quantity $\|\widehat{\mathbf 1_E}\|_q$.

  This record is Question 2 from the AIM workshop problem list *Carleson theorems and multilinear operators*. The PDF states:

  The displayed expression in the PDF is unambiguously
  \[
     \|\widehat{\mathbf 1_E}\|_{L^q(\mathbb R^d)}. \]
  The accompanying 2015 status paragraph reports existence for all $q>2$ and several perturbative classification results. Its symbol $2N$ means an even integer $2N\ge4$, rather than multiplication by a fixed but unspecified parameter.
