title: Open Problems in Mathematical Logic — Problem 8
field: mathematics
tier: prose
statement: |-
  \[
  A\le_{SJT} B
  \iff
  \forall Y \omega\text{-c.a. and }Y\in\mathrm{MLR}
  \Bigl(
  A\le_T B\oplus Y
  \Bigr).
  \]

  Let Rec denote the class of recursive sets.

  Is there a $\Pi^0_1$ class $C$ such that $|C\cap \mathrm{Rec}|=\infty$ and $C\cap \mathrm{Rec}$ is maximally almost disjoint among the recursive sets?
