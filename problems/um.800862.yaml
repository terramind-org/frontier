title: Open Problems in Algebraic Statistics — Specific Problem 1
field: mathematics
tier: prose
statement: |-
  Our first question concerns three-dimensional contingency tables
  $(p_{ijk})$ whose indices $i,j,k$ range over a set of four elements,
  such as the set $ \{{\tt A},{\tt C},{\tt G},{\tt T}\}$ of DNA bases.

  }
  {\em Consider the
  variety of $4 {\times} 4 {\times} 4$-tables
  of tensor rank at most $4$.
  There are certain known polynomials
  of degree at most nine which vanish on this variety.
  Do they suffice to cut out the variety?}
