title: Measure-sensitive resonance and PL-versus-birational period rigidity
field: mathematics
tier: prose
statement: |-
  **Problem 2.6.** Find/define analogues of resonance phenomena for the PL dynamical
  systems mentioned above and their birational lifts.

  For background on piecewise-linear and birational lifts of toggle-group actions, see
  [EPb] and the more detailed article-in-progress [EPa].

  The preceding paragraph is essential context. It says that observed piecewise-linear
  (PL) lifts can have a spectrum of periods, each supported on a positive-measure part of
  the ambient polytope. For the PL lift of gyration on order-4 alternating-sign matrices,
  the list reports many periods 8 and 24, larger periods, and essentially no period 16. The problem asks for a precise analogue that relates such interior behavior to the
  earlier, discrete notion of resonance.
