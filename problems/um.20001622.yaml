statement: |-
  Is there a group with Tarski number 7?

  If this group is amenable, the Folner function of this group is universal bound.

  Is the universal Grigorchuk group amenable?

  If this group is amenable, then the Folner function of this group is universal bound on Folner function of $G_\omega$.
