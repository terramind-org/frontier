title: Toms–Winter Conjecture for Nuclear $C^*$-Algebras
field: mathematics
tier: prose
statement: "For a simple, unital, nuclear $C^*$-algebra $A$, are the following equivalent: (1) $A$ has finite nuclear dimension; (2) $A\\cong A\\otimes\\mathcal{Z}$, where $\\mathcal{Z}$ is the Jiang–Su algebra; and (3) $A$ has strict comparison?"
