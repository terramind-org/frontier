title: Kourovka Notebook Problem 8.44
field: mathematics
tier: prose
statement: |-
  Prove or disprove that for all, but finitely
  many, primes $p$ the group $$G_p=\left< a, b\mid
  a^2=b^p=(ab)^3=(b^rab^{-2r}a)^2=1\right> ,$$
  where $r^2 + 1 \equiv 0 (\mathrm{mod} p)$, is infinite. A
  solution of this problem would have interesting topological
  applications. It was proved with the aid of computer that
  $G_p$ is finite for $p \leq 17$.
