title: Research Problems in Function Theory — Problem 7.69
field: mathematics
tier: prose
statement: "Given an associative algebra $A$, with identity $1$ and countable basis, then for a finite-dimensional subspace $V$ spanned by the vectors $\\{e_j\\}^k_{j=1}$ we have the differential operator \\[\\sum^k_{j=1}e_j\\frac{\\partial}{\\partial x_j}\\] acting on differentiable functions defined over domains in $V$ and taking their values in $A$. We call a function $f: U\\subseteq V\\to A$ a left analytic function if \\[\\sum^k_{j=1}e_j\\frac{\\partial f}{\\partial x_j}(x)=0\\] for all $x\\in U$. Ryan has shown that there is a generalised Cauchy integral formula \\[f(x_0)=\\int_{\\partial M}G(x,x_0)\\sum^k_{j=1}(-1)^je_j\\,d\\hat{x}_jf(x),\\] with real-analytic kernel $G(x,x_0)$, where $M$ is an arbitrary, compact real $n$-dimensional manifold lying in $U$; and $x_0\\in \\mathring{M}$ if and only if there are elements $\\{p_j\\}^k_{j=1}\\subseteq A$ satisfying the relation \\[p_je_l+p_le_j=2\\delta_{jl}.\\] [(a)] ; Is the result still valid if we only assume $G(x,x_0)$ to be a $C^1$ function? ; What analogous result holds if we assume the algebra to be non-associative? (J. Ryan)"
