title: Connectedness in the Real Spectrum
field: mathematics
tier: prose
statement: Let $A = R[x_1, \ldots, x_n]$ be a polynomial ring over a real closed field $R$, let $\operatorname{Sper} A$ be its real spectrum, and for $\alpha, \beta \in \operatorname{Sper} A$ let $\langle \alpha, \beta \rangle \subseteq A$ denote the separating ideal in the sense of the Pierce--Birkhoff conjecture. If $g_1, \ldots, g_s \in A$ lie outside $\langle \alpha, \beta \rangle$, is there a connected subset $C \subseteq \operatorname{Sper} A$ containing $\alpha$ and $\beta$ and disjoint from every zero set $\{g_i = 0\}$? Equivalently, do $\alpha$ and $\beta$ lie in the same connected component of $\operatorname{Sper} A \setminus \bigcup_{i=1}^s \{g_i = 0\}$?
