title: Stability Manifolds for Threefold Flops
field: mathematics
tier: prose
statement: For the category $\mathcal D$ associated with a threefold flopping contraction, determine whether its distinguished stability-manifold component regularly covering the associated hyperplane complement is the universal cover, whether the mutation action is faithful, whether $\operatorname{Stab}(\mathcal D)$ is connected, and whether the distinguished component is contractible; equivalently, determine whether the hyperplane complement is a $K(\pi,1)$ space.
