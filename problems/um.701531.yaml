title: Kourovka Notebook Problem 18.103
field: mathematics
tier: prose
statement: |-
  A group is said to be *minimax* if it has a finite subnormal series each of whose factors satisfies either the minimum or the maximum condition on subgroups.
  Is it true that in the class of nilpotent minimax groups only finitely generated groups may have faithful irreducible primitive representations over a finitely generated field of characteristic zero?
