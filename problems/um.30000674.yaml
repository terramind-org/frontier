title: Asymptotic Dynamics of Group Automorphism Orbits
field: mathematics
tier: prose
statement: Let $G$ be a finitely generated group, let $\alpha$ be an automorphism of $G$, and let $g\in G$. What can be said about $\alpha^n(g)$ as $n\to\infty$? More specifically, for periodic $g$, what bounds or descriptions exist for its period; for nonperiodic $g$, how does its length grow; and does the sequence converge in a suitable sense, possibly after replacing $\alpha$ by a power?
