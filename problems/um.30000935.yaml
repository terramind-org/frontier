title: Growth Expansion and Mixing in Groups and Graphs
field: mathematics
tier: prose
statement: For a graph $\Gamma$, how many vertices can be reached from a given vertex in a given time? For a generating set $A$ of an infinite group $G$, how does $B(t)=|\{\text{products of at most }t\text{ elements of }A\}|$ grow? For the random walk generated by $A$ on a finite group, how quickly does it approach equidistribution, and what lower bounds hold for the gap between the two largest adjacency eigenvalues? For $A$ in an abelian group, how large can $A+A$ be relative to $A$? For $A$ in a general group, how large can $A\cdot A\cdot A$ be relative to $A$?
