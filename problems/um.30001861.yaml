title: Undecidable Word Problems in Wreath Product Quotients
field: mathematics
tier: prose
statement: Let $F$ be a finite-rank free group, let $S$ be finite, and let $\phi:F\to F\wr_S\operatorname{Sym}(S)$ define iterated actions of $F$ on $S^n$. Let $N$ be the kernel of the action on the disjoint union $\bigsqcup_{n\geq0}S^n$. Can the quotient $F/N$ have an undecidable word problem?
