title: Recursive Determination of Quantum Knot Invariants
field: mathematics
tier: prose
statement: For a complex reductive Lie algebra $\mathfrak g$ and a knot $K$, is the Witten–Reshetikhin–Turaev function $J_{\mathfrak g,K}$ on the weight lattice uniquely determined among Weyl-equivariant functions by finitely many values together with the relations in the Weyl-invariant recursive ideal $I^W_{\mathfrak g,K}$?
