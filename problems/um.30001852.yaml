title: Four-Point Configurations on Three Lines
field: mathematics
tier: prose
statement: Can a nonzero Schwartz function satisfy a recurrence of the form $f(x+1)=C_1f(x-1)+C_2f(x)e(\alpha x)+C_3f(x)e(\beta x)$, where $e(t)=e^{2\pi i t}$? Equivalently, can the associated two-dimensional matrix recurrence have a nonzero solution that decays rapidly for a positive-measure set of initial values $x$?
