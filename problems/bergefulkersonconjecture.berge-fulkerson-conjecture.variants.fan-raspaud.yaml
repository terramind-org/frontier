id: bergefulkersonconjecture.berge-fulkerson-conjecture.variants.fan-raspaud
title: "The Berge–Fulkerson conjecture (variant: fan_raspaud)"
field: mathematics
tier: proof
statement: |-
  **The Fan–Raspaud conjecture (1994).**

  Every bridgeless cubic graph has three perfect matchings with no edge common to all three.
  This would follow from the Berge–Fulkerson conjecture.

  *Reference:* [FR94].
ams:
  - 5
tags:
