title: Unknown minimum dimension and a finite periodic witness reduction
field: mathematics
tier: prose
statement: |-
  **Recovered problem.** What is the **lowest** dimension $d$ for which there is a $d$-dimensional convex body $K$ whose translative packing density is strictly greater than its lattice packing density, i.e.

  \[
  \delta_T(K)>\delta_L(K)?
  \]
