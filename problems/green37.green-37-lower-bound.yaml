lean:
  module: FormalConjectures.GreensOpenProblems.«37»
  decl: Green37.green_37_lower_bound
  statement: |-
    theorem green_37_lower_bound :
        ∃ c : ℕ → ℝ, Tendsto c atTop (nhds 0) ∧
          ∀ k, 0 < k → (fun N : ℕ ↦ (N : ℝ) ^ (1 - c k)) =O[atTop] fun N ↦ (m N k : ℝ)
  context:
    - open Green37
    - open Set Filter
    - open scoped Asymptotics
  definitions:
    - name: Green37.m
      kind: def
      text: |-
        /-- The minimum size of a subset of `ℕ` that contains, for each `d = 1, …, N`,
        an arithmetic progression of length `k` with common difference `d`. -/
        noncomputable def m (N k : ℕ) : ℕ :=
          sInf { m | ∃ A : Finset ℕ, A.card = m ∧ IsAPCover (A : Set ℕ) N k }
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/GreensOpenProblems/37.lean#L41
