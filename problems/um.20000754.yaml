title: Primitive balanced proper triples of sums of two squares
field: mathematics
tier: prose
statement: |-
  **19. Triples in prime-like sequences.**

  • C. Elsholtz asked whether it is possible to find infinitely many triples \(s_n,s_{n+1},s_{n+2}\), with \(s_{n+2}-s_n\) bounded, in sequences that are commonly considered to be similar to but more manageable than the primes (e.g., integers that are sums of two squares).

  • K. B. Ford noted that for sums of two squares the problem is trivial, because of triples of the form \(n^2,n^2+1,n^2+4\), for example.

  • J. B. Friedlander suggested that such trivialities can be avoided by requiring that the two squares be of comparable sizes. S. W. Graham and T. D. Wooley proposed another option: produce “many” gaps.

  • R. C. Vaughan proposed considering the more general question of triples of values of norm-forms.
