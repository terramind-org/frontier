title: Complexity in Enumerative Combinatorics — Conjecture 8 (cf. [Zei])
field: mathematics
tier: prose
statement: |-
  Let $a_n$ denotes the number of self-avoiding walks $O\to O$
  in $\mathbb{Z}^2$ of length $n$. Then the sequence $\{a_n\}$ has
  no Wilfian formula of type \textup{\small $($\textrm{W1}$)$}.
