title: Quantitative causal mollification and structural obstructions for state-dependent delay
field: mathematics
tier: prose
statement: |-
  This is record 1 from the AIM workshop *Low dimensional structures in dynamical systems with variable time lags* (June 2010). Its four subquestions, with line wrapping repaired but mathematical signs preserved, are:

  1. **Existence and smoothness of local invariant manifolds at equilibria for neutral differential equations with state-dependent delay.** A particular class is
     \[
     x'(t)=A\bigl(x'(t-r(x(t)))\bigr)+f(x(t)),
     \]
     with a linear operator \(A\), a delay function \(r\), and a smooth nonlinearity \(f\).
  2. **Extension of “lap-number” techniques to the widest possible class of equations with delay.** The PDF lists equations with non-monotonic delay, implicitly defined delay, and “multiple delay,” and suggests numerical case studies as input to analysis.
  3. **How does a state-dependent delay change the dynamics in contrast to a constant delay?** Suggested test cases are scalar Wright or Mackey--Glass equations, scalar equations with two or more delays, and higher-order equations with one or more delays.
  4. **Approximation of delay dependence**
     \[
     x(t+r(x(t)))
     \]
     **by distributed/integral terms to improve smoothness properties.**
