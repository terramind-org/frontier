lean:
  module: FormalConjectures.OEIS.«110854»
  decl: OeisA110854.conjecture
  statement: |-
    theorem conjecture :
      ∀ d : ℕ, (d = 1 ∨ Even d) → ∃ n > 0, d = (a n).natAbs
  context:
    - open OeisA110854
    - open Nat
  definitions:
    - name: OeisA110854.a
      kind: def
      text: |-
        /--
        The primary defining sequence `a`.
        $a(n)$ is $\mathrm{prime}(2n+2) - \mathrm{prime}(2n+1) - \mathrm{prime}(2n) + \mathrm{prime}(2n-1)$.
        -/
        noncomputable def a (n : ℕ) : ℤ :=
          let p (k : ℕ) : ℤ := (Nat.nth Nat.Prime (k - 1)).cast
          if n = 0 then 0
          else p (2 * n + 2) - p (2 * n + 1) - p (2 * n) + p (2 * n - 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/110854.lean#L36
