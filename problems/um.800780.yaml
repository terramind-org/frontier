title: Local Discrete Holomorphic Dynamics — Open Problem Q3
field: mathematics
tier: prose
statement: |-
  \emph{Find a (possibly small) class $\mathcal{F}$ of holomorphic
  local dynamical systems at $O\in\mathbb{C}^n$ such that every
  holomorphic local dynamical system $f$ at a point in an
  $n$-dimensional complex manifold is holomorphically (respectively,
  smoothly, $C^k$, or topologically) locally conjugated to a (possibly) unique element
  of $\mathcal{F}$, called *holomorphic* (respectively, *smooth,* $C^k$ or
  *topological*) *normal form* of $f$.}

  Unfortunately, the holomorphic classification is often too
  complicated to be practical; the family $\mathcal{F}$ of normal forms might
  be uncountable. A possible replacement is looking for invariants
  instead of normal forms:
