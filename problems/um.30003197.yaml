title: Density and Closure of Mixed Hodge Loci
field: mathematics
tier: prose
statement: For a variation $V$ of mixed Hodge structures over a smooth quasi-projective variety $S$, what geometric constraints exist on the Zariski closure of its Hodge locus $\operatorname{HL}(S,V)$? Which pairs $(S,V)$ have $\operatorname{HL}(S,V)$ Zariski dense in $S$?
