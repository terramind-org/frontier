title: Linear Representations of Ascending Free-Group Mapping Tori
field: mathematics
tier: prose
statement: Let $F_n$ be a free group of rank at least two, let $\phi:F_n\to F_n$ be irreducible, proper, and injective, and let $G$ be its mapping-torus fundamental group. Can $G$ be embedded in $SL_2(\mathbb C)$?
