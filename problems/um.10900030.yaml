title: 5.5 (Agol) — Asymptotic frequency of small drilled manifolds
field: mathematics
tier: prose
statement: Fix $\mu$ below the three-dimensional Margulis constant. For hyperbolic $3$-manifolds of volume less than $V$, drill all closed geodesics of length less than $\mu$, discard duplicate resulting manifolds, and let $s(V)$ be the fraction of this finite collection that are small, meaning they contain no closed incompressible non-boundary-parallel surface. What is the limiting behavior of $s(V)$ as $V\to\infty$, and how does it depend on $\mu$?
