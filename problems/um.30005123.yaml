title: Fermionized Yangians from Quivers with Potential
field: mathematics
tier: prose
statement: Can the cohomological Hall-algebra construction for preprojective algebras be partially fermionized to recover Yangians of classical Lie superalgebras such as $\mathfrak{gl}(m|n)$? Equivalently, can one choose a quiver $Q'$ and potential $W'$ so that $A_{Q',W'}$ partially fermionizes $A_{\widetilde Q,\widetilde W}$?
