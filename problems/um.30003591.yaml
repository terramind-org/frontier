id: um.30003591
title: Convex Geometry and Limits of Asymptotic Higher Cohomology
field: mathematics
tier: prose
statement: Is there a convex-geometric analogue of the Newton–Okounkov interpretation of volume for the asymptotic higher-cohomology functions $$\widehat h^i(D)=(\dim X)!\limsup_{m\to\infty}\frac{\dim H^i(X,\mathcal O_X(mD))}{m^{\dim X}}?$$ In particular, can $\widehat h^i(D)$ be realized as a Euclidean volume, and can the limsup in its definition always be replaced by a limit?
