title: Lagrangian Matching and Seiberg–Witten Invariants
field: mathematics
tier: prose
statement: Let $(X, \pi)$ be a closed oriented $4$-manifold equipped with a broken Lefschetz pencil (or near-symplectic structure) $\pi$, and let $S$ be the set of $\mathrm{Spin}^c$ structures on $X$. For every $s \in S$, does Perutz's Lagrangian matching invariant $L_{X,\pi}(s)$ coincide up to sign with the Seiberg--Witten invariant, $L_{X,\pi}(s) = \pm \operatorname{SW}_X(s)$?
