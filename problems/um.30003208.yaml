title: Von Neumann Generation of the Algebra T-Psi
field: mathematics
tier: prose
statement: |-
  Let $A$ be a unital $C^*$-algebra and let $\psi$ be a symmetric state on the infinite free product $*_{j=1}^\infty A_j$. In the GNS representation $\pi_\psi$, let

  $$T_\psi=\bigcap_{n\geq1}W^*\!\left(\bigcup_{j\geq n}\pi_\psi(A_j)\right)$$

  be the tail von Neumann algebra, and let $D_\psi\subseteq T_\psi$ be the associated tail $C^*$-algebra obtained from the canonical state-preserving conditional expectation onto $T_\psi$. Is $T_\psi$ generated as a von Neumann algebra by $D_\psi$?
