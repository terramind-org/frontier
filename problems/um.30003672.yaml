title: Relative Commutants and Möbius Nets for Finite-Group Inclusions
field: mathematics
tier: prose
statement: Let $(N_0\subset M_0,\Omega_0)$ be a standard half-sided modular inclusion, and form the free-product inclusion $(N\subset M,\Omega)$ from finitely many isomorphic copies indexed by a finite set $K$. Determine the relative commutant $N'\cap M$. If it is nontrivial, which Möbius-covariant net does the inclusion define?
