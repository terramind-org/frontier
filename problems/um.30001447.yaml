title: Zeros and Poles of Quantum-Group R-Matrices
field: mathematics
tier: prose
statement: |-
  For finite-dimensional $U_q(\mathfrak g)$-modules $V,V'$, determine the zeros and poles of the meromorphic universal $R$-matrix intertwiners

  $$V(z)\otimes V'\longrightarrow V'\otimes V(z),$$

  and their relation to reducibility of tensor products.
