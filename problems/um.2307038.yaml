title: Research Problems in Function Theory — Problem 7.38
field: mathematics
tier: prose
statement: The Hankel matrices of a function $f$ having a Taylor expansion \[f(z)=a_0+a_1z+\ldots\] are defined by \[H^{(n)}_p=(a_{ij});\hspace{1cm}a_{ij}=a_{n+1+j-2};\hspace{1cm}1\leq i,\, j\leq p+1.\] If $f$ belongs to the Pick-Nevanlinna class ($\text{Det } H^{(n)}_p\geq0$, all $n, p$), then all the poles of $f$ are simple and they lie on the positive real axis. Denote by \[\varepsilon^{(n)}_1\geq\varepsilon^{(n)}_2\geq\ldots\geq\varepsilon^{(n)}_p\geq0\] the eigenvalues of $H^{(n)}_p$. Then \[\limsup_{n\to\infty}(\varepsilon^{(n)}_j)^{1/n}=\frac{1}{\lambda_j},\] where $\lambda_j$ is the $j$-th pole, where the poles are numbered in order of increasing modulus. What can be said about the eigenvalues under less restrictive conditions? (R. Bouteiller)
