title: An unbounded family of BNS component orbits for free-by-cyclic groups
field: mathematics
tier: prose
statement: Find families of examples of free-by-cyclic groups $G$ such that $b_1(G)>2$ and the BNS invariant of $G$ has many components (up to the action of $\operatorname{Out}(G)$).
