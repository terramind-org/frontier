title: Nijenhuis Geometry and Integrable Systems — Problem 5
field: mathematics
tier: prose
statement: |-
  Which Nijenhuis operators admit (The answer is known near almost every points and follows from the local description of geodesically compatible pairs in [splitting2, splitting1]. The question is most interesting near singular points of the Nijenhuis operator.) at least one geodesically compatible metric $g$?
  Given $L$, describe all the metrics geodesically compatible with it. Under some additional assumptions ($L$ has $n$ different eigenvalues at generic points and $g$ is Riemannian), the problem was solved in [Matveev2006].
  The case of metrics of non-Riemannian signatures, even in dimension 2, is still open. The Riemannian case is solved in [BMF], and the description of 2-dimensional geodesically compatible pairs such that $g$ has signature $(+,-)$ near regular points is in [BMP,japan].
