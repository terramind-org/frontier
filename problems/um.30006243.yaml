title: Babai Polylogarithmic Diameter Conjecture for Finite Simple Groups
field: mathematics
tier: prose
statement: Prove that there is an absolute constant $C$ such that, for every finite simple group $G$ and every generating subset $A\subseteq G$, one has $A^\ell=G$ for some $\ell\leq(\log|G|)^C$.
