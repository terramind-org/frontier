title: Open Problems in Arithmetic Dynamics — Question 35
field: mathematics
tier: prose
statement: |-
  Let $f\in\mathbb{C}_v(z)$ with $\deg f = d\geq 2$. Can $f$ have infinitely many periodic cycles
  of indifferent components that are not disks? If not, is there a bound in terms of $d$
  for the number of such cycles? Do the answers depend on the field $\mathbb{C}_v$?
