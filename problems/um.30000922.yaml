title: Blaschke Approximation of Inner-Function Arguments
field: mathematics
tier: prose
statement: For an inner function $B$ on the unit disk $D$, does there exist an interpolating Blaschke product $I$ such that $\operatorname{Arg}B-\operatorname{Arg}I=\widetilde{v}$ for some $v\in L^\infty(\partial D)$? Does there exist such an $I$ with $\operatorname{Arg}B-\operatorname{Arg}I=u+\widetilde{v}$ for $u,v\in L^\infty(\partial D)$ and $\lVert u\rVert_\infty<\pi/2$?
