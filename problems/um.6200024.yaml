title: Boundaries of Groups and Kleinian Groups — Problem 24
field: mathematics
tier: prose
statement: "Any CAT (0) group has no inﬁnite-torsion subgroups. A Euclidean retract is a compact space that embeds into some Rn as a retract. A compact metrizable space Z is a Z-set in ˜X if it is “homotopically negligible” (for every open U ⊂ ˜X, the inclusion U \\mathbb{Z} in U is a homotopy equivalence). A Z-structure on a group G is a pair ( ˜X, Z ) such that • ˜X is a Euclidean retract, • Z is a Z-set in ˜X, • X:= ˜X \\ Z admits a covering space action of G with X/G compact, • the set of translates of any compact set K ⊂ X is a null sequence in ˜X (that is, for each ϵ > 0 there are only ﬁnitely many translates with diam > ϵ). Finally, Z is a boundary of G (or Z-structure boundary) if there exists a Z-structure ( ˜X, Z ) on G. The above notion boundary of G was generalized by T. Farrell and J. Lafont as follows: An EZ-boundary of a group G is a boundary Z = ∂EZ G so that the action of G on X extends to topological action of G on Z."
