title: Arithmetic tau interpretation and flat tropical Monge-Ampere rigidity
field: mathematics
tier: prose
statement: "A. From number theory: Consider one polynomial in one variable with integer coeffi-cients, written as a straight line program of complexity τ. How many roots are there which are congruent to 1 modulo p, as a function of τ?There exist estimates using amoeba theory, by work of Maurice Rojas. B. Prove Calabi conjecture for tropical Calabi-Yaus: in each metric class there is a unique metric which solves the tropical Monge-Amp` ere measure. In the real case this corresponds to det(Hessian) = const."
