title: Kodaira dimensions of the stable-curve moduli spaces in the transition range
field: mathematics
tier: prose
statement: |-
  **Problem 5.2.** Determine the Kodaira dimension of
  \(\overline{\mathcal M}_g\) when \(g=15\) or \(17\leq g\leq22\).
  For \(g>22\), \(\overline{\mathcal M}_g\) is of general type, and in
  the other known cases, the Kodaira dimension is negative.
