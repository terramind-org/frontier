title: Several Complex Variables Problem List — Problem 55
field: mathematics
tier: prose
statement: |-
  {\bf (New) What is the lowest degree of a polynomial mapping
  $P: \mathbb{R}^2 \rightarrow \mathbb{R}^2$ for which the (real) Jacobian conjecture
  fails, i.e. the Jacobian of $P$ never vanishes while $p$ fails
  to be invertible.}
