id: oeisa232616.conjecture-3
title: "Least $m > 0$ such that $\\{2^k - k : k = 1, \\dots, m\\}$ covers all residues modulo $n$ (conjecture_3)"
field: mathematics
tier: proof
statement: |-
  Conjecture (ii), second equation: The Diophantine equation $x^n + n = y^m$ with $m, n, x, y > 1$
  only has two integral solutions: $5^2 + 2 = 3^3$ and $5^3 + 3 = 2^7$.
