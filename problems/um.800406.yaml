title: Open Problems in Arithmetic Dynamics — Question 29
field: mathematics
tier: prose
statement: |-
  Let $f:\mathbb{P}^N\dashrightarrow\mathbb{P}^N$ be a dominant rational map defined
  over ${\bar{\mathbb{Q}}}$, and let $P\in\mathbb{P}^N({\bar{\mathbb{Q}}})_f$ be a point whose
  orbit $\mathcal{O}_f(P)$ is Zariski dense in $\mathbb{P}^N$. Is it true that
  there exist integers $k_f$ and $\ell_f$ with $0\le\ell_f\le N$ such
  that
  \begin{equation}

  h\bigl(f^n(P)\bigr) \asymp \delta_f^n\cdot n^{\ell_f}\cdot (\log n)^{k_f},
  \end{equation}
  where the implied constants depend on $f$ and $P$, but not on $n$?
  Further, if $\delta_f>1$, is it true that $k_f=0$?
