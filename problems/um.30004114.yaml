title: Formal Hyperplanes in Periodic Bordism
field: mathematics
tier: prose
statement: For periodic bordism $MP$, does there exist a formal group with underlying formal hyperplane $MP[[t]]$ whose induced formal group over $\pi_0(MP)$ is additive, and do the three formal hyperplanes corepresented by $MP[t^{\pm1}]$ completed at $t^{-1}$, $MP[[t]]$, and $MP^{\mathbb{CP}^\infty}$ agree?
