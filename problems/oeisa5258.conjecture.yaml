lean:
  module: FormalConjectures.OEIS.«5258»
  decl: OeisA5258.conjecture
  statement: "theorem conjecture (n : ℕ) (hn : 1 ≤ n) : Irreducible (aperyPoly n)"
  context:
    - open OeisA5258
  definitions:
    - name: OeisA5258.aperyPoly
      kind: def
      text: |-
        /-- The polynomial associated with the $n$-th Apéry number:
        $a_n(x) = \sum_{k=0}^n \binom{n}{k}^2 \binom{n+k}{k} x^k$. -/
        noncomputable def aperyPoly (n : ℕ) : ℚ[X] :=
          ∑ k ∈ Finset.range (n + 1),
            C (((n.choose k) ^ 2 * ((n + k).choose k) : ℕ) : ℚ) * X ^ k
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/OEIS/5258.lean#L54
