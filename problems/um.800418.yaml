title: Open Problems in Arithmetic Dynamics — Question 41
field: mathematics
tier: prose
statement: |-
  Fix an integer $N\ge1$ and a prime power $q$. Is it true that
  \[
  \frac{1}{\#\operatorname{End}_d^N(\mathbb{F}_q)} \sum_{f\in\operatorname{End}_d^N(\mathbb{F}_q)} \operatorname{Comp}(\Gamma_f) = \operatorname{Comp}_{\mathrm{avg}}\bigl(\#\mathbb{P}^N(\mathbb{F}_q)\bigr) + O(1)
  \quad\text{as $d\to\infty$?}
  \]
