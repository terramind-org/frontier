title: "Adjunction beyond l.c.i. embeddings: status, a quantifier obstruction, and an exact slice identity"
field: mathematics
tier: prose
statement: |-
  **Problem 8 (Schwede).** Let \(Y\) be a smooth projective variety and let \(X\subset Y\) be an irreducible subvariety of codimension \(r\). Assume that \(X\) is normal and \(\mathbb Q\)-Gorenstein, and let \(\mathcal I=\mathcal I_{X/Y}\). If \(X\) is locally a complete intersection, then
  \[
   (Y,\mathcal I^r)\text{ is log canonical}
   \quad\Longleftrightarrow\quad
   X\text{ is log canonical}.
  \]
  This is not true with the ordinary-power pair when \(X\) is not l.c.i. Is
  \[
   (Y,\mathcal I^{(r)})\text{ log canonical}
   \quad\Longleftrightarrow\quad
   X\text{ log canonical}?
  \]
  Here \(\mathcal I^{(r)}\) is the \(r\)-th symbolic power.

  **Problem 9 (Mustaţă).** Is there an adjunction formula for multiplier ideals under restriction to subvarieties that are not defined by a regular sequence?

  **Problem 10 (de Fernex).** Let \(X\) be smooth and \(B\subset X\) a proper closed subscheme. Suppose that a prime divisor \(E\) over \(X\), with center \(P\), satisfies
  \[
   a_E(X,cB)\leq 0
  \]
  for some \(c>0\). Fix \(1\leq e<\dim X\). Does there exist a smooth subvariety \(Y\subset X\) of codimension \(e\), with \(P\subset Y\) and \(Y\not\subset B\), and a divisor \(F\) over \(Y\), centered at \(P\), such that
  \[
   a_F\bigl(Y,cB|_Y-eP\bigr)\leq 0?
  \]
