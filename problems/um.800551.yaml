statement: |-
  \begin{unsolved}
  Are there $(2k+2)$-regular bar $k$-visibility graphs for $k \geq 5$?
  \end{unsolved}

  \begin{unsolved}
  Are there $d$-regular bar $k$-visibility graphs with $d \geq 2k+3$?
  \end{unsolved}

  Improve the current upper bound of $6k+6$ on the chromatic number of a bar $k$-visibility graph.
