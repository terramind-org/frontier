title: Horospherical Radon measures and a centralizer-character obstruction
field: mathematics
tier: prose
statement: |-
  **Question 11 (F. Ledrappier, O. Sarig).** Let \(G\) be a noncompact semisimple Lie group of rank one, \(\Gamma\) a disctrete subgroup of \(G\), and \(U\) a horospherical subgroup of \(G\). What are the \(U\)-ergodic Radon measures on \(G/\Gamma\)? In particular, are they either carried by closed \(U\)-orbits or given by the harmonic function construction?

  A \(u_t\)-invariant measure \(\mu\) is called squashable if the centralizer of \(u_t\) contains an invertible nonsingular transformation that does not preserve \(\mu\). F. Ledrappier and O. Sarig showed recently that for a normal coabelian subgroup \(\Gamma\) of a uniform lattice, the only nonsquashable \(u_t\)-ergodic measure on \(\mathrm{SL}(2,\mathbb R)/\Gamma\) is Haar. If \(\Gamma\) is conilpotent, then any \(u_t\)-ergodic measure on \(\mathrm{SL}(2,\mathbb R)/\Gamma\) is squashable except possibly the Haar measure.
