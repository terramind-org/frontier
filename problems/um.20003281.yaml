title: A toral finite-orbit-or-Haar theorem and the intermediate-support obstruction
field: mathematics
tier: prose
statement: |-
  **Conjecture 14 (A. Furman).** Consider one of the following actions of a group \(\Gamma\):

  1. \(\Gamma\) is a “large” subgroup of the group of automorphism of a nilmanifold of finite volume.
  2. \(\Gamma\) is a “large” subgroup of a Lie group acting by translations on \(G/\Lambda\), where \(\Lambda\) is a lattice in \(G\).

  Then the only ergodic \(\Gamma\)-invariant probability measures are the measures supported on finite \(\Gamma\)-orbits and the Haar measure.
