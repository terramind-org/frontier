id: erdos291.erdos-291.variants.shiu-heuristic-asymptotic
title: "Erdős Problem 291 (variant: shiu_heuristic_asymptotic)"
field: mathematics
tier: proof
statement: |-
  This leads to a heuristic prediction (see for example a preprint of Shiu [Sh16]) of
  $\asymp\frac{x}{\log x}$ for the number of $n\in [1,x]$ such that $(a_n,L_n)=1$.
