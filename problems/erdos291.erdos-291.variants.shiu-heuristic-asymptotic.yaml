lean:
  module: FormalConjectures.ErdosProblems.«291»
  decl: Erdos291.erdos_291.variants.shiu_heuristic_asymptotic
  statement: |-
    theorem erdos_291.variants.shiu_heuristic_asymptotic :
        Asymptotics.IsTheta atTop
          (fun x : ℕ ↦ ((((Finset.Icc 1 x).filter (fun n ↦ Nat.gcd (a n) (L n) = 1)).card : ℝ)))
          (fun x : ℕ ↦ (x : ℝ) / Real.log x)
  context:
    - open Erdos291
    - open Erdos291.erdos_291
    - open Erdos291.erdos_291.variants
    - open Nat Finset Set Filter
  definitions:
    - name: Erdos291.L
      kind: def
      text: |-
        /--
        $L_n$ is the least common multiple of $\{1,\ldots,n\}$.
        -/
        def L (n : ℕ) : ℕ :=
          (Finset.Icc 1 n).lcm (fun x ↦ x)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/291.lean#L38
    - name: Erdos291.a
      kind: def
      text: |-
        /--
        $a_n$ is defined by $\sum_{1\leq k\leq n}\frac{1}{k}=\frac{a_n}{L_n}$.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ k ∈ Finset.Icc 1 n, L n / k
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/291.lean#L47
