title: Proper Intersections of Phylogenetic Network Varieties
field: mathematics
tier: prose
statement: For two distinct phylogenetic networks $N_1$ and $N_2$, let $V_N$ denote the Zariski closure of the model variety associated with $N$. Characterize when $V_{N_1}\cap V_{N_2}$ is a proper subvariety of both $V_{N_1}$ and $V_{N_2}$.
