title: Sparse Quadrilateral Removal at the Extremal Threshold
field: mathematics
tier: prose
statement: For every $\varepsilon>0$, does there exist $n_0=n_0(\varepsilon)$ such that every graph on $n\geq n_0$ vertices that is the edge-disjoint union of at least $\varepsilon n^{3/2}$ quadrilaterals contains another quadrilateral? Moreover, is it true that some $\delta>0$ exists so that such a graph contains at least $\delta n^2$ quadrilaterals?
