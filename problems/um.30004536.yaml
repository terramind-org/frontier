title: Persistence and Exit Times of Integrated Self-Similar Processes
field: mathematics
tier: prose
statement: For the integral of a general self-similar Markov process, can one determine persistence and exit-time asymptotics? In particular, can one compute $\mathbb{P}_x(T_a\wedge T_b>t)$ as $t\to\infty$, solve the analogous exit-time problem for the integral of a stable Lévy process, and compute the area under a general stable excursion?
