title: What is the list-chromatic number of Sudoku
field: mathematics
tier: prose
statement: ": What is the list-chromatic number of Sudoku? That is, suppose one places k symbols (aka colors) in each cell of a Sudoku board -- not necessarily all the same lists of symbols. What is the least k so that it is always possible to choose a symbol/color from each list for its cell that the resulting choices have no conflicts in rows, columns, or blocks (the 3X3 submatrices that cannot have conflicts in ordinary Sudoku)? This is the Sudoku analogue of the famous Dinitz Conjecture / Galvin Theorem. Even for k=4, the question is open."
