lean:
  module: FormalConjectures.OEIS.«110475»
  decl: OeisA110475.conjecture
  statement: |-
    theorem conjecture :
      ∀ m > 0, m ∉ exceptionalSet ↔ ∃ x y : ℕ, a x = 1 ∧ a y = 1 ∧ m = x + y
  context:
    - open OeisA110475
  definitions:
    - name: OeisA110475.a
      kind: def
      text: |-
        /--
        The primary defining sequence `a`.
        $a(n)$ is the number of symbols '*' and '^' to write the canonical prime factorization of $n$.
        -/
        noncomputable def a (n : ℕ) : ℕ :=
          let f := Nat.factorization n
          let s := f.support
          let numDistinctPrimes := s.card
          let numAsterisks := numDistinctPrimes - 1
          let numCarets := (s.filter fun p => f p > 1).card
          numAsterisks + numCarets
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/110475.lean#L37
    - name: OeisA110475.exceptionalSet
      kind: def
      text: |-
        /-- The set of exceptional integers. -/
        def exceptionalSet : Finset ℕ :=
          {1, 2, 3, 4, 5, 6, 7, 9, 11}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/110475.lean#L85
