id: um.30000744
title: Thresholds for Random-Order Online Graph Coloring
field: mathematics
tier: prose
statement: In the one-player online coloring game where the edges of $K_n$ arrive in random order and are immediately colored with one of $r$ colors while the player avoids a monochromatic copy of a fixed graph $F$, does a threshold $N_0(F,r,n)$ exist such that avoidance is strategically possible for $N\ll N_0$ moves but impossible for $N\gg N_0$? For a tree $F$, is the greedy lower bound $N_0\geq n^{1-1/e_r(F)}$ tight, where $e_r(F)=r(e_F-1)+1$ for a star and $e_r(F)=\frac{kr-1}{k-1}(e_F-1)+1$ otherwise, with $k$ the minimum vertex-cover size of $F$?
