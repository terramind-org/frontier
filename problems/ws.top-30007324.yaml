statement: |-
  \section*{Halting detection by integrated velocity on a planar-periodic fluid domain}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  At fixed positive computable viscosity, can every machine and input effectively determine a smooth force on $R^2×T$, with every mixed derivative globally bounded and horizontally compact support on each finite interval, and a unique global zero-pressure smooth viscous flow with integrable nonnegative $u_3$, such that $integral_{{X_2>0}×T}u_3(t)>1/2$ for some t exactly if the machine halts?
  \subsection{Short English statement}
  At fixed positive computable viscosity, can every machine and input effectively determine a smooth force on $R^2×T$, with every mixed derivative globally bounded and horizontally compact support on each finite interval, and a unique global zero-pressure smooth viscous flow with integrable nonnegative $u_3$, such that $integral_{{X_2>0}×T}u_3(t)>1/2$ for some t exactly if the machine halts?
