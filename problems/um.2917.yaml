title: Kirby Problem 4.41
field: mathematics
tier: prose
statement: "Let $\\Sigma$ be a compact surface and let X be a connected 4manifold. Let $f_{0}, f_{1}: \\Sigma \\to X$ be $\\pi_{1}-negligible$ embeddings that agree on $\\partial\\Sigma$ and that are homotopic rel. boundary. Give computable invariants that decide whether there is $a \\pi_{1}-negligible$ concordance in $X \\times I$ between $f_{0}$ and $f_{1}$."
