title: Kourovka Notebook Problem 18.45
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finite $p$-group of maximal class such that all its irreducible characters are induced from linear characters of normal subgroups. Let $S$ be the set of the derived
  subgroups of the members of the central series of $G$. Is there a logarithmic bound for the derived length of $G$
  in terms of $|S|$?
