title: A moment ladder and tuple-error barrier for a converse from bounded gaps
field: mathematics
tier: prose
statement: |-
  **17. Elliott--Halberstam from bounded gaps.**

  During the workshop, much attention focused on how to prove
  \(\mathrm{EH}(\theta)\) with \(\theta>1/2\), so we can deduce the existence
  of bounded gaps between primes.  V. Blomer asked whether it is possible to
  go the opposite way and derive an improvement on the Bombieri--Vinogradov
  theorem from a “strong” quantitative result on bounded gaps between primes.

  R. C. Vaughan commented that such an improvement would encode so much
  information about \(L\)-functions that the hypothesis would have to be
  extremely strong.

  K. Soundararajan added that the “strong quantitative result” could be as
  strong as the Hardy--Littlewood \(k\)-tuple conjecture with a sharp error
  term, say \(O(N^{1/2+\epsilon})\).
