title: Problem 3.17 — (Logarithmic densities of the Johnson filtration).
field: mathematics
tier: prose
statement: "(Logarithmic densities of the Johnson filtration). Determine the asymptotics of dlog(Ig(m)) both as g→∞ and as m→∞. Indeed, as far as I know, even the asymptotics of the (logarithmic) density of the kth term of the lower central series of π1Σg in π1Σg as k→∞ has not been determined. Entropy. The exponential growth rate of a group Γ with respect to a finite generating set S is defined as w(Γ,S ):= lim r→∞ (Br(Γ,S ))1/r 4For a wonderful discussion of this kind of issue, see Barry Mazur’s article [ Maz]. 30 B. Farb where Br(Γ,S ) denotes the cardinality of the r-ball in the Cayley graph of Γ with respect to the generating set S; the limit exists since β is submultiplicative. The entropy of Γ is defined to be ent(Γ) = inf {logw(Γ,S ): S is finite and generates Γ } Among other things, the group-theoretic entropy of ent( π1M ) of a closed, Riemannian mani- fold M gives a lower bound for (the product of diameter times) both the volume growth entropy of M and the topological entropy of the geodesic flow on M. See [ Harp1] for a survey. Eskin-Mozes-Oh [ EMO] proved that nonsolvable, finitely-generated linear groups Γ have positive entropy. Since it is classical that the action of Mod g on H1(Σg, Z) gives a surjection Modg→ Sp(2g, Z), it follows immediately that ent(Mod g)> 0. This method of proving positivity of entropy fails for the Torelli group Ig since it is in the kernel of the standard symplectic repre- sentation of Mod g. However, one can consider the action of Ig on the homology of the universal abelian cover of Σ g, considered as a (finitely generated) module over the corresponding covering group, to find a linear representation of Ig which is not virtually solvable. This is basically the Magnus representation. Again by Eskin-Mozes-Oh we conclude that ent( Ig)> 0."
