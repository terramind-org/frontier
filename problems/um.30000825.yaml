title: BNS Invariants and First Resonance Varieties
field: mathematics
tier: prose
statement: For a finitely generated group $G$, what is the relationship between its Bieri–Neumann–Strebel invariant $\Sigma^1(G)$ and its first resonance variety $\mathcal R_1^1(G)$? In particular, when does $\Sigma^1(G)\cup-\Sigma^1(G)=H^1(G;\mathbb R)\setminus\mathcal R_1^1(G)$?
