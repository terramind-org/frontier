title: Boundaries of Groups and Kleinian Groups — Problem 103
field: mathematics
tier: prose
statement: "Extend Rips’ theory to higher-dimensional buildings, e.g. products ofR-trees. Rank rigidity. Let X be a CAT (0) metric space. The space X is said to be or rank ≥ n if every geodesic segment in X is contained in a subset E which is isometric to a ﬂat n-dimensional parallelepiped. If Y is a locally CAT (0) metric space, then Y is said to have rank ≥ n if its universal cover is of rank ≥ n. The rank rigidity theorem proven by Ballmann [1] and by Burns and Spatzier [15, 16] states that: If M is a compact nonpositively curved Riemannian manifold of rank ≥ 2, then either M admits a ﬁnite cover the universal cover of M splits (nontrivially) as a Riemannian direct product or M is a locally symmetric space."
