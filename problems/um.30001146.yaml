title: Non-Integrality Conjecture for Rational Hypersurfaces
field: mathematics
tier: prose
statement: For $n\geq2$, let $V\subset\mathbb{A}^n$ be a hypersurface over $\mathbb{Q}$ with $V(\mathbb{Q})$ Zariski dense. Must $V(\mathbb{Q})\cap((\mathbb{Q}\setminus\mathbb{Z})\times\mathbb{Q}^{n-1})$ also be Zariski dense?
