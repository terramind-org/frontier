title: Banach Spaces and Ramsey Theory — Problem 20
field: mathematics
tier: prose
statement: |-
  On the other hand no consistent bounds, like the one of [DLT]
  mentioned above, is known in this context. So the following problem is wide open.

  Does every (respectively, every reflexive) Banach space of density $>\mathfrak{c}$
  (respectively, of density $>\aleph_1$) has an infinite sub-symmetric basic
  sequence?
