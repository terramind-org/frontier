title: Questions in Geometric Group Theory — Q 1.20
field: mathematics
tier: prose
statement: (Swarup) Suppose $G$ is a hyperbolic group which is a graph of hyperbolic groups such that all edge-to-vertex inclusions are quasi-isometric embeddings. Mitra shows that each vertex-group inclusion $V\hookrightarrow G$ induces a continuous Cannon-Thurston map $\partial V\to\partial G$. Describe its point-preimages; in particular, show that the map is finite-to-one.
