title: Zero-Free One-Forms on Compact Kähler Varieties
field: mathematics
tier: prose
statement: Does the threefold classification for smooth projective varieties whose underlying differentiable manifolds fiber over the circle extend to compact Kähler threefolds? More generally, does every smooth complex projective variety of nonnegative Kodaira dimension with a nowhere-vanishing holomorphic one-form have a birational model admitting a finite étale cover with a positive-dimensional abelian variety as a factor?
