title: Scaling Limit of the Sandpile Height-Zero Field
field: mathematics
tier: prose
statement: |-
  Let $D\subset\mathbb C$ be a bounded smooth domain, let $\nu_\varepsilon$ be the Abelian sandpile measure on $D\cap\varepsilon\mathbb Z^2$, and define the centered height-zero field
  $$
  h_\varepsilon(z)=\mathbf1_{\{\eta(z)=0\}}-\nu_\varepsilon(\eta(z)=0).
  $$
  Does a suitably rescaled $h_\varepsilon$ converge, in an appropriate function or distribution space, to the generalized field $:\!|\nabla h|^2\!:$ as $\varepsilon\downarrow0$?
