title: Normalized Mod-p Cohomology in Arithmetic Lattice Towers
field: mathematics
tier: prose
statement: |-
  Let $\Gamma$ be an arithmetic lattice in $\operatorname{SL}_2(\mathbb C)$, let $p$ be prime, and let $(\Gamma_i)$ be any normal chain of $p$-power-index subgroups with trivial intersection. Does

  $$\frac{\dim H^1(\Gamma_i,\mathbb F_p)}{[\Gamma:\Gamma_i]}$$

  tend to $0$ as $i\to\infty$?
