title: Second-Order Cut Bounds for Uniform Hypergraphs
field: mathematics
tier: prose
statement: Fix integers $k\geq r\geq2$, with either $r\geq3$ or $k\geq4$. Does every $k$-uniform hypergraph with $m$ edges have an $r$-cut of size at least $$\alpha_{r,k}m+\Omega(m^{2/3}),\qquad \alpha_{r,k}=\frac{S(k,r)r!}{r^k}$$?
