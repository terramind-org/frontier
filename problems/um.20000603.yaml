statement: Let \(\{c_k\}_{k=0}^n\subset\mathbb R\) be given. Does there exist a real rooted polynomial, \(p(x)\), with zeros outside \([0,n]\) such that \(c_k=p(k)\), \(k=0,1,\ldots,n\)?
