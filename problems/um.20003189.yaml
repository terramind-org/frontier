title: The K2 avatar of the higher Weil-Petersson form
field: mathematics
tier: prose
statement: |-
  Following on from the previous question, there is also a central extension for \(\mathrm{SL}(n)\)

  \[
  1\longrightarrow K_2(A)\longrightarrow E(n,A)\longrightarrow
  \mathrm{SL}(n,A)\longrightarrow 1.
  \]
  Let \(H_n\) be the Hitchin component, and let \(A=\mathbb Q(H_n)\). Given
  \(\rho:\pi_1(S)\to\mathrm{SL}(n,A)\), we obtain \(q\in K_2(A)\).
  There is \(d\log:K_2(A)\to\Omega^2(H_n)\). Is \(d\log(q)\) the
  Weil--Petersson form?
