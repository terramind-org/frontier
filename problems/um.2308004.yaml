title: Research Problems in Function Theory — Problem 8.4
field: mathematics
tier: prose
statement: "Let $D$ be a simply-connected domain in the complex plane $\\mathbb{C}$ and $A(D)$ the ring of functions $f: D\\to\\mathbb{C}$ analytic in $D$. Bers (no citation) has shown that (for domains of arbitrary connectivity) the algebraic structure of $A(D)$ determines the conformal structure of $D$. Can $A(D)$ be the direct sum of two non-trivial subrings of itself? (This would represent a generalisation of Taylor's Theorem.) Is there a more general result for multiply-connected domains $D$? (J. J. Kelleher)"
