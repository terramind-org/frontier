title: A second-jet obstruction to a nonperiodic flat geodesic
field: mathematics
tier: prose
statement: |-
  **Question 6.2.1 (Burns).** Is there a \(C^\infty\) (or at least \(C^k\), \(k\geq 3\)) metric for which there exists a non closed geodesic along which the Gaussian curvature is everywhere zero?

  A negative answer to this question would give a positive answer to Question 6.1.1.
