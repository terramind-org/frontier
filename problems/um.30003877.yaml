title: Beilinson's Regulator Conjecture
field: mathematics
tier: prose
statement: Let $X$ be a variety over $\mathbb Q$ and let $m<2i$. Does the regulator map carry the appropriate integral subspace of motivic cohomology to a $\mathbb Q$-structure on Deligne cohomology, with determinant equal to the special value predicted by Beilinson's conjecture?
