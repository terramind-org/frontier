title: An effective-root-datum and dg-Morita reduction for small-order and singular ABG equivalences
field: mathematics
tier: prose
statement: |-
  1. Is there a version of the derived equivalences of Arkhipov--Bezrukavnikov--Ginzburg that applies when \(\ell\) (the order of the root of unity) is less than or equal to \(h\) (the Coxeter number)?
  2. Same question for singular blocks rather than the principal block.
