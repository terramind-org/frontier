title: Random Walk Mixing on Alternating Groups
field: mathematics
tier: prose
statement: Pick $x_1, \dots, x_k \in A_n$ at random. Is it true that, almost surely as $n \to \infty$, the random walk on this set of generators and their inverses equidistributes in time $O(n \log n)$?
