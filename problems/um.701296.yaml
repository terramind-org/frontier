title: Kourovka Notebook Problem 16.105
field: mathematics
tier: prose
statement: |-
  Is it true that a locally graded group which
  is a product of two almost polycyclic subgroups (equivalently, of
  two almost soluble subgroups with the maximal condition) is almost
  polycyclic?

  By (N. S. Chernikov, *Ukrain. Math. J.*, **32** (1980) 476--479) a locally graded
  group which is a product of two Chernikov subgroups (equivalently,
  of two almost soluble subgroups with the minimal condition) is
  Chernikov.
