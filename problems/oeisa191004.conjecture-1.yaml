  module: FormalConjectures.OEIS.«191004»
  decl: OeisA191004.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : 5 < n) : 0 < a n"
  context:
    - open OeisA191004
  definitions:
    - name: OeisA191004.a
      kind: def
      text: |-
        /--
        Number of ways to write $n = p + q + (n \bmod 2)q$, where $p$ is an odd prime and $q \le n/2$ is a
        prime such that $\left(\frac{q}{n}\right) = 1$ if $n$ is odd, and
        $\left(\frac{(q+1)/2}{n+1}\right) = 1$ if $n$ is even.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ q ∈ Finset.range (n / 2 + 1),
            if q.Prime ∧ 2 * q ≤ n then
              let p := if n % 2 = 1 then n - 2 * q else n - q
              if p.Prime ∧ p ≠ 2 then
                if n % 2 = 1 then
                  if jacobiSym (q : ℤ) n = 1 then 1 else 0
                else
                  if jacobiSym (((q + 1) / 2) : ℤ) (n + 1) = 1 then 1 else 0
              else 0
            else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/191004.lean#L37
