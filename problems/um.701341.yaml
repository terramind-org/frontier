title: Kourovka Notebook Problem 17.39
field: mathematics
tier: prose
statement: |-
  Is there a positive integer $n$ such that the hypercenter of any
  finite soluble group coincides with the intersection of $n$ system
  normalizers of that group? What is the least number with this
  property?

  *Comment of 2017*:
  This is proved for groups with trivial Frattini subgroup (A. Ballester-Bolinches, J. Cossey, S. F. Kamornikov, H. Meng, *J. Algebra*, **499** (2018), 438--449).
