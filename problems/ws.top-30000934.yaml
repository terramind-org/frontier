  \section{Exponential Distribution of Normalized Prime Gaps}\label{30000934}
  {\small UnsolvedMath ID 30000934 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  If $p_n$ is the $n$th prime, then the normalized prime gaps $(p_{n+1}-p_n)/\log p_n$ should be asymptotically distributed like an exponential random variable with density $e^{-x}$ for $0\leq x<\infty$.
  \par\smallskip\textit{Formulation references:} \sref{30000934}{1}, \sref{30000934}{2}.
  \subsection{Short English statement}
  If $p_n$ is the $n$th prime, then the normalized prime gaps $(p_{n+1}-p_n)/\log p_n$ should be asymptotically distributed like an exponential random variable with density $e^{-x}$ for $0\leq x<\infty$.
