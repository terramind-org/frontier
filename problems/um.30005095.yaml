title: Relative Bogomolov Conjecture for Abelian Schemes
field: mathematics
tier: prose
statement: Let $\pi:A\to S$ be an abelian scheme and let $X\subset A$ be irreducible with $\pi(X)=S$. Must either the points of arbitrarily small canonical height fail to be Zariski dense in $X$, or $X$ have codimension at most $\dim S$ in a horizontal torsion coset?
