title: Airy Limits for Last Paths in Aztec Diamonds
field: mathematics
tier: prose
statement: For the lattice paths obtained from the height function of the two-periodic Aztec diamond, prove that an extremal path exists whose suitably centered and scaled limit is the Airy process, and determine the parameter regimes in which this limit holds.
