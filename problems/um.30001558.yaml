title: Fragile and Robust Squarefree Infinite Words
field: mathematics
tier: prose
statement: Do there exist infinite words over $\{0,1,2\}$ that are fragile for squarefreeness, meaning every nonempty finite set of symbol flips destroys squarefreeness, and do there exist such words that are robust, meaning infinitely many disjoint finite flip sets preserve squarefreeness?
