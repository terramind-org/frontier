title: Problem 1 — (Geodesics on general flat surfaces).
field: mathematics
tier: prose
statement: (Geodesics on general flat surfaces). Describe the behavior of geodesics on general flat surfaces. Prove (or disprove) the conjecture that the geodesic flow is ergodic on a typical (in 248 15. Problems on billiards, flat surfaces and translation surfaces 249 any reasonable sense) flat surface. Does any (almost any) flat surface have at least one closed geodesic which does not pass through singular points? If the answer is positive then one can ask for the asymptotics for the number of closed geodesics of bounded length as a function of the bound. Note that typically a geodesic representative in a homotopy class of a simple closed curve is realized by a broken line containing many geodesic segments going from one conical singularity to the other. The counting problem for regular closed geodesics (ones which do not pass through singularities) is quite diﬀerent from the counting problem for geodesics realized by broken lines. The following questions treat billiards in arbitrary polygons in the plane.
