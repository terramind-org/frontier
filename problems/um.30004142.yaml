title: Lagrangian Sphere Generators for Quintic-Type Fourfolds
field: mathematics
tier: prose
statement: Let $X$ be a symplectic four-dimensional manifold diffeomorphic to a quintic in $\mathbb P^4$ and equipped with a Lagrangian fibration. Can tropical hypersurfaces in the base be lifted to enough Lagrangian spheres to generate $H_3(X,\mathbb Z)$, which has rank $204$?
