title: Open Problems and Questions about Geodesics — Question 26
field: mathematics
tier: prose
statement: |-
  [Knieper]
  *Consider a closed surface of genus $\geq 2$ with a metric of non-positive curvature. Let $Z(L)$ be the number of free homotopy classes containing
  closed geodesics with length $\leq L$ along which the curvature is everywhere zero.
  Is there a quadratic upper bound for $Z(L)$, i.e.\ is there a constant $C \geq 0$ such that
  $$ Z(L) \leq C \cdot L^2? $$
  *
