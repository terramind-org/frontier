title: Kourovka Notebook Problem 15.94
field: mathematics
tier: prose
statement: |-
  Define the *weight* of a group $G$ to be the minimum number of
  generators of $G$ as a normal subgroup of itself.
  Let $G=G_1*\cdots *G_n$ be a free product of $n$ nontrivial groups.

  a) Is it true that the
  weight of $G$ is at
  least $n/2$?

  b) Is it true if the $G_i$ are cyclic?

  c) Is it true for $n=3$ (without assuming the $G_i$
  cyclic)?

  Problem 5.53 in Archive (now answered in the affirmative) is
  the special case with $n=3$ and all the $G_i$ cyclic.
