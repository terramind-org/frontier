lean:
  module: FormalConjectures.Wikipedia.ReconstructionConjecture
  decl: ReconstructionConjecture.edge_reconstruction_conjecture
  statement: |-
    theorem edge_reconstruction_conjecture {V : Type} [Fintype V] (G H : SimpleGraph V)
        (hE : 4 ≤ G.edgeSet.ncard) (h : EdgeHypomorphic G H) : Nonempty (G ≃g H)
  context:
    - open ReconstructionConjecture
    - "variable {V W : Type*}"
  definitions:
    - name: ReconstructionConjecture.EdgeHypomorphic
      kind: def
      text: |-
        /-- Two graphs are **edge-hypomorphic** if there is a bijection `σ` between their edge sets
        such that the edge-deleted subgraphs `G - e` and `H - σ e` are isomorphic for every edge `e`;
        i.e. `G` and `H` have the same deck of edge-deleted subgraphs. -/
        def EdgeHypomorphic (G : SimpleGraph V) (H : SimpleGraph W) : Prop :=
          ∃ σ : G.edgeSet ≃ H.edgeSet, ∀ e : G.edgeSet,
            Nonempty (G.deleteEdges {(e : Sym2 V)} ≃g H.deleteEdges {((σ e : H.edgeSet) : Sym2 W)})
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/ReconstructionConjecture.lean#L51
