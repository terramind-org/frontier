id: um.20002285
title: One-universal definitions of integers in number fields
field: mathematics
tier: prose
statement: |-
  Let \(t\) be the free variable and \(u\) the single universal variable. For a number field \(K\):
  (a) is \(\mathcal O_K\) definable in \(K\) by a formula \(\forall u\,\exists\vec y\,\Theta_K(t,u,\vec y)\)?
  (b) is \(\mathbb Z\) definable in \(K\) by such a formula?
  (c) is \(\mathbb Z\) definable in \(K\) by a purely universal formula \(\phi_K(t)\)?
