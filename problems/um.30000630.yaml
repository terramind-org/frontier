title: Generalized Covariograms of Planar Convex Bodies
field: mathematics
tier: prose
statement: For a planar convex body $K$ and a strictly monotone, translation-invariant valuation $\varphi$, for example perimeter, does the generalized covariogram $x\mapsto\varphi(K\cap(K+x))$ determine $K$ up to translations and reflections?
