  \item[\hypertarget{source:statement:2}{S2}] R. \.{I}nan\c{c} Baykur, Robion C. Kirby and Daniel Ruberman, K3 -- A New Problem List in Low-Dimensional Topology, author preliminary edition (2026), Problem 1.4 and its remarks. \url{https://math.berkeley.edu/sites/default/files/surv-295-ruberman-watermarked-author-pdf.pdf}.
  \item[\hypertarget{source:statement:3}{S3}] Jennifer Hom, Tye Lidman and JungHwan Park, \emph{Unknotting number and cabling}, Conjecture 1.10. \url{https://arxiv.org/abs/2206.04196}.
  \end{description}
