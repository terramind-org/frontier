statement: "(T. Kerler) [ q/l -solvable and Casson TQFT’s] (1) Lift the 1/1-solvable TQFT’s of Casson type over Fp to a universal 1/1- solvable TQFT’s of Casson type over Z. (2) Describe the resulting invariant Ξ Z for 3-manifolds with b1(M )≥ 1. (3) Develop a perturbation theory for general q/l -solvable TQFT’s. (4) Relate those with the various, standard resolutions of Γ g. (5) Relate them also to the traditional finite type theory for clo sed 3-manifolds. (6) Describe the Reshetikhin-Turaev theories in this pattern. Preparations for item (1) can be found in [212] in which formu lae for the Casson invariant over Z are derived that have the same form as general TQFT formulae. Item (2) is immediate from the preceding discussion. The rem aining items are logical continuations. The category of 3-dim cobordisms Cob• between compact, oriented surfaces with one boundary component has a natural structure of a brai ded tensor cat- egory. Another, category Alg can be defined entirely algebraically in terms of generators and relations with respect to a tensor product an d a composition product. On the level of objects it has exactly one generator, say A, so that all other objects are of the form A⊗g with 1 = A⊗0. The morphisms are given by all words that can be generated by taking composition and t ensor products of elementary morphisms m: A⊗ A→ A, ∆: A→ A⊗ A, e: 1 → A, ε: A→ 1,..., that appear in the definition of a braided, ribbon Hopf algebra with integrals and a non-degenerate pairing. For example, i n [215] a surjective functorAlg−։ Cob• is constructed, which, in the genus one restriction in fact an isomorphism."
