title: Galois descent for a covering group
field: mathematics
tier: prose
statement: Let $F$ be a characteristic-zero $p$-adic local field, let $L/F$ be a finite unramified extension, let $G_F$ be an unramified reductive group over $F$ (quasi-split over $F$ and split over $L$), and let $\widetilde{G}_F$ be a central topological covering group of $G_F(F)$ of degree coprime to $p$, with corresponding base-change covering group $\widetilde{G}_L$ over $L$. Does the Galois group $\operatorname{Gal}(L/F)$ act naturally on $\widetilde{G}_L$?
