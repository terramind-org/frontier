title: Realizability and Tameness of Fusion Systems
field: mathematics
tier: prose
statement: "Characterize when a saturated fusion system $\\mathcal{F}$ on a Sylow $p$-subgroup $S$ is realized by a finite group: determine conditions guaranteeing a finite group $G$ with a normal subgroup $H\\trianglelefteq G$, $S\\in\\operatorname{Syl}_p(G)$, and $\\mathcal{F}=\\mathcal{F}_S(G)$. Clarify the relation between realizability and tameness in full generality."
