title: Controlled K-Theory for Farrell–Jones Assembly Maps
field: mathematics
tier: prose
statement: Let $\Gamma$ act asymptotically properly on a compact space $X$. Can controlled $K$-theory prove split injectivity of the Farrell–Jones assembly map in algebraic $K$-theory and thereby establish the Farrell–Jones conjecture for such an action?
