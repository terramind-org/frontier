  definitions:
    - name: OeisA71524.a
      kind: def
      text: |-
        /-- Determinant of the $n \times n$ matrix with $(i,j)$ entry $1$ if $(i+1)^2 + (j+1)^2$ is prime,
        and $0$ otherwise. -/
        def a (n : ℕ) : ℤ :=
          let M : Matrix (Fin n) (Fin n) ℤ := fun i j =>
            let i_idx : ℕ := i.val + 1
            let j_idx : ℕ := j.val + 1
            if (i_idx ^ 2 + j_idx ^ 2).Prime then 1 else 0
          M.det
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/71524.lean#L36
