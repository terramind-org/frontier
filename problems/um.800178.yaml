title: Moments of L-functions — Moments of the Riemann zeta function — Problem 29
field: mathematics
tier: prose
statement: |-
  Let $f$ be a Hecke--Maass cusp form of level 1. Prove the Weyl-strength subconvex bound $L(1/2+it,f) \ll_{\varepsilon} ((1 + |t_f - t|)(1 + |t_f + t|))^{1/6 + \varepsilon}$. This is known, via work of Jutila and Motohashi, for all $t \in \mathbb{R}$ away from the conductor-dropping regimes, namely when either $t_f - t$ or $t_f + t$ is $o(\max\{t_f,|t|\})$. Michel-Venkatesh prove a subconvex bound in the conductor-dropping regime, but the exponent is not explicit (and certainly not Weyl-strength).\\
  (Peter Humphries, Virginia)

  \section*{Additive divisor sums/shifted convolution sums}
