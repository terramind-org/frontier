statement: "Given a factorization ta1ta2··· tan = 1 of the identity into a product of right Dehn twists in Modg, is it always possible to lift this factorization to a factorization of the identity into a product of n right Dehn twists in Mod1 g? That is, is it always possible to choose simple closed curves b1,b 2,...,b n on S disjoint from P such that tb1tb2··· tbn = 1 in Mod1 g and ϕ(tbi) = tai, i.e. bi is isotopic to ai through isotopies not fixing P? The existence of a lifting of the factorization ta1ta2··· tan = 1 in Mod g to Mod 1 g implies that the corresponding Lefschetz fibration has a section; by lifting the relation to Mod 1 g, we specify 5. Problems on homomorphisms of mapping class groups 89 a point on each fiber. Thus, Problem 2.8 may be rephrased as follows: Does every Lefschetz fibration over S2 admit a section?"
