title: Arithmetic descent of a rank-two curve factorization
field: mathematics
tier: prose
statement: |-
  **11. (J. Getz)** C. Simpson proved that if \(X\) is a variety and if
  \[
  \rho_X:\pi_1^{\mathrm{geom}}(X)\longrightarrow \mathrm{GL}_2(\mathbb Q_\ell)
  \]
  is a representation whose algebraic enveloping contains \(\mathrm{SL}_2\), then \(\rho_X\) factors through
  \[
  \rho_Y:\pi_1^{\mathrm{geom}}(Y)\longrightarrow \mathrm{GL}_2(\mathbb Q_\ell),
  \]
  where \(Y\) is either a curve or a Shimura variety; the factorization is induced from a map from \(X\) to some cover of \(Y\). Is there a version of this result using just \(\pi_1\) in place of \(\pi_1^{\mathrm{geom}}\)?
