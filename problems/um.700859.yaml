title: Kourovka Notebook Problem 12.40
field: mathematics
tier: prose
statement: |-
  Let $\varphi$ be an irreducible $p
  $-modular character of a finite group $G$. Find the best-possible
  estimate of the form $\varphi (1)_p \leq f(|G|_p)$, where $n_p$ is
  the $p
  $-part of a positive integer $n$,

  a) for $p=2$;

  b) for $p\ne 2$.
