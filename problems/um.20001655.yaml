title: Recovering indecomposable vertex blocks from dual laminations
field: mathematics
tier: prose
statement: |-
  Relate a fine/graph-of-actions decomposition theory for \(F_N\)-trees to the tree’s dual algebraic lamination, in both directions, and relate both descriptions to finite systems of partial isometries.

  It contains the same unexplained string “GL-theory,” the same conspicuous capitalization “FINE DECOMPOSITION,” and the same horofunction prose. Three source-recovery conclusions are important.

  1. **“GL” is not expanded in the source.** In the relevant literature it is genuinely ambiguous. Gaboriau--Levitt is the standard author pair behind the geometric index and a finite-tree/partial-isometry construction [GL95]. Guirardel--Levitt is another standard “GL” author pair in the Outer-space and JSJ literature, while Guirardel introduced the indecomposability notion used in later decomposition results. The exact phrase “fine decomposition” was not found as a named theorem in the primary sources checked. Later papers instead speak of Levitt’s graph-of-actions or Levitt decomposition, transverse families, indecomposable trees, compact hearts, and Rips or splitting induction. Because the source itself does not decide between these usages, this report does not silently expand “GL.” The strongest contextual evidence for the initials alone is Gaboriau--Levitt: [GL95] both has the conventional citation key GL and directly treats geometric index and systems of partial isometries. The decomposition language, however, is closer to Levitt’s graph-of-actions theory and Guirardel’s refinements. “FINE DECOMPOSITION” is therefore treated as unresolved workshop shorthand or an editorial placeholder, not as a verified proper noun.

  2. **The horofunction paragraph introduces Problem 5.3.** The paragraph changes topic immediately after Problem 5.2 and defines the object whose closure is asked for in the next numbered problem: “Problem 5.3. What is the closure \(X\)? What is \(X\setminus X\), the horofunction boundary ...?” It is transitional prose for 5.3, not an additional clause of Problem 5.2.

  3. **The mathematical reconstruction of its OCR is**
     \[
     x\longmapsto [d(\,\cdot\,,x)]\in C^0(X_n)/\mathbb R,
     \qquad f\sim g\iff f-g\text{ is constant},
     \]
     with uniform convergence on compact sets. Thus “7 →” is a broken \(\mapsto\) glyph, \(C0\) is \(C^0\), and “homotopy to a constant” must be corrected to “differ by an additive constant.” This is a mathematically compelled reconstruction, not literal source text. It is not used below because it belongs with Problem 5.3.

