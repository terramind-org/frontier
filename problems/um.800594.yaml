title: Selection Principles in Mathematics — Problem 21 ([spm])
field: mathematics
tier: prose
statement: |-
  Recall that by ``cover of $X$'' we mean one not containing $X$ as an element.
  $\mathcal{U}$ is a *$\large$-cover* of $X$ if each $x\in X$ is
  covered by infinitely many members of $\mathcal{U}$.
  It is a *$\tau$-cover* of $X$ if, in addition,
  for each $x,y\in X$, either $\{U\in\mathcal{U} : x\in U, y\notin U\}$ is finite, or
  else $\{U\in\mathcal{U} : y\in U, x\notin U\}$ is finite [tau].
  Let $\mathrm{T}$ denote the collection of open $\tau$-covers of $X$. Then
  $\Gamma \subseteq \mathrm{T} \subseteq \Omega$.

  The most important problem concerning $\tau$-covers
  is the following.

  Is $\binom{\Omega}{\Gamma}=\binom{\Omega}{\mathrm{T}}$?
