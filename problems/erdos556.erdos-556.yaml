id: erdos556.erdos-556
title: Erdős Problem 556
field: mathematics
tier: proof
statement: |-
  Erdős Problem 556 (Bondy–Erdős): for all $n \ge 4$,
  $$R(C_n; 3) \le 4n - 3.$$
  The case $n = 3$ is excluded since $R(K_3; 3) = 17$.
