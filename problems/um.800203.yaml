title: Holomorphic Symplectic Geometry — Conjecture 12
field: mathematics
tier: prose
statement: |-
  This is much larger than one would expect from a naive dimension count. It implies for instance that a Poisson field which vanishes at some point must vanish along a curve.
  The condition ``$X$ Fano" is probably far too strong. In fact an optimistic modification would be :

  If $X_s$ is non-empty, it contains a component of dimension $>s$.
