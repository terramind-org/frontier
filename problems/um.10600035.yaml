title: Virtual-knot problem 35 — In we give a formula for the Kauffman polynomial, due to Jaeger, that expresses this invariant as a state sum over or…
field: mathematics
tier: prose
statement: |-
  In we give a formula for the Kauffman polynomial, due
  to Jaeger, that expresses this invariant as a state sum over
  oriented, partially smoothed links associated with the given link.
  these states are evaluated by using the Homfly polynomial.
  Generalize the Jaeger point of view to obtain a categorification of
  the Kauffman polynomial by using chain complexes for these states
  that are derived from the Khovanov–Rozansky categorification of the
  Homflypt polynomial.
