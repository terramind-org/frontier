statement: |-
  \section*{Almost everywhere Fourier convergence for L log L}\label{30007427}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every complex function f on the circle with integral |f| log(2+|f|) finite, do the symmetric Fourier partial sums $S_N$ f converge to f almost everywhere as N ranges through all positive integers?
  \subsection{Short English statement}
  For every complex function f on the circle with integral |f| log(2+|f|) finite, do the symmetric Fourier partial sums $S_N$ f converge to f almost everywhere as N ranges through all positive integers?
