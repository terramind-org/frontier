title: Percolation Structure in Nearly Optimal Disk Packings
field: mathematics
tier: prose
statement: For a packing of unit disks in $\mathbb R^2$ whose density is sufficiently close to that of the triangular-lattice packing, join two centers when their distance is at most $2+\varepsilon$. Under what quantitative density assumptions must the resulting graph contain an infinite connected component?
