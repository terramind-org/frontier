title: Problem 11.7 — (T.
field: mathematics
tier: prose
statement: (T. Le, V. Turaev) Define the LMO invariant Z L M O(M, σ) of the pair of a closed 3-manifold M and a spin structure σ of M such that Z L M O(M ) = ∑ σ Z L M O(M, σ), where the sum runs over all spin structures on M. There is also a similar problem for spin c structures.
