id: um.5000004
title: Reachable points on lines through a unitary pair
field: mathematics
tier: prose
statement: "Unfold a billiard trajectory in a regular $n$-gon by reflecting the polygon across each encountered side. A short trajectory joins two vertices and meets no vertex in between; a reachable point is an endpoint vertex occurring in such an unfolding. For an oriented short trajectory, let $\\alpha$ and $\\beta$ be its source and target endpoint angles as in Definition 2.1 of the source, and write $A_k$ for the resulting one of $n-2$ trajectory types (indices modulo $n-2$); in particular $A_0$ is characterized by $\\beta-\\alpha=2\\pi/n$. For $n\\ge5$, call reachable points $u,v$ of type $A_0$ a unitary pair if $\\det(u,v)=\\sin((n-2)\\pi/n)$, and put $\\lambda=2\\cos(\\pi/n)$. Prove: (a) $u_m=u+m(\\lambda+1)v$ is reachable of type $A_0$ for every integer $m$ for which it lies in the upper half-plane; (b) $w_m=u+(\\lambda+m(\\lambda+1))v$ is reachable of type $A_1$ whenever it lies there; (c) there are no other reachable points on $u+\\mathbb Rv$; and (d) the analogous description on $v+\\mathbb Ru$ yields only types $A_0$ and $A_{n-3}$."
