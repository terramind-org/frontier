title: Yang–Baxter Solutions from Generalized Left Semi-Braces
field: mathematics
tier: prose
statement: |-
  Which generalized left semi-braces $S$ have the property that
  $$
  r(a,b)=\bigl(a\circ(a^{-}+b),(a^{-}+b)^{-}\circ b\bigr)
  $$
  is a set-theoretic solution of the Yang–Baxter equation?
