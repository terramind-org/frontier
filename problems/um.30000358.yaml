title: Finite-Order Laminates for Rank-One Convex Envelopes
field: mathematics
tier: prose
statement: For an energy density $W$, find readily checkable conditions ensuring that its rank-one convex envelope $W^{\mathrm{rc}}$ is attained by a laminate of finite order $N$; also bound $N$ in terms of $W$ and confine all supporting matrices to a ball of finite prescribed radius.
