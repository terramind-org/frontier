title: Open Problems in Arithmetic Dynamics — Conjecture 9
field: mathematics
tier: prose
statement: |-
  Let $K$ be a field of characteristic $0$,
  and let $f:\mathbb{P}^N\to\mathbb{P}^N$ be a morphism of degree $d\ge2$ defined
  over $K$. Then for all sufficiently large $n$ we have (The
  function $\mu$ is the M\"obius function, which we recall is defined
  as follows: If $n$ is a product of $k$ distinct primes,
  then $\mu(n)=(-1)^k$, otherwise $\mu(n)=0$.)
  \[
  \#\operatorname{Per}_n^*\bigl(f,\mathbb{P}^N({\bar K})\bigr)

  := \sum_{m\mid n} \mu\left(\frac{n}{m}\right) (d^m+1)^N.
  \]
