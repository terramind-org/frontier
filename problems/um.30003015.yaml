title: Harmonic Metrizations of Line Bundles
field: mathematics
tier: prose
statement: For any line bundle $M$ on $X$, does there exist a metrization $\overline{M}$, unique up to scale, whose curvature $c_1(\overline{M})$ is $\omega$-harmonic, meaning it is $\omega$-bounded and satisfies $c_1(\overline{M})\omega^{n-1}=\lambda(M)\omega^n$?
