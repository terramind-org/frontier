title: Discrete and Profinite Relation Ranks of Finite Groups
field: mathematics
tier: prose
statement: For a finite group $G$, let $r(G)$ be the minimum number of relations in a discrete presentation and $\widehat r(G)$ the corresponding minimum for a profinite presentation. Is $r(G)=\widehat r(G)$ for every finite group?
