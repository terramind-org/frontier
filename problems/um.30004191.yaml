id: um.30004191
title: Explicit Cheeger Sets and Constants of Bounded Domains
field: mathematics
tier: prose
statement: |-
  Given a bounded domain $\Omega\subset\mathbb R^n$, explicitly describe its Cheeger sets $E\subseteq\Omega$, with $\lvert E\rvert>0$, minimizing $P(E)/\lvert E\rvert$, and compute

  $$h(\Omega)=\inf_{E\subseteq\Omega}\frac{P(E)}{\lvert E\rvert}.$$ 

  Can the minimizing sets and the value of this infimum be determined explicitly?
