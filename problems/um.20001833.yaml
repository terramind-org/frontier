title: Normal stability and scale selection for inverse Gauss curvature flow near the round sphere
field: mathematics
tier: prose
statement: |-
  Let $S^2$ be the 2 dimension unit sphere and $g$ be a metric on $S^2$ with positive Gauss curvature. Take $g=e^{2u} ds^2$.
  Consider the flow
  $$\partial_t u=-1+\frac{\overline{K_u}}{K_u}$$
  where $\overline{K_u}$ is the average of $K_u$.
  Known: long time existence; some weak convergence (a priori estimate degenerate at $t=\infty$).

  Question: Does the flow converge to round? (If the genus is greater than 1, the analogous flow is understood). What about higher dimensions? More information for $n=2$ can be found on the paper on arxiv.
