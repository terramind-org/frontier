    theorem erdos_611.parts.ii :
        ∀ c : ℝ, 0 < c → c < 1 →
          (fun n ↦ (cliqueThreshold c n : ℝ)) =Θ[atTop] erdos_611.parts.ii.answer c
  context:
    - open Erdos611
    - open Erdos611.erdos_611
    - open Erdos611.erdos_611.parts
    - open Filter
  definitions:
    - name: Erdos611.cliqueThreshold
      kind: def
      text: |-
        /--
        `cliqueThreshold c n` is $k_c(n)$: the least $k$ such that every graph on $n$ vertices whose
        maximal cliques all have at least $k$ vertices satisfies $\tau(G) < (1 - c)n$.

        For large $n$ only $k \geq 2$ matters, since some triangle-free graph has $\tau(G) \geq (1 - c)n$;
        so ignoring maximal cliques on one vertex does not change $k_c(n)$ asymptotically.
        -/
        noncomputable def cliqueThreshold (c : ℝ) (n : ℕ) : ℕ :=
          sInf {k : ℕ | ∀ G : SimpleGraph (Fin n), AllMaximalCliquesAtLeast G (k : ℝ) →
            (G.cliqueTransversalNumber : ℝ) < (1 - c) * (n : ℝ)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/611.lean#L44
