title: Additive realization and a trivial-action gluing obstruction for a C3 analogue of Real bordism
field: mathematics
tier: prose
statement: |-
  In order to solve the \(3\)-primary Kervaire invariant one problem
  using analogous methods to those in [Hill--Hopkins--Ravenel], one
  would need a \(C_3\)-equivariant version of \(MU_{\mathbb R}\).

  Can we describe such a \(C_3\)-commutative ring spectrum \(MU_{\mathbb
  R}\) so that its underlying Bousfield type is \(MU\) and
  \[
  \left\langle MU^{\Phi C_3}\right\rangle
    =\left\langle H\mathbb F_3\right\rangle?
  \]
