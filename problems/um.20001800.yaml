title: Rank-one meromorphic Hitchin duality and a marked-data obstruction
field: mathematics
tier: prose
statement: |-
  Langlands duality for meromorphic Higgs bundles

  The existence of the hyperkahler metrics on the wild Hitchin spaces means the moduli spaces of meromorphic connection on curves (and the corresponding wild character varieties) have natural special Lagrangian torus fibrations, by hyperkahler rotation of the Hitchin fibration (shown to be proper in this generality by Nitsure).

  Study the SYZ mirror symmetry proposal in this context. For example suppose we take the dual holomorphic Lagrangian fibration of the smooth fibres of the meromorphic Higgs bundle moduli space. Is the result another Hitchin fibration? What is the involution on the set of data (group, irregular curve, residue data) that corresponds to this T-duality?

  For example for holomorphic Higgs bundles it is known one should just replace the group by the Langland dual group, so we are asking for an involution generalizing this.

  The approach of Donagi-Pantev works for the Poisson moduli spaces of meromorphic Higgs bundles, so the question is about matching symplectic leaves.

  Gukov-Witten studied the tame case and described interesting phenomenon related to rigid coadjoint orbits, but it does not seem that a precise involution was established
