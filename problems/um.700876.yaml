title: Kourovka Notebook Problem 12.57
field: mathematics
tier: prose
statement: |-
  Suppose that a cyclic group $A$ of order 4 is a
  $TI $-subgroup of a finite group $G$.

  a) Does $A$ centralize a component $L$
  of $G$ if $A$
  intersects $L\cdot C(L)$ trivially?

  b) What is the structure of the normal
  closure of $A$ in the
  case where $A$ centralizes each component of $G$?
