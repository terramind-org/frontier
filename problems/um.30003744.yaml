title: Stabilization Limits for Scalar Multiplicative Observation Channels
field: mathematics
tier: prose
statement: Consider the scalar system $$X_{t+1}=aX_t+U_t,\qquad Y_t=C_tX_t,$$ where the $C_t$ are independent and identically distributed continuous random variables and $U_t$ may be any causal function of $Y_0,\ldots,Y_t$. What is the optimal causal control law for second-moment stabilization, what is the largest stabilizable gain $a$, and can a tight impossibility bound be proved?
