title: Finite Surviving Components under Supercritical Reinforcement
field: mathematics
tier: prose
statement: Suppose the firing rates $p(v)$ are bounded away from zero and infinity and $\alpha>1$. Does $\lim_{t\to\infty}X_e(t)$ exist almost surely for every edge $e$, with the surviving edges forming finite connected components? For $\alpha>2$, are those components trees?
