id: um.30001432
title: Connectivity-Preserving Paths in Antisymmetric Digraphs
field: mathematics
tier: prose
statement: |-
  For every nonnegative integer $m$, does every $k$-connected antisymmetric digraph $D$ with

  $$\delta^+(D)\geq\left\lfloor\frac{3k+1}{2}\right\rfloor+m
  \quad\text{and}\quad
  \delta^-(D)\geq\left\lfloor\frac{3k+1}{2}\right\rfloor+m$$

  contain a directed path $P$ of length $2m$ such that $\kappa(D-V(P))\geq k$?
