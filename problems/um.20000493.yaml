id: um.20000493
title: Exact tensorization of optimal Dirichlet eigenfunction power-concavity
field: mathematics
tier: prose
statement: |-
  Let \(\Omega\subset\mathbb R^n\) be a bounded convex domain and let \(u\) be the principal eigenfunction of the Dirichlet Laplacian on \(\Omega\). Brascamp and Lieb proved that \(u\) is log-concave. It is also known that \(u^\alpha\) is concave for certain \(\alpha>0\). Define
  \[
  \alpha(\Omega)=\sup\{\alpha\geq 0:u^\alpha\text{ is concave}\}.
  \]
  Lindqvist conjectured that \(\alpha(\Omega)\) is maximized by the ball.

  The source URL is <http://aimpl.org/shapesurface/2/>.

  The eigenfunction solves
  \[
  -\Delta u=\lambda_1(\Omega)u\quad\text{in }\Omega,
  \qquad u>0\quad\text{in }\Omega,
  \qquad u=0\quad\text{on }\partial\Omega. \]
  Its positive normalization is immaterial: multiplying \(u\) by a constant multiplies \(u^\alpha\) by a positive constant and hence does not change concavity. Translations, rotations, and uniform dilations of \(\Omega\) also leave \(\alpha(\Omega)\) unchanged. A general affine map does not, because it changes the Laplacian into an anisotropic operator.
