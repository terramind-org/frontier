lean:
  module: FormalConjectures.ErdosProblems.«690»
  decl: Erdos690.erdos_690.variants.large_k
  statement: |-
    theorem erdos_690.variants.large_k :
        ∃ k ≥ 21, ∀ d : ℕ → ℝ,
          (∀ p, p.Prime → (kthPrimeFactorSet k p).HasDensity (d p)) → IsUnimodalOnPrimes d
  context:
    - open Erdos690
    - open Erdos690.erdos_690
    - open Erdos690.erdos_690.variants
    - open Filter
  definitions:
    - name: Erdos690.kthPrimeFactorSet
      kind: def
      text: |-
        /-- The set of positive integers whose `k`-th smallest prime factor is `p`: if
        $p_1<p_2<\cdots$ are the primes dividing $n$ then $p_k=p$. -/
        def kthPrimeFactorSet (k p : ℕ) : Set ℕ :=
          {n | 0 < n ∧ p ∈ n.primeFactors ∧ (n.primeFactors.filter (· < p)).card = k - 1}
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/ErdosProblems/690.lean#L35
    - name: Erdos690.IsUnimodalOnPrimes
      kind: def
      text: |-
        /-- A function on the primes is *unimodular* if it first increases in $p$ until its maximum then
        decreases. -/
        def IsUnimodalOnPrimes (f : ℕ → ℝ) : Prop :=
          ∃ m, m.Prime ∧ (∀ p q, p.Prime → q.Prime → p ≤ q → q ≤ m → f p ≤ f q) ∧
            ∀ p q, p.Prime → q.Prime → m ≤ p → p ≤ q → f q ≤ f p
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/ErdosProblems/690.lean#L40
