title: Kourovka Notebook Problem 11.34
field: mathematics
tier: prose
statement: |-
  Describe the complex representations of quasisimple finite groups
  which remain irreducible after reduction modulo any prime number
  $q$. An important example: representations of degree $(p^k - 1)/2$
  of the symplectic group $Sp(2k,p)$ where $k \in {\mathbb{N}$ and $p$
  is an odd prime. See partial results in
  (P. H. Tiep, A. E. Zalesski, *Proc. London Math. Soc.*,
  **84** (2002), 439--472; \
  P. H. Tiep, A. E. Zalesski, *Proc. Amer. Math. Soc.*, **130** (2002), 3177--3184); \ C. Parker, M. van Beek,
  *Preprint*, 2024, https://arxiv.org/abs/2411.16379).
