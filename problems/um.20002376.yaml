title: Four core-model questions and a modular audit of branch-hypothesis counterexamples
field: mathematics
tier: prose
statement: |-
  Some of my goals/questions for the workshop:

  A. I would like a better understanding of the relationship between models of the form \(\mathrm{HOD}^M\) and the classical \(L[\vec E]\) models.

  B. Very strong axioms are used in the refutations of UBH and CBH (at least in the versions of these results which I have heard about). How exactly are they used? Are they necessary?

  C. I would like to know more about Woodin's recent work on promising extender sequences.

  D. I would like to get a picture of the status and significance of the \(\Omega\) conjecture.
