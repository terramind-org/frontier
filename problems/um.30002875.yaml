title: Donkin’s Good Filtration Conjecture
field: mathematics
tier: prose
statement: Let $k$ be algebraically closed of characteristic $p>0$, let $G$ be simple and simply connected, and let $\mathrm{St}_r=L((p^r-1)\rho)$ be the $r$th Steinberg module. Donkin's conjecture asserts that a finite-dimensional rational $G$-module $M$ has a good $(p,r)$-filtration if and only if $\mathrm{St}_r\otimes M$ has a good filtration.
