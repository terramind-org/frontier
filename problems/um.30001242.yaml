title: Uniform Generic Degree Bounds for Ideal Membership
field: mathematics
tier: prose
statement: For a standard graded $k$-algebra $R$ of dimension $d$ and generic homogeneous generators $f_1,\ldots,f_n$ of prescribed degrees $a_1,\ldots,a_n$, does there exist a generic degree bound $m_0$, depending only on $d$ and the degrees $a_i$, such that $R_{m_0}\subseteq(f_1,\ldots,f_n)$?
