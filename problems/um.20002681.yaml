title: Complex Hermitian matrix weights and an exact accretive quadratic sector
field: mathematics
tier: prose
statement: |-
  **Q:** Extend the model
  \[
  \exp\!\left[-n\operatorname{Tr}\!\left(P(A_1,\ldots,A_m)
        +\frac12\sum_{i=1}^m A_i^2\right)\right]
        dA_1\cdots dA_m
  \]
  of Guionnet and Maurel-Segala to non-selfadjoint \(P\) (i.e. polynomials with complex coefficients).
