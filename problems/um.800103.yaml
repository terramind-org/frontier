title: Foliations and Diffeomorphism Groups — Question 44
field: mathematics
tier: prose
statement: |-
  Which pairs $\Lambda, \Lambda'$ of (possibly non-Hausdorff) simply connected 1-manifolds can be realized as the leaf spaces of a pair of transverse foliations of the plane? What if you replace "pair" by ``triple"?

  One can also specialize this to the pairs of stable/unstable leaf spaces for Anosov flows, it is as yet not even known whether the stable leaf space determines the unstable.
