title: Integral Geometrization with Nilpotent Singular Support
field: mathematics
tier: prose
statement: For quasi-split $G$, let $W_\psi$ be the Whittaker sheaf associated with a nondegenerate character $\psi$. Prove that the spectral-action functor $F\mapsto F*W_\psi$ extends to an equivalence from $\operatorname{Coh}_{\mathrm{Nilp}}(\operatorname{LocSys}_{\widehat G}/\mathbb Z_\ell)$ to $D_{\mathrm{lis}}(\operatorname{Bun}_G,\mathbb Z_\ell)$, compatible with the spectral action.
