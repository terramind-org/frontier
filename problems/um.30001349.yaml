title: Igusa Monodromy Conjecture
field: mathematics
tier: prose
statement: For a polynomial $f$ in $n$ variables over $\mathbb{Q}$, for all but finitely many primes $p$, does every pole $s_0$ of the $p$-adic Igusa zeta function $Z_p(f;s)$ satisfy $\exp(2\pi i s_0)$ equal to a monodromy eigenvalue of $f:\mathbb{C}^n\to\mathbb{C}$ at a point of $\{f=0\}$?
