title: Hausdorff Dimension of Intersections of Badly Approximable Sets
field: mathematics
tier: prose
statement: For any specified system of Diophantine inequalities defining a generalized badly approximable set $\operatorname{Bad}$, does $\operatorname{Bad}$ have full Hausdorff dimension? More generally, for a countable family $\operatorname{Bad}_1,\operatorname{Bad}_2,\ldots$, determine the size and Hausdorff dimension of $\bigcap_{i=1}^{\infty}\operatorname{Bad}_i$.
