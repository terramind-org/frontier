title: Expanders in Superreflexive Spaces and Uniform Hilbertian Spheres
field: mathematics
tier: prose
statement: Let $Y$ be a superreflexive Banach space and $(G_n)$ a sequence of expander graphs. Must $(G_n)$ fail to equi-coarsely embed into $Y$? Is the unit sphere of every separable superreflexive Banach space uniformly homeomorphic to the unit sphere of $\ell_2$?
