title: Komlos Discrepancy Conjecture and Unsatisfiable Formulas
field: mathematics
tier: prose
statement: Determine whether discrepancy instances constructed from unsatisfiable Boolean formulas can have lower bound greater than $1+\sqrt{2}$. More broadly, prove the Komlós conjecture that vectors of Euclidean norm at most one admit signs with uniformly bounded coordinate discrepancy.
