title: Rescaled Reflective Submanifolds of Symmetric Spaces
field: mathematics
tier: prose
statement: Let $N=\exp(\mathfrak p)$ be a simply connected immersed reflective submanifold of a semisimple Riemannian symmetric space $\overline N$. For the metric rescaling $N_R$, is there a local or global isometric immersion of $N_R$ into $\overline N$ that preserves normal curvature and is a $V_{\mathfrak p}$-submanifold? Ask this for $R>1$ when $\overline N$ is of compact type and for $R<1$ when it is of noncompact type.
