title: Positive Polynomial Comparisons for Unitriangular Conjugacy Classes
field: mathematics
tier: prose
statement: Put $T=q-1$ and define $A_n(T)$ by $$\sum_{n\geq0}A_n(T)\frac{x^n}{n!}=(1-\sin(Tx))^{-1/T}.$$ For an infinite family of prime powers $q$ for which the number $k(U_n(\mathbb F_q))$ of conjugacy classes in $U_n(\mathbb F_q)$ is polynomial in $q$, is $$k(U_n(\mathbb F_{T+1}))-A_n(T)\in\mathbb N[T]$$?
