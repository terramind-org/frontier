title: Foliations of Euclidean space by Brownian paths
field: mathematics
tier: prose
statement: For which dimensions $d$ can $\mathbb{R}^d$ be partitioned into pairwise disjoint curves, each of which has the law or geometric regularity of a Brownian path? Give a rigorous construction or prove impossibility.
