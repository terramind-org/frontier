title: The Lyapin's Notebook — Problem 37
field: mathematics
tier: prose
statement: |-
  (S.G. Bershadsky, S.I. Kublanovsky)
  Is it true that if every finitely generated subsemigroup of a semigroup $S$ is embeddable into the power semigroup over some periodic group then $S$ is also embeddable into the power semigroup over a periodic group?
