  \item[\hypertarget{source:2308021:2}{S2}] Walter K. Hayman and Edward F. Lingham, \emph{Research Problems in Function Theory} (2018), arXiv:1809.07200. Problem 8.21, complete original question, all following updates, and the relevant chapter definitions. \url{https://arxiv.org/abs/1809.07200}.
  \end{description}
