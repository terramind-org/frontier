title: Bohr-Radius Characterization of $\ell^1$
field: mathematics
tier: prose
statement: |-
  Let $X$ be a Banach sequence space such that
  $$\inf_n K(B_{X_n})>0,$$
  where $K(B_{X_n})$ is the Bohr radius of the unit ball of its first $n$ coordinates. Must $X=\ell^1$ as sets?
