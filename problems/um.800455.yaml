title: Analysis of Boolean Functions — Approximate Degree for Approximate Majority
field: computer-science
tier: prose
statement: What is the least possible degree of a function $f \colon \{-1,1\}^n \to [-1, -2/3] \cup [2/3, 1]$ which has $f(x) \in [2/3,1]$ whenever $\sum_{i=1}^n x_i \geq n/2$ and has $f(x) \in [-1,-2/3]$ whenever $\sum_{i=1}^n x_i \leq -n/2$?
