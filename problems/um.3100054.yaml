title: "Finite field Sylvester-Gallai: Suppose S is a tranversal of Z_(p)^(2), i"
field: mathematics
tier: prose
statement: |-
  **(Conjecture)** Every transversal $S$ of $AG(2,p)$ that is **not contained in a line** has an
  *ordinary line*: a line meeting $S$ in exactly two points.
