title: Quantum-Monodromy Computation of Mutation Braids
field: mathematics
tier: prose
statement: Let a smooth Fano variety $X$ admit extremal contractions to smooth Fano varieties $Y$ and $Z$, and let the pullback-compatible semiorthogonal decompositions of $D^b(X)$ be related by a mutation braid. Is this braid equal to the monodromy braid of the eigenvalues of quantum multiplication by $c_1(X)$ as the complexified quantum parameter moves toward the walls of the ample cone?
