title: Randomstrasse101 Open Problems (2025) — Conjecture 5
field: mathematics
tier: prose
statement: The Paley Equiangular Tight Frame construction satisfies the Restricted Isometry Property beyond the square-root bottleneck. In other words, there exists $\varepsilon>0$ such that, for $m \sim p^{1/2+\varepsilon}$, any matrix formed by picking $m$ (distinct) vectors in the Paley ETF has condition number bounded by a constant independent of $p$.
