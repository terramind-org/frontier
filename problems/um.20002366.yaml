title: Diophantine archimedean balls after the all-number-field breakthrough
field: mathematics
tier: prose
statement: |-
  **Question 30 (Shlapentokh).** Let \(K\) be a number field and
  \(\mathcal O_K\) its ring of integers. Fix an embedding
  \(K\hookrightarrow\mathbb C\), with \(K\nsubseteq\mathbb R\). Is
  \[
  \{\alpha\in\mathcal O_K\mid |\alpha|\leq 1\}
  \]
  Diophantine in \(\mathcal O_K\)? If this is true for all \(K\), then
  Hilbert's Tenth Problem is undecidable for all \(\mathcal O_K\).
