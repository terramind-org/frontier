title: Problem 2.1 — Assume, for this problem, that M is a 3-manifold with non-empty boundary.
field: mathematics
tier: prose
statement: Assume, for this problem, that M is a 3-manifold with non-empty boundary. Then, on one side of the double coset HφH the handlebody subgroup needs to be modified to a ‘compression body subgroup’. Make this precise, by describing how to modify the double coset to take account of the handle decomposition of the compression body. What happens in the case of a knot space?
