  definitions:
    - name: OeisA232194.a
      kind: def
      text: |-
        /-- Number of ways to write $n = x + y$ ($x, y > 0$) with $nx + y$ and $ny - x$ both prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.Ico 1 n,
            let y := n - x
            if (n * x + y).Prime ∧ (n * y - x).Prime then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/232194.lean#L33
