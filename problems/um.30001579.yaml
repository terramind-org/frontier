title: Chain Independence of Rank Gradient
field: mathematics
tier: prose
statement: If $\Gamma$ is finitely generated and residually finite and $(\Gamma_n)$ is a normal chain with trivial intersection, is the rank gradient $$\operatorname{RG}(\Gamma,(\Gamma_n))=\lim_{n\to\infty}\frac{d(\Gamma_n)-1}{[\Gamma:\Gamma_n]}$$ independent of the chosen chain?
