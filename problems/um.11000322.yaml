statement: Give examples of odd valent graphs Γ whose associated homology classes Φ(Γ)∈ H∗(OutFn; Q) are non-trivial as many as possible. Also compare these classes with the homology classes constructed by Conant and Vogtmann [10] as explicit cycles in the moduli space of graphs. Furthermore investigate whether these classes survive in H∗(GL(n, Z); Q), or else come fromH∗(IOutn; Q), or not.
