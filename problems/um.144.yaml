title: Almost Invariant Sets Under Affine Maps
field: mathematics
tier: prose
statement: Suppose $A \subset \mathbb{Z}/p\mathbb{Z}$ has density $\frac{1}{2}$. Under what conditions on $K$ can $A$ be almost invariant under all maps $\phi(x) = ax + b$ with $|a|, |b| \leq K$?
