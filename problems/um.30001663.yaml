title: Maximum Density of Directed Simplices in Tournaments
field: mathematics
tier: prose
statement: For a $d$-tournament on $n$ vertices, obtained by assigning a compatible orientation to every $d$-set, what is the greatest possible number of directed $(d+1)$-sets? Equivalently, how does the limiting density $c_d$ of directed $(d+1)$-sets behave for fixed $d$ and as $d$ grows?
