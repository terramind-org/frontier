  \section{Classification of Class-VII Complex Surfaces}\label{30001909}
  {\small UnsolvedMath ID 30001909 · Algebraic Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Classify compact complex surfaces of class $\mathrm{VII}_0^+$: minimal compact complex surfaces with first Betti number one, negative Kodaira dimension, and positive second Betti number. Determine their geometric structure.
  \par\smallskip\textit{Formulation references:} \sref{30001909}{1}, \sref{30001909}{2}.
  \subsection{Short English statement}
  Classify compact complex surfaces of class $\mathrm{VII}_0^+$: minimal compact complex surfaces with first Betti number one, negative Kodaira dimension, and positive second Betti number. Determine their geometric structure.
