id: um.20000224
title: Exact line-arrangement operation formulas and a rich-line construction barrier
field: mathematics
tier: prose
statement: |-
  For a reduced singular plane curve $C \subset \mathbb{P}^2_{\mathbb{C}}$, let $\pi: \widetilde{\mathbb{P}^2} \to \mathbb{P}^2$ be an embedded resolution of singularities of $C$, let $\widetilde{C}$ be the strict transform of $C$, and define $h(C) = (\widetilde{C})^2 / r$, where $r$ is the number of points blown up.

  **Problem 5.1 (Harbourne).** Is $h(C)$ bounded below uniformly (i.e., does there exist a real constant $B$ independent of the singular reduced curve $C \subset \mathbb{P}^2_{\mathbb{C}}$ such that $h(C) \geq B$)? If this holds, then the Bounded Negativity Conjecture holds for rational surfaces in characteristic $0$. (In characteristic $p > 0$, $h(C)$ is not bounded below; for unions of lines in characteristic $0$, it is known that $h(C) > -4$, while the best known example achieves approximately $-3.36$.)
