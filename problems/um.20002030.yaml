title: Dimension-four Schouten-jet uniqueness and a two-obstruction reduction
field: mathematics
tier: prose
statement: |-
  If the answer is yes, then this gives a characterization of the GJMS operator \(P_n\). Combined with a negative answer to Problem 11, this would provide a unique specification of \(Q\).

  This reconstruction is source-verified, but the self-reference is almost certainly a typographical error: the preceding Problem 10 asks whether a weight-\(-n\) scalar conformal invariant can be made purely from \(\nabla^lP\), and that is exactly the complementary condition needed to specify \(Q\). Replacing the printed second “Problem 11” by “Problem 10” is therefore a logical inference, not verified wording.

  Here \(P_{ij}\) is the Schouten tensor, not the GJMS operator; to prevent collision this report writes the Schouten tensor as \(\mathsf P\) and the critical GJMS operator as \(P_n\).
