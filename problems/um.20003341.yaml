title: Admissibility-certified periodic paths for triangles and the 2026 polygon-existence preprint
field: mathematics
tier: prose
statement: |-
  **Question 46 (A. Katok).** Construct periodic orbits for triangular
  billiards.

  Every acute triangle has one obvious periodic orbit, but it is not known
  whether a general acute triangle has other periodic orbits. It is also not
  known whether a general obtuse triangle has at least one periodic orbit.
  Periodic orbits were constructed for some special classes of triangles. A
  computer-aided proof using McBilliards was reported to show that every
  triangle with all angles less than 100 degrees has a periodic orbit.

  For rational triangles and polygons, unfolding produces a compact flat
  surface. The number \(N(T)\) of periodic-orbit families of length at most
  \(T\) has upper and lower quadratic bounds. Quadratic asymptotics was known
  for special tables, but not stated for rational polygons in general.

  This record is Question 46, attributed to A. Katok, in the June 2004 AIM
  workshop list *Emerging applications of measure rigidity*. Inspection of page
  19 of the original PDF verifies the following statement.

  The source then notes nonuniformity near the \(30\)-\(60\)-\(90\) triangle. The PDF itself misspells
  “Schwartz” as “Schwatz,” repeats “any” in “for any given any \(\varepsilon\),”
  and contains line-break hyphenation; these are source typographical errors, not
  mathematical ambiguities.

  There is one important implicit convention. A nonsingular periodic path on a
  rational flat surface lies in a cylinder of parallel closed geodesics. Thus a
  finite quadratic \(N(T)\) cannot count all individual initial conditions; it
  counts maximal cylinders or periodic families, under a specified convention.
