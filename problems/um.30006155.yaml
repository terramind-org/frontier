title: The Multicolored Geometric Erdős–Hajnal Conjecture
field: mathematics
tier: prose
statement: For every prime power $q$, all $k,s\in\mathbb{N}$, and every $s$-coloring $c_0$ of $\operatorname{PG}(k-1,q)$, do constants $\delta,C>0$ exist such that, for every $n$ and every $c_0$-free $s$-coloring of $\operatorname{PG}(n-1,q)$, some subspace of dimension at least $Cn^\delta$ uses at most $s-1$ colors?
