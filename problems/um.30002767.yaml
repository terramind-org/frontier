title: Bestvina–Davis Candidates for the Eilenberg–Ganea Conjecture
field: mathematics
tier: prose
statement: Let $L$ be a finite acyclic two-dimensional flag complex whose fundamental group has a nontrivial unitary representation, let $W_L$ be the associated right-angled Coxeter group, and let $H\leq W_L$ be torsion-free of finite index. Although $\operatorname{cd}(H)=2$, must $\operatorname{gd}(H)=3$, making $H$ a counterexample to the Eilenberg–Ganea conjecture?
