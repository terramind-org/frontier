title: Kourovka Notebook Problem 17.110
field: mathematics
tier: prose
statement: |-
  a) Is it true that for each word $w$, there is
  a function $h:\mathbb{N}\times \mathbb{N}\rightarrow\mathbb{N}$
  such that the width of $w$ in every finite $p$-group of Pr\"{u}fer
  rank $r$ is bounded by $h(p,r)$?

  b) If so, can $h(p,r)$ be made independent of
  $p$?

  An affirmative answer to a) would imply
  A. Jaikin-Zapirain's result (*ibid.*) that every word has
  finite width in each $p$-adic analytic pro-$p$ group, since a
  pro-$p$ group is $p$-adic analytic if and only if the Pr\"{u}fer
  ranks of all its finite quotients are uniformly bounded.
