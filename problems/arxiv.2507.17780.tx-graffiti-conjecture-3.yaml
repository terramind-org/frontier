title: "TxGraffiti Conjecture 3: independent domination versus saturation (regular)"
field: mathematics
tier: proof
statement: |-
  TxGraffiti [Conjecture 3](https://arxiv.org/abs/2507.17780):
  for every $r$-regular graph $G$ ($r \ge 1$),
  $$i(G) \le \mu^*(G).$$

  This conjecture is **open**.
