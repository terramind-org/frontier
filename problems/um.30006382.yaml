statement: If $Y$ is smooth and proper over $k$, does exterior product induce an equivalence $\mathrm{DM}(X)^{\prime\prime}\otimes_{\mathrm{DM}(k)}\mathrm{DM}(Y)^{\prime\prime}\simeq\mathrm{DM}(X\times_kY)^{\prime\prime}$ for the enlarged motivic subcategories?
