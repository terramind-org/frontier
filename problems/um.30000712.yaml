title: Algebraic Complexity Bounds for Real Varieties
field: mathematics
tier: prose
statement: If $Y$ is a real algebraic variety with $\dim Y\geq2$, must $\beta(Y)\leq\dim Y-1$? In particular, is $\beta(S^n)=n-1$ for every $n\geq2$, where $S^n$ is the unit $n$-sphere?
