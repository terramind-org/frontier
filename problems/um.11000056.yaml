title: Problem 5.9 — (Cohomological Dimension).
field: mathematics
tier: prose
statement: (Cohomological Dimension). Compute the cohomological dimension of Ig and ofKg. More generally, compute the cohomological dimension of Ig(k) for all k≥ 1. Note that the cohomological dimension cd( Ig) is bounded above by the (virtual) cohomological dimension of Mod g, which is 4 g− 5. The following is a start on some lower bounds.
