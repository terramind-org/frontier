statement: |-
  **Question 8.2.1.** Is there a Riemannian metric on a closed manifold with everywhere positive sectional curvatures and ergodic geodesic flow?

  Metrics close to the standard metric on \(S^2\) would be especially interesting.

  **8.3. The measure of transitive and recurrent sets.**
