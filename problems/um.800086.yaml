title: Foliations and Diffeomorphism Groups — Question 27
field: mathematics
tier: prose
statement: Let $M$ be a closed hyperbolic 3-manifold whose first Betti number is at least one. Is every integral second cohomology class $a \in H^2(M ; \mathbb{R})$ of dual Thurston norm one realised as the Euler class of some representation $\rho \colon \pi_1(M) \rightarrow \mathrm{Homeo}_+(**S**^1)$?
