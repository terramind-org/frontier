title: Transversals in Random Subsets of Projective Planes
field: mathematics
tier: prose
statement: Let $P$ be the point set of a projective plane of order $q$, and retain each point independently with probability $1/2$ to form $R$. With high probability, must every $B\subseteq R$ meeting every nonempty line section $L\cap R$ satisfy $|B|/q>f(q)$ for some $f(q)\to\infty$? Can one take $f(q)=\Omega(\log q)$?
