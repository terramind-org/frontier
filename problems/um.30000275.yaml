title: Abelian Covering Conjectures for Curves over Number Fields
field: mathematics
tier: prose
statement: Let $C$ be a curve over a number field $k$, and let $X\in C(\mathbb A_k)$ be disjoint from $C(k)$. Does there exist an unramified covering $D\to C$ such that every twist $D_j$ has image disjoint from $X$? Can $D$ always be chosen abelian?
