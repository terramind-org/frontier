title: Axiomatic stable homotopy 9 — Suppose G is a self-equivalence of the stable homotopy category.
field: mathematics
tier: prose
statement: Suppose G is a self-equivalence of the stable homotopy category. Must G be some iterate of the suspension functor? If G commutes with the suspension, I can prove that GS^0 = S^n for some n, but this is almost all that I know. One could ask the same question for the K(n) local category or the E(n) local category.
