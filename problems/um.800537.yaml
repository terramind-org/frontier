title: Visibility Graphs of Points, Segments and Polygons — Problem 7
field: mathematics
tier: prose
statement: |-
  Consider the problem of obstacle representation of a given graph $G$ of $n$ vertices, which was
  introduced by Alpet et al. [akl-ong-2010]. Draw
  every vertex $v_i$ of $G$ as a point $p_i$ in the plane and draw obstacles in such a way
  that every segment $p_ip_j$
  intersects an obstacle if and only if $(v_i,v_j)$ is not an edge in $G$.
  The *obstacle number* of $G$ is the minimum number of obstacles required in any
  obstacle representation of $G$.
  Since an obstacle can be placed to block the visibility between each pair of points,
  $n \choose 2$ is an upper bound on the obstacle number of $G$.
  We have the following question from Alpet et al. [akl-ong-2010].

  Is the obstacle number of a graph with $n$ vertices bounded above by a linear function of $n$?
