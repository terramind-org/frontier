lean:
  module: FormalConjectures.OEIS.«255916»
  decl: OeisA255916.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) : 0 < a n"
  context:
    - open OeisA255916
    - open Nat Finset
  definitions:
    - name: OeisA255916.a
      kind: def
      text: |-
        /-- Number of ways to write $n$ as the sum of a generalized heptagonal number, an octagonal
        number, and a nonagonal number. -/
        def a (n : ℕ) : ℕ :=
          let nBound : ℕ := n + 1
          ∑ i ∈ Finset.range (2 * n + 3),
            let k : ℤ := (i : ℤ) - (n + 1 : ℤ)
            ∑ x ∈ Finset.range nBound, ∑ y ∈ Finset.range nBound,
              if Nat.generalizedPolygonalNumber 7 k + Nat.polygonalNumber 8 x + Nat.polygonalNumber 9 y = n
              then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/255916.lean#L37
