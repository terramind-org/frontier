title: Open Problems in Pluripotential Theory — Question 35
field: mathematics
tier: prose
statement: |-
  Let $(X,\omega)$ be a compact K\"ahler manifold and $Y \subset X$ a complex submanifold.
  It is natural to wonder whether all $\omega$-plurisubharmonic functions on $Y$ are induced by global $\omega$-plurisubharmonic functions:

  [Coman-Guedj-Zeriahi]
  Is it true that
  $$
  PSH \left(Y,\omega_{|Y} \right)=PSH(X,\omega)_{|Y} \; \; ?
  $$
