title: Prismatic Cohomology of Local Complete Intersections
field: mathematics
tier: prose
statement: |-
  Let $Y\subset\mathbb P^n_{\mathbb Z_p}$ be closed with $Y_{\mathbb F_p}$ a local complete intersection, and let $T_n$ denote the ambient infinitesimal object in the relative periodic-cyclic-homology setup. Is
  $$
  \operatorname{Ext}_{\mathrm{P\text{-}Mod}}^j\bigl(TP_0(\mathcal O_Y/\mathcal O_{T_n}),TP_0(\mathcal O_Y/\mathcal O_{T_n})\{i\}\bigr)
  $$
  the prismatic cohomology of $Y$, and is the resulting spectral sequence to $TP_{2i-j}(Y)$ the Bhatt–Morrow–Scholze spectral sequence?
