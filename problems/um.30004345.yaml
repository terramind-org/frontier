title: p-Adic Gross–Kudla–Zagier Formula for Diagonal Cycles
field: mathematics
tier: prose
statement: For the canonical $p$-adic height pairing on the modified diagonal cycles of three modular elliptic curves, the conjectural $p$-adic Gross–Kudla–Zagier formula asserts that $\langle h^*\Delta^\dagger_\xi,h'^*\Delta^\dagger_\xi\rangle_{\mathrm{Nek}}(\sqrt{3}-1)E_p(\operatorname{Fil}^+V_pE)=L'_p(E,1)I^\natural(h\otimes h')\cdot(\text{a power of }2)(\zeta(2)/\pi^2)^2$ for all admissible $h$ and $h'$.
