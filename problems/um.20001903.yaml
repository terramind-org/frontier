title: An angular Jacobi barrier for divergence of geodesic rays
field: mathematics
tier: prose
statement: |-
  Let \(\alpha\) and \(\beta\) be two geodesics in a complete simply connected Riemannian manifold without conjugate points.

  If \(X\) is complete and simply connected without conjugate points, \(p\in X\), and \(v\ne w\) are unit vectors in \(T_pX\), must the unit rays \(\gamma_v(t)=\exp_p(tv)\) and \(\gamma_w(t)=\exp_p(tw)\) satisfy \(d(\gamma_v(t),\gamma_w(t))\to\infty\)?
