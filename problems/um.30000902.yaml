title: Large Triple-Product-Free Subsets of Finite Groups
field: mathematics
tier: prose
statement: Do there exist infinitely many groups $G_n$ of order $n$ containing subsets $S_n$ such that $ab^{-1}cd^{-1}ef^{-1}=1$, with $a,b,c,d,e,f\in S_n$, has only trivial solutions and $|S_n|\gg n^{1/3}$?
