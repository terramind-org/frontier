title: Kourovka Notebook Problem 10.40
field: mathematics
tier: prose
statement: |-
  (H. Bass). Let $G$ be a group, $e$ an
  idempotent matrix over ${\mathbb{Z}G$ and let $\mathrm{tr}
  e=\sum\limits_{g\in G}e_gg, e_g \in {\mathbb{Z}.$ *Strong
  conjecture:* for any non-trivial $x \in G$, the equation
  $\sum\limits_{g\sim x} e_g=0$ holds where $\sim $ denotes
  conjugacy in $G$. *Weak conjecture:* $\sum\limits_{g\in G}
  e_g=0$. The strong conjecture has been proved for finite, abelian
  and linear groups and the weak conjecture has been proved for
  residually finite groups.

  *H. Bass' Comment of 2005:* Significant
  progress has been made; a good up-to-date account is in the paper
  (A. J. Berrick, I. Chatterji, G. Mislin, *Math. Ann.*, **329** (2004), 597--621).
