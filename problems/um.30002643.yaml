title: Determinant Bounds in Terms of Knot-Crossing Number
field: mathematics
tier: prose
statement: |-
  For a knot or link $K \subset S^3$, let $\det(K) = |\Delta_K(-1)|$ be its determinant, let $c(K)$ be its crossing number, and let $v_8 \approx 3.66386$ denote the volume of the regular ideal hyperbolic octahedron. For every knot or link $K$, does the upper bound
  $$
  \frac{2\pi \log \det(K)}{c(K)} \leq v_8
  $$
  hold?
