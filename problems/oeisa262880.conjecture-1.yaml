  module: FormalConjectures.OEIS.«262880»
  decl: OeisA262880.conjecture_1
  statement: |-
    theorem conjecture_1 (p : ℕ × ℕ) (hp : p ∈ pairs1) (n : ℕ) (hn : 0 < n) :
        ∃ w x y z : ℕ, 0 < w ∧ n = Nat.triangular w + x ^ 3 + p.1 * y ^ 3 + p.2 * z ^ 3
  context:
    - open OeisA262880
  definitions:
    - name: OeisA262880.pairs1
      kind: def
      text: |-
        /-- The set of coefficient pairs $(b, c)$ for part (i) of the conjecture. -/
        def pairs1 : Finset (ℕ × ℕ) :=
          {(1, 2), (1, 3), (1, 4), (1, 6),
           (2, 2), (2, 3), (2, 4), (2, 5), (2, 6), (2, 7), (2, 20), (2, 21), (2, 34),
           (3, 3), (3, 4), (3, 5), (3, 6),
           (4, 10)}
