lean:
  module: FormalConjectures.OEIS.«180017»
  decl: OeisA180017.conjecture
  statement: "theorem conjecture (z : ℤ) : Set.Infinite {n : ℕ | a n = z}"
  context:
    - open OeisA180017
  definitions:
    - name: OeisA180017.a
      kind: def
      text: |-
        /-- Difference of sums of digits of $n$ in ternary and in binary. -/
        def a (n : ℕ) : ℤ :=
          (Nat.digits 3 n).sum - (Nat.digits 2 n).sum
