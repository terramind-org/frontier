title: Extremality criteria for matrix-valued maps
field: mathematics
tier: prose
statement: |-
  **Question 25 (D. Kleinbock, G. Margulis; see [109], Section 6.2).** Find reasonable and checkable conditions for a smooth map
  \[
  f:U\;(\subset\mathbb R^k)\longrightarrow M_{m\times n}(\mathbb R)
  \]
  which generalize nondegeneracy of vector-valued maps and imply that almost every point of \(f(U)\) is not VWA. Such conditions were obtained in some cases in [115,116,105].
