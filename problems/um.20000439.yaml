title: Four-part status and a finite canonical-cover descent audit
field: mathematics
tier: prose
statement: |-
  I checked the record
  against the AIM PDF and the AIM HTML rendering [AIM].

  Let \(k\) be a number field and let \(X/k\) be
  an Enriques surface.

  1. If \(X(k)\ne\varnothing\), must \(X(k)\) be Zariski dense in \(X\)?
  2. Does an Enriques surface exist that violates the Hasse principle?
  3. Does one exist for which
     \[
     X(\mathbf A_k)^{\operatorname{Br}}=\varnothing
     \quad\text{and}\quad X(\mathbf A_k)\ne\varnothing?
     \]
  4. Does one exist for which
     \[
     X(k)=\varnothing
     \quad\text{and}\quad
     X(\mathbf A_k)^{\operatorname{Br}}\ne\varnothing?
     \]

  The neighboring AIM Question 8 makes
  the intended descent connection explicit.
