title: A rigging-refined stable-level fusion polynomial
field: mathematics
tier: prose
statement: (12) Consider the product $B=B^{r_\ell s_\ell}\otimes_k\cdots\otimes_k B^{r_1 s_1}$. In this case, where the factors are products of rectangles in type $A$, there are known combinatorial interpretations and fermionic formulas for the fusion coefficients via rigged configurations (Schilling et al.). There exist conjectural formulas in other types (Hatayama et al.). The problem of generalizing the grading of the tensor product to the two-variable $(q,t)$ case is open.
