title: Essential Self-Adjointness on Almost-Riemannian Regular Regions
field: mathematics
tier: prose
statement: Let $R$ be the regular region of an almost-Riemannian manifold. Is the Laplace–Beltrami operator $\Delta_g$, initially defined on $C_c^\infty(R)$, essentially self-adjoint on $L^2(R,\mu_g)$? In particular, is this true for every real-analytic two-dimensional almost-Riemannian structure without tangency points?
