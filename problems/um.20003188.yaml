title: Generic specialization and wall cancellation for Witt–Toledo classes
field: mathematics
tier: prose
statement: |-
  Let \(k\) be a field and \(V\) a symplectic vector space over \(k\). There
  exists a central extension
  \[
  1\longrightarrow W(k)\longrightarrow \widetilde{\operatorname{Sp}}(V)
  \longrightarrow \operatorname{Sp}(V)\longrightarrow 1,
  \]
  where \(W(k)\) is the Witt group. Given a representation
  \(\rho:\pi_1(S)\to\operatorname{Sp}(V)\), the Toledo invariant
  \(\tau(\rho)\) is an element of \(W(k)\). Let \(A\) be an algebraic set and
  consider a map
  \(u:A\to\operatorname{Rep}(\pi_1(S),\operatorname{Sp}(2n,\mathbb R))\).
  To this map associate the tautological representation
  \(\rho:\pi_1(S)\to\operatorname{Sp}(2n,k(A))\), and define the invariant
  \(\tau(\rho)\in W(k(A))\). Study this.
