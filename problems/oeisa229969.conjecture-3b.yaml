  module: FormalConjectures.OEIS.«229969»
  decl: OeisA229969.conjecture_3b
  statement: |-
    theorem conjecture_3b (n : ℕ) (hn : n > 2) :
        ∃ x y z : ℕ, 0 < x ∧ 0 < y ∧ 0 < z ∧ x + y + z = n ∧
          x ∈ ({1, 2, 3} : Finset ℕ) ∧
          (2 * x + 1).Prime ∧ (2 * y + 1).Prime ∧ (2 * z + 1).Prime ∧
          (2 * x * y * z + 1).Prime
  context:
    - open OeisA229969
  definitions: []
