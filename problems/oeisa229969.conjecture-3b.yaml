id: oeisa229969.conjecture-3b
title: Ways to write $n = x + y + z$ with six linear and quadratic forms prime (conjecture_3b)
field: mathematics
tier: proof
statement: |-
  Conjecture (i), part 2: Each integer $n > 2$ can be written as $x + y + z$ ($x, y, z > 0$) with
  $2x+1, 2y+1, 2z+1$ and $2xyz+1$ all prime and $x$ among $1, 2, 3$.
  - _Zhi-Wei Sun_
