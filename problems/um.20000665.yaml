title: Parity-twisted Liouville correlations and a synchronization obstruction
field: mathematics
tier: prose
statement: |-
  Is $-1$ in the spectrum of a Liouville system? Equivalently, can we show that
  \[
  \sum_{n\leq X}(-1)^{n-1}\frac{\lambda(n+h_1)\cdots\lambda(n+h_k)}{n}
  =o(\log X)?
  \]
