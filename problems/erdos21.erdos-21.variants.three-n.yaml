  module: FormalConjectures.ErdosProblems.«21»
  decl: Erdos21.erdos_21.variants.three_n
  statement: |-
    theorem erdos_21.variants.three_n : ∃ C : ℕ, ∀ᶠ n : ℕ in atTop,
        f n ≤ 3 * n + C ∧ 3 * n ≤ f n + C
