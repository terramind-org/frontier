title: Commutants of Volterra Operators on $L^p$ Spaces
field: mathematics
tier: prose
statement: For the Volterra operator $V$ on $L^p[0,1]$, defined by $(Vf)(x)=\int_0^xf(s)\,ds$, characterize its commutant $[V]_p$ when $p\notin\{1,2,\infty\}$. The commutant is known for $p\in\{1,2,\infty\}$ but remains open for all other values of $p$.
