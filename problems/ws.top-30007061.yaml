statement: |-
  \section*{Symmetry of bounded semialgebraic domains with compact quotient}\label{30007061}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Let U be nonempty connected semialgebraic bounded open in a complex affine variety. If a group of biholomorphisms acts properly discontinuously and U has compact quotient, must U be smooth and biholomorphic to a bounded symmetric domain?
  \subsection{Short English statement}
  Let U be nonempty connected semialgebraic bounded open in a complex affine variety. If a group of biholomorphisms acts properly discontinuously and U has compact quotient, must U be smooth and biholomorphic to a bounded symmetric domain?
