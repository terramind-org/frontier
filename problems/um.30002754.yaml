title: Existence and Uniqueness of Sobolev Traces on Continuous Domains
field: mathematics
tier: prose
statement: If $\Omega$ has continuous boundary, does every element of $H^1(\Omega)$ have at most one trace, and does existence of a trace imply uniqueness? In particular, if every element of $\widetilde{H}^1(\Omega)$ has a trace, does every element of $H^1(\Omega)$ have at most one trace?
