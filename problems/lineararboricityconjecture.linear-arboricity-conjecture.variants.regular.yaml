lean:
  module: FormalConjectures.Wikipedia.LinearArboricityConjecture
  decl: LinearArboricityConjecture.linear_arboricity_conjecture.variants.regular
  statement: |-
    theorem linear_arboricity_conjecture.variants.regular {V : Type} [Fintype V] [Nonempty V]
        (G : SimpleGraph V) [DecidableRel G.Adj] (Δ : ℕ) (hΔ : 0 < Δ)
        (hreg : ∀ v, G.degree v = Δ) :
        linearArboricity G = (Δ + 2) / 2
  context:
    - open LinearArboricityConjecture
    - open LinearArboricityConjecture.linear_arboricity_conjecture
    - open LinearArboricityConjecture.linear_arboricity_conjecture.variants
    - "variable {V : Type*}"
  definitions:
    - name: LinearArboricityConjecture.linearArboricity
      kind: def
      text: |-
        /-- The **linear arboricity** `la(G)`: the least number of linear forests into which the edges
        of `G` can be partitioned. -/
        noncomputable def linearArboricity (G : SimpleGraph V) : ℕ :=
          sInf {k | HasLinearForestDecomposition G k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/LinearArboricityConjecture.lean#L51
