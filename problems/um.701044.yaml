title: Kourovka Notebook Problem 14.59
field: mathematics
tier: prose
statement: |-
  Suppose that $G$ is a triply transitive
  group in which a stabilizer of two points contains no involutions,
  and a stabilizer of three points is trivial.
  Is it true that $G$ is similar to $PGL_2(P)$ in its natural action
  on the projective line
  $P\cup \{ \infty \}$, for some field
  $P$ of characteristic $2$? This is true under the condition that the
  stabilizer of two points is periodic.
