title: Magnetic, Robin, and Hot-Spots Spectral Gap Questions
field: mathematics
tier: prose
statement: "Open spectral-gap questions include: can a valid magnetic gap inequality be obtained by subtracting a term depending on the magnetic potential $A$; is the ground state of $-\\Delta$ log-concave; does the Dirichlet eigenfunction ratio $u_2/u_1$ attain its extrema on the boundary of a convex domain (the analogue of Hot Spots); and, for Robin boundary conditions $\\partial u/\\partial\\nu=-\\alpha u$, is $\\lambda_2-\\lambda_1$ minimized when $V=0$ and the domain degenerates to a segment of the same diameter, and can Lavine's methods be adapted in one dimension?"
