title: Two-square coordinates and curve-source images over a rank-one elliptic curve
field: mathematics
tier: prose
statement: |-
  **Question 23 (Poonen).** Let \(E\subset \mathbf P^2\) be an elliptic curve over \(\mathbf Q\), and suppose \(E(\mathbf Q)\simeq \mathbf Z\).

  (a) Describe \(S\subset E(\mathbf Q)\), where
  \[
  S=\{(x,y):y=a^2+b^2,\ a,b\in\mathbf Q\}.
  \]
  Is \(S\) finite?

  (b) More generally, \(\pi:X\to E\) gives a subset \(\pi(X(\mathbf Q))\subset E(\mathbf Q)\); what others can you build?
