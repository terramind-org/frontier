title: Virtual-knot problem 44 — A complete invariant is used for proving that one theory is a part of another theory.
field: mathematics
tier: prose
statement: |-
  A complete invariant is used for proving that one theory is a part
  of another theory. For example, the fact that the set of classical
  knots is a part of the set of virtual knots, is true for the same
  reason as a quandle with peripheral structure can be extended from
  classical knots into virtual knots. Analogous statements can be done
  for classical and virtual braids (the extension of Hurwitz's
  action).

  So, we get an actual problem: how can one construct a complete
  invariant for virtual knots?
