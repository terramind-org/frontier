title: Modes and Maximum A Posteriori Estimators on Metric Spaces
field: mathematics
tier: prose
statement: For a probability measure $\mu$ on a metric space $(X,d)$, define and characterize what it means for a point to be a most likely outcome. Determine when competing notions of mode or maximum a posteriori estimator agree and when a unique canonical notion exists.
