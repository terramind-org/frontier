statement: Give an asymptotic expansion of the Hausdorff dimension of $J^+_{a,c}$ as $(a,c)$ tends to $(0, 0)$. In particular is there a uniform lower bound of $\dim(J^+_{a,c})$ of the form $\dim(J^+_{a,c})\geq 3+h(a)$ with $h(a)>0$ in the neighborhood of $c=0$?
