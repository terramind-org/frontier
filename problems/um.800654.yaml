title: Selection Principles Milestone Problems — Problem 27 ([GJ, Question 2.4])
field: mathematics
tier: prose
statement: |-
  For an ultrafilter $p$, $\mathcal{O}_p$ denotes the collection of open $\gamma_p$-covers of $X$,
  that is, open covers $\mathcal{U}$ that can be enumerated as $\{U_n\}_{n\in\mathbb{N}}$ where
  $\{n : x\in U_n\}\in p$ for all $x\in X$. The property $\binom{\Omega}{\mathcal{O}_p}$ is called
  *the $\gamma_p$-property* in [GTpseq].

  Is the property $\binom{\Omega}{\mathcal{O}_p}$ additive for each ultrafilter $p$?
