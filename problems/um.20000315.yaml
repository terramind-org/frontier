id: um.20000315
title: A common-SNC carry formula for the negative-perturbation subadditivity question
field: mathematics
tier: prose
statement: |-
  Let \((R,\mathfrak m)\) be a regular local ring of characteristic \(p\).
  Suppose that ideals \(I,\mathfrak a,\mathfrak b\) of \(R\) satisfy
  \(\mathfrak a\subset I\),
  \(\mathcal J(I^{-\epsilon}\cdot\mathfrak a^s)\subset\mathfrak m\), and
  \(\mathcal J(\mathfrak b^t)\subset\mathfrak m\). Then is
  \[
  \mathcal J(I^{-\epsilon}\cdot\mathfrak a^s\cdot\mathfrak b^t)
  \subset
  \mathcal J(I^{-\epsilon}\cdot\mathfrak a^s)
  \mathcal J(\mathfrak b^t)?
  \]
