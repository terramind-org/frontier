  \item[\hypertarget{source:3013:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, record 3013 (KP-5.6). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:3013:2}{S2}] R. İnanç Baykur, Robion C. Kirby and Daniel Ruberman (eds.), \emph{K3: A New Problem List in Low-Dimensional Topology}, Mathematical Surveys and Monographs 295, American Mathematical Society (2026), Problem 5.6, author preliminary version. \url{https://math.berkeley.edu/sites/default/files/surv-295-ruberman-watermarked-author-pdf.pdf}.
  \end{description}
