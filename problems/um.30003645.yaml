title: Rigidity of a Multiplicative Functional Equation
field: mathematics
tier: prose
statement: |-
  If $f:\mathbb R_{>0}\to\mathbb R_{>0}$ is nondecreasing and
  $$
  f(x)+f(x/2)+f(x/3)+f(x/5)=\left(\frac{61}{30}+o(1)\right)x
  $$
  as $x\to\infty$, must $f(x)=(1+o(1))x$?
