lean:
  module: FormalConjectures.OEIS.«219791»
  decl: OeisA219791.conjecture_2
  statement: |-
    theorem conjecture_2 (k : ℕ) (hk : 0 < k) :
        ∃ N : ℕ, ∀ n : ℕ, N ≤ n →
          ∃ x y : ℕ, 0 < x ∧ 0 < y ∧ x + y = n ∧ Nat.Prime ((x * y) ^ (2 ^ k) + 1)
