id: oeisa219791.conjecture-2
title: Partitions of $n$ into $x + y$ with $(xy)^2 + 1$ prime (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture: For any positive integer $k$, each
  sufficiently large integer $n$ can be written as $x + y$ ($x > 0, y > 0$) with $(xy)^{2^k} + 1$
  prime.
  - _Zhi-Wei Sun_
