title: A three-state correction to the local quadratic-twist rank ratio
field: mathematics
tier: prose
statement: |-
  **Question 1 (Brian Conrey).** Let \(E/\mathbb F_q(T)\). Let \(f\) vary over square free, large degree \(n\) and let \(P\in\mathbb P^1\); does
  \[
  \lim_{n\to\infty}
  \frac{\#\{f\in\mathbb F_q[T]_n:\operatorname{rank}E_f\ge 2
  \text{ and } f(P)\in(\mathbb F_q^*)^2-\{0\}\}}
  {\#\{f\in\mathbb F_q[T]_n:\operatorname{rank}E_f\ge 2
  \text{ and } f(P)\notin(\mathbb F_q^*)^2\}}
  \stackrel{?}{=}
  \sqrt{\frac{\#E_P(\mathbb F_q)}{\#\widetilde E_P(\mathbb F_q)}}\ ?
  \]
