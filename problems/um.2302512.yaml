title: Research Problems in Function Theory — Problem 2.12a
field: mathematics
tier: prose
statement: Under the same conditions as in Problem 2.12, is it true that if $\rho\Delta<1$, $f(z)$ cannot have a finite asymptotic value? This is known if $\rho\Delta<1/\pi^2$, see K\"ovari . Is it true that, if $m_0(r,f)$ is the minimum modulus \[\limsup_{r\to\infty}\frac{\log m_0(r,f)}{\log M(r,f)}\geq\cos(\pi\rho\Delta)?\] See K\"ovari .
