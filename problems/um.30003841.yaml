title: Closed Spraiges in the Braided Thompson Group
field: mathematics
tier: prose
statement: A closed spraige is a closed split–braid–merge band diagram representing conjugacy data in the braided Thompson group $V_{\mathrm{br}}$. Beyond its use in studying conjugacy, what structural or dynamical information about $V_{\mathrm{br}}$ can be recovered from closed spraiges?
