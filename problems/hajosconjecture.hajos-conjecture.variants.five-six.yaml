lean:
  module: FormalConjectures.Wikipedia.HajosConjecture
  decl: HajosConjecture.hajos_conjecture.variants.five_six
  statement: |-
    theorem hajos_conjecture.variants.five_six :
        ∀ {V : Type} [Fintype V] (G : SimpleGraph V) (k : ℕ), k = 5 ∨ k = 6 →
          (k : ℕ∞) ≤ G.chromaticNumber → ContainsSubdivision (completeGraph (Fin k)) G
  context:
    - open HajosConjecture
    - open HajosConjecture.hajos_conjecture
    - open HajosConjecture.hajos_conjecture.variants
    - open SimpleGraph
    - "variable {V W : Type*}"
  definitions:
    - name: HajosConjecture.ContainsSubdivision
      kind: def
      text: |-
        /-- `G` contains a **subdivision** of `H` (i.e. `H` is a topological minor of `G`). -/
        def ContainsSubdivision (H : SimpleGraph W) (G : SimpleGraph V) : Prop :=
          ∃ (f : W → V) (P : ∀ w w', H.Adj w w' → G.Walk (f w) (f w')), IsSubdivisionModel H G f P
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/HajosConjecture.lean#L58
