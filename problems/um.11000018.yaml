title: Problem 2.16 — (Automorphism groups with special properties).
field: mathematics
tier: prose
statement: (Automorphism groups with special properties). LetP be a property of finite groups, for example being nilpotent, solvable, or a p-group. Prove a version of Larsen ’s theorem which counts those g for which the upper bound of | Aut(Xg)| is realized for some Xg withAut(Xg) havingP. Similarly for lower bounds. Determine the least g for which each given bound is realized. Many of the surfaces realizing the extremal bounds in all of the above questions are arithmetic, that is they are quotients of H2 by an arithmetic lattice. Such lattices are well-known to have special properties, in particular they have a lot of symmetry. On the other hand arithmetic surfaces are not typical. Thus to understand the “typical” surface with symmetry, the natural problem is the following.
