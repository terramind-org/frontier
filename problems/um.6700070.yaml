title: "Scalar Curvature Question [?74]: Parametric Hypersphericity"
field: mathematics
tier: prose
statement: Conjecture. Parametric Hypersphericity. Let X be a complete oriented Riemanniann-manifold and letΨ(X) ⊂Lipλ(X →Sn(1))) be the space of 1-Lipschitz locally constant at inﬁnity maps66 of degree one fromX to the unit sphere. If Sc(X) ≥m(m−1) +ε, m ≥2, ε > 0, then the macroscopic dimension of Ψ(X) is ≤n−m−1.
