title: Billiards and Quantitative Symplectic Geometry — Serge Tabachnikov — Problem 1
field: mathematics
tier: prose
statement: |-
  **Projective billiards..** Projective billiards were defined in [Ta97]. A projective billiard table is a convex domain with smooth boundary equipped with a transverse field of directions; the phase space is the same as that of the conventional billiard, and the reflection law is such that the tangential component of the incoming velocity vector is preserved, whereas the transverse component is reversed.

  Problem: *when does a projective billiard possess an invariant symplectic form?* And, related, *when does it have a variational description?*

  One such situation is described in [Ta97-1]: the billiard table is bounded by a sphere, and the transverse field satisfies a certain *exactness* condition. The invariant symplectic form on oriented lines that intersect the sphere is induced by the hyperbolic metric in its interior (the projective, or Beltrami-Cayley-Klein model).
  Another example, in dimension 2, is when the billiard curve is an arbitrary oval, but the lines of the transverse field are all concurrent; the invariant area form comes from the standard area form in the plane via polar duality (see [Ta97]).

  In recent papers [Glu,GM], a somewhat related question was studied: when is a Minkowski billiard projective? (In which case it has a variational description and an invariant symplectic form). The answer is that such a billiard is the conventional one in some Euclidean metric.
