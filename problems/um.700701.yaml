title: Kourovka Notebook Problem 11.8
field: mathematics
tier: prose
statement: |-
  b) For a finite group $X$,
  let $\chi _1(X)$ denote the totality of the degrees of all
  irreducible complex characters of $X$ with allowance for their
  multiplicities. Suppose that $\chi _1(G)=\chi _1(H)$ for groups
  $G$ and $H$. Clearly, then $|G|=|H|$. Is it true that
  $H$ is soluble if $G$ is soluble?

  It is known that $H$ is a Frobenius group if $G$ is a Frobenius
  group.

