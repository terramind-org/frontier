title: Measure-Topology Continuity and the Algebra $M^A$
field: mathematics
tier: prose
statement: Let $A$ be a weakly dense $*$-subalgebra of a finite von Neumann algebra $(M,\tau)$, and let $M^A$ be the smallest subalgebra of $M$ closed under taking weak closures of abelian $*$-subalgebras. When is $M^A=M$? Is every derivation $\Delta:M\to U(M\mathbin{\overline\otimes}M^{\mathrm{op}})$ automatically continuous from bounded convergence in measure to convergence in measure?
