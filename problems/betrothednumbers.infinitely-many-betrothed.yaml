lean:
  module: FormalConjectures.Wikipedia.BetrothedNumbers
  decl: BetrothedNumbers.infinitely_many_betrothed
  statement: |-
    theorem infinitely_many_betrothed :
        {p : ℕ × ℕ | p.1 < p.2 ∧ IsBetrothed p.1 p.2}.Infinite
  context:
    - open BetrothedNumbers
    - open scoped ArithmeticFunction.sigma
  definitions:
    - name: BetrothedNumbers.IsBetrothed
      kind: structure
      text: |-
        /--
        Two natural numbers $m$ and $n$ are **betrothed**  (or quasi-amicable) if $\sigma(m) = \sigma(n) = m + n + 1$,
        where $\sigma$ is the sum-of-divisors function. Equivalently, the sum of the proper divisors
        of $m$ equals $n + 1$, and the sum of the proper divisors of $n$ equals $m + 1$.
        -/
        @[mk_iff]
        structure IsBetrothed (m n : ℕ) : Prop where
          left : σ 1 m = m + n + 1
          right : σ 1 n = m + n + 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/BetrothedNumbers.lean#L34
