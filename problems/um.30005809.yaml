title: Point-to-Nonincident-Line Separation
field: mathematics
tier: prose
statement: Let $p_1,\ldots,p_n\in[0,1]^2$ and let each line $\ell_i$ pass through $p_i$. Determine the largest possible value of $\delta=\min_{i\neq j}d(p_i,\ell_j)$. In particular, prove or disprove that $\delta\leq n^{-1+\varepsilon}$ for every $\varepsilon>0$ and all sufficiently large $n$.
