title: Pole Orders and Extensions of Kirillov–Reshetikhin Modules
field: mathematics
tier: prose
statement: For Kirillov–Reshetikhin modules $V$ and $W$, is the order of the pole at $z=1$ of the normalized R-matrix between $V$ and $W$ equal to the dimension of the first extension group between their generic-kernel modules over the associated generalized preprojective algebra?
