title: Research Problems in Function Theory — Problem 9.16
field: mathematics
tier: prose
statement: Let $\Gamma$ be a curve of the form \[\{x+iA(x):-\infty<x<\infty\}\] with \[|A(x_1)-A(x_2)|\leq M|x_1-x_2|.\] Let $E$ be a compact subset of $\Gamma$, $\Delta_1(t)> 0$, and let \[\Omega=\mathbb{C}^*\setminus E,\hspace{1cm}\text{ where }\mathbb{C}^*=\mathbb{C}\cup\{\infty\}.\] Prove the corona theorem for $\Omega$. (J. Garnett)
