title: Selection Principles Milestone Problems — Problem 12 (\Cite{\mathbb{S} 4}{spm1})
field: mathematics
tier: prose
statement: |-
  The following problem arises in almost every study of $\tau$-covers
  [tau, tautau, splittability, strongdiags, Hdim, MilNonGamma].
  By [GN], $\mathsf{S}_1(\Omega,\Gamma)\Leftrightarrow\binom{\Omega}{\Gamma}$.
  As $\Gamma\subseteq\mathrm{T}$, this property implies $\binom{\Omega}{\mathrm{T}}$.
  Thus far, all examples of sets not satisfying $\binom{\Omega}{\Gamma}$
  turned out not to satisfy $\binom{\Omega}{\mathrm{T}}$.

  Is $\binom{\Omega}{\Gamma}$ equivalent to $\binom{\Omega}{\mathrm{T}}$?
