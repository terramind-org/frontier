title: Kourovka Notebook Problem 16.96
field: mathematics
tier: prose
statement: |-
  Let $G$ be a locally finite $n$-Engel
  $p $-group where $p$ a prime greater than $n$. Is $G$ then a
  Fitting group?
  (Examples of N. Gupta and F. Levin show that the
  condition $p>n$ is necessary in general.)
