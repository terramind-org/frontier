title: Higher-dimensional asymptotic geodesics and the homology obstruction
field: mathematics
tier: prose
statement: |-
  **Problem 8.6.1 (Schmidt).** Generalize this statement to higher dimensions.

  Let \(M\) be an oriented closed Riemannian surface of genus at least one,
  let \(\Gamma\) be a nontrivial free homotopy class, and let \(p\in M\).
  There are a closed geodesic \(\gamma:\mathbb R\to M\) in \(\Gamma\) and a
  geodesic half-orbit \(\beta:[0,\infty)\to M\), with \(\beta(0)=p\), such that,
  after choosing the origins of the two unit-speed parametrizations,
  \[
  d(\beta(t),\gamma(t))\longrightarrow 0.
  \]
