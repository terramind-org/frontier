title: Intersection Numbers on First Voronoi Compactifications
field: mathematics
tier: prose
statement: On the first Voronoi compactification $\mathcal{A}_g^F$, let $L$ be the Hodge divisor and $D$ the boundary divisor. Is $\langle L^nD^{g(g+1)/2-n}\rangle_{\mathcal{A}_g^F}=0$ unless $n=k(k+1)/2$ for some integer $k$ with $0\leq k\leq g$?
