title: Research Problems in Function Theory — Problem 6.54
field: mathematics
tier: prose
statement: Let $D$ be a Jordan domain with boundary $C$, $\{F_n(z)\}^\infty_1$ the sequence of Faber polynomials for $D$, and $S(D)$ the class of univalent functions \[f(z)=F_1(z)+\sum^\infty_{n=2}a_nF_n(z)\] in $D$. Does the coefficient region of at least one $a_n$ have the same shape as $C$, or is it at least in the subclass of star-like functions? Royster has shown that, if $f$ is star-like in an ellipse, then there exists a direction $\theta_f$ and sequences \[\{\lambda_n\}^\infty_2,\hspace{1cm}\{\mu_n\}^\infty_2,\hspace{1cm}\lambda_n>\mu_n>0,\] such that each coefficient $a_n$ lies in an ellipse of centre $0$, major axis $\lambda_n$, minor axis $\mu_n$, inclined at an angle $\theta_f$ to the real axis. (The $\lambda_n, \mu_n$ are known.) (K. W. Lucas)
