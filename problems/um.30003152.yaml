title: Hodge Spectral Gaps Under Ricci Bounded Convergence
field: mathematics
tier: prose
statement: For a noncollapsed Gromov–Hausdorff convergent sequence with $|\operatorname{Ric}_{X_i}|\leq K$, is there a uniform spectral gap for the Hodge Laplacian on 1-forms and, equivalently, does $b_1(X_i)\to b_1(X)$, with the harmonic 1-form Betti number of the limit equal to the ordinary $b_1(X)$?
