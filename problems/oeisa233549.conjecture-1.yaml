  definitions:
    - name: OeisA233549.a
      kind: def
      text: |-
        /--
        Number of ways to write $n = p + q$ ($q > 0$) with $p$ prime and
        $(\phi(p)\phi(q))^4 + 1$ prime, where $\phi$ is Euler's totient function.
        -/
        def a (n : ℕ) : ℕ :=
          Finset.card <| Finset.filter (fun p : ℕ =>
            p.Prime ∧
            let q := n - p
            Nat.Prime ((p.totient * q.totient) ^ 4 + 1)
          ) (Finset.range n)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/233549.lean#L34
