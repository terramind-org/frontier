title: Questions in Geometric Group Theory — Q 3.11
field: mathematics
tier: prose
statement: For $x\in[F_n,F_n]$, define its genus as the least $g$ such that $x$ is a product of $g$ commutators. Let $f(g)$ be a uniform bound, independent of $x$, on the number of Nielsen-equivalence classes of expressions of a genus-$g$ element as a product of $g$ commutators. Give an explicit upper bound for $f(g)$.
