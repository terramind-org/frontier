title: Motivic suspension, framed BPQ, and a quadratic zero-stem obstruction
field: mathematics
tier: prose
statement: |-
  In classical homotopy theory, there are, among many others, three
  important notions/results:

  (1) The Freudenthal suspension theorem

  (2) The Barratt-Priddy-Quillen theorem

  (3) Infinite loop space theory

  Can we construct/prove the above notions in the context of motivic
  homotopy theory?
