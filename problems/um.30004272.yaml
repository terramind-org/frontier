title: Self-Adjointness for Degenerate No-Tangency Metrics
field: mathematics
tier: prose
statement: |-
  For the vector fields

  $$X_1=\partial_x,\qquad X_2=x(x^{2\ell}+z^2)\partial_z$$

  on $\mathbb R^2$, is the Laplace–Beltrami operator on the regular region essentially self-adjoint for every $\ell\geq1$?
