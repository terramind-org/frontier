title: Dihedral Groups as Oort Groups
field: mathematics
tier: prose
statement: For an odd prime $p$ and $n\geq1$, is the dihedral group $D_{p^n}$ of order $2p^n$ an Oort group; that is, does every local Galois extension with this group lift to characteristic zero?
