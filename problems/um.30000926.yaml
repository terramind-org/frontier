title: Denominators of Cluster Variables from Nonacyclic Seeds
field: mathematics
tier: prose
statement: For a cluster algebra $A(\mathbf x,Q)$ whose initial seed is not acyclic, how should the denominator of a cluster variable be interpreted? In particular, can every cluster variable be written with exponent vector $d_y=\dim\operatorname{Hom}_{\mathcal C_Q}(T_y,M)$ for $T=\bigoplus_yT_y$?
