title: Common-Neighbor Conjecture for Generalized Saxl Graphs
field: mathematics
tier: prose
statement: Let $G$ be a finite primitive permutation group on $\Omega$ with base size $b(G)\geq2$. Form the generalized Saxl graph $\Sigma(G)$ on $\Omega$ by joining two vertices when they lie in a base of size $b(G)$. Must every two vertices of $\Sigma(G)$ have a common neighbor?
