  \section{\texorpdfstring{$d$-to-$1$ Games Conjecture}{d-to-1 Games Conjecture}}\label{30004013}
  {\small UnsolvedMath ID 30004013 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For every integer $d\geq2$ and every $s>0$, does there exist an alphabet size $k$ such that it is NP-hard to distinguish satisfiable $d$-to-$1$ Label-Cover instances from instances of value at most $s$?
  \par\smallskip\textit{Formulation references:} \sref{30004013}{1}, \sref{30004013}{2}.
  \subsection{Short English statement}
  For every integer $d\geq2$ and every $s>0$, does there exist an alphabet size $k$ such that it is NP-hard to distinguish satisfiable $d$-to-$1$ Label-Cover instances from instances of value at most $s$?
