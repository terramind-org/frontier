title: Radon Numbers for Unions of Convex Sets
field: mathematics
tier: prose
statement: What is the least integer $f(d,s,t)$ such that every set $P$ of $f(d,s,t)$ points in $\mathbb R^d$ admits a partition $P=A\sqcup B$ for which every $s$-convex set containing $A$ intersects every $t$-convex set containing $B$? Is $f(d,s,t)$ polynomial in its parameters?
