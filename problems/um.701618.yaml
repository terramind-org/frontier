statement: |-
  (P. Wesolek and P.-E. Caprace).
  Let $\mathscr{S}$ denote the class of nondiscrete compactly generated, topologically simple tdlc groups. Let $G$ be a non-elementary tdlcsc group. Is there a compactly generated closed subgroup $H \leq G$ such that $H$ has a continuous quotient in $\mathscr{S}$?
