title: A polar-edge uniqueness criterion for removable meromorphic singularities
field: mathematics
tier: prose
statement: Assume \(M\subset \mathbb C^n\) is a real-analytic generic submanifold, \(f=p/q:\mathbb C^n\to\mathbb C^N\) is the germ of a meromorphic map at \(z\in M\), and \(f\) is holomorphic in a one-sided wedge \(W\) attached to \(M\) near \(z\). Assume that \(\|f(w)\|^2\) increases to 1 as \(w\to M\) in \(W\). Does \(f\) extend to a full neighborhood of \(z\) in \(\mathbb C^n\)?
