title: A height-index transfer for a conic bundle over a rank-one elliptic curve
field: mathematics
tier: prose
statement: "**Problem/Question 33 (Poonen).** Instead of counting points of bounded height on a variety, count points of bounded height in a Diophantine set. (I.e., counting points in a base the fibre above which has a rational point.) What rates of growth can you get? Example: conic bundle over an elliptic curve. Heuristically, it appears rate of growth can be \\(\\log\\log B\\), whereas for varieties it always turns out to be \\(cB^\\alpha(\\log B)^\\beta\\)."
