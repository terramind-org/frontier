title: Research Problems in Function Theory — Problem 3.20
field: mathematics
tier: prose
statement: Suppose that you have a continuous real function $u(x)$ on $\mathbb{R}^n$, and you want to know whether a homeomorphism $\phi:\mathbb{R}^n\to\mathbb{R}^n$ and a harmonic function $v$ on $\mathbb{R}^n$ exist, such that \[v(x)=u(\phi(x)).\] Is it necessary and sufficient that there should exist mappings $\mu_1, \mu_2, \ldots, \mu_n$ so that \[U=(u, \mu_1, \mu_2, \ldots, \mu_n)\] is a light open mapping of $\mathbb{R}^n$ into $\mathbb{R}^n$? The case $n=2$ is a result of Stoilow which is in , for example. (L. A. Rubel, communicated by D. A. Brannan)
