title: The Lyapin's Notebook — Problem 36
field: mathematics
tier: prose
statement: |-
  (S.G. Bershadsky, S.I. Kublanovsky)
  Is every periodic commutative semigroup embeddable into the power semigroup over a periodic Abelian group?

  This is true for all regular commutative semigroups and for some finite non-regular commutative semigroups (see [Bersh+Kubl]).
