  definitions:
    - name: OeisA230507.a
      kind: def
      text: |-
        /-- Number of ways to write $n = x + y + z$ with $x \le y \le z$, where $x, y, z$ are numbers $m$
        with $2m + 1$ and $2m^3 + 1$ both prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.Icc 1 (n / 3),
            ∑ y ∈ Finset.Icc x ((n - x) / 2),
              let z := n - x - y
              if (2 * x + 1).Prime ∧ (2 * x ^ 3 + 1).Prime ∧
                 (2 * y + 1).Prime ∧ (2 * y ^ 3 + 1).Prime ∧
                 (2 * z + 1).Prime ∧ (2 * z ^ 3 + 1).Prime
              then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/OEIS/230507.lean#L34
