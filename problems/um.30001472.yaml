id: um.30001472
title: Cusp Covering Conjecture for Hyperbolic Manifolds
field: mathematics
tier: prose
statement: Let $M$ be a finite-volume hyperbolic $n$-manifold. For each cusp $C$, does there exist a sublattice $\Lambda_C\subset\pi_1(C)$ such that, for every choice of sublattices $\Lambda'_C\subset\Lambda_C$, there is a finite cover $M'\to M$ whose cusps over $C$ are exactly the covers determined by $\Lambda'_C$?
