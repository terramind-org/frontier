  \section{Eigenvalue Counts for Low-Degree Random Regular Graphs}\label{30002894}
  {\small UnsolvedMath ID 30002894 · Probability}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For uniformly random $d$-regular graphs on $n$ vertices, improve the estimates for the number of adjacency eigenvalues in a specified interval in the low-degree regime $d\lesssim(\log n)^4$. The target is a quantitative eigenvalue-counting estimate in that regime.
  \par\smallskip\textit{Formulation references:} \sref{30002894}{1}, \sref{30002894}{2}.
  \subsection{Short English statement}
  For uniformly random $d$-regular graphs on $n$ vertices, improve the estimates for the number of adjacency eigenvalues in a specified interval in the low-degree regime $d\lesssim(\log n)^4$. The target is a quantitative eigenvalue-counting estimate in that regime.
