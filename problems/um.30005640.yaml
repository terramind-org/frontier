title: Tate-Shafarevich Finiteness for Tori over Function Fields
field: mathematics
tier: prose
statement: Let $K$ be the function field of a smooth curve $C$ over a number field $k$. For every $K$-torus, or more generally every group of multiplicative type, is the Tate–Shafarevich group $\operatorname{Sha}_C^1(T)$ finite?
