title: Lefschetz-Class Properties Under CM Reduction
field: mathematics
tier: prose
statement: Let $A$ be a CM-type abelian variety over $\overline{\mathbb Q}$, and let $A_0$ be a reduction of $A$. Does the property that all Hodge classes on all powers of $A$ are Lefschetz classes imply that all Tate classes on all powers of $A_0$ are Lefschetz classes? Is there a class of CM-type abelian varieties for which the converse implication holds?
