title: Equivariant Log-Concavity of Orlik–Solomon Algebras
field: mathematics
tier: prose
statement: Let $M$ be a matroid, let $W$ be a finite symmetry group of $M$, and regard its Orlik–Solomon algebra $OS^*(M)$ as a graded $W$-representation. For every $i$, does $OS^i(M)\otimes OS^i(M)$ contain $OS^{i-1}(M)\otimes OS^{i+1}(M)$ as a subrepresentation?
