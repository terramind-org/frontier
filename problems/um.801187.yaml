title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 14: Combinatorial symmetry and Schur-positivity of LLT ribbon polynomials"
field: mathematics
tier: prose
statement: |-
  For a skew shape $\lambda/\mu$ tileable by $k$-ribbons, let $H^{(k)}_\lambda(x;q) = \sum_T q^{s(T)} x^T$ be the Lascoux-Leclerc-Thibon (LLT) $k$-ribbon generating polynomial summed over $k$-ribbon tableaux $T$ of shape $\lambda$ with spin $s(T)$.

  (a) Give a combinatorial proof that the polynomials $H^{(k)}_\lambda(x;q)$ are symmetric functions.

  (b) When $H^{(k)}_\lambda(x;q)$ is expanded in terms of Schur functions, are the coefficients polynomials in $q$ with nonnegative integer coefficients?
