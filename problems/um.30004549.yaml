title: Generic Vanishing of Anti-Invariant Cohomology in Dimension Four
field: mathematics
tier: prose
statement: For a generic almost-complex structure $J$ on a compact $4$-manifold $M$, is the dimension $h_J^-$ of the space of closed $J$-anti-invariant $2$-forms zero? If $h_J^-\geq3$, must $J$ be integrable?
