statement: In event-triggered stochastic linear-quadratic control with an average communication budget $\bar m$, what are the optimal control policy $f^*$ and event-triggering policy $\gamma^*$ minimizing $\mathbb E[J_C]$ subject to $\mathbb E[J_E]\leq\bar m$?
