title: Question I — s it true that H 1(Γ) = 0 for any subgroup Γ of finite index in ModS?
field: mathematics
tier: prose
statement: s it true that H 1(Γ) = 0 for any subgroup Γ of finite index in ModS? It is well known that H 1(ModS) = 0. In his 1999 MSU Ph.D. thesis F. Taherkhani carried out some extensive computer calculation aiming at finding a subgroup of finite index with non-zero first cohomology group. For genus 2 he found several subgroups Γ with H 1(Γ)̸= 0, but in genus 3 all examined subgroups Γ turned out to have H 1(Γ) = 0. The higher genus cases apparently were well beyond the available at the time computer resources. See [ T ah]. J. D. McCarthy [ McC2] proved that if S is a closed surface of genus ≥ 3 and Γ is a subgroup of finite index in Mod S containing the Torelli subgroup, then the first cohomology group H 1(Γ) is trivial. His methods are based on D. Johnson results about the Torelli subgroup, the solution of the congruence subgroups problem for Sp2g(Z),g≥ 3, and the Kazhdan property (T) of Sp2g(Z), g≥ 3.
