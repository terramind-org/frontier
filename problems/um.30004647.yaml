title: Integrality of Rigid Irreducible Local Systems
field: mathematics
tier: prose
statement: Let $X$ be a connected smooth quasi-projective variety over $\mathbb C$ with a normal-crossing compactification. Is every rigid irreducible representation $\rho:\pi_1^{\mathrm{top}}(X,x)\to\operatorname{GL}_n(\mathbb C)$ with quasi-unipotent local monodromies conjugate to a representation in $\operatorname{GL}_n(\mathcal O_K)$ for the ring of integers $\mathcal O_K$ of some number field $K$?
