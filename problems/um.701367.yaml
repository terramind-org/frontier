title: Kourovka Notebook Problem 17.65
field: mathematics
tier: prose
statement: |-
  If Problem 17.64 has an affirmative answer,
  does it follow that, for some function $g(p)$, the number of
  isomorphism classes of $g(p)$-approximations to $J$ is

  a) countable?

  b) one?

  Note that if, for some $g(p)$, there are only finitely many
  isomorphism classes, then for some $h(p)$ there is only one.
