title: Syntax-sensitive reductions for the nonconstant predicate on K(t)
field: mathematics
tier: prose
statement: |-
  For a field \(K\), is the parameter-free existential theory of
  \[
  \mathcal M_K=(K(t);0,1,+,\cdot,T_K),\qquad
  T_K(f)\Longleftrightarrow f\notin K,
  \]
  undecidable?
