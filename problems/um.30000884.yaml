id: um.30000884
title: Torsion-Unit Conjugacy and Local Endomorphism Orders
field: mathematics
tier: prose
statement: Given a finite group $H$, does there exist a finite group $G\supset H$ such that every torsion unit in $V(\mathbb{Z}H)$ is conjugate to an element of $H$ by a unit of $\mathbb{Q}G$? Can the conjugating units be chosen in $\mathbb{Q}H$? For a finite group $G$, a prime $p$, a simple $\mathbb{Q}G$-module $X$, and a $\mathbb{Z}_{(p)}G$-lattice $L\subset X$, determine $E=\operatorname{End}_{\mathbb{Z}_{(p)}G}(L)$ and its local-order building blocks arising from the central primitive idempotents of $\mathbb{Q}G$. Which such local orders can occur?
