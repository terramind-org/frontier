title: Nontrivial Bergman space versus the plurisubharmonic Liouville property
field: mathematics
tier: prose
statement: |-
  Is there a pseudoconvex domain $\Omega$ with ${\rm dim}\,A^2(\Omega)\neq 0$ such that there is no bounded plurisubharmonic function $\phi$ on $\Omega$.

  **Recovered question.** Does there exist a connected pseudoconvex domain $\Omega\subset\mathbb C^n$ such that $A^2(\Omega)\neq\{0\}$ and every bounded plurisubharmonic function on $\Omega$ is constant?
