  \item[\hypertarget{source:8500003:2}{S2}] Andrej Dujella, Diophantine m-tuples, author-maintained survey (snapshot accessed 9 October 2026), Section 3.1, definition of U after the six-case construction. \url{https://raw.githubusercontent.com/dujella/dujella.github.io/master/dn.html}.
