title: Billiards and Quantitative Symplectic Geometry — Serge Tabachnikov — Problem 6
field: mathematics
tier: prose
statement: |-
  **Density of reflected wave fronts..** Consider a domain with smooth boundary in Euclidean space and let $P$ be a generic point in its interior. Let $P$ be a source of light, and consider the time $t$-front, that is, the locus of ``photons" emanating from $P$ in all directions, undergoing optical reflection off the boundary, and traveling for time $t$.

  Problem: *does this time $t$-front become dense in the limit $t \to \infty$?*

  This problem, and its analog for smooth Riemannian manifolds, is discussed in [KK]. Even the case of a round circle is open. The length growth of wave fronts is studied in [dV,dV2].
