lean:
  module: FormalConjectures.ErdosProblems.«770»
  decl: Erdos770.erdos_770.parts.iii
  statement: |-
    theorem erdos_770.parts.iii : ∀ ε > 0, ∀ᶠ n in atTop,
        let p := sSup {m : ℕ | m.Prime ∧ m - 1 ∣ n}
        p > (n : ℝ) ^ (ε : ℝ) → h n = p
