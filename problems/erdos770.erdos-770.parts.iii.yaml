lean:
  module: FormalConjectures.ErdosProblems.«770»
  decl: Erdos770.erdos_770.parts.iii
  statement: |-
    theorem erdos_770.parts.iii : ∀ ε > 0, ∀ᶠ n in atTop,
        let p := sSup {m : ℕ | m.Prime ∧ m - 1 ∣ n}
        p > (n : ℝ) ^ (ε : ℝ) → h n = p
  context:
    - open Erdos770
    - open Erdos770.erdos_770
    - open Erdos770.erdos_770.parts
    - open Set ENat Filter
  definitions:
    - name: Erdos770.h
      kind: def
      text: |-
        /-- Let $h n$ be the minimal number such that $2 ^ n - 1, \dots, h(n) ^ n - 1$
        are collectively coprime. -/
        noncomputable def h (n : ℕ) : ℕ∞ := sInf {m | 2 < m ∧
          ((Finset.Icc 2 m.toNat).image fun i => (i ^ n - 1)).gcd id = 1}
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/770.lean#L38
