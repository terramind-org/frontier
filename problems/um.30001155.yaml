title: Area-Refined Spectral Gap Bounds for Convex Domains
field: mathematics
tier: prose
statement: For a planar convex domain $K$ with diameter $d$, spectral gap $\gamma(K)=\lambda_2(K)-\lambda_1(K)$, area $A$, and $B_1$ the unit-area disk, is $$\gamma(K)\geq\frac{12\pi^2\gamma(B_1)}{3\pi^3d^2+[4\gamma(B_1)-3\pi^3]\sqrt{d^4-16A^2/\pi^2}}?$$ Is equality attained only by the disk, or asymptotically by domains converging to an infinite strip?
