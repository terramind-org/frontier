title: Research Problems in Function Theory — Problem 7.15
field: mathematics
tier: prose
statement: "Let $D$ be a domain in the extended complex plane. A finite point $z$ on the boundary $\\partial D$ of $D$ is called angular (relative to $D$) if there exists $\\varepsilon > 0$ such that every component domain of $D\\cap\\{|z - z_0| < \\varepsilon\\}$ which has $z_0$ as a boundary point, is contained in an angle less than $\\pi$ with vertex at $z_0$. Angularity at $\\infty$ is similarly defined. Let $A = A(D)$ be the set of angular points of $\\partial D$ relative to $D$. Obviously $A$ not empty implies that $\\partial D$ has positive capacity. The set $A(D)$ can have positive linear measure. E.g. let $C$ be a Cantor set on $|z|=1$ and let $D$ consist of the open unit disc from which have been deleted all points $rz$ with $z \\in C$ and $\\frac{1}{2}\\leq r < 1$. Then $A(D) = C$ which can, of course, have positive linear measure. Yet the following holds for arbitrary domains: $A(D)$ is either empty or its harmonic measure, relative to any point of $D$, is zero. This result follows easily from an unpublished theorem on Brownian paths $\\omega(t)$ in the complex plane. This says that almost all such paths have the property that for every real $t_0$ and every $\\varepsilon > 0$ the set of numbers $\\Big|\\frac{\\omega(t)-\\omega(t_0)}{\\omega(t)-\\omega(t_0)}\\Big|$ with $t_0<t<t_0+\\varepsilon$ fills at least an open arc of length $\\pi$ on the unit circle. This theorem is not easy and it would be desirable to give a direct proof of the above result on $A(D)$. Moreover, the Brownian paths approach will certainly not yield a similar result for the set $B_\\alpha(D)$ of $\\partial D$ whose points are defined by replacing the angles less than $\\pi$ with translates of $\\{x+iy : 0<x< |y |^\\alpha\\}$ for a given $\\alpha$ with $\\frac{1}{2}< \\alpha < 1$. (For $\\alpha=\\frac{1}{2}$ the result is false as can be seen by taking $D$ to be a disc.) Problem: For which $\\alpha\\in(\\frac{1}{2},1)$ is the harmonic measure of the set $B_\\alpha(D)$ always zero? (Of course we may assume that the capacity of $\\partial D$ is positive.) A much more difficult problem would be to characterise the monotone functions $f(y)$ having the property that the set obtained on replacing the angles by translates of $\\{x+iy : 0 < x < f(|y|)\\}$ has necessarily harmonic measure zero. Similar questions can be asked for Riemann surfaces and for $n$-dimensional space. (A. Dvoretzky)"
