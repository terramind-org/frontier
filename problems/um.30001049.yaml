title: Realizable Unstable Modules over the Steenrod Algebra
field: mathematics
tier: prose
statement: Let $\mathcal U$ be the category of unstable modules over the Steenrod algebra. For which objects $M$ does there exist a space $X$ with $H^*(X;\mathbb F_2)\cong M$ in $\mathcal U$? Equivalently, which objects of $\mathcal U$ are of the form $H^*(X;\mathbb F_2)$?
