title: Nonsingularity of Bernstein-Basis Collocation Matrices
field: mathematics
tier: prose
statement: |-
  Let $T$ be a triangle, let $D_{d,T}$ be the degree-$d$ domain points, and let $\Gamma\subseteq D_{d,T}$. Is the collocation matrix
  $$
  \bigl(B_\eta^d(\xi)\bigr)_{\xi,\eta\in\Gamma}
  $$
  always nonsingular?
