  module: FormalConjectures.Paper.RiemannZetaMoments
  decl: RiemannZetaMoments.moment_isEquivₖ
  statement: |-
    theorem moment_isEquivₖ (k : ℕ) : moment k ~[atTop]
        fun T ↦ (arithmeticFactor k * ∏ j ∈ Finset.range k, (j ! : ℝ) / (j + k) !) *
          T.log ^ (k ^ 2)
