title: Coercivity of Acoustic Boundary Integral Operators
field: mathematics
tier: prose
statement: |-
  Determine the conditions on the wavenumber, coupling parameter, obstacle geometry, and Lipschitz boundary under which the acoustic-scattering boundary integral operator

  $$A_{k,\eta}=I+K'-i\eta S$$

  is coercive.
