title: Cohomology targets and sectorwise Kirwan surjectivity
field: mathematics
tier: prose
statement: |-
  Question 10.3, the issue is not just one of sur-jectivity but also of the choice of the cohomology theory for the reduced space. I.e. should one take Chen-Ruan orbifold cohomology? Or that of Haefliger? One approach to addressing the question would be to look for a good (= optimal) condition on critical sets of the norm-square of the moment map.

  11 Localization formulas for non-compact groups
