statement: "- Construct congruence lattices which are norm$_1$ and norm$_1*$- isospectral in all dimensions (see ). - Are there families of $p$-isospectral lens spaces for all $p$, with more than two elements? - Give a procedure to go from $p$-isospectral lens spaces (for all $p$) of dimension $m$ to dimension $m + 1$. - Establish connections with toric geometry (see )."
