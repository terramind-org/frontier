lean:
  module: FormalConjectures.Wikipedia.SumOfThreeCubes
  decl: SumOfThreeCubes.isSumOfThreeCubes_iff_mod_9
  statement: |-
    theorem isSumOfThreeCubes_iff_mod_9 :
        ∀ n : ℤ, IsSumOfThreeCubes n ↔ ¬(n ≡ 4 [ZMOD 9] ∨ n ≡ 5 [ZMOD 9])
  context:
    - open SumOfThreeCubes
    - "variable {R : Type*} [Ring R]"
  definitions:
    - name: SumOfThreeCubes.IsSumOfThreeCubes
      kind: def
      text: |-
        /-- The predicate that `n : R` is a sum of three cubes. -/
        def IsSumOfThreeCubes (n : R) : Prop :=
          ∃ x y z : R, n = x^3 + y^3 + z^3
