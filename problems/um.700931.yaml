title: Kourovka Notebook Problem 13.13
field: mathematics
tier: prose
statement: |-
  Let $G$ and $H$ be finite $p
  $-groups
  with isomorphic Burnside rings. Is the nilpotency class of
  $H$ bounded by some function of the class of $G$? There is an
  example where $G$ is of class 2 and $H$ is of class 3.
