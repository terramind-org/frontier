lean:
  module: FormalConjectures.OEIS.«113010»
  decl: OeisA113010.conjecture
  statement: "theorem conjecture : ∃ n : ℕ, a n = n ∧ n ≠ 1 ∧ n ≠ 32"
  context:
    - open OeisA113010
    - open Nat
  definitions:
    - name: OeisA113010.a
      kind: def
      text: |-
        /--
        a n is the {Number of digits of n} raised to the power of {the sum of the digits of n}.
        -/
        def a (n : ℕ) : ℕ :=
          ((10).digits n).length ^ (List.sum ((10).digits n))
