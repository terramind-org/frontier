id: um.20000789
title: A fixed-degree moduli obstruction for plane-curve Jacobian quotients
field: mathematics
tier: prose
statement: |-
  Is every abelian variety the quotient of \(\operatorname{Jac}(C)\), where \(C\) is a smooth plane curve?

  Yes, if every surface \(S\) of general type is birational to \(S'\subseteq \mathbb P^3\), where \(S'\) has only isolated singularities.

  **Recovered complex statement.** Let \(A/\mathbb C\) be an abelian variety. Does there exist a nonsingular, geometrically integral plane curve
  \[
   C=V(F)\subset \mathbb P^2_{\mathbb C}
  \]
  and a surjective homomorphism of abelian varieties
  \[
   q:J(C)\longrightarrow A?
  \]
