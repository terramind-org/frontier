lean:
  module: FormalConjectures.ErdosProblems.«681»
  decl: Erdos681.erdos_681
  statement: |-
    theorem erdos_681 :
        ∀ᶠ n in .atTop, ∃ k > 0, (n + k).Composite ∧ ∀ p, IsLPF p (n + k) → p > k ^ 2
  context:
    - open Erdos681
  definitions:
    - name: Erdos681.IsLPF
      kind: def
      text: |-
        /-- `IsLPF p m` says that `p` is the least prime factor of `m`. -/
        def IsLPF (p m : ℕ) : Prop := p.Prime ∧ p ∣ m ∧ ∀ q, q.Prime ∧ q ∣ m → p ≤ q
