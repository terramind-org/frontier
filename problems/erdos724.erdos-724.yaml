lean:
  module: FormalConjectures.ErdosProblems.«724»
  decl: Erdos724.erdos_724
  statement: |-
    theorem erdos_724 :
        ∃ c > (0 : ℝ), ∀ᶠ n : ℕ in atTop, c * Real.sqrt (n : ℝ) ≤ (maxMOLS n : ℝ)
  context:
    - open Erdos724
    - open Filter Finset
  definitions:
    - name: Erdos724.maxMOLS
      kind: def
      text: |-
        /--
        `maxMOLS n` is $f(n)$, the maximum number of mutually orthogonal Latin squares of order $n$:
        the largest size of a set of Latin squares of order $n$ that are pairwise orthogonal. For
        $n \leq 1$ this gives $f(n) = 1$, while OEIS A001438 uses $\infty$.
        -/
        noncomputable def maxMOLS (n : ℕ) : ℕ :=
          sSup {k : ℕ | ∃ S : Finset (LatinSquare n), #S = k ∧
            (S : Set (LatinSquare n)).Pairwise IsOrthogonal}
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/724.lean#L53
