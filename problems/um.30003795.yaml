title: Good-Reduction Finiteness over Finitely Generated Fields
field: mathematics
tier: prose
statement: For every finitely generated field $K$ of good characteristic and every absolutely almost simple $K$-group $G$, is there a natural set $V$ of discrete valuations such that, for each finite $S\subset V$, only finitely many $K$-isomorphism classes of inner $K$-forms of $G$ have good reduction at every $v\in V\setminus S$?
