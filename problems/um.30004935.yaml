title: Stable Hyperbolicity of Closed Geodesics for Riemannian Metrics
field: mathematics
tier: prose
statement: For a closed manifold $M$, let $\mathcal R_{\mathrm{hyp}}(M)$ be the set of Riemannian metrics for which every closed geodesic is hyperbolic. Is the $C^2$ interior of $\mathcal R_{\mathrm{hyp}}(M)$ exactly the set of metrics whose geodesic flows are Anosov, in every dimension?
