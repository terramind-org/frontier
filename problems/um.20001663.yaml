title: Explicit Pólya bounds for thin non-tangential isosceles trapezoids
field: mathematics
tier: prose
statement: |-
  It asks about the scale-invariant Pólya functional
  \[
   F(\Omega)=\frac{\lambda _1(\Omega)T(\Omega)}{|\Omega|},
   \qquad
   T(\Omega)=\int_\Omega u_\Omega,
  \]
  where \(\lambda _1(\Omega)\) is the first Dirichlet eigenvalue and the torsion function is the weak solution of
  \[
   -\Delta u_\Omega=1\quad\hbox{in }\Omega,
   \qquad u_\Omega=0\quad\hbox{on }\partial\Omega. \]
  For bounded convex planar domains the conjectured sharp bounds are
  \[
   \boxed{\frac{\pi^2}{24}\leq F(\Omega)\leq\frac{\pi^2}{12}}. \tag{1}
  \]
  The lower endpoint is approached by triangles collapsing to an interval, and the upper endpoint by elongating rectangles.

  There are two transcription issues in the supplied record. First, its displayed boundary condition is `\nu=0`; direct inspection of the AIM page shows that the intended condition is \(u=0\). Second, the AIM heading says “\(L^1\) norm of first eigenfunction,” while the body concerns the integral of the torsion function, not an eigenfunction.
