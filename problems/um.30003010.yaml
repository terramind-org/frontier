title: Reconstruction from Directly Congruent Convex Projections
field: mathematics
tier: prose
statement: For $2\leq k\leq n-1$, if convex bodies $K,L\subseteq\mathbb{R}^n$ have directly congruent projections onto every $H\in G(n,k)$, with the congruences induced by elements of $SO(k,H)$, must K be a translate of $\pm L$?
