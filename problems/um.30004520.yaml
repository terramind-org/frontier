title: Stability of Longest Edge Simplex Refinement
field: mathematics
tier: prose
statement: Start with a sufficiently generic $d$-dimensional simplex, repeatedly bisect its longest edge and subdivide the simplex into two equal-volume simplices. Does the resulting subdivision stabilize after finitely many iterations for every starting simplex in every dimension, or can the simplices become arbitrarily badly shaped with inradius-to-circumradius ratio tending to $0$?
