title: Recurrence of High-Dimensional Scale-Free Percolation
field: mathematics
tier: prose
statement: Consider scale-free percolation on $\mathbb Z^d$ in a parameter regime with a unique infinite cluster, $\gamma>2$, and $\alpha>2d$. In dimensions $d\geq3$, is the simple random walk on the infinite cluster recurrent or transient? Resolve the analogous open regime for long-range percolation as well.
