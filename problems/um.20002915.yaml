title: Smooth convex-suspension approximation of irrational contact rotations
field: mathematics
tier: prose
statement: "**Recovered question.** Let \\(\\phi\\) be the time-one contactomorphism of an ergodic contact flow. For which \\(k\\) can \\(\\phi\\) be approximated in the \\(C^k\\) topology by contactomorphisms \\(\\phi_j\\) whose contact-Hamiltonian suspensions (mapping-torus hypersurfaces) are convex?"
