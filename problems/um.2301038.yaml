title: Research Problems in Function Theory — Problem 1.38
field: mathematics
tier: prose
statement: "[(a)] ; Let $f$ be non-constant and meromorphic in the open unit disc $\\mathbb{D}$, with $\\alpha<+\\infty$, and define $$ \\alpha = \\limsup_{r\\to1}\\frac{T(r, f)}{-\\log (1-r)}, $$ and \\[\\Psi=(f)^{m_0}(f')^{m_1}\\ldots(f^{(k)})^{m_k}.\\] It is known that $\\Psi$ assumes all finite values, except possibly zero, infinitely often, provided that $m_0\\geq3$ and $\\alpha>2/(m_0-2)$, (or $m_0\\geq2$ and \\mbox{$\\alpha>2/(m_0-1)$}, if $f$ is analytic). For which smaller values of $\\alpha$ does the same conclusion hold? ; Let $f$ be non-constant and meromorphic in $\\mathbb{D}$, with $\\alpha<+\\infty$ in ([source label: alphadef]); assume also that $f$ has only finitely many zeros and poles in $\\mathbb{D}$. Let $l$ be a positive integer, and write $\\Psi=\\sum^l_{\\nu=0}a_\\nu f^{(\\nu)}$, where the $a_\\nu$ are functions in $\\mathbb{D}$ for which $T(r,a_\\nu)=O(T(r,f))$ as $r\\to1$ (for each $\\nu$). It is known that if $\\Psi$ is non-constant, then $\\Psi$ assumes every finite value, except possibly zero, infinitely often, provided that $\\alpha>\\frac{1}{2}l(l+1)+1$. For which smaller values of $\\alpha$ does the same conclusion hold? (L. R. Sons)"
