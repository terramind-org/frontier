title: Questions in Geometric Group Theory — Q 3.2
field: mathematics
tier: prose
statement: |-
  **(Swarup)** For a torsion-free Fuchsian group $A$, let $\operatorname{area}(A)$ be the
  area of the convex core of $\mathbb{H}^2/A$. Since $\operatorname{area}(A)=2\pi(\operatorname{rk}(A)-1)$
  for free Fuchsian $A$, the Hanna Neumann Conjecture can be phrased as
  $2\pi\,\operatorname{area}(A\cap B)\le \operatorname{area}(A)\operatorname{area}(B)$
  for nontrivial free subgroups $A,B$ of a Fuchsian group. **Prove such inequalities
  (possibly with a worse constant) for (not necessarily free) torsion-free quasiconvex
  subgroups $A,B$ of a quasiconvex (convex cocompact) Kleinian group in $\mathbb{H}^n$,
  with area replaced by the $n$-dimensional volume of the convex core:**
  $$\operatorname{vol}_n(\operatorname{core}(A\cap B))\ \le\ C\cdot
  \operatorname{vol}_n(\operatorname{core}(A))\cdot\operatorname{vol}_n(\operatorname{core}(B)),$$
  with $C$ a universal constant (perhaps depending only on $n$).
