title: Finite, periodic, and spherical-code reductions for unequal-sphere average contacts
field: mathematics
tier: prose
statement: (G. Kuperberg - Schramm) How large can the average kissing number be for packing with spheres of varying radii? It is known that in $\mathbb{R}^3$ it is larger than $12$ and at most $24$. Is it true that it is strictly larger than the kissing number for dimension $4, 8,$ and $24$?
