title: Research Problems in Function Theory — Problem 7.31
field: mathematics
tier: prose
statement: Suppose that \[a_1>0,\hspace{1cm}0\leq a_n\leq n,\hspace{1cm} n\geq1,\hspace{1cm} b_n=\sum^n_{\nu=1}a_\nu,\hspace{1cm} c_n=\sum^n_{\nu=1}b_\nu.\] Then $\sum(a_n/c_n)^\alpha<\infty$ if $\alpha > \frac{1}{2}$. For what other functions $f(t)$ is it true that $\sum f(c_n/a_n)<\infty$? Is it true, for instance, that (under some smoothness condition on $f$) $\sum f(c_n/a_n)$ converges with $\sum f(n^2)$? The analogous result for $c_n/b_n$ was obtained by Borwein , that if $xf(x)$ is positive and non-increasing for $x\geq a>0$ and $\sum f(n)<\infty$, then $\sum f(c_n/b_n)<\infty$. (W. K. Hayman)
