lean:
  module: FormalConjectures.ErdosProblems.«774»
  decl: Erdos774.erdos_774
  statement: |-
    theorem erdos_774 : ∀ (A : Set ℕ), A.Infinite → A.IsProportionatelyDissociated →
        ∃ (T : Set (Set ℕ)), (∀ S ∈ T, S.IsDissociated) ∧ T.Finite ∧ A = ⋃₀ T
  context:
    - open Erdos774
    - open Finset
  definitions:
    - name: Set.IsDissociated
      kind: def
      text: |-
        /--
        We call $A\subset \mathbb{N}$ dissociated if $\sum_{n\in X}n\neq \sum_{m\in Y}m$
        for all finite $X,Y\subset A$ with $X\neq Y$.
        -/
        def Set.IsDissociated (A : Set ℕ) : Prop :=
          { S : Finset ℕ | (S : Set ℕ) ⊆ A }.InjOn fun S ↦ ∑ n ∈ S, n
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/774.lean#L30
    - name: Set.IsProportionatelyDissociated
      kind: def
      text: |-
        /-- We call $A$ proportionately dissociated if every finite $B\subset A$
        contains a dissociated set of size $\gg \lvert B\rvert$.

        In other words, there is a (global) $c > 0$ such that every finite $B \subset A$
        contains a dissociated set of size $\geq c|B|$. -/
        def Set.IsProportionatelyDissociated (A : Set ℕ) : Prop :=
          ∃ c > (0 : ℝ), ∀ (B : Finset ℕ), (B : Set ℕ) ⊆ A →
            ∃ S ⊆ B, #S ≥ c * #B ∧ (S : Set ℕ).IsDissociated
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/774.lean#L37
