title: Question (Smith) — Let αi, i = 1,...,n be a configuration of curves on a surface S of genus g with one boundary component δ such that ev…
field: mathematics
tier: prose
statement: Let αi, i = 1,...,n be a configuration of curves on a surface S of genus g with one boundary component δ such that every pair of curves intersect in 0 or 1 point and Tα1...T αn =Tδ. What is the maximal length n of such a product? Can it be arbitrarily long? In the case of genus 2 the curves are part of a D6 configuration (with repetitions). Since the Coxeter element for D6 gives a square of the boundary twist we probably cannot use the curve α′ 1 so we are left with A5 configuration. Here we have a simple algebraic question.
