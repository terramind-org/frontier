title: Affine rigidity and a mobility-two reduction on the Lorentz 3-sphere
field: mathematics
tier: prose
statement: |-
  Question 12.0.6. Can a 3-dimensional sphere admit two nonproportional projectively equivalent metrics of indefinite signature?

  The text beginning “Acknowledgements” immediately after the question is end matter, not part of the mathematical statement, and is excluded.

  In dimension three, an indefinite metric has Lorentz signature, either \((2,1)\) or \((1,2)\) according to convention. The natural literal reading is that both metrics are indefinite. Projective equivalence itself does not require equal signatures; indeed metrics in one projective class can have different signatures. In odd dimension, multiplying one metric by \(-1\) exchanges \((2,1)\) and \((1,2)\) without changing its Levi-Civita connection, so the ordering convention causes no substantive distinction here.
