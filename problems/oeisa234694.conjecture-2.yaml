id: oeisa234694.conjecture-2
title: Integers $0 < k < n$ with $p = k + \mathrm{prime}(n - k)$ and $\mathrm{prime}(p) - p + 1$ prime (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture (i): For any integer $n > 51$ there is a positive integer $k < n$ such that
  $p = k + \mathrm{prime}(n - k)$ and $\mathrm{prime}(p) + p + 1$ are both prime.
