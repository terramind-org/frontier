title: Several Complex Variables Problem List — Problem 59
field: mathematics
tier: prose
statement: |-
  If M is an n-dimensional parallellizable Stein manifold, can M
  be holomorphically immersed in $\mathbb{C}^n$?
  [ True for n=1 (Gunning and Narasimhan); also such an M can be immersed in
  $\mathbb{C}^{n+1}$ (Eliashberg-Gromov)].
  \\
  -R. Narasimhan, Dept. of Math., Univ. of Chicago, Chicago, IL 60637
