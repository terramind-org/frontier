title: Finite ramification, critical-height envelopes, and a tame-tower obstruction
field: mathematics
tier: prose
statement: |-
  Ramfication in pre-image towers

  Let \(X\) be a projective variety, \(f:X/K \to X/K\) PCF. Let \(\alpha \in X(K)\). Look at the tower of fields from adding the pull-backs of \(\alpha\)
  \[
  K_n=K(f^{-n}(\alpha)).
  \]

  There exists a finite set of primes \(S\) such that all \(K_n\) are unramified outside of \(S\).

  (Known for \(\mathbb P^1\)).

  1. If not PCF and \(X=\mathbb P^1\) let \(S_n=\{\text{primes of \(K\) where \(K_n/K\) is ramified}\}\). Is the growth rate of \(\#S_n\) related to some height of \(f\), specifically \(\hat h_{\mathrm{crit}}\)?
  2. Assume conjecture (\(X=\mathbb P^1\)). Can you arrange it so that all of the ramification in the tower is tame? (even for one example).
