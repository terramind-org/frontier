title: Borderline Soliton–Potential Interactions
field: mathematics
tier: prose
statement: Consider $$u_t+\bigl(u_{xx}-\lambda u+a(\varepsilon x)u^m\bigr)_x=0$$ on $\mathbb R_t\times\mathbb R_x$, where $m\in\{2,3,4\}$, $\varepsilon>0$, $0\leq\lambda<1$, and $a$ is smooth and positive with $a(-\infty)=1$ and $a(+\infty)=2$. For the soliton-like solution asymptotic to $Q(\cdot-(1-\lambda)t)$ as $t\to-\infty$, what is its long-time behavior at the threshold $\lambda=\widetilde\lambda$ separating refraction from reflection?
