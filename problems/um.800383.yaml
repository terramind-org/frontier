title: Open Problems in Arithmetic Dynamics — Conjecture 6
field: mathematics
tier: prose
statement: |-
  [Poonen, 2012, {[arxiv1206.7104, Question 3.2.]}]

  Let $K$ be a number field, let $X$ and $S$ be varieties defined
  over $K$, let $\pi:X\to S$ be a morphism, and let $f:X\to X$ be an
  $S$-morphism, which means that $\pi\circ f=\pi$. For each point $s\in
  S({\bar K})$, the map $f$ restricted to the fiber $X_s:=\pi^{-1}(s)$
  gives a morphism $f_s:X_s\to X_s$, and we view $f:X\to X$ as a family
  of maps parameterized by the points of $S$. Then for all $D\ge1$ we
  have
  \[
  \sup_{\substack{L/K\\ [L:K]=D\\}} \sup_{s\in S(L)}
  \#\operatorname{PrePer}\bigl(f_s,X_s(L)\bigr) < \infty.
  \]
