title: Kourovka Notebook Problem 15.46
field: mathematics
tier: prose
statement: |-
  Can the question 7.28 on conditions for
  admissibility of an elementary carpet ${\mathfrak{A}} = \{ {\mathfrak{A}}_r\mid
  r \in \Phi \}$
  be reduced to Lie rank 1 if $K$ is a field?
  A carpet ${\mathfrak{A}}$ of type $\Phi$
  of additive subgroups of $K$ is called *addmissible* if
  in the
  Chevalley group over $K$ associated with the root system
  $\Phi$ the subgroup
  $\left< x_r({\mathfrak{A}}_r)\mid r \in \Phi \right>$ intersects
  $x_r(K)$ in $x_r({\mathfrak{A}}_r)$. More precisely, is it true that
  the carpet ${\mathfrak{A}}$ is admissible if and only if the subcarpets
  $\{ {\mathfrak{A}}_r, {\mathfrak{A}}_{-r}
  \}$, $r \in \Phi$, of rank 1 are admissible? The answer is known to
  be affirmative if the field $K$ is locally finite
  (V. M. Levchuk, *Algebra and Logic*, **22**, no. 5 (1983),
  362--371).
