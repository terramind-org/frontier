lean:
  module: FormalConjectures.OEIS.«182126»
  decl: OeisA182126.conjecture3
  statement: |-
    theorem conjecture3 (n : ℕ) (hn : 0 < n) :
        (a n).Prime ↔ a n ∈ ([2, 7, 11, 13, 29] : List ℕ)
  context:
    - open OeisA182126
  definitions:
    - name: OeisA182126.a
      kind: def
      text: |-
        /-- $a(n) = \mathrm{prime}(n) \cdot \mathrm{prime}(n+1) \bmod \mathrm{prime}(n+2)$. -/
        noncomputable def a (n : ℕ) : ℕ :=
          if n = 0 then 0
          else (prime n * prime (n + 1)) % prime (n + 2)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/182126.lean#L37
