title: Lattice Gases and Antiferromagnetic Potts Models — Problem 4
field: physics
tier: prose
statement: |-
  Salas and Sokal [Salas_97] have some improvements of this result
  for specific regular lattices (square, triangular, hexagonal, Kagom\'e),
  based on decimation and a computer-assisted proof.
  But their results are far from sharp.

  Prove uniqueness of the infinite-volume Gibbs measure
  and exponential decay of correlations for
  $q=3$ on the hexagonal lattice,
  $q=4,5,6$ on the square lattice, etc.
