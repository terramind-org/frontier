title: Local R-equivalence and a geometric Brauer obstruction to eventual universal R-triviality
field: mathematics
tier: prose
statement: "**Question 10 (Colliot-Thélène).** Are there results at the level of number fields arising from the techniques of rationally connected varieties? For example, recently Kollár got nice results over local fields: if \\(X/k\\) is a projective variety, we say \\(P,Q\\in X(k)\\) are \\(R\\)-equivalent if one can link them by a chain of curves of genus zero over \\(k\\); if \\(X\\) is smooth with \\(k\\hookrightarrow\\mathbb C\\), then \\(X\\) is rationally connected if \\(X(\\mathbb C)/R\\) is a single point. Kollár proved that if \\(k\\) is a local field and \\(X/k\\) is rationally connected, then \\(X(k)/R\\) is finite. Kollár and Szabó proved that if \\(k\\) is a number field and \\(X/k\\) is rationally connected, then \\(X(k_v)/R\\) is trivial for almost all \\(v\\)."
