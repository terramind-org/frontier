title: Hyperbolic Minimal Geodesics and Measurable Rotation Models
field: mathematics
tier: prose
statement: Let $M$ be a compact manifold of hyperbolic type with a Riemannian metric $g$, and let $SM_{\min}^g$ consist of velocities of globally $g$-minimizing geodesics. Does $SM_{\min}^g$ contain a closed hyperbolic geodesic? Is there an ergodic hyperbolic invariant measure supported on $SM_{\min}^g$? Separately, if $f$ is an area-preserving diffeomorphism of a surface, can $f$ be measurably conjugated to a rotation of $S^1$ by a Diophantine angle $\beta$?
