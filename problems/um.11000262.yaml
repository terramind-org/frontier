title: Question 5 — Is there a homological definition of representations of the Birman-Wenzl- Murakami algebra?
field: mathematics
tier: prose
statement: Is there a homological definition of representations of the Birman-Wenzl- Murakami algebra? I believe the answer to this is yes. Furthermore, the homological construction suggests a new algebra Zn, which would further generalize the Iwahori-Hecke and Birman-Wenzl-Murakami algebras. I will conclude this paper with a definition of Zn and some related open questions. I hope these might be amenable to some combinatorial computations, even without the homological motivation, which is currently unclear and unpublished. We use the notation σi1...ik as shorthand for σi1...σ ik, and ¯ σi1...ik for σ−1 i1...ik. Define the following elements of RBn. X2 = q¯σ1 + 1−q−σ1 X3 = ( q2¯σ21−σ12)X2 X4 = ( q3¯σ321−σ123)X3... Xn = ( qn−1¯σ(n−1)...1−σ1...(n−1))Xn−1 Then Zn is the algebra RBn modulo the following relations. (q¯σ2 + 1−q−σ2)X2 = ( q¯σ21−σ12)X2, (q2¯σ32−σ23)X3 = ( q2¯σ321−σ123)X3, (q3¯σ432−σ234)X4 = ( q3¯σ4321−σ1234)X4,... (qn−1¯σn...2−σ2...n)Xn = ( qn−1¯σn...1−σ1...n)Xn. 316 S. Bigelow Note that Hn(1,−q) is the quotient of Zn by the relation X2 = 0. Also the Birman-Wenzl- Murakami algebra is the quotient of Zn by the relations X3 = 0 and σ1X2 =tX2. The following basically asks if Zn is bigger than the Birman-Wenzl-Murakami algebra.
