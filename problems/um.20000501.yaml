title: A quantitative defect criterion upgrading honeycomb energy asymptotics to empirical cell convergence
field: mathematics
tier: prose
statement: |-
  **Asymptotic partitioning problems.** In several problems where one wants to find an in some sense optimal partition of a planar domain $\Omega$ into $N$ subdomains it has been observed that as $N$ becomes large the partition converges to the hexagonal one.

  Find conditions for problems involving optimal $N$-partitions of a planar domain such that one observes in the limit $N\to\infty$ a packing of hexagons.
