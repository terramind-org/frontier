title: Entropy--SRB coincidence does not force smooth linearity
field: mathematics
tier: prose
statement: Let \(f:\mathbb T^2\to\mathbb T^2\) be a nonuniformly hyperbolic diffeomorphism. Let \(\mu\) be the unstable SRB measure, \(\nu\) the measure of maximal entropy, and \(m\) the measure of maximal dimension (make assumptions on \(f\) so that these exist and are unique). If \(\nu=\mu\) or \(m\), is \(f\) smoothly conjugate to a linear automorphism?
