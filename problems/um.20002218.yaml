title: A Schur-positive order-two case for affine elementary-symmetric Toeplitz matrices
field: mathematics
tier: prose
statement: |-
  There are many classical theorems about operations that preserve
  negative-real-rootedness of polynomials: for instance, \(d/dx+a\) or
  \(x\,d/dx+a\) with \(a\geq 0\); or Hadamard product; or Hadamard product
  with an extra \(n!\) (sometimes known as Schur composition); or Brändén's
  (2011) log-concavity operation. These can be reinterpreted as statements
  about *pointwise* total positivity for certain Toeplitz matrices involving
  elementary symmetric functions (e.g. \((n+a)e_n\)). Can these results be
  upgraded to total positivity in the *monomial* basis? Computational tests
  suggest that the answer is yes. But we have been unable, thus far, to come
  up with a plausible strategy for proving any of these conjectures.
