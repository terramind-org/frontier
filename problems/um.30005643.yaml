title: Malle Lower Bounds over Rational Function Fields
field: mathematics
tier: prose
statement: For a transitive group $G\leq S_m$, prove the conjectural lower bound in Malle's asymptotic for the number $N_{G,\mathbb F_q(t)}(X)$ of degree-$m$ extensions of $\mathbb F_q(t)$ with Galois group $G$ and discriminant norm at most $X$.
