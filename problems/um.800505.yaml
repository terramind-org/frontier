title: Linear Systems and Eigenvalue Problems — Problem 14
field: mathematics
tier: prose
statement: Explain the convergence acceleration of GMRES after the initial (transient) phase that is observed in some convection-diffusion model problems such as the one in [LieStr05]. In particular, explain whether or not the speed of convergence can be related to eigeninformation (i.e., eigenvalue location and eigenvector conditioning) of the discretized convection-diffusion operators.
