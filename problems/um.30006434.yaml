title: Gorenstein Hilbert Series for Reduced Subalgebra Zeta Functions
field: mathematics
tier: prose
statement: For every $d$-dimensional algebra $A$ in the subalgebra-zeta setting, construct a natural $\mathbb{N}_0$-graded Gorenstein algebra of dimension $d$ whose Hilbert series is the reduced subalgebra zeta function $Z_A^{\mathrm{red}}(T)$.
