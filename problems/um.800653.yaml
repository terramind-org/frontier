title: Selection Principles Milestone Problems — Problem 26 ([GN, p. 160])
field: mathematics
tier: prose
statement: |-
  The following problem is classical by now, but it is related to the
  problems which follow.
  For a sequence $\{X_n\}_{n\in\mathbb{N}}$ of subsets of $X$, define
  $\liminf X_n = \bigcup_m\bigcap_{n\ge m} X_n$.
  For a family $\mathcal{F}$ of subsets of $X$, $L(\mathcal{F})$ denotes
  its closure under the operation $\liminf$.
  The following definition appears
  in the celebrated paper [GN] just after that of the $\gamma$-property:
  $X$ is a *$\delta$-set* (or: has the *$\delta$-property*) if
  for each $\omega$-cover $\mathcal{U}$ of $X$, $X\in L(\mathcal{U})$.
  Observe that if $\{U_n\}_{n\in\mathbb{N}}$ is a $\gamma$-cover of $X$, then
  $X=\liminf U_n$. Thus, the $\gamma$-property implies the $\delta$-property.
  Surprisingly, the converse is still open.

  Is the $\delta$-property equivalent to the $\gamma$-property?
