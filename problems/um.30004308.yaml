title: Abelian Derived Racks and Their Structure Groups
field: mathematics
tier: prose
statement: For a left nondegenerate Yang–Baxter solution $(X,r)$ and its derived rack, what property of $(X,r)$ corresponds to the derived rack having an abelian structure group, and what property corresponds to the rack itself being abelian? Does splitting of the associated central extension, with an additional condition, characterize rack structure groups, and are there group-theoretic characterizations of them?
