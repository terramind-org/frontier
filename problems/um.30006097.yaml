title: Efficient Nonlinear Balanced-Truncation Model Reduction
field: mathematics
tier: prose
statement: Develop more efficient balanced reduced-order models for nonlinear systems and compare them systematically with other nonlinear model-reduction methods. Use scalable approximations of the associated Hamilton–Jacobi–Bellman equations to enable real-time output-feedback control. Determine whether iterative solvers and alternative basis functions can replace direct polynomial-coefficient solvers while reducing runtime and memory enough to reach substantially higher state-space dimensions.
