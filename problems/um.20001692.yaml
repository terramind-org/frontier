title: A seed dictionary and a rank-one compatibility test
field: mathematics
tier: prose
statement: |-
  Plabic graphs and weaves give seeds in cluster structures on braid varieties.

  Investigate: (1) cluster variables, (2) quivers, (3) positive parametrizations, (4) twist maps and Donaldson--Thomas transformations, and (5) the relationship between 3d-plabic graphs and weaves.
