title: Geometry and Spectral Theory of Generalized Radial-Part Algebras
field: mathematics
tier: prose
statement: Let $D\subset\mathbb C^n$ be a Cartan domain of rank $r$, let $G=\operatorname{Aut}(D)$, and form the continuous-parameter algebra $\mathcal R$ obtained from the $K$-radial parts of the $G$-invariant differential operators by allowing the dimension parameters to vary. Does $\mathcal R$ have a natural geometric realization? Is it commutative and normal with respect to the generalized radial measure? Does it admit sufficiently many joint eigenfunctions to define a Harish–Chandra transform, and are its elements canonical functions of a distinguished generating set?
