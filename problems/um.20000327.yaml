title: Quotient stacks, inertia obstructions, and polarized point blowups
field: mathematics
tier: prose
statement: |-
  Kollár's class of examples comes from the observation that the blowups of
  points on a smooth variety \(X\) are parameterized by \(X\) modulo the
  automorphisms of \(X\).

  **Problem 1.8.** More generally, is every stack which is a quotient of a
  quasi-projective scheme by a group action a moduli stack for some class of
  polarized manifolds?
