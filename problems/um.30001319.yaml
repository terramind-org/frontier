title: Monochromatic Arm Exponents in Critical Percolation
field: mathematics
tier: prose
statement: For two-dimensional critical percolation, do the probabilities of $j$ monochromatic arms to distance $n$ obey power laws $n^{-\alpha'_j+o(1)}$? If so, how are the monochromatic exponents $\alpha'_j$ related to the polychromatic arm exponents?
