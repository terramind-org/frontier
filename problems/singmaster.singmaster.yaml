id: singmaster.singmaster
title: Singmaster's conjecture
field: mathematics
tier: proof
statement: |-
  Singmaster's conjecture: the number of times any number $t > 1$ appears in
  Pascal's triangle is bounded.
ams:
  - 11
tags:
  - wikipedia
