  module: FormalConjectures.OEIS.«113257»
  decl: OeisA113257.conjecture2
  statement: |-
    theorem conjecture2 :
        conjecture2.answer = a (sInf {n : ℕ | 1 < n ∧ IsSquare (a n)})
  context:
    - open OeisA113257
  definitions:
    - name: OeisA113257.a
      kind: def
      text: |-
        /-- a n is the ascending descending base exponent transform of squares -/
        def a (n : ℕ) : ℕ :=
          ∑ i ∈ Finset.Icc 1 n, (i ^ 2) ^ ((n - i + 1) ^ 2)
