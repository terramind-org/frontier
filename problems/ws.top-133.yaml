statement: |-
  \section{The No-Three-in-Line Problem in a Square Grid}\label{statement}


  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Unless a section says otherwise, $\N=\{1,2,\ldots\}$,
  $\Z$ is the ring of integers, $\Q,\R,\C$ are the rational, real, and complex
  fields, $[N]=\{1,\ldots,\lfloor N\rfloor\}$, and $\log$ is the natural
  logarithm. For real functions of a parameter tending to infinity,
  $f\ll g$ and $f=O(g)$ mean $|f|\leq Cg$ eventually for some fixed $C$;
  $f\gg g$ reverses this comparison; $f=o(g)$ means $f/g\to0$;
  $f\sim g$ means $f/g\to1$; and $f\asymp g$ means both order bounds.
  A subscript on $O$ or $\ll$ specifies allowed constant dependence.
  The expression $n^{o(1)}$ in an upper bound means growth smaller than
  $n^\epsilon$ for each fixed $\epsilon>0$. Local definitions govern any
  exception, finite-field convention, or use of the same symbol for another
  object. An asymptotic claim is not automatically an effective algorithm.



  For $A\subseteq[N]^2\subset\R^2$, the condition is that no Euclidean straight line contains three distinct points of $A$. Let $g(N)$ be the maximum of $|A|$ over such sets. Every horizontal grid line contains at most two chosen points, so $g(N)\leq2N$. The highlighted question asks whether equality eventually becomes impossible. \sref{statement}{1} \sref{statement}{2}

  \paragraph{Statement recorded in the supplied source.}
  What is the largest subset of the grid $[N]^2$ with no three points on a line? In particular, for $N$ sufficiently large, is it impossible to have a set of size $2N$ with this property? \sref{statement}{1}

  \paragraph{Residual task reported by the archive.}

  The embedded review (2026-08-17) records: Prove eventual strict inequality D(N)<2N, construct 2N examples for infinitely many N, or narrow the general 3N/2 versus 2N gap. \sref{statement}{1}

  \subsection{Short English statement}

  What is the largest selection of grid points with no three collinear, and can the elementary upper bound of twice the side length persist indefinitely?

