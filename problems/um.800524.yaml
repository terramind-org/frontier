title: Linear Systems and Eigenvalue Problems — Problem 33 (Sketch-and-solve)
field: mathematics
tier: prose
statement: |-
  Let \(A \in \mathbb{R}^{n \times d}\) be a full-rank matrix, \(B\in\mathbb{R}^{n \times p}\) be a matrix, and let \(\Omega \in \mathbb{R}^{n \times k}\) be an oblivious subspace injection with dimension $d$ and injectivity \(1-\varepsilon\).
  Let \(\tilde X = (\Omega^\top A)^+(\Omega^\top B) \in \mathbb{R}^{d \times p}\) be the sketch-and-solve approximation to the ordinary least-squares solution $X = A^+B$.
  (Here, ${}^+$ denotes the Moore--Penrose pseudoinverse.)
  Prove or disprove: Does it necessarily hold that
  \[
  \|A \tilde X - B\|_\mathrm{F}
  \leq (1+\mathcal{O}(\varepsilon)) \min_{X \in \mathbb{R}^{d \times p}}\|AX - B\|_\mathrm{F}?
  \]
