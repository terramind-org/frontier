  \section{A batch-fidelity obstruction in hidden-shift attacks on unique-SVP}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are denoted by $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$; index ranges, computational models and specialized notation follow the cited problem source and the definitions below.


  For a lattice $\Lambda\subseteq\mathbb R^d$, the shortest-vector length is $\lambda_1(\Lambda)=\min_{0\ne v\in\Lambda}\|v\|$. An approximation algorithm seeks a nonzero vector of length at most a stated factor times $\lambda_1(\Lambda)$. Hidden-shift algorithms recover an unknown translation relating oracle functions.
  \paragraph{Statement recorded in the supplied source.}
  How fast are approximate SVP attacks via hidden shift algorithms? \sref{statement}{2}
  \paragraph{Scope qualification.}
  The catalogue flags this record as reconstructed and unverified. The supplied question is preserved; the definitions do not certify a unique intended model. The approximation factor, lattice encoding, norm, and reduction to a hidden-shift instance are not selected in the original question; no unique-SVP variant is substituted.
  The supplied catalogue marks this formulation as an unverified reconstruction; the source link does not establish that all missing assumptions were recovered.
  \paragraph{Source status.}
  The supplied catalogue labels this record partially solved. Its source-status metadata was checked against the supplied snapshot on 2026-10-11. This import does not independently establish current open status or mathematical correctness.
