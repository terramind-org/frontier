title: $q$-Whittaker Eigenfunctions of Lattice Quantum Toda Operators
field: mathematics
tier: prose
statement: For a semisimple simply connected group $G$, prove existence and uniqueness of the $q$-Whittaker polynomials $\Psi_{\check{\lambda}}(q,z)$ satisfying vanishing outside dominant weights, $\Psi_0=1$, and $M_f^{\mathrm{lat}}(\Psi(q,z))=f(z)\Psi(q,z)$ for every Weyl-invariant $f$.
