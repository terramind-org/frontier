title: Dihedral-Angle Gaps and Box-Graph Independence
field: mathematics
tier: prose
statement: Resolve the following two questions. (1) Determine the largest $\varepsilon_d$ for which infinitely many $d$-polytopes have every dihedral angle at most $\pi-\varepsilon_d$. (2) Does some $c>0$ guarantee an independent set of size at least $cn$ in every intersection graph of $n$ axis-parallel boxes in $\mathbb R^3$ with clique number $2$?
