title: Model categories 12 — In the appendix to my book on model categories, I said maybe what we are doing in associating to a mod…
field: mathematics
tier: prose
statement: In the appendix to my book on model categories, I said maybe what we are doing in associating to a model category its homotopy category is the wrong thing. Maybe we should be associating to a model category C the homotopy categories of all the diagram categories C^I, together with all the adjunctions induced by functors I --> J. This would make homotopy limits and colimits part of the structure. Does this viewpoint have any value?
