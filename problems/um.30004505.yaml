id: um.30004505
title: Short-Interval Möbius Orthogonality to Nilsequences
field: mathematics
tier: prose
statement: Let $G/\Gamma$ be a nilmanifold of degree $k\geq1$ and $H=H(X)\to\infty$. For every fixed Lipschitz map $F:G/\Gamma\to\mathbb{C}$, is it true that for almost all $x\in[X,2X]$, $\sup_{g\in\operatorname{Poly}(\mathbb{Z}\to G)}\left|\sum_{x\leq n\leq x+H}\mu(n)F(g(n)\Gamma)\right|=o(H)$?
