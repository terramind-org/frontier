id: um.30002053
title: Open Problems in Triangulation Theory
field: mathematics
tier: prose
statement: "Determine the following: (1) all facets of the secondary polytope of the $d$-cube; (2) whether a graph of triangulations can be disconnected in dimensions $3$ or $4$; (3) the complexity of counting triangulations and a method for uniformly random generation; (4) whether every smooth polytope has a regular unimodular triangulation; (5) whether every matroid polytope has a regular unimodular triangulation; (6) whether every $3$-polyhedron has a triangulation with Hamiltonian dual graph; and (7) optimal diameter bounds for graphs of triangulations."
