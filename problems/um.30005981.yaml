title: Scaling Constants for Discrete Energies on Metric Spaces
field: mathematics
tier: prose
statement: Characterize the compact metric spaces that admit a proper scaling constant $\sigma_p$ for graph approximations whose renormalized discrete $p$-energies converge to a meaningful continuum energy. Give further examples beyond the known $p$-conductively homogeneous spaces.
