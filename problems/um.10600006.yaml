title: Virtual-knot problem 6 — Welded Knots
field: mathematics
tier: prose
statement: |-
  Welded Knots: We would like to understand welded
  knots . It is well known
  that if we admit forbidden moves to the virtual link diagrams, each
  virtual knot can be transformed to the unknot. If we allow only one
  forbidden move (e.g. the upper one), then there are lots of
  different equivalence classes of knots. In fact the fundamental
  group and the quandle of the virtual diagram are invariant under the
  upper forbidden move. The resulting equivalence classes are called
  welded knots. Similarly, welded braids were studied
  in , and every welded knot is the closure of a welded
  braid. The question is to construct good invariants of welded knots
  and, if possible, to classify them. In a mapping is
  constructed from welded knots to ambient isotopy classes of
  embeddings of tori (ribbon tori to be exact) in four dimensional
  space, and it is proved that this mapping is an isomorphism from the
  combinatorial fundamental group (in fact the quandle) of the welded
  knot to the fundamental group of the complement of the corresponding
  torus embedding in four-space. Is this Satoh mapping faithful from
  equivalence classes of welded knots (links) to ambient isotopy
  classes of ribbon torus embeddings in four-space?

  Another interesting question is the following: If a welded knot has
  trivial fundamental group, does this imply that the knot is trivial
  as a welded knot?
