title: Hecke Eigensheaves for Discrete L-Parameters
field: mathematics
tier: prose
statement: For every discrete $L$-parameter $\phi$ of $G$, construct a perverse Hecke eigensheaf $F_\phi\in D_{\mathrm{lis}}(\operatorname{Bun}_G,\overline{\mathbb{Q}}_\ell)$ whose restriction to each basic stratum realizes the local Langlands packet of the corresponding inner form with the predicted multiplicities.
