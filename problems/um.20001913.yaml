title: A first-integral obstruction and finite Liouville-barrier dichotomy
field: mathematics
tier: prose
statement: |-
  **Question 8.4.2.** Assuming \(n=\dim M\geq 3\), do the metrics for which the
  geodesic flow is transitive form a dense subset of \(\mathcal G\)? Recall
  that a geodesic flow is transitive if there exists a geodesic \(\gamma\),
  with \(|\dot\gamma|=1\), such that the set of its tangent vectors is dense
  in \(SM\). If \(n=\dim M=2\), the answer is negative: if we take a metric
  with integrable geodesic flow such that certain Liouville tori are
  irrational, any small perturbation of the metric has nontransitive geodesic
  flow by KAM theory. This question is also closely related to the famous
  Arnold diffusion conjecture.
