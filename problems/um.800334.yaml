title: Enumeration of Matchings — Problem 5
field: mathematics
tier: prose
statement: |-
  Determine the cokernel of the Carlitz matrices,
  or equivalently of the Kasteleyn matrices of $a,b,c$ hexagons, and
  if possible find a way to interpret the cokernel in terms of
  the tilings.

  He points out that in the case $a=b=c=2$, one gets a non-cyclic group
  as the cokernel.
