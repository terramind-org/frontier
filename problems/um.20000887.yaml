title: Induced packing versus dynamic editing for C5
field: mathematics
tier: prose
statement: |-
  Let \(H\) be a fixed graph, \(G\) an \(n\)-vertex graph. If the minimum
  number of edges needed to add or remove from \(G\) in order to remove all
  induced copies of \(H\) is \(o(n^2)\), then the regularity lemma implies
  that the maximum number of induced copies of \(H\), with each pair
  intersecting in at most one vertex, is \(o(n^2)\).

  Can we get better bounds, even for the case \(H=C_5\)?
