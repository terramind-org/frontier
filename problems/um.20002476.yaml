title: Two-scale fate of minimax periodic orbits near an irrational cantorus
field: mathematics
tier: prose
statement: (Walter Craig) This question concerns the minimax Birkhoff orbits in an area-preserving twist map of an annulus. It is well known that (i) there exist at least two periodic orbits with a given rational rotation number \(\alpha=p/q\), namely a minimal orbit and a minimax orbit; (ii) as \(\alpha_j\to\omega\in\mathbb R\setminus\mathbb Q\), the minimal Birkhoff orbits converge to the Mather set \(\Pi_\omega\); and (iii) if \(\Pi_\omega\) is an invariant circle, the minimax orbits also converge to \(\Pi_\omega\). What is the fate of the minimax orbits when the Mather set is a Cantor set?
