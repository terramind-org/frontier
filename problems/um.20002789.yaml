title: Directionality in rank-one transfer
field: mathematics
tier: prose
statement: |-
  **(2)** Develop relative endoscopy in conjunction with the relative trace
  formula.  **(3)** Referring to MR3117742, understand transfer in the
  direction from \(\mathrm{GL}_2\) to an elliptic torus, as opposed to the
  torus-to-\(\mathrm{GL}_2\) direction.  **(4)** Explain the relation between
  intertwining operators and character relations, with Labesse--Langlands as
  the rank-one model.
