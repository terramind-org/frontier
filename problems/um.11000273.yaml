title: Question 2.5 — For n > 3, does Aut(Fn) have a subgroup of finite index with positive first betti number?
field: mathematics
tier: prose
statement: For n > 3, does Aut(Fn) have a subgroup of finite index with positive first betti number? Another finite-index subgroup of Aut( F3) mapping onto Z was constructed by Alex Lubotzky, and was explained to us by Andrew Casson. Regard F3 as the fundamental group of a graph R with one vertex. The single-edge loops provide a basis {a,b,c} for F3. Consider the 2-sheeted covering ˆR → R with fundamental group ⟨a,b,c 2,cac −1,cbc −1⟩ and let G ⊂ Aut(F3) be the stabilizer of this subgroup. G acts on H1( ˆR, Q) leaving invariant the eigenspaces of the involution that generates the Galois group of the covering. The eigenspace corresponding to the eigenvalue −1 is two dimensional with basis {a−cac−1, b−cbc−1}. The action of G with respect to this basis gives an epimorphism G→ GL(2, Z). Since GL(2, Z) has a free subgroup of finite-index, we obtain a subgroup of finite index in Aut( F3) that maps onto a non-abelian free group. One can imitate the essential features of this construction with various other finite-index subgroups of Fn, thus producing subgroups of finite index in Aut( Fn) that map onto GL( m, Z). In each case one finds that m≥n− 1.
