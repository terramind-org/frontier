  definitions:
    - name: MathOverflow434111.S
      kind: def
      text: |-
        /-- $S_n$ is the sum of the first `n` primes, i.e. $S_n=p_1+\dots+p_n$, $1$-indexed,
        matching the MathOverflow question. -/
        noncomputable def S (n : ℕ) : ℕ := ∑ k ∈ Finset.range n, nth Nat.Prime k
