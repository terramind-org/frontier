id: mathoverflow434111.restricted-prime-number-theorem.variants.even-subsequence
title: "Are prime numbers among sums of prime numbers distributed as $\\frac n{2\\ln(n)}$? (variant: even_subsequence)"
field: mathematics
tier: proof
statement: |-
  Meštrović's original formulation [Me18, Conjecture 3.3]: the sequence of sums of the
  first $2m$ primes satisfies the Restricted Prime Number Theorem, $\pi(m, (S_{2m})) \sim \frac{m}{\ln m}$.
