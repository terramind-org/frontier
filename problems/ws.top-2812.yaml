  \item[S2] K3: A New Problem List in Low-Dimensional Topology, Problem 3.14. Expanded formulation of the supplied catalogue statement.
  \url{https://math.berkeley.edu/sites/default/files/surv-295-ruberman-watermarked-author-pdf.pdf}.
