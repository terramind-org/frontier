lean:
  module: FormalConjectures.OEIS.«179524»
  decl: OeisA179524.conjecture5
  statement: |-
    theorem conjecture5 (p : ℕ) [hp : Fact p.Prime] (_hp2 : p ≠ 2) :
        (∑ k ∈ Finset.range p, ((20 * (k : ℤ) + 17) * a k)) ≡
          (p : ℤ) * (10 * legendreSym p (-1) + 7) [ZMOD (p : ℤ) ^ 2]
  context:
    - open OeisA179524
  definitions:
    - name: OeisA179524.a
      kind: def
      text: |-
        /-- The sequence $a(n) = \sum_{k=0}^n (-4)^k \binom{n}{k}^2 \binom{n-k}{k}^2$. -/
        def a (n : ℕ) : ℤ :=
          ∑ k ∈ Finset.range (n + 1), (-4 : ℤ) ^ k * (n.choose k : ℤ) ^ 2 * ((n - k).choose k : ℤ) ^ 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/OEIS/179524.lean#L35
