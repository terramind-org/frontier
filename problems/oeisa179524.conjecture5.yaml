id: oeisa179524.conjecture5
title: Central binomial sum $a(n) = \sum_{k=0}^n (-4)^k \binom{n}{k}^2 \binom{n-k}{k}^2$ (conjecture5)
field: mathematics
tier: proof
statement: |-
  $\sum_{k=0}^{p-1}(20k+17)a(k) \equiv p(10(-1/p)+7) \pmod{p^2}$ for any odd prime $p$.
  - _Zhi-Wei Sun_, Jul 01 2010
