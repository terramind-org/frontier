title: Existence of Noncircular Degenerate Herman Rings
field: mathematics
tier: prose
statement: Let $f$ be rational and let $\gamma$ be an analytic $f$-periodic Jordan curve on which an iterate acts with irrational rotation number, and suppose $\gamma$ is not in the closure of a Herman ring. Can $\gamma$ be a degenerate Herman ring that is not a circle?
