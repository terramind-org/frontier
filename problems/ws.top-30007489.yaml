statement: |-
  \section*{Polynomial state complementation of two-way NFAs}\label{30007489}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Is there a polynomial p independent of the finite alphabet such that every n-state two-way nondeterministic finite automaton has an equivalent complement-recognizing two-way NFA with at most p(n) states?
  \subsection{Short English statement}
  Is there a polynomial p independent of the finite alphabet such that every n-state two-way nondeterministic finite automaton has an equivalent complement-recognizing two-way NFA with at most p(n) states?
