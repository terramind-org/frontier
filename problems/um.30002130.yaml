title: Universal Rotation-Zero Words and Analytic Extremizers
field: mathematics
tier: prose
statement: Does there exist a nontrivial word $w$ in the rank-two free group such that the lifted rotation number of $\rho(w)$ is zero for every representation $\rho$ into the universal cover of $\operatorname{Homeo}^+(S^1)$? For arbitrary $w$, does there exist a real-analytic representation $\rho$ with $\operatorname{rot}(\rho(w))=R(w,r,s)$?
