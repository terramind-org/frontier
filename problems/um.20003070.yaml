title: Non-forgetful cyclic quotients and controlled finite-quotient families
field: mathematics
tier: prose
statement: When $S$ is a finite genus surface, there are forgetful homomorphisms from $\operatorname{PMap}(S)$ to the mapping class groups of finite-type surfaces. Those finite-type mapping class groups are residually finite, so there are many further quotients. What other finite quotients can we have for $\operatorname{Map}(S)$ and $\operatorname{PMap}(S)$?
