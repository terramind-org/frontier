id: um.30001105
title: Realizing Convex Building Subcomplexes by Destabilizing Loci
field: mathematics
tier: prose
statement: Given a convex contractible subcomplex $Y$ of a building $X$, can one find an action of $G$ on a variety $V$ and a point $v\in V$ such that $C_0(v)\subseteq Y$ and the stabilizer of $Y$ in $\operatorname{Aut}(X)$ stabilizes $C_0(v)$?
