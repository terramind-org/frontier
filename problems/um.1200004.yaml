statement: Let $\Gamma$ be a countable subgroup of $\operatorname{SL}_2(\mathbb{Q}_p)$ containing no parabolic elements, and let $\gamma$ be a random element of $\operatorname{SL}_2(\mathbb{Q}_p)$. Show that $\langle\Gamma,\gamma\rangle$ almost surely contains no parabolic elements.
