schema: 1
id: riemannzeta.simple-prop-lt
title: Simple zeros of the Riemann zeta function on the critical line (riemannZeta.simple_prop_lt)
field: mathematics
tier: proof
statement: |-
  Is the proportion of simple zeros of `ζ` on the critical line unconditionally larger than
  the Montgomery–Taylor bound `2 - c_MT⁻¹ = 0.6725…`? [Cl26, §7.2] puts the ceiling of its
  method at about `0.682`.
ams:
  - 11
tags:
  - paper
references:
  - label: pdf
    url: https://www-cdn.anthropic.com/95c246936988e43127bc6b2ceb7077c1dad2d68e.pdf
  - label: Lean formalisation
    url: https://github.com/anthropics/zeta-23-lean
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Riemann_hypothesis#Zeros_on_the_critical_line
source:
