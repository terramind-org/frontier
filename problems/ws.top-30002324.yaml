statement: |-
  \section{Worst-Case Inputs for Smoothed Caching Complexity}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are denoted by $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$; index ranges, computational models and specialized notation follow the cited problem source and the definitions below.


  A cache of capacity $k$ stores at most $k$ pages. A request absent from the cache causes a miss. Competitive ratio compares an online algorithm\textquotesingle s cost with an offline optimum, while smoothed analysis first perturbs the request sequence using a specified distribution.
  \paragraph{Statement recorded in the supplied source.}
  Characterize the input sequences that have the worst performance under the smoothed complexity of the caching problem, whose competitive-ratio complexity is of order $\log k$ for cache size $k$. \sref{statement}{2}
  \paragraph{Scope qualification.}
  The caching algorithm, perturbation distribution, and performance functional require the report.
  \paragraph{Source status.}
  The supplied catalogue labels this record open. Its source-status metadata was checked against the supplied snapshot on 2026-10-11. This import does not independently establish current open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Characterize caching sequences that remain worst under the source' s smoothed complexity model.
