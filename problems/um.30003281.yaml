title: Abundance of Zeros in Families of Quadratic Forms
field: mathematics
tier: prose
statement: |-
  Fix integral quadratic polynomials $Q_1,\ldots,Q_h$ in $t$ variables. For coefficient vectors $\mathbf x=(x_1,\ldots,x_h)$ with $\lvert x_i\rvert\leq B^\theta$, is it true for a positive proportion of $\mathbf x$ that

  $$\#\{\mathbf y\in\mathbb Z^t:\lvert y_j\rvert\leq B,\ \textstyle\sum_{i=1}^h x_iQ_i(\mathbf y)=0\}\gg B^{t-2-\theta}$$

  for some $(h-7)/(h-1)\leq\theta<1$?
