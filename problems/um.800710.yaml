title: Open Problems on Central Simple Algebras — Problem 20
field: mathematics
tier: prose
statement: |-
  Suppose $\sigma$ is an anisotropic orthogonal involution on a
  central simple algebra $A$ over a field $F$. Does $\sigma$ remain
  anisotropic after scalar extension to the function field $F_A$ of the
  Severi--Brauer variety of $A$?
