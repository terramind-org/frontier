title: Favard Length and Lipschitz Graph Structure
field: mathematics
tier: prose
statement: Let $E\subset[0,1]^2$ be $1$-Ahlfors regular and define $\operatorname{Fav}(E)=\int_{S^1}\mathcal H^1(\pi_\theta(E))\,d\theta$. If $\operatorname{Fav}(E)\geq C>0$, must there exist a Lipschitz graph $\Gamma$ such that $\operatorname{Lip}(\Gamma)\lesssim_C1$ and $\mathcal H^1(E\cap\Gamma)\gtrsim_C1$?
