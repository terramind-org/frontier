title: Parity and Ricci-Flow Evolution of Curvature Invariants
field: mathematics
tier: prose
statement: With $k_o$, $k_t$, and $k_S$ as the curvature-derivative, traceless-curvature, and Singer invariants of a homogeneous Riemannian manifold, is finite $k_o$ always even? If $k_t=1$, what can be deduced about the rough-Laplacian eigenvalue equation $\nabla^*\nabla R=\lambda R$? How do the defining traceless-curvature equation and the invariants $k_t$, $k_o$, and $k_S$ evolve under Ricci flow?
