title: Mixed Hodge Polynomials of Character Varieties
field: mathematics
tier: prose
statement: |-
  For a $k$-tuple of partitions $\mu$, let $\mathcal M_\mu$ be the corresponding generic $\operatorname{GL}_n(\mathbb C)$ character variety. Define $\mathbb H_\mu(z,w)$ by
  $$
  (z^2-1)(1-w^2)\operatorname{Log}\!\left(\sum_\lambda \mathcal H_\lambda(z,w)\prod_{i=1}^k\widetilde H_\lambda(x_i;z^2,w^2)\right)
  =\sum_\mu\mathbb H_\mu(z,w)m_\mu(x),
  $$
  where $\widetilde H_\lambda$ are Macdonald polynomials and
  $$
  \mathcal H_\lambda(z,w)=\prod_{s\in\lambda}
  \frac{(z^{2a(s)+1}-w^{2l(s)+1})^{2g}}
  {(z^{2a(s)+2}-w^{2l(s)})(z^{2a(s)}-w^{2l(s)+2})}.
  $$
  Are the functions $\mathbb H_\mu(z,w)$ polynomials that encode the mixed Hodge numbers of $\mathcal M_\mu$?
