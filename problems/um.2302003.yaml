title: Research Problems in Function Theory — Problem 2.3
field: mathematics
tier: prose
statement: If $\phi(z)$ is an entire function growing slowly compared with the function $f(z)$, we can consider $\phi(z)$ to be an asymptotic function of $f(z)$, if $f(z)-\phi(z)\to0$ as $z\to\infty$ along a path $\Gamma$. Is it true that an entire function of order $\rho$ can have almost $2\rho$ distinct asymptotic functions of order less than $\frac{1}{2}$? (If $\phi=\phi_1(z)-\phi_2(z)$ and the minimum modulus of $\phi$ tends to zero, then $\phi$ has lower order at least $\frac{1}{2}$ mean type (See Hayman ). A positive result in this direction is due to Denjoy , but only when the paths are straight lines. The result when the $\phi_\lambda(z)$ are polynomials is true (and is a trivial consequence of Ahlfors' theorem for asymptotic values ).
