title: Douady Conjecture on Polynomial Linearizability
field: mathematics
tier: prose
statement: For a polynomial with an irrationally indifferent fixed point at the origin and multiplier $e^{2\pi i\theta}$, when is the fixed point linearizable, and what is the conformal radius of its Siegel disk? Is the Brjuno condition necessary for linearizability of every polynomial of degree $d\geq3$?
