lean:
  module: FormalConjectures.OEIS.«217785»
  decl: OeisA217785.conjecture_1
  statement: |-
    theorem conjecture_1 (n : ℕ) (hn : 2 ≤ n) :
        {s : ℕ | 0 < s ∧ Nat.Prime (polyP n s)}.Infinite
  context:
    - open OeisA217785
  definitions:
    - name: OeisA217785.polyP
      kind: def
      text: |-
        /-- `polyP n s` is the sum $\sum_{k=0}^{n-1} (k+1) s^k$. -/
        def polyP (n s : ℕ) : ℕ :=
          ∑ k ∈ Finset.range n, (k + 1) * s ^ k
