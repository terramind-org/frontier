id: oeisa217785.conjecture-1
title: Smallest integer $s > n$ such that $1 + 2s + 3s^2 + \dots + n s^{n-1}$ is prime (conjecture_1)
field: mathematics
tier: proof
statement: |-
  Conjecture: For each $n \ge 2$, there are infinitely many primes of the form
  $1 + 2s + \dots + n s^{n-1}$ where $s$ is a positive integer.
