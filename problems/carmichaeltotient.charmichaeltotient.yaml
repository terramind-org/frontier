lean:
  module: FormalConjectures.Wikipedia.CarmichaelTotient
  decl: CarmichaelTotient.charmichaelTotient
  statement: |-
    theorem charmichaelTotient :
        ∀ ⦃n : ℕ⦄, 0 < n → CarmichaelTotientFor n
  context:
    - open CarmichaelTotient
    - open Nat
  definitions:
    - name: CarmichaelTotient.CarmichaelTotientFor
      kind: def
      text: |-
        /-- Natural number $n$ for which there exists a $m ≠ n$ with $φ(m) = φ(n)$ -/
        def CarmichaelTotientFor (n : ℕ) : Prop := ∃ m : ℕ, m ≠ n ∧ φ m = φ n
