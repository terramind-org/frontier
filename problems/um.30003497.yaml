title: Model-Theoretic Advantages of Logarithmic-Derivative Transforms
field: mathematics
tier: prose
statement: |-
  For an expansion of the real field by a real entire function $F$, what technical and model-theoretic advantages arise from studying

  $$G(z)=\left(z\frac{F'(z)}{F(z)}\right)'$$

  instead of $F$ itself?
