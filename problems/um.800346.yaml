id: um.800346
title: Enumeration of Matchings — Problem 17
field: mathematics
tier: prose
statement: |-
  Characterize those local substitutions that have
  a predictable effect on the weighted sum of matchings of a graph.

  The most useful local substitution so far has been
  \begin{verbatim}

  q q
  | C / \ D
  a u b / \
  / \ / \
  p---t v---r ----> p r
  \ / \ /
  d w c \ /
  | B \ / A
  s s
  \end{verbatim}
  (where unmarked edges have weight 1
  and where $A,B,C,D$ are obtained from $a,b,c,d$
  by dividing by $ac+bd$),
  but Rick Kenyon's substitution
  \begin{verbatim}
  3/2
  p---q p---q
  | | | | 1/2
  r---s ----> r---s
  | | 2 | |
  t---u t u
  \end{verbatim}
  has also been of use
  (where vertices $p,q,t,u$ may be attached elsewhere in the graph,
  but not the vertices $r,s$).
