title: Problem 11 — (Minimal sets).
field: mathematics
tier: prose
statement: (Minimal sets). Describe the minimal sets for the SL(2, R)-action on H1(α) and Q1(β). Since Veech surfaces give rise to minimal sets, this problem generalizes the problem of characterizing Veech surfaces. The problem below is particularly important for numerous applications. One application is to counting problems.
