  decl: Arxiv.«2607.08630».balister_gyori_schelp_conjecture
  statement: |-
    theorem balister_gyori_schelp_conjecture (s : ℕ) (hs : 2 ≤ s)
        (v : Fin (2 ^ (s - 1)) → 𝔽₂ s)
        (hv_nonzero : ∀ i, v i ≠ 0)
        (hv_sum : ∑ i, v i = 0) :
        ∃ e : Fin (2 ^ (s - 1)) × Fin 2 ≃ 𝔽₂ s,
          ∀ i, e (i, 0) + e (i, 1) = v i
