title: A base-visitation criterion for dense directed Thurston geodesics
field: mathematics
tier: prose
statement: |-
  **Problem 2.9.** Is there a dense Thurston geodesic in moduli space?

  Masur used closed Teichmüller geodesics to approximate a Teichmüller geodesic which is dense in moduli space.

  Does there exist a **directed** geodesic line \(\gamma:\mathbb R\to\mathcal T(S)\), meaning
  \(d_{\rm Th}(\gamma(s),\gamma(t))=t-s\) whenever \(s<t\), such that
  \(\pi(\gamma(\mathbb R))\) is topologically dense in \(\mathcal M(S)\)?
