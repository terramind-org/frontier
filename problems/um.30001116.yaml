statement: In disordered pinning or renewal models, with quenched critical point $h_c(\beta)$ and annealed critical point $h_c^{\mathrm a}(\beta)$, do they differ? Are the quenched and annealed critical exponents different, and how does the answer depend on the renewal-law tail exponent?
