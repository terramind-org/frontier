title: Simple Hyperplane Sections of Real Algebraic Varieties
field: mathematics
tier: prose
statement: For a finite set $Y\subset\mathbb{R}^d$, call a hyperplane $H$ simple if all but one point of $H\cap Y$ lie on a $(d-2)$-flat in $H$, and not too simple if $H\cap Y$ affinely spans $H$. Find suitable analogues of these notions for a $k$-dimensional real algebraic variety $X\subseteq\mathbb{R}^d$ spanning $\mathbb{R}^d$, and determine conditions on the degree of $X$, $k$, and $d$ that guarantee such a hyperplane section.
