  \section{An exact MLE fiber for the smallest binary hidden-variable model}\label{20001236}
  {\small\sffamily UnsolvedMath ID 20001236 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are denoted by $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$; index ranges, computational models and specialized notation follow the cited problem source and the definitions below.


  For a statistical model with parameter $\theta$ and observations $D$, the likelihood is $L(\theta;D)=\Pr_\theta(D)$, or the corresponding density. Maximum likelihood seeks a global maximum over the admissible parameter space. A graphical model specifies a family of joint distributions through a graph and its associated conditional-independence constraints. Hidden variables are summed or integrated out to obtain the joint distribution on observed variables. Algebraic methods encode critical-point equations and eliminate latent coordinates. The resulting solution sets must be distinguished from admissible real maximizers and from equivalent hidden-variable parameterizations.
  \paragraph{Statement recorded in the supplied source.}
  Question 59 (Ho¸ sten). What can algebra say about MLE's for models with hidden vari-ables? \sref{20001236}{2}
  \paragraph{Scope qualification.}
  The source asks a broad mathematical method question; it does not impose a graph class or assert a general closed formula.
  \paragraph{Source status.}
  The supplied catalogue labels this record partially solved. Its source-status metadata was checked against the supplied snapshot on 2026-10-11. This import does not independently establish current open status or mathematical correctness.
  \subsection{Short English statement}
  What can algebraic methods reveal about maximum-likelihood estimation in models with hidden variables?
