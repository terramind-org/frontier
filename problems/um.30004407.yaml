title: Universal Additive Vassiliev Invariants from Embedding Calculus
field: mathematics
tier: prose
statement: For every $n\geq1$, is the evaluation map $\pi_0\operatorname{ev}_n:K(I^3)\to\pi_0T_n(I,I^3)$ a universal additive Vassiliev invariant of type at most $n-1$ over $\mathbb Z$? Equivalently, is it surjective with kernel consisting exactly of knots that are $n$-equivalent to the unknot?
