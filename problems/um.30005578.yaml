id: um.30005578
title: Finite Generation of Fundamental Groups Under Nonnegative Ricci Curvature
field: mathematics
tier: prose
statement: Let $(M^n,g)$ be a smooth complete Riemannian manifold with $\operatorname{Ric}_g\geq0$. Must $\pi_1(M)$ be finitely generated when $n\in\{4,5,6\}$? In arbitrary dimension, must $\pi_1(M)$ be finitely generated if one additionally assumes, respectively, that $g$ is Ricci-flat, that $(M,g)$ is Kähler, or that the universal cover $(\widetilde M,\widetilde g)$ has Euclidean volume growth?
