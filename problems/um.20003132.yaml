statement: "**Problem 7.** Suppose $X$ is the non-collapsed Gromov--Hausdorff limit of \\((M_i^n,g_i)\\), where \\(|\\sec M_i|\\le1\\), and that along every geodesic on $M_i$ one hits a conjugate point before $t=\\pi+1/i$. Is $X$ rigid in any sense?"
