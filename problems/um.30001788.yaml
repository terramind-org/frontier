id: um.30001788
title: Approximation Conjectures for $L^2$-Torsion and Homology
field: mathematics
tier: prose
statement: Let $X$ be a finite connected CW complex with a $G$-cover $\widetilde X$, and let $(G_i)$ be normal finite-index subgroups of $G$ with trivial intersection. Do the normalized torsion invariants of $G_i\backslash\widetilde X$ converge to the corresponding $L^2$-torsion of $\widetilde X$? Establish the analogous approximation for analytic torsion of closed Riemannian manifolds and for integral homology torsion when all $L^2$-Betti numbers vanish. For an aspherical closed $d$-manifold, determine the limiting normalized Betti numbers and torsion growth, including the middle-dimensional cases governed by $d$ and $\chi(M)$.
