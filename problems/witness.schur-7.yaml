    note: 'Abstract: "we show that the Schur number S(7) >= 1696 and the multicolour Ramsey number R7(3) >= 1698". The previous record was 1680 (Fredricksen and Sweet, 2000).'
  format: 'A JSON object {"colors": [c_1, ..., c_N]}: c_i is an integer 0..6, the set containing the integer i. N is at most 5000 and is the value. No colour class may contain x, y and x + y (x = y allowed).'
