title: Weak-Perron entropy exponents and reachable-component edge growth
field: mathematics
tier: prose
statement: |-
  **Entropy**

  1. Let \(f(z)=z^2+c\), \(c\in\mathbb R\) and PCF with invariant
  \([a,b]\) with fixed point at one end. Which algebraic numbers arise as
  \(e^s\), where \(s\) is the entropy of \(f\)?
  2. More generally, for \(z^2+c\) on its Hubbard tree (or higher degree).
  3. Is there an algebraic analogue of entropy (like dynamical degree vs.
  arithmetic degree in higher dimensions)?
