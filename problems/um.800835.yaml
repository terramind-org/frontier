title: Geometric Hydrodynamics in Open Problems — Problem 34
field: mathematics
tier: prose
statement: |-
  Now, the next natural question concerns what happens with the energy that has escaped from the system?
  One can introduce the ``limit absorption principle'' for our system. Namely, one can introduce a friction for the balls
  of the family $F_N$ which absorbs the energy and then let $N$ go to infinity. But this solution is not completely legitimate
  as here the energy sink is included from the beginning and it is only moved farther and farther away.
  So, this explanation of the energy escape is circular.

  Is there a more natural way to introduce energy dissipation without explicit introduction of a friction mechanism?
