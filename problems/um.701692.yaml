statement: Let $f$ be an inner screen of a saturated formation $\mathfrak{F}$ and suppose that a finite group $A$ acts faithfully and $f$-hypercentrally on a finite group $G$. Is it true that $G\rtimes A\in \mathfrak{F}$ for all $G\in \mathfrak{F}$ if and only if $\mathfrak{F}$ is a Fitting class?
