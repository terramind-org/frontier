title: A representation-framed stable locus and a type B2 obstruction
field: mathematics
tier: prose
statement: |-
  The space \(\mathscr{X}^{\mathrm{big}}\) and category
  \(\operatorname{MF}(\mathscr{X}^{\mathrm{big}},w)\) makes sense not just in
  type A. What is the analog of
  \((\mathscr{X}^{\mathrm{big}})^{\mathrm{stable}}\) in other types? What is
  the categorical analog of the map
  \(\operatorname{Br}_{\mathrm{ext}}\to\operatorname{Br}_{\mathrm{fin}}\).

  Its exact text is:

  The preceding AIM record specifies
  \[
    \mathscr X^{\mathrm{big}}
    =\mathfrak g\times G\times\mathfrak n\times G\times\mathfrak n. \]
  This agrees with the “non-reduced” two-fold space
  \(\mathcal X_2=\mathfrak g\times(G\times\mathfrak n)^2\) in
  Oblomkov--Rozansky. We work over \(\mathbb C\), take \(G\) to be a
  connected reductive group, \(B\subset G\) a Borel subgroup, and
  \(\mathfrak n=\operatorname{Lie}R_u(B)\). Fixing a nondegenerate
  \(G\)-invariant bilinear form \(\kappa\) on \(\mathfrak g\), the potential
  is
  \[
   w(X,g_1,Y_1,g_2,Y_2)
   =\kappa\!\left(X,\operatorname{Ad}_{g_1}Y_1-
                         \operatorname{Ad}_{g_2}Y_2\right). \]
  No corruption of the source statement was found.  “Stable” is interpreted
  through the type A construction in arXiv:1702.03569, Section 2.6.
