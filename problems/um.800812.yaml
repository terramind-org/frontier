title: Geometric Hydrodynamics in Open Problems — Problem 11
field: mathematics
tier: prose
statement: |-
  Prove that for any two-dimensional compact analytic Riemannian manifold $M$ with analytic boundary
  the set $\mathscr{GM}(M)$ of generalized minimal flows is a nonempty and proper subset of
  the Yudovich space $YU(M)$.
