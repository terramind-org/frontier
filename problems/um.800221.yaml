title: Several Complex Variables Problem List — Problem 17
field: mathematics
tier: prose
statement: |-
  Let $f_1, ..., f_k$ be bounded holomorphic functions on $\Omega.$
  Suppose $\sum |f_i|> c> 0.$ The Corona problem is whether there exist
  bounded holomorphic funcions $g_1, ..., g_k$ on $\Omega$ such
  that $\sum f_i g_i \equiv 1.$ Can the Corona problem be solved if $\Omega$
  is the unit ball or the unit polydisc?
