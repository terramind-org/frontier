title: Endpoint robustness and a tower criterion for Julia Robinson attainment
field: mathematics
tier: prose
statement: |-
  **Question 33 (Videla).** Let
  \(K\subseteq\mathbb Q^{\mathrm{tot.real}}\subseteq\overline{\mathbb Q}\).
  Define
  \[
  A_K:=\{s\in\mathbb R_{>0}:\text{ there exist infinitely many }
  \alpha\in\mathcal O_K\text{ such that }\alpha\text{ and its conjugates are
  all in }[0,s]\}.
  \]
  Question of Julia Robinson: Is the infimum of \(A_K\) an element of
  \(A_K\)? If so, the first-order theory of \(\mathcal O_K\) is undecidable.
  For \(K=\mathbb Q^{\mathrm{tot.real}}\),
  \(\inf(A_K)=4\in A_K\).
