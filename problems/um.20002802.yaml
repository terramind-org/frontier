title: Base change for tame covering groups and a degree-normalization obstruction
field: mathematics
tier: prose
statement: |-
  **Base change.** Let $F$ be a $p$-adic field of characteristic zero,
  $G_F$ an unramified linear group (quasi-split over $F$ and split over a
  finite unramified extension $L/F$), and $\widetilde G_F$ a covering group
  of degree coprime to $p$. Given a genuine irreducible representation
  $\widetilde\pi$ of $\widetilde G_F$, describe
  $\operatorname{Lift}_{L/F}(\widetilde\pi)$, supposed to be a virtual
  representation of $\widetilde G_L$.
