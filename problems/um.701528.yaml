title: Kourovka Notebook Problem 18.99
field: mathematics
tier: prose
statement: |-
  Let $\mathrm{cd}(G)$ be the set of all complex irreducible character degrees of a finite group $G$. *Huppert's Conjecture:*
  if $H$ is a nonabelian simple group and $G$ is any finite group such that $\mathrm{cd}(G)=\mathrm{cd(H)}$, then $G\cong H\times A$, where $A$ is an abelian group.
