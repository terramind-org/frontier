  \section{\texorpdfstring{Scalar Curvature Question [?91]: Prove that there is a dimension-dependent constant $c_n$ such that every compact Riemannian $n$-manifold $X$ w}{Scalar Curvature Question [?91]: Prove that there is a dimension-dependent constant c\_n such that every compact Riemannian n-manifold X w}}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Prove that there is a dimension-dependent constant $c_n$ such that every compact Riemannian $n$-manifold $X$ with $\operatorname{Sc}(X)\geq-\sigma^2$ satisfies $\lVert X\rVert\leq c_n\sigma^n\operatorname{vol}(X)$, where $\lVert X\rVert$ is the simplicial volume.
  \par\smallskip\textit{Formulation references:} \sref{statement}{1}, \sref{statement}{2}.
  \subsection{Short English statement}
  Prove that there is a dimension-dependent constant $c_n$ such that every compact Riemannian $n$-manifold $X$ with $\operatorname{Sc}(X)\geq-\sigma^2$ satisfies $\lVert X\rVert\leq c_n\sigma^n\operatorname{vol}(X)$, where $\lVert X\rVert$ is the simplicial volume.
