title: Open Problems in Pluripotential Theory — Question 3
field: mathematics
tier: prose
statement: |-
  When $n=1$, maximal plurisubharmonic function are precisely harmonic ones, in particular they are smooth, but in higher dimension they may be quite irregular: a plurisubharmonic function that only depends on
  $n-1$ variables is maximal. When $\varphi \in DMA(\Omega)$ then
  $$
  \varphi \text{ is maximal } \Longleftrightarrow MA(\varphi)=0,
  $$
  as explained by Blocki in [Blo04]. In particular maximality is a local notion in $DMA(\Omega)$.

  [Blocki]
  Is maximality a local notion for arbitrary plurisubharmonic functions?
