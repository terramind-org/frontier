statement: |-
  \section*{Computation under rapidly vanishing force in one fixed spatial box}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each fixed positive computable viscosity, can every machine and input be effectively encoded into a smooth body force supported for all times in one fixed compact box of $R^3$, so that every mixed derivative decays faster than every inverse power of time, the zero-data Navier–Stokes solution has the same support and decay, is globally smooth and unique in the stated finite-interval energy class with zero pressure, and the material trajectory from the origin crosses $x_1<-1$ exactly on halting?
  \subsection{Short English statement}
  For each fixed positive computable viscosity, can every machine and input be effectively encoded into a smooth body force supported for all times in one fixed compact box of $R^3$, so that every mixed derivative decays faster than every inverse power of time, the zero-data Navier–Stokes solution has the same support and decay, is globally smooth and unique in the stated finite-interval energy class with zero pressure, and the material trajectory from the origin crosses $x_1<-1$ exactly on halting?
