id: um.30006411
title: Scalar-Curvature Smoothing at Critical-Codimension Singular Sets
field: mathematics
tier: prose
statement: For $n\geq 3$, does there exist an $L^\infty$ Riemannian metric on $\mathbb{R}^n$, uniformly bilipschitz to the Euclidean metric and smooth away from a singular set of finite $(n-2)$-dimensional Minkowski content, for which nonnegative-scalar-curvature smoothing fails? Does such a counterexample exist when that Minkowski content is zero, or does smoothing still hold?
