title: Open Problems on Central Simple Algebras — Problem 35
field: mathematics
tier: prose
statement: |-
  Show that if $F$ is a field which is finitely generated over a
  prime field or over an algebraically closed field, then any two
  quaternion division algebras having the same finite splitting fields (or even
  just the same maximal subfields) must be isomorphic.
