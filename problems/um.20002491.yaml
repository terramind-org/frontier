title: From formal graph and density expansions to Mather-measure error bounds
field: mathematics
tier: prose
statement: "**Problem 35 (Diogo Gomes).** For a small perturbation of a completely integrable Hamiltonian system a viscosity solution corresponding to a non-resonant unperturbed torus can be uniformly approximated by formal expansions. Similar expansions can be constructed for the density of the Mather measures. However, it is not known how well Mather measures themselves are approximated by these formal expansions."
