title: Existence and Uniqueness of Perfect T-Embeddings
field: mathematics
tier: prose
statement: Does every nondegenerate weighted bipartite graph $G$ with sphere topology and a marked face have an augmented dual $G^*$ admitting a perfect t-embedding, equivalently a p-embedding? Is it unique up to Lorentz isometries of $\mathbb R^{2+1}$ preserving the unit hyperboloid $\mathbb H$?
