title: Randomstrasse101 Open Problems (2024) — Conjecture 9 (K\'{o}mlos Conjecture)
field: mathematics
tier: prose
statement: |-
  When the condition of $\pm1$ entries is replaced by an $\ell_2$ condition on the columns, the corresponding question is the famous K\'{o}mlos Conjecture (which coincidentally is the first open problem in my lecture notes from around a decade ago [Afonso10L42P]).

  There exists a universal constant $K$ such that, for all square matrices $A$ whose columns have unit $\ell_2$ norm, $\mathrm{disc}(A) \leq K$.
