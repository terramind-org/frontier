title: Kourovka Notebook Problem 20.67
field: mathematics
tier: prose
statement: |-
  Suppose that $G$ is a finite group, $p$ is
  a prime, and $B$ is a Brauer $p$-block of $G$
  with defect group $D$. Let $\mathrm{cd}(B)$ be the
  set of degrees of the irreducible complex characters in $B$.

  a) Is it true that the derived length of $D$ is bounded by $|\mathrm{cd}(B)|$?

  b) (A. Jaikin-Zapirain). Is is even true that $|\mathrm{cd}(D)|\le |\mathrm{cd}(B)|$?
