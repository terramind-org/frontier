title: Equivalence of Explicit Affine Hypersurfaces
field: mathematics
tier: prose
statement: Let $H_0=Y$, $H_1=X$, and $H_{n+1}=(r^{a_n}+H_n^3)/H_{n-1}$ for $n\geq1$, where $r=X^3+XYZ-Y^3$ and $a_n=\deg H_n$. Let $U_n=V(H_n-1)$ and $V_n=V(XY-Z^{a_n}-1)\subset\mathbb{A}^3$. For $n\geq3$, does a holomorphic automorphism of $\mathbb{C}^3$ map $U_n$ onto $V_n$? What about a real diffeomorphism or homeomorphism?
