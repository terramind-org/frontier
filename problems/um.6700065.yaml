statement: 'Conjecture. Shrinking of Singularities. Let X be a compact orientable Riemanninn-manifold, f0 ∶X →Tn be a continuous map of non-zero degree, hi, i=0,1,2,..., be 1-dimensional homology classes in Tn which generate H1(Tn) and let εi →0 be positive numbers. Then the above (regularised for prudence) spaces Xi satisfy diam(X′ i)→0 for i→∞. 64 Moreover, theminimalhypersurfaces Yi ⊂X′ i becomenon-singular for suﬃciently largei and the manifoldsX′ i as well asXi admit λibi-Lipschitz homeomorphisms to ﬂatn-toriYi withλi→1 fori→∞. This conjecture implies that overtorical manifoldsX, (i.e. admitting maps toTn with non-zero degrees) withSc(X) ≥0 are, in fact, ﬂat, since the scalar curvature is semicontinuous under "Lipschitz limits". (The proof of this semicontinuity forC0-convergence given in [49] automatically extends to the Lipschitz convergence.) (The arguments used in in [86] and those in [115], for the proof of this "non-positivity"Sc(X) >/0 probably yield the proof of the above Conjecture as well.) 24 Scalar Curvature and Mean Curvature. One may think of positive scalar curvature asRiemannian internalisation of the concept ofmean convexity, where a Riemannian manifoldY with boundary, e.g. a smooth domainY in a larger Riemannian manifold, is calledmean convexif the boundary∂Y has positive mean curvature. This "internalisation": is motivated by the following. Doubling Lemma[52]. The naturalC0-Riemannian metricg0 on the double56 X =Y+∂Y of a manifold(Y,∂Y )withSc(Y ) ≥0 and withmean.curv(∂Y ) > 0 along the boundary can beC0-approximated by C2-metrics g with withSc(g) > 0, where, moreover, this approximation isC2 away from the "∂-edge"Z∂ ⊂X where the two copies of Y meet inX. This is achieved by (1) Smoothingg0 with Sc > 0 close toZ∂ by rescaling along the geodesics normal toZ∂ (a ﬁve line argument) + (2) redistribution of positivity ofSc on all ofX by aC2-small conformal deformation (another 5 lines). Also there is a similarity between the following "thin" spaces with mean.curv > 0 and withSc > 0. Thinmean> 0. Givenaclosedsubset Y inaRiemannian n-manifold X, deﬁnevol∂(Y ) as the inﬁmum of the(n−1)-volumes of the boundaries of arbitrarily small neighbourhoodsU ⊃Y of Y…'
