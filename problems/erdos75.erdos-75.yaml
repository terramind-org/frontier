lean:
  module: FormalConjectures.ErdosProblems.«75»
  decl: Erdos75.erdos_75
  statement: |-
    theorem erdos_75 :
        ∃ (V : Type) (G : SimpleGraph V),
          G.chromaticCardinal = ℵ_ 1 ∧
          #V = ℵ_ 1 ∧
          ∀ ε > (0 : ℝ),
            ∀ᶠ (n : ℕ) in Filter.atTop, ∀ (H : G.Subgraph),
                H.verts.ncard = n →
                ∃ (I : Finset V),
                  (I : Set V) ⊆ H.verts ∧
                  G.IsIndepSet (I : Set V) ∧
                  (I.card : ℝ) > (n : ℝ) ^ (1 - ε)
  context:
    - open Erdos75
    - open Cardinal
  definitions: []
