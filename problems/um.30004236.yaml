title: Spanning Rank of Lattice Polytopes
field: mathematics
tier: prose
statement: For a $d$-dimensional lattice polytope $P$ with $\operatorname{aff}(P\cap\mathbb Z^d)=\mathbb Z^d$, let $\operatorname{SR}(P)$ be the least cardinality of a subset $B\subseteq P\cap\mathbb Z^d$ satisfying $\operatorname{aff}(B)=\mathbb Z^d$, and let $\operatorname{SR}(d)=\max_P\operatorname{SR}(P)$. Determine $\operatorname{SR}(4)$ and the asymptotic growth of $\operatorname{SR}(d)$.
