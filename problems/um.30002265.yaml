title: Maximum Simplices in Euclidean Diameter Graphs
field: mathematics
tier: prose
statement: Fix $d\neq3$ and $n\geq d+1$, and let $D$ be the diameter graph of $n$ points in $\mathbb R^d$ whose maximum pairwise distance is $1$. Is the maximum possible number of $(d-1)$-dimensional simplices in $D$ equal to $n$?
