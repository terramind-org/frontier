statement: |-
  \section*{Finite torsion-class support for traces over l1 group algebras}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every discrete group G and idempotent $e\in M_q(\ell ^{1}(G))$, $q\geq 1$, is there a finite set F of finite-order conjugacy classes such that the diagonal coefficient sum of e over every conjugacy class outside F is zero?
  \subsection{Short English statement}
  For every discrete group G and idempotent $e\in M_q(\ell ^{1}(G))$, $q\geq 1$, is there a finite set F of finite-order conjugacy classes such that the diagonal coefficient sum of e over every conjugacy class outside F is zero?
