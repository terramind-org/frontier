title: Følner Sets from Variable-Free Terms
field: mathematics
tier: prose
statement: Let $\mathcal{T}$ be the variable-free terms generated by $1$ under a binary operation $\star$. Associate to each $T\in\mathcal{T}$ a strictly increasing nonidentity function $f_T:\mathbb{N}\to\mathbb{N}$ such that $f_S=f_T$ whenever $S$ and $T$ are related by $A\star(B\star C)=(A\star B)\star(A\star C)$, $\operatorname{crit}(f_{A\star B})=f_A(\operatorname{crit}(f_B))$, and the set of critical points is $\mathbb{N}$. Define $\phi(1)=0$, $\phi(A\star B)=\max\{\phi(A),f_A(\phi(B))\}$, and let $A_{n,p}$ consist of the right divisors of the $(p+1)$st right-associated power of $1$ for which $\phi(T)\leq n$. For every $\varepsilon>0$, is there $p_0$ such that, whenever $p>p_0$, the set $A_{n,p}$ is $\varepsilon$-Følner for all but finitely many $n$?
