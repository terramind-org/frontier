title: Ultraproduct II_1 Factors — Problem 27
field: mathematics
tier: prose
statement: Let $M= N_1*_B N_2$, and $u_i\in \mathcal{H}(N_i)$ such that $E_B(u_i^k)=0$ for all $k\in \mathbb{N}$. Suppose $v_i\in \mathcal{H}(M^\mathcal{U})$ such that $u_i\sim_{M^\mathcal{U}} v_i$ and $E_{B^\mathcal{U}}(v_i^k)=0$ for all $k \in \mathbb{N}$. Then is $v_1$ freely independent from $v_2$?
