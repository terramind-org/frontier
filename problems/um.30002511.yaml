title: Asymptotics Along Rays in Hitchin Components
field: mathematics
tier: prose
statement: Let $S$ be a closed oriented surface of genus at least $2$, let $(E,\varphi)$ be a stable $\operatorname{SL}(n,\mathbb C)$-Higgs bundle, and let $(E,t\varphi)$ determine flat connections $\nabla_t$, representations $\rho_t$, and parallel-transport matrices $T_{P,Q}(t)$. Determine the asymptotic behavior of $\rho_t$ and $T_{P,Q}(t)$ as $t\to\infty$, particularly along rays in the Hitchin component.
