title: Positive Discrepancy away from Multipartite Densities
field: mathematics
tier: prose
statement: For every $\varepsilon>0$, does there exist $a>0$ such that every $n$-vertex graph of density $p$ whose distance from every number $(i-1)/i$ is at least $\varepsilon$ satisfies $\operatorname{disc}^+(G)\geq a\sqrt{p(1-p)}\,n^{3/2}$?
