title: Weak-closure reduction for the maximal-rank counterexample problem
field: mathematics
tier: prose
statement: |-
  Find a counterexample to the maximal rank conjecture.

  **Conjecture (Maximal Rank Conjecture).** Let \(A\subseteq\mathbb C\) be the annulus
  \[
  A=\{1<|w|<e\mid w\in\mathbb C\}.
  \]
  Given an \(n\)-dimensional compact Kähler manifold \((M,\omega)\), and potentials
  \(\varphi _0,\varphi _1\), the geodesic on \(M\times A\) is obtained as the weak
  limit of solutions to
  \[
  \begin{cases}
  (\pi^*\omega+i\partial\bar\partial\Phi_\delta)^{n+1}
  =\delta(\pi^*\omega+i\,dw\wedge d\bar w)^{n+1},\\
  \Phi_\delta|_{M\times\{0\}}=\varphi _0,\\
  \Phi_\delta|_{M\times\{1\}}=\varphi _1.
  \end{cases}
  \]
  Then
  \[
  (\pi^*\omega+i\partial\bar\partial\Phi_\delta)|_{M\times\{\mathrm{pt.}\}}
  \geq \varepsilon\omega
  \]
  for some \(\varepsilon>0\) independent of \(\delta\).
