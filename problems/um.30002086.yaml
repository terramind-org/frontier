title: Gradient Lower Bounds for Shrinking Ricci Solitons
field: mathematics
tier: prose
statement: For a complete shrinking Ricci soliton $(M,g,f)$ with basepoint $p$ minimizing $f$, does there exist $C>0$ such that $|\nabla f|(x)\geq C^{-1}$ whenever $d(x,p)\geq C$?
