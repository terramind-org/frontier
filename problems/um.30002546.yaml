title: Combinatorial Interpretation of an $A_{2n}^{(2)}$ Rogers–Ramanujan Identity
field: mathematics
tier: prose
statement: |-
  For positive integers $m,n$, set $\kappa=2m+2n+1$. Find a combinatorial interpretation of the Hall–Littlewood identity

  $$\sum_{\lambda_1\leq m}q^{|\lambda|}P_{2\lambda}(1,q,q^2,\ldots;q^{2n-1})
  =\frac{(q^\kappa;q^\kappa)_\infty^n}{(q;q)_\infty^n}
  \prod_{i=1}^n\theta(q^{i+m};q^\kappa)
  \prod_{1\leq i<j\leq n}\theta(q^{j-i},q^{i+j-1};q^\kappa),$$

  where $P_{2\lambda}$ is a Hall–Littlewood polynomial, $(a;q)_\infty=\prod_{r\geq 0}(1-aq^r)$, and $\theta(a_1,\ldots,a_k;q)=\prod_{s=1}^k(a_s;q)_\infty(q/a_s;q)_\infty$.
