id: um.30001013
title: Tensor-Product Masas and the Extension Property
field: mathematics
tier: prose
statement: Let $C\subseteq B(H)$ be a maximal abelian self-adjoint algebra. Is $(C\otimes1)^c=C\otimes B(H)$ inside $B(H)\otimes_{\max}B(H)$? More generally, is $C_1\otimes C_2$ maximal abelian in $B(H)\otimes_{\max}B(H)$ for arbitrary maximal abelian self-adjoint algebras $C_1,C_2$? If $C\cong\ell^\infty(\mathbb{N})$, does $C$ have the extension property, and is $C\otimes C$ maximal abelian in $B(H)\otimes_{\max}B(H)$?
