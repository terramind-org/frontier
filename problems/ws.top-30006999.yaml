statement: |-
  \section*{Integral K5 injectivity for regular local domains}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every Noetherian regular local domain A with fraction field F, is the canonical map on integral algebraic K-groups $K_{5}(A)\to K_{5}(F)$ injective, including ramified mixed characteristic?
  \subsection{Short English statement}
  For every Noetherian regular local domain A with fraction field F, is the canonical map on integral algebraic K-groups $K_{5}(A)\to K_{5}(F)$ injective, including ramified mixed characteristic?
