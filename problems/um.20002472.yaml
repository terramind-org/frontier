title: A full-support certificate for excluding Denjoy dynamics on invariant twist-map curves
field: mathematics
tier: prose
statement: |-
  Does there exist a \(C^3\) twist map
  \[
  f:\mathbb T\times\mathbb R\longrightarrow\mathbb T\times\mathbb R
  \]
  with an invariant essential curve \(\Gamma\), having irrational rotation number, such that \(f|_\Gamma\) is not topologically conjugate to the corresponding rigid rotation?
