title: Generalized and Standard Almost-Nonnegative Curvature
field: mathematics
tier: prose
statement: Does every closed smooth manifold that is almost nonnegatively curved in the generalized sense also admit almost nonnegative curvature in the standard, strict $k=0$ sense? In the generalized sense, the defining collapsing sequence is allowed on $M\times\mathbb{R}^k$ for some $k\geq0$.
