title: Kourovka Notebook Problem 20.80
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finite group, and $\chi$ an irreducible complex
  character of $G$. We call $\chi$ a $\mathcal{P}$-character if
  $\chi$ is a constituent of $(1_H)^G$ for some maximal subgroup $H$
  of $G$; and $\chi$ is said to be monomial if $\chi$ is induced by a
  linear character of a subgroup of $G$.

  *Conjecture*: $G$ is solvable
  if and only if all its $\mathcal{P}$-characters are monomial.

  The necessity part of the conjecture is true (G. Qian, Y. Yang,
  *Commun. Algebra*, **46**, no. 1 (2018), 167--175).
