statement: For functions defined on non-open subsets $X\subseteq\mathbb R^d$, when do the arc-generated smoothness classes $A^\infty(X)$ and $A^M(X)$ coincide with the corresponding Whitney-type classes $C^\infty(X)$ and $C^M(X)$?
