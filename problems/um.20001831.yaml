title: Mean-convex tubes and curvature-driven centerline drift
field: mathematics
tier: prose
statement: Recall that the mean curvature flow of a “thin” torus of revolution in $\mathbb R^3$ goes singular everywhere simultaneously as it converges to a round circle. Under what conditions on a smooth embedded closed curve $\gamma\subset\mathbb R^3$ does there exist a toroidal mean convex mean curvature flow $M_t$ that Hausdorff converges to $\gamma$ at the blow-up time?
