title: A sharp uniqueness threshold and conductor-preserving flag criterion
field: mathematics
tier: prose
statement: |-
  The primary AIM PDF confirms that the broken expression is \(H_C\), not a
  product or a new invariant. It means an irreducible component of the
  Hilbert scheme of curves in \(\mathbb P^3\), with the Hilbert polynomial of
  \(C\), containing the point \([C]\).

  The phrase “double curve, and triple points, pinch point, ...” is the
  classical description of a surface with **ordinary singularities**. The
  intended characteristic-zero local models are: two transverse smooth
  surface branches along the general point of a reduced curve \(D\), ordinary
  triple points analytically modeled by \(xyz=0\), and finitely many pinch
  points modeled by \(x^2-y^2z=0\). This interpretation agrees with the later
  formulation used by Hartshorne--Polini and Zhang.

  Two qualifications are logically necessary.

  1. If \([C]\) lies on several Hilbert components, “the component” is not
     defined.  The conjecture must be read componentwise, or with the added
     hypothesis that \([C]\) is a smooth point of the Hilbert scheme (and hence
     lies on a unique component).
  2. The degree of the double curve is not invariant in an arbitrary
     deformation of hypersurfaces: a ruled cubic with a double line can deform
     to a smooth cubic.  Thus the conclusion concerns a conductor-preserving
     stratum, not the whole projective space of degree-\(d\) equations.

  Throughout the new result below, \(k\) is algebraically closed of
  characteristic zero, a curve is pure of dimension one, and \(C\) is smooth. The elementary degree estimates themselves are valid over any algebraically
  closed field.
