title: Trapdoor-free security from multiple nearby RSA moduli
field: mathematics
tier: prose
statement: For nearby moduli $n_i=n_1+d_i$ and maps $f_i(r)=r^{e_i}\bmod n_i$, prove the conjecture that with sufficiently many components at least one $f_i$ is not polynomial-time invertible, thereby validating the proposed trapdoor-free RSA-like probabilistic function.
