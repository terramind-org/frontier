title: Gowers Inverse Theorems for Oscillatory Integral Decay
field: mathematics
tier: prose
statement: For a multilinear oscillatory integral with nondegenerate polynomial phase, repeated Cauchy–Schwarz estimates can bound the integral by a high-order Gowers norm of one input. If the expected decay does not follow directly, the Green–Tao–Ziegler inverse theorem supplies algebraic structure for that input. Does this structural information suffice to prove power decay of the oscillatory integral?
