title: Open Problems in Arithmetic Dynamics — Question 19
field: mathematics
tier: prose
statement: |-
  Find a ``nice'' function $C(N,d,D,s)$ so that every degree $d$
  morphism $f:\mathbb{P}^N\to\mathbb{P}^N$ defined over a field $K$ of degree at
  most $D$ and having at most $s$ primes of bad reduction satisfies
  \[
  \#\operatorname{PrePer}\bigl(f,\mathbb{P}^N(K)\bigr) \le C(N,d,D,s).
  \]
