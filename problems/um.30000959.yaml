title: Quantum Knot Invariants and Boundary Character Varieties
field: mathematics
tier: prose
statement: For every complex reductive group $G$, do the quantum $G$-invariants of a knot $K\subset S^3$ determine the image of $X_G(\pi_1(S^3\setminus K))$ in the $G$-character variety of the boundary torus? Equivalently, do knots with the same $G$-quantum invariants have the same image?
