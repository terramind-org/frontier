title: Bøgvad's Normal-Koszul Conjecture
field: mathematics
tier: prose
statement: If $X$ is a smooth projective toric variety with ample line bundle $L$, is the section ring $R(X,L)$ normal and Koszul? More broadly, under what hypotheses on a polarized toric variety is its section ring normal or Koszul?
