title: Mahler's Symmetric Convex-Body Conjecture
field: mathematics
tier: prose
statement: For every centrally symmetric convex body $K\subset\mathbb{R}^n$, one should have $|K||K^*|\geq|B_1^n||B_\infty^n|=4^n/n!$, where $K^*$ is the polar body.
