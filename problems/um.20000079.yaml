title: A sharp two-strand full-twist threshold for HHH-parity
field: mathematics
tier: prose
statement: |-
  Call a braid \(\beta\) parity if \(\operatorname{HHH}(\beta)\) is parity. Find necessary and/or sufficient conditions for a braid to be parity.

  Are there operations on braids (for example, adding a positive number of full twists) which transform it into a parity braid or which preserve parity braids?
