statement: |-
  \section*{Parity constrained strongly connected orientations}\label{statement}

  \subsection{Definitions and mathematical statement}
  Let $G=(V,E)$ be a finite loopless undirected graph and $k\ge1$.
  For an orientation $D$, write $d_D^-(v)$ for the number of edges
  directed into $v$, and $\rho_D(X)$ for the number of arcs entering
  a vertex set $X$ from its complement. The orientation is
  $k$-arc-connected when
  \[
                              \rho_D(X)\ge k
                                    \quad(\varnothing\ne X\subsetneq V).
  \]
  For $k=1$ this is strong connectivity.

  Characterize the graphs admitting an orientation that satisfies this
  cut condition and simultaneously has
  \[
                             d_D^-(v)\equiv1\pmod2
                                            \quad(v\in V).
  \]
  Seek a useful necessary-and-sufficient criterion in the undirected
  graph and an effective construction for feasible inputs, including
  the strong-connectivity case and the higher-connectivity extension.

  Necessary conditions include $2k$-edge-connectivity and
  $|E|\equiv |V|\pmod2$, since the sum of all indegrees is $|E|$.
  These elementary conditions are not asserted to be sufficient.
  The parity prescription applies to every vertex, while connectivity
  is global across every nontrivial cut. An orientation that is merely
  reachable from one root need not meet this requirement. Likewise,
  constructing an odd-indegree orientation and a strongly connected
  orientation separately does not ensure a single orientation meeting
  both demands.
  \subsection{Short English statement}
  Characterize when a graph can be oriented with odd indegree at
  every vertex while remaining strongly, or $k$-arc, connected.
