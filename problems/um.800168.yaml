title: Moments of L-functions — Moments of the Riemann zeta function — Problem 18
field: mathematics
tier: prose
statement: |-
  Good showed that given a Hecke--Maass cusp form of level 1 and fixed spectral parameter $t_f$, we have that
  \[\int_{0}^{T} \left|L\left(\frac{1}{2}+it,f\right)\right|^2 dt = T P_1(\log T) + O_{t_f,\varepsilon}(T^{2/3 + \varepsilon}),\]
  where $P_1(x)$ denotes some polynomial of degree 1 in x. Crucially, the dependence on $t_f$ in the error term is not made explicit. Can one make this dependence explicit? In particular, does this error term not depend
  on $t_f$ if, say, $T \geq t_f^{3/2 + \delta}$ for some $\delta > 0$? How about for holomorphic Hecke eigenforms of weight $k_f$?\\
  (Peter Humphries, Virginia)
