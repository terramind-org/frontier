statement: (J.S. Carter) Compute H Q i (Sm n ) of Sm n which denotes the quandle of the nth symmetric group with the binary operation given by x∗ y = y−mxym. 5.4 Quandle cocycle invariant The quandle cocycle invariant, introduced in [79, 80], is de fined as follows. For α∈ H 2(X; A) we choose a 2-cocycle φ representing α. Any representation of a knot quandle Q(K) to X is presented by a coloring of a knot diagram of K, where a coloring of an oriented knot diagram is a map of the set of over-arcs of it to X satisfying the condition depicted in the pictures of (35) at each crossing of the knot diagram. We define the weight of a crossing of a colo red diagram by W ( x x∗y y ) = φ(x, y)∈ A, W ( y x x∗y) = φ(x, y)−1∈ A, (35) where we write A multiplicatively here. The quandle cocycle invariant of a knot K is defined by Φ α(K) = ∑ C ∏ τ W (τ,C)∈ Z[A], where the sum runs over all coloring C of a diagram of K, and the product runs over all crossing τ of the diagram, and Z[A] denotes the group ring of A. Φ α(K) only depends on K and α.
