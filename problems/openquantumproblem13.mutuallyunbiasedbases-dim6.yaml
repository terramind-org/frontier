  definitions:
    - name: OpenQuantumProblem13.IsMaxMUBCount
      kind: def
      text: |-
        /-- $k$ is the maximal size of a family of mutually unbiased bases in dimension $d$. -/
        def IsMaxMUBCount (d k : ℕ) : Prop :=
          HasMUBs d k ∧ ∀ m : ℕ, HasMUBs d m → m ≤ k
