statement: |-
  \section{Newman's Conjecture}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For $n\geq1$, let $p(n)$ be the number of integer partitions of $n$, that is, the number of finite nonincreasing sequences of positive integers with sum $n$. Set $p(0)=1$. For integers $m\geq1$ and $a$, a unit residue means $\gcd(a,m)=1$.
  \paragraph{Statement recorded in the supplied source.}
  For every integer $m\geq1$ and every integer $a$ with $\gcd(a,m)=1$, is the set
  \[
  \{n\in\mathbb N:p(n)\equiv a\pmod m\}
  \]
  infinite? \sref{statement}{2}
  The usual Newman conjecture asks the same question for every residue $a$, including nonunits. The recorded unit-residue question is the weaker restriction appearing in this catalogue\textquotesingle s background. \sref{statement}{2}
  \subsection{Short English statement}
  Does every residue coprime to its modulus occur infinitely often among partition numbers?
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Dohoon Choi and Youngmin Lee, \emph{Newman\textquotesingle s conjecture for the partition function modulo integers with at least two distinct prime divisors}, arXiv:2212.00636v2 (2025), Section 1, Conjecture 1.1. \url{https://arxiv.org/pdf/2212.00636}.
  \end{description}
