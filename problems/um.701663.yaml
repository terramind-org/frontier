title: Kourovka Notebook Problem 20.5
field: mathematics
tier: prose
statement: |-
  (Well-known problem). Let $G$ be a finite group, and $\mathrm{V}(\mathbb{Z}G)$ the group of normalized units of the integral group ring of $G$. Do the spectra of $G$ and $\mathrm{V}(\mathbb{Z} G)$ coincide? That is, is it true that, for any integer $n$, there is an element of order $n$ in $\mathrm{V}(\mathbb{Z} G)$ if and only if there is an element of order $n$ in $G$?

  The answer is ``yes'' if $G$ is solvable (M. Hertweck, *Comm. Algebra* **36** (2008), 3585--3588).
