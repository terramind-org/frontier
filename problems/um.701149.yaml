title: Kourovka Notebook Problem 15.61
field: mathematics
tier: prose
statement: |-
  Is it true that \ $l_ {\pi} ^ {n} (G) \le n (G_ {\pi} ) -1+\max_
  {p\in \pi} l_p
  (G) $ \ for any $\pi$-soluble group $G$? Here
  $n (G_ {\pi} ) $ is the nilpotent length of a Hall
  $\pi$-subgroup
  $G_ {\pi} $ of the
  group $G$ and $l_ {\pi} ^ {n} (G) $ is the nilpotent $\pi$-length of
  $G$, that is, the minimum number of
  $\pi$-factors in those normal series of $G$ whose factors are either
  $\pi '$-groups, or
  nilpotent $\pi$-groups. The answer is known to be affirmative in the
  case when all proper subgroups of
  $G_ {\pi} $ are supersoluble.
