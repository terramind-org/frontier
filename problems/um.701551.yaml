title: Kourovka Notebook Problem 19.3
field: mathematics
tier: prose
statement: |-
  Let $G=A\ast_{H}B$ be the generalized free product of groups $A$ and $B$ with amalgamated subgroup $H$. Is $\psi(G)=1$ in the following cases?
  \begin{itemize}
  \item[{a)}] $H$ is finite cyclic and $H_G=1$.

  \item[{b)}] $H$ is finite cyclic and either $\lambda(A)\cap H_G=1$ or $\lambda(B)\cap H_G=1$.

  \item[{c)}] $H_G=1$ and $H$ satisfies the minimum condition on
  subgroups.

  \item[d)] $\lambda(G)\cap H=1$.

  \item[{e)}] $A$ and $B$ are free
  groups, $H$ is finitely generated and at least one
  of $|A:H|$ or $|B:H|$ is infinite.

  \item[{f)}] $H$ is infinite cyclic and is a retract
  of $A$ and $B$.

  \item[{g)}] $G$ nearly splits over $H$, and $H$ is a normal subgroup of $G$ of prime order.
  \end{itemize}
