  \section*{Patterson first moment over Eisenstein primes}\label{30007272}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  In Z[omega], $\omega =\exp (2\pi $ i/3), let primary primes pi satisfy $\pi =1$ modulo3, let $chi_\pi $ be the cubic residue character, and put $G(\pi )=N(\pi )^{-1/2}$ $sum_(v$ modulo pi) $chi_\pi (v)$ exp(2pi i Tr(v/pi)). Is $sum_(N(\pi )<=X)$ G(pi) asymptotic to $(6/5)(2\pi )^{2/3}/(3$ Gamma(2/3)) times $X^{5/6}/\log $ X, counting all primary prime elements including conjugate split primes?
  \subsection{Short English statement}
