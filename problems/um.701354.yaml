title: Kourovka Notebook Problem 17.52
field: mathematics
tier: prose
statement: |-
  (N. Eggert). Let $R$ be a commutative
  associative finite-dimensional nilpotent algebra over a finite
  field $F$ of characteristic $p$. Let $R^{(p)}$ be the subalgebra
  of all elements of the form $r^p$ ($r\in R$). Is it true that
  $\dim R\geq p \dim R^{(p)}$?

  An affirmative answer gives a
  solution to 11.44 for the case where the factors $A$ and $B$ are
  abelian.
