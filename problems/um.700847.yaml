title: Kourovka Notebook Problem 12.28
field: mathematics
tier: prose
statement: |-
  Let $G$ be a group. A function $f\! : G
  \rightarrow {\mathbb{C}$ is called
  \begin{enumerate}

  \item[1)] *normed* if $f(1)=1$;

  \item[2)] *central* if $f(gh)=f(hg)$ for all
  $g,h \in G$;

  \item[3)] *positive-definite* if $\sum\limits_{k,
  l}f(g_k^{-1}g_l) \overline{\! c}_kc_l \geq 0$ for any $g_1,\ldots
  ,g_n \in G$ and any $c_1,\ldots ,c_n \in
  {\mathbb{C}$. \end{enumerate}

  Classify the infinite simple locally finite groups $G$ which
  possess functions satisfying 1)--3). The simple Chevalley groups
  are known to have no such functions, while such functions exist on
  locally matrix (or stable) classical groups over finite fields.
  The question is motivated by the theory of $C^{\displaystyle{*}}
  $-algebras, see $\S$ 9 in (A. M. Vershik, S. V. Kerov, *J. Sov. Math.*, **38** (1987), 1701--1733). Partial results see
  in (F. Leinen, O. Puglisi,
  *J. Pure Appl. Algebra*, **208** (2007), 1003--1021, *J. London Math. Soc.*, **70**
  (2004), 678--690).
