title: Switching Ratios in Discretized Hysteresis Dynamics
field: mathematics
tier: prose
statement: For the discretized hysteresis equation $\dot u_n=(u_{n-1}-2u_n+u_{n+1})/h^2+\mathcal H(u_n)$ with $u_n(0)=-c(hn)^2$, $c>0$, and thresholds $H_1>0>H_{-1}$, is $\#\{\text{switched points}\}/\#\{\text{nonswitched points}\}\approx|H_1/H_{-1}|$?
