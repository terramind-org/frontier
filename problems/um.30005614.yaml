title: Landau-Level Multiplicities and Sign-Changing Spherical Interfaces
field: mathematics
tier: prose
statement: Determine the multiplicities of Landau levels under delta-interactions supported on general finite $C^{1,1}$ curves. Separately, characterize interfaces on $S^2$ for which a sign-changing elliptic problem has no eigenvalues $-1/2+i\eta$ with nonzero real $\eta$ when the material contrast is below $-1$.
