  module: FormalConjectures.OEIS.«167918»
  decl: OeisA167918.conjecture2
  statement: "theorem conjecture2 : ∃ C : ℕ, ∀ n : ℕ, n > 0 → S (a n) / S n ≤ C"
  context:
    - open OeisA167918
  definitions:
    - name: OeisA167918.S
      kind: def
      text: |-
        /-- $S(i) = p_i + p_{i+1}$. -/
        noncomputable def S (i : ℕ) : ℕ := P i + P (i + 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/167918.lean#L33
    - name: OeisA167918.a
      kind: def
      text: |-
        /-- Smallest index $k > n$ such that $S(n) \mid S(k)$. -/
        noncomputable def a (n : ℕ) : ℕ :=
          if n = 0 then 0
          else sInf { k : ℕ | k > n ∧ S n ∣ S k }
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/167918.lean#L36
