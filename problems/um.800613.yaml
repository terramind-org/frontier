title: Selection Principles in Mathematics — Problem 41 ([BG])
field: mathematics
tier: prose
statement: |-
  Is $\mathsf{S}_1(\Omega_{\mathrm{nbd}},\Omega)=\mathsf{S}_{\mathrm{fin}}(\mathcal{O}_{\mathrm{nbd}},\mathcal{O})$ for separable metrizable groups?
  Specifically:

  - Does the Continuum Hypothesis{} imply the existence of a separable metrizable group $G$ satisfying
  $\mathsf{S}_{\mathrm{fin}}(\mathcal{O}_{\mathrm{nbd}},\mathcal{O})$ but not $\mathsf{S}_1(\Omega_{\mathrm{nbd}},\allowbreak\Omega)$?

  - Is it consistent that $\mathsf{S}_{\mathrm{fin}}(\mathcal{O}_{\mathrm{nbd}},\mathcal{O})=\mathsf{S}_1(\Omega_{\mathrm{nbd}},\Omega)$ for separable metrizable groups?
