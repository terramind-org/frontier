title: Prime-Reduced Standard and Costandard Modules
field: mathematics
tier: prose
statement: Assume $p>h$. For each regular dominant weight $\lambda=\lambda_0+p\lambda_1$, with $\lambda_0\in X_1^+$ and $\lambda_1\in X^+$, set $\Delta'_{\mathrm{red}}(\lambda)=L(\lambda_0)\otimes\Delta(\lambda_1)^{(1)}$ and $\nabla'_{\mathrm{red}}(\lambda)=L(\lambda_0)\otimes\nabla(\lambda_1)^{(1)}$. Must $\Delta'_{\mathrm{red}}(\lambda)[-l(\lambda)]\in E^L$ and $\nabla'_{\mathrm{red}}(\lambda)[-l(\lambda)]\in E^R$?
