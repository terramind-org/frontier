title: Spaces with Lower Ricci Curvature — Conjecture 8
field: mathematics
tier: prose
statement: |-
  Let $\gamma\colon (-2,2)\to X$ be a minimizing geodesic, then for $s,t\in (-1,1)$ we have that

  \itemsep=0pt

  $1)$ $($Lipschitz rate$)$ $\frac{\nu(B_r(\gamma(s)))}{\nu(B_r(\gamma(t)))}\leq C(n,\lambda)|t-s|$,

  $2)$ $($constant density$)$ if $X$ is noncollapsed, then $\lim\limits_{r\to 0}\frac{\nu(B_r(\gamma(s)))}{\nu(B_r(\gamma(t)))} = 1$.
