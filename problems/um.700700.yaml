title: Kourovka Notebook Problem 11.7
field: mathematics
tier: prose
statement: |-
  a) Find conditions for a
  group $ G$, given by its presentation, under which the
  property *some term of the lower central series of $G$
  is a free group* $(*)$ implies the residual
  finiteness of $G$.

  b) Find conditions on the structure of a
  residually finite group $G$ which ensure property $(*)$ for $G$.
