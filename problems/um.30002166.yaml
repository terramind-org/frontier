title: Density and Kissing Numbers for Binary Sphere Packings
field: mathematics
tier: prose
statement: For packings of Euclidean balls of radii $r_1$ and $r_2$ occurring in a prescribed proportion, what are the maximal packing density and mean kissing numbers $k_{11},k_{12},k_{21},k_{22}$? When $r_1$ and $r_2$ are close, does the density equal that for congruent balls, so that the two sizes do not mix?
