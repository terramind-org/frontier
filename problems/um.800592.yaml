title: Selection Principles in Mathematics — Problem 18 ([AddQuad])
field: mathematics
tier: prose
statement: |-
  In some cases, there remains the task to
  determine the *exact* additivity number.
  The *additivity number* of a nontrivial family $\mathcal{J}$ of sets of reals
  is
  $$\operatorname{add}(\mathcal{J})=\min\{|\mathcal{F}| : \mathcal{F}\subseteq\mathcal{I}\mbox{ and }\cup\mathcal{F}\notin\mathcal{J}\}.$$
  $\max\{\mathfrak{b},\mathfrak{g}\}\le\operatorname{add}(\mathsf{S}_{\mathrm{fin}}(\mathcal{O},\mathcal{O}))\le\operatorname{cf}(\mathfrak{d})$,
  $\mathfrak{h}\le\operatorname{add}(\mathsf{S}_1(\Gamma,\Gamma))\le\mathfrak{b}$,
  and $\operatorname{add}(\mathcal{N})\le\operatorname{add}(\mathsf{S}_1(\mathcal{O},\mathcal{O}))$ [AddQuad].

  Is $\operatorname{add}(\mathsf{S}_{\mathrm{fin}}(\mathcal{O},\mathcal{O}))=\max\{\mathfrak{b},\mathfrak{g}\}$?
