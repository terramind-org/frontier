title: Research Problems in Function Theory — Problem 6.112
field: mathematics
tier: prose
statement: If $f$ in $A$ and $\delta > 0$, define a $\Sigma_\delta(f)$ neighbourhood of $f$ to be \[\Big\{g:g\in A,\big|(g'(z)-f'(z))-\frac{1}{z}(g(z)-f(z))\big|+\big|(g'(z)-f'(z))+\frac{1}{z}|g(z)-f(z))\big|<2\delta\Big\}.\] Clearly, $N_\delta(f)\subset\sum_\delta(f)$. Then it is known by Sheil-Small and Silvia that $\sum_1(z)\subset St$, and \mbox{$\sum_\frac{1}{4}(f)\subset St$} for convex functions $f$, with the notation in Problem 6.111. Given a normal family $\mathcal{F}$ in $A$, the dual, $\mathcal{F}^*$, of $\mathcal{F}$ is the set \[\big\{f:f\in A,f\ast g\neq0\text{ for all }g\in\mathcal{F},0<|z|<1\big\},\] where $\ast$ denotes the Hadamard product, see Ruscheweyh . The Bieberbach conjecture (see de Branges ) is equivalent to the statement that $N_1(z)\subset S^*$ (where $S^*$ is the dual of $S$). It seems reasonable therefore to ask whether $\sum_1(z)\subset S^*$. (Recall that $S^*\subset St$, see Ruscheweyh .) (T. Sheil-Small and E. M. Silvia)
