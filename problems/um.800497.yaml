title: Linear Systems and Eigenvalue Problems — Problem 6
field: mathematics
tier: prose
statement: Find the smallest $p>0$ such that we can solve an $n\times n$ linear system $Ax=b$ to high accuracy using $\tilde O(\mathcal{T}_A\cdot\bar\kappa_p)$ arithmetic operations, where $\bar\kappa_p$ is the $p$-averaged condition number of the singular values of $A$, whereas $\mathcal{T}_A$ is either $n^2$ or $\mathrm{nnz}(A)$.
