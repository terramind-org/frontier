title: Source repair and the countable chromatic compactness endpoint barrier
field: mathematics
tier: prose
statement: |-
  Let \(\phi(n)\) be the statement “for every graph of size
  \(\aleph_{\omega+1}\), if every subgraph of size
  \(<\aleph_{\omega+1}\) has chromatic number \(\leq\aleph_n\), then the
  entire graph has chromatic number \(\aleph_n\).” Is \(\phi(0)\) consistent?

  It is known that \(\phi(n)\) is consistent whenever \(1\leq n<\omega\).
  In fact, the sentence \(\forall n\in\omega(n>0\to\phi(n))\) is consistent.
