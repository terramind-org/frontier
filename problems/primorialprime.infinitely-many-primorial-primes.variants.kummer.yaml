  definitions:
    - name: PrimorialPrime.IsKummerPrimorialPrime
      kind: def
      text: |-
        /-- A prime Kummer number, i.e., a prime equal to $p_n\# - 1$ for some $n \in \mathbb{N}$. -/
        def IsKummerPrimorialPrime (q : ℕ) : Prop :=
          q.Prime ∧ ∃ n : ℕ, q + 1 = Nat.kthPrimorial n
