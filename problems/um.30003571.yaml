title: Relative Kähler–Ricci Flow on Projective-Space Fibrations
field: mathematics
tier: prose
statement: |-
  For a projective-space fibration $f:X\to S$ arising from a rank-$r$ bundle $E$, can the relative Kähler–Ricci flow be developed directly on $\mathcal O_E(r)$, using

  $$K_{X/S}^{-1}\cong\mathcal O_E(r)\otimes f^*(\det E)^{-1},$$

  rather than on $K_{X/S}$?
