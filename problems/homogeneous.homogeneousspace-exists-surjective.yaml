lean:
  module: FormalConjectures.Paper.Homogenous
  decl: Homogeneous.homogeneousSpace_exists_surjective
  statement: |-
    theorem homogeneousSpace_exists_surjective :
        ∀ (X : Type) (_ : TopologicalSpace X), T2Space X → CompactSpace X →
          ∃ (Y : Type) (_ : TopologicalSpace Y), T2Space Y ∧ CompactSpace Y ∧ HomogeneousSpace Y ∧
            ∃ f : Y → X, Continuous f ∧ f.Surjective
  context:
    - open Homogeneous
    - open TopologicalSpace Topology Filter Set
    - open scoped Cardinal
  definitions:
    - name: Homogeneous.HomogeneousSpace
      kind: class
      text: |-
        /--
        A topological space $X$ is called *homogeneous* if for all $x, y \in X$ there is homeomorphism
        $f : X \to X$ with $f(x) = y$.
        -/
        class HomogeneousSpace (X : Type*) [TopologicalSpace X] : Prop where
          exists_equiv : ∀ x y : X, ∃ f : X ≃ₜ X, f x = y
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Paper/Homogenous.lean#L42
