title: Optimal Order of Multidimensional Point-Set Discrepancy
field: mathematics
tier: prose
statement: For $s\geq3$, is the sharp order of the minimum $L^\infty$ discrepancy of $N$-point sets in the unit half-open $s$-cube equal to $(\log N)^{s-1}/N$, and do the Chen–Skriganov and digital-net constructions discussed in the source attain that order?
