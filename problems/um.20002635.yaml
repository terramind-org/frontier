title: A causal max-plus certificate for nearest-neighbor ballistic deposition
field: mathematics
tier: prose
statement: |-
  Expand the universality of the KPZ equation to:

  Growth model such as ballistic deposition.

  For a standard nearest-neighbor ballistic-deposition height process, prove one or more levels of KPZ universality: KPZ fluctuation exponents, the appropriate geometry-dependent one-point distribution, spatial-field convergence, or convergence as a space-time process to the KPZ fixed point.
