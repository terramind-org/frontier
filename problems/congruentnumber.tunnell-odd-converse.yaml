lean:
  module: FormalConjectures.Wikipedia.CongruentNumber
  decl: CongruentNumber.Tunnell_odd_converse
  statement: |-
    theorem Tunnell_odd_converse (n : ℕ) (hsqf : Squarefree n) (hodd : Odd n) :
        2 * (A n).ncard = (B n).ncard → congruentNumber n
  context:
    - open CongruentNumber
  definitions:
    - name: CongruentNumber.congruentNumber
      kind: def
      text: |-
        def congruentNumber (n : ℕ) : Prop :=
          ∃ (a b c : ℚ), a ^ 2 + b ^ 2 = c ^ 2 ∧ n = (2⁻¹ : ℚ) * a * b
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/CongruentNumber.lean#L36
    - name: CongruentNumber.A
      kind: def
      text: "def A (n : ℕ) : Set (ℤ × ℤ × ℤ) := {(x, y, z) | n = 2 * x ^ 2 + y ^ 2 + 32 * z ^ 2}"
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/CongruentNumber.lean#L96
    - name: CongruentNumber.B
      kind: def
      text: "def B (n : ℕ) : Set (ℤ × ℤ × ℤ) := {(x, y, z) | n = 2 * x ^ 2 + y ^ 2 + 8 * z ^ 2}"
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/CongruentNumber.lean#L97
