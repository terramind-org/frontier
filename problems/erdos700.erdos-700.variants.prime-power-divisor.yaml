lean:
  module: FormalConjectures.ErdosProblems.«700»
  decl: Erdos700.erdos_700.variants.prime_power_divisor
  statement: |-
    theorem erdos_700.variants.prime_power_divisor :
        {n : ℕ | ¬ n.Prime ∧ 1 < n ∧ f n = n / Q n} = erdos_700.variants.prime_power_divisor.answer
  context:
    - open Erdos700
    - open Erdos700.erdos_700
    - open Erdos700.erdos_700.variants
    - open Finset
  definitions:
    - name: Erdos700.f
      kind: def
      text: |-
        /-- `f n = min_{1 < k ≤ n/2} gcd(n, C(n,k))`. (The infimum is `0` when the range is empty, i.e.
        `n < 4`.) -/
        noncomputable def f (n : ℕ) : ℕ :=
          sInf {m | ∃ k, 1 < k ∧ k ≤ n / 2 ∧ m = Nat.gcd n (n.choose k)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/700.lean#L40
    - name: Erdos700.Q
      kind: def
      text: |-
        /-- $Q(n)$ is the largest prime-power divisor of $n$: the maximum of $p^{v_p(n)}$ over
        prime divisors $p$ of $n$. It is `0` when `n ≤ 1`. -/
        noncomputable def Q (n : ℕ) : ℕ := n.primeFactors.sup (fun p => p ^ n.factorization p)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/700.lean#L48
