title: Comparative Accuracy of Spline and Finite-Element Bases
field: mathematics
tier: prose
statement: For numerical approximation, how accurate and robust are maximally continuous splines, minimally continuous splines, divergence-conforming splines, and curl-conforming splines; how do splines compare with classical finite elements; how do the answers depend on dimension; which polynomial and Fourier bases are best for multidimensional approximation; and when can those preferences be quantified?
