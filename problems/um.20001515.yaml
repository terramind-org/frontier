title: Fast monodromy and the cocompact cubulation bottleneck
field: mathematics
tier: prose
statement: |-
  Let $F=F(a,b,c)$ be a free group of rank $3$. Define $\phi\in\operatorname{Aut}(F)$ by
  \[
  \phi(a)=a,\qquad \phi(b)=ab,\qquad \phi(c)=bcb.
  \]
  Does $G=F\rtimes_\phi\mathbb Z$ act geometrically on a CAT(0) cube complex?
