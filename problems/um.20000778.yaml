title: Phantoms on projective space and the failure of a surface rationality criterion
field: mathematics
tier: prose
statement: |-
  Consider $D^b(\mathbb{P}^n)$. Take an admissible thick subcategory, $\mathcal{A}$, i.e. a triangulated subcategory closed under taking summands and such that the inclusion has a left (equivalently right) adjoint. If $K_0(\mathcal{A})=0$, is $\mathcal{A}=0$? Such an $\mathcal{A}$ is called a phantom. When $n=1$, it is known that there is no such phantom subcategory. This is related to Caldararu's conjecture on the existence of exceptional collections on projective homogeneous varieties. The answer is no if we replace $\mathbb{P}^n$ by an arbitrary variety (there is a surface counterexample).

  If we replace $\mathbb{P}^n$ by another regular surface, is the condition of not having phantom subcategories equivalent to rationality? What if we take $K_0(X) \otimes \mathbb{Q}$?
