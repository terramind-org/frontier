title: Supersaturation Blow-Ups in Uniform Hypergraphs
field: mathematics
tier: prose
statement: For all positive integers $\ell$ and $r$ and every $c>0$, does there exist $\gamma>0$ such that every $r$-uniform hypergraph $H$ with at least $cn^\ell$ copies of the complete $r$-uniform hypergraph $K^r_\ell$ contains a complete $\ell$-partite $r$-uniform hypergraph with equal part size $t\geq\gamma(\log n)^{1/(r-1)}$?
