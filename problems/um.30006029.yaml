title: Enumerative Meaning of k-Leaky Double Hurwitz Numbers
field: mathematics
tier: prose
statement: Find an enumerative interpretation of the $k$-leaky double Hurwitz numbers $H_g^k(A)$ for $k>0$. More broadly, formulate natural enumerative problems for $k$-differentials of arbitrary genus $g$ and zero-pole profile $A$, and determine whether their counts equal or otherwise relate to $H_g^k(A)$.
