title: The reducible fiber of the representation-to-pseudorepresentation map
field: mathematics
tier: prose
statement: |-
  \[
    V_{\mathbb F}=\omega _1\oplus\omega _2\longmapsto T_{\mathbb F},
  \]

  and the completion appearing later is \(\widehat R_x\). The final token
  “8.3.” belongs to the next subsection, whose separate problem asks for
  cohomological tools for pseudorepresentations; it is not part of Problem 2.

  With those corrections, but without supplying definitions absent from the
  notes, the problem is the following. Let \(\mathbb F\) be a finite field,
  let \(\omega _1\ne\omega _2\) be characters, and let \(T_{\mathbb F}\) be the
  pseudorepresentation attached to the semisimple representation
  \(\omega _1\oplus\omega _2\). Study representations over
  \(W(\mathbb F)\)-algebras whose residual representation is a non-split
  extension of \(\omega _1\) by \(\omega _2\). The notes propose a morphism

  \[
   X_{\omega _2}\longrightarrow \operatorname{Spec}R(T_{\mathbb F})
  \]

  whose special fiber involves

  \[
   \bigl(\operatorname{Ext}^1(\omega _1,\omega _2)\setminus\{0\}\bigr)
   /\mathbb F^\times. \]

  A point \(x\) of that fiber should determine an extension \(V_x\), and the
  completion \(\widehat R_x\) is suggested to be the universal deformation ring
  of \(V_x\). A universal rank-two bundle \(V_{\omega _2}\) on
  \(X_{\omega _2}\) is proposed, as is a bundle \(\pi_*V_{\omega _2}\) on the
  pseudodeformation space. The notes then put \(X_{\omega _2}\) and the
  opposite-extension space \(X_{\omega _1}\) over the same base and ask whether
  they can be glued “along the trivial extension,” perhaps into an algebraic
  stack. They also assert, without giving the construction of \(X_{\omega_i}\),
  that \(X_{\omega_2}\) is proper by the valuative criterion.
