title: Infinitesimal rigidity of the discrete tree action and visible root displacement
field: mathematics
tier: prose
statement: |-
  Is there a deformation theory for arboreal Galois representations?

  Consider \(x^2+t\) where \(t^2=0\) over Artinian ring \(K[t]/t^2\) or \(K[t]/t^n\) for \(n\geq 1\).

  Can we parametrize arboreal Galois representations as we do p-adic Galois representations? This is different from the direction of the other remark.
