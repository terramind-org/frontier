statement: If $\Omega$ is a bounded hyperconvex domain in $\mathbb{C}^n$ and $u$ solves $(dd^c u)^n=f\,d\lambda$ with $u=0$ on the boundary, does $f\in C^\infty(\Omega)$ and $f>0$ imply $u\in C^\infty(\Omega)$?
