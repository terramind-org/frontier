title: Universality Under Composition of Holomorphic Self-Maps
field: mathematics
tier: prose
statement: Suppose $(\varphi_n)$ and $(\vartheta_n)$ are sequences of holomorphic self-maps of the unit disk, or of a domain in $\mathbb{C}$ or $\mathbb{C}^n$, and each sequence admits a universal function relative to $H^\infty$. Under what natural conditions does the composed sequence $(\varphi_n\circ\vartheta_n)$ also admit a universal function?
