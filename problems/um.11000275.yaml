title: Question 2.7 — If m<n − 1 and H⊂Aut(Fn) is a subgroup of finite index, then does every homomorphism H→ GL(m, Z) have finite image?
field: mathematics
tier: prose
statement: If m<n − 1 and H⊂Aut(Fn) is a subgroup of finite index, then does every homomorphism H→ GL(m, Z) have finite image? Similar questions are interesting for the other groups in our families (cf. section 3). For exam- ple, if m<n − 1 and H⊂Aut(Fn) is a subgroup of finite index, then does every homomorphism H→ Aut(Fm) have finite image? A positive answer to the following question would answer Question 2.5; a negative answer would show that Aut( Fn) does not have property (T).
