id: um.30003796
title: Properness of Localization Maps for Algebraic Groups
field: mathematics
tier: prose
statement: |-
  For which fields $K$ can one choose a natural set $V$ of discrete valuations such that, for every absolutely almost simple adjoint $K$-group $G$ and every finite $S\subset V$, the localization map
  $$
  \omega_{S,G}:H^1(K,G)\longrightarrow\prod_{v\in V\setminus S}H^1(K_v,G)
  $$
  is proper? In particular, is this true for finitely generated fields of good characteristic?
