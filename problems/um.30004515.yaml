title: Tverberg Depth Bounds from Tukey Depth
field: mathematics
tier: prose
statement: For a finite point set $S\subset\mathbb{R}^d$ and $q\in\mathbb{R}^d$, is the Tverberg depth conjecturally bounded below by $\operatorname{TvD}(S,q)\geq\frac{1}{d-1}\operatorname{TD}(S,q)$ for $d\geq 2$, with this bound being tight?
