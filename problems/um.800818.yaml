title: Geometric Hydrodynamics in Open Problems — Problem 17
field: mathematics
tier: prose
statement: |-
  Show that for any geodesic $\gamma(t)$ in $\mathscr{D}_\mu^s(M)$ its absolute complexity
  is exponentially bounded above:
  $$
  \mathcal{C}(\gamma(t)) \lesssim e^{t\|\dot{\gamma}_0\|_{H^s}} .
  $$
