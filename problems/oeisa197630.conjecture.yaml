lean:
  module: FormalConjectures.OEIS.«197630»
  decl: OeisA197630.conjecture
  statement: "theorem conjecture : ∀ n : ℕ, 1 < n → (a n).Prime → a n = 13"
  context:
    - open OeisA197630
  definitions:
    - name: OeisA197630.a
      kind: def
      text: |-
        /-- Lerch quotients of odd primes: $a(n)$ is the Lerch quotient of the $n$-th prime $p_n$ for
        $n > 1$, and $0$ for $n \le 1$. -/
        noncomputable def a (n : ℕ) : ℕ :=
          if 1 < n then
            lerchQuotient (Nat.nth Nat.Prime (n - 1))
          else
            0
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/197630.lean#L50
