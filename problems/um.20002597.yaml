title: Dyck random transpositions and a sharp edgewise comparison obstruction
field: mathematics
tier: prose
statement: |-
  **Random walks on Dyck's paths.** Consider the Markov chain on the set of
  Dyck's paths, which moves by choosing uniformly at random two coordinates
  and exchanging their value ($+$ or $-1$) provided the resulting path remains
  a Dyck's path. What is the mixing time?
