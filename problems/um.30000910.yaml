title: Nonemptiness of Affine Deligne–Lusztig Varieties
field: mathematics
tier: prose
statement: Let $\mathbb F_q$ be finite, let $k=\overline{\mathbb F_q}$ and $L=k((\varepsilon))$, and let $G$ be split, semisimple, and simply connected over $\mathbb F_q$. Let $\mathbf a$ be the base alcove, $I$ its standard Iwahori subgroup, $W_a$ the affine Weyl group with finite Weyl group $W$ and simple reflections $S$, and $\sigma$ the Frobenius. For $b\in G(L)$ and $x\in W_a$, set $X_x(b)=\{g\in G(L)/I:g^{-1}b\sigma(g)\in IxI\}$. Let $\eta_1:W_a\to W$ be projection, and define $\eta_2(x)$ as the unique $w\in W$ for which $w^{-1}x\mathbf a$ lies in the dominant Weyl chamber. Call $x$ shrunken if $U_\alpha\cap xI\neq U_\alpha\cap I$ for every finite root $\alpha$. For shrunken $x$, is $X_x(1)$ nonempty exactly when $\eta_2(x)^{-1}\eta_1(x)\eta_2(x)\notin\bigcup_{T\subsetneq S}W_T$, and in that case is $\dim X_x(1)=\tfrac12\bigl(\ell(x)+\ell(\eta_2(x)^{-1}\eta_1(x)\eta_2(x))\bigr)$? For every $\sigma$-conjugacy class $[b]$, does there exist $n_0$ such that $X_x(b)$ is nonempty exactly when $X_x(1)$ is nonempty for all $x$ with $\ell(x)\geq n_0$?
