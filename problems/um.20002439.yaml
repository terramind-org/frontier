title: "Focusing spherical shocks: similarity norms and gauge modes"
field: mathematics
tier: prose
statement: |-
  **Open Problem:** A classical and apparently very hard problem is the analysis of non stationary spherical waves, e.g. a focusing inviscid shock (c.f. R. Courant & K.O. Friedrichs, *Supersonic Flow and Shock Waves*, Interscience Publishers, New York, (1948) or L.D. Landau & E.M. Lifshitz *Fluid Mechanics*, Pergamon Press, Oxford (1959)) Are such waves stable?

  The original first page contains the following complete problem under S. Benzoni-Gavage, H. K. Jenssen, and M. Williams:

  Szmolyan: (Kinetic and Boltzmann Equations)” and the kinetic equation that follow are the next presenter’s setup on page 2. They are not part of AIM-PDES-0051. The recovered statement studied here is therefore only the focusing-inviscid-shock question above. No mathematical symbols are missing from that question.

  The phrase “such waves” is broad. To obtain a precise object, most of the literature studies the spherical, strong-shock, ideal-perfect-gas, self-similar Guderley solution. Results for that model do not automatically answer the question for finite-strength shocks, nonideal equations of state, nonsimilar focusing waves, or viscous flows.
