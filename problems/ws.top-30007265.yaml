statement: |-
  \section*{Mean analytic rank of quadratic twists over Q}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every elliptic curve E over Q, does the mean of the analytic ranks of $E^{d}$, over nonzero signed squarefree d with $|d|<=X$, tend to one half as X tends to infinity?
  \subsection{Short English statement}
  For every elliptic curve E over Q, does the mean of the analytic ranks of $E^{d}$, over nonzero signed squarefree d with $|d|<=X$, tend to one half as X tends to infinity?
