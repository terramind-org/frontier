title: Homogeneous Einstein Metrics on Flag and Stiefel Manifolds
field: mathematics
tier: prose
statement: Find all homogeneous Einstein metrics on generalized flag manifolds $G/K$ and on Stiefel manifolds $V_k\mathbb R^n=\operatorname{SO}(n)/\operatorname{SO}(n-k)$; and determine whether the number of homogeneous Einstein metrics is finite for homogeneous spaces with nonequivalent irreducible isotropy components and for compact semisimple Lie groups.
