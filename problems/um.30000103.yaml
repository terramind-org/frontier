title: Rational 1-Connectedness Under Higher Fano Conditions
field: mathematics
tier: prose
statement: Suppose that $X$ is Fano and that $c_2(\Omega_X^1)-\frac12K_X^2$ is negative, for example, its intersection product with every surface on $X$ is negative. Does it follow that $X$ is rationally $1$-connected?
