title: Positive Bases for Surface Skein Algebras
field: mathematics
tier: prose
statement: Let $S(\Sigma)$ be the Kauffman bracket skein algebra of a surface $\Sigma$ over $\mathbb Z[t^{\pm1}]$. For an integer lamination $\mu=\{(a_i,C_i)\}$, set $b_T(\mu)=\prod_i T_{a_i}(C_i)$ using the Chebyshev polynomials $T_j$. Is $b_T=\{b_T(\mu)\}$ a positive basis of $S(\Sigma)$, meaning that all multiplication structure constants lie in $\mathbb Z_{\geq0}[t^{\pm1}]$?
