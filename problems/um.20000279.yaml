title: A fixed-base descending sequence from Monsky quartics
field: mathematics
tier: prose
statement: |-
  Fix \(d\). Does there exist a sequence of singular algebras
  \(\{R_n\}\) over a fixed finite field of characteristic \(p>0\), and
  of dimension \(d\), such that the \(e_{HK}(R_n)\) descend to some
  number \(\alpha_d\) from above?
