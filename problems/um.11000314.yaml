title: Problem 4.8 — Define unstable (co)homology classes of GL(n, Z).
field: mathematics
tier: prose
statement: Define unstable (co)homology classes of GL(n, Z). In particular, what can be said about the image of µi ∈ H4i(OutF2i+2; Q) in H4i(GL(2i + 2, Z); Q) under the projection OutF2k+2→GL(2k + 2, Z)? The above known results as well as explicit computation made so far seem to support the following conjecture (which might be something like a folklore).
