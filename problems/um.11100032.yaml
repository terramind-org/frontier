title: Applications 8 — Extend the results of Benson-Carlson-Rickard to connected, cocommutative Hopf algebras over a field, l…
field: mathematics
tier: prose
statement: Extend the results of Benson-Carlson-Rickard to connected, cocommutative Hopf algebras over a field, like A(n). Hovey-Palmieri have achieved some partial success here; we reduce the calculation of thick subcategories to the case when the Hopf algebra is quasi-elementary. For k[G], quasi-elementary subHopf algebras look like k[E] for elementary abelian p-groups E, and the group cohomology is a polynomial algebra, so Benson-Carlson-Rickard use algebraic geometry to finish the proof (this is where they require the field to be algebraically closed). For A(n), the quasi-elementary subHopf algebras are also exterior, but the Ext groups are bigraded. We don't know how to do bigraded algebraic geometry, so we are stuck there. But I think something should be doable here. Anyway, here is the abstract of the Hovey-Palmieri paper , and here is the dvi file.
