title: The A2 cluster pentagon and a local toggle obstruction
field: mathematics
tier: prose
statement: |-
  **Problem 4.6.** Make the analogy between birational toggles and cluster flips explicit.

  Its actual problem ends immediately before the heading “4.6 Gelfand–Tsetlin triangles.” The recovered text is:

  The accompanying paragraphs compare cluster flips on a Dynkin diagram with birational toggles on its positive-root poset. They ask, in particular, for an analogue of cluster variables and almost-positive roots along rowmotion orbits, suggest piecewise-linear and birational friezes, and identify the simplest nontrivial frieze shift with the Lyness 5-cycle.

  No mathematical claim below uses the spilled Gelfand–Tsetlin text.
