title: Alpha Bounds for Uniform Fat-Point Schemes
field: mathematics
tier: prose
statement: If $X$ is a finite set of points in $\mathbb{P}^{n}$ and $Y$ is the fat-point scheme on $X$ with every point of multiplicity $rn-n+1$, is $\alpha(Y)\geq r\alpha(X)+(r-1)(n-1)$?
