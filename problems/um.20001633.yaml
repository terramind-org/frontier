title: Square-mass forestings, invariant random forests, and the Littlewood threshold
field: mathematics
tier: prose
statement: |-
  Let $\Gamma$ be a non-amenable group with a probability measure preserving
  action of $\Gamma$ on $(X,\mu)$.

  Is it true that for any $N$ there exist measurable subsets
  $A_g\subseteq X$ $(g\in\Gamma)$ such that
  $\prod\limits_{x\in A_g}(x,xg)$ is a forest with
  $\sum\limits_{g\in\Gamma}\mu^2(A_g)>N$?
