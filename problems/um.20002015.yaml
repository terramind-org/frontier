title: Affine tractor factories and Q-like tensor-densities
field: mathematics
tier: prose
statement: |-
  **Problem 2.** Construct other natural tensor-densities which transform according to (34). (Any solution yields a conformally invariant natural operator \(L\).)

  “It is clear that solutions to Problem 2 have a role to play in the problem of characterising the \(Q\)-curvature and the GJMS operators.”

  Immediately before the problem, the notes define a natural tensor-density \(N_g\) to have a linear conformal change law when

  \[
     N_{\widehat g}=N_g+L_g\omega,
     \qquad \widehat g=e^{2\omega}g. \tag{34}
  \]

  The problem is therefore:

  The printed text says “(43),” but the immediately preceding displayed formula is numbered (34), and equation (43) occurs only later in a compiled list. Thus “(43)” is an internal cross-reference typo. The duplicate phrase “of the the form” is also in the PDF. Finally,

  \[
     \iota(D)|C|^2I_g=4\Delta |C|^2
  \]

  The missing end of the record is:

  The preceding notation uses the standard tractor bundle \(\mathcal T\), density bundles \(\mathcal E[w]\), the scale-dependent tractor \(I_g\in\mathcal T[-1]\), and the tractor \(D\)-operator. The key identity is

  \[
     I_{e^{2\omega}g}=I_g+D\omega. \tag{33}
  \]

  If \(a_g\) is the ordinary scalar representative of \(A_g\in\mathcal E[-n]\), then

  \[
     e^{n\omega}a_{\widehat g}=a_g+L_g\omega. \]

  This factor is essential in coordinate checks.
