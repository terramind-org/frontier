title: Open Problems in Arithmetic Dynamics — Conjecture 24 (Orbit Density Conjecture)
field: mathematics
tier: prose
statement: |-
  \textup{(Medvedev and Scanlon, 2009,
  {[arxiv0901.2352, Conjecture 5.10]}; Amerik, Bogomolov and
  Rovinsky, 2011, {[MR2862064, Conjecture 1.2]})}

  Let ${\bar K}$ be an algebraically closed field of characteristic $0$,
  let $X/K$ be a quasi-projective variety, and let $f:X\to X$ be a
  dominant morphism. Assume that there does not exist a non-constant
  rational function $g\in {\bar K}(X)$ satisfying $g\circ f=g$. Then there
  exists a point $P\in X({\bar K})$ whose orbit $\mathcal{O}_f(P)$ is Zariski
  dense in $X$.
