title: Kourovka Notebook Problem 12.13
field: mathematics
tier: prose
statement: |-
  If $\left< \Omega , \leq \right>$ is the
  countable universal poset, then $G=\mathrm{Aut} (\left< \Omega ,
  \leq \right> )$ is simple (A. M. W. Glass, S. H. McCleary,
  M. Rubin, *Math. Z.*, **214**, no. 1 (1993), 55--66). If
  $H$ is a subgroup of $G$ such that $|G:H| < 2^{\aleph _0}$ and $H$
  is transitive on $\Omega$, does $H=G$?
