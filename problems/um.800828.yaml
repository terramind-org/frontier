title: Geometric Hydrodynamics in Open Problems — Problem 27
field: mathematics
tier: prose
statement: |-
  Consider an integrable system on a compact $2n$-dimensional manifold, which
  has $n$ first integrals in involution, functionally independent almost everywhere.
  How wild could such a system be on a singular submanifold, where the integrals become dependent? What are constraints dictated by the integrability? Could one observe a chaos on some tiny submanifold of an integrable system?
