statement: |-
  \section{Conjecture 2.2 — Erdős-Woods}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For a positive integer $a$, let $R(a)=\prod_{p\mid a}p$ be its radical, with $R(1)=1$.
  \paragraph{Statement recorded in the supplied source.}
  Does there exist an integer $k\ge1$ such that for every $m,n\ge1$, equality $R(m+i)=R(n+i)$ for all $0\le i<k$ implies $m=n$? \sref{statement}{2}
  \subsection{Short English statement}
  Can a fixed number of successive prime-divisor sets uniquely determine the starting positive integer?
