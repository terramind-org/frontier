title: Problem 4.10 — (Algorithmic Schottky problem).
field: mathematics
tier: prose
statement: (Algorithmic Schottky problem). Give an algorithm, in the sense of complexity theory over R, which takes as input a 2g×2g symplectic matrix representing a principally polarized abelian variety, and as output tells whether or not that torus lies in the period locus. One might also fix some ϵ = ϵ(g), and then ask whether or not a given principally polarized abelian variety lies within ϵ (in the locally symmetric metric on Ag) of the period locus. It should be noted that S. Grushevsky [ Gr] has made the KP-equations solution to the Schot- tky problem eﬀective in an algebraic sense. This seems to be diﬀerent than what we have just discussed, though. We now address the question of what the Schottky locus looks like from far away. To make this precise, let Cone( Ag) denote the tangent cone at infinity (defined in (10) above) of the locally symmetric Riemannian orbifold Ag. Hattori [ Hat] proved that Cone( Ag) is homeomorphic to the open cone on the quotient of the Tits boundary of the symmetric space Sp(2 g, R)/U(g); indeed it is isometric to a Weyl chamber in the symmetric space, which is just a Euclidean sector of dimension g.
