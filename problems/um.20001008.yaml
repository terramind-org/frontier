title: Composition-resolved LL fibers and a finite-flatness obstruction
field: mathematics
tier: prose
statement: |-
  The supplied source URL is <http://aimpl.org/rationalcatalan/1/>. In particular, the misspelling “Lyashoko-Looijenga” is in the source; the standard spelling is “Lyashko--Looijenga.”

  Let $T$ be the full set of pseudo-reflections, let $\ell_T$ be reflection length, let $c$ be a Coxeter element, and let

  \[
  NC(W,c)=[1,c]_T=\{w:\ell_T(w)+\ell_T(w^{-1}c)=n\}. \]

  For an integer $p\geq 0$, count weak $p$-tuples

  \[
  w_1\leq_T\cdots\leq_Tw_p\leq_Tc. \]

  The assertion is that their number is

  \[
  C_W(p):=\prod_{i=1}^n\frac{ph+d_i}{d_i},
  \]

  equivalently that

  \[
  C_W(p)=\sum_{k=1}^n\binom{p+1}{k}F_k,
  \qquad F_k:=\operatorname{Fact}_k(c). \tag{1}
  \]

  The factors in $F_k$ are ordered, nonidentity, and length-additive. The $p+1$, rather than $p$, comes from the $p+1$ increments between $1,w_1,\ldots,w_p,c$.
