  \section{Higher Finiteness Embeddings and TDLC Analogues}\label{30005702}
  {\small UnsolvedMath ID 30005702 · Group Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Does every finitely presented group embed in a group of type $F_3$? Does every group of type $\mathrm{FP}_2$ embed in a group of type $\mathrm{FP}_3$? Formulate and prove, or disprove, a totally disconnected locally compact analogue of the intended embedding theorem.
  \par\smallskip\textit{Formulation references:} \sref{30005702}{1}, \sref{30005702}{2}.
  \subsection{Short English statement}
  Does every finitely presented group embed in a group of type $F_3$? Does every group of type $\mathrm{FP}_2$ embed in a group of type $\mathrm{FP}_3$? Formulate and prove, or disprove, a totally disconnected locally compact analogue of the intended embedding theorem.
