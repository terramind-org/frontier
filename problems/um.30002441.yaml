title: Quenched Invariance Principles for Random Conductance Models
field: mathematics
tier: prose
statement: For a stationary ergodic random conductance model on $\mathbb Z^d$ with $0<\omega(e)<\infty$ almost surely and finite mean conductance, does finiteness of $\mathbb E[1/\omega(e)]$ for every edge suffice for a quenched functional central limit theorem with deterministic nondegenerate covariance $\Sigma^2$?
