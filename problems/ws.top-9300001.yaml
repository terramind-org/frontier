  \item[\hypertarget{source:9300001:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 9300001 (AMR-092-0001). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
