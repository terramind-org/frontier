title: Kourovka Notebook Problem 10.65
field: mathematics
tier: prose
statement: |-
  Determine the structure of infinite 2-transitive
  permutation groups $(G,\Omega )$ in which the stabilizer of a
  point $\alpha \in \Omega$ has the form $G_{\alpha}=A\cdot
  G_{\alpha \beta}$ where $G _{\alpha \beta}$ is the stabilizer of
  two points $\alpha , \beta $, $\alpha \ne \beta $, such that $G
  _{\alpha \beta}$ contains an element inverting the subgroup $A$.
  Suppose, in particular, that $A\setminus \{ 1\}$ contains at most
  two conjugacy classes of $G_{\alpha}$; does $G$ then possess a
  normal subgroup isomorphic to $PSL_2$ over a field?
