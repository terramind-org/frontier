        convexWormCoverConstant = convex_mosers_worm_problem.answer
  context:
    - open MoserWorm
    - open EuclideanGeometry MeasureTheory
  definitions:
    - name: MoserWorm.convexWormCoverConstant
      kind: def
      text: |-
        /-- **Moser's convex worm cover constant**: the infimal area of a convex set that covers every
        worm by a translation and a rotation. -/
        @[optimization_constant "13a"]
        noncomputable def convexWormCoverConstant : ENNReal :=
          sInf {v | ∃ X ∈ WormCovers, Convex ℝ X ∧ volume X = v}
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/MoserWorm.lean#L96
