lean:
  module: FormalConjectures.Wikipedia.ABC
  decl: ABC.abc.variants.lt_constant_mul
  statement: |-
    theorem abc.variants.lt_constant_mul (ε : ℝ) (hε : 0 < ε) : ∃ K,
        ∀ (a b c : ℕ), 0 < a → 0 < b → 0 < c → ({a, b, c} : Set ℕ).Pairwise Nat.Coprime → a + b = c →
        c < K * (radical <| a * b * c : ℝ)^(1 + ε)
  context:
    - open ABC
    - open ABC.abc
    - open ABC.abc.variants
  definitions:
    - name: ABC.radical
      kind: def
      text: |-
        /--
        The radical of `n` denoted is the product of the distinct prime factors of `n`.
        -/
        def radical (n : ℕ) : ℕ := n.primeFactors.prod id
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/Wikipedia/ABC.lean#L30
