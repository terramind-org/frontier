title: Coarse-Manifold Fillings in S-Arithmetic Lattices
field: mathematics
tier: prose
statement: Let $K$ be a global field, $S$ a finite set of inequivalent valuations, $G$ a noncommutative absolutely almost simple $K$-isotropic group, and $G(\mathcal O_S)\subset G_S$ its arithmetic lattice. Given a scale $r_1$, does there exist a linear polynomial $f$ and a scale $r_2$ such that every coarse $n$-manifold $\Sigma\subset G_S$ of scale $r_1$ with $\partial\Sigma\subset G(\mathcal O_S)$ and $n<k(G,S)$ can be replaced by a coarse $n$-manifold $\Sigma'\subset G(\mathcal O_S)$ of scale $r_2$ and the same topological type, with $\partial\Sigma'=\partial\Sigma$ and $\operatorname{vol}(\Sigma')\leq f(\operatorname{vol}(\Sigma))$?
