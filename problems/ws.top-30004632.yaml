  \section{Global Optimality of Domain-Decomposition Transport Algorithms}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A transport plan couples two probability measures; a transport map $T$ pushes one measure to another, meaning $T_\#\mu(B)=\mu(T^{-1}(B))$. Optimal transport minimizes the expected specified cost among admissible couplings.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  Source-record limitation: Global convergence depends on the particular domain-decomposition update, overlap, scheduling, and regularization. The supplied question does not identify the algorithm or these defining choices, so it cannot support a faithful convergence statement from the record alone.
  \paragraph{Statement recorded in the supplied source.}
  For the limiting iterates of a domain-decomposition algorithm for optimal transport, what sufficient conditions on the cost function and transport data guarantee convergence to a globally optimal transport plan? \sref{statement}{2}
