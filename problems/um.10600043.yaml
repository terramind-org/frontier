title: Virtual-knot problem 43 — In his wonderful paper , which firstly had the title “Knot Floer Homotopy”, Sarkar constructs a cell complex.
field: mathematics
tier: prose
statement: |-
  In his wonderful paper , which firstly had the title
  “Knot Floer Homotopy”, Sarkar constructs a cell complex. The
  homology of this complex coincides with the Floer homology. In this
  work the following main ingredients are used:
  Manolescu–Ozsváth–Sarkar–Szab\'o–Thurston approach
  allowing one to define Heegaard–Floer homology by using grid
  diagrams and shellability. Roughly speaking, if complexes look like
  order complexes, then they can be replaced with cell (simplicial)
  complexes homotopically equivalent to them.

  Try to do the same things for Khovanov homology. In the initial
  Khovanov definition this problem seems to be very difficult, since
  the set of chains and states can hard be ordered. However, taking
  into account Bloom's construction this problem looks more
  optimistic.
