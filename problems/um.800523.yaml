title: Linear Systems and Eigenvalue Problems — Problem 32
field: mathematics
tier: prose
statement: |-
  Consider $n$ positive real numbers $\lambda$, and consider the set of all $n \times n$ orthonormal matrices $S$.
  Prove a tightness bound(s) between the (1) trace error of the optimal column subset selection of the worst case matrix $K$ possessing eigenvalues $\lambda$:
  \begin{equation}
  x_k (\lambda) := \max_{V \in S} \min_{\mathcal{I} \subset [n], |\mathcal{I}| = k} \mathrm{Tr}\left[K - K_{:,\mathcal{I}} K_{\mathcal{I}, \mathcal{I}}^{-1} K_{\mathcal{I},:} \biggr\rvert_{K=V^\top \mathrm{diag}(\lambda) V}\right]
  \end{equation}
  and (2) the objective yielded by volume sampling any such $K$:
  \begin{equation}
  y_k (\lambda) := \left(\mathbb{E}_{\mathcal{I} \sim k-\mathrm{DPP}(K)} \mathrm{Tr}\left[K- K_{:,\mathcal{I}} K_{\mathcal{I}, \mathcal{I}}^{-1} K_{\mathcal{I}, :}\right]\right) \bigr\rvert_{K=\mathrm{diag}(\lambda)} = (k+1) \frac{e_{k+1} (\lambda)}{e_k(\lambda)}
  \end{equation}
  which is dependent on $\lambda$ alone in terms of the elementary symmetric polynomials $e_k$[Guruswami2012-optimal].
