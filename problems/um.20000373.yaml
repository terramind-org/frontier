title: Real approximation and odd-kernel reduction for finite stabilizers
field: mathematics
tier: prose
statement: |-
  **Problem 5.** Harari: The following question is due to Borovoi: Consider weak approximation for \(X=\operatorname{SL}_n/G\) over \(\mathbf Q\), where \(G\) is a finite group scheme that is not necessarily constant. For example, is \(X(\mathbf Q)\) dense in \(X(\mathbf R)\)? If \(G\) is constant, this is known to be true.

  A variant is the following. Given \(X=\operatorname{SL}_n/G\) with a constant finite group scheme \(G\) over a number field \(K\) with \(r\geq 2\) real places \(v_1,\ldots,v_r\), is \(X(K)\) dense in
  \[
  \prod_{j=1}^{r}X(K_{v_j})?
  \]
  A formulation via non-abelian Galois cohomology is given in the case \(K=\mathbf Q\) as follows: Is
  \[
  H^1\!\left(\operatorname{Gal}(\overline{\mathbf Q}/\mathbf Q),G(\overline{\mathbf Q})\right)
  \longrightarrow
  H^1\!\left(\operatorname{Gal}(\mathbf C/\mathbf R),G(\mathbf C)\right)
  \]
  surjective?

  Lucchini Arteche: The algebraic Brauer--Manin obstruction says nothing for this problem.
  Skorobogatov: The result is known for abelian \(G\), due to Borovoi.
