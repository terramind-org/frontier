title: Problem 6 — Calculate the topological type (PL-homeomorphism, homotopy, homology...
field: mathematics
tier: prose
statement: Calculate the topological type (PL-homeomorphism, homotopy, homology... type) of the Arc-complexes. The first non-trivial case is the calculation of the topological type of the PL-manifolds Arc(M ) for the four type 1 surfaces M. Arc complexes as stratified spaces conjecturally have specific singularities and topology described recursively as follows. A PL sphere is a type zero space. A closed, connected, and simply connected manifold is a type one space provided it occurs among a list of four specific such (non-spherical) manifolds of respective dimensions 5,7,7, and 9, namely, the arc complexes of the four type one surfaces. For n> 1, define a type n space to be a finite polyhedron, defined up to PL-isomorphism, so that the link of each vertex in any compatible triangulation is PL isomorphic to an iterated suspension of the join of at most two spaces of type less than n. By Theorem 5, many links of simplices are indeed of this type, and we conjecture that any arc complex is of some finite type. (As explained in [46], a specific collapsing argument in the “calculus of mapping cylinders” would give a proof a of this conjecture.) 112 R. Penner The non-Hausdorﬀ space PF (F )/PMC (F ) thus contains the stratified space Arc(F ) as an open dense subset, explaining one classical (i.e., non-quantum) aspect to Problem 1. In light of the stratification of Arc-complexes in general, one might hope to apply techniques such as [1,34] to address parts of Problem 6.
