title: Kourovka Notebook Problem 10.59
field: mathematics
tier: prose
statement: |-
  Is a $p' $-group $G$ locally nilpotent if it
  admits a splitting automorphism $\varphi$ of prime order $p$ such
  that all subgroups of the form $\langle g, g^{\varphi}, \ldots ,
  g^{\varphi ^{p-1}}\rangle $ are nilpotent? An automorphism
  $\varphi$ of order $p$ is called *splitting* if $gg^{\varphi
  }g^{\varphi ^{2}}\cdots g^{\varphi ^{p-1}}= 1$ for all $g \in
  G$.
