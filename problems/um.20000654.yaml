title: Delta-method status and a conductor-drop phase diagram for GL(2)
field: mathematics
tier: prose
statement: |-
  **Subconvexity bound \(\mathrm{GL}_2\) in the “conductor dropping” case.** Let \(f\) be a holomorphic or Hecke--Maass cusp form for \(\mathrm{GL}_2\). Use a \(\delta\)-method to prove:

  1. a level-aspect subconvexity bound for \(L(1/2,f)\), where \(f\) has prime level \(p\) and may have nontrivial nebentypus;
  2. a subconvexity bound for \(L(1/2+it_f,f)\), where \(f\) is a level-one Maass form with spectral parameter \(t_f\).
