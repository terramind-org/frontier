title: Several Complex Variables Problem List — Problem 27
field: mathematics
tier: prose
statement: |-
  Let $\Omega$ be a smooth bounded planar domain and let $T:L^2(\Omega)\mapsto
  L^2(\Omega)$ be the Kohn solution operator for $\partial/\partial\bar z$. For
  $h\in L^\infty(\Omega)$ we define the compact non-self-adjoint operator
  $S_h:L^2(\Omega)\mapsto L^2(\Omega), f\mapsto \bar hTf$. Under what circumstance
  will $S_h$ have eigenvalues? Consider in particular the case where $h$ is
  holomorphic. If $h$ has a single-valued holomorphic primitive $H$ then it is
  not hard to see that $S_h$ has no eigenvalues. (Just note that $e^{-\bar
  H/\lambda}Tf$ is holomorphic and orthogonal to holomorphic functions.)
  Does the converse hold? That is: do periods of $H$ guarantee the existence
  of eigenvalues? (For annuli, the answer is``yes.")\\
  -D. Barrett, barrett@math.lsa.umich.edu
