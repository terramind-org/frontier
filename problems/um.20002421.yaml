id: um.20002421
title: Separated-variable counterexamples and sharp boundary blow-up
field: mathematics
tier: prose
statement: |-
  Let \(u:\mathbb R^2\to\mathbb R\) be a solution of
  \[
  u_{11}u_{22}=1.
  \]
  If \(u(x)\leq C(1+|x|^2)\), then \(u\) must be quadratic.

  Can the growth condition be removed?

  If one considers instead solutions \(u:\Omega\to\mathbb R\) for
  \(\Omega\subseteq\mathbb R^2\) convex, and bounded, and \(u\) with
  Dirichlet boundary conditions, can one obtain a \(C^2\) boundary estimate?
