lean:
  module: FormalConjectures.Wikipedia.ColossallyAbundantNumber
  decl: ColossallyAbundantNumber.alaoglu_erdos_colossally_abundant_prime_ratio_conjecture
  statement: |-
    theorem alaoglu_erdos_colossally_abundant_prime_ratio_conjecture (m n : ℕ)
        (h : AreConsecutiveColossallyAbundant m n) :
        ∃ p : ℕ, p.Prime ∧ n = p * m
  context:
    - open ColossallyAbundantNumber
    - open scoped ArithmeticFunction.sigma
  definitions:
    - name: ColossallyAbundantNumber.AreConsecutiveColossallyAbundant
      kind: def
      text: |-
        /-- `AreConsecutiveColossallyAbundant m n` holds when $m < n$ both satisfy `IsColossallyAbundant`
        and no integer strictly between them does. -/
        def AreConsecutiveColossallyAbundant (m n : ℕ) : Prop :=
          m < n ∧ IsColossallyAbundant m ∧ IsColossallyAbundant n ∧
            ∀ k : ℕ, m < k → k < n → ¬ IsColossallyAbundant k
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/ColossallyAbundantNumber.lean#L63
