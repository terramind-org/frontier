title: Alaoglu–Erdős Conjectures on Colossally Abundant Numbers (alaoglu_erdos_colossally_abundant_prime_ratio_conjecture)
field: mathematics
tier: proof
statement: |-
  **Alaoglu–Erdős Prime-Ratio Conjecture** [AE44]: whenever $m < n$ satisfy
  `AreConsecutiveColossallyAbundant m n`, $n = p m$ for some prime $p$.
