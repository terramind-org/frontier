title: Foliations and Diffeomorphism Groups — Question 32
field: mathematics
tier: prose
statement: Under what condition on the holonomy of a compact leaf $L$ in a $C^0$ transversally oriented foliation of codimension $>1$, the leaf $L$ is stable? For example, suppose $\mathcal{F}$ is a $C^0$ codimension $2$ foliation and $L$ is a compact leaf whose normal microbundle has a trivial Euler class, its fundamental group is amenable and $H^1(L; \mathbb{R})=0$. Is $L$ stable?
