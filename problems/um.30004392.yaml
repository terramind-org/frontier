title: Travelling-Salesman Girth and Metric Ordering Ratios
field: mathematics
tier: prose
statement: "For a metric space $M$ of infinite Assouad–Nagata dimension, is its travelling-salesman girth infinite? Consequently, for a uniformly discrete metric space $M$, is the following dichotomy true: either every order $T$ satisfies $\\operatorname{OR}_{M,T}(k)=k-1$ for all $k\\geq1$, or some order $T$ satisfies $\\operatorname{OR}_{M,T}(k)\\leq C\\log k$ for all $k\\geq1$ and some constant $C$?"
