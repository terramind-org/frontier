lean:
  module: FormalConjectures.Wikipedia.SmithNumber
  decl: SmithNumber.infinite_smith_brothers
  statement: |-
    theorem infinite_smith_brothers :
        {n : ℕ | IsSmithNumber 10 n ∧ IsSmithNumber 10 (n + 1)}.Infinite
  context:
    - open SmithNumber
  definitions:
    - name: SmithNumber.IsSmithNumber
      kind: def
      text: |-
        /-- Predicate asserting that $n$ is composite and its base-$b$ digit sum ($b \ge 2$) matches
        `primeFactorsDigitSum b n`. -/
        def IsSmithNumber (b n : ℕ) : Prop :=
          2 ≤ b ∧ n.Composite ∧ digitSum b n = primeFactorsDigitSum b n
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/SmithNumber.lean#L53
