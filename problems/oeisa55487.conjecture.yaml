lean:
  module: FormalConjectures.OEIS.«55487»
  decl: OeisA55487.conjecture
  statement: |-
    theorem conjecture (n : ℕ) (hn : 1 ≤ n) (h_not_prime : ¬ isFactorialPrime n) :
        (p n).Prime ∧ a n = p n * q n
  context:
    - open OeisA55487
  definitions:
    - name: OeisA55487.a
      kind: def
      text: |-
        /-- Least $m$ such that $\phi(m) = n!$. -/
        noncomputable def a (n : ℕ) : ℕ :=
          sInf {m : ℕ | 0 < m ∧ m.totient = n.factorial}
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/55487.lean#L32
    - name: OeisA55487.isFactorialPrime
      kind: def
      text: |-
        /-- Factorial primes: $n$ such that $n! + 1$ is prime (A002981). -/
        def isFactorialPrime (n : ℕ) : Prop :=
          Nat.Prime (n.factorial + 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/55487.lean#L48
    - name: OeisA55487.p
      kind: def
      text: |-
        /-- The least prime $p > \sqrt{n!}$ such that $(p - 1) \mid n!$
            and $q = \frac{n!}{p - 1} + 1$ is prime. -/

        noncomputable def p (n : ℕ) : ℕ :=
          sInf {p : ℕ | Nat.Prime p ∧ Nat.sqrt n.factorial < p ∧ (p - 1) ∣ n.factorial ∧
            Nat.Prime (n.factorial / (p - 1) + 1)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/55487.lean#L52
    - name: OeisA55487.q
      kind: def
      text: |-
        /-- The complementary prime factor $q = \frac{n!}{p - 1} + 1$. -/
        noncomputable def q (n : ℕ) : ℕ :=
          n.factorial / (p n - 1) + 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/55487.lean#L59
