statement: |-
  \section*{The logarithmic factor in critical planar XY correlations}\label{30007416}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For the nearest-neighbor planar XY model at its physical critical inverse temperature $b_c$, is its axial two-spin correlation $C_{b_c}(r)$ asymptotic to B $r^{-1/4}(\log $ $r)^{1/8}$, for an amplitude $B>0$ and integer $r\to \infty $?
  \subsection{Short English statement}
  For the nearest-neighbor planar XY model at its physical critical inverse temperature $b_c$, is its axial two-spin correlation $C_{b_c}(r)$ asymptotic to B $r^{-1/4}(\log $ $r)^{1/8}$, for an amplitude $B>0$ and integer $r\to \infty $?
