title: 2.1 (Leitner) — Limits between Thurston geometries
field: mathematics
tier: prose
statement: Geometric transitions are continuous paths of geometries that abruptly change type in the limit. Understand all transitions between the eight Thurston geometries. More generally, how can one tell when one geometry is a limit of another, and what properties must a limiting geometry satisfy?
