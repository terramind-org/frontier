id: um.30003202
title: Clopen Strict Comparison for Amenable Cantor Actions
field: mathematics
tier: prose
statement: Does every minimal action of a countably infinite amenable group $G$ on the Cantor set $X$ have clopen strict comparison? Explicitly, whenever clopen sets $A,B\subseteq X$ satisfy $\mu(A)<\mu(B)$ for every $G$-invariant Borel probability measure $\mu$, can $A$ be partitioned into finitely many clopen sets that can be translated by elements of $G$ to pairwise disjoint subsets of $B$?
