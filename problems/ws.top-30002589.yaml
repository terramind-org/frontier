title: Deligne's Conjecture for Critical Motive Values
field: mathematics
tier: prose
statement: |-
  \section*{\texorpdfstring{Deligne's Conjecture for Critical Motive Values}{Deligne's Conjecture for Critical Motive Values}}\label{30002589}
  \subsection{Definitions and mathematical statement}
  For a pure motive $M/{\mathbb{Q}}$ with coefficient field $E$, let $H_B^\pm(M)$ be the complex-conjugation eigenspaces of its Betti realization and $d_\pm$ their $E$-dimensions. The periods $c^\pm(M)$ are determinants of the specified comparison maps to de Rham filtration quotients, defined modulo $E^\times$. For a critical integer $n$, neither archimedean factor for $M$ at $n$ nor for $M^\vee$ at $1-n$ has a pole. Put $s=(-1)^n$. The assertion is
  \[
   \frac{L(M,n)}{(2\pi i)^{n d_s}c^s(M)}\in E
   \ \subseteq\ E\otimes_{{\mathbb{Q}}}{\mathbb{C}}\simeq\prod_{\sigma:E\hookrightarrow{\mathbb{C}}}{\mathbb{C}}.
  \]
  The membership is diagonal across all embeddings. The finite $L$-values and compatible realizations are prerequisites; continuation and nonvanishing are not additional conclusions of this period law. The recorded scope fixes the period and sign conventions.
  \par\smallskip\textit{Formulation and concept references:} \href{https://ems.press/content/serial-article-files/46514?nt=1}{[S1]}.

  \subsection{Short English statement}
  After normalization by the predicted periods, do all coefficient-field embeddings of a critical motivic $L$-value arise from one element of that field?
  \subsection{Sources}
  \begin{itemize}
  \item[S1]Kazuki Morimoto, On special values of L-functions for quaternion unitary groups of degree2 and GL(2), Oberwolfach Report22/2014; with Deligne's definitions and twist convention.
  \url{https://ems.press/content/serial-article-files/46514?nt=1}.
  \textit{Formulation source.}
  \item[S2]Factorization of periods, construction of automorphic motives and Deligne's conjecture over CM-fields.
  \url{https://arxiv.org/abs/2509.02303}.
  \textit{Further reference; not a proof endorsement.}
  \item[S3]Motivic pieces of curves: L-functions and periods.
  \url{https://arxiv.org/abs/2601.21934}.
  \textit{Further reference; not a proof endorsement.}
  \end{itemize}
