statement: If $X$ is a smooth variety over $\mathbb C$ and an integrable connection $(E,\nabla)$ has trivial $p$-curvature at every closed point of a nonempty open of definition, must $(E,\nabla)$ have finite monodromy, equivalently be trivialized by a finite étale cover?
