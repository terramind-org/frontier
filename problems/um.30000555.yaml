title: Displacement-Energy Bounds for Bi-Invariant Hamiltonian Metrics
field: mathematics
tier: prose
statement: For every bi-invariant distance $\rho$ on a Hamiltonian group $G$, does there exist $C>0$ such that the displacement energy $e(\rho,B)$ of every symplectic ball $B$ of capacity $a$ satisfies $e(\rho,B)\geq Ca$?
