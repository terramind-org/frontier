statement: "**Heights of slice differentials.** The differentials in the slice spectral sequence for $\\mathrm{BP}^{((G))}\\langle n\\rangle$ look like they are stratified by height. Is it possible to make sense of the height of a differential in the slice spectral sequence of $\\mathrm{BP}^{((G))}\\langle n\\rangle$ so that it has a well defined height?"
