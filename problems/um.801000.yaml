title: Open Problems in Mathematical Logic — Problem 12
field: mathematics
tier: prose
statement: |-
  A Kakeya set $A$ is called *minimal* if every proper subset
  $B\subsetneq A$ is not a Kakeya set.

  Does every Borel Kakeya set $A$ contain a minimal Kakeya set
  $B\subseteq A$?
