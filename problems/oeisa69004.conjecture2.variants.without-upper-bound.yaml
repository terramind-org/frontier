schema: 1
id: oeisa69004.conjecture2.variants.without-upper-bound
title: "Number of times $n^2 + s^2$ is prime for positive integers $s < n$ (variant: without_upper_bound)"
field: mathematics
tier: proof
statement: |-
  The part of the stronger conjecture that survives the counterexample to its upper bound:
  $5 a(n) \ge \pi(n)$ for $n > 1$, together with the three claimed equalities
  $\pi(2) = a(2)$, $\pi(10) = a(10)$ and $a(12) = \pi(12)/5$.
