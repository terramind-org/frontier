lean:
  module: FormalConjectures.OEIS.«69004»
  decl: OeisA69004.conjecture2.variants.without_upper_bound
  statement: |-
    theorem conjecture2.variants.without_upper_bound :
        (∀ n : ℕ, 1 < n → 5 * a n ≥ Nat.primeCounting n) ∧
        Nat.primeCounting 2 = a 2 ∧
        Nat.primeCounting 10 = a 10 ∧
        5 * a 12 = Nat.primeCounting 12
  context:
    - open OeisA69004
    - open OeisA69004.conjecture2
    - open OeisA69004.conjecture2.variants
    - open Finset
  definitions:
    - name: OeisA69004.a
      kind: def
      text: |-
        /-- Number of times $n^2 + s^2$ is prime for positive integers $s < n$. -/
        def a (n : ℕ) : ℕ :=
          ∑ s ∈ Ico 1 n, if (n ^ 2 + s ^ 2).Prime then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/69004.lean#L39
