title: Addition with directed p-power divisibility
field: mathematics
tier: prose
statement: |-
  Let \(p\) be a fixed prime. Define
  \[
  x \mid_p y \Longleftrightarrow \exists s\in \mathbb N,\ y=p^sx.
  \]
  Does \((\mathbb Z,+,\mid_p,0,1)\) have a decidable existential theory?
