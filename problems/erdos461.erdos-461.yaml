        /-- The number $f(n,t)$ of distinct values of $s_t(m)$ for $m \in [n+1, n+t]$. -/
        def f (n t : ℕ) : ℕ :=
          ((Finset.Icc (n + 1) (n + t)).image (smoothComponent t)).card
