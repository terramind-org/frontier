statement: |-
  a) A formation ${\mathfrak{F}}$ of finite groups is
  called *superradical* if it is $S_{n}$-closed and contains
  every finite group of the form $G=AB$ where $A$ and $B$ are $
  {\mathfrak{F}}$-subnormal ${\mathfrak \ F}$-subgroups. Find all superradical local formations.

  [Archived solved part(s) of 14.99:]
  b)
  A formation ${\mathfrak{F}}$ of finite groups is
  called *superradical* if it is $S_{n}$-closed and contains
  every finite group of the form $G=AB$ where $A$ and $B$ are $
  {\mathfrak{F}}$-subnormal ${\mathfrak \ F}$-subgroups.
  Prove that every $S$-closed superradical
  formation is a solubly saturated formation.
