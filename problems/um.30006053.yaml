title: Realization and Classification of Poincaré Duality Four-Complexes
field: mathematics
tier: prose
statement: Given a fundamental triple $(T,w,b)$, determine whether it is realized by a Poincaré-duality $4$-complex or by a manifold. For a realizable triple, determine which classes $b'\in H_4(T;\mathbb Z)$ are realized, and identify the additional data needed beyond the symmetric $2$-type to recover the homotopy type.
