title: Energy Transfer Among Modes in Resonant Evolution
field: mathematics
tier: prose
statement: |-
  For the cubic resonant system

  $$i\frac{d\alpha_n}{d\tau}=\sum_{n+j=k+l}S_{njkl}\overline{\alpha_j}\alpha_k\alpha_l,$$

  how is the conserved energy $E=\sum_{n\geq0}E_n\lvert\alpha_n\rvert^2$ distributed among modes during evolution? In particular, under what conditions does energy flow from low to high modes?
