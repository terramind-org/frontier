title: Problem 6.5 — (The sections problem).
field: mathematics
tier: prose
statement: (The sections problem). Determine those subgroups H ≤ Modg for which π has a section over H. Do this as well with Homeo+(Σg) replaced by various subgroups, such as Diﬀr(S) with r = 1, 2,..., ∞,ω; similarly for the group of area-preserving diﬀeomorphisms, quasiconformal homeomorphisms, etc.. Answers to Problem 6.5 are known in a number of cases. (1) When H is free then sections clearly always exist over H. (2) Sections to π exist over free abelian H, even when restricted to Diﬀ ∞(Σg). This is not hard to prove, given the classification by Birman-Lubotzky-McCarthy [ BLM] of abelian subgroups of Mod g. (3) Sections exist over any finite group H <Modg, even when restricted to Diﬀ ω(Σg). This follows from the Nielsen Realization Conjecture, proved by Kerckhoﬀ [ Ke], which states that any such H acts as a group of automorphisms of some genus g Riemann surface. 2. Some problems on mapping class groups and moduli space 49 (4) In contrast, Morita showed (see, e.g., [ Mo5]) that π does not have a section with image in Diﬀ 2(Σ2) over all of Mod g when g≥ 5. The C2 assumption is used in a crucial way since Morita uses a putative section to build a codimension 2 foliation on the universal curve over Mg, to whose normal bundle he applies the Bott vanishing theorem, contra- dicting nonvanishing of a certain (nontrivial!) Miller-Morita-Mumford class. It seems like Morita’s proof can be extended to finite index subgroups of Mod g. (5) Markovic [ Mar] has recently proven that H = Mod g does not even have a section into Homeo(Σg), answering a well-known question of Thurston. As is usual when one studies representations of a discrete group Γ, one really desires a theorem about all finite index subgroups of Γ. One reason for this is that the existence of torsion and special relations in a group Γ often highly constrains its possible representations. Markovic’s proof in [Mar] uses both torsion and the braid relations in what seems to be an essential way; these both disappear in most finite index subgroups of Mod g. Thus it seems that a new idea is needed to answer the following.
