title: Characterwise Jochnowitz congruences via an integral class-group comparison
field: mathematics
tier: prose
statement: |-
  Let $f$ be a modular form of weight $2$ and let $\chi$ be a character of the class group of an imaginary quadratic number field $K$. Formulate a direct connection
  \[
  L'(f\otimes\theta_\chi,\tfrac12)
  \longleftrightarrow
  L(g\otimes\theta_\chi,\tfrac12),
  \]
  for a modular form $g$ on a definite quaternion algebra with some congruence to $f$.

  The AIM record (workshop *Analytic, arithmetic, and geometric aspects of automorphic forms*, Group Problems 1.1) asks:

  Two clarifications are essential.

  1. The displayed center $s=1/2$ is the unitary automorphic normalization. For a weight-$2$ classical newform,
     \[
     L_{\mathrm u}(s,\pi_f\times\operatorname{AI}_K^{\mathbf Q}\chi)
     =L_{\mathrm{cl}}(s+\tfrac12,f/K,\chi).
     \]
     Thus the same center is $s=1$ in the classical notation used by Bertolini--Darmon and Vigni.
  2. A weight-$2$ form on a definite quaternion algebra is an algebraic automorphic form on a finite double-coset set. Its Jacquet--Langlands transfer is the corresponding classical $\mathrm{GL}_2$ newform. The definite form itself does not have a holomorphic $q$-expansion.

  Here $\operatorname{AI}_K^{\mathbf Q}\chi$ is represented by the weight-$1$ theta series $\theta_\chi$ when the induction is cuspidal. For exceptional characters for which the induction decomposes, the equivalent base-change $L$-function formulation remains the unambiguous one.
