title: Counting Lattice Oval Configurations by Weight
field: mathematics
tier: prose
statement: Let $\Lambda$ be a planar lattice, let $S$ be a closed bounded convex region containing the origin, and set $J(r,P)=\Lambda\cap S(r,P)$ and $N(r,P)=|J(r,P)|$. Up to translation by a lattice vector, how many configurations satisfy $N(r,P)=n$? How many satisfy $N(r,P)\leq N$?
