title: Randomstrasse101 Open Problems (2024) — Problem 6
field: mathematics
tier: prose
statement: Consider synchronization model over $SO(2)$ or synchronization model over a finite group, where the signal $x$ is sampled uniformly over group elements. Find a scaling $L= L_n$ of number of frequencies such that there exists a polynomial-time algorithm that can detect the signal reliably for all $\lambda>\lambda_{\text{comp}, L}$ for some $\lambda_{\text{comp}, L}<1$ as $n\to\infty$.
