title: Kourovka Notebook Problem 6.51
field: mathematics
tier: prose
statement: |-
  Let ${\mathfrak{F}}$ be a local subformation of some formation ${\mathfrak{X}}$ of finite groups and let $\Omega$ be the set of all maximal
  homogeneous ${\mathfrak{X}} $-screens of ${\mathfrak{F}}$. Find a way of
  constructing the elements of $\Omega$ with the help of the maximal
  inner local screen of ${\mathfrak{F}}$. What can be said about the
  cardinality of $\Omega$? For definitions see (L. A. Shemetkov,
  *Formations of finite groups*, Moscow, Nauka, 1978 (Russian)).
