title: Smooth Embeddings of Knot Traces in Homology Four-Spheres
field: mathematics
tier: prose
statement: For the Conway knot $K$, does the complement $S^4\setminus\nu(f(X(K)))$ of an embedded trace admit a smooth structure? Does some smooth integer-homology $4$-sphere contain the trace $X(K)$ of a nonslice knot smoothly? Finally, do there exist homotopy-equivalent closed oriented simply connected smooth $4$-manifolds $X$ and $W$ such that $X(K)$ embeds smoothly in $X$ but not in $W$?
