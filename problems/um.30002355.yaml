title: Local–Global Isotropy over Function Fields
field: mathematics
tier: prose
statement: Let $X$ be an integral scheme on which $2$ is invertible, let $K$ be its function field, and let $\Omega$ be the set of rank-one discrete valuations of $K$. If a nondegenerate quadratic form $q$ over $K$ is isotropic over the completion $K_v$ for every $v\in\Omega$, must $q$ be isotropic over $K$? More specifically, does this local–global principle hold for quadratic forms of dimension at least $5$ over function fields of curves over totally imaginary number fields?
