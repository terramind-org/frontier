title: Semicircle Packings and Colorings of Simplicial 4-Polytopes
field: mathematics
tier: prose
statement: For a plane curve $\gamma$ and $r>0$, let $f_c(r,\gamma)$ be the maximum density of a congruent packing by copies of the Minkowski sum of $\gamma$ and the closed disk of radius $r$. If $\gamma_1$ is a semicircle, is $f_c(r,\gamma_1)=\Theta(\sqrt{r})$? Separately, does every simplicial 4-polytope admit a coloring with a bounded number of colors and no monochromatic 2-face?
