title: Open Problems in Integrable Systems — Integrability and Quantisation
field: mathematics
tier: prose
statement: "[\\'{A}. Pelayo] What information about the principal symbols $f_1,\\ldots, f_n$ of a quantum integrable system $T_{1,\\hbar},\\ldots, T_{n,\\hbar}$ can be detected from their semiclasical joint spectrum? For instance, suppose that we know that a certain object -- say, an integer $z$, or a matrix $A$ -- is a symplectic invariant of $(M, \\omega, f_1,\\ldots, f_n)$. Can we compute this object from the semiclassical joint spectrum?"
