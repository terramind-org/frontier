title: Kourovka Notebook Problem 17.22
field: mathematics
tier: prose
statement: |-
  Suppose $A$ is a group which belongs to a
  variety $\mathbf V$ of groups, and which is embeddable in the full
  symmetric group $S$ on an infinite set. Must the coproduct in
  $\mathbf V$ of two copies of $A$ also be embeddable in $S$?
  (N. G. de Bruijn proved that this is true if $\mathbf V$ is the
  variety of all groups.)
