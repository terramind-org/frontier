title: Distribution of Minimal Rational-Point Heights on Fano Intersections
field: mathematics
tier: prose
statement: |-
  For smooth Fano complete intersections $V/\mathbb Q$ parametrized by $\mathcal V_{d,n}$, let $H(V)$ be the parameter height and $M(V)$ the least height of a rational point. For $0<t<1$, is

  $$\limsup_{A\to\infty}\frac{\#\{V\in\mathcal V_{d,n}:H(V)\leq A,\ M(V)\leq tH(V)\}}{\#\{V\in\mathcal V_{d,n}:H(V)\leq A\}}=O(t)$$

  as $t\downarrow0$?
