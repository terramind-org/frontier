lean:
  module: FormalConjectures.OEIS.«153330»
  decl: OeisA153330.conjecture2
  statement: |-
    theorem conjecture2 :
        indices 1 = {1} ∧
        indices 6 = {2} ∧
        indices 16 = {8} ∧
        indices 3 = {4, 5}
