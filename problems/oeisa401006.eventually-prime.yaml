lean:
  module: FormalConjectures.OEIS.«401006»
  decl: OeisA401006.eventually_prime
  statement: "theorem eventually_prime : ∀ n : ℕ, 2 ≤ n → ReachesPrime n"
  context:
    - open OeisA401006
  definitions:
    - name: OeisA401006.ReachesPrime
      kind: def
      text: |-
        /-- A starting value reaches a prime after finitely many iterations of $a$. -/
        def ReachesPrime (n : ℕ) : Prop :=
          ∃ k : ℕ, ((a^[k]) n).Prime
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/401006.lean#L165
