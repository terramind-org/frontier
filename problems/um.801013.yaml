title: Open Problems in Mathematical Logic — Problem 25
field: mathematics
tier: prose
statement: |-
  Are the following true?

  (1) For any c.e. set $A$, there exists a c.e. set $D\subseteq 2\mathbb{N}$, such that $A\equiv_{rK}D$ and $C(A\upharpoonright n|D\upharpoonright n)=C(D\upharpoonright n|A\upharpoonright n)=O(1)$;

  (2) For all $x$, there is a random $z$ such that $z \geq_{rK} x$ (or $z \geq_K x$).
