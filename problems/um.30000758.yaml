title: Maximal Poisson-Commutative Subalgebras and Flatness
field: mathematics
tier: prose
statement: Let $\mathfrak{q}$ be an algebraic Lie algebra over an algebraically closed field of characteristic zero, let $\ell=\operatorname{ind}\mathfrak{q}$, and set $b(\mathfrak{q})=(\dim\mathfrak{q}+\ell)/2$. Is every maximal Poisson-commutative subalgebra of $S(\mathfrak{q})$ of Krull dimension $b(\mathfrak{q})$? Now suppose the coadjoint representation has the codimension-$2$ property and $Z(\mathfrak{q})$ contains algebraically independent homogeneous elements $f_1,\ldots,f_\ell$ with $\sum_i\deg f_i=b(\mathfrak{q})$. For regular $\xi\in\mathfrak{q}^*$, let $F_\xi(Z(\mathfrak{q}))$ be generated by the $\xi$-shifts of the Poisson center. Is the natural morphism $\pi:\mathfrak{q}^*\to\operatorname{Spec}(F_\xi(Z(\mathfrak{q})))$ flat?
