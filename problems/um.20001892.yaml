title: The quarter-pinching endpoint and a spread obstruction
field: mathematics
tier: prose
statement: |-
  **Question 5.4.1.** Does there exist a closed Riemannian manifold of negative curvature such that \(E^s\) and \(E^u\) are \(C^1\) smooth, but the dimension is \(>2\) and the metric is not \(1/4\)-pinched?

  The record is Question 5.4.1 in Keith Burns and Vladimir Matveev, *Open problems and questions about geodesics*.

  The remainder of the record explains the motivation from Hasselblatt--Wilkinson's perturbative construction and observes that complex hyperbolic space has Lyapunov exponents \(1\) and \(2\), arising from parallel planes of curvature \(-1\) and \(-4\), respectively.

  No mathematical content was silently changed. The following question about typical Lyapunov ratios and the subsequent Pollicott subsection are outside this record.

  There is one important semantic ambiguity. If “\(1/4\)-pinched” means the **strict** inequality, then compact complex-hyperbolic quotients already answer the literal question affirmatively. The only nontrivial reading, and the reading used below, is that “not \(1/4\)-pinched” means worse than the **weak** quarter-pinching bound.
