title: A conductor-aware four-stratum reduction for the double level moment
field: mathematics
tier: prose
statement: |-
  **Asymptotic for second moment of $\mathrm{GL}_2\times\mathrm{GL}_2$ in
  level aspect.** Let $\mathcal B_k(p)$ be a basis for holomorphic or
  Hecke--Maass forms for $\Gamma_0(p)\subset SL_2(\mathbb Z)$ of weight $k$.
  Obtain an asymptotic with a power-saving error term for
  \[
  \sum_{f\in\mathcal B_k(p)}\sum_{g\in\mathcal B_\ell(q)}
  |L(1/2,f\times g)|^2,
  \]
  as the levels $p$ and $q$ become larger, the weights $k$ and $\ell$ being
  fixed.
