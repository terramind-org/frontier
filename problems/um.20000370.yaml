title: Singularities, Fano type, and anticanonical height zeta functions
field: mathematics
tier: prose
statement: "What is the “right” assumption on a variety \\(V\\) for considering height zeta functions? Definitely smooth \\(V\\) with ample anticanonical sheaf \\(\\omega_V^{-1}\\) should be allowed. How about klt (i.e. Kawamata log terminal) \\(V\\)? Or \\(V\\) of Fano type (i.e. there is an effective \\(\\mathbb Q\\)-divisor \\(\\Delta\\) such that \\((V,\\Delta)\\) is ample and \\(-(K_V+\\Delta)\\) is ample)? An example for the latter: a quasi-smooth hypersurface \\(V\\subset \\mathbb P(a_0,\\ldots,a_n)\\) in weighted projective space of degree \\(\\deg(V)<a_0+\\cdots+a_n\\)."
