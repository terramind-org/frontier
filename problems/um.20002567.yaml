id: um.20002567
title: Exact fixed-connectivity inference counts for binary RBMs
field: mathematics
tier: prose
statement: |-
  For a fixed labeled bipartite graph \(G=(V\sqcup H,E)\) defining a binary RBM, count the generic conditional hidden-MAP maps
  \[
  \pi_\theta:\{0,1\}^{V}\longrightarrow\{0,1\}^{H},
  \qquad
  \pi_\theta(v)=\arg\max_h p_\theta(h\mid v),
  \]
  as the biases and the weights on \(E\) vary.
