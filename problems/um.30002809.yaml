title: Saddle Structure of Incorrect Formation Equilibria
field: mathematics
tier: prose
statement: |-
  Let four point agents $p_i\in\mathbb R^2$ obey

  $$\dot p_i=\sum_{j\neq i}e_{ij}(p_j-p_i),\qquad e_{ij}=\lVert p_i-p_j\rVert^2-\bar d_{ij}^{2}.$$

  When the desired shape is a general quadrilateral, or a triangle with the fourth agent in its interior, is every equilibrium with some $e_{ij}\neq0$ a saddle point?
