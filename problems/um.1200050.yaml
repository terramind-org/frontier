title: Some Questions — Question 50
field: mathematics
tier: prose
statement: Let $M$ be the set of measurable real functions, and define $H_f(x,y)=(x,y+f(x))$ and $V_f(x,y)=(x+f(y),y)$. What group is generated by $\{H_f:f\in M\}$ and $\{V_f:f\in M\}$? Is there an $N$ such that every element is a product of at most $N$ such generators?
