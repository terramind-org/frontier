title: Lattice Gases and Antiferromagnetic Potts Models — Question 2
field: physics
tier: prose
statement: |-
  What is the largest complex domain containing $w=0$
  on which $Z(w)$ is zero-free for all graphs of maximum degree $\Delta$?
  [This question has two versions, depending on whether the $w_x$
  are assumed equal or unequal.
  In the latter version, one seeks domains $D$ for which $Z(w) \neq 0$
  whenever $w_x \in D$ for all $x$;
  but there need not exist a unique maximal such domain.]
