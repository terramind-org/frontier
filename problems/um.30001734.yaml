title: Local Gross–Prasad Multiplicity for Orthogonal Groups
field: mathematics
tier: prose
statement: For generic $\phi\in\Phi^{\mathrm{orth}}(d)$ and $\phi'\in\Phi^{\mathrm{orth}}(d-1,\delta)$, is there exactly one pair $(\pi,\sigma)$ in the corresponding orthogonal-group $L$-packets with multiplicity $m(\pi,\sigma)=1$, with every other pair having multiplicity zero?
