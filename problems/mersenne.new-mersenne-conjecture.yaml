schema: 1
id: mersenne.new-mersenne-conjecture
title: Conjectures about Mersenne primes (new_mersenne_conjecture)
field: mathematics
tier: proof
statement: |-
  For any odd natural number `p` if two of the following conditions hold,
  then all three must hold:
  1. $2^p-1$ is prime
  2. $(2^p+1)/3$ is prime
  3. Exists a number `k` such that $p = 2^k \\pm 1$ or $p = 4^k \\pm 3$
