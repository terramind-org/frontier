title: Kourovka Notebook Problem 17.121
field: mathematics
tier: prose
statement: |-
  Let $ G $ be a group whose set of elements is
  the real numbers and which is ``nicely definable'' (see below).
  Does
  $ G $ being $ { \aleph_\omega} $-free
  imply it being free if ``nicely definable'' means

  a) being $ F_ \sigma $?

  b) being Borel?

  c) being analytic?

  d) being projective $ {\mathbb{L} [ {\mathbb{R} ]
  $?

  See https://arxiv.org/pdf/math/0212250.pdf for justification of the
  restrictions.
