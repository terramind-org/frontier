title: Kourovka Notebook Problem 17.26
field: mathematics
tier: prose
statement: |-
  Are the classes of right-orderable and right-ordered groups closed
  under taking solutions of equations
  $w(a_1,\dots,a_k,x_1,\dots,x_n)=1$? (Here the closures are under
  group embeddings and order-preserving embeddings, respectively.)
  This is true for equations with a single constant, when $k=1$
  (*J. Group Theory*, **11** (2008), 623--633).
