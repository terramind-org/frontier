lean:
  module: FormalConjectures.Wikipedia.EllipticCurveRank
  decl: EllipticCurveRank.RatEllipticCurve.half_rank_zero_and_half_rank_one
  statement: |-
    theorem half_rank_zero_and_half_rank_one (r : ℕ) (hr : r = 0 ∨ r = 1) :
        atTop.Tendsto
          (fun H ↦ ({E ∈ heightLE H | E.rank = r}.ncard / (heightLE H).ncard : ℝ)) (𝓝 (1 / 2))
  context:
    - open EllipticCurveRank
    - open EllipticCurveRank.RatEllipticCurve
    - open Module (finrank)
    - open WeierstrassCurve
    - open scoped Topology
    - open Filter (atTop)
  definitions:
    - name: EllipticCurveRank.RatEllipticCurve.rank
      kind: abbrev
      text: |-
        /-- The rank of an elliptic curve over ℚ. -/
        noncomputable abbrev rank (E : RatEllipticCurve) : ℕ := finrank ℤ E.toWeierstrass.Point
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L78
    - name: EllipticCurveRank.RatEllipticCurve.heightLE
      kind: def
      text: |-
        /-- The set of elliptic curves over ℚ with naïve height less than or equal to a given height. -/
        def heightLE (H : ℕ) : Set RatEllipticCurve := {E : RatEllipticCurve | E.naiveHeight ≤ H}
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L91
