schema: 1
id: ellipticcurverank.ratellipticcurve.half-rank-zero-and-half-rank-one
title: Some conjectures about ranks of elliptic curves over ℚ (half_rank_zero_and_half_rank_one)
field: mathematics
tier: proof
statement: |-
  Conjecture by Goldfeld and Katz–Sarnak: if elliptic curves over ℚ are ordered by their
  heights, then 50% of the curves have rank 0 and 50% have rank 1.
  See p. 28 of https://people.maths.bris.ac.uk/~matyd/BSD2011/bsd2011-Bhargava.pdf.
ams:
  - 11
  - 14
tags:
  - wikipedia
