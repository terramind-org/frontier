title: Analysis of Boolean Functions — Gotsman--Linial Conjecture
field: computer-science
tier: prose
statement: Among degree-$k$ polynomial threshold functions $f \colon \{-1,1\}^n \to \{-1,1\}$, the one with maximal total influence is the symmetric one $f(x) = \operatorname{sgn}(p(x_1 + \cdots + x_n))$, where $p$ is a degree-$k$ univariate polynomial which alternates sign on the $k+1$ values of $x_1 + \cdots + x_n$ closest to $0$.
