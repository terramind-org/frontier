title: Limit Cycles and Zeros of Abelian Integrals
field: mathematics
tier: prose
statement: For the polynomial perturbation of a planar Hamiltonian system with ovals $\{\gamma_h\}$ and Abelian integral $I(h)=\oint_{\gamma_h}(f(x,y)\,dy-g(x,y)\,dx)$, how many periodic orbits of the unperturbed system persist or bifurcate as periodic orbits of the perturbed system for small $\varepsilon$?
