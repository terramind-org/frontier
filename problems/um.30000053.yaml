title: Random-Order Discrepancy Bounds for Lattice Point Sets
field: mathematics
tier: prose
statement: Prove for shifted lattice point sets $M_n$ a star-discrepancy bound $\operatorname{disc}_\infty(M_n)\leq C\sqrt{d/n}$, or a comparably sharp bound of the same order as the probabilistic bound for unrestricted $n$-point sets.
