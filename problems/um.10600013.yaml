title: Virtual-knot problem 13 — Khovanov Homology
field: mathematics
tier: prose
statement: |-
  Khovanov Homology: Construct a generalization of the Khovanov
  complex for the case of virtual knots that will work for arbitrary
  virtual diagrams. Investigate the Khovanov homology constructed
  in . The main construction in this approach uses
  an orientable atom condition to give a Khovanov homology over the
  integers for large classes of virtual links. The import of our
  question, is to investigate this structure and to possibly find a
  way to do Khovanov homology for all virtual knots over the ring of
  integers. Similar questions can be raised for the presently evolving
  new classes of Khovanov homology theories related to other quantum
  invariants (cf. ).

  By a K-full virtual knot we mean a knot for which there exists
  a diagram such that the leading (the lowest, or both) term comes
  from the $B$-state. Analogously, one defines the Kho-full knot
  relative to the Khovanov invariant. Call such diagrams optimal
  diagrams. (It is easy to find knots which are neither K-full nor
  Kho-full.)

  Classify all K-full (Kho-full) knots.

  Are optimal diagrams always minimal with respect to the number of
  classical crossings?

  Classify all diagram moves that preserve optimality.

  Is it true that if a classical knot $K$ has minimal classical
  diagram with $n$ crossings then any virtual diagram of $K$ has at
  least $n$ classical crossings?

  Can any virtual knot have torsion in the $B$-state of the Khovanov
  homology (the genuine leading term of some diagram)? Here we use the
  formulation of Khovanov homology given in .

  The behaviour of the lowest and the leading term of the Kauffman
  bracket for virtual knots was studied in
  and and .
