title: "Henon Maps: Open Problems — Question 39"
field: mathematics
tier: prose
statement: |-
  Suppose $f$ is a polynomial automorphism of $\mathbb{C}^d$ satisfying $\lambda(f)=1$.
  Is it true that $\deg(f^n) \asymp n^k$ for some $k \in \mathbb{N}$? Moreover,
  if $k\ge 1$, does $f$ preserve a rational fibration?
