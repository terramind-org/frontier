title: Foliations and Diffeomorphism Groups — Question 28
field: mathematics
tier: prose
statement: |-
  Hirsch and Thurston [hirsch1975foliated] proved that the Euler class of amenable actions on spheres $**S**^{2n-1}$ should vanish. This is interesting because now using bounded cohomology techniques, we know a non-constructive proof that the Euler class for flat $**S**^{2n-1}$ bundles when $n>1$ is unbounded. However, by Hirsch-Thurston, it vanishes when the holonomy is amenable.

  How can one explain this phenomenon that the Euler class in $H^{2n}(\mathrm{Homeo}_0(**S**^{2n-1}))$ is unbounded but it vanishes on amenable subgroups? Is it a ``hyperbolic" class in the sense of Gromov (see [brunnbauer2024atoroidal])? Could it be that there is non-trivial bounded Euler class in $H^{2n}(\mathrm{Homeo}^{\text{vol}}_0(**S**^{2n-1}); \mathbb{R})$ where $\mathrm{Homeo}^{\text{vol}}_0(**S**^{2n-1})$ means the volume preserving homeomorphisms of the sphere $**S**^{2n-1}$?
