title: A monotone special case of marked-length rigidity
field: mathematics
tier: prose
statement: |-
  **Conjecture 5.1.1 ([Bur-Kat1985]).** Two metrics with negative curvature on a compact manifold must be isometric if they have the same marked length spectrum.

  Croke and Otal showed that this conjecture is true for metrics on surfaces [Otal1990, Croke1990]. Indeed it is enough to assume that the metrics have non-positive curvature. The problem is open in higher dimensions. Hamenst¨ adt showed that the geodesic flows of the two metrics must be C0-conjugate, thereby reducing the problem to

  Conjecture 5.2.1 in the next subsection [Hamenstädt1991].
