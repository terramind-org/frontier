title: Even-dimensional knotted tori and two isotopy reductions
field: mathematics
tier: prose
statement: "**Question 1.20.** (a) If \\(L\\subset T^*\\Sigma_g\\) is a Lagrangian that is homologous to the \\(0\\)-section, and \\(g>1\\), must \\(L\\) be Lagrangian isotopic to the \\(0\\)-section? (This is now known for \\(g=0\\) and \\(g=1\\) by the works of Richard Hind and Alex Ivrii respectively.) (b) Is there a Lagrangian \\(T^n\\subset\\mathbb R^{2n}\\) which is not Lagrangian isotopic to the Clifford torus when \\(n>2\\)? The answer is no for \\(n=2\\) by Ivrii. However current holomorphic curve techniques do not seem applicable to higher \\(n\\). We do not even know: (c) Are there any local Lagrangian knots in \\(\\mathbb R^{2n}\\) for \\(n>2\\), i.e. Lagrangian submanifolds that are asymptotic to a Lagrangian \\(n\\)-plane but not Lagrangian isotopic to one? (Eliashberg and Polterovich showed that the answer is no when \\(n=2\\).)"
