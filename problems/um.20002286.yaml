title: Pole-support containment at primes above 1 modulo 4
field: mathematics
tier: prose
statement: |-
  Let \(K\) be a number field. Does there exist an \(\exists\)-formula \(\delta(x,y)\) such that

  \[
  \delta(a,b)\Longleftrightarrow
  (\text{for every }p\text{ above a prime }1\bmod 4)
  (v_p(a)<0\Longrightarrow v_p(b)<0)?
  \]

  This is known (more or less) for \(K=\mathbb Q\) for primes \(3\bmod 4\). A positive answer would imply existential definability of \(\mathbb Z\) in \(\mathbb Q\), hence a negative answer to HTP over \(\mathbb Q\).
