title: Graph Classes with Recursive Chromatic-Polynomial Algorithms
field: mathematics
tier: prose
statement: Characterize, by simple properties or forbidden minors, the graphs whose chromatic polynomials can be computed efficiently by recursively passing to complements. The desired family includes graphs of bounded treewidth and graphs whose complements have bounded treewidth.
