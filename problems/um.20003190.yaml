title: Complex-structure dependence of cyclotomic Hitchin loci
field: mathematics
tier: prose
statement: |-
  **Question 5.1 (Oscar García-Prada).** The cyclic group of order \(n\)
  acts on the Hitchin component of
  \(\operatorname{Rep}(\pi_1(S),\operatorname{SL}(n,\mathbb R))\)
  (multiply the Higgs field by roots of unity). Call the subspace of
  \(\mathbb Z/n\mathbb Z\)-invariant Higgs fields “cyclotomic Higgs
  fields,” which are in one-to-one correspondence with
  \(H^0(S,K^n)\). Is this space independent of the complex structure on
  \(S\)?
