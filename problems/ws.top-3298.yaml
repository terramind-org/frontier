  \section{Unions of triangle free graphs}\label{3298}
  {\small\sffamily UnsolvedMath ID 3298 · Graph Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A graph is $K_4$-free if no four vertices are pairwise adjacent. A spanning subgraph is triangle-free if it contains no three pairwise adjacent vertices. Here $\aleph_0$ is the cardinality of the natural numbers; graph cardinalities are unrestricted.
  \paragraph{Statement recorded in the supplied source.}
  Is there a $K_4$-free graph $G=(V,E)$ such that no sequence of triangle-free spanning subgraphs $(V,E_1),(V,E_2),\ldots$ satisfies $E=\bigcup_{j\geq1}E_j$? Equivalently, is there such a graph with no countable edge-colouring in which every triangle uses at least two colours? \sref{3298}{2}
  \subsection{Short English statement}
  Does some graph without a four-clique resist every countable cover of its edges by triangle-free subgraphs?
