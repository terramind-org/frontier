title: A transfer principle and the full Banach range for lacunary rotation-coupled circle averages
field: mathematics
tier: prose
statement: |-
  On the plane \(\mathbb R^2\), let \(R:S^1\to S^1\) be rotation by \(\pi/3\). Prove, for certain \(p,q,r\),
  \[
  \left\|\sup_{t>0}\left|\int_{S^1}f(x-tw)g(x-tR w)\,d\sigma(w)\right|\right\|_{L^r(\mathbb R^2)}
  \lesssim \|f\|_{L^p(\mathbb R^2)}\|g\|_{L^q(\mathbb R^2)}. \tag{0.7}
  \]
  During the workshop, this was shown to be equivalent to proving
  \[
  \left\|\sup_{t>0}\left|\int_{S^1}f(x-tw)g(x+tw)\,d\sigma(w)\right|\right\|_{L^r(\mathbb R^2)}
  \lesssim \|f\|_{L^p(\mathbb R^2)}\|g\|_{L^q(\mathbb R^2)}. \tag{0.8}
  \]
