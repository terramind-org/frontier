title: AGNES Open Problems in Algebraic Geometry — Q8
field: mathematics
tier: prose
statement: |-
  Prove the Katz-Klemm-Vafa conjecture for in all genera and
  in all classes on $K3$ surfaces.

  A solution to **Q8** would provide a large class
  of exact formulas for higher genus Gromov-Witten invariants of
  compact Calabi-Yau 3-folds. Unlike the local toric cases,
  mathematical results for higher genus Gromov-Witten invariants
  have been difficult to obtain, see [zing] for the genus 1
  theory of the quintic 3-fold.
