lean:
  module: FormalConjectures.ErdosProblems.«86»
  decl: Erdos86.erdos_86
  statement: |-
    theorem erdos_86 :
        ∀ ε : ℝ, 0 < ε → ∀ᶠ n : ℕ in atTop, ∀ H : SimpleGraph (Fin n → Bool),
          H ≤ hypercube n →
            (1 / 2 + ε) * n * 2 ^ (n - 1 : ℕ) ≤ (H.edgeSet.ncard : ℝ) →
              cycleGraph 4 ⊑ H
  context:
    - open Erdos86
    - open Filter SimpleGraph
  definitions: []
