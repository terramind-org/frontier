title: Morava K- and E-theory 9 — One of the corollaries of the Hopkins-Miller theorem, together with the Devinatz-Hopkins fixed point b…
field: mathematics
tier: prose
statement: One of the corollaries of the Hopkins-Miller theorem, together with the Devinatz-Hopkins fixed point business, is that the famous class zeta in continuous H^1 of the stabilizer group survives to give a class in homotopy of degree -1. This is trivial at large primes, where the spectral sequence collapses, but at small primes it was not known. The chromatic splitting conjecture asserts that there should be other such classes, in degree -3, -5,...,-2n+1, so presumably in continuous H^3, H^5,...,H^2n-1 of S with trivial coefficients. Find these classes, and see if Hopkins-Miller allows you to determine that they survive to homotopy classes at all primes.
