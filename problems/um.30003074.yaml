title: Combinatorial Invariance of Strong Lefschetz Properties
field: mathematics
tier: prose
statement: Suppose $I=(\ell_1^b,\ldots,\ell_{2b+1}^b)$ is minimally generated and has the Strong Lefschetz Property at range 2 in degree $b-2$. If $J=(h_1^b,\ldots,h_{2b+1}^b)$ is minimally generated and the arrangements defined by the $\ell_i$ and $h_i$ have the same combinatorics, must $J$ also have the Strong Lefschetz Property at range 2 in degree $b-2$?
