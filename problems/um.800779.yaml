title: Local Discrete Holomorphic Dynamics — Open Problem Q2
field: mathematics
tier: prose
statement: |-
  *What is the dynamical structure of $(K_f,f)$?*

  For instance, what is the asymptotic behavior of the orbits? Do
  they converge to $p$, or have they a chaotic behavior? Is there a dense
  orbit? Do there exist proper $f$-invariant subsets, that is sets
  $L\subset K_f$ such that $f(L)\subseteq L$? If they do exist, what is the
  dynamics on them?

  To answer all these questions, one of the most efficient ways is to replace $f$ by a
  dynamically equivalent but simpler (e.g., linear) system $g$. In our context,
  ``dynamically equivalent" means ``locally conjugated"; and we have different
  kinds of conjugacy to consider.

  \begin{definition}
  Let $f_1\colon U_1\to M_1$ and $f_2\colon U_2\to M_2$ be two holomorphic local
  dynamical systems at $p_1\in M_1$ and $p_2\in M_2$ respectively. We shall say
  that $f_1$ and $f_2$ are *holomorphically* (respectively, *smoothly,* $C^k$ with
  $k\in\mathbb{N}^*$, or *topologically*) *locally conjugated* if there are open neighbourhoods
  $W_1\subseteq U_1$ of $p_1$, $W_2\subseteq U_2$ of $p_2$, and a
  biholomorphism (respectively, a $C^\infty$ diffeomorphism, a $C^k$ diffeomorphism, or a homeomorphism) $\varphi\colon W_1\to W_2$ with
  $\varphi(p_1)=p_2$ such that
  $$
  f_1=\varphi^{-1}\circ f_2\circ\varphi
  $$
  on $\varphi^{-1}\bigl(
  W_2\cap f_2^{-1}(W_2)\bigr)=W_1\cap f_1^{-1}(W_1)$.
  \end{definition}

  If $f_1\colon U_1\to M_1$ and $f_2\colon U_2\to M_2$ are locally conjugated we clearly have
  $$
  K_{f_2|_{W_2}}=\varphi(K_{f_1|_{W_1}})\;;
  $$
  so the local dynamics of $f_1$
  about $p_1$ is to all purposes equivalent (up to the order of smoothness of the local
  conjugation) to the local dynamics of $f_2$
  about $p_2$.

  In particular, using local coordinates centered at $p\in M$ it is easy to show that any
  holomorphic local dynamical system at $p$ is holomorphically locally conjugated
  to a holomorphic local dynamical system at $O\in\mathbb{C}^n$, where $n=\dim M$;
  so from now on we shall mostly work only with $\mathop\mathrm{End}\nolimits(\mathbb{C}^n,O)$.

