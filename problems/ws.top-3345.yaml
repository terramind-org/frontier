statement: |-
  \section{MacEachen Conjecture}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $p_1=2,p_2=3,\ldots$ be the primes in increasing order and $P_j=\prod_{i=1}^j p_i$ their primorials. Let $\mathcal S=\{\prod_{j\in J}P_j:J\subseteq\mathbb N\text{ finite}\}$, with the empty product equal to $1$; each primorial may occur at most once. This is OEIS A129912. Two integers are adjacent when their absolute difference is $1$. The author-confirmed distance restriction is included as in the OEIS comment.
  \paragraph{Statement recorded in the supplied source.}
  For every odd prime $p$, does there exist $s\in\mathcal S$ such that either $|p-s|=1$, or $|p-s|$ is a prime $q<p$? \sref{statement}{2} \sref{statement}{3}
  \subsection{Short English statement}
  Is every odd prime within distance one, or within a smaller prime distance, of a product of distinct primorials?
  \subsection{Sources}
