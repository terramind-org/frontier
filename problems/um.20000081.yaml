title: Adjacent-power compression and gap states for nested full twists
field: mathematics
tier: prose
statement: |-
  There is a commutative family of braids built as products of
  \(\mathrm{FT}_k\), the full twist on the first \(k\) strands, for
  \(k\leq n\). Are the positive products in this family parity? If so, find a
  (recursive) formula for \(\mathrm{HHH}\).
