title: Dissipative Noether Theory and Quantum Fluid Energies
field: mathematics
tier: prose
statement: For the two energy functionals arising from the dissipative variational formulation of quantum fluid dynamics, are there other transformations yielding new energy functionals, how can a dissipative Noether theory be developed on the space of measures, can the theory be applied to classical fluid dynamics and identify models with several energies, and can it lead to an optimal-transport formulation of quantum mechanics?
