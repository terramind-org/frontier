title: Clique Minors in Graphs Excluding a Fixed Subgraph
field: mathematics
tier: prose
statement: For which graphs $F$ does there exist $c(F)>0$ such that every graph $G$ with no subgraph isomorphic to $F$ contains a clique minor of order at least $\chi(G)^{1+c(F)}$?
