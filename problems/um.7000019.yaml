title: Geometry of Curves and Surfaces — Problem 4.3
field: mathematics
tier: prose
statement: LetS⊂ R3 be a closed surface of diameter d. Suppose that there exists a constant h < dso that whenever a pair of planes separated by a distance of h intersect S, the area of S contained between these planes is constant. Does it then follow that S is a sphere?
