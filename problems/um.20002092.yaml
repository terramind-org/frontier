title: Hurwitz stabilizers and open-book centralizers
field: mathematics
tier: prose
statement: |-
  Question 1.34. Auroux discussed how, roughly, a certain subgroup of the
  braid group gives automorphisms of a symplectic Lefschetz pencil, asked
  whether we can do something like this with open books or contact pencils,
  and in connection with this explained how Giroux's question (a) above has a
  positive answer in a certain precise case.

  [The following is from the notes of John Etnyre and David Farris, since I
  wasn't there.]
