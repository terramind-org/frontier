title: A level-cover ramification budget for rational and affine coarse curves in M_g
field: mathematics
tier: prose
statement: |-
  Does the coarse moduli space \(M_g\) contain a \(\mathbf P^1\)? An
  \(\mathbf A^1\)? It is known that the moduli stack in this case is
  algebraically hyperbolic, but the same is not likely to be true for the
  moduli space.

  Does the coarse moduli space \(M_g\) contain a \(\Pro^1\)? An
  \(\A^1\)? It is known that the moduli stack in this case is algebraically
  hyperbolic, but the same is not likely to be true for the moduli space.
