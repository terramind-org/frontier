title: Hausdorff Absolute Continuity of PDE-Constrained Measures
field: mathematics
tier: prose
statement: |-
  Let

  $$A=\partial_{x_1}^3+\partial_{x_2}^3+\partial_{x_3}^3.$$

  If a real Radon measure $\mu$ on $\mathbb R^3$ satisfies $A\mu=0$ distributionally, must $\mu\ll\mathcal H^2$?
