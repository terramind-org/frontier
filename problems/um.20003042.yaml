title: One sliceness problem resolved and an equivariant half-surgery reduction for the remaining knot cases
field: mathematics
tier: prose
statement: |-
  Difficult sliceness problems

  Are any of the following slice?
  1. The $(2,1)$ cable of the figure-eight knot.
  2. The positive Whitehead double of any left-handed torus knot.
  3. The positive Whitehead double of the figure-eight knot.
  4. The $(+,+,-)$ Whitehead double of the Borromean rings.
