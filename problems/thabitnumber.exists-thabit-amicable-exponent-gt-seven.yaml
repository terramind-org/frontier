lean:
  module: FormalConjectures.Wikipedia.ThabitNumber
  decl: ThabitNumber.exists_thabit_amicable_exponent_gt_seven
  statement: |-
    theorem exists_thabit_amicable_exponent_gt_seven :
        ∃ n > 7, (thabitNumber (n - 1)).Prime ∧ (thabitNumber n).Prime ∧
          (9 * 2 ^ (2 * n - 1) - 1).Prime
  context:
    - open ThabitNumber
  definitions:
    - name: ThabitNumber.thabitNumber
      kind: def
      text: |-
        /-- The $n$-th **Thabit number** of the first kind, $K_n = 3 \cdot 2^n - 1$
        ([OEIS A055010](https://oeis.org/A055010)). -/
        def thabitNumber (n : ℕ) : ℕ := 3 * 2 ^ n - 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/ThabitNumber.lean#L45
