  \item[\hypertarget{source:statement:2}{S2}] Pavlo Savchuk, Constructing Optimal Kobon Triangle Arrangements via Table Encoding, SAT Solving, and Heuristic Straightening (2026 version of 2025 preprint). Sections 1 and 2.1–2.2, pp. 1–3. \url{https://arxiv.org/pdf/2507.07951}.
