title: Perfectness of Grothendieck's Component-Group Pairing
field: mathematics
tier: prose
statement: |-
  Let $K$ be a complete discrete valuation field with perfect residue field of characteristic $p>0$, and let $A$ and $B$ be dual abelian varieties with Néron special fibers $A_x$ and $B_x$. Is the canonical pairing
  $$
  \pi_0(A_x)\times\pi_0(B_x)\longrightarrow\mathbb Q/\mathbb Z
  $$
  perfect?
