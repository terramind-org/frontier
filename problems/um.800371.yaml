title: Coxeter Groups and Unimodality — Conjecture 9
field: mathematics
tier: prose
statement: |-
  So, knowledge of the $ \widetilde{R}$-polynomials is equivalent to knowledge of
  the $R$-polynomials. Combinatorial interpretations of the polynomials
  $\{ \widetilde{R}_{u,v}(t) \}_{u,v \in W}$ have been given in [DeoInv] and
  [Dye93], see [BB, Thms 5.3.4 and 5.3.7].
  It is easy to see that, if $u \leq v$, then $deg( \widetilde{R}_{u,v})=\ell(u,v)$ and the powers
  appearing in $ \widetilde{R}_{u,v}(t)$ are all of the same parity. More precisely,
  there is a polynomial $Q_{u,v}(t) \in \mathbb{N}[t]$ such that $ \widetilde{R}_{u,v}(t)=
  Q_{u,v}(t^2)$ if $\ell(u,v) \equiv 0 \pmod{2}$ and $ \widetilde{R}_{u,v}(t)=
  t Q_{u,v}(t^2)$ if $\ell(u,v) \equiv 1 \pmod{2}$. It is of interest to
  characterize the $R$-polynomials. In this respect I propose the following conjecture
  which is a generalization of [BreDM, Conj. 7.1].

  Let $(W,S)$ be a finite Coxeter system and $u,v \in W$, $u \leq v$. Then the polynomial
  $Q_{u,v}(t)$ is log-concave.
