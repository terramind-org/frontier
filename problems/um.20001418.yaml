title: Quotient height versus arithmetic orbit height
field: mathematics
tier: prose
statement: |-
  **Moduli height.** Let \(X\) be a quasi-projective variety and \(G\) a group action on \(X\). Let \(Y=X//G\) be a geometric quotient of \(X\) by \(G\). Is
  \[
  h_Y(x)\asymp \min_{g\in G}h_X(gx)?
  \]
  (ample heights)

  In particular, fix an embedding \(M_d\subset\mathbb P^M\). Then define a height \(h_M:M_d\to\mathbb R\) using the embedding. Is this height function comparable to the minimum height of the maps in the class in \(\operatorname{Rat}_d\)?
