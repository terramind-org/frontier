statement: |-
  $\mathsf{S}_1(\Omega,\Gamma)$, $\mathsf{S}_1(\Omega,\Omega)$, and $\mathsf{S}_{\mathrm{fin}}(\Omega,\Omega)$ are the
  only properties in the open case which are preserved under taking finite powers
  [coc2].

