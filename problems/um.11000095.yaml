title: Conjecture — Every subgroup of finite index in ModS contains a congruence subgroup.
field: mathematics
tier: prose
statement: Every subgroup of finite index in ModS contains a congruence subgroup. V. Voevodsky had indicated (in a personal communication) a beautiful application of this conjecture. Namely, the conjecture implies that a smooth algebraic curve over Q is determined up to an isomorphism by its algebraic fundamental group (which is isomorphic to the profinite completion of π1(S)) considered together with the natural action of the absolute Galois group Gal(Q/Q) on it. This corollary was apparently first conjectured by A. Grothendieck. I am not aware of any publication where this conjecture of Grothendieck is deduced from the solution of the congruence subgroup problem for the mapping class groups. The Grothendieck conjecture itself was proved by S. Mochizuki [ Mo1] after the initial work by A. Tamagawa [ T am]. See also [Mo3] and the expository accounts by S. Mochizuki [ Mo2] and G. Faltings [ F]. The proof of the Grothendieck conjecture lends some additional credibility (beyond the analogy with the classical congruence-subgroup problem) to the above congruence-subgroup conjecture.
