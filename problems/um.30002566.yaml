id: um.30002566
title: Uniform Sum-of-Squares Multipliers on Real Projective Curves
field: mathematics
tier: prose
statement: Let $X$ be an irreducible nondegenerate real projective curve with dense real points, and fix an even degree $2s$. Find an explicit integer $k$, depending only on $s$ and invariants of $X$, such that every nonnegative degree-$2s$ form $p$ on $X$ has a sum-of-squares multiplier $q$ of degree $2k$ for which $pq$ is a sum of squares of degree $2s+2k$.
