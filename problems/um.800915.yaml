title: AGNES Open Problems in Algebraic Geometry — Q3
field: mathematics
tier: prose
statement: |-
  Prove the Virasoro constraints in case $X$ is an Enriques surface.

  A study of the Gromov-Witten theory of the Enriques surface,
  closely related to modular forms, has been started in
  [mp2]. The Enriques surfaces
  is perhaps the most basic variety where new techniques are
  required to establish the Virasoro constraints.
