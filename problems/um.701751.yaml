title: Kourovka Notebook Problem 20.93
field: mathematics
tier: prose
statement: |-
  A group $G$ is called a *Shunkov group* if for any finite subgroup $H\leq G$ any two conjugate elements of prime order in $N_G(H)/H$ generate a finite subgroup. Are the following well-known results of the theory of finite groups true in the class of (periodic) Shunkov groups?

  a) The Baer--Suzuki theorem (see 11.11 in Archive).

  b) The Burnside--Brauer--Suzuki theorem on the existence of a normal section of order 2 in a group with a non-trivial Sylow 2-subgroup containing only one involution (see 4.75).

  c) Glauberman's $Z^*$-theorem (see 10.62 and Archive, 11.13).
