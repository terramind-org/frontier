title: Complete Integral Closures of Total Blow-Up Rings
field: mathematics
tier: prose
statement: Let $(R, v)$ be a valuation domain (or local Noetherian domain dominated by a valuation $v$), and let $S = B_\infty(R, v)$ be the total blow-up ring obtained as the union of the local blow-ups of $R$ along $v$. Is the complete integral closure of $S = B_\infty(R, v)$ always a valuation ring?
