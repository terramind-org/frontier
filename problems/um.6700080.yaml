title: "Scalar Curvature Question [?82]: C0-ContinuousGuth-GerochLowerVolume Bound for Balls in the Coverings of Essential Manifolds"
field: mathematics
tier: prose
statement: Conjecture. C0-ContinuousGuth-GerochLowerVolume Bound for Balls in the Coverings of Essential Manifolds. [57]. The universal coverings ˜X of Q-essential n-manifolds X with continuous Riemannian metrics containR-balls ˜B(R) of all radii R> 0 such that vol( ˜B(R)) ≥vol(Bn Eucl(R)). The main justiﬁcation for5 is the following rough version of it. Corollary to Guth’ Mesoscopic Filling Radius Theorem [55, 57]. The universal coverings ˜X of Q-essential Riemanniannmanifolds X containR-balls ˜B(R) of all radiiR> 0 such that vol( ˜B(R)) ≥εnvol(Bn Eucl(R)) for some universal constantεn > 0. (d) The sharp bound here, i.e. withεn = 1 is available forlarge balls by the following result. Burago-Ivanov Asymptotic Ball Volume Theorem[21].68 If the universal cover ˜X of an Q-essential manifold X admits a sequence of balls ˜B(Ri) ⊂ ˜X,Ri →∞, (where Ri depend on the metric inX), such that vol( ˜B(Ri)) ≤vol(Bn Eucl(Ri)), then X is ﬂat. 68This paper is aboutX homeomorphic Tn; the general case reduces to that by the classiﬁcation of groups of polynomial growth. 82 (e) The Burago-Ivanov argument automatically extends tononRiemannian manifolds and pseudomanifolds (X,dist) with arbitrarymetricsandsuitablydeﬁned"volumes"onthem, namely Hilbert volumes Hilbert-volume (see [46]). (These "volumes" are not, a priori, additive.) Guth’ theorem also remains valid for all(X,dist, Hilbert-volume) which motivates the following.
