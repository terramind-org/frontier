  module: FormalConjectures.Wikipedia.EulerBrick
  decl: EulerBrick.four_dim_euler_brick_existence
  statement: |-
    theorem four_dim_euler_brick_existence :
        ∃ sides : Fin 4 → ℕ+, IsEulerHyperBrick 4 sides
  context:
    - open EulerBrick
  definitions:
    - name: EulerBrick.IsEulerHyperBrick
      kind: def
      text: |-
        /--
        Generalization of an Euler brick to $n$-dimensional space.
        -/
        def IsEulerHyperBrick (n : ℕ) (sides : Fin n → ℕ+) : Prop :=
          Pairwise fun i j ↦ IsSquare ((sides i)^2 + (sides j)^2)
