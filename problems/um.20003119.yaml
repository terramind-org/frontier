title: The Thurston metric on the punctured-torus plane
field: mathematics
tier: prose
statement: |-
  **Problem 5.1.** What is Thurston metric on \(\mathbb H^2\), viewed as the
  Teichmüller space of punctured tori?

  Belkhirat, Papadopoulos and Troyanov have studied the Thurston metric on
  Teichmüller space of flat tori.
