  module: FormalConjectures.OEIS.«37274»
  decl: OeisA37274.home_prime_conjecture
  statement: "theorem home_prime_conjecture : ∀ n : ℕ, 2 ≤ n → ReachesPrime n"
  context:
    - open OeisA37274
  definitions:
    - name: OeisA37274.ReachesPrime
      kind: def
      text: |-
        /-- A starting value reaches a prime after finitely many prime-factor splicing steps. -/
        def ReachesPrime (n : ℕ) : Prop :=
          ∃ k : ℕ, ((primeFactorSplice^[k]) n).Prime
