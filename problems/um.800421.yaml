title: Open Problems in Arithmetic Dynamics — Conjecture 44
field: mathematics
tier: prose
statement: |-
  Let $f:\mathbb{P}^N\dashrightarrow\mathbb{P}^N$ be a dominant rational map defined
  over $\mathbb{F}_q$.
  \begin{parts}

  (a)
  $\mathbb{P}^N(\bar\mathbb{F}_q)_f$ is Zariski dense in $\mathbb{P}^N$.

  (b)
  $\displaystyle
  \lim_{k\to\infty} \#\mathbb{P}^N(\mathbb{F}_{q^k})_f/\#\mathbb{P}^N(\mathbb{F}_{q^k}) = 1.
  $
  \end{parts}
