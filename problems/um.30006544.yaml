title: Height Bounds for Ideals in Finite Posets
field: mathematics
tier: prose
statement: |-
  For every ideal $A$ of a finite poset, is

  $$\max_{x\in A}h(x)\geq |A|-|\max(A)|+1?$$

  More generally, is $|A|-\max_{x\in A}h(x)$ bounded by a function of $|\max(A)|$ alone?
