title: Units, central splitting, and filtration for multivariable boxed convolution
field: mathematics
tier: prose
statement: |-
  The official PDF identifies it as **Problem 5.2**, attributed to A. Nica.

  The recovered problem asks for the structure of the unit group of
  \[
  \left(\mathbb C_0\langle\!\langle z_1,\ldots,z_s\rangle\!\rangle,
  \boxtimes_s\right). \]
  It notes that \(s=1\) is the only commutative case, where Nica--Speicher's free Fourier transform \(F\) identifies the boxed-convolution unit group with invertible ordinary one-variable power series, and asks for a multivariable \(S\)-transform or analogue of \(F\).
