title: Farrell–Jones Conjecture for Torsion-Free Groups
field: mathematics
tier: prose
statement: For a torsion-free group $G$ and a regular ring $R$, are the algebraic $K$- and $L$-theory assembly maps $H_n(BG;\mathbf K_R)\to K_n(RG)$ and $H_n(BG;\mathbf L_R^{\langle-\infty\rangle})\to L_n^{\langle-\infty\rangle}(RG)$ bijective for every $n\in\mathbb Z$ (the Farrell–Jones conjecture)?
