id: um.30000587
title: Equivariant Nullhomotopy of the Regular-Map Derivative
field: mathematics
tier: prose
statement: For odd $n$, let $\delta:\operatorname{reg}(D^n\times D^2,D^2)\to\Omega^{n+2}(O(n+2)/O(n))$ send a regular smooth map, equal to the projection near the boundary, to its derivative. Construct a rational nullhomotopy of $\delta$ satisfying the derived $SO(2)$-equivariance condition and extending the preferred rational nullhomotopy on $\operatorname{reg}_1(D^n\times D^2,D^2)=\{f:q_2\circ f=q_{n+2}\}$.
