statement: |-
  \section*{The sharp singularity exponent of biased symmetric sign matrices}\label{30007346}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each fixed $p\in (0,1)$ excluding 1/2, let $A_n$ be symmetric with independent signs on and above the diagonal, each +1 with probability p. Is $lim_{n\to \infty }$ P(det $A_n=0)^{1/n}=p^2+(1-p)^2$?
  \subsection{Short English statement}
  For each fixed $p\in (0,1)$ excluding 1/2, let $A_n$ be symmetric with independent signs on and above the diagonal, each +1 with probability p. Is $lim_{n\to \infty }$ P(det $A_n=0)^{1/n}=p^2+(1-p)^2$?
