title: Group Actions on 1-Manifolds — Question 19
field: mathematics
tier: prose
statement: |-
  Given a symmetric, finitely-supported, non-degenerate probability distribution on Thompson's group $T$, does the
  Poisson-Furstenberg boundary of $T$ with respect to it identifies with the circle endowed with the corresponding stationary measure ?
