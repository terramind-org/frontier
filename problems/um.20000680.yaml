title: "Uniform Mobius disjointness for horocycles: an AOP obstruction and a moving-basepoint reduction"
field: mathematics
tier: prose
statement: |-
  Does the Sarnak conjecture hold uniformly in \(x\in X\) in the case of
  horocycle flows? It is known that the uniform Sarnak conjecture follows from
  the Sarnak conjecture, but we don't know that it follows case by case.
