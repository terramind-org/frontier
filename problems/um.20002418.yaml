title: Literal torus obstruction and background-Hessian reconstruction
field: mathematics
tier: prose
statement: |-
  Let \(u\) be a solution to
  \[
  u_{tt}+\operatorname{det}(u_{ij})=0
  \]
  on \(T^n\times[0,1]\) with convex boundary data. Prove a \(C^2\) estimate for \(u(\cdot,t)\) for \(t\) fixed.

  A solution would imply the maximal rank conjecture for complex tori.
