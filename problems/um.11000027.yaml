title: Problem 3.6 — (Generalized word problem).
field: mathematics
tier: prose
statement: "(Generalized word problem). Determine the subgroups H in Modg for which the generalized word problem is solvable. Give eﬃcient algorithms to solve the generalized word problem for these subgroups. Find the optimal time bounds for such algorithms. Of course this problem is too broad to solve in complete generality; results even in special cases might be interesting. Some solutions to Problem 3.6 are given by Leininger-McReynolds 26 B. Farb in [ LM]. We also note that Bridson-Miller (personal communication), extending an old result of Baumslag-Roseblade, have proven that any product of finite rank free groups has solvable generalized word problem with respect to any finitely presented subgroup. In light of this result, it would be interesting to determine whether or not there is a finitely presented subgroup of Mod g with respect to which the generalized word problem is not solvable. Distortion and quasiconvexity. There is a refinement of Problem 3.6. Let H be a finitely generated subgroup of a finitely generated group Γ. Fix finite generating sets on both H and Γ. This choice gives a word metric on both H and Γ, where dΓ(g,h ) is defined to be the minimal number of generators of Γ needed to represent gh−1. Let N denote the natural numbers. We say that a function f: N−→ N is a distortion function for H in Γ if for every word w in the generators of Γ, if w represents an element w∈H then dH (1,w)≤f (dΓ(1,w)) In this case we also say that “ H has distortion f (n) in Γ.” It is easy to see that the growth type of f, i.e. polynomial, exponential, etc., does not depend on the choice of generators for either H or Γ. It is also easy to see that f (n) is constant if and only if H is finite; otherwise f is at least linear. It is proved in [ F a1] that, for a group Γ with solvable word problem, the distortion of H in Γ is recursive if and only if H has solvable generalized word problem in Γ. For some concrete examples, we note that the center of the 3-dimensional integral Heisenberg group has quadratic distortion; and the cyclic group generated by b in the group ⟨a,b: aba−1 = b2⟩ has exponential distortion since anba−n =b2n."
