title: Sub-atomic product of funcoids is a categorical product
field: mathematics
tier: prose
statement: |-
  Conjecture In the category of continuous funcoids (defined similarly to the category of topological spaces) the following is a direct categorical product:

  - Product morphism is defined similarly to the category of topological spaces.
  - Product object is the sub-atomic product.
  - Projections are sub-atomic projections.

  See details, exact definitions, and attempted proofs here.
