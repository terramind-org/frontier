title: Coarse foliations — Question 12.1
field: mathematics
tier: prose
statement: |-
  Suppose $\rho:\pi_1(M) \to \mathbb{R}$ is a $1$–cochain with bounded coboundary; i.e.
  there is a uniform $C$ so that
  $$|\rho(\alpha) + \rho(\beta) - \rho(\alpha\beta)|<C$$
  for all $\alpha,\beta \in \pi_1(M)$. Consider $\pi_1(M)$ as a metric
  space by thinking of it as the vertices of some Cayley graph.
  Let $L_\rho = \rho^{-1}(I) \subset \pi_1(M)$.

  - Are the coarse connected components of $L_\rho$ coarsely simply connected?

  - If the answer is ``yes'', is there a sense in which $L_\rho$ and its
  translates by $\pi_1(M)$ can be thought of as coarse minimal planes in $\pi_1(M)$?
