title: Canonical endpoint stability and an explicit no-focal-points bound
field: mathematics
tier: prose
statement: |-
  Is the fundamental group of a closed manifold without conjugate points semihyperbolic?

  The record reads:

  It adds that semihyperbolicity was introduced by Alonso and Bridson to describe non-positive curvature on a large scale. The wording is unambiguous; the AIM spelling is “semihyperbolic” (some later papers write “semi-hyperbolic”). Here “closed” means compact without boundary, the metric is Riemannian, and “without conjugate points” applies to that metric.

  Let \(M\) be such a manifold, let \(X=\widetilde M\), and let
  \(\Gamma=\pi_1(M)\) act on \(X\) by deck transformations. A standard consequence of compactness and absence of conjugate points is that
  \(\exp_x:T_xX\to X\) is a diffeomorphism for every \(x\in X\). Thus any two points of \(X\) are joined by a unique minimizing geodesic. This fact is recorded explicitly by Ivanov--Kapovitch.
