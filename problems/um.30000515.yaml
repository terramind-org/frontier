title: Simple Connectivity of Godeaux Surfaces
field: mathematics
tier: prose
statement: Let $S$ be a Godeaux surface with $p_g=0$ and $K_S^2=1$. If its bicanonical pencil $|2K_S|$ has four distinct base points and every member of $|2K_S|$ is $2$-connected, must $S$ be simply connected?
