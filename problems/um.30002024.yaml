title: Real Orbit Counts on Wonderful Varieties
field: mathematics
tier: prose
statement: Let $X$ be a wonderful $G$-variety with canonical $\sigma$-equivariant real structure $\mu$, let $X(\mathbb{R})=\{x\in X:\mu(x)=x\}$, and let $G_0^\sigma$ be the identity component of the fixed-point group. What is the exact number of $G_0^\sigma$-orbits in $X(\mathbb{R})$?
