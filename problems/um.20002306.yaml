title: Effective cocycle criterion for reconstructing a central finite cover
field: mathematics
tier: prose
statement: |-
  **Question 4.** How difficult is it to find a presentation of $M$ in terms of $G$?

  Let $M$ be a strongly minimal nontrivial locally modular structure. There is a nonorthogonal interpretable strongly minimal group $G$.

  Consider a three-to-one map $(\mathbb Q,+)\leftarrow(M,\oplus)$ where $(M,\oplus)$ is strongly minimal.

  The immediately preceding source text says:

  Inspection of the original PDF resolves the segmentation. The three-to-one paragraph follows Question 4 as a new paragraph, and Question 5 immediately asks whether the operation $\oplus$ is definable in some $\mathbb Q\times F$. Thus the paragraph introduces the notation used by Question 5. It is useful context about finite covers, but it is not part of the sentence constituting Question 4. This report owns and analyzes only Question 4.

  The phrase “a presentation of $M$ in terms of $G$” is not formally defined in the source. Three inequivalent readings must be separated:

  1. **Existential:** does the isomorphism type of $M$ have a computable copy whenever $G$ does?
  2. **Relative to a cover:** from a copy of $G$ and fixed data describing $M\to G$, can one compute a copy of the cover, including the map?
  3. **Uniform/functorial:** is there a single computable procedure on copies and isomorphisms of $G$ that constructs copies of $M$? Equivalently, under the usual hypotheses, is $M$ effectively interpretable in $G$?

  The results below show that these readings can differ even for elementary finite group covers.
