statement: |-
  \section*{Virtual compact specialness of hyperbolic one-relator groups}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For any finite X and relator $r\in F(X)$, if $G=\langle X|r\rangle $ is word-hyperbolic, does some finite-index subgroup of G occur as the fundamental group of a finite compact special cube complex?
  \subsection{Short English statement}
  For any finite X and relator $r\in F(X)$, if $G=\langle X|r\rangle $ is word-hyperbolic, does some finite-index subgroup of G occur as the fundamental group of a finite compact special cube complex?
