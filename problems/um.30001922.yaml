title: Abelian-Quotient Models from High-Rank Group Actions
field: mathematics
tier: prose
statement: Let $X$ be a projective minimal terminal variety of dimension $n$, and let $G\leq\operatorname{Aut}(X)$ act so that its induced action on $\operatorname{NS}_{\mathbb C}(X)$ is not virtually solvable. Suppose that, after passage to finite index and quotient by the radical $R(G)$, the group embeds as a Zariski-dense subgroup of an almost simple real linear algebraic group $H$ of real rank $n-1$. Is $X$ birational to a quotient of an abelian variety of dimension $n$?
