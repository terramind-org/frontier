  \item[\hypertarget{source:8400025:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 8400025 (AMR-083-0025). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:8400025:2}{S2}] Leonard M. Adleman and Kevin S. McCurley, Open Problems in Number Theory Complexity, II, in Algorithmic Number Theory, LNCS 877 (1994), pp. 291--322, C22/O22a, manuscript p. 17 (LNCS p. 307), and Definition 2. \url{https://mccurley.org/papers/open.ps.gz}.
