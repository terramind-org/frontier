title: Diffeomorphic Doubles of Homotopy-Equivalent Two-Complexes
field: mathematics
tier: prose
statement: Let $X$ and $Y$ be finite two-dimensional CW complexes with finite fundamental group, and let $M(X)$ and $M(Y)$ be their smooth four-dimensional doubles. If $X\simeq Y$, must $M(X)$ and $M(Y)$ be diffeomorphic?
