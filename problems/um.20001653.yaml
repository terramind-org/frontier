title: A rank transition for finite-index homomorphisms into mapping class groups
field: mathematics
tier: prose
statement: |-
  It is known, by Martin and Juan's results, that all the Poison groups in \(\operatorname{Out}(F_n)\) would give virtually abelian image under a homomorphism to \(\operatorname{MCG}(S)\). However, subgroups of finite index change the story.

  Let \(\Gamma<\operatorname{Out}(F_n)\) have finite index. Determine \(\operatorname{Hom}(\Gamma,\operatorname{Mod}(S))\). Can such a map have infinite image, especially for \(n\geq4\)? Must its image be virtually abelian? What can be said about injectivity?
