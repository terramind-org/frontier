title: Ascending Chain Condition for Log Discrepancies
field: mathematics
tier: prose
statement: Fix a dimension $n$, a descending-chain-condition set $I\subseteq[0,1]$, and a descending-chain-condition set $J\subseteq\mathbb R_{\geq 0}$. Does there exist a finite subset $J_0\subseteq J$ such that, whenever $(X,\Delta)$ is an $n$-dimensional log canonical pair whose coefficients lie in $I$ and whose log discrepancy lies in $J$, that log discrepancy belongs to $J_0$?
