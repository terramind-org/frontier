title: Local Period Factors for Quaternionic Transfers
field: mathematics
tier: prose
statement: Let $\pi$ be the automorphic representation attached to $f$. For every place $v$ where $\pi_v$ is discrete series, does there exist $c_v\in\mathbb{C}$ such that $\langle f,f\rangle/\langle f_B,f_B\rangle=\prod_{v\mid\operatorname{disc}(B)}c_v$ up to a $p$-adic unit?
