title: Kourovka Notebook Problem 12.48
field: mathematics
tier: prose
statement: |-
  Let $G$ be a sharply doubly transitive
  permutation group on a set $\Omega$ (see Archive 11.52 for a definition).

  (a) Does $G$ possess a regular normal
  subgroup if a point
  stabilizer is locally finite?

  (b) Does $G$ possess a regular normal
  subgroup if a point
  stabilizer has an abelian subgroup of finite index?

  *Comments of 2022*: an affirmative answer to part (b) is obtained in permutation
  characteristic 0 (F. O. Wagner, *Preprint*, 2022, https://hal.archives-ouvertes.fr/hal-03590818).
