title: Research Problems in Function Theory — Problem 6.113
field: mathematics
tier: prose
statement: Following the notation of Problem 6.111 and 6.112, it is known that, if $|x|\leq\rho\leq1$ and $\gamma=1/(1+\rho)^2$, then \[N_\gamma\Big(\frac{z}{1-xz}\Big)\subset S^*.\] Is it true that \[\Sigma_\gamma\Big(\frac{z}{1-xz}\Big)\subset S^*?\] Notice that, since not all convex functions belong to $S^*$ (see Sheil-Small and Silvia ), it follows that we cannot replace in the above, $N_\gamma(z/(1-xz))$ by $N_\gamma(g)$, where $g$ is an arbitrary convex function. (T. Sheil-Small and E. M. Silvia)
