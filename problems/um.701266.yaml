title: Kourovka Notebook Problem 16.74
field: mathematics
tier: prose
statement: |-
  b) Is it true that all groups
  generated by automata of polynomial growth in the sense of
  S. Sidki (*Geom. Dedicata*, **108** (2004), 193--204) are
  amenable?

  [Archived solved part(s) of 16.74:]
  a)
  Let $G=\left<\alpha,\beta\right>$ be the group generated by the
  following two permutations of ${\mathbb{Z}$: \ $\alpha (n)=n+1$; \
  $\beta (0)=0$, \ $\beta (2^km)=2^k(m+2)$, where $m$ is odd and $n$
  is a positive integer. Is $G$ amenable?
