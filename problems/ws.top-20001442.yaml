  \section{Logarithmic Brunn–Minkowski inequality and equality cases}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For origin-symmetric convex bodies $K,L\subseteq\mathbb R^n$ with support functions $h_K,h_L$, define
  \[tK+_0(1-t)L=\bigcap_{u\in S^{n-1}}\{x:\langle x,u\rangle\leq h_K(u)^th_L(u)^{1-t}\}.\]
  Must its volume be at least $|K|^t|L|^{1-t}$ for $0\leq t\leq1$? The stated equality question asks whether equality occurs only for $K=L$ or for parallelograms with parallel sides.
  \par\smallskip\textit{Formulation references:} \sref{statement}{1}, \sref{statement}{2}.
