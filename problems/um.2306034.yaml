title: Research Problems in Function Theory — Problem 6.34
field: mathematics
tier: prose
statement: "A function $f(z) = z + a_2z^2 +\\ldots$ analytic in $\\mathbb{D}$ is said to belong to Ruscheweyh's class $M$ if the $*$ (i.e. Hadamard) convolution of $f$ with every (normalised) convex function is univalent. All close-to-convex functions lie in $M$. Suppose that $g(z) = z + b_2z^2 +\\ldots$ is analytic in $\\mathbb{D}$ and satisfies the condition $$ \\text{Re}\\,\\Big\\{\\frac{\\phi*(gF)}{\\phi*g}\\Big\\}>0\\hspace{1cm}|z|<1, $$ for all normalised convex functions $\\phi$, and all normalised functions $F$ of positive real part in $\\mathbb{D}$. If $g$ is star-like, then ([source label: C6.1]) certainly holds; is ([source label: C6.1]) true for any other $g$, or (maybe) for some significant larger family of $g$? If $g$ satisfies ([source label: 6.2]) and the condition \\[\\text{Re}\\, \\Big(\\frac{zf'}{g}\\Big) > 0,\\hspace{1cm} |z| < 1,\\] then $f\\in M$; does this classify $M$? (T. Sheil-Small)"
