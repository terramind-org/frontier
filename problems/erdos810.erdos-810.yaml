  module: FormalConjectures.ErdosProblems.«810»
  decl: Erdos810.erdos_810
  statement: |-
    theorem erdos_810 : ∃ ε > 0, ∀ᶠ n in atTop,
        ∃ G : SimpleGraph (Fin n), ∃ color : Fin n → Fin n → Fin n,
          ε * (n : ℝ) ^ 2 ≤ (G.edgeSet.ncard : ℝ) ∧ C4RainbowColoring G color
  context:
    - open Erdos810
    - open Filter
  definitions:
    - name: Erdos810.C4RainbowColoring
      kind: def
      text: |-
        /-- An edge-colouring by $n$ colours such that reversing an edge gives the same colour and every
        $C_4$ receives four distinct colours. -/
        def C4RainbowColoring {n : ℕ} (G : SimpleGraph (Fin n))
            (color : Fin n → Fin n → Fin n) : Prop :=
          (∀ a b, G.Adj a b → color a b = color b a) ∧
            ∀ a b c d, IsC4 G a b c d →
              PairwiseDistinct4 (color a b) (color b c) (color c d) (color d a)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/810.lean#L48
