id: um.20001141
title: The arithmetic Kakeya entropy constant and an exact bounded-support case
field: mathematics
tier: prose
statement: |-
  **Problem 4.10 (T. Tao).** What is the best \(\varepsilon\) for which there
  exist real numbers \(r_1,\ldots,r_n\) with the following property: given any
  two random values \(x,y\) taking finitely many real values, and obeying the
  entropy bound \(H(x+r_jy)<\log N\) for all \(j=1,\ldots,N\), one necessarily
  has \(H(x-y)<(1+\varepsilon)\log N\).
