title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 11: Combinatorial interpretation of Schubert polynomial structure constants"
field: mathematics
tier: prose
statement: Let $\mathfrak{S}_w$ denote the Schubert polynomial indexed by a permutation $w\in S_\infty$. In the polynomial ring $\mathbb{Z}[x_1,x_2,\dots]$, the product of two Schubert polynomials expands as $\mathfrak{S}_u \mathfrak{S}_v = \sum_w c_{uv}^w \mathfrak{S}_w$, where the structure constants $c_{uv}^w$ are known to be nonnegative integers via intersection theory on the flag variety $\operatorname{GL}(n,\mathbb{C})/B$. Find a positive combinatorial interpretation of the Schubert intersection coefficients $c_{uv}^w$, thereby combinatorially reproving their nonnegativity.
