statement: "**5. (D. Zaitsev)** Given \\(M\\) a CR manifold and \\(p\\in M\\), let \\(O(p)\\) be the set of points \\(q\\in M\\) for which there exists a CR automorphism \\(h:(U,p)\\to(V,q)\\) for some neighborhoods \\(U\\) of \\(p\\) and \\(V\\) of \\(q\\). Is \\(O(p)\\) always a manifold? In that case, is the span of the Lie algebra of infinitesimal automorphisms of \\(M\\) equal to \\(T_qO(p)\\) if \\(q\\in O(p)\\)?"
