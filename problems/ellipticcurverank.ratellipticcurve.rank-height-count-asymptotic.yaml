lean:
  module: FormalConjectures.Wikipedia.EllipticCurveRank
  decl: EllipticCurveRank.RatEllipticCurve.rank_height_count_asymptotic
  statement: |-
    theorem rank_height_count_asymptotic (r : ℕ) (h₁ : 1 ≤ r) (h₂ : r ≤ 20) :
        ∃ f : ℕ → ℝ, atTop.Tendsto f (𝓝 0) ∧
          ∀ᶠ H : ℕ in atTop,
            {E ∈ heightLE H | r ≤ E.rank}.ncard = (H : ℝ) ^ ((21 - r) / 24 + f H)
  context:
    - open EllipticCurveRank
    - open EllipticCurveRank.RatEllipticCurve
    - open Module (finrank)
    - open WeierstrassCurve
    - open scoped Topology
    - open Filter (atTop)
  definitions:
    - name: EllipticCurveRank.RatEllipticCurve.rank
      kind: abbrev
      text: |-
        /-- The rank of an elliptic curve over ℚ. -/
        noncomputable abbrev rank (E : RatEllipticCurve) : ℕ := finrank ℤ E.toWeierstrass.Point
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L78
    - name: EllipticCurveRank.RatEllipticCurve.heightLE
      kind: def
      text: |-
        /-- The set of elliptic curves over ℚ with naïve height less than or equal to a given height. -/
        def heightLE (H : ℕ) : Set RatEllipticCurve := {E : RatEllipticCurve | E.naiveHeight ≤ H}
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L91
