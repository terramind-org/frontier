title: Even-Codimension Stratifications of Codimension-Two Embeddings
field: mathematics
tier: prose
statement: Let $M$ be a simply connected piecewise-linear manifold with a homotopy equivalence $M\simeq N$, and hence an embedding $M\hookrightarrow N\times D^2$. Can this embedding be stratified using only strata of even codimension?
