title: Exact pushed-front benchmark and pulled spectral obstruction
field: mathematics
tier: prose
statement: |-
  A starting point for the above problem would be

  Prove existence and stability for pushed or pulled fronts for a toy model using a computer assisted proof.

  It also supplies the context omitted by the words "the above problem": Problem 2.1, attributed to Arnd Scheel, asks for existence and stability of pulled fronts for the complex Ginzburg--Landau equation. Problem 2.2 proposes a toy model as a starting point.

  The intended phrase is almost surely "existence and marginal stability," but this reconstruction is not silently substituted for the source.

  The 2023 AIM workshop announcement emphasizes two complementary rigorous-numerics tasks: validation of heteroclinic or homoclinic connections and computation of quantities controlling spectral stability of one-dimensional waves. This report accordingly chooses a scalar reaction--diffusion toy model and treats both profile existence and weighted spectral stability. It does **not** claim to solve the preceding complex Ginzburg--Landau problem.
