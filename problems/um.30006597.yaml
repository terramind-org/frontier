title: Algebraicity Under Central-Binomial Untwisting
field: mathematics
tier: prose
statement: Let $f(x)=\sum_{n\geq 0}a_nx^n\in\mathbb Z[[x]]$ and $F(x)=\sum_{n\geq 0}\binom{2n}{n}a_nx^n$. If $F$ satisfies a second-order homogeneous linear differential equation with polynomial coefficients and regular singularities, must $f$ be algebraic?
