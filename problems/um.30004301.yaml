statement: For a set-theoretic Yang–Baxter solution $(X,r)$ with structure algebra $kM(X,r)$ and associated injective $1$-cocycle $\pi$, when is $\pi$ injective, and what is the algebraic structure of $kM(X,r)$ in the injective and general cases?
