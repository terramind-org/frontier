title: Langlands Packets Across Extended Pure Inner Forms
field: mathematics
tier: prose
statement: For a discrete Langlands parameter and all extended pure inner twists of a quasi-split group $G$, should the union of the associated $L$-packets be parametrized by irreducible representations of the parameter centralizer, compatibly with Kottwitz's bijection between basic isocrystals and the character group of the dual center, with the quasi-split packet containing a unique Whittaker-generic constituent and satisfying the expected endoscopic identities?
