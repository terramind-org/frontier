title: Are there any composite c satisfying 2^{c − 1} ≡ 1 (mod c^{2})
field: mathematics
tier: prose
statement: |-
  % UnsolvedMath ID 9400141; source catalogue code AMR-093-0141
  \setcounter{section}{9400140}
  \section{\texorpdfstring{Are there any composite c satisfying 2\textasciicircum{}\{c − 1\} $\equiv$ 1 (mod c\textasciicircum{}\{2\})}{Are there any composite c satisfying 2\textasciicircum{}\{c − 1\} congruent to 1 (mod c\textasciicircum{}\{2\})}}\label{9400141}
  {\small\sffamily UnsolvedMath ID 9400141 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A composite integer is an integer greater than one which is not prime. Congruence $u\equiv v\pmod m$ means $m$ divides $u-v$.
  \paragraph{Statement recorded in the supplied source.}
  Does there exist a composite integer $c>1$ such that $c^2\mid2^{c-1}-1$? \sref{9400141}{2}
  \subsection{Short English statement}
  Can a composite integer satisfy the base-two Wieferich congruence modulo its square?
