title: Billiards and Quantitative Symplectic Geometry — Misha Bialy — Problem 1
field: mathematics
tier: prose
statement: |-
  **Magnetic billiards for strong magnetic fields..**

  Magnetic billiards were introduced and studied in [berry-robnik]. In this model, the billiard ball moves under the influence of a constant magnetic field along Larmor circles (for a magnetic field of magnitude $B$, the Larmor circles have radius $1/B$). The only known example of an integrable magnetic billiard is a circular billiard. An algebraic approach to this problem was discussed in [magnetic1], [magnetic2]. Numerical experiments were performed in [albers]. Moreover, the approach of total integrability works well for convex magnetic billiard in a *weak* constant magnetic field [bialy-magnetic-hopf].

  **Question 1.** {\it Is it true that the only totally integrable magnetic billiard in a *strong* constant magnetic field is necessarily circular?}
