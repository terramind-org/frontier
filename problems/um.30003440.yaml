title: Bounding Generic Completion Rank by Maximum-Likelihood Threshold
field: mathematics
tier: prose
statement: Does there exist a function $f:\mathbb N\to\mathbb N$ such that, for every finite simple graph $G$, the generic completion rank of $G$ is at most $f(\operatorname{mlt}(G))$?
