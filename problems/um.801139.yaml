title: Ultraproduct II_1 Factors — Problem 40
field: mathematics
tier: prose
statement: |-
  It follows from arguments of S. Popa [PopaOrthoPairs] that ultrapowers can never be non trivial tensor products, crossed products, amalgamated free products, or have diffuse regular abelian subalgebras.

  Does there exist a II$_1$ factor $N$ such that $h(N^{\mathcal{U}})=\infty$ and $h(N)=0$, where $h$ denotes 1-bounded entropy?
