title: Kourovka Notebook Problem 16.1
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finite non-abelian group, and
  $Z(G)$ its centre. One can associate a graph $\Gamma_G$ with $G$
  as follows: take $G\backslash Z(G)$ as vertices of $\Gamma_G$ and
  join two vertices $x$ and $y$ if $xy\not=yx$. Let $H$ be a finite
  non-abelian group such that $\Gamma_G \cong \Gamma_H$.

  b) If $H$ is nilpotent,
  is it true that $G$ is nilpotent? \ \

  *Comment of 2009:*
  This is true if $|H|=|G|$ (A. Abdollahi, S. Akbari, H. R. Maimani, *J. Algebra*, **298** (2006),
  468--492).

  *Comments of 2023:*
  This is true if $|Z(H)|\geq |Z(G)|$
  (H. Shahverdi, *J. Algebra*, **642** (2024), 60--64), using the earlier result under the additional assumption that the centralizer of every non-central
  element in $H$ is abelian (V. Grazian, C. Monetta, *J. Algebra*, **633** (2023), 389--402).

  c) If $H$ is solvable,
  is it true that $G$ is solvable?

  [Archived solved part(s) of 16.1:]
  a) Let $G$ be a finite non-abelian group, and
  $Z(G)$ its centre. One can associate a graph $\Gamma_G$ with $G$
  as follows: take $G\backslash Z(G)$ as vertices of $\Gamma_G$ and
  join two vertices $x$ and $y$ if $xy\not=yx$. Let $H$ be a finite
  non-abelian group such that $\Gamma_G \cong \Gamma_H$.
  If $H$ is simple, is it true that $G\cong
  H$? \ *Comment of 2009:*
  This is true for groups with disconnected prime graphs (L. Wang,
  W. Shi, *Commun. Algebra*, **36** (2008), 523--528).
