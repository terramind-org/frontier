title: Kim's Nonabelian Selmer-Dimension Conjecture
field: mathematics
tier: prose
statement: Let $X/\mathbb{Q}$ be a smooth absolutely irreducible projective curve of genus at least two with rational basepoint $x_0$, and let $p$ be a prime of good reduction. For the étale and de Rham realizations $\Pi_{\mathrm{et},n}$ and $\Pi_{\mathrm{dR},n}$ of the truncated unipotent fundamental group, is $\dim H_f^1(\mathbb{Q},\Pi_{\mathrm{et},n})<\dim(\Pi_{\mathrm{dR},n}/F^0)$ for all sufficiently large $n$?
