title: Positive entropy and the topology of smooth metrics
field: mathematics
tier: prose
statement: |-
  Question 8.4.1. Do the metrics with positive entropy form a dense subset of G?This question can be asked for any k. For k = 2 it was recently positively answered in all dimensions in [Contreras2010]; see also [Con-Pat2002]. For k = ∞

  and dimension 2, it was answered positively in [Kni-Wei2002].

  The missing definitions occur in §8.4 immediately before this record. Let \(M\) be a smooth closed manifold and let

  \[
  \mathcal G=\operatorname{Met}^{\infty}(M)
  \]

  be the set of all smooth Riemannian metrics on \(M\). For a finite integer \(k\), \(\mathcal G\) is given the topology induced by the \(C^k\)-norms of the coefficient matrices \(g_{ij}\) in a finite atlas. The source explains that this topology is independent of the chosen finite atlas. The phrase “positive entropy” means

  \[
  h_{\mathrm{top}}(\phi_g)>0,
  \]

  where \(\phi_g^t:S_gM\to S_gM\) is the geodesic flow and entropy is the topological entropy of its time-one map. This interpretation is explicit in all three cited primary papers.

  For \(k=\infty\), the correct standard interpretation on a compact manifold is the Whitney \(C^\infty\), equivalently Fréchet, topology on smooth sections of \(S^2T^*M\). It is generated by the seminorms \(\|\cdot\|_{C^r}\), \(r=0,1,\ldots\). A basic neighborhood controls only finitely many derivative orders; there is no single finite-valued “\(C^\infty\)-norm.”

  The question concerns Riemannian metrics. Contreras discusses why analogous perturbation problems are more flexible for Finsler metrics, but his stated Theorem A and the space \(\mathcal G\) above are Riemannian. No Finsler conclusion is silently imported here.
