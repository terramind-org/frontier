title: Rigidity and a sharp halfspace benchmark for Gaussian cylinders
field: mathematics
tier: prose
statement: Let \(K\subseteq\mathbb R^n\) be a convex set, and let \(X\) be a Gaussian random variable conditioned to lie in \(K\). Does \(\operatorname{Var}(X_\theta)=1\) imply that \(K\) is a cylinder in direction \(\theta\)? If \(\operatorname{Var}(X_\theta)=1-\varepsilon\), then does it mean that \(K\) has a small symmetric difference with a cylinder in direction \(\theta\)?
