title: Finite-prime parity laws and a covariance reduction
field: mathematics
tier: prose
statement: |-
  Show that
  \[
  \left| \mathbb{E}_{n \in \mathbb{N}}^{\log} \lambda(n^2+1) \right| < 1-\epsilon,
  \]
  and that
  \[
  \left| \mathbb{E}_{p \in \mathbb{P}} \lambda(p-1) \right| < 1-\epsilon
  \]
  for some \(\epsilon>0\). It would even be interesting to show that both sets
  \(\{p:\lambda(p-1)=1\}\) and \(\{p:\lambda(p-1)=-1\}\) are infinite. For the first bound, using the entropy decrement argument, wouldn't it be enough to show that
  \[
  \left|\sum_{p\approx P}\sum_{n\approx X}\lambda(n^2+p^2)\right|
  =o\!\left(X\frac{P}{\log P}\right)
  \]
  with \(P=\log\log\log X\)?
