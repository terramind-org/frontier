title: Comparative Prime Number Theory — Problem 1
field: mathematics
tier: prose
statement: |-
  - (Greg Martin and Lior Silberman, University of British Columbia)
  An *ordinate* of an $L$-function is a positive imaginary part of a nontrivial zero of that $L$-function. LI implies that at most one positive ordinate can be rational, and presumably even that is not possible (for classical analytic $L$-functions).

  1}: Prove that $\zeta(s)$ has at least one(!) irrational ordinate.
