title: Research Problems in Function Theory — Problem 3.13
field: mathematics
tier: prose
statement: Let $u(x)$ be subharmonic in $\mathbb{R}^m$. One can define the quantities $n(r, 0), N(r, 0), T(r)$ as in Nevanlinna theory in the plane, taking the analogue of the case $u(z) = \log|f(z) |$, where $f(z)$ is an entire function (see, for example Hayman ). Define \[\delta(u) = 1 - \limsup_{r\to\infty}\frac{N(r,u)}{T(r)}.\] If the order $\rho$ of $u$ is less than $1$, it is possible to obtain the sharp upper bound for $\delta(u)$ in terms of $\rho$ and $m$. The bound is attained when $u(x)$ has all its mass on a ray (see Hayman and Kennedy ). One can ask the corresponding question for $\rho > 1$. One can ask whether a lower bound $A(\rho)$ can be obtained for $\delta(u)$ if $\rho > 1$ and all the mass of $u(x)$ lies on a ray, or more generally on some suitable lower dimensional subspace $S$ of $\mathbb{R}^m$ and $\rho>\rho_0(S)$. For fixed $S$ we may conjecture by analogy with the case $m = 2$, that $A(\rho)\to1$ as $\rho\to\infty$. This is proved by Hellerstein and Shea in the case $m = 2$. (D. Shea)
