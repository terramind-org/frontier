title: Problems Around Polynomials — Conjecture 1
field: mathematics
tier: prose
statement: "[ Maxwell, seems bad, no tools] For any system of $N$ isolated fixed point charges in $\\mathbb{R}^3$, the number of points of equilibrium (assumed finite) of the created electrostatic field $$E(\\bar x)=\\sum_{i=1}^N\\frac{\\xi_i(\\bar x-\\bar x_i)}{|\\bar x-\\bar x_i|^3},$$ is at most $(N-1)^2$. Here $\\xi_i$ is a charge placed at $\\bar x_i\\in \\mathbb{R}^3$ and $\\bar x\\in \\mathbb{R}^3$ is a variable vector."
