title: Problem 6.2 — If G< MCG (S) is geometrically finite with cusp groups H1,...,H n, what can be said about the geometric properties of…
field: mathematics
tier: prose
statement: If G< MCG (S) is geometrically finite with cusp groups H1,...,H n, what can be said about the geometric properties of the group ΓG? Does it have useful large scale geometric properties? Does it satisfy some form of quasi-isometric rigidity? Note that Γ G is not hyperbolic relative to its subgroups Γ H1,..., ΓHn, because each of these subgroups and their conjugates contains the kernel π1(S), whereas relative hyperbolicity implies that the intersection of any two of these conjugates is finite.
