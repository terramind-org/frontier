title: "Henon Maps: Open Problems — Question 2"
field: mathematics
tier: prose
statement: |-
  Returning to stochastic attractors, observe that
  the existence of a parameter $c\in \mathbb{R}$ for which the quadratic map $x \mapsto x^2+c$
  displays an absolutely continuous measure is easy to ensure. It suffices to pick
  a parameter $c$ such that the post-critical orbit is finite but not periodic.
  In dimension $2$, the existence of a positive measure set of parameters of H\'enon maps displaying an attractor supporting an invariant SRB measure
  (i.e., a measure whose conditional measures along unstable curves are absolutely continuous.)
  is a fundamental result, whose proof still remain difficult and lengthy ([BC,Berger,Ta,WY]).

  Is there a quick proof for the existence of SRB for some parameters of the H\'enon maps?
