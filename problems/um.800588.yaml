title: Selection Principles in Mathematics — Problem 14
field: mathematics
tier: prose
statement: |-
  The following problem withstood considerable attacks by several mathematicians.
  The property in it is equivalent to the Gerlits-Nagy $(*)$ property,
  and is also equivalent to $\mathsf{S}_1(\Omega,\mathcal{O}^{\gamma\mbox{-*\tiny gp*}})$ [coc7].

  Is $\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\Gamma)\cap\mathsf{S}_1(\mathcal{O},\mathcal{O})$ preserved by finite products?
