title: Ultraproduct II_1 Factors — Problem 12
field: mathematics
tier: prose
statement: Let $N$ be a II$_1$ factor with Haagerup's property, and $B\subset N^\mathcal{U}$, with Property (T). Then are there finite dimensional subalgebras $M_n\subset N$ such that $B\subset \prod_{n\to \mathcal{U}}M_n$?
