title: Trimer Covers in the Triangular Grid — Problem 11
field: mathematics
tier: prose
statement: |-
  With $T(n) = T_{112}(3n-1,3n)$ with $n \geq 1$,
  it appears that $T(n)$ has no prime factor greater than or equal to $4n$.

  Find a formula governing $T_{112}(3n-1,3n)$. See
  OEIS entry A364483 (https://oeis.org/A364483).

  We now switch from central diagonals to peripheral diagonals.
