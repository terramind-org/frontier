title: Rationality of Quasi-Monomial Fixed Fields
field: mathematics
tier: prose
statement: Let $K/k$ be a finite field extension and let $G$ act on $K(x_1,\ldots,x_n)$ by quasi-monomial $k$-automorphisms. Under what conditions is $K(x_1,\ldots,x_n)^G$ rational over $k$?
