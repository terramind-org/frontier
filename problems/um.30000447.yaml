id: um.30000447
title: Character Bounds for Blocks with One Brauer Character
field: mathematics
tier: prose
statement: In modular representation theory of finite groups, let $B$ be a $p$-block of a finite group with defect group $D$, let $k(B)$ be the number of ordinary irreducible characters in $B$, and let $l(B)$ be the number of irreducible Brauer characters in $B$. If $l(B) = 1$, must $k(B) \leq k(D)$ (a special case of Brauer's $k(B)$ conjecture)?
