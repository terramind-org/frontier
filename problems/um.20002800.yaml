title: Explicit BD pushouts, coprime split-field cocycles, and a descent obstruction for p-adic tori
field: mathematics
tier: prose
statement: |-
  **Covering group of tori.** Let \(T\) be a (not necessary split) torus over a
  \(p\)-adic field. Construct \(\widetilde T\)
  \[
  1\longrightarrow\mu_F\longrightarrow\widetilde T
  \longrightarrow T\longrightarrow1
  \]
  explicitly within Brylinski--Deligne framework.

  Nice subcases: when \(T\) is anisotropic or unramified.
