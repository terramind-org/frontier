title: Open Problems in Mathematical Logic — Problem 27
field: mathematics
tier: prose
statement: |-
  Using recursion theory, Goh proved that any coanalytic separator of **WF** and **UB** is coanalytic complete. The method also proves Saint Raymond's theorem.

  Can this be proved using Descriptive Set Theoretic methods?
