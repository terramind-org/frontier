title: First Root Conjecture for Real Exponential Polynomials
field: mathematics
tier: prose
statement: For every positive integer $n$ and every $f\in\mathbb{Z}[x_1,\ldots,x_n,e^{x_1},\ldots,e^{x_n}]$, can one effectively find $\eta(n,f)$ such that, whenever $f$ has a zero in $\mathbb{R}^n$, it has a zero $\alpha$ with $\lVert\alpha\rVert<\eta(n,f)$?
