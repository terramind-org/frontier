title: Open Problems in Arithmetic Dynamics — Conjecture 52 (Dynamical Lang--Siegel Conjecture for $\mathbb{P}^N$)
field: mathematics
tier: prose
statement: |-
  Let $f:\mathbb{P}^N\to\mathbb{P}^N$ be a morphism of degree $d\ge2$ defined over $\mathbb{Q}$,
  and assume that for all $1\le n\le N+1$, the first coordinate function of $f^n$ is not a constant
  multiple of $X_0^{d^n}$. Let $P\in\mathbb{P}^N(\mathbb{Q})$. Then $\mathcal{O}_f(P)$ contains
  only finitely points that are integeral relative to the hyperplane $x_0=0$.
  More precisely, assume that $P$ is wandering, and for each $n\ge1$, write
  \begin{multline*}
  f^n(P) = \bigl[A_0(n),A_1(n),\ldots,A_N(n)\bigr] \\*
  \quad\text{with
  $A_0(n),\ldots,A_N(n)\in\mathbb{Z}$ and
  $\gcd\bigl(A_0(n),\ldots,A_N(n)\bigr)=1$.}
  \end{multline*}
  Then
  \[
  \lim_{n\to\infty} \frac{\log\bigl|A_0(n)\bigr|}
  {\log\max\bigl\{ \bigl|A_0(n)\bigr|,\ldots,\bigl|A_N(n)\bigr| \bigr\} } = 1.
  \]
