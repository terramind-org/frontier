statement: Consider a positive definite Lagrangian \(L:TM\times\mathbb T\to\mathbb R\). Let \(\alpha:H^1(M,\mathbb R)\to\mathbb R\) be Mather's \(\alpha\)-function. Relate the regularity of the Mather set \(\mathcal M_c\) and the arithmetic properties of the frequency \(\omega=D\alpha(c)\in H_1(M,\mathbb R)\).
