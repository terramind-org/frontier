title: Ding's tau_r vs. tau conjecture
field: mathematics
tier: prose
statement: Conjecture Let $r \ge 2$ be an integer and let $H$ be a minor minimal clutter with $\frac{1}{r}\tau_r(H) < \tau(H)$. Then either $H$ has a $J_k$ minor for some $k \ge 2$ or $H$ has Lehman's property.
