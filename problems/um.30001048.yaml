title: Geodesicity of Core Tunnels in Compression Bodies
field: mathematics
tier: prose
statement: Let $C$ be a compression body with genus-two positive boundary and torus negative boundary obtained from a hyperbolic tunnel-number-one manifold, and let $\tau$ be the core arc of its compressible handle. Is $\tau$ isotopic to a geodesic for every geometrically finite hyperbolic structure on $C$?
