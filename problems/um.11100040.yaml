statement: From an axiomatic point of view, I don't understand Grojnowski's equivariant elliptic cohomology. This theory takes values in an abelian category that is not modules over a ring--I think it is sheaves over a scheme or something. Is there some way to understand homology theories that land in, say, Grothendieck categories, from an axiomatic point of view?
