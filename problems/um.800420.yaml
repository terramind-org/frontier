title: Open Problems in Arithmetic Dynamics — Question 43
field: mathematics
tier: prose
statement: |-
  Let $f(x)\in\mathbb{F}_q[x]$ be an \textup(irreducible\textup) polynomial,
  let $g(x)\in\mathbb{F}_q[x]$, and for each $n\ge1$,
  factor $g\bigl(f^n(x)\bigr)$ in $\mathbb{F}_q[x]$ as
  \[
  g\bigl(f^n(x)\bigr) = p_1(x)^{e_1} p_2(x)^{e_2} \cdots p_r(x)^{e_r}
  \]
  with $p_i(x)$ irreducible in $\mathbb{F}_q[x]$.
  \begin{parts}

  (a)
  Describe the behavior, as $n\to\infty$, of quantities such as
  \[
  r,\quad \sum_{i=1}^r e_i,\quad \max_{1\le i\le r} e_i,\quad \max_{1\le i\le r}\deg p_i(x).
  \]

  (b)
  Describe or predict the factorization of $g\bigl(f^{n+1}(x)\bigr)$
  from a given factorization of $g\bigl(f^n(x)\bigr)$.

  (c)
  Answer the analogous questions for the iterates of a rational function
  $f(x)\in\mathbb{F}_q(x)$. Note that the exponents $e_1,\ldots,e_r$ may now be
  both positive and negative, and hence it may be more natural to study $\sum |e_i|$
  instead of $\sum e_i$, and $\max |e_i|$ instead of $\max e_i$.
  \end{parts}
