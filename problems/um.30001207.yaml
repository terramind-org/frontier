title: Rauzy Fractals from Multidimensional Continued Fractions
field: mathematics
tier: prose
statement: Given a Brun expansion of a multidimensional continued-fraction algorithm, how can one associate a Rauzy fractal to the expansion, and, assuming almost-everywhere exponential convergence to that fractal, can one prove that its subtiles are disjoint in measure and determine when they form a tiling?
