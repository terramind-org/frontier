title: Positive Radon Measures for Truncated Moment Data
field: mathematics
tier: prose
statement: Let $X$ be locally compact, let $V\subseteq C(X,\mathbb R)$ have basis $a_1,\ldots,a_m$, and let $s_1,\ldots,s_m\in\mathbb R$. Characterize when there is a positive Radon measure $\mu$ on $X$ such that $$s_j=\int_X a_j(x)\,d\mu(x)\qquad(1\leq j\leq m)$$.
