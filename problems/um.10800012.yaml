statement: "A version of the previous problem, in which the complexity measure is not purely topological: namely, it is the lowest number of critical points of Morse functions defined by restrictions of linear functions ${\\mathbb{R}}^{N}\\to{\\mathbb{R}}$ to our varieties. $($Correspondingly, the surgeries of the variety affecting this measure should be not only those of topological nature but also include bifurcations of the dual variety$)$."
