title: Kourovka Notebook Problem 13.3
field: mathematics
tier: prose
statement: |-
  Let ${\mathfrak{M}}$ be an
  arbitrary variety of groups. Is it true that every infinitely
  generated projective group in
  ${\mathfrak{M}}$ is an ${\mathfrak{M}} $-free product of countably generated projective groups in
  ${\mathfrak{M}}$?
