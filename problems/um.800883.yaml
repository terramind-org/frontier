title: Open Problems in Pluripotential Theory — Question 14
field: mathematics
tier: prose
statement: |-
  [Ko\l{}odziej]
  Let $(X,\omega)$ be a compact K\"ahler manifold. Let $\mu$ be a probability measure which is
  locally dominated by the Monge-Amp\`ere measures of bounded plurisubharmonic functions.
  Can one find $\varphi \in PSH(X,\omega) \cap L^{\infty}(X)$ such that
  $\mu=MA(\varphi)$ ?
