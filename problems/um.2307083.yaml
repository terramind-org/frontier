statement: Let $G$ be a finitely-generated Fuchsian group of the first kind. [(a)] ; If $F:\Pi \to \Pi$ is a $G$-invariant quasi-symmetric function, is $F$ totally singular? ; Is the Teichmuller space $T_G$ dense in the space $S_G$ (Schwarzians of $G$-invariant univalent functions)? (O. Lehto; L. Bers; I. Kra; communicated by D. Hamilton)
