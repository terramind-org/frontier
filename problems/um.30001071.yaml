title: Essential Hyperplane Covers of the Boolean Cube
field: mathematics
tier: prose
statement: Let $f(n)$ be the minimum number of affine hyperplanes needed to cover $\{0,1\}^n$ so that every hyperplane is essential and every variable has nonzero coefficient in some defining equation. Determine $f(n)$, or close the gap $\Omega(\sqrt n)\leq f(n)\leq n/2+1$.
