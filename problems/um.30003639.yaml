title: Keating–Snaith Moment Conjecture for the Zeta Function
field: mathematics
tier: prose
statement: For fixed $k$, is $\frac{1}{T}\int_0^T|\zeta(1/2+it)|^{2k}\,dt\sim a(k)\frac{G(k+1)^2}{G(2k+1)}\left(\log\frac{T}{2\pi}\right)^{k^2}$, where $G$ is the Barnes G-function and $a(k)$ is the arithmetic factor?
