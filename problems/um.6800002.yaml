title: Riemannian manifolds with curvature bounds
field: mathematics
tier: prose
statement: For every $\ell,k>0$, there exist $C,L,K>0$ with the following effect. Let $(M,g)$ be a complete Riemannian manifold with injectivity radius $inj(M,g)\geq \ell$ and Ricci curvature $Ric(g)\geq k$. Then there exists a metric $h$ on $M$ with $inj(M,h)\geq L$ and $|Ric(h)|\leq K$ such that $$ \frac{1}{C}\,g\leq h\leq C\,g. $$
