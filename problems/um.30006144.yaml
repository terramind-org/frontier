id: um.30006144
title: Structure and Coloring at Large r-Acyclic Width
field: mathematics
tier: prose
statement: Fix $r\geq 3$. (1) Is there a function $f:\mathbb{N}\to\mathbb{N}$ such that every graph of $r$-acyclic width at least $f(k)$ contains a subdivided grid of $r$-acyclic width at least $k$? (2) Is there a function $h:\mathbb{N}\to\mathbb{R}$ with $h(r)\to 0$ such that some minimum-width $r$-acyclic $H$-decomposition of every graph $G$ satisfies $\lVert H\rVert=O(|G|^{1+h(r)})$? (3) If an $r$-acyclic decomposition of $G$ has width $w=r\operatorname{-aw}(G)$ and model $H$, let $k$ be the maximum chromatic number among topological minors of $H$ having girth greater than $r$. Can $G$ be colored with $wk$ colors?
