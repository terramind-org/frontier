title: Square-Function Criterion for Higher-Dimensional Rectifiability
field: mathematics
tier: prose
statement: |-
  Let $\mu$ be a Radon measure on $\mathbb R^d$ such that $0<\Theta_{n,*}(x,\mu)<\infty$ for $\mu$-almost every $x$ and

  $$\int_0^1\left(\frac{\mu(B(x,r))}{r^n}-\frac{\mu(B(x,2r))}{(2r)^n}\right)^2\frac{dr}{r}<\infty.$$

  Must $\mu$ be $n$-rectifiable? In particular, if $\mu=\mathcal H^n\!\restriction E$, must $E$ be $n$-rectifiable?
