title: An ambiguous quantization diagram and a projective-flatness obstruction
field: mathematics
tier: prose
statement: |-
  Let $X$ be a surface and fix topological data. Then:
  \[
  X\rightarrow Bun_{G}\left(X\right)\rightarrow H^{0}\left( Bun_{G},\alpha\right)
  \]
  \[
  \underline{X} \rightarrow Bun_{G}\left(X\right)\rightarrow U
  \qquad (\star)
  \]
  Is $(\star)$ naturally projectively flat?
