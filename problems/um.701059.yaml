title: Kourovka Notebook Problem 14.74
field: mathematics
tier: prose
statement: |-
  Let $k(G)$ denote the number of conjugacy classes
  of a finite group $G$. Is it true that $k(G)\leq k(P_1)\cdots
  k(P_s)$, where $P_1,\ldots ,P_s$ are Sylow subgroups of $G$ such that
  $|G|=|P_1|\cdots |P_s|$?
