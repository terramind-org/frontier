title: Monotonicity and Concavity of Bubble Area
field: mathematics
tier: prose
statement: Let $A_X(v_1,\ldots,v_k)$ be the area of a minimizing $k$-bubble of volumes $v_i$ in a Riemannian manifold $X$. For $X=\mathbb{R}^n$, is $A_X$ strictly increasing in each volume, and is it strictly concave?
