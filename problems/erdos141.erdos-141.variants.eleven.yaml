lean:
  module: FormalConjectures.ErdosProblems.«141»
  decl: Erdos141.erdos_141.variants.eleven
  statement: |-
    theorem erdos_141.variants.eleven :
        ∃ (s : Set ℕ), s.IsAPAndPrimeProgressionOfLength 11
  context:
    - open Erdos141
    - open Erdos141.erdos_141
    - open Erdos141.erdos_141.variants
    - open Nat Erdos141
  definitions:
    - name: Erdos141.Set.IsAPAndPrimeProgressionOfLength
      kind: def
      text: |-
        /--
        The predicate that a set `s` is both an arithmetic progression of length `l` and a progression
        of `l` consecutive primes.
        -/
        def Set.IsAPAndPrimeProgressionOfLength (s : Set ℕ) (l : ℕ) :=
           s.IsAPOfLength l ∧ s.IsPrimeProgressionOfLength l
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/141.lean#L52
