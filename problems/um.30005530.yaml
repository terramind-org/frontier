title: Ramanujan Bounds for Siegel Cusp-Form Coefficients
field: mathematics
tier: prose
statement: Let $F$ be a holomorphic Siegel Hecke cusp form of weight $k$ for $\operatorname{Sp}_4(\mathbb Z)$. Prove that some fixed $\delta>0$ satisfies $a(F,S)\ll_F\det(S)^{(k-1)/2-\delta}$ for every fundamental-discriminant form $S$, and ultimately prove $a(F,S)\ll_{F,\epsilon}\det(S)^{k/2-3/4+\epsilon}$.
