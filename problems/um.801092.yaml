title: "Henon Maps: Open Problems — Problem 44"
field: mathematics
tier: prose
statement: |-
  Let $f\in \mathrm{Aut}[\mathbb{C}^d]$ be any regular polynomial automorphism.

  - Prove that one can find a compact complex manifold $\bar{S}(f)$ and an open immersion
  $S(f) \subset \bar{S}(f)$ such that the complement $\bar{S}(f)\setminus S(f)$ is a divisor.

  - Prove that $\bar{S}(f)$ is unique up to bimeromorphism.

  - Describe complex objects on $\bar{S}(f)$ (analytic subvarieties, vector fields, holomorphic foliations, positive closed currents,...).
  Compute its deformation space.
