title: PDE-Inspired Graph Functionals and Their Continuum Limits
field: mathematics
tier: prose
statement: Given a PDE-inspired functional $f$ on weighted graphs and its continuum counterpart $F$, which structural properties of $F$ have graph analogues, and under what graph-limit regimes does $f$ converge to $F$? Can minimization algorithms for $f$ be used in data analysis or image processing, and which other PDE or variational systems admit useful graph analogues?
