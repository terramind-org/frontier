lean:
  module: FormalConjectures.OEIS.«262813»
  decl: OeisA262813.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 0 < n) :
        a n = 1 ↔ n ∈ singletons
  context:
    - open OeisA262813
  definitions:
    - name: OeisA262813.a
      kind: def
      text: |-
        /--
        Number of ordered ways to write $n$ as $x^3 + y^2 + \frac{z(z+1)}{2}$ with $x \ge 0$, $y \ge 0$,
        and $z > 0$.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.range (n + 1),
            ∑ y ∈ Finset.range (n + 1),
              ∑ z ∈ Finset.Ico 1 (n + 1),
                if x ^ 3 + y ^ 2 + Nat.triangular z == n then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/262813.lean#L34
    - name: OeisA262813.singletons
      kind: def
      text: |-
        /-- The set of exceptional positive integers $n$ for which $a(n) = 1$. -/
        def singletons : Finset ℕ :=
          {1, 9, 21, 35, 98, 152, 306}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/262813.lean#L59
