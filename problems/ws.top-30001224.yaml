  \section{Alperin Weight Conjecture and Perfect Localities}\label{30001224}
  {\small UnsolvedMath ID 30001224 · Algebra}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  In modular representation theory, understand and prove Alperin's Weight Conjecture, including the more general form suggested by Frobenius categories; also determine whether a perfect locality (centric linking system) associated with a Frobenius category exists and is unique.
  \par\smallskip\textit{Formulation references:} \sref{30001224}{1}, \sref{30001224}{2}.
  \subsection{Short English statement}
  In modular representation theory, understand and prove Alperin's Weight Conjecture, including the more general form suggested by Frobenius categories; also determine whether a perfect locality (centric linking system) associated with a Frobenius category exists and is unique.
