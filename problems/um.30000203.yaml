title: Minimal Subdegrees of Twisted-Wreath Permutation Groups
field: mathematics
tier: prose
statement: For every finite primitive permutation group $G=\operatorname{Soc}(G)\rtimes P\leq H\wr S_k$ of O'Nan–Scott twisted-wreath type acting on $\Delta^k$, with primitive component $H\leq\operatorname{Sym}(\Delta)$, is $\operatorname{MinSubDeg}(G)<k\,\operatorname{MinSubDeg}(H)$?
