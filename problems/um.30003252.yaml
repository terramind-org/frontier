title: Büchi's Problem for Sequences of Integer Squares
field: mathematics
tier: prose
statement: Does there exist a positive integer $M$ such that every sequence of $M$ integer squares with second differences equal to $2$ is necessarily of the form $(x+i)^2$ for some $x\in\mathbb Z$ and $1\leq i\leq M$?
