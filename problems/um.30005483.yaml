statement: In the successive edge-disjoint minimum-spanning-tree process, do the largest-component profiles satisfy $\rho_k(2k+t)\to\rho_\infty(t)$ as $k\to\infty$, and do the limiting tree weights satisfy $\gamma_k\to2k-1$?
