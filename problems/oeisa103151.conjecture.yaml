id: oeisa103151.conjecture
title: Number of decompositions of $2n+1$ into $2p+q$, where $p$ and $q$ are both odd primes
field: mathematics
tier: proof
statement: |-
  Conjecture: all items for $n \ge 4$ are greater than or equal to $1$. This is a stronger
  conjecture than the Goldbach conjecture.
