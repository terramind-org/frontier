title: Second-Chern Orthogonality and Calabi-Yau Automorphisms
field: mathematics
tier: prose
statement: Let $X$ be a strict Calabi-Yau threefold with infinite automorphism group. Must $c_2(X)^\perp\cap\operatorname{Amp}(X)_{\mathbb Q}$ contain a nonzero class? Also, does any such threefold other than the known examples $X_3$ and $X_7$ admit a primitive automorphism of positive entropy?
