title: Kourovka Notebook Problem 11.46
field: mathematics
tier: prose
statement: |-
  a) Does
  there exist a finite 3-group $G$ of nilpotency class 3 with the
  property $[a, a^{\varphi}]=1$ for all $a \in G$ and all
  endomorphisms $\varphi$ of $G$? (See A. Caranti, *J. Algebra*, **97**, no. 1 (1985), 1--13.)

  [Archived solved part(s) of 11.46:]
  b) Does there exist a finite
  $p
  $-group of nilpotency class greater than 2, with
  $\mathrm{Aut} G=\mathrm{Aut}_c G\cdot \mathrm{Inn} G$, where $\mathrm{Aut}_c G$ is the group of central automorphisms of $G$?

  c)
  Does there exist a 2-Engel finite
  $p
  $-group $G$ of nilpotency class greater than 2 such
  that $\mathrm{Aut} G=\mathrm{Aut}_c G\cdot \mathrm{Inn} G$, where $\mathrm{Aut}_c G$ is the group of central automorphisms of $G$?
