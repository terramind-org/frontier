  \item[S3] R. Johansen, On Flow Equivalence of Sofic Shifts, Problem5.3 and Example5.4, pp.71–72; recalls Williams, Notes on renewal systems (1990).
  \url{https://www.math.ku.dk/bibliotek/arkivet/phd-theses/phd11rj.pdf}.
  \item[S4] R. Johansen, Is Every Irreducible Shift of Finite Type Flow Equivalent to a Renewal System?, introduction: conjugacy question and negative sofic result.
  \url{https://arxiv.org/abs/1304.0888}.
