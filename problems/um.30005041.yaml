title: Interval Structure of Cohomology-Vanishing Exponents
field: mathematics
tier: prose
statement: Given a continuous homomorphism $$\sigma:G\longrightarrow\operatorname{Aut}(X,[\mu])\ltimes L^0(X,\mu;\{-1,1\}),$$ let $\pi_{p,\sigma}$ be the induced isometric representation on $L^p(X,\mu)$. Is the set $$\{p>0:H^1(G,\pi_{p,\sigma})=0\}$$ always an interval?
