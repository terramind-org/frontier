title: Spectral large-sieve bounds for GL(3) and a GL(4) conductor window
field: mathematics
tier: prose
statement: |-
  Let \(\alpha\in\mathbb R\) and \(f_j\) be a Maass form for \({\rm SL}(4,\mathbb Z)\) with eigenvalue \(t_j\) and Fourier coefficients \(\{\lambda_j(1,1,n)\}_{n\geq1}\). For parameters \(T\) and \(N\), prove a non-trivial bound for the averaged sum
  \[
  \sum_{t_j\sim T}\left|\sum_{n\leq N}\lambda_j(1,1,n)e(n\alpha)\right|^2.
  \]
  If \(\{f_j\}\) are Maass forms for \({\rm SL}(3,\mathbb Z)\), improve Miller's bound on average over the spectral parameter \(t_j\).
