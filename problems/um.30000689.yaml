title: Embedding Obstructions from Missing Simplicial Faces
field: mathematics
tier: prose
statement: Let $K$ be the $d$-skeleton of a triangulated $2d$-sphere, and let $T$ be a missing $d$-face of $K$, meaning that $T\notin K$ while $\partial T\subset K$. Then $K\cup\{T\}$ should not embed in the $2d$-sphere.
