  \section{Higher-Dimensional Cancellation for Affine Domains}\label{30000650}
  {\small UnsolvedMath ID 30000650 · Algebraic Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $k$ be algebraically closed and let $A$ be a finitely generated $k$-domain of dimension $d>2$. If adjoining $m>0$ polynomial variables gives $A[t_1,\ldots,t_m]\cong k[x_1,\ldots,x_{m+d}]$, must $A$ already be a polynomial ring in $d$ variables over $k$?
  \par\smallskip\textit{Formulation references:} \sref{30000650}{1}, \sref{30000650}{2}.
  \subsection{Short English statement}
  Let $k$ be algebraically closed and let $A$ be a finitely generated $k$-domain of dimension $d>2$. If adjoining $m>0$ polynomial variables gives $A[t_1,\ldots,t_m]\cong k[x_1,\ldots,x_{m+d}]$, must $A$ already be a polynomial ring in $d$ variables over $k$?
