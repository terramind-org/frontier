  definitions:
    - name: OeisA5132.a
      kind: def
      text: |-
        /-- Recamán's sequence value at index $n$, read from the end of its complete finite prefix. -/
        def a (n : ℕ) : ℕ :=
          (sequencePrefix n).getLastD 0
