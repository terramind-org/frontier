statement: |-
  (B. Amberg). Suppose that $G=AB=AC=BC$ for a
  group $G$ and its subgroups
  $A,B,C$.

  a) Is $G$ a Chernikov group if
  $
  A,B,C$ are Chernikov groups?

  b) Is $G$ almost polycyclic if
  $A,B,C$ are almost polycyclic?
