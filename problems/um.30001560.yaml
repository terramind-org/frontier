title: Nonvanishing Hankel Determinants of Morphic Sequences
field: mathematics
tier: prose
statement: Let $\varphi$ be the morphism $1\mapsto12$, $2\mapsto23$, $3\mapsto14$, $4\mapsto32$ and let $a=\varphi^\omega(1)$. Can one prove that every Hankel determinant of $a$ is nonzero? More generally, is it true that for every integer $m\geq2$ no infinite sequence over a finite subset of $\mathbb{Z}$ has all Hankel determinants nonzero modulo $m$?
