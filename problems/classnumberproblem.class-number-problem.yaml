lean:
  module: FormalConjectures.Wikipedia.ClassNumberProblem
  decl: ClassNumberProblem.class_number_problem
  statement: |-
    theorem class_number_problem :
        { d : ℤ | Squarefree d ∧ d > 1 ∧ IsClassNumberOne d }.Infinite
  context:
    - open ClassNumberProblem
    - open Polynomial
  definitions:
    - name: ClassNumberProblem.IsClassNumberOne
      kind: def
      text: |-
        def IsClassNumberOne (d : ℤ) : Prop :=
          ∃ (h₂ : Irreducible (X ^ 2 - C (d : ℚ))),
          have := Fact.mk h₂
          NumberField.classNumber (AdjoinRoot (X ^ 2 - C (d : ℚ))) = 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/ClassNumberProblem.lean#L31
