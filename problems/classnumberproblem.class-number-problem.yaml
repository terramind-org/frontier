schema: 1
id: classnumberproblem.class-number-problem
title: Class number problem for real quadratic fields
field: mathematics
tier: proof
statement: |-
  There are infinitely many real quadratic fields `ℚ(√d)` with class number one,
  where `d > 1` is a squarefree integer.
