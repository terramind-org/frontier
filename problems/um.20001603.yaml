title: A finite-product counterexample would force an exponential-growth supramenable subgroup
field: mathematics
tier: prose
statement: |-
  **Definition:** A group $G$ is *supramenable* if for every triplet
  $(G,X,E)$ (where $E$ is a nonempty subset of $X$ and
  $G \def\actson{\curvearrowright} X$), there is an invariant measure
  normalized on $E$.

  **Fact:** Subexponential growth implies supramenability.

  1. **Q:** (Rosenblatt 74') Is there a supramenable group of exponential
     growth?
  2. Is the direct product of $2$ supramenable groups also supramenable?
