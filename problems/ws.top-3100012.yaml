  \item[\hypertarget{source:statement:2}{S2}] Benny Sudakov and Jacques Verstraete, Cycle Lengths in Sparse Graphs (2007), abstract and section 1.3, pp. 1 and 3--4. \url{https://arxiv.org/abs/0707.2117}.
