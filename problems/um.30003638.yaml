title: Sub-Square-Root Möbius Bounds for Generalized Primes
field: mathematics
tier: prose
statement: Does there exist a Beurling generalized prime system for which $M_{\mathcal P}(x)=O(x^\alpha)$ for some $\alpha<1/2$? Can constructions based on periodic errors $N(x)-x$ be adapted to nonperiodic approximations of $\lfloor x\rfloor$ whose associated Mellin transforms have zeros with real parts approaching $1/2$?
