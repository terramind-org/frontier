title: Kato’s Main Conjecture for Modular Galois Representations
field: mathematics
tier: prose
statement: |-
  For the Galois representation $T$ attached to a normalized eigen-newform and the cyclotomic Iwasawa algebra $\Lambda$, does Kato's main-conjecture equality

  $$\operatorname{Char}(H^2(T)^\eta)=\operatorname{Char}((H^1(T)/\Lambda z_f)^\eta)$$

  hold for every character $\eta$ of the torsion subgroup of $\Gamma=\operatorname{Gal}(\mathbb Q(\mu_{p^\infty})/\mathbb Q)$, where $z_f$ is Kato's Euler-system element?
