title: Critical orbit relations and simultaneous PCF quadratic parameters
field: mathematics
tier: prose
statement: |-
  An algebraic subvariety in $M_d$ has a Zariski dense subset of PCF maps if and only if that subvariety is defined by critical orbit relations.

  Let $X \subset \mathbb{A}^2$ be a curve. Is it true that you have infinitely many points $(c_1,c_2) \in X$ such that $z^2+c_1$ and $z^2+c_2$ are both PCF if and only if it is vertical line, a horizontal line, or the diagonal?
