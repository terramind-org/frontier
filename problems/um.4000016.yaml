title: Discrete sectional curvature
field: mathematics
tier: prose
statement: Replace the $T_1$ distance in the coarse-Ricci definition by $L^\infty$ transport, requiring a coupling that moves every point by at most $d(x,y)$. Does this define a useful discrete sectional curvature, can it be assigned a numerical value, and is it related to Alexandrov sectional curvature?
