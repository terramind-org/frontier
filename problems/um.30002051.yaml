id: um.30002051
title: Mixed Littlewood Conjecture for Pseudo-Absolute Values
field: mathematics
tier: prose
statement: For a pseudo-absolute-value sequence $D=(n_k)$ with $n_0=1$ and $n_k\mid n_{k+1}$, define $|q|_D=\min\{n_k^{-1}:q\in n_k\mathbb Z\}$. Is $\inf_{q\geq1}|q|_D\,\lVert qx\rVert=0$ for every such $D$ and every $x\in\mathbb R$?
