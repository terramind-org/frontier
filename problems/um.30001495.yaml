title: Projection-Locus Smoothness and Cohomology Vanishing
field: mathematics
tier: prose
statement: Let $X\subset\mathbb P^{n+c}$ be a smooth $n$-dimensional variety and put $N=n+c$. Are the following assertions true? (1) $H^p(\mathcal J_X(q))=0$ whenever $p+(q+1)(c-1)\leq n$ and $p<N-1$. (2) If $k(c-1)<n$, then the normalization $\widetilde X_k$ of the multiplicity-at-least-$k$ locus of a general projection is smooth and connected. (3) If $k(c-1)\leq n$ and $\widetilde X_k$ is connected, then $H^1(\mathcal J_X(k-1))=0$.
