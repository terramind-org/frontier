title: Cohen–Lenstra Densities for Class-Group $\ell$-Ranks
field: mathematics
tier: prose
statement: Let $\ell$ be prime and $r\geq0$. Is the density of fundamental discriminants $D$ for which $\operatorname{rk}_\ell(C_D)=r$ equal to $\ell^{-r}\eta_\infty(\ell)\eta_r(\ell)^{-2}$ for $D<0$ and to $\ell^{-r(r+1)}\eta_\infty(\ell)\eta_r(\ell)^{-1}\eta_{r+1}(\ell)$ for $D>0$, where $\eta_k(t)=\prod_{j=1}^k(1-t^{-j})$?
