lean:
  module: FormalConjectures.ErdosProblems.«141»
  decl: Erdos141.erdos_141
  statement: |-
    theorem erdos_141 :
        ∀ k ≥ 3, ∃ (s : Set ℕ), s.IsAPAndPrimeProgressionOfLength k
  context:
    - open Erdos141
    - open Nat Erdos141
  definitions:
    - name: Erdos141.Set.IsAPAndPrimeProgressionOfLength
      kind: def
      text: |-
        /--
        The predicate that a set `s` is both an arithmetic progression of length `l` and a progression
        of `l` consecutive primes.
        -/
        def Set.IsAPAndPrimeProgressionOfLength (s : Set ℕ) (l : ℕ) :=
           s.IsAPOfLength l ∧ s.IsPrimeProgressionOfLength l
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/141.lean#L52
