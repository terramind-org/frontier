statement: If $Z(\mathfrak{g}_n)$ acts on a $\mathfrak{g}_n$-module $V$ through $\Lambda\in(\mathfrak{h}^*/W)_n$, prove that the induced critical-level module is scheme-theoretically supported on the oper subscheme $\operatorname{Op}^{\operatorname{ord}_n}_{\check G}(D)_{-\Lambda}$.
