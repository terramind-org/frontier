  \item[\hypertarget{source:statement:2}{S2}] Walter K. Hayman and Edward F. Lingham, \emph{Research Problems in Function Theory}, arXiv:1809.07200, 2018. Problem 4.10, its complete Update 4.10, and the relevant chapter notation. \url{https://arxiv.org/pdf/1809.07200}.
  \end{description}
