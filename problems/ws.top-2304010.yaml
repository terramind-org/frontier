statement: |-
  \section{Research Problems in Function Theory — Problem 4.10}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $n\ge1$ and let $f(z)=\prod_{j=1}^n(z-z_j)$ be a monic polynomial of degree $n$, with zeros repeated according to multiplicity. Its filled unit lemniscate is the compact set
  \[E_f=\{z\in\mathbb C:|f(z)|\le1\}.
  \]
  The monic normalization is the one used in the source's Problem 4.7 and its following lemniscate questions.Let $L_f=\{z\in\mathbb C:|f(z)|=1\}$ and let $\ell(L_f)=\mathcal H^1(L_f)$ be its total Euclidean arc length, with $\mathcal H^1$ denoting one-dimensional Hausdorff measure. All components are counted once, including when the curve has singular meeting points.
  \paragraph{Statement recorded in the supplied source.}
  For every $n\ge1$ and every monic degree-$n$ polynomial $f$, is
  \[\ell(L_f)\le\ell\bigl(\{z:|z^n-1|=1\}\bigr)?\]
  That is, does $z^n-1$ maximize total unit-lemniscate length in each degree? \sref{statement}{2}
  \subsection{Short English statement}
  Among all monic polynomials of a fixed degree, does z to that degree minus one have the longest unit lemniscate?
