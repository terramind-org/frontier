title: Bounded Negativity and Infinite Families of Negative Curves
field: mathematics
tier: prose
statement: "Bounded-negativity conjecture: for every smooth projective surface $X$ over $\\mathbb C$, the self-intersections of reduced irreducible curves on $X$ are bounded below; additionally, for every $g>1$, does some $X$ have infinitely many curves with $C^2=-1$ and arithmetic genus $g$?"
