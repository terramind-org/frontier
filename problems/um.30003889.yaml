title: Minimal Dimensions of Manifold Thickenings
field: mathematics
tier: prose
statement: Let $X$ be a finite aspherical complex with nonzero $k$th $L^2$-Betti number. Must every manifold thickening of $X$ have dimension at least $2k$? Equivalently, what is the minimum possible dimension of such a thickening?
