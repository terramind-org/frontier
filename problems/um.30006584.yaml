title: Elementary Equivalences for Ordered Exponential Fields
field: mathematics
tier: prose
statement: "Let $R$ be an ordered field equipped with an everywhere continuous and differentiable function $\\exp:R\\to R$ satisfying $\\exp'=\\exp$ and $\\exp(0)=1$. Are the following conditions equivalent: $R$ has the same first-order theory as the real exponential field $\\mathbb R_{\\exp}$; $R$ is o-minimal; and $R$ is definably complete?"
