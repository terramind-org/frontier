title: Branko Grunbaum in Many Dimensions — Conjecture 8
field: mathematics
tier: prose
statement: |-
  Various formulations of this conjecture have apparently been discussed for some time---see, for example, Dey [Dey93]. Work of Kalai and Sarkaria [Kalai91,Sarkaria92] suggests a precise formulation, which would in particular give the best possible constant $C_d$ in every dimension. Gr\"unbaum wrote that this question is ``still'' open in his 1970 article, but so far I have not been able to find any earlier reference to it in the literature.

  Another possible generalization of the inequality for planar graphs $ e \le 3v$ would be to show that

  For every $d \ge 1$ there is a constant $C_d$ such that
  $f_d \le C_d f_0^d$
