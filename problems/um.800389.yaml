title: Open Problems in Arithmetic Dynamics — Conjecture 12
field: mathematics
tier: prose
statement: |-
  [Amerik--Bogomolov--Rovinsky, 2011, [MR2862064];
  Medvedev--Scanlon, 2009, [arxiv0901.2352]]

  Let $X$ be a quasi-projective variety defined over an algebraically
  closed field $K$ of characteristic $0$. Let $f:X\to X$ be an
  endomorphism defined over $K$, and assume that $f$ is not a fibered
  map.
  \begin{parts}

  (a) \mathrm{(Weak form)}
  There exists a point $P\in X(K)$ whose orbit $\mathcal{O}_f(P)$
  is Zariski dense in $X$.

  (b) \mathrm{(Strong form)}
  The set
  \[
  \bigl\{ P\in X(K) : \text{$\mathcal{O}_f(P)$ is Zariski dense in $X$} \bigr\}
  \]
  is Zariski dense in $X$.
  \end{parts}
