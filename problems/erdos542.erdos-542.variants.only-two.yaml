lean:
  module: FormalConjectures.ErdosProblems.«542»
  decl: Erdos542.erdos_542.variants.only_two
  statement: |-
    theorem erdos_542.variants.only_two :
        ∀ (n : ℕ) (A : Finset ℕ), IsLcmFree n A → 1 < ∑ a ∈ A, (1 : ℝ) / a →
          A = {2, 3, 5} ∨ A = {3, 4, 5, 7, 11}
