title: Kourovka Notebook Problem 20.78
field: mathematics
tier: prose
statement: |-
  For an irreducible complex character $\chi$ of a finite group
  $G$, the *codegree* of $\chi$ is defined by $\mathrm{cod}(\chi)=|G:\ker\chi|/\chi(1)$. Let $\mathrm{Cod}(G)$ be the set of
  irreducible character codegrees of $G$.
  *Conjecture*: If $G$ has an
  element of order $m$, then $m$ divides some member of $\mathrm{Cod}(G)$.

  The conjecture is proved when $m$ is a prime power (G. Qian, *Arch. Math.*, **97** (2011), 99--103); when $m$ is square-free (I. M. Isaacs, *Arch. Math.*, **97** (2011), 499--501); or when $G$ is solvable (G. Qian, *Bull. London Math. Soc.*, **53** (2021) 820--824); or when $G$ is a symmetric or alternating group
  (E. Giannelli (*J. Algebra Appl.*, **23**, no. 9 (2024),
  article ID 2450144);
  or when $G$ is an almost simple group (S. Y. Madanha, *Commun. Algebra*, **51**, no. 7 (2023), 3143--3151); or when $\mathbf{F}(G)=1$ (Z. Akhlaghi, E. Pacifici, L. Sanus, *J. Algebra*, **644** (2024), 428--441).
