  \section{Local Birkhoff Rigidity Near Elliptical Billiards}\label{30004178}
  {\small UnsolvedMath ID 30004178 · Dynamical Systems}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let a smooth strictly convex planar billiard have invariant caustics with every rotation number in $(0,\delta)$ for some $\delta>0$. Under what hypotheses does this boundary foliation force the billiard table to be an ellipse?
  \par\smallskip\textit{Formulation references:} \sref{30004178}{1}, \sref{30004178}{2}.
