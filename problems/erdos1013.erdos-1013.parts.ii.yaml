lean:
  module: FormalConjectures.ErdosProblems.«1013»
  decl: Erdos1013.erdos_1013.parts.ii
  statement: |-
    theorem erdos_1013.parts.ii :
        Tendsto (fun k : ℕ ↦ (h3 (k + 1) : ℝ) / h3 k) atTop (nhds 1)
  context:
    - open Erdos1013
    - open Erdos1013.erdos_1013
    - open Erdos1013.erdos_1013.parts
    - open Filter Asymptotics
  definitions:
    - name: Erdos1013.h3
      kind: def
      text: |-
        /-- $h_3(k)$ is the least $n$ such that some triangle-free graph on $n$ vertices has chromatic
        number $k$. Triangle-free graphs of every chromatic number exist (Mycielski), so the set is
        nonempty and `sInf` is a true minimum. -/
        noncomputable def h3 (k : ℕ) : ℕ :=
          sInf {n : ℕ | ∃ G : SimpleGraph (Fin n), G.CliqueFree 3 ∧ G.chromaticNumber = k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/1013.lean#L41
