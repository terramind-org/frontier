  module: FormalConjectures.Paper.WeakTiling
  decl: WeakTiling.problem_4_2
  statement: |-
    theorem problem_4_2 :
        ∀ (n : ℕ) (_ : 3 ≤ n) (Ω : Set ℝ)
          (_ : IsUnionOfNIntervals n Ω) (ν : Measure ℝ) (_ : IsWeakTilingMeasure Ω ν),
          ∃ T : Set ℝ, IsProperTiling Ω T
