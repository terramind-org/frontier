title: Virtual-knot problem 46 — In it was showed how one could determine non-invertibility of long virtual knots and non-commutativity of long virtua…
field: mathematics
tier: prose
statement: |-
  In it was showed how one could determine
  non-invertibility of long virtual knots and non-commutativity of
  long virtual knots. This method used two type crossings: an early
  undercrossing and an early overcrossing. Further, for two types we
  have different operations, these operations are similar but not
  coincide (these operations are related to quandles). Regretfully,
  this method gives nearly nothing for classical knots. But it is
  universal: instead of the construction of quandle with two
  operations one can consider other ways of constructing knot
  invariants. In these ways we partition the set of crossings into two
  subsets, and for each subset we use an operation. Moreover, two
  operations are different enough to determine non-invertibility, and
  in the same time are similar to give an invariant structure. In the
  level of the Kauffman bracket polynomial this construction does not
  work. We get two problems.


  Try to do the same for other objects than quandles, for example:
  nonlinear quandles, quandles with rings having non-unique
  decomposition of multiples.


  Try to apply it on a “categorified level”: use the usual chain
  space for Khovanov homology and in it two different differentials
  but commute with each other (these differentials correspond to
  circle and star operations). These two different differentials could
  arise from usual and odd Khovanov homologies in the case when we
  have an identification (but maybe not canonical) between chain
  spaces of these complexes. It is expected that these invariants
  could recognize non-invertibility of knots.
