title: The Lyapin's Notebook — Problem 35
field: mathematics
tier: prose
statement: |-
  (S.G. Bershadsky, S.I. Kublanovsky)
  Find necessary and sufficient conditions for the embeddability of a regular semigroup into the power one over a periodic group.

  For completely regular semigroups such conditions are inversion and periodicity (see [Bersh+Kubl]).
