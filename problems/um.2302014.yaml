title: Research Problems in Function Theory — Problem 2.14
field: mathematics
tier: prose
statement: "[(a)] ; Let $f(z)=\\sum a_n z^n$ be entire and $m(r)=\\max_n |a_n|r^n$. If $C>\\frac{1}{2}$ then does there exist an entire $f$ with \\[m(r)/M(r,f)\\to C ?\\] Any value of $C$ such that $0<C\\leq\\frac{1}{2}$ is possible. ; If $f(z)\\neq0$, then \\[\\liminf_{r\\to\\infty}\\frac{m(r)}{M(r,f)}=0;\\] Is \\[\\lim_{r\\to\\infty}\\frac{m(r)}{M(r,f)}=0\\,?\\] ; What is the exact upper bound $\\beta$ of \\[\\beta_f=\\liminf_{r\\to\\infty}\\frac{m(r)}{M(r,f)}\\,?\\] It is known that $\\frac{4}{7}<\\beta<2/\\pi$. See Clunie and Hayman ."
