  \item[\hypertarget{source:2306097:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 2306097 (AMR-022-6097). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
