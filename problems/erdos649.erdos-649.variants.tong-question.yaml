  module: FormalConjectures.ErdosProblems.«649»
  decl: Erdos649.erdos_649.variants.tong_question
  statement: |-
    theorem erdos_649.variants.tong_question :
        ∀ q : ℕ, q.Prime → Odd q →
          {p : ℕ |
            p.Prime ∧ ¬ ∃ n : ℕ, n.maxPrimeFac = p ∧ (n + 1).maxPrimeFac = q}.Infinite
