title: Rational reduction and a prime-to-characteristic sieve for CTO examples
field: mathematics
tier: prose
statement: |-
  **Plausible reconstruction.** Can an irrational variety over a **number field** have a rational specialization in characteristic \(p>0\)? What happens for the examples of Colliot-Thélène and Ojanguren?

  It is Problem 3.78 in the section “Rationality in a family” of the AIM workshop list *Rational subvarieties in positive characteristic*. The immediately preceding Problem 3.72 asks about cubic fourfolds “defined over number fields” and their reductions. On that contextual evidence, the most plausible reconstruction is:

  This reconstruction is not source-verified, so the exact wording above is preserved. There is a second important ambiguity. “Irrational over a number field” can mean either:

  1. not rational over the number field, perhaps becoming rational over its algebraic closure (arithmetic irrationality); or
  2. geometrically irrational, and in the parenthetical CTO setting, not even stably rational after base change to an algebraic closure.

  The first reading has an elementary affirmative answer. The second is the mathematically substantive reading suggested by the parenthesis.

  Throughout the main result below, specialization means a smooth proper model \(\mathcal X\to\operatorname{Spec}R\) over a mixed-characteristic valuation ring, or a smooth proper spread over an open subscheme of the ring of integers of a number field. Rationality of a geometric fiber means rationality after base change to an algebraic closure of its residue field.
