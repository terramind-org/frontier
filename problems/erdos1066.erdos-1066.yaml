  module: FormalConjectures.ErdosProblems.«1066»
  decl: Erdos1066.erdos_1066
  statement: |-
    theorem erdos_1066 :
        Tendsto (fun n : ℕ ↦ (g n : ℝ) / n) atTop (𝓝 erdos_1066.answer)
  context:
