  module: FormalConjectures.GreensOpenProblems.«50»
  decl: Green50.green_50
  statement: |-
    theorem green_50 :
        ∃ C > (0 : ℝ), ∀ n : ℕ, ∀ A : Finset (𝔽₂ n),
        A.Nonempty →
        let α : ℝ := A.dens
        ∃ (W : Submodule (ZMod 2) (𝔽₂ n)) (v : 𝔽₂ n),
          v +ᵥ (W : Set (𝔽₂ n)) ⊆ ↑(10 • A) ∧
          (n : ℝ) - C * Real.logb 2 (1 / α) ≤ Module.finrank (ZMod 2) W
  context:
    - open Green50
    - open scoped Pointwise
  definitions: []
