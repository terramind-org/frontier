title: Virtual-knot problem 60 — Problems on Free Knot Cobordism
field: mathematics
tier: prose
statement: |-
  Problems on Free Knot Cobordism: The methods used for proving
  the fact that the invariant $L$ gives an obstruction to
  the sliceness are not immediately generalized for obtaining lower
  estimates on the slice genus of free knots. Two reasons are as
  follows. First, when we define a parity and justified
  parity for double lines on $\mathcal{D}$, we chose an arbitrary
  curve connecting the two preimages of the point on the double curve.
  We assert that any two curves connecting these two preimages (and
  behaving correctly in neighborhoods of the ends) are homotopic. It
  is true in the case of cobordism of genus zero, but in the case of a
  surface of an arbitrary genus $h$ it is, indeed, not true.

  Thus, in order to define a parity for double lines we have to impose
  some restrictions on the spanning surface: we have to require that
  the cohomology class dual to the graph $\Psi$ was
  $\mathbb{Z}_{2}$–homologically trivial. The significance of the
  property for even-valent graphs to be
  $\mathbb{Z}_{2}$–homologically trivial is closely connected with
  atoms (for details see Sec. the cited item
  and ).

  Another problem is that the Reeb graph of an arbitrary Morse
  function (not necessarily corresponding to the disc) is not
  necessarily a disc. Consider Fig. the cited item.

  Thus, starting from a free knot $K$ for which, we say, $L(K)=8$, we
  (in principle) can turn it by a Morse bifurcation into free
  two-component link consisting of two free knots $K_{1}$ and
  $K_{2}$, for which $L(K_{i})=4$, and then by another Morse
  bifurcation we can reconstruct this trivial link into the unknot.
  The invariant $L$ is not an obstruction to this, since the sum of
  $4$ and $-4$ is zero.

  In some cases we can overcome these two difficulties for cobordisms
  (of arbitrary genus).

  Let $\mathcal{D}_{g}$ be a surface with boundary $S^1$. Obviously,
  the collection of double lines of $\mathcal{D}_{g}$ defines a
  relative $\mathbb{Z}_{2}$–homology class $\kappa\in
  H_1(\mathcal{D}_g,S^1;\mathbb{Z}_2)$. This homology class is an
  obstruction for the surface to be checkerboard-colorable; also, this
  is an obstruction for well-definedness of even/odd double lines.

  Namely, if we look at the definition of an even/odd double line: we
  see that there is an ambiguity in the choice of path connecting two
  preimages of a generic point on the double line. For the case of a
  disc cobordism, the parity of double lines is well defined, because
  all such curves are homotopic. For $\mathcal{D}_{g}$ the unique
  obstruction to this well-definedness is the class $\kappa$.

  We call a cobordism of genus $g$ checkerboard (or atomic\/) if the corresponding class $\kappa$ vanishes.

  The next task (after detecting which $1$-stratum is even and which
  one is odd) is to distinguish between $b$ and $b'$. To this end, one
  should do the same for preimages of points lying on odd $1$-strata,
  connect them by a generic curve, and count the intersection with
  even double lines. So, we see that the only obstruction is the
  relative $\mathbb{Z}_{2}$–homology class $\kappa'\in
  H_1(\mathcal{D}_g,S^1;\mathbb{Z}_2)$ generated by even double lines.

  We say that a checkerboard cobordism is $2$-atomic if
  $\kappa'$ vanishes.

  The following theorem holds.

  [see ]
  Assume for a $1$-component framed $4$-graph $K$ we have $L(K)\neq
  0$. Then there is no $2$-atomic cobordism spanning the knot $K$ of
  any genus.

  In the papers the fourth author constructed a
  strengthening $G_{m}$ of the group $G$ given in the present work (in
  the notation our group $G$ is $G_{1}$) and the
  invariants of free knots with values in the classes of conjugate
  elements from $G_{m}$. The idea is as follows. Even chords are
  further partitioned into chords of different types, it leads to more
  accurate definition of generators and relations in the group; these
  constructions are closely connected with iterated parities and
  the map deleting odd crossings. It seems that all invariants related
  to the groups $G_{m}$ also give an obstruction to the sliceness of a
  knot. Moreover, in the paper the author constructed
  invariants of virtual knots in which the over/undercrossing
  structure was taken into account besides the parity of chords. We
  devote a separate paper to the investigation of a connection of
  these invariants with cobordisms.
