title: Geometric Hydrodynamics in Open Problems — Problem 28
field: mathematics
tier: prose
statement: |-
  Arnold pointed out the remarkable topology of steady 3D fields:
  for an analytic steady field, not everywhere collinear with its curl, the flow domain is almost everywhere
  fibered into invariant tori and annuli, see [arn66, ak]. If the steady field is everywhere collinear with its vorticity
  but the proportionality coefficient is a generic function, then the domain is still fibered in a similar way.
  If the steady field is Beltrami, i.e., it is an eigenfield for the curl operator,
  $\mathrm{curl} v=\lambda v$, then its topology can be very intricate.
  Hence a paradox arises:
  a generic steady field has a very regular topology, while a sufficiently chaotic field must necessarily
  be an eigenfield for the curl operator.

  Explain this paradox: what is a typical steady field and what genericity notion is natural for steady fields?
