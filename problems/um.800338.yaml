title: Enumeration of Matchings — Problem 9
field: mathematics
tier: prose
statement: |-
  One can also look at ``Aztec rectangles'' from which squares have been
  removed so as to restore the balance between black and white squares
  (a necessary condition for tilability). For instance, one can remove
  the central square from an $a$-by-$b$ Aztec rectangle in which $a$
  and $b$ differ by 1, with the larger of $a,b$ odd:
  \begin{verbatim}
  XX
  XXXX
  XXXXXX
  XXXXXXXX
  XXXX XXXX
  XXXXXXXX
  XXXXXX
  XXXX
  XX
  \end{verbatim}

  Find a formula for the number of domino tilings of a
  $2n$-by-$(2n+1)$ Aztec rectangle with its central square removed.
