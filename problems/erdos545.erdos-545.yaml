lean:
  module: FormalConjectures.ErdosProblems.«545»
  decl: Erdos545.erdos_545
  statement: |-
    theorem erdos_545 :
        ∀ᶠ m : ℕ in atTop, ∀ (n t : ℕ), t < n → m = n.choose 2 + t →
          ∀ (V : Type) [Fintype V] (G : SimpleGraph V) [DecidableRel G.Adj],
            (∀ v, 0 < G.degree v) →
            G.edgeSet.ncard = m →
            SimpleGraph.diagonalGraphRamsey G ≤
              SimpleGraph.diagonalGraphRamsey (knPlusTEdges n t)
  context:
    - open Erdos545
    - open Filter
  definitions:
    - name: Erdos545.knPlusTEdges
      kind: def
      text: |-
        /--
        The graph formed by connecting a new vertex (`none`) to $t$ of the vertices of $K_n$ (`Fin n`).
        -/
        def knPlusTEdges (n t : ℕ) : SimpleGraph (Option (Fin n)) where
          Adj u v := match u, v with
            | some x, some y => x ≠ y
            | none, some y => y.val < t
            | some x, none => x.val < t
            | none, none => False
          symm.symm u v := by
            cases u <;> cases v <;> simp [ne_comm]
          loopless.irrefl u := by
            cases u <;> simp
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/545.lean#L37
