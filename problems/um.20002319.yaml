title: A finite-jump transfer from strongly minimal reducts
field: mathematics
tier: prose
statement: "**Conjecture 17.** For any \\(\\aleph_1\\)-categorical \\(T\\) there is an \\(n\\) such that if \\(T\\) has a computable model then every countable model has a presentation computable in \\(\\mathbf 0^{(n)}\\). Note that if \\(T\\) is strongly minimal then \\(n=4\\) works."
