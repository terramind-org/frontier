title: A block formula and Morse-potential computation for compact monotone Fukaya categories
field: mathematics
tier: prose
statement: |-
  “Same questions as above for \(Fuk(X)\) where \(X\) is compact symplectic.”

  **Recovered question.** For a well-defined split-closed derived Fukaya
  category of a compact symplectic manifold \(X\), determine its Rouquier
  dimension and its full Orlov spectrum, including the occurrence and size
  of gaps and consecutive sequences.

  - 7.1: “What can be said about the Orlov spectrum of a toric variety (or
    any \(X\))? (e.g. about gaps, sequences, etc.)”
  - 7.2: “What about Rouquier dimension or Orlov spectrum of
    \(D^b(\operatorname{Sing}(X)) =
    D^b(\operatorname{Coh}(X))/D^b(\operatorname{Perf}(X))\)?”

  Thus the conservative recovery of 7.3 is:

  It takes from 7.1
  and 7.2 only the explicitly shared invariants, Rouquier dimension and Orlov
  spectrum.
