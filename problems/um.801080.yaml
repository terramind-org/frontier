title: "Henon Maps: Open Problems — Question 32"
field: mathematics
tier: prose
statement: |-
  Since a local unstable slice of a generalized H\'enon maps contains
  essentially a complete
  information about unstable multipliers, the previous question is reminiscent of the classical
  ``spectral rigidity'' problem:

  To which extent is a generalized H\'enon map determined by the list of its unstable multipliers (resp. by the list of moduli of its unstable multipliers)?
