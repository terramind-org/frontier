schema: 1
id: abc.abc
title: "*abc* conjecture"
field: mathematics
tier: proof
statement: For every positive real number `ε`, there exist only finitely many triples `(a, b, c)` of coprime positive integers, with `a + b = c`, such that `c > rad(abc)^(1+ε)`
ams:
  - 11
tags:
