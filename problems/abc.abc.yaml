upstream_status: open
lean:
  module: FormalConjectures.Wikipedia.ABC
  decl: ABC.abc
  statement: |-
    theorem abc (ε : ℝ) (hε : 0 < ε) :
        {(a, b, c) : ℕ × ℕ × ℕ | 0 < a ∧ 0 < b ∧ 0 < c ∧ ({a, b, c} : Set ℕ).Pairwise Nat.Coprime ∧
        a + b = c ∧ (radical <| a * b * c : ℝ)^(1 + ε) < c}.Finite
  context:
    - open ABC
  definitions:
    - name: ABC.radical
      kind: def
      text: |-
        /--
        The radical of `n` denoted is the product of the distinct prime factors of `n`.
        -/
        def radical (n : ℕ) : ℕ := n.primeFactors.prod id
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/ABC.lean#L30
