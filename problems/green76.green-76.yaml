lean:
  module: FormalConjectures.GreensOpenProblems.«76»
  decl: Green76.green_76
  statement: |-
    theorem green_76 :
        ∀ A : Finset (ℝ × ℝ), ∃ A', #A' ≤ #A / 2 ∧ HitsRichRectangles 1000 A A'
  context:
    - open Green76
    - open scoped Finset
  definitions:
    - name: Green76.HitsRichRectangles
      kind: def
      text: |-
        /--
        `HitsRichRectangles k A A'` says that every closed axis-parallel rectangle that contains at least
        $k$ points of $A$ also contains a point of $A'$.

        For $a = (a_1, a_2)$ and $b = (b_1, b_2)$, `Set.Icc a b` is the rectangle
        $[a_1, b_1] \times [a_2, b_2]$. It is empty if $a_1 > b_1$ or $a_2 > b_2$, and it can be a segment
        or a point.
        -/
        def HitsRichRectangles (k : ℕ) (A A' : Finset (ℝ × ℝ)) : Prop :=
          ∀ a b : ℝ × ℝ, k ≤ #{p ∈ A | p ∈ Set.Icc a b} → ∃ p ∈ A', p ∈ Set.Icc a b
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/GreensOpenProblems/76.lean#L43
