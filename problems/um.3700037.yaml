title: Maximum length of a polynomial lemniscate
field: mathematics
tier: prose
statement: For a monic polynomial $p$ of degree $d$, determine the maximum length of the lemniscate $E(p)=\{z:|p(z)|=1\}$. Is the extremal asymptotically $p(z)=z^d+1$, giving maximum length $2d+o(1)$ as $d\to\infty$?
