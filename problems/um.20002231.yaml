title: Denominator-support transversal duality for HTP boundary sets
field: mathematics
tier: prose
statement: |-
  Given \(f\in \mathbb Z[x_1,\dots,x_n]\), define
  \[
  A(f)=\{\text{subrings of }\mathbb Q\text{ where }f\text{ has a solution}\},
  \]
  \[
  \mathcal C(f)=\operatorname{Int}(A(f)^c),\qquad
  B(f)=\partial(A(f)^c).
  \]
  1. Can the Lebesgue measure of \(B(f)\) be positive?
  2. If so, what is the maximal complexity of the measure of \(B(f)\)?
  3. Is \(\mathcal C(f)\) always a finite union of basic open sets?
