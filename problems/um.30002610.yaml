title: Tropical-Disc Mirror Algebras for Log Calabi–Yau Varieties
field: mathematics
tier: prose
statement: |-
  Let $U$ be an affine log Calabi–Yau variety with maximal boundary, and let
  $$A=\bigoplus_{p\in U^t(\mathbb Z)}\mathbb C\vartheta_p.$$
  Does $A$ have a natural finitely generated commutative associative algebra structure whose integer structure constants in
  $$\vartheta_p\vartheta_q=\sum_r\alpha(p,q,r)\vartheta_r$$
  count tropical discs? Is $U^\vee=\operatorname{Spec}(A)$ an affine log Calabi–Yau mirror with maximal boundary, is mirror duality involutive, and do the induced canonical bases restrict to bases of regular functions on every partial minimal model?
