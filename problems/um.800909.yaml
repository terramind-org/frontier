title: Open Problems in Pluripotential Theory — Question 41
field: mathematics
tier: prose
statement: |-
  When $S_0$ has some non-zero Lelong numbers, DiNezza and Lu construct a maximal family of positive currents
  $(\omega_t)_{0<t<T_{max}}$ which are honest K\"ahler forms on a time-increasing family of Zariski open subsets $\Omega_t$ where they satisfy the K\"ahler-Ricci flow equation.
  By analogy with Demailly regularization results [Dem92,Dem93], it is natural to expect that this family
  has analytic singularities.

  [DiNezza-Lu]
  Does the K\"ahler-Ricci flow produce approximants with analytic singularities ?
