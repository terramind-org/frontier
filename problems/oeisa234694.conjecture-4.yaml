lean:
  module: FormalConjectures.OEIS.«234694»
  decl: OeisA234694.conjecture_4
  statement: |-
    theorem conjecture_4 (n : ℕ) (hn : 21 < n) :
        ∃ k, 0 < k ∧ k < n ∧
          let m := k + Nat.nth Nat.Prime (n - k - 1)
          Nat.Prime (m - 1) ∧ Nat.Prime (Nat.nth Nat.Prime (m - 1) - m)
  context:
    - open OeisA234694
  definitions: []
