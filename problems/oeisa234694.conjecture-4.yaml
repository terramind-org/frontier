id: oeisa234694.conjecture-4
title: Integers $0 < k < n$ with $p = k + \mathrm{prime}(n - k)$ and $\mathrm{prime}(p) - p + 1$ prime (conjecture_4)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): If $n > 21$, then there is a positive integer $k < n$ such that
  $m - 1$ and $\mathrm{prime}(m) - m$ are both prime, where $m = k + \mathrm{prime}(n - k)$.
