id: oeisa86766.conjecture3
title: Smallest $r$ such that (concatenation of $n$, $r$ times) $\cdot 10 + 1$ is prime (conjecture3)
field: mathematics
tier: proof
statement: |-
  What is the smallest odd prime $p$ such that $(10^{p^2}-1)/(10^p-1)$ is a prime number
  (and $a(10^{p-1})$ could be nonzero)?
  - _Farideh Firoozbakht_, Jan 07 2015
