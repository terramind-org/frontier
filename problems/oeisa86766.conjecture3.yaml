lean:
  module: FormalConjectures.OEIS.«86766»
  decl: OeisA86766.conjecture3
  statement: |-
    theorem conjecture3 :
        conjecture3.answer =
          if h : ∃ p, p.Prime ∧ 2 < p ∧ ((10 ^ (p ^ 2) - 1) / (10 ^ p - 1)).Prime then
            some (sInf {p | p.Prime ∧ 2 < p ∧ ((10 ^ (p ^ 2) - 1) / (10 ^ p - 1)).Prime})
          else
            none
