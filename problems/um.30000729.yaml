title: Equilibrium Supports on Solids of Revolution
field: mathematics
tier: prose
statement: Let $\Gamma(A)$ be the set of revolution generated by a compact set $A$, and let $\mu_{s,\Gamma(A)}$ be its $s$-equilibrium measure for $0<s<1$. Is it true that, for every $0<s<1$, there exists a compact set $A$ for which the support of $\mu_{s,\Gamma(A)}$ is a proper subset of the outer boundary of $\Gamma(A)$?
