title: Admissibility and Kinetic Relations for Undercompressive Shocks
field: mathematics
tier: prose
statement: For the singularly perturbed conservation law $u_t^\varepsilon+f(u^\varepsilon)_x=R(\varepsilon u_x^\varepsilon,\varepsilon^2u_{xx}^\varepsilon,\ldots)_x$ and its limit $u_t+f(u)_x=0$, determine which discontinuities are admissible and the corresponding Riemann solution. In particular, characterize undercompressive shocks and the kinetic relation needed for uniqueness.
