title: Exponential Small-Value Bounds for Littlewood Polynomials
field: mathematics
tier: prose
statement: Let $\mathcal P_d=\{a_dx^d+\cdots+a_0:a_i\in\{-1,0,1\}\}$. For every rational $p/q\in[9/10,19/20]$, does there exist an absolute $C>0$ such that $\#\{P\in\mathcal P_d:|P(p/q)|<c_{p,q}e^{-Cd}\}<e^{d/100}$ for some constant $c_{p,q}$?
