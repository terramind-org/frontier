title: Problem 2.15 — (Frequency of low symmetry).
field: mathematics
tier: prose
statement: (Frequency of low symmetry). Let H denote the set of integers g≥ 2 such that N (g) = 8( g + 1). Find the s0 for which the series ∑ g∈Hg−s converges absolutely for the real partℜ(s) of s satisfyingℜ(s)>s 0, and has a singularity at s =s0. There are various refinements and variations on Problem 2.15. For example, Accola proves in [Ac] that when g is divisible by 3, then N (g)≥ 8(g + 3), with the bound attained infinitely often. One can try to build on this for other g, and can also ask for the frequency of this occurence. One can begin to refine Hurwitz’s Theorem by asking for bounds of orders of groups of auto- morphisms which in addition satisfy various algebraic constraints, such as being nilpotent, being solvable, being a p-group, etc. There already exist a number of theorems of this sort. For example, Zomorrodian [ Zo] proved that if Aut( Xg) is nilpotent then it has order at most 16( g− 1), and if this bound is attained then g− 1 must be a power of 2. One can also ask for lower bounds in this context. As these kinds of bounds are typically attained and not attained for infinitely many g, one then wants to solve the following.
