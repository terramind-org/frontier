title: Kourovka Notebook Problem 13.5
field: mathematics
tier: prose
statement: |-
  Groups $A$ and $B$ are said to
  be *locally equivalent* if for every finitely generated
  subgroup $X\leq A$ there is a subgroup $Y\leq B$ isomorphic to
  $X$, and conversely, for every finitely generated subgroup
  $Y\leq B$ there is a subgroup $X\leq A$, isomorphic to
  $Y$. We call a group $G$ *categorical* if $G$ is isomorphic
  to any group that is locally equivalent to $G$.
  Is it true that a periodic locally soluble group
  $G$ is categorical if and only if
  $G$ is hyperfinite with Chernikov Sylow subgroups?
  (A group is *hyperfinite* if it has a well ordered ascending
  normal series with finite factors.)
