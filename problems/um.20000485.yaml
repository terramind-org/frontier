title: Cartesian-product closure and endpoint tests for Robin-gap monotonicity
field: mathematics
tier: prose
statement: |-
  **Monotonicity of the spectral gap.** For a bounded convex domain
  \(\Omega\subset\mathbb R^n\), the spectral gap
  \(\lambda _2(\Omega,\alpha)-\lambda _1(\Omega,\alpha)\) is strictly
  increasing as a function of \(\alpha>0\). In particular, the Neumann gap
  provides a lower bound for the Dirichlet gap:
  \[
  \mu _1(\Omega)<\lambda _2(\Omega)-\lambda _1(\Omega).
  \]
