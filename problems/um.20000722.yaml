title: "Hurwitz class numbers: missing-context audit, all-index formula, and CM groupoid count"
field: mathematics
tier: prose
statement: |-
  Here $h_m$ is the $m$-th Hurwitz class number, i.e. the number of equivalence classes of positive definite binary quadratic forms of discriminant $-m$ with the class containing $x^2+y^2$ weighted by 1/2 and the class containing $x^2 + xy + y^2$ weighted by 1/3. Moreover by convention $h_0=-1/12.$

  For more information in regards to the connection between physics and number theory, see the following work of Kathrin Bringmann and Ben Kane (arXiv:1305.0112), Katrin Bringmann and Sameer Murthy (arXiv:1208.3476), and Katrin Bringmann and Jan Manschot (arXiv:1304.7208).

  Do the coefficients of $h_m$ have enumerative significance? Can we find $h_m$ for $m \geq 9$?
