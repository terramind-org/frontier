title: Independence-Number Degeneracy in Induced-Subdivision-Free Graphs
field: mathematics
tier: prose
statement: For every positive integer $t$, does there exist $C>0$ such that every graph with no induced $K_{t,t}$ and no induced subdivision of $K_t$ in which every edge is subdivided at least once has a vertex $v$ satisfying $\alpha(N(v))\leq C$?
