title: Selection Principles in Mathematics — Problem 8
field: mathematics
tier: prose
statement: |-
  Assume the Continuum Hypothesis{}. Settings (c),(h), and (i) were realized in [coc2],
  Setting (k) was realized in [o-bdd], and Setting (n)
  was realized in [Rec94, Brendle96, MilNonGamma].
  To realize Setting (b), take a set $L$ as in Setting (c)
  and a set $S$ as in Setting (i), and take $X=L\cup S$.
  As $\mathsf{S}_{\mathrm{fin}}(\mathrm{B},\mathrm{B})$ is additive, $X$ satisfies this property.
  But since $\mathsf{S}_1(\mathrm{B}_\Gamma,\mathrm{B}_\Omega)$ and $\mathsf{S}_1(\mathrm{B},\mathrm{B})$ are hereditary for subsets [ideals],
  $X$ does not satisfy any of these.
  It seems that using forcing-theoretic arguments similar to those of [Brendle96],
  we can realize Settings (f) and (m).

  Does the Continuum Hypothesis{} imply a realization of the settings (d),(e),(g),(j), and (l)?
