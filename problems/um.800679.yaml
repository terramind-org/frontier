title: Holomorphic Foliation Theory — Problem 6
field: mathematics
tier: prose
statement: |-
  The question is quite old and is due to Camacho-Lins Neto-Sad [CLS]. The problem is also discussed in [FS3]. The answer is positive if $\mathscr{F}$ admits a directed positive closed $(1,1)$-current $T$, in particular, when $\mathscr{F}$ has an invariant algebraic curve. The support of this current $T$ should contain a singularity since otherwise the cohomology class of $T$ satisfies $\{T\}^2=0$ which is impossible in $\mathbb{P}^2$. Using the leaf $L$, we can construct a directed positive ${dd^c}$-closed current $S$ supported by $\overline L$.
  Again, for cohomological reason, one can show that $S$ and $T$ have to intersect and the intersection should be at the singularities as both currents are directed by the foliation. For this purpose, one can use the theory of densities for currents, see also [DS1].

  Does there exist a Levi flat smooth or real analytic hypersurface in $\mathbb{P}^2$ ?
