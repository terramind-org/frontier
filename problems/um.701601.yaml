title: Kourovka Notebook Problem 19.53
field: mathematics
tier: prose
statement: |-
  Let $G$ be a group generated by elements $x,y,z$ such that
  $$x^3=y^2=z^2=(xy)^3=(yz)^3=1\quad \text{and}\ \quad g^{12}=1 \text{ for all }g\in G.$$
  Is it true that $|G|\leq 12$?

  This is true if $G$ is finite (D. V. Lytkina, V. D. Mazurov, *Siberian Math. J.*, **56**, no. 3 (2015), 471--475).
