title: Equivariant unfolding reduction for polygonal quantum limits
field: mathematics
tier: prose
statement: |-
  **Problem 44 (J. Marklof).** Classify all quantum limits of the eigenfunctions of a polygonal billiard.

  According to the Berry--Tabor conjecture ...”. The PDF confirms that this is the start of the next subsection, about eigenvalue statistics of integrable systems and quadratic forms; it is not part of Problem 44.

  The surrounding AIM definitions matter. In §6.1, the eigenfunctions satisfy the **Dirichlet** boundary condition, and a “quantum limit” means a weak-* limit on configuration space of
  \[
    |u_j(x)|^2\,dx,
    \qquad -\Delta_Pu_j=E_j u_j,\quad \|u_j\|_{L^2(P)}=1,\quad E_j\to\infty. \]
  Thus this is the primary reading below. Modern papers also call phase-space semiclassical measures quantum limits; §3 distinguishes that stronger notion.
