title: Research Problems in Function Theory — Problem 5.18
field: mathematics
tier: prose
statement: "Let $f(z)=\\lambda+a_1z+\\ldots$ be analytic in $\\mathbb{D}$, where $0<\\lambda<1$. Find the best constant $B(\\lambda)$ such that if \\[F(r)=\\lambda+|a_1|r+|a_2|r^2+\\ldots,\\] then \\[F[B(\\lambda)]\\leq1\\] for all $f$. It is known that (see Bombieri ): \\[B(\\lambda)= \\begin{cases} (1+2\\lambda)^{-1} &\\text{if }\\frac{1}{2}\\leq\\lambda<1, 1/\\sqrt{2}&\\text{if }\\lambda=0, \\end{cases}\\] and that \\[B(\\lambda)>[(1-\\lambda)/2]^{\\frac{1}{2}},\\hspace{1cm}\\text{if }0<\\lambda<\\frac{1}{2}.\\]"
