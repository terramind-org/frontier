schema: 1
id: erdos308.erdos-308.variants.all-n
title: "Erdős Problem 308 (variant: all_N)"
field: mathematics
tier: proof
statement: |-
  Is it true that, for every $N\geq 1$, the set of integers representable as the sum of distinct
  unit fractions with denominators from $\{1,\ldots,N\}$ has the shape $\{1,\ldots,m\}$ for some
  $m$?
ams:
  - 11
tags:
  - erdos-problems
  - variant
references:
  - label: erdosproblems.com/308
    url: https://www.erdosproblems.com/308
source:
  name: formal-conjectures
  repo: https://github.com/google-deepmind/formal-conjectures
  commit: d8d031d4998c78575159ccab9a7a9e95ce043883
  path: FormalConjectures/ErdosProblems/308.lean
  url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/308.lean#L114
  licence: Apache-2.0
upstream_status: open
lean:
  module: FormalConjectures.ErdosProblems.«308»
  decl: Erdos308.erdos_308.variants.all_N
  statement: |-
    theorem erdos_308.variants.all_N :
        ∀ N ≥ 1, ∃ m, representable N = Set.Icc 1 m
  context:
    - open Erdos308
    - open Erdos308.erdos_308
    - open Erdos308.erdos_308.variants
    - open Filter Real
  definitions:
    - name: Erdos308.representable
      kind: def
      text: |-
        /-- The set of positive integers representable as a sum of distinct unit fractions with
        denominators from `{1, …, N}`. -/
        def representable (N : ℕ) : Set ℕ := {k | 0 < k ∧ IsRepresentable N k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/308.lean#L42
    - name: Erdos308.m
      kind: def
      text: |-
        /-- `m N = ⌊∑_{n ≤ N} 1/n⌋`. -/
        def m (N : ℕ) : ℕ := ⌊harmonic N⌋₊
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/308.lean#L50
