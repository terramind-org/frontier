lean:
  module: FormalConjectures.ErdosProblems.«413»
  decl: Erdos413.erdos_413.variants.bigOmega
  statement: |-
    theorem erdos_413.variants.bigOmega :
        { n | IsBarrier (fun m => Ω m) n }.Infinite
  context:
    - open Erdos413
    - open Erdos413.erdos_413
    - open Erdos413.erdos_413.variants
    - open ArithmeticFunction
    - open scoped omega Omega
  definitions:
    - name: Erdos413.IsBarrier
      kind: def
      text: |-
        /-- `IsBarrier f n` means `n` is a barrier for the real-valued function `f`,
        i.e. `(m : ℝ) + f m ≤ (n : ℝ)` for all `m < n`. -/
        def IsBarrier (f : ℕ → ℝ) (n : ℕ) : Prop :=
          ∀ m < n, (m : ℝ) + f m ≤ n
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/413.lean#L42
