title: Reducing interchange comparisons to two label-mixing bounds
field: mathematics
tier: prose
statement: |-
  **Comparison of interchange to SRW and Exclusion.** Consider the interchange process with \(n\) particles on \(n\) vertices. Can you say the following?
  \[
  \begin{aligned}
  t_{\mathrm{mix}}^{IP}&\lesssim t_{\mathrm{mix}}^{SRW}\log n,\\
  t_{\mathrm{mix}}^{IP}&\lesssim t_{\mathrm{mix}}^{SRW,n},\\
  t_{\mathrm{mix}}^{IP}&\asymp t_{\mathrm{mix}}^{SSEP,n/2}?
  \end{aligned}
  \]
