title: Gauge-corrected uniqueness for conical Yang-Mills shrinkers
field: mathematics
tier: prose
statement: |-
  Must two Yang-Mills self-shrinkers that are asymptotic to the conical connection be actually identical?

  If two smooth solutions of (1) approach a fixed cone connection in specified asymptotic gauges and at a specified rate, must they be gauge equivalent? If a global gauge normalization is also imposed, must the normalized representatives coincide?
