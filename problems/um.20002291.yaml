id: um.20002291
title: Existential graph coding and empty-graph coordinate rigidity
field: mathematics
tier: prose
statement: |-
  **Question 7 (Miller).** Given a countable graph \((V,E)\), find a field \(K\) of characteristic \(0\), polynomials
  \[
  P\in\mathbb Q[x,t],\qquad Q,R\in\mathbb Q[x,y,z],
  \]
  and a bijection
  \[
  \alpha:V\longrightarrow\{x\in K:(\exists t\in K)\,P(x,t)=0\}
  \]
  such that, for all \(v,w\in V\),
  \[
  (v,w)\in E\Longleftrightarrow(\exists z)\,R(\alpha(v),\alpha(w),z)=0,
  \]
  \[
  (v,w)\notin E\Longleftrightarrow(\exists z)\,Q(\alpha(v),\alpha(w),z)=0.
  \]

  **Poonen:** let \(P\) define a curve without non-trivial automorphism.

  **For the empty graph:** Find \(P\in\mathbb Q[x,t]\) such that \(K\) is generated by
  \(x_1,x_2,\ldots,t_1,t_2,\ldots\), the elements \(x_1,x_2,\ldots\) are algebraically independent, \(P(x_i,t_i)=0\) for every \(i\), and:

  1. for every permutation \(\pi\) of \(\mathbb N\), there is a unique automorphism \(\sigma_\pi\) of \(K\) such that \(\sigma_\pi(x_i)=x_{\pi(i)}\);
  2. \(\{x_i:i\in\mathbb N\}=\{y\in K:(\exists t)\,P(y,t)=0\}\).
