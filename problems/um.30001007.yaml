title: Dominance of Pure-Cycle Hurwitz-Space Components
field: mathematics
tier: prose
statement: Fix $r,g\geq0$, $d\geq1$, and $(e_1,\ldots,e_r)$ satisfying $2d-2-g=\sum_i(e_i-1)$. Let $\mathcal H$ be the Hurwitz space of genus-$g$, degree-$d$ pure-cycle covers branched to orders $e_i$ over $r$ marked points and simply branched over $3g$ additional points. Does every component of $\mathcal H$ map dominantly to $\mathcal M_{g,r}$ after forgetting the covering map and the $3g$ simple ramification points?
