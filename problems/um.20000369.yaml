title: All-valuation isotropy of a quadratic pencil and the limits of Boolean local tests
field: mathematics
tier: prose
statement: |-
  **Problem 1.** Browning: Can we develop a version of the circle method over \(\mathbf Q(t)\)?
  Wooley: The major arcs are difficult to understand.
  Browning: For example, consider the diagonal quadratic form
  \[
  A_1x_1^2+\cdots+A_sx_s^2=0 \tag{1}
  \]
  with \(A_j\in\mathbf Q(t)\). There are “obvious” local conditions, e.g. arising from discrete valuation rings for \(\mathbf Q(t)\). Does the Hasse principle hold?
  Wooley: If \(A_j\) are linear, say \(A_j=c_j+td_j\) with \(c_j,d_j\in\mathbf Q\), then (1) is equivalent to the system of equations
  \[
  \sum_{j=1}^s c_jx_j^2=\sum_{j=1}^s d_jx_j^2=0 \tag{2}
  \]
  by Amer--Brumer, which defines a quartic del Pezzo surface over \(\mathbf Q\). Do the “obvious” local obstructions over \(\mathbf Q(t)\) for (1) capture the Brauer--Manin obstruction over \(\mathbf Q\) for (2)?
  Harari: We may ask these questions over \(\mathbf Q_p(t)\); see work of Harari--Szamuely.
