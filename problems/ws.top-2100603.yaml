  \item[\hypertarget{source:statement:2}{S2}] Alexey Bolsinov, Vladimir S. Matveev, Eva Miranda and Serge Tabachnikov, Open Problems, Questions, and Challenges in Finite-Dimensional Integrable Systems (2018), Problem 6.5 and its complete preceding definitions. Original question and full discussion. \url{https://arxiv.org/abs/1804.03737}.

  \end{description}
