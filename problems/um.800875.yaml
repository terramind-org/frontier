title: Open Problems in Pluripotential Theory — Question 6
field: mathematics
tier: prose
statement: |-
  Let $\varphi$ be a plurisubharmonic function in the unit ball ${\mathbb{B}}$ of ${\mathbb{C}}^n$. Assume $\varphi$ has a well-defined
  complex Monge-Amp\`ere measure $(dd^c \varphi)^n$, we could for instance
  assume that $\varphi$ is locally bounded outside the origin.

  [Guedj, Rashkovskii]
  Assume that $(dd^c \varphi)^n $ has a Dirac mass at the origin. Does it imply that
  $\varphi$ has a positive Lelong number at $0 \in {\mathbb{C}}^n$ ?
