title: Cohn-Elkies Scheme for Circle Packings
field: mathematics
tier: prose
statement: |-
  \section{Sharpness of the Cohn--Elkies Bound in the Plane}\label{statement}


  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Unless a section says otherwise, $\N=\{1,2,\ldots\}$,
  $\Z$ is the ring of integers, $\Q,\R,\C$ are the rational, real, and complex
  fields, $[N]=\{1,\ldots,\lfloor N\rfloor\}$, and $\log$ is the natural
  logarithm. For real functions of a parameter tending to infinity,
  $f\ll g$ and $f=O(g)$ mean $|f|\leq Cg$ eventually for some fixed $C$;
  $f\gg g$ reverses this comparison; $f=o(g)$ means $f/g\to0$;
  $f\sim g$ means $f/g\to1$; and $f\asymp g$ means both order bounds.
  A subscript on $O$ or $\ll$ specifies allowed constant dependence.
  The expression $n^{o(1)}$ in an upper bound means growth smaller than
  $n^\epsilon$ for each fixed $\epsilon>0$. Local definitions govern any
  exception, finite-field convention, or use of the same symbol for another
  object. An asymptotic claim is not automatically an effective algorithm.



  With Fourier transform $\widehat f(\xi)=\int_{\R^2}f(x)e^{-2\pi i x\cdot\xi}\,dx$, consider real radial Schwartz functions with $\widehat f\geq0$, $\widehat f(0)>0$, and $f(x)\leq0$ for $\|x\|\geq2$. Their Cohn--Elkies bounds for unit-disc packing density are $\pi f(0)/\widehat f(0)$. Ask whether these bounds yield the planar optimum $\pi/\sqrt{12}$. \sref{statement}{1} \sref{statement}{2}

  \paragraph{Statement recorded in the supplied source.}
  Can the Cohn-Elkies scheme be used to prove the optimal bound for circle-packings? \sref{statement}{1}

  \paragraph{Scope and interpretation.}

  A single auxiliary function attaining $f(0)/\widehat f(0)=1/\sqrt{12}$ would suffice. The source’s wording does not exclude proving sharpness by a limiting sequence of admissible functions. \sref{statement}{1}

  \subsection{Short English statement}

  Can the Fourier-analytic linear-programming method recover the exact optimal density of circle packing in the plane?

