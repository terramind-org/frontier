  \section*{The separable quotient assertion for a real-valued-measurable continuum}\label{30007186}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Assuming that the cardinality of the continuum is real-valued measurable, must every infinite-dimensional real or complex Banach space admit an infinite-dimensional separable quotient by a closed linear subspace?
  \subsection{Short English statement}
  Assuming that the cardinality of the continuum is real-valued measurable, must every infinite-dimensional real or complex Banach space admit an infinite-dimensional separable quotient by a closed linear subspace?
