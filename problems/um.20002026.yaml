title: Einstein factorization and the trace-free-Ricci obstruction to Paneitz positivity
field: mathematics
tier: prose
statement: 'Problem 7: On M 4, Gursky ("The principal eigenvalue of a conformally invariant dif-ferential operator, with an application to semilinear elliptic PDE." Comm. Math. Phys., 207(1):131-143, 1999.) proved that if Sc > 0, and if \(\int Q>0\), then the Paneitz operator \(P_4\) is positive with its kernel consisting of constants. The original proof given by Gursky depends on estimates of solution of some non-linear PDE. Can one also see this fact from the construction method of the general GJMS operators? Claude LeBrun.'
