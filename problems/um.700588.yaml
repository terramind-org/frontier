title: Kourovka Notebook Problem 9.55
field: mathematics
tier: prose
statement: |-
  Does there exist a finite $p
  $-group
  $G$ and a central augmented automorphism $\varphi$ of ${\mathbb{Z}G$
  such that $\varphi $, if extended to $\widehat{{\mathbb{Z}}_pG$, the
  $p
  $-adic group ring, is *not* conjugation by unit
  in $\widehat{{\mathbb{Z}}_pG$ followed by a homomorphism induced from
  a group automorphism?
