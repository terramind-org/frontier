title: Optimal Inverse-Growth Conditions for Bicyclic Operator Cyclicity
field: mathematics
tier: prose
statement: For a bicyclic operator $T$, is $\log\lVert T^{-n}\rVert/\sqrt n\to0$ an optimal sufficient growth hypothesis for cyclicity? Specifically, can cyclicity fail under the weaker assumption $\log\lVert T^{-n}\rVert=O(\sqrt n)$?
