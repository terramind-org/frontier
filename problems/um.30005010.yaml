title: Higher-Order Vanishing Ideals in Polynomial Interpolation
field: mathematics
tier: prose
statement: Given a finite point set $X$, determine the least degree of a nonzero polynomial in the symbolic power $I_X^{(m)}$, determine the dimension of each graded component $(I_X^{(m)})_\delta$, and characterize when polynomials vanishing to order $m$ on $X$ factor into products of polynomials vanishing on $X$.
