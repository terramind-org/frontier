title: Question 2.5 — Does there exist some Modg,g ≥ 2 that contains a subgroup Γ isomorphic to a cocompact (resp.
field: mathematics
tier: prose
statement: "Does there exist some Modg,g ≥ 2 that contains a subgroup Γ isomorphic to a cocompact (resp. noncocompact) lattice in SO(m, 1) with m≥ 5 (resp. m≥ 4)? a cocompact lattice in SU(n, 1),n≥ 2? Must there be only finitely many conjugacy classes of any such fixed Γ in Modg? In light of example (3) above, I would like to specifically ask: can Mod g contain infinitely many isomorphism types of cocompact lattices in SO(4, 1)? Note that when Γ is the fundamental group of a (complex) algebraic variety V, then it is known that there can be at most finitely many representations ρ: Γ → Modg which have holomorphic representatives, by which we mean the unique homotopy class of maps f:V →M g with f∗ =ρ contains a holomorphic map. This result follows from repeatedly taking hyperplane sections and finally quoting the result for (complex) curves. The result for these is a theorem of Arakelov- Parshin (cf. Example 1.2 above, and §2.3 below.) For representations which do not a priori have a holomorphic representative, one might try to find a harmonic representative and then to prove a Siu-type rigidity result to obtain a holomorphic representative. One diﬃculty here is that it is not easy to find harmonic representatives, since (among other problems) every loop in Mg,g≥ 2 can be freely homotoped outside every compact set. For recent progress, however, see [ DW] and the references contained therein."
