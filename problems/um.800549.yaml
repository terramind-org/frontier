title: Visibility Graphs of Points, Segments and Polygons — Problem 21
field: mathematics
tier: prose
statement: |-
  Unlike bar visibility graphs,
  bar $k$-visibility graphs have not been completely characterized. For understanding this
  class of graphs, Dean et al. [deglst-bvg-2007] considered the problem of
  bounding the number of edges of a bar $k$-visibility graph $G$. They proved an upper
  bounds of $(k+1)(3n-7/2 k-5)-1$ edges
  for $G$ and conjectured an improve edge bound of
  $(k+1)(3n-4 k-6)$ which was proved later by
  Hartke et al. [hvw-frbvg-2007]. They also studied $d$-regular $k$-visibility graphs.
  Dean et al. [deglst-bvg-2007] also proved that $6k+6$ is an upper bound on the chromatic
  number of $G$. We have the following problems [deglst-bvg-2007,hvw-frbvg-2007].

  Characterize bar $k$-visibility graphs.
