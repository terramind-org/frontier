title: Completeness Tests for Integral Subvarieties
field: mathematics
tier: prose
statement: Given a smooth projective variety $X$ over $\mathbb C$ of dimension greater than two and $\omega\in H^0(X,L\otimes S^r\Omega^1_{X/\mathbb C})$, how can one check that a listed collection of $\omega$-integral curves or hypersurfaces contains all such curves or hypersurfaces of $X$?
