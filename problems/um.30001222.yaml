title: Rigidity Under Stable Equivalence of Quantum Complete Intersections
field: mathematics
tier: prose
statement: Let $X$ be a quantum complete intersection over a field $k$ and $Y$ a finite-dimensional symmetric local $k$-algebra stably equivalent to $X$ by an equivalence of Morita type, with $\dim_kY=\dim_kX$ and $Z(X)\cong Z(Y)$ as $k$-algebras. Must $X$ and $Y$ be isomorphic as $k$-algebras?
