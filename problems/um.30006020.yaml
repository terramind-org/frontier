title: Intermediate-Area Cylinders on Large-Genus Square-Tiled Surfaces
field: mathematics
tier: prose
statement: Determine the full cylinder-area spectrum for random square-tiled surfaces in large genus. In particular, estimate the number of cylinders whose normalized area lies between $1/\sqrt{g}$ and $2/\sqrt{g}$, between the known microscopic and macroscopic regimes.
