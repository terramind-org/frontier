title: Problem 2.2 — Decompose the representation on H0 into irreducible representations of ModΣ.
field: mathematics
tier: prose
statement: Decompose the representation on H0 into irreducible representations of ModΣ. When G = U(1), and Σ is the 2-torus, Hom( π,G )/G naturally identifies with T 2, by the functions α,β corresponding to a basis of π1(Σ). The functions φm,n:=αmβn, forms a Hilbert basis of H, indexed by ( m,n )∈ Z2. The ModΣ-representation on H arises from the linear GL(2, Z)-action on its basis Z2. The GL(2, Z)-orbits on Z2 are indexed by integers d≥ 0. The orbit of ( d, 0) consists of all ( m,n )∈ Z2 with gcd(m,n ) = d. These are Hilbert bases for irreducible constituents Cd of H. The irreducible constituents Cd admit an alternate description, as follows. The d-fold covering homomorphism G Φd − − →G induces a covering space Hom(π,G )/G−→ Hom(π,G )/G. Let Ld denote the closure of the image of the induced map H−→ H. Then Ld = ˆ⨁ d′|d Cd′ so Cd consists of the orthocomplement in Ld of the sum of all Ld′ for d′|d but d′̸=d.
