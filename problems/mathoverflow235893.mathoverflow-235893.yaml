  module: FormalConjectures.Mathoverflow.«235893»
  decl: Mathoverflow235893.mathoverflow_235893
  statement: |-
    theorem mathoverflow_235893 :
        ∀ n > 1, ∀ (f : ℝ^n ≃ ℝ^n), IsConnectedMap f → IsConnectedMap f.symm
  context:
    - open Mathoverflow235893
    - open scoped EuclideanGeometry
    - "variable (n : ℕ)"
  definitions:
    - name: Mathoverflow235893.IsConnectedMap
      kind: def
      text: |-
        /-- For topological spaces $X$ and $Y$ we say a function $f : X → Y$ is *connected* is it sends
        connected sets to connected sets.
        -/
        def IsConnectedMap {X Y : Type*} [TopologicalSpace X] [TopologicalSpace Y] (f : X → Y) : Prop :=
          ∀ ⦃s : Set X⦄, IsConnected s → IsConnected (f '' s)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Mathoverflow/235893.lean#L35
