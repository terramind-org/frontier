title: Milnor K-Theory Reconstruction of Function Fields and Varieties
field: mathematics
tier: prose
statement: In reconstruction from Milnor $K$-theory, can field-reconstruction counterexamples arise from function fields of curves over algebraically closed or finite fields? Can reconstruction be extended to function fields of transcendence degree at least $2$ over more general base fields? What minimal data determine a normal, proper, geometrically integral variety over a perfect field up to isomorphism rather than merely birational equivalence?
