lean:
  module: FormalConjectures.OEIS.«195441»
  decl: OeisA195441.conjecture
  statement: |-
    theorem conjecture :
        {n : ℕ | 1 ≤ n ∧ a (n - 1) = UniqueFactorizationMonoid.radical (n + 1)} =
          ({3, 5, 8, 9, 11, 27, 29, 35, 59} : Finset ℕ)
  context:
    - open OeisA195441
  definitions:
    - name: OeisA195441.a
      kind: def
      text: |-
        /--
        The least common multiple of the denominators of the coefficients of $B_{n+1}(x) - B_{n+1}$.
        Since $B_{n+1}(x) - B_{n+1} = \sum_{k=1}^{n+1} \binom{n+1}{k} B_{n+1-k} x^k$, this is the least
        common multiple of the denominators of $\binom{n+1}{k} B_{n+1-k}$ for $1 \le k \le n + 1$.
        -/
        def a (n : ℕ) : ℕ :=
          let N := n + 1
          (Finset.Icc 1 N).lcm fun k => (((N.choose k : ℚ) * bernoulli (N - k)).den)
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/195441.lean#L37
