title: Kourovka Notebook Problem 15.65
field: mathematics
tier: prose
statement: |-
  A square matrix is said to be *separable* if its minimal polynomial
  has no repeated roots,
  and *cyclic* if its minimal and characteristic polynomials are equal.
  For a matrix group $G$ over a finite field define $s(G)$ and
  $c(G)$ to be the proportion of separable and of cyclic elements
  respectively in $G$. For a classical group $\mathrm{X}(d,q)$ of
  dimension $d$ defined over the field with $q$ elements let \
  $S(\hbox\mathrm{X}; q) := \lim_{d \to \infty}s(\hbox\mathrm{X}(d,q))$ \
  and \ $ C(\hbox\mathrm{X}; q) := \lim_{d \to \infty}c(\hbox\mathrm{X}(d,q)).$ Independently G. E. Wall (*Bull. Austral. Math.
  Soc.*, **60**, no. 2 (1999), 253--284)
  and J. Fulman (*J. Group Theory*, **2**, no. 3 (1999),
  251--289) have evaluated $S(\hbox\mathrm{GL}; q)$ and $C(\hbox\mathrm{GL}; q)$, and have found them to be rational functions of $q$. Are
  $S(\hbox\mathrm{X}; q)$ and $C(\hbox\mathrm{X}; q)$ rational functions
  of $q$ also for the unitary, symplectic, and orthogonal groups?
