title: A flag certificate for abstract Kirwan surjectivity
field: mathematics
tier: prose
statement: |-
  **Recovered Conjecture 5.2 (G. Landweber).** Let a torus \(T\) act on a smooth
  manifold \(M\), and let \(\Phi:M\to\mathfrak t^*\) be an abstract moment map:
  for every closed subgroup \(H\subset T\), the projection
  \(\Phi_H:M\to\mathfrak h^*\) is constant on each connected component of
  \(M^H\). Assume \(\Phi\) is nondegenerate, meaning that for every
  \(\xi\in\mathfrak t\),
  \[
   \operatorname{Crit}(\Phi^\xi)=\{x\in M:\xi_M(x)=0\}
  \]
  and \(\Phi^\xi=\langle\Phi,\xi\rangle\) is Morse--Bott. For a regular value,
  translated to \(0\), the conjecture asks whether restriction
  \[
   \kappa:H_T^*(M)\longrightarrow H_T^*(\Phi^{-1}(0))
  \]
  is surjective.

  **Recovered Comments 5.3--5.5.** The workshop notes say that the compact
  \(S^1\) case is proved in GGK, while the GGK proof for higher-dimensional tori
  has an error. They ask whether local symplectic forms can replace global
  symplectic geometry. GGK Theorem G.22 gives such a form near an orbit when the
  abstract moment map is nondegenerate and the symplectic slice admits an
  invariant complex structure.
