title: Incidence-faithful projection and a fixed-axis obstruction for Kupitz discrepancy
field: mathematics
tier: prose
statement: |-
  **Kupitz conjecture.** Given \(n\) points in \(\mathbb R^2\), is there always a line through at least two points such that the numbers of points on the two sides differ by \(O(1)\)?

  Given \(n\) points in \(\mathbb R^3\), is there always a plane through at least two points such that the numbers of points on the two sides differ by \(O(1)\)?
