  \section{Birch–Swinnerton-Dyer Conjecture}\label{30003879}
  {\small UnsolvedMath ID 30003879 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  The Birch–Swinnerton-Dyer conjecture asserts for every elliptic curve $E/\mathbb{Q}$ that $\operatorname{ord}_{s=1}L(E,s)=\operatorname{rank}E(\mathbb{Q})$, together with a formula for the leading Taylor coefficient in terms of arithmetic invariants; the rank part remains largely open when the rank is at least 2.
  \par\smallskip\textit{Formulation references:} \sref{30003879}{1}, \sref{30003879}{2}.
  \subsection{Short English statement}
  The Birch–Swinnerton-Dyer conjecture asserts for every elliptic curve $E/\mathbb{Q}$ that $\operatorname{ord}_{s=1}L(E,s)=\operatorname{rank}E(\mathbb{Q})$, together with a formula for the leading Taylor coefficient in terms of arithmetic invariants; the rank part remains largely open when the rank is at least 2.
