title: Kourovka Notebook Problem 15.90
field: mathematics
tier: prose
statement: |-
  Let $\Gamma$ be an infinite directed graph, and $\overline{ \Gamma}$ the
  underlying
  undirected graph. Suppose that the graph $\Gamma$ admits a vertex-transitive
  group of automorphisms, and the graph $ \overline{ \Gamma}$ is connected and
  of finite valency. Does there exist a positive integer $k$ (possibly
  depending
  on $\Gamma$) such that for any positive integer $n$
  there is a directed path of length at most $k\cdot n$ in the graph
  $\Gamma$ whose initial and terminal vertices are at distance at least
  $n$
  in the graph $\overline{
  \Gamma}$?

  *Comment of 2005:* It is proved
  that there exists a positive integer $k'$ (depending only on the
  valency of $\overline{ \Gamma}$) such that for any positive
  integer $n$ there is a directed path of length at most $k'\cdot
  n^2$ in the graph $\Gamma$ whose initial and terminal vertices are
  at distance at least $n$ in the graph $\overline{ \Gamma}$
  (V. I. Trofimov, *Europ. J. Combinatorics*, **27**, no. 5
  (2006), 690--700).
