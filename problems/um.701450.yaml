statement: |-
  (B. H. Neumann and H. Neumann).
  Fix an integer $d\geq 2$. If $\mathfrak{V}$ is a variety of groups such that
  all $d$-generated groups in $\mathfrak{V}$ are finite,
  must $\mathfrak{V}$ be locally finite?
