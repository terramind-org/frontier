title: Hitting a moving trajectory on an Eulerian digraph
field: mathematics
tier: prose
statement: |-
  **Hitting time of trajectory.** Consider a nonreversible (say \(2/3\)--\(1/3\)) random walk on an Eulerian digraph \((V,E)\). Prove that the first time, \(\tau_{(X_t^{(y)})}\), the random walk hits a moving target \(X_t^{(y)}\) with \(X_0=y\) satisfies
  \[
  \max_{x,y}\mathbb E_x[\tau_{(X_t^{(y)})}]\leq |E|\,|V|.
  \]
