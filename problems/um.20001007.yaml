title: The pentagon lift and a periodic obstruction on general graphs
field: mathematics
tier: prose
statement: "Matt Baker: \"Peter Winkler [35] gives an interesting solution to a famous math Olympiad problem involving numbers on a pentagon in his book on math puzzles. His solution takes infinite covers of the pentagon. I have not tried to generalize this proof to the usual chip-firing game; Farbod and I [9] have a solution that uses potential theory. But maybe we could apply Winkler's method to general graphs?\" Matt Macauley asks whether this is the numbers game for Coxeter groups, and Baker replies that it is a special case, while the numbers game and graph chip-firing are different generalizations away from a cycle."
