title: Primitive character moments as centered parity variance
field: mathematics
tier: prose
statement: |-
  **Subconvexity for \(\mathrm{GL}(3)\times\mathrm{GL}(1)\) via averaging over a family.** Let \(\pi\) be a fixed Hecke--Maass cusp form for \(\mathrm{SL}_3(\mathbb Z)\), and \(\chi\) be a character of level \(M\). Munshi used Petersson trace formula as a delta method to obtain a subconvexity bound for \(L(1/2,\pi\times\chi)\) as \(M\) varies. Can we obtain a subconvexity bound by averaging over a family, e.g. by bounding
  \[
  \sum_{\chi\bmod M}|L(1/2,\chi)|^2?
  \]
