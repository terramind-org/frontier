title: Finite-jet status and a complex-locus similarity sieve
field: mathematics
tier: prose
statement: |-
  **7. (D. Zaitsev)** Let \(M\) be a real submanifold of \(\mathbb C^n\) which is generically minimal and holomorphically nondegenerate. What can you say about \(\operatorname{Aut}(M,p)\) at nonminimal points?

  The assigned AIM record is Problem 7 of the workshop list *Emerging applications of complexity for CR mappings*. Its text is:

  The line **“CR embeddings”** that follows is a new section heading. It is not part of Problem 7.

  Two genuine ambiguities remain in the source.

  1. It says “real submanifold,” not “real-analytic generic CR submanifold.” Holomorphic nondegeneracy and the notation used in the surrounding problems strongly suggest the real-analytic embedded CR category, but this is not stated.
  2. In the standard usage of the cited literature,
     \[
     \operatorname{Aut}(M,p)
     =\{\text{germs at }p\text{ of biholomorphisms }H:(\mathbb C^n,p)\to(\mathbb C^n,p),
     \ H(M)\subset M\}.
     \]
     Thus it is a stability group: every element fixes \(p\). It is not the collection of all local arrows taking \(p\) to varying points. This reading is reinforced by the immediately preceding AIM problems, which introduce separate notation \(\mathcal O(p)\) for the orbit under such arrows.

  This report therefore gives three answers: the established real-analytic hypersurface answer, the still-open higher-codimension answer, and the limitations of a merely smooth interpretation.
