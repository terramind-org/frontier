  \item[\hypertarget{source:statement:2}{S2}] L. Tóthmérész, Rotor-routing reachability is easy, chip-firing reachability is hard (2022), Section 3, definitions, and final paragraph following Corollary 3.9, pp.8 and15. \url{https://arxiv.org/pdf/2102.11970}.
  \item[\hypertarget{source:statement:3}{S3}] M. Chan, T. Church and J. A. Grochow, Rotor-routing and spanning trees on planar graphs (2014), Section 2, Definitions and notation, pp.3--4. \url{https://arxiv.org/pdf/1308.2677}.
