title: Conformal Type of Surfaces Spread over the Sphere
field: mathematics
tier: prose
statement: For a surface spread over the Riemann sphere, given by $(X,f)$ with associated conformal Riemann surface $X_f$, how do the topological and metric properties of $f$ determine whether $X_f$ is parabolic or hyperbolic and determine the value-distribution properties of $f$?
