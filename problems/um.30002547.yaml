title: Growth Rate of Quadrant Loops
field: mathematics
tier: prose
statement: Let $Q_n(a)$ count length-$2n$ square-lattice loops confined to the nonnegative quadrant, weighted by $a$ for each northwest or east–south corner, and let $Q(a,u)=\sum_{n\geq 0}Q_n(a)u^n$. For every $a\geq -1$, is the exponential growth rate of $Q_n(a)$ equal to that of the corresponding unconfined loops?
