title: Open Problems in Pluripotential Theory — Question 32
field: mathematics
tier: prose
statement: |-
  When $n=\dim_{\mathbb{C}} \leq 2$,
  it follows from the work of Blel-Mimouni [BM05], the second author [G05b] and
  Favre-Jonsson [FJ05] that $\varphi$ can be further decomposed as follows:
  for any $\varepsilon>0$, there exists $\pi_\varepsilon:X_\varepsilon \rightarrow X$ a finite composition of blow-ups
  such that
  $$
  \pi_\varepsilon^* (\omega+dd^c \varphi)=[D_\varepsilon]+R_\varepsilon,
  $$
  where $D_\varepsilon$ is a simple normal crossing divisor with coefficients in ${\mathbb{R}}^+$ and
  $R_\varepsilon$ is a positive current with Lelong numbers smaller than $\varepsilon$ at all points.

  [Favre-Guedj-Jonsson]
  Can one similarly desingularize quasi-plurisubharmonic functions in any dimension $n \geq 3$ ?
