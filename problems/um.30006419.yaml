title: Infinitesimal Quasiconformality of Harmonic Spheres
field: mathematics
tier: prose
statement: Let $X$ be a compact quasiconvex metric space satisfying a local quadratic isoperimetric inequality, and assume that every continuous map $S^2\to X$ of sufficiently small diameter is null-homotopic. Is every harmonic map $u:S^2\to X$ infinitesimally quasiconformal?
