title: Model categories 9 — The 2-category of simplicial model categories is supposed to be (according to me) 2-Quillen equivalent…
field: mathematics
tier: prose
statement: The 2-category of simplicial model categories is supposed to be (according to me) 2-Quillen equivalent to the 2-category of model categories. Even without having all the definitions one can try to find out if this is true. For example, Dan Dugger has shown that every model category (with some hypotheses--surely cofibrantly generated at least) is Quillen equivalent to a simplicial model category. Understand his result in the context of the preceding two problems. That is, does Dugger's construction in fact give a 2-functor from model categories to simplicial model categories? Does it preserve enough structure to make it clear that it will induce some kind of equivalences on the homotopy 2-categories?
