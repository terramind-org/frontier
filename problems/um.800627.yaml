title: Selection Principles in Mathematics — Problem 56 ([prods])
field: mathematics
tier: prose
statement: |-
  Assume that $X\subseteq\mathbb{R}$ is meager- (respectively, null-) additive,
  and $X\subseteq [0,1]$.
  Does it follow that $X$ is meager- (respectively, null-) additive
  when viewed as a subset of $\{0,1\}^{\mathbb{N}}$?
