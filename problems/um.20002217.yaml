title: A degree-independent ternary rhombus bound and a seven-variable obstruction
field: mathematics
tier: prose
statement: |-
  Given positive scalars $a_0, \dots, a_d$ such that
  \[
  \frac{a_k^2}{a_{k-1}a_{k+1}}\geq 4 \qquad (0<k<d),
  \]
  Hutchinson's theorem says that the generating polynomial
  $p(x)=\sum_{j=0}^d a_jx^j$ is real-rooted.  One can homogenize this to
  $p(x,y)$.

  Now consider the analogue for homogeneous polynomials of three variables.
  It is known that for each degree $d\geq1$, there exists $\lambda_d>0$ such
  that if $\lambda\geq\lambda_d$, then the “$\lambda$-rhombus
  log-concavity” of the Maclaurin coefficients of a homogeneous polynomial
  $p(x,y,z)$ implies that $p$ is real-stable.

  Can one remove the dependence of $\lambda_d$ on $d$?  If yes, then what
  about for $n>3$ variables?
