title: Open Problems in Pluripotential Theory — Question 7
field: mathematics
tier: prose
statement: |-
  As observed by Demailly in [Dem93], it follows from the Ohsawa-Takegoshi theorem that
  the $\varphi_j$'s approximate $\varphi$ in a very accurate manner, hence motivating the following:

  [Demailly]
  Does one have $(dd^c \varphi_j)^n(0) \longrightarrow (dd^c \varphi)^n(0)$ ?
