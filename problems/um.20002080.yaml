title: Asymptotic spectral invariants and field-factor slopes
field: mathematics
tier: prose
statement: |-
  Polterovich mentioned spectral invariants in Floer homology. Namely, for
  (f\in \operatorname{Ham}(M)) and \(\alpha\in QH^*(M)\), define
  \(c(f,\alpha)\) to be the smallest \(c\) such that \(\alpha\) appears in
  \(HF^*(\mathcal A\leq c)\), where \(\mathcal A\) is the action functional on
  a suitable cover of the loop space. Question: study the asymptotic properties
  of \(c(f^n,\alpha)\).
