title: Foliations and Diffeomorphism Groups — Question 49 (Calegari)
field: mathematics
tier: prose
statement: |-
  Calegari once conjectured that laminar groups preserving a very full lamination (a lamination all of whose gaps are finite-sided ideal polygons) should be residually finite. The moral of this conjecture is that preserving a lamination with enough structure should restrict the possible algebraic structure of the group.

  Show that a group acts on the circle with a very full invariant lamination is residually finite.
