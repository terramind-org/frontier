title: Hierarchical Refinement of Symmetric-Group Coset Partitions
field: mathematics
tier: prose
statement: If a $t$-coset is a coset of the stabilizer of $t$ points in the symmetric group $S_n$, is every partition of $S_n$ into $t$-cosets a refinement of a partition into $(t-1)$-cosets?
