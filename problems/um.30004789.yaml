id: um.30004789
title: Integral Shimura Models with Universal Shtukas
field: mathematics
tier: prose
statement: Let $\mathcal G$ be a parahoric group scheme. Construct a pro-system of normal flat integral Shimura-variety models $\mathcal S_K$ over the reflex integers, with finite étale transition maps, such that the valuative extension property holds, the generic-fiber $\mathcal G$-shtuka extends to $\mathcal S_K$, and every formal completion is identified with the corresponding integral local Shimura variety compatibly with its tautological shtuka.
