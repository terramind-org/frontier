  \setcounter{section}{9400165}
  \section{Are there infinitely many Wolstenholme primes}\label{9400166}
  {\small\sffamily UnsolvedMath ID 9400166 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A Wolstenholme prime is a prime $p\ge5$ such that $\binom{2p-1}{p-1}\equiv1\pmod{p^4}$, where $\binom ab=a!/(b!(a-b)!)$. This is stronger than Wolstenholme's congruence modulo $p^3$ valid for every prime $p\ge5$.
  \paragraph{Statement recorded in the supplied source.}
  Are there infinitely many Wolstenholme primes? \sref{9400166}{2}
  \subsection{Short English statement}
  Do infinitely many primes satisfy the binomial congruence with a fourth power modulus?
