title: Randomstrasse101 Open Problems (2025) — Conjecture 4
field: mathematics
tier: prose
statement: |-
  There is another approach to to use convex relaxation to potentially improve over upper bounds on the $
  \omega(G_p)$. Recall that the Lovasz $\vartheta$ function can be viewed a as degree-2 Sum-of-Squares relaxation of the clique (or independence) number. A fascinating question is whether the degree-4 Sum-of-Squares relaxation significantly improves on the $\sqrt{p}$ bound, perhaps even improving over the state of the art (see [KY-2022-PaleyDegree4SOS] for a precise construction of this relaxation). There have been several encouraging numerical experiments (for this and other SDPs) [KY-2022-PaleyDegree4SOS,kobzar2023revisiting,wang2024lower]. We particularly note that the numerical experiments in [KY-2022-PaleyDegree4SOS] suggest even a polynomial improvement may be possible, although the authors prove that it cannot improve beyond $\Omega(p^{\frac13})$.

  There exists $\varepsilon>0$ such that the Sum-of-Squares relaxation of degree 4 for the clique number of the Paley graph gives a bound of $O(p^{\frac12-\varepsilon})$.
