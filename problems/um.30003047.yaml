statement: Can the dynamics $I_K$ acting on $X_K$ be reconstructed from the non-involutive Banach algebra obtained as the closure of $C(X_K)\rtimes_{\mathrm{alg}} I_K$ in its natural bounded-operator representation; can this be done without preserving the MASA $C(X_K)$; and can K be reconstructed from $A_K$ without using $\sigma_K$?
