title: Turing degrees of infinite-solution Hilbert's Tenth Problems
field: mathematics
tier: prose
statement: |-
  **Question 16 (Miller).** Situate with respect to $\leq_T$ the following sets:
  \[
  \operatorname{HTP}_{\infty}(\mathbb Q),\quad
  \operatorname{HTP}_{\infty,1}(\mathbb Q),\quad
  \operatorname{HTP}_{\infty}(\mathbb Z),\quad
  \operatorname{HTP}_{\infty,1}(\mathbb Z).
  \]
  (known: $\mathbf 0'\leq_T\operatorname{HTP}_{\infty}(\mathbb Z)\leq_T\mathbf 0''$)
