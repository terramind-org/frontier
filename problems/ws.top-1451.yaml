statement: |-
  \section{The Eilenberg--Ganea Dimension-Two Conjecture}\label{statement}


  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Unless a section says otherwise, $\N=\{1,2,\ldots\}$,
  $\Z$ is the ring of integers, $\Q,\R,\C$ are the rational, real, and complex
  fields, $[N]=\{1,\ldots,\lfloor N\rfloor\}$, and $\log$ is the natural
  logarithm. For real functions of a parameter tending to infinity,
  $f\ll g$ and $f=O(g)$ mean $|f|\leq Cg$ eventually for some fixed $C$;
  $f\gg g$ reverses this comparison; $f=o(g)$ means $f/g\to0$;
  $f\sim g$ means $f/g\to1$; and $f\asymp g$ means both order bounds.
  A subscript on $O$ or $\ll$ specifies allowed constant dependence.
  The expression $n^{o(1)}$ in an upper bound means growth smaller than
  $n^\epsilon$ for each fixed $\epsilon>0$. Local definitions govern any
  exception, finite-field convention, or use of the same symbol for another
  object. An asymptotic claim is not automatically an effective algorithm.



  The integral cohomological dimension $\operatorname{cd}_{\Z}G$ is the projective dimension of the trivial $\Z G$-module $\Z$. A $K(G,1)$ is a connected CW complex with fundamental group $G$ and contractible universal cover. The geometric dimension is the least dimension of such a complex. Ask whether $\operatorname{cd}_{\Z}G=2$ forces geometric dimension two. \sref{statement}{1} \sref{statement}{2}

  \paragraph{Statement recorded in the supplied source.}
  Does every group with cohomological dimension 2 have a 2-dimensional Eilenberg-MacLane space K(G,1)? \sref{statement}{1}

  \paragraph{Residual task reported by the archive.}

  The embedded review (2026-08-17) records: Determine the geometric dimension of the Bestvina--Brady candidate groups, equivalently overcoming the associated Whitehead-asphericity obstruction, or prove a general two-dimensional realization theorem. \sref{statement}{1}

  \subsection{Short English statement}

  If a group has integral cohomological dimension two, must it admit a genuinely two-dimensional classifying space?

