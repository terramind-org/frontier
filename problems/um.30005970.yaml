title: Exceptional Galois Points on Modular Curves
field: mathematics
tier: prose
statement: Extend the Khawaja–Siksek finiteness theorem for primitive algebraic points from symmetric and alternating Galois groups to other families of simple and almost simple groups. More specifically, let $N$ be large and let $j:X_0(N)\to X(1)$ be the usual map. Hilbert irreducibility gives a thin set $S\subset X(1)(\mathbb{Q})$ such that, for $\alpha\in X(1)(\mathbb{Q})\setminus S$, the fiber $j^{-1}(\alpha)$ has Galois group $\mathrm{PGL}_2(\mathbb{Z}/N\mathbb{Z})$. Is $S$ finite or infinite? If it is infinite, which Galois groups occur infinitely often? Is there an infinite family of algebraic points on $X_0(N)$ with Galois group $\mathrm{PGL}_2(\mathbb{Z}/N\mathbb{Z})$ that does not arise from $j$?
