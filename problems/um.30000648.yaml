title: Vanishing Conjecture for Powers of Homogeneous Polynomials
field: mathematics
tier: prose
statement: Let $\Delta=\sum_{i=1}^n\partial^2/\partial X_i^2$. For every homogeneous polynomial $P\in\mathbb{C}[X_1,\ldots,X_n]$ of degree $4$, does $\Delta^m(P^m)=0$ for all $m\geq1$ imply $\Delta^m(P^{m+1})=0$ for all sufficiently large $m$?
