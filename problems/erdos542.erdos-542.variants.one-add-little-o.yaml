lean:
  module: FormalConjectures.ErdosProblems.«542»
  decl: Erdos542.erdos_542.variants.one_add_little_o
  statement: |-
    theorem erdos_542.variants.one_add_little_o :
        ∃ o : ℕ → ℝ, Tendsto o atTop (nhds 0) ∧
          ∀ (n : ℕ) (A : Finset ℕ), IsLcmFree n A → ∑ a ∈ A, (1 : ℝ) / a ≤ 1 + o n
  context:
    - open Erdos542
    - open Erdos542.erdos_542
    - open Erdos542.erdos_542.variants
    - open Filter Real
  definitions:
    - name: Erdos542.IsLcmFree
      kind: def
      text: |-
        /-- A set `A ⊆ {1, …, n}` such that `lcm(a, b) > n` for all distinct `a, b ∈ A`. -/
        def IsLcmFree (n : ℕ) (A : Finset ℕ) : Prop :=
          A ⊆ Finset.Icc 1 n ∧ (A : Set ℕ).Pairwise fun a b ↦ n < Nat.lcm a b
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/542.lean#L43
