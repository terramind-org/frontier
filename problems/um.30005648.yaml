title: Inertia Actions on Torsion Points under Supersingular Reduction
field: mathematics
tier: prose
statement: Let $X/K$ be a geometrically connected curve of genus greater than one with Jacobian $J$, and embed $X$ in $J$ using a point $x_0\in X(K)$. If $J$ has supersingular good reduction over $K$, is the inertia action on $X_{\mathrm{tors}}=X(K)\cap J(K)_{\mathrm{tors}}$ trivial?
