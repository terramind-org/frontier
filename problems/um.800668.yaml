title: Selection Principles Milestone Problems — Problem 41 ([CpHure, Problem 1])
field: mathematics
tier: prose
statement: |-
  The *weak sequence selection property* for $C_p(X)$
  [CpHure] is defined as the SSP with the difference that
  we only require that $\mathbf{0}\in\overline{\{f^n_{k_n} : n\in\mathbb{N}\}}$.

  Does countable fan tightness of $C_p(X)$ imply the weak sequence selection property?
