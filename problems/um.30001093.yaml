title: Invariance of $L^2$-Torsion Under Large-Scale Equivalence
field: mathematics
tier: prose
statement: Let $G_0$ and $G_1$ have finite classifying-space models and vanishing $L^2$-Betti numbers. If $G_0$ and $G_1$ are quasi-isometric or orbit equivalent, must their $L^2$-torsion vanish simultaneously; that is, does $\rho^{(2)}(G_0)=0$ if and only if $\rho^{(2)}(G_1)=0$?
