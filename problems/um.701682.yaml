title: Kourovka Notebook Problem 20.24
field: mathematics
tier: prose
statement: |-
  Does the group $SL_2(\mathbb{Z} [\sqrt 2])$ admit a faithful transitive
  amenable action?

  This is the same as asking if it admits any co-amenable subgroup except
  the finite index subgroups.
