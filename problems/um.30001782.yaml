id: um.30001782
title: Entry Distributions in Random Contingency Tables
field: mathematics
tier: prose
statement: Let $D$ be uniformly random among nonnegative integer matrices with prescribed row margins $R$ and column margins $C$. Does an individual entry of $D$ have an asymptotically geometric distribution as the dimensions grow? In the special case $m=n$ and $R=C=(3n,n,\ldots,n)$, does the expected value of the $(1,1)$ entry grow linearly in $n$?
