title: Positive Association in Random Proper Colorings
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finite bipartite graph with parts $A$ and $B$, let $q\geq3$, and let $f$ be a uniformly random proper $q$-coloring of $G$. Does the random set $f^{-1}(0)\cap A$ have positive association? Equivalently, for all increasing functions $X,Y:\{0,1\}^A\to\mathbb R$, is
  $$
  \mathbb E[X(f^{-1}(0)\cap A)Y(f^{-1}(0)\cap A)]\geq\mathbb E[X(f^{-1}(0)\cap A)]\,\mathbb E[Y(f^{-1}(0)\cap A)]
  $$?
