id: um.30003021
title: Full-Dimension Intersections in Definable Families
field: mathematics
tier: prose
statement: Let $(X_a)_{a\in A}$ be a definable family of subsets of a pseudofinite set $Y$, with $\delta(X_a)=\delta(Y)$ for every $a\in A$. Under what hypotheses does generic $a$ make $X_a$ intersect every definable $B\subseteq Y$ of full $\delta$-dimension properly, in the sense that $\delta(X_a\cap B)=\delta(X_a)+\delta(B)-\delta(Y)$?
