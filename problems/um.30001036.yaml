id: um.30001036
title: Nontrivial Floyd Boundaries Beyond Relative Hyperbolicity
field: mathematics
tier: prose
statement: Does there exist a group $G$ with nontrivial Floyd boundary $\partial_fG$ that is not relatively hyperbolic with respect to any family of finitely generated subgroups? For the known infinitely presented candidate group $H$, is $\partial_fH$ trivial, and is $H$ non-relatively-hyperbolic with respect to every such family?
