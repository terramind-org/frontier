title: Semi-local versus tame-at-infinity generating families
field: mathematics
tier: prose
statement: |-
  **Question 1.2.** Which \(L\) admit generating functions? One wants to impose some restrictions on the generating function. Typically one wants the generating function to be quadratic at infinity, although it might be interesting to explore other conditions at infinity. The notes add that stabilizations (zig-zags) are “somehow prohibited” in dimension \(3\), and report a theorem of Giroux when no condition at infinity is imposed.

  Its question is deliberately tentative:

  The following paragraph says that a suitable generating function supports Morse-theoretic invariants. The record then starts a separate **Theme 1.3**, concerning Lisa Traynor's generating-function polynomials and linearized contact homology. I therefore use the comparison only to illuminate existence obstructions and do not treat it as a second problem to solve here.

  The preceding source record fixes the convention

  \[
  J^1(M)=T^*M\times\mathbb R_z,\qquad \alpha=dz-p\,dq,
  \]

  and describes the front generated by fiber-critical values of a function on a bundle over \(M\).

  Two qualifications are essential to recover a precise modern question.

  1. “Generating function” is now usually called a **generating family**.
  2. The verified Giroux theorem concerns a **germ, or semi-local generating family, near its fiber-critical locus**. It is not by itself a theorem producing a global function with prescribed behavior at infinity.
