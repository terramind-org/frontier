title: Kourovka Notebook Problem 11.70
field: mathematics
tier: prose
statement: |-
  Let $F$ be an infinite
  field or a skew-field.

  a) Find all transitive subgroups of $ PGL(2,F)$
  acting on the projective line $F \cup \{ \infty \} $.

  c) What are the flag-transitive subgroups of
  $PGL(d + 1, F)$?

  d) What subgroups of $PGL(d + 1, F)$ are
  2-transitive on the points of $PG(d,F)$?

  [Archived solved part(s) of 11.70:]
  b) Let $F$ be an infinite
  field or a skew-field.
  What conditions on the subring $R$ of $F$
  will ensure that $PGL(d + 1, R)$ is flag-transitive on the
  projective $d$-space $PG(d,F)$?
