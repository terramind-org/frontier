title: Kourovka Notebook Problem 8.67
field: mathematics
tier: prose
statement: |-
  Do there exist Golod groups all of whose abelian
  subgroups have finite ranks? Here a *Golod group* means a
  finitely generated non-nilpotent subgroup of the adjoint group
  of a nil-ring. The answer is negative for the whole adjoint
  group of a nil-ring (Ya. P. Sysak, *Abstracts of the 17th
  All--Union Algebraic Conf., part 1*, Minsk, 1983, p. 180
  (Russian)).
