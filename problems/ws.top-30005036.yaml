  \section{Kaplansky's Conjectures for Group Rings}\label{30005036}
  {\small UnsolvedMath ID 30005036 · Group Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $G$ be a group and $K$ a field. If $G$ is torsion-free, must $K[G]$ have no nontrivial units, no nonzero zero divisors, and no idempotents other than $0$ and $1$; and for arbitrary $G$, must $K[G]$ be directly finite?
  \par\smallskip\textit{Formulation references:} \sref{30005036}{1}, \sref{30005036}{2}.
  \subsection{Short English statement}
  Let $G$ be a group and $K$ a field. If $G$ is torsion-free, must $K[G]$ have no nontrivial units, no nonzero zero divisors, and no idempotents other than $0$ and $1$; and for arbitrary $G$, must $K[G]$ be directly finite?
