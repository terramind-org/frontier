title: The doubled-label slice is exactly Seymour's second-neighborhood conjecture
field: mathematics
tier: prose
statement: |-
  Conjecture 6.2. Seymour's Second Neighborhood Conjecture Notes: To see this, for a digraph H, let k = 2, G = H, and E1 = E2 = E(H).

  Seymour's Second Neighborhood Conjecture. Notes: To see this, for a digraph \(H\), let \(k=2\), \(G=H\), and \(E_1=E_2=E(H)\).

  Any simple digraph with no loops or digons has a vertex \(v\) whose second neighborhood is at least as big as its first neighborhood, i.e. \(|N_2^+(v)|\geq |N^+(v)|\).
