title: Spin-preserving type A crystals for two-cell ribbon quotients
field: mathematics
tier: prose
statement: |-
  **(1)** Find a crystal structure on ribbon tableaux compatible with the spin statistic. This has been solved for type \(A\) domino tableaux.

  **Recovered formulation.** For each fixed ribbon length \(r\), ribbon-tileable skew shape \(\lambda/\rho\), and alphabet \([m]\), construct a regular classical type \(A_{m-1}\) crystal on the semistandard \(r\)-ribbon tableaux of that shape, with weight equal to content, such that spin (equivalently cospin for a fixed shape) is constant on every classical crystal component.
