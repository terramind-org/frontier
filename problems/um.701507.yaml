title: Kourovka Notebook Problem 18.78
field: mathematics
tier: prose
statement: |-
  Let $K^tG$ be a twisted group algebra of the finite group $G$ over the field $K$.
  If $K^tG$ is a simple $K$-algebra, is $G$ necessarily solvable? This is known to be
  true if $K^tG$ is central simple.
