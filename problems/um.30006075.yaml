title: Finite Index of Arithmetic Dehn-Twist Subgroups
field: mathematics
tier: prose
statement: For a $p$-adic field $K$, does the profinite subgroup generated by all arithmetic Dehn twists have finite index in $\operatorname{Out}(G_K(p))$, where $G_K(p)$ is the maximal pro-$p$ quotient of the absolute Galois group?
