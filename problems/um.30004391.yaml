title: Lipschitz Growth of Puncture Classes and Formality
field: mathematics
tier: prose
statement: |-
  Let

  $$M=\bigl(S^2\times(\mathbb{CP}^2)^{\#4}\bigr)\setminus\{\text{point}\},$$

  and let $\alpha\in\pi_5(M)$ be the puncture class. The known growth of $\operatorname{Lip}(k\alpha)$ is $\omega(k^{1/6})$. Can one prove a sharper lower bound, or an upper bound of order strictly smaller than $k^{1/5}$? Separately, suppose a simply connected space $Y$ has the property that, for every finite simplicial complex $X$, every nullhomotopic $L$-Lipschitz map $X\to Y$ admits a $C(X,Y)(L+1)$-Lipschitz nullhomotopy. Must $Y$ be formal?
