title: Fractal caustics
field: mathematics
tier: prose
statement: Are there geodesic flows or Birkhoff billiards with fractal caustics? More specifically, for every $1\leq s<2$, is there a caustic of a convex billiard with Hausdorff dimension $s$; and for every $s\geq1$, is there a Riemannian manifold $M$ and a point whose caustic has Hausdorff dimension $s$?
