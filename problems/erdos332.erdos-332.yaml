lean:
  module: FormalConjectures.ErdosProblems.«332»
  decl: Erdos332.erdos_332
  statement: "theorem erdos_332 (A : Set ℕ) : erdos_332.answer A → HasBoundedGaps (D_A A)"
  context:
    - open Erdos332
    - open Set
  definitions:
    - name: Erdos332.D_A
      kind: def
      text: |-
        /--
        The set of numbers $D(A)$ which occur infinitely often as $a_1 - a_2$ with $a_1, a_2 \in A$.
        -/
        noncomputable def D_A (A : Set ℕ) : Set ℤ :=
          { d : ℤ | Set.Infinite { (a, b) : ℕ × ℕ | a ∈ A ∧ b ∈ A ∧ (a : ℤ) - (b : ℤ) = d } }
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/332.lean#L32
    - name: Erdos332.HasBoundedGaps
      kind: def
      text: |-
        /--
        A set $S \subseteq \mathbb{Z}$ has bounded gaps if it is syndetic, meaning there is a uniform
        bound $M$ such that every interval of length $M$ contains an element of $S$.
        -/
        def HasBoundedGaps (S : Set ℤ) : Prop :=
          ∃ M : ℕ, M > 0 ∧ ∀ z : ℤ, ∃ s ∈ S, z ≤ s ∧ s < z + (M : ℤ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/332.lean#L38
