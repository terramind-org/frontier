lean:
  module: FormalConjectures.ErdosProblems.«640»
  decl: Erdos640.erdos_640
  statement: |-
    theorem erdos_640 :
        ∀ k : ℕ, 3 ≤ k → ∃ N : ℕ, ∀ n : ℕ, ∀ G : SimpleGraph (Fin n),
          (N : ℕ∞) ≤ G.chromaticNumber → HasHighChromaticOddCycle G k
  context:
    - open Erdos640
    - open SimpleGraph
  definitions:
    - name: Erdos640.HasHighChromaticOddCycle
      kind: def
      text: |-
        /-- An odd cycle whose vertices induce a graph of chromatic number at least `k`. -/
        def HasHighChromaticOddCycle {V : Type*} (G : SimpleGraph V) (k : ℕ) : Prop :=
          ∃ v, ∃ p : G.Walk v v, p.IsCycle ∧ Odd p.length ∧
            (k : ℕ∞) ≤ (G.induce {x | x ∈ p.support}).chromaticNumber
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/640.lean#L35
