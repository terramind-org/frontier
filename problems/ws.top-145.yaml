statement: |-
  \section{Worst-Case Binary Trace Reconstruction}\label{statement}


  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Unless a section says otherwise, $\N=\{1,2,\ldots\}$,
  $\Z$ is the ring of integers, $\Q,\R,\C$ are the rational, real, and complex
  fields, $[N]=\{1,\ldots,\lfloor N\rfloor\}$, and $\log$ is the natural
  logarithm. For real functions of a parameter tending to infinity,
  $f\ll g$ and $f=O(g)$ mean $|f|\leq Cg$ eventually for some fixed $C$;
  $f\gg g$ reverses this comparison; $f=o(g)$ means $f/g\to0$;
  $f\sim g$ means $f/g\to1$; and $f\asymp g$ means both order bounds.
  A subscript on $O$ or $\ll$ specifies allowed constant dependence.
  The expression $n^{o(1)}$ in an upper bound means growth smaller than
  $n^\epsilon$ for each fixed $\epsilon>0$. Local definitions govern any
  exception, finite-field convention, or use of the same symbol for another
  object. An asymptotic claim is not automatically an effective algorithm.



  A trace of $x\in\{0,1\}^n$ is the subsequence left after independently deleting each coordinate with probability $1/2$, retaining the order but not the deleted positions. Let $m(n)$ be the least sample size for which one reconstruction rule, knowing $n$, returns every possible $x$ correctly with probability at least $0.9$ from independent traces. This is a sample-complexity question, without an additional running-time bound. \sref{statement}{1} \sref{statement}{2}

  \paragraph{Statement recorded in the supplied source.}
  Given a string $x \in \{0, 1\}^n$, let $\tilde{x}$ be obtained by deleting bits independently at random with probability $\frac{1}{2}$. How many independent traces $\tilde{x}_1, \dots, \tilde{x}_m$ are needed to reconstruct $x$ with probability 0.9? \sref{statement}{1}

  \paragraph{Residual task reported by the archive.}

  The embedded review (2026-08-17) records: Determine matching lower and upper bounds, including the optimal exponent at deletion probability 1/2. \sref{statement}{1}

  \subsection{Short English statement}

  How many independent deletion-corrupted copies suffice to recover an arbitrary binary string reliably, even when computation time is unrestricted?

