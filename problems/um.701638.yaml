title: Kourovka Notebook Problem 19.90
field: mathematics
tier: prose
statement: |-
  A *skew brace* is a set $B$ equipped with two operations $+$ and $\cdot$ such that $(B,+)$ is an additively written (but not necessarily abelian) group, $(B,\cdot )$ is a multiplicatively written group, and $a\cdot (b+c)=ab-a+ac$ for any $a,b,c\in B$.

  b) Is there a skew brace with non-soluble additive group but nilpotent multiplicative group?

  c) Is there a finite skew brace with soluble additive group but non-soluble multiplicative group?

