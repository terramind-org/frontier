title: Minimal Sets and Lyapunov Positivity for Quasiperiodic Schrödinger Cocycles
field: mathematics
tier: prose
statement: For a quasiperiodic Schrödinger cocycle at the lowest spectral energy $E_0$ with positive Lyapunov exponent, determine the structure of its minimal set under sufficient regularity of the potential and rational independence of the frequency; in particular, can the fibers be Cantor sets? Also determine whether sufficiently large coupling forces a positive Lyapunov exponent for all energies when the potential is only finitely smooth.
