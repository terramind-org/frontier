title: Nonzerodivisors and Stabilization of Cohomology Annihilators
field: mathematics
tier: prose
statement: Let $\Lambda$ be a noetherian algebra finite over its center, let $\operatorname{ca}(\Lambda)$ be its cohomology-annihilator ideal, and let $\operatorname{ca}_s(\Lambda)$ denote its degree-$s$ approximation. Does $\operatorname{ca}(\Lambda)$ contain a nonzerodivisor? What is the least $s$ such that $\operatorname{ca}(\Lambda)=\operatorname{ca}_s(\Lambda)$?
