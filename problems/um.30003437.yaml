title: Certificates of Global Optimality for Thomson Configurations
field: mathematics
tier: prose
statement: For Thomson's problem of minimizing $$\sum_{1\leq i<j\leq N}\frac{1}{\lVert x_i-x_j\rVert}$$ over $N$ distinct points on $S^2$, and for its Riesz-energy variants, develop rigorous certificates that a candidate configuration attains the global minimum.
