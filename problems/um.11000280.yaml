title: Question 2.12 — Does Out(F3) have a faithful representation into GL(m, C) for some m∈ N?
field: mathematics
tier: prose
statement: Does Out(F3) have a faithful representation into GL(m, C) for some m∈ N? Note that braid groups are linear [ 8] but it is unknown if mapping class groups of closed surfaces are. Brendle and Hamidi-Tehrani [ 13] showed that the approach of Formanek and Procesi cannot be adapted directly to the mapping class groups. More precisely, they prove that the type of “poison subgroup” described above does not arise in mapping class groups. The fact that the above question remains open is an indication that Out( F3) can behave diﬀerently from Out( Fn) for n large; the existence of finite index subgroups mapping onto Z was another instance of this, and we shall see another in our discussion of automatic structures and isoperimetric inequalities.
