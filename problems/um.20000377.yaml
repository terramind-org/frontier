title: Correcting the threshold and computing the singular locus
field: mathematics
tier: prose
statement: |-
  For a positive integer \(k\), consider
  \[
  \mathcal Q_k(s)=
  \left\{
   Q(y_1^k,\ldots,y_s^k)\in \mathbb Q[y_1,\ldots,y_s]:
   Q\in\mathbb Q[x_1,\ldots,x_s]\text{ is a quadratic form}
  \right\}. \]
  These are forms of degree \(2k\). The source defines
  \[
  h(k)=\inf_{s\in\mathbb N}
  \left\{
  s:\text{ the Hasse principle holds for every member of }\mathcal Q_k(s)
  \right\}
  \]
  and asks for
  \[
  \log h(k)=o(k). \]
  It records the estimate
  \[
  h(k)\leq 2k\,2^{2k}
  \]
  from Birch's theorem and compares it with the diagonal degree-\(k\) bound
  \[
  h_{\mathrm{diag}}(k)\ll 2k\log k. \]
  The symbol in the PDF is \(\ll\), not an asymptotic equivalence. Browning also suggests replacing the \(k\)-th powers by norm forms from fixed degree-\(k\) extensions.
