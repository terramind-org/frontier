statement: |-
  \section*{The entire weighted Lane–Emden nonexistence criterion}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each $n\geq 2$, $p,q>0$ and real A,B with $(n+A)/(p+1)+(n+B)/(q+1)>n-2$, are there no positive everywhere functions $u,v\in C(R^n)\cap C2(R^n$ minus \{0\}) satisfying $-$Delta $u=|x|^A$ $v^p$ and $-$Delta $v=|x|^B$ $u^q$ at every $x\neq 0$?
  \subsection{Short English statement}
  For each $n\geq 2$, $p,q>0$ and real A,B with $(n+A)/(p+1)+(n+B)/(q+1)>n-2$, are there no positive everywhere functions $u,v\in C(R^n)\cap C2(R^n$ minus \{0\}) satisfying $-$Delta $u=|x|^A$ $v^p$ and $-$Delta $v=|x|^B$ $u^q$ at every $x\neq 0$?
