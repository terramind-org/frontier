statement: Given a tuple ×N i=1(mi,ti) ∈ ZN, give a tractable expression in terms of Dehn- Thurston or other coordinates for the number of components of the corresponding weighted family of curves and arcs. 7. Probing mapping class groups using arcs 107 There is an algorithm which leads to a multiply weighted curve from an integral measure on a general train track akin to that on the torus gotten by serially “splitting” the track, cf. [6], but we ask in Problem 2 for a more closed-form expression. See also Problem 3. A related problem which also seems challenging is to describe A′(F ) or Arc′(F ) in Dehn-Thurston coordinates on MF(F ). This class of curve and arc component counting problems might be approachable using the quan- tum path ordering techniques of [5,6] or with standard fermionic statistical physics [57,29].
