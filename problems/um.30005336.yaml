title: Erdős–Hajnal Clique-or-Independent-Set Conjecture
field: mathematics
tier: prose
statement: For every fixed graph $H$, does there exist $c(H)>0$ such that every $H$-free graph on $n$ vertices contains a clique or an independent set of size at least $n^{c(H)}$?
