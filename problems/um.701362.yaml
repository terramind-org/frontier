title: Kourovka Notebook Problem 17.60
field: mathematics
tier: prose
statement: |-
  Given a set \(\mathcal{P}\) of odd primes, let
  \(\mathrm{CT}_{\mathcal{P}}(\mathbb{Z})\) denote the subgroup of
  \(\mathrm{CT}(\mathbb{Z})\) which is generated by all class
  transpositions which interchange residue classes whose moduli have
  only prime factors in \(\mathcal{P} \cup \{2\}\). The groups
  \(\mathrm{CT}_{\mathcal{P}}(\mathbb{Z})\) are simple (*Math. Z.*, **264**, no. 4 (2010), 927--938).
  Are they pairwise nonisomorphic?
