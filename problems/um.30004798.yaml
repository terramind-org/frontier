title: Equality of Discrete and Automorphic Multiplicities
field: mathematics
tier: prose
statement: Let $F$ be a number field, let $G$ be an even orthogonal or unitary group over $F$, let $\psi$ be an elliptic Arthur parameter of $G$, and let $\pi$ be an automorphic representation in the near-equivalence class represented by $\psi$. Prove $m_{\mathrm{disc}}(\pi)=m_{\mathrm{aut}}(\pi)$.
