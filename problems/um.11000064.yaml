title: Problem 5.20 — (Hain for Aut( Fn)).
field: mathematics
tier: prose
statement: (Hain for Aut( Fn)). Give an explicit finite presentation for the Malcev Lie AlgebraL(IAn), where IAn is the group of automorphisms of the free group Fn acting trivially on H1(Fn, Z). There is a great deal of interesting information at the prime 2 which Hain’s theorem does not address, and indeed which remains largely unexplored. While Hain’s theorem tells us that reduction mod 2 gives us a large subalgebra of L2(Ig,1) coming from L0(Ig,1), the Lie algbera L2(Ig,1) over F2 is much bigger. This can already be seen from (16). As noted above, the 2-torsion B2 exists for “deeper” reasons than the other piece of H1(Ig,1, Z), as it comes from the Rochlin invariant as opposed to pure algebra. Indeed, for the analogous “Torelli group” IA n for Aut(Fn), the corresponding “Johnson homomorphism” gives all the first cohomology. Thus the 2-torsion in H 1(Ig, Z) is truly coming from 3-manifold theory.
