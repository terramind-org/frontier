title: Large Regularity Quadratic Ideals with Linear First Syzygies
field: mathematics
tier: prose
statement: Does there exist a family of quadratic ideals $I_m\subset K[x_1,\ldots,x_m]$ with linearly generated first syzygies and $\lim_{m\to\infty}\operatorname{reg}(S/I_m)/m>0$? Also, is there a constant $\lambda$ such that $\operatorname{reg}K[\Delta]\leq\lambda$ whenever $K[\Delta]$ is Cohen–Macaulay and satisfies $N_2$?
