title: A convention-safe reduction for cubic integrals on the two-torus
field: mathematics
tier: prose
statement: |-
  **Conjecture 10.2.1 ([Bo-Ko-Fo1995]).** If the geodesic flow of a Riemannian metric on the torus \(T^2\) admits an integral that is polynomial of degree 3 in the velocities, then the metric admits a Killing vector field.

  If a smooth Riemannian metric on \(T^2\) has a nonzero homogeneous cubic first integral, then it has a nonzero homogeneous linear first integral.

  The mathematical record begins with the following statement.

  The paragraphs in the record through the proposed odd/even degree analogues belong to Section 10.2 of the source. They explain that a Killing field gives a linear integral whose cube is cubic, that homogeneous velocity components of a geodesic-flow integral are separately integrals, and that “degree” in the accompanying table means the *smallest degree of a nontrivial integral*. The material beginning “10.3.

  There are two suppressed conventions in the displayed conjecture. The intended integral is nontrivial (additional to the energy), and “degree 3” means exact fibre degree, not degree at most three. Equivalently, after taking the top homogeneous part, the intended assertion is:

  For a linear function \(L=X^i p_i\) on \(T^*T^2\), the identity \(\{H,L\}=0\) is equivalent to \(\mathcal L_Xg=0\), so this is exactly the Killing-vector conclusion. Smoothness is enough for the elementary results below. Analyticity is stated separately where a cited global theorem needs it.
