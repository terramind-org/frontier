title: Index-gap obstruction for line covers on Fano hypersurfaces in characteristic p
field: mathematics
tier: prose
statement: |-
  **Recovered question.** Let \(k\) be an algebraically closed field of characteristic \(p>0\), let \(X_d\subset \mathbb P^n_k\) be a general degree-\(d\) hypersurface with \(n\geq d+2\), and let \(e\geq1\). Is the genus-zero Kontsevich space
  \[
  \overline{\mathcal M}_{0,0}(X,e)
  \]
  irreducible of dimension
  \[
  E_e:=e(n+1-d)+n-4?
  \]
  Is this true simultaneously for every \(e\geq1\)?
