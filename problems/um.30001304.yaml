title: Algebraicity of Complex ATR Points
field: mathematics
tier: prose
statement: Let $K/F$ be an ATR extension embedded as an $F$-algebra in $M_2(F)$. Is the associated complex ATR point $AJ_f(\Delta_\Psi)$ algebraic? More precisely, after choosing the isogeny in its definition, does it lie in $E(H_{c_\Psi})$ for every $\Psi$?
