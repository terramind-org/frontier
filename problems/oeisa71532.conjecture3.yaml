lean:
  module: FormalConjectures.OEIS.«71532»
  decl: OeisA71532.conjecture3
  statement: |-
    theorem conjecture3 :
        ∃ C : ℝ, 0 < C ∧ (fun n : ℕ ↦ (a n : ℝ)) ~[atTop] (fun n : ℕ ↦ C * Real.log (n : ℝ) ^ 2)
  context:
    - open OeisA71532
    - open Finset Filter
    - open scoped Asymptotics
  definitions:
    - name: OeisA71532.a
      kind: def
      text: |-
        /-- The sequence $a(n) = -\sum_{k=1}^n (-1)^{\lfloor (3/2)^k \rfloor}$. -/
        def a (n : ℕ) : ℤ :=
          - ∑ k ∈ Icc 1 n, (-1 : ℤ) ^ (3 ^ k / 2 ^ k)
