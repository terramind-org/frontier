title: Geometric Hydrodynamics in Open Problems — Problem 33
field: mathematics
tier: prose
statement: |-
  The connection between equations of quantum mechanics
  and hydrodynamics might shed some light on the hydrodynamic quantum analogues studied,
  e.g., in [Couder, Bush]:
  the motion of bouncing droplets in certain vibrating liquids manifests many properties of quantum mechanical particles.

  Explain the droplet-quantum particle correspondence by a combination of averaging and the Madelung transform.
