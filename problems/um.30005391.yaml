title: Generic Vanishing of Localized Shimura-Variety Cohomology
field: mathematics
tier: prose
statement: Let $\mathfrak m_p$ be a generic maximal ideal of the local Hecke algebra. Prove that $H^i(X_K,R)_{\mathfrak m_p}\neq 0$ implies $i\geq q_0$, and that $H_c^i(X_K,R)_{\mathfrak m_p}\neq 0$ implies $i\leq q_0+l_0$.
