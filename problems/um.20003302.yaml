id: um.20003302
title: The logarithmic threshold and a malformed epsilon quantifier
field: mathematics
tier: prose
statement: |-
  For \(\alpha\in\mathbb R\), let
  \(\langle\alpha\rangle=\operatorname{dist}(\alpha,\mathbb Z)\).

  **Question 27 (A. Pollington).** Are there \(\alpha,\beta\in\mathbb R\)
  such that for every \(\varepsilon>0\),
  \[
  \liminf_{q\to\infty}
  q(\log q)^{2-\varepsilon}
  \langle q\alpha\rangle\langle q\beta\rangle>0?
  \]
  It follows from [65] that
  \[
  \liminf_{q\to\infty}
  q(\log q)^2
  \langle q\alpha\rangle\langle q\beta\rangle=0
  \]
  for almost all \((\alpha,\beta)\). Thus, the set of
  \((\alpha,\beta)\) in Question 27 has measure zero.
