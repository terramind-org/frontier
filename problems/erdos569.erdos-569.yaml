lean:
  module: FormalConjectures.ErdosProblems.«569»
  decl: Erdos569.erdos_569
  statement: |-
    theorem erdos_569 :
        ∀ (k : ℕ) (hk : 1 ≤ k),
          sInf {C : ℝ | 0 < C ∧
            ∀ (m : ℕ) (W : Type) [Fintype W] (H : SimpleGraph W) [DecidableRel H.Adj],
              (∀ v, 0 < H.degree v) →
              H.edgeSet.ncard = m →
              (SimpleGraph.graphRamsey (SimpleGraph.cycleGraph (2 * k + 1)) H : ℝ) ≤ C * m} =
                erdos_569.answer k
