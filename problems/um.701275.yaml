title: Kourovka Notebook Problem 16.84
field: mathematics
tier: prose
statement: |-
  Can the braid group ${\mathfrak{B}}_n$, $n\geq 4$,
  act faithfully on a regular rooted tree by finite-state
  automorphisms? Such action is known for ${\mathfrak{B}}_3$.

  See the definitions in (R. I. Grigorchuk,
  V. V. Nekrashevich,
  V. I. Sushchanskiĭ,

  *Proc. Steklov Inst. Math.*, **2000**, no. 4 (231),
  128--203).
