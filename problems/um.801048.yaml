title: Open Problems for Painleve Equations — Problem 2
field: mathematics
tier: prose
statement: |-
  The Painlev\'e equations are known to have a cornucopia of properties such as: a Hamiltonian representation; exact solutions (rational solutions, algebraic solutions, solutions in terms of classical special solutions);
  B\"acklund transformations (which relate two solutions of a Painlev\'e equation); associated isomonodromy problems (which are Lax pairs that express the Painlev\'e equation as the compatibility of two linear systems);
  and asymptotic approximations in the complex plane, with associated connection formulae relating the asymptotics. For details see [refPAC05review,refConte,refFIKN,refGLS,refIKSY,refKNY,refNoumi] and the references therein.

  A complete classification and a unifying structure for these properties is needed as the presently known results are rather fragmentary and non-systematic.
