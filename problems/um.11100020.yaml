title: Morava K- and E-theory 10 — Bousfield has give a description of the E(1)-local category in terms of algebraic data related to K-th…
field: mathematics
tier: prose
statement: Bousfield has give a description of the E(1)-local category in terms of algebraic data related to K-theory. Franke claims to have generalized all this, but once again, I do not understand what he does. Bousfield describes the isomorphism classes, but not the maps. In the K(1)-local category, it seems to me, things might be a bit simpler. Is there some more natural description of Bousfield's work in the K(1)-local category? It is always dangerous to try to improve on Bousfield, and certainly no one has succeeded in the past 10 plus years.
