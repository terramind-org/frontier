title: Ultraproduct II_1 Factors — Problem 43
field: mathematics
tier: prose
statement: |-
  Recall that a II$_1$ factor $N$ is said to be solid if any subalgebra $A\subset N$ with diffuse commutant in $N$ is amenable. Recall that a II$_1$ factor $N$ is said to be $\mathcal{U}$-solid if any subalgebra $A\subset N$ with diffuse commutant in $N^\mathcal{U}$ is amenable.

  Is solidity equivalent to $\mathcal{U}$-solidity in II$_1$ factors?
