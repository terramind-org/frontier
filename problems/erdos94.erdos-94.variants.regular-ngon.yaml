lean:
  module: FormalConjectures.ErdosProblems.«94»
  decl: Erdos94.erdos_94.variants.regular_ngon
  statement: |-
    theorem erdos_94.variants.regular_ngon : ∀ᶠ n : ℕ in atTop, ∀ P : Finset ℝ²,
        P.card = n → ConvexIndep (P : Set ℝ²) →
        ∑ u ∈ distanceSet P, (distanceMultiplicity P u : ℝ) ^ 2 ≤
          ∑ u ∈ distanceSet (regularNGon n), (distanceMultiplicity (regularNGon n) u : ℝ) ^ 2
  context:
    - open Erdos94
    - open Erdos94.erdos_94
    - open Erdos94.erdos_94.variants
    - open Filter EuclideanGeometry
  definitions:
    - name: Erdos94.regularNGon
      kind: def
      text: |-
        /-- The regular $n$-gon inscribed in the unit circle. -/
        noncomputable def regularNGon (n : ℕ) : Finset ℝ² :=
          (Finset.range n).image fun k : ℕ =>
            !₂[Real.cos (2 * Real.pi * k / n), Real.sin (2 * Real.pi * k / n)]
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/94.lean#L39
