title: Pointwise Asymptotics of Special Quaternionic Eigenfunctions
field: mathematics
tier: prose
statement: |-
  For $y\in D^\times(\mathbb A_\mathbb Q)$ and every special eigenfunction $f$, is

  $$f(y)=(1+o(1))\int_{D^\times(\mathbb Q)\backslash D^\times(\mathbb A_\mathbb Q)}f(x)\,d\mu(x)$$?
