title: An existential NP class for P4-structures of M-join graphs
field: mathematics
tier: prose
statement: |-
  **Problem 2.** Find a class \(\mathbf C_2\) of 4-uniform hypergraphs such
  that (i) the \(P_4\)-structure of every graph with an M-join belongs to
  \(\mathbf C_2\), (ii) no odd ring belongs to \(\mathbf C_2\), and
  (iii) \(\mathbf C_2\) belongs to NP.
