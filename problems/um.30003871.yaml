title: $p$-Adic Riemann–Hilbert and de Rham Compatibility
field: mathematics
tier: prose
statement: Let $X$ be a smooth algebraic variety over a number field $E$, let $L$ be a geometric $p$-adic étale local system on $X$, and let $\sigma:E\hookrightarrow\mathbb C$. Are the tensor functors that associate to $L$ a regular integrable connection on $X_\sigma$ through the complex Riemann–Hilbert correspondence and through algebraic de Rham theory canonically isomorphic? Is the filtered de Rham realization a complex variation of Hodge structures?
