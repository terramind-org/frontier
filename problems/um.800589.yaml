title: Selection Principles in Mathematics — Problem 15 ([Hdim])
field: mathematics
tier: prose
statement: |-
  Assume that $Y$ has Hausdorff dimension zero.
  The assumption that $X$ satisfies $\mathsf{S}_1(\Omega,\Gamma)$
  does not imply that $X\times Y$ has Hausdorff dimension zero.
  However, if $X$ satisfies $\mathsf{S}_1(\{\rmO_n\}_{n\in\mathbb{N}},\Gamma)$, (
  $\mathsf{S}_1(\{\rmO_n\}_{n\in\mathbb{N}},\Gamma)$ is the *strong $\gamma$-property* [GM, strongdiags]:
  For each sequence $\{\mathcal{U}_n\}_{n\in\mathbb{N}}$ where for each $n$, $\mathcal{U}_n$ is an open $n$-cover of $X$
  (i.e., each $F\subseteq X$ with $|F|\le n$ is contained in some member of $\mathcal{U}_n$),
  there are $U_n\in\mathcal{U}_n$, $n\in\mathbb{N}$, such that $\{\mathcal{U}_n : n\in\mathbb{N}\}$ is a $\gamma$-cover of $X$.
  )
  then $X\times Y$ has Hausdorff dimension zero [Hdim].

  Assume that $|X|<\mathfrak{p}$.
  Is it true that for each $Y$ with Hausdorff dimension zero,
  $X\times Y$ has Hausdorff dimension zero?
