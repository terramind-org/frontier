title: Virtual-knot problem 19 — Vassiliev Invariants
field: mathematics
tier: prose
statement: |-
  Vassiliev Invariants: Understand the connection between
  virtual knot polynomials and the Vassiliev knot invariants of
  virtual knots (in Kauffman's sense). Some of that was done
  in .

  The key question about this collection of invariants is this: Does every Vassiliev invariant of finite type, for classical knots
  extend to an invariant of finite type for long virtual knots? Here
  we mean the problem in the sense of the formulation given
  in . In it was pointed out that there is a
  natural notion of Vassiliev invariants for virtual knots that has a
  different notion of finite type from that given in . This
  alternate formulation needs further investigation.
