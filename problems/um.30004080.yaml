title: Big Test Ideals from Plus Closure
field: mathematics
tier: prose
statement: |-
  Let $R$ be a localization of a numerically $\mathbb Q$-Gorenstein normal domain of finite type over an $F$-finite field, and set

  $$P(R)=\bigcap_{I\subseteq R}(I:I^+),\qquad I^+=IR^+\cap R.$$

  Is the big test ideal $\tau_b(R)$ equal to $P(R)$?
