title: Equivalence of Dual Pisot Substitution Constructions
field: mathematics
tier: prose
statement: For primitive Pisot substitutions beyond the known two-letter unimodular cases, are the star-dual, Galois-dual, and geometric dual-substitution constructions equivalent, and does the resulting dual tiling become a proper tiling rather than a multiple covering, thereby proving the Pisot substitution conjecture?
