  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] M. Bialy, C. Fierobe, A. Glutsyuk, M. Levi, A. Plakhov and S. Tabachnikov, \emph{Open problems on billiards and geometric optics} (2021), arXiv:2110.10750v2, Alexander Plakhov, Problem 1, p. 8. \url{https://arxiv.org/pdf/2110.10750v2}.
  \end{description}
