id: um.30005710
title: Convex Equipartitions in Tautological Vector Bundles
field: mathematics
tier: prose
statement: Let $d,j,n,k\geq 1$, let $\mathcal C$ be a collection of $j$ proper convex bodies in $\mathbb R^d$ containing the origin in their interiors, and let $\mathcal P$ be a prescribed class of convex partitions of $\mathbb R^k$. Determine whether there are a $k$-dimensional linear subspace $L\subseteq\mathbb R^d$ and a partition $(A_1,\ldots,A_n)$ of $L$ from $\mathcal P$ such that $\operatorname{vol}_k(C\cap L\cap A_1)=\cdots=\operatorname{vol}_k(C\cap L\cap A_n)$ for every $C\in\mathcal C$.
