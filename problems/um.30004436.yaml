title: Cardinality of Spin-Glass Ground-State Sets
field: mathematics
tier: prose
statement: For every graph and every distribution of linear growth, does the set $G(J)$ of spin-glass ground states satisfy $|G(J)|\in\{2,\infty\}$? More generally, is there a connection between random walks and spin-glass ground states on graphs beyond trees?
