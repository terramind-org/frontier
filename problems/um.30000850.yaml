title: Partition Formulas for Tautological Rings of General Curves
field: mathematics
tier: prose
statement: For a general curve $C$ of genus $g$, does its tautological ring $R$ satisfy $\dim_{\mathbb Q}R=p(g+1)$ and $\dim R^i_{(j)}=p(i,g+1-i,j)$, where the latter number counts partitions of $i$ into $i-j$ parts, each at most $g+1-i$, assuming Polishchuk's conjectural identification of the auxiliary ring $S$ with $R$?
