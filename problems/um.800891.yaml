title: Open Problems in Pluripotential Theory — Question 22
field: mathematics
tier: prose
statement: |-
  [Blocki]
  Let $\Omega \subset {\mathbb{C}}^n$ be a bounded hyperconvex domain.
  Let $u$ be the unique continuous plurisubharmonic function in
  $\Omega$ such that $u_{| \partial \Omega}=0$ and
  $$
  (dd^c u)^n=f dV,
  $$
  with $f$ smooth and bounded away from zero $f \geq \varepsilon >0$. Is $u$ automatically smooth ?
