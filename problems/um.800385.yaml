title: Open Problems in Arithmetic Dynamics — Conjecture 8 (Odoni, 1985, [MR805714])
field: mathematics
tier: prose
statement: |-
  Let $K$ be a Hilbertian field, (A field $K$ is
  *Hilbertian* if it is not possible to cover $\mathbb{P}^1(K)$ by a
  union of finitely manys sets of the form $F\bigl(C(K)\bigr)$,
  where $C/K$ is a smooth curve and $F:C\to\mathbb{P}^1$ is a finite map of
  degree at least $2$. For example, all number fields are Hilbertian,
  but $\mathbb{R}$, $\mathbb{C}$, and $\mathbb{Q}_p$ are not.) and let $d\ge2$. There
  exists a monic polynomial $f(X)\in K[X]$ of degree $d$ and a
  point $P\in K$ such that $\iota_K(f,P)=1$. \textup(Addendum:
  [MR3220023, Jones, 2015] If $K$ is a number field, then one can
  take the coefficients of $f(X)$ to lie in the ring of integers
  of $K$.\textup)
