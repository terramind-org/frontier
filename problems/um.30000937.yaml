title: Recognition of Lattice Point Configurations as Convex Ovals
field: mathematics
tier: prose
statement: Let $\Lambda$ be a planar lattice, let $S$ be a closed bounded convex region containing the origin, let $S(r,P)$ be its scale-$r$ translate, and set $J(r,P)=\Lambda\cap S(r,P)$. How efficiently can one decide whether a finite lattice configuration is an $S$-oval of this form?
