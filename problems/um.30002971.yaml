title: Long-Range Mechanical Signaling in Tissue Morphogenesis
field: mathematics
tier: prose
statement: In morphogenesis, how can global tissue-size information be transmitted when cell regulation is local; in particular, can active mechanical stress or its derivative provide a scale-dependent signal beyond the fixed characteristic length of reaction–diffusion mechanisms?
