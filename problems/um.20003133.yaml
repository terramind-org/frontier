title: Normalized obstructions to pointwise quarter-pinched collapse
field: mathematics
tier: prose
statement: |-
  **Problem 8.** Is there a sequence of simply-connected, pointwise strictly \(\frac14\)-pinched manifolds \(M_i^n\), \(n>2\), that collapse?

  There is a substantive ambiguity that the one-line source does not resolve. “Collapse” normally comes with a scale convention. In the bounded-curvature sense one asks for, after normalization, for example
  \[
   |\sec_{g_i}|\leq 1,\qquad \operatorname{diam}(M_i,g_i)\leq D,
  \]
  and Gromov--Hausdorff convergence to a compact space of dimension less than \(n\) (equivalently, in this setting, volume tending to zero). Problem 7 immediately before this one explicitly assumes \(|\sec|\leq1\), which is evidence that a curvature normalization was intended in Problem 8 as well. Without an upper-curvature or diameter normalization, Problem 8 has a trivial affirmative answer by homothety; this is proved below.
