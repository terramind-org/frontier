lean:
  module: FormalConjectures.ErdosProblems.«700»
  decl: Erdos700.erdos_700.parts.i
  statement: |-
    theorem erdos_700.parts.i :
        {n : ℕ | ¬ n.Prime ∧ 1 < n ∧ f n = n / P n} = erdos_700.parts.i.answer
  context:
    - open Erdos700
    - open Erdos700.erdos_700
    - open Erdos700.erdos_700.parts
    - open Finset
  definitions:
    - name: Erdos700.f
      kind: def
      text: |-
        /-- `f n = min_{1 < k ≤ n/2} gcd(n, C(n,k))`. (The infimum is `0` when the range is empty, i.e.
        `n < 4`.) -/
        noncomputable def f (n : ℕ) : ℕ :=
          sInf {m | ∃ k, 1 < k ∧ k ≤ n / 2 ∧ m = Nat.gcd n (n.choose k)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/700.lean#L40
    - name: Erdos700.P
      kind: def
      text: |-
        /-- `P n` is the largest prime factor of `n` (and `0` if `n ≤ 1`). -/
        noncomputable def P (n : ℕ) : ℕ := n.primeFactors.sup id
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/700.lean#L45
