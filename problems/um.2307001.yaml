title: Research Problems in Function Theory — Problem 7.1
field: mathematics
tier: prose
statement: Let $E$ be the compact plane set of transfinite diameter ($=$capacity) $d(E)=1$ and let \[d_n(E)^{n(n-1)/2}=\max_{w_\nu\in E}\prod_{1\leq\mu<\nu\leq n}|w_\mu-w_\nu|.\] It is known that $d_n(E)$ decreases with $n$ and $d_n(E)\to d(E)$ as $n\to\infty$, so that $d_n(E)\geq1$ is trivial. It is known by Pommerenke , that $d_n(E)\geq n^{2/(n-1)}$ if $E$ is connected. Is this inequality true in general? Further, is it true that \[d_n(E)^{(n-1)/2}\leq Kn\] if $E$ is connected, where $K$ is some absolute constant? It is known that \[d_n(E)^{(n-1)/2}\leq\Big(\frac{4}{e}\log n +4\Big)n,\] in this case. (Ch. Pommerenke)
