title: Global Optimality and Initialization in Sparse Dictionary Learning
field: mathematics
tier: prose
statement: In sparse dictionary learning, is the generating dictionary a global optimum of the K-SVD/ITKsM criteria; are there efficient initialization strategies when sparsity $S=O(\mu^{-2})$; and can the convergence radii of ITKsM and ITKrM be extended to $O(1)$?
