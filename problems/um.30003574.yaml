title: Intrinsic $L^2$ Extension Beyond Nilpotent Sections
field: mathematics
tier: prose
statement: Let $0=m_0<m_1<\cdots$ be the jumping numbers of a multiplier-ideal filtration $\mathcal I(m\psi)$, let $J=\mathcal I(m_p\psi):\mathcal I(m_{p-1}\psi)$, and let $Y=V(J)$. Without requiring a section $f$ on $Y$ to be nilpotent and associated with $\mathcal I(m_{p-1}\psi)/\mathcal I(m_p\psi)$, is there an intrinsic $L^2$ norm on $f$ and a corresponding intrinsic $L^2$ extension estimate?
