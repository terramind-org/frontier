title: Locally constant logarithmic potentials
field: mathematics
tier: prose
statement: Let $\mu$ be a positive plane measure with $\mu(\{|z|\le r\})\le cr^\alpha$ for some $0<\alpha<1/2$. Can its logarithmic potential $$u(z)=\int\log\left|1-\frac z\zeta\right|\,d\mu(\zeta)$$ be locally constant on an open set meeting every circle centered at the origin?
