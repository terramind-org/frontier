title: Vinogradov-Type Bounds for Large-Order Dirichlet Characters
field: mathematics
tier: prose
statement: For primitive characters $\chi$ modulo primes $q$ whose orders tend to infinity, find general conditions ensuring that the least $n$ with $\chi(n)\notin\{0,1\}$ is $O_\epsilon(q^\epsilon)$ and that $\chi$ takes varied values below $q^\epsilon$.
