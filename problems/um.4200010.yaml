title: The good, the bad, and the ugly
field: mathematics
tier: prose
statement: For a Hamiltonian system, call the good set the maximal invariant subset on which the invariant Liouville measure is almost periodic; call the bad set the Pesin set on which the invariant measure has a positive Lyapunov exponent; and call the ugly set the complement of their union. Is there an example in which the ugly set has positive measure?
