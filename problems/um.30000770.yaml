title: Compatibility of Nef Reduction and Iitaka Fibrations
field: mathematics
tier: prose
statement: For a smooth projective algebraic $K(\pi,1)$ space $X$ in characteristic zero, do the nef reduction of $\omega_X$, the Iitaka fibration, assuming the standard Kodaira-dimension-zero conjecture, and the pluricanonical maps, assuming abundance, agree after the finite étale cover that makes the almost-abelian fibration an abelian scheme, with common base $Y'$ of general type?
