title: Infinite Transversals from Points to Spanned Hyperplanes
field: mathematics
tier: prose
statement: For every $d$ and every $P\subseteq\mathbb R^d$ whose affine span is $\mathbb R^d$, let $H$ be the set of hyperplanes spanned by $P$. Does there exist an injective map $f:P\to H$ with $p\in f(p)$ for every $p\in P$?
