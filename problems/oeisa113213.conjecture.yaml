lean:
  module: FormalConjectures.OEIS.«113213»
  decl: OeisA113213.conjecture
  statement: |-
    theorem conjecture :
        (∀ᶠ n : ℕ in Filter.atTop, ∃ m, (2 ^ n - m).Prime ∧ (2 ^ n + m).Prime) ∧
        (fun n : ℕ => (a n : ℝ)) =O[Filter.atTop] (fun n : ℕ => (n ^ 3 : ℝ))
  context:
    - open OeisA113213
    - open Nat
  definitions:
    - name: OeisA113213.a
      kind: def
      text: |-
        /--
        a n is the smallest number m such that $2^n - m$ and $2^n + m$ are primes.
        Computed by checking elements from $0$ to $2^n$, as any larger $m$ would make
        $2^n - m = 0$ which is not prime.
        -/
        def a (n : ℕ) : ℕ :=
          let s := (List.range (2^n + 1)).filter (fun m => (2^n - m).Prime ∧ (2^n + m).Prime)
          s.headD 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/113213.lean#L34
