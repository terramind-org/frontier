title: Combinatorial Determination of Milnor-Fiber Monodromy
field: mathematics
tier: prose
statement: "Let $\\mathcal{A}$ be a central hyperplane arrangement in $\\mathbb{C}^n$ with Milnor fiber $F$ and algebraic monodromy homomorphism $h : H^1(F; \\mathbb{C}) \\to H^1(F; \\mathbb{C})$. Is the first-cohomology monodromy homomorphism $H^1(F) \\to H^1(F)$ combinatorially determined by the intersection lattice / arrangement data $d_{\\mathcal{A}}$?"
