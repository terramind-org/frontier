title: Corrected normalization and an exact non-Q-Gorenstein determinantal limit
field: mathematics
tier: prose
statement: |-
  For \((R,\mathfrak m)\) a local, normal domain of characteristic \(p>0\)
  and dimension \(d\), let \(\mu_e\) denote the minimal number of generators
  of \(\operatorname{Hom}_R(R^{1/p^e},R)\) as an \(R\)-module.  Does
  \[
  \lim_{e\to\infty}\frac{\mu_e}{p^{ed}}
  \]
  exist?  If so, what is it?
