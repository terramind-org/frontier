title: Kourovka Notebook Problem 16.15
field: mathematics
tier: prose
statement: |-
  An element $g$ of a group $G$ is an *Engel
  element* if for every $h\in G$ there exists $k$ such that
  $[h,g,\ldots ,g]=1$, where $g$ occurs $k$ times; if there is such
  $k$ independent of $h$, then $g$ is said to be *boundedly
  Engel*.

  b) Does the set of boundedly
  Engel elements form a subgroup in a torsion-free group?

  c) The same question for right-ordered groups.

  d) The same question for linearly ordered
  groups.

