title: Covariogram Determination of Convex Bodies
field: mathematics
tier: prose
statement: For a convex body $K\subset\mathbb{R}^n$, let $g_K(x)=\operatorname{vol}(K\cap(K+x))$. Does the covariogram $g_K$ determine $K$ among all convex bodies, up to translations and point reflections?
