id: um.20002076
title: Even-dimensional intersection theorem and conditional odd case for Lagrangian spheres in quadrics
field: mathematics
tier: prose
statement: |-
  **Question 1.18 (Polterovich).** For $n \geq 2$, let
  $$
  Q^n = \{[z_0 : \cdots : z_{n+1}] \in \mathbb{CP}^{n+1} : z_0^2 + \cdots + z_{n+1}^2 = 0\}
  $$
  be the smooth complex $n$-dimensional quadric hypersurface. Does $Q^n$ contain two disjoint Lagrangian spheres? (Conjecturally, $Q^n$ does not contain two disjoint Lagrangian spheres; this is immediate when $n$ is even.)
