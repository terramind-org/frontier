title: Long Cycles in Induced-Ramsey Graph Constructions
field: mathematics
tier: prose
statement: Given a graph $F$ and integers $r,n$, how many and what kinds of cycles longer than $n$ can occur in a graph $H$ with $H\to(F)^r$ and with every induced cycle of length at most $n$ inherited from a copy of $F$?
