title: 5.9 (Cooper) — Thurston's Lego sets in dimensions at least four
field: mathematics
tier: prose
statement: Given $R>0$ and an integer $n\geq4$, is there an $\varepsilon>0$ and a finite set of hyperbolic $n$-simplices such that every closed cone $n$-manifold obtained by gluing these simplices with all codimension-two cone angles in $(2\pi-\varepsilon,2\pi+\varepsilon)$ admits a hyperbolic metric, and every closed hyperbolic $n$-manifold with injectivity radius everywhere greater than $R$ is obtained this way?
