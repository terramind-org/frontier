lean:
  module: FormalConjectures.GreensOpenProblems.«84»
  decl: Green84.green_84.variants.ultraflat_mod
  statement: |-
    theorem green_84.variants.ultraflat_mod :
        ∃ Q : Set ℕ, Q.Infinite ∧ ∃ C : ℝ, ∃ A : (q : ℕ) → Finset (ZMod q),
          Tendsto (fun q ↦ (#(A q) : ℝ) / (q : ℝ) ^ ((1 : ℝ) / 3))
            (atTop ⊓ Filter.principal Q) (𝓝 1) ∧
          ∀ q ∈ Q, ∀ r : ZMod q, r ≠ 0 → ‖fourierMod (A q) r‖ ≤ C * (q : ℝ) ^ ((1 : ℝ) / 6)
  context:
    - open Green84
    - open Green84.green_84
    - open Green84.green_84.variants
    - open Filter
    - open scoped ExponentialSum Finset Topology
  definitions:
    - name: Green84.fourierMod
      kind: def
      text: |-
        /--
        `fourierMod A r` is the Fourier coefficient $\sum_{a \in A} e(ar/q)$ of a set
        $A \subset \mathbb{Z}/q\mathbb{Z}$ at $r \in \mathbb{Z}/q\mathbb{Z}$. The product $ar$ is
        represented by its value in $\{0, \dots, q - 1\}$.
        -/
        noncomputable def fourierMod {q : ℕ} (A : Finset (ZMod q)) (r : ZMod q) : ℂ :=
          ∑ a ∈ A, e (((a * r).val : ℝ) / q)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/GreensOpenProblems/84.lean#L62
