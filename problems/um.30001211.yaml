title: Uniform Recurrence Rates for Minimal Interval Exchanges
field: mathematics
tier: prose
statement: For a minimal interval-exchange transformation $T$ on $J=\{x:0\leq x<1\}$, define $\phi_1(x,y)=\liminf_{n\to\infty}n\lvert T^n(x)-y\rvert$. Can $\phi_1(x,y)=0$ hold for every $x,y\in J$, rather than only for almost every pair?
