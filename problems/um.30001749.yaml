title: Lipschitz Equivalence of Dust-Like Self-Similar Sets
field: mathematics
tier: prose
statement: Let $\rho=(\rho_1,\ldots,\rho_m)\in(0,1)^m$ satisfy $\sum_{j=1}^m\rho_j^d<1$, and let $D(\rho)$ denote any dust-like self-similar attractor in $\mathbb{R}^d$ with contraction ratios $\rho$. Given contraction vectors $\rho$ and $\tau$, characterize nontrivial necessary and sufficient conditions for $D(\rho)$ and $D(\tau)$ to be Lipschitz equivalent.
