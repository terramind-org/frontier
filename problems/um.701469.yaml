title: Kourovka Notebook Problem 18.40
field: mathematics
tier: prose
statement: |-
  The commutator length $cl(g)$ of $g \in [G,G]$ is the least number of commutators in $G$ whose product is $g$, and the stable commutator length is $scl(g):=
  \lim_{n \to \infty} cl(g^n)/n$.

  *Conjecture*: Let $G$ be a hyperbolic group. Then the stable commutator length takes on rational values on $[G,G]$.
