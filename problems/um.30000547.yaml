title: Equivariant Real-Hyperbolic Embeddings for Deligne–Mostow Lattices
field: mathematics
tier: prose
statement: For a uniform arithmetic lattice $\Gamma<PU(2,1)$ generated by order-five complex reflections, is there a $\Gamma$-equivariant totally geodesic real embedding $\mathbb H^2_{\mathbb R}\times\pi_1(\Sigma_g)\to\mathbb H^2_{\mathbb C}$ whose image avoids the reflection fixed-point sets?
