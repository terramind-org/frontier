title: Kourovka Notebook Problem 11.16
field: mathematics
tier: prose
statement: |-
  Let $V_r$ be the class of
  all finite groups $G$ satisfying a law $[x, _r y]=[x, _s y]$
  for some $s=s(G) > r$. Here $[x, _1 y] = [x,y]$ and $[x,
  _{i+1} y]=[[x, _i y],y]$.

  a) Is there a function $f$ such that every
  soluble group in $V_r$ has Fitting length $< f(r)$? For $r < 3$ see
  (R. Brandl, *Bull. Austral. Math. Soc.*,
  **28** (1983), 101--110).

  b) Is it true that $V_r$ contains only finitely
  many nonabelian simple groups? This is true for $r < 4$.
