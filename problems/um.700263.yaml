title: Kourovka Notebook Problem 4.56
field: mathematics
tier: prose
statement: |-
  Let $R$ be a commutative Noetherian ring with 1, and
  $\Lambda$ an $ R $-algebra, which is finitely generated as $R
  $-module. Put $T=\{ U \in \mathrm{Mod} \Lambda \mid \exists \mbox{ an
  exact}\; \Lambda \mbox{-sequence} \; 0 \rightarrow P \rightarrow
  \Lambda ^{(n)} \rightarrow U \rightarrow 0\mbox{ for some}\;n,\;
  \mbox{with}\;P_m \cong \Lambda _m^{(n)} \;\mbox{for every maximal
  ideal}\;m \mbox{ of}\;R\} $. Denote by ${\mathbb{G}(T)$ the Grothendieck
  group of $T$ relative to short exact sequences.

  a) Describe ${\mathbb{G}(T)$, in particular, what
  does it mean: $[U]=[V]$ in ${\mathbb{G}(T)$?

  b) *Conjecture:* if $\dim (\max (R))=d <
  \infty $, and there are two epimorphisms $\varphi \! : \Lambda ^{(n)}
  \rightarrow U$, \ $\psi \! : \Lambda ^{(n)} \rightarrow V$, \ $n
  > d$, \ and \ $[U]=[V]$ \ in \ ${\mathbb{G}(T)$, then $\mathrm{Ker} \varphi
  =\mathrm{Ker} \psi $.
