title: Algebraic Dimension from Positive Normal Bundles
field: mathematics
tier: prose
statement: Let $Z$ be a compact connected complex manifold of dimension $n+p$ containing a $(p-1)$-dimensional submanifold $Y$ with positive normal bundle and a covering compact family of $n$-cycles. Must the algebraic dimension of $Z$ be at least $p$?
