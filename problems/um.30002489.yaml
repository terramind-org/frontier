statement: How are the competing definitions of unsteady flow barriers related, for example curves of extremal deformation versus transfer-operator eigenfunctions or mesohyperbolic trajectories versus extremal flux? How accurately does each definition identify barriers, which properties are essential, and must a valid definition be frame invariant?
