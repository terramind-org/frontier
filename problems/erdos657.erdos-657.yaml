lean:
  module: FormalConjectures.ErdosProblems.«657»
  decl: Erdos657.erdos_657
  statement: |-
    theorem erdos_657 :
        ∃ f : ℕ → ℝ, Tendsto f atTop atTop ∧
          ∀ n : ℕ, ∀ A : Finset ℝ², A.card = n → (A : Set ℝ²).IsIsoscelesFree →
            f n * (n : ℝ) ≤ (distinctDistances A : ℝ)
  context:
    - open Erdos657
    - open Filter
    - open scoped EuclideanGeometry
  definitions: []
