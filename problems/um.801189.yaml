title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 16: Combinatorial interpretation of Kazhdan-Lusztig polynomial coefficients for S_n"
field: mathematics
tier: prose
statement: Give a direct positive combinatorial interpretation of the coefficients of the Kazhdan-Lusztig polynomial $P_{u,v}(q)$ when $W$ is a finite or affine Weyl group, especially for the symmetric group $W = S_n$, thereby combinatorially reproving that they are nonnegative.
