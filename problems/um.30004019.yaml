title: Quasi-Cuspidal Representations and Generators of Equivariant D-Modules
field: mathematics
tier: prose
statement: Let $G$ be connected and reductive, and put $P(V)=D_{\mathfrak g}\otimes_{U\mathfrak g}V$. Characterize the quasi-cuspidal representations $V$ for which $P(V)$ has a cuspidal summand, and find a minimal set of irreducible $V$ whose modules $P(V)$ generate $D\!\operatorname{-mod}(\mathfrak g)^G$.
