title: Transport and equipartition in a two-mass toral billiard
field: mathematics
tier: prose
statement: |-
  Given a Saini billard on a torus with a finite horizon and two masses
  \(m_1\) and \(m_2\), is there a way to find the system's viscosity, i.e. transfer of momentum. Additionally, is there a way to define heat in this model and can one check the Einstein relation? Lastly, if \(m_1\ne m_2\) then, in the limit, do the masses have the same kinetic energy?
