title: Exceptional Collections on Noncommutative Del Pezzo Surfaces
field: mathematics
tier: prose
statement: "Prove the following conjectures for noncommutative del Pezzo surfaces: (1) an exceptional object is determined by its Grothendieck-group class and full exceptional collections are mutation-equivalent; (2) every pure helix deforms to the noncommutative surface; and (3) two marked surfaces are isomorphic exactly when their markings lie in the same affine-Weyl-group orbit."
