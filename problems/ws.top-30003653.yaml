  \section{Ordered-Median Facility Location}\label{30003653}
  {\small\sffamily UnsolvedMath ID 30003653 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  For a facility set $X$, each site pays its minimum cost to a facility in $X$. The ordered-median objective sorts those site costs and weights their ranks by the given $\lambda_k$.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The supplied text defines an optimization problem but does not identify an unresolved theorem or a requested complexity/approximation result.

  Source-record limitation: The supplied assessment flags this as an optimization-problem definition, not an open statement or complexity conjecture.
  \paragraph{Statement recorded in the supplied source.}
  Given $n$ sites, a nonnegative cost matrix $C=(c_{j\ell})$, and $p<n$ facilities, choose $X\subseteq\{1,\ldots,n\}$ with $|X|=p$ to minimize the ordered weighted cost $\sum_{k=1}^n\lambda_k c_{\sigma_X(k)}(X)$, where $c_j(X)=\min_{\ell\in X}c_{j\ell}$ and $\sigma_X$ sorts these costs. \sref{30003653}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Choose the stated number of facilities to minimize ordered site costs.
