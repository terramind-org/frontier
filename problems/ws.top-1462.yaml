title: Tarski's Exponential Function Problem
field: mathematics
tier: prose
statement: |-
  \section*{\texorpdfstring{Tarski's Exponential Function Problem}{Tarski's Exponential Function Problem}}\label{1462}
  \subsection{Definitions and mathematical statement}
  A first-order sentence in the real exponential field is built from real variables, the constants $0,1$, addition, multiplication, order, equality, and the usual real function $\exp$, using Boolean operations and quantifiers over ${\mathbb{R}}$. Let
  \[
   \operatorname{Th}({\mathbb{R}}_{\exp})=\{\ulcorner\varphi\urcorner:({\mathbb{R}};0,1,+,\cdot,\exp,<)\models\varphi\}.
  \]
  The question is whether this set of finite encodings is decidable by an algorithm halting on every input. It concerns arbitrary quantifier alternation, not only an existential fragment, and imposes no complexity bound.
  \par\smallskip\textit{Formulation and concept references:} \href{https://drops.dagstuhl.de/storage/00lipics/lipics-vol327-stacs2025/LIPIcs.STACS.2025.37/LIPIcs.STACS.2025.37.pdf}{[S1]}.

  \subsection{Short English statement}
  Can a terminating algorithm decide every first-order statement about real arithmetic with the exponential function?
  \subsection{Sources}
  \begin{itemize}
  \item[S1]Jorge Gallego-Hernandez, Alessio Mansutti, "On the Existential Theory of the Reals Enriched with Integer Powers of a Computable Number," 42nd International Symposium on Theoretical Aspects of Computer Science (STACS 2025), LIPIcs vol. 327, Article 37, pp. 37:1-37:18.
  \url{https://drops.dagstuhl.de/storage/00lipics/lipics-vol327-stacs2025/LIPIcs.STACS.2025.37/LIPIcs.STACS.2025.37.pdf}.
  \textit{Formulation source.}
  \end{itemize}
