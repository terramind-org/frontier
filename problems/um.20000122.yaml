title: Literal projective-plane example and a logarithmic BMY obstruction
field: mathematics
tier: prose
statement: |-
  Can a surface with \(c_{1}^{2}=3c_{2}\) contain a rational curve in char. \(p\)?

  Let \(X\) be a smooth projective minimal surface of general type over an
  algebraically closed field of characteristic \(p>0\), with \(K_X\) nef (or,
  in the ball-quotient analogue, ample) and
  \(K_X^2=3c_2(X)\). Can \(X\) contain an integral curve whose normalization is
  \(\mathbf P^1\)?
