title: Mordell–Lang Finiteness Outside Anomalous Loci
field: mathematics
tier: prose
statement: Let $A\subset(\mathbb C^*)^n$ have codimension greater than $k$, let $A'$ be a subvariety of its anomalous points, and let $L\subset\mathbb C^n$ have dimension $k$ with $\exp(L)\subset G$ and $G/\exp(L)$ of finite rank. Is $(A\setminus A')\cap G$ finite?
