title: Flat Closing and Rigidity for Intermediate-Rank Groups
field: mathematics
tier: prose
statement: For the random intermediate-rank groups $G$ acting freely and cocompactly on $\operatorname{CAT}(0)$ spaces $X$, if $X$ contains an isometric copy of $\mathbb R^2$, must $G$ contain a copy of $\mathbb Z^2$? What rigidity properties do these groups have, and are they linear or residually finite?
