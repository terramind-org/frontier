  definitions:
    - name: OeisA219023.a
      kind: def
      text: |-
        /-- $a(n)$ is the number of primes $p < n$ such that $n^2 - n + p$ and $n^2 + n - p$
        are both prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ p ∈ (Finset.range n).filter Nat.Prime,
            if Nat.Prime (n ^ 2 - n + p) ∧ Nat.Prime (n ^ 2 + n - p) then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/219023.lean#L34
