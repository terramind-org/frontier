title: Good Curve Graphs with Unbounded Mapping-Class Orbits
field: mathematics
tier: prose
statement: Given a surface $S$, does there exist a connected graph whose vertices are essential simple closed curves, on which the mapping class group acts with unbounded orbits? In terms of the source complexity $f(S)$, is the answer negative when $f(S)=1$, while both positive and negative examples occur when $f(S)\in\{2,3\}$?
