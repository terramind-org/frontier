id: um.20000015
title: The projective-dimension sign and a Cox-depth criterion
field: mathematics
tier: prose
statement: |-
  Given \(M\) an \(S\)-module, \(S=\operatorname{Cox}(X)\),

  1. can we always find another \(S\)-module \(M'\) satisfying
     - \(\widetilde M=\widetilde {M'}\),
     - \(\operatorname{pdim}(M')\geq \dim(X)\)?

     This is known to be true if \(X=\mathbb P^{n_1}\times\cdots\times\mathbb P^{n_r}\).
  2. What is the relation of this to examples of Chardin–D'Cruz where adding embedded components drops regularity?
  3. Potential mechanism by truncating \(M\) to \(M_{\geq d}\)? (This works for products of projective spaces.)
  4. Alternatively, could there be an invariant of \(\widetilde M\) which obstructs existence of such an \(M'\)?
