lean:
  module: FormalConjectures.Wikipedia.HardyLittlewood
  decl: HardyLittlewood.first_hardy_littlewood_conjecture
  statement: |-
    theorem first_hardy_littlewood_conjecture {k : ℕ} (m : Fin k.succ → ℕ) :
        FirstHardyLittlewoodConjectureFor m
  context:
    - open HardyLittlewood
    - open Asymptotics Filter
    - open scoped Nat.Prime
  definitions:
    - name: HardyLittlewood.FirstHardyLittlewoodConjectureFor
      kind: def
      text: |-
        /--
        The first Hardy–Littlewood conjecture for the tuple $(m_0, m_1, \dots, m_k)$: if $m_0 = 0$,
        the $m_i$ ($i \neq 0$) are positive even integers, and the $m_i$ are pairwise distinct, then
        $$
          \pi_P(n)\sim C_P\int_2^n\frac{dt}{\log^{k+1}t}.
        $$
        -/
        def FirstHardyLittlewoodConjectureFor {k : ℕ} (m : Fin k.succ → ℕ) : Prop :=
          m 0 = 0 → (∀ i ≠ 0, Even (m i)) → Function.Injective m →
            let C : ℝ :=
              2 ^ k * ∏' (q : { q : ℕ // q.Prime ∧ 3 ≤ q}),
                (1 - (Nat.numResidues q m : ℝ) / q) / (1 - 1 / q) ^ k.succ
            let π_P : ℕ → ℝ := fun n => (Nat.primeTupleCounting m n : ℝ)
            π_P ~[atTop] fun n => C * ∫ t in (2)..n, 1 / t.log ^ k.succ
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/HardyLittlewood.lean#L64
