title: Extensions of CMC Gluing Constructions
field: mathematics
tier: prose
statement: For constant-mean-curvature hypersurfaces built by gluing spheres and Delaunay pieces along a balanced graph, can this gluing scheme be extended to more general ambient manifolds or to hypersurfaces of infinite topology? Are the resulting hypersurfaces nondegenerate, so that nearby graph deformations produce curves in a smooth moduli space?
