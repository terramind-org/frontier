title: Eswarathasan–Levine conjectures on harmonic numerators (eswarathasan_levine_harmonic_primes_infinite)
field: mathematics
tier: proof
statement: |-
  Eswarathasan–Levine harmonic-prime conjecture (1991): infinitely many primes $p$ satisfy
  $|J_p| = 3$.
