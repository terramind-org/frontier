lean:
  module: FormalConjectures.Wikipedia.EswarathasanLevineConjecture
  decl: EswarathasanLevineConjecture.eswarathasan_levine_harmonic_primes_infinite
  statement: |-
    theorem eswarathasan_levine_harmonic_primes_infinite :
        {p : ℕ | IsHarmonicPrime p}.Infinite
  context:
    - open EswarathasanLevineConjecture
  definitions:
    - name: EswarathasanLevineConjecture.IsHarmonicPrime
      kind: def
      text: |-
        /-- A prime $p \ge 5$ is a *harmonic prime* ([OEIS A092101](https://oeis.org/A092101)) if $J_p$ has
        cardinality $3$, i.e. $J_p = \{p - 1, p^2 - p, p^2 - 1\}$. Note that $p = 3$ also satisfies
        $|J_3| = 3$ via $J_3 = \{2, 7, 22\}$, so Boyd (1994) and [OEIS A092101](https://oeis.org/A092101)
        require $5 \le p$; this single-prime convention does not affect
        `eswarathasan_levine_harmonic_primes_infinite`. -/
        def IsHarmonicPrime (p : ℕ) : Prop :=
          p.Prime ∧ 5 ≤ p ∧ (harmonicNumDivisibleSet p).ncard = 3
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/EswarathasanLevineConjecture.lean#L49
