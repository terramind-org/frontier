lean:
  module: FormalConjectures.OEIS.«217703»
  decl: OeisA217703.conjecture_1
  statement: |-
    theorem conjecture_1 (n : ℕ) (hn : 1 ≤ n) :
        Irreducible (Polynomial.map (Int.castRingHom ℚ) (polyS n))
  context:
    - open OeisA217703
  definitions:
    - name: OeisA217703.polyS
      kind: def
      text: |-
        /-- The polynomial $S_n(x)$ defined by $S_0(x) = 1$, $S_1(x) = x$, and
        $S_{n+1}(x) = (x + 2n(n+1)) S_n(x) - n^4 S_{n-1}(x)$ for $n > 0$. -/
        noncomputable def polyS : ℕ → Polynomial ℤ
          | 0 => 1
          | 1 => Polynomial.X
          | k + 2 =>
            let m : ℤ := k + 1
            (Polynomial.X + Polynomial.C (2 * m * (m + 1))) * polyS (k + 1) -
              Polynomial.C (m ^ 4) * polyS k
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/217703.lean#L62
