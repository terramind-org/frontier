title: Eigenfunction Averages Along Simple Closed Geodesics
field: mathematics
tier: prose
statement: |-
  Let $S$ be a compact hyperbolic surface with Laplace eigenfunctions $\phi_n$ and eigenvalues $\lambda_n$. Do constants $\alpha,\beta>0$ exist such that

  $$\frac{\sum_{\ell(C)\leq T}\int_C\phi_n\,ds}{\#\{C:\ell(C)\leq T\}}=O(\lambda_n^{-\alpha}T^{-\beta})$$

  when the sum ranges over simple closed geodesics $C$?
