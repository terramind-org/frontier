id: um.30000097
title: Trajectory Trichotomy for Linear Vector Fields
field: mathematics
tier: prose
statement: Let $M$ be a finite set of real linear vector fields. There is a finite set $W\subseteq(\mathbb{R}\setminus\mathbb{Q})\cup i(\mathbb{R}\setminus\{0\})$ such that, for every family $G$ of trajectories of members of $M$, some $W'\subseteq W$ makes $G$ interdefinable over the real field with at least one of $e^x$, $\mathbb{Z}$, or $(x^w)_{w\in W'}$, where $x^{a+ib}$ denotes $t\mapsto t^a(\cos(b\log t),\sin(b\log t))$ on $(0,\infty)$. Are these three alternatives a trichotomy?
