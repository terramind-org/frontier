title: A finite RBM separation from equal-parameter naive Bayes, with an SBN caveat
field: mathematics
tier: prose
statement: |-
  **Recovered question.** What kind of distributions can be represented by an RBM as opposed to directed models?

  Its `problem` field is

  The two sentences are identical.

  The AIM workshop page does verify the September 2018 workshop and links to that open-problem list.

  The phrase “directed models” is mathematically under-specified. A directed acyclic graphical model can have many architectures and conditional families. I analyze two particularly natural one-hidden-layer readings:

  1. the binary naïve Bayes model, equivalently a mixture of product distributions; and
  2. a one-hidden-layer sigmoid belief network (SBN) with independent binary hidden roots and conditionally independent visible children.

  The answers differ. An RBM can require exponentially many naïve Bayes mixture components, but an explicit witness below is also represented by a same-size SBN. Thus “undirected versus directed” alone does not determine a representational comparison.
