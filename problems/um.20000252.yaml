title: Affirmative for p at least 5 and an all-characteristic adjunction-surface reduction
field: mathematics
tier: prose
statement: |-
  **Basepoint free theorem.** Suppose that \(k=\bar k\) and
  \(\operatorname{char} k=p>0\). Let \(X/k\) be a terminal threefold, and let
  \(A\) be an ample \(\mathbb Q\)-divisor on \(X\). If \(K_X+A\) is nef, must it
  be semiample?
