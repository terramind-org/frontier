title: Open Problems and Questions about Geodesics — Question 25
field: mathematics
tier: prose
statement: |-
  \ Consider a closed surface of genus $\ge 2$.

  [Burns] *Is there a $C^\infty$ (or at least $C^k, \ k\ge 3)$ metric
  for which there exists a non-closed geodesic along which the Gaussian curvature is everywhere zero?*
