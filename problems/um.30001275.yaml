title: Cyclotomic–Anticyclotomic Iwasawa Main Conjecture
field: mathematics
tier: prose
statement: Let $E/\mathbb{Q}$ be an elliptic curve, let $p$ be a prime of good ordinary or multiplicative reduction, let $k$ be an imaginary quadratic field, and let $k_\infty$ be the compositum of the cyclotomic and anticyclotomic $\mathbb{Z}_p$-extensions of $k$, with $G=\operatorname{Gal}(k_\infty/k)$. Is the dual Selmer group $X(E/k_\infty)$ torsion over $\Lambda(G)$, and does $(L_p(f,k_\infty))=(\operatorname{char}_{\Lambda(G)}X(E/k_\infty))$ hold?
