id: um.30000801
title: Strong Quantization for Fourth-Order Navier Problems
field: mathematics
tier: prose
statement: Let $u_k>0$ solve $\Delta^2u_k=\lambda_k u_k e^{2u_k^2}$ on a bounded domain $\Omega\subset\mathbb{R}^4$, with Navier conditions $u_k=\Delta u_k=0$ on $\partial\Omega$, $\lambda_k\to0$, and $\int_\Omega|\Delta u_k|^2\,dx=\lambda_k\int_\Omega u_k^2e^{2u_k^2}\,dx\to\Lambda>0$. If $\Lambda=L\Lambda_1$ and the sequence has $I$ blow-up points, must $L=I$; equivalently, is every blow-up point simple?
