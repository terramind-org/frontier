title: Generation of Tail Algebras by Diagonal Subalgebras
field: mathematics
tier: prose
statement: "In free probability theory, let $(A, \\phi)$ be a $W^*$-probability space generated by a sequence of random variables $(x_n)_{n \\geq 1}$ with tail algebra $T_\\phi = \\bigcap_{n \\geq 1} W^*(x_k : k \\geq n)$ and exchangeable/distributional symmetry algebra $D_\\phi$. Is the tail von Neumann algebra $T_\\phi$ generated as a von Neumann algebra by $D_\\phi$?"
