title: Kourovka Notebook Problem 15.54
field: mathematics
tier: prose
statement: |-
  Suppose that $G$ is a periodic group
  containing an involution $i$ such that the centralizer $C_G(i)$ is a
  locally cyclic $2$-group. Does the set of all elements of odd order
  in $G$ that are inverted by $i$ form a subgroup?
