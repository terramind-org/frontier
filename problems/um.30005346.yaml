title: Chromatic Alternatives from Girth and Local Covers
field: mathematics
tier: prose
statement: Does a function $f:\mathbb N^2\to\mathbb N$ exist such that every finite graph $G$ with $\chi(G)\geq f(r,k)$ either has a subgraph of chromatic number at least $k$ and girth greater than $r$, or has an $r$-local cover of chromatic number at least $k$?
