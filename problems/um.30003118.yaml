title: Northcott Property for Rings of Integers in Bounded-Degree Composita
field: mathematics
tier: prose
statement: For $d>2$, let $\mathbb Q^{(d)}$ be the compositum of all extensions of $\mathbb Q$ of degree at most $d$ and let $\mathcal O_{\mathbb Q^{(d)}}$ be its ring of integers. Does $\mathcal O_{\mathbb Q^{(d)}}$ have Property (N), meaning that it contains only finitely many elements of bounded absolute Weil height?
