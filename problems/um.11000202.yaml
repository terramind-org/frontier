title: "Problem 3: — Describe the space of geodesic currents for Mg,m."
field: mathematics
tier: prose
statement: Describe the space of geodesic currents for Mg,m. Is the set of weighted sums of Dirac masses at the pairs of fixed points of pseudo-Anosov elements dense? Is there a geodesic current µ which is absolutely continuous, i.e. such that there is a Mg,m-invariant measure class µ0 on ∂C(S) with the property that for every Borel subset A of ∂C(S) we have µ0(A) = 0 if and only if µ(A×∂C(S)− ∆) = 0? Is there a distinguished absolutely continuous current such that the invariant measure class on ∂C(S) is determined by a Hausdorﬀ measure with respect to one of the distance functions δ on ∂C(S)?
