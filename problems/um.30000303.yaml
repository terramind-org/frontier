title: Poisson Gap Counts in Gapped Local Alignments
field: mathematics
tier: prose
statement: In the sequence-based model of gapped local alignment, under the asymptotic regime $s,\Delta\to\infty$ with $s e^{-\lambda\Delta}\to\beta>0$, does the number of gaps in the best local alignment converge to a Poisson distribution with finite positive mean, as it does in the heuristic Poisson model?
