id: um.30003483
title: Three-Component Tropical Approximation of Ultrametric Data
field: mathematics
tier: prose
statement: Given ultrametrics $d_i\in U_m$, choose $D^{(1)},D^{(2)},D^{(3)}\in U_m$ to minimize $$\sum_i d_{\mathrm{tr}}(d_i,d_i'),$$ where $d_i'$ is the tropical convex combination of the three $D^{(j)}$ with coefficients $\lambda_{ij}=\min(d_i-D^{(j)})$, and $$d_{\mathrm{tr}}(v,w)=\max_{k<\ell}|v_k-w_k-v_\ell+w_\ell|.$$ Characterize the minimizers and the minimum value.
