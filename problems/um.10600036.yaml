id: um.10600036
title: Virtual-knot problem 36 — electrical
field: mathematics
tier: prose
statement: |-
  In we show how, by translating between knots and
  planar graphs (the checkerboard and medial constructions) one can
  associate a signed graph to a classical knot and that, with a choice
  of nodes and an interpretation of the signs as generalized
  electrical conductance, the conductance between two nodes of the
  graph is an invariant of isotopy of the knot restricted to move in
  the complement of these nodes. The moves on the graphs involve
  replacements of pedant loops and edges, series and parallel
  replacements and a star–triangle exchange move. These moves can be
  applied to abstract (possibly non-planar) graphs. As a result we
  obtain a generalization of knot theory (similar in spirit but quite
  different from virtual knot theory) by taking the electrical
  equivalence classes of signed graphs. Call this theory $EG_{\pm}.$
  The conductance remains an invariant of these Electric–Knots
  and shows that the theory is highly non-trivial. This formulation of
  Electric Knots gives rise to many problems. Find new invariants of
  Graph-Knots. Note that if we take a planar immersion of a signed
  graph, then the induced cyclic orders of edges at the nodes of the
  planar embedding give a natural way (analogous to the medial graph)
  to associate a virtual knot diagram to the immersion. Explore this
  relationship of Electric Knots and virtual knots.
