title: Wild McKay Identity for Crepant Resolutions
field: mathematics
tier: prose
statement: Let $X$ be a quotient by a faithful linear action of a finite group $\Gamma$, and let $Y\to X$ be a crepant resolution with exceptional fiber $E$ over the origin. Is the wild McKay identity $\#E(\kappa)=M(K,\Gamma,-w)$ valid?
