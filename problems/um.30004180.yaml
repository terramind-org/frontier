title: Period Structure of Dissipative Disk Diffeomorphisms
field: mathematics
tier: prose
statement: For every dissipative diffeomorphism of the disk, does there exist $n_0$ such that every period belongs to $$\{n2^k:n\leq n_0,\ k\in\mathbb N\},$$ and, if there are infinitely many periods, must they contain $\{n2^k:k\in\mathbb N\}$ for some $n$?
