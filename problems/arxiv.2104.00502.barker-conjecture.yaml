  definitions:
    - name: Arxiv.«2104.00502».IsBarkerSequence
      kind: def
      text: |-
        /--
        A Barker sequence has $\pm 1$ entries and nontrivial autocorrelations of magnitude at most one.
        -/
        def IsBarkerSequence (a : List ℤ) : Prop :=
          (∀ x ∈ a, x = 1 ∨ x = -1) ∧
            ∀ k : ℕ, 0 < k → k < a.length → |aperiodicAutocorrelation a k| ≤ 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Arxiv/2104.00502/BarkerSequence.lean#L41
