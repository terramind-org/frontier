lean:
  module: FormalConjectures.Wikipedia.LinearArboricityConjecture
  decl: LinearArboricityConjecture.linear_arboricity_conjecture
  statement: |-
    theorem linear_arboricity_conjecture {V : Type} [Fintype V] (G : SimpleGraph V)
        [DecidableRel G.Adj] :
        linearArboricity G ≤ (G.maxDegree + 2) / 2
  context:
    - open LinearArboricityConjecture
    - "variable {V : Type*}"
  definitions:
    - name: LinearArboricityConjecture.linearArboricity
      kind: def
      text: |-
        /-- The **linear arboricity** `la(G)`: the least number of linear forests into which the edges
        of `G` can be partitioned. -/
        noncomputable def linearArboricity (G : SimpleGraph V) : ℕ :=
          sInf {k | HasLinearForestDecomposition G k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/LinearArboricityConjecture.lean#L51
