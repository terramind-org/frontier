id: lineararboricityconjecture.linear-arboricity-conjecture
title: The linear arboricity conjecture
field: mathematics
tier: proof
statement: |-
  **The linear arboricity conjecture** (Akiyama–Exoo–Harary [AEH81]).

  The edges of every graph of maximum degree `Δ` can be partitioned into at most `⌈(Δ + 1) / 2⌉`
  linear forests.
