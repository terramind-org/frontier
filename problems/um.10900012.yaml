title: 3.4 (Agol) — Injective surfaces with the 1-line property
field: mathematics
tier: prose
statement: "Does every closed hyperbolic $3$-manifold contain a closed $\\pi_1$-injective surface with the 1-line property: in the universal cover, every pair of preimages of the surface intersects in a single line, with intersection of stabilizers isomorphic to $\\mathbb{Z}$?"
