title: Q-Cartierness versus pluricanonical base change
field: mathematics
tier: prose
statement: |-
  Let \(f:X\to B\) be a family of surfaces. For a base change
  \(q:B'\to B\), with \(q_X:X'=X\times_BB'\to X\), say that
  \(\omega_{X/B}^{[m]}\) commutes with base change if the natural
  pluricanonical comparison is an isomorphism. Equivalently (using base
  change for \(\omega\) on the relative Gorenstein locus),
  \[
  (q_X^*\omega_{X/B})^{[m]}\ \cong\
  q_X^*(\omega_{X/B}^{[m]}).
  \]
  Here \(\mathcal F^{[m]}=(\mathcal F^{\otimes m})^{**}\).
  Kollár's condition asks for this for every \(m>0\) and every base
  change. Is it equivalent to \(\omega_{X/B}\) being \(\mathbb Q\)-Cartier?

  The displayed question itself says only “a family of
  surfaces,” however. This omitted hypothesis matters. It is also essential
  to distinguish:

  1. the assumption that the original base \(B\) is reduced; and
  2. the quantifier over test morphisms \(B'\to B\), where \(B'\) may be
     nonreduced.

  The answer below treats these readings separately. Throughout the
  characteristic-zero assertions, schemes are locally Noetherian and the
  families are flat and of finite type.
