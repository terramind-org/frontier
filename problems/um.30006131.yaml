title: Schneider Higher-Order Difference-Body Conjecture
field: mathematics
tier: prose
statement: Let $n\geq 3$ and $m\geq 2$. Prove that the minimizers of the normalized volume $\delta_m(K)=|D^m(K)|/|K|^m$ among convex bodies $K\subset\mathbb R^n$ are precisely the ellipsoids.
