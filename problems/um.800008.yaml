title: The Lyapin's Notebook — Problem 8
field: mathematics
tier: prose
statement: |-
  (I. Melnichuk)
  Let $c(u)$ denote the number of distinct letters occuring in the word $u$. Let $m(u)$ denote the minimal number of letters in a finite alphabet $A$ for which there exists an infinite word over $A$ that does not contain images of $u$ under substitutions. Determine the number $m(u)$ for a non-blocking word $u$ containing $c(u)$ letters. \\
  Some estimates were obtained in works [[Melnich1], [Melnich2], [McNulty], [Baker]].
