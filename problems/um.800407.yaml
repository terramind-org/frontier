title: Open Problems in Arithmetic Dynamics — Question 30
field: mathematics
tier: prose
statement: |-
  It is known that $\overline\mu_d(\mathbb{P}^N)\le d^{-(N-1)}$ for all $N\ge2$
  and all $d\ge2$; see [arxiv0908.3835, Proposition 10]
  and [MR2975153]. This leads to the obvious question.

  What is the exact value of $\overline\mu_d(\mathbb{P}^N)$?
