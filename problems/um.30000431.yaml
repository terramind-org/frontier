title: $L^2$-Invariants of Finite-Volume Locally Symmetric Spaces
field: mathematics
tier: prose
statement: For finite-volume locally symmetric spaces, do the $L^2$-Betti numbers and $L^2$-torsion come entirely from the complete interior? More generally, extend the existing calculations first to rank-one and then to higher-rank locally symmetric spaces.
