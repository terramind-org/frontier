title: Linkage and Vanishing in Kato–Milne Cohomology
field: mathematics
tier: prose
statement: Let $F$ be a field of characteristic $p$. If the Kato–Milne cohomology group $H_p^n(F)$ is linked, must $H_p^{n+2}(F)$ vanish? If $H_p^n(F)$ is triple linked, must $H_p^{n+1}(F)$ vanish?
