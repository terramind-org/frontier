title: Characteristic-Zero Lifts of Local Galois Extensions
field: mathematics
tier: prose
statement: Given an algebraically closed field $k$ of characteristic $p$ and a $G$-Galois extension $k[[z]]/k[[t]]$, does there exist a complete characteristic-zero discrete valuation ring $(R,\pi)$ with residue field $k$ and a $G$-Galois extension $R[[Z]]/R[[T]]$ reducing to $k[[z]]/k[[t]]$ modulo $\pi$?
