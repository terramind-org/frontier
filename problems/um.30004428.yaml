title: Mutable Laurent Polynomials and Toric Smoothing Components
field: mathematics
tier: prose
statement: Let $F$ be a $3$-dimensional lattice polytope and let $U_F$ be the Gorenstein toric affine $3$-fold obtained from the cone over $F$ at height $1$. Are the smoothing components of the miniversal deformation of $U_F$ in one-to-one correspondence with the $0$-mutable Laurent polynomials having Newton polytope $F$?
