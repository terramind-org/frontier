title: Problem 5.15 — (Explicit cycles).
field: mathematics
tier: prose
statement: "(Explicit cycles). Explicitly construct infinitely many linearly independent cy- cles in H∗(Ig, Q) and H∗(Kg, Q). So, we are still at the stage of trying to find explicit nonzero cycles. In a series of papers (see [Jo1] for a summary), Johnson proved the quite nontrivial result: H 1(Ig, Z)≈∧3H H ⊕B2 (16) where B2 consists of 2-torsion. While the ∧3H/H piece comes from purely algebraic consider- ations, the B2 piece is “deeper” in the sense that it is purely topological, and comes from the Rochlin invariant (see [ BC] and [ Jo1]); indeed the former appears in H1 of the “Torelli group” in the analogous theory for Out( Fn), while the latter does not. 42 B. Farb"
