title: Hodge Isometries from K3 Derived Autoequivalences
field: mathematics
tier: prose
statement: For an algebraic K3 surface $X$, determine the image of the natural homomorphism from the group of exact autoequivalences of $D^b(X)$ to the group of integral Hodge isometries of the Mukai lattice; in particular, is the orientation-reversing isometry acting as minus the identity on $H^2(X)$ in the image?
