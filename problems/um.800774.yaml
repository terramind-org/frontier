title: Positively Curved Projective Varieties — Problem 9
field: mathematics
tier: prose
statement: |-
  Let $X$ be a compact K\"ahler manifold with pseudo-effective tangent bundle.
  After we replace $X$ with an appropriate finite \'etale covering of $X$,
  we consider the Albanese map $X \to \operatorname{Alb}(X)$.

  $\bullet$ Can we prove that the anti-canonical divisor $-K_F$ is big or $F$ is projective?

  $\bullet$ Is the Albanese map $X \to \operatorname{Alb}(X)$ an MRC fibration of $X$?
