title: An integral Kirwan presentation for cotangent Grassmannians
field: mathematics
tier: prose
statement: |-
  **AIM Conjecture 6.1 (recovered).** Let a compact group \(G\) act unitarily on a finite-dimensional complex vector space \(A\), and let \(\xi\) be a regular central value for the hyperkähler moment map on \(T^*A\). Then the hyperkähler Kirwan map
  \[
  \kappa:H_G^*(T^*A)\cong H^*(BG)\longrightarrow
  H^*(T^*A////_\xi G)
  \]
  is surjective.
