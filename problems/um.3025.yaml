title: Kirby Problem 5.18
field: mathematics
tier: prose
statement: |-
  - In higher dimensions, find the `non-analytic' cohomology module $\HH^{*}_{?}$ analogous to the analytic lattice cohomology $\HH^{*}_{\mathrm{an}}$, and a natural functor $\HH^{*}_{\mathrm{an}}\to \HH^{*}_{?}$ connecting them.

  - Define a version $\ECH^{*}$ of Embedded Contact Homology for isolated complex singularity links (in any dimension) associated with the canonical contact structure of the link, together with a natural graded $\Z[U]$-module morphism $\HH^{*}_{\mathrm{an}}\to \ECH^{*}$. More precisely,

  - Show that this morphism is injective.

  - Fix the diffeomorphism type of a link, and also a contact structure on it that can be realized as the canonical contact structure associated with some singularity analytic structure. Then characterize the family $\{\HH^{*}_{\mathrm{an}}\}$, indexed by all the possible analytic germs inducing this contact link, via those graded sub-$\Z[U]$-modules of $\ECH^{*}$ which satisfy certain specific properties.
