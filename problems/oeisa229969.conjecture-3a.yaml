id: oeisa229969.conjecture-3a
title: Ways to write $n = x + y + z$ with six linear and quadratic forms prime (conjecture_3a)
field: mathematics
tier: proof
statement: |-
  Conjecture (i), part 1: Any integer $n > 6$ can be written as $x + y + z$ ($x, y, z > 0$) with
  $2x-1, 2y-1, 2z-1$ and $2xyz-1$ all prime and $x$ among $2, 3, 4$.
  - _Zhi-Wei Sun_
