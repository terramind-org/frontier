title: Kourovka Notebook Problem 15.63
field: mathematics
tier: prose
statement: |-
  a) Let $F_n$ be the free group of finite rank $n$ on the free
  generators $x_1,\ldots ,x_n$. An element $u \in F_n$ is called
  *positive* if $u$ belongs to the semigroup generated by the
  $x_i$. An element $u \in F_n$ is called *potentially
  positive* if $\alpha (u)$ is positive for some automorphism
  $\alpha$ of $F_n$.
  Is the property of an
  element to be potentially positive algorithmically recognizable?

  *Comment of 2013:*
  In (R. Goldstein, *Contemp. Math.*, Amer. Math. Soc., **421**
  (2006), 157--168) the problem was solved in the affirmative in the special case $n=2$.

  [Archived solved part(s) of 15.63:]
  b) Let $F_n$ be the free group of finite rank $n$ on the free
  generators $x_1,\ldots ,x_n$. An element $u \in F_n$ is called
  *positive* if $u$ belongs to the semigroup generated by the
  $x_i$. An element $u \in F_n$ is called *potentially
  positive* if $\alpha (u)$ is positive for some automorphism
  $\alpha$ of $F_n$. Finally, $u \in F_n$ is called *stably
  potentially positive* if it is potentially positive as an
  element of $F_m$ for some $m \geq n$. Are there stably potentially
  positive elements that are not potentially positive?
