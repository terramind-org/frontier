lean:
  module: FormalConjectures.Wikipedia.PollocksConjecture
  decl: PollocksConjecture.pollock_tetrahedral
  statement: |-
    theorem pollock_tetrahedral (N : ℕ) :
        ∃ f : Fin 5 → ℕ, N = ∑ i, tetrahedral (f i)
  context:
    - open PollocksConjecture
    - open scoped BigOperators
  definitions:
    - name: PollocksConjecture.tetrahedral
      kind: def
      text: |-
        /-- The $n$-th tetrahedral number: $T_n = \frac{n(n+1)(n+2)}{6}$. -/
        def tetrahedral (n : ℕ) : ℕ :=
          n * (n + 1) * (n + 2) / 6
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/PollocksConjecture.lean#L42
