title: Pollock's (tetrahedral numbers) conjecture (pollock_tetrahedral)
field: mathematics
tier: proof
statement: |-
  Pollock's (tetrahedral numbers) conjecture:
  every integer is the sum of at most $5$ tetrahedral numbers.
