title: Division-ample sets outside finitely many unit orbits
field: mathematics
tier: prose
statement: |-
  **Question 31 (Cornelissen).** Let \(K\) be a number field and
  \(\mathcal O_K\) its ring of integers.  A set \(A\subseteq\mathcal O_K\) is
  **division-ample** if:

  1. \(A\) is Diophantine over \(\mathcal O_K\);
  2. every \(x\in\mathcal O_K\) divides some \(a\in A\);
  3. there is a positive integer \(\ell\) such that for every \(a\in A\) there
     is \(\widetilde a\in\mathbb Z\) with \(\widetilde a\mid a\) and
     \[
        N(a)\leq |\widetilde a|^\ell.
     \]

  Give an example of such an \(A\) for which, for every finite
  \(S\subseteq\mathcal O_K\),
  \[
        A\nsubseteq \mathcal O_K^*\cdot(\mathbb Z\cup S).
  \]
