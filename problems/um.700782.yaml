title: Kourovka Notebook Problem 11.90
field: mathematics
tier: prose
statement: |-
  Let ${\mathfrak{V}}$ be a
  variety of groups and let $k$ be an infinite cardinal number.
  A group $G \in {\mathfrak{V}}$ of rank $k$ is called {\it almost free
  in
  ${\mathfrak{V}}$} if each of its subgroups of rank less than $k$ is
  contained in a subgroup of $G$ which is free in ${\mathfrak{V}}$. For
  what $k$ do there exist almost free but not free in ${\mathfrak{B}}$
  groups of rank $k$?
