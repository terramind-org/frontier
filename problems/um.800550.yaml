statement: |-
  \begin{unsolved}
  Triangle-free non-planar graphs are forbidden subgraphs of bar $k$-visibility graphs.
  Is there any other class of forbidden subgraphs of bar $k$-visibility graphs?
  \end{unsolved}

  Are there $(2k+2)$-regular bar $k$-visibility graphs for $k \geq 5$?
