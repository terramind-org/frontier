id: um.20000906
title: Centered affine-fibre density increments for almost containment in A+A
field: mathematics
tier: prose
statement: |-
  Let \(A\subset \mathbb F_2^n\) be a set of density \(\alpha\). Then there is a subspace \(V\) of codimension \(\log^{O(1)}(\varepsilon^{-1}\alpha^{-1})\) so that
  \[
  |V\cap(A+A)|\geq (1-\varepsilon)|V|.
  \]

  Although written declaratively, comparison with O'Donnell's 2012 open-problem list and Green's updated open-problem list shows that this is intended as a conjecture/problem.

  We take \(0<\alpha\leq 1\) and \(0<\varepsilon<1\). The cases \(\varepsilon\geq1\) and \(\alpha=1\) are immediate. The case \(\alpha=0\) is outside the natural formulation, since its claimed bound involves \(\alpha^{-1}\).
