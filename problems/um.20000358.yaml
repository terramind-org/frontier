title: An Albanese threshold obstruction for Hilbert schemes of points
field: mathematics
tier: prose
statement: |-
  Is $\operatorname{Hilb}^2(C\times D)(k)$ Zariski dense in $\operatorname{Hilb}^2(C\times D)$, where $C,D/k$ are hyperelliptic curves over a number field. More generally, for which varieties $X$ over a number field is there a $d$ such that $\operatorname{Hilb}^d(X)(k)$ is Zariski dense?

  Is $\operatorname{Hilb}^2(C\times D)(k)$ Zariski dense in $\operatorname{Hilb}^2(C\times D)$, where $C,D/k$ are hyperelliptic curves over a number field?
