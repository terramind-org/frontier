title: Charalambous–Reeves Standard-Matching Conjecture
field: mathematics
tier: prose
statement: Let $S=k[x_1,\ldots,x_n]$, let $\mathfrak a\subset S$ be a monomial ideal with minimal generating set $G(\mathfrak a)$, and put $A=S/\mathfrak a$. If $M$ is a standard matching on the Taylor resolution, is the multigraded Poincaré series $P_A(\mathbf x,t)$ equal to $\prod_{i=1}^n(1+tx_i)$ divided by $1+\sum_I(-1)^{\operatorname{cl}(I)}m_I t^{\operatorname{cl}(I)+|I|}$, where the sum runs over subsets $I\subseteq G(\mathfrak a)$ left unmatched by $M$, $m_I=\operatorname{lcm}(I)$, and $\operatorname{cl}(I)$ is the number of connected components under the relation generated by non-coprimality?
