id: um.30001088
title: Conformal Radius Bounds for Polynomial Siegel Disks
field: mathematics
tier: prose
statement: For every $d\geq3$, does there exist $C=C(d)$ such that every degree-$d$ polynomial $f$ with an indifferent fixed point at the origin satisfies $\log\operatorname{rad}(f)\leq-B(\theta)/(d-1)+\log(\min_i|c_i|)+C$, where $\theta$ is the rotation number, $B(\theta)$ is the Brjuno sum, the $c_i$ are the critical points, and $\operatorname{rad}(f)$ is the Siegel-disk conformal radius?
