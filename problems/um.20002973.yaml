statement: If \(w^2=1\), we have a map \(B_w\rightarrow R\). Is the induced map \(HH(B_w)\rightarrow HH(R)\) injective? Given that the Hochschild homology is defined as \(HH(\beta):=\operatorname{Ext}_{R\text{-bimod}}(R,B)\).
