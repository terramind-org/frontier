id: um.20001826
title: Scalar-free backwards pseudolocality with an explicit noncollapse dictionary
field: mathematics
tier: prose
statement: |-
  R. Bamler and Q. Zhang proved a backwards pseudolocality theorem: Assume
  \(R<1\). For \(r\in(0,1)\), if \(|Rm|<r^{-2}\) on \(B(x,t,r)\), then
  \[
  |Rm|<(\epsilon r)^{-2}
  \]
  on
  \[
  P(x,t,\epsilon r,-(\epsilon r)^2)
  =B(x,t,\epsilon r)\times[t-(\epsilon r)^2,t).
  \]
  Can we remove the \(R<1\) assumption in the backwards pseudolocality
  theorem?
