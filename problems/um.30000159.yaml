title: Global Solutions and Sharp-Interface Limits in Three Dimensions
field: mathematics
tier: prose
statement: Let $\Omega\subset\mathbb{R}^3$ and consider the phase-field system $$-\operatorname{div}_xT=b,\qquad T=D\bigl(\varepsilon(\nabla_xu)-\bar\varepsilon S\bigr),$$ $$S_t=-c\bigl(\psi_S(\varepsilon(\nabla_xu),S)-\nu\Delta_xS\bigr)|\nabla_xS|,$$ with $\nu>0$. Does the associated initial-boundary-value problem have global-in-time solutions in three dimensions, and do these solutions converge as $\nu\to0$ to solutions of the corresponding sharp-interface model?
