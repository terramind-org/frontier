title: Conjecture 10.9 — Finite type invariants distinguish integral homology 3-spheres.
field: mathematics
tier: prose
statement: Finite type invariants distinguish integral homology 3-spheres. (See Conjecture 11.2.) 10.2.3 Dimensions of spaces of finite type invariants A finite type invariant v is called primitive if v(M1#M2) = v(M1) + v(M2) for any integral homology 3-spheres M1 and M2. We denote by A(∅; R)conn the submodule of A(∅; R) spanned by Jacobi diagrams with connected trivalent graphs. As a graded vector space A(∅; Q) is isomorphic to the symmetric tensor algebra of A(∅; Q)conn.
