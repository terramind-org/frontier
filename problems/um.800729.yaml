title: Open Problems in Topological Algebra — Problem 3 (Protasov)
field: mathematics
tier: prose
statement: |-
  For a topological space $X$ let $S(X)\subset X^X$ be the semigroup
  of all continuous selfmappings of $X$ endowed with the topology of
  pointwise convergence (i.e., the topology inherited from the
  Tychonov product $X^X$). A topological space $X$ is called *homogeneous* if for any points $x_1,x_2\in X$ there is a
  homemorphism $h$ of $X$ with $h(x_1)=x_2$.

  Is the semigroup $S(X)$ left bounded for every
  zero-dimensional compact homogeneous space?
