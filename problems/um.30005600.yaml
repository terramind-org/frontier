title: Conformal Spinorial Eigenvalue Infimum on the Torus
field: mathematics
tier: prose
statement: For the trivial spin structure on the torus $T$, prove $\inf_{g\in[g_{a,b}]}\overline\mu_1(g)=2\pi/\sqrt b$ when $b>\pi$ and equals $2\sqrt\pi$ when $b\leq\pi$.
