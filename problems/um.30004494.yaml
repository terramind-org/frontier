title: Boundary-Corrected Ampleness of Extended Hodge Bundles
field: mathematics
tier: prose
statement: |-
  Let $B$ be smooth and projective, let $Z=\bigcup_iZ_i$ be a simple normal-crossing divisor, and let $\Lambda^e$ be the canonical extension of the Hodge line bundle for a period map whose logarithmic differential is injective. Do there exist integers $a_i\geq0$ and $m_0$ such that
  $$
  m\Lambda^e-\sum_i a_i[Z_i]
  $$
  is ample for every $m\geq m_0$?
