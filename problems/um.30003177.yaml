title: Exponential Multiplicity of Minimal Disks Spanning Helical Curves
field: mathematics
tier: prose
statement: Let $\Gamma_n$ be the simple closed curve in the boundary of a solid cylinder $B\times I$ consisting of two nonparallel diameters joined by two helical arcs winding approximately $n$ times. What embedded minimal disks does $\Gamma_n$ bound; in particular, does the number of such disks grow at least like $2^n$?
