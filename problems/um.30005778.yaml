title: Simplicity of Twisted Hopf Algebras
field: mathematics
tier: prose
statement: Let $G=\prod_{i=1}^n(D_i\rtimes_{\varphi_i}M_i)$, where every $D_i\rtimes_{\varphi_i}M_i$ is a Frobenius group, every $M_i$ is an abelian group of prime-power order, $M=\prod_iM_i$ has square order, and $J$ arises from a $2$-cocycle on $\widehat M$. For $n\geq3$, determine whether the twisted Hopf algebra $(KG)^J$ is simple.
