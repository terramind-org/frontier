title: Kourovka Notebook Problem 20.37
field: mathematics
tier: prose
statement: |-
  Is it true that for every finite group $G$ and every factorization $|G|=ab$ there exist subsets $A,B\subseteq G$ with $|A|=a$ and $|B|=b$ such that $G=AB$? Cf. 19.35 in Archive.

  *Comment of 2025*:
  any minimal counterexample $G$ must be a simple group without prime-index subgroups (R. R. Bildanov, V. A. Goryachenko, A. V. Vasil'ev, *Siberian Electron. Math. Rep.*, **17** (2020), 683--689;
  \ M. H. Hooshmand, *Commun. Algebra*, **49**, no. 7 (2021), 2927--2933).
