  module: FormalConjectures.OEIS.«261627»
  decl: OeisA261627.conjecture_1
  statement: "theorem conjecture_1 (n : ℕ) (hn : 6 < n) : 0 < a n"
  context:
    - open OeisA261627
  definitions:
    - name: OeisA261627.a
      kind: def
      text: |-
        /--
        The number of primes $p$ such that $n - (p n' - 1)$ and $n + (p n' - 1)$ are both prime,
        where $n' = 1$ if $n$ is odd and $n' = 2$ if $n$ is even.
        -/
        def a (n : ℕ) : ℕ :=
          let n' : ℕ := if n % 2 = 1 then 1 else 2
          ((Finset.range (n + 1)).filter (fun p =>
            p.Prime ∧
            let k := p * n' - 1
            k < n ∧ Nat.Prime (n - k) ∧ Nat.Prime (n + k))).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/OEIS/261627.lean#L36
