title: Critical one-dimensional long-range percolation geometry
field: mathematics
tier: prose
statement: In one-dimensional long-range percolation with edge probabilities proportional to $\beta|i-j|^{-2}$, study the distance exponent $\theta(\beta)$ defined by typical distances of order $n^{\theta(\beta)}$. Is $\theta$ continuous or monotone in $\beta$? Does the model have a nontrivial metric scaling limit?
