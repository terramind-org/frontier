id: um.30005971
title: Mod-p Automorphic Induction and p-Adic Regulators
field: mathematics
tier: prose
statement: Can one construct and characterize mod-$p$ automorphic induction without passing through mod-$p$ Galois representations? Can one predict the $p$-adic valuation of the relevant ratios of regulators or, when nonzero, of $\#H^i(M(\mathcal{O}_1),\mathbb{Z})/\#H^i(M(\mathcal{O}_2),\mathbb{Z})$? Can one define $p$-adic regulators whose ratios equal the corresponding rational ratios of real regulators?
