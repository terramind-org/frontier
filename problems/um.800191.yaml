title: Moments of L-functions — Moments of the Riemann zeta function — Problem 43
field: mathematics
tier: prose
statement: |-
  For a primitive cusp form $g$ of weight $k$ for the full modular group, establish an asymptotic upper bound that is uniform in the weight aspect. Such bounds are useful in moment computations for Rankin-Selberg $L$-functions associated with primitive forms of varying large weights.

  (A. Hamieh, UNBC)
