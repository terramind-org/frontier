statement: |-
  \section*{Fractional chromatic number versus ordinary Hadwiger number}\label{30007086}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every finite simple graph G, is its fractional chromatic number $chi_f(G)$ at most h(G), the largest order of a complete minor?
  \subsection{Short English statement}
  For every finite simple graph G, is its fractional chromatic number $chi_f(G)$ at most h(G), the largest order of a complete minor?
