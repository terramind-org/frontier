title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 17': h-positivity of the permanent-like generating symmetric function of a totally nonnegative matrix"
field: mathematics
tier: prose
statement: |-
  Let $A=(a_{ij})$ be a totally nonnegative $n\times n$ real matrix, and define the symmetric function
  $$F_A = \sum_{w\in S_n} a_{1,w(1)}a_{2,w(2)}\cdots a_{n,w(n)} p_{\rho(w)},$$
  where $p_{\rho(w)}$ is the power sum symmetric function indexed by the cycle type of $w$. Is $F_A$ $h$-positive (i.e., does its expansion in the basis $\{h_\lambda\}$ of complete homogeneous symmetric functions have nonnegative coefficients)?
