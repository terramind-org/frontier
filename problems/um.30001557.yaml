title: Pattern Characterization of Fractional Powers in Words
field: mathematics
tier: prose
statement: For a noninteger real $\alpha>1$, does there exist a finite or infinite set $P$ of word patterns such that a word $x$ contains an occurrence of an $\alpha$-power if and only if some factor of $x$ matches a pattern in $P$ under a nonerasing morphism?
