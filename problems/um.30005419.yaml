id: um.30005419
title: Proxy-Small Modules and Cohomological Support Varieties
field: mathematics
tier: prose
statement: Let $R$ be a Noetherian local ring. Is $R$ a complete intersection whenever every finitely generated $R$-module $M$ is proxy small, meaning that there is an object $P\in\langle M\rangle\cap\langle R\rangle$ with the same ordinary support as $M$? More generally, how small can the cohomological support variety $V_R(M)$ be, and which conical subvarieties occur as $V_R(M)$ for $M\in D^b(R)$?
