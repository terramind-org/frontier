schema: 1
id: riemannzeta.distinct-prop-lt
title: Simple zeros of the Riemann zeta function on the critical line (riemannZeta.distinct_prop_lt)
field: mathematics
tier: proof
statement: |-
  Is the proportion of distinct zeros of `ζ` unconditionally larger than the Montgomery–Taylor
  bound `(3 - c_MT⁻¹) / 2 = 0.8362…`?
ams:
  - 11
tags:
  - paper
references:
