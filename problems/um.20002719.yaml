title: An exact orthogonal-spike model for infinitesimal type-B cumulants
field: mathematics
tier: prose
statement: |-
  **Problem 5.1 (F. Goodman, P. Sniady).** Philippe Biane, Fred Goodman,
  and Alexandru Nica have defined a type B analogue of free probability
  [10]. The definition has been motivated by the combinatorics, and there is
  currently no model of this theory (as the large random matrices are a model
  for type A free probability). Find a natural model for type B free
  probability, which motivates the combinatorics. Is there a corresponding
  notion of free probability in other types?
