title: Comparison Maps in Motivic Cohomology of Central Simple Algebras
field: mathematics
tier: prose
statement: For a central simple algebra $A$, compare the motivic-cohomology maps arising from the étale Bloch–Lichtenbaum spectral sequence, generalized Severi–Brauer varieties, and $\operatorname{SL}_1(A)$. When do these three constructions yield the same map?
