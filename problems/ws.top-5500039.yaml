  % UnsolvedMath ID 5500039; source catalogue code AMR-054-0039
  \setcounter{section}{5500038}
  \section{\texorpdfstring{Distances among Point Sets in $\mathbb{R}^2$ and $\mathbb{R}^3$}{Distances among Point Sets in mathbbR\textasciicircum{}2 and mathbbR\textasciicircum{}3}}\label{5500039}
  {\small UnsolvedMath ID 5500039 · Combinatorics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For a point set $P$ in $\mathbb{R}^d$, let $f_d(P)$ be the number of unit-distance point pairs: $$f_d(P) = \left| \{ (u,v) \mid u, v \in P, \, \|u-v\| = 1 \} \right| \;;$$ and let $f_d(n)$ be the maximum over all sets of $n$ points: $$f_d(n) = \max_{|P| = n} f_d(P) \;.$$ Further, let $g_d(P)$ denote the number of distinct distances induced by a set of points $P$: $$g_d(P) = \left| \{ \|u-v\| \mid u, v \in P \} \right| \;;$$ and let $g_d(n)$ be the minimum over all sets of $n$ points: $$g_d(n) = \min_{|P|=n} g_d(P) \;.$$ Give upper and lower bounds on $f_d(n)$ and $g_d(n)$, particularly for $d=2$ and $d=3$.
  \par\smallskip\textit{Formulation references:} \sref{5500039}{1}, \sref{5500039}{2}, \sref{5500039}{3}.
