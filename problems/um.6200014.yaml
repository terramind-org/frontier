statement: Let $N$ be a closed $n$-manifold and $\Delta$ a flag, no-square triangulation, and let $C(N,\Delta)$ be the associated Davis--Vinberg complex. Is $\partial_\infty C(N,\Delta)$ a topological invariant of $N$, independent of $\Delta$?
