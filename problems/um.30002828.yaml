title: Mirror Conifold Transitions and Analytic Smoothings
field: mathematics
tier: prose
statement: "For a maximally degenerating projective conifold $Y$ with mirror $\\check Y$ and conifold-point sets $S$ and $\\check S$, are the following conditions equivalent: $Y$ has an analytic smoothing; some $\\alpha\\in H^1(Y\\setminus S,\\Omega^2)$ maps nontrivially to every summand of $H^2_S(Y,\\Omega^2)\\cong\\mathbb C^S$; an analogous class in $H^1(\\check Y\\setminus\\check S,\\Omega^1)$ maps nontrivially to every summand of $H^2_{\\check S}(\\check Y,\\Omega^1)\\cong\\mathbb C^{\\check S}$; and $\\check Y$ has a projective resolution?"
