title: Several Complex Variables Problem List — Problem 13
field: mathematics
tier: prose
statement: |-
  Suppose $M$ is a complex manifold of dimension 2, and suppose $\forall K^{compact}
  \subset M$ there exists an open subset $U$, $K \subset U \subset M$ such that
  $U$ is biholomorphic to the unit ball. Does this imply that M is equivalent to
  the unit ball $\mathbb{B}$, $\Delta \times \mathbb{C}$ or $\mathbb{C}^2$? (This is false in $\mathbb{C}^3$).\\
