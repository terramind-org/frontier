title: A full-exceptional-fiber criterion for uniform rationality under point blow-down
field: mathematics
tier: prose
statement: |-
  If \(X\) is a smooth rational variety of dimension \(n\) and \(p\in X\)
  is a point, is there a Zariski open \(U\subset X\) with \(p\in U\) such
  that \(U\) is isomorphic to a Zariski open subset of
  \(\mathbb P^n\)?
