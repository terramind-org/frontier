title: Spread Bounds for the Random Triangle-Removal Process
field: mathematics
tier: prose
statement: For the random triangle-removal process on $K_n$, run for $n^2/6-n^{1.99}$ steps with output triangle set $\mathcal{T}_n$, do there exist events $E_n$ of probability $1-o(1)$ and a constant $C$ such that $\Pr(T_1,\ldots,T_k\in\mathcal{T}_n\mid E_n)\leq(C/n)^k$ for every collection of distinct triangles?
