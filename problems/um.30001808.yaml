title: Zucker-Type Cohomology for Satake-Compactified Curve Moduli
field: mathematics
tier: prose
statement: For the moduli space $M_g$, with the Siegel metric pulled back by the Torelli map, and its Satake compactification $M_g^*$, does the analogue of Zucker's conjecture hold, namely that its $L^2$-cohomology is the middle-perversity intersection cohomology of $M_g^*$?
