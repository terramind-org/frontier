title: Weak non-bigness versus strict Nagata
field: mathematics
tier: prose
statement: |-
  **7 Problem 7**
  *(Suggested by Omid Amini)* Here is a “weak version” of Nagata’s conjecture.
  **Problem 7.1.** When Nagata predicts \(h^0=0\), show that
  \[
  dL-m_1E_1-\cdots-m_sE_s
  \]
  is not big by using “convex methods.”
  **Remark 7.2.** This might actually imply the strong form of Nagata’s conjecture.
