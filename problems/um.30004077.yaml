title: Coordinate Realization of Characteristic-Polyhedron Multiplicity
field: mathematics
tier: prose
statement: |-
  Let $R$ be an excellent regular local ring with regular parameters $(u,y)$, and let $f\in R\setminus\langle u\rangle$. Write $m=m(f)$ and let $\operatorname{in}_0(f)\in k[Y_1,\ldots,Y_r]$ be its degree-$m$ initial form. Assume there is no proper $k$-subspace $T\subset k[Y_1,\ldots,Y_r]_1$ with $\operatorname{in}_0(f)\in k[T]$. If $\widehat y_j=y_j+\varphi_j$, with $\varphi_j\in\langle u\rangle\widehat R$, and $f\in\langle\widehat y\rangle^m$, do elements $z_1,\ldots,z_r\in R$ exist such that $(u,z)$ is a regular system of parameters,

  $$\langle z\rangle\widehat R=\langle\widehat y\rangle,$$

  and $f\in\langle z\rangle^m$?
