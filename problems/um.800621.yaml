title: Selection Principles in Mathematics — Problem 50 ([ShTb768])
field: mathematics
tier: prose
statement: |-
  Finally, consider the following Ramsey-theoretic cardinal:
  For a subset $Y$ of $\mathbb{N}$ and $g\in\mathbb{N}$, we say that
  $g$ *avoids middles* in $Y$ if:

  - for each $f\in Y$, $g\not\le^* f$;

  - for all $f,h\in Y$ at least one of the sets
  $\{n : f(n)<g(n)\le h(n)\}$ and $\{n : h(n)<g(n)\le f(n)\}$ is finite.

  $\operatorname{add}(\mathfrak{X},\mathfrak{D})$ is the minimal cardinality $\kappa$ of a dominating
  $Y\subseteq\mathbb{N}$ such that for each partition of $Y$ into $\kappa$ many
  pieces, there is a piece such that no $g$ avoids middles in that piece.
  This cardinal is studied in [ShTb768].

  Is $\operatorname{cov}(\mathcal{M})\le\operatorname{add}(\mathfrak{X},\mathfrak{D})$?
