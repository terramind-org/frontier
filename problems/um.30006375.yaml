title: Fractal-Time Local Smoothing Between Lebesgue Spaces
field: mathematics
tier: prose
statement: Let $1<p\leq q<\infty$, and let $p'=p/(p-1)$ be the Hölder conjugate of $p$. If $q>p'$, does $\left(\sum_{t\in E_j}\lVert e^{it\sqrt{-\Delta}}P_jf\rVert_{L^q(\mathbb{R}^d)}^q\right)^{1/q}\leq C2^{js}\lVert f\rVert_{L^p(\mathbb{R}^d)}$ hold whenever $s>\frac{d+1}{2}(\frac1p-\frac1q)+\frac1q\nu_E^{\#}(\frac{q(d-1)}2(1-\frac1p-\frac1q))$?
