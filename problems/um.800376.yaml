title: Coxeter Groups and Unimodality — Conjecture 14
field: mathematics
tier: prose
statement: |-
  Many matrices arising in combinatorics
  are known to be TP (see, e.g., [BreMem], [BreCombTP], and
  [BreTPComb]). It is therefore surprising that for a fundamental and
  old combinatorial matrix such as the one consisting of the Eulerian numbers this property has not yet been settled.
  For $n \in \mathbb{P}$ and $k \in \mathbb{N}$ let $A(n,k)$ be the corresponding
  *Eulerian number* (so, $A(n,k)$ is the number of permutations in $S_n$ that
  have $k$ descents). The following conjecture was first put forward in [BreCombTP, Conj. 6.10].

  The matrix
  \[
  A:=( A(n+1,k))_{n,k \in \mathbb{N}}
  \]
  is totally positive.
