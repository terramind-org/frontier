title: A generic clique-block basis of individual LLT polynomials
field: mathematics
tier: prose
statement: "**(9)** The Schur basis of $\\Lambda$ is contained in the spanning set consisting of all LLT polynomials. Are there other interesting bases that have some simple relation to LLT polynomials? Lam remarked that all Hall-Littlewood polynomials are LLT polynomials, as are all skew Schur functions. Morse remarked that not every $k$-Schur function is an LLT polynomial, for example $s^{(3)}_{(2,1,1)}$. Modified Macdonald polynomials and, conjecturally, $\\nabla(e_n)$ can be expressed as weighted sums of LLT polynomials indexed by tuples of ribbons and tuples of shifted columns, respectively."
