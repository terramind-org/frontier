title: Witt-slope congruences, global F-regularity, and Fano cone obstructions
field: mathematics
tier: prose
statement: |-
  Let \(X/\mathbb F_q\) be a normal, projective, geometrically connected
  variety. Which local or global singularity/positivity hypotheses force
  \(\#X(\mathbb F_{q^r})\equiv1\pmod{q^r}\), a rational point, or a quantitative
  error bound, and what fails without those hypotheses?
