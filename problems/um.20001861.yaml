title: Effective moduli symmetry and the obstruction from gauge fixing
field: mathematics
tier: prose
statement: |-
  **12. (Whiteley) Conjecture:** Given a symmetric bar-joint framework \((G,p)\),
  the configuration space of \((G,p)\) (with appropriate parts of the frame of
  reference fixed), has the symmetry of the most symmetric individual realization
  in the configuration space.
