id: um.20002394
title: A coherent-stretching diagnostic for exponential material-line growth
field: mathematics
tier: prose
statement: |-
  Exponential growth of the length of Lagrangian flow map for 2D Euler.

  Find a solution \(u\) of 2D Euler with
  \[
  \sup_t \|u\|_{C^1(\mathbb T^2)}<\infty,
  \]
  and a curve, \(l\), of finite length such that the length of \(\Phi_t(l)\) grows exponentially in time. Here, \(\Phi_t\) is the Lagrangian flow map of \(u\).

  **Recovered working statement.** Find a global classical solution of two-dimensional incompressible Euler on \(\mathbb T^2\), a regular embedded \(C^1\) curve \(\gamma:[0,L_0]\to\mathbb T^2\), and constants \(c,\lambda>0\) such that
  \[
   \sup_{t\geq0}\|u(t)\|_{C^1}<\infty,
   \qquad
   \mathcal L(t):=\operatorname{Length}(\Phi_t\circ\gamma)
   \geq c e^{\lambda t}\quad(t\geq0).
  \]
  Length means material arclength, with the initial parametrization carried by the flow. It does **not** mean an operator norm of \(\Phi_t\). Because \(\Phi_t\) is a diffeomorphism, an initially embedded curve stays embedded.
