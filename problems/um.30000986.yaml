title: Fake Degrees and Class Numbers of Unitriangular Groups
field: mathematics
tier: prose
statement: Let $P$ be a finite $p$-group with a generalized Cayley map onto a Lie algebra, let $\mathcal O$ be its coadjoint orbits, and let $\operatorname{Irr}(P)$ be its irreducible characters. When does $\{\chi\in\operatorname{Irr}(P):\chi(1)=p^k\}=\{O\in\mathcal O:|O|=p^{2k}\}$? A related question asks whether there is $t\in\mathbb Z[T]$ such that $h_{U_n(q)}=t(q)$.
