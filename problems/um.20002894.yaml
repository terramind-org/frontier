title: Transversality criteria and a classified quadratic counterexample family
field: mathematics
tier: prose
statement: |-
  **Problem 12 (Peter Ebenfelt).** Let
  \(0\in M\subset\mathbb C^{n+1}\) and
  \(0\in M'\subset\mathbb C^{N+1}\), where \(M,M'\) are \(C^\infty\) or
  real-analytic hypersurfaces and \(n\le N\). Let
  \(H:(\mathbb C^{n+1},0)\to(\mathbb C^{N+1},0)\) be holomorphic, with
  \(H(M)\subset M'\), and suppose that \(H\) does not map a full neighborhood of
  zero into \(M'\). Give conditions on \(M,M'\) ensuring that every such \(H\) is
  transversal to \(M'\) at zero. Here transversality at \(p\) means
  \[
  d_pH(T_p\mathbb C^{n+1})+T_{H(p)}M'=T_{H(p)}\mathbb C^{N+1}.
  \]
