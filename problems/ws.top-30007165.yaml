statement: |-
  \section*{Pointwise convergence of all consecutive-power multiple averages under mixing}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every invertible mixing transformation T preserving a probability measure, every integer $m>=2$ and bounded measurable $f_1,...,f_m$, do $(1/N)sum_{n=1}^N$ $product_{j=1}^m$ $f_j(T^{jn}x)$ converge for almost every x to $product_j$ integral $f_j$?
  \subsection{Short English statement}
  For every invertible mixing transformation T preserving a probability measure, every integer $m>=2$ and bounded measurable $f_1,...,f_m$, do $(1/N)sum_{n=1}^N$ $product_{j=1}^m$ $f_j(T^{jn}x)$ converge for almost every x to $product_j$ integral $f_j$?
