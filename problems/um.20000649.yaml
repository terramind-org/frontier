title: Intrinsic level and the prime-power breakthrough
field: mathematics
tier: prose
statement: |-
  **Subconvexity bound for \(\mathrm{GL}_3\times\mathrm{GL}_2\) in level aspect.** Let \(\pi\) be a fixed Hecke--Maass cusp form for \(SL_3(\mathbb Z)\) and \(f\) be a holomorphic for Hecke Maass cusp form for \(\Gamma_0(M)\). Obtain a subconvexity bound estimate for \(L(1/2,\pi\times f)\) as \(M\) grows.

  \(f\) is a holomorphic or Hecke--Maass cusp form for \(\Gamma_0(M)\).
