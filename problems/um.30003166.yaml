title: Weil–Arakelov and Weil–Étale Cohomology for Arithmetic Schemes
field: mathematics
tier: prose
statement: "For every arithmetic scheme $X$, meaning a separated scheme of finite type over $\\mathbb Z$, do there exist compactly supported complexes $R\\Gamma_{W,c}(X,\\mathbb Z(n))$ and $R\\Gamma_{\\mathrm{ar},c}(X,A(n))$ with the following properties: $R\\Gamma_{W,c}(X,\\mathbb Z(n))$ is a perfect complex of abelian groups; $R\\Gamma_{\\mathrm{ar},c}(X,\\mathbb R(n))$ is a perfect complex of real vector spaces; and cup product with the fundamental class $\\theta\\in H^1(\\operatorname{Spec}\\mathbb Z,\\mathbb R(0))$ makes the cohomology of the latter complex acyclic?"
