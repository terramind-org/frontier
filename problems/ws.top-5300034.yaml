  \item[\hypertarget{source:5300034:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 5300034 (AMR-052-0034). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:5300034:2}{S2}] John Milnor, ``Problems on local connectivity'', in Ben Bielefeld and Mikhail Lyubich (eds.), Problems in Holomorphic Dynamics (1992), Problem 9, pp. 22; arXiv:math/9205209v1. \url{https://arxiv.org/pdf/math/9205209}.
  \end{description}
