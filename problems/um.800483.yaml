title: Billiards and Quantitative Symplectic Geometry — Serge Tabachnikov — Problem 5
field: mathematics
tier: prose
statement: |-
  **Planar characteristic curves..** Let $M$ be (a germ of) a smooth hypersurface in the standard symplectic space.

  Problem: *how restrictive is the condition that the characteristic curves on $M$ are planar?*

  If $M$ is closed and convex, the situation is rigid: $M$ is an affine symplectic image of a round ball; see [KS].
