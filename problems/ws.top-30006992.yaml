statement: |-
  \section*{A dimension-free quadratic bound for the canonical Foulkes–Howe map}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For all integers $a\geq 2$ and $b\geq a(a-1)$, and all finite-dimensional complex V, is the canonical multiplication-and-averaging map $Sym^{b}(Sym^{a}V)\to Sym^{a}(Sym^{b}V)$ surjective?
  \subsection{Short English statement}
  For all integers $a\geq 2$ and $b\geq a(a-1)$, and all finite-dimensional complex V, is the canonical multiplication-and-averaging map $Sym^{b}(Sym^{a}V)\to Sym^{a}(Sym^{b}V)$ surjective?
