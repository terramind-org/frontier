title: Identical maximal iterated Galois images with incompatible p-adic Julia sets
field: mathematics
tier: prose
statement: |-
  **Reconstructing the Julia set of a function from the iterated Galois group**

  Let $k$ be a finite field extension of $\mathbb{Q}_p$, $f \in k(z)$ of degree at least $2$, and $t$ be a transcendental number. Define
  \[
  k_\infty=k\left(\bigcup_{n\geq0}f^{-n}(t)\right),\qquad
  L=k_\infty\cap\overline{k},
  \]
  \[
  G_\infty=\operatorname{Gal}(k_\infty/k(t)),\qquad
  G_\infty^{\mathrm{geom}}=\operatorname{Gal}(k_\infty/L(t)).
  \]

  Can we reconstruct the $p$-adic Julia set of $f$ from $G_\infty$ or $G_\infty^{\mathrm{geom}}$?
