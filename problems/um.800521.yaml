title: Linear Systems and Eigenvalue Problems — Problem 30
field: mathematics
tier: prose
statement: |-
  It is known that there exists $I$ such that $\|Q(I,:)^{-1}\|_2 \le \sqrt{k(n-k+1)}$ [hong1992rank] and there is a fairly efficient $O(nk^2)$ algorithm that satisfies this bound [Osinsky2025close].

  Does the QRCP algorithm typically used in practice satisfy the above, or a similar, bound.
