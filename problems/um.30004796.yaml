title: The Refined Formal-Degree Conjecture
field: mathematics
tier: prose
statement: "Refined formal-degree conjecture: if the split center $A_G$ is trivial, then $(-1)^{r(G)}\\deg(\\pi,\\mu_G)=\\pm\\frac{\\dim\\rho}{|S_\\phi|}\\frac{\\gamma(0,\\operatorname{Ad}_G\\circ\\phi)}{\\gamma(0,\\operatorname{Ad}_G\\circ\\phi_{\\operatorname{prin}})}$, with sign given by the quotient of the corresponding root numbers."
