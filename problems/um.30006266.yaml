title: Information outside the Thin Affine Grassmannian
field: mathematics
tier: prose
statement: What representation-theoretic or geometric information is carried by the components of the fixed-point affine Grassmannian $\operatorname{Gr}^{\varpi}$ lying outside its thin part? Also determine how equivariant and Iwahori–Whittaker Smith–Treumann localization are related and compare the Leslie–Lonergan and Riche–Williamson constructions.
