title: Research Problems in Function Theory — Problem 5.45
field: mathematics
tier: prose
statement: If $A$ is any analytic subset of the Riemann sphere it was shown by Kierst that $A$ is (exactly) the set of asymptotic values of a function meromorphic in $\mathbb{D}$. If $\infty\in A$, Kierst also proved that $A$ is the set of asymptotic values of a function $f$ analytic in $\mathbb{D}$. However, there exist analytic sets which are not the set of asymptotic values of a function analytic in $\mathbb{D}$. Ryan has characterised those subsets of the Riemann sphere which are the set of asymptotic values of a function analytic in $\mathbb{D}$. Can one find a simpler characterisation? (K. F. Barth)
