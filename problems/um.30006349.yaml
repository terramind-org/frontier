id: um.30006349
title: Simple Invariant Distinguishing Two Class-Two Exponent-$p$ Groups
field: mathematics
tier: prose
statement: Let $p$ be an odd prime and let $\omega$ generate $\mathbb{F}_p^\times$. Among groups of exponent $p$ and nilpotency class two, define $G_1=\langle a,b,c,d,e\mid[c,b]=[d,b]=[e,c]=[e,d]=1,\ [d,c]=[b,a],\ [e,b]=[c,a],\ [e,a]=[d,a]^\omega\rangle$ and $G_2=\langle a,b,c,d,e\mid[d,a]=[e,a]=[c,b]=[d,b]=[e,c]=1,\ [d,c]=[b,a],\ [e,b]=[c,a]\rangle$. Find an invariant simpler than automorphism-group order that proves $G_1$ and $G_2$ are nonisomorphic.
