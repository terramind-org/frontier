title: Splitting Projective Modules with Vanishing Top Chern Class
field: mathematics
tier: prose
statement: Let $X=\operatorname{Spec}A$ be a smooth affine variety of dimension $n\geq2$ over a field, and let $P$ be a projective $A$-module of rank $n$. If its top Chern class $c_n(P)\in CH_0(X)$ vanishes, must $P$ split off a free rank-one summand?
