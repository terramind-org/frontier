  \section{Kirby Problem 4.46}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Is every group good in the sense of four-dimensional topological surgery? Goodness is the group-theoretic condition that permits the disk-embedding theorem with that fundamental group: algebraically suitable immersed disks in a topological four-manifold can be replaced by embedded disks with the required boundaries and dual spheres. The question quantifies over all groups, rather than only groups of a given growth type.
  \par\smallskip\textit{Formulation references:} \sref{statement}{1}, \sref{statement}{2}.
  \subsection{Short English statement}
