title: Kontsevich–Zagier Equivalence of Real Period Integrals
field: mathematics
tier: prose
statement: |-
  Let $X_1,X_2\subset\mathbb R^n$ be semialgebraic sets and let $f_1,f_2$ be semialgebraic functions for which the integrals converge. If
  $$\int_{X_1}f_1=\int_{X_2}f_2,$$
  can one pass from one integral to the other using additivity, semialgebraic changes of variables, and Stokes' formula?
