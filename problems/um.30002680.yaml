statement: For the Gaussian kernel $k(x,y)=\exp\bigl(-\lVert x-y\rVert^2/(2\sigma^2)\bigr)$, prove an asymptotic-in-$m$ approximation result, with explicit dependence on $m,X,Z$, of the form $K(X,X)\approx K(X,Z)K(Z,Z)^{-1}K(Z,X)$.
