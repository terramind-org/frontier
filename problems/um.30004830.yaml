title: Classification of Finite-Growth Pre-Nichols Algebras
field: mathematics
tier: prose
statement: Let $G$ be a finitely generated group and let $V\in{}^{\mathbb{C}G}_{\mathbb{C}G}\mathcal{YD}$ satisfy $\operatorname{GKdim}(\mathcal{B}(V)\#\mathbb{C}G)<\infty$. Classify the pre-Nichols algebras $R$ of $V$ for which $\operatorname{GKdim}(R\#\mathbb{C}G)<\infty$. In addition, if $\mathcal{O}$ is a finite conjugacy class of type C, prove that $\operatorname{GKdim}\mathcal{B}(V)=\infty$ whenever $\operatorname{supp}V=\mathcal{O}$.
