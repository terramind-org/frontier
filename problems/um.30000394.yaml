title: Ore-Type Conditions for Graph Packing
field: mathematics
tier: prose
statement: For an $n$-vertex graph $G$, let $\sigma_2(G)=\max_{uv\in E(G)}(\deg_G(u)+\deg_G(v))/2$. If $G_1,G_2$ are $n$-vertex graphs and $(\sigma_2(G_1)+1)(\Delta(G_2)+1)\leq n+1$, must $G_1$ and $G_2$ pack?
