title: Paramodular Conjecture for Abelian Varieties
field: mathematics
tier: prose
statement: Let $N$ be odd and squarefree, and let $K$ be a totally real field of degree $d$ with ring of integers $\mathcal O$. Is there a bijection between Hecke newforms $f$ in the weight-two, degree-two paramodular space for $K(N)$ whose eigenvalues generate $K$, and isogeny classes of simple abelian varieties $A/\mathbb Q$ of dimension $2d$ and conductor $N^d$ with endomorphisms by $\mathcal O$, such that the product of the spinor $L$-functions of the Galois conjugates of $f$ equals the Hasse–Weil $L$-function of $A$?
