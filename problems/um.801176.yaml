title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 2: GLBT and nonnegativity for the toric h-vector of convex polytopes and Gorenstein* lattices"
field: mathematics
tier: prose
statement: Let $\mathcal{P}$ be an arbitrary convex polytope (not necessarily rational or simplicial), or more generally a Gorenstein* poset that is a lattice with bottom element $\hat{0}$ and top element $\hat{1}$ removed. Does the toric $h$-vector (generalized $h$-vector) $h(\mathcal{P})=(h_0,h_1,\dots,h_d)$ of $\mathcal{P}$ satisfy the Generalized Lower Bound Theorem $h_0\le h_1\le \cdots \le h_{\lfloor d/2\rfloor}$, or at least $h_i\ge 0$ for all $i$?
