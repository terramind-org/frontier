title: Weihrauch Reductions for Paths Through Ill-Founded Trees
field: mathematics
tier: prose
statement: Let $\mathrm{CNN}$ denote the task of computing a path through an ill-founded subtree of $\mathbb N^{\mathbb N}$. Is $\mathrm{CNN}$ uniformly Weihrauch-reducible to $\Sigma^0_1\text{-RT}$ or to $\mathrm{wFindHS}\text{-}\Pi^0_1$?
