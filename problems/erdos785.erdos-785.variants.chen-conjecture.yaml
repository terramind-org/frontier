lean:
  module: FormalConjectures.ErdosProblems.«785»
  decl: Erdos785.erdos_785.variants.chen_conjecture
  statement: |-
    theorem erdos_785.variants.chen_conjecture :
        ∀ A B : Set ℕ, A.Infinite → B.Infinite → 0 ∉ A → 0 ∉ B → IsAdditiveComplement A B →
          limsup (fun x : ℕ => ((counting A x * counting B x : ℝ) / (x : ℝ) : EReal)) atTop
              < ((3 / 2 : ℝ) : EReal) →
            Tendsto (fun x : ℕ => (counting A x * counting B x : ℝ) - (x : ℝ)) atTop atTop
  context:
    - open Erdos785
    - open Erdos785.erdos_785
    - open Erdos785.erdos_785.variants
    - open Filter Pointwise
    - open scoped Topology
  definitions:
    - name: Erdos785.counting
      kind: def
      text: |-
        /-- The counting function $A(x)=\lvert A\cap [1,x]\rvert$. -/
        noncomputable def counting (A : Set ℕ) (x : ℕ) : ℕ :=
          (A ∩ Set.Icc 1 x).ncard
