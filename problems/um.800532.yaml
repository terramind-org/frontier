title: Visibility Graphs of Points, Segments and Polygons — Problem 1
field: mathematics
tier: prose
statement: |-
  We have stated earlier how to compute the visibility graph $G$ from a given set of
  points $P$. Consider the opposite problem of determining if there is a set of points $P$
  whose visibility graph is the given graph $G$. This problem is called the visibility graph
  *recognition* problem. Identifying the set of properties satisfied by all visibility
  graphs is called the visibility graph *characterization* problem. The problem of
  actually drawing one such set of points $P$ whose visibility graph is the given graph $G$,
  is called the visibility graph *reconstruction* problem.

  Given a graph $G$ in adjacency matrix form, determine whether $G$ is the visibility graph of a set
  of points $P$ in the plane.
