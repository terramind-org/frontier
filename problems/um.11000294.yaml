title: Question 5.2 — Are Morita’s original cycles non-trivial in homology?
field: mathematics
tier: prose
statement: Are Morita’s original cycles non-trivial in homology? Are the generalizations due to Morita and to Conant and Vogtmann non-trivial in homology? No other classes have been found to date in the homology of Out( Fn), leading naturally to the question of whether these give all of the rational homology.
