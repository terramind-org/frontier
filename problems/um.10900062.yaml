title: 8.8 (Taylor) — Hyperbolic knots not arising from complicated bands
field: mathematics
tier: prose
statement: A band joining the components of a two-component link $L\subset S^3$ is called complicated if either its core cannot be isotoped to meet a splitting sphere in fewer than three points when $L$ is split, or its core cannot be isotoped disjoint from any minimal-genus Seifert surface for $L$. Give an example of a hyperbolic knot that cannot be created by attaching a complicated band to a two-component link.
