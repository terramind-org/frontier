      kind: def
      text: "def least_fifteen_circle_packing_in_circle.answer : ℝ≥0 := sorry"
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/SquarePacking.lean#L218
