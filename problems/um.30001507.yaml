title: Noncoherence of Higher-Rank Semisimple Lattices
field: mathematics
tier: prose
statement: Let $G$ be a connected semisimple real Lie group that is not locally isomorphic to $\operatorname{SL}_2(\mathbb R)$ or $\operatorname{SL}_2(\mathbb C)$, and let $\Gamma<G$ be a lattice. Is every infinite-index subgroup of $\Gamma$ of infinite covolume?
