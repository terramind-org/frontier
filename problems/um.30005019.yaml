title: Relations among Adjoint Curves from Cyclic Point Orders
field: mathematics
tier: prose
statement: Given $n$ points in $\mathbb P^2$, each cyclic ordering up to reversal defines an $n$-gon and hence an adjoint curve. How are the adjoint curves arising from the $(n-1)!/2$ orderings related?
