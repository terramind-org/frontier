title: Characteristic Classes of Hodge–Tate Local Systems
field: mathematics
tier: prose
statement: |-
  Let $X$ be a smooth algebraic variety over a finite extension $K/\mathbb Q_p$, and let $L$ be a Hodge–Tate local system on $X$. Is

  $$\alpha_X(\ell_i(L))=(i-1)!\sum_{m\in\mathbb Z}m\,\operatorname{ch}_{i-1}(\operatorname{gr}_mD_{\mathrm{HT}}(L))?$$

  This asks for the expected Hodge–Tate characteristic-class identity.
