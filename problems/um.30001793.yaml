id: um.30001793
title: Profinite Closure Obstructions in Free Groups
field: mathematics
tier: prose
statement: For a finitely generated free group $F$, do there exist $g_1,\ldots,g_k\in F$ such that $\overline{[g_1]^F\cdots[g_k]^F}\not\subseteq N(g_1,\ldots,g_k)$, where the bar denotes closure in the profinite topology, $[g]^F$ is the conjugacy class of $g$, and $N(g_1,\ldots,g_k)$ is their normal closure?
