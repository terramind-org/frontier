title: Optimal-Dimensional Spines for Teichmüller and Arithmetic Spaces
field: mathematics
tier: prose
statement: Construct a spine of Teichmüller space $\mathcal T_g$ of dimension $4g-5$. More generally, if a nonuniform arithmetic subgroup $\Gamma<G$ acts on the symmetric space $X$, construct a $\Gamma$-equivariant spine of dimension $\operatorname{vcd}(\Gamma)=\dim X-\operatorname{rank}_{\mathbb Q}(\Gamma)$.
