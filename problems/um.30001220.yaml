title: Cellular Models for Unequal Parameter Hecke Algebras
field: mathematics
tier: prose
statement: For the type-$B$ Hecke algebra with unequal parameters $Q$ and $q$ and a positive irrational weight parameter $\xi$, does Kazhdan–Lusztig theory provide the conjectured cellular datum indexed by bipartitions and standard bitableaux, yielding Specht modules whose specialized simple quotients realize all of Ariki's parametrizations and whose decomposition numbers are given by the canonical-basis transition matrix?
