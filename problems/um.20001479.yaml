title: Padding and catalogue bounds for universal nuclear and exact C*-algebras
field: mathematics
tier: prose
statement: |-
  Is there a universal nuclear C*-algebra of character density $\aleph_1$?
  More generally, for which cardinals $\kappa$ is there a universal
  nuclear C*-algebra of character density $\kappa$? Similar question can be asked for exact algebras.
