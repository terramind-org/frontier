title: Kourovka Notebook Problem 17.95
field: mathematics
tier: prose
statement: |-
  Let $G$ be a permutation group on the finite
  set $\Omega$. A partition $\rho$ of $\Omega$
  is said to be
  $G$-*regular* if there exists
  a subset $S$ of $\Omega$ such that $S^g$ is a
  transversal
  of $\rho$ for all $g \in G$. The group $G$ is said to be *synchronizing* if $|\Omega| > 2$
  and there are no non-trivial proper $G$-regular partitions on $\Omega$.

  a) Are the following affine-type primitive
  groups synchronizing:

  $2^{p}.\mathrm{PSL}(2,2p+1)$ where
  both $p$ and $2p + 1$ are prime,
  $p \equiv 3\;(\mathrm{mod}\;4)$ and $p > 23$?

  $2^{101}.He$?

  b) For which finite simple groups $S$
  are the groups $S \times S$ acting
  on $S$ by $(g,h): x \mapsto g^{-1}xh$
  non-synchronizing?
