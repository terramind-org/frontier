  \section{Negami’s Finite Planar-Cover Conjecture}\label{statement}


  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Unless a section says otherwise, $\N=\{1,2,\ldots\}$,
  $\Z$ is the ring of integers, $\Q,\R,\C$ are the rational, real, and complex
  fields, $[N]=\{1,\ldots,\lfloor N\rfloor\}$, and $\log$ is the natural
  logarithm. For real functions of a parameter tending to infinity,
  $f\ll g$ and $f=O(g)$ mean $|f|\leq Cg$ eventually for some fixed $C$;
  $f\gg g$ reverses this comparison; $f=o(g)$ means $f/g\to0$;
  $f\sim g$ means $f/g\to1$; and $f\asymp g$ means both order bounds.
  A subscript on $O$ or $\ll$ specifies allowed constant dependence.
  The expression $n^{o(1)}$ in an upper bound means growth smaller than
  $n^\epsilon$ for each fixed $\epsilon>0$. Local definitions govern any
  exception, finite-field convention, or use of the same symbol for another
  object. An asymptotic claim is not automatically an effective algorithm.



  A finite graph cover is a surjection $p:V(\widetilde G)\to V(G)$ that sends the neighbours of each $v\in\widetilde G$ bijectively onto the neighbours of $p(v)$. For a finite connected graph $G$, the hypothesis is that some finite covering graph $\widetilde G$ is planar. The conclusion is a crossing-free embedding of $G$ in the real projective plane. \sref{statement}{1} \sref{statement}{2}

  \paragraph{Statement recorded in the supplied source.}
  Does every graph with a planar cover have a projective-plane embedding? \sref{statement}{1}

  \paragraph{Scope and interpretation.}

  Finiteness and local bijectivity are essential parts of the planar-cover formulation recorded in the archive’s source review; an arbitrary graph homomorphism or infinite universal cover is not a substitute. \sref{statement}{1}

  \paragraph{Residual task reported by the archive.}

  The embedded review (2026-08-17) records: Rule out every finite planar cover of K\_{1,2,2,2}, or construct one and thereby refute the conjecture. \sref{statement}{1}

  \subsection{Short English statement}

  Does admitting a finite planar covering graph force a connected graph to embed in the projective plane?

