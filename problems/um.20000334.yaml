id: um.20000334
title: Nonnested span ranks and corrected jet-span estimates for Hilbert weights
field: mathematics
tier: prose
statement: |-
  **Problem 3.3 (Morrison).** For a variety \(X\) and ample line bundle \(L\), can we work harder on the combinatorics of the monomial subspaces of \(H^0(X,L^m)\) to get easier estimates for the weights \(r_{\lambda,X}\) of the Hilbert point of \(X\) with respect to the filtration given by some one-parameter subgroup \(\lambda\)? For example:

  1. Find more flexible filtrations of \(H^0(X,L^m)\) with stages of the type occurring in geometric estimates (e.g. cusps are not semistable) and compute the leading term of the resulting estimates for \(r_{\lambda,X}\).
  2. Find methods for producing estimates for \(r_{\lambda,X}\) which use estimates for non-nested collections of subspaces of \(H^0(X,L)\).
