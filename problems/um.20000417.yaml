title: A Catalan correspondence criterion for middle Tate tensors
field: mathematics
tier: prose
statement: |-
  **6. (J. Getz)** Take a product of modular curves \(X=\prod_i X_i\). Many smaller products embed diagonally into \(X\). How much of the middle cohomology can be accounted for by these constructions?

  **Comments.** 1) Ribet considered the product of two modular curves \(X=X_1\times X_2\); here \(NS(X)\) is just the quotient of \(\operatorname{Hom}(J(X_1),J(X_2))\) by the pullbacks of divisors on the two factors. He shows it is necessary to consider twisting correspondences, in addition to the Hecke correspondences, to complete the Tate classes. Are there similarly interesting, yet explicit, correspondences for \(X\) when we consider higher dimensional factors \(X_i\)? (J. Getz, D. Ramakrishnan, D. Ulmer)

  2) For a product of four Shimura curves, there are interesting Tate classes, which are also Hodge classes, which we don't know how to represent by cycles. (D. Ramakrishnan)
