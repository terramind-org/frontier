id: um.20001814
title: A product obstruction to coarse higher-dimensional modularity
field: mathematics
tier: prose
statement: |-
  Modularity conjecture

  Amongst the real 4d complete hyperkahler manifolds (gravitational instantons) all the known examples of type ALG and ALH are modular, for example the ALG examples are all moduli spaces of meromorphic Higgs bundles (although this has not been proved yet---the examples match precisely).

  Prove that this holds in higher dimensions, i.e. define classes of complete hyperkahler manifolds (for example by their asymptotics), higherdiemsnional analogues of ALG and ALH, and show that all examples are modular (spaces of solutions of Hitchin's equations, or the Bogomolnyi equations or other reduction of the ASDYM equations)
