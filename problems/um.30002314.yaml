title: Li–Szegedy Smooth-Retract Conjecture
field: mathematics
tier: prose
statement: Let $T$ be an induced subtree of a bipartite graph $H$. If $H$ retracts onto $T$, meaning that there is a graph homomorphism $H\to T$ whose restriction to $T$ is the identity, then $T$ is smooth in $H$ in the sense of Li and Szegedy.
