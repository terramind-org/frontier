title: Kourovka Notebook Problem 20.29
field: mathematics
tier: prose
statement: |-
  Let $S$ be a non-abelian finite simple group. Is it true that for any $n\in \mathbb{N}$, if the set of class sizes of a centreless finite group $G$ is the same as the set of class sizes of the direct power $S^n$, then $G\simeq S^n$?

  This is proved for $S=Alt_5^2$ in (*J. Algebra Appl.*, **21**, no. 11 (2022), Article ID 2250226, 8 p.).
