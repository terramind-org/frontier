lean:
  module: FormalConjectures.ErdosProblems.«211»
  decl: Erdos211.erdos_211.variants.one_sixth
  statement: |-
    theorem erdos_211.variants.one_sixth :
      ∀ ε : ℝ, 0 < ε → ∃ N : ℕ, ∀ (n k : ℕ), N ≤ n → 1 ≤ k → k < n →
        ∀ s : Finset ℝ², s.card = n →
          (∀ L : AffineSubspace ℝ ℝ², IsLine L → (s.filter fun p => p ∈ L).card ≤ n - k) →
          (1 - ε) / 6 * (k : ℝ) * (n : ℝ) ≤ ((determinedLines s).card : ℝ)
  context:
    - open Erdos211
    - open Erdos211.erdos_211
    - open Erdos211.erdos_211.variants
    - open EuclideanGeometry Filter
    - open scoped Classical
  definitions:
    - name: Erdos211.determinedLines
      kind: def
      text: |-
        /-- Distinct lines containing two distinct points of the configuration. -/
        noncomputable def determinedLines (s : Finset ℝ²) : Finset (AffineSubspace ℝ ℝ²) :=
          s.offDiag.image fun p => line[ℝ, p.1, p.2]
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/211.lean#L43
