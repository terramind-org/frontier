title: An obstruction to double-covering FI and a framed spin-FI supercategory
field: mathematics
tier: prose
statement: |-
  **FI like categories.** Modify $\mathrm{FI}$ to use double cover of symmetric groups.

  The exact AIM record, from the workshop *Representation stability*, section "Representation theory," problem 3.4, is:

  We therefore distinguish three plausible readings.

  1. Construct a category over FI whose automorphism group at $[n]$ is a Schur double cover
     \(1\to\{1,z\}\to\widehat S_n\to S_n\to1\), and whose every Hom-set is a two-sheeted lift of the corresponding FI Hom-set.
  2. Construct a linear category whose endomorphism algebras are the genuine spin quotients
     \(k[\widehat S_n]/(z+1)\), so its modules are sequences of genuine spin representations.
  3. Use the Sergeev/Hecke--Clifford superalgebras, which are super-Morita equivalent to spin symmetric-group algebras, and formulate stability in the super setting.

  The first reading is the most literal but is impossible. The obstruction is already visible on the map from the empty set. We prove it below. We then give a coherent correction for readings (2)--(3): retain an ordered frame of the complement of an injection, lift those framed morphisms to compatible Schur covers, and pass to the genuine superlinear sector. The correction has explicit composition, stabilizers, free modules, and a classification of its modules as compatible sequences.
