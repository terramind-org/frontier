title: Kourovka Notebook Problem 15.84
field: mathematics
tier: prose
statement: |-
  Yu. I. Merzlyakov (*Sov. Math. Dokl.*, **19**
  (1978), 64--68) proved that
  if the complex numbers $\alpha ,\beta ,\gamma $ are each at
  least 3 in absolute value,
  then the matrices
  {\small $\left(
  \begin{array}{cc}1&\alpha \\0&1\end{array}\right)$}, \
  {\small $\left(
  \begin{array}{cc}1&0 \\\beta&1\end{array}\right)$}, \ and \
  {\small $\left(
  \begin{array}{cc}1-\gamma &-\gamma \\\gamma &1+\gamma \end{array}\right)$}
  generate a free group of rank three. Are there rational numbers
  $\alpha ,\beta , \gamma $, each less than 3 in absolute value,
  with the same property?
