lean:
  module: FormalConjectures.ErdosProblems.«272»
  decl: Erdos272.erdos_272
  statement: |-
    theorem erdos_272 :
        ∀ N ≥ 1, maxArithInterCard N = erdos_272.answer N
  context:
    - open Erdos272
    - open Filter Asymptotics Finset
  definitions:
    - name: Erdos272.maxArithInterCard
      kind: def
      text: |-
        /-- For each $N > 0$, let $t$ be the largest size of an arithmetic
        intersection set. -/
        noncomputable def maxArithInterCard (N : ℕ) : ℕ :=
          sSup {#A | (A : _) (_ : IsArithInterSet N A)}
