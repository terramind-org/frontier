title: Lattice Packing Conjecture for Origin-Symmetric Convex Bodies
field: mathematics
tier: prose
statement: Prove that there is a universal constant $c>0$ such that every origin-symmetric convex body $K\subset\mathbb{R}^n$ with $\operatorname{Vol}_n(K)=cn^2$ admits a covolume-one lattice $L\subset\mathbb{R}^n$ satisfying $L\cap K=\{0\}$.
