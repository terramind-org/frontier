title: Equiangular Lines and Few-Angle Spherical Codes
field: mathematics
tier: prose
statement: For $r\geq2$, is the maximum number $N_{1/(2r-1)}(n)$ of equiangular lines in $\mathbb{R}^n$ equal to $r(n-1)/(r-1)+O(1)$ as $n\to\infty$? For fixed $\alpha$, does every spherical code whose inner products belong to $\{x:-1\leq x<0\}\cup\{\alpha\}$ have size $O(n^2)$?
