statement: For the random quadratic system $T_\lambda(x)=\lambda x(1-x)$ with i.i.d. parameters $\lambda_i\in[1,4]$ distributed by an absolutely continuous probability measure $P$, does the system have random decay of correlations, equivalently, is it relatively exact?
