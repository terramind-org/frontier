title: Enumeration of Matchings — Problem 15
field: mathematics
tier: prose
statement: |-
  One case that has not yet been settled
  is the case that arises from a rather symmetric
  dissection of the plane into
  equilateral triangles, squares, and regular hexagons,
  with 4 polygons meeting at each vertex.
  Empirically, one finds that
  the number of diform tilings is
  $2^{n(n+1)}$.

  Prove that for the Aztec-type regions in the dissection
  of the plane into triangles, squares, and hexagons, the number of tilings
  of the region of order $n$ is $2^{n(n+1)}$.

  (See {\tt http://www-math.mit.edu/$\sim$propp/dragon.ps}
  for a picture of one of these tilings.)
