title: Uniform heat convergence, spectral tails, and affiliated innerness
field: mathematics
tier: prose
statement: Let \(\partial:M\to L^2(M)\bar\otimes L^2(M^o)\) be a closable derivation, let \(\Delta=\partial^*\partial\), and put \(S_t=\exp(-t\Delta)\). If \(S_t\) converges uniformly to the identity in \(\|\cdot\|_2\) on the unit ball, is the derivation inner when considered with values in the algebra of unbounded operators affiliated to \(M\bar\otimes M^o\)?
