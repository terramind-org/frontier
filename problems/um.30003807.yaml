title: Positivity of Hermitian Forms on Symmetric Tensor Powers
field: mathematics
tier: prose
statement: |-
  Let $W$ be a Hermitian operator on the $k$th symmetric power of $\mathbb C^d$, and define

  $$p_W(y)=\langle y^{\otimes k},Wy^{\otimes k}\rangle.$$

  Characterize when $p_W(y)\geq0$ for every $y\in\mathbb C^d$.
