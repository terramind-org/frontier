title: The Corona Problem for Plane-Domain Function Algebras
field: mathematics
tier: prose
statement: Let $\Omega\subseteq\mathbb C$ be a domain such that $A=H^\infty(\Omega)$ contains a nonconstant function. If $f_1,\ldots,f_N\in A$ satisfy $\sum_{j=1}^N|f_j(z)|\geq\delta>0$ on $\Omega$, must there exist $g_1,\ldots,g_N\in A$ such that $\sum_{j=1}^Ng_jf_j=1$?
