title: Finite-level geometric refinement of Li–Zhang local modularity
field: mathematics
tier: prose
statement: In recent proof of Kudla-Rapoport conjectures by Li--Zhang, numerical local modularity results for local Kudla--Rapoport divisors have been discovered and proved. Is it possible to formulate local modularity geometrically e.g. using moduli of p-adic Shtukas? Could the method of Feng-Yun-Zhang for global modularity be adapted to prove geometric local modularity?
