title: Efficient Simulation of Metastable Transitions
field: mathematics
tier: prose
statement: Let $X_t\in\mathbb{R}^{3N}$ follow the overdamped Langevin dynamics $dX_t=-\nabla V(X_t)\,dt+\sqrt{2\beta^{-1}}\,dW_t$, whose invariant density is proportional to $e^{-\beta V}$. How can one efficiently generate equilibrium trajectories that leave one well of the metastable potential $V$ and reach another, and how should the available rare-event methods be classified and improved?
