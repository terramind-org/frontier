title: Restriction of Unramified GL Representations to Iwahori Blocks
field: mathematics
tier: prose
statement: For an unramified generic representation $\pi$ of $\operatorname{GL}_{n+1}(F)$, determine and model its restriction to the Iwahori block of $\operatorname{GL}_n(F)$, including whether the isomorphism class is independent of $\pi$ and how products of Steinberg representations behave.
