title: Cohomology Bounds for Irreducible Finite-Group Modules
field: mathematics
tier: prose
statement: Let $G$ be finite, $k$ a field, and $M$ an absolutely irreducible $kG$-module. For every $j>0$, is there $C_j$ such that $\dim H^j(G,M)\leq C_j(\dim M)^{j-1}$?
