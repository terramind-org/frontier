id: um.30002812
title: Finite Fourier Feedback for Driftless-System Stabilization
field: mathematics
tier: prose
statement: For a driftless control-affine system $\dot x=\sum_{j=1}^{m}u_jf_j(x)$ on $D\subset\mathbb R^n$ satisfying $\operatorname{Lie}_{x=0}\{f_j:1\leq j\leq m\}=\mathbb R^n$, can one construct a finite trigonometric time-varying feedback $u_j=\sum_{k=-N}^{N}v_{kj}(x)e^{i\omega kt}$ whose closed-loop trivial solution is asymptotically stable, with piecewise-smooth coefficients $v_{kj}(x)=v_{-k,j}(x)\to0$ as $x\to0$?
