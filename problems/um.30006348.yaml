title: Fixed-Point-Free Representations of Alternating Groups
field: mathematics
tier: prose
statement: Let $p$ and $r$ be primes. Does the alternating group $A_p$ admit a faithful irreducible representation over a field of characteristic $r>0$ in which every element of order $p$ and every element of order $p-2$ acts without nonzero fixed vectors?
