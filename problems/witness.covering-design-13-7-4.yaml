schema: 1
id: witness.covering-design-13-7-4
title: Covering design C(13,7,4) with fewer than 30 blocks
field: mathematics
tier: witness
statement: A (v,k,t) covering design is a family of k-element subsets (blocks) of {1, ..., v} such that every t-element subset lies in at least one block. For (13,7,4), the smallest known family has 30 blocks covering all 715 four-element subsets of a 13-point set, and the repository lower bound is 28. Find a covering with 29 or fewer blocks.
