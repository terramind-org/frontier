id: um.20001038
title: The repeated-label reduction and its sharp threshold
field: mathematics
tier: prose
statement: |-
  For a digraph \(H\), take \(G=H\),
  \(k=\lceil n/\delta_H^+\rceil\), and
  \(E_1=\cdots=E_k=E(H)\). We must get a rainbow cycle because the sum of
  the outdegrees at each vertex is at least \(n\). This corresponds to a
  directed cycle of length at most
  \(\lceil n/\delta_H^+\rceil\) in \(H\), as desired.

  Here \(H\) is a finite simple oriented graph on \(n\) vertices and
  \(\delta_H^+\geq 1\).

  For completeness, the preceding rainbow conjecture gives every arc \(e\) a
  label list \(S_e\subseteq [k]\), equivalently
  \(E_i=\{e:i\in S_e\}\), and says that either:

  1. there is a directed cycle whose arcs can be assigned pairwise distinct
     admissible labels; or
  2. some vertex \(v\) can reach at least
     \(\sum_i d^+_{G_i}(v)\) vertices by rainbow paths.

  The source's deduction requires “reachable” in the second alternative to mean
  reachable by a positive-length rainbow path (or, equivalently for this
  argument, to exclude \(v\) itself when no rainbow cycle exists). Section 8
  records what changes under the convention that the trivial path counts.
