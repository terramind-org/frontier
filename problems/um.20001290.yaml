title: The planar resolution and a one-dimensional obstruction
field: mathematics
tier: prose
statement: |-
  Let \(K\subset\mathbb R^d\) (\(d\) fixed dimension) be a convex body. Let \(x_1,\ldots,x_n\) be uniformly random points from \(K\), and let
  \[
  X:=\operatorname{vol}(\operatorname{conv}(x_1,\ldots,x_n)).
  \]
  Does \(X\) satisfy the central limit theorem?
