title: Open Problems in Arithmetic Dynamics — Question 28
field: mathematics
tier: prose
statement: |-
  Let $X$ be a smooth projective variety of dimension $N$, and let
  $f:X\dashrightarrow X$ be a dominant rational map. Is it true
  that the higher order dynamical degrees $\delta_f^{(i)}$ are algebraic
  integers for all $1\le i\le N$\mathrm{?}
