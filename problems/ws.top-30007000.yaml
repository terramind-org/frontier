statement: |-
  \section*{Finite central dimension of algebraic finitely generated division rings}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If a division ring D is generated as an algebra by finitely many elements over its center F and every element of D is algebraic over F, must [D:F] be finite?
  \subsection{Short English statement}
  If a division ring D is generated as an algebra by finitely many elements over its center F and every element of D is algebraic over F, must [D:F] be finite?
