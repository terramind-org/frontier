statement: Conjecture Area Extremality and Rigidity of Symmetric and Einstein Spaces. All Riemannin manifolds with positive and parallel Ricci tensor, in particular all Symmetric and all Einstein SpacesX are area extremal and those of them which contain no local ﬂatfactors are area rigid. For Einstein spaces, this agrees with local extremality lemma in [39], while an essential class of examples where the available proofs do not work are compact Lie groupsX with biinvarinat metricsg, where the tangent bundles are trivial and can not force non-vanishing of indices of natural Dirac operators over theseX.
