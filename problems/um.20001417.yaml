title: Scalar no-loss homogenization rate transfer and a multidimensional area obstruction
field: mathematics
tier: prose
statement: |-
  \[
   \dot x_\varepsilon=a(x_\varepsilon,y_\varepsilon)
         +\varepsilon^{-1}b(x_\varepsilon)v(y_\varepsilon),
   \qquad
   \dot y_\varepsilon=\varepsilon^{-2}g(y_\varepsilon),
   \qquad
   \int v(y)\,d\mu(y)=0. \]

  It then asks, assuming decay of multiple correlations at a specified rate for
  the invariant measure \(\mu\), whether one can show

  \[
   x_\varepsilon\longrightarrow_w X,
   \qquad dX=a(X)\,dt+b(X)*d\omega . \]

  Here \(\longrightarrow_w\) is weak convergence; this repair is also corroborated
  by later papers treating exactly this fast--slow scaling. Three mathematical ambiguities
  remain in the printed question:

  1. the topology of weak convergence is not stated;
  2. the covariance of \(\omega\) and the meaning of the star integral are not
     stated;
  3. because the original drift is \(a(x,y)\), the limiting \(a(x)\) must mean
     the \(\mu\)-average unless \(a\) is independent of \(y\).

  The natural topology below is the uniform topology on \(C([0,T])\).
