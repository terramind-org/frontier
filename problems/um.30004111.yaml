title: Geck's Unitriangularity Conjecture
field: mathematics
tier: prose
statement: Let $G$ be a finite reductive group and let $\ell$ be a very good prime. Can the unipotent decomposition matrix be ordered by unipotent classes so that it is block lower triangular, with identity diagonal blocks indexed by the relevant families of unipotent characters?
