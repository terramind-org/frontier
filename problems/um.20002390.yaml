title: A viscosity-uniform drift-shear family
field: mathematics
tier: prose
statement: Consider the 2D stationary Navier-Stokes equations on \(\mathbb{T}^2\) with forcing \(f\) and viscosity \(\nu>0\). Find a fixed (\(\nu\)-independent) \(f\) such that \(\sup\|u^\nu\|_{L^2}<\infty\). This is a problem suggested by Peter Constantin.
