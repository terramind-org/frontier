statement: Using the Bott vanishing theorem, Morita showed that the MMM classes $\kappa_i$ for surface bundles vanish in $H^*(\mathrm{Diff}(\Sigma_g);\mathbb{R})$ for $i>2$. Do they also vanish in bounded cohomology $H^*_b(\mathrm{Diff}(\Sigma_g); \mathbb{R})$?
