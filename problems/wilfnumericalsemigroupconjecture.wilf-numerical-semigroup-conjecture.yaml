title: Wilf's Conjecture on Numerical Semigroups
field: mathematics
tier: proof
statement: |-
  **Wilf's Conjecture** [Wi78]: Every numerical semigroup $S \le \mathbb{N}$ obeys
  $c(S) \le e(S) \cdot n(S)$.
