id: um.10000082
title: Sharp vacant-set transition on uniformly transient transitive graphs
field: mathematics
tier: prose
statement: Let $(G_n)$ be finite transitive graphs with $|G_n|\to\infty$ and uniformly bounded effective resistances between all vertex pairs. Prove that the largest vacant component left by simple random walk drops from order $|G_n|$ to $o(|G_n|)$ before time $C|G_n|$, for a fixed $C$, in a transition window of width $o(|G_n|)$.
