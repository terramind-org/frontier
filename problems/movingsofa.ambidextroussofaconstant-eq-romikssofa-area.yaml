  outcome: proved
  summary: formal-conjectures links a formal proof that Romik's ambidextrous sofa is the optimal one. The docstring itself only restates Romik's own proposal of this sofa as the solution (Romik, Experimental Mathematics 27.3 (2018), §1.2/§5), which Wikipedia also records as the conjectured optimum; no independent proof argument is given in the note.
