lean:
  module: FormalConjectures.Wikipedia.MovingSofa
  decl: MovingSofa.ambidextrousSofaConstant_eq_romiksSofa_area
  statement: |-
    theorem ambidextrousSofaConstant_eq_romiksSofa_area :
        ambidextrousSofaConstant = ENNReal.ofReal RomiksSofa.area
  context:
    - open MovingSofa
    - open Topology
    - open scoped Real unitInterval EuclideanGeometry
    - open MeasureTheory
    - open scoped ENNReal
  definitions:
    - name: MovingSofa.ambidextrousSofaConstant
      kind: def
      text: |-
        /-- The **ambidextrous sofa constant** is the maximal area of an ambidextrous sofa. -/
        def ambidextrousSofaConstant : ℝ≥0∞ :=
          ⨆ (s : Set ℝ²) (_ : IsAmbidextrousSofa s), volume s
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/MovingSofa.lean#L335
    - name: MovingSofa.RomiksSofa.area
      kind: def
      text: |-
        /--
        The area of Romik's ambidextrous sofa is $X + \arctan Y ≈ 1.644955218425440$ [Ro18, eq. (5)].
        The shape itself, bounded by 18 arcs of circles and sextic curves [Ro18, §5–6], is not defined here.
        -/
        def area : ℝ := X + Real.arctan Y
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/Wikipedia/MovingSofa.lean#L383
