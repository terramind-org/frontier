title: Universal Integral Relations for Closed Polygons
field: mathematics
tier: prose
statement: Let $\mathcal C_n$ be the space of closed $n$-gons, with monodromy integrals $I_j,J_j$, and define $w(j)=3j-k$ when $n=2k$ and $w(j)=3j-k+1$ when $n=2k+1$. Besides $\sum_j I_j=\sum_j J_j=3$, $\sum_j w(j)I_j=\sum_j w(j)J_j=0$, and $\sum_j w(j)^2(I_j-J_j)=0$, are there any universal relations among the $I_j,J_j$ on $\mathcal C_n$? For an inscribed polygon, is $I_j=J_j$ for every $j$? Is the induced Poisson map on twisted $n$-gons in $\mathbb{RP}^1$ completely integrable?
