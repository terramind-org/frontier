title: Normed motivic spectra and incomplete Galois-window norms
field: mathematics
tier: prose
statement: |-
  In (Blumberg--Hill 2015, MR3406512), Blumberg and Hill define \(N_{\infty}\)-operads, equivariant generalizations of \(E_{\infty}\)-operads.

  What is the motivic analogue of an \(N_{\infty}\)-operad or in other words, what are the analogues of \(G\)-commutative ring spectra in motivic homotopy theory?
