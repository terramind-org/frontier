title: Warped-Cone Quasi-Isometries and Commensuration of Actions
field: mathematics
tier: prose
statement: Let $\Gamma\curvearrowright M$ and $\Lambda\curvearrowright N$ be finitely presented, free, minimal, isometric actions on closed manifolds, with neither group commensurable to a group having a nontrivial free abelian factor and with $\Gamma$ having Property FSL. If there are uniform quasi-isometries $M_{t_n}\to N_{s_n}$ for $t_n,s_n\to\infty$, must the two actions admit a commensuration?
