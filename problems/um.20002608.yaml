title: "Random biased transpositions: two-class cutoff, parity repair, and heterogeneous product reductions"
field: mathematics
tier: prose
statement: |-
  **Random biased transpositions.** The random uniform transposition walk on $S_n$ is the discrete time Markov chain that at each time step applies a transposition $(i,j)$ uniformly at random.

  The random nearly-uniform (biased) transposition walk is the corresponding chain that at each time step applies a transposition $(i,j)$ with probability $p_{ij}$ for $p_{ij}$ comparable to the uniform rate up to uniformly bounded constants.

  Does the random nearly-uniform transposition walk on $S_n$ exhibit cutoff?

  What about in the simpler case where $p_{ij}=p_i p_j$ for each $1\le i,j\le n$?
