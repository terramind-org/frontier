statement: |-
  \section*{Bounded additive gap for the bin-packing configuration LP}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Is there one absolute additive constant bounding $OPT-LP$ for every rational bin-packing instance, even when every item exceeds 1/6 and the configuration LP treats individual item copies as separate objects?
  \subsection{Short English statement}
  Is there one absolute additive constant bounding $OPT-LP$ for every rational bin-packing instance, even when every item exceeds 1/6 and the configuration LP treats individual item copies as separate objects?
