title: The Converse Unitary Distinction Criterion
field: mathematics
tier: prose
statement: Let $\pi$ be a Langlands quotient of characters of $\mathbb C^\times$. If $\pi$ is $U_{p,q}$-distinguished, then it is invariant under complex conjugation and the number of conjugation orbits of size two is at most $\min(p,q)$. Is the converse true for all such $\pi$, not only generic ones?
