title: Genus Finiteness for Algebraic Groups
field: mathematics
tier: prose
statement: Let $G$ be an absolutely almost simple simply connected algebraic group over a field $K$. When is the genus $\operatorname{gen}_K(G)$, consisting of the $K$-isomorphism classes of $K$-forms having the same maximal $K$-tori as $G$, finite? In particular, is it finite when $K$ is finitely generated and has good characteristic?
