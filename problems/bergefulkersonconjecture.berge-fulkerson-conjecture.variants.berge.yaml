lean:
  module: FormalConjectures.Wikipedia.BergeFulkersonConjecture
  decl: BergeFulkersonConjecture.berge_fulkerson_conjecture.variants.berge
  statement: |-
    theorem berge_fulkerson_conjecture.variants.berge :
        ∀ {V : Type} [Fintype V] [DecidableEq V] (G : SimpleGraph V) [DecidableRel G.Adj],
          IsCubic G → G.IsBridgeless →
          ∃ M : Fin 5 → G.Subgraph, (∀ i, (M i).IsPerfectMatching) ∧
            ∀ e ∈ G.edgeSet, ∃ i, e ∈ (M i).edgeSet
  context:
    - open BergeFulkersonConjecture
    - open BergeFulkersonConjecture.berge_fulkerson_conjecture
    - open BergeFulkersonConjecture.berge_fulkerson_conjecture.variants
    - open SimpleGraph Finset
    - "variable {V : Type*} [Fintype V] [DecidableEq V]"
  definitions:
    - name: BergeFulkersonConjecture.IsCubic
      kind: def
      text: |-
        /-- A graph is **cubic** if every vertex has degree `3`. -/
        def IsCubic (G : SimpleGraph V) [DecidableRel G.Adj] : Prop :=
          ∀ v, G.degree v = 3
