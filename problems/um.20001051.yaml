title: Palette transversals and a rooted Hall obstruction
field: mathematics
tier: prose
statement: |-
  Conjecture 6.1, if ∑ti=1 δ+ Gi(v) ≥ |V| for all vertices v, there is a
  rainbow cycle in G.

  Conjecture 6.9. Under the hypotheses of Conjecture 6.1, if
  \(\sum_{i=1}^{t}\delta^+_{G_i}(v)\geq |V|\) for all vertices \(v\), there
  is a rainbow cycle in \(G\).

  **Conjecture 6.9 (recovered).** If \(n=|V|\) and
  \[
     \lambda(v):=\sum_{i=1}^{k}d^+_{G_i}(v)
                =\sum_{e\in E_G^+(v)}|S_e|
                \geq n
     \qquad\text{for every }v\in V,
     \tag{2}
  \]
  then \(G\) has a rainbow directed cycle.
