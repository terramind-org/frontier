title: Canonical Triple-Product $p$-Adic $L$-Values and Rational Points
field: mathematics
tier: prose
statement: Is there a canonical multiple $L_p^{\mathrm{can}}(f,g,h)$ of $L_p(f,g,h)$ whose value at $(2,1,1)$ equals the formal-group logarithm of a rational point $P_\rho\in E(\overline{\mathbb Q})_\rho$, with $P_\rho$ nontrivial if and only if $L(E,\rho,s)$ has a simple zero at $s=1$?
