title: Frobenius-stable lifting and a sharp curve threshold
field: mathematics
tier: prose
statement: "**Recovered working question.** Let \\(X\\) be projective in characteristic \\(p>0\\), let \\(Z\\subseteq X\\) be a divisor, fiber, or \\(F\\)-pure center, and let \\(L\\) be positive relative to an adjoint divisor.  Which trace-stable sections on \\(Z\\) lift to \\(X\\)?  Under what additional hypotheses is the stable subspace all of \\(H^0(Z,L|_Z)\\)?  What is the exact ordinary-cohomology obstruction when one twists by a test ideal?"
