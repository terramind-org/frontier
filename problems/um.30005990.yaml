title: Boundary Frequency Gap for Optimal Partitions
field: mathematics
tier: prose
statement: For a boundary free-interface point in a spectral optimal-partition problem in dimension $d>2$, determine the exact frequency gap $\delta_d$ above frequency $2$. Prove or disprove that $\delta_d=5/2$, attained by three domains forming a collinear triple junction of $3/2$-points that meets the boundary orthogonally.
