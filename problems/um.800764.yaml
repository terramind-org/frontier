title: Open Problems in the Theory of Ample Fields — Conjecture 7 (Podewski)
field: mathematics
tier: prose
statement: |-
  An infinite field $K$ is called **minimal** if every subset $A\subseteq K$ which is definable
  by a first-order formula in the language of rings is finite or cofinite.
  For example, algebraically closed fields have this property,
  and an old conjecture of Podewski says that they should be the only ones:

  Every minimal field is algebraically closed.
