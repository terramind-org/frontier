lean:
  module: FormalConjectures.OEIS.«1157»
  decl: OeisA1157.conjecture
  statement: |-
    theorem conjecture :
      ∀ k : ℕ, 2 ≤ k →
        ∀ n₁ n₂ : ℕ, 0 < n₁ → 0 < n₂ → n₁ ≠ n₂ →
          Int.fract (↑((sigma k) n₁) / (↑n₁ ^ k : ℚ)) ≠
            Int.fract (↑((sigma k) n₂) / (↑n₂ ^ k : ℚ))
  context:
    - open OeisA1157
    - open Nat Finset ArithmeticFunction
  definitions: []
