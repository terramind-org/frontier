title: Prismatic Cohomology from Topological Cyclic Homology
field: mathematics
tier: prose
statement: |-
  Let $R$ be an $S_n$-algebra. Do the groups
  $$
  \operatorname{Ext}_{TP_0(R/S_n^{\otimes2})}^j\bigl(TP_0(R/S_n),TP_i(R/S_n)\bigr)
  $$
  identify with the prismatic cohomology of $R$, and is the spectral sequence
  $$
  \operatorname{Ext}_{TP_0(R/S_n^{\otimes2})}^j\bigl(TP_0(R/S_n),TP_i(R/S_n)\bigr)\Longrightarrow TP_{i-j}(R)
  $$
  the Bhatt–Morrow–Scholze spectral sequence?
