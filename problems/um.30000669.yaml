title: Cyclicity of Surface Quotients by Connected Groups
field: mathematics
tier: prose
statement: Suppose a connected reductive algebraic group $G$ acts algebraically on $\mathbb{C}^n$ and its two-dimensional categorical quotient is isomorphic to $\mathbb{C}^2/\Gamma$ for a finite group $\Gamma$ acting algebraically on $\mathbb{C}^2$. If $G$ is connected, then $\Gamma$ should be cyclic.
