title: Moments of L-functions — Moments of the Riemann zeta function — Problem 28
field: mathematics
tier: prose
statement: |-
  Let $S(t)=\frac{1}{\pi} \arg \zeta(\tfrac{1}{2}+it)$. Carneiro, Chandee, and Milinovich [CCM] proved that the Riemann hypothesis
  implies
  \[
  |S(t)| \le (C_0+o(1)) \cdot \frac{ \log t}{\log \log t}
  \]
  with $C_0 =\frac{1}{4}$. Reduce the value of $C_0$. \\
  (Nathan Ng, Lethbridge)
