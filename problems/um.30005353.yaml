title: Homotopical versus Homological Cycle-Filling Complexity
field: mathematics
tier: prose
statement: Over finite connected graphs, is the ratio between the minimum total cycle length needed to attach $2$-cells that kill the fundamental group and the minimum total cycle length needed to kill first homology over $\mathbb F_2$ unbounded? Does this remain true for bounded-degree graphs?
