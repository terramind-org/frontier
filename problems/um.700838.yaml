title: Kourovka Notebook Problem 12.19
field: mathematics
tier: prose
statement: |-
  Is it true that, for every $n \geq 2$ and every
  two epimorphisms $\varphi$ and $\psi$ of a free group $F_{2n}$ of
  rank $2n$ onto $F_n \times F_n$, there exists an automorphism
  $\alpha$ of $F_{2n}$ such that $\alpha \varphi =\psi $?
