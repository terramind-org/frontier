  \section{Median Actions and Residual Finiteness for Hyperbolic Groups with Sphere Boundary}\label{30006610}
  {\small UnsolvedMath ID 30006610 · Group Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $G$ be a hyperbolic group with boundary homeomorphic to $S^2$. Can one prove that $G$ admits an action with unbounded orbits on a median space, equivalently that $G$ does not have Kazhdan's property $(T)$? More generally, is every medianized hyperbolic group cubulable, or can one at least prove that it is residually finite?
  \par\smallskip\textit{Formulation references:} \sref{30006610}{1}, \sref{30006610}{2}.
