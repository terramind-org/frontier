title: Foliations and Diffeomorphism Groups — Question 29
field: mathematics
tier: prose
statement: |-
  In a recent work with Fournier and Monod [fournier2024bounded], we showed that in fact $\text{Homeo}_0(\mathbb{R}^n)$ is bounded acyclic for all $n$. Therefore, in particular, the Euler class for actions on $\mathbb{R}^{2n}$ is unbounded. But we do not know if the analog of Hirsch--Thurston still holds in these cases.

  Suppose $G$ is an amenable group acting on $\mathbb{R}^{2n}$ such that the action is at least $C^1$. Does the Euler class of such action vanish?
