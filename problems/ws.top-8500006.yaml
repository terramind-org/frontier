  % UnsolvedMath ID 8500006; source catalogue code AMR-084-0006
  \setcounter{section}{8500005}
  \section{Triples having property D(n) for several parameters}\label{8500006}
  {\small\sffamily UnsolvedMath ID 8500006 · Graph Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For $n\in\mathbb Z$, a $D(n)$-$m$-tuple is a set $A=\{a_1,\ldots,a_m\}\subset\mathbb N$ of distinct positive integers such that $a_i a_j+n$ is the square of an integer for every $i<j$.
  \paragraph{Statement recorded in the supplied source.}
  Are there infinitely many distinct $D(1)$-triples $A$ for which there exist three pairwise distinct integers $n_1,n_2,n_3\ne1$ such that $A$ is simultaneously a $D(n_j)$-triple for $j=1,2,3$? \sref{8500006}{2}
  \subsection{Short English statement}
  Are infinitely many integer triples square-producing for parameter one and also for three other distinct parameters?
  \subsection{Sources}
