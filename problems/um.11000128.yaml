statement: . Find an analogue of Theorem 4.1 for topological manifolds, and relate it to surgery and pseudo-isotopy theory. Waldhausen’s functor A(X) is the algebraic K-theory of the “ring” Ω ∞S∞(ΩX+). It is a ho- motopy theoretic construction which, quite explicitly, contains information about both Diﬀ( X× I,∂X ×I∪X× 0) and Top( X×I,∂X ×I∪X× 0) where X is a compact d-manifold in a range of dimensions that increase with d, cf [ 20], [ 21]. Less explicitly A(X) also relates to Diﬀ( X) and Top(X), cf. [ 22]. The topological cyclic homology functor TC( X), introduced in [ 1], is an enriched version of Connes’ cyclic homology. A(X) maps to TC( X) via the cyclotomic trace, but TC( X) and the associated functor for rings (or linear categories) is of interest in its own right, cf. [ 9]. The p-adic completion TC( X)∧ p can be expressed in terms of more standard constructions in homotopy theory involving the free loop space. For X =pt, TC(pt)∧ p≃ (Ω∞S∞× Ω∞−1CP ∞ −1)∧ p. (6)
