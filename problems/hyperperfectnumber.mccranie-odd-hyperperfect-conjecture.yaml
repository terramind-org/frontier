lean:
  module: FormalConjectures.Wikipedia.HyperperfectNumber
  decl: HyperperfectNumber.mccranie_odd_hyperperfect_conjecture
  statement: |-
    theorem mccranie_odd_hyperperfect_conjecture {k n : ℕ} (hk_odd : Odd k) (hk : 1 < k)
        (hn : IsHyperperfect k n) :
        ((3 * k + 1) / 2).Prime ∧ (3 * k + 4).Prime ∧ n = ((3 * k + 1) / 2) ^ 2 * (3 * k + 4)
  context:
    - open HyperperfectNumber
  definitions:
    - name: HyperperfectNumber.IsHyperperfect
      kind: def
      text: |-
        /-- Predicate asserting that $n > 1$ is $k$-hyperperfect ($k \ge 1$):
        $n = 1 + k \cdot (s(n) - 1)$ where $s(n)$ sums the proper divisors of $n$. -/
        def IsHyperperfect (k n : ℕ) : Prop :=
          0 < k ∧ 1 < n ∧ n = 1 + k * ((∑ d ∈ n.properDivisors, d) - 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/HyperperfectNumber.lean#L50
