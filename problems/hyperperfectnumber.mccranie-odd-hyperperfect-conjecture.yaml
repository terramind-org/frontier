id: hyperperfectnumber.mccranie-odd-hyperperfect-conjecture
title: Hyperperfect numbers (mccranie_odd_hyperperfect_conjecture)
field: mathematics
tier: proof
statement: |-
  McCranie's odd-$k$ conjecture (2000): for odd $k > 1$, every $k$-hyperperfect integer $n$ satisfies
  $n = p^2 q$ with primes $p = (3k + 1)/2$ and $q = 3k + 4$.
