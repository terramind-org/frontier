title: Holomorphic Symplectic Geometry — Question 5
field: mathematics
tier: prose
statement: |-
  Note that $b_2$ is $23$ for $S^{[2]}$ and $7$ for $K_2(T)$ (1.2).
  [G] contains some more information on the other Betti numbers.

  Can we exclude some more cases, in particular $b_2=3$? If $b_2=23$, can we conclude that $X$ is deformation equivalent to $S^{[2]}$?
