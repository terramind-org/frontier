title: Persistence of KdV Solutions Under Quasilinear Perturbations
field: mathematics
tier: prose
statement: |-
  Let $N_4(x,u,u_x,u_{xx},u_{xxx})$ be a Hamiltonian quasilinear term vanishing to fourth order at the origin. For the perturbed equations on $\mathbb T$

  $$u_t+u_{xxx}-\partial_x(u^2)+N_4(x,u,u_x,u_{xx},u_{xxx})=0$$

  and

  $$u_t+u_{xxx}\pm\partial_x(u^3)+N_4(x,u,u_x,u_{xx},u_{xxx})=0,$$

  do the periodic, quasiperiodic, or almost-periodic solutions of the underlying KdV and modified KdV equations persist under sufficiently small perturbations?
