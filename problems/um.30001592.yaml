title: Energy Thresholds for Landau–Lifshitz Dynamics
field: mathematics
tier: prose
statement: Does the heat-flow and wave-map blow-up/global-existence dichotomy extend to the full Landau–Lifshitz family $\partial_tu=a_1(\Delta u+|\nabla u|^2u)+a_2u\times\Delta u$, including the Schrödinger-map case $a_1=0$; namely, are all data with $E(u_0)\leq4\pi$ global while finite-time blow-up occurs for some data at every $E(u_0)>4\pi$?
