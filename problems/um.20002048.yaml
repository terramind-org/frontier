statement: "Problem 26: On a given manifold \\(M\\), can one find a metric with specified \\(Q\\)? One can also ask this question within a given conformal class or within the realm of conformally flat metrics though, of course, if \\(M\\) is compact, then \\(\\int_M Q\\) must be as specified by the conformal class and the topology of \\(M\\)."
