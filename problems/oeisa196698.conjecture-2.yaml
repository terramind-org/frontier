  definitions:
    - name: OeisA196698.a
      kind: def
      text: |-
        /-- Number of primes of the form $3^n \pm 3^k \pm 1$ with $0 \le k < n$. -/
        def a (n : ℕ) : ℕ :=
          let p3n := 3 ^ n
          (Finset.range n).biUnion (fun k =>
            let p3k := 3 ^ k
            { p3n + p3k + 1,
              p3n + p3k - 1,
              p3n - p3k + 1,
              p3n - p3k - 1 }
          )
          |>.filter Nat.Prime
          |>.card
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/196698.lean#L33
