title: Unfolding convex polytopes
field: mathematics
tier: prose
statement: Does every three-dimensional convex polytope have a non-self-intersecting edge unfolding? Does a minimum spanning tree of the dual edge graph, with a natural dihedral-angle weighting, always specify such an unfolding? Does every convex polytope have a creased unfolding that cannot be refolded into a different convex polytope?
