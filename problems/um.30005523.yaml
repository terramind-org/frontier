title: Vanishing-Viscosity Limits for Transport Equations
field: mathematics
tier: prose
statement: Let $u_\varepsilon$ be the unique weak solution of the viscosity-regularized transport equation $$-\varepsilon\Delta u_\varepsilon+Hu_\varepsilon+\alpha u_\varepsilon=\langle f,\xi^m\rangle.$$ Does $u_\varepsilon$ converge as $\varepsilon\to0$ in a suitable topology, and if so, does its limit solve the corresponding unregularized transport equation?
