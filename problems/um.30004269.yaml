title: Dyck-Path Inequalities for Newton–Okounkov Polytopes
field: mathematics
tier: prose
statement: |-
  Let $\Lambda_i=(\lambda_i^i,\ldots,\lambda_i^n)$ and put $\lambda_j^i=\lambda_j^j$ for $j>i$. Is the Newton–Okounkov polytope $\Delta_{v_0}(X_{w_0},L(\Lambda_1,\ldots,\Lambda_{n-1}))$ defined by $u_{lm}\geq0$ and
  $$
  \sum_{(l,m)\in D}u_{lm}\leq\sum_{s=1}^j(\lambda_k^s-\lambda_{i+j}^s)
  $$
  for every indicated Dyck path $D$ from $\lambda_k$ to $u_{ij}$, where $1<k\leq j<n$ and $1\leq i\leq n-j$?
