title: Uniformization obstruction to Borel inverse functors
field: mathematics
tier: prose
statement: "**Reconstruction.** Let $F:\\mathcal C\\to\\mathcal D$ be a classification functor in Elliott's sense, where objects and arrows of the two categories have standard Borel codings and $F$ is Borel on both. Suppose an inverse functor $G:\\mathcal D\\to\\mathcal C$ exists in the appropriate one-sided or equivalence sense. Must some such $G$ be Borel?"
