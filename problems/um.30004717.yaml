title: Sharp Width Bounds for Positive-Scalar-Curvature Bands
field: mathematics
tier: prose
statement: If $Y$ is a closed smooth $(n-1)$-manifold, with $n-1\neq4$, that admits no positive-scalar-curvature metric, and $g$ on $Y\times[-1,1]$ has scalar curvature at least $\sigma>0$, prove that $\operatorname{dist}_g(Y\times\{-1\},Y\times\{1\})\leq 2\pi\sqrt{(n-1)/(\sigma n)}$.
