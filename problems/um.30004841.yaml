title: Separated Augmentation Filtrations and Quantum Group Generation
field: mathematics
tier: prose
statement: Let $I$ be the augmentation ideal of a Hopf algebra $A$ and set $I^\infty=\bigcap_{n\in\mathbb{N}}I^n$. For which $A$ does $I^\infty=\{0\}$, and more generally how can $A/I^\infty$ be described in terms of $A$? In particular, what is $I^\infty$ for $\mathcal{O}(O_N^+)$? Does there exist a residually torsion-free nilpotent discrete group $\Gamma$ such that $O_N^+$ is topologically generated by $SO_N$ and $\widehat{\Gamma}$?
