title: Open Problems in Pluripotential Theory — Question 38
field: mathematics
tier: prose
statement: |-
  [Eyssidieux-Guedj-Zeriahi]
  Let $v$ be a continuous viscosity supersolution of the equation
  $$
  -(dd^c V)^n+fdV=0.
  $$

  Is $P(v)$ a pluripotential supersolution of the same equation ?
