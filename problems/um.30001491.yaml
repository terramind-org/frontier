title: $\varepsilon$-Regularity Estimate for Donaldson's Equation
field: mathematics
tier: prose
statement: For Donaldson's almost-complex Calabi–Yau equation, do uniform constants $\varepsilon,C>0$ exist such that $$r^{-2}\int_{B_g(p,r)}\operatorname{tr}_g(\widetilde g)\,dV_g\leq\varepsilon$$ implies $$\sup_{B_g(p,r/2)}\operatorname{tr}_g(\widetilde g)\leq Cr^{-4}\int_{B_g(p,r)}\operatorname{tr}_g(\widetilde g)\,dV_g$$?
