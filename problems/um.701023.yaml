title: Kourovka Notebook Problem 14.38
field: mathematics
tier: prose
statement: |-
  For every pro-$p $-group $G$ of $(2\times
  2)$-matrices for $p\ne 2$ an analogue of the Tits Alternative
  holds: either $G$ is soluble, or the variety of pro-$p $-groups
  generated by $G$ contains the group {\small $\overline{\left< \left(
  \!\!\begin{array}{cc}1&t\cr 0&1
  \end{array}\!\!\right), \left(\!\!
  \begin{array}{cc}1&0\cr t&1\end{array}\!\!\right) \right>
  }$} $\leq SL_2({\mathbb{F} _p[[t]])$ (A. N. Zubkov, *Algebra
  and Logic*, **29**, no. 4 (1990), 287--301). Is the same result
  true for matrices of size
  $\geq 3$ for $p\ne 2$?
