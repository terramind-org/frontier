title: Schur $\sigma$-Group Frequency Heuristics
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finite $p$-group that is a Schur $\sigma$-group of rank $g$, or a maximal $p$-class-$c$ quotient of one. Among imaginary quadratic fields $K$ with $A_K$ of rank $g$, is the probability that the corresponding $G_K$, or its maximal $p$-class-$c$ quotient, is isomorphic to $G$ equal to

  $$\frac{z(G)^g}{|\operatorname{Aut}(G)|}\,p^{-gh}\prod_{k=1}^g(p^g-p^{g-k})\prod_{k=1}^h(p^g-p^{h-k})?$$

  Equivalently, does the displayed expression give the limiting frequency?
