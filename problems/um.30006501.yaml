title: Dimension-Independent Analyticity Bounds for K-Convex Spaces
field: mathematics
tier: prose
statement: Let $X$ be a $K$-convex Banach space. For every $1<p<\infty$, do there exist an angle $\theta>0$ and a bound independent of the dimension $d$ such that $\sup_{d\geq1}M_{p,d,\theta}^X<\infty$?
