title: Research Problems in Function Theory — Problem 7.77
field: mathematics
tier: prose
statement: We will say that $g(x)$ is a rearrangement of $f(x)$ if \[m\{x:g(x) < y\} = m\{x:f(x) < y\}\hspace{1cm}\text{ for all } y\in\mathbb{R},\] where $m$ is Lebesgue measure and $f$ and $g$ are defined on some finite interval $I$. What are those functions $f(x)$ for which $f'(x)$ is a rearrangement $f(x)$? Obvious examples of such functions are $f(x)=ke^x$ on any interval and $f(x) = k\sin x$ on $[0,\frac{1}{2}\pi]$. What others are there? How about other `differential rearrangements' than $f'(z)\sim f(x)$? (L. A. Rubel)
