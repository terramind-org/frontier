title: Multiplicity Formulas for Galois-Invariant Induced Representations
field: mathematics
tier: prose
statement: Let $E/F$ be a quadratic extension of local fields, let $\tau$ be its nontrivial Galois involution, set $G=\operatorname{GL}_n(E)$, and let $X$ be the variety of nonsingular Hermitian matrices over $E/F$ with its natural right $G$-action. If $\pi=\delta_1\times\cdots\times\delta_k$ is $\tau$-invariant and each $\delta_i$ is essentially square-integrable, is $\dim\operatorname{Hom}_G(X,\pi^*)=2^k$?
