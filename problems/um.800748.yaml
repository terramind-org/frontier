title: Banach Spaces and Ramsey Theory — Problem 11
field: mathematics
tier: prose
statement: |-
  The *Distortion Problem* is discussed in detail in [OS-new].
  A surprising phenomenon observed so far is that ``most" distortable
  Banach spaces are arbitrarily distortable.

  *(Bounded distortion -- see [OS-new])* Does there exist a boundedly distortable
  Banach space?
