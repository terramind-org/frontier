lean:
  module: FormalConjectures.GreensOpenProblems.«27»
  decl: Green27.green_27.equivalent
  statement: |-
    theorem green_27.equivalent :
      green_27.equivalent.answer ~[primesAtTop] m
  context:
    - open Green27
    - open Green27.green_27
    - open Asymptotics Filter
  definitions:
    - name: Green27.m
      kind: def
      text: |-
        /--
        This is $m(p)$ in [Be23]: the size of the smallest set $A \subset \mathbb{Z} / p\mathbb{Z}$ (with
        at least two elements) for which no element in the sumset $A + A$ has a unique representation.
        -/
        noncomputable def m (p : ℕ) : ℝ :=
          (sInf { (A.card) | (A : Finset (ZMod p)) (_ : 2 ≤ A.card) (_ : HasNoUniqueRepresentation A) } : ℝ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/GreensOpenProblems/27.lean#L44
    - name: Green27.primesAtTop
      kind: def
      text: |-
        /-- `atTop` restricted to prime numbers. -/
        def primesAtTop : Filter ℕ := atTop ⊓ 𝓟 {p : ℕ | p.Prime}
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/GreensOpenProblems/27.lean#L51
