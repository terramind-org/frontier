title: The superspace quotient is a noncompact trace module
field: mathematics
tier: prose
statement: |-
  Does the superspace coinvariant ring defined as
  \[
  \mathbb{C}[x_1,\ldots,x_n,\theta_1,\ldots,\theta_n]\big/
  \big(\mathbb{C}[x_1,\ldots,x_n,\theta_1,\ldots,\theta_n]^{S_n}_+\big)
  \]
  relate to link homology? What object does
  \[
  \mathbb{C}[x_1,\ldots,x_n,\theta_1,\ldots,\theta_n]\big/
  \big(\mathbb{C}[x_1,\ldots,x_n,\theta_1,\ldots,\theta_n]^{S_n}_+\big)
  \]
  define in the trace of Hecke category?
