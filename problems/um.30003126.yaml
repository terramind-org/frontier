title: Effective Siegel Theorems for Genus-Two Curves
field: mathematics
tier: prose
statement: For a genus-two curve $C$ over a number field $k$ and a nonconstant $\phi\in k(C)$, can Siegel's theorem on $S$-integral points with respect to $\phi$ be made effective in general, i.e. can one give an algorithm or explicit bound for all such points?
