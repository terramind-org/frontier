title: Rank-Metric Stability and Finite-Group Exponent Problems
field: mathematics
tier: prose
statement: Are almost commuting invertible matrices close to commuting invertible matrices in the normalized rank metric? Also, for each $k\geq2$ and prime $n$, does there exist $N=N(k,n)$ such that every finite group generated by $A=\{a_1,\ldots,a_k\}$ has exponent at most $n$ whenever $(x_1\cdots x_N)^n=1$ for all $x_1,\ldots,x_N\in A\cup\{1\}$?
