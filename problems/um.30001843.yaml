title: Functional Equations for Higher Bloch Groups
field: mathematics
tier: prose
statement: For higher polylogarithms, especially $n>3$, can one construct functional equations that generate the universal relations needed to define the higher Bloch groups $B_n(F)$ and prove the corresponding form of Zagier's conjecture?
