statement: |-
  c) The *$I $-theory* (*$Q
  $-theory*) of a class ${\mathfrak{K}}$ of universal algebras is the
  totality of all identities (quasi-identities) that are valid on
  all algebras in ${\mathfrak{K}}$. Does there exist a finitely
  axiomatizable variety

  (3) of Lie rings

  (i) whose $I $-theory is non-decidable?

  *Remark:* it is not difficult to find a
  recursively axiomatizable variety of semigroups with identity whose $ I
  $-theory is non-recursive (see also A. I. Mal'cev, *Mat.
  Sbornik*, **69**, no. 1 (1966), 3--12 (Russian)).

