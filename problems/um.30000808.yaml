title: Irreducible Restrictions of Almost-Simple Group Modules
field: mathematics
tier: prose
statement: Let $F$ be an algebraically closed field of characteristic $\ell$. Classify all triples $(K,V,H)$ such that $K/Z(K)$ is almost simple, $V$ is an $FK$-module of dimension greater than one, $H<K$ is proper, and the restriction $V\!\downarrow_H$ is irreducible.
