title: "Scalar Curvature Question [?6]: that the surface-tangent-bundle condition in Llarull's scalar-curvature rigidity theorem is redundant"
field: mathematics
tier: prose
statement: Conjecture that the surface-tangent-bundle condition in Llarull's scalar-curvature rigidity theorem is redundant. Specifically, let $X$ be a closed orientable Riemannian $n$-manifold with $\operatorname{Sc}(X)\geq n(n-1)$. If a $C^1$ map $f:X\to S^n$ has nonzero degree and does not increase the area of any surface, must $f$ be an isometry without assuming that $T(X)$ restricts trivially to every closed surface?
