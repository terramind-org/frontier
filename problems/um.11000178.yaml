title: Problem 3.7 — Are there quotients of Ig orKg in which the intersection of either Ig orKg with the handlebody group Hg is suﬃciently…
field: mathematics
tier: prose
statement: "Are there quotients of Ig orKg in which the intersection of either Ig orKg with the handlebody group Hg is suﬃciently tractible to allow one to study the double cosets: (Ig∩Hg)(φ)(Ig∩Hg), where φ∈I g, or ( Kg∩Hg)(φ)(Kg∩Hg), where φ∈K g? In regard to Problem 3.7 we note that in [ 36] Morita was seeking to understand how topological invariants of 3-manifolds might lead him to a better understanding of the representations of Ig andKg, but he did not ask about the potential invariants of Heegaard splittings that might, at the same time, be lurking there."
