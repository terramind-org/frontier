title: Boundaries of Groups and Kleinian Groups — Problem 81
field: mathematics
tier: prose
statement: Let G ⊂ Isom(Hn) be a discrete torsion-free ﬁnitelygenerated subgroup without abelian subgroups of rank ≥ 2. Is it true that (a) cdZ(G) ≤ Hdim(Λc(G)) + 1? Here Λ c is the conical limit set. The answer is known [36] to be positive if one considers homological rather than cohomological dimension. (b) In the case of equality, is it true that the limit set of G is the round sphere and G? This is known to be true in the case when G is geometrically ﬁnite [36]. (c) If Hdim(Λc(G)) < 2, is it true that G is geometrically ﬁnite? (d) If Hdim(Λc(G)) < 1, does it follow that G is a classical Schottky-type group?
