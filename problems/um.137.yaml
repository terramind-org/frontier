title: Sparse Hitting Set for Rectangles
field: mathematics
tier: prose
statement: Let $A$ be a set of $n$ points in the plane. Can one select $A' \subset A$ of size $n/2$ such that any axis-parallel rectangle containing 1000 points of $A$ contains at least one point of $A'$?
