title: Irreducibility of Restricted Classical-Group Tensor Representations
field: mathematics
tier: prose
statement: Let $\mathcal{G}=\operatorname{Cl}(W)$ be a simple classical group, and let $G\leq\mathcal{G}$ be a Zariski-closed subgroup. If $V$ is the largest composition factor of the $\mathcal{G}$-module $W\otimes W^*$, $\operatorname{Sym}^k(W)$, or $\bigwedge^k(W)$, for small $k$, when is the restriction $V\mathbin{\downarrow}_G$ irreducible?
