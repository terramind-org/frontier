title: Betti Bounds and Nerve HVC Dimension
field: mathematics
tier: prose
statement: For fixed $A>0$, if every intersection $L$ of $m$ members of a family $\mathcal M$ of subsets of $\mathbb R^d$ satisfies $b(L)\leq A\binom{m}{d}$, must the nerve of $\mathcal M$ have HVC dimension $d$?
