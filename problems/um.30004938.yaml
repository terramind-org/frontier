title: Polyhedrality of Totally Nonnegative Critical Varieties
field: mathematics
tier: prose
statement: In the study of scattering amplitudes and positive geometries on the totally nonnegative Grassmannian $\mathrm{Gr}_{\geq 0}(k, n)$, let $\operatorname{Crit}^{\geq 0}_f$ denote a totally nonnegative critical variety (the closure of the critical locus of the master function $f$ on a positroid cell, as studied by Galashin). Is every totally nonnegative critical variety $\operatorname{Crit}^{\geq 0}_f$ homeomorphic to a polytope?
