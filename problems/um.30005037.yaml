title: Zero Divisors in a Seven-Generator Group Ring
field: mathematics
tier: prose
statement: Let $$\Delta=\langle a,b,c,d,e,f,g\mid acb,add,afg,bbf,cdg,cef,eeg\rangle,$$ a torsion-free group without the unique-product property. Does $\Delta$ satisfy Kaplansky's zero-divisor conjecture over every field?
