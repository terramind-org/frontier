title: Integral Local Grothendieck-Module Isomorphism
field: mathematics
tier: prose
statement: For every block $b$ of a finite group $G$, let $\operatorname{Out}(G)_b$ be the stabilizer of $b$ in the outer automorphism group. Is there an $\mathcal{O}\operatorname{Out}(G)_b$-module isomorphism $G_k(G,b)\cong LG_k(G,b)$?
