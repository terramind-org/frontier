title: Explicit Invariant Densities for Even Continued Fractions
field: mathematics
tier: prose
statement: For the set $E_{\mathrm{even}}$ of irrational numbers in $[0,1]$ with all continued-fraction entries even, whose Gauss-map invariant measure $\mu$ is equivalent to its Hausdorff-dimension packing measure $P_h$, find a closed explicit formula for the real-analytic extension of $d\mu/dP_h$ to $[0,1]$, or prove that no such formula exists.
