statement: |-
  \section*{Large Goemans–Linial gaps for uniform sparsest cut}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Do unit-demand capacity instances on unbounded vertex counts n have Goemans–Linial semidefinite integrality gap at least $c\surd \log (n)/(\log $ $\log (n))^{3}$ for one absolute $c>0$, with positive relaxation value?
  \subsection{Short English statement}
  Do unit-demand capacity instances on unbounded vertex counts n have Goemans–Linial semidefinite integrality gap at least $c\surd \log (n)/(\log $ $\log (n))^{3}$ for one absolute $c>0$, with positive relaxation value?
