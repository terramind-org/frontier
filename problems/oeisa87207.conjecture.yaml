id: oeisa87207.conjecture
title: Binary representation of primes that divide a number, in decimal
field: mathematics
tier: proof
statement: |-
  Starting at any $n$ and iterating the map $n \mapsto a(n)$, we will always reach $0$.
  - _Antti Karttunen_, Jun 18,20 2017
