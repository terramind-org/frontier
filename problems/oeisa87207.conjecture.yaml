lean:
  module: FormalConjectures.OEIS.«87207»
  decl: OeisA87207.conjecture
  statement: "theorem conjecture (n : ℕ) : ∃ k : ℕ, (a^[k]) n = 0"
  context:
    - open OeisA87207
  definitions:
    - name: OeisA87207.a
      kind: def
      text: |-
        /-- Binary representation of the prime factors of $n$, represented in decimal:
        $a(n) = \sum_{p \in \mathrm{support}(\mathrm{factorization}(n))} 2^{\pi(p) - 1}$. -/
        def a (n : ℕ) : ℕ :=
          ∑ p ∈ (Nat.factorization n).support, 2 ^ (Nat.primeCounting p - 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/87207.lean#L35
