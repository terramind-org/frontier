title: Fourier shadows and the quartic tensor-free defect
field: mathematics
tier: prose
statement: |-
  **Q:** Given $x_1,\ldots,x_k$ and $y_1,\ldots,y_k$ in a vNa such that
  $\{x_1,\ldots,x_k\}$ is tensor-independent of $\{y_1,\ldots,y_k\}$ and
  such that $\mu_{x_1,\ldots,x_k},\nu_{y_1,\ldots,y_k}$ are freely infinitely
  divisible, we can apply the Fourier transform to get the power-series of the
  classical convolution of $\mu_{x_1,\ldots,x_k}$ and
  $\nu_{y_1,\ldots,y_k}$. How do such power-series relate to the
  noncommutative power series obtained from free convolution? (In other words
  how does the set of classically obtainable power-series relate to the set of
  freely obtainable power-series?)
