title: Random Set Methods for Harmonic Analysis Estimates
field: mathematics
tier: prose
statement: Let $B_p(\Gamma)$ be the least correction factor in the weak $L^p([0,1]^d)$ majorant inequality for frequencies in $\Gamma\subset[1,N]^d$. For which sets $\Gamma$ does $B_p(\Gamma)\ll N^\varepsilon$ hold for every $\varepsilon>0$, and can random-set methods be adapted to prove such estimates?
