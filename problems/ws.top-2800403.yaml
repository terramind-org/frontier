  \item[\hypertarget{source:2800403:2}{S2}] Nikhil Bansal, Haotian Jiang and Raghu Meka, Resolving Matrix Spencer Conjecture Up to Poly-logarithmic Rank (2022), arXiv:2208.11286, Section 1, Conjecture 1.2, p. 1. \url{https://arxiv.org/pdf/2208.11286}.
  \end{description}
