title: Decay Rates for Nonlinear Waves on Black-Hole Backgrounds
field: mathematics
tier: prose
statement: For the zeroth spherical harmonic of a linear wave $\phi$ on a Schwarzschild or Reissner–Nordström exterior, compactly supported Cauchy data yield $$|r\phi(u,\infty)|\leq Cu^{-2},\qquad |\partial_u(r\phi)(u,\infty)|\leq C_\varepsilon u^{-3+\varepsilon},$$ and, when $r(u,v)\leq R$, $$|\phi(u,v)|\leq C_{R,\varepsilon}v^{-3+\varepsilon},\qquad |\partial_v\phi(u,v)|\leq C_{R,\varepsilon}v^{-3+\varepsilon}.$$ Are these decay rates sufficient to treat a nonlinearity perturbatively? In particular, determine the small-data behavior of $\Box_g\phi=|\phi|^p$ in the remaining range $1+\sqrt2\leq p\leq4$.
