title: Holomorphic Symplectic Geometry — Conjecture 13
field: mathematics
tier: prose
statement: |-
  There are only two classes of compact holomorphic contact manifolds known so far:
  a) The projective cotangent bundle $\mathbb{P} T^*_M$, where $M$ is any compact complex manifold;
  b) Let $\mathfrak{g}$ be a simple complex Lie algebra. The action of the adjoint group on $\mathbb{P} (\mathfrak{g})$ has a unique closed orbit $X_\mathfrak{g}$: every other orbit contains $X_\mathfrak{g}$ in its closure. $X_\mathfrak{g}$ is a contact Fano manifold.

  The following conjecture is folklore:

  Any projective contact manifold is of type \mathrm{a)} or \mathrm{b)}.
