title: Polyhedrality of Novikov Invertibility Loci
field: mathematics
tier: prose
statement: Let $G$ be a finitely generated group, let $A$ be a $p\times p$ matrix over $\mathbb Z[G]$, and let $\mathcal N$ be the set of nonzero real characters $\xi\in\operatorname{Hom}(G,\mathbb R)$ for which $A$ is invertible over the Novikov completion $\mathbb Z[G]_\xi$ or $\mathbb Q[G]_\xi$. Is $\mathcal N$ defined by finitely many integral linear inequalities?
