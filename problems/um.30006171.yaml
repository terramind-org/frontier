title: ABCD Conjecture Under Determinacy
field: mathematics
tier: prose
statement: Assume $\mathrm{ZF}+\mathrm{AD}$. Let $\alpha,\beta,\gamma,\delta<\Theta$ with $\beta\leq\alpha$ and $\delta\leq\gamma$. Prove that $|\alpha^\beta|\leq|\gamma^\delta|$ if and only if $|\beta|\leq|\delta|$ and $|\alpha|\leq|\gamma|$.
