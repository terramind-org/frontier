title: Exact nonzero second coefficient for a non-Q-Gorenstein toric family
field: mathematics
tier: prose
statement: |-
  If \(a_e\) denote of \(F\)-splitting numbers of a strongly \(F\)-regular
  local ring \(R\) (i.e., \(R^{1/p^e}\cong R^{a_e}\oplus M\) as
  \(R\)-modules, and \(M\) contains no free \(R\)-module summands), then is
  \[
  a_e=s(R)p^{ed}+Cp^{e(d-1)}+O\!\left(p^{e(d-2)}\right)
  \]
  for some constant \(C\)?
