title: Open Problems in Arithmetic Dynamics — Question 47
field: mathematics
tier: prose
statement: |-
  Let $K$ be a number field, let $f:\mathbb{P}^N\to\mathbb{P}^N$ be an endomorphism of
  degree at least $2$ defined over $K$, and let $X\subsetneq\mathbb{P}^N$ be a
  subvariety that is defined over $K$ and irreducible over $K$.
  \begin{parts}

  (a)
  If the iterated forward orbit $\bigcup_{n\ge1} f^n(X)$ of $X$ is
  Zariski dense in $\mathbb{P}^N$, is it true that $(f,X)$ is eventually
  stable over $K$?

  (b)
  If the iterated forward orbit is Zariski dense and $\dim(X)\ge1$, is it
  true that $(f,X)$ is geometrically eventually stable?

  (c)
  If $\dim(X)\ge1$, is eventual stability over $K$ equivalent to
  geometric eventual stability?
  \end{parts}
