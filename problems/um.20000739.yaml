title: Character-phase evidence for Elliott--Halberstam and a sparse twisted-psi diagonal
field: mathematics
tier: prose
statement: |-
  What evidence exists in support of the Elliott--Halberstam conjecture (EH)? Vaughan suggested that progress would most likely exploit cancellation among the values of \(\overline\chi(a)\) in
  \[
  \psi(x;q,a)=\frac{1}{\phi(q)}\sum_{\chi\bmod q}\overline\chi(a)\psi(x,\chi).
  \]
  Conrey asked whether known asymptotics for
  \[
  \sum_{\chi\bmod q}^{*}\chi(a)|L(1/2,\chi)|^2
  \]
  suggest that the desired cancellation is nonexistent. Soundararajan replied that the latter behavior comes from the Euler product and has no analogue for \(\psi(x,\chi)\).

  With only those typographical defects repaired, the key passage is:

  Here \(^*\) means primitive characters. These corrections are confirmed by page 1 of the PDF.

  For a precise modern target, put
  \[
   \Delta(x;q,a)=\psi(x;q,a)-\frac{x}{\phi(q)},\qquad
   \psi(x;q,a)=\sum_{\substack{n\le x\\n\equiv a\pmod q}}\Lambda(n). \]
  The standard Elliott--Halberstam assertion is that, for every \(A>0\) and every fixed \(\theta<1\),
  \[
   \sum_{q\le x^\theta}\max_{(a,q)=1}|\Delta(x;q,a)|
   \ll_{A,\theta}\frac{x}{(\log x)^A}. \tag{EH}
  \]
  Thus the record contains three connected questions: what theorem-level evidence supports (EH), what character-phase cancellation would explain it, and whether a twisted second moment of central \(L\)-values obstructs that mechanism.
