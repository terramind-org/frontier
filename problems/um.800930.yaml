title: Open Problems and Questions about Geodesics — Question 10 (Hingston)
field: mathematics
tier: prose
statement: |-
  Let $M$ be a compact manifold with a Riemannian (or Finsler) metric $g$. \
  Let $G$ be a finitely generated
  abelian group. \ Given a non-trivial homology class
  $X \in H_{\ast}(\Lambda M;G)$, the critical (minimax) level of $X$ is
  \begin{align*}
  cr X & =\inf\{a:X\in\text{Image }H_{\ast}(\Lambda_a M;G)\}\\
  & =\underset{x\epsilon X}{\inf}\text{ }\underset{\gamma\in\text{Image}
  x}{\sup}Length({\gamma})
  \end{align*}
  Here $\Lambda_a M$ is the subset of the free loop space $\Lambda M$
  consisting of loops whose length is
  at most $a$.
  The second definition is the minimax definition: the
  singular chain $x$ ranges over all representatives of the homology class $X$,
  and $\gamma$ over all the points in the image of $x$, which are loops in $M$.

  *Do there exist a metric on *$S^{n}$* and a
  homology class *$X \in H_{\ast}(\Lambda M;

  \mathbb{Z}

  )$* with *
  \[
  0 < cr(mX) < c r(X)
  \]
  *for some *$m \in
  \mathbb{N}

  $?
