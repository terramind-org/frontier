statement: At every order in the perturbative expansion, is the renormalized planar connected two-point function $G_{\alpha\beta}$ a polynomial with rational coefficients in $\alpha$, $\beta$, $A=(1-\alpha)/(1-\alpha\beta)$, $B=(1-\beta)/(1-\alpha\beta)$, and iterated integrals labeled by rooted trees?
