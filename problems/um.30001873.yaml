id: um.30001873
title: Strong Prediction for Stationary Ergodic Gaussian Processes
field: mathematics
tier: prose
statement: |-
  For every stationary ergodic Gaussian process $(Y_n)_{n\in\mathbb Z}$, does there exist a prediction rule $g=(g_n)$ such that

  $$\left|\mathbb E[Y_n\mid Y_1,\ldots,Y_{n-1}]-g_n(Y_1,\ldots,Y_{n-1})\right|\to0$$

  almost surely?
