title: Chern and slope obstructions for pseudoholomorphic plane foliations on the four-torus
field: mathematics
tier: prose
statement: |-
  **Problem 30 (Victor Bangert).** Let \(M^{2n}\) be a manifold with an almost complex structure \(J\). A pseudo-holomorphic line is a map \(f:\mathbb R^2\to M\) satisfying
  \[
  f_y=J(f)f_x.
  \]
  Moser proved that, for an almost complex structure \(J\) on \(\mathbb T^{2n}\) which is close to a standard complex structure \(J_0\), and any sufficiently irrational vector \(v\in\mathbb R^{2n}\), there exists a foliation of \(\mathbb T^{2n}\) by pseudo-holomorphic curves which is conjugate to a linear foliation by real two-planes containing \(v\). Develop a global (non-perturbative) theory of such foliations or laminations. The theory is expected to be particularly rich for \(\mathbb T^4\), due to positivity of the intersection number of pseudoholomorphic curves, analogously to the intersection number for geodesics on \(\mathbb T^2\) underlying Hedlund's work.
