title: Foliations and Diffeomorphism Groups — Question 17
field: mathematics
tier: prose
statement: |-
  Let $\text{Diff}_0(**D**^2, *)$ be the group of smooth orientation-preserving diffeomorphisms of $**D**^2$ that fix a marked point $*$ say at the origin. There are two bounded Euler classes on this group; one is induced by the restriction to the boundary and the other is by taking derivative at the origin. The difference between these two classes gives a non-trivial quasimorphism on $\text{Diff}_0(**D**^2, *)$.

  Is the space of homogenous quasimorphisms on $\mathrm{Diff}_0(**D**^2, *)$ one dimensional?
