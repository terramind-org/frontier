title: Modularity of Higher-$t$ Generating-Function Coefficients
field: mathematics
tier: prose
statement: Determine whether the coefficients of higher powers of $t$ in the hypergeometric generating function for the integrals $R_{k,1}(X)$ are modular forms or higher-order modular antiderivatives, and rigorously identify the corresponding structure for $R_{k,\ell}(X)$ when $\ell>1$.
