title: Kourovka Notebook Problem 20.45
field: mathematics
tier: prose
statement: |-
  Let \(n\) be a positive integer, and let \(G \leq \mathrm{GL}(n,\mathbb{Z})\)
  be finitely generated. Given a bound \(b \in \mathbb{N}\), let \(e_b\) be
  the number of elements of \(G\) all of whose matrix entries have absolute value
  \(\leq b\). Does the limit \ \(\displaystyle\lim_{b \rightarrow \infty} \ln{e_b}/\ln{b}\) \ always exist?
