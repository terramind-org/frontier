id: um.20001345
title: Full-group criterion and a nonamenability obstruction to IMG orbit cyclicization
field: mathematics
tier: prose
statement: |-
  Suppose that \(\Gamma\) is a group acting on the boundary of a rooted tree, e.g. the iterated monodromy group of a continuous map. Is there a \(\mathbb Z\)-action with the same orbits? Find an explicit homeomorphism implementing the orbit equivalence.

  **Intended problem.** Given the boundary action of an iterated monodromy group \(G=IMG(f)\), does there exist \(\varphi\in\operatorname{Homeo}(\partial T)\) such that \(E_\varphi=E_G\), where \(E_\varphi\) is the orbit relation of the cyclic group \(\langle\varphi\rangle\)? Can \(\varphi\), or an orbit-equivalence conjugacy producing it, be made explicit?
