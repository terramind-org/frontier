title: Foliations and Diffeomorphism Groups — Question 67
field: mathematics
tier: prose
statement: |-
  The subgroups of piecewise linear (PL for short) homeomorphisms of the line have been a rich source for interesting finitely generated groups with surprising algebraic and dynamical properties. However, not much is known about the algebraic properties of the PL homeomorphisms of higher dimensional PL manifolds. Although they are more combinatorial in nature, the analytical tools for diffeomorphism groups and the Mather infinite repetition trick for homeomorphisms are not available for PL homeomorphisms. So the following basic question due to Epstein [epstein1970simplicity] is still open.

  (Epstein) Let $M$ be a PL manifold. Is $\mathrm{PL}_0(M)$, the group of PL homeomorphisms of $M$ that are isotopic to the identity, a simple group?
