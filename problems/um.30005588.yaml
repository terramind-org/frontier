title: Spatially Periodic Reaction-Diffusion Patterns and Homoclinic Entropy
field: mathematics
tier: prose
statement: For reaction–diffusion systems on $\mathbb R^m$ with $m>1$, can the complexity theorem for stationary, asymptotically spatially periodic solutions with localized defects be extended from one spatial dimension? Do symmetric homoclinic tangles involving multi-parameter families of periodic orbits always have positive topological entropy?
