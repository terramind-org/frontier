title: Linear Systems and Eigenvalue Problems — Problem 22
field: mathematics
tier: prose
statement: |-
  We propose the following problem, which will improve the result in [Banks-et-al-23] (for diagonalization) and in [banks2022global] (for the Schur form). The motivation is that the amount of precision required by the best currently known provable algorithms for diagonalization/Schur form is much larger than the gold standard of $\log(1/\delta)+c\log(n)$ bits preferred in numerical analysis (which has been achieved for the Hermitian diagonalization problem [shah2025hermitian]).

  Give a provable randomized algorithm for backward error diagonalization or Schur form with runtime $O(n^3\log^c(n/\delta))$ that only uses $O(\log(n/\delta))$ bits of precision.
