schema: 1
id: oeisa248123.conjecture
title: Least $m > 0$ coprime to $n$ such that $mn \mid C(m+n)$
field: mathematics
tier: proof
statement: |-
  Conjecture: $a(n)$ exists for all $n > 0$.
  Since $a(n)$ is defined as the infimum of a set of positive integers, existence is equivalent
  to $0 < a(n)$.
