lean:
  module: FormalConjectures.OEIS.«248123»
  decl: OeisA248123.conjecture
  statement: "theorem conjecture (n : ℕ) (hn : 0 < n) : 0 < a n"
  context:
    - open OeisA248123
    - open Nat Set
  definitions:
    - name: OeisA248123.a
      kind: def
      text: |-
        /-- Least integer $m > 0$ such that $\gcd(m, n) = 1$ and $m \cdot n \mid C(m+n)$, where $C(k)$ is
        the $k$-th Catalan number. Returns $0$ if no such $m$ exists. -/
        noncomputable def a (n : ℕ) : ℕ :=
          sInf { m : ℕ | 0 < m ∧ Nat.gcd m n = 1 ∧ (m * n) ∣ catalan (m + n) }
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/248123.lean#L36
