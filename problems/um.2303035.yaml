title: Research Problems in Function Theory — Problem 3.35
field: mathematics
tier: prose
statement: For $r_1<r_2$, we will call the set $\{x\in\mathbb{R}^n:n\geq3,r_1<\|x\|<r_2\}$ an annulus and its closure a closed annulus. Let $\Omega$ be a non-empty subset of $\mathbb{R}^n$, $n\geq3$, such that $\lambda(\overline{\Omega})<+\infty$, where $\lambda$ denotes $n$-dimensional Lebesgue measure. Then if, for each point $x\in\mathbb{R}^n\setminus\overline{\Omega}$ we have that \[\frac{1}{\lambda(\overline{\Omega})}\int_{\overline{\Omega}}\|x-y\|^{2-n}\,d\lambda(y)\] equals the mean-value of the function $y\mapsto\|x—y\|^{2-n}$ over the unit sphere of $\mathbb{R}^m$, it can be shown that $\overline{\Omega}$ is a closed annulus. If, throughout the hypotheses, we replace $\overline{\Omega}$ by $\Omega$, can we conclude that $\Omega$ is an annulus? For details of closely-related work, see and . (D. H. Armitage and M. Goldstein)
