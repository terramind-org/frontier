title: Global permutation rigidity for repeated Carnot factors
field: mathematics
tier: prose
statement: |-
  Let $H$ be an irreducible Carnot group, $G$ a product of several
  copies of $H$, and $f:G\to G$ a quasisymmetric map. Must $f$ be a
  product map (after permutation of the factors)?

  A Carnot group is irreducible if it is not the real line and is not the
  direct sum of two Carnot groups.
