lean:
  module: FormalConjectures.Arxiv.«2209.04540».SpectralSetsAndWeakTiling
  decl: NowhereDenseSpectralSet.exists_nowhereDense_spectralSet
  statement: |-
    theorem exists_nowhereDense_spectralSet :
        ∃ d : ℕ, 2 ≤ d ∧
          ∃ Ω : Set (Fin d → ℝ), Bornology.IsBounded Ω ∧ MeasurableSet Ω ∧
            IsNowhereDense Ω ∧ 0 < volume Ω ∧ isSpectral Ω
  context:
    - open NowhereDenseSpectralSet
    - open MeasureTheory
  definitions: []
