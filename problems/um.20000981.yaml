title: Finite certificates and a small-area obstruction for symmetric hexagonal polyomino tilings
field: mathematics
tier: prose
statement: |-
  (16) Wesley Pegden: "Are all the ways to hexagonally tile the plane with polyominoes that are 90 degrees rotationally symmetric given by the tilings (up to dilations, say) considered in my recent paper with Lionel Levine and Charles Smart [23] on the Apollonian circle-packing patterns that emerge in the scaling limit of the sandpile model? We believe this conjecture (and in fact state a stronger conjecture in the paper)."

  **Conjecture 1.4 [LPS].** If $\mathcal T$ is a primitive, regular, hexagonal tiling of $\mathbb Z^2$ by $90$-degree symmetric tiles, then $\mathcal T=T_C+L_C+v$ for some circle $C$ in the band Apollonian packing $\mathcal B$ and some $v\in\mathbb Z^2$.
