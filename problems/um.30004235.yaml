title: Triangle Equation Hyperplane Arrangements
field: mathematics
tier: prose
statement: Let $\mathcal H$ be the arrangement in $\mathbb R^{\binom n2}$ consisting, for every unordered triple $\{i,j,k\}\subseteq[n]$, of the hyperplane $$H_{i,j,k}=\{x:x_{i,j}+x_{j,k}=x_{i,k}\}$$. Determine the intersection lattice, characteristic polynomial, regions, and other combinatorial invariants of $\mathcal H$.
