lean:
  module: FormalConjectures.ErdosProblems.«917»
  decl: Erdos917.erdos_917.variants.three_dvd
  statement: |-
    theorem erdos_917.variants.three_dvd :
        ∀ k : ℕ, 6 ≤ k → 3 ∣ k → (fun n : ℕ ↦ (f k n : ℝ)) ~[atTop] conjecturedValue k
  context:
    - open Erdos917
    - open Erdos917.erdos_917
    - open Erdos917.erdos_917.variants
    - open Filter Asymptotics
  definitions:
    - name: Erdos917.f
      kind: def
      text: |-
        /-- $f_k(n)$ is the largest number of edges of a `k`-critical graph on `n` vertices. A graph on `n`
        vertices has at most $\binom{n}{2}$ edges, so the `sSup` is a maximum whenever such a graph exists.
        If there is none (for example if $n < k$), the value is `0`. -/
        noncomputable def f (k n : ℕ) : ℕ :=
          sSup {m : ℕ | ∃ G : SimpleGraph (Fin n), IsKCritical G k ∧ G.edgeSet.ncard = m}
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/917.lean#L61
    - name: Erdos917.conjecturedValue
      kind: def
      text: |-
        /-- The conjectured value $\frac{1}{2}\left(1-\frac{1}{\lfloor k/3\rfloor}\right)n^2$ of $f_k(n)$
        for $k \geq 6$. It is also used for $k = 3$ in `erdos_917.variants.erdos_three_dvd`, where it is
        $0$. -/
        noncomputable def conjecturedValue (k n : ℕ) : ℝ :=
          1 / 2 * (1 - 1 / ((k / 3 : ℕ) : ℝ)) * (n : ℝ) ^ 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/917.lean#L76
