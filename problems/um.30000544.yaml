title: Connectivity and Geometry of Hofer-Metric Annuli
field: mathematics
tier: prose
statement: For the Hofer-metric annulus $A_t=\{f\in\operatorname{Ham}:t\leq\rho(\mathrm{id},f)\leq2t\}$, is $A_t$ path connected for large $t$? What is the large-$t$ geometry of its intrinsic length metric $\rho_t$; in particular, is $\operatorname{diam}(A_t,\rho_t)$ finite?
