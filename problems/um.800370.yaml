title: Coxeter Groups and Unimodality — Conjecture 8
field: mathematics
tier: prose
statement: |-
  For $\sigma \in S_n$ let
  \[
  L(\sigma) := | \{ (i,j) \in [n]^2 : i<j, \sigma(i)>\sigma(j), \; i \not \equiv j \pmod{2} \} |.
  \]
  The statistic $L$ is known as the *odd length* or *odd inversion number*
  of $\sigma$. The statistic was introduced in [KloVol] in relation to formed spaces
  and has been further studied in [BreCav] and [BreCa2].
  The following conjecture appears in [BreCa2, Conj. 6.2].

  Let $n \in \mathbb{P}$, $n \geq 5$. Then
  \[
  L_n(x) := \sum_{\sigma \in S_n} x^{L(\sigma)}
  \]
  is symmetric and unimodal.
