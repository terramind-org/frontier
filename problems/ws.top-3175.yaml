statement: |-
  \section{Decomposing an eulerian graph into cycles with no two consecutives edges on a prescribed eulerian tour.}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A finite connected Eulerian graph has an Euler tour $W$, a closed trail using every edge exactly once. Consecutiveness in $W$ is cyclic, including the last and first edges. A cycle decomposition is an edge partition into connected $2$-regular subgraphs.
  \paragraph{Statement recorded in the supplied source.}
  For every Eulerian graph $G$ of minimum degree at least $4$ and every prescribed Euler tour $W$, does there exist a cycle decomposition such that no cycle contains two edges consecutive in $W$? \sref{statement}{2}
  \subsection{Short English statement}
  Can the edges of an Eulerian graph be split into cycles that avoid every transition in a prescribed Euler tour?
