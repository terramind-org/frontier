title: Rigidity of Smooth Isometric Families of Compact Surfaces
field: mathematics
tier: prose
statement: Let $M$ be a compact surface, $I=(-1,1)$, and $f:M\times I\to\mathbb{R}^3$ a differentiable map such that each $f_t$ is an immersion and its induced metric is independent of $t$. Must there be a family of rigid motions $g(t)$ with $f_t=g(t)f_0$?
