  \section{\texorpdfstring{Wikipedia geometry item 7: Fujita conjecture regarding the line bundle $K_{M} \otimes L^{\otimes m}$ constructed from a po…}{Wikipedia geometry item 7: Fujita conjecture regarding the line bundle K\_M otimes L\textasciicircum{}otimes m constructed from a po…}}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $M$ be a smooth projective complex variety of dimension $n$, $L$ an ample line bundle, and $K_M$ the canonical line bundle. Must $K_M\otimes L^{\otimes m}$ be globally generated for $m\geq n+1$ and very ample for $m\geq n+2$?
  \par\smallskip\textit{Formulation references:} \sref{statement}{1}, \sref{statement}{2}.
