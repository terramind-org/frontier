title: Open Problems and Questions about Geodesics — Conjecture 2 (Long)
field: mathematics
tier: prose
statement: |-
  There exist results supporting this conjecture. In particular,
  H. Hofer, K. Wysocki and E. Zehnder in [Ho-Wy-Ze2003] studied Reeb orbits on contact $S^3$.
  Their result can be projected down to $S^2$, and implies that the total number of distinct prime closed geodesics for a bumpy Finsler metric on $S^2$ is either 2
  or infinite, provided the stable and unstable manifolds of every hyperbolic closed geodesics
  intersect transversally. See also
  [Har-Pat2008,Rademacher2016].

  The closed geodesics in Katok's example are elliptic.

  *The existence of one hyperbolic prime closed geodesic on a Finsler
  $S^2$ implies the existence of infinitely
  many distinct prime closed geodesics.*
