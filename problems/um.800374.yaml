title: Coxeter Groups and Unimodality — Problem 12
field: mathematics
tier: prose
statement: |-
  Let $\sum_{i=0}^{d} h_i t^i \in \mathbb{N}[t]$ be a polynomial with only real roots
  such that $h_0=1$ and $h_0 < h_1 < \cdots < h_k$ for some $0 \leq k \leq d$. Is there a simplicial complex whose $f$-vector is $(h_0, h_1-h_0, \ldots , h_k-h_{k-1})$?
