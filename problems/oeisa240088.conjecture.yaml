  definitions:
    - name: OeisA240088.a
      kind: def
      text: |-
        /-- Number of ways of writing $n$ as an ordered sum of a triangular number, a square,
        and a pentagonal number. -/
        def a (n : ℕ) : ℕ :=
          ∑ i ∈ range (n + 2), ∑ j ∈ range (n + 2), ∑ k ∈ range (n + 2),
            if Nat.triangular i + j ^ 2 + Nat.polygonalNumber 5 k = n then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/240088.lean#L39
