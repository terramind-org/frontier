title: Thin-deleted asymptotic and an explicit split-fibre surplus
field: mathematics
tier: prose
statement: |-
  Let
  \[
  X=\left\{([\mathbf x],[\mathbf y])\in \mathbf P^3\times\mathbf P^3:
  x_1y_1^2+x_2y_2^2+x_3y_3^2+x_4y_4^2=0\right\}.
  \]
  For primitive integral representatives, take
  \[
  H([\mathbf x],[\mathbf y])=\|\mathbf x\|_\infty^3\|\mathbf y\|_\infty^2,
  \]
  delete the locus on which some \(x_i\) or some \(y_i\) is zero, and estimate the counting function.
