title: Toric Embedded Resolution of Equicharacteristic Local Domains
field: mathematics
tier: prose
statement: Given a Noetherian excellent equicharacteristic local domain $R$ with algebraically closed residue field $k$, does a toric birational map $Z\to\mathbb A_k^N$ exist such that the strict transform of $\operatorname{Spec}R$ is nonsingular and transverse to every nondense toric orbit over the closed point?
