title: Kourovka Notebook Problem 4.72
field: mathematics
tier: prose
statement: |-
  Is it true that every variety of groups whose
  free groups are residually nilpotent torsion-free, is either
  soluble or coincides with the variety of all groups? For an
  affirmative answer, it is sufficient to show that every variety of
  Lie algebras over the field of rational numbers which does not
  contain any finite-dimensional simple algebras is soluble.
