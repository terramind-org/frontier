title: Kourovka Notebook Problem 20.113
field: mathematics
tier: prose
statement: |-
  Let $H(q,c) = \langle a,b,c,d \mid [b,a]=[d,c], \text{ of exponent } q, \text{ nilpotent of class } c\rangle$.

  a) Is it true that the Schur multiplier $M(H(8,12))$ has exponent 32?

  b) Is it true that the Schur multiplier $M(H(7,13))$ has exponent 49?

  The difficulty is that these groups are too big to compute using current versions of the $p$-Quotient Algorithm, which use 32 bit arithmetic. So to tackle these groups
  it would help to have a version of the $p$-Quotient Algorithm using 64 bit arithmetic.
