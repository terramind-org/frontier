lean:
  module: FormalConjectures.Paper.Homogenous
  decl: Homogeneous.homogeneousSpace_exists_inj_tendsto
  statement: |-
    theorem homogeneousSpace_exists_inj_tendsto :
        ∀ (X : Type) (_ : TopologicalSpace X), ¬ Finite X → T2Space X → CompactSpace X →
          HomogeneousSpace X → ∃ s : ℕ → X, s.Injective ∧ ∃ a : X, Tendsto s atTop (nhds a)
  context:
    - open Homogeneous
    - open TopologicalSpace Topology Filter Set
    - open scoped Cardinal
  definitions:
    - name: Homogeneous.HomogeneousSpace
      kind: class
      text: |-
        /--
        A topological space $X$ is called *homogeneous* if for all $x, y \in X$ there is homeomorphism
        $f : X \to X$ with $f(x) = y$.
        -/
        class HomogeneousSpace (X : Type*) [TopologicalSpace X] : Prop where
          exists_equiv : ∀ x y : X, ∃ f : X ≃ₜ X, f x = y
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Paper/Homogenous.lean#L42
