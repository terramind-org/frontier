title: Integer Predicates in Models of Totally Real Algebraic Integers
field: mathematics
tier: prose
statement: Let $(A,Z)$ be a ring of totally real algebraic integers with $Z$ named, and let $(R,S')$ be a model of its theory. If $(R,S)$ is the associated ultrapower model, with $S$ interpreting $Z$, must $S'\subseteq S$?
