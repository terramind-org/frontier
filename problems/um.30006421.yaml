title: Contractible Ricci-Nonnegative Four-Manifolds with Euclidean Growth
field: mathematics
tier: prose
statement: Let $(M^4,g)$ be a smooth, complete, contractible four-manifold with $\operatorname{Ric}\geq 0$ and Euclidean volume growth. Must $M$ be homeomorphic to $\mathbb{R}^4$, and must every asymptotic cross-section be homeomorphic to $S^3$?
