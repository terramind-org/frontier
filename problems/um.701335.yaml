title: Kourovka Notebook Problem 17.33
field: mathematics
tier: prose
statement: |-
  Can the quasivariety generated by the group $\langle a,b\mid
  a^{-1}ba=b^{-1}\rangle$ be defined by a set of quasi-identities in
  a finite set of variables? The answer is known for all other
  groups with one defining relation.
