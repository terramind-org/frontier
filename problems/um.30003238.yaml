id: um.30003238
title: Removing Logarithmic Losses in Multiplicative Approximation
field: mathematics
tier: prose
statement: The sets $\{(\alpha,\beta):\liminf_{q\to\infty}(q\log q\log\log q)\lVert q\alpha\rVert\lVert q\beta\rVert>0\}$ and $\{\alpha:\liminf_{q\to\infty}(q\log q\log\log q)|q|_p\lVert q\alpha\rVert>0\}$ have full Hausdorff dimension. Can the factor $\log\log q$ be removed? Are these sets winning? What happens when they are intersected with a planar curve?
