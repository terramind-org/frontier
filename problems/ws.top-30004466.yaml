  \section{Maximum Excess Charge of Atoms}\label{30004466}
  {\small UnsolvedMath ID 30004466 · Mathematical Physics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For a Coulomb atom with nuclear charge $Z$, determine the largest number of electrons that can remain bound in a many-electron ground state. In particular, is the excess above $Z$ bounded by a universal constant independent of $Z$?
  \par\smallskip\textit{Formulation references:} \sref{30004466}{1}, \sref{30004466}{2}.
  \subsection{Short English statement}
  For a Coulomb atom with nuclear charge $Z$, determine the largest number of electrons that can remain bound in a many-electron ground state. In particular, is the excess above $Z$ bounded by a universal constant independent of $Z$?
