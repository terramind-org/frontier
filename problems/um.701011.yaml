title: Kourovka Notebook Problem 14.26
field: mathematics
tier: prose
statement: |-
  A quasivariety ${\mathcal{M}}$ is {\it closed under
  direct ${\mathbb{Z}$-wreath products} if the direct wreath product
  $G\wr {\mathbb{Z}$ belongs to ${\mathcal{M}}$ for every $G\in {\mathcal{M}}$ (here
  ${\mathbb{Z}$ is an infinite cyclic group). Is the quasivariety
  generated by the class of all nilpotent torsion-free groups closed
  under direct ${\mathbb{Z}$-wreath products?
