title: Problem 5.25 — (Presentation for level L structures).
field: mathematics
tier: prose
statement: "(Presentation for level L structures). Give an explicit finite presentation for Modg[L]. Once one has such a presentation, it seems likely that it would fit well into the framework of Pitsch’s proof [ Pi] that rank( H2(Modg,1, Z))≤ 1 for g≥ 4. Note that Pitsch’s proof was extended to punctured and bordered case by Korkmaz-Stipsicsz; see [ Ko]. What Pitsch does is to begin with an explicit, finite presentation of Mod g,1, and then to apply Hopf’s formula for groups Γ presented as the quotient of a free group F by the normal closure R of the relators: H2(Γ, Z) = R∩ [F,F ] [F,R ] (17) In other words, elements of H2(Γ, Z) come precisely from commutators which are relators, except for the trivial ones. Amazingly, one needs only write the form of an arbitrary element of the numerator in (17), and a few tricks reduces the computation of (an upper bound for) space of solutions to computing the rank of an integer matrix. In our case this approach seems feasible, especially with computer computation, at least for small L. Of course one hopes to find a general pattern."
