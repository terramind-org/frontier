schema: 1
id: ellipticcurverank.ratellipticcurve.goldfeld-conjecture.variants.squarefree
title: "Some conjectures about ranks of elliptic curves over ℚ (variant: squarefree)"
field: mathematics
tier: proof
statement: |-
  Goldfeld's conjecture with $d$ restricted to squarefree integers, which is how it is usually
  stated informally: 50% of the quadratic twists of $E$ have rank $0$ and 50% have rank $1$. The
  twist $E^d$ only depends on the class of $d$ modulo nonzero rational squares, and the squarefree
  integers are a system of representatives of these classes. (They need not give pairwise
  non-isomorphic curves: if $B = 0$ then $E^{-d} = E^d$.)
ams:
  - 11
  - 14
tags:
  - wikipedia
  - variant
references:
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Rank_of_an_elliptic_curve
  - label: ICARM
    url: https://elliptic-rank.icarm.cloud/curve/273
source:
  name: formal-conjectures
  repo: https://github.com/google-deepmind/formal-conjectures
  commit: f606af160664c5a10952e9a957b100a1cd45bbeb
  path: FormalConjectures/Wikipedia/EllipticCurveRank.lean
  url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L221
  licence: Apache-2.0
upstream_status: open
lean:
  module: FormalConjectures.Wikipedia.EllipticCurveRank
  decl: EllipticCurveRank.RatEllipticCurve.goldfeld_conjecture.variants.squarefree
  statement: |-
    theorem goldfeld_conjecture.variants.squarefree (E : RatEllipticCurve) (r : ℕ)
        (hr : r = 0 ∨ r = 1) :
        atTop.Tendsto
          (fun H ↦ ({d ∈ twistIndexLE H | Squarefree d ∧ E.twistRank d = r}.ncard /
            {d ∈ twistIndexLE H | Squarefree d}.ncard : ℝ))
          (𝓝 (1 / 2))
  context:
    - open EllipticCurveRank
    - open EllipticCurveRank.RatEllipticCurve
    - open EllipticCurveRank.RatEllipticCurve.goldfeld_conjecture
    - open EllipticCurveRank.RatEllipticCurve.goldfeld_conjecture.variants
    - open Module (finrank)
    - open WeierstrassCurve
    - open scoped Topology
    - open Filter (atTop)
  definitions:
    - name: EllipticCurveRank.RatEllipticCurve
      kind: structure
      text: |-
        /-- A data structure representing isomoprhism classes of elliptic curves over ℚ.
        Every elliptic curve over ℚ is isomorphic to one with Weierstrass equation `y² = x³ + Ax + B`,
        and the pair `(A,B)` is unique if it satisfy the `reduced` condition below.
        See Section 5.1 in [PPVW2016]. -/
        structure RatEllipticCurve : Type where
          A : ℤ
          B : ℤ
          reduced (p : ℕ) : p.Prime → ¬ ((p ^ 4 : ℤ) ∣ A ∧ (p ^ 6 : ℤ) ∣ B)
          Δ_ne_zero : 4 * A ^ 3 + 27 * B ^ 2 ≠ 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L46
    - name: EllipticCurveRank.RatEllipticCurve.twistRank
      kind: abbrev
      text: |-
        /-- The rank of the quadratic twist $E^d$ of an elliptic curve $E$ over $\mathbb{Q}$. -/
        noncomputable abbrev twistRank (E : RatEllipticCurve) (d : ℤ) : ℕ :=
          finrank ℤ (E.quadraticTwist d).Point
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L166
    - name: EllipticCurveRank.RatEllipticCurve.twistIndexLE
      kind: def
      text: |-
        /-- The set of nonzero integers $d$ with $|d| \leq H$, which index the quadratic twists $E^d$
        ordered by $|d|$. By `naiveHeight_quadraticTwist` this is the same as ordering them by height. -/
        def twistIndexLE (H : ℕ) : Set ℤ := {d : ℤ | d ≠ 0 ∧ |d| ≤ (H : ℤ)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L170
