lean:
  module: FormalConjectures.Wikipedia.EllipticCurveRank
  decl: EllipticCurveRank.RatEllipticCurve.goldfeld_conjecture.variants.squarefree
  statement: |-
    theorem goldfeld_conjecture.variants.squarefree (E : RatEllipticCurve) (r : ℕ)
        (hr : r = 0 ∨ r = 1) :
        atTop.Tendsto
          (fun H ↦ ({d ∈ twistIndexLE H | Squarefree d ∧ E.twistRank d = r}.ncard /
            {d ∈ twistIndexLE H | Squarefree d}.ncard : ℝ))
          (𝓝 (1 / 2))
