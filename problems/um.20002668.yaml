title: A one-sided diffuse cyclic amalgam criterion and an entropy-regularity obstruction
field: mathematics
tier: prose
statement: |-
  Inspection of pages 1–2 of the original PDF
  recovers the questions as follows.

  1. **Diffuse amalgamation.** Given free group factors $A,B$ with a common
     diffuse subalgebra $D\subset A,B$, what conditions on $A,B,D$ guarantee
     that
     \[
         A *_D B
     \]
     is a free group factor?

  2. **Weak rigidity and dimension.** For a regular weakly rigid (in the sense of
     Popa) subalgebra of a von Neumann algebra, is the free entropy dimension at
     most \(1\)?

  3. **Betti number versus microstates dimension.** If
     $\gamma _1,\ldots,\gamma _n\in\Gamma$ generate a group whose first
     $L^2$-Betti number $\beta _1^{(2)}(\Gamma)$ is large, must the
     microstates free entropy dimension of the corresponding group generators be
     large? The notes say that the nonmicrostates version was known through work
     of Mineyev–Shlyakhtenko.

  The symbols printed in the PDF are $A *_D B$ and
  $\beta _1^{(2)}(\Gamma)$. Thus this record really does contain three questions rather
  than one question with two numbered subparts.

  For the third question this report uses $\delta _0$ for Voiculescu’s modified
  microstates free entropy dimension. For group unitaries this means the dimension
  of the self-adjoint real-and-imaginary-parts tuple. The symbols
  $\delta ^*$ and $\delta ^\star$ denote the two nonmicrostates variants; they
  are not silently identified with $\delta _0$.
