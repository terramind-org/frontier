title: Collected Problems in Operator Algebras and Quantum Information
field: mathematics
tier: prose
statement: |-
  Resolve the following problems.

  1. Find deterministic unitaries $U_1,\ldots,U_k\in M_n(\mathbb C)$ and constants $C>0$ and $k>\exp(2C^2)$ such that

  $$\left\lVert\sum_{i\ne j}a_{ij}U_iU_j^*\right\rVert\leq C\left(\sum_{i\ne j}\lvert a_{ij}\rvert^2\right)^{1/2}$$

  for every coefficient matrix $(a_{ij})$.

  2. For a compact-quantum-group algebra $A$, is the property that every $\pi$–$\varepsilon$ cocycle extends to a Schürmann triple equivalent to $H^2(A,{}_{\varepsilon}\mathbb C_{\varepsilon})=0$?

  3. Extend the Haagerup reduction theorem to type III Orlicz spaces.

  4. For positive states $\varphi,\psi$, set $\delta(\varphi,\psi)=H((\varphi+\psi)/2)-(H(\varphi)+H(\psi))/2$. Is

  $$\lvert\varphi-\psi\rvert(A)\leq\left(8\delta(\varphi,\psi)(\varphi+\psi)(A^2)\right)^{1/2}$$

  for every positive operator $A$? For every completely positive trace-preserving map $T$ and density matrix $\varphi$, is

  $$1-\lVert T(\varphi^{1/2})\rVert_2^2\leq4\bigl(H(T\varphi)-H(\varphi)\bigr)?$$

  5. In $\operatorname{VN}(F_2)$, is an automorphism able to map the generator masa $\{a\}''$ to the radial masa $\{a+a^{-1}+b+b^{-1}\}''$? Does a masa free from the radial masa exist?
