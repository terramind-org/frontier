title: Split integral Kirwan surjectivity for smooth compact toric reductions
field: mathematics
tier: prose
statement: |-
  Let a compact connected torus \(T\) act linearly and Hamiltonianly on \(\mathbb C^n\). At a regular value \(\alpha\), suppose the level \(Z=\mu^{-1}(\alpha)\) is compact and \(T\) acts freely, so that \(X=Z/T\) is a smooth compact toric manifold. Is the integral Kirwan map
  \[
  \kappa_{\mathbb Z}:H_T^*(\mathbb C^n;\mathbb Z)
  \cong H^*(BT;\mathbb Z)
  \longrightarrow H^*(X;\mathbb Z)
  \]
  surjective? How far does this extend beyond the smooth compact free case?
