field: mathematics
tier: prose
statement: |-
  b)
  (P. Hall). Prove or refute the following conjecture:
  If the marginal subgroup $v^*G$ has finite index $m$ in $G$,
  then the order of $vG$ is finite and divides a power of $m$.

  *Editors' comment:* There are examples when $|vG|$ does not divide a power of $m$
  (Yu. G. Kleiman, *Trans. Moscow Math. Soc.*, **1983**,
  no. 2, 63--110), but the question of finiteness remains open.

  [Archived solved part(s) of 2.45:]
  (P. Hall). Prove or refute the following conjectures:

  a) If a word $v$ takes only finitely many values in a group $G$,
  then the verbal subgroup $vG$ is finite.

  c) If $G$ satisfies the maximum condition and $vG$ is finite,
  then $v^*G$ has finite index in $G$.
