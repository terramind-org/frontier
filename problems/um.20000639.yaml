title: Prime-level direct delta solution and an exponent-transfer lemma
field: mathematics
tier: prose
statement: |-
  **Recovered standard reading.** Let \(f\) be a primitive holomorphic or Maass \(GL(2)\) newform of level \(q\to\infty\), with fixed archimedean parameter. Prove, by a direct delta-symbol argument rather than a spectral moment average, that

  \[
  L(1/2,f)\ll_{\varepsilon,f_\infty} C(f)^{1/4-\delta+\varepsilon}
  \]

  for some \(\delta>0\), where \(C(f)\) is the analytic conductor.
