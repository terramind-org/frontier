title: Coherence and Finiteness Properties of Surface-Bundle Groups
field: mathematics
tier: prose
statement: Let $E$ be the total space of a bundle with closed-surface base $B$ and fiber $F$, and let $\pi=\pi_1(E)$. Is $\pi$ coherent? Does every finitely presented subgroup $G\leq\pi$ admit a finite $K(G,1)$? More generally, is every subgroup of type $\mathrm{FP}^{\lfloor n/2\rfloor}$ of a $\mathrm{PD}^n$ group necessarily of type FP?
