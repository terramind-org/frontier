title: Quantitative Rigidity for Aviles–Giga Differential Inclusions
field: mathematics
tier: prose
statement: |-
  Do there exist constants $C>0$ and $\alpha\in(0,1)$ such that every $w\in H^1(B_1;\mathbb R^2)$ satisfies

  $$\inf_{A\in K}\int_{B_{1/2}}|Dw-A|^2\,dx\leq C\left(\int_{B_1}\operatorname{dist}^2(Dw,K)\,dx\right)^\alpha?$$

  This asks for a quantitative rigidity estimate for the differential inclusion.
