title: Nonnegative Square Decompositions of Bipartite Determinant Differences
field: mathematics
tier: prose
statement: Let $G$ be bipartite with parts $X=[n]$ and $Y$, set $X_S=|\{y\in Y:N(y)=S\}|$ for nonempty $S\subseteq[n]$, and define $M$ by $$M_{ii}=\sum_{S:i\in S}X_S,\qquad M_{ij}=\sum_{S:i\in S,\,j\notin S}\frac{X_S}{|S|}\quad(i\neq j)$$. Is there an identity $$\det(\operatorname{diag}M)-\det M=\sum_\mu c_\mu x^\mu+\sum_{\mu,\nu}c_{\mu\nu}(x^\mu-x^\nu)^2$$ in which $x^\mu$ and $x^\nu$ are monomials in the variables $X_S$ and all coefficients $c_\mu,c_{\mu\nu}$ are nonnegative?
