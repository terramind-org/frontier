title: Least Dimension for Curvature-Finiteness Counterexamples
field: mathematics
tier: prose
statement: What is the least dimension $n$ for which there are infinitely many pairwise homotopy-equivalent but mutually nonhomeomorphic closed simply connected $n$-manifolds admitting Riemannian metrics with $0\leq\operatorname{sec}\leq1$, positive Ricci curvature, and diameter bounded by a constant depending only on $n$?
