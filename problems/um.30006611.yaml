title: Wall Structures on Symmetric-Group Cayley Graphs
field: mathematics
tier: prose
statement: Does there exist a sequence of generating sets $X_n$ for $S_n$, of uniformly bounded size, such that the Cayley graphs $\operatorname{Cay}(S_n,X_n)$ admit wall structures whose wall metrics are uniformly coarsely equivalent to their word metrics?
