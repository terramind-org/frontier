lean:
  module: FormalConjectures.ErdosProblems.«473»
  decl: Erdos473.erdos_473.variants.finite
  statement: |-
    theorem erdos_473.variants.finite :
        ∀ n : ℕ, 2 ≤ n → ∃ a : Fin n ≃ Fin n, ∀ k : Fin n, ∀ h : k.val + 1 < n,
          ((a k).val + 1 + ((a ⟨k.val + 1, h⟩).val + 1)).Prime
