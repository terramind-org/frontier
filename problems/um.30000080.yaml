title: Powers of Linearly Presented Primary Ideals
field: mathematics
tier: prose
statement: If $I$ is a homogeneous $\mathfrak m$-primary ideal in $S=K[x_1,\ldots,x_n]$, generated in one degree $d$ and linearly presented, must $I^{n-1}=\mathfrak m^{(n-1)d}$?
