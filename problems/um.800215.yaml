title: Several Complex Variables Problem List — Problem 11
field: mathematics
tier: prose
statement: |-
  Let $K^{compact} \subset X \backslash \lbrace 0 \rbrace$, $X$ as above,
  $0 \in \hat{K}$, the polynomially convex hull of $K$. Suppose that $L \subset X$,
  $L$ contains a neighborhood of $K$ in $X$. Does $\hat{L}$ contain a neighborhood
  of $0$ in $X$? (This is equivalent to the previous problem.)\\
