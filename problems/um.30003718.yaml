title: Multiscale Principal Flows on Riemannian Manifolds
field: mathematics
tier: prose
statement: For principal flows on Riemannian manifolds, can a scale parameter describe a flow that dies out, and is extra regularization needed to prevent self-intersection or winding? Can persistence diagrams of the Fréchet potential detect local means at different scales, can one scale encode both starting points and local covariance, and are there canonical higher-dimensional principal submanifolds?
