title: Moments of Quadratic L-Functions over Function Fields
field: mathematics
tier: prose
statement: Let $q$ be an odd prime power. For every integer $k\geq1$, prove that there is an explicit polynomial $R_{k,q}$ of degree $k(k+1)/2$ such that $q^{-(2g+1)}\sum_{d}L(1/2,\chi_d)^k=R_{k,q}(g)+o(1)$ as $g\to\infty$, where the sum is over monic squarefree $d\in\mathbb{F}_q[t]$ of degree $2g+1$.
