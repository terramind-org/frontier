title: A finite height-kernel case of the quasiconvex-subgroup conjecture
field: mathematics
tier: prose
statement: |-
  A subgroup \(F\) of a group \(G\) is a *semi-fibre* if there exists an injective non-surjective homomorphism \(\varphi:F\to F\) such that \(G\) is the HNN extension \(G=F*_{\varphi}\). A subgroup \(F\) of \(G\) is a *virtual semi-fibre* if there exists a finite-index subgroup \(G'\) of \(G\) such that \(F\) is a semi-fibre of \(G'\).

  Let \(G\) be a hyperbolic free-by-cyclic group and \(H\) a non-quasiconvex subgroup of \(G\). Then \(H\) contains a subgroup \(F\) which is a virtual fibre or a virtual semi-fibre of a free-by-cyclic subgroup of \(G\).

  Its statement is:

  There are two source issues that matter mathematically.

  The AIM workshop report instead formulates the motivating problem for a **distorted** subgroup, and the later precise formulation in Linton's Conjecture 1.3 explicitly assumes that \(H\) is finitely generated. In a hyperbolic group, quasiconvex subgroups are finitely generated, so every infinitely generated subgroup is automatically non-quasiconvex. Thus omitting finite generation makes the literal statement substantially stronger, not merely stylistically different. All results below are stated for the intended finitely generated reading; no claim is made that the literal unrestricted statement is false.

  The partial theorem below uses the still narrower atoroidal fully irreducible case exactly where an existing quasiconvexity theorem is needed. The height-kernel lemma itself has no irreducibility hypothesis.

  Write
  \[
    G=F_n\rtimes_{\phi}\langle t\rangle,
    \qquad p:G\longrightarrow \mathbb Z,
  \]
  where \(p(t)=1\) and \(p(F_n)=0\). For \(H\leq G\), its **height kernel** is
  \[
    K_H=H\cap F_n=\ker(p|_H). \]
