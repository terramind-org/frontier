title: Moments of L-functions — Moments of the Riemann zeta function — Problem 16
field: mathematics
tier: prose
statement: |-
  Heath-Brown proved the famous Weyl-strength twelfth moment bound
  \[\int_{0}^{T} \left|\zeta\left(\frac{1}{2}+it\right)\right|^{12} dt \ll_{\varepsilon} T^{2 + \varepsilon}\]
  for the Riemann zeta function. Jutila generalised this to prove an analogous result for the sixth moment in the $t$-aspect of $L(1/2 + it,f)$, where $f$ is a Hecke--Maass cusp form. Recently, Milicevic-White and Nunes have independently proven complementary results on the twelfth moment of Dirichlet $L$-functions in the level aspect. Can one also prove analogous bounds for the sixth moment of $L(1/2,f \otimes \chi)$?\\
  (Peter Humphries, Virginia)
