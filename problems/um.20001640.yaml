title: Audit of candidate Out(F_N) complexes and abelian edge-rank collapse
field: mathematics
tier: prose
statement: |-
  **Problem 1.2.** Do various candidate complexes satisfy the conditions of Problem 1.1—namely, constructing a $\delta$-hyperbolic graph with an $\operatorname{Out}(F_n)$-action such that: (1) every irreducible-with-irreducible-powers (iwip) outer automorphism $\gamma$ has positive translation distance ($|\gamma| > 0$); (2) polynomially growing $\gamma$ are elliptic ($|\gamma| = 0$); (3) the construction is natural and useful; (4) the local structure permits inductive arguments; and (5) the graph is highly connected with highly connected links?

  Specifically, investigate these properties for the following candidate complexes:
  1. the free-factor complex;
  2. the free-splitting complex (with trivial edge groups), quasi-isometric to the sphere complex;
  3. variants of splitting complexes allowing non-trivial edge groups, such as splittings over $\mathbb{Z}^r$ or splittings of rank less than $k$;
  4. a poset of commensurability classes of abelian subgroups consisting of linearly growing automorphisms; and
  5. the Kapovich--Lustig graph.
