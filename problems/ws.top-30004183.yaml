  \section{Arnold Fixed Point Bound by Cup Length}\label{30004183}
  {\small UnsolvedMath ID 30004183 · Topology}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Does every Hamiltonian diffeomorphism of a closed connected symplectic manifold $M$ have at least $\operatorname{cl}(M)$ fixed points, where $\operatorname{cl}(M)$ denotes its cup length?
  \par\smallskip\textit{Formulation references:} \sref{30004183}{1}, \sref{30004183}{2}.
