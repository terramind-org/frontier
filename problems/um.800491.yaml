title: Billiards and Quantitative Symplectic Geometry — Bernhard Albach, Umberto Hryniewicz, and Alexandru Oancea — Problem 4
field: mathematics
tier: prose
statement: |-
  **Problem 3.** Is it true that for a Hamiltonian diffeomorphism on $\mathbf{C}P^n$ with infinitely many periodic orbits the inequality $\liminf_{T\to+\infty} \frac{\log P(T)}{\log T} \geq 2$ holds?

  In low-dimensions, integrable Hamiltonian systems indicate that quadratic growth should be sharp. To justify this, if one would count invariant tori foliated by periodic orbits or isolated closed geodesics on a closed Riemannian $2$-sphere of revolution, instead of only closed geodesics, then it is simple to present examples where the growth is exactly quadratic. One would conjecture that it is possible to perturb such a system to get existence of systems with exact quadratic growth of periodic orbits. The corresponding statement is also expected to be true for integrable annulus maps, as pointed out by Gerhard Knieper. The construction of such a perturbation is not trivial and can potentially be a very difficult task.

  The question that we are asking in higher dimensions is to be understood in the context of the question asked by Hofer and Zehnder in [HZ, p. 263], whether every Hamiltonian map on a compact symplectic manifold $(M,\omega)$ possessing more fixed points than necessarily required by the Arnold conjecture possesses always infinitely many periodic orbits. This question came to be known as the Hofer-Zehnder conjecture.

  Shelukhin proved this conjecture in [Shelukhin] for closed monotone symplectic manifolds with semi-simple even-dimensional quantum homology ring, a class that includes complex projective spaces. His proof provides the estimate $\liminf_{T\to+\infty} P(T) \frac{\log T}{T}>0$, i.e., the growth rate of the number of periodic points is at least the growth rate of the prime numbers, just like in [Hingston1993].

  Ginzburg and G\"urel interpreted more broadly the question of Hofer and Zehnder, in the sense that the existence of a fixed point not strictly required by Floer theory forces the existence of infinitely many periodic points, for example the existence of a hyperbolic fixed point [Ginzburg-Gurel2014], or the existence of a non-contractible fixed point [Gurel2013,Ginzburg-Gurel2016]. Notably, the estimate $\liminf_{T\to+\infty} P(T) \frac{\log T}{T}>0$ is already proved by G\"urel in [Gurel2013]. One could venture to ask whether quadratic growth holds in such cases as well.
