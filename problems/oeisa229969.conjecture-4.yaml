lean:
  module: FormalConjectures.OEIS.«229969»
  decl: OeisA229969.conjecture_4
  statement: |-
    theorem conjecture_4 (n : ℕ) (hn : n > 4) :
        ∃ x y z : ℕ, 0 < y ∧ 0 < z ∧ x + y + z = n ∧
          (x = 3 ∨ x = 6) ∧
          (2 * y + 1).Prime ∧ (2 * x * y * z - 1).Prime ∧ (2 * x * y * z + 1).Prime
  context:
    - open OeisA229969
  definitions: []
