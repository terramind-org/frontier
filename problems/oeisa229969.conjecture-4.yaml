id: oeisa229969.conjecture-4
title: Ways to write $n = x + y + z$ with six linear and quadratic forms prime (conjecture_4)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): Each integer $n > 4$ can be written as $x + y + z$ with $x = 3$ or $6$ such that
  $2y+1, 2xyz-1$ and $2xyz+1$ are prime.
  - _Zhi-Wei Sun_
