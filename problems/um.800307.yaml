title: Group Actions on 1-Manifolds — Question 24
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finitely-generated group of $C^1$ circle diffeomorphisms. Suppose that
  $G$ has no resilient pairs. Given $\varepsilon > 0$, can $G$ be conjugated (by a homeomorphism) into a group
  of Lipschitz homeomorphisms for which the Lipschitz constants of the generators are all $\leq e^{\varepsilon}$ ?
