title: Discrepancy Lower Bounds for Line Unions in Three Dimensions
field: mathematics
tier: prose
statement: |-
  For

  $$A=\bigcup_{i=1}^N(\ell_i\cap[0,1]^3),\qquad \ell_i\subset\mathbb R^3,$$

  and

  $$D_N(A)=\sup_Q\left|\frac{H^1(A\cap Q)}{H^1(A)}-H^3(Q)\right|,$$

  does there exist an absolute constant $c>0$ such that

  $$D_N(A)\geq c\frac{\log H^1(A)}{H^1(A)}$$

  for every such union of lines?
