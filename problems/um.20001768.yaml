title: Exact pair-overlap regime and an FCC-BCC crossing bracket for soft ball packings
field: mathematics
tier: prose
statement: |-
  **Phase transitions.** The best packing of hard spheres in
  \(\mathbb R^3\) is known to be achieved by the FCC lattice, while the
  thinnest covering is conjectured to be given by the BCC lattice. This
  implies that as \(\lambda\) is varied, for
  \(0<\lambda<\sqrt{5/3}-1\) we expect there to be an FCC--BCC
  transition.

  Describe the behavior of optimal arrangements of soft balls as
  \(\lambda\) varies.
