title: Multiple Minimal Surfaces in Riemannian Three-Spheres
field: mathematics
tier: prose
statement: Beyond the established positive-Ricci-curvature cases, does every closed Riemannian three-sphere contain at least four minimal two-spheres and five minimal tori? More generally, must it contain multiple minimal surfaces of every genus?
