title: Geometric Hydrodynamics in Open Problems — Problem 3
field: mathematics
tier: prose
statement: |-
  Describe the differential geometry (including computations of sectional and Ricci curvatures, conjugate points, etc.)
  for the right-invariant (source-wise) $L^2$-metric on the Lie groupoid of multiphase or generalized volume-preserving diffeomorphisms (analogous to Arnold's description of the differential geometry of the group $\mathscr{D}_\mu(M)$).
