title: Open Problems and Questions about Geodesics — Question 69
field: mathematics
tier: prose
statement: |-
  In the Finslerian case, the freedom of reconstructing metric from its geodesic can be much higher. For example, adding
  any sufficiently small closed 1-form to the Finsler metric
  does not change geodesics of this metric. This transformation of the metric was called a * trivial projective change* in [Matveev2013].

  *In dimension $\ge 3$, for a generic Finsler metric $F$, is any metric projectively equivalent to $F$
  locally proportional to a trivial projective change of the metric? *
