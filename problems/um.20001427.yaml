title: Gleason irreducibility and exact critical portraits
field: mathematics
tier: prose
statement: |-
  Irreducibility of Gleason polynomials

  Define the Gleason polynomials as the polynomials in \(c\) such that
  \(f_c(x)=x^2+c\) is post-critically finite.

  Are the Gleason polynomials irreducible?

  Is \(G_n\) irreducible over \(\mathbb Q\) for every \(n\geq1\)?
