  % UnsolvedMath ID 3100002; source catalogue code AMR-030-0002
  \setcounter{section}{3100001}
  \section{A set of points S is Euclidean Ramsey if, for every k, there exists an N so that every k-coloring of Euclidean N-space c}\label{3100002}
  {\small UnsolvedMath ID 3100002 · Combinatorics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Call a finite point set $S$ Euclidean Ramsey if, for every finite number of colors, some Euclidean dimension has the property that every coloring of the whole space contains a monochromatic isometric copy of $S$. Must every finite set that lies on a sphere be Euclidean Ramsey? The four-point subsets of a circle are included.
  \par\smallskip\textit{Formulation references:} \sref{3100002}{1}, \sref{3100002}{2}.
  \subsection{Short English statement}
