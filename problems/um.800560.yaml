title: Visibility Graphs of Points, Segments and Polygons — Problem 34
field: mathematics
tier: prose
statement: |-
  A *Hamiltonian cycle* is a cycle in an undirected graph which visits each vertex exactly once
  and also returns to the starting vertex. The Hamiltonian cycle problem is to determine whether a
  Hamiltonian cycle exists in a given graph $G$. Observe that $G$ may contain
  several Hamiltonian cycles, and $G$ may be visibility graph for a Hamiltonian cycle and is
  not a valid visibility graph for another Hamiltonian cycle in $G$.

  Given the visibility graph $G$ of a simple polygon $P$, determine the Hamiltonian cycle in $G$
  that corresponds to the boundary of $P$.
