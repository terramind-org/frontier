title: Selection Principles in Mathematics — Problem 6 ([pawlikowskireclaw])
field: mathematics
tier: prose
statement: |-
  Let $\mathcal{J}$ be a property of sets of reals.
  \emph{Borel's Conjecture for $\mathcal{J}$} is the statement ``All elements of $\mathcal{J}$ are countable''.
  For all but three of the properties in the Borel case, Borel's Conjecture is consistent.

  Is Borel's Conjecture for $\mathsf{S}_{\mathrm{fin}}(\mathrm{B},\mathrm{B})$ consistent?
