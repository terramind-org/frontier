title: Double Jordan Stratifications of Artinian Gorenstein Algebras
field: mathematics
tier: prose
statement: For an Artinian Gorenstein algebra and principal ideals $J,K$, can the double $Q_{J,K}$-stratification be redefined to have the expected dimensions while retaining its relation to the single-ideal $Q_J(a)$- and $Q_K(a)$-stratifications? Can the $Q_{\ell,m}$-decomposition define a Jordan order type for nongraded Artinian Gorenstein algebras? Do combinatorial invariants of the poset determine the $Q_{x,y}$-decomposition for a binomial, including for variables of different degrees or for three variables?
