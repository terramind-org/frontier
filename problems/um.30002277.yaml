title: Optimal SVD-Based Space–Time Focusing Signals
field: mathematics
tier: prose
statement: For a two-dimensional acoustic medium containing unknown point scatterers and an array of transducers, let $\phi_{\mathrm{sym}}(\omega)$ be the phase selected by a symmetric singular-value decomposition of the frequency-domain scattering operator for a simple singular value. Does the associated superposition of time-harmonic input signals optimally concentrate acoustic energy in space and time near the selected scatterer?
