title: "Henon Maps: Open Problems — Problem 35"
field: mathematics
tier: prose
statement: |-
  Show that $\mu_\phi$ satisfies the CLT for H\"older continuous observables. Namely, prove that, for any H\"older continuous observable $g$, there exists $\sigma \geq 0$ such that for any interval $I \subset \mathbb{R}$, we have
  \[
  \lim_{n\to \infty} \mu_\phi \left(\left\{
  \frac{S_n (g) - n\langle \mu_\phi,g\rangle }{\sqrt{n} } \in I
  \right\}\right)
  =
  \begin{cases}
  1 \mbox{ when } I \mbox{ is of the form } I=(-\delta,\delta) & \mbox{ if } \sigma^2=0,\\
  \frac{1}{\sqrt{2\pi\sigma^2}}\displaystyle\int_I e^{-t^2 / (2\sigma^2)} \mathrm{d}t & \mbox{ if }
  \sigma^2 >0.
  \end{cases} \]
