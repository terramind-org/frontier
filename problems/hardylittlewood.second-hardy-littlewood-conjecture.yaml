schema: 1
id: hardylittlewood.second-hardy-littlewood-conjecture
title: First Hardy–Littlewood conjecture (second_hardy_littlewood_conjecture)
field: mathematics
tier: proof
statement: |-
  For integers $x, y \geq 2$,
  $$
    \pi(x + y) \leq \pi(x) + \pi(y),
  $$
  where $\pi(z)$ denotes the prime-counting function, giving the number of primes up to
  and including $z$.
