title: Cyclotomic Quiver-Hecke Categorification of Highest-Weight Modules
field: mathematics
tier: prose
statement: |-
  For a symmetrizable Kac–Moody algebra $\mathfrak g$ and dominant integral weight $\Lambda$, is there an isomorphism of $U_q(\mathfrak g)$-modules

  $$\mathbb Q(q)\otimes K^\Lambda(\Gamma)\cong V(\Lambda),$$

  where $K^\Lambda(\Gamma)$ is the Grothendieck group of graded finite-dimensional modules over the cyclotomic quiver Hecke algebra and simple modules correspond to the dual canonical basis?
