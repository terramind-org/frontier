title: Formal Group Models for Commuting p-Adic Power Series
field: mathematics
tier: prose
statement: Let $(f,u)$ be a pair of commuting stable power series over a $p$-adic field $K$, with $f$ noninvertible, $u$ invertible, and $f\not\equiv0\pmod{\mathfrak m_K}$. Does there exist a formal group $S$ such that $f$ and $u$ are semiconjugate to endomorphisms of $S$?
