title: Open Problems in Pluripotential Theory — Question 42
field: mathematics
tier: prose
statement: |-
  Do actually deals with more general flows which contain, as a particular case, the local version of the K\"ahler-Ricci flow. These flows can thus be run from a bounded plurisubharmonic initial data.
  The following question is natural, in view of the corresponding global results from [GZ13,DiNL14b]:

  [Guedj]
  Can one run the above complex Monge-Amp\`ere flow from an arbitrary plurisubharmonic function ?
