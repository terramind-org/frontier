title: Kourovka Notebook Problem 11.86
field: mathematics
tier: prose
statement: |-
  Does every group
  $G=\left< x_1,\ldots ,x_n\mid r_1=\cdots =r_m=1\right> $ possess,
  in a natural way, a homomorphic image $H=\left< x_1,\ldots
  ,x_n\mid s_1=\cdots =s_m=1\right> $

  a) such that $H$ is a torsion-free group?

  b) such that the integral group ring of $H$ is embeddable
  in a skew field?

  If the stronger assertion ``b'' is true, then
  this will give an explicit method of finding elements
  $x_{i_1},\ldots ,x_{i_{n-m}}$ which generate a free group in $G$.
  Such elements exist by N. S. Romanovskiĭ's theorem (*Algebra and Logic*, **16**, no. 1 (1977), 62--67).
