title: Linear-center effective cones and the vertical exceptional face
field: mathematics
tier: prose
statement: |-
  Let \(Z\subset \mathbb P^n\) be a smooth subvariety with
  \(1\leq \dim Z\leq n-2\). What is the effective cone of \(k\)-cycles
  \(\operatorname{Eff}_k(X)\)?

  Its mathematical
  prompt is:

  The immediately preceding sentences ask for the relationship
  between the effective cones of a variety and “its blowup,” and then discuss a
  positive-dimensional blowup center in \(\mathbb P^n\). Thus throughout this
  report the reconstructed meaning is

  \[
    X=\operatorname{Bl}_Z(\mathbb P^n),\qquad
    \pi:X\longrightarrow \mathbb P^n. \]

  This reconstruction is necessary and is not silently attributed to the source. The source remark proposes as first examples a small union of lines and
  low-degree, low-codimension complete intersections. A union of pairwise
  disjoint lines is a smooth disconnected center; a union of intersecting lines
  is singular and lies outside the displayed smooth-center hypothesis.

  Unless otherwise stated, varieties are over an algebraically closed field. The
  comparison with the complex literature is made over \(\mathbb C\). The
  linear-center calculation below is characteristic-independent.
