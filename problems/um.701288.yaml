title: Kourovka Notebook Problem 16.97
field: mathematics
tier: prose
statement: |-
  Let $G$ be a torsion-free group with all
  subgroups subnormal of defect at most $n$. Must $G$ then be
  nilpotent of class at most $n$? (This is known to be true for $n <
  5$).
