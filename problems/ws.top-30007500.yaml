statement: |-
  \section*{Elementary expansion for Grothendieck infinity-groupoids}\label{30007500}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every Grothendieck coherator C, every cellular C-infinity-groupoid X and every n-cell $a:D_n\to X$, is $X\to X\cup _{D_n}D_{n+1}$, attached along the source inclusion of the next globe, a weak equivalence?
  \subsection{Short English statement}
  For every Grothendieck coherator C, every cellular C-infinity-groupoid X and every n-cell $a:D_n\to X$, is $X\to X\cup _{D_n}D_{n+1}$, attached along the source inclusion of the next globe, a weak equivalence?
