title: If A is an invertible n x n matrix, is there always an n x n submatrix B of [A A] so that perm(B) is nonzero
field: mathematics
tier: prose
statement: "Kahn: If A is an invertible n x n matrix, is there always an n x n submatrix B of [A A] so that perm(B) is nonzero. The notation perm(B) means the permanent of B, which is the \"determinant without the signs\". This implies Jaeger's conjecture above. See this."
