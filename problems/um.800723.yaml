title: Open Problems on Central Simple Algebras — Problem 38
field: mathematics
tier: prose
statement: |-
  This problem is an extension of
  the inverse Galois problem, and is especially interesting for $F={\mathbb{Q}}$.
  It appears as part of Problem 5 in [Am:surv].

  The next problem, also known as the \emph{${\mathbb{Q}}$-admissibility conjecture},
  was first recognized in [Schacher:th1].

  Prove every Sylow-metacyclic group is ${\mathbb{Q}}$-admissible.
