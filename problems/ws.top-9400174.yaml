statement: |-
  \section{\texorpdfstring{Wikipedia number-theory item 174: For any given integers $k\geq 1, b\geq 2, c\neq 0$, with gcd(k, c) = 1 and gcd(b, c) = 1, are there…}{Wikipedia number-theory item 174: For any given integers k>= 1, b>= 2, cneq 0, with gcd(k, c) = 1 and gcd(b, c) = 1, are there…}}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Fix integers $k\ge1$, $b\ge2$ and $c\ne0$ with $\gcd(k,c)=\gcd(b,c)=1$, where greatest common divisors are positive. Put $d=\gcd(k+c,b-1)$ and $A_n=(kb^n+c)/d$ for $n\ge1$. Since $b\equiv1\pmod d$, every $A_n$ is an integer. A prime value means $A_n>1$ is prime. As written, the universal assertion has a counterexample: $k=78557$, $b=2$, $c=1$ meets all the hypotheses and has $d=1$, while every $A_n=78557\cdot2^n+1$ is composite because $78557$ is a Sierpi\'nski number. \sref{statement}{3}
  \paragraph{Statement recorded in the supplied source.}
  For every triple $(k,b,c)$ satisfying the displayed hypotheses, are there infinitely many $n\ge1$ for which $A_n$ is prime? The stated hypotheses alone do not imply this conclusion, as the displayed Sierpi\'nski counterexample shows. \sref{statement}{2}
  \subsection{Short English statement}
  Does every indicated exponential sequence have infinitely many prime values? The stated conditions allow a known sequence consisting entirely of composite values.
