title: Sharp radial regularity and the ambiguity of smooth cone decomposition
field: mathematics
tier: prose
statement: |-
  Let $u$ strictly convex with Dirichlet boundary conditions solve
  \[
  \det(u_{ij})=1+\delta_{x_0},
  \]
  then $u=\varphi+w$ for $\varphi$ smooth uniformly convex cone, and $w$ smooth.
