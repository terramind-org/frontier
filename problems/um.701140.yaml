title: Kourovka Notebook Problem 15.52
field: mathematics
tier: prose
statement: |-
  (Well-known problem). By a famous
  theorem of
  Wielandt the sequence $G_0=G, G_1,\ldots $, where $
  G_{i+1}=\mathrm{Aut }G_i$, stabilizes for any finite group $G$ with
  trivial centre. Does there exist a function $f$ of natural argument such
  that $|G_i|\leq
  f(|G|)$ for all $i=0, 1,\ldots $
  for an arbitrary finite group $G$ and the same kind of sequence?
