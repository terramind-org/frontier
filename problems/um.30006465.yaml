title: Difference Sets of Signed Representatives
field: mathematics
tier: prose
statement: Let $n\ge1$ and let $A\subseteq\{-n,\ldots,n\}\setminus\{0\}$ contain exactly one of $k$ and $-k$ for each $1\le k\le n$. Must $|(A-A)\cap[1,n]|=(1-o(1))n$? More strongly, for each $\varepsilon>0$ and every $B\subseteq[1,n]$ with $|B|\ge\varepsilon n$, must $\sum_{a,b\in A}\mathbf1_B(a-b)\gg_\varepsilon n^2$?
