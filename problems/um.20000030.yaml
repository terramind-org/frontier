title: A coefficient-ring shadow and coherence obstruction for the Pin(2)-Q8 Tate model
field: mathematics
tier: prose
statement: |-
  Equip \(\mathrm{Pin}(2)\) (resp. \(Q_8\)) with the canonical \(\mathbb Z/2\)-action (resp. the action given by conjugation by \(i\)). Then the \(E_\infty\)-map
  \[
  L^s(\mathbb Z)_{(2)}\longrightarrow L^n(\mathbb Z)
  \]
  can be identified by taking strict \(\mathbb Z/2\)-fixed points of the inclusion-induced map
  \[
  \mathbb Z_{(2)}^{t\mathrm{Pin}(2)}\longrightarrow \mathbb Z^{tQ_8}.
  \]

  This is Conjecture 2.9, “\(L\)-theory of integers,” from the AIM workshop *Equivariant techniques in stable homotopy theory* (October 2022).

  Write
  \[
   P=\mathrm{Pin}(2)=S^1\cup jS^1\subset \mathbb H^\times,
   \qquad Q=Q_8=\{\pm1,\pm i,\pm j,\pm k\},
  \]
  and let \(C=\langle\tau\rangle\cong C_2\) act by \(\alpha=c_i\), conjugation by \(i\). This fixes \(S^1\), sends \(jz\) to \(-jz\), has order two because \(i^2=-1\) is central, and restricts to the stated action on \(Q\). For an extension \(1\to K\to K\rtimes_\alpha C\to C\to1\), the parametrized Tate construction produces a genuine \(C\)-spectrum whose underlying spectrum is the ordinary \(K\)-Tate construction. “Strict fixed points” is interpreted as derived categorical fixed points of this genuine spectrum, not geometric fixed points and not Borel homotopy fixed points. This is the interpretation on which the results below are conditional if the source intended a different model.
