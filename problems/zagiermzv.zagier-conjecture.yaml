lean:
  module: FormalConjectures.Paper.ZagierMZV
  decl: ZagierMZV.zagier_conjecture
  statement: |-
    theorem zagier_conjecture :
        ∀ n : ℕ, Module.finrank ℚ (mzvSpanOfWeight n) = zagierDim n
  context:
    - open ZagierMZV
    - open Finset BigOperators
  definitions:
    - name: ZagierMZV.mzvSpanOfWeight
      kind: def
      text: |-
        /-- The $\mathbb{Q}$-submodule of $\mathbb{R}$ spanned by all MZVs of weight $n$. -/
        noncomputable def mzvSpanOfWeight (n : ℕ) : Submodule ℚ ℝ :=
          Submodule.span ℚ (mzvSetOfWeight n)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Paper/ZagierMZV.lean#L75
    - name: ZagierMZV.zagierDim
      kind: def
      text: |-
        /--
        The conjectured Zagier dimension sequence $d_n$, defined by $d_0 = 1$, $d_1 = 0$, $d_2 = 1$,
        and $d_n = d_{n-2} + d_{n-3}$ for $n \geq 3$.
        -/
        def zagierDim : ℕ → ℕ
          | 0 => 1
          | 1 => 0
          | 2 => 1
          | (n + 3) => zagierDim (n + 1) + zagierDim n
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Paper/ZagierMZV.lean#L79
