  decl: OeisA232194.conjecture_5
  statement: |-
    theorem conjecture_5 (n : ℕ) (hn : n > 1) (hne : n ≠ 8) :
        ∃ x y : ℕ, 0 < x ∧ 0 < y ∧ x + y = n ∧ (x ^ 4 + n * y).Prime
