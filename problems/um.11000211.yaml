title: Problem 4 — (Characterization of Veech surfaces).
field: mathematics
tier: prose
statement: (Characterization of Veech surfaces). Characterize all Veech surfaces (for each stratum of each genus). This problem is trivial in genus one; in genus two K. Calta [ Ca] and C. McMullen [ McM2] have provided solutions. In the papers [ KnSm] and Puchta [ Pu] the acute rational billiard triangles that give rise to Veech surfaces were classified. In [ SmW e] there is a criterion for a surface ( X,ω ) to be a Veech surface that is given in terms of the areas of triangles embedded in (X,ω ).
