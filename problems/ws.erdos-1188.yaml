title: "Erdős Problem #1188"
field: mathematics
tier: prose
statement: A distinct covering system consists of residue classes $a_i\pmod{n_i}$ with distinct integers $1<n_1<\cdots<n_k$, whose union covers $\mathbb Z$. It is minimal when deleting any nonempty collection of its classes destroys that covering property. Let $F(x)$ count these minimal systems whose moduli are at most $x$. Determine the growth of $F(x)$.
