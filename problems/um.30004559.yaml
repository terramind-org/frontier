statement: For every monomer fugacity $z>0$, does the collection $\mathcal C$ of boundary-touching curves in the free-boundary dimer model on the upper half-plane converge in the scaling limit to $\operatorname{ALE}_{-\lambda,\lambda}$, with loops conditionally independent and distributed as $\operatorname{CLE}_4$ in the connected components of its complement?
