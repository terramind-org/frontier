title: Simplex cavities and vacant percolation thresholds
field: mathematics
tier: prose
statement: |-
  **Percolation**

  Maximal density packings have connected interstices in dimensions greater than 2. Is there a critical $\lambda$ such that optimal soft packings have path connected interstices? What about the existence of an infinite component?

  The path connected part of this question can be addressed by considering the circumcenters of the faces of the regular simplex of the appropriate dimension.
