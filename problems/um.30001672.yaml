title: High Influence Small Sets in Boolean Functions
field: mathematics
tier: prose
statement: Let $f:\{0,1\}^n\to\{0,1\}$ be a Boolean function, and call the probability that $f$ remains undetermined after randomly assigning variables outside $S$ the influence of $S$. If the expectation of $f$ is bounded away from 0 and 1, is there a set $S$ with $|S|\leq n/3$ and influence at least $1-c^n$ for some absolute constant $0<c<1$?
