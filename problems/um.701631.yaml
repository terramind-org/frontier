title: Kourovka Notebook Problem 19.83
field: mathematics
tier: prose
statement: |-
  An element $g$ of a group $G$ is almost Engel if there is a finite set ${\mathscr E}(g)$ such that for every $x\in G$ all sufficiently long commutators $[x, {}_n g]$ belong to ${\mathscr E}(g)$, that is, for every $x\in G$ there is a positive integer $n(x,g)$ such that $[x, {}_n g]\in {\mathscr E}(g)$ whenever $n\geq n(x,g)$. By a linear group we understand a subgroup of $GL(m,F)$ for some field $F$ and a positive integer $m$.

  Is the set of almost Engel elements in a linear group always a subgroup?
