title: Possible $L^{2}-Betti$ Numbers of a Fixed Group
field: mathematics
tier: prose
statement: For a countable discrete group $G$, determine the set $$\mathcal C(G)=\left\{\dim_{\mathcal N(G)}\ker T:k\geq1,\ T\in M_k(\mathbb QG)\right\}$$ of possible $L^2$-Betti numbers arising from matrices over its rational group ring.
