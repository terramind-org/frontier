title: Question 4.9 — Does there exist a cocompact Fuchsian subgroup of ∆5 that misses the com- pactification locus?
field: mathematics
tier: prose
statement: Does there exist a cocompact Fuchsian subgroup of ∆5 that misses the com- pactification locus? Given such a Fuchsian subgroup F <∆5, Agol produces a purely pseudo-Anosov subgroup in some Γ g using a branched cover construction. 4.4. One generalization of looking for surface subgroups of Γ g is to look for injections of (cocompact) lattices in Lie groups into Γ g. If the lattices are superrigid the image of such a lattice in Γ g is necessarily finite (see [ 12] and [ 43]), and so it follows (cf. Theorem 2 of [ 43]), that the only lattices that can admit a faithful representation (or even an infinite representation) into Γ g are lattices in SO( m, 1), m≥ 2 or SU( q, 1), q≥ 1. Indeed, since solvable subgroups of Γ g are virtually abelian [ 4], this observation also excludes non-cocompact lattices of SU( q, 1) for q≥ 2 from injecting. In addition, there is a simple obstruction to injecting certain of these lattices, or indeed for any group. Namely if a finitely generated group G admits an injection into Γ g, then vcd(G)≤ vcd(Γg) (see [ 5]). If the vcd of a group G satisfies the above inequality, then we call G admissable. The vcd’s of the groups Γ g are known to be 4 g− 5 when g≥ 2 [ 16]. Motivated by this discussion we pose.
