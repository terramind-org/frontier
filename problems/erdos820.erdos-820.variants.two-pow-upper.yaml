lean:
  module: FormalConjectures.ErdosProblems.«820»
  decl: Erdos820.erdos_820.variants.two_pow_upper
  statement: |-
    theorem erdos_820.variants.two_pow_upper :
        ∃ c > (0 : ℝ), ∀ ε > (0 : ℝ), ∀ᶠ n : ℕ in atTop,
          (K n : ℝ) < Real.exp ((n : ℝ) ^ ((c + ε) / Real.log (Real.log (n : ℝ))))
  context:
    - open Erdos820
    - open Erdos820.erdos_820
    - open Erdos820.erdos_820.variants
    - open Filter
  definitions:
    - name: Erdos820.K
      kind: def
      text: |-
        /-- $K(n)$ is the smallest integer $k \geq 2$ such that $(k^n-1, 2^n-1) = 1$. As for
        `Erdos820.H`, smaller $k$ are excluded because they give degenerate values.

        For $n \geq 2$ the value $k = 2$ never works, and $k = 2^n - 1$ always works. For $n = 1$ we
        get $K(1) = 2$, and for $n = 0$ the set is empty, so `K 0 = 0`. -/
        noncomputable def K (n : ℕ) : ℕ :=
          sInf {k : ℕ | 2 ≤ k ∧ Nat.Coprime (k ^ n - 1) (2 ^ n - 1)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/ErdosProblems/820.lean#L50
