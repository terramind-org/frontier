title: Nonvanishing Euler Classes in Topological Bordism
field: mathematics
tier: prose
statement: Let $G$ be a finite abelian $p$-group for an odd prime $p$, and let $V$ be a complex $G$-representation with no trivial direct summand. Is the Euler class of $V$ nonzero in topological bordism theory?
