id: um.30001795
title: Soficity, Hyperlinearity, and Surjunctivity of Major Group Classes
field: mathematics
tier: prose
statement: Determine whether Thompson's group $F$, one-relator groups, Burnside groups, Burger–Mozes groups, Gromov monster groups, word-hyperbolic groups, and random finitely presented groups are sofic or hyperlinear. If $G_1$ and $G_2$ are sofic or hyperlinear and a residually finite group $K$ embeds in both, must $G_1*_K G_2$ also be sofic or hyperlinear? If finitely generated groups $G_1$ and $G_2$ are surjunctive, must $G_1\times G_2$ and $G_1*G_2$ be surjunctive? Classify the sofic approximations of a direct product of two nonabelian free groups.
