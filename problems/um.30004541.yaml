statement: For the continuous-time Derrida–Retaux process with initial distribution $\mu_0$ on $\mathbb R_+$, find necessary and sufficient conditions on $\mu_0$ for $F_\infty(\mu_0)=0$. Does $F_\infty(\mu_0)=0$ imply that $X_t\to0$ in probability as $t\to\infty$?
