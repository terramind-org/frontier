lean:
  module: FormalConjectures.Wikipedia.EllipticDivisibilitySequence
  decl: EllipticDivisibilitySequence.einsiedler_everest_ward_finite_primes
  statement: |-
    theorem einsiedler_everest_ward_finite_primes :
        ∀ W : ℤ → ℤ,
          IsNonsingularEDS W →
          (∀ n : ℤ, n ≠ 0 → W n ≠ 0) →
          {n : ℕ | 1 ≤ n ∧ (W n).natAbs.Prime}.Finite
  context:
    - open EllipticDivisibilitySequence
  definitions:
    - name: EllipticDivisibilitySequence.IsNonsingularEDS
      kind: def
      text: |-
        /-- `W : ℤ → ℤ` is a normalized nonsingular elliptic divisibility sequence: it satisfies
        `IsEllipticDvdSequence W` with `W 1 = 1` and evaluates the division polynomials `E.ψ n` at an
        affine rational point on a nonsingular curve `E : WeierstrassCurve ℚ` (`E.Δ ≠ 0`). -/
        def IsNonsingularEDS (W : ℤ → ℤ) : Prop :=
          IsEllipticDvdSequence W ∧
          W 1 = 1 ∧
          ∃ (E : WeierstrassCurve ℚ) (x y : ℚ),
            E.Δ ≠ 0 ∧ E.toAffine.Equation x y ∧
            ∀ n : ℤ, (W n : ℚ) = (E.ψ n).evalEval x y
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/EllipticDivisibilitySequence.lean#L49
