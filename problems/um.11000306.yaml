title: Problem 3.3 — Let ug denote the graded Lie algebra associated to the prounipotent radical of the relative Malcev completion of Ig d…
field: mathematics
tier: prose
statement: Let ug denote the graded Lie algebra associated to the prounipotent radical of the relative Malcev completion of Ig defined by Hain [29] and let ug→hQ g be the natural homomorphism (here hQ g denotes the graded Lie algebra consisting of symplectic derivations, with positive degrees, of the Malcev Lie algebra of π1Σg). Determine whether this homomorphism is injective or not. In [ 80], we defined a series of secondary characteristic classes for the mapping class group. However there was ambiguity coming from possible odd dimensional stable cohomology classes of the mapping class group. Because of the result of Madsen-Weiss cited above, we can now eliminate the ambiguity and give a precise definition as follows. For each i, we constructed in [ 51][52] explicit group cocycles zi∈ Z2i(Mg; Q) which represent the i-th Mumford-Morita-Miller class ei by making use of the homomorphism Mg→U ⋊ Sp(2g, Z) constructed in [ 77] which extends the (first) Johnson homomorphism Ig→U. These cocycles are Mg-invariant by the definition. Furthermore we proved that such cocycles are unique up to coboundaries. On the other hand, as is well known, any odd class e2i−1 comes from the Siegel modular group Sp(2 g, Z) so that there is a cocycle z′ 2i−1∈ Z4i−2(Mg; Q) which comes from Sp(2 g, Z). This cocycle is uniquely defined up to coboundaries and Mg-invariant. Now consider the diﬀerence z2i−1−z′ 2i−1. It is a coboundary so that there exists a cochain yi∈ C4i−3(Mg; Q) such that δyi = z2i−1−z′ 2i−1. Since H 4i−3(Mg; Q) = 0 by [ 64] (in a suitable stable range), the cochain yi is well-defined up to coboundaries. Now let Kg be the kernel of the Johnson homomorphism so that we have an extension 1−→Kg−→Ig−→U−→1. (8) Recall that Johnson [ 43] proved that Kg is the subgroup of Mg generated by Dehn twists along separating simple closed curves on Σ g. The cocycle z′ 2i−1 is trivial on the Torelli group Ig while the cocycle z2i−1 (in fact any zi) vanishes on Kg. It follows that the restriction of the cochain yi toKg is a cocycle. Hence we obtain a cohomology class di = [yi|Kg ]∈H 4i−3(Kg; Q). This cohomology class is Mg-invariant where Mg acts on H ∗(Kg; Q) via outer conjugations. This can be shown as follows. For any element ϕ∈M g, let ϕ∗(yi) be the cochain obtained by applying the conjugation by ϕ on yi. Since both cocycles z2i−1,z ′ 2i−1 areMg-invariant, we have δϕ∗(yi) = δyi. Hence ϕ∗(yi)−yi is a cocycle of Mg. By the result of [ 64] again, we see that ϕ∗(yi)−yi is a coboundary. Hence the restrictions of ϕ∗(yi) and yi toKg give the same cohomology class.
