title: Moving Ideals of Rationally Parametrized Curves and Surfaces
field: mathematics
tier: prose
statement: For rationally parametrized curves and surfaces, what is the structure of the remaining moving-curve ideal, in connection with Cox's conjecture and adjoint linear systems? What can be said about the moving-surface ideal for tensor-product surfaces of bidegree $(2,1)$, and, when three bihomogeneous polynomials of bidegree $(2,1)$ have no common zero on $\mathbb P^1\times\mathbb P^1$, what is the free resolution of the ideal they generate?
