title: Geometric Hydrodynamics in Open Problems — Problem 15
field: mathematics
tier: prose
statement: |-
  Thus the structure of singularities of the exponential map in 2D hydrodynamics
  resembles that of a smooth map between finite-dimensional manifolds.
  This leads to the following natural question.

  Quantify the failure of the Fredholm property of the $L^2$ exponential map in $\mathscr{D}^s_\mu(M)$
  for a compact Riemannian 3-manifold $M$.
