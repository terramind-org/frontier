title: Additional Symmetries of Invariant Complex Domains
field: mathematics
tier: prose
statement: Let $K$ be a connected compact Lie group, let $L$ be a closed subgroup, set $X=K/L$ and $X_{\mathbb{C}}=K_{\mathbb{C}}/L_{\mathbb{C}}$, and let $D\subset X_{\mathbb{C}}$ be a $K$-invariant domain. Besides the evident $K$-symmetries, can $\operatorname{Aut}(D)$ have additional positive-dimensional symmetries?
