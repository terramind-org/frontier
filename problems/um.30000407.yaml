title: Structure of Finitely Generated Maximal Pro-$p$ Galois Groups
field: mathematics
tier: prose
statement: Let $p$ be prime and let $F$ have characteristic different from $p$ and contain the $p$-th roots of unity. If the maximal pro-$p$ Galois group $G_F(p)$ is finitely generated, is it a free pro-$p$ product of groups isomorphic to $\mathbb{Z}_p$, to $\mathbb{Z}/2\mathbb{Z}$ when $p=2$, or to decomposition groups of valuations with nontrivial inertia?
