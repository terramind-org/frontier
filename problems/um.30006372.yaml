title: Fractal-Time Local Smoothing
field: mathematics
tier: prose
statement: "For a fractal time set $E\\subset[1,2]$ and a maximal $2^{-j}$-separated subset $E_j$, establish sharp local smoothing: $\\left(\\sum_{t\\in E_j}\\lVert e^{it\\sqrt{-\\Delta}}P_jf\\rVert_{L^p(\\mathbb{R}^d)}^p\\right)^{1/p}\\leq C2^{js}\\lVert f\\rVert_{L^p(\\mathbb{R}^d)}$."
