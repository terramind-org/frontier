  definitions:
    - name: SolitaryNumber.IsSolitary
      kind: def
      text: |-
        /--
        A positive integer $n$ is solitary if every friend of $n$ is equal to $n$, i.e. its
        abundancy class is the singleton $\{n\}$.
        -/
        def IsSolitary (n : ℕ) : Prop := 0 < n ∧ ∀ m, Friendly m n → m = n
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/SolitaryNumber.lean#L41
