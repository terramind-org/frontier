title: Arithmetic Finiteness of Gushel–Mukai Threefolds
field: mathematics
tier: prose
statement: Let $K$ be a number field, let $S$ be a finite set of finite places of $K$, and set $B=\operatorname{Spec}(\mathcal O_K[S^{-1}])$. Are there only finitely many $B$-isomorphism classes of smooth Fano threefolds of Picard rank one? In particular, is this true for Gushel–Mukai Fano threefolds?
