title: The Lorentz endpoint behind Lafforgue's finite-set RD condition
field: mathematics
tier: prose
statement: |-
  I inspected the official PDF, in particular PDF
  page 5.

  The next line, **7 Applications of RD**, is a new section heading, not part of
  item 6. Item 6 itself is a remark, not a missing question.

  Two reconstructions are necessary for item 4.

  * The PDF literally says "finite subspaces"; the only coherent meaning is
    **finite subsets**.
  * The letter \(B\) is used both for one of those subsets and for a ball.  Below
    \(B_\ell(e,r)=\{x:\ell(x)\le r\}\) denotes the word-metric ball, so the
    hypothesis is \(A\subseteq B_\ell(e,r)\).
