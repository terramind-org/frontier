title: Critical-level surgery for nonconvex Aubry problems
field: mathematics
tier: prose
statement: |-
  **Problem 11 (Albert Fathi).** For a Hamiltonian
  \[
   H:\mathbb T^n\times\mathbb R^n\longrightarrow\mathbb R
  \]
  that is superlinear but not necessarily convex in momentum, ask:

  **Problem 12 (attributed to Sergey Bolotin in [GMT18]).** Let \(c_0\) be the infimum of the constants \(c\) for which
  \[
   H(z,Du(z))=c
  \]
  has a global viscosity subsolution on \(\mathbb T^n\). Let \(\mathcal{SS}\) be the critical subsolutions and define
  \[
   S(z,y)=\sup_{u\in\mathcal{SS}}\{u(z)-u(y)\}.
  \]
  For a fixed vertex \(y\), the standard formulation says that \(z\mapsto S(z,y)\) is a critical subsolution on \(\mathbb T^n\) and a solution on
  \(\mathbb T^n\setminus\{y\}\). Does some \(y\) make it a solution on the whole torus when \(H\) is not necessarily convex?
