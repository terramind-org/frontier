title: Equal Products from Disjoint Subsets of Finite Groups
field: mathematics
tier: prose
statement: For every $k\geq2$, does there exist $c(k)$ such that every subset $S$ of a finite group $G$ of order $n$, with $|S|\geq c(k)\log n$, contains pairwise disjoint subsets $T_1,\ldots,T_k$ that can each be ordered to give the same product?
