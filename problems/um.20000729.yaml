id: um.20000729
title: A finite-theta certificate for sum-side modularity
field: mathematics
tier: prose
statement: |-
  Find a method to prove modularity directly from the sum (q-hypergeometric) expansion.  For motivation, consider
  \[
  G(q)=\sum_{n=0}^{\infty}\frac{q^{n^2}}{(q;q)_n},\qquad
  H(q)=\sum_{n=0}^{\infty}\frac{q^{n^2+n}}{(q;q)_n}.
  \]
  The Rogers--Ramanujan product identities make the modularity of
  \(q^{-1/60}G(q)\) and \(q^{11/60}H(q)\) apparent.  How can it be seen from the left-hand sides?
