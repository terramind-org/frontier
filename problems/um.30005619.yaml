statement: For a closed Riemannian surface $(M,g)$ and $i>1$, prove $\inf_A\overline\lambda_i(M,g,A)\geq C(M,g)>0$ over all real magnetic potentials $A$, and develop a natural construction of critical metric-potential pairs.
