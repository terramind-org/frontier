title: Cauchy smoothing for free-coordinate tuples
field: mathematics
tier: prose
statement: |-
  Q: In the one variable case, if A(t) follows a process dA (t) = dS (t) +
  kt(A(s)) s≤t then replacing A(t) with A(t) + C[U+000F] (with C having Cauchy distribution and free from A(t)) then kt is replaced by k[U+000F]t = τ (kt|A(t) + C[U+000F]). Thus, k[U+000F]t is smooth. Is there an analog of this smoothing in the several-variable case?
