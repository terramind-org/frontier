title: HTP-Complete Polynomials over Rational Subrings
field: mathematics
tier: prose
statement: Which subrings $R_W\subset\mathbb Q$ have an HTP-complete polynomial, meaning one that uniformly encodes solvability in $R_W$ of every polynomial equation over $\mathbb Q$, and which have an effectively HTP-complete polynomial with a computable encoding map?
