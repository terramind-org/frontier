title: Regular Mather functions, convex duality, and integrability
field: mathematics
tier: prose
statement: |-
  **5. (Patrick Bernard)** Consider an analytic positive definite Lagrangian
  \[
  L:\mathbb T^n\times\mathbb R^n\times\mathbb T\longrightarrow\mathbb R,
  \qquad L=L(x,v,t),
  \]
  satisfying Mather's conditions. Let
  \[
  \alpha_L(c)=-\inf_\mu\int\bigl(L(x,v,t)-c\cdot v\bigr)\,d\mu
  \]
  be Mather's function \(\alpha_L:\mathbb R^n\to\mathbb R\). Is it true that if \(\alpha_L\) is analytic with positive definite second derivative, then the Lagrangian system is completely integrable?
