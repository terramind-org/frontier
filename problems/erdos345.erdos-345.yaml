lean:
  module: FormalConjectures.ErdosProblems.«345»
  decl: Erdos345.erdos_345
  statement: |-
    theorem erdos_345 :
        {k : ℕ | 0 < k ∧ ∃ a b : ℕ, IsLeast (thresholds (kthPowers k)) a ∧
          IsLeast (thresholds (kthPowers (k + 1))) b ∧ b < a}.Infinite
  context:
    - open Erdos345
    - open IsAddComplete
  definitions:
    - name: Erdos345.kthPowers
      kind: def
      text: |-
        /-- The set of $k$-th powers of positive integers. -/
        def kthPowers (k : ℕ) : Set ℕ :=
          {x | ∃ n : ℕ, 0 < n ∧ n ^ k = x}
