title: Kourovka Notebook Problem 12.8
field: mathematics
tier: prose
statement: |-
  Let ${\mathcal{V}}$ be a non-trivial variety of groups
  and let $a_1,\ldots ,a_r$ freely generate a free group $F_r(V)$ in
  ${\mathcal{V}}$. We say $F_r({\mathcal{V}})$ *strongly discriminates*
  ${\mathcal{V}}$ just in case every finite system of inequalities
  $w_i(a_1,\ldots ,a_r,x_1,\ldots ,x_k) \ne 1$ for $1 \leq i \leq n$
  having a solution in some $F_s({\mathcal{V}})$ containing $F_r({\mathcal{V}})$ as a varietally free factor in the sense of ${\mathcal{V}}$,
  already has a solution in $F_r({\mathcal{V}})$. Does there exist ${\mathcal{V}}$ such that for some integer $r > 0$, $F_r({\mathcal{V}})$
  discriminates but does not strongly discriminate ${\mathcal{V}}$? What
  about the analogous question for general algebras in the context
  of universal algebra?
