title: Rectifiable Nonsmooth Limit Curves of Anosov Representations
field: mathematics
tier: prose
statement: For the fundamental group $\Gamma$ of a closed orientable surface of genus $g\geq2$, does there exist a $1$-Anosov representation $\Gamma\to\operatorname{PGL}(d,\mathbb R)$ whose circular limit set in $\mathbb P(\mathbb R^d)$ is rectifiable but not $C^{1,\alpha}$?
