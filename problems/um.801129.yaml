title: Ultraproduct II_1 Factors — Problem 30
field: mathematics
tier: prose
statement: |-
  Recall $A,B\subset M$ are $k$-independent if for all alternating centered words $w$ of length $k$ in $A,B$, one has $\tau(w)=0$. Usage of plain independent refers to $2$-independent. Additionally, $u,v\in \mathcal{U}(M)$ are $k$-independent means that the von Neumann algebras they generate are $k$-independent.

  Suppose $u,v\in N^\mathcal{U}$ independent unitaries, then can they be lifted to sequences of pairwise independent unitaries in $N$?
