  module: FormalConjectures.GreensOpenProblems.«46»
  decl: Green46.green_46.improve_upper_conjectured
  statement: |-
    theorem green_46.improve_upper_conjectured :
        ∃ o : ℕ → ℝ, (o =o[atTop] fun _ : ℕ ↦ (1 : ℝ)) ∧
          maxY ≪ fun x ↦ (x : ℝ) ^ (1 + o x)
  context:
