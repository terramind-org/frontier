title: Dimension-Independent Nonminimality of Difference Equations
field: mathematics
tier: prose
statement: Let $K\subset\mathcal U\models\mathrm{ACFA}$ be difference fields with distinguished automorphism $\sigma$, let $V$ be an algebraic variety, and let $\phi:V\dashrightarrow V^\sigma$ be a rational map over $K$. For a generic solution $a$ of $\sigma(a)=\phi(a)$ whose type over $K$ is nonminimal, must $\operatorname{nmdeg}\!\left(\operatorname{tp}(a/K)\right)\leq3$, independently of $\dim V$?
