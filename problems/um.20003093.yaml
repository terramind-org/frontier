title: Continuity of Thurston geodesic envelopes and diagonal collapse
field: mathematics
tier: prose
statement: |-
  Problem 2.3 (K. Rafi). Does `Env(X,Y)` depend continuously on `X,Y`?

  The immediately preceding Problem 2.2 in the AIM source defines

  \[
   \operatorname{Env}(X,Y)=\bigcup\{G:G\text{ is a Thurston geodesic connecting }X\text{ to }Y\}. \]

  Thus the question concerns a set-valued map on \(\mathcal T(S)\times\mathcal T(S)\). The source does not specify a topology on sets. Following Dumas--Lenzhen--Rafi--Tao and Pan--Wolf, the precise reading used here is Hausdorff continuity on nonempty compact subsets, for the symmetric metric

  \[
  d_s(U,V):=\max\{d_{\rm Th}(U,V),d_{\rm Th}(V,U)\}. \]

  The AIM document is the workshop version of Weixu Su's problem list. Its ambient surface is of finite type (genus \(g\), \(n\) punctures, negative Euler characteristic), so a result only for closed surfaces does not literally settle every case of the recovered question.
