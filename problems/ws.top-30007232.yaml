statement: |-
  \section*{A size-independent spectral gap above the spherical Laughlin line}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For the spherical $V_1$ pseudopotential $H_{N,Q}$ at flux $Q=3(N-1)$ on $wedge^N$ $U_Q$, is $H_{N,Q}\geq (1/25)(I-P_L,N)$ for every sufficiently large N, where $P_L,N$ projects onto the Laughlin vector $product_{i<j}(u_i$ $v_j-u_j$ $v_i)^3$?
  \subsection{Short English statement}
  For the spherical $V_1$ pseudopotential $H_{N,Q}$ at flux $Q=3(N-1)$ on $wedge^N$ $U_Q$, is $H_{N,Q}\geq (1/25)(I-P_L,N)$ for every sufficiently large N, where $P_L,N$ projects onto the Laughlin vector $product_{i<j}(u_i$ $v_j-u_j$ $v_i)^3$?
