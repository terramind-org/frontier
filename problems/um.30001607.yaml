title: Arrangement Complexity and Random-Complex Homology Thresholds
field: mathematics
tier: prose
statement: |-
  For a complex hyperplane arrangement $\mathcal A$, determine $\operatorname{TC}(M(\mathcal A))$ and test Yuzvinsky's conjecture

  $$\operatorname{TC}(M(\mathcal A))=\operatorname{zcl}_{A^*(\mathcal A)}(A^*(\mathcal A))+1.$$

  For the Linial–Meshulam random complex $Y(n,n^\alpha)$, determine the threshold for simultaneous vanishing of $H_1(Y,\mathbb Z_p)$ for all primes $p$ and the threshold for having no epimorphism $\pi_1(Y)\twoheadrightarrow\Gamma$ for any finite group $\Gamma$; the latter is conjectured at $\alpha=-1/2$.
