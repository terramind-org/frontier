  path: FormalConjectures/Wikipedia/MaximalPrimeGap.lean
  url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/MaximalPrimeGap.lean#L104
  licence: Apache-2.0
upstream_status: open
lean:
  module: FormalConjectures.Wikipedia.MaximalPrimeGap
  decl: MaximalPrimeGap.shanks_maximal_prime_gap_conjecture.variants.record_indices
  statement: |-
    theorem shanks_maximal_prime_gap_conjecture.variants.record_indices :
        Filter.Tendsto
          (fun k : {n : ℕ // IsMaximalPrimeGapIndex n} =>
            (primeGap k.1 : ℝ) / (Real.log (Nat.nth Nat.Prime k.1 : ℝ)) ^ 2)
          Filter.atTop (nhds 1)
  context:
    - open MaximalPrimeGap
    - open MaximalPrimeGap.shanks_maximal_prime_gap_conjecture
    - open MaximalPrimeGap.shanks_maximal_prime_gap_conjecture.variants
    - open scoped Asymptotics
  definitions:
    - name: MaximalPrimeGap.IsMaximalPrimeGapIndex
      kind: def
      text: |-
        /-- Predicate that index $n$ achieves a strictly larger `primeGap` than all earlier indices
        $m < n$. -/
        def IsMaximalPrimeGapIndex (n : ℕ) : Prop :=
          ∀ m : ℕ, m < n → primeGap m < primeGap n
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/MaximalPrimeGap.lean#L47
