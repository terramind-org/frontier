schema: 1
id: maximalprimegap.shanks-maximal-prime-gap-conjecture.variants.record-indices
title: "Shanks's asymptotic conjecture for maximal prime gaps (variant: record_indices)"
field: mathematics
tier: proof
statement: |-
  Record-index consequence of Shanks's conjecture (derived as a corollary of
  `shanks_maximal_prime_gap_conjecture` rather than stated directly on Wikipedia): as $n$ runs
  through indices with `IsMaximalPrimeGapIndex n`, the ratio $g_n / (\log p_n)^2$ converges to
  $1$.
ams:
  - 11
tags:
  - wikipedia
  - variant
references:
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Cram%C3%A9r%27s_conjecture#Shanks_conjecture
  - label: "Wikipedia: Prime gap"
    url: https://en.wikipedia.org/wiki/Prime_gap#Numerical_results
source:
  name: formal-conjectures
  repo: https://github.com/google-deepmind/formal-conjectures
