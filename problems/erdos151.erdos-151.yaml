lean:
  module: FormalConjectures.ErdosProblems.«151»
  decl: Erdos151.erdos_151
  statement: |-
    theorem erdos_151 :
        ∀ (n : ℕ) (G : SimpleGraph (Fin n)), cliqueTransversalNumber G ≤ n - H n
  context:
    - open Erdos151
    - open SimpleGraph
  definitions:
    - name: Erdos151.H
      kind: def
      text: |-
        /-- $H(n)$: the largest `k` such that every triangle-free graph on `n` vertices contains an
        independent set on `k` vertices. -/
        noncomputable def H (n : ℕ) : ℕ :=
          sSup {k | ∀ G : SimpleGraph (Fin n), G.CliqueFree 3 → ∃ s, G.IsNIndepSet k s}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/151.lean#L37
