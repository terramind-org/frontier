title: Visibility Graphs of Points, Segments and Polygons — Problem 26
field: mathematics
tier: prose
statement: |-
  Dean et al. [deglst-bvg-2007] also studied the thickness of bar $k$-visibility graphs.
  The *thickness* of a graph $G$ is defined as the minimum number of planar graphs whose
  union is $G$. Exact values of thickness is know for very few classes of graphs [mos-tgs-1998].
  Dean et al. proved an upper bound of $4$ for the thickness of
  bar $1$-visibility graphs, and conjectured that bar $1$-visibility graphs actually have
  thickness of at most $2$. The conjecture was disproved by Felsner and Massow [fw-tbvg-2007]
  by constructing a bar $1$-visibility graph having thickness $3$. For a special
  class of bar $1$-visibility graphs, Felsner and Massow [fw-tbvg-2007] presented
  an algorithm for partitioning the edges into two planar graphs showing that the thickness
  of this special class of graphs is $2$.
  We have the following problems [deglst-bvg-2007].

  It has been shown that the thickness of
  a bar $k$-visibility graph is bounded by $2k(9k-1)$. Can this upper bound be improved?
