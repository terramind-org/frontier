  \item[\hypertarget{source:5200007:2}{S2}] M. Bialy, C. Fierobe, A. Glutsyuk, M. Levi, A. Plakhov and S. Tabachnikov, \emph{Open problems on billiards and geometric optics} (2021), arXiv:2110.10750v2, Alexey Glutsyuk, Problem 1 (question of Konstantin Khanin, August 2019), pp. 5--6. \url{https://arxiv.org/pdf/2110.10750v2}.
