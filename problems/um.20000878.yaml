title: The Renyi-Shannon bottleneck in entropic inverse arguments
field: mathematics
tier: prose
statement: |-
  Neighbor 1.1 states the entropic Polynomial Freiman–Ruzsa theorem with constant 11, confirming that Problem 1.3 asks for a more direct entropic derivation of inverse consequences, not for a proof of PFR itself.

  The source asks about two assertions for
  \[
  f:\mathbb F_2^n\longrightarrow\mathbb F_2^m. \]

  First, if
  \[
  \mathbb P_{x+y=z+w}\bigl(f(x)+f(y)=f(z)+f(w)\bigr)\geq\epsilon,
  \tag{1}
  \]
  PFR implies correlation with a linear function. Second, with
  \[
  D_hf(x)=f(x+h)-f(x),
  \]
  if
  \[
  \mathbb P_{x,h_1,h_2,h_3}
  \bigl(D_{h_1}D_{h_2}D_{h_3}f(x)=0\bigr)\geq\epsilon,
  \tag{2}
  \]
  PFR implies correlation with a quadratic function. It asks for direct entropic proofs with polynomial bounds.

  Several conventions are absent and must be made explicit.

  1. In (1), this report interprets the subscript as the uniform distribution on ordered quadruples satisfying \(x+y=z+w\). Equivalently, choose \(x,y,z\) independently and uniformly and put \(w=x+y+z\).
  2. In (2), \(x,h_1,h_2,h_3\) are independent and uniform.
  3. In characteristic two, subtraction equals addition:
     \[
     D_hf(x)=f(x+h)+f(x).
     \]
     Thus the third derivative is the sum of the eight cube values, and derivative order is immaterial.
  4. The source never defines “correlates.” For vector-valued functions, two inequivalent meanings occur in the literature:
     - **agreement:** \(\mathbb P_x(f(x)=q(x))\) is at least a polynomial in the test parameter;
     - **scalar phase correlation:** for some nonzero output character \(\lambda\), the phase \((-1)^{\langle\lambda,f(x)\rangle}\) has nontrivial inner product with a linear or quadratic phase.

  The PFR/approximate-homomorphism formulation naturally gives agreement with an affine map on a large set, while the standard \(U^3\) inverse theorem gives scalar phase correlation. These should not be conflated. “Linear” is also naturally affine in (1), since its test is invariant under adding a constant. A quadratic map here means a map of combinatorial degree at most two, equivalently one whose third additive derivatives vanish identically.
