  % UnsolvedMath ID 1262; source catalogue code NT-055
  \setcounter{section}{1261}
  \section{Erdős Conjecture on Arithmetic Progressions}\label{1262}
  {\small UnsolvedMath ID 1262 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $A\subseteq\mathbb N$ satisfy $\sum_{a\in A}1/a=\infty$. Must $A$ contain arithmetic progressions of every finite length? The progression must have positive common difference.
  \par\smallskip\textit{Formulation references:} \sref{1262}{1}, \sref{1262}{2}.
  \subsection{Short English statement}
  Let $A\subseteq\mathbb N$ satisfy $\sum_{a\in A}1/a=\infty$. Must $A$ contain arithmetic progressions of every finite length? The progression must have positive common difference.
