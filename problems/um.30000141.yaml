title: Jacobi Fields and Neck Sizes of Coplanar Unduloids
field: mathematics
tier: prose
statement: For coplanar $k$-unduloids, are the upper bounds on the dimension of the space of $L^2$ Jacobi fields sharp? In particular, does a nonzero $L^2$ Jacobi field exist on a triunduloid when $n_1+n_2+n_3=2\pi$ or when $n_i+n_j=n_k$? Can these techniques be extended to other constant-mean-curvature surfaces to bound neck sizes or the dimension of their Jacobi-field spaces? Is every tempered Jacobi field on a constant-mean-curvature surface integrable?
