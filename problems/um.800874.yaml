title: Open Problems in Pluripotential Theory — Question 5
field: mathematics
tier: prose
statement: |-
  The (global) domain of definition $DMA(X,\omega)$ of the complex Monge-Amp\`ere operator
  $\varphi \mapsto (\omega+dd^c \varphi)^n$ is different than its local counterpart
  $DMA_{loc}(X,\omega)$.
  The construction of Blocki [Blo04] breaks down here as the total mass of
  the Monge-Amp\`ere measures of any approximating sequence is fixed, equal to the volume
  $Vol_\omega(X)=\int_X \omega^n$.
  It turns out indeed that $DMA(X,\omega)$ contains functions
  which do not have gradient in $L^2$.

  [Coman-Guedj-Zeriahi]
  Characterize $DMA(X,\omega)$.
