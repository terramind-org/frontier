lean:
  module: FormalConjectures.Wikipedia.UnionClosed
  decl: UnionClosed.union_closed
  statement: |-
    theorem union_closed
        [Nonempty n]
        (h_ne_singleton_empty : A ≠ {∅})
        (h_union_closed : IsUnionClosed A) :
        ∃ i : n, (1 / 2 : ℚ) * #A ≤ #{x ∈ A | i ∈ x}
  context:
    - open UnionClosed
    - open Finset
    - "variable {n : Type*} [DecidableEq n] {A : Finset (Finset n)}"
  definitions:
    - name: UnionClosed.IsUnionClosed
      kind: abbrev
      text: |-
        abbrev IsUnionClosed (A : Finset (Finset n)) : Prop :=
          ∀ᵉ (X ∈ A) (Y ∈ A), X ∪ Y ∈ A
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/UnionClosed.lean#L40
