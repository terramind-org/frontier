lean:
  module: FormalConjectures.Wikipedia.UnionClosed
  decl: UnionClosed.union_closed
  statement: |-
    theorem union_closed
        [Nonempty n]
        (h_ne_singleton_empty : A ≠ {∅})
        (h_union_closed : IsUnionClosed A) :
        ∃ i : n, (1 / 2 : ℚ) * #A ≤ #{x ∈ A | i ∈ x}
