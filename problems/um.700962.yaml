title: Kourovka Notebook Problem 13.44
field: mathematics
tier: prose
statement: |-
  For any partition of an arbitrary group
  $G$ into finitely many subsets
  $G=A_1\cup \cdots \cup A_n$, there exists a subset of the
  partition $A_i$ and a finite subset $F\subseteq G$, such that
  $G=A_i^{-1}A_iF$ (I. V. Protasov, *Siberian Math. J.*, **34**, no. 5 (1993), 938--952). Can the subset $F$ always be chosen
  so that
  $|F|\leq n$? This is true for amenable groups.
