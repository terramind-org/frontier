statement: |-
  \section*{Constant-factor hardness of uniform sparsest cut}\label{30007492}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each fixed $C>1$, is approximating uniform sparsest cut within factor C NP-hard on explicitly encoded finite undirected graphs with nonnegative rational capacities and unit demand between each pair of distinct vertices?
  \subsection{Short English statement}
  For each fixed $C>1$, is approximating uniform sparsest cut within factor C NP-hard on explicitly encoded finite undirected graphs with nonnegative rational capacities and unit demand between each pair of distinct vertices?
