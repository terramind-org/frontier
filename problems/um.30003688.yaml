title: Finite Families with Two-Element Rogers Semilattices
field: mathematics
tier: prose
statement: For each $n\geq2$, does there exist a finite family $\mathcal S$ of $\Sigma_n^0$ sets whose Rogers semilattice has exactly two elements $\alpha$ and $\beta$, where $\alpha$ is Friedberg and every numbering $\gamma$ not equivalent to $\alpha$ satisfies $\beta\leq\gamma$?
