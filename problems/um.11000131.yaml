statement: Understand either classically or as quantum geometric objects the non-Hausdorﬀ quotients of PL 0(F ) or PL(F ) by MC (F ) or PMC (F ). T (F ) has been quantized in [5] and [17] as surveyed in [6] and [35], respectively, and PL 0(F 1 1,0) has been quantized in [6]. In interesting contrast, [21,54] has described a program for studying real quadratic number fields as quantum tori limits of elliptic curves, thus quantizing limiting curves rather than Teichm¨ uller space.
