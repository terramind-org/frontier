lean:
  module: FormalConjectures.ErdosProblems.«325»
  decl: Erdos325.erdos_325
  statement: |-
    theorem erdos_325 :
         ∀ k : ℕ, 3 ≤ k → (fun x : ℕ => (x : ℝ) ^ (3 / k : ℝ)) =O[atTop]
          (fun x : ℕ => (cardIsSumThreePowerBelow k x : ℝ))
  context:
    - open Erdos325
    - open Asymptotics Filter
  definitions:
    - name: Erdos325.cardIsSumThreePowerBelow
      kind: def
      text: |-
        /-- The number of integers $\leq x$ which are the sum of three $k$th powers. -/
        noncomputable def cardIsSumThreePowerBelow (k x : ℕ) : ℕ :=
          {n ∈ Set.Iic x | IsSumThreePower k n}.ncard
