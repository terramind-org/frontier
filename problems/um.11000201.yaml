statement: For a fixed number R > 0, is there is compact subset K(R) of moduli space containing the projection of every Teichm¨ uller geodesic γ which satisfies d(Ψ(γ(s)), Ψ(γ(t)))≥ |s−t|/R−R for all s,t∈ R? Conversely, is there for a given compact set K in Mod( S) a number R =R(K)> 0 such that d(Ψ(γ(s)), Ψ(γ(t)))≥|s−t|/R−R for every Teichm¨ uller geodesic which projects into K? Analyze the images in C(S) of geodesics in Tg,m determined by minimal geodesic laminations which fill up S and are not uniquely ergodic.
