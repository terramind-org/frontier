statement: |-
  [Dujardin]
  Assume $0 \leq \alpha <1$ and $n=2$.
  Assume $\varphi$ is ${\mathcal{C}}^{2,\alpha}$-smooth and maximal. Is the suppport of $dd^c \varphi$ foliated (or laminated)
  by holomorphic disc along which $\varphi$ is harmonic ?
