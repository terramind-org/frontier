title: Representativeness of Symmetry-Reduced Molecular Dynamics
field: mathematics
tier: prose
statement: How representative are the symmetry-reduced, group-generated solutions of the equations of molecular dynamics? In particular, do simulations on increasingly large fundamental domains with increasingly small corresponding subgroups approximate, in an average sense, generic solutions with suitably restricted initial conditions?
