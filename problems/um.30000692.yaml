title: Representation Models for Toric Cohomology and Symmetric Functions
field: mathematics
tier: prose
statement: Construct a direct isomorphism between the symmetric-group representation on the cohomology of the toric variety associated with the type-$A$ Coxeter complex and the sign-twisted representation on the homology of maximal open intervals in $(B_n\setminus\{\widehat{0}\})*C_n$. Also, for a partition $\lambda$ of $n$, is the symmetric function $Q_{\lambda,j}$ the Frobenius characteristic of a representation?
