title: Log-Concave Busemann-Petty Problems
field: mathematics
tier: prose
statement: Resolve the following measure-comparison questions. (1) For $n=5$ or $6$, let $\mu$ be a rotation-invariant log-concave measure with strictly decreasing density, and let $K,L\subset\mathbb R^n$ be origin-symmetric convex bodies satisfying $\mu(tK\cap\theta^\perp)\leq\mu(tL\cap\theta^\perp)$ for every $t>0$ and $\theta\in S^{n-1}$. Must $\mu(K)\leq\mu(L)$? (2) Does the same conclusion hold in arbitrary dimension when $d\mu(x)=e^{-\phi(\|x\|_M)}dx$ and $M$ is an intersection body?
