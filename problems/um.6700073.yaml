title: 'Scalar Curvature Question [?77]: Describe "Remnants of Collapse" of Hypersurfaces with Scalar Curvatures Blowing-up to+∞'
field: mathematics
tier: prose
statement: Problem. Describe "Remnants of Collapse" of Hypersurfaces with Scalar Curvatures Blowing-up to+∞. Namely, decide when a closed subsetY in aC2-smooth Riemannian manifold(W,g) appears as alimit of smooth domainsVi ⊂W, i ∈I, with Sc(∂Vi) →∞, where "limit" means that Y = ⋂iVi, where, ifY is non-compact, one may additionally insist thatVj ⊂Vi for j > i, or moreover, thatVi eventually become smaller than any given neighbourhoodU ⊃Y. (For this one needs uncountableI.) The following conjectures may give you a feeling of what this description might tell you. [?
