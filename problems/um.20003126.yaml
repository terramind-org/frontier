title: Four-dimensional finiteness and a uniform Gromov--Hausdorff gap
field: mathematics
tier: prose
statement: |-
  **Problem 1.** Does the Grove--Petersen--Wu Finiteness Theorem hold in
  dimension 4, i.e. are there only finitely many diffeomorphism types in the
  class of 4-dimensional Riemannian manifolds satisfying
  \[
     \sec M\ge -\Lambda^2,\qquad
     \operatorname{diam}(M)\le D,\qquad
     \operatorname{Vol}(M)\ge V\,?
  \]
