title: Higgs Branches as Associated Varieties of Vertex Algebras
field: mathematics
tier: prose
statement: For a four-dimensional $\mathcal N=2$ Argyres–Douglas theory, is its Higgs branch isomorphic to the associated variety of the corresponding vertex algebra under the four-dimensional/two-dimensional duality? This includes algebras of the forms $L_{-h^\vee+h^\vee/q}(\mathfrak g)$ and $W_{-h^\vee+h^\vee/q}(\mathfrak g,f)$ for $\mathfrak g$ of type $A$, $D$, or $E$.
