title: Geometric Hydrodynamics in Open Problems — Problem 8
field: mathematics
tier: prose
statement: |-
  Another interesting question is related to closed geodesics.
  Suppose that $M$ is a compact surface (possibly with boundary) of genus at least $2$
  or that $M$ is a multi-connected bounded domain in $\mathbb{R}^2$ with at least two holes.

  Does there exist a closed geodesic in $\mathscr{D}^s_\mu(M)$?
