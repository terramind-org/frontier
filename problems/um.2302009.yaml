title: Research Problems in Function Theory — Problem 2.9
field: mathematics
tier: prose
statement: "We ask the analogues of Problems 2.6, 2.7 and 2.8 if, in addition, $f(z)$ has another finite Picard value, e.g. $f(z)\\neq0$. In this case, if $\\infty$ has deficiency one, in the sense of Nevanlinna, ([source label: 2.1]) remains true for functions of finite order (see Edrei and Fuchs ), but not necessarily for functions of infinite order, see Gol'dberg and Ostrovskii (, )."
