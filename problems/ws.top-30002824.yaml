  \section{Chromatic Splitting of the Local Sphere}\label{30002824}
  {\small UnsolvedMath ID 30002824 · Topology}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For the $p$-local sphere spectrum, let $L_nS$ denote its chromatic localizations and let $F_n$ be the common fiber in the chromatic fracture square. Does $L_{n-1}L_{K(n)}S\simeq L_{n-1}S\vee\Sigma F_n$, with $\Sigma F_n$ admitting the predicted wedge decomposition into lower chromatic layers?
  \par\smallskip\textit{Formulation references:} \sref{30002824}{1}, \sref{30002824}{2}.
  \subsection{Short English statement}
  For the $p$-local sphere spectrum, let $L_nS$ denote its chromatic localizations and let $F_n$ be the common fiber in the chromatic fracture square. Does $L_{n-1}L_{K(n)}S\simeq L_{n-1}S\vee\Sigma F_n$, with $\Sigma F_n$ admitting the predicted wedge decomposition into lower chromatic layers?
