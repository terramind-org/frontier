id: um.30000706
title: Four-Value-Sharing Meromorphic Functions with $\psi=1$
field: mathematics
tier: prose
statement: Let $f$ and $g$ be meromorphic functions sharing the four values $a_1,a_2,a_3,a_4=\infty$. Define $\psi=f'g'(f-g)^2/\prod_{\nu=1}^3((f-a_\nu)(g-a_\nu))$, $\psi_1=f'(f-g)/\prod_{\nu=1}^3(f-a_\nu)$, and $\psi_2=g'(f-g)/\prod_{\nu=1}^3(g-a_\nu)$. Determine all tuples $(a_1,a_2,a_3,f,g)$ satisfying $\psi=1$.
