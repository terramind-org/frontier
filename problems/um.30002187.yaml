title: Scaling Limits Across the Directed-Polymer Crossover
field: mathematics
tier: prose
statement: For $(1+1)$-dimensional directed polymers, does the scaling limit at the $\beta=\infty$ end of the convergence diagram exist; what are the properties of the intermediate-disorder crossover bridge; and, for environment scalings slower than $n^{-1/4}$, does the pair $(\omega_n,S_n)$ have a distributional limit, and if so is it the same as the last-passage-percolation limit?
