title: Research Problems in Function Theory — Problem 9.6
field: mathematics
tier: prose
statement: Let $D$ be an open subset of the extended complex plane with non-empty boundary $\partial D$, and let $F$ be a relatively-closed subset of $D$. Let $f$ be a function given on $F$, and $\{f_n\}^\infty_1$ a sequence of functions analytic on $D$ such that $f_n\to f$ uniformly on $F$. If $E\subset(\partial F_n\cap\partial D)$ and if $f$ extends continuously to $F\cup E$, can each $f_n$ be extended continuously to $F\cup E$? The answer is `yes' if $D$ is the unit disc, or if $E$ is compact. (A. Stray)
