statement: |-
  \section{Minimal Assumptions for Additive Randomized Encodings}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  An additive randomized encoding locally maps each party\textquotesingle s input into group elements whose aggregate permits decoding the desired output while hiding additional input information. Computational privacy is indistinguishability from a simulator based on the prescribed output.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The function family, corruption/leakage model, randomness setup, and meaning of fully secure are not specified.

  Source-record limitation: The function family, setup, leakage/corruption model, and full security requirement are not supplied.
  \paragraph{Statement recorded in the supplied source.}
  Determine the weakest computational assumptions under which efficient, fully secure additive randomized encodings can be constructed. \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record partially solved; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-22.
  \subsection{Short English statement}
  Determine the weakest assumptions needed for efficient secure additive randomized encodings.
