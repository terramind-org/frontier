statement: |-
  \section*{Higher bounded Hochschild cohomology of von Neumann algebras}\label{30007303}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every complex von Neumann algebra M and every integer $k\geq 2$, is each bounded k-cocycle with coefficients in M a bounded coboundary, that is $H^k(M,M)=0$, without a complete-boundedness or separability restriction?
  \subsection{Short English statement}
  For every complex von Neumann algebra M and every integer $k\geq 2$, is each bounded k-cocycle with coefficients in M a bounded coboundary, that is $H^k(M,M)=0$, without a complete-boundedness or separability restriction?
