statement: |-
  % UnsolvedMath ID 2100302; source catalogue code AMR-020-0302
  \setcounter{section}{2100301}
  \section{Open Problems in Integrable Systems — Two-dimensional case.}\label{2100302}
  {\small\sffamily UnsolvedMath ID 2100302 · Dynamical Systems}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For a smooth Riemannian metric $g$ on $M$, a natural Hamiltonian on the canonical symplectic cotangent bundle $T^*M$ is \[H(x,p)=\tfrac12\sum_{i,j}g^{ij}(x)p_ip_j+U(x),\] with smooth potential $U$ and inverse metric coefficients $g^{ij}$. A polynomial integral of degree $d$ is a smooth function $F(x,p)$ polynomial of degree $d$ in the cotangent variables $p$, satisfying $\{H,F\}=0$. Following the source, integrals which are functions of $H$ alone are trivial. A geodesic flow is the case $U=0$.
  \paragraph{Statement recorded in the supplied source.}
  Construct a natural system on $S^2$ with nonconstant $U$ admitting a nontrivial polynomial integral of degree exactly $5$, while every polynomial integral of degree less than $5$ is trivial. \sref{2100302}{2}
  \subsection{Short English statement}
  Find a smooth natural system on the sphere whose first nontrivial polynomial integral has degree five and whose potential is not constant.
  \subsection{Sources}
