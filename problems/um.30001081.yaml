title: Inference from Randomly Oriented Tomographic Marginals
field: mathematics
tier: prose
statement: Let $\rho$ be an unknown centered bounded probability density supported on a compact subset of $\mathbb R^3$. Given finitely many two-dimensional marginals of $\rho$ in random unknown orientations and $n$ independent realizations of the resulting stochastic Radon transform, what can be inferred about $\rho$?
