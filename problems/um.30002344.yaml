title: Torus Quotients among Simple Compact Kähler Threefolds
field: mathematics
tier: prose
statement: Let $X$ be either a smooth compact Kähler threefold or a normal $\mathbb Q$-factorial compact Kähler threefold with at most terminal singularities. If no positive-dimensional subvariety passes through a very general point, must $X$ be bimeromorphic to $T/G$ for a torus $T$ and a finite group $G$ acting on it?
