statement: Does the conjectural Kostka–Shoji formula yield the graded $GL_N$-module identity $\Gamma(T_r^*B_N^r,O(\mu))=\Gamma(B_N^r,\operatorname{Sym}^{\bullet}T_rB_N^r\otimes O(\mu))=\bigoplus_{\lambda\geq\mu}K_{\lambda\mu}^{-,\bullet}\otimes V_\lambda$?
