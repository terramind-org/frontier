statement: For $\varepsilon\dot x(t)=g(x(t-r_1),\ldots,x(t-r_m))$ with $r_i=r_i(x(t))$, if a singular solution composed of inner and outer solutions exists at $\varepsilon=0$, does a genuine solution exist for every sufficiently small $\varepsilon>0$?
