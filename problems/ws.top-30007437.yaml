statement: |-
  \section*{Sharp L-infinity extension from the two-sphere}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Let E $g(x)=integral_S2$ g(omega) exp(2pi i x dot omega) d sigma(omega). For every $p>3$, is there $C_p$ with ||E $g||_Lp(R3)<=C_p||g||_Linfinity(S2)$ for all bounded measurable g?
  \subsection{Short English statement}
  Let E $g(x)=integral_S2$ g(omega) exp(2pi i x dot omega) d sigma(omega). For every $p>3$, is there $C_p$ with ||E $g||_Lp(R3)<=C_p||g||_Linfinity(S2)$ for all bounded measurable g?
