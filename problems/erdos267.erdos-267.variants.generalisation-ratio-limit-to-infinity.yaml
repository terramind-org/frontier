id: erdos267.erdos-267.variants.generalisation-ratio-limit-to-infinity
title: "Erdős Problem 267 (variant: generalisation_ratio_limit_to_infinity)"
field: mathematics
tier: proof
statement: |-
  Let $F_1=F_2=1$ and $F_{n+1} = F_n + F_{n-1}$ be the Fibonacci sequence.
  Let $n_1 < n_2 < \dots$ be an infinite sequence with $\frac {n_k}{k} \to \infty$. Must
  $\sum_k \frac 1 {F_{n_k}}$ be irrational?
