id: um.20002852
title: The Faran homotopy question and a rank-five barrier
field: mathematics
tier: prose
statement: |-
  Given proper holomorphic maps $f,g:\mathbb B^n\to\mathbb B^N$, how does one show that $f$ and $g$ are not homotopic? Find homotopy invariants for proper holomorphic maps between balls.

  Special case (Lebl): Is the Faran map from $\mathbb B^2$ to $\mathbb B^4$ given by
  $$
  (z,w)\longmapsto (z^3,\sqrt3zw,w^3,0)
  $$
  homotopic to $(z,w)\longmapsto(z,w,0,0)$?
