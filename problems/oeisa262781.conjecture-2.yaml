lean:
  module: FormalConjectures.OEIS.«262781»
  decl: OeisA262781.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) :
        a n = 1 ↔ n ∈ singletons
  context:
    - open OeisA262781
  definitions:
    - name: OeisA262781.a
      kind: def
      text: |-
        /--
        Number of ordered ways to write $n$ as $x^2 + \phi(y^2) + \phi(z^2)$ ($x \ge 0$ and $0 < y \le z$)
        with $y$ or $z$ prime.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.range (n + 1),
            ∑ y ∈ Finset.Ico 1 (n + 1),
              ∑ z ∈ Finset.Ico y (n + 1),
                if (y.Prime ∨ z.Prime) ∧ x ^ 2 + Nat.totient (y ^ 2) + Nat.totient (z ^ 2) = n then
                  1
                else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/262781.lean#L34
    - name: OeisA262781.singletons
      kind: def
      text: |-
        /-- The set of exceptional values of $n$ for which $a(n) = 1$. -/
        def singletons : Finset ℕ :=
          {3, 5, 9, 10, 17, 20, 24, 25, 31, 36, 45, 73, 80, 101, 136, 145, 388, 649}
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/262781.lean#L61
