lean:
  module: FormalConjectures.OEIS.«11545»
  decl: OeisA11545.conjecture1
  statement: "theorem conjecture1 : ∀ n, ¬ IsSquare (a n)"
  context:
    - open OeisA11545
    - open Real Int
  definitions:
    - name: OeisA11545.a
      kind: def
      text: |-
        /-- a n is the integer whose decimal digits are the first $n+1$ decimal digits of $\pi$. -/
        noncomputable def a (n : ℕ) : ℕ :=
          (floor (Real.pi * (10 : ℝ) ^ n.cast)).toNat
