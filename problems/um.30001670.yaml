title: Chromatic Boundedness of Wheel-Free Graphs
field: mathematics
tier: prose
statement: For a graph $G$, let $\omega(G)$ be its clique number and $\chi(G)$ its chromatic number. A wheel is a pair $(C,v)$ where $C$ is an induced cycle of length at least $4$ and $v\notin V(C)$ has at least three neighbors on $C$. Let $\mathcal{C}$ consist of graphs with no wheel. Does there exist $f:\mathbb{N}\to\mathbb{N}$ such that $\chi(G)\leq f(\omega(G))$ for every $G\in\mathcal{C}$?
