title: Open Problems in Arithmetic Dynamics — Question 15
field: mathematics
tier: prose
statement: |-
  We collect some of the natural questions that one might ask
  about the moduli spaces $\mathcal{M}_d^N$ and about automorphism groups.
  \begin{parts}

  (a)
  For $N\ge2$, are all \textup(some, none\textup) of the moduli
  spaces $\mathcal{M}_d^N$ rational varieties?

  (b)
  For each $(N,d)$, describe the possible groups $\operatorname{Aut}(f)$ for
  $f\in\mathcal{M}_d^N$, or at least give a good upper bound for
  \[
  U(N,d):=\sup_{f\in\mathcal{M}_d^N}\#\operatorname{Aut}(f)
  \]
  in terms of $N$ and $d$. It is known that $U(N,d)$ is
  finite [MR2741188], that
  $U(1,d)\le\max\{60,2d+2\}$ [MR2884382, Example 2.54], and that
  $U(2,d)\le60d^6$ [arxiv1509.06670, Theorem 6.2].

  (c)
  Describe the subvarieties of $\mathcal{M}_d^N$ corresponding to
  maps $f$ whose automorphism group $\operatorname{Aut}(f)$ is non-trivial.
  See [MR3709645] for a detailed analysis for $N=1$
  and [arxiv1607.05772] for some partial
  results for $N=d=2$. For example,
  \[
  \{f\in\mathcal{M}_2^1\cong\mathbb{A}^2:\operatorname{Aut}(f)\ne1\}=\text{cuspidal cubic curve in $\mathbb{A}^2$,}
  \]
  with $\operatorname{Aut}(f)\cong\mathbb{Z}/2\mathbb{Z}$ except for the map $f$ at the cusp,
  for which $\operatorname{Aut}(f)\cong{\mathcal{S}}_3$.

  (d)
  Most of the spaces $\mathcal{M}_d^N$ are singular. Describe the
  singularity locus. The case $N=1$ is analyzed
  in [MR3709645].
  \end{parts}
