statement: |-
  \section*{Periodic tilings by bounded measurable sets in three dimensions}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If a bounded measurable set of positive volume in $R^3$ tiles $R^3$ by translations up to measure-zero overlaps, must some such tiling have its translation set invariant under a full-rank lattice?
  \subsection{Short English statement}
  If a bounded measurable set of positive volume in $R^3$ tiles $R^3$ by translations up to measure-zero overlaps, must some such tiling have its translation set invariant under a full-rank lattice?
