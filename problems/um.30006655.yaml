id: um.30006655
title: Classification of Minimal Synthetic Buildings
field: mathematics
tier: prose
statement: For each finite group $G$ and prime $p$, prove that there are only finitely many equivariant homotopy types of minimal synthetic buildings; prove that the $p$-subgroup complex $\Delta(\mathcal S_p(G))$ has the equivariant homotopy type of one; and prove that every minimal synthetic building is equivariantly homotopy equivalent to a homomorphic image of such a complex. For groups of Lie type in characteristic $p$, prove that every nontrivial minimal synthetic building is equivariantly homotopy equivalent to the Tits building.
