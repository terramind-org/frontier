title: Connected toric and square-zero classes in three variables
field: mathematics
tier: prose
statement: |-
  **Problem 25.** For \(R=k[x_1,x_2,x_3]\), is every multigraded Hilbert scheme connected?

  **Remark.** For \(R=k[x_1,\ldots,x_{26}]\), there are non-connected examples, cf. Francisco Santos, *Non-connected toric Hilbert schemes*. Find examples with fewer variables.
