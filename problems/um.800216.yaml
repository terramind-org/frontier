title: Several Complex Variables Problem List — Problem 12
field: mathematics
tier: prose
statement: |-
  Let $\lbrace U_n \rbrace$ be an increasing sequence of Stein open subsets of
  a Stein Space $X$. Is $\bigcup_{n=1}^{\infty} U_n$ Stein? (If X is a complex
  manifold, not necessarily Stein, the answer is in general no.)\\
