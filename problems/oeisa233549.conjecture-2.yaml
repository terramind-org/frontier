id: oeisa233549.conjecture-2
title: Number of ways to write $n = p + q$ ($q > 0$) with $p$ and $(\phi(p)\phi(q))^4 + 1$ prime (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): If $n > 2$ is not equal to $26$, then there is a prime $p < n$
  with $(\phi(p)\phi(n-p))^2 + 1$ prime.
