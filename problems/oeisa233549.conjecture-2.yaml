  module: FormalConjectures.OEIS.«233549»
  decl: OeisA233549.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 2 < n) (hne : n ≠ 26) :
        ∃ p < n, p.Prime ∧ Nat.Prime ((p.totient * (n - p).totient) ^ 2 + 1)
