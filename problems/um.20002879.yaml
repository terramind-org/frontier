title: Equivariant hyperquadric embeddings and a standard-parabolic obstruction
field: mathematics
tier: prose
statement: "**Problem 1 (M. Kolář).** Assume \\(M\\subset \\mathbb C^2\\) is a real analytic hypersurface that admits a nonlinearizable automorphism \\(H\\). Does there exist a hyperquadric \\(Q\\subset \\mathbb C^n\\) such that \\(M\\hookrightarrow Q\\) nontrivially and \\(H\\) is induced by an automorphism of \\(Q\\)? Can a bound on \\(n\\) be found?"
