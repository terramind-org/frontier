title: Subword complexes as boundary complexes of brick compactifications
field: mathematics
tier: prose
statement: |-
  For the brick (cluster) compactification of a braid variety, which boundary strata are present, what are their closure relations, and when does this combinatorics agree with cluster-complex or brick-polytope combinatorics?

  The exact AIM record asks:

  The demonstrative “this” is ambiguous in isolation. The two immediately preceding records in the same section ask:

  1. whether a braid variety has a natural compactification whose smaller strata also carry cluster structures; and
  2. whether brick manifolds can be obtained by cluster-theoretic means.

  The 2023 AIM workshop summary confirms this reading: it considers the inclusion of the braid variety \(X(\mathbf i)\) into its brick variety \(\operatorname{brick}(\mathbf i)\), reports that the latter is a cluster compactification, and asks about further polytopal and positive-geometric structure. Thus the recovered question is:

  This report answers the first two parts exactly, gives the precise finite-type case in which the subword and cluster complexes agree, and exhibits a small obstruction to any word-independent identification in general.
