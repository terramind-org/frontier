title: Connectivity of Nonnegative Flats in Weighted Matroids
field: mathematics
tier: prose
statement: Let $M$ be a finite simple rank-$3$ matroid on $n$ points with real weights $a_i$ of nonnegative total sum. Is the subconfiguration of nonnegative-weight points connected by the lines of nonnegative weight? More generally, for a rank-$r$ matroid, is the order complex of the nonnegative proper flats $(r-3)$-connected, and is it shellable?
