title: The filtered geometric-fixed-point model and an odd-primary answer for a-inverted real Artin--Tate spectra
field: mathematics
tier: prose
statement: |-
  **\(a\) inverted Artin--Tate \(\mathbb R\)-motives.** The category of
  Artin--Tate \(\mathbb R\)-motives has a topological model as a
  \(1\)-parameter deformation of \(C_2\)-equivariant homotopy theory
  [arXiv:2010.10325]. Let \(\mathrm{Sp}_{\mathbb R}^{AT}\) denote this
  category. What category do you get when you invert the class \(a\) in
  \(\mathrm{Sp}_{\mathbb R}^{AT}\)?
