title: Research Problems in Function Theory — Problem 8.19
field: mathematics
tier: prose
statement: Let $\mu\geq1$ be a singular measure on the boundary of the unit disc $\mathbb{D}$; and let $S_\mu$ be the corresponding singular inner function \[S_\mu(z)=\exp\Big\{\int^{2\pi}_0\frac{z+e^{i\theta}}{z-e^{i\theta}}\,d\mu(\theta)\Big\},\hspace{1cm}z\in \mathbb{D}.\] The function $S_\mu$ is said to be discrete if $\mu$ is discrete, and continuous if it has no discrete part. If $S_\mu$ is discrete, does there exist some $\delta > 0$ such that $\|S_\mu-s_\nu\|_\infty>\delta$ for all continuous functions $S_\nu$? The answer is `no' if `discrete' and `continuous' are interchanged . (K. Stephenson)
