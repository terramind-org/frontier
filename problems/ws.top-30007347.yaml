title: A directional zero–one law for finite-range-dependent random environments
field: mathematics
tier: prose
statement: |-
  \section*{A directional zero–one law for finite-range-dependent random environments}\label{30007347}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For nearest-neighbor random walk in a stationary ergodic uniformly elliptic environment on $Z^d$, $d\geq 3$, whose rows have the specified finite-dependence independence for separated infinite sets, is the annealed probability of $X_n\cdot \ell \to +infinity$ always zero or one for every deterministic nonzero real direction ell?
  \subsection{Short English statement}
  For nearest-neighbor random walk in a stationary ergodic uniformly elliptic environment on $Z^d$, $d\geq 3$, whose rows have the specified finite-dependence independence for separated infinite sets, is the annealed probability of $X_n\cdot \ell \to +infinity$ always zero or one for every deterministic nonzero real direction ell?
