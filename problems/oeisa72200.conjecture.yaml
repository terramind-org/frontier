  definitions:
    - name: OeisA72200.a
      kind: def
      text: |-
        /-- Smallest $k$ such that $k!$ contains exactly $n$ 6's in base 10, or 0 if no such $k$ exists. -/
        noncomputable def a (n : ℕ) : ℕ :=
          if h : ∃ k, (Nat.digits 10 k.factorial).count 6 = n then
            Nat.find h
          else
            0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/72200.lean#L35
