schema: 1
id: pollocksconjecture.pollock-tetrahedral.salzer-levine
title: Pollock's (tetrahedral numbers) conjecture (salzer_levine)
field: mathematics
tier: proof
statement: |-
  Salzer–Levine strengthening (as stated on Wikipedia/OEIS):
  there are exactly $241$ integers that are not a sum of $4$ tetrahedral numbers, and the largest is $343867$.
