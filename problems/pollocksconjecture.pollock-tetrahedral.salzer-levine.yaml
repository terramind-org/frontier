  context:
    - open PollocksConjecture
    - open PollocksConjecture.pollock_tetrahedral
    - open scoped BigOperators
  definitions:
    - name: PollocksConjecture.NotSumOfFourTetrahedral
      kind: def
      text: |-
        /-- The set of natural numbers that are **not** a sum of $4$ tetrahedral numbers. -/
        def NotSumOfFourTetrahedral : Set ℕ :=
          {N : ℕ | ∀ f : Fin 4 → ℕ, N ≠ ∑ i, tetrahedral (f i)}
