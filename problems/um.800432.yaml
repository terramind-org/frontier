title: Analysis of Boolean Functions — Correlation Bounds for Polynomials
field: computer-science
tier: prose
statement: Find an explicit (i.e., in $\mathsf{NP}$) function $f \colon \mathbb{F}_2^n \to \mathbb{F}_2$ such that we have the correlation bound $|\mathbb{E}[(-1)^{\langle f(\mathbf{x}), p(\mathbf{x}) \rangle }]| \leq 1/n$ for every $\mathbb{F}_2$-polynomial $p \colon \mathbb{F}_2^n \to \mathbb{F}_2$ of degree at most $\log_2 n$.
