title: Classifying and Ubiquitous Infinite Group Actions
field: mathematics
tier: prose
statement: For an infinite finitely presented group $G$, call $G$ classifying if free $G$-actions with different numbers of regular orbits cannot be transformed into one another, and call $G$ ubiquitous if every semifree $G$-action can be transformed into a free $G$-action. Does there exist a finitely presented, or at least finitely generated, group that is not classifying? Is every finitely presented amenable group ubiquitous?
