title: Equality of the Andreadakis and Representation-Ring Filtrations
field: mathematics
tier: prose
statement: |-
  Let $A_n(k)$ be the Andreadakis–Johnson filtration of $\operatorname{Aut}(F_n)$, and let $D_n(k)$ be the kernel of its action on $J/J^{k+1}$, where $J$ is the augmentation ideal of the universal $\operatorname{SL}_2(\mathbb C)$-representation ring of $F_n$. Is

  $$A_n(k)=D_n(k)$$

  for every $k\geq1$?
