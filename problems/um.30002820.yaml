title: Discrete-Conformal Metric Subdivision Schemes
field: mathematics
tier: prose
statement: Let $T$ be a triangulated surface and let discrete conformally equivalent metrics $\lambda,\mu$ satisfy $\mu_{ij}=e^{(u_i+u_j)/2}\lambda_{ij}$. Does there exist a metric subdivision scheme producing subdivided metrics $\lambda',\mu'$ that remain discretely conformally equivalent?
