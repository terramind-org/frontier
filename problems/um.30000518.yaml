title: Joint $\Gamma$-Convergence for Evolutionary Variational Problems
field: mathematics
tier: prose
statement: Let $(\mathcal E_k,\mathcal R_k)$, or $(\mathcal E_k,\mathcal K_k)$ in the Hamiltonian case, be pairs of time-dependent functionals whose two components $\Gamma$-converge independently to $(\mathcal E,\mathcal R)$, respectively $(\mathcal E,\mathcal K)$. If associated solutions $q_k$ converge pointwise to $q$, what joint $\Gamma$-convergence conditions ensure that $q$ solves the evolution problem determined by the pair $(\mathcal E,\mathcal R)$, respectively $(\mathcal E,\mathcal K)$?
