title: Seed-preserving explicit bounds for unirational hypersurfaces
field: mathematics
tier: prose
statement: |-
  Problem 1

  Find more integers $d$ and $n$ such that a general hypersurface of degree
  $d$ in $\mathbb P^n_{\mathbb C}$ is unirational.
  Similarly,
  find more integers $d$ and $n$ such that every smooth hypersurface of degree
  $d$ in $\mathbb P^n_{\mathbb C}$ is unirational.
