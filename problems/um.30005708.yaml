title: Profinite Rigidity of Rational Euler Characteristics for Coxeter Groups
field: mathematics
tier: prose
statement: When are Coxeter groups virtually RFRS? Do there exist Coxeter groups $W_1,W_2$ with isomorphic profinite completions but $\chi(W_1)\neq\chi(W_2)$? For the Neretin group $N_q$, do $H^k(N_q,B_i(N_q))$ and $H_c^k(E_{\mathcal O}N_q,\mathbb Q)$ vanish for every $k$? Do non-good Coxeter groups exist?
