lean:
  module: FormalConjectures.ErdosProblems.«611»
  decl: Erdos611.erdos_611.parts.i
  statement: |-
    theorem erdos_611.parts.i :
        ∀ c > (0 : ℝ), ∀ ε > (0 : ℝ), ∀ᶠ n : ℕ in atTop, ∀ G : SimpleGraph (Fin n),
          AllMaximalCliquesAtLeast G (c * (n : ℝ)) →
            (G.cliqueTransversalNumber : ℝ) ≤ ε * (n : ℝ)
  context:
    - open Erdos611
    - open Erdos611.erdos_611
    - open Erdos611.erdos_611.parts
    - open Filter
  definitions:
    - name: Erdos611.AllMaximalCliquesAtLeast
      kind: def
      text: |-
        /-- `AllMaximalCliquesAtLeast G k` means that every maximal clique of `G` has at least `k`
        vertices. -/
        def AllMaximalCliquesAtLeast {V : Type} (G : SimpleGraph V) (k : ℝ) : Prop :=
          ∀ s ∈ G.cliqueSizes, k ≤ (s : ℝ)
