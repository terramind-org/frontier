title: Boundary Unique Continuation on General Lipschitz Domains
field: mathematics
tier: prose
statement: |-
  Let $\Omega\subset\mathbb R^n$ be an arbitrary Lipschitz domain, let $B$ be centered on $\partial\Omega$, and let $u\in C(\overline\Omega)$ be harmonic in $\Omega$. If $u=0$ on $\Sigma=B\cap\partial\Omega$ and

  $$\mathcal H^{n-1}\bigl(\{x\in\Sigma:\nabla u(x)=0\}\bigr)>0,$$

  must $u\equiv0$ in $\Omega$, without any smallness assumption on the Lipschitz constant?
