title: Smooth Moduli Spaces of Tame Algebras
field: mathematics
tier: prose
statement: |-
  Let $A$ be a tame finite-dimensional algebra, let $C\subseteq\operatorname{rep}(A,d)$ be a closed irreducible invariant subvariety with $\theta$-stable decomposition $C=m_1C_1\dotplus\cdots\dotplus m_rC_r$, and suppose no $C_i$ is an orbit closure. Is the natural finite birational surjection
  $$
  \Psi:\prod_{i=1}^r S^{m_i}(\mathcal M(C_i)_{\theta}^{ss})\longrightarrow\mathcal M(C)_{\theta}^{ss}
  $$
  always an isomorphism? More generally, are moduli spaces of semistable representations of tame algebras always smooth?
