title: Definability Complexity of Subsets of the First Uncountable Ordinal
field: mathematics
tier: prose
statement: Given $A\subseteq\omega_1$, what is the least Lévy-hierarchy complexity of a parameter-free formula $\Phi(x)$ such that one can pass to a stationary-set-preserving set-forcing extension in which $A$ is defined by $\Phi$ over $\langle H(\omega_2),\in\rangle$, or over a natural expansion such as $\langle H(\omega_2),\in,\mathrm{NS}_{\omega_1}\rangle$?
