title: Classification Problems for Finite Weyl Groupoids
field: mathematics
tier: prose
statement: Are all finite Weyl groupoids invariants of Nichols algebras? Can simplicial arrangements be classified? How far does the connection between reflection groupoids and cluster algebras extend? What is the connection with toric varieties? How can sporadic finite Weyl groupoids be explained? Can the classification of finite-dimensional Nichols algebras of diagonal type be derived from finite Weyl groupoids?
