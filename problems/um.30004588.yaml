statement: For Ising Glauber dynamics on transitive graphs and heat-bath dynamics in FK random-cluster models, does the weighted-majority characterization of noise sensitivity persist; are the log-Sobolev constants comparable to relaxation times; are critical planar crossing events noise sensitive; and do exceptional times exist?
