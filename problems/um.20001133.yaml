title: A global density theorem below the 3k-4 threshold
field: mathematics
tier: prose
statement: |-
  **Problem 4.2 (V. Sós).** Let \(A\) be a strictly increasing infinite sequence of integers, and denote by \(A_n\) the initial \(n\)-element segment of \(A\). Suppose that
  \[
  |A_n+A_n|<Cn.
  \]
  What can be said about the structure of \(A\)?
