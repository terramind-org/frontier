title: Computing Galois Closures over Rational Function Fields
field: mathematics
tier: prose
statement: Let $k$ be a field, let $a_1,\ldots,a_n$ be algebraically independent over $k$, set $K=k(a_1,\ldots,a_n)$, and let $L/K$ be an explicitly given finite separable extension. Construct an algorithm that computes the Galois group of the Galois closure of $L/K$.
