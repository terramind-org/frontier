title: A dependence-robust quantitative Anscombe-Renyi bound
field: mathematics
tier: prose
statement: |-
  Let \(X_1,X_2,\ldots\) be i.i.d. random variables with mean 0 and variance 1, and let \(S_n=\sum_{i=1}^nX_i\).

  For \(b>0\), let \(T_b\) be a sequence of random times. The following theorem is due to Renyi (1961): if \(T_b/n_b\overset p\to1\), where deterministic \(n_b\to\infty\), then
  \[
  \frac{S_{T_b}}{\sqrt{n_b}}\to N(0,1).
  \]
  Can we get a bound on \(d(S_{T_b}/n_b,Z)\)?

  Some remarks: if \(T_b\) is independent of \(X_1,X_2,\ldots\), then Doebler has some results. Also, see “Randomly Stopped Sums” by Allan Gut.

  Bound \(d_K(S_T/\sqrt n,Z)\) using the fixed-sample normal approximation error and a quantitative concentration profile of \(T/n\) near \(1\), allowing arbitrary dependence between \(T\) and all summands.
