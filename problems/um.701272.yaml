title: Kourovka Notebook Problem 16.80
field: mathematics
tier: prose
statement: |-
  Suppose that a group $G$ is obtained from the
  free product of torsion-free groups $A_1, \ldots , A_n$ by
  imposing $m$ additional relations, where $m<n$. Is it true that
  the free product of some $n-m$ of the $A_i$ embeds into $G$?
