id: um.20001817
title: A fixed-space orbifold-link obstruction to Ricci smoothing
field: mathematics
tier: prose
statement: |-
  Let $K$ be a simplicial complex with metric $g$ such that each simplex has a metric with positive (or flat) curvature and $K$ has positive (or nonnegative) curvature in the Alexander sense. Does a Ricci flow $(K,g(t))$ exist such that for each $t>0$, $g(t)$ is a smooth orbifold metric and
  $$\lim_{t\to0}g(t)=g$$
  in the Gromov--Hausdorff topology. Can one get rigidity in the nonnegative case?
