title: Open Problems on Central Simple Algebras — Problem 9
field: mathematics
tier: prose
statement: |-
  (These problems are related to the following very
  special question stated by M. Mahdavi-Hezavehi: \emph{If the
  multiplicative group $F^\times$ is divisible, does it follow that
  $\operatorname{Br}(F)$ is zero?} The answer is ``yes'' if $\operatorname{Br}(F)$ is generated by
  cyclic algebras, because cyclic algebras are split over such a field.
  Therefore the answer is also ``yes'' if $F$ has characteristic zero,
  because in that case $F$ has all the roots of unity so the Merkurjev--Suslin theorem applies.)

  For composite $n$, even the following is unclear:

  Is $\operatorname{Br}_p[4](F)$ generated by cyclic algebras of degree $4$ when $\operatorname{char} F \neq 2$ and $\sqrt{-1} \not \in F$?
