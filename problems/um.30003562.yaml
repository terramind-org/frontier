title: Volume Bounds from Mahler Measures of Biperiodic Links
field: mathematics
tier: prose
statement: |-
  Let $L$ be a semi-regular biperiodic alternating link, let $\Lambda$ be its toroidally alternating quotient, and let $p(z,w)$ be the characteristic polynomial of the associated toroidal dimer model. Is

  $$\operatorname{vol}\!\left(T^2\times(-1,1)\setminus L\right)\leq2\pi m(p(z,w))$$

  hold?
