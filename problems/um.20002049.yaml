title: The critical Q-density fibre and the kernel of P
field: mathematics
tier: prose
statement: |-
  Problem 27: When does Q determine the metric up to constant rescaling within a given conformal class? Since we know how Q changes under conformal rescaling: ̂

  Q = Q + P log Ω,

  where P is a linear differential operator from functions to n-forms whose symbol is ∆ n/ 2 this question is equivalent to

  Problem 28: When does the equation \(Pf=0\) have only constant solutions?
