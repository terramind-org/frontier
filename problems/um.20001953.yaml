title: Why fixed subtori miss the regular 3-Sasakian zero set
field: mathematics
tier: prose
statement: |-
  S1

  Question 2.6 (C. Boyer) In the case of 3-Sasakian reduction by abelian groups, would it be possible to extract information about the cohomology of the reductions by using fixed points of smaller tori? The question is motivated by the fact that some cases of 3-Sasakian reductions of spheres by S1 is well-understood. Suppose there is a circle action on S4n+3, where the action is locally free on the whole sphere, and free on the zero level set. Then one can see explicitly that H∗

  (S4n+3; Q) surjects onto H∗(S4n+3 ///S 1; Q), up to the middle dimension. The idea would be to look at the fixed point set M H for subtori H ⊂ T, where we start with the abelian group T acting on the 3-Sasakian manifold M. Note that the fixed point sets M H are contact, and for the Sasakian case, known examples of M H are spheres.

  Comment 2.7 (C. Boyer) Main references for 3-Sasakian toral reductions are [BG99, BGM94, BGMR98].

  3 Kirwan surjectivity for contact quotients

  The official PDF, page 4, confirms the intended formula
  \[
  H_{S^1}^*(S^{4n+3};\mathbb Q)\longrightarrow
  H^*(S^{4n+3}///S^1;\mathbb Q)
  \]
  and the notation \(M^H\). The final line “3 Kirwan surjectivity for
  contact quotients” is the next section heading, not part of Question 2.6.

  The recovered question is therefore: can fixed sets \(M^H\) of connected
  subtori \(H\subset T\) be used to compute ordinary rational cohomology of
  a 3-Sasakian torus reduction, extending the understood circle reductions
  of spheres?
