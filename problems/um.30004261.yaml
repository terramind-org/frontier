title: Free Decompositions of Compact Quantum Groups
field: mathematics
tier: prose
statement: When does a compact matrix quantum group $(G,u)$ admit a free decomposition of the sequence $(\operatorname{Fix}(u^{\otimes n}))_{n\geq1}$? Is this equivalent to $G$ having a free fusion semiring, and how can the notion be generalized to allow negative free cumulants?
