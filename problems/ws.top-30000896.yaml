  \section{Ramsey Sets and Finite Transitive Embeddings}\label{30000896}
  {\small UnsolvedMath ID 30000896 · Combinatorics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  A finite set $S$ in Euclidean space is Ramsey if, for each integer $r\ge2$, there exists a dimension $N$ such that every coloring $c:\mathbb R^N\to\{1,\ldots,r\}$ contains a monochromatic isometric copy of $S$ at its original scale. The dimension may depend on $S$ and $r$; no regularity is required of the coloring. Is $S$ Ramsey if and only if it embeds in a finite set whose isometry group acts transitively?
  \par\smallskip\textit{Formulation references:} \sref{30000896}{1}, \sref{30000896}{2}.
