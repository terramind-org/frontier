title: Holomorphic Symplectic Geometry — Question 1
field: mathematics
tier: prose
statement: |-
  In the two last examples it would seem simpler to start with a moduli space $\mathcal{M}$ for which the natural compactification $\overline{\mathcal{M}}$ is smooth; in that case $\overline{\mathcal{M}}$ is a hyperk\"ahler manifold [M], but it turns out that it is a deformation of $S^{[r]}$ or $K_r(T)$ (G\"ottsche-Huybrechts, O'Grady, Yoshioka ...). On the other hand, when $\overline{\mathcal{M}}$ is singular, it
  admits a hyperk\"ahler desingularization only in the two cases considered by O'Grady [KLS].
  Thus it seems that a new idea is required to answer our first problem:

  Find new examples of hyperk\"ahler manifolds.
