title: Local Systems from Frobenius-Invariant Sections
field: mathematics
tier: prose
statement: Let $M$ be a $(\varphi, \Gamma)$-module (or p-adic Hodge module) over the Robba/Fontaine ring associated to a $p$-adic family over a rigid analytic base $F^a$. Do the Frobenius invariants $M^{\varphi = 1}$ form a local system of $\mathbb{Q}_p$-vector spaces on $F^a$?
