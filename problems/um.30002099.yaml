title: Exceptional Dynamics of Polarized Surface Endomorphisms
field: mathematics
tier: prose
statement: For regular polarized self-maps of smooth projective surfaces over a number field, can the exceptional cases with no periodic point having multiplicatively independent derivative eigenvalues be classified, and can the resulting invariant algebraic curves be naturally parameterized by elements of $\overline{\mathbb Q}$ rather than $\mathbb Q$?
