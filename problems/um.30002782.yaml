title: Independence Complexes and Alternating-Sign Matrices
field: mathematics
tier: prose
statement: Let $G$ be a graph whose independence complex has one cohomology generator, let $e$ be an edge, and form $G_k$ by replacing $e$ with a path of $3k+1$ edges. Find a closed formula and a natural generating function for the largest weight in a cohomology representative of $G_k$. Also, find independence complexes that realize Kuperberg’s symmetry classes of alternating-sign matrices.
