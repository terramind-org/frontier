statement: |-
  **Question 35 (Pheidas).** Let \(X\) be a variety over \(\mathbb Q\). Call
  \(X\) hyperbolic iff there is no nonconstant holomorphic map
  \(\mathbb C\to X(\mathbb C)\). Is there an algorithm which can decide
  whether a variety \(X/\mathbb Q\) over hyperbolic?

  **Is there an algorithm which can decide whether a variety
  \(X/\mathbb Q\) is hyperbolic?**
