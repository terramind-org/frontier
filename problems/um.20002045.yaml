id: um.20002045
title: Characterizing Riemannian Q-curvature
field: mathematics
tier: prose
statement: |-
  Find a geometrically meaningful, noncircular package of properties that
  uniquely selects Branson's critical \(Q\)-curvature from other natural
  weight-\(-n\) Riemannian scalar densities. Determine which familiar
  properties fail to give uniqueness and what additional normalization removes
  the ambiguity.
