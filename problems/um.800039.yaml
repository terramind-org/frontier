title: The Lyapin's Notebook — Problem 41
field: mathematics
tier: prose
statement: |-
  (G. Mashevitzky)

  - Find minimal (maximal) inclusive varieties of semigroups that cannot be defined by elementary identical inclusions.

  - Describe elementary inclusive varieties of semigroups all of whose inclusive subvarieties are elementary.

  - Describe nonelementary inclusive varieties of periodic semigroups whose inclusive supervarieties in the class of periodic semigroups are nonelementary.

  All minimal inclusive varieties of Abelian groups that cannot be defined by elementary identical inclusions are described in [M3].
