  definitions:
    - name: Green46.maxY
      kind: def
      text: |-
        /-- The maximum $y$ for a given $x$, cast to a real number for asymptotics. -/
        noncomputable def maxY (x : ℕ) : ℝ :=
          ((sSup { y | IsCoveredByResidues x y } : ℕ) : ℝ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/GreensOpenProblems/46.lean#L51
    - name: Green46.bestUpper
      kind: def
      text: |-
        /-- Best-known upper bound [Iw78]. -/
        noncomputable def bestUpper (x : ℕ) : ℝ := (x : ℝ) ^ 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/GreensOpenProblems/46.lean#L59
    - name: Green46.green_46.improve_upper.answer
      kind: def
      text: |-
        noncomputable def green_46.improve_upper.answer : ℕ → ℝ :=
          fun x : ℕ ↦ ((x : ℝ) + 1) ^ 2 / (Real.log (Real.log (3 * ((x : ℝ) + 1)))) ^ 2
