title: Open Problems in Topological Algebra — Problem 5 (Protasov)
field: mathematics
tier: prose
statement: |-
  Let $X$ be a topological space. A subgroup $H$ of $S(X)$ is called
  *distal* if for any distinct points $x_1,x_2\in X$ and any
  point $x\in X$ there is a neighborhood $U$ of $x$ such that
  $\{h(x_1),h(x_2)\}\not\subset U$ for all $h\in H$. It is proven in
  [Pr1, Theorem 4] that a left bounded subgroup $H\subset S(X)$
  is distal provided $H$ acts transitively on $X$.

  Let $X$ be a compact space and $H$ be a distal
  subgroup of $S(X)$, acting transitively on $X$. Is $H$ left
  bounded?
