  \section*{Singer vanishing in dimension four}\label{30007508}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Does every finite connected aspherical integral Poincaré-duality CW complex of formal dimension four have all L$^{2}$-Betti numbers zero outside degree two? This includes every closed aspherical topological four-manifold.
  \subsection{Short English statement}
  Does every finite connected aspherical integral Poincaré-duality CW complex of formal dimension four have all L$^{2}$-Betti numbers zero outside degree two? This includes every closed aspherical topological four-manifold.
