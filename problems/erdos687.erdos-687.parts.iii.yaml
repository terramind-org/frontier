  module: FormalConjectures.ErdosProblems.«687»
  decl: Erdos687.erdos_687.parts.iii
  statement: |-
    theorem erdos_687.parts.iii :
        ∀ ε > (0 : ℝ), (fun x : ℕ ↦ (Y x : ℝ)) =O[atTop] (fun x : ℕ ↦ (x : ℝ) ^ (1 + ε))
  context:
    - open Erdos687
