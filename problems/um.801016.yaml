title: Open Problems in Mathematical Logic — Problem 28 (Downey--Hirschfeldt--Miller--Nies [DHMN])
field: mathematics
tier: prose
statement: |-
  Is there an $x$ such that $\Omega^x \geq_T 0^{''}$ where
  $$\Omega^x = \sum_{\sigma \in 2^{<\omega}} 2^{-K^x(\sigma)}$$
  and
  $$K^x(\sigma) = \min\{|\tau| : U^x(\tau) = \sigma\}?$$
