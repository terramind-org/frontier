  \section{The Restricted Geometric Langlands Conjecture}\label{30004790}
  {\small UnsolvedMath ID 30004790 · Algebraic Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $k$ be algebraically closed, let $X/k$ be a smooth projective geometrically connected curve, and let $G$ be reductive, with $\operatorname{char}(k)$ greater than the Coxeter number of $G$. In the corresponding derived $\ell$-adic setting, prove the canonical equivalence $\operatorname{Shv}_{\operatorname{Nilp}}(\operatorname{Bun}_G)\simeq\operatorname{IndCoh}_{\operatorname{Nilp}}(\operatorname{LocSys}^{\operatorname{restr}}_{\widehat G})$.
  \par\smallskip\textit{Formulation references:} \sref{30004790}{1}, \sref{30004790}{2}.
  \subsection{Short English statement}
  Let $k$ be algebraically closed, let $X/k$ be a smooth projective geometrically connected curve, and let $G$ be reductive, with $\operatorname{char}(k)$ greater than the Coxeter number of $G$. In the corresponding derived $\ell$-adic setting, prove the canonical equivalence $\operatorname{Shv}_{\operatorname{Nilp}}(\operatorname{Bun}_G)\simeq\operatorname{IndCoh}_{\operatorname{Nilp}}(\operatorname{LocSys}^{\operatorname{restr}}_{\widehat G})$.
