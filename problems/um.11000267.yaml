title: Question 1.2 — Develop a metric theory of Outer space.
field: mathematics
tier: prose
statement: "Develop a metric theory of Outer space. The elements of infinite order in GL( n, Z) that are diagonalizable over C act as loxodromic isometries of X. When n = 2, these elements are the hyperbolic matrices; each fixes two points at infinity in X = H2, one a source and one a sink. The analogous type of element in Mod ±(Sg) is a pseudo-Anosov, and in Out( Fn) it is an iwip (irreducible with irreducible powers). In both cases, such elements have two fixed points at infinity (i.e. in the natural boundary of the symmetric space analog), and the action of the cyclic subgroup generated by the element exhibits the north- south dynamics familiar from the action of hyperbolic matrices on the closure of the Poincar´ e disc [62], [ 54]. In the case of Mod ±(Sg) this cyclic subgroup leaves invariant a unique geodesic line in Teichm¨ uller space, i.e. pseudo-Anosov’s are axial like the semi-simple elements of infinite order in GL(n, Z). Initial work of Handel and Mosher [ 43] shows that in the case of iwips one cannot hope to have a unique axis in the same metric sense, but leaves open the possibility that there may be a reasonable notion of axis in a weaker sense. (We highlighted this problem in an earlier version of the current article.) In a more recent preprint [ 42] they have addressed this last point directly, defining an axis bundle associated to any iwip, cf. [ 63]. Nevertheless, many interesting questions remain (some of which are highlighted by Handel and Mosher). Thus we retain a modified version of our original question:"
