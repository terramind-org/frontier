title: Instantaneously Complete Yamabe Flow in Higher Dimensions
field: mathematics
tier: prose
statement: |-
  Does the theory of instantaneously complete Yamabe flows on noncompact surfaces extend to higher-dimensional noncompact manifolds? For conformally hyperbolic Yamabe flows, is

  $$g(t)\geq m(m-1)t\,g_H$$

  equivalent to instantaneous completeness?
