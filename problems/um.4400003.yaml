title: Pingree open problems — Petersen tail-field problem 1
field: mathematics
tier: prose
statement: Let $A=\{0,1,\ldots,d-1\}$ and let $\sigma$ be the shift on $A^{\mathbb{Z}}$. Define $(v_n(x))_i=\#\{0\leq j\leq n:x_j=i\}$ and $(w_n(x))_i=\#\{0\leq j\leq n:x_{-j}=i\}$. Put $\mathcal{F}_n^+=\bigcap_{k\geq n}\mathcal{B}(v_n,v_{n+1},\ldots)$, $\mathcal{F}^+=\bigcap_{n\geq0}\mathcal{F}_n^+$, and define $\mathcal{F}^-$ analogously using the $w_n$. Is $\mathcal{F}^+=\mathcal{F}^-$?
