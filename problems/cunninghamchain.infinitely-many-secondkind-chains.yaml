id: cunninghamchain.infinitely-many-secondkind-chains
title: Cunningham chains — Jones's conjecture (infinitely_many_secondKind_chains)
field: mathematics
tier: proof
statement: |-
  Jones's conjecture (second kind): for every positive integer $k$, there are
  infinitely many primes $p$ that start a second-kind Cunningham chain of
  exactly length $k$.
