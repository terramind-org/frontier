lean:
  module: FormalConjectures.Arxiv.«1104.1579».CunninghamChain
  decl: CunninghamChain.infinitely_many_secondKind_chains
  statement: |-
    theorem infinitely_many_secondKind_chains (k : ℕ) (hk : 0 < k) :
        Set.Infinite {p : ℕ | IsSecondKindChainOfLength p k}
  context:
    - open CunninghamChain
  definitions:
    - name: CunninghamChain.IsSecondKindChainOfLength
      kind: def
      text: |-
        /-- `p` starts a second-kind Cunningham chain of exact positive length `k`. -/
        def IsSecondKindChainOfLength (p k : ℕ) : Prop :=
          0 < k ∧ (∀ i < k, (secondKindTerm p i).Prime) ∧ ¬(secondKindTerm p k).Prime
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Arxiv/1104.1579/CunninghamChain.lean#L57
