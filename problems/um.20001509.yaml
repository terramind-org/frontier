id: um.20001509
title: A finite-index virtual-geometric nonvanishing criterion
field: mathematics
tier: prose
statement: |-
  Clay shows that \(\ell^2\)-torsion vanishes for free-by-cyclic groups with polynomially-growing monodromies (Clay 2017, MR3667215).

  If \(G\) is a free-by-cyclic group with exponentially growing monodromy then it has non-vanishing \(\ell^2\)-torsion.

  Thus the second sentence is the conjecture to be studied. Write
  \[
   G_\Phi=F_n\rtimes_\Phi\langle t\rangle
   =\langle F_n,t\mid t^{-1}xt=\Phi(x)\ (x\in F_n)\rangle,
  \]
  where \(\Phi\in\operatorname{Aut}(F_n)\), and put \(\phi=[\Phi]\in\operatorname{Out}(F_n)\). Following Clay's sign convention, it is useful to set
  \[
   \tau^{(2)}(G):=-\rho^{(2)}(G). \]
  For free-by-cyclic groups \(\tau^{(2)}(G)\geq 0\), so the conjecture asks whether exponential growth forces \(\tau^{(2)}(G)>0\).
