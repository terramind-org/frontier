title: Negative curvature on a surface bundle over a surface
field: mathematics
tier: prose
statement: |-
  **Question 3.3.** Fix \(g,h\), with \(h\geq 2\). Does there exist a locally
  trivial fibration of surfaces
  \[
  F_h\longrightarrow X\longrightarrow B_g
  \]
  such that \(X\) admits a metric of strictly negative curvature?
