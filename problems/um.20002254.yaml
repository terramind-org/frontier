title: Ambiguous nearness and the CH obstruction for higher Countryman lines
field: mathematics
tier: prose
statement: |-
  Two linear orders $\mathbb{C}_1$ and $\mathbb{C}_2$ are \emph{near} if there is another linear order $\mathbb{C}_0$ that embeds into both of them. $\mathbb{C}_1$ and $\mathbb{C}_2$ are \emph{co-near} if there is a linear order embedding into $\mathbb{C}_1$ and $\mathbb{C}_2^\ast$, where $\mathbb{C}_2^\ast$ is the reverse of $\mathbb{C}_2$.

  Is it consistent with the continuum hypothesis that any two $\aleph_2$-Countryman lines are near or co-near?

  Two $\kappa$-sized linear orders are $\kappa$-near if some order of size $\kappa$ embeds into both, and are $\kappa$-co-near if one is $\kappa$-near the reverse of the other; take $\kappa=\aleph_2$.
