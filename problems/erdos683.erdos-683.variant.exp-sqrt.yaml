lean:
  module: FormalConjectures.ErdosProblems.«683»
  decl: Erdos683.erdos_683.variant.exp_sqrt
  statement: |-
    theorem erdos_683.variant.exp_sqrt :
        ∃ c > 0, ∀ n k : ℕ, 0 < k ∧ k ≤ n / 2 →
          (P n k : ℝ) > min (↑(n - k + 1) : ℝ) (Real.exp (c * Real.sqrt k))
