statement: Let $P$ be a Sylow $p$-subgroup of a finite group $G$, and let $\chi\in\operatorname{Irr}(G)$ have $p'$-degree and conductor $p^am$ with $p\nmid m$. Is $[\mathbb Q_{p^a}:\mathbb Q(\chi_P)]$ always not divisible by $p$?
