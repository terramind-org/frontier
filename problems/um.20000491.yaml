title: Polygonal Faber-Krahn status and an exact affine-gauge reduction
field: mathematics
tier: prose
statement: |-
  **Discrete Faber--Krahn inequality.** Among all polygons of a given area and having not more than \(N\) edges, the lowest Dirichlet eigenvalue \(\lambda_1(\Omega)\) is minimized by the regular \(N\)-gon.

  \[
  \lambda _1(\Omega)=\min_{0\ne v\in H^1_0(\Omega)}
  \frac{\int_\Omega |\nabla v|^2\,dx}{\int_\Omega v^2\,dx}. \]

  The record also asks about five subsidiary directions: local minimality of the regular polygon, convexity of a minimizer, monotonicity of the regular-polygon eigenvalues in the number of sides, the analogous first nonzero Neumann problem, and perimeter-constrained analogues. The exact AIM record says that a minimizer exists and has exactly \(N\) sides, citing Henrot, Theorem 3.3.1.

  No reconstruction of mathematical notation was needed.
