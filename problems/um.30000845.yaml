title: Kasparov’s Baum–Connes Method in Higher Rank
field: mathematics
tier: prose
statement: Can Kasparov's method for proving the Baum–Connes Conjecture—constructing a suitable $\gamma$-element and proving $\gamma=1$ by a homotopy argument—be carried out for higher-rank semisimple Lie groups, possibly using a weaker homotopy because property T obstructs $\gamma=1$ in KK-theory?
