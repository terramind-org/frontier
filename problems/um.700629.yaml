title: Kourovka Notebook Problem 10.12
field: mathematics
tier: prose
statement: |-
  Does there exist a finitely generated semigroup $S$
  with cancellation having non-exponential growth and such that its
  group of left quotients $G=S^{-1}S$ (which exists) is a group of
  exponential growth? An affirmative answer would give a positive
  solution to Problem 12 in (S. Wagon, *The Banach--Tarski
  Paradox*, Cambridge Univ. Press, 1985).
