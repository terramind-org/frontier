title: Einstein Solvable Factors and Orthogonal Levi Orbits
field: mathematics
tier: prose
statement: For a noncompact nonflat homogeneous Einstein space $G/K$ with Levi decomposition $G=G_1\ltimes G_2$ and $G_2=AN$, is the geometry induced on $G_2$ as a subspace of $G/K$ Einstein? If $G_1=H_1\cdots H_k$ is a product of simple subgroups, are the $H_i$-orbits through $[e]$ pairwise orthogonal?
