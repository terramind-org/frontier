title: Reconstruction and Response Sets of AC Networks
field: mathematics
tier: prose
statement: For connected alternating-current networks with $b$ boundary vertices and complex response matrix $\Lambda$, give an algorithm to reconstruct a network and positive-real edge conductances from $\Lambda$; describe the response sets of series-parallel networks and of planar networks with all boundary vertices on the outer face; and, when every conductance is either $\omega$ or $1/\omega$, describe the possible response matrices as functions of $\omega$.
