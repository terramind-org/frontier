title: Question 6.6 — (Sections over finite index subgroups).
field: mathematics
tier: prose
statement: (Sections over finite index subgroups). Does the natural map Homeo+(Σg)→ Modg have a section over a finite index subgroup of Modg, or not? Of course the ideas in [ Mar] are likely to be pertinent. Answers to Problem 6.5 even for specific subgroups (e.g. for Ig or more generally Ig(k)) would be interesting. It also seems reasonable to believe that the existence of sections is aﬀected greatly by the degree of smoothness one requires. Instead of asking for sections in the above questions, one can ask more generally whether there are any actions of Mod g on Σ g.
