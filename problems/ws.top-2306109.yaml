  \section{Research Problems in Function Theory — Problem 6.109}\label{2306109}
  {\small UnsolvedMath ID 2306109 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For an analytic univalent $f$ in the unit disk and $\lambda>0$, set
  \[I_{-\lambda}(r,f')=\left(\frac1{2\pi}\int_0^{2\pi}|f'(re^{i\theta})|^{-\lambda}\,d\theta\right)^{1/\lambda}.\]
  Determine the maximal growth rate as $r\uparrow1$. In particular, for $\lambda=2$, must it be $O((1-r)^{-1/2})$, the rate of the Koebe function?
  \par\smallskip\textit{Formulation references:} \sref{2306109}{1}, \sref{2306109}{2}.
  \subsection{Short English statement}
  For an analytic univalent $f$ in the unit disk and $\lambda>0$, set
