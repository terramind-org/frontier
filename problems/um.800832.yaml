title: Geometric Hydrodynamics in Open Problems — Problem 31
field: mathematics
tier: prose
statement: |-
  Geometric description of vortex sheets leads to an interesting non-local metric of hydrodynamical pedigree
  on shape spaces:
  it is an $H^{-1/2}$-metric on closed hypersurfaces bounding the same volume
  (or equivalently, on constant densities inside those hypersurfaces),
  see [IK18]. Such a metric is constructed with the help of the Neumann-to-Dirichlet operators
  and it is always nondegenerate since it is bounded below by the Kantorovich--Wasserstein distance.
  Geodesics with respect to this metric describe motions of potential fluid flows with vortex sheets
  and fluids with free dynamic boundary, cf. [IK18, Marsden, Loe].

  Describe the differential geometry of shape spaces equipped with such $H^{-1/2}$-metrics obtained as metrics on dynamic boundaries or vortex sheets.
