title: Kourovka Notebook Problem 16.5
field: mathematics
tier: prose
statement: |-
  A group is said to be *perfect* if it
  coincides with its derived subgroup. Does there exist a perfect
  locally finite $p$-group

  a) all of whose proper subgroups are
  hypercentral?

  b) all of whose proper subgroups are solvable?
