id: um.30003959
title: Diffusive Limits for the Random Lorentz Gas
field: mathematics
tier: prose
statement: |-
  For the random Lorentz-gas trajectory $X^{r,\rho}(t)$, conditioned on the particle not being trapped, does

  $$t\longmapsto\frac{X^{r,\rho}(Tt)}{\sqrt T},\qquad 0\leq t\leq1,$$

  converge weakly as $T\to\infty$ to a Wiener process with nondegenerate variance, in either the quenched or averaged-quenched setting?
