title: Three Problems from an Analytic Number Theory Session
field: mathematics
tier: prose
statement: |-
  Does there exist a Dirichlet series $D(s)$ that converges in a half-plane $\operatorname{Re}s>\alpha$ and has exactly one zero there? For the ordered Laplace eigenvalues $0<\lambda_1\leq\lambda_2\leq\cdots$ of Maass forms on $\operatorname{SL}_2(\mathbb Z)\backslash\mathbb H$, are

  $$\liminf_{j\to\infty}(\lambda_{j+1}-\lambda_j)=0,
  \qquad
  \limsup_{j\to\infty}(\lambda_{j+1}-\lambda_j)=\infty?$$

  If $x^2\equiv a\pmod m$ has many roots for highly composite $m$, can one uniformly bound how many of those roots lie in an interval of length $m^{1-\varepsilon}$?
