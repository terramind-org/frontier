title: Representation and Limits of Fractional Infinity Eigenfunctions
field: mathematics
tier: prose
statement: For the fractional infinity-eigenvalue problem, does $u(x)=\delta(x)^\alpha/(\delta(x)^\alpha+\varrho_1(x)^\alpha)$ produce every first eigenfunction when $\varrho_1(x)=\operatorname{dist}(x,\Gamma_1)$ and $\Gamma_1\subseteq\Gamma$? Is the maximal solution, with $\Gamma_1=\Gamma$, the limit of the fractional $p$-eigenfunctions as $p\to\infty$?
