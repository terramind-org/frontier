title: Geometric Hydrodynamics in Open Problems — Problem 21
field: mathematics
tier: prose
statement: |-
  In the two-dimensional case, besides the kinetic energy, this system has infinitely many enstrophy invariants.
  These invariants are Casimir functionals: they do not depend on the metric on $M$, but specify a coadjoint orbit
  (i.e. a particular set of isovortical vector fields) on which the Euler evolution takes place but say nothing
  about the dynamics on the orbit itself.

  Prove the non-integrability of the 2D Euler equation.
