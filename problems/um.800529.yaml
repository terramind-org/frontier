title: Linear Systems and Eigenvalue Problems — Problem 38 (Rerandomized subsampled trigonometric transforms)
field: mathematics
tier: prose
statement: |-
  Assume that $n = \Omega(\log r)$.
  Prove or disprove: The rerandomized SRHT of dimension $k = \mathcal{O}(r/\varepsilon^2)$ is an oblivious subspace embedding with $\alpha = 1-\varepsilon$ and $\beta = 1+\varepsilon$.
