title: Algorithms and Exponent Bounds for Dimension Subgroups
field: mathematics
tier: prose
statement: |-
  For a finitely presented group $G$ and a ring $k$, let $\Delta(kG)$ be the augmentation ideal and define

  $$\gamma_{n,k}=\{g\in G:g-1\in\Delta(kG)^n\}.$$

  Writing $\gamma_m$ for the lower central series, one has

  $$\gamma_{n,\mathbb F_p}=\prod_{mp^j\geq n}\gamma_m^{p^j},\qquad \gamma_{n,\mathbb Q}=\sqrt{\gamma_n}.$$

  How can $G/\gamma_{n,\mathbb F_p}$ and $\gamma_{n,\mathbb Z}$ be computed efficiently? Is $\gamma_{n,\mathbb Z}=\bigcap_p\gamma_{n,\mathbb F_p}$? If $c_n$ bounds the exponent of $\gamma_{n,\mathbb Z}/\gamma_n$, is $c_n=2$?
