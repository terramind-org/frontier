statement: If $X$ is $K$-convex, are the bounds $\sup_{d\geq1}M_{p,d,\theta}^X$ finite for every $1<p<\infty$ and every $0<\theta<\theta_p$, possibly even at $\theta=\theta_p$? If $X$ is UMD, does the Ornstein–Uhlenbeck operator $-L_X$ have a bounded $H^\infty(\Sigma_\theta)$ functional calculus for every $0<\theta<\theta_p$?
