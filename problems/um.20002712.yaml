title: Uniform finite results and a dihedral infinite-type boundary
field: mathematics
tier: prose
statement: |-
  Reading)** under
  “3. Reflection Groups.”  In modern notation the problem fixes a finite Coxeter
  system \((W,S)\) and a Coxeter element \(c\), and asks:

  1. Give a uniform proof that the \(c\)-sortable elements are counted by
     \[
       \operatorname{Cat}(W)=\prod_{i=1}^{r}\frac{h+d_i}{d_i}.
     \]
  2. Give a uniform proof that the map \(\operatorname{nc}_c\) to
     \(NC(W,c)=[e,c]_T\) is well-defined.
  3. Give uniform proofs that \(\operatorname{nc}_c\) and the map
     \(\operatorname{cl}_c\) to \(c\)-clusters are bijections.
  4. The definitions extend to infinite Coxeter groups.  What happens there?

  The printed PDF writes the maps as “nc” and “cl”; their dependence on the
  chosen Coxeter element is explicit in the preceding sentence. Reading's
  standard notation, used here, is \(\operatorname{nc}_c\) and
  \(\operatorname{cl}_c\). The PDF's item (1) says “Coxeter-sorted elements”
  once, while the surrounding definition and the cited paper say
  **Coxeter-sortable**; “sorted” is a source typo, not a second concept. The
  damaged “\(c.\)There” and “\(NCW\)” are repaired to \(c\), sentence spacing,
  and \(NC_W\), respectively.
