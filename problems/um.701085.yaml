title: Kourovka Notebook Problem 14.101
field: mathematics
tier: prose
statement: |-
  A group $G$ is *saturated* with groups from
  a class
  $X$ if every finite subgroup $K\leq G$
  is contained in a subgroup
  $L\leq G$
  isomorphic to some group from $X$. Is it true that
  a periodic group saturated with finite simple groups of Lie type of
  uniformly bounded ranks is itself a simple group of Lie type of
  finite rank?
