lean:
  module: FormalConjectures.ErdosProblems.«1057»
  decl: Erdos1057.erdos_1057.variants.pomerance
  statement: |-
    theorem erdos_1057.variants.pomerance :
        Tendsto (fun x ↦
          -(Real.log (carmichaelCounting x / x) * Real.log (Real.log x)) /
          (Real.log x * Real.log (Real.log (Real.log x)))) atTop (𝓝 1)
  context:
    - open Erdos1057
    - open Erdos1057.erdos_1057
    - open Erdos1057.erdos_1057.variants
    - open Nat Real Filter Set
    - open scoped Topology Asymptotics
  definitions:
    - name: Erdos1057.carmichaelCounting
      kind: def
      text: |-
        /--
        Let $C(x)$ count the number of Carmichael numbers in the interval $[1,x]$.
        -/
        noncomputable def carmichaelCounting (x : ℝ) : ℝ :=
          ({n : ℕ | IsCarmichael n ∧ (n : ℝ) ≤ x}.ncard : ℝ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/1057.lean#L45
