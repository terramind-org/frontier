  definitions:
    - name: OeisA228425.a
      kind: def
      text: |-
        /-- Number of ways to write $n = x + y$ ($x, y > 0$) with $x(x+1)/2 + y^2$ prime. -/
        def a (n : ℕ) : ℕ :=
          (Finset.Ico 1 n).filter (fun x : ℕ =>
            let y := n - x
            Nat.Prime (x * (x + 1) / 2 + y ^ 2)
          ) |>.card
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/228425.lean#L33
