statement: For a welded pair $(X,r,s)$, do cocycle weights make the second solution $s$ representation-theoretically relevant? Are the resulting representations of the welded braid group isomorphic to representations arising from a welded pair $(X,r',q)$ built from the derived solution $r'$?
