title: "Henon Maps: Open Problems — Question 34"
field: mathematics
tier: prose
statement: |-
  Suppose $\phi$ is sufficiently regular, so that
  the equilibrium state $\mu_\phi$ exists and is unique.
  Is it true that
  \begin{equation}
  \frac{1}{e^{n P(\phi)}} \sum_{x \in SP_n} e^{S_n (\phi)} \delta_x \to \mu_\phi \quad ?
  \end{equation}
