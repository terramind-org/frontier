title: Three-Full Sums and the Erdős–Ingham Dirichlet Zero Problem
field: mathematics
tier: prose
statement: Let $A$ be the set of integers representable as a sum of three $3$-full numbers. Does $A$ have positive density, and does it contain every sufficiently large integer? Separately, for $f(s)=1+2^{-s}+3^{-s}+5^{-s}$, does there exist $t\in\mathbb{R}$ with $f(1+it)=0$?
