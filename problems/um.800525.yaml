title: Linear Systems and Eigenvalue Problems — Problem 34 (Randomized SVD)
field: mathematics
tier: prose
statement: |-
  Let \(A \in \mathbb{R}^{n \times d}\) be a matrix, fix $r > 0$, and let \(\Omega \in \mathbb{R}^{n \times k}\) be an oblivious subspace injection with dimension $r$ and injectivity \(1-\varepsilon\).
  Let $\tilde{A} = (A\Omega)(A\Omega)^+A$ denote the randomized SVD approximation to $A$, and let $A_r$ be the best rank-$r$ approximation to $A$ with respect to the Frobenius norm.
  Prove or disprove: Does it necessarily hold that
  \[
  \|A - \tilde{A}\|_\mathrm{F}
  \leq (1+\mathcal{O}(\varepsilon)) \|A-A_r\|_\mathrm{F}?
  \]
