id: um.30000789
title: Sharp Dimension Threshold for Ricci-Flow Curvature Conditions
field: mathematics
tier: prose
statement: Write a curvature operator as $R=R_I+R_{\operatorname{Ric}_0}+R_W$. For $c>0$, consider the cone defined by $\operatorname{scal}(R)\geq0$ and $\lVert R_W\rVert^2\leq c\lVert R_I\rVert^2$. Let $n_0$ be the least threshold such that, in every dimension $n\geq n_0$, the Böhm–Wilking classification determines exactly which values of $c$ make this cone invariant under the curvature ODE $R'=R^2+R^\#$. It is known that $n_0\geq12$; is $n_0=12$?
