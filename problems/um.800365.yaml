title: Coxeter Groups and Unimodality — Conjecture 3
field: mathematics
tier: prose
statement: |-
  Let $(W_1,S_1)$, $(W_2,S_2)$ be two Coxeter systems, $J_1 \subseteq S_1$, $J_2 \subseteq S_2$, $u,v \in W_1^{J_1}$, $w,z \in W_2^{J_2}$ and $f: [u,v] \rightarrow [w,z]$ be a poset isomorphism such that $f([u,v]^{J_1})=[w,z]^{J_2}$. Then
  \begin{equation}

  P_{u,v}^{J_1,q}(q)=P_{w,z}^{J_2,q}(q).
  \end{equation}
