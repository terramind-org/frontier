title: Finite-Dimensional Uniform Embeddings of Compact Metric Spaces
field: mathematics
tier: prose
statement: A loose embedding of a metric space $(X,d)$ in $\mathbb R^N$ is a continuous map that preserves equality and inequality of pairwise distances. If every finite subspace of a compact metric space $(X,d)$ is loosely embeddable in the same $\mathbb R^N$, is $X$ itself loosely embeddable there? Does every compact Riemannian manifold with its geodesic distance have this property?
