title: Certifying complex-Gaussian LP auxiliary functions
field: mathematics
tier: prose
statement: For fixed $n$, characterize finite conjugation-symmetric sums of radial Gaussians $e^{-\pi a|x|^2}$ with $\operatorname{Re}a>0$, formulate a rigorous finite certificate for the Cohn--Elkies sign conditions, and test whether certified sums improve existing numerical LP bounds.
