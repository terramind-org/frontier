lean:
  module: FormalConjectures.OEIS.«217785»
  decl: OeisA217785.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 2 ≤ n) :
        ∃ m < 12 * n ^ 2, a n = some m
  context:
    - open OeisA217785
  definitions:
    - name: OeisA217785.a
      kind: def
      text: |-
        /-- Smallest integer $s > n$ such that `polyP n s` is prime,
        or `none` if no such $s$ exists. -/
        noncomputable def a (n : ℕ) : Option ℕ :=
          if ∃ s : ℕ, n < s ∧ Nat.Prime (polyP n s) then
            some (sInf {s : ℕ | n < s ∧ Nat.Prime (polyP n s)})
          else
            none
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/217785.lean#L39
