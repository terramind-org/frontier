title: Kourovka Notebook Problem 8.30
field: mathematics
tier: prose
statement: |-
  Let ${\mathfrak{X}}$, ${\mathfrak{Y}}$ be Fitting classes
  of soluble groups which satisfy the Lockett condition, i. e.
  ${\mathfrak{X}} \cap {\mathfrak{S}}_{\displaystyle{*}}={\mathfrak{X}}_{\displaystyle{*}}$, \ ${\mathfrak{Y}} \cap {\mathfrak{S}}_
  {\displaystyle{*}} = {\mathfrak{Y}}_{\displaystyle{*}}$ where ${\mathfrak{S}}$ denotes the Fitting class of all soluble groups and the lower
  star the bottom group of the Lockett section determined by the
  given Fitting class. Does ${\mathfrak{X}} \cap {\mathfrak{Y}}$ satisfy the
  Lockett condition?

  *Editors' comment (2001):* The answer is
  affirmative if ${\mathfrak{X}}$ and ${\mathfrak{Y}}$ are local
  (A. Grytczuk, N. T. Vorob'ev, *Tsukuba J. Math.*, **18**,
  no. 1 (1994), 63--67).
