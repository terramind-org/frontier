title: Absolute-order topology, endpoint conventions, and an exact rank-two family
field: mathematics
tier: prose
statement: |-
  **3. Reflection Groups. Problem 3.1 (V. Reiner).** Let \(W\) be a finite
  Coxeter group and let \(T\) be its set of all reflections. Let \(\ell\) be
  word length with respect to \(T\), the absolute length. Define the absolute
  order by
  \[
    a\le_T b \quad\Longleftrightarrow\quad
    \ell_T(b)=\ell_T(a)+\ell_T(a^{-1}b).
  \]
  What is the topology of this poset? In types \(A\) and \(B\), is there an
  EL-labeling which exhibits a shelling of the order complex? It is known that
  the absolute length poset is not shellable in type \(D\). Can this be fixed
  uniformly by retaining only the order ideal of parabolic Coxeter elements?
