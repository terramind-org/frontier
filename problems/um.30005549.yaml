id: um.30005549
title: Rational Point Counts near Hypersurfaces
field: mathematics
tier: prose
statement: For a compact $C^1$ hypersurface $M\subset\mathbb R^n$, characterize the local obstructions to the uniform estimate $N_M(\delta,Q)\asymp\delta Q^n$ for $Q\geq1$ and $Q^{\varepsilon-1}<\delta<1/2$, where $N_M(\delta,Q)$ counts pairs $(q,p)\in\mathbb Z\times\mathbb Z^n$ with $Q\leq q<2Q$ and $\operatorname{dist}(p/q,M)\leq\delta/q$.
