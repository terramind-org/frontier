title: Enriched Gromov–Witten Invariants of Del Pezzo Surfaces
field: mathematics
tier: prose
statement: Let $k$ be a perfect field of characteristic different from $2$ and $3$, and let $X$ be a rational del Pezzo surface of degree at least $4$ obtained by blowing up $\mathbb{P}^2_k$ along the prescribed finite étale subschemes. Prove the conjectural identity $W^{\mathrm{WD}}(A_0,A_1,\ldots,A_r)=Q_{X,D}(A_0)$ between the enriched curve-counting invariants.
