title: Sharper Ramification Bounds for Local Galois Representations
field: mathematics
tier: prose
statement: Let $p>2$, let $T_n$ be the reduction modulo $p^n$ of a crystalline representation with Hodge–Tate weights in $[0,r]$, and let $L_n$ be the fixed field of its kernel. Write $r/(p-1)=p^{\alpha'}\beta'$ with $\alpha'\in\mathbb{N}$ and $p^{-1}<\beta'\leq1$. Does $v_K(\mathcal{D}_{L_n/K})\leq1+e(n+\alpha'+\beta')-p^{-(n+\alpha')}$ hold?
