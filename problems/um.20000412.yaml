statement: "**3. (J. Getz)** Let X be a Hilbert modular variety. At some level (say, that of cohomology), these look like a product of modular curves. Under what circumstances does X have Tate classes not coming from modular subvarieties? Thinking of these classes as submotives defined by automorphic forms (and thus as Galois representations), do these exotic classes come from CM automorphic forms as in Question 2?"
