title: Conjecture 12.7 — (D.
field: mathematics
tier: prose
statement: "(D. Bar-Natan, D. Thurston) For each compact Lie group G, level k, and every KTG K: Γ → R3, there exists a collection of measures µ K on the space of gauge equivalence classes of G-connections on Γ satisfying the following conditions. • It is well-behaved under KTG operations. • It is “localized” near connections that extend to S3− K. • A half-twist framing change acts by e √ −1Hℏ/2, where H is the Schr¨ odinger operator on G. • It recovers quantum invariants by IR(K) = ∫ hR(A)dµ K (A), where hR(A) denotes the holonomy of A in R. Here, R is a set of representations of G associated to edges of Γ and appropriate intertwiners associated to vertices of Γ."
ams: []
