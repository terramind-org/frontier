title: The subexponential Folner gap
field: mathematics
tier: prose
statement: |-
  **Conjecture:** If the Folner function of a group is sub-exponential, then the group is virtually nilpotent.

  * \(G\) is finitely generated and \(S\) is a finite symmetric generating set;
  * the Følner parameter is reciprocal boundary ratio, not a radius parameter;
  * “subexponential” means
    \[
    \limsup_{n\to\infty}\frac{\log \operatorname{Fol}_{G,S}(n)}{n}=0,
    \tag{1.1}
    \]
    equivalently, for every \(\varepsilon>0\), \(\operatorname{Fol}_{G,S}(n)\le e^{\varepsilon n}\) for all sufficiently large \(n\).
