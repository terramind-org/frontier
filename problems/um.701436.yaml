title: Kourovka Notebook Problem 18.7
field: mathematics
tier: prose
statement: |-
  Let $n\geq 665$ be an odd integer. Is it true that the group of outer automorphisms
  $\mathrm{Out}(B(m,n))$ of the free Burnside group $B(m,n)$ for $m>2$ is complete, that is, has trivial center and all its automorphisms are inner?
