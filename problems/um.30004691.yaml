title: Uniform Bounded Solutions of the d-Bar Equation
field: mathematics
tier: prose
statement: Given a bounded $(0,1)$-form $f$ on a domain $\Omega\subset\mathbb{C}^n$ with $\bar\partial f=0$, does there exist a bounded function $u$ such that $\bar\partial u=f$ and $\|u\|_\infty\leq C(\Omega)\|f\|_\infty$, where $C(\Omega)$ depends only on the domain?
