title: One-dimensional counterexample and classification for optimal Dirichlet eigenvalue multiplicity
field: mathematics
tier: prose
statement: |-
  Let $\Omega_k^*$ be a minimizer of the shape optimization problem
  \[
  \min\{\lambda_k(\Omega):\Omega\subset\mathbb R^n,
  |\Omega|=V_0\}.
  \]
  Prove that $\lambda_{k-1}(\Omega_k^*)=\lambda_k(\Omega_k^*)$.
