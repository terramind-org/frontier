title: Heegner transfer on a split genus-two locus
field: mathematics
tier: prose
statement: |-
  **1. (C. Hall)** We know how to construct points on an elliptic curve \(E\) over \(\mathbb F_q(T)\) when the analytic rank is 1 by using (Drinfel'd) Heegner points. What if \(X\) is a hyperelliptic curve over \(\mathbb F_q(T)\) of higher genus? Is there any way of constructing the points on the Jacobian of \(X\) that ought to be there?

  **Comments.** 1) We have a lot of explicit examples when the analytic rank is 1. (C. Hall)

  2) If we start with any surface \(S\) over \(\mathbb F_q\) we can, via Lefschetz fibration, make it into a curve over \(\mathbb F_q(T)\). Typically (since the rank of \(H^2\) is even), one has two Tate classes. One of these is given by hyperplane sections; can we “see” or construct the other one? This question is like the one above, but without requiring \(C\) to be hyperelliptic. So, in some sense, the problem is almost as hard as the problem of treating general surfaces. (C. Schoen)
