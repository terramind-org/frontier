title: Hecke Eigensheaves for Arthur Parameters
field: mathematics
tier: prose
statement: For every Arthur parameter $\psi$, construct an associated perverse eigensheaf $F_\psi$ on $\operatorname{Bun}_G$ with the predicted Hecke eigenproperty and, when $G$ is semisimple, the predicted decomposition over basic strata into the Arthur packets of the pure inner forms of $G$.
