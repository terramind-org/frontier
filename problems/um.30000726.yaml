title: Lovász Removable-Path Conjecture for Three Prescribed Vertices
field: mathematics
tier: prose
statement: Does there exist a function $f_3(k)$ such that, for every $f_3(k)$-connected graph $G$ and every three vertices $s,t,x\in V(G)$, there are a path $P$ from $s$ to $t$ and a $k$-connected subgraph $H$ with $x\in V(H)$ and $V(H)\cap V(P)=\varnothing$?
