title: Planar Game Chromatic Numbers and Builder Strategies
field: mathematics
tier: prose
statement: What is the maximum game chromatic number of a planar graph, known to lie between $11$ and $17$? In the online game where Builder adds edges while keeping the chosen-edge graph planar and Painter colors each new edge red or blue, does Builder force a monochromatic copy of a fixed graph $H$ if and only if $H$ is outerplanar?
