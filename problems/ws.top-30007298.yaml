statement: |-
  \section*{Equivariant Jiang–Su absorption for amenable actions}\label{30007298}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If a countable amenable group acts on a separable simple unital infinite-dimensional nuclear stably finite Z-stable complex C*-algebra, is that action cocycle conjugate to its tensor product with the trivial action on Z, without an outerness, trace-action or UCT assumption?
  \subsection{Short English statement}
  If a countable amenable group acts on a separable simple unital infinite-dimensional nuclear stably finite Z-stable complex C*-algebra, is that action cocycle conjugate to its tensor product with the trivial action on Z, without an outerness, trace-action or UCT assumption?
