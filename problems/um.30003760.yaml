title: Complementarity Conditions in Nonlinear PDE Control
field: mathematics
tier: prose
statement: |-
  Let $\Omega$ be the spatial domain and $I=(0,T)$. Consider the rate-independent control system

  $$0\in-\Delta z-g-\sigma\Delta\dot z+\partial\lvert\dot z\rvert\quad\text{in }H^{-1}(\Omega),\qquad z(0)=0,$$

  with objective

  $$j_1(z)+j_2(z(T))+\frac12\lVert g\rVert_{H^1(I;L^2(\Omega))}^2.$$

  At a locally optimal pair, write $\bar y=\dot{\bar z}$, choose $\bar q\in\partial\lvert\bar y\rvert$, and let $p$ be the adjoint variable. Is

  $$\langle p,1-\lvert\bar q\rvert\rangle=0$$

  a necessary optimality condition?
