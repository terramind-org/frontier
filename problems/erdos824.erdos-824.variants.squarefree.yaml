  module: FormalConjectures.ErdosProblems.«824»
  decl: Erdos824.erdos_824.variants.squarefree
  statement: |-
    theorem erdos_824.variants.squarefree :
        ∀ ε : ℝ, 0 < ε → ∀ᶠ x : ℕ in atTop, (x : ℝ) ^ (2 - ε) < (hSquarefree x : ℝ)
  context:
    - open Erdos824
