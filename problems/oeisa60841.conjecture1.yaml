lean:
  module: FormalConjectures.OEIS.«60841»
  decl: OeisA60841.conjecture1
  statement: |-
    theorem conjecture1 :
        ∀ n : ℕ, 1 ≤ n → (((lcmMatrix n).det)⁻¹.den = 1 ↔ n ∈ integerDetN)
  context:
    - open OeisA60841
  definitions:
    - name: OeisA60841.lcmMatrix
      kind: def
      text: |-
        /-- The $n \times n$ matrix with entry $(i,j)$ equal to
        $1/\operatorname{lcm}(i+1, j+1)$ over $\mathbb{Q}$. -/
        def lcmMatrix (n : ℕ) : Matrix (Fin n) (Fin n) ℚ :=
          Matrix.of fun i j : Fin n ↦ 1 / ((Nat.lcm (i.val + 1) (j.val + 1) : ℚ))
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/60841.lean#L37
    - name: OeisA60841.integerDetN
      kind: def
      text: |-
        /-- The exceptional values of $n$ where $1/\det(M)$ is conjectured to be an integer. -/
        def integerDetN : Set ℕ :=
          Set.Icc 1 34 ∪ {36, 38}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/60841.lean#L67
