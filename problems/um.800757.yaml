title: Banach Spaces and Ramsey Theory — Problem 22
field: mathematics
tier: prose
statement: |-
  *(D. H. Fremlin [Fr2])*
  Is there a compact hereditary family of finite subsets of $\omega_1$ containing
  the singletons and having the property that every finite subset of $\omega_1$
  has a subset half of its size belonging to the family $\mathcal{F}$?
