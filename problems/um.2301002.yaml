title: Research Problems in Function Theory — Problem 1.2
field: mathematics
tier: prose
statement: "How big can the set of Valiron deficiencies be for functions in the plane? It is known that $$ N(r,a)=T(r,f)+O\\big(T(r,f)^{\\frac{1}{2}+\\varepsilon}\\big) $$ as $r\\to\\infty$, for all $a$ outside a set of capacity zero (see Nevanlinna . In the case $R<+\\infty$ this is more or less best-possible, but in the plane we only know from an example of Valiron that the corresponding set of $a$ can be non-countably infinite. It is also not known whether ([source label: 1.3]) can be sharpened."
