title: Sharp log-concavity threshold for Fubini--Study geodesic balls
field: mathematics
tier: prose
statement: |-
  For a smooth convex domain \(K\) in \(\mathbb R^n\), Laplace equation with
  Dirichlet boundary conditions is
  \[
  \begin{cases}
  \Delta u=\lambda u&\text{ on }K,\\
  u\equiv0&\text{ on }\partial K.
  \end{cases}
  \]
  Choose \(u_1>0\) in \(\operatorname{int}K\), then
  \[
  \operatorname{Hess}\log u_1\leq0?
  \]
  True for \(K=B_2\). Question is whether it is true for complex projective
  space \(\mathbb CP^n\) or for other symmetric \(K\)'s.
