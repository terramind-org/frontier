  \section{Open Problems in Local Graph Complexity}\label{30005022}
  {\small\sffamily UnsolvedMath ID 30005022 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  In the LOCAL model vertices communicate synchronously along graph edges; messages and local computation are unrestricted and complexity is the number of rounds. After $t$ rounds a vertex can depend only on its radius-$t$ neighborhood and any supplied identifiers or randomness.

  A graph matching is a set of edges with pairwise disjoint endpoints, and it is perfect when every vertex is incident to one chosen edge. A weighted matching objective sums the chosen edge weights, unless an ordered objective is specified.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  Source-record limitation: Broad research agenda spanning several computational and descriptive models; no single specified mathematical target or parameterized guarantee.
  \paragraph{Statement recorded in the supplied source.}
  Classify finitary-factor-of-independent-and-identically-distributed complexity; characterize derandomization on graph classes; determine the limits of Borel and continuous Lovász Local Lemmas; construct finitary-factor-of-independent-and-identically-distributed perfect matchings on trees; decide when Borel unfriendly colorings exist; develop a general complexity theory of local graph problems; and transfer techniques among distributed, finitary, and descriptive settings. \sref{30005022}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-22.
