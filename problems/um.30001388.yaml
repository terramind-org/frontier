title: Escaping Boundary Points of Baker Domains
field: mathematics
tier: prose
statement: "Let $f : \\mathbb{C} \\to \\mathbb{C}$ be a transcendental entire function, and let $I(f) = \\{z \\in \\mathbb{C} : f^n(z) \\to \\infty \\text{ as } n \\to \\infty\\}$ denote its escaping set. If $U \\subset \\mathbb{C}$ is a periodic escaping Fatou component (Baker domain) of $f$, must its boundary contain at least one escaping point, i.e., $\\partial U \\cap I(f) \\neq \\varnothing$?"
