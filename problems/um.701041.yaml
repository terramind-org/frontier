title: Kourovka Notebook Problem 14.56
field: mathematics
tier: prose
statement: |-
  Prove that if $G$ is an infinite pro-$p $-group with
  $G/\gamma_{2p+1}(G)$ isomorphic to
  $J/\gamma_{2p+1}(J)$ then $G$ is isomorphic to $J$, where $J$ is the
  Nottingham group.
