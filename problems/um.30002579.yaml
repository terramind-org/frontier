title: Quotient Rings and Homological Properties of Hopf-Module Algebras
field: mathematics
tier: prose
statement: For Hopf-module algebras, does every $H$-semiprime right-noetherian algebra have an artinian classical right quotient ring? Can an $H$-simple semiprime noetherian algebra finite over its center have infinite global dimension, or fail to be Gorenstein? If a cosemisimple Hopf algebra acts inner faithfully on a polynomial-identity domain of degree $d$, is $\operatorname{PIdeg}(H^*)\leq d^2$? Is every noetherian Artin–Schelter regular algebra a braided Hopf algebra?
