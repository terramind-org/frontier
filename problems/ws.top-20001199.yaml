  \paragraph{Statement recorded in the supplied source.}
  Conjecture 23. When P belongs to such a zero dimensional independence variety then P

  is the distribution of a random vector with its CI-structure equal to the CI-structure of a matroid.

  Donald Richards

  Donald Richards spoke on the problem of determining the number of solutions to generic maximum likelihood problems and the use of computational algebra, homotopy con-tinuation, and mixed volume in these calculations. \sref{20001199}{2}
