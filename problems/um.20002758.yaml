title: A fixed-d Toeplitz obstruction to degree-wise coherence for FI_d
field: mathematics
tier: prose
statement: |-
  **Coherence.** By [Theorem B, Ra], the category of \(\mathrm{FI}\)-modules presented in finite degree is abelian. Is this true for other categories?

  A. Snowden: Probably false for \(\mathrm{FI}_d\) (\(d>1\)).
  [Ra] Eric Ramos, *On the degree-wise coherence of \(\mathrm{FI}_G\)-modules*.
