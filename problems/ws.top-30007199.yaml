statement: |-
  \section*{Recognizing virtually polycyclic groups from quasi-isometry}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If a finitely generated group H is quasi-isometric to a finitely generated virtually polycyclic group P, must H itself be virtually polycyclic?
  \subsection{Short English statement}
  If a finitely generated group H is quasi-isometric to a finitely generated virtually polycyclic group P, must H itself be virtually polycyclic?
