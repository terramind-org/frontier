title: Monochromatic Structures below Random Density
field: mathematics
tier: prose
statement: Does an analogue of the quadratic-structure phenomenon for two-colorings with fewer than the random density of monochromatic $K_4$'s hold for graph colorings, and what is the asymptotically minimal number of monochromatic $3$-term arithmetic progressions in a two-coloring of $\{1,\ldots,n\}$?
