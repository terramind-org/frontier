title: Kourovka Notebook Problem 3.47
field: mathematics
tier: prose
statement: |-
  (Well-known problem of A. I. Maltsev).
  Is it true that every locally
  nilpotent group is a homomorphic image of some
  torsion-free locally nilpotent group?

  *Editors' comment:* An affirmative answer is
  known for periodic groups (E. M. Levich, A. I. Tokarenko,
  *Siberian Math. J.*, **11** (1970), 1033--1034) and for
  countable groups (N. S. Romanovskiĭ, Preprint, 1969).
