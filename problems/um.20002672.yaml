title: Transported compact resolvent and a Tauberian entropy-dimension reduction
field: mathematics
tier: prose
statement: |-
  The original PDF and its raw page-content stream were inspected.

  The source asks about a limiting random-matrix/free-Gibbs law whose formal density is
  \[
   \exp\{-N\operatorname{Tr}p(A_1,A_1^*,\ldots,A_m,A_m^*)\},
  \]
  and whose conjugate variables satisfy \(J_i=\mathcal D_iP\). Writing \(\partial_j\) for Voiculescu's free difference quotient at the limiting variables, it asks whether
  \[
   \exp\!\left(-t\sum_j\partial_j^*\partial_j\right)                         \tag{1.1}
  \]
  is compact in the \(N\to\infty\) limit. It proposes as a starting point
  \[
   P=\sum_i A_i^2+\sum_i t_iq_i(A_1,\ldots,A_m),                             \tag{1.2}
  \]
  in the small-perturbation regime studied by Guionnet--Maurel-Segala.

  Compactness in (1.1) can only mean compactness as an operator on the limiting Hilbert space \(L^2(M,\tau)\). Compactness is not an intrinsic Banach-space property of a map “on the algebra” unless a topology and norm are specified. The notation \(A_i,A_i^*\) allows genuinely nonnormal models, whereas (1.2) is the self-adjoint starting case. The proved results below treat a finite self-adjoint tuple; the nonnormal case is listed as a gap.

  The next source item begins after the heading `0.4 Focus Group on Free Entropy (day 3)`. A font-level audit resolves the damaged title unambiguously:
  \[
   \boxed{\text{Is }\delta^*=\delta^\star\text{?}}                           \tag{1.3}
  \]
  The first superscript is the Computer Modern symbol-font asterisk and the second is character `0x3f` in Computer Modern math italic, namely \(\star\). It is not a question-mark superscript.

  The PDF as printed then displays
  \[
   \delta^*=n-\limsup_{t\downarrow0}
   \frac{\chi^*(x_1+\sqrt t\,s_1,\ldots,x_n+\sqrt t\,s_m)}
        {\log t^{1/2}},                                                       \tag{1.4}
  \]
  and
  \[
   \delta^\star=n-\limsup_{t\to0}\sum_{i=1}^n
   t\Phi^*(x_1+\sqrt t\,s_1,\ldots,x_m+\sqrt t\,s_m). It also prints `lim sup` in both displays.

  The standard definitions in Voiculescu's theory, for an \(n\)-tuple \(X=(x_1,\ldots,x_n)\) and a variance-one semicircular tuple \(S=(s_1,\ldots,s_n)\) free from \(X\), are
  \[
   \delta^*(X)
   =n-\liminf_{t\downarrow0}
   \frac{\chi^*(X+\sqrt t\,S)}{\log\sqrt t},                                \tag{1.6}
  \]
  and
  \[
   \delta^\star(X)
   =n-\liminf_{t\downarrow0}t\Phi^*(X+\sqrt t\,S). \tag{1.7}
  \]
  Equations (1.6)--(1.7), not the malformed displays (1.4)--(1.5), are used below.
