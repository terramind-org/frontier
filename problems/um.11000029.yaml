title: Problem 3.8 — Determine which subgroups of Modg are quasiconvex with respect to some collection of geodesics.
field: mathematics
tier: prose
statement: Determine which subgroups of Modg are quasiconvex with respect to some collection of geodesics. This question is closely related to, but diﬀerent than, the question of convex cocompactness of subgroups of Mod g, as defined in [ FMo], since the embedding of Mod g in Teichg via any orbit is exponentially distorted, by [ FLMi].
