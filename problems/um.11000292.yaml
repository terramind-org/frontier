title: Question 4.4 — Is the conjugacy problem solvable in Out(Fn)?
field: mathematics
tier: prose
statement: Is the conjugacy problem solvable in Out(Fn)? Martin Lustig posted a detailed outline of a solution to this problem on his web page some years ago [ 65], but neither this proof nor any other has been accepted for publication. This problem is of central importance to the field and a clear, compelling solution would be of great interest. The conjugacy problem for mapping class groups was shown to be solvable by Hemion [52], and an eﬀective algorithm for determining conjugacy, at least for pseudo-Anosov mapping classes, was given by Mosher [ 70]. The isomorphism problem for groups of the form Sg ⋊ Z can be viewed as a particular case of the solution to the isomorphism problem for fundamental groups of geometrizable 3-manifolds [ 76]. The solvability of the conjugacy problem for GL( n, Z) is due to Grunewald [ 39]
