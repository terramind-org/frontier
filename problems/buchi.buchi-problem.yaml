lean:
  module: FormalConjectures.Wikipedia.Buchi
  decl: Buchi.buchi_problem
  statement: |-
    theorem buchi_problem :
        ∃ M : ℕ, 1 ≤ M ∧ IsBuchi M
  context:
    - open Buchi
  definitions:
    - name: Buchi.IsBuchi
      kind: def
      text: |-
        /-- `IsBuchi M` asserts that whenever `M` consecutive values `(x + n)² + a` (for
        `n = 0, …, M - 1`) are all perfect squares, then `a` must be `0`. -/
        def IsBuchi (M : ℕ) : Prop :=
          ∀ x a : ℤ, (∀ n ∈ Finset.range M, IsSquare ((x + (n : ℤ)) ^ 2 + a)) → a = 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Wikipedia/Buchi.lean#L31
