  \item[\hypertarget{source:5100005:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 5100005 (AMR-050-0005). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:5100005:2}{S2}] Dan Reznik, Ronaldo Garcia and Jair Koiller, Eighty New Invariants in the Elliptic Billiard (2020), arXiv version 11, section 3.1, Table 2, p. 5, invariant $k_{111}$; sections 1--2, pp. 1--3, and Appendix A, Table 12, p. 15. \url{https://arxiv.org/abs/2004.12497v11}.
  \end{description}
