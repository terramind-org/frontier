title: Compact tropicalization, Monge–Ampère, curve realizability, and a sharp circle model
field: mathematics
tier: prose
statement: |-
  This record is item A.23, contributed by Ilia Zharkov, in the AIM workshop notes *Amoebas and tropical geometry*. Comparison with the source PDF shows that “Chapter B: Snapshot of the pre-open problem session” begins a new chapter and is not part of A.23. The present job therefore owns only A.23, not the trailing chapter material.

  1. **Compact tropical varieties.** For a compact complex algebraic variety, can one naturally modify the valuation map to obtain a compact tropical variety, retaining as much affine structure as possible? The text anticipates a role for a polarization (a tropical Kähler class) but expects the affine structure itself to be algebro-geometric.
  2. **Tropical Monge–Ampère / Calabi problem.** In an affine chart \(U\subset B_0\), a potential \(K\) is represented by the graph
     \[
     dK\subset \mathbb R^n\times(\mathbb R^n)^*.
     \]
     The smooth graph should be replaced tropically by a piecewise-linear one and the Monge–Ampère equation interpreted distributionally. Is there a tropical Monge–Ampère operator whose solution produces a unique Monge–Ampère measure in a polarization class
     \[
     H^1(B,\operatorname{Aff}(B,\mathbb R))?
     \]
  3. **Curve counting and realizability.** Can tropical Gromov–Witten calculations be performed on a Calabi–Yau? Is there a simple rule deciding which tropical curves are limits of classical curves, given that in higher dimensions some tropical curves are not realizable?

  The PDF itself contains “deleting pseudo-pods”; this unusual phrase is not silently corrected. The malformed strings “Monge-Amp` ere,” “K¨ ahler,” “C∞,” “Rn,” and “( Rn)∗” have been recovered as “Monge–Ampère,” “Kähler,” \(C^\infty\), \(\mathbb R^n\), and \((\mathbb R^n)^*\).
