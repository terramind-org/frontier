title: Height Counts for Closed Projective Immersions
field: mathematics
tier: prose
statement: |-
  Let $f:\mathbb P^n\to\mathbb P^m$ be a degree-$d$ morphism induced by degree-$d$ forms with no common zero, and suppose that $f$ is a closed immersion. Does

  $$n_f(B)=O_{d,n,\varepsilon}\!\left(B^{(n+1)/d+\varepsilon}\right),$$

  where $n_f(B)=\#\{x\in\mathbb P^n(\mathbb Q):H(f(x))\leq B\}$?
