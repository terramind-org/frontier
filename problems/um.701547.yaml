field: mathematics
tier: prose
statement: |-
  A multilinear
  commutator word is any commutator of weight $n$ in $n$ distinct variables. Let $w$ be a multilinear commutator word and let $G$ be a finite group. Is it true that every Sylow $p$-subgroup of the verbal subgroup $w(G)$ is generated by $w$-values?
