lean:
  module: FormalConjectures.GreensOpenProblems.«60»
  decl: Green60.green_60
  statement: |-
    theorem green_60 :
        ∃ c > (0 : ℝ),
          ∀ (A : Finset ℕ),
            (∀ a ∈ A, IsSquare a) →
            2 ≤ A.card →
              ((A + A).card : ℝ) ≥ (A.card : ℝ) ^ (1 + c)
