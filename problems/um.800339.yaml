title: Enumeration of Matchings — Problem 10
field: mathematics
tier: prose
statement: |-
  What about $(2n-1)$-by-$2n$ rectangles? For these regions, removing
  the central square does not make the region tilable. However, if
  one removes any one of the four squares adjacent to the middle square,
  one obtains a region that is tilable, and moreover, for this region
  the number of tilings appears to be a nice round number.

  Find a formula for the number of domino tilings of a
  $(2n-1)$-by-$2n$ Aztec rectangle with a square adjoining the central
  square removed.
