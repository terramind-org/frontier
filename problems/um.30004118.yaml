title: Arithmeticity Problems for Hyperbolic Lattices and Submanifolds
field: mathematics
tier: prose
statement: Does there exist a hyperbolic $n$-manifold, with $n\geq4$, containing no arithmetic totally geodesic $m$-submanifold for any $1<m<n$? Is the trace field of every lattice in $\operatorname{PO}(n,1)$, for $n\geq4$, totally real?
