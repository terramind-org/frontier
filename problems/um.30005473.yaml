title: Irreducibility of Exposed-Point Varieties of Generic Discotopes
field: mathematics
tier: prose
statement: Let $D=D_1+\cdots+D_N$ be a generic discotope with $\dim D_i\geq 2$, and let $E$ be the Zariski closure of its exposed points. Prove that $E$ is irreducible.
