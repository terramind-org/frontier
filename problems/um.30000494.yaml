title: Maximal Pro-$p$ Galois Groups of Higher Local Fields
field: mathematics
tier: prose
statement: Let $K$ be a complete discrete valuation field with residue field of characteristic $p$, and let $\Gamma_K(p)$ be the Galois group of its maximal $p$-extension. Determine the structure of $\Gamma_K(p)$, particularly when $K$ is an $N$-dimensional local field.
