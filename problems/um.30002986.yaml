title: Compactifiable Lagrangian Fibrations from Abelian Fibrations
field: mathematics
tier: prose
statement: Given an abelian fibration, when does its total space admit a symplectic structure making it a Lagrangian fibration compactifiable to a possibly singular irreducible symplectic variety? Separately, let a family of curves over a polydisk in $\mathbb C^k$ be a multiversal unfolding of the singularities of its central fiber, all of type $A_{\mu_i}$ with $1\leq\mu_i\leq5$ or $D_{\mu_i}$ with $4\leq\mu_i\leq5$, and suppose $\sum_i\mu_i\leq5$. Is its relative compactified Jacobian toroidal?
