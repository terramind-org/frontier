title: Moments of L-functions — Moments of the Riemann zeta function — Problem 31
field: mathematics
tier: prose
statement: |-
  Topacogullari [T1] proved that for $1 \le h \ll x^{\frac{2}{3}}$
  \[
  D_{3,2}(x,h) = x P_3(\log x) + O(x^{\frac{8}{9}+\varepsilon})
  \]
  for a certain degree 3 polynomial where the coefficients of $P_3$ depend on $h$. A result was also obtained for $D_{2,3}(x,h)$.
