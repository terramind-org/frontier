statement: |-
  \section{Rigidity and Assembly Conjectures for Discrete Groups}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For a torsion-free group $G$ and integral domain $R$, are $0$ and $1$ the only idempotents of $RG$? Do the negative K-groups of $\mathbb{Z}G$, the reduced group $K_0(\mathbb{Z}G)$, and $\operatorname{Wh}(G)$ vanish? Are higher signatures homotopy invariant, closed aspherical manifolds topologically rigid, and groups of type FP of type FF? Is every finitely presented Poincaré-duality group of dimension at least five the fundamental group of an aspherical homology ANR-manifold? Is every hyperbolic group with boundary $S^n$ the fundamental group of a closed aspherical manifold?
  \par\smallskip\textit{Formulation references:} \sref{statement}{1}, \sref{statement}{2}.
  \subsection{Short English statement}
  For a torsion-free group $G$ and integral domain $R$, are $0$ and $1$ the only idempotents of $RG$? Do the negative K-groups of $\mathbb{Z}G$, the reduced group $K_0(\mathbb{Z}G)$, and $\operatorname{Wh}(G)$ vanish? Are higher signatures homotopy invariant, closed aspherical manifolds topologically rigid, and groups of type FP of type FF? Is every finitely presented Poincaré-duality group of dimension at least five the fundamental group of an aspherical homology ANR-manifold? Is every hyperbolic group with boundary $S^n$ the fundamental group of a closed aspherical manifold?
