title: Cohomological tools for pseudorepresentations and a two-character visibility-order lemma
field: mathematics
tier: prose
statement: |-
  **Problem 3.** Classically, if one is looking at deformation rings of Galois representations one has various cohomological tools. One would like analogues of these in the situation of pseudo-representations.

  This is a request for a tangent-and-obstruction theory, not a yes/no conjecture. In the PDF the next line is the heading “9.

  The immediate source context matters. Sections 8.1–8.2 discuss two-dimensional pseudocharacters, their characteristic polynomials and Cayley–Hamilton identities, the relation between representation and pseudorepresentation moduli, the absolutely irreducible theorem of Nyssen–Rouquier, and the geometry near a sum of two distinct characters. Thus “cohomological tools” naturally means at least:

  1. a description of first-order pseudodeformations;
  2. obstruction classes for lifting through small extensions;
  3. a way to impose local or global deformation conditions; and
  4. a replacement, in the reducible case, for the usual \(H^1(G,\operatorname{ad}\bar\rho)\) and \(H^2(G,\operatorname{ad}\bar\rho)\).
