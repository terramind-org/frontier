title: Cluster Monomials and Simple Quantum Affine Modules
field: mathematics
tier: prose
statement: For a simple Lie algebra $\mathfrak{g}$ of type $A$, $D$, or $E$, let $\mathcal{C}_\ell$ be the monoidal subcategory of finite-dimensional quantum-affine $\mathfrak{g}$-modules with Grothendieck ring $R_\ell$. Is every cluster monomial of $R_\ell$ represented by a simple object? Conversely, is a simple object's Grothendieck class a cluster monomial exactly when its tensor square is simple?
