title: Distances Between Products of Torus Knots
field: mathematics
tier: prose
statement: For coprime pairs $(a,b)$ and $(c,d)$, let $T(a,b)$ and $T(c,d)$ denote the corresponding torus knots, let $d_\chi(T(a,b), T(c,d))$ be the smooth Euler-characteristic cobordism distance between them, and let $E(a \times b, c \times d)$ be the corresponding combinatorial rectangle-transformation cost. What are the precise values of $E(a \times b, c \times d)$ and $d_\chi(T(a,b), T(c,d))$?
