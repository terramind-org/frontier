title: Polynomial Bounds for Polytope Diameters
field: mathematics
tier: prose
statement: For $d$-polytopes with $n$ facets, is the maximum graph diameter bounded by a polynomial in $n$? Can a family have diameter growing superlinearly in its number of facets? Does every $d$-polytope with $n$ facets have diameter at most $d(n-d)$?
