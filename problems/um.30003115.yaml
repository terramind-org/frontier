title: Dense Multiplicative Orbits on the Two-Torus
field: mathematics
tier: prose
statement: If $1,x,y$ are multiplicatively independent over $\mathbb Q$ and $a,b$ are relatively prime positive integers, is $\{a^n b^k(x,y)\bmod 1:n,k\in\mathbb N\}$ dense in $[0,1]^2$?
