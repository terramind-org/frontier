title: Area minimizing projective spaces in the projective space with the Berger metric
field: mathematics
tier: prose
statement: For ${2n+1}>3$ and $0<k<{2n+1}$, are projective subspaces obtained by projection of the $k$-dimensional equatorial spheres minimal submanifolds of the Berger projective space $( \mathbb{R} P^{2n+1}, g_\mu)$? Are they the only $k$-dimensional volume minimizing cycle in their homology classes?
