title: Weighted Bad Approximation on Affine Lines
field: mathematics
tier: prose
statement: For $L_{a,b}=\{(x,ax+b):x\in\mathbb R\}$, weights $i,j\geq0$ with $i+j=1$, and $\sigma=\min\{i,j\}$, can the known hypothesis $\liminf_{q\to\infty}q^{1/\sigma-\varepsilon}\max\{\|qa\|,\|qb\|\}>0$ for some $\varepsilon>0$ be relaxed to $\varepsilon=0$ while retaining $\dim_H(L_{a,b}\cap\operatorname{Bad}(i,j))=1$?
