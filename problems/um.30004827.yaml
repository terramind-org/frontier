title: Free Actions of Rigid Tensor Categories on the Hyperfinite Factor
field: mathematics
tier: prose
statement: Can every rigid $C^*$-tensor category act freely on the hyperfinite $\mathrm{II}_1$ factor? In the nonamenable case, are there infinitely many such actions up to cocycle conjugacy? What happens for the Temperley–Lieb–Jones categories at index values greater than $4$?
