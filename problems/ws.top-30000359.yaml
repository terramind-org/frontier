statement: |-
  \section{Symmetry-Aware Rank-One Convex Interpolation Algorithms}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  An energy $W$ on deformation-gradient matrices is rank-one convex if $t\mapsto W(F+t ab^T)$ is convex wherever defined. Frame indifference means $W(RF)=W(F)$ for permitted rotations $R$.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The interpolation constraints and what suitable rank-one-convexity means are not fully specified in the supplied question.

  Source-record limitation: The required interpolation property is only called suitable and its input/accuracy/efficiency target is not specified.
  \paragraph{Statement recorded in the supplied source.}
  Develop an efficient algorithm that exploits frame indifference or material symmetry to compute an interpolation with suitable rank-one-convexity properties from values of an energy density on a mesh of deformation gradients. \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record partially solved; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Efficiently interpolate mesh energy values while preserving the stated material symmetries and rank-one-convexity properties.
