statement: |-
  \section*{Conformal nets and representation equivalence for strongly rational unitary VOAs}\label{30007248}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every simple unitary strongly rational complex vertex operator algebra, do polynomial energy bounds and CKLW strong locality hold, yielding an irreducible completely rational conformal net? Require complete unitarity, strong integration of all finite-length unitary grading-restricted modules, and the stated braided unitary tensor equivalence from VOA modules to finite-index net representations.
  \subsection{Short English statement}
  For every simple unitary strongly rational complex vertex operator algebra, do polynomial energy bounds and CKLW strong locality hold, yielding an irreducible completely rational conformal net? Require complete unitarity, strong integration of all finite-length unitary grading-restricted modules, and the stated braided unitary tensor equivalence from VOA modules to finite-index net representations.
