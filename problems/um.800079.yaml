title: Foliations and Diffeomorphism Groups — Question 20
field: mathematics
tier: prose
statement: |-
  If one drops the orderable condition, there are two constructions [skipper2019simple, belk2022twisted]. A related question of Navas [navas2018group, Question 8] was the following: does there exist a finitely generated, left-orderable group $G$ without surjection onto $\mathbb{Z}$ and $H^2_b(G, \mathbb{R}) = 0$? The question was answered positively by Fournier-Facioa and Lodha in [fournier2023second]. In fact, the simple orderable groups of Matte Bon and Triestino are even boundedly acyclic [campagnolo2023algebraic, Corollary 1.16]. But the only known finitely presented simple orderable groups are not boundedly acyclic [hyde2023finitely, Corollary 1.7]. Thus we ask the following.

  Is there a finitely presented, or even type $F_\infty$, boundedly acyclic simple orderable group?
