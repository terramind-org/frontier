title: Collapsing a successor of a singular to aleph_2
field: mathematics
tier: prose
statement: |-
  Is it consistent that there is a poset turning \(\aleph_{\omega+1}\) into \(\aleph_2\)?

  Let \(V\models\mathrm{ZFC}\), put \(\mu=(\aleph_\omega)^V\) and \(\lambda=\mu^{+V}=(\aleph_{\omega+1})^V\). Is it consistent that some forcing \(\mathbb P\in V\) has a generic extension \(W=V[G]\) such that \(\lambda=(\aleph_2)^W\)?
