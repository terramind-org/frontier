title: Affine Pseudocoverings and Their Endomorphisms
field: mathematics
tier: prose
statement: Let $\varphi:\mathbb{A}^2\to\mathbb{A}^2$ be an étale endomorphism that factors through a smooth affine surface $X$ as $\varphi=\varphi_2\circ\varphi_1$, where $\varphi_1:\mathbb{A}^2\to X$ and $\varphi_2:X\to\mathbb{A}^2$ are étale. What properties must $X$, $\varphi_1$, and $\varphi_2$ have?
