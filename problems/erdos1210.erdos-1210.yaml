  module: FormalConjectures.ErdosProblems.«1210»
  decl: Erdos1210.erdos_1210
  statement: |-
    theorem erdos_1210 :
        ∃ C : ℝ, ∀ n : ℕ, ∀ A : Finset ℕ,
          (∀ a ∈ A, 1 ≤ a ∧ a < n) →
          (∀ a ∈ A, ∀ b ∈ A, a ≠ b → a.Coprime b) →
          ∑ a ∈ A, (1 / ((n : ℝ) - a)) ≤ (∑ p ∈ (range n).filter Prime, (1 / (p : ℝ))) + C
  context:
    - open Erdos1210
    - open Finset
