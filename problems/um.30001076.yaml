title: Bimonster Quotients of Complex Hyperbolic Reflection Groups
field: mathematics
tier: prose
statement: Let $G$ be the complex-hyperbolic reflection group acting on the complex $13$-ball, and let $X_0$ be the complement of its mirror arrangement modulo $G$. If order-$2$ rather than order-$3$ relations are imposed on loops around the discriminant, the resulting quotient satisfies all known bimonster relations except possibly $w^{10}=1$. Is this quotient the bimonster? Do the $16$ corresponding loops generate $\pi_1(X_0)$, and what other relations does $\pi_1(X_0)$ have?
