title: Selection Principles Milestone Problems — Problem 18 ([coc8, Problem 4])
field: mathematics
tier: prose
statement: |-
  In [strongdiags] it was pointed out that $\mathsf{S}_1(\Omega,\mathcal{O}^{\omega\mbox{-*\tiny gp*}})$ is strictly stronger
  than $\mathsf{S}_1(\Omega,\mathcal{O})$ (which is the same as $\mathsf{S}_1(\mathcal{O},\mathcal{O})$).
  The following problem remains open.

  Is $\mathsf{S}_1(\Omega,\Omega)$ equivalent to $\mathsf{S}_1(\Omega,\mathcal{O}^{\omega\mbox{-*\tiny gp*}})$?
