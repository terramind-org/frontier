title: Exact phase recognition for a complex hyperplane
field: mathematics
tier: prose
statement: |-
  **C.4 Recognition problems**

  A. How to recognize whether a a pure d-complex is a tropical variety?

  B. Characterize the image of linear subspaces w.r.t. under the phase map
  (“phlat”). i.e., characterize π(L) where L ⊂ C∗ is a linear subspace, and π
  is the phase map

  π : C∗ → T n (T n: n-dimensional torus).
