title: Convergence of Multiplicative Polynomial Averages
field: mathematics
tier: prose
statement: Let $f:\mathbb N\to\mathbb R$ be bounded and completely multiplicative, and let $P\in\mathbb Z[x,y]$ be homogeneous and positive on $\mathbb N^2$. Does the limit $\lim_{N\to\infty}N^{-2}\sum_{m,n=1}^N f(P(m,n))$ exist?
