title: Soundararajan Conjecture on Zeta Zero Spacing
field: mathematics
tier: prose
statement: Let $\beta'+i\gamma'$ be a nontrivial zero of $\zeta'(s)$, let $\gamma_c$ be the ordinate of the zero of $\zeta(s)$ nearest to $\gamma'$, and let $\gamma^+$ be the next zero ordinate after $\gamma$. Assuming the Riemann Hypothesis, is $\liminf_{\gamma'\to\infty}(\beta'-1/2)\log\gamma'=0$ equivalent to $\liminf_{\gamma\to\infty}(\gamma^+-\gamma)\log\gamma=0$?
