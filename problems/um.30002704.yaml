title: Quasi-Invariant Random Measures and Associated Diffusions
field: mathematics
tier: prose
statement: Let a group $G$ act on the space $\mathcal M(X)$ of Radon measures on $X$. Which laws of random measures are quasi-invariant under $G$ and support an associated analysis, such as a Laplace operator or a diffusion on $\mathcal M(X)$?
