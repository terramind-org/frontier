statement: |-
  \section{Fast Low-Rank Maximum-Weight Assignment}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are denoted by $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$; index ranges, computational models and specialized notation follow the cited problem source and the definitions below.


  A perfect matching of a complete bipartite graph selects one incident edge at every vertex, maximizing the sum of selected entries of $W$. Rank $r$ is the dimension of the weight matrix\textquotesingle s column space.

  The rank of a matrix is the dimension of its column space. Matrix completion reconstructs a low-rank matrix from a subset of its entries; matrix sensing reconstructs it from specified linear measurements. Tensor decomposition represents a multiway array as a sum of simple outer products.
  \paragraph{Statement recorded in the supplied source.}
  For the maximum-weight assignment problem on a complete bipartite graph with weight matrix $W\in\mathbb R^{n\times n}$ of rank $r$, can the optimum be computed in time $O(nr^2\log n)$? \sref{statement}{2}
  \paragraph{Scope qualification.}
  For real entries the input-access and arithmetic-cost model must be specified; the question\textquotesingle s stated bound is retained.
  \paragraph{Source status.}
  The supplied catalogue labels this record open. Its source-status metadata was checked against the supplied snapshot on 2026-10-11. This import does not independently establish current open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Find maximum-weight assignments in the stated rank-dependent near-linear running time.
