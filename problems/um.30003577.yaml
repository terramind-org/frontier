statement: For Hecke–Maass cusp forms $\phi$ on the modular surface with Laplace eigenvalue $\lambda\to\infty$, prove quantitative equidistribution of the probability measures $\mu_\phi$ toward hyperbolic area measure $\mu$ at a power rate $O(\lambda^{-\delta})$ for some $\delta>0$.
