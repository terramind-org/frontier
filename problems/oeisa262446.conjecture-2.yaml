lean:
  module: FormalConjectures.OEIS.«262446»
  decl: OeisA262446.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 3 < n) :
        a n = 1 ↔ n ∈ singletons
  context:
    - open OeisA262446
  definitions:
    - name: OeisA262446.a
      kind: def
      text: |-
        /--
        Number of ways to write $b(n) = b(k) + b(m)$ with $0 < k < m < n$.
        -/
        def a (n : ℕ) : ℕ :=
          let target := b n
          ∑ k ∈ Finset.Ico 1 n,
            ((Finset.Ico (k + 1) n).filter (fun m => target = b k + b m)).card
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/262446.lean#L40
    - name: OeisA262446.singletons
      kind: def
      text: |-
        /-- The set of exceptional integers $n > 3$ for which $a(n) = 1$. -/
        def singletons : Finset ℕ :=
          {4, 6, 11, 21, 54, 253, 325}
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/262446.lean#L63
