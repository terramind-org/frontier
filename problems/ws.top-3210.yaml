statement: |-
  \section{Algorithm for graph homomorphisms}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For finite simple input graphs $G,H$, a homomorphism is a map $f:V(G)\to V(H)$ sending every edge of $G$ to an edge of $H$. The constant in a uniform time bound must be independent of both input graphs.
  \paragraph{Statement recorded in the supplied source.}
  Is there an algorithm and an absolute constant $c>1$ deciding whether $G\to H$ in time $O(c^{|V(G)|+|V(H)|})$ for all input pairs? \sref{statement}{2}
  \subsection{Short English statement}
  Can unrestricted graph homomorphism be decided in time exponential only in the combined number of vertices?
