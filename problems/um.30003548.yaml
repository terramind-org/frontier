title: Sphere Rigidity from Scalar Curvature and Injectivity Radius
field: mathematics
tier: prose
statement: Does there exist $\varepsilon=\varepsilon(n)>0$ such that every closed $n$-dimensional Riemannian manifold $M$ with $\operatorname{scal}_M\geq n(n-1)$ and injectivity radius at least $\pi-\varepsilon(n)$ is diffeomorphic to the standard $n$-sphere?
