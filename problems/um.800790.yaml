title: Local Discrete Holomorphic Dynamics — Open Problem OP9
field: mathematics
tier: prose
statement: |-
  \emph{Let $f$, $g\in\mathop\mathrm{End}\nolimits(\mathbb{C}^n,O)$ be two superattracting germs, with $c(f)=c(g)$. Is it true that $f$ and $g$ are
  topologically (respectively, holomorphically) locally conjugated if and only if their postcritical sets
  are topologically (respectively, holomorphically) conjugated, that is, there is a local homeomorphism (respectively, biholomorphism) sending the postcritical set of $f$ onto the
  postcritical set of $g$?}

  Concerning instead the classification problem with respect to the formal conjugacy, [AR]
  contains a formal classification of superattracting germs $f\in\mathop\mathrm{End}\nolimits(\mathbb{C}^2,O)$ of
  order 2. The methods given there can in principle be used to attack the general formal
  classification problem; here we limit ourselves to a more specific question:
