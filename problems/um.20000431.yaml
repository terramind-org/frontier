title: A necessary Bockstein fingerprint for a bounded Weil–étale topology on Spec Z
field: mathematics
tier: prose
statement: |-
  **20. (M. Flach)** Find a natural definition of the Weil-\'etale topology so that the cohomology of \(Z\) vanishes in degrees greater than 3.

  **Comments:** (1) The current definition only vanishes for odd degrees and gives infinitely generated groups in even degrees. (M. Flach) (2) It it not clear how hard this problem is. A better definition might be just around the corner or the only solution might be to truncate the cohomology complex. (M. Flach)
