statement: If $\Gamma\subset\mathbb P^{n-1}$ is a set of $d\geq2n+2m-1$ points in symmetric position, $h_\Gamma(2)\geq2n+m-2$, and $1\leq m\leq n-3$, must $\Gamma$ lie on a curve of degree at most $n+m-2$?
