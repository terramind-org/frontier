title: Projectivity and Cohomological Dimension without Boundedness or Unimodularity
field: mathematics
tier: prose
statement: If $P$ is projective in the category of discrete $\mathbb Q[G]$-modules and $M$ is a rational discrete $G$-module, must $P\otimes_{\mathbb Q}M$ be projective? Separately, does the Stallings–Swan theorem for compactly generated totally disconnected locally compact groups of rational cohomological dimension at most one remain valid without compact-open boundedness or unimodularity?
