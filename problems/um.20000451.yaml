title: Rational descent obstructions for geometric elliptic powers in hyperelliptic Jacobians
field: mathematics
tier: prose
statement: |-
  **Question 18.** (a) Find a separable polynomial \(g(t)\in \mathbf Q[t]\) such that the Jacobian of the hyperelliptic curve
  \[
  s^2=g(t)
  \]
  is isogenous over \(\mathbf Q\) to \(E^r\times B\), with \(E\) an elliptic curve, and either \(r\geq 4\), or \(r=3\) and \(\dim B\leq 1\). (Silverberg)

  (b) Give an example of a map
  \[
  \mathbf P^1\longrightarrow E^4/\{\pm1\},
  \]
  where \(\{\pm1\}\) acts diagonally, whose image does not lie in \(H/\{\pm1\}\) for any proper subgroup \(H\subsetneq E^4\). (Ellenberg)
