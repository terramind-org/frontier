title: Global Existence and Singularities for the Euler–Nordström System
field: mathematics
tier: prose
statement: For the Euler–Nordström system and initial data in a function or distribution space $X$, does a unique solution exist locally in time, remain in $X$, and depend continuously on the initial data? Does it exist for all time, or develop a finite-time singularity whose nature can be determined?
