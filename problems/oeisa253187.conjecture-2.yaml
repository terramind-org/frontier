lean:
  module: FormalConjectures.OEIS.«253187»
  decl: OeisA253187.conjecture_2
  statement: |-
    theorem conjecture_2 (k m : ℕ) (hkm : (k, m) ∈ cPairs) (n : ℕ) :
        ∃ x y : ℕ, ∃ z : ℤ,
          Nat.polygonalNumber k x + Nat.generalizedPolygonalNumber k (-(y : ℤ)) +
            Nat.generalizedPolygonalNumber m z = n
  context:
    - open OeisA253187
    - open Nat Finset
  definitions:
    - name: OeisA253187.cPairs
      kind: def
      text: |-
        /-- The set of pairs $(k, m)$ appearing in Sun's universal sum conjecture. -/
        def cPairs : Set (ℕ × ℕ) :=
          {(5, 7), (5, 9), (5, 13), (6, 5), (6, 7), (7, 5)}
