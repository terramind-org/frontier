      kind: def
      text: |-
        /-- A prime equal to $p_n\# \pm 1$ for some $n \in \mathbb{N}$. -/
        def IsPrimorialPrime (q : ℕ) : Prop :=
          IsEuclidPrimorialPrime q ∨ IsKummerPrimorialPrime q
