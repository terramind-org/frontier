title: The Tits Alternative for Analytic Surface Symplectomorphisms
field: mathematics
tier: prose
statement: "Tits-alternative conjecture: For every compact surface $M$, every finitely generated subgroup of the real-analytic area-preserving diffeomorphism group $\\operatorname{Symp}^\\omega_\\mu(M)$ is either virtually solvable or contains a nonabelian free group."
