title: Problem 3.4 — If H⊂MCG (S) is finite rank free subgroup whose nonidentity elements are pseudo-Anosov, is H a Schottky group?
field: mathematics
tier: prose
statement: If H⊂MCG (S) is finite rank free subgroup whose nonidentity elements are pseudo-Anosov, is H a Schottky group? For specific examples on which to test the above problem, Whittlesey [ Whi00b] answered a question of Penner by producing a normal subgroup of MCG (S),S of genus 2, whose nonidentity elements are entirely pseudo-Anosov. Moreover, this subgroup is an infinite rank free subgroup [Whi00a].
