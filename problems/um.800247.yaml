title: Several Complex Variables Problem List — Problem 46
field: mathematics
tier: prose
statement: |-
  Let $D = \lbrace z \in \mathbb{C}^n ; h(z) < 1 \rbrace$ be a bounded pseudoconvex
  complete$-$circular domain with
  Minkowski function h. Characterize the Caratheodory, the Bergman or the
  Kobayashi completeness of D via properties of h.
  [The following is known: a) If h is continuous, then D is Bergman
  complete. b) If $n\geq 3$, continuity of h does not imply the Kobayashi
  completeness of D.]\\
  -P. Pflug, pflugvec@dosuni1.bitnet
