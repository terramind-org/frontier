title: Persistent Gaps between Free $p$-Rank and Toral Rank
field: mathematics
tier: prose
statement: Does there exist a finite connected complex $X$ whose fundamental group is abelian and acts trivially on higher homotopy, and whose rational homotopy is finite-dimensional, such that $\operatorname{rk}_p(X)>\operatorname{rk}_T(X)$ for infinitely many primes $p$?
