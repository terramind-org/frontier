title: Tight realization through almost Weinstein fillings
field: mathematics
tier: prose
statement: |-
  **Must every almost contact class admit a tight structure?**

  If \(M^{2n-1}\) is a closed cooriented almost contact manifold of dimension at least five, does every homotopy class \(a\) of almost contact structures on \(M\) contain a Borman--Eliashberg--Murphy-tight contact structure?
