title: Lower Bounds for Fractional Lévy-Area Approximation
field: mathematics
tier: prose
statement: For fractional Brownian Lévy area with Hurst parameter $H\in(1/4,1)$, sampled at $n$ equally spaced times on $[0,T]$, is the $L^2$ error of the conditional-expectation approximation bounded below by $c_H T^{2H}n^{-2H+1/2}$ for some $c_H>0$?
