lean:
  module: FormalConjectures.Wikipedia.MagicSquares
  decl: MagicSquares.exists_semi_magic_square_cubes
  statement: |-
    theorem exists_semi_magic_square_cubes :
        ∃ m : Fin 3 → Fin 3 → ℕ, ∃ t : ℕ,
           m.Injective2 ∧
           (∀ i j, ∃ n : ℕ, 0 < n ∧ m i j = n ^ 3) ∧
           (∀ i, ∑ j, m i j = t) ∧
           (∀ j, ∑ i, m i j = t)
  context:
    - open MagicSquares
  definitions: []
