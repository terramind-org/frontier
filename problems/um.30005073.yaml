title: Habiro-Ring Refinements of Three-Manifold Quantum Invariants
field: mathematics
tier: prose
statement: For every rational homology sphere $Y$, construct elements $I_s(Y)$ of the Habiro ring, indexed by $s\in\operatorname{Spin}^c(Y)$, such that $\widetilde N_r(Y,\omega)=\sum_s C_s(Y,\omega)I_s(Y)|_{q=e^{2\pi i/r}}$ for all admissible $r$ and $\omega$.
