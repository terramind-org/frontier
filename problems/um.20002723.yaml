title: Exceptional polygon models, a counting obstruction, and a folding certificate
field: mathematics
tier: prose
statement: |-
  **Problem 6.2 (A. Zelevinsky).** In the classical types (A, B, C, and D),
  the associahedron \(\Delta_W\) has a visually transparent realization in
  terms of regular plane polygons and their triangulations. Find a similar
  interpratation in the exceptional types.
