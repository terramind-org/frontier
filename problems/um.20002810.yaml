title: A trace-and-type normalization ledger for formal degrees
field: mathematics
tier: prose
statement: |-
  Interpret formal degrees of representations of $\widetilde{G}_{F}$ on level of Hecke algebra.
  ($\grave{\mathrm a}$ la Opdam, Reeder, et al.)

  Here $\widetilde G_F$ is read as the group of $F$-points of a covering group. The broader workshop summary makes the motivating example more precise: the Bernstein blocks containing the even and odd Weil representations of the two-fold metaplectic group should be compared with Iwahori-spherical blocks of equal-rank odd orthogonal groups. The summary singles out preservation of the natural $L^2$ norm under the Hecke-algebra isomorphism, because that is exactly what transports Plancherel measure and hence formal degrees.

  Thus the problem has two levels:

  1. identify formal degree intrinsically on a Hecke algebra equipped with its positive trace; and
  2. keep track of the normalization needed to recover the group formal degree from the type Hecke algebra.
