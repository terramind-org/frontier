  decl: OeisA24356.conjecture
  statement: "theorem conjecture : ∀ n : ℕ, a n = 0 ↔ n = 4"
  context:
    - open OeisA24356
  definitions:
    - name: OeisA24356.a
      kind: def
      text: |-
        /-- The determinant of the $n \times n$ Hankel matrix of primes. -/
        noncomputable def a (n : ℕ) : ℤ :=
          Matrix.det (Matrix.of fun (i j : Fin n) ↦ (Nat.nth Nat.Prime (i.val + j.val) : ℤ))
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/24356.lean#L35
