title: Continuous Galois spectra and an infinite-rank finite-field obstruction
field: mathematics
tier: prose
statement: |-
  For the profinite absolute Galois group
  \(\Gamma=G_K=\operatorname{Gal}(K_s/K)\), construct a genuine continuous
  stable category \(\operatorname{Sp}_\Gamma\) and a motivic comparison which,
  for every open subgroup \(U\leq \Gamma\), sends
  \(\Sigma^\infty \Gamma/U_+\) to
  \(\Sigma^\infty\operatorname{Spec}(K_s^U)_+\). Determine in what precise
  senses this comparison retains restrictions, transfers, norms, fixed-point
  information, or full faithfulness.
