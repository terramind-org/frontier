title: The Ichino–Ikeda Period Conjecture
field: mathematics
tier: prose
statement: Let $F$ be a global field and let $\pi=\pi_V\boxtimes\pi_{V\oplus F}$ be a multiplicity-one tempered cuspidal automorphic representation of $SO(V)\times SO(V\oplus F)$. Does the square of its global period equal the central Rankin–Selberg value divided by the adjoint value, multiplied by the normalized product of local periods and the factor determined by the component group of the global Arthur parameter?
