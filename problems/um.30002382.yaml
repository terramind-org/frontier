title: Abelian Galois Groups of Imaginary Quadratic Fields
field: mathematics
tier: prose
statement: |-
  For density one of the imaginary quadratic fields of prime class number, is the absolute abelian Galois group isomorphic to
  $$A_0=\widehat{\mathbb Z}^{\times}\times\prod_{n\geq1}\mathbb Z/n\mathbb Z$$?
