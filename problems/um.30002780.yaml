title: Bagchi’s Lower Bound for Triangulated Manifolds
field: mathematics
tier: prose
statement: For a $d$-dimensional triangulated homology manifold and every relevant index $i$, is $g_i\geq\binom{d+1}{i}\left((-1)^i+\sum_{j=1}^{i}(-1)^{i-j}\mu_{j-1}\right)$, where the $\mu_j$ are the averaged discrete Morse numbers of the triangulation?
