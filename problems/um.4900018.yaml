title: Termination of juggler sequences
field: mathematics
tier: prose
statement: Starting from a positive integer $a_0$, define $a_{n+1}=\lfloor a_n^{1/2}\rfloor$ when $a_n$ is even and $a_{n+1}=\lfloor a_n^{3/2}\rfloor$ when $a_n$ is odd. Does every such juggler sequence eventually reach $1$?
