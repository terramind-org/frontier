title: Simplex Equality Cases in Convex Geometric Inequalities
field: mathematics
tier: prose
statement: Let $n>2$, and let $K\subset\mathbb{R}^n$ be a convex body whose extreme points have Euclidean norm at least $r$. Write $g_K$ for its centroid and $C_2(K)=|K|^{-1}\int_K\|x\|_2^2\,dx$. If equality holds in the sharp bound $C_2(K)\geq\bigl(r^2+(n+1)\|g_K\|_2^2\bigr)/(n+2)$, must $K$ be a simplex whose vertices lie on the Euclidean sphere of radius $r$?
