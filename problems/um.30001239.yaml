title: Regularity Bounds for Ext Modules Under Serre Conditions
field: mathematics
tier: prose
statement: Let $S=k[x_1,\ldots,x_n]$, let $I$ be graded, let $R=S/I$ have dimension $d$, and let $r\geq1$. Which graded ideals satisfy $\operatorname{reg}\operatorname{Ext}_S^{n-i}(R,\omega_S)\leq\dim\operatorname{Ext}_S^{n-i}(R,\omega_S)$, and, when $R$ satisfies $(S_r)$, do they satisfy the corresponding bound by $i-r$ for every $0\leq i\leq d-1$, even for monomial ideals?
