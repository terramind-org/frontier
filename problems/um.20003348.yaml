title: A rank-three positive cone and a strict/closed-cone audit
field: mathematics
tier: prose
statement: |-
  **Question 49 (B. Weiss).** Construct examples of cones \(D\) in \(A\) with \(\dim D\geq 3\) and no non-obvious divergent trajectories.

  The source record itself has not been modified.

  The preceding paragraph in the AIM source says that Weyl chambers give examples having non-obvious divergent trajectories, while Weiss had an \(\mathrm{SL}_3(\mathbb R)\) example of a two-dimensional cone for which all divergent trajectories are obvious. Thus the request is meant to seek higher-dimensional, nonvacuous examples, even though “nonvacuous” is not an explicit logical condition in the one-sentence question.
