title: Kourovka Notebook Problem 12.54
field: mathematics
tier: prose
statement: |-
  Is there a normal valued $l $-group $G$ for
  which there is no abelian $l $-group $A$ with $C(A) \cong C(G)$?
  (Here $C(G)$ denotes the lattice of convex $l $-subgroups of
  $G$. If $G$ is not required to be normal valued, this question has
  an affirmative answer.)
