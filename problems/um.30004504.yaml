title: Short-Interval Möbius Orthogonality to Polynomial Phases
field: mathematics
tier: prose
statement: For every $k\geq1$ and every $H=H(X)\to\infty$ as $X\to\infty$, is it true that for almost all $x\in[X,2X]$, $\sup_{P\in\mathbb{R}[t], \deg P=k}\left|\sum_{x\leq n\leq x+H}\mu(n)e(P(n))\right|=o(H)$?
