title: The Lyapin's Notebook — Problem 21
field: mathematics
tier: prose
statement: |-
  (A.A. Borisov)
  Describe commutative semigroups whose semigroups of endomorphisms (with pointwise multiplication) are isomorphic to one of the following semigroups:

  - the additive semigroup of all positive rational numbers;

  - the additive semigroup of all non negative rational numbers.
