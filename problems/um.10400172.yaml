statement: (Y. Kawahigashi) There are some fusion rule algebras with 6j -symbols that do not seem to arise from quantum groups in [14] and more conjectured candidates of such examples in [160]. What are t he corresponding TQFT’s? Especially if the series conjectured in [160] does e xist, it would give a parametrized family of TQFT’s. Does a diﬀerentiation by a p arameter (af- ter a certain reparametrization) give a more interesting in variant, possibly of Vassiliev type? 9.4 Turaev-Viro-Ocneanu invariants The state-sum invariant of 3-manifolds derived from 6 j -symbols is called the Turaev-Viro-Ocneanu invariant when the set of 6 j -symbols arises from a sub- factor. There are infinitely many subfactors other than thos e derived from quantum groups or finite groups. The Turaev-Viro-Ocneanu in variants derived from such subfactors might be new invariants of 3-manifolds. (N. Sato) The Haagerup subfactor of Jones index 5+ √ 13 2 has the smallest index among finite depth subfactors with Jones index bigger t han 4 and it is expected to have some “exotic” properties from the subfacto r theoretical view- point. However, it does not seem so sensitive to classify 3-m anifolds. The Turaev-Viro-Ocneanu invariant constructed from the Haage rup subfactor can- not distinguish lens spaces L(5, 1) and L(5, 2), as well as L(7, 1) and L(7, 2). On the other hand, generalized E6 -subfactors with the group symmetries Z/3Z and Z/5Z can distinguish L(3, 1) and L(3, 2), L(5, 1) and L(5, 2), respectively.
