statement: |-
  \section*{Self-Ext vanishing over symmetric algebras}\label{30007006}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every finite-dimensional symmetric algebra A over a field, must each finite-dimensional module M with $Ext_A^i(M,M)=0$ for every integer $i>0$ be projective?
  \subsection{Short English statement}
  For every finite-dimensional symmetric algebra A over a field, must each finite-dimensional module M with $Ext_A^i(M,M)=0$ for every integer $i>0$ be projective?
