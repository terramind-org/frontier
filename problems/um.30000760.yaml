title: Explicit Formulas for the Affine Satake Isomorphism
field: mathematics
tier: prose
statement: Let $G$ be reductive, let $G_{\mathrm{aff}}$ be the corresponding affine Kac–Moody group, and let $G_{\mathrm{aff}}^\vee$ be its affine Langlands dual. The affine Satake isomorphism identifies the affine Hecke algebra with a completion of $K(\operatorname{Rep}(G_{\mathrm{aff}}^\vee))\otimes\mathbb{C}$. Is this isomorphism given by a formula analogous to Lusztig's explicit $q$-analogue formula?
