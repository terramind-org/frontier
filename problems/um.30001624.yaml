title: Local Compactness and Nuclear-Space Extensions of Character Spectra
field: mathematics
tier: prose
statement: Let $\mathcal L\cong C_0(X)$ be a commutative $C^*$-algebra, and let $X_0\subseteq X$ correspond to the characters in $\operatorname{Rep}_0(\mathcal L,\mathbb C)$. Is $X_0$ locally compact in the relative topology? Does an analogous character-spectrum construction exist for separable nuclear spaces, extending the case of $\mathbb R^{(\mathbb N)}$?
