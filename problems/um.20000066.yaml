title: Hochschild invariants and a projective Calabi-Yau nonembedding obstruction
field: mathematics
tier: prose
statement: |-
  Investigate \(Ku(X)\) for \(X\) a smooth quartic double 5 fold, that is, a double cover of \(\mathbb P^5\) branched along a quartic.
  This variety is Calabi-Yau and it is never of the form \(D(Y)\) for \(Y\) a variety. Further, the Serre functor of \(X\) is equal to shift by 3; in other words, the category \(Ku(X)\) is 3-Calabi Yau.
