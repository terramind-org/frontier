title: Foliations and Diffeomorphism Groups — Question 45
field: mathematics
tier: prose
statement: Let $G$ be a finitely generated amenable orderable group, and $\varphi\colon G\to \mathrm{Homeo}_+\mathbb{R}$ an action of $G$ without global fixed points. Is it true that $\varphi$ is either semi-conjugate to an affine action or laminar?
