title: Kourovka Notebook Problem 20.119
field: mathematics
tier: prose
statement: |-
  (G. Wilkes).
  A pro-$p$ group is said to be *accessible* if there is a
  number $n = n(G)$ such that any finite proper reduced graph of pro-$p$ groups with finite edge groups having fundamental group isomorphic to $G$ has at most $n$ edges (*J. Algebra*, **525** (2019), 1--18).

  Is every finitely presented pro-$p$ group accessible?
