title: Short-Time PIC1 Ricci Flow
field: mathematics
tier: prose
statement: Let $(M,g_0)$ be a smooth complete $n$-dimensional manifold with $n\geq3$ satisfying PIC1. Does there exist $T>0$ and a smooth PIC1 Ricci flow $g(t)$ on $M$ for $0\leq t<T$ such that $g(0)=g_0$?
