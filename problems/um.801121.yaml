title: Ultraproduct II_1 Factors — Problem 22
field: mathematics
tier: prose
statement: |-
  See [Jolissaint1998] where it was proved that these group von Neumann algebras are McDuff.

  If $M\cong N_1\overline{\otimes} N_2$, and $M$ is McDuff, does it imply that either $N_1$ or $N_2$ are McDuff?
