title: Koszul complexes as derived intersections and splitting obstructions
field: mathematics
tier: prose
statement: |-
  **Question 11 (Paul Balmer).** Using operations like \(\otimes\),
  \(\wedge\) and taking cones, is there a construction so that one obtains
  the Koszul complex \(K_\bullet(s)\) from the complex
  \[
  \cdots\longrightarrow 0\longrightarrow P\xrightarrow{s}A
  \longrightarrow 0\longrightarrow\cdots?
  \]
  Does this generalize to tensor triangulated categories?

  **Remark (Paul Balmer).** Let \(K\) be a tensor triangulated category and
  let \(X\in\operatorname{Ob}(K)\). Suppose there is a map
  \(X\xrightarrow{s}\mathbf 1\). If the above construction works, then one
  can obtain a class \(c(X)\in GW(K)\). This class should then define an
  obstruction class for \(X\) to split a free summand \(\mathbf 1\).

  **Remark (Madhav Nori).** There is such a construction.
