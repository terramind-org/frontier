title: Modular Forms from Generalized Cohomology Theories
field: mathematics
tier: prose
statement: Stabilizing classifying spaces of elliptic bundles associated with genus-one conformal field theories produces generalized cohomology theories $E$ with natural maps $E\to K[[q]][q^{-1}]$. Are the images of the coefficient rings under these maps always modular forms?
