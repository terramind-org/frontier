title: Major problems 3 — Find some geometric meaning for elliptic cohomology.
field: mathematics
tier: prose
statement: Find some geometric meaning for elliptic cohomology. I believe this problem may be solvable--we keep learning new things about it. One thing I will say here; if I am called to referee a paper on elliptic cohomology that does not deal with the Hopkins viewpoint on elliptic spectra, I will almost surely reject it. The time is gone when one could write papers about the Landweber-Ravenel-Stong elliptic cohomology based on the Jacobi quartic--we now understand that that is only one of many different elliptic cohomology theories, and all papers on elliptic cohomology should now accept that and deal with it. The fundamental reference here is M. J. Hopkins, Topological modular forms, the Witten genus, and the theorem of the cube, in {\it Proceedings of the International Congress of Mathematicians, Vol.\ 1, 2 (Z\"urich, 1994)}, 554--565, Birkh\"auser, Basel, 1995; MR 97i:11043. But one should also see Grojnowski's approach to equivariant elliptic cohomology--unfortunately, this does not seem to be published, but there is a preprint. Matthew Ando has also thought about this, see M. Ando, Power operations in elliptic cohomology and representations of loop groups, Trans. Amer. Math. Soc. ; CNO CMP 1 637 129. I am sure I have left something out here as well.
