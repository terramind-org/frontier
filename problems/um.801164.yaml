title: Open Problems in Wavelet Theory — Problem 3
field: mathematics
tier: prose
statement: |-
  This leaves open the problem of existence of Riesz wavelets which was posed by Seip [Seip]. We say that $\psi$ is a Riesz wavelet for $\mathcal{H} =H^2(\mathbb{R})$ or $L^2(\mathbb{R})$ if the wavelet system is a Riesz basis of $\mathcal{H}$. A Riesz basis in a Hilbert space $\mathcal{H}$ can be defined as an image of an orthonormal basis under an invertible operator on $\mathcal{H}$. Every Riesz basis has a dual Riesz basis. However, the dual of Riesz wavelet system might not be a wavelet system. If it is, then we say that $\psi$ is a biorthogonal (Riesz) wavelet.

  Does there exist a Riesz wavelet $\psi$ in $H^2(\mathbb{R})$
  such that $\psi$ belongs to the Schwartz class?
