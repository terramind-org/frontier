title: Additive reversibilization, nonnormality, and a sharp normal-chain comparison
field: mathematics
tier: prose
statement: "**Nonreversible vs. reversible chains.** Let \\(P\\) be the transition matrix of a general nonreversible chain with, say, bounded degree vertices and transition probabilities uniformly bounded from below. Denote its mixing time by \\(t_{\\mbox{mix}}^P\\) and let \\(\\widetilde t_{\\mbox{mix}}\\) be the mixing time of its symmetrization. Is it always true that \\(t_{\\mbox{mix}}^P\\lesssim \\widetilde t_{\\mbox{mix}}\\)? Is the same also true of the cover time?"
