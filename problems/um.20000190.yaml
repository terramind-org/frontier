title: A root-free focal-positivity certificate for a seven-point pencil
field: mathematics
tier: prose
statement: |-
  The focal lengths of a pair of cameras can be written as a function of
  their fundamental matrix. During reconstruction fundamental matrices are
  constructed for which these focal lengths are complex. Is there an
  efficient way to detect if the this will occur before computing the
  fundamental matrix?
