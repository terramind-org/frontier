title: Rational Dimensions of Critical Modular $L$-Values
field: mathematics
tier: prose
statement: Let $f\in S_k(\operatorname{SL}_2(\mathbb Z))$ be a normalized Hecke eigenform. If $L_f^+$ and $L_f^-$ are the $\mathbb Q$-spans of its odd and even critical values $\Lambda(f;s)$, respectively, prove that $\dim_{\mathbb Q}L_f^\pm=\dim_{\mathbb C}S_k(\operatorname{SL}_2(\mathbb Z))$.
