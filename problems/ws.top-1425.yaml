  \item[\hypertarget{source:statement:2}{S2}] Jeff Kahn and Jinyoung Park, Tuza’s Conjecture for Random Graphs, arXiv:2007.04351v2 (2020), Section 1, definitions and Conjecture 1.1. \url{https://arxiv.org/pdf/2007.04351v2}.
