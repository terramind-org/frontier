statement: |-
  \section{Tuza's Conjecture}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For a finite simple undirected graph $G$, a triangle is a three-vertex complete subgraph. A triangle packing is a collection of triangles with pairwise disjoint edge sets; let $\nu(G)$ be its maximum possible size. A triangle edge cover is a set $F\subseteq E(G)$ containing at least one edge of every triangle, and
  \[
   \tau(G)=\min\{|F|:F\subseteq E(G),\ G-F\text{ has no triangle}\}.
  \]
  Both numbers are zero for a triangle-free graph. A packing is edge-disjoint rather than vertex-disjoint, and a cover consists of edges rather than triangles.
  \paragraph{Statement recorded in the supplied source.}
  Does every finite simple graph $G$ satisfy $\tau(G)\le2\nu(G)$? Equivalently, can one choose at most $2\nu(G)$ edges meeting every triangle? This is the packing--covering assertion described in the catalogue background; it does not ask triangles to cover all edges of $G$. \sref{statement}{2}
  \subsection{Short English statement}
  Is the smallest number of edges meeting every triangle at most twice the largest number of edge-disjoint triangles?
