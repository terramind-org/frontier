title: "Random jammed sphere packings: a rattler-corrected contact bound and a density-contact counterexample"
field: mathematics
tier: prose
statement: |-
  **Random packings**

  It is know from simulations and experiments that a "random" packing
  of spheres that cannot be "locally improved" achieves a density of
  64%, well short of the maximal density of 74...%.

  What is a reasonable definition of a random jammed sphere packing?
  Can the experimental density of 64% in $\mathbb{R}^3$ be justified?
  How is density related to contact number(is it)?

  How, if at all, is density related to contact number?
