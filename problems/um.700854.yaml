statement: |-
  Suppose that ${\mathfrak{F}}$ is a radical composition
  formation of finite groups. Prove that $\left< H,K\right> ^{{\mathfrak{F}}} =\left< H^{{\mathfrak{F}}}, K^{{\mathfrak{F}}}\right>$ for every finite
  group $G$ and any subnormal subgroups $H$ and $K$ of $G$.
