title: Arakelov replacement and a surface exponent-transfer lemma
field: mathematics
tier: prose
statement: |-
  **Problem/Question 34. (Bogomolov)** Replace Heath-Brown by Arakelov (et al).
  \[
  \#\{(x,y,z)\in\mathbb P^2: |x|,|y|,|z|\le B,\ P(x,y,z)=0\}
  \ll B^{\alpha+\epsilon}
  \]
  with \(\alpha\le 2/d\), \(d=\deg P\). Analogue for surfaces, etc.
