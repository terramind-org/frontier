title: Deformation Equivalence of Categorical Hyperkähler Constructions
field: mathematics
tier: prose
statement: Let $g\geq 0$ and let $w\in\mathbb Z$ be coprime to $v$. Prove that the reduced category $T_S(v)_w^{\mathrm{red}}$ is deformation equivalent to $D^b(\operatorname{Hilb}(S,g'))$, where $g'=(\langle v,v\rangle+2)/2$.
