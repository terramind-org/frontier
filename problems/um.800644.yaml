title: Selection Principles Milestone Problems — Problem 17
field: mathematics
tier: prose
statement: |-
  Recall that $\mathsf{U}_{\mathrm{fin}}(\Gamma,\mathcal{O})\Leftrightarrow\mathsf{S}_{\mathrm{fin}}(\Omega,\mathcal{O})$.
  In [coc7] it is proved that $\mathsf{U}_{\mathrm{fin}}(\Gamma,\Gamma)\Leftrightarrow\mathsf{S}_{\mathrm{fin}}(\Omega,\mathcal{O}^{\gamma\mbox{-*\tiny gp*}})$,
  and in [coc8] it is proved that $\mathsf{U}_{\mathrm{fin}}(\Gamma,\Omega)\Leftrightarrow\mathsf{S}_{\mathrm{fin}}(\Omega,\mathcal{O}^{\omega\mbox{-*\tiny gp*}})$.

  Is $\mathsf{U}_{\mathrm{fin}}(\Gamma,\mathrm{T})$ equivalent to $\mathsf{S}_{\mathrm{fin}}(\Omega,\mathcal{O}^{\tau\mbox{-*\tiny gp*}})$?
