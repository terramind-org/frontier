title: Riesz Transform Boundedness and $\beta$-Number Carleson Conditions
field: mathematics
tier: prose
statement: |-
  Let $\mu$ be a Borel measure on $\mathbb R^{n+1}$ satisfying $\mu(B(x,r))\leq c_0r^n$. Is the codimension-one Riesz transform bounded on $L^2(\mu)$ if and only if every ball $B$ satisfies
  $$
  \int_B\int_0^{r(B)}\beta_{\mu,2}(x,r)^2\Theta_\mu(x,r)\,\frac{dr}{r}\,d\mu(x)\leq C\mu(B),
  $$
  where $\Theta_\mu(x,r)=\mu(B(x,r))/r^n$ and $\beta_{\mu,2}$ is the Jones $n$-plane coefficient?
