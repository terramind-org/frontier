title: Chow Decompositions of Hilbert Schemes of K3 Surfaces
field: mathematics
tier: prose
statement: For $X=S^{[m]}$ with $S$ a projective K3 surface, does the Chow decomposition $CH^i_{(j)}(X)$ satisfy $CH^i_{(j)}(X)=0$ for $j<0$, and does the cycle-class map $CH^i_{(0)}(X)\to H^{2i}(X)$ remain injective?
