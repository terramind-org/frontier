  \section*{The cotype-cotype conjecture with the approximation property}\label{30007179}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every nonzero real Banach space X with the ordinary approximation property, is X K-convex if and only if both X and its continuous dual have finite cotype, allowing different finite exponents for the two spaces?
  \subsection{Short English statement}
  For every nonzero real Banach space X with the ordinary approximation property, is X K-convex if and only if both X and its continuous dual have finite cotype, allowing different finite exponents for the two spaces?
