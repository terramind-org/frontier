title: Lower Bounds for Convex Decompositions of Crossing Curves
field: mathematics
tier: prose
statement: Let $M(d)$ be the least integer such that every $(d+1)$-crossing curve in $\mathbb R^d$ can be decomposed into $M(d)$ convex curves. Establish nontrivial lower bounds for $M(d)$.
