title: EPW Sextics from Fano Models of Enriques Surfaces
field: mathematics
tier: prose
statement: Let $S$ be a general Fano model of an Enriques surface. The linear system $|2D|$ embeds $S$ in $\mathbb P^{19}$ as a surface of degree $40$. Does a suitable projection to $\mathbb P^5$ produce a degree-$40$ surface contained in the singular locus of an EPW sextic?
