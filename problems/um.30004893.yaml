title: Quantum Grothendieck Rings Beyond Simply-Laced Types
field: mathematics
tier: prose
statement: For a category $\mathcal C$ of finite-dimensional representations of a quantum affine algebra, does the bilinear product $*$ constructed from the monoidal Jantzen filtration make $(K(\mathcal C)_t,*)$ an algebra with anti-involution, isomorphic to the quantum Grothendieck ring $K_t(\mathcal C)$ with its standard bases identified?
