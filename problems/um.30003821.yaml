title: Pattern-Avoidance Inequalities on Digitally Convex Shapes
field: mathematics
tier: prose
statement: Let $\lambda\subset\mathbb Z^2$ be a digitally convex shape of side $n$, and let $S_\lambda$ consist of the permutations $\sigma\in S_n$ whose graph lies in $\lambda$. Let $A_\lambda$ count the permutations in $S_\lambda$ that avoid every increasing triple $i_1<i_2<i_3$ for which both $(i_1,\sigma_{i_3})$ and $(i_3,\sigma_{i_1})$ lie in $\lambda$. Let $B_\lambda$ count the red-and-blue colorings of permutations in $S_\lambda$ that avoid both a red increasing pair $i_1<i_2$ with $(i_2,\sigma_{i_1})\in\lambda$ and a blue increasing pair $i_1<i_2$ with $(i_1,\sigma_{i_2})\in\lambda$. Is $B_\lambda\geq A_\lambda$ for every digitally convex shape $\lambda$?
