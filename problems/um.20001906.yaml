title: Playfair rigidity without focal points
field: mathematics
tier: prose
statement: |-
  Question 7.2.2 ([Bur-Kni1991]). Must a metric satisfying this version of the par-allel postulate be flat?

  The question looks like a question in the synthetic geometry, but it is not, since we do not require a priori that the other axioms of the Euclidean geometry are fulfilled (for example the congruence axioms). 7.2.1. Higher rank rigidity.

  Consider the plane \(\mathbb R^2\) with a complete Riemannian metric. Assume that for every geodesic and for every point not on the geodesic there exists precisely one nontrivial geodesic that passes through the point and does not intersect the geodesic. This assumption implies that the metric has no conjugate points.
