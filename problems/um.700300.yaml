title: Kourovka Notebook Problem 5.16
field: mathematics
tier: prose
statement: |-
  Is
  every countable locally linear group embeddable in a finitely
  presented group? In (G. Baumslag, F. B. Cannonito,
  C. F. Miller III, *Math. Z.*, **153** (1977), 117--134) it
  is proved that every countable group which is locally linear of
  bounded degree can be embedded in a finitely presented group with
  solvable word problem.
