  decl: Erdos838.erdos_838.parts.ii
  statement: |-
    theorem erdos_838.parts.ii :
        ∃ c : ℝ, Tendsto (fun n : ℕ ↦ Real.log (f n) / Real.log n ^ 2) atTop (nhds c)
  context:
    - open Erdos838
    - open Erdos838.erdos_838
    - open Erdos838.erdos_838.parts
    - open Filter Asymptotics EuclideanGeometry
  definitions:
    - name: Erdos838.f
      kind: def
      text: |-
        /-- $f(n)$: the least number of convex subsets determined by $n$ points of $\mathbb{R}^2$ with no
        three on a line. Such point sets exist for every $n$ (for example $n$ points on a parabola), so
        the `sInf` is a true minimum. -/
        noncomputable def f (n : ℕ) : ℕ :=
          sInf {m : ℕ | ∃ P : Finset ℝ², P.card = n ∧ NonTrilinear (P : Set ℝ²) ∧
            numConvexSubsets P = m}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/838.lean#L42
