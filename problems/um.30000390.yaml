title: Maximum Families of Pairwise Colliding Permutations
field: mathematics
tier: prose
statement: Let $\rho(n)$ be the maximum size of a family of pairwise colliding permutations of $[n]$, where two permutations collide if they map some element to consecutive integers. Is $\limsup_{n\to\infty}n^{-1}\log_2\rho(n)=1$?
