title: Categorical Gap of Cubic Fourfolds
field: mathematics
tier: prose
statement: For a smooth projective variety $X$ with bounded derived category of coherent sheaves $D^b(X)$, Orlov's spectrum (or gap) measures the lengths of gaps in generation times (Rouquier dimensions) of $D^b(X)$. Is the gap of a smooth projective $4$-dimensional cubic hypersurface $X \subset \mathbb{P}^5$ strictly greater than $1$?
