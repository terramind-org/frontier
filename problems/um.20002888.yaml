id: um.20002888
title: Sharp 2-jet determination and an accumulation obstruction
field: mathematics
tier: prose
statement: |-
  Let \(M\) be a connected generic real-analytic manifold in \(\mathbb C^n\), holomorphically nondegenerate and of finite type. For \(p\in M\), let \(k(p)\) be the least \(k\) for which
  \[
  \operatorname{Aut}_M(p)\longrightarrow G^k(\mathbb C^n),
  \qquad f\longmapsto j_p^k f                                      \tag{1.1}
  \]
  is injective. Does there exist such an \(M\subset\mathbb C^2\) and a sequence \(p_j\in M\) with \(k(p_j)\to\infty\)?

  Comment: such an \(M\) exists in higher dimensions.

  If \(M\) is only generically of finite type, does there exist an \(M\) as above with \(p_j\) converging to a point of \(M\)?

  It contains the running header “AIM WORKSHOP ON COMPLEXITY OF MAPPINGS IN CR GEOMETRY 3” inside the phrase “of finite type” and flattens subscripts and superscripts in the jet map.

  Here \(\operatorname{Aut}_M(p)\) is the stability group of germs at \(p\) of local biholomorphisms of the ambient space fixing \(p\) and preserving the germ \((M,p)\); \(G^k(\mathbb C^n)\) is the group of invertible \(k\)-jets after centering \(p\) at the origin. For real-analytic finite-type hypersurfaces, this agrees with the corresponding group of germs of real-analytic CR automorphisms.

  The PDF really says “generic real analytic manifold,” not “hypersurface.” In \(\mathbb C^2\), however, a positive-dimensional generic submanifold of positive CR dimension and finite Bloom--Graham type must have real codimension one, hence is a hypersurface. A codimension-two generic submanifold has CR dimension zero and cannot generate its tangent bundle by CR brackets.
