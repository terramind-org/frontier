lean:
  module: FormalConjectures.OEIS.«214560»
  decl: OeisA214560.conjecture
  statement: "theorem conjecture (x : ℕ) : ∃ i : ℕ, ∀ n > i, x < a n"
  context:
    - open OeisA214560
  definitions:
    - name: OeisA214560.a
      kind: def
      text: |-
        /-- Number of $0$'s in the binary expansion of $n^2$, with $a(0) = 1$. -/
        def a (n : ℕ) : ℕ :=
          if n = 0 then 1 else (Nat.digits 2 (n ^ 2)).count 0
