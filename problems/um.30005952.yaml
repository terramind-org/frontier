statement: For every rational homology sphere $Y$, does $HF^-(Y)$ contain a direct summand $\mathbb F[U]/U^\ell\oplus\mathbb F[U]/U^{\ell-1}\oplus\cdots\oplus\mathbb F[U]/U$, where $\ell$ is the least integer satisfying $U^\ell HF^-_{\mathrm{red}}(Y)=0$?
