title: Kourovka Notebook Problem 14.39
field: mathematics
tier: prose
statement: |-
  Let $F(V)$ be a free group of some variety of
  pro-$p $-groups $V$. Is there a uniform bound for the exponents
  of periodic elements in
  $F(V)$? This is true if the variety
  $V$ is metabelian (A. N. Zubkov, *Dr. Sci.
  Diss.*,
  Omsk, 1997 (Russian)).
