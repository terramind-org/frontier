title: Geometric Hydrodynamics in Open Problems — Problem 14
field: mathematics
tier: prose
statement: |-
  The concept of GM-flows appears closely related to the ``ancient flows" for the Navier--Stokes equations
  but, in fact, it is different. Both concepts express the general idea that, in reality, we observe flows that have existed
  since long time ago (one may imagine a river flow). In this regard, it is not natural to consider
  flows starting at some definite time $t_0$ with some (arbitrary) initial velocity $u_0$.
  GM-flows have natural, intrinsic structure (analytic level lines of vorticity) and some natural, finite regularity
  in the transversal direction.
  The question of which functional classes are suitable for their study is an intriguing open problem.

  Determine the true regularity of GM-flows in the framework of anisotropic function spaces.
