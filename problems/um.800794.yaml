title: Branko Grunbaum in Many Dimensions — Question 1
field: mathematics
tier: prose
statement: |-
  There is still more to do in this area, however. A Venn diagram is said to be *simple* if no more than two curves intersect at any point.

  Do simple, symmetric Venn diagrams with $n$ curves exist for every prime number $n$?
