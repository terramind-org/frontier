title: Foliations and Diffeomorphism Groups — Question 38
field: mathematics
tier: prose
statement: |-
  Consider four local $C^r$ diffeomorphisms $f_a,f_b,f_c,f_d$ of $R$ whose definition domain contains $[-1,1]$ and having $0$ as a common fixed point. Let $h=[f_a,f_b][f_c,f_d]$ be the product of the commutators.

  Does there exist $\tilde f_a,\tilde f_b, \tilde f_c,\tilde f_d$ coinciding with $f_a,f_b,f_c,f_d$ out of $[-1,1]$, $C^r$-close to $f_a,f_b,f_c,f_d$, so that
  $$h=[\tilde f_a\tilde f_b][\tilde f_c\tilde f_d]$$
  and so that $$Fix f_a\cap Fix f_b\cap Fix f_c \cap Fix f_d \cap (-1,1)=\emptyset.$$
