id: um.30000880
title: Basis Numbers and Torsion Units in Skew Group Algebras
field: mathematics
tier: prose
statement: Let $t:G\to\operatorname{Aut}(K)$ be a group action on a field $K$. Does the skew group algebra $K^tG$ have invariant basis number? In the recursive construction of torsion units $w_i$ from a torsion element $a$ and an element $b\in G$, what can be said about $S(a,b)=\{w_i\}$ and the group it generates? Finally, if $G$ is a finite nonabelian $p$-group over a field $K$ of characteristic $p>2$, does $KG$ lack a filtered multiplicative basis?
