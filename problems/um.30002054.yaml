title: Additivity of Triangulation Complexity under Connected Sum
field: mathematics
tier: prose
statement: |-
  Let $M$ be a compact $(d-1)$-dimensional manifold with boundary, where $d\geq4$, and define
  $$\Gamma(M)=\min_{|\Delta|=M}\bigl(h_2(\Delta)-h_{d-1}(\Delta)-d h_d(\Delta)\bigr)=\min_{|\Delta|=M}\bigl(h_2(\Delta)-f_0^{\mathrm{int}}(\Delta)\bigr).$$
  For a closed manifold, set $\Gamma(M)=\Gamma(M\setminus B^{d-1})$. Is $\Gamma(M_1\mathbin{\#}M_2)=\Gamma(M_1)+\Gamma(M_2)$?
