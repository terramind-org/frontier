title: Arthur Parameters from Automorphic Descent Integrals
field: mathematics
tier: prose
statement: Let $\sigma$ and $\pi$ be irreducible cuspidal automorphic representations of $\operatorname{SO}_{2k}(\mathbb A)$ and $\operatorname{SO}_{2ab+2k}(\mathbb A)$, respectively. Suppose the automorphic descent integral $I_{a,k,l}^{\psi}(\tau,\sigma;\pi)$ is nonzero. If $b$ is even when $\tau$ is of symplectic type and odd when $\tau$ is of orthogonal type, does $\sigma$ have global Arthur parameter $\psi_{\operatorname{SO}_{2k}}$ if and only if $\pi$ has parameter $\psi_{\operatorname{SO}_{2k}}\oplus(\tau,b)$?
