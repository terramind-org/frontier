title: Moments of L-functions — Moments of the Riemann zeta function — Problem 33
field: mathematics
tier: prose
statement: |-
  Compute exact simple formulae for the coefficients of $P_3$. Numerically check the size of $| D_{3,2}(x,h) - x P_3(\log x)| $.
  Is the error term of size $\sqrt{x}$? See the recent related article of Nguyen [Nguyen].

  (Nathan Ng, Lethbridge)
