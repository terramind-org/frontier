title: Rigidity in Scalar-Curvature Band Width Inequalities
field: mathematics
tier: prose
statement: Let $Y$ be a closed $(n-1)$-manifold, with $n-1\neq4$, that admits no positive-scalar-curvature metric; set $X=Y\times[-1,1]$ and $c_n=\sqrt{(n-1)/n}$. Suppose $\operatorname{Sc}(X,g)\geq\sigma>0$, $-\pi c_n/\sqrt{\sigma}<\ell_-<\ell_+<\pi c_n/\sqrt{\sigma}$, $H(\partial_-X)\geq\sqrt{\sigma}c_n\tan(\sqrt{\sigma}\ell_-/(2c_n))$, $H(\partial_+X)\geq-\sqrt{\sigma}c_n\tan(\sqrt{\sigma}\ell_+/(2c_n))$, and $\operatorname{width}(X,g)\geq\ell_+-\ell_-$. Must $(X,g)$ be isometric to $Y\times[\ell_-,\ell_+]$ with metric $\varphi(t)^2g_Y+dt^2$, where $\varphi(t)=\cos(\sqrt{\sigma}t/(2c_n))^{n/2}$ and $g_Y$ is Ricci-flat?
