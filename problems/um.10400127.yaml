statement: (H. Murakami [294]) For any closed 3-manifold M, 2π √ −1·o-lim N →∞ log τ SU (2) N (M ) N = CS(M ) + √ −1vol(M ), where vol(M ) and CS(M ) denote the hyperbolic volume 23 and the Chern- Simons invariant24 of M respectively, and o- lim denotes the “optimistic limit” introduced in [294]. 23When M is not hyperbolic, we define vol( M ) to be v3||M ||, where ||M || is the simplicial volume and v3 is the hyperbolic volume of the regular ideal tetrahedron. 24It is also conjectured (see Problem 7.16) that there exists a n appropriate definition of CS(M ) of any closed 3-manifold M, though CS( M ) is defined only for hyperbolic 3-manifolds M at present.
