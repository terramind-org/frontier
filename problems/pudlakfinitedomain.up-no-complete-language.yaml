lean:
  module: FormalConjectures.Paper.PudlakFiniteDomainConjectures
  decl: PudlakFiniteDomain.up_no_complete_language
  statement: "theorem up_no_complete_language : ¬∃ L : DecisionProblem, IsCompleteFor UP L"
  context:
    - open PudlakFiniteDomain
    - open ComplexityTheory
  definitions:
    - name: PudlakFiniteDomain.IsCompleteFor
      kind: def
      text: |-
        /-- `L` is **complete** for the class `C` under polynomial-time many-one reductions. -/
        def IsCompleteFor (C : DecisionComplexityClass) (L : DecisionProblem) : Prop :=
          L ∈ C ∧ ∀ L' ∈ C, ManyOneReducible L' L
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Paper/PudlakFiniteDomainConjectures.lean#L55
    - name: PudlakFiniteDomain.UP
      kind: def
      text: |-
        /-- The class **UP**: languages accepted by a polynomial-time verifier with at most one
        witness per input. -/
        def UP : DecisionComplexityClass :=
          { L | ∃ (p : Polynomial ℕ) (R : List Bool × List Bool → Bool),
              IsPolyTime R ∧
              (∀ x, L x ↔ ∃ w : List Bool, w.length ≤ p.eval x.length ∧ R (x, w)) ∧
              ∀ x w w', w.length ≤ p.eval x.length → w'.length ≤ p.eval x.length →
                R (x, w) → R (x, w') → w = w' }
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Paper/PudlakFiniteDomainConjectures.lean#L59
