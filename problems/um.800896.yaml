title: Open Problems in Pluripotential Theory — Question 27 (Blocki)
field: mathematics
tier: prose
statement: Let $\Omega$ be smoothly bounded strictly pseudoconvex domain. It is known that $g_{\Omega}\in\mathcal{C}^{1,1}(\Omega\setminus\lbrace w\rbrace)$. Is there an example where $g$ fails to be in $\mathcal{C}^2(\Omega\setminus\lbrace w\rbrace)$?
