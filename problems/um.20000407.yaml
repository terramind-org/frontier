title: Orthogonal low-lying zeros and forced-zero deflation
field: mathematics
tier: prose
statement: For an orthogonal family of function-field $L$-functions---naturally, quadratic twists $L(E\otimes\chi_D,u)$ of a fixed elliptic curve $E/\mathbb F_q(t)$---compute low-lying one-level or higher-level statistics after mean-spacing-one unfolding; condition on the functional-equation sign when needed; distinguish $O$, $SO(\mathrm{even})$, and $SO(\mathrm{odd})$; and state whether forced central zeros are retained or removed. In the fixed-$q$ degree aspect, let $\deg D\to\infty$.
