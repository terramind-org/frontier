title: Problem 2.5 — Let g > hand let Γ be a finite index subgroup of Modg.
field: mathematics
tier: prose
statement: "Let g > hand let Γ be a finite index subgroup of Modg. Assume that g≥ 3 and φ: Γ → Modh is a homomorphism. (a) Is the image of φ necessarily finite? (b) (A weaker version of (a)) Is the image of φ necessarily of infinite index in Modh. On the other hand, it is well known that H 1(Modg; Z) = 0 for all g. Another way of saying this is that any homomorphism Mod g→ Z is trivial. A problem of Ivanov in [ 25], Problem 2.11 (A), asks whether the same conclusion holds for finite index subgroups:"
