title: Admissibility and Prediction for Multidimensional Hyperbolic Balance Laws
field: mathematics
tier: prose
statement: Find suitable admissibility criteria for physically reasonable solutions of multidimensional hyperbolic balance laws, especially the Euler system, determine how these criteria affect multiphase-flow models, random systems, and structure-preserving numerical schemes, and assess whether such laws can predict pandemic evolution.
