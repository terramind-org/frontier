  \section{Strong Locality and Reconstruction of Vertex Operator Algebras}\label{30002836}
  {\small UnsolvedMath ID 30002836 · Algebra}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Is every unitary vertex operator algebra strongly local? Does every irreducible conformal net arise from a unitary vertex operator algebra through the conformal-net construction?
  \par\smallskip\textit{Formulation references:} \sref{30002836}{1}, \sref{30002836}{2}.
