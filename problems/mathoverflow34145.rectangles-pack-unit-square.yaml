lean:
  module: FormalConjectures.Mathoverflow.«34145»
  decl: Mathoverflow34145.rectangles_pack_unit_square
  statement: |-
    theorem rectangles_pack_unit_square :
        ∃ c : Configuration, (∀ n, (c.rect n).toSet ⊆ unitSquare) ∧ c.IsPacking
  context:
    - open Mathoverflow34145
    - open Real MeasureTheory Measure Module
  definitions:
    - name: Mathoverflow34145.unitSquare
      kind: def
      text: |-
        /-- The unit square. -/
        def unitSquare : Set (ℝ × ℝ) :=
          { p | 0 ≤ p.1 ∧ p.1 ≤ 1 ∧ 0 ≤ p.2 ∧ p.2 ≤ 1 }
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Mathoverflow/34145.lean#L65
    - name: Mathoverflow34145.Configuration
      kind: structure
      text: |-
        /-- A configuration of rectangles of sides `1 / (n + 1)` and `1 / (n + 2)`. -/
        structure Configuration : Type where
          rect (n : ℕ) : Rectangle
          rect_width (n : ℕ) : (rect n).width = 1 / (n + 1)
          rect_height (n : ℕ) : (rect n).height = 1 / (n + 2)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Mathoverflow/34145.lean#L134
    - name: Mathoverflow34145.Configuration.IsPacking
      kind: def
      text: |-
        /-- A "packing" means that the interiors of any two rectangles are disjoint. -/
        def Configuration.IsPacking (c : Configuration) : Prop :=
          Pairwise fun m n ↦ interior (c.rect m).toSet ∩ interior (c.rect n).toSet = ∅
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Mathoverflow/34145.lean#L140
