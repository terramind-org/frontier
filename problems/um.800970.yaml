title: Open Problems and Questions about Geodesics — Conjecture 51
field: mathematics
tier: prose
statement: |-
  In the Lorenzian setting, one can ask to construct all manifolds such that all light-like geodesics are closed, see e.g.\ [Mou-Suh2013, Suhr2013b].

  An easier version of the question above is the following conjecture sometimes attributed to Berger:

  *Let $(M,g)$ be a closed simply connected manifold such that all geodesics are closed. Then all geodesics have the same length.*
