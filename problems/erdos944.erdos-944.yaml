lean:
  module: FormalConjectures.ErdosProblems.«944»
  decl: Erdos944.erdos_944
  statement: |-
    theorem erdos_944 :
        ∀ k ≥ 4, ∀ r ≥ 1, ∃ (V : Type u) (G : SimpleGraph V), G.IsErdos944 k r
  context:
    - open Erdos944
    - "variable {V : Type u}"
  definitions:
    - name: Erdos944.SimpleGraph.IsErdos944
      kind: def
      text: |-
        /--
        The predicate that graph $G$ with chromatic number $k$ is such that every vertex is critical, yet
        every critical set of edges has size $>r$
        -/
        def SimpleGraph.IsErdos944 (G : SimpleGraph V) (k r : ℕ) : Prop :=  G.IsCritical k ∧
            (∀ (edges : Set (Sym2 V)), G.IsCriticalEdges edges → r < edges.ncard)
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/944.lean#L35
