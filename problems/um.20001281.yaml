title: "Dual random inner products: status split and Hanner closure"
field: mathematics
tier: prose
statement: |-
  Let \(K\) be a symmetric convex body in \(\mathbb R^n\), and let random
  vectors \(X\) and \(Y\) be distributed in \(K\) and \(K^*\), respectively.
  Is the variance of \(\langle X,Y\rangle\) largest for ellipsoids?  A weaker
  conjecture asks whether
  \(\int_{K\times K^*}|\langle x,y\rangle|^2\,dx\,dy\) is largest for
  ellipsoids.  Paouris asks the corresponding questions with exponent
  \(p>0\).  Given \(0<c<1\), one may also ask about either the probability
  that \(\langle X,Y\rangle=c\), or the volume of the region where this is
  so.
