title: Abstract Pierce–Birkhoff Conjecture
field: mathematics
tier: prose
statement: Let $A$ be a polynomial ring over a real closed field, let $f$ be piecewise polynomial, and let $\alpha,\beta\in\operatorname{Sper}A$. If $f_\alpha,f_\beta\in A$ are local representatives of $f$ at $\alpha$ and $\beta$, must $f_\alpha-f_\beta$ belong to the separating ideal $\langle\alpha,\beta\rangle$?
