title: Universal Holomorphic Functions under Composition Operators
field: mathematics
tier: prose
statement: Let $\Omega\subseteq\mathbb{C}$ be a domain, let $X$ be either $H(\Omega)$, the Fréchet space of holomorphic functions, or its unit ball, and let $(\varphi_n)$ be a sequence of holomorphic self-maps of $\Omega$. Call $f$ $X$-universal if $\{f\circ\varphi_n:n\geq1\}$ is locally uniformly dense in $X$. Give necessary and sufficient conditions on $(\varphi_n)$ for $X$-universal functions to exist on an arbitrary domain. In particular, does an annulus admit $X$-universal functions?
