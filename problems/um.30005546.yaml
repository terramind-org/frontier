title: Analytic Self-Maps and Automorphism Groups of Cantor Sets
field: mathematics
tier: prose
statement: For a Cantor set $X\subset\mathbb R$, characterize its real-analytic self-maps and the groups arising as subgroups of $\operatorname{Aut}_\omega(X)$. When is $\operatorname{Aut}_\omega(X)$ finitely generated? If $X\subset\mathbb R^d$ and every real-analytic submanifold $M$ has $M\cap X$ with empty interior in $X$, is the set of real-analytic maps $X\to X$ at most countable?
