title: Twenty-Vertex Models and Pachter-Triangle Tilings
field: mathematics
tier: prose
statement: Is the number of configurations of the twenty-vertex model with DWBC3 on an $n\times n$ grid equal to the number of domino tilings of Pachter's triangle of size $2n$, and does the analogous equality hold for the extended $(n+k)\times n$ model and enhanced triangle for every $k\geq 0$?
