title: Repairing the Hausdorff spread bound and a PFA sign error
field: mathematics
tier: prose
statement: |-
  The answer is negative under $\Diamond$, even for compact Hausdorff
  spaces. PFA implies that the answer is negative for $X$ with
  $s(X)=\aleph_0$. PFA also implies that $|X|\leq2^{\aleph_0}$ for every
  Hausdorff space with no uncountable discrete subspaces.

  For which infinite Hausdorff spaces $X$ can the classical bound
  $|X|\leq 2^{2^{s(X)}}$ be improved to $|X|\leq 2^{s(X)}$?  In
  particular, is it consistent that this improvement holds for every
  Hausdorff (or every regular) space?
