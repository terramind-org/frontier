  \section{Toms–Winter Regularity Conjecture}\label{30003585}
  {\small UnsolvedMath ID 30003585 · Algebra}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For every nonelementary simple separable unital nuclear $C^*$-algebra $A$, are finite nuclear dimension, tensorial absorption of the Jiang–Su algebra $\mathcal Z$, and strict comparison of positive elements equivalent? When $A$ is stably finite, is finite decomposition rank equivalent to these conditions as well?
  \par\smallskip\textit{Formulation references:} \sref{30003585}{1}, \sref{30003585}{2}.
  \subsection{Short English statement}
  For every nonelementary simple separable unital nuclear $C^*$-algebra $A$, are finite nuclear dimension, tensorial absorption of the Jiang–Su algebra $\mathcal Z$, and strict comparison of positive elements equivalent? When $A$ is stably finite, is finite decomposition rank equivalent to these conditions as well?
