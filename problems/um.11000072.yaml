title: Question 6.3 — (orderability).
field: mathematics
tier: prose
statement: (orderability). Does Modg,g ≥ 2 have some finite index subgroup which acts faithfully by homeomorphisms on S1? Does either Modg or Modg,1 have a finite index subgroup which acts faithfully by homeomorphisms on R? Note that Thurston proved that braid groups are orderable. Since Ig andIg,1 are residually torsion-free nilpotent, they are isomorphic to a subgroup of Homeo +(R); in fact one can show 8One can see this by averaging any Riemannian metric on S1 by the group action. 48 B. Farb that (20) splits when restricted to Ig,1. On the other hand, Witte [ Wi] proved that no finite index subgroup of Sp(2 g, Z) acts faithfully by homoeomorphisms on S1 or on R. Non-residual finiteness of the universal central extension. The Lie group Sp(2 g, R) has infinite cyclic fundamental group. Its universal cover ˜Sp(2g, R) gives a central extension 1→ Z→ ˜Sp(2g, R)→ Sp(2g, R)→ 1 which restricts to a central extension 1→ Z→ ˜Sp(2g, Z)→ Sp(2g, Z)→ 1 (21) The cocycle ζ∈H 2(Sp(2g, Z), Z) defining the extension (21) is nontrivial and bounded; this comes from the fact that it is proportional to the Kahler class on the corresponding locally symmetric quotient (which is a K(π, 1) space). Deligne proved in [ De] that ˜Sp(2g, Z) is not residually finite. Since there is an obvious surjection of exact sequences from (19) to (21), and since both central extensions give a bounded cocycle, one begins to wonder about the following.
