title: Hasse-Graph Descriptions of Valuation Semigroups
field: mathematics
tier: prose
statement: |-
  Is the weighted-Hasse-graph description of the valuation semigroup $\Gamma_C$ valid whenever, for every cover relation $p\gtrdot q$ of weight $b$, there is an $\eta\in K(\widehat Y_p)$ satisfying
  $$
  \eta^b=\frac{f_p}{f_q}
  $$
  in $K(\widehat Y_p)$?
