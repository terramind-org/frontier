id: um.5000005
title: Types of parallel short trajectories
field: mathematics
tier: prose
statement: Unfold a billiard trajectory in a regular $n$-gon by reflecting the polygon across each encountered side. A short trajectory joins two vertices and meets no vertex in between; a reachable point is an endpoint vertex occurring in such an unfolding. For an oriented short trajectory, let $\alpha$ and $\beta$ be its source and target endpoint angles as in Definition 2.1 of the source, and write $A_k$ for the resulting one of $n-2$ trajectory types (indices modulo $n-2$); in particular $A_0$ is characterized by $\beta-\alpha=2\pi/n$. If a short trajectory emanating from $O$ with slope angle $\alpha$ has type $A_k$, prove that the parallel short trajectory from $O$ with slope angle $\ell\pi/n+\varepsilon\alpha$, where $\varepsilon\in\{-1,1\}$, has type $A_{\varepsilon k-\ell}$. When $n$ is even, restrict $\ell$ to even integers.
