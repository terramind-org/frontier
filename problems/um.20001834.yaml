id: um.20001834
title: A surface classification and a noncollapse criterion for almost nonnegative curvature operator
field: mathematics
tier: prose
statement: |-
  What are closed manifolds with almost nonnegative curvature operator?
  \[
  \mbox{Rm} \cdot \mbox{diam}^2 \geq -\epsilon.
  \]

  A closed smooth manifold $M$ admits **almost nonnegative curvature operator** (ANCO) if, for every $\epsilon>0$, there is a Riemannian metric $g_\epsilon$ on $M$ such that every eigenvalue of
  \[
  \operatorname{Rm}_{g_\epsilon}:\Lambda^2TM\longrightarrow\Lambda^2TM
  \]
  satisfies
  \[
  \lambda(\operatorname{Rm}_{g_\epsilon})
  \operatorname{diam}(M,g_\epsilon)^2>-\epsilon.
  \tag{1.1}
  \]
