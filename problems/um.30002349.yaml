title: Characteristic-Zero Lifts of Local Galois Extensions
field: mathematics
tier: prose
statement: Let $k$ be an algebraically closed field of characteristic $p$, let $L/k((t))$ be a Galois extension with group $G$, and let $A$ be the integral closure of $k[[t]]$ in $L$. Does there exist a complete discrete valuation ring $R$ of characteristic zero with residue field $k$ and a $G$-Galois lift whose reduction is $k[[t]]$-isomorphic to $A$?
