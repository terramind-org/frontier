title: Applications 1 — Introduce stable homotopy theory into the world of C^*-algebras, like Voevodsky has done in algebraic…
field: mathematics
tier: prose
statement: Introduce stable homotopy theory into the world of C^*-algebras, like Voevodsky has done in algebraic geometry. More specifically, find a model structure on some category of C^*-algebras that is useful. Then stabilize it somehow to find a stable homotopy category of C^*-algebras where Kasparov's KK theory is just Hom in the category. This will probably be the same as finding a category where K-theory of C^*-algebras is representable. I have thought about this a little--almost the first thing you realize is that C^*-algebras are not closed under inverse limits, so you need pro-C^*-algebras. These have been considered by Chris Phillips in N. C. Phillips, Inverse limits of $C\sp *$-algebras, J. Operator Theory {\bf 19} (1988), no.~1, 159--195; MR 90c:46090. Another thing you realize is that it is easier to map into C^*-algebras than it is to map out of them, and so it seems likely that any model category will be fibrantly generated instead of cofibrantly generated. But not much else is clear to me. One of the people who knows the most about the combination of C^*-algebras and homotopy theory is Claude Schochet. The viewpoint I am advocating here is shared by Jim McClure, and probably Marius Dadarlat, and they may know more about this. In particular, C^*-algebraists often make an assumption about their cohomology theories which basically forces them to be K-theory--I think it is Bott periodicity. To do what I am saying, you would have to drop this assumption.
