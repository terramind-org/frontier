title: Kourovka Notebook Problem 17.112
field: mathematics
tier: prose
statement: |-
  A subgroup $A$ of a group $G$ is said to be
  *$G$-permutable in $G$* if for every subgroup $B$ of $G$
  there exists an element $x\in G $ such that $AB^x=B^xA$. A
  subgroup $A$ is said to be *hereditarily $G$-permutable in
  $G$* if $A$ is $E$-permutable in every subgroup $E$ of $G$
  containing $A$. Which finite non-abelian simple groups $G$
  possess

  a) a non-trivial $G$-permutable subgroup?

  b) a non-trivial hereditarily
  $G$-permutable subgroup?

  *Comments of 2025*:
  Among sporadic groups, only $J_1$ has a proper $G$-permutable subgroup (A. A. Galt, V. N. Tyutyanov, *Siberian Math. J.*, **63**, no. 4 (2022), 691--698). Sporadic, alternating, and exceptional groups of Lie type have no proper hereditarily $G$-permutable subgroups (A. A. Galt, V. N. Tyutyanov, *Siberian Math. J.*, **63**, no. 4 (2022), 691--698; \ A. F. Vasilyev, V. N. Tyutyanov, *Izv. Gomel. Gos. Univ. F. Skoriny*, **2012**, no. 5(74) (2012), 148--150 (Russian)); \ A. A. Galt, V. N. Tyutyanov, *Siberian Math. J.*, **64**, no. 5 (2023), 1110--1116).
