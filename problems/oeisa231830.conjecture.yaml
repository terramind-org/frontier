lean:
  module: FormalConjectures.OEIS.«231830»
  decl: OeisA231830.conjecture
  statement: "theorem conjecture : ∀ n : ℕ, Squarefree (a n)"
  context:
    - open OeisA231830
  definitions:
    - name: OeisA231830.a
      kind: def
      text: |-
        /-- The sequence defined by $a(0) = 1$, $a(1) = 5$, and for $n > 1$,
        $a(n) = (a(n-1) - 1) \cdot a(n-1)^2 + 1$. -/
        def a : ℕ → ℕ
          | 0 => 1
          | 1 => 5
          | n + 2 => (a (n + 1) - 1) * (a (n + 1)) ^ 2 + 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/231830.lean#L34
