title: Inf–Sup Stability for Nonconforming Multiple Traces
field: mathematics
tier: prose
statement: For the spectral nonconforming Petrov–Galerkin multiple-traces discretization, prove an inf–sup condition for the variational problem of finding $\lambda\in X_L:=X_L^0\times\cdots\times X_L^M$ such that $\langle F(s)\lambda,\phi\rangle_\times=\langle g,\phi\rangle_\times$ for every $\phi\in Y_L:=Y_L^0\times\cdots\times Y_L^M$. Such a condition would establish existence and uniqueness of the discrete solution.
