title: Weak boundary rigidity and strict escape for extremal ellipsoid tori
field: mathematics
tier: prose
statement: |-
  **Question 1.19.** (a) Let \(M\) be the unit ball in \(\mathbb R^4\) and let
  \[
  L=\{p_1^2+q_1^2=p_2^2+q_2^2=1/2\}\subset\mathbb R^4
  \]
  be the Clifford torus. Is \(L\) weakly boundary rigid? That is, if \(K\) is Hamiltonian isotopic to \(L\) in \(M\), then must \(K\subset\partial M\)? (There are several proofs that one cannot have \(K\subset M\setminus\partial M\).) [See Eliashberg's discussion at the end of the day.]

  (b) Similarly investigate Lagrangian tori in other ellipsoids in \(\mathbb R^{2n}\), and explore nonremovable intersections in this setting.
