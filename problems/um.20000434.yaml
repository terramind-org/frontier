title: A Brauer-free finite local sieve for Fano complete intersections
field: mathematics
tier: prose
statement: |-
  **Recovered Question 2.** If \(X\) is a smooth projective geometrically rationally connected variety over a number field \(k\), is
  \[
  \overline{X(k)}=X(\mathbf A_k)^{\operatorname{Br}X}?
  \]
  Here the closure is taken in the adelic topology.
