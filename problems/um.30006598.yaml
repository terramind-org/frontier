title: Socles of Products from Lusztig Components
field: mathematics
tier: prose
statement: Let $C$ and $D$ be irreducible components of Lusztig nilpotent varieties of Dynkin type $A$, with associated simple modules $\pi(C)$ and $\pi(D)$. If $C$ is rigid, prove that $\operatorname{soc}(\pi(C)\times\pi(D))=\pi(C*D)$.
