title: Moments of Quadratic Dirichlet L-Functions over Function Fields
field: mathematics
tier: prose
statement: |-
  Fix $q\equiv1\pmod 4$, and let $\mathcal H_{2g+1}$ be the set of monic square-free polynomials of degree $2g+1$ over $\mathbb F_q$. For fixed $k$, does

  $$\sum_{D\in\mathcal H_{2g+1}}L(1/2,\chi_D)^k=q^{2g+1}P_k(2g+1)+o(q^{2g+1})$$

  hold as $g\to\infty$, where $P_k$ has degree $k(k+1)/2$?
