title: Kadison–Singer Methods for Ihara Zeta Functions
field: mathematics
tier: prose
statement: For a connected $k$-regular graph $G$ with adjacency matrix $A$, the Ihara zeta function satisfies $\zeta(u,G)^{-1}=(1-u^2)^{|E|-|V|}\det(I-Au+(k-1)u^2I)$. Can Kadison–Singer and interlacing-polynomial methods yield new information about this zeta function?
