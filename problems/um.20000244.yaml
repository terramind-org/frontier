title: Mohan Kumar dimensions and an odd-rank prime-divisor propagation theorem
field: mathematics
tier: prose
statement: |-
  **Question 7. Question (Aravind Asok).** Fix an integer \(d\). For certain
  \(d\), Mohan Kumar constructs projective modules of rank \(d-2\) which are
  stably free but not free over a smooth affine variety \(X\) of dimension \(d\)
  over an algebraically closed field. Is this known for all \(d\)? Is there a
  pattern?
