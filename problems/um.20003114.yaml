title: The one-sided length-spectrum obstruction and a regularized asymmetric metric
field: mathematics
tier: prose
statement: |-
  **Recovered Problem 4.2.** Can one define the Thurston metric on the
  quasiconformal Teichmüller space \(\mathcal T_{qc}(\Gamma _0)\)?

  The PDF context is essential. Section 4 begins by declaring that
  \(\Gamma _0\) is an infinitely generated Fuchsian group of the first kind. Immediately preceding Problem 4.2, Problem 4.1 asks whether \(\Gamma _0\) can
  be quasiconformally deformed so that the lengths of all simple closed curves
  do not increase.

  Here \(X_0=\mathbb H^2/\Gamma _0\) is a complete borderless hyperbolic surface
  of infinite topological type, and \(\mathcal T_{qc}(\Gamma _0)\) consists of
  marked hyperbolic structures quasiconformally equivalent to \(X_0\). “Of the
  first kind” means that the limit set is the full ideal circle; it does not mean
  that \(X_0\) is compact. The workshop report separately mentions the
  *symmetrized* Thurston/length-spectrum metric, so the substantive question is
  the one-sided analogue, not merely the already-established symmetric metric.
