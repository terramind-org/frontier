title: Modularity of Elliptic Curves over Totally Real Fields
field: mathematics
tier: prose
statement: |-
  \section*{\texorpdfstring{Modularity of Elliptic Curves over Totally Real Fields}{Modularity of Elliptic Curves over Totally Real Fields}}\label{30006706}
  \subsection{Definitions and mathematical statement}
  A number field is totally real if every embedding into ${\mathbb{C}}$ has image in ${\mathbb{R}}$. A Hilbert cuspidal newform of parallel weight two is a cuspidal Hecke eigenform whose weight is two at every real embedding, normalized and new at its level. The conjecture asks, for every elliptic curve $E/K$, for such an $f$ with
  \[
   L(E,s)=L(f,s).
  \]
  The equality uses compatible local-factor normalizations at good and bad places, not just equality of a few computed coefficients. The field $K$ and the curve are arbitrary within the totally real scope.
  \par\smallskip\textit{Formulation and concept references:} \href{https://arxiv.org/pdf/1607.05549}{[S1]}.

  \subsection{Short English statement}
  Does every elliptic curve over a totally real number field have a matching weight-two Hilbert modular form?
  \subsection{Sources}
  \begin{itemize}
  \item[S1]Sho Yoshikawa, "On the modularity of elliptic curves over a composite field of some real quadratic fields," Research in Number Theory 2 (2016), article 31.
  \url{https://arxiv.org/pdf/1607.05549}.
  \textit{Formulation source.}
  \item[S2]Modularity of elliptic curves over cyclotomic Z\_p-extensions of real quadratic fields.
  \url{https://arxiv.org/html/2206.12860v1}.
  \textit{Further reference; not a proof endorsement.}
  \item[S3]Reliability of elliptic curve data over number fields (reviewed).
  \url{https://www.lmfdb.org/knowledge/show/dq.ecnf.reliability}.
  \textit{Further reference; not a proof endorsement.}
  \end{itemize}
