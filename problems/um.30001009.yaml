title: Bost Assembly Conjecture with $C^*$-Algebra Coefficients
field: mathematics
tier: prose
statement: Let $G$ be a locally compact second-countable Hausdorff group and $A$ a $G$-$C^*$-algebra. Is the Bost assembly map $$\mu^{G,A}_{L^1}:K_*^{G,\mathrm{top}}(EG;A)\longrightarrow K_*(L^1(G,A))$$ an isomorphism for every coefficient algebra $A$?
