title: Free Finite-Group Actions on Products of Spheres
field: mathematics
tier: prose
statement: Prove that a finite group $G$ acts freely on a finite CW complex homotopy equivalent to a product of $r$ spheres if and only if $G$ has no elementary abelian subgroup of rank $r+1$. In particular, determine whether $Qd(p)$ acts freely on a finite complex homotopy equivalent to $S^n\times S^m$ for odd $p$.
