title: Odd-prime solution and completion-transfer reduction
field: mathematics
tier: prose
statement: |-
  Fix a prime \(p\). Let
  \[
  j_p=\tau_{\geq 0}L_{K(1)}\mathbb S.
  \]
  Is there an equivalence
  \[
  \operatorname{TP}(\mathbb Z_p)\simeq
  (j_p^{\mathrm{triv}})^{tS^1},
  \]
  where the circle acts trivially on \(j_p\)?

  The record adds that this would follow, for example, from
  \(\operatorname{TR}(\mathbb Z_p)\simeq j_p\). There is no visible corruption in the
  record. The citation `MR1317575` is Hesselholt--Madsen, *The \(S^1\)-Tate
  spectrum for \(J\)*.

  There is one convention that must be made explicit. In this fixed-prime context,
  the natural modern reading is continuous (or \(p\)-complete) periodic topological
  cyclic homology
  \[
   \operatorname{TP}(R;\mathbb Z_p)
   :=\bigl(\operatorname{THH}(R)^{tS^1}\bigr)^\wedge_p. \]
  The right side is built from the \(p\)-complete image-of-\(J\) spectrum. The
  theorem below proves the conjecture under this reading. If the displayed source
  statement is read as an assertion about *uncompleted* \(\operatorname{TP}(H\mathbb
  Z_p)\), only its \(p\)-completion is addressed by the available theorem.
