title: Problem 5 — For a given surface F, calculate Σ( F ).
field: mathematics
tier: prose
statement: For a given surface F, calculate Σ( F ). More modestly, calculate the least element of Σ( F ) or the least gap among elements of Σ( F ). Characterize the number fields arising as dilatations of pA maps on F. 7. Probing mapping class groups using arcs 111 Problems 4 and 5 are clearly related. For instance, the recipe in Theorem 4 allows one to give estimates on least elements in Problem 5, cf. [26,2]. McMullen [50] has also given estimates and examples.
