lean:
  module: FormalConjectures.GreensOpenProblems.«58»
  decl: Green58.green_58
  statement: |-
    theorem green_58 :
        ∀ᶠ (N : ℕ) in Filter.atTop, ∀ᵉ (A ⊆ Finset.Icc 1 N) (B ⊆ Finset.Icc 1 N),
          (N : ℝ) ^ (0.49 : ℝ) ≤ (A.card : ℝ) →
          (N : ℝ) ^ (0.49 : ℝ) ≤ (B.card : ℝ) →
          ∃ m ∈ (A + B), m.Composite
  context:
    - open Green58
    - open scoped Pointwise
