id: um.30004048
title: Symmetry of Bidirectional Two-Step Path Density
field: mathematics
tier: prose
statement: Let $A,B,C$ be disjoint nonempty vertex sets in a graph. Suppose every vertex of $A$ has at least $x\lvert B\rvert$ neighbors in $B$, every vertex of $B$ has at least $x\lvert A\rvert$ neighbors in $A$ and at least $y\lvert C\rvert$ neighbors in $C$, and every vertex of $C$ has at least $y\lvert B\rvert$ neighbors in $B$. Let $\psi(x,y)$ be the largest $z$ such that some vertex of $C$ is joined by two-edge paths to at least $z\lvert A\rvert$ vertices of $A$. Is $\psi(x,y)=\psi(y,x)$ for all $x,y$?
