title: Canonical Bicombings and Group Actions on Injective Spaces
field: mathematics
tier: prose
statement: For an injective metric space $X$, consider its canonical embedding $X=E(X)\to\Delta(X)$ and retraction $\Delta(X)\to E(X)$. Is the induced bicombing convex or consistent? Can a compact metric space admit distinct consistent bicombings? Must a group acting geometrically on an injective space be Helly, CAT(0), or biautomatic?
