statement: If $S$ contains no primes above $p$, does every continuous homomorphism $G_{K,S}\to GL_n(\mathbb Z_p)$, with $n\geq1$, have finite image? Equivalently, does $G_{K,S}$ have no infinite $p$-adic analytic quotient?
