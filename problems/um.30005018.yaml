title: Mean-Value Coordinate Equations and Wachspress-Surface Moduli
field: mathematics
tier: prose
statement: For an $n$-gon, determine the homogeneous equations of the Zariski closure of the image of the mean-value barycentric-coordinate map to $\mathbb P^{n-1}$. For Wachspress surfaces arising from $n$-gons, describe flat limits under polygon degeneration and construct a natural compactified moduli space.
