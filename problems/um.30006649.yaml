title: Abstract Cohomology of Pro-$p$ Groups in Cross Characteristic
field: mathematics
tier: prose
statement: Let $G$ be a pro-$p$ group and let $q\neq p$ be a prime. Must the abstract-group cohomology $H^n_{\mathrm{abs}}(G;\mathbb F_q)$ vanish for every $n>0$, as continuous cohomology does?
