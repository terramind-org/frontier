title: The Lyapin's Notebook — Problem 42
field: mathematics
tier: prose
statement: |-
  We call two semigroups inclusively equivalent if they satisfy the same identical inclusions; equivalently if they generate the same inclusive variety.

  (G. Mashevitzky)
  Classify semigroups from the basic classes of semigroups up to inclusive equivalence.
