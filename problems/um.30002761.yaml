id: um.30002761
title: Coarse Baum–Connes Failure without Embedded Expanders
field: mathematics
tier: prose
statement: Let a finitely generated group $G$ act ergodically by measure-preserving Lipschitz homeomorphisms on a compact metric probability space $M$, and suppose the action has a spectral gap. Must the warped cone $\mathcal O_G(M)$ fail the coarse Baum–Connes conjecture? Does there exist such an action for which $\mathcal O_G(M)$ contains no coarsely embedded sequence of expanders?
