title: Trivial Restrictions of Twists in Nilpotent Group Algebras
field: mathematics
tier: prose
statement: Let $G$ be a torsion-free nilpotent group of finite cohomological dimension $n$, let $\alpha\in H^2(G,\mathbb{C}^\times)$, and suppose $1\leq r\leq n$ with $\operatorname{gl.dim}(\mathbb{C}^\alpha G)=r$. Must there exist a subgroup $H\leq G$ such that $\alpha$ restricts trivially to $H$ and $\operatorname{gl.dim}(\mathbb{C}H)=r$?
