title: Research Problems in Function Theory — Problem 6.60
field: mathematics
tier: prose
statement: Let $C$ be a closed Jordan curve. Then if $f(z) = z + a_2z^2 +\ldots$, $g(z) =z^{-1}+b_0 +b_1z + \ldots$ map $\mathbb{D}$ onto the inside and outside of $C$ respectively, the area principle shows that $C$ is the unit circumference $\mathbb{T}$. If we remove the normalisation on $g$ and replace $g$ by $g_1(z) = b_{-1}z^{-1} + b_0 + b_1z + \ldots$, what can be said about the connection between $f$ and $g_1$? For example, what about the asymptotic behaviour of their coefficients, or their Lipschitz behaviour on $\mathbb{T}$, or about prime ends (if we make $C$ slightly non-Jordan)? (D. A. Brannan)
