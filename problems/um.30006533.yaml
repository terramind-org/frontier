title: Optimization over Nonzero Littlewood–Richardson Coefficients
field: mathematics
tier: prose
statement: For a partition $\lambda$ of $n$ with length $d$, define $\eta(\lambda)=n^2+\frac{d(d-1)(2d-1)}6-\sum_{i=1}^d(\lambda_i-(i-1))^2$ and $\Delta(\lambda,\mu,\nu)=\eta(\lambda)-\eta(\mu)-\eta(\nu)$. Given $n,k,d$ with $k\leq n/2$, maximize $\Delta(\lambda,\mu,\nu)$ over triples with $|\lambda|=n$, $|\mu|=k$, $|\nu|=n-k$, and $c^\lambda_{\mu,\nu}\neq0$.
