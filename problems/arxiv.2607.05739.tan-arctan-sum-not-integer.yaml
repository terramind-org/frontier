id: arxiv.2607.05739.tan-arctan-sum-not-integer
title: Integer values of $\tan(\arctan 1 + \arctan 2 + \cdots + \arctan n)$
field: mathematics
tier: proof
statement: |-
  **Conjecture (Amdeberhan-Medina-Moll, 2008).** For every integer $n \geq 5$, the value
  $$x_n = \tan(\arctan 1 + \arctan 2 + \cdots + \arctan n)$$
  is not an integer.
