title: Mixed-cell multiplicity and the real parity obstruction
field: mathematics
tier: prose
statement: |-
  For a connected compact component \(K\) of an intersection of amoebas,
  does the associated mixed Monge--Ampère mass equal the volume of the
  mixed cell corresponding to \(K\)?  Are the roots in
  \(\operatorname{Log}^{-1}(K)\) in one-to-one correspondence with the
  roots of the binomial system attached to that cell, in a way preserving
  real roots?

  This is Question A.2 from the AIM workshop list *Amoebas and tropical
  geometry* (January 2004), contributed by F. Bihan.

  In particular,
  `Monge-Amp\` ere`, `Rullg˚ ard`, and `Log −1(K)` mean
  Monge--Ampère, Rullgård, and \(\operatorname{Log}^{-1}(K)\), respectively. With those repairs, the question is:

  Here
  \[
   \operatorname{Log}(z_1,\ldots,z_n)
     =(\log|z_1|,\ldots,\log|z_n|). \]

  There is an important correction to the background premise. Passare and
  Rullgård do not identify the local mixed Monge--Ampère mass with the root
  count of the one fixed, unrotated system. Their Theorem 5 identifies it
  with an **average** of root counts for independently phase-rotated
  systems. This distinction is central to both questions.
