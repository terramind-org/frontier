statement: |-
  Let $\Omega$ be a countably infinite set. Define
  a *moiety* of $\Omega$ to be a subset $\Sigma$ such that
  both $\Sigma$ and $\Omega \setminus \Sigma$ are infinite. Which
  permutation groups on $ \Omega$ are transitive on moieties?
