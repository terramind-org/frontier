title: "Henon Maps: Open Problems — Question 16"
field: mathematics
tier: prose
statement: |-
  We say that $H_2$ has a Herman ring with rotation number $\theta\in (\mathbb{R}\smallsetminus \mathbb{Q})/\mathbb{Z}$ if there exists an annulus $V= \bigl\{z\in \mathbb{C}/\mathbb{Z} : \mathrm{Im}(z)<h\bigr\}$ with $h>0$, a holomorphic map $\phi\colon V\to \mathbb{C}^2$, and an integer $n\geq 2$ such that
  \[\forall z\in V,\quad H_2^{\circ n}\circ \phi(z) = \phi(z+\theta).\]

  Does $H_2$ have a Herman ring?
