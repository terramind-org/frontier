title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 9: Combinatorial interpretation of plethysm coefficients"
field: mathematics
tier: prose
statement: Let $s_\lambda$ denote the Schur function indexed by a partition $\lambda$, and let $s_m[s_n]$ (or more generally $s_\lambda[s_\mu]$) denote the plethysm of Schur functions. Find a positive combinatorial interpretation of the plethysm coefficients $\langle s_m[s_n], s_\lambda\rangle$, thereby combinatorially reproving that they are nonnegative.
