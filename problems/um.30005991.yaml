title: Regularity of Boundary Free Interfaces
field: mathematics
tier: prose
statement: For the boundary free interface $\mathcal F_{\partial D}$ of a spectral optimal partition, let $\operatorname{Reg}$ be the set of points whose limiting frequency is an integer. Is $\operatorname{Reg}$ a $C^1$ submanifold of codimension one in $\partial D$? Does $\mathcal F_{\partial D}\setminus\operatorname{Reg}$ have codimension two in $\partial D$?
