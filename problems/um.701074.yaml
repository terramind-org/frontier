title: Kourovka Notebook Problem 14.90
field: mathematics
tier: prose
statement: |-
  Let $P$ be a finite $p $-group of
  abundance $a$ and nilpotency class $c$. Does there exist an
  integer $t=t(a)$ such that $\gamma_i(G)=\zeta _{c-i+1}(G)$ for
  $i\geq t$? This holds for $a=0$ with $t=1$, since $P$ has maximal
  class; it can be proved that for $a=1$ one can take $t=3$.
