id: um.20002450
title: Evans functions at an algebraic threshold
field: mathematics
tier: prose
statement: |-
  Open Problem: Can one construct an Evans function for this problem? If so,
  how does it behave? Note that for this problem the absolute spectrum touches
  the essential spectrum so there is no exponential dichotomy that we can
  exploit.

  M. Wechselberger: (Loss of hyperbolicity, algebraic decay and the Evans
  function). For certain values of \(p\), the generalized KdV equation
  \(u_t-u_{xxx}+u_x^p=0\) admits standing waves \(\phi(x)\) which decay
  exponentially to zero as \(|x|\to\infty\). However, the eigenfunctions of the
  operator obtained by linearizing about \(\phi\) need not decay exponentially
  and depending on the power \(p\) (say \(p=5\)) may only decay algebraically.
