title: Downward effective categoricity in a finite-fibre quasiminimal class
field: mathematics
tier: prose
statement: |-
  Question 9. Let K be a quasiminimal excellent class, and \(\lambda<\kappa\). Suppose that K is \(\kappa^+\)-computably categorical. Must K be \(\lambda^+\)-computably categorical?

  Let \(\kappa\) be a cardinal. Then a set is \(\kappa^+\)-recursively enumerable when it is \(\Sigma_1\) on \(L_{\kappa^+}\).
