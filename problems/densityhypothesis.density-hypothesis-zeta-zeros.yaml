schema: 1
id: densityhypothesis.density-hypothesis-zeta-zeros
title: Density hypothesis for Riemann zeta zeros
field: mathematics
tier: proof
statement: |-
  Density Hypothesis: for every $\varepsilon > 0$, there exists $C > 0$ such that
  $N(\sigma, T) \le C \, T^{2(1 - \sigma) + \varepsilon}$ for all $\frac{1}{2} \le \sigma \le 1$
  and $T \ge 2$.
