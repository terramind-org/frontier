lean:
  module: FormalConjectures.Wikipedia.DensityHypothesis
  decl: DensityHypothesis.density_hypothesis_zeta_zeros
  statement: |-
    theorem density_hypothesis_zeta_zeros (ε : ℝ) (hε : 0 < ε) :
        ∃ C : ℝ, 0 < C ∧ ∀ σ T : ℝ, 1 / 2 ≤ σ → σ ≤ 1 → 2 ≤ T →
          (zetaZeroCount σ T : ℝ) ≤ C * T ^ (2 * (1 - σ) + ε)
  context:
    - open DensityHypothesis
  definitions:
    - name: DensityHypothesis.zetaZeroCount
      kind: abbrev
      text: |-
        /-- Multiplicity-weighted count $N(\sigma, T)$ of zeros of $\zeta(s)$ inside
        $\{s \in \mathbb{C} \mid \sigma \le \operatorname{Re}(s) \le 1 \text{ and } 0 <
        \operatorname{Im}(s) \le T\}$ (half the symmetric count $|\operatorname{Im}(s)| \le T$). -/
        noncomputable abbrev zetaZeroCount (σ T : ℝ) : ℕ :=
          Complex.zeroCountOn riemannZeta
            {s : ℂ | σ ≤ s.re ∧ s.re ≤ 1 ∧ 0 < s.im ∧ s.im ≤ T}
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/DensityHypothesis.lean#L51
