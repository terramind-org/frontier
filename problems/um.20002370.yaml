id: um.20002370
title: Exact alternation depth and variable bounds for two real rational-function fields
field: mathematics
tier: prose
statement: |-
  **Question 34 (Zahidi).** Let
  \[
    \mathbb R^{\mathrm{alg}}:=\overline{\mathbb Q}\cap\mathbb R.
  \]
  It is known that \(\mathbb R^{\mathrm{alg}}\equiv\mathbb R\) (elementary
  equivalence), but that
  \(\mathbb R^{\mathrm{alg}}(t)\not\equiv\mathbb R(t)\).  On the other hand,
  the existential theories of \(\mathbb R^{\mathrm{alg}}(t)\) and
  \(\mathbb R(t)\) are the same.  What is the minimal quantifier complexity
  for which they have different theories?  What is the minimal number of
  variables one needs?
