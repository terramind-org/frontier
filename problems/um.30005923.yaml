title: Uniform Determinant Integrals for Row Contractions
field: mathematics
tier: prose
statement: For every $0\leq r<1$ and integer $k\geq 1$, prove that there is $C(r,k)$ such that, for every $d$-tuple $A=(A_1,\ldots,A_d)$ of $k\times k$ matrices with $\|A\|_{\mathrm{row}}\leq r$, one has $\sup_N\int_{U(N)^d}|\det(I-A\otimes U)|^2\,dU\leq C(r,k)$.
