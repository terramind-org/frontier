title: Toric Hypersurface Implicitization from Syzygies
field: mathematics
tier: prose
statement: Let $X$ be a toric variety, $D$ a divisor, and $U\subseteq H^0(X,\mathcal O_X(D))$ a basepoint-free subspace with $\dim U=\dim X+2$ whose image is a hypersurface in $\mathbb P(U)$. How can its implicit equation be computed efficiently from an approximation complex, and how do the multigraded syzygies of $I_U$ control the geometry of the hypersurface?
