title: Maximum Volume of Canonical Fano Polytopes
field: mathematics
tier: prose
statement: |-
  For $d\geq4$, let $P$ be a $d$-dimensional canonical Fano lattice polytope, and define the Sylvester sequence by $s_1=2$ and $s_{i+1}=s_1\cdots s_i+1$. Is
  $$
  \operatorname{vol}(P)\leq\frac{2(s_d-1)^2}{d!},
  $$
  with equality only for the canonical Fano simplex $R_{(d)}$?
