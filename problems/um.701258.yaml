title: Kourovka Notebook Problem 16.66
field: mathematics
tier: prose
statement: |-
  For a group $G$, let $D_n(G)$ denote the $n$-th
  dimension subgroup of $G$, and $\zeta_n(G)$ the $n$-th term of its
  upper central series. For a given integer $n\geq 1$, let
  $f(n)=\max\{ m\mid \exists\;\text{a nilpotent group}\;G\;\text{of
  class}\;n\;\text{with}\;D_m(G)\neq 1\}$ and $g(n)=\max\{ m\ |\
  \exists\ \text{a nilpotent group}\ G\ \text{of\ class}\ n\
  \text{such that}\ D_n(G)\not\subseteq \zeta_m(G)\}.$

  a) What is $f(3)$?

  b) (B. I. Plotkin). Is it true that $f(n)$ is
  finite for all $n$?

  c) Is the growth of $f(n)$ and $g(n)$
  polynomial, exponential, or intermediary?

  It is known that both $f(n)-n$ and $g(n)$ tend
  to infinity as $n\rightarrow \infty$ (N. Gupta, Yu. V. Kuz'min,
  *J. Pure Appl. Algebra*, **104** (1995), 191--197).
