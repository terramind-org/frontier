title: Sieving by Many Small Primes
field: mathematics
tier: prose
statement: Sieve $[N]$ by removing half the residue classes mod $p_i$, for primes $2 \leq p_1 < p_2 < \dots < p_{1000} < N^{9/10}$. Does the remaining set have size at most $\frac{1}{10}N$?
