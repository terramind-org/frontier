title: Modular Isomorphism for Class-Two Exponent-p Groups
field: mathematics
tier: prose
statement: Let $G$ and $H$ be finite $p$-groups of exponent $p$ and nilpotency class two over a field $k$ of characteristic $p$. If the group algebras $kG$ and $kH$ are isomorphic, must $G$ and $H$ be isomorphic? Resolve the modular isomorphism problem for this group class over arbitrary fields.
