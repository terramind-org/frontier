title: 5.12 (Reid) — Finite quotients of finite-covolume Kleinian groups
field: mathematics
tier: prose
statement: Let $\Gamma$ be a Kleinian group of finite covolume, and let $\mathcal{C}(\Gamma)$ be the set of isomorphism classes of its finite quotient groups. Does $\mathcal{C}(\Gamma)$ determine $\Gamma$ up to isomorphism?
