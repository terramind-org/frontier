id: um.30002572
title: Multiscale Problems in Cancer-Cell Migration
field: mathematics
tier: prose
statement: Open cancer-migration problems include physical cell passage through obstacles; mechanics and modeling of collective motion; optimization of DTI and Q-ball methods; benchmarks for movement models; the moving-boundary problem for acid-mediated invasion; comparison of amoeboid, mesenchymal, and collective strategies and their invasion speeds; global bounds for chemotaxis-haptotaxis models with tissue remodeling; inverse recovery of chemotaxis sensitivity from observations; and simple microscopic or mesoscopic collective-motion models, including leaderless motion and its macroscopic limits.
