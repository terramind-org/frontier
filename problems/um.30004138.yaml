title: Ramsey Bounds for Edge-Ordered Graphs
field: mathematics
tier: prose
statement: For every edge-ordered graph $H$ on $n$ vertices, is $$r_{\mathrm{edge}}(H)=2^{O(n)}$$? If $H$ is also $d$-degenerate, is $$r_{\mathrm{edge}}(H)=O(C(d)n)$$ for some function $C$ depending only on $d$?
