title: Deformations of Complex Nilmanifolds and Torus Bundles
field: mathematics
tier: prose
statement: Let $M=\Gamma\backslash G$ be a nilmanifold, meaning a compact quotient of a nilpotent real Lie group, with a left-invariant complex structure. Determine its small deformations; determine when it admits a geometric description as an iterated principal holomorphic torus bundle; and determine all large deformations of such bundles.
