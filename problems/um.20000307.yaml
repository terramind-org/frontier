title: An order-profile mld bound from a quasi-etale lci cover
field: mathematics
tier: prose
statement: |-
  **Problem 4 (Mustaţă).** Let \(X\) be a \(\mathbb Q\)-Gorenstein variety. A
  conjecture of Shokurov (Conjecture 2.2 in the introductory notes) says
  \[
  \operatorname{mld}(P;X)\leq \dim X
  \]
  for all \(P\in X\). As a weaker form of this question, is there any universal
  upper bound for \(\operatorname{mld}(P;X)\) after fixing \(\dim X\)?
