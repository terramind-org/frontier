title: Linear Systems and Eigenvalue Problems — Problem 23
field: mathematics
tier: prose
statement: |-
  For a given $A\in{\mathbb{C}}^{n\times n}$, let $\widehat{\mathcal{V}$ denote an approximate invariant subspace of dimension $d$ of $A$, in the sense that there exists some $d$-dimensional invariant subspace ${\mathcal{V}$ of $A$ such that $\angle({\mathcal{V},\widehat{\mathcal{V})$ is small.
  Let ${\mathcal{W}$ be some other subspace of dimension $r<n-d$.
  Suppose the columns of $Q$ form an orthonormal basis for the (generically) $d+r$ dimensional space
  ${\mathcal{Q} = \widehat{\mathcal{V} + {\mathcal{W}$.

  Provide conditions that will ensure that $d$ eigenvalues of $Q^*AQ$ approximate the $d$ eigenvalues of $A$ associated with the invariant subspace ${\mathcal{V}$. Impose assumptions about the eigenvalues of $A$ corresponding to $\mathcal{V}$, as needed.
