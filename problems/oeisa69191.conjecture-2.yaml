lean:
  module: FormalConjectures.OEIS.«69191»
  decl: OeisA69191.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 24 ≤ n) :
        ∃ ev : Fin n → ℝ,
          (primeMatrix ℝ n).charpoly = ∏ i : Fin n, (Polynomial.X - Polynomial.C (ev i)) ∧
          StrictAnti (fun i : Fin n => (-1 : ℝ) ^ (i : ℕ) * ev i) ∧
          ∀ i : Fin n, 0 < (-1 : ℝ) ^ (i : ℕ) * ev i
  context:
    - open OeisA69191
    - open Matrix
  definitions:
    - name: OeisA69191.primeMatrix
      kind: def
      text: |-
        /-- The $n \times n$ matrix $M(n)$ with $(i,j)$-entry ($1 \le i, j \le n$) equal to $1$
        if $i + j$ is prime, and $0$ otherwise. -/
        def primeMatrix (R : Type*) [Zero R] [One R] (n : ℕ) : Matrix (Fin n) (Fin n) R :=
          fun i j => if Nat.Prime (i.val + j.val + 2) then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/69191.lean#L36
