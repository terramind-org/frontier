title: Kourovka Notebook Problem 17.57
field: mathematics
tier: prose
statement: |-
  Let $r(m)=\{r+km\mid k\in \mathbb{Z}\}$ for integers
  $0\leq r<m$. For \(r_1(m_1)\cap r_2(m_2) = \varnothing\) define the
  *class transposition* \(\tau_{r_1(m_1),r_2(m_2)}\) as the
  involution which interchanges \(r_1+km_1\) and \(r_2+km_2\) for
  each integer \(k\) and fixes everything else. The group \(\mathrm{CT}(\mathbb{Z})\) generated by all class transpositions is simple
  (*Math. Z.*, **264**, no. 4 (2010), 927--938). Is \(\mathrm{Out}(\mathrm{CT}(\mathbb{Z})) = \langle \sigma \mapsto
  \sigma^{n \mapsto -n-1} \rangle \cong \mathrm{C}_2\)?
