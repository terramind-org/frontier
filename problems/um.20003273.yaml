id: um.20003273
title: Measure-rigidity obstructions require an entropy and genuine-rank gate
field: mathematics
tier: prose
statement: |-
  **Question 6 (D. Fisher).** Do the new results on measure rigidity for actions of higher rank abelian groups give rise to obstructions to smooth or continuous actions of a higher rank abelian group on a compact manifold?

  Some basic obstructions for smooth volume preserving actions of higher rank abelian groups are already known, see particularly work of H. Hu and A. Katok. The question is whether one can use results on measure rigidity to obtain more information.

  The results on arithmetic quotients for actions of semisimple groups and their lattices have no straightforward analogues here, since the proofs of those results use not only Ratner's theorem but applications of the cocycle superrigidity theorems to cocycles which are necessarily only measurable. Though some cocycle superrigidity theorems are known for particular classes of actions of higher rank abelian groups, none of these apply to measurable cocycles because of the Dye theorem [43] and its generalizations [154, 37].
