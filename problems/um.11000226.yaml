title: Problem 19 — (Error term for counting functions).
field: mathematics
tier: prose
statement: (Error term for counting functions). What can be said about the error term in the quadratic asymptotics for counting functions N ((X,ω ),L )∼c·L2 on a generic translation surface (X,ω )? In particular, is it true that lim sup L→∞ log|N (S,L )−c·L2| logL < 2? Is the lim sup the same for almost all flat surfaces in a given connected component of a stratum? The classical Circle Problem gives an estimate for the error term in the case of the torus. Veech proved that for Veech surfaces the limsup in the error term is actually a limit, see [ V e3]. However, nothing is known about the value of this limit. One may ask whether there is a uniform bound for this limit for Veech surfaces in a given stratum or even for the square-tiled surfaces in a given stratum.
