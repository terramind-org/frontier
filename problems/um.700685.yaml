title: Kourovka Notebook Problem 10.70
field: mathematics
tier: prose
statement: |-
  Find a geometrical justification for the
  Whitehead method for free products similar to the substantiation
  given for free groups by Whitehead himself and more visual than
  given in (D. J. Collins, H. Zieschang, *Math. Z.*, **185**, no. 4 (1984), 487--504; **186**, no. 3 (1984),
  335--361).

  *D. J. Collins' comment:* there is a partial
  solution in (D. McCullough, A. Miller, *Symmetric automorphisms
  of free products*, Mem. Amer. Math. Soc. **582** (1996)).
