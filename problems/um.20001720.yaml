statement: What can be said about interesting phase transitions for potentials $\{q\varphi\}_{q\in\mathbb R}$? In particular, let $M$ be a compact surface of nonpositive curvature, and $\varphi$ be the geometric potential, so that $q = 1$ is a phase transition.
