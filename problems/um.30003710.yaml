title: Periodicity of Twisted Outer-Automorphism-Group Cohomology
field: mathematics
tier: prose
statement: For each fixed $i$ and prime $p$, determine whether $H^i(\operatorname{Out}(F_n),(\mathbb Z/p\mathbb Z)^n)$ is eventually periodic as $n$ increases; if so, ask the same question for coefficients given by a polynomial functor or a VIC-module.
