title: Positively Curved Projective Varieties — Problem 4
field: mathematics
tier: prose
statement: |-
  [cf. {[Mat18b, Problem 5.2]}]

  Let $(X, g)$ be a compact K\"ahler manifold
  with semi-positive holomorphic sectional curvature.

  $\bullet$ Is the fundamental group of $X$ is an extension of a finite group
  by $\mathbb{Z}^{\oplus 2m}$?

  For an appropriate finite \'etale cover $X^* \to X$,
  we consider its Albanese map $\alpha: X^* \to \operatorname{Alb}(X^*)$.

  $\bullet$ Does the fiber $F$ admit a K\"ahler metric $g_F$ such that $n_{{\rm{tf}}}(F, g_F)=\dim F$?

  $\bullet$ Is the fiber $F$ projective and rationally connected?
