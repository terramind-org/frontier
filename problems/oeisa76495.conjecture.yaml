  definitions:
    - name: OeisA76495.a
      kind: def
      text: |-
        /-- Smallest positive integer $x$ such that $\sigma_1(x) \bmod x = n$, or $0$ if no such $x$ exists. -/
        noncomputable def a (n : ℕ) : ℕ :=
          if h : ∃ x, 0 < x ∧ (sigma 1 x : ℕ) % x = n then
            Nat.find h
          else
            0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/76495.lean#L38
