title: Quadratic-Length Universal Random Permutations
field: mathematics
tier: prose
statement: Let $f(k)$ be the minimum length for which a uniformly random sequence of reals is $k$-universal with high probability, meaning it contains every permutation in $S_k$ as a subsequence pattern. Is $f(k)\leq1000k^2$?
