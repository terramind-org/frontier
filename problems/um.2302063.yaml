title: Research Problems in Function Theory — Problem 2.63
field: mathematics
tier: prose
statement: Let $f$ be a rational function and $C$ be as in Problem 2.62. We say that $g$ is a limit function for $f$ if $g$ is defined in some component $G$ of $C$ and is the limit of some subsequence of $(f^n)$ in $G$. In the simplest examples, the number of limit functions is finite, which implies that each has a constant $\alpha$, say, such that $f^k(\alpha)=\alpha$ for some positive integer $k$. If, in addition, $|(f^k)'(\alpha)|<1$ for each of the limit functions, we say that the function $f$ belongs to the class $N$. [(a)] ; Does there exist a rational $f$ which has an infinity of constant limit functions? ; Is the property of belonging to $N$ `generic' in some sense for rational functions? Some account of the older established results can be found in Fatou (, , ) and a sketch from a more modern point of view is given by Guckenheimer . (I. N. Baker)
