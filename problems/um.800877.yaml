title: Open Problems in Pluripotential Theory — Question 8
field: mathematics
tier: prose
statement: |-
  [Coman-Guedj]
  Assume $(X,\omega)$ is the complex projective space ${\mathbb{C}}\mathbb{P}^n$ equipped with the Fubini-Study K\"ahler form. Can one find examples of a $\omega$-psh function $G_a \in DMA(X,\omega)$, whose Monge-Amp\`ere measure is concentrated at some point $a \in {\mathbb{C}}\mathbb{P}^n$ and having an irrational Lelong number at $a$ ?
