title: Fixed price one for products of infinite countable groups
field: mathematics
tier: prose
statement: |-
  Let $\Gamma_1$ and $\Gamma_2$ be infinite countable groups. Does
  $\Gamma_1\times\Gamma_2$ have fixed price $1$?

  By Abert-Weiss, it is enough to show that Bernoulli action of
  $\Gamma_1\times\Gamma_2$ have cost equals to $1$.
