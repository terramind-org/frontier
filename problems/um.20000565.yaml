statement: "**Recovered question.** Recast the interlacing-family and mixed-characteristic-polynomial proof of Kadison--Singer in terms of perturbation determinants, rational Herglotz--Nevanlinna functions, spectral phase shifts, and resolvents. Can this dictionary provide a genuinely analytic proof, and what quantitative resolvent statement must replace the multivariate polynomial barrier argument?"
