title: Square-Root Box Discrepancy for Multidimensional Permutations
field: mathematics
tier: prose
statement: For every $d\geq2$, do there exist arbitrarily large $d$-dimensional permutations $A$ such that for every box $T\subseteq[n]^{d+1}$, $|A(T)-\operatorname{vol}(T)/n|=O(\sqrt{\operatorname{vol}(T)})$?
