title: Randomstrasse101 Open Problems (2025) — Conjecture 2
field: mathematics
tier: prose
statement: |-
  We conjecture, based on numerical observations, that the Lov\'asz number for random dense circulant graphs behaves similarly to that for \(G(n, 1/2)\). This motivates the following question.

  Let \(G\) be distributed as a random dense circulant graph. Then,
  \begin{equation}
  \mathbb{E} \vartheta(G) = (1 + o(1))\sqrt{n}.
  \end{equation}
