title: Kourovka Notebook Problem 17.51
field: mathematics
tier: prose
statement: |-
  Is it true that every non-discrete topological
  group containing no countable open subgroup of exponent 2 can be
  partitioned into two (infinitely many) dense subsets? If the group
  is Abelian or countable, the answer is yes.
