title: Questions in Geometric Group Theory — Q 5.5
field: mathematics
tier: prose
statement: (Misha Kapovich) Suppose $G$ is a finitely generated Kleinian group in $\operatorname{Isom}(\mathbb{H}^n)$. Is $$\delta(G)\leq\operatorname{vcd}(G),$$ with equality if and only if $G$ preserves a totally geodesic subspace $\mathbb{H}^k\subset\mathbb{H}^n$ such that $\mathbb{H}^k/G$ is compact?
