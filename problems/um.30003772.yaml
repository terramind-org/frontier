title: Global Realization of Prescribed Local Galois Extensions
field: mathematics
tier: prose
statement: Let $k$ be a number field, $G$ a finite group, $S$ a finite set of primes, and $F_{\mathfrak p}/k_{\mathfrak p}$ prescribed local Galois extensions whose Galois groups embed in $G$. Does there exist a global Galois extension $F/k$ with group $G$ whose completion at every $\mathfrak p\in S$ is $F_{\mathfrak p}/k_{\mathfrak p}$?
