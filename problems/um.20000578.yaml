title: Lipschitz homotopy of Heisenberg groups and an infinite-order Hopf class
field: mathematics
tier: prose
statement: |-
  Let \(\mathbb H^n\) be the \(n\)-th Heisenberg group with its
  Carnot--Carathéodory metric, and let \(\pi_k^{\mathrm{Lip}}(X)\)
  denote the \(k\)-th Lipschitz homotopy group.  If
  \(\pi_k(\mathbb S^n)\) is nontrivial, is
  \(\pi_k^{\mathrm{Lip}}(\mathbb H^n)\) nontrivial?  In particular, is
  \(\pi_3^{\mathrm{Lip}}(\mathbb H^2)\ne0\)?
