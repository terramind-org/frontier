title: Homological Stability for Indefinite Orthogonal Groups
field: mathematics
tier: prose
statement: For a maximal ordered field $k$ and the inclusion $O_n(k)\times O_i(k)\hookrightarrow O_{n,i}(k)$, does the induced map on discrete group homology $H_d(-,\mathbb Z)$ become an isomorphism for $n$ sufficiently large relative to $d$ and $i$?
