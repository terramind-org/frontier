title: Sharp Complexity Constants for Smooth Multivariate Integration
field: mathematics
tier: prose
statement: |-
  For integration on $C^k(D_d)$, does

  $$\limsup_{n\to\infty} e_n(C^k(D_d),\operatorname{INT})\,n^{k/d}$$

  depend on the bounded domain $D_d\subset\mathbb R^d$? Is the limsup in fact a limit?
