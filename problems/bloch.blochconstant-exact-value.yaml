lean:
  module: FormalConjectures.Wikipedia.Bloch
  decl: Bloch.blochConstant_exact_value
  statement: |-
    theorem blochConstant_exact_value :
        blochConstant = Real.Gamma (1 / 3) * Real.Gamma (11 / 12) /
        (Real.Gamma (1 / 4) * Real.sqrt (1 + Real.sqrt 3))
