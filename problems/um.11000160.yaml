title: Problem 2.3 — Find an algorithm to compute the distance d(φ) of an arbitrary element φ∈M.
field: mathematics
tier: prose
statement: Find an algorithm to compute the distance d(φ) of an arbitrary element φ∈M. We note that an algorithm to compute shortest paths between fixed vertices v,w in the curve complex has been presented by Shackleton in [45]. That problem is a small piece of the problem of computing the distance.
