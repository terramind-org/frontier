title: Multiplicity Bounds for Principal Theta Divisors
field: mathematics
tier: prose
statement: |-
  For every point $x\in\Theta$ of the theta divisor of an indecomposable principally polarized abelian variety of dimension $g$, is

  $$\operatorname{mult}_x\Theta\leq\frac{g+1}{2}$$

  always hold?
