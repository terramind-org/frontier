title: Problem 3.5 — Study homomorphisms Modg→ Mod(N ) and Mod(N )→ Modg.
field: mathematics
tier: prose
statement: Study homomorphisms Modg→ Mod(N ) and Mod(N )→ Modg. 92 M. Korkmaz It is known by the work of Birman and Chillingworth [ 3] that the mapping class group Mod( N ) of a closed nonoreintable surface N of genus g is isomorphic to a subgroup of the extended mapping class group Mod ∗ g−1 of the orientation double cover of N modulo an element of order two. It follows that there are finite index subgroups in Mod( N ) which are isomorphic to a subgroup of Mod g−1.
