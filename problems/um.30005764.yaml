id: um.30005764
title: Universal Permuton Convergence and Algebraic Functional Equations
field: mathematics
tier: prose
statement: For a permutation class $C$, does a uniformly random permutation of size $n$ in $C$ always converge to a limiting permuton, and what is the analogue of this question for graphons? Also, which polynomial functional equations of the form $$P\bigl(F(t,u),F(t,0),\partial_uF(t,0),t,u\bigr)=0$$ force the formal power series $F(t,u)$ to be algebraic under natural hypotheses? More generally, when a series $F(t,u,v)$ satisfies a polynomial relation involving $F(t,u,v)$, auxiliary series $G_i(t,u)$, and series $H_j(t)$, what natural hypotheses guarantee that $F$ is algebraic?
