title: Descent of Hereditary Orders with Involution
field: mathematics
tier: prose
statement: Let $R$ be a discrete valuation ring with fraction field $F$ in which $2$ is invertible, and let $(A,\tau)$ and $(A',\tau')$ be hereditary $R$-orders with involution that become isomorphic over $F$ and over a finite étale $R$-algebra. If the induced involutions on the semisimple quotients by the Jacobson radicals are anisotropic, must the orders with involution already be isomorphic over $R$? More generally, does this conclusion hold when every closed fiber of the automorphism group scheme is almost anisotropic, and can every central simple $F$-algebra with involution be extended from such an order?
