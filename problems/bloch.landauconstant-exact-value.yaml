lean:
  module: FormalConjectures.Wikipedia.Bloch
  decl: Bloch.landauConstant_exact_value
  statement: |-
    theorem landauConstant_exact_value :
        landauConstant = Real.Gamma (1 / 3) * Real.Gamma (5 / 6) / Real.Gamma (1 / 6)
  context:
    - open Bloch
    - open scoped Topology ENNReal
    - open Metric Set Filter
  definitions:
    - name: Bloch.landauConstant
      kind: def
      text: |-
        /-- The **Landau constant** $L$ is the largest radius such that every holomorphic function on the
        unit disk with $f'(0) = 1$ has a disk of that radius contained in its image. -/
        @[optimization_constant "57b"]
        noncomputable def landauConstant : ℝ :=
          sSup {B : ℝ | ∀ f : ℂ → ℂ, DifferentiableOn ℂ f (ball 0 1) → deriv f 0 = 1 →
            ∃ x, ball x B ⊆ f '' (ball 0 1)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/Bloch.lean#L185
