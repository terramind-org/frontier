title: Smallest number $k$ such that $kn + 1$ is prime (exists_k_stronger)
field: mathematics
tier: proof
statement: |-
  A stronger conjecture: for every n there exists a number $k < 1 + n^{0.75}$ such that
  $nk + 1$ is a prime.
