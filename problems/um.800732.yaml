title: Open Problems in Topological Algebra — Problem 6 (Protasov)
field: mathematics
tier: prose
statement: |-
  It is well known that $\sigma$-compact topological groups have
  countable cellularity [Tk] while compact topological groups
  support a strictly positive probability measure (i.e., a Borel
  probability measure $\mu$ such that $\mu(U)>0$ for any nonempty
  open subset $U$ of the group). Recently T. Banakh and O. Ravsky
  [BR] (see also [BR2]) proved that any bounded
  paratopological group $G$ has countable cellularity (moreover,
  each cardinal of uncountable cofinality is a precaliber of $G$).
  On the other hand, according to [Pr2] for every infinite
  cardinal $\tau$ there is a left bounded left topological group of
  cellularity $\tau$.

  Let $G$ be a bounded semitopological
  (quasitopological) group. Has $G$ countable cellularity?
