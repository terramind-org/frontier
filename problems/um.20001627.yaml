id: um.20001627
title: Regularized determinant approximation and the zero-spectrum obstruction
field: mathematics
tier: prose
statement: |-
  The following is equivalent to the previous problem.

  Let $A\in M_l(\mathbb{Z} \Gamma)$, denote $A_k=A/\Gamma_k$. Is it true that
  $$tr_{L\Gamma}(\log A^*A)=\lim \frac{tr(\log A_k^*A_k)}{|\Gamma:\Gamma_k|}?$$

  Its exact problem text is:

  The adjacent Problem 11.2 asks whether normalized Ray--Singer torsions of a
  tower $M_k=\widetilde M/\Gamma_k$ converge to the analytic $L^2$-torsion of
  $\widetilde M$. Thus the intended standing assumptions are a decreasing
  normal finite-index chain
  \[
   \Gamma=\Gamma_0\supseteq\Gamma_1\supseteq\cdots,
   \qquad \bigcap_k\Gamma_k=\{e\},
  \]
  and $q_k=[\Gamma:\Gamma_k]$.

  The notation
  $A/\Gamma_k$ means entrywise application of
  $\mathbb Z\Gamma\to\mathbb Z[\Gamma/\Gamma_k]$.

  There is one essential convention missing from the displayed formula. The
  ordinary functional-calculus logarithm has $\log 0=-\infty$, whereas torsion
  uses the **regular Fuglede--Kadison determinant**, i.e. the logarithmic integral
  over the positive spectrum with the kernel deleted. With a literal logarithm
  the displayed assertion is false (and often not a finite equality); with the
  regular/pseudodeterminant convention it is the standard determinant
  approximation conjecture.
