id: um.30001673
title: Highly Chromatic Subgraphs with Controlled Odd Cycles
field: mathematics
tier: prose
statement: For all positive integers $k$ and $\ell$, do there exist functions $f(k,\ell)$ and $s(k)$ such that every graph $G$ with $\chi(G)\geq f(k,\ell)$ has a subgraph $G'$ for which either $\chi(G')\geq k$ and $G'$ has no odd cycle of length at most $\ell$, or $G'$ contains a $K_k$ whose edges are each subdivided by at most $s(k)$ vertices?
