title: Harmonic Forms on Manifolds with Long Necks
field: mathematics
tier: prose
statement: Let $X$ be a compact Riemannian manifold partitioned along a separating hypersurface $Y$, and let $X(r)$ denote the family of Riemannian manifolds obtained by stretching a cylindrical collar $[-r, r] \times Y$ to length $2r$. How does the space of $L^2$ harmonic differential forms $\mathcal{H}^*(X(r))$ behave asymptotically in the adiabatic/neck-stretching limit as $r \to \infty$?
