title: An exact residue-matching reduction for least points on diagonal cubic surfaces
field: mathematics
tier: prose
statement: |-
  Consider
  \[
  a_0X_0^3+a_1X_1^3+a_2X_2^3+a_3X_3^3=0.
  \]
  (a) If it is soluble, give an upper bound for the smallest solution in terms of the \(a_i\). (b) For \(|a_i|<A\), tabulate the smallest solution and conjecture its growth in \(A\).
