title: Kourovka Notebook Problem 17.59
field: mathematics
tier: prose
statement: |-
  \ A permutation of \(\mathbb{Z}\) is called
  *residue-class-wise affine* if there is a positive integer
  \(m\) such that its restrictions to the residue classes (mod
  \(m\)) are all affine. Is \(\mathrm{CT}(\mathbb{Z})\) the group of
  all residue-class-wise affine permutations of \(\mathbb{Z}\) which
  fix the nonnegative integers setwise?
