title: Several Complex Variables Problem List — Problem 61
field: mathematics
tier: prose
statement: |-
  Can the algebraic hypersurface
  $$ w^3 + w g(w_1, ......, w_n) + f(w_1, ......, w_n) = 1, $$
  where g is homogeneous of degree 2 and f homogeneous of degree 3, be
  holomorphically immersed in $\mathbb{C}^n$
  [ Not true for algebraic immersion]\\
  -R. Narasimhan, Dept. of Math., Univ. of Chicago, Chicago, IL 60637
