title: Hodge Numbers from Landau–Ginzburg Fiber Components
field: mathematics
tier: prose
statement: If $X$ is a smooth Fano variety of dimension $n$ with toric Landau–Ginzburg model $f_X$, and $k_{f_X}$ is the number of components of reducible compactification fibers minus the number of reducible fibers, is $h^{1,n-1}(X)=k_{f_X}$?
