  \section{Arthur-Langlands Reciprocity}\label{30006122}
  {\small UnsolvedMath ID 30006122 · Number Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Establish the general Arthur-Langlands reciprocity correspondence between constituents of the discrete automorphic spectrum of a connected reductive group $G$ and the appropriate global Galois or Arthur parameters, compatibly with localization and automorphic $L$-functions.
  \par\smallskip\textit{Formulation references:} \sref{30006122}{1}, \sref{30006122}{2}.
  \subsection{Short English statement}
  Establish the general Arthur-Langlands reciprocity correspondence between constituents of the discrete automorphic spectrum of a connected reductive group $G$ and the appropriate global Galois or Arthur parameters, compatibly with localization and automorphic $L$-functions.
