title: Homology-Sphere Factors in Simplicial Decompositions
field: mathematics
tier: prose
statement: Let $K$ be a $d$-dimensional doubly Cohen–Macaulay simplicial complex over a field, with $d>1$. Can $K$ be decomposed as $K=\bigcup_{i=1}^m S_i$, where every $S_i$ is a homology sphere and, after choosing any $S_i$ first, each subsequent $S_i$ intersects the preceding union in a $d$-face?
