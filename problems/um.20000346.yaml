title: Covering genus and a contact-adjusted level-signature obstruction for moduli of curves
field: mathematics
tier: prose
statement: |-
  **Problem 5.4. (Farkas)** For \(g\) large, what is the minimal genus of a curve passing through a general point of \(M_g\)? This can be asked for the moduli space or the moduli stack. For low \(g\), the answer for the moduli stack is zero.

  One could ask this question for moduli spaces of canonically polarized manifolds, although I think the point of making \(g\) large is to ensure that \(M_g\) is not uniruled. There is nothing even approximating such a condition to ensure that \(M_H\) is not unirational.
