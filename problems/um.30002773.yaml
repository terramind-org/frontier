title: Ramos Conjecture for Equipartitions by Hyperplanes
field: mathematics
tier: prose
statement: For $j,k\geq 1$, let $\Delta(j,k)$ be the least dimension in which any j masses can be simultaneously cut into $2^k$ equal orthants by k affine hyperplanes. The Ramos conjecture asserts that the known lower bound for $\Delta(j,k)$ is tight for all j and k.
