title: Degrees and Finiteness of Stringy $E$-Polynomials
field: mathematics
tier: prose
statement: For a Gorenstein polytope $P$ of index $r$, is the degree of its stringy $E$-function $E_{\mathrm{st}}(P,t)$ equal to $\dim(P)+1-2r$, and are there, up to multiples, only finitely many such stringy $E$-polynomials with fixed value of $\dim(P)+1-2r$?
