title: Kourovka Notebook Problem 13.19
field: mathematics
tier: prose
statement: |-
  Suppose that both a group $Q$ and its normal
  subgroup
  $H$ are subgroups of the direct product $G_1\times \cdots \times
  G_n$ such that for each $i$ the projections of both $Q$ and $H$
  onto $G_i$ coincide with $G_i$. If $Q/H$ is a $p
  $-group, is $Q/H$ a regular $p
  $-group?
