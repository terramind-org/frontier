title: Multiplier-Ideal Divisors from Kähler–Ricci Flow Limits
field: mathematics
tier: prose
statement: Let $X$ be an $n$-dimensional Fano manifold, let $\phi_\infty$ be a subsequential limit of its normalized Kähler–Ricci flow, and let $V(\gamma\phi_\infty)$ be the associated multiplier-ideal subscheme. Is $V(\gamma\phi_\infty)$ a divisor? For every $\varepsilon>0$ and all sufficiently large $m$, choose a $G$-invariant linear system $|\Sigma|\subset|-mK_X|$ containing a divisor $D$ for which the pair $\left(X,\frac{n+\varepsilon}{(n+1)m}D\right)$ is not Kawamata log terminal. How do $V(\gamma\phi_\infty)$ and $D$ compare, and which one violates Ross–Thomas stability of $X$?
