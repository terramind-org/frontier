title: "Erdős Problem 813 (variant: upper)"
field: mathematics
tier: proof
statement: |-
  The upper half of `Erdos813.erdos_813`: is there a constant $c_2 > 0$ with
  $h(n) \ll n^{1/2-c_2}$?
