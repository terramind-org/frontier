lean:
  module: FormalConjectures.ErdosProblems.«813»
  decl: Erdos813.erdos_813.variants.upper
  statement: |-
    theorem erdos_813.variants.upper :
        ∃ c₂ > (0 : ℝ), (fun n : ℕ ↦ (h n : ℝ)) =O[atTop] (fun n : ℕ ↦ (n : ℝ) ^ (1 / 2 - c₂ : ℝ))
  context:
    - open Erdos813
    - open Erdos813.erdos_813
    - open Erdos813.erdos_813.variants
    - open Filter Asymptotics
  definitions:
    - name: Erdos813.h
      kind: def
      text: |-
        /--
        `h n` is $h(n)$: the smallest clique number of a graph on $n$ vertices in which every set of
        $7$ vertices contains a triangle. The complete graph satisfies the condition, so the set is
        never empty and `sInf` is a true minimum.
        -/
        noncomputable def h (n : ℕ) : ℕ :=
          sInf {k : ℕ | ∃ G : SimpleGraph (Fin n), EverySevenHasTriangle G ∧ G.cliqueNum = k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/813.lean#L45
