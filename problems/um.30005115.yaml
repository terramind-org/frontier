id: um.30005115
title: Sharp Triangle Threshold in Pseudorandom Graphs
field: mathematics
tier: prose
statement: Is there a sharp constant $c_0$ such that, for every $\varepsilon>0$, each sufficiently large $(n,d,\lambda)$-graph satisfying $$\lambda<(c_0-\varepsilon)d^2/n$$ contains a triangle, while arbitrarily large triangle-free examples exist with $$\lambda<(c_0+\varepsilon)d^2/n?$$ If so, does the first inequality force many triangles or a proportionally large triangle factor?
