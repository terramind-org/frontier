title: Canonical Plectic Lifts of Shimura-Variety Cohomology
field: mathematics
tier: prose
statement: Does the étale cohomology complex of a Shimura variety admit a canonical plectic lift with the indicated $\operatorname{Aut}(F\otimes\overline{\mathbb{Q}}/F)[\mu]$-action, compatible with products and the action of $G(\mathbb{Q})$, so that plectic $\ell$-adic étale cohomology can be defined by taking the corresponding group cohomology?
