title: Generating-Function Field for Separable Permutation Subclasses
field: mathematics
tier: prose
statement: Does every proper subclass of the separable permutations have a generating function in $$\mathbb Q\!\left(z,\sqrt{1-4z},\sqrt{1-6z+5z^2}\right)?$$ Determine whether this field contains all such generating functions.
