statement: Let a non-simple singularity $f$ be given and the Dynkin diagram of it be defined by an easily distinguished system of paths connecting 0 with critical points of $f_{\lambda}$. Which Dynkin graphs can be obtained from it by a sequence of formal Picard–Lefschetz moves defined by a braid, but cannot appear as Dynkin diagrams of Morsifications $f_{\lambda^{\prime}}$ with the same critical values defined by the same system of paths?
