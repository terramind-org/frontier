lean:
  module: FormalConjectures.ErdosProblems.«699»
  decl: Erdos699.erdos_699
  statement: |-
    theorem erdos_699 :
        ∀ n i j : ℕ,
          1 ≤ i →
          i < j →
          j ≤ n / 2 →
          ∃ p : ℕ, p.Prime ∧ i ≤ p ∧ p ∣ Nat.gcd (Nat.choose n i) (Nat.choose n j)
