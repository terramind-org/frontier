title: Ways to write $n = x + y$ with $nx + y$ and $ny - x$ both prime (conjecture_4)
field: mathematics
tier: proof
statement: |-
  Conjecture (iii): Each integer $n > 1$ not equal to $8$ can be expressed as $x + y$ ($x, y > 0$)
  with $nx^2 + y$ prime.
