  module: FormalConjectures.OEIS.«232194»
  decl: OeisA232194.conjecture_4
  statement: |-
    theorem conjecture_4 (n : ℕ) (hn : n > 1) (hne : n ≠ 8) :
        ∃ x y : ℕ, 0 < x ∧ 0 < y ∧ x + y = n ∧ (n * x ^ 2 + y).Prime
