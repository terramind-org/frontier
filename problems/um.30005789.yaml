title: Finite Moves for Coxeter Presentations
field: mathematics
tier: prose
statement: Does there exist a finite list of vertical and horizontal moves such that any two vertices in one connected component of the Coxeter galaxy are joined by a finite sequence of those moves? Can an algorithm also specify the kinds of moves needed along such a path?
