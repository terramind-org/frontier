title: Generic Recovery from Group Orbits on Subspaces
field: mathematics
tier: prose
statement: Given a representation $\rho:G\to\operatorname{GL}(\mathbb F^d)$, characterize the subspaces $S\subseteq\mathbb F^d$ for which the orbit $\{\rho(g)z:g\in G\}$ determines almost every $z\in S$ up to the unavoidable scalar ambiguities.
