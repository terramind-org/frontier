statement: What is the coarse Ricci curvature of discrete or continuous nilpotent groups? In particular, for the natural random walk generated by $a,b$ on the discrete Heisenberg group $\langle a,b,c\mid ac=ca,bc=cb,[a,b]=c\rangle$, does the negative small-scale curvature tend to zero at larger scales?
