title: A nonreversible stationary-valley reduction for noisy majority
field: mathematics
tier: prose
statement: |-
  **Noisy majority model.** The noisy majority model with parameter
  $\epsilon\in(0,1)$ is a spin system on a graph $G$ that is the stationary
  distribution of the following Markov chain on
  $\Omega=\{\pm1\}^{V(G)}$: assign each vertex a rate-$1$ Poisson clock.
  When the clock at a site rings, the spin at that vertex randomizes according
  to a $\operatorname{Ber}(1/2)$ with probability $\epsilon$ and chooses the
  majority of the spins of its neighbors and itself with probability
  $1-\epsilon$ (flipping a coin in the event of a tie).

  Consider the noisy majority model on $\mathbb Z_n^d$ for $d>1$. Show there
  exists a fixed $\epsilon>0$ such that
  $t_{\mathrm{mix}}\gtrsim\exp(n^\epsilon)$ (should be true for
  $\exp(cn)$).
