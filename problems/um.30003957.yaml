title: Local Branching of Holonomy Maps for Geometric Structures
field: mathematics
tier: prose
statement: For a closed manifold $M$, is the holonomy map from the deformation space of $(G,X)$-structures on $M$ to the representation variety $\operatorname{Rep}(\pi_1(M),G)$, which is an open map with discrete fibers, always a branched local homeomorphism? Find conditions under which it is a local homeomorphism.
