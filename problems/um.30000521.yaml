title: Isomorphism of Trace Forms for G-Galois Algebras
field: mathematics
tier: prose
statement: For two $G$-Galois algebras $L$ and $L'$ over a field $k$ of characteristic not $2$, when are their trace $G$-forms $q_L$ and $q_{L'}$ isomorphic? More weakly, for which quadratic forms $\varphi$ over $k$ are $\varphi\otimes q_L$ and $\varphi\otimes q_{L'}$ isomorphic?
