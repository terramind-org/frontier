title: Positive-existential decoder criterion for rational pair storage
field: mathematics
tier: prose
statement: |-
  Jeroen Demeyer has observed that the existence of a polynomial bijection
  \(\mathbb N^2\to\mathbb N\) implies that any first order formula over
  \(\mathbb N\) in positive prenex form is equivalent to one in which every
  block of consecutive universal quantifiers is replaced by just one (and the
  number of existential quantifiers goes up). Such a polynomial bijection can
  be found in Davis, *Math. Monthly* **80**, 236--237. Does something similar
  work for \(\mathbb Q\), in other words, can we find a Diophantine injection
  \(\mathbb Q^2\hookrightarrow\mathbb Q\)? There are some observations
  related to this in *C.R.A.S. Paris* **328**, 3--8 (1999); for example, this
  would follow from the generalized \(abc\)-conjecture.
