title: Faithful Homotopy Actions and Cohomology of Baut(X)
field: mathematics
tier: prose
statement: For a finite simply connected CW complex $X$ and subgroups of $\operatorname{Baut}(X)$ corresponding to faithful actions up to homotopy, how many such subgroups are there, how large can one be, and what is the cohomology of $\operatorname{Baut}(X)$?
