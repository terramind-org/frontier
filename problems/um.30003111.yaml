id: um.30003111
title: Root Separation and Rational Values of Littlewood Polynomials
field: mathematics
tier: prose
statement: |-
  Let

  $$\mathcal P_d=\{a_dx^d+\cdots+a_0:a_i\in\{-1,0,1\}\}.$$

  Is the minimum nonzero distance between roots of two polynomials in $\mathcal P_d$ bounded below by $\exp(-Cd)$ for some absolute $C>0$? For a fixed rational $p/q\in[9/10,19/20]$, can the trivial lower bound on $\min_{P\in\mathcal P_d}\lvert P(p/q)\rvert$ be improved to $c_{p,q}\exp(-Cd)$?
