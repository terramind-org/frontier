title: Homological Stability for Stabilized Four-Manifold Diffeomorphisms
field: mathematics
tier: prose
statement: |-
  For each fixed $k$, does there exist $n$ such that

  $$H_k\!\left(B\operatorname{Diff}_{\partial}\!\left(\mathop{\natural}^{n}(S^2\times S^2\setminus\mathring D^4)\right);\mathbb Q\right)$$

  is equal to the stable-limit homology?
