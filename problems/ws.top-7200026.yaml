  \item[\hypertarget{source:statement:2}{S2}] R. L. Graham and B. D. Lubachevsky, Dense Packings of Equal Disks in an Equilateral Triangle: From 22 to 34 and Beyond (author preprint, 2004). Abstract and Section 1, pp. 1–2. \url{https://arxiv.org/pdf/math/0406252v1}.
