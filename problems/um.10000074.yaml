title: Mutually avoiding competing random walks
field: mathematics
tier: prose
statement: Run two walks with a common clock on $\mathbb{Z}^d$, each choosing uniformly among neighbors not previously visited by the other walk. Prove that in $d=2$ one walk is almost surely trapped in a finite region, while in higher dimensions neither walk is trapped almost surely.
