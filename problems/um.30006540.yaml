title: Maximum-Cut Surplus in Clique-Free Graphs
field: mathematics
tier: prose
statement: For each $r\geq3$, determine the largest guaranteed surplus over $m/2$ in the maximum cut of an $m$-edge $K_r$-free graph. In particular, does there exist an absolute $\varepsilon>0$ such that every such graph has surplus $\Omega_r(m^{1/2+\varepsilon})$?
