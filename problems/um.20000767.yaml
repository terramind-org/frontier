title: Uniqueness, counting, and a descent sieve for the degree-eight K3 partner
field: mathematics
tier: prose
statement: |-
  If you fix a degree 2 K3 surface over $\mathbb{Q}$ with a 2-torsion Brauer class $\alpha$ (over $\overline{\mathbb{Q}}$), van Geeman tells us that we can find a variety $Y$ such that $X$ is a moduli space of sheaves on $Y$ and such that $\alpha$ is the obstruction for the moduli space to be fine.

  Is $Y$ unique? How many such $Y$ are there? If $X$ is defined over $\mathbb{Q}$ and $Y$ is defined over some nontrivial extension of $\mathbb{Q}$, is it possible that $\alpha$ is defined over $\mathbb{Q}$, i.e. in the image of $\operatorname{Br}(X)\to\operatorname{Br}(\overline X)$?
