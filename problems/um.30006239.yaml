title: Cameron Greedy Base-Size Conjecture
field: mathematics
tier: prose
statement: Prove that there is an absolute constant $c$ such that every finite primitive permutation group $G$ has greedy base size $G(G)\leq c\,b(G)$, where $b(G)$ is its minimum base size.
