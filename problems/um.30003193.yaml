title: Adelic Harmonic Metrizations over Global Fields
field: mathematics
tier: prose
statement: |-
  Let $X$ be a projective variety of dimension $n$ over a global field $K$, let $\overline L$ be a positive adelic metrized line bundle, and put $\omega=c_1(\overline L)/(\deg L)^{1/n}$. Does every line bundle $M$ on $X$ admit an admissible metrization $\overline M$ whose curvature is harmonic at every place and which satisfies

  $$\overline M\cdot\omega^n=\lambda(M)\omega^{n+1},$$

  uniquely up to multiplication by an adelic divisor from $K$ of degree zero?
