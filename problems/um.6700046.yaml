statement: 'Conjecture. The sphereSn minus Σo is area extremal in the "subcomplete" sense for all closed subsetsΣo ⊂Sn of topological dimensions k ≤1. 20 Lengths, Widths and Areas of Non-Complete Manifolds withSc > 0. To develop an adequate picture ofcomplete manifolds with scalar curvatures ≥σ one needs to understand geometric constraints imposed by the inequalitySc ≥σ on (bounded) domains in these manifolds. Thus, we look at possible sizes ofincomplete manifoldsX, e.g. (compact) manifolds with boundaries, where we do not, a priori, assume they are contained in complete manifolds with lower bounds on Sc. (We shall say something about theshapes rather than mere sizes of theseX in section 22) Asimpleexampleshowingwhatcanandwhatcannotbeexpected in this regard is the universal covering of the 2-sphere minus 2 opposite points times Rn−2, denoted ˜Σn π = the universal cover of S2∖{⋅⋅}× Rn−2 55 which satisﬁes: ●Sc( ˜Σn π) =Sc(S2) = 2, ●waist1[˜Σn π]=π and width1( ˜Σn π) ≤π. ●waistm[˜Σn π]=widthn−m( ˜Σn π) =∞for m= 2,...,n and K-area[˜Σn π]=∞as well. ●The r-interior ˜(Σn π)−r ⊂Σn π, that is the set of pointsx which are r-far from inﬁnity, i.e. such that the closedr′-balls Bx(r′) ⊂Σn π for r′< r are compact, hassmall all waistm and K-area, actually, zero in the present example. r-Interior and Completeness. Metric completeness of anX in this terms is equivalent to non-emptiness of ther-interior ofX for r =+∞.'
