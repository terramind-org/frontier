title: Pure-state extension from a MASA of a factor
field: mathematics
tier: prose
statement: |-
  **QUESTION 2.** Given a MASA \(A\) of a factor \(M\), do the pure states of \(A\) have unique state extension to \(M\)?

  The compilation is dated November 30, 2014.

  The question is:

  The source then records: a positive answer for discrete MASAs of \(B(H)\) when \(H\) is separable (by Marcus--Spielman--Srivastava); a negative answer when the MASA has a continuous part; a negative answer for all MASAs in type II factors on separable \(H\); mixed behavior for nonseparable type II factors; and “no results at all” for type III factors.

  The quantifier in the question is important. It asks whether **every** pure state of \(A\), including singular pure states, has exactly one state extension to \(M\). It does not ask whether a particular pure state has a unique extension, and it does not ask only about normal states.
