title: Kourovka Notebook Problem 4.33
field: mathematics
tier: prose
statement: |-
  Let ${\mathfrak{K}}_n$ be the class of all groups with
  a single defining relation in the variety of soluble groups of
  derived length $n$.

  a) Under what conditions does a ${\mathfrak{K}}_n $-group have non-trivial center? Can a $ {\mathfrak{K}}_n $-group,
  $n \geq 2$, that cannot be generated by two elements have
  non-trivial centre? *Editors' comment (1998):* These
  questions were answered for $n=2$ (E. I. Timoshenko, *Siberian Math. J.*, **14**, no. 6 (1973), 954--957; *Math.
  Notes*, **64**, no. 6 (1998), 798--803).

  b) Describe the abelian subgroups of ${\mathfrak{K}}_n $-groups.

  c) Investigate the periodic subgroups of
  ${\mathfrak{K}}_n $-groups.
