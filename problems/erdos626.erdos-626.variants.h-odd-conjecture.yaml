lean:
  module: FormalConjectures.ErdosProblems.«626»
  decl: Erdos626.erdos_626.variants.h_odd_conjecture
  statement: |-
    theorem erdos_626.variants.h_odd_conjecture :
        ∀ m : ℕ, Odd m → Tendsto (fun n : ℕ ↦ Real.log (h m n : ℝ) / Real.log n) atTop
          (𝓝 (2 / ((m : ℝ) + 1)))
  context:
    - open Erdos626
    - open Erdos626.erdos_626
    - open Erdos626.erdos_626.variants
    - open Filter
    - open scoped Topology
  definitions:
    - name: Erdos626.h
      kind: def
      text: |-
        /--
        `h m n` is $h^{(m)}(n)$: the largest chromatic number of a graph on $n$ vertices with girth
        $> m$.
        -/
        noncomputable def h (m n : ℕ) : ℕ :=
          sSup {c : ℕ | ∃ G : SimpleGraph (Fin n), (m : ℕ∞) < G.egirth ∧ G.chromaticNumber = c}
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/626.lean#L53
