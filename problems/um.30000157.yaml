title: Cycle Statistics of Nonreversible Birational Maps
field: mathematics
tier: prose
statement: Let $\langle D_0\rangle_p$ denote the average over primes at most $p$ at which $L$ has good reduction. For every nonintegrable birational map $L$ that is not reversible over $\mathbb R$ and has no other symmetry, $\lim_{p\to\infty}\langle D_0\rangle_p(x)=x$.
