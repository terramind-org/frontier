title: Open Problems and Questions about Geodesics — Problem 44 (Benjamin Schmidt)
field: mathematics
tier: prose
statement: |-
  We consider a
  Riemannian metric on an oriented closed surface $M$ of genus $\ge 1$. Let $\Gamma$ be a non-trivial
  free homotopy class and $p$ a point in $M$. A theorem of Gaidukov [Gaidukov1966] says that
  there exist a closed geodesic $\gamma:\mathbb{R}\to M$ in $\Gamma$ and a ray $\beta:[0,\infty)\to M$
  with $\beta(0)=p$ such that $dist(\beta(t), \gamma(t)) \to 0$ as $t \to \infty$. As explained in [Bia-Pol1986], Gajdukov's results follow
  easily from the classical results of [Morse1924] and [Hedlund1932].

  *Generalize this statement to higher dimensions.*
