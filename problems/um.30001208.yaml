title: Regular Model Sets from Primitive Pisot Substitutions
field: mathematics
tier: prose
statement: For a primitive Pisot substitution with geometric point set $\Lambda=\bigsqcup_i\Lambda_i$, tile intervals $A_i$, and cut-and-project windows $W_i$, is each $\Lambda_i$ a regular model set with window $W_i$ up to boundary points? Equivalently, does the model-set construction tile the physical line, or does the corresponding product of intervals and windows form a fundamental domain of the cut-and-project lattice?
