lean:
  module: FormalConjectures.OEIS.«236511»
  decl: OeisA236511.conjecture
  statement: "theorem conjecture (n : ℕ) (hn : 1075 < n) : 0 < a n"
  context:
    - open OeisA236511
  definitions:
    - name: OeisA236511.a
      kind: def
      text: |-
        /-- $a(n)$ is the number of integers $0 < k < n$ such that $p = 3\phi(k) + \phi(n-k) - 1$,
        $p + 2$, $p + 6$, and $p + 8$ are all prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ k ∈ Finset.Ico 1 n,
            let p := 3 * k.totient + (n - k).totient - 1
            if p.Prime ∧ (p + 2).Prime ∧ (p + 6).Prime ∧ (p + 8).Prime then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/236511.lean#L34
