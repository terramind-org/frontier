title: Randomstrasse101 Open Problems (2024) — Conjecture 12
field: mathematics
tier: prose
statement: |-
  Let $H_k$ be the $2^k\times 2^k$ Hadamard matrix obtained by the Sylvester construction (see above). For odd $k$, we have
  \[
  \mathrm{disc}(H_k) = \sqrt{2}\sqrt{2^k}.
  \]
