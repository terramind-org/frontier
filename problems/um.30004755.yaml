title: Bogomolov–Miyaoka–Yau Inequality for Smooth Four-Manifolds
field: mathematics
tier: prose
statement: Let $X$ be a closed, oriented, smooth four-manifold with $b_1(X)=0$, odd $b^+(X)\geq3$, Seiberg–Witten simple type, and a nonzero Seiberg–Witten invariant. Must $$c_1(X)^2\leq3c_2(X)$$ hold?
