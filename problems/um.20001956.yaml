title: A topological certificate for Kirwan-type restriction
field: mathematics
tier: prose
statement: |-
  Which topological and Morse-theoretic properties of an equivariant map $F:M\to V$ suffice to make the restriction $H_G^*(M)\to H_G^*(F^{-1}(0))$ surjective, and what extra issue arises when $V=\mathfrak g^*\otimes\mathbb R^3$ for a hyperkähler moment map?

  This record is Question 5.1, attributed to E. Lerman, in the AIM workshop list *Moment maps and surjectivity in various geometries*.

  I reconstruct `hyperK¨ ahler` as *hyperkähler*, `M.Note` as `M. Note`, `6the` as a page-number artifact followed by `the`, and $R2,S1,\mathfrak g\!\ast,M H,M G$ as $\mathbb R^2,S^1,\mathfrak g^*,M^H,M^G$. The last clause should be read componentwise: for $\xi\in\mathfrak g$, the critical set of $\langle\mu,\xi\rangle$ is the zero set of the infinitesimal vector field $\xi_M$, not generally the single set $M^G$. This agrees with Ginzburg--Guillemin--Karshon (GGK).

