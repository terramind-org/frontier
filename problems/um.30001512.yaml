title: Measure-Independence of Positive Random-Walk Entropy
field: mathematics
tier: prose
statement: Let $G$ be finitely generated, and let $\mu_1$ and $\mu_2$ be symmetric finitely supported measures generating $G$. If the entropy $h(\mu_1)$ is positive, must $h(\mu_2)$ also be positive?
