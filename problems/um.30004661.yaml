title: Rigidity of Morphisms to Wound Unipotent Groups
field: mathematics
tier: prose
statement: Let $U$ be a wound unipotent group over $k$, let $x$ be a closed point of $\mathbb P_k^1$, put $X=\mathbb P_k^1\setminus\{x\}$, and choose $y_1,y_2\in X(k)$. Is every $k$-morphism $f:X\times X\to U$ that is trivial on $\{y_1\}\times X$ and $X\times\{y_2\}$ the constant morphism $1$?
