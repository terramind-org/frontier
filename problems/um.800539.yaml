title: Visibility Graphs of Points, Segments and Polygons — Problem 9
field: mathematics
tier: prose
statement: |-
  Regarding the graphs with low obstacle numbers,
  Alpet et al. [akl-ong-2010]
  and Mukkamala et al. [mps-glon-2010] have studied graphs with obstacle numbers
  $1$ and $2$. Mukkamala et al. [mps-glon-2010] showed that for any positive integer $h \geq 3$,
  there is a graph with obstacle number exactly $h$. The following questions of
  Alpet et al. [akl-ong-2010] are still open.

  For $h>1$, what is the smallest number of vertices of a graph with obstacle number $h$?
