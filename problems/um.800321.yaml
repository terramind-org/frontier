title: Complexity in Enumerative Combinatorics — Problem 5 (Pak--Yeliussizov)
field: mathematics
tier: prose
statement: |-
  This also implies that $y(t)$ is not D-finite. Indeed, observe by definition,
  that if a sequence $\{a_n\}$ is P-recursive, then so is $\{n! $,
  which implies the result by taking $a_n=B_n/n!$ (cf. [LR]). Of course,
  there is a more direct way to prove that $y(t)$ is not $D$-finite by
  repeated differentiation or via the asymptotics, see below.
  This suggests the following advanced generalization of Klazar's theorem.

  Suppose $\{a_n/n!\}$ is D-algebraic but not P-recursive. Does this imply
  that $\{a_n\}$ is D-transcendental?
