id: erdos954.erdos-954.variants.upper
title: "Erdős Problem 954 (variant: upper)"
field: mathematics
tier: proof
statement: |-
  Erdős and Rosen could not even prove that the number of solutions to $a_i+a_j\leq x$ is at most
  $(1+o(1))x$ [Er77c, p. 71].
