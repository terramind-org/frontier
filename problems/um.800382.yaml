title: Open Problems in Arithmetic Dynamics — Conjecture 5
field: mathematics
tier: prose
statement: |-
  [Benedetto, Chen, Hyde, Kovacheva, White, 2014, {[MR3277939]}; Blanc--Canci--Elkies, 2015, [MR3431627]]

  Let $f\in\operatorname{End}_2^1(\mathbb{Q})$ be a rational map of degree $2$ defined over $\mathbb{Q}$.
  \begin{parts}

  (a)
  Let $P\in\mathbb{P}^1(\mathbb{Q})$ be periodic for $f$. Then $P$ has period at most $7$.

  (b)
  Let $P\in\mathbb{P}^1(\mathbb{Q})$ be preperiodic for $f$. Then $\#\mathcal{O}_f(P)\le9$.

  (c)
  The full set of rational preperiodic points satisfies $\#\operatorname{PrePer}\bigl(f,\mathbb{P}^1(\mathbb{Q})\bigr) \le 14$.
  \end{parts}
