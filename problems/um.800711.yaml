title: Open Problems on Central Simple Algebras — Problem 21
field: mathematics
tier: prose
statement: |-
  Let $G$ be an absolutely almost simple linear algebraic group that is
  anisotropic over $F$. Does $G$ remain anisotropic over every finite
  extension $K/F$ of dimension not divisible by any prime in $S(G)$?
