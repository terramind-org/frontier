title: Boecherer central values determine autocorrelation, not Fourier phases
field: mathematics
tier: prose
statement: |-
  Let \(d\) be a positive integer and let \(F\) be a Siegel modular form with Fourier coefficients \(a(F)\). In many cases, we know the (generalized) Böcherer conjecture
  \[
  \left|\sum_{S\in\mathrm{Cl}_d}a(F,S)\Lambda(S)\right|^2
  =L(\pi_F\times\theta_\Lambda,1/2)
  =L(\mathrm{BC}_{K/\mathbb Q}(\pi_F)\times\Lambda,1/2).
  \]
  Knowing this equality and the values for many \(\Lambda\), can we compute the Fourier coefficients \(a(F,S)\)?
