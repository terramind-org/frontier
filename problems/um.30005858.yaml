title: Area-Nonincreasing Smoothing of Lipschitz Maps
field: mathematics
tier: prose
statement: Let $f:M\to S^n$ be Lipschitz and satisfy $\Lambda^2f^*g_{S^n}\leq\Lambda^2g$ almost everywhere. Can $f$ be smoothed to a map $F$ satisfying $\Lambda^2F^*g_{S^n}\leq\Lambda^2g$ everywhere?
