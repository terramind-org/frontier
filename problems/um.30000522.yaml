statement: Let $B$ be an anisotropic bilinear form with standard splitting tower $(F_i,B_i)_{0\leq i\leq h}$. If $B_L$ becomes isotropic over $L/F$, must $i_W(B_L)=i_W(B_{F_k})$ for some $1\leq k\leq h$?
