title: Local ellipticity and spherical parabolic containers
field: mathematics
tier: prose
statement: "Let $A$ be an Artin group with subgroup $H$. If for all $h\\in H$ there is a (spherical) parabolic containing $h$, does there exist a (spherical) parabolic containing $H$? Geometric version: If a group $G$ acts on $X$ and $H<G$ with each $h\\in H$ fixing a point of $X$, then does $H$ fix a point? What about when $X$ has non-positive curvature?"
