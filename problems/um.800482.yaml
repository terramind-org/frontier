title: Billiards and Quantitative Symplectic Geometry — Serge Tabachnikov — Problem 4
field: mathematics
tier: prose
statement: |-
  **Chaotic symplectic billiards?.** Problem: *do chaotic symplectic billiards in convex $C^1$-smooth domains exist?*

  A natural candidate is the stadium; there is numerical evidence that this might be the case.
