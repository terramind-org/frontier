title: Kourovka Notebook Problem 7.49
field: mathematics
tier: prose
statement: |-
  Let $G$ be a finitely generated group, and $N$ a minimal normal
  subgroup of $G$ which is an elementary abelian $p
  $-group. Is it true that either $N$ is finite or the growth
  function for the elements of $N$ with respect to a finite
  generating set of $G$ is bounded below by an exponential function?
