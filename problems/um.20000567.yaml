title: A support-discrepancy formulation for zonotope generator partitions
field: mathematics
tier: prose
statement: |-
  Is there an analog of KS for zonotopes? Let
  \(z_1,\ldots,z_k\in\mathbb R^n\), \(k>n\), and let
  \(\bar z_i=\{\alpha z_i:0\leq\alpha\leq1\}\). Consider
  \(\mathrm{Zon}=\alpha_1\bar z_1+\cdots+\alpha_k\bar z_k\).
