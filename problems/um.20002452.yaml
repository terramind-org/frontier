title: A symmetry obstruction and reversible two-mode diagnostic for vortex-pattern return
field: mathematics
tier: prose
statement: |-
  **T. Kapitula: (Transient dynamics for vortex patterns).**  Setup: Start with
  the Gross--Pitaevskii equation
  \[
  i q_t+\Delta q\mathbin{\pm}|q|^2q=V(x)q.
  \]
  Numerical investigations show that if one starts with a ``nice'' vortex
  pattern with a lot of symmetry, it evolves to an ``ugly'' vortex pattern with
  little symmetry or structure, and then evolves further to a ``nice'' pattern
  again.  **Problem:** By what mechanism does this happen and how can one capture
  the general dynamics?
