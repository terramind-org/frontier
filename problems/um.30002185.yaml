title: Sharp Tail Decay for Persistent Critical Crossings
field: mathematics
tier: prose
statement: |-
  For critical dynamical percolation and the left–right crossing event $C_Q$ of a square $Q$, is the tail probability bounded by

  $$\mathbb P[\omega_s\in C_Q\text{ for all }s\in[0,t]]\leq\exp(-t^{2/3+o(1)})$$

  as $t\to\infty$?
