title: Contact-form scaling obstruction and the Sasakian Higgs repair
field: mathematics
tier: prose
statement: For a three-manifold, Corlette's theorem relates \(SL(2,\mathbb C)\)-representations of the fundamental group to harmonic data. If the three-manifold has a contact structure, does the corresponding moduli space acquire additional structure analogous to the Higgs-bundle moduli of a surface? In particular, is there a contact interpretation and critical-point description of the \(L^2\)-norm of the Higgs field, and can this help produce representations into \(SU(2)\) or \(PSL(2,\mathbb R)\)?
