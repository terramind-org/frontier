title: Topology of Baby Teichmüller Spaces
field: mathematics
tier: prose
statement: Let $B_n$ be the quotient, by $\operatorname{SL}_2(\mathbb R)$, of functions $f:\mathbb Z/n\mathbb Z\to\mathbb{RP}^1$ such that $f(i)\neq f(i+1)$ and whose image contains at least three points. What is the cohomology of $B_n$, and how many connected components does it have?
