title: Endpoint reductions and strict one-direction local concavity at the ball
field: mathematics
tier: prose
statement: |-
  **Brunn-Minkowski inequality for \(L_p\) surface area.** Show that for convex bodies \(K\) and \(L\) in \(\mathbb R^n\) and for \(0\le p\le1\),
  \[
  S_p(K+L)^{1/(n-p)}\ge S_p(K)^{1/(n-p)}+S_p(L)^{1/(n-p)},
  \]
  where
  \[
  S_p(K)=\int_{S^{n-1}}h_K(u)^{1-p}\,dS_K(u)
  \]
  is the \(L_p\) surface area.
