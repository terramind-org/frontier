id: um.30004817
title: The Q-Form Classification Conjecture
field: mathematics
tier: prose
statement: "Q-form conjecture: let $M$ and $M'$ be simply connected $2q$-manifolds with normal $(q-1)$-smoothings $\\bar\\nu:M\\to B$ and $\\bar\\nu':M'\\to B$, where $q$ is even. If $\\bar\\nu$ and $\\bar\\nu'$ are bordant and their Q-forms $E_q(M,\\bar\\nu)$ and $E_q(M',\\bar\\nu')$ are isomorphic, then $M$ and $M'$ are h-cobordant over $B$."
