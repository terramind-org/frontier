title: A quantitative no-focal-point obstruction to zero Liouville entropy
field: mathematics
tier: prose
statement: |-
  **Question 10.1.2 (Paternain).** Is there a Riemannian metric on a closed surface of genus \(\ge 2\) whose geodesic flow has zero Liouville entropy?

  It immediately adds that Bangert and Paternain had outlined a nonconstructive proof of the analogous assertion for Finsler metrics, and that the Riemannian problem is harder.
