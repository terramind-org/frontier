  \section{Steinitz prefix bounds for arbitrary norms}\label{20000916}
  {\small UnsolvedMath ID 20000916 · Combinatorics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Steinitz conjecture

  Given vectors $v_1,...,v_n\in\mathbb{R}^d$ and a norm $X$ satisfying $\sum_{i=1}^n v_i=0$ and $||v_i||_X\le 1$ for all $i$. Define $S_n(X,d)=min_{\pi\in S^n}max_{k=1,...,n}|| \sum_{i=1}^k v_{\pi(i)}||_X$ where $S^n$ is the set of all permutations of $[n]$. Let $S(X,d)=sup_n S_n(X,d)$. Then, $S(X,d) =O(\sqrt{d})$.
  \par\smallskip\textit{Formulation references:} \sref{20000916}{1}, \sref{20000916}{2}.
  \subsection{Short English statement}
  Steinitz conjecture

  Given vectors $v_1,...,v_n\in\mathbb{R}^d$ and a norm $X$ satisfying $\sum_{i=1}^n v_i=0$ and $||v_i||_X\le 1$ for all $i$. Define $S_n(X,d)=min_{\pi\in S^n}max_{k=1,...,n}|| \sum_{i=1}^k v_{\pi(i)}||_X$ where $S^n$ is the set of all permutations of $[n]$. Let $S(X,d)=sup_n S_n(X,d)$. Then, $S(X,d) =O(\sqrt{d})$.
