lean:
  module: FormalConjectures.OEIS.«189286»
  decl: OeisA189286.conjecture_3
  statement: |-
    theorem conjecture_3 (n : ℕ) (hn : 0 < n) :
        ∃ m : ℤ, a n = 8 * m ∧ (Odd m ↔ ∃ k : ℕ, n = 2 ^ k)
  context:
    - open OeisA189286
  definitions:
    - name: OeisA189286.a
      kind: def
      text: |-
        /--
        The sequence $a(n)$ given by
        $\frac{\sum_{k=0}^n \binom{6k}{3k}\binom{3k}{k}
          \binom{6(n-k)}{3(n-k)}\binom{3(n-k)}{n-k}}{(2n-1)\binom{3n}{n}}$.
        -/
        def a (n : ℕ) : ℚ :=
          (∑ k ∈ Finset.range (n + 1), tTerm k * tTerm (n - k)) /
            (((2 * (n : ℚ)) - 1) * ((3 * n).choose n : ℚ))
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/189286.lean#L40
