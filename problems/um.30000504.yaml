title: Uniformly Bounded Ramification in $p$-Frattini-Tower Realizations
field: mathematics
tier: prose
statement: For a $p$-perfect finite group $G$ and its $p$-Frattini quotients $G_k$, does there exist $r_0$ such that every $G_k$ satisfies the regular inverse Galois problem using covers with at most $r_0$ ramification classes?
