title: An exact annular inflow-outflow boundary layer
field: mathematics
tier: prose
statement: |-
  Vanishing viscosity limit in a setting like Temam--Wang.

  Study the vanishing viscosity limit from Navier-Stokes to Euler on the annulus in a setting like the work of Temam and Wang, with in-flow and out-flow conditions.

  **Recovered working statement.** Let
  \[
   A_{r_-,r_+}=\{x\in\mathbb R^2:r_-<|x|<r_+\},
   \qquad 0<r_-<r_+.
  \]
  For smooth, compatible inflow/outflow data whose normal component is nonzero on both boundary components, prove that solutions \(u^\nu\) of incompressible Navier--Stokes converge as \(\nu\downarrow0\) to a smooth solution \(u^0\) of incompressible Euler, identify the outflow boundary layer, and quantify convergence.
