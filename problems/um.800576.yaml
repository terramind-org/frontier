title: Selection Principles in Mathematics — Problem 2
field: mathematics
tier: prose
statement: |-
  [{[BZSepar, preprint version]}]
  Assume that $X\subseteq B\subseteq\mathbb{R}$, $B$ is Borel, and $X$ satisfies $\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\Gamma)$.
  Must there be a $\sigma$-compact $F$ with $X\subset F\subset B$?
  What if $B$ is $F_{\sigma\delta}$?
