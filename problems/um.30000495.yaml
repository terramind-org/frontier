title: Rank Bounds for Modular-Representation Grothendieck Groups
field: mathematics
tier: prose
statement: Let $k$ be a finite field of characteristic $p$, let $G$ be a compact $p$-adic analytic group with no elements of order $p$, and let $\mathcal F_t$ be the category of finitely generated $kG$-modules of canonical dimension $\dim_G(M)\leq t$. For the inclusion-induced map $\theta_t:K_0(\mathcal F_t)\to K_0(\mathcal F_d)$, improve the bound on $\operatorname{rank}(\operatorname{im}\theta_t)$ given by Galois orbits of conjugacy classes of finite-order elements whose centralizers have dimension at most $t$. What is the analogue with $k$ replaced by the $p$-adic integers?
