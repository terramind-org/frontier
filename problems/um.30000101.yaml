title: Spectral Subspaces of Measures on Infinite Groups
field: mathematics
tier: prose
statement: Let $G$ be an infinite discrete group, let $\mu \in M_0(G) \setminus \{0\}$ be a nonzero finitely supported (or $c_0$) measure on $G$, and let $m_\mu$ be the associated convolution operator on $\ell_p(G)$ ($1 < p < \infty$). Does the operator space $N_{|\mu|}^{(p)}$ coincide with the space $L_1^{(p)}(m_\mu)$?
