title: Open Problems and Questions about Geodesics — Question 63 (Gromov)
field: mathematics
tier: prose
statement: |-
  We call a stationary net non-trivial if it has at least one vertex of valency $\ge 3$, in other words if it is not a disjoint union of simple closed geodesics.

  *Are non-trivial stationary nets dense on any closed Riemannian surface? In other words, for each non-empty open subset $U$, is there a stationary net intersecting $U$? *
