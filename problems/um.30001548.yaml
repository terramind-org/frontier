title: Reachability and Power Avoidance in Infinite Words
field: mathematics
tier: prose
statement: For power-free words, does the reachability property hold for every prefix $u$ and suffix $v$ occurring infinitely often; does every curling-number sequence eventually reach $1$; and does the lexicographically least infinite word over $\mathbb{N}$ avoiding $5/2$-powers use only three letters?
