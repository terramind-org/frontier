title: Homotopy Invariance of Positive-Scalar-Curvature Metric Spaces
field: mathematics
tier: prose
statement: Let $M$ and $N$ be closed $d$-manifolds with $d\geq 5$ and the same normal $2$-type. If both admit metrics of positive scalar curvature, prove that the spaces $R^+(M)$ and $R^+(N)$ are homotopy equivalent.
