title: Orbit equivalence and ordered cohomology
field: mathematics
tier: prose
statement: Classify irreducible SFTs up to topological orbit equivalence; characterize and classify their unital ordered cohomology groups; determine when winding and standard orders agree; and decide whether every subshift orbit-equivalent to an irreducible SFT is itself an SFT.
