lean:
  module: FormalConjectures.Wikipedia.DiameterSimpleFiniteGroups
  decl: BabaiSeressConjectures.babai_seress_conjecture
  statement: |-
    theorem babai_seress_conjecture :
        ∃ C : ℕ,
        ∀ (G : Type) [Group G] [Fintype G] [IsSimpleGroup G],
        (∃ a b : G, a * b ≠ b * a) →
        (groupDiam G : ℝ) ≤ (Real.log (Fintype.card G : ℝ)) ^ C
  context:
    - open BabaiSeressConjectures
  definitions:
    - name: BabaiSeressConjectures.groupDiam
      kind: def
      text: |-
        /-- The diameter of a finite group $G$, defined as the maximum diameter of the Cayley graphs
        $\Gamma(G, A)$ over all generating sets $A$ of $G$.
        -/
        noncomputable def groupDiam (G : Type*) [Group G] [Fintype G] : ℕ :=
          sSup { d : ℕ | ∃ S : Set G, Subgroup.closure S = ⊤ ∧ (cayleyGraph S).diam = d }
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/DiameterSimpleFiniteGroups.lean#L58
