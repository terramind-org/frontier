statement: (T. Kerler) [Extended and half-projective TQFT’s] (1) Describe in how far an ETQFT V with circle category C can diﬀer from V C, thus introducing a equivalence notion that would establis h a bijective correspondence between the class of ETQFT’s and the class of modular tensor categories. (2) Find an extended notion of half-projectivity that includes also surfaces that are both disconnected and have boundary. (3) Find constructions and axioms of ETQFT’s that apply to more r elaxed notions of boundedness or modularity. The functorAlg→ Cob • already imposes that a circle category C V must fulfill about all axioms of a modular tensor category, and contain a H opf algebra object with properties. Given some rigidity assumption it a ctually must be the same chosen in the construction of V C. What may still diﬀer is the choice of algebra structures of the same object in the same category, which is thus the main source of possible ambiguities. Already in [216] it is clear that there are several choices. The correct axiomatics for item (2) sho uld follow from a careful analysis of the double composition laws for surgery tangles from [216] and generalization of [210]. Item (3) is relevant to include more general notions of TQFT’s as they would be of interest in the theory of finite ty pe invariants. The Reshetikhin-Turaev theory typically starts with non-s emisimple modular categoryC, typically the representation category of a non-semisimpl e quantum groups Uq(g), and then considers a canonical semisimple sub-quotient C, see [208]. Thus VC yields a semisimple TQFT. It is known that this is diﬀerent from the non-semisimple TQFT VC, which in the case of a quantum group is obtained via the Hennings algorithm. TQFT’s can also be generated from a rigid, monoidal category B without any braiding. One way is to take the Drinfel’d double D(B), which is then a modular category for some choice of ribbon element, and use VD(B). For semisimple B one can also extract the 6j-symbol data and follow the Turaev -Viro construction to obtain a TQFT WB.
