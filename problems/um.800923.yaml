title: Open Problems and Questions about Geodesics — Conjecture 3 (Long)
field: mathematics
tier: prose
statement: |-
  \begin{con}[Long] *The existence of one hyperbolic prime closed geodesic on a Finsler
  $S^2$ implies the existence of infinitely
  many distinct prime closed geodesics.* \end{con}

  *Every Finsler $S^2$ has at least one elliptic prime closed geodesic.*
