lean:
  module: FormalConjectures.OEIS.«110835»
  decl: OeisA110835.conjecture
  statement: "theorem conjecture : ∀ n > 0, a n ≥ n"
  context:
    - open OeisA110835
    - open Nat Set
  definitions:
    - name: OeisA110835.a
      kind: def
      text: |-
        /--
        The primary defining sequence `a`.
        $a(n)$ is the smallest $m > 0$ such that there are no primes between $n \cdot m$
        and $n \cdot (m+1)$ inclusive.
        -/
        noncomputable def a (n : ℕ) : ℕ :=
          let IsPrimeFreeInterval (m : ℕ) : Prop :=
            ∀ p : ℕ, p.Prime → ¬ (n * m ≤ p ∧ p ≤ n * (m + 1))
          let s : Set ℕ := {m : ℕ | m > 0 ∧ IsPrimeFreeInterval m}
          sInf s
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/110835.lean#L35
