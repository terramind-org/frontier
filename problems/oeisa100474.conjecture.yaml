  module: FormalConjectures.OEIS.«100474»
  decl: OeisA100474.conjecture
  statement: "theorem conjecture : ∃ n > 2, (a n).Prime"
  context:
    - open OeisA100474
  definitions:
    - name: OeisA100474.a
      kind: def
      text: |-
        /-- The primary defining sequence `a`. -/
        noncomputable def a : ℕ → ℕ
          | 0 => 0
          | 1 => 1
          | n + 2 =>
            (Finset.Ico (triangular (n + 1) - 1) (triangular (n + 2) - 1)).prod (Nat.nth Nat.Prime) -
              a (n + 1)
