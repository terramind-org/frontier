title: Stability of Noncollapsing Manifold Submetries
field: mathematics
tier: prose
statement: Let $P_i:M_i\to Y_i$ be manifold submetries, with compact $M_i$ of uniformly bounded geometry, converging without collapse to a submetry $P:M\to Y$. Are $P_i$ and $P_j$, for all sufficiently large $i,j$, equivalent up to homeomorphisms of their source and target spaces?
