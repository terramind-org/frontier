statement: Generalize Vinberg’s ﬁniteness theorem for reﬂection groups to complex-hyperbolic reﬂection groups, i.e., prove that there exists a number N such that for n ≥ N, there are no lattices in P U(n, 1) which are generated by reﬂections.
