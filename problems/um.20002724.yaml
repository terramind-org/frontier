title: "Generalized cluster complexes: solved topology and a simplicial thickening obstruction"
field: mathematics
tier: prose
statement: |-
  **Problem 6.3. (S. Fomin)** Conjecture: The Fomin--Reading generalization
  of the associahedron \(\Delta_W^{(k)}\) (see Problem 1.3) is
  Cohen--Macaulay, and is homotopy equivalent to a wedge of
  \[
  \operatorname{Cat}^{(k-1)}(W)
  =\prod_{i=1}^{n}\frac{(k-1)h+e_i+1}{e_i+1}
  \]
  spheres. This has been proved by Eleni Tzanaki in types \(A\) and \(B\)
  using shelling methods [51]. Moreover, \(\Delta_W^{(k)}\) seems to be the
  skeleton of a polytopal manifold. Can this be realized geometrically?
  (This generalizes Problem 6.1 above.)

  **Remark (V. Reiner).** Is the Fomin--Reading complex
  \(k\)-Cohen--Macaulay in the sense of Baclawski?
