title: Problem 10.4 — (M.
field: mathematics
tier: prose
statement: (M. Polyak) Define an invariant λ of a pair (M, σ) of a closed 3-manifold M and a spin structure σ on M such that λCWL(M ) = ∑ σ λ(M, σ) for any closed 3-manifold M, where the sum runs over all spin structures σ on M. Note that the set of spin structures on M is a torsor over H 1(M; Z/2Z) in the sense that diﬀerences of spin structures can be detected by cohomology classes in H 1(M; Z/2Z), while the set of spin c structures on M is a torsor over H 1(M; Z) in a similar sense.
