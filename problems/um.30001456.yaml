title: Asymptotic Counts of Periodic Rational Polygon Billiards
field: mathematics
tier: prose
statement: For every rational polygon $P$, does $\lim_{L\to\infty}N(P,L)/L^2$ exist, where $N(P,L)$ counts combinatorially distinct periodic billiard orbits of length at most $L$?
