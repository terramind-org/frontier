title: Existential Completeness in Triangle-Free Graphs
field: mathematics
tier: prose
statement: A triangle-free graph is $k$-existentially complete if, for every independent set $A$ and disjoint set $B$ with $|A|+|B|\leq k$, there is a vertex adjacent to every vertex of $A$ and to no vertex of $B$. Is there a constant $r$ such that no triangle-free graph is $r$-existentially complete?
