statement: For the cofilling profile $\phi_d(\alpha)$ defined from minimal d-uniform systems and their coboundaries, is the upper bound $\phi_d(\alpha)\leq\frac{d}{d+1}\alpha$ optimal, and is the corresponding extremal example essentially unique?
