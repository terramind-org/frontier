title: Foliations and Diffeomorphism Groups — Question 64 (Hurder-Vogt [hurder1993product,hurder2005problem,langevin1992list])
field: mathematics
tier: prose
statement: |-
  Consider the $\bar\Gamma_q$-structure $\gamma$ on the manifold $SO(q)$
  whose microfoliation is the suspension of the canonical
  action of $SO(q)$ on $\mathbb{R}^q$. Is $\gamma$
  null-homotopic in $B\bar\Gamma_q$ ?
