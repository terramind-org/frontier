schema: 1
id: oeisa217785.conjecture-4
title: Smallest integer $s > n$ such that $1 + 2s + 3s^2 + \dots + n s^{n-1}$ is prime (conjecture_4)
field: mathematics
tier: proof
statement: |-
  Conjecture: For $n \ge 1$, the polynomial $s_n(x) = \sum_{k=0}^n (k+1) x^k$ is
  reducible modulo every prime if and only if $n$ has the form $8k(k+1)$ where $k$ is a
  positive integer.
