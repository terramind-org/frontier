lean:
  module: FormalConjectures.OEIS.«217785»
  decl: OeisA217785.conjecture_4
  statement: |-
    theorem conjecture_4 (n : ℕ) (hn : 1 ≤ n) :
        (∀ p : ℕ, p.Prime → ¬ Irreducible (Polynomial.map (Int.castRingHom (ZMod p)) (polyS n))) ↔
          ∃ k : ℕ, 0 < k ∧ n = 8 * k * (k + 1)
  context:
    - open OeisA217785
  definitions:
    - name: OeisA217785.polyS
      kind: def
      text: |-
        /-- The polynomial $s_n(x) = \sum_{k=0}^n (k+1) x^k$ over $\mathbb{Z}[x]$. -/
        noncomputable def polyS (n : ℕ) : Polynomial ℤ :=
          ∑ k ∈ Finset.range (n + 1), Polynomial.C (k + 1 : ℤ) * Polynomial.X ^ k
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/217785.lean#L92
