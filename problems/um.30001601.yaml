title: Expected Dimensions of Equisingular Plane-Curve Systems
field: mathematics
tier: prose
statement: For equisingular types $S_1,\ldots,S_r$ with three largest associated multiplicities $m_1,m_2,m_3$, and a general proximity-compatible blowup $\pi:X\to\mathbb{P}^{2}$, is it true that, for every $d\geq m_1+m_2+m_3$, one has $\dim\left|d\pi^{*}L-\sum_{i,j}(\operatorname{mult}_{p_{ij}}S_i)E_{ij}\right|=\max\left\{-1,\binom{d+2}{2}-C(S_1,\ldots,S_r)-1\right\}$?
