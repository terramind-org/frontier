statement: "(Hempel) Consider a simplicial polyhedra with fixed combinatorics in \\(\\mathbb R^3\\). Question: characterize those collections of dihedral angles and face angles that can be realized by a polyhedron with these combinatorics. Conjecture: dimension = \\(E-1\\), where \\(E\\) is the number of edges. Needs more clarification."
