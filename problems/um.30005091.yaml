title: Sharp Linear-Programming Bounds for Sphere Packing
field: mathematics
tier: prose
statement: |-
  Does the Cohn–Elkies linear-programming method yield an asymptotic sphere-packing upper bound
  $$
  2^{-(\lambda+o(1))n}
  $$
  for some $0.604<\lambda<0.605$? Is the strengthened three-point lattice bound sharp in dimension $4$?
