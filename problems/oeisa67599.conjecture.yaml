lean:
  module: FormalConjectures.OEIS.«67599»
  decl: OeisA67599.conjecture
  statement: |-
    theorem conjecture :
        ∃ n : ℕ, 2 ≤ n ∧ a n = n
  context:
    - open OeisA67599
  definitions:
    - name: OeisA67599.a
      kind: def
      text: |-
        /-- Decimal encoding of the prime factorization of $n$. -/
        def a (n : ℕ) : ℕ :=
          if n < 2 then 0
          else
            let factors : List ℕ := n.primeFactorsList.dedup
            let flat_list : List ℕ := factors.flatMap fun p ↦ [p, n.primeFactorsList.count p]
            flat_list.foldl concatenateNats 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/OEIS/67599.lean#L39
