lean:
  module: FormalConjectures.Wikipedia.SurjunctiveGroup
  decl: GottschalkSurjunctivity.gottschalk_surjunctivity_conjecture
  statement: |-
    theorem gottschalk_surjunctivity_conjecture :
        ¬ ∀ (G : Type) [Group G], IsSurjunctive G
  context:
    - open GottschalkSurjunctivity
    - "variable (G : Type*) [Group G]"
  definitions:
    - name: GottschalkSurjunctivity.IsSurjunctive
      kind: def
      text: |-
        /-- A group `G` is *surjunctive* if for every finite nonempty type `A`, every injective,
        continuous, shift-equivariant map `(G → A) → (G → A)` is also surjective.

        Continuity is with respect to the product topology on `G → A` where `A` carries the
        discrete topology. -/
        def IsSurjunctive : Prop :=
          ∀ (A : Type) [Fintype A] [Nonempty A] [TopologicalSpace A] [DiscreteTopology A]
            (τ : (G → A) → (G → A)),
            Continuous τ →
            IsShiftEquivariant G τ →
            Function.Injective τ →
            Function.Surjective τ
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/SurjunctiveGroup.lean#L75
