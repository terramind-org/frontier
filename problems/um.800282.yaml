title: Several Complex Variables Problem List — Problem 82
field: mathematics
tier: prose
statement: |-
  **(New) (Liouville type assertion on CR 3-manifolds) On a CR 3-manifold
  one can always define a Carnot-Caratheodory metric. A homeomorphism between
  two strongly pseudoconvex CR 3-manifolds is called conformal if it maps
  infinitesimal spheres with respect to a Carnot-Caratheodory metric to
  infinitesimal spheres. Is a conformal homeomorphism CR? \\
  -Puqi Tang, tang@math.purdue.edu**
