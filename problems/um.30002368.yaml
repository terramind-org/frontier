title: Geometric Decomposition from Long-Time Ricci Flow
field: mathematics
tier: prose
statement: For a Ricci flow with surgery on a closed $3$-manifold that exists for all sufficiently large times, determine whether and how its behavior as $t\to\infty$ realizes the full geometric decomposition of the manifold.
