statement: |-
  \section{Zeeman’s Interval-Product Collapse Conjecture}\label{statement}


  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Unless a section says otherwise, $\N=\{1,2,\ldots\}$,
  $\Z$ is the ring of integers, $\Q,\R,\C$ are the rational, real, and complex
  fields, $[N]=\{1,\ldots,\lfloor N\rfloor\}$, and $\log$ is the natural
  logarithm. For real functions of a parameter tending to infinity,
  $f\ll g$ and $f=O(g)$ mean $|f|\leq Cg$ eventually for some fixed $C$;
  $f\gg g$ reverses this comparison; $f=o(g)$ means $f/g\to0$;
  $f\sim g$ means $f/g\to1$; and $f\asymp g$ means both order bounds.
  A subscript on $O$ or $\ll$ specifies allowed constant dependence.
  The expression $n^{o(1)}$ in an upper bound means growth smaller than
  $n^\epsilon$ for each fixed $\epsilon>0$. Local definitions govern any
  exception, finite-field convention, or use of the same symbol for another
  object. An asymptotic claim is not automatically an effective algorithm.



  A finite complex is contractible if its identity map is homotopic to a constant map. An elementary collapse removes a cell together with a free face, and collapsibility means a finite sequence of such removals reaches one vertex. The standard polyhedral formulation allows a suitable triangulation or subdivision of the product with an interval. Contractibility alone does not supply such a collapse sequence. \sref{statement}{1} \sref{statement}{2}

  \paragraph{Statement recorded in the supplied source.}
  Is $K \times [0,1]$ collapsible for every finite contractible 2-dimensional CW complex K? \sref{statement}{1}

  \paragraph{Scope and interpretation.}

  The supplied record says CW complex. The elementary-collapse convention is the standard finite polyhedral/simplicial one in the cited formulation; no claim is made for arbitrary nonregular cell attachments without specifying a compatible collapse model. \sref{statement}{1}

  \subsection{Short English statement}

  Does multiplying a finite contractible two-dimensional complex by an interval always make it collapsible?

