title: Model Theory and Analysis of Surreal Exponential Fields
field: mathematics
tier: prose
statement: For the logarithmic-exponential series field $\mathbb{T}$ with derivation $\partial$ and exponential map, is $(\mathbb{T},\partial,\exp)$ elementarily equivalent to $(\mathbf{No},\partial,\exp)$, and can every Hardy field closed under exponentiation be embedded in it? Can sine and cosine be defined on $\mathbf{No}$, can exponentiation be extended to $\mathbf{No}[i]$, and does $(\mathbf{No},+,\times,\exp,\widehat f)_{f\in\mathbb{R}\langle\omega\rangle}$ satisfy an intermediate-value property?
