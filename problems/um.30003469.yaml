title: Maximum Diameters of Lattice Polytopes in Cubes
field: mathematics
tier: prose
statement: For positive integers $d$ and $k$, let $\delta(d,k)$ be the largest diameter of a lattice polytope contained in $[0,k]^d$. Is this maximum, up to translation, attained by a Minkowski sum of lattice vectors? In particular, when $k<2d$, is $$\delta(d,k)=\left\lfloor\frac{(k+1)d}{2}\right\rfloor$$?
