title: Linear-Extension Wins and Poset Variance
field: mathematics
tier: prose
statement: Let $P$ be an $n$-element poset and let $\operatorname{win}(x)$ and $\sigma^2(x)$ denote the win statistic and rank variance of an element $x$. Is $\operatorname{win}(x)=\Omega(\sigma^2(x)/n)$ for every $P$ and $x$?
