statement: "[Bounded Distortion Conjecture] Given a hyperbolic structure on F, associate its combinatorial invariant, namely, an ideal cell decomposition of F together with the projective simplicial coordinate assigned to each edge. Take these projective simplicial coordinates as Strebel coordinates on the dual fatgraph to build a conformal structure on F. The underlying map on Teichm¨ uller space is of bounded distortion in the Teichm¨ uller metric. As posed by Ed Witten to the author in the early 1990’s, a compelling problem at that time was to find an orbifold compactification of M(F ) which comes equipped with a cellular description in terms of suitably generalized fatgraphs. Calculations such as [16,19,22] and more might then be performed using matrix models derived from the combinatorics of this putative compactification. Perhaps the desired compactification was the Deligne-Mumford compactification or perhaps an- other one. The combinatorial compactification of the previous section fails to provide an orbifold but rather another stratified generalization of manifold. Guidance from Dennis Sullivan has recently led to the following solution:"
