title: Congruence Normality in Simplicial Arrangements
field: mathematics
tier: prose
statement: For simplicial arrangements, classify the congruence-normal ones; determine the relation between congruence normality and freeness; find useful arrangement-theoretic properties of the shard digraph; find the smallest number of hyperplanes in a tight arrangement that is not congruence normal; and determine the behavior of congruence normality under restrictions and other arrangement operations.
