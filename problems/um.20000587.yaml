title: A good-scale area-efficiency reduction for integrable lower metric distortion
field: mathematics
tier: prose
statement: |-
  The lower metric dilatation of a homeomorphism \(f:X\to Y\) of metric
  spaces is
  \[
  h_f(x)=\liminf_{r\to0}
  \frac{\sup\{d(f(x),f(y)):d(x,y)\le r\}}
  {\inf\{d(f(x),f(z)):d(x,z)\ge r\}}.
  \]
  Let \(f\) be a homeomorphism of planar domains with
  \(h_f\in L^1_{\mathrm{loc}}\) and \(h_f\) finite off a set of
  \(\sigma\)-finite length.  Does \(f\) have partial derivatives almost
  everywhere?
