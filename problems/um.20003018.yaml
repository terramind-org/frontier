title: Homology from the edge Hom complex
field: mathematics
tier: prose
statement: |-
  Homology theory for graphs with loops

  Is there a good homology theory for graphs with loops? How does it interact with homotopy groups of graphs with loops (which also need to be defined). Does it satisfy a variant Eilenberg-Steenrod axioms?

  One approach discussed during the workshop was to take homology of $Hom(K_2, X)$.
