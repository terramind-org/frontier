title: Rotation-, translation-, scale-, and Markov-invariant random tilings
field: mathematics
tier: prose
statement: Does there exist a mixing random tiling of the Euclidean plane whose law is invariant under rotations and translations, is stationary under a local clustering-and-rescaling operation, and has a spatial Markov property in which a tile does not reveal the tiling of its complement along its boundary?
