title: Malle-Type Asymptotics for Refined Cover Counts
field: mathematics
tier: prose
statement: For a countable transitive subgroup $G\leq S_n$ and a conjugation-invariant subset $c\subseteq G$, does the refined function $N^c_{G,q}(X)$, counting geometrically connected $G$-covers with ramification monodromy in $c$, satisfy $N^c_{G,q}(X)\sim C X^a(\log X)^{b-1}$ for constants $a,b,C$ depending on $G$ and $c$?
