title: Surface Chromatic Width and Bounded-Facewidth Snarks
field: mathematics
tier: prose
statement: For every $g\geq0$, is $\chi_w(S_g)=4$? More strongly, if $G$ is embedded in $S_g$ and $\operatorname{ew}(G^*)\geq3$, must $\phi_c(G)=4$; equivalently, is every cubic graph embedded in $S_g$ with $\operatorname{fw}(G)\geq3$ three-edge-colorable? At least, for every $g$, does there exist $w$ such that every cubic graph embedded in $S_g$ with $\operatorname{ew}(G)\geq w$ is three-edge-colorable?
