title: Monochromatic Concatenations of Permutation Words
field: mathematics
tier: prose
statement: View $S_n$ as the permutations of $1,\ldots,n$, written as words with concatenation $xy$. Given $k$, does there exist $n$ such that every $k$-colouring of $S_n$ has words $x,y,z$ whose six concatenations $xyz,xzy,yxz,yzx,zxy,zyx$ are permutations in $S_n$ and all have the same colour?
