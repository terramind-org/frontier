  module: FormalConjectures.ErdosProblems.«963»
  decl: Erdos963.erdos_963.parts.ii
  statement: "theorem erdos_963.parts.ii : ∀ n : ℕ, 1 ≤ n → Nat.log 2 n ≤ f n"
  context:
    - open Erdos963
