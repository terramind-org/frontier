id: um.20002890
title: Exact monomial degree spectra and an obstruction to failed degree lowering
field: mathematics
tier: prose
statement: |-
  Let \(R:\mathbb B^n\to\mathbb B^N\), \(n\ge3\), be a rational proper mapping,
  \[
  R(z)=\frac{p(z)}{q(z)}.
  \]
  Let \(d=d_0(R)\) be the degree of \(R\).

  **Question 8a.** Is
  \[
  d\le \frac{N-1}{n-1}?
  \]
  **Question 8b.** Is this inequality true if one also assumes
  \[
  n\ge 2d^2+2d?
  \]
  Characterize all \(R\) for which equality holds.

  For monomial maps the answer to Question 8b is yes [DLP]. For \(n=2\), a proper monomial map has \(d\le2N-3\), sharply [DKR].

  A further question asks: if \(f:\mathbb B^n\to\mathbb B^N\) is proper, is rational, polynomial, or monomial, and \(d=d_0(f)>1\), must there be a proper \(g:\mathbb B^n\to\mathbb B^N\) in the corresponding class with \(d_0(g)=d_0(f)-1\)?
