title: Shimura Period Relations for Jacquet–Langlands Transfers
field: mathematics
tier: prose
statement: Let $F$ be totally real, let $f$ be a Hilbert newform, and let $f_B$ be its Jacquet–Langlands transfer. Do constants $c_v\in\mathbb C$, for $v\in\Sigma_\infty$, exist such that, as $B$ varies, $$\langle f_B,f_B\rangle\sim_{\overline{\mathbb Q}^\times}\prod_{\substack{v\in\Sigma_\infty\\v\nmid\operatorname{disc}(B)}}c_v$$?
