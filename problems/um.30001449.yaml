title: Character-Degree Criteria for Nilpotent Blocks
field: mathematics
tier: prose
statement: Let $G$ be a finite group and $B$ a $p$-block of $G$. Is $B$ nilpotent if and only if all height-zero character degrees in $B$ are equal?
