statement: For each level $r$, is there an isomorphism of $\mathbb Z_p[\operatorname{Gal}(F_r/\mathbb Q)]$-modules $$\nu_r:H^2_{\mathrm{et}}(\mathbb Z[\zeta_{p^r},1/p],\mathbb Z_p(2))^+\longrightarrow H_1(X_1(p^r);\mathbb Z_p)^+/I_r$$ sending the cup product $(1-\zeta_{p^r}^u,1-\zeta_{p^r}^v)_r^+$ to $\xi_r(u:v)^+$ modulo $I_r$?
