title: "Henon Maps: Open Problems — Conjecture 50"
field: mathematics
tier: prose
statement: |-
  Let $K$ be a number field, let $B\geq 1$, and let $d\geq 2$. Then, there exist an $\epsilon>0$ and constant $C$ (depending on these data) such that, as $f$ varies over generalized H\'{e}non maps of degree $d$ over $K$, the quantity
  \[\#\{P\in (\overline{K})^2 :[K(P):K]\leq B\text{ and }\hat{h}_f(P)<\epsilon h(f)+C\}\]
  is bounded uniformly, where $h(f)$ is the height of the tuple of coefficients of $f$.
