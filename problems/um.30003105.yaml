id: um.30003105
title: Fargues–Fontaine Hecke Eigensheaves for General Linear Groups
field: mathematics
tier: prose
statement: For a discrete Weil parameter $\varphi:W_{\mathbb{Q}_p}\to GL_n$, does there exist, up to shifts and twists, a sheaf $F_{\varphi}$ on $\operatorname{Bun}_{GL_n}$ in the Fargues–Fontaine setting whose Hecke transform is $F_{\varphi}\otimes\varphi$ and whose pullbacks to the basic points correspond to the local Langlands representations attached to $\varphi$?
