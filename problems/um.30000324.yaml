title: Finiteness of Log Rational Maps to Log-General-Type Varieties
field: mathematics
tier: prose
statement: Let $k$ be an algebraically closed field with a fine log structure, and let $(X,M_X)$ and $(Y,M_Y)$ be proper semistable log varieties smooth and integral over $(\operatorname{Spec}k,M_k)$, with $(Y,M_Y)$ of log general type. Are there only finitely many dominant separable log rational maps $(X,M_X)\dashrightarrow(Y,M_Y)$?
