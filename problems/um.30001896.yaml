title: Shift Chain Colorings and Disk Covering Paths
field: mathematics
tier: prose
statement: A shift-chain is a $k$-uniform hypergraph whose edges are comparable coordinatewise after their vertices are written in increasing order. Are all shift-chains 2-colorable for sufficiently large $k$? Separately, is there a constant $c$ such that every closed-unit-disc covering of the plane admits, between any two points at distance $d$, a path of length at most $\sqrt{2}\,d+c$ contained in the region covered at least twice?
