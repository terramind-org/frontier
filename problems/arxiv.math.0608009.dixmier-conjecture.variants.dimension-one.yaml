id: arxiv.math.0608009.dixmier-conjecture.variants.dimension-one
title: "The Dixmier Conjecture (variant: dimension_one)"
field: mathematics
tier: proof
statement: |-
  The Dixmier Conjecture in dimension $1$ — Problem 1 of [Dix68] — is open. By [AvdE07],
  Theorem 7, it is implied by $PC_1$, and hence by $JC_2$ (Keller's problem).
