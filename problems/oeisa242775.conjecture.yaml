  module: FormalConjectures.OEIS.«242775»
  decl: OeisA242775.conjecture
  statement: "theorem conjecture (n : ℕ) (hn : 4 ≤ n) : 0 < a n"
  context:
    - open OeisA242775
  definitions:
    - name: OeisA242775.a
      kind: def
      text: |-
        /-- Smallest $k \ge 1$ such that the concatenation of $k$ threes and $\text{prime}(n)$ is prime,
        or $0$ if no such prime exists. -/
        noncomputable def a (n : ℕ) : ℕ :=
          if n = 0 then 0
          else sInf {k : ℕ | 0 < k ∧ Nat.Prime (concatThrees k (Nat.nth Nat.Prime (n - 1)))}
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/242775.lean#L57
