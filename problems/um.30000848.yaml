title: Hopkins Conjecture for Morava-Stabilizer Subgroups
field: mathematics
tier: prose
statement: For every finite subgroup $G$ of the Morava stabilizer group $\mathbb{S}_n$, there should be a $G$-equivariant isomorphism $E_{n*}\cong S_{\mathbb{Z}_{p^n}}(M_n)[\Delta^{-1}]^{\wedge}_I$, where $S$ denotes the symmetric algebra, $M_n$ is placed in degree $-2$, $\Delta$ is the $G$-invariant class corresponding to the multiplicative norm over $G$ on $M_n$, and $I$ is an ideal in degree zero.
