title: Interpolation of Sobolev Extension Domains and Jacobian Signs
field: mathematics
tier: prose
statement: If $\Omega\subset\mathbb R^n$ is both a $W^{1,p}$- and a $W^{1,q}$-extension domain with $1\leq p<q\leq\infty$, must it be a $W^{1,r}$-extension domain for every $p<r<q$? Also, can a Sobolev homeomorphism $f:\Omega_1\to\Omega_2$ have $J_f>0$ on a set of positive measure and $J_f<0$ on a set of positive measure?
