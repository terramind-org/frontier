title: Uniform principal types and computable prime models
field: mathematics
tier: prose
statement: |-
  **1.10. Computable prime models (Andrews).**

  **Question 18 (Millar).** Let \(T\) be a decidable theory having countably many countable models. When must the prime model have a decidable presentation? (Note that \(\omega\)-stability suffices.)

  **Question 19.** Let \(T\) be a decidable theory having countably many countable models. What do we need to know to build a computable prime model of \(T\)? (Of course \(\omega\)-stability again suffices.)
