lean:
  module: FormalConjectures.Paper.BurningNumberConjecture
  decl: BurningNumberConjecture.burning_number_conjecture
  statement: |-
    theorem burning_number_conjecture {V : Type} [Fintype V] (G : SimpleGraph V)
        (hc : G.Connected) :
        burningNumber G ≤ ⌈Real.sqrt (Fintype.card V)⌉₊
  context:
    - open BurningNumberConjecture
    - "variable {V : Type*}"
  definitions:
    - name: BurningNumberConjecture.burningNumber
      kind: def
      text: |-
        /-- The **burning number** `b(G)`: the least number of rounds needed to burn every vertex
        of `G`. -/
        noncomputable def burningNumber (G : SimpleGraph V) : ℕ :=
          sInf {k | ∃ x : Fin k → V, IsBurningSequence G x}
