title: A local geometric certificate for minuscule birational rowmotion
field: mathematics
tier: prose
statement: |-
  Problem 4.2. Generalize Grinberg and Roby's proof of periodicity of birational rowmotion on rectangles uniformly to G/P.

  Grinberg and Roby's proof corresponds to the case when G = GL (n) and

  P is a maximal parabolic subgroup-their coordinates appear to be related to its Plücker embedding, which has generalizations for other quotients (see, for example, [Hil82, page 184] or [FZ00, Section 3.1]. When P is minuscule, this would be a birational generalization of [RS13]. See also [RSW04].
