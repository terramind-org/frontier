title: Elliptic-fiber brotherhood and a rational-homotopy obstruction
field: mathematics
tier: prose
statement: |-
  **Problem 11.** Consider finite towers of fiber bundles, where the fibers
  \(\{F_1,\ldots,F_k\}\) and \(M_k\) are fixed topological manifolds. Loosen this
  notion to get a “brotherhood” on the manifolds \(M_0\) and a property of such
  \(M_0\) not known to be possessed by all manifolds of
  \(\sec\ge K,\ \operatorname{diam}\le1\).
