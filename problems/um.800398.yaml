title: Open Problems in Arithmetic Dynamics — Question 21
field: mathematics
tier: prose
statement: |-
  Give criteria, in terms of an integer $d\ge2$ and the geometry of a
  portrait ${\mathcal{P}}$, that distinguish between the following two
  situations\textup:
  \begin{parts}

  (1)
  $\operatorname{\mathcal{G\!R}}_d^1[{\mathcal{P}}](K,S)/\operatorname{PGL}_2(R_S)$ is finite for all number fields $K$ and
  all finite sets of primes $S$.

  (2)
  $\operatorname{\mathcal{G\!R}}_d^1[{\mathcal{P}}](K,S)/\operatorname{PGL}_2(R_S)$ is infinite for some number fields $K$ and
  some finite sets of primes $S$.
  \end{parts}
