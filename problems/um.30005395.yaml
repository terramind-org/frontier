title: p-Adic Arithmetic Gan–Gross–Prasad Formula
field: mathematics
tier: prose
statement: Assume $\pi$ is tempered and ordinary at every $p$-adic place. For $\phi\in\pi_f$ and $\phi^\vee\in\pi_f^\vee$, prove, up to a nonzero explicit factor, $(\int_{\operatorname{Sh}(H)}\phi,\int_{\operatorname{Sh}(H)}\phi^\vee)_p=e_p(\pi)^{-1}L_p'(\tfrac12,\pi,R)\prod_v\alpha_v(\phi_v,\phi_v^\vee)$.
