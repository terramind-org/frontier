title: Generators and Support Loci of Bernstein–Sato Ideals
field: mathematics
tier: prose
statement: For $F=(f_1,\ldots,f_r):(\mathbb C^n,0)\to(\mathbb C^r,0)$, is the Bernstein–Sato ideal $B_F$ generated by products of linear polynomials $a_1s_1+\cdots+a_rs_r+b$, where $a_i\in\mathbb Q_{\geq0}$ and $b\in\mathbb Q_{>0}$? Is $\operatorname{Exp}(Z(B_F))$ equal to the cohomology-support locus $V_F$?
