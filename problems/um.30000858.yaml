title: Critical Exponents for High-Dimensional Bond Percolation
field: mathematics
tier: prose
statement: For independent bond percolation on $\mathbb Z^d$ with $d\geq2$, let $\theta(p)$ be the probability that the origin lies in an infinite cluster, let $\chi(p)$ be the susceptibility, and let $p_c=\inf\{p:\theta(p)>0\}=\sup\{p:\chi(p)<\infty\}$. Determine the critical and near-critical behavior around $p_c$, including the existence, values, and universality of the associated critical exponents.
