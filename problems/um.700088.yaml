title: Kourovka Notebook Problem 2.9
field: mathematics
tier: prose
statement: |-
  Do there exist regular associative operations on the
  class of groups satisfying the weakened Mal'cev condition (that is,
  monomorphisms of the factors of an arbitrary product can be glued together, generally
  speaking, into a homomorphism of the whole
  product), but not satisfying the analogous condition for
  epimorphisms of the factors?
