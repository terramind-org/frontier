title: The Mixed Littlewood Conjecture for Arbitrary Pseudo-Absolute Values
field: mathematics
tier: prose
statement: For every sequence $D=(d_i)_{i\in\mathbb N}$ with $d_i\geq2$ and every $x\in\mathbb R$, is $\liminf_{q\to\infty}q|q|_D\|qx\|=0$, where $|a|_D=\min\{D_n^{-1}:a\in D_n\mathbb Z\}$ and $D_n=\prod_{i=1}^n d_i$?
