title: Extremality Criteria for Positive-Characteristic Valued Fields
field: mathematics
tier: prose
statement: For a valued field $(K,v)$ of positive residue characteristic, with value group a $\mathbb Z$-group or with divisible value group and large imperfect residue field, is there a simple useful additional assumption ensuring that $(K,v)$ is extremal? More generally, is every maximal valued field with a $\mathbb Z$-group as value group, or with divisible value group and large residue field, extremal?
