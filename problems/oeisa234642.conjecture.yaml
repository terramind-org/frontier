  definitions:
    - name: OeisA234642.a
      kind: def
      text: |-
        /--
        Smallest $x$ such that $x \bmod \phi(x) = n$, or $0$ if no such $x$ exists.
        -/
        noncomputable def a (n : ℕ) : ℕ :=
          sInf {x : ℕ | ModTotientEq n x}
