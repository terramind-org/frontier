title: $\Gamma$-Limits for Vector-Valued Dislocation Phase Fields
field: mathematics
tier: prose
statement: Beyond kernels of the form $\Gamma(z)=|z|^{-3}\gamma(z/|z|)$ with bounded uniformly elliptic angular part, is the $\Gamma$-limit of the vector-valued dislocation phase-field energy the lower-semicontinuous envelope in $BV$ of $$F_{\mathrm{flat}}(u)=\int\gamma_0(\nu,[u])\,d\mathcal H^1$$?
