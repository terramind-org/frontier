title: Canonical indices, crepant centres, and an exact quotient-family calibration
field: mathematics
tier: prose
statement: |-
  **1. (Shokurov)** Fix \(n\) and consider projective varieties \(X\) with an exact canonical singularity of dimension \(n\). Is the index of \(K_X\) at the singularity bounded? What about the case \(\dim X=3\)? More generally, for a fixed minimal log discrepancy of \((X,0)\), is the index of \(K_X\) at any point with such an mld, bounded?

  Fix \(n\) and consider projective varieties \(X\) with **strictly canonical singularities** of dimension \(n\). Is the index of \(K_X\) bounded?
