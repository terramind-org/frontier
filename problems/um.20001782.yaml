id: um.20001782
title: Element-order reduction and short-span bounds for Delone cluster groups
field: mathematics
tier: prose
statement: |-
  For $d \ge 4$, given a Delone set $(R,r)$ for which all $2R$- clusters are pairwise congruent, find upper bound on the order of the symmetry group of the clusters which does not depend on $R/r$.

  **Recovered Group Order Problem.** Let $X\subset\mathbb R^d$, $d\geq 4$, be a Delone set with exact packing and covering parameters $(r,R)$.  Suppose that $X$ is $2R$-regular: for every $x,x'\in X$ there is an ambient Euclidean isometry taking $x$ to $x'$ and
  \[
   C_x(2R):=X\cap B_x(2R)
   \quad\text{to}\quad
   C_{x'}(2R).
  \]
  For
  \[
   S_x(2R):=\{g\in\operatorname{Iso}(\mathbb R^d):g(x)=x,
                   \ g(C_x(2R))=C_x(2R)\},
  \]
  find a number $h_d$, depending only on $d$, such that
  $|S_x(2R)|\leq h_d$.
