title: Morava K- and E-theory 4 — As a rule, I am not happy about the arbitrary nature of some of the constructions in the K(n)-local ca…
field: mathematics
tier: prose
statement: As a rule, I am not happy about the arbitrary nature of some of the constructions in the K(n)-local category. Consider the spectral sequence, for example, which relates the continuous cohomology of S with coefficients in pi_*(L_K(n) (E smash X)) to pi_* L_K(n) X, for example. The usual construction of this is to take the Adams-Novikov spectral sequence for E smash X smash a type n, and then take an inverse limit. I have never liked this, and it certainly only works for dualizable X. Is there some more natural construction? I have the same objection to the more general Devinatz-Hopkins construction of fixed point spectra designed to yield a spectral sequence starting with continuous cohomology rather than discrete cohomology.
