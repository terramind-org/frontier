title: Sharp Bounds for Halton–Kronecker Sequence Discrepancy
field: mathematics
tier: prose
statement: |-
  Does the discrepancy $D_N$ of the two-dimensional Halton–Kronecker sequence

  $$z_n=(\phi_2(n),\{n\sqrt2\}),\qquad n\geq0,$$

  where $\phi_2$ is the base-$2$ van der Corput sequence, satisfy $D_N=O((\log N)^{2+\varepsilon}/N)$ for every $\varepsilon>0$?
