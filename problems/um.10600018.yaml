title: Virtual-knot problem 18 — Wild Virtuals
field: mathematics
tier: prose
statement: |-
  Wild Virtuals: Create the category of “wild virtual knots”
  and establish its axiomatics. In particular, one needs a theorem
  that states when a wild equivalence of tame virtual links implies a
  tame equivalence of these links.
