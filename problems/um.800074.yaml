title: Foliations and Diffeomorphism Groups — Question 15
field: mathematics
tier: prose
statement: |-
  I would like to conquer some doubt on Palmeira's theorem for foliation by planes $\mathcal{F}$ of $\mathbb{R}^3$.
  In his paper there is a proposition saying that an infinite braid can be extended as an isotopy of plane, which has counter-examples. This is used to show that the leaf space determines the foliation.

  Find an alternative argument.
