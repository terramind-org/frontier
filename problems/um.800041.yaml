title: The Lyapin's Notebook — Problem 43
field: mathematics
tier: prose
statement: |-
  (G. Mashevitzky)
  Find semigroups from the basic classes of semigroups determined by their identical inclusions up to isomorphism.

  Two-element semilattice ([L1]), quasicyclic groups ([BM]) and any finite group ([M2]) are determined by identical inclusions up to isomorphism.
