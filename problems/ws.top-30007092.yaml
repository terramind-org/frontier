  \section*{Power improvement over exponent two in Heilbronn triangle constructions}\label{30007092}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Do absolute $\eta ,c>0$ exist such that for every sufficiently large n there is a set of n points in the unit square for which every triangle has area at least c $n^{-2+\eta }$?
  \subsection{Short English statement}
  Do absolute $\eta ,c>0$ exist such that for every sufficiently large n there is a set of n points in the unit square for which every triangle has area at least c $n^{-2+\eta }$?
