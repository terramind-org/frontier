schema: 1
id: grh.generalized-riemann-hypothesis
title: Riemann Hypothesis and its generalizations (generalized_riemann_hypothesis)
field: mathematics
tier: proof
statement: |-
  The **Generalized Riemann Hypothesis** asserts that all the non-trivial zeros of the
  Dirichlet $L$-function $L(\chi, s)$ of a primitive Dirichlet character $\chi$ have real part
  $\frac{1}{2}$.
