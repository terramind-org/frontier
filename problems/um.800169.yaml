title: Moments of L-functions — Moments of the Riemann zeta function — Problem 19
field: mathematics
tier: prose
statement: |-
  Use the recent work of Humphries-Khan [HK] to compute weight aspect upper bounds for the 6th moment of $L(\frac12,f\otimes g)$ where $f$ and $g$ vary over the set of primitive forms of level 1 and weights $k$ and $\ell$ respectively, with $|k-\ell|=O(1)$ and $K<k+\ell\leq2K$.\\
  (Alia Hamieh, UNBC)
