title: List-Labeling Equality for Trees
field: mathematics
tier: prose
statement: For a graph $G$, let $\chi^{2,1}(G)$ denote the $L(2,1)$-labeling span (where adjacent vertices receive colors at distance at least $2$ and vertices at graph distance $2$ receive distinct colors), and let $\chi^{2,1}_\ell(G)$ denote the corresponding list $L(2,1)$-labeling number. For every tree $T$, does $\chi^{2,1}_\ell(T) = \chi^{2,1}(T)$ hold?
