lean:
  module: FormalConjectures.OEIS.«280864»
  decl: OeisA280864.conjecture
  statement: |-
    theorem conjecture :
        ∃ a : ℕ → ℕ, FollowsRule a ∧ ∀ k > 0, ∃ n, a n = k
  context:
    - open OeisA280864
  definitions:
    - name: OeisA280864.FollowsRule
      kind: def
      text: |-
        /-- A total sequence obeys the initial conditions and every subsequent greedy step. -/
        def FollowsRule (a : ℕ → ℕ) : Prop :=
          a 0 = 1 ∧ a 1 = 2 ∧ ∀ n, 2 ≤ n → GreedyAt a n
