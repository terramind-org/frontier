title: Erdős Problem 385 (ii)
field: mathematics
tier: proof
statement: |-
  Let $F(n) := \max\{m + p(m) \mid m < n \textrm{ composite}\}$ where $p(m)$ is the least
  prime divisor of $m$. Does $F(n) - n \to \infty$ as $n\to\infty$?
