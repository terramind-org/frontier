title: Optimal vector balancing extends from zonotopes to all zonoids
field: mathematics
tier: prose
statement: |-
  **Problem 5 (G. Schechtman).** A theorem of Spencer states that if
  \(\{X_i\}_{i=1}^n\) are in \(B_\infty^n\), then
  \[
  \min_{\varepsilon_i\in\{-1,1\}}
  \left\|\sum_{i=1}^n\varepsilon_iX_i\right\|_\infty
  \leq C\sqrt n.
  \]
  Does the same hold for any \(n\)-dimensional zonoid? That is, does there
  exist a universal constant \(C\) such that for every \(n\)-dimensional
  centered zonoid \(Z\), if \(X_1,\ldots,X_n\in Z\), then there are signs
  \(\varepsilon_1,\ldots,\varepsilon_n\) with
  \[
  \sum_{i=1}^n\varepsilon_iX_i\in C\sqrt n\,Z?
  \]
  If one can remove the logarithmic factor in Problem 4, then the answer is
  positive. As stated in the 2007 list, the best known substitute for
  \(C\sqrt n\) was \(C\sqrt n\log\log n\).
