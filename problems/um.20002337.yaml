title: Stability, hereditary containment, and the exponent quantifier
field: mathematics
tier: prose
statement: |-
  Is there a notion of "explicitly defined norm" such that every Banach space with an explicitly defined norm hereditarily contains an \(\ell_p\) space?

  Problem 28 reads:

  It is followed by the background sentence saying that the working group on Definable Norms and Stable Banach Spaces studied the subject. The sentence beginning "29. Study asymtotic cones" is the next, independent problem and is not part of Problem 28.

  The only corrections made here are typographical: "explictly" is read as "explicitly," and "lp" as the standard sequence space \(\ell_p\). Thus the recovered question is:

  The historical working-group report makes the motivation more precise but also exposes two ambiguities. It asks for model-theoretic conditions on a separable infinite-dimensional Banach space \(X\) which ensure that every infinite-dimensional subspace contains one of the classical sequence spaces \(\ell_p\) or \(c_0\). The printed Problem 28 mentions only \(\ell_p\). Neither source says whether the same exponent \(p\) must work in all subspaces, nor whether "contains" means an isomorphic copy, an almost-isometric copy, or finite representability.
