title: Research Problems in Function Theory — Problem 1.5
field: mathematics
tier: prose
statement: Under what conditions can $\sum\delta(a,f)$ be nearly $2$ for an entire function of finite order $\rho$? Pfluger proved that if $\sum\delta(a,f)=2$, then (see Hayman ) $\rho$ is a positive integer $q$, the lower order $\lambda$ is such that $\lambda=\rho$ and all the deficiencies are integral multiplicities of $1/q$. If further \[\sum\delta(a,f)>2-\varepsilon(\lambda),\] where $\varepsilon(\lambda)$ is a positive quantity depending on $\lambda$, then Edrei and Fuchs (, ) proved that these results remain true `nearly', in the sense that there exist `large' deficiencies which are nearly positive integral multiplicities of $1/q$, and whose sum of deficiencies is `nearly' $2$. Can there be a finite or infinite number of small deficiences as well in this case?
