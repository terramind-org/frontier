title: Resolving the average in DeVos's ordered-label conjecture
field: mathematics
tier: prose
statement: |-
  Conjecture 6.10. (Devos) Under the hypotheses of

  **Conjecture 6.10 (DeVos).** Under the hypotheses of Conjecture 6.1, if there is no rainbow cycle in $G$ with strictly increasing edge labels, then the average number of vertices reachable from a fixed vertex $v$ by label-increasing (possibly trivial) paths is at least
  \[
  1+\sum_{i=1}^k\delta^+_{G_i}.
  \]
  **Note.** This can be proved when $G_i=\operatorname{Cayley}(\Gamma,A_i)$ for some group $\Gamma$, using Lemma 5.9.
