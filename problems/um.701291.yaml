title: Kourovka Notebook Problem 16.100
field: mathematics
tier: prose
statement: |-
  Is there an (infinite) 2-generator
  simple group $G$ such that $\mathrm{Aut} F_2$ is transitive on the
  set of normal subgroups $N$ of the free group $F_2$ such that
  $F_2/N\cong G$? Cf. 6.45.
