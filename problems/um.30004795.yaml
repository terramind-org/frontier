title: Root Numbers and Central Characters of Langlands Parameters
field: mathematics
tier: prose
statement: Let $k$ be a non-Archimedean local field, let $G$ be a reductive $k$-group, and let $\phi$ be the Langlands parameter of an essentially discrete-series representation of $G(k)$. Prove that $\frac{\omega(\operatorname{Ad}_G\circ\phi)}{\omega(\operatorname{Ad}_G\circ\phi_{\operatorname{prin}})}=\chi_\phi(z_{\operatorname{Ad}_G})$, where $\phi_{\operatorname{prin}}$ is the principal parameter, $z_{\operatorname{Ad}_G}$ is the associated central involution, and $\chi_\phi$ is the central character attached to $\phi$.
