lean:
  module: FormalConjectures.OEIS.«215926»
  decl: OeisA215926.conjecture_2
  statement: |-
    theorem conjecture_2 (m : ℕ) (hm : 1 ≤ m) :
        IsLeast {n : ℕ | 2 ≤ n ∧ a n = 2 ^ m} (nextPrimeTwoPow m)
  context:
    - open OeisA215926
  definitions:
    - name: OeisA215926.a
      kind: def
      text: |-
        /-- Smallest deficient number $k$ such that $k \cdot n$ is non-deficient (perfect or abundant). -/
        noncomputable def a (n : ℕ) : ℕ :=
          sInf {k : ℕ | k.Deficient ∧ ((k * n).Perfect ∨ (k * n).Abundant)}
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/215926.lean#L34
    - name: OeisA215926.nextPrimeTwoPow
      kind: def
      text: |-
        /-- The smallest prime strictly greater than $2^m$ ([A014210](https://oeis.org/A014210)). -/
        noncomputable def nextPrimeTwoPow (m : ℕ) : ℕ :=
          sInf {p : ℕ | 2 ^ m < p ∧ p.Prime}
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/OEIS/215926.lean#L58
