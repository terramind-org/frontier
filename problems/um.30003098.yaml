title: Gorenstein Secants, Normal Ball Polytopes, and Gradient Images
field: mathematics
tier: prose
statement: Is the affine cone over the second secant variety of $(P^1)^5$ Gorenstein? Is the convex hull of all lattice points in any ball a normal polytope? For a homogeneous polynomial $f$ in $n+1$ variables and a generic subspace $L$ of $P^n$, is $L^\perp$ intersected with the gradient image of $L$ empty?
