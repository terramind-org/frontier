title: "Henon Maps: Open Problems — Question 23"
field: mathematics
tier: prose
statement: |-
  Let us now suppose that $f$ is a real surface automorphism. In other words, we suppose $X$ to be projective and defined by real polynomial equations,
  and $f$ to be also defined over the real numbers.
  We may thus consider the restriction map $f_\mathbb{R}$ to the set of real points $X_\mathbb{R}$.
  Observe that $h_{\mathrm top} (f_\mathbb{R})\le \log \lambda$. It was proved in
  [BS8] that for generalized H\'enon maps $h_{\mathrm top} (f_\mathbb{R})= \log \lambda$ implies $f$ to be
  quasi-hyperbolic.

  If $f$ is a real surface automorphism such that the entropy of $f_\mathbb{R}$ is the same as the entropy of $f$, does it follow that $f$ is quasi-hyperbolic?
