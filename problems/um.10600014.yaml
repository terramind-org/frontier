title: Virtual-knot problem 14 — Brauer algebra
field: mathematics
tier: prose
statement: |-
  Brauer algebra: The appropriate domain for the virtual
  recoupling theory is to place the Jones–Wenzl projectors in the
  Brauer algebra. That is, when we add virtual crossings to the
  Temperley–Lieb Algebra to obtain “Virtual Temperley–Lieb
  Algebra” the result is the Brauer algebra of all connections from
  $n$ points to $n$ points (see ). What is the structure
  of the projectors in this context? Can a useful algebraic
  generalization of the classical recoupling theory be formulated?
