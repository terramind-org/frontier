title: Open Problems in Arithmetic Dynamics — Conjecture 13
field: mathematics
tier: prose
statement: |-
  [Ghioca--Tucker--Zhang, 2011, {[MR2854724, Conjecture 2.4]}]

  Let $X/\mathbb{C}$ be a projective variety, let $f: X \to X$ be a polarizable
  endomorphism, and let $Y$ be a
  subvariety of $X$ which has no component contained entirely within the singular
  locus of $X$. Then the following are equivalent\textup:
  \begin{parts}

  (a)
  $Y$ is preperiodic under $f$.

  (b)
  The intersection $Y\cap \operatorname{PrePer}_{f}(X)$ contains a Zariski dense
  subset of smooth points such that for every $x$ in the subset, the
  tangent subspace of $Y$ at $x$ is preperiodic under the induced
  action of $f$ on the
  Grassmanian $\operatorname{Gr}_{\dim(Y)}\left(T_{X,x}\right)$, where
  we write $T_{X,x}$ for the tangent space of $X$ at the point $x$.
  \end{parts}
