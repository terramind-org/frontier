statement: |-
  \section*{Depth-five homogeneous lower bounds for iterated matrix multiplication}\label{30007460}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must every syntactically homogeneous depth-five $\Sigma \Pi \Sigma \Pi \Sigma $ circuit over C computing the (1,1) entry of a product of n independent n×n variable matrices have size at least $n^{c\surd n}$ for some $c>0$ and all sufficiently large n?
  \subsection{Short English statement}
  Must every syntactically homogeneous depth-five $\Sigma \Pi \Sigma \Pi \Sigma $ circuit over C computing the (1,1) entry of a product of n independent n×n variable matrices have size at least $n^{c\surd n}$ for some $c>0$ and all sufficiently large n?
