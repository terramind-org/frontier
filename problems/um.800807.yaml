title: Geometric Hydrodynamics in Open Problems — Problem 6
field: mathematics
tier: prose
statement: |-
  In all other cases the metric is neither left- nor right-invariant. It would be interesting to investigate this system
  for generic $S$ and $\rho(\omega)$. It would also be of interest to define and study a model system
  where the configuration space is $SL(2)$, since this group looks more ``liquid-like".
  A similar question about possible fluid models is very intriguing.

  Describe a model for an $L^2$ \mathrm{left-invariant metric} on the group $\mathscr{D}_\mu(M)$.
  Are there any interesting physical systems demonstrating that type of invariance?
