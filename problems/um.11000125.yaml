statement: . Is κ2i = 0 in H ∗(BT∞; Q)? Very little is known about the cohomology of the Torelli group past dimension 1, and as far as I know it might be possible (although hard to believe) that BT∞→ hofiber(BΓ+ ∞→B Sp(Z)+) (5) is identically zero on cohomology. The calculations in [ 4] show that H ∗(BΓ∞; Z) contains a wealth of torsion classes and that there are torsion classes of any order. Some of these classes might be of interest in other areas of mathematics. But the diﬃculty is that the description of torsion classes from [ 4] is indirect and complicated, and very hard to communicate to non-specialists.
