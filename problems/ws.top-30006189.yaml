  \section{Low-Temperature Order in Quantum Heisenberg Ferromagnets}\label{30006189}
  {\small UnsolvedMath ID 30006189 · Mathematical Physics}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For the short-range quantum Heisenberg ferromagnet in dimension $d\geq 3$, prove that sufficiently low temperature produces long-range order; specifically, prove that $\lim_{\Lambda\nearrow\mathbb{Z}^d}|\Lambda|^{-2}\sum_{x,y\in\Lambda}\langle\widetilde S_x\cdot\widetilde S_y\rangle_{T,\Lambda}>0$ for all sufficiently small $T>0$.
  \par\smallskip\textit{Formulation references:} \sref{30006189}{1}, \sref{30006189}{2}.
  \subsection{Short English statement}
  For the short-range quantum Heisenberg ferromagnet in dimension $d\geq 3$, prove that sufficiently low temperature produces long-range order; specifically, prove that $\lim_{\Lambda\nearrow\mathbb{Z}^d}|\Lambda|^{-2}\sum_{x,y\in\Lambda}\langle\widetilde S_x\cdot\widetilde S_y\rangle_{T,\Lambda}>0$ for all sufficiently small $T>0$.
