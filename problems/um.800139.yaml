title: Comparative Prime Number Theory — Problem 8
field: mathematics
tier: prose
statement: |-
  More recently, Fiorilli and Jouve [FJ] and Bailleul [Bai] have investigated similar highly-biased races in number fields.

  Bound Skewes's numbers of other highly biased races in terms of the parameters defining the race, either conjecturally or provably.

  - (Alexandre Bailleul, Université Paris--Saclay) Consider Chebyshev's bias in the function field setting. As is customary since the work of Cha [Cha], in addition to assuming the linear independence (over ${\mathbb{Q}}$) of the corresponding arguments of zeros of $L$-functions, one typically assumes that those arguments are linearly independent with $\pi$ as well. While there are no known rational linear relations among the arguments of these zeros themselves, there are known instances where such an argument is a rational multiple of $\pi$. These instances usually come from special geometric conditions, such as supersingularity of elliptic curves or jacobians that are not absolutely simple.
