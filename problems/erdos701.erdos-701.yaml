lean:
  module: FormalConjectures.ErdosProblems.«701»
  decl: Erdos701.erdos_701
  statement: |-
    theorem erdos_701 : ∀ {X : Type} [Nonempty X] [Fintype X],
        ∀ (F : Set (Set X)), IsLowerSet F →
          ∃ x : X, ∀ᵉ (F' ⊆ F),
            F'.Intersecting →
              (#F' ≤ #{ A : Set X | A ∈ F ∧ x ∈ A })
  context:
