title: Moments of L-functions — Moments of the Riemann zeta function — Problem 39
field: mathematics
tier: prose
statement: |-
  Find a (conjectural) asymptotic formula for
  \[
  \sum_{n \le x} d_{k_1}(n+h_1) d_{k_2}(n+h_2) \cdots d_{k_r}(n+h_r)
  \]
  where $(k_1, \ldots, k_r) \in \mathbb{N}^r$ and $h_1, \ldots, h_r$ are distinct positive integers with $r \ge 3$.
  This would be analogous to the. conjectural asymptotic formula for
  \[
  \sum_{n \le x} \Lambda(n+h_1) \cdots \Lambda(n+h_r)
  \]
  that arises from the Hardy-Littlewood conjectures.
  Note that Ng-Thom and Tao have used different probabilistic arguments to derive conjectures in the case $r=2$.
