  module: FormalConjectures.ErdosProblems.«782»
  decl: Erdos782.erdos_782.parts.i
  statement: |-
    theorem erdos_782.parts.i :
        ∃ C : ℕ, 0 < C ∧ ∀ k : ℕ, ContainsQuasiProgression {n : ℕ | IsSquare n} C k
  context:
    - open Erdos782
    - open Erdos782.erdos_782
    - open Erdos782.erdos_782.parts
  definitions:
    - name: Erdos782.ContainsQuasiProgression
      kind: def
      text: |-
        /-- `ContainsQuasiProgression S C k` says that `S` contains a $k$-term quasi-progression of
        diameter $C$: terms $x_1,\ldots,x_k\in S$ and a difference $d\geq 1$ with
        $x_i+d\leq x_{i+1}\leq x_i+d+C$ for all $1\leq i<k$ (indexed from $0$ in Lean). The condition
        $d\geq 1$ makes the terms strictly increasing, as in [BFS03]. -/
        def ContainsQuasiProgression (S : Set ℕ) (C k : ℕ) : Prop :=
          ∃ (x : ℕ → ℕ) (d : ℕ), 0 < d ∧ (∀ i < k, x i ∈ S) ∧
            ∀ i, i + 1 < k → x i + d ≤ x (i + 1) ∧ x (i + 1) ≤ x i + d + C
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/782.lean#L42
