lean:
  module: FormalConjectures.GreensOpenProblems.«70»
  decl: Green70.green_70
  statement: |-
    theorem green_70 :
        ∀ k ℓ : ℕ, ∃ n₀ : ℕ, ∀ P : Finset (ℝ × ℝ),
          n₀ ≤ #P → HasCollinear k P ∨ HasMutuallyVisible ℓ P
  context:
    - open Green70
    - open scoped Finset
  definitions:
    - name: Green70.HasCollinear
      kind: def
      text: |-
        /-- `HasCollinear k P` says that some $k$ points of `P` lie on a line. -/
        def HasCollinear (k : ℕ) (P : Finset (ℝ × ℝ)) : Prop :=
          ∃ S ⊆ P, #S = k ∧ Collinear ℝ (S : Set (ℝ × ℝ))
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/GreensOpenProblems/70.lean#L42
    - name: Green70.HasMutuallyVisible
      kind: def
      text: |-
        /--
        `HasMutuallyVisible ℓ P` says that `P` contains $\ell$ mutually visible points: a subset `S` of
        $\ell$ points such that any two distinct points of `S` see each other, with respect to all of `P`.
        -/
        def HasMutuallyVisible (ℓ : ℕ) (P : Finset (ℝ × ℝ)) : Prop :=
          ∃ S ⊆ P, #S = ℓ ∧ (S : Set (ℝ × ℝ)).Pairwise (Visible P)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/GreensOpenProblems/70.lean#L54
