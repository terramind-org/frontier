title: Three-dimensional sphere packing from a planar height function
field: mathematics
tier: prose
statement: Let $G$ be a planar graph circle-packed in $\mathbb{R}^2$ and let $f:V(G)\to\mathbb{Z}$ change by at most one across every edge. Add from each vertex $v$ an edge to a Euclidean-nearest vertex $u$ with $f(u)<f(v)$. Is the resulting graph the tangency graph of a sphere packing in $\mathbb{R}^3$?
