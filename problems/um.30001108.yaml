title: Cofinite Models for Universal Proper-Action Spaces
field: mathematics
tier: prose
statement: Let $E\Gamma$ be a universal space for proper $\Gamma$-actions, so every finite-subgroup fixed-point set is nonempty and contractible. Characterize the groups $\Gamma$ for which $\Gamma\backslash E\Gamma$ has finite CW type, and construct explicit cofinite models, especially for arithmetic groups and mapping class groups.
