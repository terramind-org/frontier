title: Effective nonforking sections in stable theories
field: mathematics
tier: prose
statement: |-
  Consider $T$ stable. Then for all $M\prec N\models T$, the map
  \[
  r:S_1(N)\longrightarrow S_1(M)
  \]
  has a continuous section, which sends $p$ to the unique nonforking extension.

  **Question 6.** Is there a computable section?
