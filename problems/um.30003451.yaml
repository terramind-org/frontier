title: Carathéodory Bounds and Independent Evaluation Vectors
field: mathematics
tier: prose
statement: For $d\geq3$, are the Carathéodory number $C_{2d}$ and the maximal finite projective-zero count $\beta(2d)$ related by $$\beta(2d)\leq C_{2d}\leq\beta(2d)+1?$$ If $f\in B_{n,2d}$ is nonnegative on $\mathbb R^n$ and has projective zero set $\{z_1,\ldots,z_k\}$, must the evaluation vectors $\{s_{B_{n,2d}}(z_i):1\leq i\leq k\}$ be linearly independent?
