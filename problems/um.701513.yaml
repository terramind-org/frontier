title: Kourovka Notebook Problem 18.84
field: mathematics
tier: prose
statement: |-
  Let $\pi$ be a set of primes. We say that a finite group is a $BS_\pi$-group if every conjugacy class in this group any two elements of which generate a $\pi$-subgroup itself generates a
  $\pi$-subgroup. Is every normal subgroup of a $BS_\pi$-group a $BS_\pi$-group?

  In the case
  $2\not\in\pi$, an affirmative answer follows from
  (D. O. Revin, *Siberian Math. J.*, **52**, no. 2 (2011), 340--347).
