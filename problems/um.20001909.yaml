title: Energy-normalized Hopf defect and a curvature-sign rigidity theorem
field: mathematics
tier: prose
statement: |-
  Question 7.4.1 (Paternain). Consider a magnetic flow on a closed surface of genus

  ≥ 2 and an energy level such that the topological entropy vanishes. Suppose that the magnetic geodesics on this level do not have conjugate points. Is the system locally symmetric in the sense that the metric has constant curvature and the magnetic form is a constant multiple of the volume form?

  Many of the earlier questions in this section can also be asked about magnetic geodesics lying on a certain (possibly sufficiently high) energy level. Let us men-tion [Bialy2000], where a natural analog of Theorem 7.0.2 was proved under the assumption that the metric is conformally flat, and it was conjectured that this assumption is not essential. 8. Unrestricted curvature

  8.1. Ergodic geodesic flows. Does every closed manifold (with dimension ≥ 2)admit a metric (Riemannian or Finsler) with ergodic geodesic flow?

  This is known for surfaces [Donnay1988II], for 3-manifolds [Katok1994], for prod-uct manifolds in which the factors have dimenson ≤ 3 [Bur-Ger1994], and for spheres [Bur-Ged]. Donnay and Pugh have shown that any embedded surface can be perturbed, in the C0 topology to an embedded surface whose geodesic flow is ergodic [Don-Pugh2004]. These constructions all make essential use of the focusing caps introduced by Donnay in [Donnay1988I]. The general problem is still wide open despite some reports of its solution (p. 87 of [Berger2000] and Section 10.9 of [Berger2003]). 8.2. Positive curvature.
