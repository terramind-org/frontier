id: um.20002856
title: Boundary-to-filling equivalence and a local affirmative answer
field: mathematics
tier: prose
statement: |-
  It was proven by Eliashberg that any embeddable CR-structure on $\mathbb{S}^3$ bounds a Stein manifold $X\simeq \mathbb{B}^4$ with a strictly plurisubharmonic exhaustion function with a single critical point. Can $X$ always be embedded into $\mathbb{C}^2$?

  Does the compact Stein filling $\overline X$, with its given smooth strictly pseudoconvex boundary, admit a holomorphic embedding into $\mathbb C^2$ smooth up to the boundary, so that its image is a bounded strictly pseudoconvex domain and the boundary CR structure is preserved?
