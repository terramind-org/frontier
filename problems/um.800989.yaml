title: Open Problems in Mathematical Logic — Problem 1 (Levin, private communications)
field: mathematics
tier: prose
statement: |-
  Are the following true?

  (1) Can every chain of random reals in the Turing degrees
  be combined into a single random real?

  (2) Can every Turing ideal generated by random reals be
  generated by the columns of a single random real?
