  module: FormalConjectures.ErdosProblems.«782»
  decl: Erdos782.erdos_782.parts.ii
  statement: |-
    theorem erdos_782.parts.ii :
        ∀ d : ℕ, ∃ (a : ℤ) (b : Fin d → ℤ),
          (∀ i, b i ≠ 0) ∧ hilbertCube a b ⊆ {n : ℤ | IsSquare n}
  context:
    - open Erdos782
    - open Erdos782.erdos_782
    - open Erdos782.erdos_782.parts
  definitions:
    - name: Erdos782.hilbertCube
      kind: def
      text: |-
        /-- The Hilbert cube with presentation $(a_0; b_1,\ldots,b_d)$, that is,
        $$a_0+\left\{ \sum_i \epsilon_ib_i : \epsilon_i\in \{0,1\}\right\}.$$
        The index set of the sum is the set of $i$ with $\epsilon_i=1$. -/
        def hilbertCube {d : ℕ} (a₀ : ℤ) (b : Fin d → ℤ) : Set ℤ :=
          {x | ∃ ε : Finset (Fin d), x = a₀ + ∑ i ∈ ε, b i}
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/782.lean#L50
