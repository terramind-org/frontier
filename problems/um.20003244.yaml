title: A conjugate-order ambiguity and an above-2 spectral obstruction
field: mathematics
tier: prose
statement: |-
  Does there exist a positive real cyclotomic integer \(\alpha\) such that
  \[
  |\sigma(\alpha)|\leq \alpha
  \quad\text{for every embedding }\sigma:\mathbb Q(\alpha)\hookrightarrow\mathbb C,
  \]
  but \(\alpha\neq\operatorname{FPdim}(X)\) for every object \(X\) in every fusion category?
