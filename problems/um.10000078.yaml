title: Geodesics in Gaussian-free-field random metrics
field: mathematics
tier: prose
statement: On the $n\times n$ grid with a Gaussian free field with no boundary conditions, give every vertex length equal to the exponential of the field. If $\gamma_1(n)$ and $\gamma_2(n)$ are shortest paths joining the two top and the two bottom corners, prove that $\mathbb{P}(\gamma_1(n)\cap\gamma_2(n)\ne\varnothing)>c$ uniformly in $n$. Construct the metric and geodesic scaling limits, determine geodesic dimension and height concentration, and identify any SLE parameter of the limiting paths.
