title: Problem 2.6 — Schleimer has proved in [42] that each fixed 3-manifold M has a bound on the distances of its Heegaard splittings.
field: mathematics
tier: prose
statement: "Schleimer has proved in [42] that each fixed 3-manifold M has a bound on the distances of its Heegaard splittings. Study this bound, with the goal of developing an algorithm for computing it. 150 J. Birman Understanding the handlebody subgroup Hg of the mapping class group is a problem that is obviously of central importance in understanding Heegaard splittings. A finite presentation for Hg was given by Wajnryb in [ 51]. To the best of our knowledge, this presentation has not been simplified, except in the special case g = 2. Very little is known about the structure of Hg, apart from its induced action on H1(2g, Z), which is a rather transparent subgroup of the symplectic group Sp(2 g, Z). We pose the problem:"
