title: Comparative Prime Number Theory — Problem 2
field: mathematics
tier: prose
statement: |-
  What we expect to be true is that the large-scale intervals of positive and negative values of $\psi(x)-x$ do indeed alternate at about the speed given by the repeated-averaging argument, but that each such sign change detected is actually a flurry of many sign changes on a small scale (this is how random walks behave, for example). In particular, we expect $W^\psi(T)$ and related sign-change counting functions to grow more like $\sqrt T$ (up to logarithmic factors) than like $\log T$.

  Make any progress whatsoever towards advancing our knowledge of sign changes beyond the repeated-averaging techniques.

  - (Alexandre Bailleul, Université Paris--Saclay) This question was raised by Nilotpal Sinha [Sinha]. Let $P^+(n)$ denote the largest prime factor of $n$. Numerical investigation suggests that there is a bias towards integers $n$ for which $P^+(n)\equiv3\mod4$ over integers $n$ for which $P^+(n)\equiv1\mod4$, but the asymptotic behaviour of $\sum_{n\le x} \chi_{-4}(P^+(n))$ is still unknown.
