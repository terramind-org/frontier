title: Closure Implies Exchange for Generics
field: mathematics
tier: prose
statement: "Let $K$ be an infinite stable saturated field with additional structure. If $K$ is separably closed, must it have the exchange property for generics? If $K$ is algebraically closed, must the following hold: for every small subfield $k$ and elements $g,h$, if $g$ is generic over $k$ and algebraic over $k(h)$, then $h$ is generic over $k$?"
