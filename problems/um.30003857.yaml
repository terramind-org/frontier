title: Positive Curvature on Higher Rank Symmetric Spaces
field: mathematics
tier: prose
statement: Does any compact, simply connected Riemannian symmetric space of rank greater than $1$ admit a metric of positive sectional curvature? In particular, does $S^2\times S^2$ admit such a metric?
