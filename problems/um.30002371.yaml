title: Complex Extension Conjecture for Polyhedral Kähler Manifolds
field: mathematics
tier: prose
statement: Let $M^{2n}$ be a polyhedral Kähler manifold. Does its flat complex structure away from the metric singularities extend across all of $M$, making $M$ a normal complex analytic variety whose complex singularities have codimension $3$?
