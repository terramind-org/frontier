title: Kourovka Notebook Problem 8.79
field: mathematics
tier: prose
statement: |-
  Does there exist a countable infinite locally
  finite group $G$ that is complete, in the sense that $G$ has
  trivial centre and no outer automorphisms? An uncountable one
  exists (K. K. Hickin, *Trans. Amer. Math. Soc.*, **239**
  (1978), 213--227).
