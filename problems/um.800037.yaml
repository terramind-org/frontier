title: The Lyapin's Notebook — Problem 39
field: mathematics
tier: prose
statement: |-
  (G. Mashevitzky)
  Find a theorem for inclusive varieties analogous to the Birkhoff theorem for varieties; that is, determine a (minimal) set of Birkhoff type operators such that a class of semigroups forms an inclusive variety if and only if it is closed under these operators.

  Inclusive varieties are known to be closed under subsemigroups and homomorphic images.
