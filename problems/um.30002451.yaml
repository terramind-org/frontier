title: Cluster Structures for Belavin–Drinfeld Data
field: mathematics
tier: prose
statement: Let $G$ be a simple complex Lie group and let $T=(\Gamma_1,\Gamma_2,\gamma)$ be a Belavin–Drinfeld triple, with associated class $R_T$ of classical $R$-matrices. Does there exist a cluster structure $\mathcal C_T$ on $G$ that is compatible with the Poisson bracket for every $r\in R_T$ and whose upper cluster algebra is naturally isomorphic to $\mathcal O(G)$?
