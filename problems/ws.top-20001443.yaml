  \section{Log-Minkowski inequality for symmetric convex bodies}\label{20001443}
  {\small UnsolvedMath ID 20001443 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Log-Minkowski inequality

  Show that if $K$ and $L$ origin-symmetric convex bodies with nonempty interior in $\R^n$, then
  $$
  \int\limits_{S^{n-1}} \log{\frac{h_K(u)}{h_L(u)}}\,d\bar{V}_L(u) \geq \frac1n \log{\frac{|K|}{|L|}},
  $$
  where $\bar{V}_L$ is the cone-volume probability measure of $L$.
  \par\smallskip\textit{Formulation references:} \sref{20001443}{1}, \sref{20001443}{2}.
