statement: Given complex polynomials $f_n$ of fixed degree $d$ with $f_n\to f$ coefficientwise, determine in which sense $K(f_n)\to K(f)$ and $J(f_n)\to J(f)$, for example via upper or lower semicontinuity in the compact-set topology.
