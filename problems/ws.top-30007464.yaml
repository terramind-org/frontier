  \section*{Quasipolynomial mean-payoff/parity winning sets}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Can the winning states for a conjunction of mean-payoff and parity objectives in an explicitly encoded finite turn-based game be computed deterministically in quasipolynomial time in its binary input length?
  \subsection{Short English statement}
  Can the winning states for a conjunction of mean-payoff and parity objectives in an explicitly encoded finite turn-based game be computed deterministically in quasipolynomial time in its binary input length?
