title: Classification of Cyclic Covers of Two-Bridge Knots
field: mathematics
tier: prose
statement: For every two-bridge knot $K$ and integer $n>1$, determine whether the cyclic branched cover $\Sigma_n(K)$ is a total L-space, whether $\pi_1(\Sigma_n(K))$ is left-orderable, and whether $\Sigma_n(K)$ is excellent.
