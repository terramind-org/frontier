title: Period Conjectures for Fano Polygons and Del Pezzo Surfaces
field: mathematics
tier: prose
statement: Let $P$ be a Fano polygon and $X$ a generic $\mathbb Q$-Gorenstein deformation of its toric surface. Is there an affine-linear mirror map $\phi:L_P^T\to H_X^{\mathrm{ts}}$ satisfying $\widehat G_X\circ\phi=\pi_P$? For Fano polygons with the same singularity content, does equality of classical periods under such an identification imply mutation equivalence? For class-TG del Pezzo surfaces with the same $\mathbb Q$-Gorenstein-rigid cyclic quotient singularities, does equality of quantum periods imply $\mathbb Q$-Gorenstein deformation equivalence?
