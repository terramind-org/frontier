title: From one Thurston co-sphere to pointed global geometry
field: mathematics
tier: prose
statement: |-
  **Problem 1.3 (F. Guérititaud).** Does the unit sphere in
  \(T_X^*\mathcal T(S)\), endowed with the Thurston norm, determine the
  global behaviour of stretch lines or geodesics?

  As shown by Thurston, the behavior of lengths of laminations
  infinitesimally in measured lamination space gives good global coordinates
  for Teichmüller space.
