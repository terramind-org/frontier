title: Simple Spatial Polygon Realizations from Angle Sequences
field: mathematics
tier: prose
statement: Let $A=(\alpha_0,\ldots,\alpha_{n-1})$, $n\geq 3$, be realizable by a polygon in $\mathbb{R}^3$. Can $A$ be realized without self-intersections if and only if $n$ is even or $\sum_{i=0}^{n-1}(\pi-\alpha_i)\neq\pi$?
