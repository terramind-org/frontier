id: um.20000528
title: Finite-range reduction and measurable affine patching for a one-variable vector-field maximal operator
field: mathematics
tier: prose
statement: |-
  Let \(u:\mathbb R\to\mathbb R\) be a measurable function. Define the maximal operator along the planar vector field \((1,u)\) by
  \[
  M_u f(x,y):=\sup_{\epsilon>0}\left|
  \frac{1}{2\epsilon}\int_{-\epsilon}^{\epsilon}
  f(x-t,y-u(x)t)\,dt
  \right|.
  \]
  Does \(M_u\) satisfy any \(L^p\) bound for certain \(p<\infty\)?
