statement: |-
  \section*{The eleven-twelfths zero-free half-plane}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Do all Dirichlet L-functions, including zeta, and all finite-order Hecke L-functions over Q(sqrt(-3)) have no zeros in $Re(s)>11/12$, with any principal-character pole at one allowed?
  \subsection{Short English statement}
  Do all Dirichlet L-functions, including zeta, and all finite-order Hecke L-functions over Q(sqrt(-3)) have no zeros in $Re(s)>11/12$, with any principal-character pole at one allowed?
