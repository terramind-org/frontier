lean:
  module: FormalConjectures.GreensOpenProblems.«44»
  decl: Green44.green_44
  statement: |-
    theorem green_44 :
        ∀ (N : ℕ) (p : Fin 1000 → ℕ) (A : (i : Fin 1000) → Finset (ZMod (p i))),
          let remaining := (Finset.Icc 1 N).filter (fun x => ∀ i, (x : ZMod (p i)) ∉ A i)
          (∀ i, (p i).Prime) →
          StrictMono p →
          (p 999) ^ 10 < N ^ 9 →
          (∀ i, (A i).card = (p i) / 2) →
          10 * remaining.card ≤ N
  context:
    - open Green44
    - open scoped Nat
  definitions: []
