title: Natural Completions of Period Maps
field: mathematics
tier: prose
statement: Given a smooth projective variety $B$ with reduced normal-crossing divisor $Z$, a period map $\Phi:B\setminus Z\to\Gamma\backslash D$, and image $\mathcal P=\Phi(B\setminus Z)$, what natural completions of $\Phi$ to a map from $B$ exist, and what properties do they have?
