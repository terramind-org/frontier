id: oeisa179524.conjecture1
title: Central binomial sum $a(n) = \sum_{k=0}^n (-4)^k \binom{n}{k}^2 \binom{n-k}{k}^2$ (conjecture1)
field: mathematics
tier: proof
statement: |-
  If $p$ is a prime with $p \equiv 1, 9 \pmod{20}$ and $p = x^2 + 5y^2$ with $x, y$ integers,
  then $\sum_{k=0}^{p-1} a(k) \equiv 4x^2 - 2p \pmod{p^2}$.
  - _Zhi-Wei Sun_, Jul 01 2010
