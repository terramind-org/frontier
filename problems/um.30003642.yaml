title: Critical Mean Values of Dirichlet Polynomials
field: mathematics
tier: prose
statement: Let $D(s)=\sum_{n\leq N}a_nn^{-s}$ with $|a_n|\leq1$. In the critical range $T^{1/2}<N<T$ with $N^\kappa=T$, is $\int_0^T|D(it)|^{2\kappa}\,dt\ll T^{2+\varepsilon}$?
