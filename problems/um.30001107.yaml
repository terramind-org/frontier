title: Distinguished Arthur Parameters and Euler Products of Periods
field: mathematics
tier: prose
statement: For an automorphic representation on a symmetric variety, under suitable multiplicity-one hypotheses, can a nonzero global $H$-invariant functional be expressed as an Euler product of the local $H_v$-invariant functionals in the Plancherel formula? Is the support of Plancherel measure for $L^2(X_v)$ contained in the representations with $X$-distinguished Arthur parameters?
