lean:
  module: FormalConjectures.OEIS.«212496»
  decl: OeisA212496.conjecture_3
  statement: |-
    theorem conjecture_3 (n : ℕ) (hn : 5892 < n) :
        (a n : ℝ) < Real.sqrt (n : ℝ) * Real.log (Real.log (n : ℝ))
  context:
    - open OeisA212496
    - open scoped ArithmeticFunction.Omega
  definitions:
    - name: OeisA212496.a
      kind: def
      text: |-
        /-- $a(n) = \sum_{k=1}^n (-1)^{k - \Omega(k)}$. -/
        def a (n : ℕ) : ℤ :=
          ∑ k ∈ Finset.Icc 1 n, if (k + Ω k) % 2 = 0 then 1 else -1
