lean:
  module: FormalConjectures.ErdosProblems.«1030»
  decl: Erdos1030.erdos_1030
  statement: |-
    theorem erdos_1030 :
        ∃ c > (0 : ℝ), ∃ L : ℝ,
          Tendsto (fun k : ℕ ↦
            (SimpleGraph.classicalRamsey (k + 1) k : ℝ) /
              (SimpleGraph.classicalRamsey k k : ℝ)) atTop (nhds L) ∧
          L > 1 + c
  context:
    - open Erdos1030
    - open Filter
