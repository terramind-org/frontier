title: Frame Property of the Gaussian Gabor System on $\Lambda_3$
field: mathematics
tier: prose
statement: |-
  Let $g$ be the normalized Gaussian on $\mathbb R^2$, let

  $$A_3=\begin{pmatrix}1&2/5\\0&\sqrt{21}/5\end{pmatrix},\qquad \Lambda_3=A_3(\mathbb Z+i\mathbb Z)^2,$$

  and let $G(g,\Lambda_3)$ be the associated Gabor system. Is $G(g,\Lambda_3)$ a frame for $L^2(\mathbb R^2)$?
