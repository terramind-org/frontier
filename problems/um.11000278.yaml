statement: What is the least integer δ such that Out(Fn) acts without a global fixed point on a complete CAT (0) space of dimension δ? And what is the least dimension for the mapping class group Mod±(Sg)? The action of Out( Fn) on the first homology of Fn defines a map from Out( Fn) to GL( n, Z) and hence an action of Out( Fn) on the symmetric space of dimension 1 2n(n + 1)− 1. This action does not have a global fixed point and hence we obtain an upper bound on δ. On the other hand, since Out( Fn) has property F A, δ≥ 2. In fact, motivated by work of Farb on GL( n, Z), Bridson [14] has shown that using a Helly-type theorem and the structure of finite subgroups in Out( Fn), one can obtain a lower bound on δ that grows as a linear function of n. Note that a lower bound 2topological covering dimension 20. Automorphism groups of free, surface and free abelian groups 325 of 3 n− 3 on δ would imply that Outer Space did not support a complete Out( Fn)-equivariant metric of non-positive curvature. If X is a CAT(0) polyhedral complex with only finitely many isometry types of cells (e.g. a finite dimensional cube complex), then each isometry of X is either elliptic (fixes a point) or hyperbolic (has an axis of translation) [ 15]. If n≥ 4 then a variation on an argument of Gersten [36] shows that in any action of Out( Fn) on X, no Nielsen generator can act as a hyperbolic isometry.
