lean:
  module: FormalConjectures.OEIS.«56777»
  decl: OeisA56777.comesFromPrimeQuadruple_of_a
  statement: "theorem comesFromPrimeQuadruple_of_a {n : ℕ} (h : A n) : ComesFromPrimeQuadruple n"
  context:
    - open OeisA56777
    - open Nat
    - open scoped ArithmeticFunction.sigma
  definitions:
    - name: OeisA56777.A
      kind: def
      text: |-
        /-- A composite number $n$ is in the sequence A56777 if it satisfies both
        $\varphi(n+12) = \varphi(n) + 12$ and $\sigma(n+12) = \sigma(n) + 12$. -/
        def A (n : ℕ) : Prop :=
          ¬n.Prime ∧ 1 < n ∧ totient (n + 12) = totient n + 12 ∧ σ 1 (n + 12) = σ 1 n + 12
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/56777.lean#L40
    - name: OeisA56777.ComesFromPrimeQuadruple
      kind: def
      text: |-
        /-- A number $n$ comes from a prime quadruple $(p, p+2, p+6, p+8)$ if
        $n = p(p+8)$ for some prime $p$ where $p$, $p+2$, $p+6$, $p+8$ are all prime. -/
        def ComesFromPrimeQuadruple (n : ℕ) : Prop :=
          ∃ p : ℕ, p.Prime ∧ (p + 2).Prime ∧ (p + 6).Prime ∧ (p + 8).Prime ∧ n = p * (p + 8)
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/56777.lean#L45
