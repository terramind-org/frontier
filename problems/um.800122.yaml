title: Foliations and Diffeomorphism Groups — Question 63 (``Haefliger-Thurston conjecture")
field: mathematics
tier: prose
statement: |-
  The following questions, which
  seem to resist to the contemporary attempts,
  all ask for some triviality in the homotopy of
  $B\Gamma$, that would imply the existence of foliations,
  as well as some acyclicity in the homology
  of some diffeomorphism groups.
  On the other hand, if the
  answers were negative,
  it would mean that Reeb's fundamental problem admits obstructions
  of a completely new nature, different
  from the known ones: essentially,
  Bott's obstructions, and
  ``secondary characteristic classes" such as the Godbillon-Vey
  invariant.

  \

  Is $B\bar\Gamma_q$ $2q$-connected i.e. do $\pi_i(B\bar\Gamma_q)$ vanish for all $i\leq 2q$?
