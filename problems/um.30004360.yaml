title: Internal Partitions of Regular Graphs
field: mathematics
tier: prose
statement: An internal partition of a graph is a partition into two nonempty parts in which every vertex has at least as many neighbors in its own part as in the other. For every $d$, are there only finitely many $d$-regular graphs with no internal partition?
