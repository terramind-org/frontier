title: Three-Color Edge-Folkman Numbers for Triangles
field: mathematics
tier: prose
statement: What are good bounds on the order of a graph $G$ such that every coloring of the edges of $G$ with three colors contains a monochromatic triangle, i.e. $G\longrightarrow(K_3)^3$?
