title: Dynamics of Large-Coupling Quasiperiodic Schrödinger Cocycles
field: mathematics
tier: prose
statement: For the quasiperiodic Schrödinger cocycle with $f:\mathbb T\to\mathbb R$ of class $C^2$, exactly two nondegenerate critical points, Diophantine frequency $\omega$, and sufficiently large coupling $\lambda$, describe the dynamics of the induced projective map $\Phi_E:\mathbb T^2\to\mathbb T^2$ for every $E\in\mathbb R$ under more general assumptions on $f$.
