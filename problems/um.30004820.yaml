id: um.30004820
title: Regularity of Equivariant Monomial-Ideal Filtrations
field: mathematics
tier: prose
statement: Let $I=(I_n)_{n\geq1}$ be an $\operatorname{Inc}(\mathbb N)$-invariant filtration of nonzero proper homogeneous ideals with stability index $r$. Is $\operatorname{reg}(I_n)$ eventually linear in $n$? If the filtration is monomial, does there exist a constant $D$ such that $$\operatorname{reg}(I_n)=(w(I_r)-1)n+D$$ for all sufficiently large $n$? The question remains open even for nonsaturated filtrations of squarefree monomial ideals.
