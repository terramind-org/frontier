title: The Polynomial Hirsch Conjecture
field: computer-science
tier: prose
statement: |-
  \section{The Polynomial Hirsch Conjecture}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Let $P\subseteq\mathbb R^d$ be a bounded convex polytope of affine dimension $d\ge1$; equivalently, it is the convex hull of finitely many points whose affine span is $\mathbb R^d$. A facet is a face of dimension $d-1$, and let $n$ be the number of facets. The graph $G(P)$ has the vertices of $P$ as graph vertices and its one-dimensional faces as graph edges. For vertices $v,w$, their graph distance is the smallest number of edges in an edge path from $v$ to $w$. The diameter $\operatorname{diam}G(P)$ is the maximum of these distances. \sref{statement}{2}
  \paragraph{Statement recorded in the supplied source.}
  Are there constants $C>0$ and $k\in\mathbb N$, independent of $d$, $n$ and $P$, such that every bounded $d$-dimensional convex polytope with $n$ facets satisfies
  \[
   \operatorname{diam}G(P)\le C(d+n+1)^k?
  \]
  Equivalently, is there a single polynomial in $d$ and $n$ that bounds the vertex-edge diameter of every such polytope? \sref{statement}{2}
  The exponent must be uniform across dimensions. A dimension-dependent polynomial or a bound with exponent $\log_2 d$ does not give the requested fixed polynomial. The question uses the vertex-edge graph, rather than the circuit diameter of a system of inequalities.
  \subsection{Short English statement}
  Can every pair of vertices of any bounded polytope be joined by an edge path whose length is bounded by one fixed polynomial in its dimension and number of facets?
