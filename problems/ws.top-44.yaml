  \item[\hypertarget{source:44:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 44 (CS-002). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:44:2}{S2}] Francisco Santos, A Counterexample to the Hirsch Conjecture, Annals of Mathematics 176 (2012), 383--412; arXiv:1006.2814v3 (2011), Section 1, Conjecture 1.3, page 3. \url{https://arxiv.org/pdf/1006.2814}.
  \item[\hypertarget{source:44:3}{S3}] Noriyoshi Sukegawa, Improving Bounds on the Diameter of a Polyhedron in High Dimensions, Discrete Mathematics 340 (2017), 2134--2142; arXiv:1604.04039v3, Section 1 and Theorem 1. \url{https://arxiv.org/pdf/1604.04039}.
  \end{description}
