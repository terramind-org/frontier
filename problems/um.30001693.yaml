title: Bárány–Larman Colored Tverberg Conjecture
field: mathematics
tier: prose
statement: For integers $d\geq1$ and $r\geq2$, determine the least $n$ such that every affine map $f$ from the simplex $\Delta^{n-1}$ to $\mathbb{R}^{d}$, with its vertices partitioned into $d+1$ color classes each of size at least $r$, admits $r$ pairwise disjoint rainbow faces whose images have a common point; is the Bárány–Larman conjecture $n(d,r)=(d+1)r$ true? In the alternative colored Tverberg problem, determine the least $t$ such that the analogous assertion holds for equal color classes of size $t$, equivalently, whether $t(d,r)=r$.
