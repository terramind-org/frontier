title: Deformation and invariant barriers for low-Sobolev 2D Euler norm inflation
field: mathematics
tier: prose
statement: |-
  2D Euler norm inflation

  Consider the 2D Euler equation with initial velocity \(u_0\in H^s\), \(s\in(0,1)\). Prove norm inflation. Note that the \(L^2\) and \(H^1\) norms are conserved. Same question for \(L^p\) norms with \(p\ne2\).
