id: um.20001886
title: Finite marked-length calibration for branched hyperbolic triangulations
field: mathematics
tier: prose
statement: |-
  Question 5.1.2 (Schmidt). Does the marked length spectrum determine such a metric (in the class of all locally CAT \((-1)\) metrics on this space, or in the class of all 2-dimensional (metrical) simplicial complexes with the above properties homeomorphic to the given complex)?

  The antecedent “such a metric” occurs in the immediately preceding source paragraph (record AIM-GEOMETRY-0223). It means the intrinsic length metric on a two-dimensional metrical simplicial complex \(K\) satisfying:

  1. every two-simplex is a hyperbolic geodesic triangle;
  2. the metric link condition giving local CAT\((-1)\) holds at every vertex; and
  3. every edge belongs to at least two two-simplices.

  Thus the complex has no one-sided edge boundary, but it can branch along an edge contained in three or more triangles. The source does not explicitly repeat “finite” or “compact” in this paragraph. The intended marked-length setting, and all later rigidity results discussed below, concern finite/compact quotients; this extra hypothesis is stated whenever used here.

  There are two comparison categories in Schmidt's question:

  - all locally CAT\((-1)\) metrics on the fixed underlying topological space; or
  - all piecewise hyperbolic two-dimensional metrical simplicial complexes with the displayed properties and homeomorphic to the given complex.

  The second version needs a **marking**. For metrics on the same \(K\), equality means equality as functions on conjugacy classes of \(\pi_1(K)\). For spaces \(K_0,K_1\), one must specify a homeomorphism \(f:K_0\to K_1\) (or an identified fundamental-group isomorphism) and require
  \[
   \ell_{g_1}(f_*[\gamma])=\ell_{g_0}([\gamma])
   \quad\text{for every conjugacy class }[\gamma]. \]
  An isometry proving marked rigidity should induce that marking, normally up to homotopy or isotopy. “Homeomorphic” without this datum is not enough to define equality of marked spectra.

  The sentences beginning “The questions above are closely related to the boundary rigidity problem” are a transition to Question 5.1.3, not part of Schmidt's marked-length-spectrum question. The standard intended definition is that another **metric** \(g'\) with the same boundary-distance function must make \((M,g')\) isometric to \((M,g)\), through a diffeomorphism fixing the boundary pointwise. This correction is recorded only to disambiguate the transition; boundary rigidity is not the problem studied in this attempt.
