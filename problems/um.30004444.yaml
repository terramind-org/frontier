title: Singular Cardinal Arithmetic Without Weak Square
field: mathematics
tier: prose
statement: For a singular cardinal $\kappa$, is $\operatorname{cof}(\operatorname{pp}(\kappa))>\kappa$? Also, can there be a singular strong-limit $\kappa$ such that weak square at $\kappa$ fails and $2^\kappa>\kappa^+$, or such that the tree property holds at $\kappa^+$ while $2^\kappa>\kappa^+$?
