id: um.30005235
title: Bounded-Degree Sensitivity of Mixing Times
field: mathematics
tier: prose
statement: |-
  Can one construct uniformly quasi-isometric sequences of finite Cayley graphs $G_n,H_n$, both of uniformly bounded degree, such that

  $$t_{\mathrm{mix}}(G_n)\geq\log\log\log|G_n|\,t_{\mathrm{mix}}(H_n)?$$

  Can the factor $\log\log\log|G_n|$ be improved?
