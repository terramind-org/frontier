  definitions:
    - name: OeisA227923.a
      kind: def
      text: |-
        /-- Number of ways to write $n = x + y$ ($x, y > 0$) such that $6x - 1$ is a Sophie Germain prime
        and $\{6y - 1, 6y + 1\}$ is a twin prime pair. -/
        def a (n : ℕ) : ℕ :=
          (Finset.Ico 1 n).filter (fun x : ℕ =>
            let y := n - x
            (6 * x - 1).Prime ∧ (12 * x - 1).Prime ∧ (6 * y - 1).Prime ∧ (6 * y + 1).Prime
          ) |>.card
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/227923.lean#L34
