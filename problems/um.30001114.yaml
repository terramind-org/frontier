title: Classification of Wild Quotient Surface Singularities
field: mathematics
tier: prose
statement: Let $Y=X/G$ be the quotient of a regular two-dimensional scheme by a finite group action in characteristic $p>0$, and consider its isolated wild singularities, where $p$ divides $|G|$. Classify these singularities up to analytic isomorphism, equivalently by the resolution graphs and combinatorial data of their minimal normal-crossing resolutions.
