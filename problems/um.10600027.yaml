title: Virtual-knot problem 27 — Study concordance and cobordism invariants of virtual knots.
field: mathematics
tier: prose
statement: |-
  Study concordance and cobordism invariants of virtual knots. In
  particular, solve the question of virtual knots up to
  pass-equivalence (taking a direct generalization of
  classical pass equivalence that gives the Arf invariant of knots).
  Understanding this specific problem will promote our understanding
  of concordance of virtual knots.
