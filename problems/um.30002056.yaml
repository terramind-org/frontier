title: Wedge-of-Spheres Homotopy Type of Random Flag Complexes
field: mathematics
tier: prose
statement: |-
  Let $X\in X(n,p)$ be a random flag complex. For $d\geq6$ and
  $$n^{-2/d}\ll p\ll n^{-2/(d+1)},$$
  is $X$ asymptotically almost surely homotopy equivalent to a wedge of $\lfloor d/2\rfloor$-dimensional spheres?
