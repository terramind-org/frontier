id: um.30004651
title: Exceptional Reducibility Sets in Polynomial Specialization
field: mathematics
tier: prose
statement: |-
  For an irreducible polynomial $F(t,X)\in\mathbb Q[t,X]$, determine, up to a finite set,
  $$
  R_F=\{t_0\in\mathbb Q:F(t_0,X)\text{ is reducible}\},
  $$
  and find analogous descriptions over number fields and for integral parameters.
