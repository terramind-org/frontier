title: Kourovka Notebook Problem 19.2
field: mathematics
tier: prose
statement: |-
  For a subgroup $L$ of a group $G$, let $L_G$ denote the largest normal subgroup of $G$ contained in $L$. If $M\vartriangleleft G$, then we say that $G$ *nearly splits*
  over $M$ if there is a subgroup $N\leq G$ such that $|G:N|=\infty$,
  $|G:MN|<\infty$, and $(M\cap N)_G=1$.

  Let $G$ be any group, and $H$ a normal subgroup of prime order. Is it true that $\psi(G)\cap H=1$
  if and only if $G$ nearly splits over $H$?
