title: Conjecture 4.4 — Let M be a closed hyperbolic 4-manifold.
field: mathematics
tier: prose
statement: "Let M be a closed hyperbolic 4-manifold. Then all the Seiberg-Witten invariants of M vanish. The relevance of this is given in the following proposition. We give a proof for hyperbolic manifolds that makes use only of Taubes celebrated paper [ 37] when b+ 2 > 1, and hence avoid complexities that arise when b+ 2 = 1. Proposition 4.5. A postive answer to Conjecture 4.4 implies that a closed hyperbolic 4- manifold M cannot be symplectic. Proof: This follows automatically from [ 37] in the case when b+ 2 > 1, since [ 37] shows that a compact oriented symplectic 4-manifold with b+ 2 > 1 has non-vanishing Seiberg-Witten invariants. Thus assume that b+ 2 (M ) = 1, and M is symplectic (if b2(M ) = 0 there is nothing to prove). From the discussion above, since M is hyperbolic, the signature of M is 0, and so b2(M ) = 2. Also M being hyperbolic implies π1(M ) is residually finite and so M has many finite covers. Let p:M1→M be a cover of degree d> 1. Since M is symplectic, M1 will be symplectic using the pullback of the symplectic form on M. We claim that b+ 2 (M1)> 1, and so we can apply [ 37] to get a contradiction. 282 A.W. Reid For if b2(M1) = 2, then (from the volume formula above) since the Euler characteristic satisfies χ(M1) > 0, it follows that b1(M1) < 2. However, χ(M1) = dχ(M ) and this shows b1(M1) = 2−d(2−b1(M )). These remarks yield the desired contradiction. ⊔ ⊓ On the otherhand, any X that has the description of a surface bundle over a surface where both the base and fiber have genus ≥ 2 is symplectic by an old argument of Thurston (see [ 39] or [ 14] Theorem 10.2.17). Motivated by this discussion, one can ask the following generalization of Question 4.1, which is an analogue of the virtual fibering question in dimension 3."
