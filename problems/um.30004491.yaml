title: Infinite Transverse Actions on Codimension-One Foliations
field: mathematics
tier: prose
statement: If $X$ is a projective manifold, $\mathcal F$ is a codimension-one foliation on $X$, and $f\in\operatorname{End}(X,\mathcal F)$ has infinite transverse action, is $\mathcal F$ virtually transversely additive?
