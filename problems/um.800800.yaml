title: Branko Grunbaum in Many Dimensions — Conjecture 7
field: mathematics
tier: prose
statement: '[Gr\"unbaum--Kalai--Sarkaria] For every $d \ge 1$ there is a constant $C_d$ such that $$f_d (S)\le C_d f_{d-1}(S)$$ for every $d$-complex $S$ which is embeddable in $\mathbb{R}^{2d}$.'
