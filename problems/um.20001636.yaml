title: A sharp free-product case of the Osin-Thom normal-rank inequality
field: mathematics
tier: prose
statement: |-
  It is known that for every finitely generated group we have
  \[
  \beta_1^{(2)}(\Gamma)\leq d(\Gamma)-1,
  \]
  where \(d\) stands for the minimal number of generators of \(\Gamma\).
  A group \(\Gamma\) is normally generated by \(S\subseteq\Gamma\) if the only normal subgroup of \(\Gamma\) containing \(S\) is \(\Gamma\) itself. Let \(nrk(\Gamma)\) be the normal rank of \(\Gamma\), i.e. the minimal number of normal generators.

  Do we have
  \[
  \beta_1^{(2)}(\Gamma)\leq nrk(\Gamma)-1
  \]
  for a torsion free group \(\Gamma\)?
