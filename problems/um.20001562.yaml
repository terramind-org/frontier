title: An equivariant curve complex for affine type C and a correction to the orbifold premise
field: mathematics
tier: prose
statement: |-
  In (Allcock 2002, MR1911508), several Artin groups are shown to be mapping class groups of certain orbifolds.

  For an Artin group $A$ and orbifold $\mathcal O$ with $A \cong MCG(\mathcal O)$, is there a (reasonably defined) curve complex for $\mathcal O$ which agrees with the complex of irreducible parabolics for $A$?

  Daniel Allcock, “Braid pictures for Artin groups,” *Transactions of the American Mathematical Society* **354** (2002), no. 9, 3455--3474, MR1911508, DOI 10.1090/S0002-9947-02-02944-6.
