title: Simultaneous Sobolev approximation for radial planar homeomorphisms
field: mathematics
tier: prose
statement: "**Approximation of Sobolev homeomorphisms by diffeomorphisms.** Let \\(f\\) be a homeomorphism of the plane such that \\(f\\) and \\(f^{-1}\\) lie in some Sobolev class, e.g. \\(W^{1,2}\\). Can one approximate \\(f\\) by diffeomorphisms \\(f_j\\) so that \\(f_j\\) and \\(f_j^{-1}\\) converge in the Sobolev norm?"
