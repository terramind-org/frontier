  \item[\hypertarget{source:statement:2}{S2}] R. İnanç Baykur, Robion C. Kirby and Daniel Ruberman, K3—A New Problem List in Low-Dimensional Topology, Mathematical Surveys and Monographs 295 (2026), author version, Problem 4.20 and Remarks, PDF page 205; also Problems 4.87--4.88, PDF page 261. \url{https://math.berkeley.edu/sites/default/files/surv-295-ruberman-watermarked-author-pdf.pdf}.
