statement: An element $g$ of a finite group $G$ is said to be vanishing if $\chi(g)=0$ for some irreducible complex character $\chi\in \mathrm{Irr}(G)$. Must a finite group and a finite simple group be isomorphic if they have equal orders and the same set of orders of vanishing elements?
