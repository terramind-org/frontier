  \section{Research Problems in Function Theory — Problem 6.93}\label{2306093}
  {\small\sffamily UnsolvedMath ID 2306093 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Write $\mathbb D=\{z\in\mathbb C:|z|<1\}$ and $\mathbb T=\partial\mathbb D$. The class $S$ consists of holomorphic injective functions $f:\mathbb D\to\mathbb C$ normalized by $f(0)=0$ and $f'(0)=1$, so $f(z)=z+\sum_{n=2}^{\infty}a_nz^n$. For $\Omega=f(\mathbb D)$ let $F:\Omega\to\mathbb D$ be the conformal inverse. The intersection $\Omega\cap\mathbb R$ can have multiple interval components; its integral means the one-dimensional Lebesgue integral over their union.
  \paragraph{Statement recorded in the supplied source.}
  For every $f\in S$ and every real $p$ with $1\le p<2$, is \[\int_{\Omega\cap\mathbb R}|F'(x)|^p\,dx<\infty?\] \sref{2306093}{2}
  The source records the affirmative endpoint $p=1$ and slit-domain counterexamples at $p=2$. \sref{2306093}{2}
  \subsection{Short English statement}
  Is the inverse derivative integrable on the real part of every normalized univalent image for every exponent from one up to, but excluding, two?
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:2306093:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, record 2306093 (AMR-022-6093). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:2306093:2}{S2}] W. K. Hayman and E. F. Lingham, \emph{Research Problems in Function Theory} (2018), Chapter 6, Problem 6.93 and its complete update; Chapter 6 initial notation. \url{https://arxiv.org/abs/1809.07200}.
  \end{description}
