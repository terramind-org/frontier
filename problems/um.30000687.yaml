title: Ball Conjecture for Twisted Bruhat Intervals
field: mathematics
tier: prose
statement: Let $(W,S)$ be a Coxeter system and let $\theta$ be an involutive automorphism such that $s\theta(s)$ never has odd order for $s\in S$ unless $\theta(s)=s$. Is every interval in $\operatorname{Br}(\iota(\theta))$ either a PL sphere or a ball?
