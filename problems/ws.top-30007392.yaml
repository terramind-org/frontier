statement: |-
  \section*{A limiting law for standardized low-temperature SK free energy}\label{30007392}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For Gaussian zero-field SK at every fixed $\beta >1$, does the centered free energy divided by its own standard deviation converge in distribution through all n to a nondegenerate mean-zero variance-one law with a finite exponential moment near zero, uniquely specified by the limiting moment sequence?
  \subsection{Short English statement}
  For Gaussian zero-field SK at every fixed $\beta >1$, does the centered free energy divided by its own standard deviation converge in distribution through all n to a nondegenerate mean-zero variance-one law with a finite exponential moment near zero, uniquely specified by the limiting moment sequence?
