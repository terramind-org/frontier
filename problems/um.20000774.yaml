title: A polarized rank-drop bound and the transcendental exponent bottleneck
field: mathematics
tier: prose
statement: |-
  Fix a number field and a degree. Look at all K3 surfaces over the number
  field of degree $2d$. Look at the Brauer group of the K3 surface modulo the
  Brauer group of the number field. Is there a uniform bound on the size of
  the quotient? What about the algebraic part? The transcendental part of the
  Brauer group? Note: the first two groups are known to be finite.
