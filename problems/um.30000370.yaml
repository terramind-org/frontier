title: Jump Processes from Families of Lévy Measures
field: mathematics
tier: prose
statement: Given a family of Lévy measures $\mu(x,dh)$ on $\mathbb{R}^d$, determine when it defines corresponding jump processes; obtain their heat-kernel properties; determine regularity of their harmonic functions; and determine whether the generator extends to that of a Feller semigroup.
