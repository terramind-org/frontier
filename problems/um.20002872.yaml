title: Openness criteria from maximum modulus and fiber geometry
field: mathematics
tier: prose
statement: |-
  **Problem 1 (S. Berhanu).** Let \(M^{2n-1}\subseteq\mathbb C^n\) be a real hypersurface satisfying the maximum principle for CR functions in the strong sense (continuous CR functions attaining a (weak) local maximum must be constant). Is it necessary that any local continuous CR function is open?

  **Remark.** In \(\mathbb C^2\) the hypothesis cannot hold.
