title: Strong Reverse Minkowski Conjecture
field: mathematics
tier: prose
statement: For a symmetric convex body $K$ and an $n$-dimensional lattice $L$ in $\mathbb{R}^n$, is $|K\cap L|\leq M(O(\log n)K,L)$? For the Euclidean unit ball $B_2^n$, is $|B_2^n\cap L|\leq M(O(\sqrt{\log n})B_2^n,L)$?
