statement: |-
  \section*{IID factors for invariant strongly Rayleigh laws on countable groups}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every countable group Gamma and every translation-invariant strongly Rayleigh probability law nu on ${0,1}^\Gamma $, does a Borel map from iid uniform labels to nu exist that commutes with every group translation on every label input?
  \subsection{Short English statement}
  For every countable group Gamma and every translation-invariant strongly Rayleigh probability law nu on ${0,1}^\Gamma $, does a Borel map from iid uniform labels to nu exist that commutes with every group translation on every label input?
