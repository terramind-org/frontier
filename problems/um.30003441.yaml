title: Atomic Measures on Irreducible Truncated Moment Varieties
field: mathematics
tier: prose
statement: Let $V=Z(p)$ be an irreducible real algebraic set. Must every recursively generated truncated moment matrix $M^{(n)}$ associated with $V$ admit a representing measure with $\operatorname{rank}M^{(n)}$ atoms? How can the variety change when $M^{(n)}$ is extended to $M^{(n+1)}$?
