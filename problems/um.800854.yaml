title: Randomstrasse101 Open Problems (2025) — Conjecture 2
field: mathematics
tier: prose
statement: |-
  We start with the notion of localization [MMP-2019-LPCliquesPaley,Kunisky-2023-SpectralPseudorandomnessPaleyClique]: Let $G_{p,1}$ denote the induced subgraph on the vertices adjacent to the node 0, which we call the 1-localization. Because the 1-localization does not depend on the node picked (see [Kunisky-2023-SpectralPseudorandomnessPaleyClique]) we have $\omega(G_p) \leq \omega(G_{p,1}) + 1 \leq \vartheta(\overline{G_p})+1$. It was observed empirically in [MMP-2019-LPCliquesPaley] that $\vartheta(\overline{G_{p,1}}) \sim \sqrt{p/2}$, which would recover the Hanson-Petridis bound (also, note that $G_{p,1}$ is a circulant graph and so the SDP corresponding to $\vartheta(\overline{G_{p,1}})$ reduces to an LP).

  $\vartheta(\overline{G_{p,1}}) \sim \sqrt{p/2}$ (for $p \equiv 1 \pmod{4}$ prime) where $G_{p,1}$ is the 1-localization of the Paley Graph described above.
