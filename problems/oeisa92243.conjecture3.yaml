  definitions:
    - name: OeisA92243.a
      kind: def
      text: |-
        /-- Score at stage $n$ in "tug of war" between prime gap increases vs. prime gap decreases. -/
        noncomputable def a (n : ℕ) : ℤ :=
          if n ≤ 1 then 0
          else
            ∑ k ∈ Finset.Icc 2 n,
              ((primeGap k : ℤ) - (primeGap (k - 1) : ℤ)).sign
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/OEIS/92243.lean#L39
