statement: . Is there a geometric map from BC2 into topological cyclic homology of a point? A recent manuscript by Kevin Costello, [ 3], relates conformal field theories to (the linear) Hochschild homology, and this might well be the place to start. In the same paper Costello announces a con- struction of the Deligne-Mumford compactification of the moduli space of Riemann surface in 6. The mapping class groups and homotopy theory 99 terms of the open moduli space. There is also preliminary work of Søren Galatius and Yasha Eliashberg which gives a homotopical description of a partial compactification of the stable mod- uli space.
