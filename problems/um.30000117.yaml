title: Finite-Dimensional Approximation of Bounded Analytic Functions
field: mathematics
tier: prose
statement: Let $f_1,\ldots,f_k\in H^\infty(D,\mathbb C^N)$ and $M(z)=\operatorname{span}\{f_1(z),\ldots,f_k(z)\}$. For every $\varepsilon>0$, is there a subspace $S\subset\mathbb C^N$ of dimension depending only on $k,\varepsilon$ such that every $g\in H^\infty(D,\mathbb C^N)$ with $\|g(z)\|_p\leq1$ on $D$ and $\operatorname{dist}_{\ell_p}(g(z),M(z))\leq\varepsilon$ almost everywhere on $\partial D$ satisfies $\operatorname{dist}_{\ell_p}(g(0),S)\leq\psi(\varepsilon)$ for some fixed $\psi$ with $\psi(\varepsilon)\to0$?
