title: Monomial signatures distinguish components through affine length eight
field: mathematics
tier: prose
statement: |-
  The AIM record (Problem 16 in *Components of Hilbert schemes*) asks:

  For an irreducible component \(C\), define its full monomial
  signature by
  \[
   \operatorname{Mon}(C)=\{I:[I]\in C\text{ and }I\text{ is monomial}\}. \]
  The question is whether \(C\mapsto\operatorname{Mon}(C)\) is injective. It is
  important that the question concerns equality of the entire sets, not whether two
  components share one monomial ideal.

  The source remarks that Richard Liebling might have given a counterexample for a
  Hilbert scheme of curves in his 1996 thesis. The thesis and later citations were
  identified, but accessible sources did not verify this precise assertion. A
  statement about generic initial ideals would not by itself establish equality of
  the full monomial signatures.
