title: Cyclic Right Translates in Weighted $\ell^p$ Spaces
field: mathematics
tier: prose
statement: For $p\geq1$ and a positive weight $\omega$ on $\mathbb{Z}$ with bounded successive ratios, characterize the weights for which some $x\in\ell^{p}_{\omega}(\mathbb{Z})$ has complete right translates $\{S^{n}x:n\geq0\}$.
