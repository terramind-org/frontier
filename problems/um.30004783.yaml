statement: For a pair $(G,\rho)$ and a cuspidal automorphic representation $\sigma$, do there exist nonzero $k^\times$-invariant linear functionals $E_{\sigma,\rho}$ and $E_{\widetilde{\sigma},\rho}$ such that $E_{\sigma,\rho}(\phi)=E_{\widetilde{\sigma},\rho}(F_{\sigma,\rho,\psi}\phi)$ for every $\phi\in S_{\sigma,\rho}(\mathbb{A}^\times)$?
