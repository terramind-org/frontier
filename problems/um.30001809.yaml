title: Simplicial Volume Bounds for Euler Characteristics
field: mathematics
tier: prose
statement: |-
  For every aspherical manifold $M$, does $\lVert M\rVert=0$ imply $\chi(M)=0$? More strongly, does there exist a constant $C(n)$ depending only on the dimension such that

  $$|\chi(M)|\leq C(n)\lVert M\rVert$$

  for every $n$-dimensional aspherical manifold $M$?
