title: Near-Soliton Dynamics of Equivariant Schrödinger Maps
field: mathematics
tier: prose
statement: For equivariant Schrödinger maps in $\mathbb{R}^2$ with initial data close in $\dot H^1$ to a harmonic-map soliton family $Q_m$, characterize the global dynamics, including whether finite-time blow-up can occur while the solution remains close to the noncompact soliton family.
