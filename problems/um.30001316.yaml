title: Quantization of Concentration Mass for Higher-Order Equations
field: mathematics
tier: prose
statement: For solutions of the higher-order critical equation $(-\Delta)^m u=\lambda u\exp(m u)$ with bounded concentration energy, must the concentration mass equal $L\Lambda_1$ for some positive integer $L$ when $m>2$, as it does for $m=1,2$?
