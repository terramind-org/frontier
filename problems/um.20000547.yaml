title: Exact one-way communication bounds for a frame-partition surrogate
field: mathematics
tier: prose
statement: |-
  Chuck started to describe a cooperative two-player game with partitioning the sets --> could we get an impossibility result via communication complexity?

  \* Greg Knese

  Can one formulate a cooperative communication problem whose outputs are
  Kadison--Singer/Weaver-type partitions, and can a communication lower bound
  give a valid obstruction to constructing such partitions efficiently?
