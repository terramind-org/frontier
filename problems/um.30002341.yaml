title: Spherical Hecke Modules on Homogeneous Schemes
field: mathematics
tier: prose
statement: For a homogeneous spherical $G$-scheme $X$ over the integers of a nonarchimedean local field, describe the module structure of the $K$-invariant compactly supported functions $C_c^\infty(X)^K$ over the spherical Hecke algebra $\mathcal H(G,K)$, including a description of $\mathcal H(G,K)$.
