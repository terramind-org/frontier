title: Linear Systems and Eigenvalue Problems — Problem 25
field: mathematics
tier: prose
statement: |-
  Consider a non-Hermitian $A\in{\mathbb{C}}^{n\times n}$ and suppose $Q\in{\mathbb{C}}^{n\times k}$ has orthonormal columns. We know that the Ritz values (eigenvalues of $Q^*AQ$) are located in the numerical range, $W(A) = \{v^*Av: \|v\|_2=1\}$, a closed, convex subset of ${\mathbb{C}}$ that contains the eigenvalues of $A$ (and, potentially, points far from these eigenvalues).

  - What can be said (deterministically or probabalistically) about the distribution of the Ritz values across $W(A)$ for $1<k<n$?

  - What if $Q$ is restricted to be a basis for a Krylov subspace? What if $Q$ is the basis for a random subspace?
