title: Open Problems in Mathematical Logic — Problem 34
field: mathematics
tier: prose
statement: |-
  - Can such a group $L$ have unsolvable word problem?

  - Is there a f.g., residually finite $\Pi$-group that is not effectively r.f.?

  - Morozov (Higman’s question revisited, 2000) constructed a $\Pi$-group that is not isomorphic to a subgroup of $S_{\text{rec}}$. Can we make such a group r.f.? It can't be e.r.f.
