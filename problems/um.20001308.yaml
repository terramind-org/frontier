title: Zonoid ratio in proportional-dimensional sections
field: mathematics
tier: prose
statement: |-
  Let \(K\) be a symmetric convex body. Define
  \[
  \operatorname{zr}(K)=
  \min_{\substack{Z\in\mathcal Z\\ Z\subset K}}
  \frac{|K|^{1/n}}{|Z|^{1/n}},
  \qquad
  \operatorname{vr}(K)=
  \min_{\substack{E\ \mathrm{ellipsoid}\\ E\subset K}}
  \frac{|K|^{1/n}}{|E|^{1/n}}.
  \]
  Clearly \(\operatorname{vr}(K)\geq \operatorname{zr}(K)\). Gordon and Junge proved that there is \(C_0>0\) such that every centrally symmetric \(K\subset\mathbb R^n\) has a section \(L\) of dimension \([n/2]\) with
  \[
  \operatorname{zr}(L)\geq C_0\operatorname{vr}(K).
  \]
  Given \(0<\lambda<1\), what is the greatest \(f(\lambda)>0\) such that every \(n\geq3\) and every \(n\)-dimensional convex body \(K\) have a section \(L\) of dimension \([\lambda n]\) for which
  \[
  \operatorname{zr}(L)\geq f(\lambda)\operatorname{vr}(K)?
  \]
