title: Local-Model Diagrams for Parahoric Shimura Varieties
field: mathematics
tier: prose
statement: |-
  Does every Shimura variety with parahoric level admit a local-model diagram

  $$S_K\longleftarrow\widetilde S_K\longrightarrow M^{\mathrm{loc}}$$

  in which the left map is a $K$-torsor and the right map is $K$-equivariant and smooth?
