title: Even morphisms characterize even polynomial quasi-hereditary geometric extension algebras
field: mathematics
tier: prose
statement: |-
  Given an algebraic group \(G\) acting on a variety \(X\) with finitely many orbits and a \(G\)-equivariant morphism \(\pi\colon \widetilde X\to X\), where \(\widetilde X\) is nonsingular (not necessarily connected), consider
  \[
  A=\operatorname{End}^{\bullet}_{D^b_G(X)}
        (\pi_*\underline{k}_{\widetilde X}),
  \]
  an algebra over \(H_G^\bullet(\mathrm{pt};k)\). What geometric condition on \(\pi\) is equivalent to \(A\) being quasi-hereditary over \(H_G^\bullet(\mathrm{pt};k)\)?
