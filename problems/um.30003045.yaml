title: Cohomology Kernels for Inseparable Pfister Composita
field: mathematics
tier: prose
statement: Let $L/F$ be a finite purely inseparable extension, let $B$ be an anisotropic bilinear Pfister form over $F$, and let $K/F$ be a separable quadratic extension, with $B$ remaining anisotropic over $L$. Is $H_2^{n+1}(L\mathbin{\cdot}K(B)/F)=H_2^{n+1}(L/F)+H_2^{n+1}(K/F)+H_2^{n+1}(F(B)/F)$?
