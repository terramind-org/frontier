title: Open Problems in Arithmetic Dynamics — Question 22
field: mathematics
tier: prose
statement: |-
  Let $Y_0^{\mathrm{dyn}}(n)$ and $Y_1^{\mathrm{dyn}}(n)$ be the dynamical modular curves
  classifying points, respectively cycles, of formal period $n$ attached
  to the family of maps $x^2+c$, or $x^m+c$, or some other natural
  $1$-parameter family of rational maps on $\mathbb{P}^1$ such as $bx+x^{-1}$.
  \begin{parts}

  (a)
  Describe the primes of bad reduction for $Y_0^{\mathrm{dyn}}(n)$ and $Y_1^{\mathrm{dyn}}(n)$.

  (b)
  Give a natural geometric/dynamical explanation for the ``sporadic''
  primes of bad reduction, which we imprecisely define as primes not
  dividing $n$ and not dividing a finite set of bad primes associated to
  the family $f$.

  (c)
  Describe the primes $p$ for which the reductions of $Y_0^{\mathrm{dyn}}(n)$
  and/or $Y_1^{\mathrm{dyn}}(n)$ modulo $p$ are geometrically irreducible, e.g.,
  for the latter, this is asking for the primes $p$ such that the
  polynomial $\Phi_n(x,z)$ does not factor in the ring $\bar\mathbb{F}_p[x,z]$.
  \end{parts}
