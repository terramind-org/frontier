  definitions:
    - name: SmarandacheWellinPrime.a
      kind: def
      text: |-
        /-- The Smarandache–Wellin sequence, indexed from zero. -/
        noncomputable def a : ℕ → ℕ
          | 0 => 2
          | n + 1 => decimalAppend (a n) ((n + 1).nth Nat.Prime)
