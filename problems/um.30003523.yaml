title: Equivariant Minimal Surfaces for Semisimple Representations
field: mathematics
tier: prose
statement: Let $\Sigma$ be a closed surface of genus at least $2$, let $\rho:\pi_1(\Sigma)\to G$ be a representation into a semisimple Lie group, and let $X=G/K$. Does there exist a smooth $\rho$-equivariant map $\widetilde\Sigma\to X$ whose image is a minimal surface?
