  module: FormalConjectures.OEIS.«46969»
  decl: OeisA46969.conjecture1
  statement: |-
    theorem conjecture1 (p : ℕ) (hp : p.Prime) (hp' : (2 * p - 1).Prime) (h3 : 3 < p) :
        (a p / 12).Prime
  context:
    - open OeisA46969
  definitions:
    - name: OeisA46969.a
      kind: def
      text: |-
        /-- Denominators of coefficients in Stirling's expansion for $\log(\Gamma(z))$. -/
        def a (n : ℕ) : ℕ :=
          if n = 0 then 0
          else
            let m := 2 * n
            let k := m * (m - 1)
            (bernoulli m / (k : ℚ)).den
