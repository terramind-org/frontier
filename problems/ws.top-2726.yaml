  \item[\hypertarget{source:statement:3}{S3}] Tobias Ekholm, Ko Honda and Tamás Kálmán, \emph{Legendrian knots and exact Lagrangian cobordisms}, arXiv:1212.1519v3 (2012), Definition 1.1 and footnote 1, p.\ 2; published in J.\ Eur.\ Math.\ Soc.\ 18 (2016), pp.\ 2627--2689. \url{https://arxiv.org/pdf/1212.1519v3}.
