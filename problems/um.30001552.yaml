title: Fine–Wilf Bounds for Antimorphic Periods
field: mathematics
tier: prose
statement: Let $\theta$ be an antimorphic involution on $A^*$ and let $p$ and $q$ be alternating $\theta$-periods of $w$. Is it true that $|w|\geq p+q-\gcd(p,q)$ implies that $\gcd(p,q)$ is a $\theta$-period of $w$?
