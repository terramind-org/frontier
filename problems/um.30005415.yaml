title: Uniform Local Cohomology Annihilators for Symbolic Powers
field: mathematics
tier: prose
statement: Let $(R,\mathfrak m,k)$ be a complete Cohen–Macaulay normal domain of dimension $d$, and let $I$ have pure height $h$. For each $1\leq j\leq d-h-1$, does there exist an ideal $\mathfrak a_j$ of height $d-j+1$ that uniformly annihilates $H^j_{\mathfrak m}(R/I^{(n)})$ for every $n\in\mathbb{N}$?
