title: An exact-flat Boolean model for Coxeter-Catalan numerology
field: mathematics
tier: prose
statement: Explain why the cardinalities of \(NC_W\), \(NN_W\), and the set of facets of \(\Delta_W\) are all \(\operatorname{Cat}(W)\), and why their rank, antichain-cardinality (“height”), and \(h\)-vector distributions are the same Narayana distribution. Find bijections preserving this numerology and an algebraic framework behind it. Explain Chapoton’s \(M\)-, \(F\)-, and \(H\)-triangle identities, give a theoretical proof of the Athanasiadis–Reiner refinement by \(W\)-orbits of intersection flats, relate it to a statistic on \(\Delta_W\), formalize Bessis’s dual Coxeter idea, and interpret \(\operatorname{Cat}(W)\) invariant-theoretically.
