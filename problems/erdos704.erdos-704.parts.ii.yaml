  definitions:
    - name: Erdos704.unitDistanceGraph
      kind: def
      text: |-
        /--
        The unit distance graph $G_n$ on $\mathbb{R}^n$: two points are adjacent if and only if the
        distance between them is $1$.
        -/
        def unitDistanceGraph (n : ℕ) : SimpleGraph (EuclideanSpace ℝ (Fin n)) where
          Adj x y := dist x y = 1
          symm.symm x y := by simp [dist_comm]
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/704.lean#L46
