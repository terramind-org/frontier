title: Strong Surjectivity of Countryman Derived Orders Under PFA
field: mathematics
tier: prose
statement: A *Countryman line* $C$ is an uncountable linear order whose square $C^2$ is a countable union of chains, and a linear order $L$ is *strongly surjective* if for every uncountable suborder $L' \subseteq L$ there is an order-preserving surjection $L' \twoheadrightarrow L$. Under the Proper Forcing Axiom ($\mathrm{PFA}$), is the dense/scattered companion linear order $\eta_C$ constructed from a Countryman line $C$ strongly surjective?
