title: Unimodular Placing Triangulations after Lattice Dilation
field: mathematics
tier: prose
statement: For every lattice polytope $P$, prove that there exist a positive integer $n$ and a total ordering of the lattice points of $nP$ for which the induced placing triangulation of $nP$ is unimodular.
