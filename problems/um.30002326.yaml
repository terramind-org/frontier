title: Sublinear Bounds for Disjoint Homometric Vertex Sets
field: mathematics
tier: prose
statement: Let $h(n)$ be the largest integer such that every connected $n$-vertex graph has two disjoint homometric vertex subsets, meaning their multisets of pairwise distances agree. Is $h(n)=o(n)$?
