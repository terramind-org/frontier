title: Embedding Interval Groups Without Thompson F into the G-Hierarchy
field: mathematics
tier: prose
statement: Does every finitely generated subgroup $G\leq\mathrm{PL}_+(I)$ that contains no copy of Thompson's group $F$ embed into $G_\xi$ for some $\xi<\varepsilon_0$? In particular, does every finitely generated elementary amenable subgroup of $F$ embed into some $G_\xi$?
