title: Open Problems in Arithmetic Dynamics — Conjecture 23 (Orbit Density Conjecture for $\mathbb{A}^N$)
field: mathematics
tier: prose
statement: |-
  \textup{(Medvedev--Scanlon, 2009,
  {[arxiv0901.2352, Conjecture 5.10]};
  Amerik--Bogomolov--Rovinsky, 2011,
  {[MR2862064, Conjecture 1.2]})}

  Let $f:\mathbb{A}^N\to\mathbb{A}^N$ be a morphism defined over ${\bar{\mathbb{Q}}}$, i.e.,
  $f=(f_1,\ldots,f_N)$, where the $f_i\in{\bar{\mathbb{Q}}}[x_1,\ldots,x_N]$ are
  polynomials with ${\bar{\mathbb{Q}}}$-coefficients. Assume that there is no
  rational function $g\in{\bar{\mathbb{Q}}}(x_1,\ldots,x_N)$ satisfying $g\circ
  f=g$. Then there exists a point $P\in\mathbb{P}^N({\bar{\mathbb{Q}}})$ whose
  orbit $\mathcal{O}_f(P)$ is Zariski dense in $\mathbb{P}^N$.
