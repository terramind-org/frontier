  \section*{Deterministic quasipolynomial mean-payoff games}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Do finite turn-based ordinary mean-payoff games with binary integer rewards admit deterministic quasipolynomial-time exact zero-threshold winning-set computation in the total binary input length?
