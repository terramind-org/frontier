title: Strong diffeomorphic approximation of three-dimensional Sobolev homeomorphisms up to exponent two
field: mathematics
tier: prose
statement: |-
  \section*{Strong diffeomorphic approximation of three-dimensional Sobolev homeomorphisms up to exponent two}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For arbitrary bounded connected open domains $Omega,Lambda\subset R^3$, every $1\leq p\leq 2$ and every $W^{1,p}$ homeomorphism f:Omega$\to$Lambda, do smooth $W^{1,p}$ diffeomorphisms $f_j$ between the same domains exist with $integral_Omega(|f_j-f|^p+|Df_j-Df|^p)\to 0$? No inverse Sobolev estimate or quasiconformal bound is requested.
  \subsection{Short English statement}
  For arbitrary bounded connected open domains $Omega,Lambda\subset R^3$, every $1\leq p\leq 2$ and every $W^{1,p}$ homeomorphism f:Omega$\to$Lambda, do smooth $W^{1,p}$ diffeomorphisms $f_j$ between the same domains exist with $integral_Omega(|f_j-f|^p+|Df_j-Df|^p)\to 0$? No inverse Sobolev estimate or quasiconformal bound is requested.
