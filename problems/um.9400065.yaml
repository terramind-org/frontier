title: Keating–Snaith moment conjecture for the Riemann zeta function
field: mathematics
tier: prose
statement: For fixed admissible $k$, does $T^{-1}\int_0^T|\zeta(1/2+it)|^{2k}\,dt$ have the Keating–Snaith asymptotic $a(k)G(k+1)^2G(2k+1)^{-1}(\log T)^{k^2}$, with $a(k)$ the predicted arithmetic Euler product and $G$ the Barnes $G$-function?
