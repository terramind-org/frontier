title: Equality rigidity and low-rank structure for roots of polynomial squared norms
field: mathematics
tier: prose
statement: |-
  **The radical of the set of squared norms of polynomial mappings** (proposed by
  John D'Angelo and Dror Varolin). Let $\mathcal P$ denote the set of Hermitian
  symmetric polynomials $R(z,\bar w)$, and let $\mathcal S\subset\mathcal P$ denote
  the set of squared norms of holomorphic polynomial mappings. For
  $R\in\mathcal P$, give a necessary and sufficient condition for the existence of
  a positive integer $N$ such that $R^N\in\mathcal S$. In other words, when do
  there exist $N$ and holomorphic polynomials $p_j$ such that
  \[
  R(z,\bar z)^N=\sum_{j=1}^k |p_j(z)|^2?
  \tag{1.1}
  \]
  It is known that $R^N\in\mathcal S$ implies
  \[
  |R(z,\bar w)|^2\le R(z,\bar z)R(w,\bar w).
  \tag{1.2}
  \]
  This inequality can hold without $R$ being a squared norm. Also,
  $R\in\mathcal S$ if and only if every matrix
  $[R(z_i,\bar z_j)]_{i,j=1}^k$ is nonnegative semidefinite. Equivalently, under
  hereditary functional calculus, $R([A],[A^*])\succeq0$ for all finite commuting
  square-matrix tuples $[A]=(A_1,\ldots,A_n)$.
