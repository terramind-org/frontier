title: Exceptional Collections and Twisted Cubics on Fano Varieties
field: mathematics
tier: prose
statement: Let $X$ be a Küchle fourfold of type $(c5)$, realized as a half-anticanonical section of the associated fivefold $Y$. Does $Y$ have a full exceptional collection of length $12$ with a rectangular Lefschetz structure? Is the Hilbert scheme of rational twisted cubic curves on $X$ birational to a hyperkähler fourfold?
