title: Open Problems and Questions about Geodesics — Question 9 (Gromov)
field: mathematics
tier: prose
statement: |-
  It was shown by Gromov in [Gromov2001] that
  if $M$ is simply connected
  there is a constant $C$ such that the
  sum of the Betti numbers of $\Lambda_{CN}$ is at least
  $
  \sum_{i=0}^N b_{i}(\Lambda)$.

  *Does the number of closed geodesics with length $\leq T$ grow exponentially as $T \to \infty$ if the Betti numbers of the loop space grow exponentially?*
