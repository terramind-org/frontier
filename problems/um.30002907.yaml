title: Invariant Prym Homology and Arithmetic Monodromy
field: mathematics
tier: prose
statement: Let $S_K\to S_{g,n}$ be the finite Galois cover defined by a mapping-class-invariant finite-index subgroup $K\subset\pi_1(S_{g,n})$, let $H_K=H_1(\overline{S}_K;\mathbb{Q})$, let $N_K$ be the group of lifted mapping classes, and let $\mathcal G_K$ be the Zariski closure of its monodromy representation $\rho$. For $g\geq3$, is $H_K^{\mathcal G_K^\circ}=0$, and is $\rho(N_K)$ arithmetic in $\mathcal G_K$?
