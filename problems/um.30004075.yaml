title: Localization of Finitistic Test Ideals
field: mathematics
tier: prose
statement: |-
  Let $R$ be an $F$-finite Noetherian domain of characteristic $p>0$, let $\mathfrak a\neq0$ be an ideal, let $t>0$, and let $S\subset R$ be multiplicatively closed. Is

  $$S^{-1}\tau_{\mathrm{fg}}(\mathfrak a^t)=\tau_{\mathrm{fg}}\bigl((S^{-1}\mathfrak a)^t\bigr).$$ 

  Does this equality hold?
