title: Extreme Gravity-Capillary Waves with General Vorticity
field: mathematics
tier: prose
statement: For periodic traveling water waves with general vorticity, does a sequence of almost-extreme symmetric monotone waves with $\max \psi_Y^j\to0$ converge to an extreme wave satisfying the Stokes $120^\circ$ corner condition at stagnation points, rather than to a smooth wave with a bottom stagnation point?
