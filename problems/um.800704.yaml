title: Open Problems on Central Simple Algebras — Problem 14
field: mathematics
tier: prose
statement: |-
  To simplify the discussion note the result of Katsylo [Katsylo] and Schofield [Schofield] that if $n = ab$ for $a$ and $b$ relatively prime, then $Z(F,n)$ is stably isomorphic to the field compositum $Z(F,a) Z(F,b)$. Similar statements are possible for the $Z_m(F,n)$ and $Z_H(F,n)$. This often (but not always) allows reduction to the case where $n$ is a prime power.

  *[procesi:67, p. 240]*
  Is $Z(F,n)/F$ rational, stably rational, or retract rational? The same question for $Z_m(F,n)$ and $Z_H(F,n)$.
