title: Kourovka Notebook Problem 9.19
field: mathematics
tier: prose
statement: |-
  a) Let $n(X)$ denote the minimum of the indices of
  proper subgroups of a group $X$. A subgroup $A$ of a finite group $G$
  is called *wide* if $A$ is a maximal element by inclusion of
  the set $\{ X\mid X \mbox{ is a proper subgroup of }G\mbox{ and
  }n(X)=n(G)\} $. Find all wide subgroups in finite projective special
  linear, symplectic, orthogonal, and unitary groups.

  [Archived solved part(s) of 9.19:]
  b) Let $n(X)$ denote the minimum of the indices of proper
  subgroups of a group $X$. A subgroup $A$ of a finite group $G$
  is called *wide* if $A$ is a maximal element by inclusion of
  the set $\{ X\mid X \mbox{ is a proper subgroup of}G\mbox{ and
  }n(X)=n(G)\} $. Prove, without using CFSG, that
  $n(F_1)=|F_1:2F_2|$, where $F_1$ and $F_2$ are the Fischer simple
  groups and $2F_2$ is an extension of a group of order 2 by $F_2$.
