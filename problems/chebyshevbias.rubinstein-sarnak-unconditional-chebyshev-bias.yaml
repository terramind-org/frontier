lean:
  module: FormalConjectures.Wikipedia.ChebyshevBias
  decl: ChebyshevBias.rubinstein_sarnak_unconditional_chebyshev_bias
  statement: |-
    theorem rubinstein_sarnak_unconditional_chebyshev_bias :
        ∃ δ : ℝ, (1 : ℝ) / 2 < δ ∧ δ < 1 ∧ Set.HasLogDensity chebyshevModFourLeadSet δ
  context:
    - open ChebyshevBias
  definitions:
    - name: ChebyshevBias.chebyshevModFourLeadSet
      kind: def
      text: |-
        /-- Integers $n \in \mathbb{N}$ where $\pi(n; 4, 3) > \pi(n; 4, 1)$. -/
        def chebyshevModFourLeadSet : Set ℕ :=
          {n : ℕ | n.primeCountingMod 4 1 < n.primeCountingMod 4 3}
