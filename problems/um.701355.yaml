title: Kourovka Notebook Problem 17.53
field: mathematics
tier: prose
statement: |-
  A finite group $G$ is called *simply
  reducible* (SR-group) if every element of $G$ is conjugate to
  its inverse, and the tensor product of any two irreducible
  representations of $G$
  decomposes
  into a sum of irreducible representations of $G$ with coefficients
  $0$ or $1$.

  a) Is it true that the nilpotent length of a
  soluble SR-group is at most $5$?

  b) Is it true that the derived length of a
  soluble SR-group is bounded by some constant $c$?
