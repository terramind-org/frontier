title: Arbitrary-period stability exchange on the local Zaitsev branch
field: mathematics
tier: prose
statement: |-
  Consider the KP-I equation
  \[
  (u_t-u_{xxx}+c u_x+u u_x)_x+u_{yy}=0.
  \]
  The KdV line soliton has no \(y\)-variation and is unstable to transverse
  perturbations. A family of \(y\)-periodic waves bifurcates from it and
  connects to the lump solution, which was then presumed stable.

  **What is the stability of the KP-I soliton solution with periodic
  structure?**
