title: Holomorphic Foliation Theory — Problem 11
field: mathematics
tier: prose
statement: |-
  Find the minimal growth of the Nevanlinna characteristic function $T_h$ for $h\in\mathscr{U}$, where
  $$T_h(r):=\int_0^r {dt \over t} \int_{\mathbb{D}(t)} h^*(\omega)$$
  and $\omega$ is the Fubini-Study form on $\mathbb{P}^1$.
