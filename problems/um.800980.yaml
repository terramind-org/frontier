title: Open Problems and Questions about Geodesics — Conjecture 61
field: mathematics
tier: prose
statement: |-
  We ask whether there exists a non-constant smooth
  function on the tangent bundle which is constant along every trajectory. It is well known, see e.g.\ [Tabachnikov2005], that a billiard in an ellipse is integrable.

  *If the billiard in $\Omega$ is integrable, then the boundary of $\Omega$ is an ellipse. *
