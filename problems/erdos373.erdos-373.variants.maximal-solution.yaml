lean:
  module: FormalConjectures.ErdosProblems.«373»
  decl: Erdos373.erdos_373.variants.maximal_solution
  statement: |-
    theorem erdos_373.variants.maximal_solution :
        (16, [14, 5, 2]) ∈ S ∧ ∀ s ∈ S, s.fst ≤ 16
  context:
    - open Erdos373
    - open Erdos373.erdos_373
    - open Erdos373.erdos_373.variants
    - open scoped Nat
  definitions:
    - name: Erdos373.S
      kind: abbrev
      text: |-
        /--
        Let `S` be the set of non-trivial solutions to the equation `n! = a₁! ··· aₖ!`
        such that `a₁ ≥ ... ≥ aₖ` and `n-1 > a₁`.
        -/
        abbrev S : Set (ℕ × List ℕ) :=
          {(n, l) | n ! = (l.map Nat.factorial).prod ∧ l.Pairwise (· ≥ ·)
            ∧ l.headI < (n - 1 : ℕ) ∧ ∀ a ∈ l, 1 < a }
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/ErdosProblems/373.lean#L32
