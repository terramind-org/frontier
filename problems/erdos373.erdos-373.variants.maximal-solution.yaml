id: erdos373.erdos-373.variants.maximal-solution
title: "Erdős Problem 373 (variant: maximal_solution)"
field: mathematics
tier: proof
statement: |-
  Hickerson conjectured the largest solution the equation `n!=a_1!a_2!···a_k!`, with
  `n−1 > a_1 ≥ a_2 ≥ ··· ≥ a_k`, is `16!=14!5!2!`.
