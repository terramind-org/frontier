title: Kourovka Notebook Problem 17.98
field: mathematics
tier: prose
statement: |-
  A variety of groups is said to be *small*
  if it contains only countably many non-isomorphic finitely
  generated groups.

  a) Is it true that if $G$ is a finitely
  generated group and the variety
  $\mathrm{Var}(G)$ it generates is
  small then $G$ satisfies the
  maximal condition on normal subgroups?

  b) Is it true that a variety is
  small if and only if all its finitely
  generated groups have the Hopf property?
