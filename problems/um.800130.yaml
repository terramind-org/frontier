title: Foliations and Diffeomorphism Groups — Question 71
field: mathematics
tier: prose
statement: |-
  As $B\Gamma_H$ has a trivial $\pi_2$ there is no nontrivial spherical cycle in
  $H_2(B\Gamma_H; {\mathbb{Z}})$.
  It is also known that all maps from the
  2-torus $T^2$ to $B\Gamma_H$ yield trivial cycles in $H_2(B\Gamma_H; {\mathbb{Z}})$.

  (Tsuboi [MR3726712]) Determine whether $H_2(B\Gamma_H;{\mathbb{Z}})=0$.
