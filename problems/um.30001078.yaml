title: Boundary Geometry and Maximal Visibility in Random Media
field: mathematics
tier: prose
statement: In the Boolean model of visibility from the origin, let $T$ be the set of visible points. Can the boundary of $T$ be described more precisely? More generally, what can be said about maximal visibility in other random media, such as bicolored random tessellations?
