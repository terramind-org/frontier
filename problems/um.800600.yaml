title: Selection Principles in Mathematics — Problem 28 ([coc8])
field: mathematics
tier: prose
statement: |-
  $\mathsf{S}_1(\Omega,\gimel(\Omega))$ is strictly stronger than $\mathsf{S}_1(\mathcal{O},\mathcal{O})$ [strongdiags].
  $\mathsf{S}_1(\Omega,\gimel(\Omega))=\mathsf{U}_{\mathrm{fin}}(\mathcal{O},\Omega)\cap\mathsf{S}_1(\mathcal{O},\mathcal{O})$ [strongdiags],
  so the following problem can also be stated in classical terms.

  Is $\mathsf{S}_1(\Omega,\Omega)=\mathsf{S}_1(\Omega,\gimel(\Omega))$?
