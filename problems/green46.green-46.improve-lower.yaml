  definitions:
    - name: Green46.maxY
      kind: def
      text: |-
        /-- The maximum $y$ for a given $x$, cast to a real number for asymptotics. -/
        noncomputable def maxY (x : ℕ) : ℝ :=
          ((sSup { y | IsCoveredByResidues x y } : ℕ) : ℝ)
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/GreensOpenProblems/46.lean#L51
    - name: Green46.bestLower
      kind: def
      text: |-
        /-- Best-known lower bound [FGK18], improving on [Ra38]. -/
        noncomputable def bestLower (x : ℕ) : ℝ :=
          (x : ℝ) * Real.log (x : ℝ) * Real.log (Real.log (Real.log (x : ℝ))) / Real.log (Real.log (x : ℝ))
      url: https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/GreensOpenProblems/46.lean#L55
