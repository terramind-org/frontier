title: Spanning-Tree Growth Rates Near One
field: mathematics
tier: prose
statement: |-
  In the graph-complexity reformulation of Lehmer's Mahler-measure problem (Hironaka), for a planar graph $G$ embedded in the punctured plane $\mathbb{R}^2 \setminus \{0\}$, let $G_r$ be its $r$-fold cyclic covering graph and let $\tau(G_r)$ be the number of spanning trees of $G_r$. Given $\varepsilon > 0$, does there exist a graph $G$ in the punctured plane such that
  $$
  1 < \lim_{r \to \infty} \tau(G_r)^{1/r} < 1 + \varepsilon?
  $$
