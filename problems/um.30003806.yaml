id: um.30003806
title: Cutoff Parameters for Quantum-Group Random Walks
field: mathematics
tier: prose
statement: On the quantum permutation group $S_N^+$, let $\varphi$ define the quantum random walk by $$\varphi(u_{ij}^n)=\delta_{ij}\left(\frac{N-1}{N}\frac{T_{2n}(\sqrt{N-2})}{T_{2n}(\sqrt N)}+\frac1N\right),$$ where $T_0(X)=1$, $T_1(X)=X$, and $XT_n(X)=T_{n+1}(X)+T_{n-1}(X)$. Prove or disprove that the completely bounded norm of $P_{\varphi}=(\operatorname{id}\otimes\varphi)\circ\Delta$ gives the correct cutoff parameter.
