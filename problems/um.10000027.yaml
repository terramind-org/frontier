title: Percolation thresholds along expander limits
field: mathematics
tier: prose
statement: Let $(G_n)$ be a bounded-degree expander family converging locally to an infinite graph $G$. Prove that the finite-graph percolation thresholds $p_c(G_n)$ converge to $p_c(G)$.
