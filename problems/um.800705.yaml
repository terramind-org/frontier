title: Open Problems on Central Simple Algebras — Problem 15
field: mathematics
tier: prose
statement: |-
  There are a few results for the $Z_m(F,n)$. The field $Z_2(F,4)$ is stably rational by Saltman [Salt:symp], and Saltman--Tignol [SaltTig] showed that $Z_2(F,8)$ is retract rational. Beneish [Beneish:28] showed that $Z_2(F,8)$ is stably rational.
  Finally, we leave to the well-read reader to prove that when $H \subset S_n$ is cyclic and transitive and $F$ contains a primitive $n$-th root of unity, then $Z_H(F,n)$ is rational (and results *are* available for general $F$, $n$ not of the form $8m$, and retract rationality). Thus the first interesting specific question along these lines is:

  Determine if $Z_H(F,9)$ is rational, stably rational, or retract rational, where

  $H = C_3 \times C_3 \subset S_9$ is transitive.
