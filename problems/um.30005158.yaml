title: Foschi Maximizers for Wave Strichartz Inequalities
field: mathematics
tier: prose
statement: |-
  For every spatial dimension $d\geq2$, does the wave-equation initial datum

  $$(u_0,\dot u_0)=\bigl((1+|x|^2)^{-(d-1)/2},0\bigr)$$

  maximize the sharp Strichartz inequality?
