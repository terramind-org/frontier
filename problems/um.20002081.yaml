title: Pullback Hamiltonians, maximality, and toric Floer resonances
field: mathematics
tier: prose
statement: "**Question 1.23.** Polterovich also suggested that it if \\(\\Phi:M\\to B\\) is a [what kind of?] fibration, then the set \\(\\{\\Phi^*H\\mid H:M\\to\\mathbb R\\}\\) is a “maximal torus” in \\(\\operatorname{Ham}(M)\\) and should provide a good source of examples for calculations in Floer homology. [There was then some further discussion of locally toric fibrations by various people of which I do not have good notes.]"
