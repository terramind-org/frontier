statement: |-
  \section{Extremal Top-$m$ Representability of Output Projection Matrices}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  For $z\in\mathbb R^N$, $\operatorname{softmax}(z)_i=e^{z_i}/\sum_j e^{z_j}$. Its probability ranking agrees with the ranking of logits. An output projection sends an embedding $x$ to the token-score vector $Ax$.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The supplied statement does not specify strict ordering or tie-breaking, and allows the trivial full-vocabulary set if $m=N$ is permitted. Any restriction $m<N$ or strict separation from remaining tokens must come from the source, not be silently imposed.

  Source-record limitation: The literal largest-m target allows m=N, which is trivial, while the tie/strict-ranking convention and intended nontrivial range are absent; the precise extremal target is not recoverable from this cleaned extraction.
  \paragraph{Statement recorded in the supplied source.}
  For a vocabulary of $N$ tokens and embedding dimension $d$, what is the largest $m$ for which there exists an output projection matrix $A\in\mathbb R^{N\times d}$ such that, for every set of $m$ tokens, some embedding $x\in\mathbb R^d$ makes those tokens the $m$ most probable under $\operatorname{softmax}(Ax)$? \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-22.
  \subsection{Short English statement}
  Determine how large every representable most-likely token subset can be for a chosen output projection.
