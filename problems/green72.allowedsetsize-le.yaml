lean:
  module: FormalConjectures.GreensOpenProblems.«72»
  decl: Green72.allowedSetSize_le
  statement: |-
    theorem allowedSetSize_le {k : ℕ} {N : ℕ} :
        AllowedSetSize k N ≤ (k - 1) * N
  context:
    - open Green72
  definitions:
    - name: Green72.AllowedSetSize
      kind: def
      text: |-
        /-- The maximal size of an allowed set -/
        noncomputable def AllowedSetSize (k : ℕ) (N : ℕ) : ℕ :=
          sSup {r | ∃ s, r = s.card ∧ AllowedSet k N s}
      url: https://github.com/google-deepmind/formal-conjectures/blob/197f7f8dcc457f556754f826389d2ec7a0d85b92/FormalConjectures/GreensOpenProblems/72.lean#L54
