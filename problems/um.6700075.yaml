title: "Scalar Curvature Question [?79]: InvarianceandNon-invarianceof Sc∩(Y ) = +∞"
field: mathematics
tier: prose
statement: Conjecture. InvarianceandNon-invarianceof Sc∩(Y ) = +∞. The inequalitySc[n] g∩(Y ) =+∞is independent of the Riemannian metric g in W ⊃Y Moreover it is a bi-Lipschitz invariant. But it is not a topological invariant. There is no serious evidence here, but there are a few examples. For instance, givenk = 1, 2,...,n −2 and µ > 0, one can arrange nested neighbourhoodsVεi, i= 1, 2,..., of ﬂatk-subtori inW = Tn+1 such that Sc(∂Vεi) →∞and such that the Lebesgue measure of their (solenoidal) intersectionY will be equalmes(W)−µ. (With a little eﬀort, one can make a similar construction with all Vε homeomorphic to thek-ball.) On the other hand, there, probably, existcompact zero dimensional (Cantor) setsY ⊂Rn+1 with Sc[n] ∩(Y ) ≠+∞. (Compare 5.3 in [48].) 78
