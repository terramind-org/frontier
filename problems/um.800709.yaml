title: Open Problems on Central Simple Algebras — Problem 19
field: mathematics
tier: prose
statement: |-
  Suppose $\sigma$ is an anisotropic orthogonal or symplectic
  involution on a central simple algebra $A$ over a field $F$. Does
  $\sigma$ remain anisotropic after scalar extension to any odd-degree
  field extension of $F$?
