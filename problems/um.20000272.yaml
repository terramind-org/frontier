title: Exponential truth fitted by Gaussian linear regression
field: mathematics
tier: prose
statement: |-
  As another example, let us assume the true model is a linear
  regression. \(Y=\exp(X)+\epsilon\) where
  \(\epsilon\sim N(\mu,\sigma^2)\). Let us assume that we try to fit a
  linear regression model to the data, i.e. \(y=bx+\epsilon\).

  What is the behavior of the stochastic complexity in this case?

  Data have conditional mean \(\exp(X)\), plus Gaussian noise, but are
  fitted with a Gaussian linear regression.  Determine the
  KL projection and the asymptotic Bayesian stochastic complexity
  (negative log marginal likelihood).
