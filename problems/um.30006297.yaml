id: um.30006297
title: Vanishing Theorems for Divisors on Matroid Wonderful Varieties
field: mathematics
tier: prose
statement: Let $W_L$ be the wonderful variety of a realizable matroid and let $D$ be a nef divisor on the ambient permutohedral variety. Prove that $H^i(W_L,\mathcal{O}_{W_L}(D|_{W_L}))=0$ for every $i>0$; if $D|_{W_L}$ is also big, prove that $H^i(W_L,\mathcal{O}_{W_L}(K_{W_L}+D|_{W_L}))=0$ for every $i>0$. Also determine whether $H^i(W_L,\mathcal{O}_{W_L}(-K_{W_L}-\partial W_L))=0$ for every $i<\dim W_L$.
