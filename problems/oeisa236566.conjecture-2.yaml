title: Ordered ways to write $2n = p + q$ with $p, q$ and $p_{p+2} + 2$ all prime (conjecture_2)
field: mathematics
tier: proof
statement: |-
  Conjecture: (ii) If $n > 30$, then $2n + 1$ can be written as $2p + q$ with $p$, $q$ and
  $\operatorname{prime}(p + 2) + 2$ all prime.
