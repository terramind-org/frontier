lean:
  module: FormalConjectures.OEIS.«236566»
  decl: OeisA236566.conjecture_2
  statement: |-
    theorem conjecture_2 (n : ℕ) (hn : 30 < n) :
        ∃ p q : ℕ, p.Prime ∧ q.Prime ∧ (Nat.nth Nat.Prime (p + 1) + 2).Prime ∧
          2 * n + 1 = 2 * p + q
