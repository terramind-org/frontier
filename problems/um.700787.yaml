title: Kourovka Notebook Problem 11.95
field: mathematics
tier: prose
statement: |-
  Suppose that $G$ is a $p
  $-group
  $G$ containing an element $a$ of order $p$
  such that the subgroup $\left< a, a^g\right> $ is finite for any
  $g$ and the set $C_G(a) \cap a^G$ is finite. Is it true that $G$
  has non-trivial
  centre? This is true for 2-groups.
