title: Weak-Arithmetic Pigeonhole Principles
field: mathematics
tier: prose
statement: Let $\mathrm{PHP}_n^m(f)$ assert that $f$ does not inject $\{1,\ldots,m\}$ into $\{1,\ldots,n\}$. Does $\mathrm I\Delta_0$ prove $\mathrm{PHP}_n^{n+1}(\Delta_0)$, or even $\mathrm{PHP}_n^{n^2}(\Delta_0)$? Does $\mathrm I\Delta_0(f)$ prove $\mathrm{PHP}_n^{2n}(f)$, or even $\mathrm{PHP}_n^{n^2}(f)$?
