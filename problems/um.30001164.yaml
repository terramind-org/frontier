title: Lieb–Thirring Refinements and the Ovals Conjecture
field: mathematics
tier: prose
statement: Let $E_1<E_2\leq\cdots\leq0$ be the negative eigenvalues of $-\Delta-V$ on $L^2(\mathbb R^n)$, where $V\geq0$. When a power of $V$ is integrable strongly enough to make the left-hand side finite, does $$\sum_j|E_j|^\gamma\leq C|E_1|^\gamma$$ hold with $C$ depending only on $n$, $\gamma$, and that integrability data? In one dimension with $\gamma=1$, can the Eden–Foias result be proved directly or sharpened by correction terms, and can the eigenvalue sum be estimated without the Birman–Schwinger transformation? Finally, among smooth closed curves of length $2\pi$ in $\mathbb R^3$, is the principal eigenvalue of $-d^2/ds^2+\kappa(s)^2$ minimized by the circle?
