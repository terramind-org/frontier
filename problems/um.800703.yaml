title: Open Problems on Central Simple Algebras — Problem 13
field: mathematics
tier: prose
statement: |-
  Define a notion of ``dimension'' for some class of fields $F$ such that
  \[
  \operatorname{Br.\!dim}(F) \le \dim F - 1 \quad \text{and} \quad \dim(F(t)) = \dim F + 1.
  \]
  One possibility would be to set a $C_i$ field to have dimension $i$. The notion of cohomological dimension is obviously not the right one in view of Merkurjev's example of a field $F$ with cohomological dimension 2 and $\operatorname{Br.\!dim}(F) = \infty$ from [M:simple].
