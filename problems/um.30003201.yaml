title: Scope of the Generalized Tracial-Rank-One Class
field: mathematics
tier: prose
statement: Define $\mathcal N_1$ to consist of separable, unital, simple, amenable, $\mathcal Z$-stable $C^*$-algebras $A$ satisfying the UCT and $\operatorname{gTR}(A\otimes U)\leq1$ for some infinite-type UHF algebra $U$. How large is $\mathcal N_1$, and which $C^*$-algebras belong to it?
