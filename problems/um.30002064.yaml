title: Matveev–Jaco–Rubinstein Lens-Space Complexity Conjecture
field: mathematics
tier: prose
statement: For coprime integers $p>q>0$ with $p>3$, is the complexity of the lens space $L(p,q)$ equal to $E(p,q)-3$, where $E(p,q)$ is the sum of the partial denominators in the continued-fraction expansion of $p/q$?
