title: "Henon Maps: Open Problems — Question 45"
field: mathematics
tier: prose
statement: |-
  It is unclear how to extend this construction to a larger class of polynomial automorphisms of $\mathbb{C}^3$.
  However when $\lambda(f)^2>\lambda(f^{-1})$ an invariant valuation on the ring of polynomial functions in three variables (One way to interpret geometrically such an object
  is to say that it picks an irreducible subvariety in *any* algebraic compactification of $\mathbb{C}^3$ in a compatible way.)
  is known to exist by [DF20], which suggests the following question.

  Let $f\in \mathrm{Aut}[\mathbb{C}^3]$ be any polynomial automorphism such that $\lambda(f)^2>\lambda(f^{-1})$.
  Prove the existence of a projective compactification $X$ of $\mathbb{C}^3$ such that
  the induced birational map $f\colon X \dashrightarrow X$ admits a super-attracting
  fixed point $p$ on the divisor at infinity.
