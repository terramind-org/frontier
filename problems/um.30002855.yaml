statement: For a semisimple simply connected group $G$ in characteristic $p$ greater than its Coxeter number, can the principal tilting category $\mathrm{Tilt}_0$ be given a right $\mathcal{D}$-module structure with $B_s$ acting as translation, together with an equivalence $\mathrm{AS}_{\mathrm{deg}}\simeq \mathrm{Tilt}_0$ of right $\mathcal{D}$-module categories?
