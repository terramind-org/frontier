title: Question 3.14 — (Rational growth for properties).
field: mathematics
tier: prose
statement: "(Rational growth for properties). For which properties P is the function fP is rational? Densities. For any subset S⊂ Modg, it is natural to ask how common elements of S are in Mod g. There are various ways to interpret this question, and the answer likely depends in a strong way 2. Some problems on mapping class groups and moduli space 29 on the choice of interpretation 4. One way to formalize this is via the density d(S) of S in Mod g, where d(S) = lim r→∞ #[B(r)∩S] #B(r) (9) where B(r) is the number of elements of Mod g in the ball of radius r, with respect to a fixed set of generators. While for subgroups H <Modg the number d(H) itself may depend on the choice of generating sets for H and Mod g, it is not hard to see that the (non)positivity of d(H) does not depend on the choices of generating sets. As the denominator and (typically) the numerator in (9) are exponential, one expects that d(S) = 0 for most S. Thus is it natural to replace both the numerator and denominator of (9) with their logarithms; we denote the corresponding limit as in (9) by dlog(S), and we call this the logarithmic density of S in Mod g. The following is one interpretation of a folklore conjecture."
