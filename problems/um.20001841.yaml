title: Arbitrary-genus realization and a topology-curvature tradeoff
field: mathematics
tier: prose
statement: |-
  Existence of high genus free boundary minimal surface in $B^3$.

  The exact AIM record (Geometry, “Geometric flows and Riemannian geometry,” section “Eigenvalue Estimates,” Problem 5.2) is:

  I use the standard strong reading:

  * $B^3=\{x\in\mathbb R^3:|x|\leq 1\}$ is the closed unit ball;
  * $\Sigma\subset B^3$ is a smooth, compact, connected, orientable, properly embedded surface, so $\Sigma\cap\partial B^3=\partial\Sigma$;
  * its mean curvature vanishes, and it meets $S^2=\partial B^3$ orthogonally (the free-boundary condition);
  * “genus” is orientable genus, and “high genus” can mean either genera tending to infinity, every sufficiently large genus, or the strongest version, every prescribed genus;
  * unless stated otherwise, the number $b$ of connected components of $\partial\Sigma$ is not prescribed.

  The source does not say “embedded,” “orientable,” or “connected boundary.” Modern results solve the question with all of those additional properties: one may prescribe every genus, and even every positive number of boundary components. Nothing below silently changes the source; these are explicit strengthened readings. Nonorientable crosscap genus is a different realization problem and is not asserted here.
