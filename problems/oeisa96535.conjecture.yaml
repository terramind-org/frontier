      text: |-
        /-- Recurrence $a(n) = (a(n-1) + a(n-2)) \pmod n$. -/
        def a : ℕ → ℕ
          | 0 => 1
          | 1 => 1
          | n + 2 => (a (n + 1) + a n) % (n + 2)
