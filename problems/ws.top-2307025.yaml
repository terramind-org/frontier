  \item[\hypertarget{source:2307025:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, record 2307025 (AMR-022-7025). CC BY4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
