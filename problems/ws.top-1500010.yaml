  \item[\hypertarget{source:statement:2}{S2}] R. Fröberg, S. Lundqvist, A. Oneto and B. Shapiro, \emph{Algebraic Stories from One and from the Other Pockets}, arXiv:1801.01692 (2018), §2.2, Problem F. \url{https://arxiv.org/abs/1801.01692}.
  \end{description}
  \label{end:statement}
