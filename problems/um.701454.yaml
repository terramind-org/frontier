title: Kourovka Notebook Problem 18.25
field: mathematics
tier: prose
statement: |-
  Let $\mathrm{form}(G)$ be the formation generated by a finite group $G$. Suppose that $G$ has a unique composition series
  $ 1\vartriangleleft G_1\vartriangleleft G_2\vartriangleleft G$ and the consecutive factors of this series are $Z_p$, $X$, $Z_q$,
  where $p$ and $q$ are primes and $X$ is a non-abelian simple group. Is it true that $\mathrm{form}(G)$ has infinitely many subformations if and only if $p=q$?
