title: Positivity of Cohomological and K-Theoretic Quiver Coefficients
field: mathematics
tier: prose
statement: For any quiver cycle $\Omega\subset V$, are the cohomological quiver coefficients $c_{\mu}(\Omega)$ nonnegative when $|\mu|=\operatorname{codim}(\Omega;V)$, are only finitely many $K$-theoretic coefficients $c_{\mu}(\Omega)$ nonzero, and, if $\Omega$ has rational singularities, do they satisfy $(-1)^{|\mu|-\operatorname{codim}(\Omega;V)}c_{\mu}(\Omega)\geq0$?
