statement: For the ring $\mathcal O_{\mathbb Q_{\mathrm{tr}}^{(d)}}$ of totally real algebraic integers, is $\{\alpha:|\alpha|<X\}$ finite for every $X\geq1$, where $|\alpha|$ is the maximum modulus of the conjugates of $\alpha$?
