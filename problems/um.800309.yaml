title: Group Actions on 1-Manifolds — Question 26
field: mathematics
tier: prose
statement: |-
  For which values of $r > 1$ there exists $s \geq r$ such that for every $C^s$ circle diffeomorphism $f$ of irrational rotation number $\rho$,
  the sequence $f^{q_n}$ converges to the identity in the $C^r$ topology, where $(q_n)$ is the sequence of denominators of the rational approximations of $\rho$ ?
