lean:
  module: FormalConjectures.ErdosProblems.«967»
  decl: Erdos967.erdos_967.variants.finite
  statement: |-
    theorem erdos_967.variants.finite :
        ∀ A : Finset ℕ, (∀ n ∈ A, 1 < n) → ∀ t : ℝ, 1 + (∑ n ∈ A, summand t n) ≠ 0
  context:
