lean:
  module: FormalConjectures.Wikipedia.Mersenne
  decl: Mersenne.catalans_mersenne_conjecture
  statement: |-
    theorem catalans_mersenne_conjecture :
        ∀ n ≥ 5, Nat.Prime (catalanMersenne n)
  context:
    - open Mersenne
  definitions:
    - name: Mersenne.catalanMersenne
      kind: def
      text: |-
        /--
        The Catalan-Mersenne numbers, defined recursively by $c_0 = 2$ and
        $c_{n+1} = 2^{c_n} - 1$.
        -/
        def catalanMersenne : ℕ → ℕ
          | 0 => 2
          | n + 1 => 2 ^ catalanMersenne n - 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/Wikipedia/Mersenne.lean#L55
