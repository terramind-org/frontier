title: Local Coloring and Transitive Sets in Tournaments
field: mathematics
tier: prose
statement: Are the following statements true? (i) For every $k\geq0$ there is $c$ such that any tournament whose every vertex has out-neighbourhood chromatic number at most $k$ has chromatic number at most $c$. (ii) If $H=\Delta(T_2,T_2,T_2)$, then for every $\varepsilon>0$ there is $c>0$ such that every $H$-free tournament has a transitive subset of size at least $c|V(G)|^{1-\varepsilon}$.
