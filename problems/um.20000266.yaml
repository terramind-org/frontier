title: A Riemann--Roch obstruction to small very-general Seshadri constants
field: mathematics
tier: prose
statement: |-
  For every \(n\), is there \(c(n)>0\), independent of the smooth
  projective \(n\)-fold \(X\), the ample Cartier divisor \(L\), the
  uncountable algebraically closed field \(k\) of characteristic
  \(p>0\), and \(p\), such that
  \(\epsilon(L,x)\geq c(n)\) at a very general point?
