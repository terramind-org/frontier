title: Antiferromagnetic Homomorphism Bounds Without Triangle-Freeness
field: mathematics
tier: prose
statement: Let $H$ be a weighted graph whose edge-weight matrix has at most one positive eigenvalue. Can the triangle-free assumption on a $d$-regular graph $G$ be removed from the reverse-Sidorenko homomorphism inequality for $\operatorname{hom}(G,H)$?
