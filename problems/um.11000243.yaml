statement: Forg≥ 2, does Γg contain a purely pseudo-Anosov surface subgroup? The paper is organized as follows. In §2, we discuss the existence of surface subgroups in Kleinian groups of finite co-volume. In §3, we discuss surface subgroups of Γ g, and contrast and compare with §2. In §4 we discuss some related topics; for example we discuss the connection of Question 1.1 with some conjectures in 4-manifold topology. 274 17. Surface subgroups of mapping class groups 275
