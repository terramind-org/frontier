  \section{Exact Integrality Gap for Capacitated Facility Location}\label{30002731}
  {\small\sffamily UnsolvedMath ID 30002731 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are denoted by $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$; index ranges, computational models and specialized notation follow the cited problem source and the definitions below.


  Capacitated facility location opens facilities at a cost and assigns clients subject to facility capacities, minimizing opening plus connection cost. A partial assignment fixes some client-facility relationships and strengthens the residual relaxation.

  A relaxation contains the integral feasible solutions. For a nonnegative minimization objective, its integrality gap is the supremum of the ratio between the integral optimum and the relaxation optimum over the specified instances.

  A linear program optimizes $c^Tx$ over a polyhedron $\{x:Ax\leq b\}$. In the simplex method a pivot moves between adjacent basic feasible solutions; a pivot rule chooses the next such move.
  \paragraph{Statement recorded in the supplied source.}
  What is the exact integrality gap of the strengthened linear-programming relaxation for the capacitated facility location problem based on partial client assignments? \sref{30002731}{2}
  \paragraph{Scope qualification.}
  The precise partial-assignment relaxation is not included in the supplied question.
  \paragraph{Source status.}
  The supplied catalogue labels this record partially solved. Its source-status metadata was checked against the supplied snapshot on 2026-10-11. This import does not independently establish current open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-21.
  \subsection{Short English statement}
  Find the exact worst-case gap of the cited strengthened capacitated facility-location relaxation.
