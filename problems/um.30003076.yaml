title: Cohomology of General Sheaves on Polarized Surfaces
field: mathematics
tier: prose
statement: For a general sheaf E in the moduli space $M_H(v)$ on a smooth polarized surface, what is the cohomology of E? In particular, when does E have nonzero cohomology in at most one degree, and if $\chi(v)=0$, does E have no nonzero cohomology?
