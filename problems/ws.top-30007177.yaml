  \section*{Linear rigidity of bi-Lipschitz equivalent separable Banach spaces}\label{30007177}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If two separable real Banach spaces are joined by a bi-Lipschitz bijection, must they be linearly isomorphic?
  \subsection{Short English statement}
  If two separable real Banach spaces are joined by a bi-Lipschitz bijection, must they be linearly isomorphic?
