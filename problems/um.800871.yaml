title: Open Problems in Pluripotential Theory — Question 2
field: mathematics
tier: prose
statement: |-
  [Bedford]
  Given $\varphi$ a bounded plurisubharmonic function in some domain $\Omega \subset {\mathbb{C}}^n$, what can be said about the set of cluster points of
  $(dd^c \varphi_j)^n$, where $\varphi_j$ are bounded plurisubharmonic functions which converge to $\varphi$ in $L_{loc}^1$ ?
