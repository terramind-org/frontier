  \section{Parabolic subgroup intersections in Artin groups, including Euclidean type}\label{20001563}
  {\small UnsolvedMath ID 20001563 · Group Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  In an Artin group, a standard parabolic subgroup is generated by a subset of the standard generators, and a parabolic subgroup is a conjugate of such a subgroup. Must an intersection of two parabolic subgroups again be parabolic? In particular, does this hold for Artin groups of Euclidean type?
  \par\smallskip\textit{Formulation references:} \sref{20001563}{1}, \sref{20001563}{2}.
  \subsection{Short English statement}
  In an Artin group, a standard parabolic subgroup is generated by a subset of the standard generators, and a parabolic subgroup is a conjugate of such a subgroup. Must an intersection of two parabolic subgroups again be parabolic? In particular, does this hold for Artin groups of Euclidean type?
