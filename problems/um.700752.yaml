statement: |-
  Is it true that the
  hypothetical Moore graph with 3250 vertices of valence 57 has no
  automorphisms of order 2? M. Aschbacher (*J. Algebra*, **19**, no. 4 (1971), 538--540) proved that this graph is not a
  graph of rank 3.
