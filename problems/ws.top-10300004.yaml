  \item[\hypertarget{source:10300004:2}{S2}] Danny Calegari, \emph{Problems in foliations and laminations of 3-manifolds}, version 0.78 (2002), Question 2.4; Definitions 1.1--1.10 and local definitions and remarks. \url{https://arxiv.org/abs/math/0209081v1}.
