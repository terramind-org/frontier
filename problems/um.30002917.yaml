title: Unbounded Degrees of Full Belyi Maps
field: mathematics
tier: prose
statement: For a finite set of primes $P$, let $N(P)$ be the set of degrees $n\geq4$ for which a full Belyi map over $\mathbb{Q}$ has bad reduction only at primes in $P$. If $P$ contains all prime divisors of the order of some nonabelian finite simple group, is $N(P)$ infinite?
