title: Representation Stability and Compactifications for Braid Milnor Fibers
field: mathematics
tier: prose
statement: For the Milnor fiber $F_n=\{(x_1,\ldots,x_n):\prod_{i<j}(x_i-x_j)^2=1\}$, determine $H^*(F_n,\mathbb Q)$ as an $(S_n\times\mu_{n(n-1)})$-module; determine whether a category analogous to FI makes $H^i(F_n,\mathbb Q)$ a finitely generated module; and determine whether $M_{d,n}$ has a natural compactification.
