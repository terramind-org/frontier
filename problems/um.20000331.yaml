title: A fixed-base product obstruction to literal uniform isomorphism counts
field: mathematics
tier: prose
statement: |-
  **Problem 2.4 (Viehweg).** Does there exist a universal bound for the
  number of families of minimal manifolds with Hilbert polynomial \(H\)
  over a curve of genus \(q\) with \(s\) singular fibers depending only on
  \(H,q,\) and \(s\), and not any more features of the geometry of the
  fibers?
