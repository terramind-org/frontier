title: Localized Scalar Curvature Conditions Forcing Nonnegative ADM Mass
field: mathematics
tier: prose
statement: For an asymptotically flat Riemannian manifold $X$ with compact boundary and nonnegative scalar curvature, can metric conditions involving a positive scalar-curvature lower bound in a region and the distance from that region to the boundary force the ADM mass of $X$ to be nonnegative?
