statement: |-
  \section{Topological model for a Cremer Julia set}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For a complex polynomial $P$ of degree at least two, its filled Julia set $K(P)$ is the set of points with bounded forward orbit, and $J(P)=\partial K(P)$ is its Julia set. An external ray is a radial curve in the coordinate near infinity that conjugates $P$ to its leading power map, continued into the basin of infinity. Its angle is measured in $\mathbb R/\mathbb Z$. A critical point is a zero of $P'$. Topological conjugacy means a homeomorphism $h$ satisfying $h\circ f=g\circ h$. A quasiconformal homeomorphism has bounded infinitesimal eccentricity; quasiconformal surgery cuts and glues dynamical planes and finds an invariant complex structure that can be straightened to a holomorphic map.
  For real irrational $\alpha$, put $P_\alpha(z)=z^2+\lambda z$, where $\lambda=e^{2\pi i\alpha}$. The fixed point zero is a Cremer point when no local holomorphic change of coordinate conjugates $P_\alpha$ to $z\mapsto\lambda z$ near zero. Such a $P_\alpha$ is called a Cremer polynomial. The request for a plausible topological model is the original qualitative modelling problem; it does not prescribe a lamination, a locally connected model, or a particular quotient construction.
  \paragraph{Statement recorded in the supplied source.}
  Give a plausible topological model for the Julia set of a Cremer polynomial $P_\alpha$. \sref{statement}{2}
  \subsection{Short English statement}
  Describe a plausible topological model of the Julia set of a quadratic Cremer polynomial.
