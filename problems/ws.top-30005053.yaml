  \section{Reduction of Guessing Problems to Source Compression}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  For a discrete random variable $X$, entropy is $H(X)=-\sum_xp(x)\log p(x)$, and mutual information is $I(X;Y)=H(X)+H(Y)-H(X,Y)$. Coding rates, capacities, and exponents depend on the stated channel or source model and error criterion.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  Source-record limitation: The source proposes a general analogy between guessing and compression without defining the class of guessing problems or an admissible reduction and its performance guarantee.
  \paragraph{Statement recorded in the supplied source.}
  Can every optimal guessing problem be reduced to its corresponding optimal source-compression problem? \sref{statement}{2}
