title: Hamilton-Jacobi graph regularity versus KAM conjugacy
field: mathematics
tier: prose
statement: |-
  The existence of KAM invariant tori of a Hamiltonian system on \(\mathbb T^n\times\mathbb R^n\) is equivalent to the existence of regular solutions of the Hamilton--Jacobi equation
  \[
  H(x,c+Du(x))=\alpha(c).
  \]
  Hence KAM theory can be regarded as regularity result for viscosity solutions. Question: Is it possible to obtain proofs of KAM results using this connection?
