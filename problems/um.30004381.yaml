title: Dimension-Uniform Lower Bounds for Twice-Smooth Integration
field: mathematics
tier: prose
statement: |-
  For a bounded convex domain $D_d\subset\mathbb R^d$, define

  $$\overline C^2(D_d)=\left\{f\in C^2(D_d):\|f\|_\infty\leq1,\ \operatorname{Lip}(f)\leq d^{-1/2},\ \operatorname{Lip}(D_\theta f)\leq d^{-1}\right\}.$$

  Is there an absolute constant $C>0$, independent of $d$ and $D_d$, such that

  $$e_n(\overline C^2(D_d),\operatorname{INT})\geq Cn^{-2/d}$$?
