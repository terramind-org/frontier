title: Kourovka Notebook Problem 10.61
field: mathematics
tier: prose
statement: |-
  Suppose that $H$ is a proper subgroup of a group
  $G$, $a \in H$, $a^2 \ne 1$ and for every $g \in G\setminus H$ the
  subgroup $\left< a, a^g\right>$ is a Frobenius group whose
  complement contains $a$. Does the set-theoretic union of the
  kernels of all Frobenius subgroups of $G$ with complement $\left<
  a\right>$ constitute a subgroup? For definitions see 6.55; see
  also (A. I. Sozutov, *Algebra and Logic*, **34**, no. 5
  (1995), 295--305).

  *Editors' comment (2005):* The answer is
  affirmative if the order of $a$ is even (A. M. Popov,
  A. I. Sozutov, *Algebra and Logic*, **44**, no. 1 (2005),
  40--45)
  or if the order of $a$ is not 3 or 5 and the group $\left< a,
  a^g\right>$ is finite for any $g\not\in H$ (A. M. Popov, *Algebra and Logic*, **43**, no. 2 (2004), 123--127).
