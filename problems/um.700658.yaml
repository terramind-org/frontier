title: Kourovka Notebook Problem 10.43
field: mathematics
tier: prose
statement: |-
  Let $R$ and $S$ be associative rings with
  identity such that 2 is invertible in $ S$. Let $\Lambda _I \! :
  GL_n(R) \rightarrow GL_n(R/I)$ be the homomorphism corresponding
  to an ideal $I$ of $ R$ and let $ E_n(R)$ be the subgroup of $
  GL_n(R)$ generated by elementary transvections $t_{ij}(x)$. Let
  $a_{ij}=t_{ij}(1)t_{ji}(-1)t_{ij}(1)$, let the bar denote images
  in the factor-group of $ GL_n(R)$ by the centre and let
  $PG= \overline{\! G}$ for $G \leq GL_n(R)$. A homomorphism
  $$ \Lambda \! : E_n(R) \rightarrow GL(W)=GL_m(S)$$

  is called *standard* if $S^m=P \oplus \cdots \oplus P \oplus
  Q$ (a direct sum of $S $-modules in which there are $n$ summands
  $P$) and $$\Lambda x=g^{-1}\tau (\delta
  ^{\displaystyle{*}} (x)f + (^t\delta ^{\displaystyle{*}}(x)^{\nu
  })^{-1}(1 - f))g,\quad \quad x \in E_n(R),$$
  where $\delta ^{\displaystyle{*}} \! : GL_n(R) \rightarrow
  GL_n(\mathrm{End} P)$ is
  the homomorphism
  induced by a ring homomorphism $\delta \! : R \rightarrow
  \mathrm{End} P$ taking
  identity to identity, $g$ is an isomorphism of the module $W$
  onto $
  S^m$, $\tau \! : GL_n(\mathrm{End} P) \rightarrow
  GL(gW)$ is an
  embedding, $f$ is a central idempotent of $\delta R$,
  $t$ denotes
  transposition and $\nu$ is an antiisomorphism of $\delta R$.
  Let $n \geq 3$, $m \geq 2$. One can show that the
  homomorphism

  $$\Lambda _0\! : PE_n(R) \rightarrow GL(W)=GL_m(S)$$

  is induced by a standard homomorphism $ \Lambda$ if $\Lambda
  _0 \overline{\! a}_{ij}=g^{-1}\tau (a^{\displaystyle{*}}_{ij})g$
  for some $g$ and $\tau$ and for any $i \ne j$ where
  $a^{\displaystyle{*}}_{ij}$ denotes the
  matrix obtained from $a_{ij}$ by replacing 0 and 1 from $R$ by
  0 and
  1 from $\mathrm{End} P$. Find (at least in particular cases)
  the form of
  a homomorphism $\Lambda _0$ that does not satisfy the last
  condition.
