title: Structural and Algorithmic Properties of Burling Graphs
field: mathematics
tier: prose
statement: For a fixed Burling graph $H$, are graphs with no subdivision of $H$ $\chi$-bounded, and do Burling graphs with no induced copy of $H$ have bounded chromatic number? Can Burling graphs be characterized or recognized in polynomial time? Is maximum stable set polynomial-time solvable on Burling graphs? Can the Burling construction be extended to graphs with triangles and unbounded chromatic number?
