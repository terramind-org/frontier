title: Foliations and Diffeomorphism Groups — Question 1 (Virtual Euler class one conjecture)
field: mathematics
tier: prose
statement: Let $M$ be a closed hyperbolic 3-manifold whose first Betti number is at least one. Let $a \in H^2(M ; \mathbb{R})$ be an (even) integral second cohomology class of dual Thurston norm one. Is there a finite cover $p \colon \tilde{M} \rightarrow M$ and a taut foliation $\mathcal{F}$ of $\tilde{M}$ such that the Euler class $e(\mathcal{F})$ of $\mathcal{F}$ is equal to $p^*(a)$? Here $p^* \colon H^1(M) \rightarrow H^1(\tilde{M})$, and we have used Poincar\'{e} duality to identify $H^1(M) \cong H^2(M)$ and $H^1(\tilde{M}) \cong H^2(\tilde{M})$?
