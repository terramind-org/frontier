title: Paramodular Correspondence for Abelian Surfaces and Fourfolds
field: mathematics
tier: prose
statement: For $N\in\mathbb N$, let $A_N$ be the isogeny classes of abelian surfaces over $\mathbb Q$ of conductor $N$ with $\operatorname{End}_{\mathbb Q}(A)=\mathbb Z$, let $B_N$ be the isogeny classes of quaternionic-multiplication abelian fourfolds over $\mathbb Q$ of conductor $N^2$, and let $P_N$ be the cuspidal nonlift Siegel paramodular newforms of level $N$ with rational Hecke eigenvalues, modulo nonzero scaling. Is there a bijection $A_N\cup B_N\leftrightarrow P_N$ matching Hasse–Weil and spin $L$-functions, with the spin $L$-function squared for $B_N$?
