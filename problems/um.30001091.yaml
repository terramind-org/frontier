id: um.30001091
title: Wandering Domains, Hyperbolicity, and Thurston Algorithms
field: mathematics
tier: prose
statement: For a transcendental entire function $f$ with wandering domain $U$, can the limit functions of $\{f^n|_U\}$ be bounded? If its postsingular set is bounded, can $f$ have wandering domains, including when all critical points are nonrecurrent? For $f_{\lambda,k}(z)=\lambda ze^z+k$ with $\lambda=e^{2\pi i\theta}$ and the required non-recurrence hypotheses, can $f_{\lambda,k}$ have a Siegel disk? Is the complement of the hyperbolicity locus precompact in $\operatorname{Rat}_d$ modulo Möbius conjugacy? For $f_\lambda(z)=\lambda e^z$, characterize the parameters for which the nonescaping set, or that set together with $\{\infty\}$, is connected. Can Thurston's algorithm be implemented in $O((\deg(f)+|\Omega_f|)^n)$ iterations, producing either a point sufficiently close to a fixed point of the pullback map or a Thurston obstruction?
