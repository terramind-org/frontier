title: Quantitative transfer of ordered nodal slabs
field: mathematics
tier: prose
statement: |-
  Consider the nodal domains of the $k$-th Neumann eigenfunction on a sequence of domains collapsing to a lower dimensional object.

  Under what assumptions can one prove that the nodal domains are in a sense ordered?
