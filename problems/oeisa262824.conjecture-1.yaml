id: oeisa262824.conjecture-1
title: Sums of a square and three weighted cubes (conjecture_1)
field: mathematics
tier: proof
statement: |-
  Conjecture (i): For any $m \in \{3, 4, 5, 6\}$ and $n \ge 0$, there are nonnegative integers
  $w, x, y, z$ such that $n = w^2 + x^3 + 2y^3 + mz^3$.
