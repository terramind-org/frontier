title: Homology sliceness versus ordinary sliceness
field: mathematics
tier: prose
statement: |-
  **Is homology slice the same as slice?**
  Is there a non-smoothly slice knot \(K\) in \(S^3\) which is slice in a homology \(B^4\)?
  (i.e., is \(\phi_{smooth}\) non-injective?)
