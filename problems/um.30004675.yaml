statement: For $A\subset 2^\omega$, can computability partially characterize regularity defined by $\dim_H(A)=\dim_P(A)$? Can the point-to-set principles give an alternative proof of the closed-subset result for regular analytic sets, and can the analyticity assumption be removed?
