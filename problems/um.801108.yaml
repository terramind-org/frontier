statement: Does there exist a group $G$ that contains an existential inclusion of $\mathbb{F}_2$ such that $L(G)\ncong L(\mathbb{F}_n)$ for some $n\in \mathbb{N}$? Specifically, does there exist a non elementary surface group $G$ such that $L(G)\ncong L(\mathbb{F}_n)$?
