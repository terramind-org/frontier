title: Seeing a primitive surface class in the generic Jacobian
field: mathematics
tier: prose
statement: If we start with any surface \(S\) over \(\mathbb F_q\) we can, via Lefschetz fibration, make it into a curve over \(\mathbb F_q(T)\). Typically (since the rank of \(H^2\) is even), one has two Tate classes. One of these is given by hyperplane sections; can we “see” or construct the other one? This question is like the one above, but without requiring \(C\) to be hyperelliptic. So, in some sense, the problem is almost as hard as the problem of treating general surfaces. (C. Schoen)
