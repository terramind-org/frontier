  \item[S3] Boyle and Schraudner, Z\textasciicircum{}d group shifts and Bernoulli factors (2008), introductory statements and Theorem3.2.
  \url{https://math.umd.edu/~mboyle/papers/gsub27aug2007.pdf}.
