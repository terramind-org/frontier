title: Representing Measures for Finite-Dimensional Function Spaces
field: mathematics
tier: prose
statement: Let $S$ be a topological space, let $V$ be a finite-dimensional vector space of continuous real-valued functions on $S$, and let $L\in V^*$. Characterize when there exists a Borel measure $\mu$ on $S$ such that $$L(f)=\int_S f\,d\mu\qquad\text{for every }f\in V$$.
