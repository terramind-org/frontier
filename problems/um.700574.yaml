title: Kourovka Notebook Problem 9.41
field: mathematics
tier: prose
statement: |-
  Let $\Omega$ be a countably infinite set. For $k
  \geq 2$ define a *$k$-section* of $\Omega$ to be a partition
  of $\Omega$ as union of $k$ infinite sets.

  b) Does there exist a group that is
  transitive on
  $k$-sections
  but not on $(k + 1)$-sections?

  c)
  Does there exist a transitive permutation
  group on $\Omega$ that is transitive on $\aleph _0$-sections but
  which is a proper subgroup of $\mathrm{Sym}(\Omega )$?

  [Archived solved part(s) of 9.41:]
  a) Let $\Omega$ be a countably infinite set. For $k\geq 2$, we
