  \section*{The Voronoi pivotal-count amplitude under Cardy’s formula}\label{30007407}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Assuming the stated full-domain Cardy crossing limit for critical Poisson–Voronoi percolation, does $\epsilon ^{3/4}$ E $N_\epsilon $ tend to a finite positive constant for the source-defined reference quad pivotal count?
