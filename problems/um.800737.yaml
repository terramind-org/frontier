title: Open Problems in Topological Algebra — Problem 11 (Banakh)
field: mathematics
tier: prose
statement: |-
  Such a group, if exists, cannot be analytic and abelian (more
  generally, a SIN-group). We remind that a topological space $X$ is
  analytic if it is a metrizable continuous image of a separable
  complete metric space. On the other hand, the group ${\mathbb{Z}}^\omega$ contains a dense $o$-bounded $G_\delta$-subset $A$ such
  that the first player has a winning strategy in the game OF($A$),
  see [BZ].

  Let $A$ be a compact subset of the real
  line $\mathbb{R}$ such that $A-A=\{a-a':a,a'\in A\}$ is a neighborhood of
  zero in $\mathbb{R}$. Has the sum $A+A+A+A$ non-empty
  interior in $\mathbb{R}$?
