title: Visibility Graphs of Points, Segments and Polygons — Problem 17
field: mathematics
tier: prose
statement: |-
  Observe that the algorithm of Hoffmann and T\'{o}th [ht-sevg-2003] takes $S$ as an input
  and then locates a Hamiltonian circuit in the embedded segment visibility graph $G'$.
  Suppose $S$ is not given as an input but
  only $G$ is given, then it is not clear how to identify a Hamiltonian cycle
  in $G$ in polynomial time as there is no known algorithm for segment visibility graph
  reconstruction problem. So, we have the following problems.

  Given a segment visibility graph $G$ in adjacency matrix form, identify a Hamiltonian
  cycle in $G$ in polynomial time.
