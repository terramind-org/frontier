title: A two-site Ising counterexample to extremal-pair TV maximization
field: mathematics
tier: prose
statement: |-
  We seek diagnostic tests for knowing that a general spin system is mixed on a general graph \(G\).

  1. Consider the ferromagnetic Ising model on a general graph \(G\). Which two \(x,y\in\Omega\) maximize \(\lVert P^t(x,\cdot)-P^t(y,\cdot)\rVert_{TV}\)? More generally, is it true that in any monotone reversible chain, the maximal and minimal initial configurations maximize the total variation distance between two chains?

  2. Can one use a diagnostic to estimate \(t_{\mathrm{mix}}\) up to \(O(1)\)? Of course, answering question (1) would answer this as well.

  3. Consider the \(3\)-Potts model for a general graph \(G\). Can one devise a diagnostic to differentiate between \(t_{\mathrm{mix}}=O(n\log n)\) and \(\exp(\Omega(n))\)?
