title: The nonseparable Calkin consistency problem and two transplantation obstructions
field: mathematics
tier: prose
statement: |-
  **Readability-normalized question.** Is it relatively consistent with ZFC that there are a nonseparable complex Hilbert space \(H\) and an outer automorphism of
  \[
  \mathcal Q(H):=\mathcal B(H)/\mathcal K(H),
  \]
  where \(\mathcal K(H)\) is the ideal of compact operators?
