title: Kourovka Notebook Problem 14.18
field: mathematics
tier: prose
statement: |-
  We say that a family of groups
  ${\mathcal{D}}$ *discriminates* a group $G$ if for any finite subset
  $\{a_1,\ldots ,a_n\}\subseteq G\setminus\{ 1\}$ there exists a
  group $D\in {\mathcal{D}}$ and a homomorphism $\varphi :G\rightarrow D$ such that
  $a_j\varphi \ne 1$ for all $j=1,\ldots ,n$. Is every finitely generated
  group acting freely on some $\Lambda$-tree discriminated by
  torsion-free hyperbolic groups?
