title: Analysis of Boolean Functions — Optimality of Majorities for Non-Interactive Correlation Distillation
field: computer-science
tier: prose
statement: Fix $r \in \mathbb{N}$, $n$ odd, and $0 < \varepsilon < 1/2$. For $f \colon \{-1,1\}^n \to \{-1,1\}$, define $P(f) = \operatorname{Pr}[f(\mathbf{y}^{(1)}) = f(\mathbf{y}^{(2)}) = \cdots f(\mathbf{y}^{(r)})]$, where $\mathbf{x} \sim \{-1,1\}^n$ is chosen uniformly and then each $\mathbf{y}^{(i)}$ is (independently) an $\varepsilon$-noisy copy of $\mathbf{x}$. Is it true that $P(f)$ is maximized among odd functions $f$ by the Majority function $\maj_k$ on *some* odd number of inputs $k$?
