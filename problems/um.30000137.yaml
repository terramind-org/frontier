title: Sharp Dimensions for Totally Skew Embeddings
field: mathematics
tier: prose
statement: For a given manifold, is the current dimension lower bound for a Euclidean space admitting a totally skew embedding sharp? In particular, does there exist a totally skew embedding of the three-dimensional disk in $\mathbb{R}^7$?
