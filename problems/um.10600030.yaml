title: Virtual-knot problem 30 — In we have studied a mod-2 categorification of the arrow polynomial and discovered many baffling examples of pairs of…
field: mathematics
tier: prose
statement: |-
  In we have studied a mod-2 categorification of
  the arrow polynomial and discovered many baffling examples of pairs
  of virtual knots that are discriminated by this link homology and
  not distinguished by Khovanov homology mod-2 or the arrow
  polynomial. We want to understand this new link homology and to that
  end will do more computations and will try to understand the
  structure of this homology theory for virtual links.
