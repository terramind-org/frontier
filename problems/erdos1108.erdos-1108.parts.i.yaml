title: Erdős Problem 1108 (i)
field: mathematics
tier: proof
statement: "For each $k \\geq 2$, does the set $A = \\left\\{ \\sum_{n\\in S}n! : S\\subset \\mathbb{N}_{\\geq 1}\\text{ finite}\\right\\}$ of all finite sums of distinct factorials contain only finitely many $k$-th powers?"
