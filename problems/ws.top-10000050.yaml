  \item[\hypertarget{source:10000050:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, record 10000050 (AMR-099-0050). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
