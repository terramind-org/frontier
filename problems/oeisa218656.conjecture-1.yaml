  definitions:
    - name: OeisA218656.a
      kind: def
      text: |-
        /-- Number of ways to write $2n + 1$ as $x + y$ with $0 < x < y$ and
        $x^4 + y^4$ prime. -/
        def a (n : ℕ) : ℕ :=
          ∑ x ∈ Finset.Icc 1 n,
            if Nat.Prime (x ^ 4 + (2 * n + 1 - x) ^ 4) then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/OEIS/218656.lean#L34
