title: Log-concave measures
field: mathematics
tier: prose
statement: For Ollivier's coarse Ricci curvature, smooth uniformly strictly log-concave measures on $\mathbb{R}^N$ have positive curvature. What can be said for a general log-concave measure? In particular, analyze a convex body equipped with Brownian motion conditioned not to leave it.
