title: Type-B middle Narayana and Baxter slices with a Fuss-cardinality obstruction
field: mathematics
tier: prose
statement: |-
  **Problem 2.9.** Is there a corresponding multi-noncrossing partition model?

  One would expect that this has something to do with the root configuration, and the
  case \(k=1\) is well-known in classical types.  Using the correspondence between the
  type \(B_n\) root poset and \([n]\times[n]\), the case \(k=2\) for the type \(B_n\)
  root poset corresponds to certain Narayana numbers [SW12].  Similarly, the case
  \(k=3\) corresponds to Baxter numbers [Dil14].  Both of these have noncrossing
  models: Narayana numbers are well-known to be noncrossing partitions with a
  specified number of blocks; N. Reading has given a combinatorial description of
  Baxter permutations as noncrossing diagrams on a horizontal line of points using
  arcs that stay above or below the points [Rea14].
