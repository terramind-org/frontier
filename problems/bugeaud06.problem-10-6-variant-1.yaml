lean:
  module: FormalConjectures.Books.BugeaudDistributionModuloOne.Problem10_6
  decl: Bugeaud06.problem_10_6_variant_1
  statement: |-
    theorem problem_10_6_variant_1 :
        ∃ m : ℕ → ℕ,
        StrictMono m ∧
        IsGenuinelySublacunary m ∧
        ∀ ξ : ℝ, Irrational ξ →
          Dense (Set.range fun n => (↑(ξ * m n) : AddCircle (1 : ℝ)))
  context:
    - open Bugeaud06
    - open Filter
  definitions:
    - name: Bugeaud06.IsGenuinelySublacunary
      kind: def
      text: |-
        /-- The sequence $m$ eventually grows at least geometrically with a logarithmic correction. -/
        def IsGenuinelySublacunary (m : ℕ → ℕ) : Prop :=
          ∃ c > 0, ∀ᶠ (n : ℕ) in atTop, (1 + c / Real.log n) ≤ (m (n+1) : ℝ) / m n
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Books/BugeaudDistributionModuloOne/Problem10_6.lean#L152
