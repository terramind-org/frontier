lean:
  module: FormalConjectures.OEIS.«113609»
  decl: OeisA113609.conjecture
  statement: |-
    theorem conjecture :
      ∃ q ≥ 1000000,
        IsOeisPrimePower q ∧ IsOeisPrimePower (q + 2) ∧
        ¬ q.Prime ∧ ¬ (q + 2).Prime
  context:
    - open OeisA113609
  definitions:
    - name: OeisA113609.IsOeisPrimePower
      kind: def
      text: |-
        /--
        A number $n$ is an "OEIS prime power" (for the context of A113609's definition)
        if $n=1$ or $n$ is a standard prime power.
        -/
        def IsOeisPrimePower (n : ℕ) : Prop := n = 1 ∨ IsPrimePow n
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/113609.lean#L31
