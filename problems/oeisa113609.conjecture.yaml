schema: 1
id: oeisa113609.conjecture
title: Number of prime powers $q<=n$ such that also $q+2$ is a prime power
field: mathematics
tier: proof
statement: |-
  (25,27) is the smallest pair of prime powers (q,q+2) such that both q and q+2 are not primes,
  conjecture: there are more (but not < 10^6).
