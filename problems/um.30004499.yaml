title: Local Maxima of Special Eigenfunctions at Spherical Points
field: mathematics
tier: prose
statement: |-
  Assume there are no nonzero functions on

  $$D^\times(\mathbb Q)\backslash D^\times(\mathbb A_\mathbb Q)/\bigl((K_\infty\cap D^\times(\mathbb A_\mathbb Q))Z(D^\times(\mathbb A_\mathbb Q))\bigr)$$

  that transform according to the $3$-dimensional spherical representation of $\operatorname{SO}(3)$. For all but finitely many special eigenfunctions $f$, is every $x\in D^\times(\mathbb A_\mathbb Q)$ a local maximum of $f$?
