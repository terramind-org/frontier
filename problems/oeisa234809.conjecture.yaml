  definitions:
    - name: OeisA234809.a
      kind: def
      text: |-
        /--
        Number of integers $0 < k < n$ such that $p = k + \phi(n - k)$
        and $2(n - p) + 1$ are both prime, where $\phi$ is Euler's totient function.
        -/
        def a (n : ℕ) : ℕ :=
          ∑ k ∈ Finset.Ico 1 n,
            let p := k + (n - k).totient
            if p.Prime ∧ Nat.Prime (2 * (n - p) + 1) then 1 else 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/OEIS/234809.lean#L34
