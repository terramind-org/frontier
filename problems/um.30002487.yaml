title: Burnstile Lobe Sequences and Loss of Primary Intersections
field: mathematics
tier: prose
statement: "In burnstile theory for propagating fronts, characterize the sequence of modified entrance and exit lobes: is there a unique locally smallest lobe, what transport questions are answered by the other lobes, and can continuous-time treatment improve efficiency? What are the physical consequences when the stable and unstable burning invariant manifolds lose a primary intersection point, particularly for ballistic front propagation, and can the theory be extended continuously through that loss?"
