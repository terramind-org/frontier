title: Orbit Equivalence Relations of Nonlocally Compact Borel Groups
field: mathematics
tier: prose
statement: For a Borel group $H$, is failure of a locally compact second-countable group topology extending its original topology equivalent to the existence of a Polish $H$-space $X$ for which $E_0^{\mathbb{N}}$ Borel-reduces to the orbit relation $E_H^X$? Here $E_0^{\mathbb{N}}$ is coordinatewise eventual equality on $(2^{\mathbb{N}})^{\mathbb{N}}$.
