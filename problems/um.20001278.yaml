title: Explicit conditioned stability for relative central sections
field: mathematics
tier: prose
statement: |-
  **Problem 2 (stability of reconstruction from relative central sectional
  areas).** For each positive integer \(t\), is there a positive integer
  \(t'=t'(t)\) such that whenever \(P,Q\) are isotropic centrally symmetric
  \(d\)-dimensional polytopes with at most \(d^t\) facets and
  \[
   \sup_{\theta\in S^{d-1}}
   \left|
   \frac{\operatorname{Vol}_{d-1}(P\cap\theta^\perp)}
        {\operatorname{Vol}_d(P)}-
   \frac{\operatorname{Vol}_{d-1}(Q\cap\theta^\perp)}
        {\operatorname{Vol}_d(Q)}
   \right|\le d^{-t'},                                  \tag{1.1}
  \]
  the Hausdorff distance between \(P\) and \(Q\) is at most \(1/10\)?
  If so, can one reconstruct \(P\), to Hausdorff error \(1/10\), in
  polynomial time from an oracle returning these relative section areas to
  additive error \(d^{-t'}\)?
