title: Sharp Moments of Zeta and Character Averages
field: mathematics
tier: prose
statement: |-
  Are both estimates below sharp for every $0\leq q\leq1$?

  $$\frac1T\int_T^{2T}\left(\int_{-1/2}^{1/2}|\zeta(1/2+it+ih)|^2\,dh\right)^qdt
  \ll\left(\frac{\log T}{1+(1-q)\sqrt{\log\log T}}\right)^q,$$

  and, for a prime $r$, $1\leq x\leq r$, and $L=\min\{x,r/x\}$,

  $$\frac1{r-2}\sum_{\substack{\chi\ ({\rm mod}\ r)\\\chi\neq\chi_0}}\left|\sum_{n\leq x}\chi(n)\right|^{2q}
  \ll\left(\frac{x}{1+(1-q)\sqrt{\log\log(10L)}}\right)^q$$?
