title: Quenched Brownian large deviations in stationary ergodic potentials without mixing
field: mathematics
tier: prose
statement: |-
  **33. (Elena Kosygina)** Let \(\Omega\) be a probability space with probability measure \(P\) ergodic under a shift transformation group \(\tau_x:\Omega\to\Omega\), \(x\in\mathbb R^n\). Consider the stochastic Hamilton--Jacobi equation
  \[
  u_t+H(D_xu,\tau_x\omega)=0,\qquad (x,t)\in\mathbb R^n\times(0,\infty),
  \]
  where \(H(p,\omega)\) is convex in \(p\) and satisfies some regularity assumptions, for example
  \[
  H(p,\omega)=\frac12|p|^2-V(\omega).
  \]
  A homogenization result for this problem was obtained by Lions and Souganidis. For the Hamiltonian above homogenization is equivalent to a large deviation result for Brownian motion among random obstacles (Snitzman). Problem: Derive a large deviation result for general stationary ergodic setting without any independence or mixing assumptions on \(P\) under the shifts.
