title: Equivariant Pancake Partitions of Spheres
field: mathematics
tier: prose
statement: Let $n>k\geq1$, let $p$ be an odd prime, and let $\mathbb Z/p$ act freely and orientation-preservingly on $S^n$. Suppose $c:\operatorname{CO}(S^n)\to S^n$ is a center map, $V$ is a real $k$-dimensional $\mathbb Z/p$-representation with $$e(V)\notin\operatorname{Index}_{\mathbb Z/p}(SO(n+1);\mathbb F_p),$$ and $f:S^n\to V$ is equivariant. For every $\varepsilon>0$ and all sufficiently large $i$, is there an invariant convex equal-volume partition of $S^n$ into $p^{i+1}$ pieces whose centers map to $0$ and whose pieces are $(k,\varepsilon)$-pancakes?
