title: 2.3 (Cooper) — Hausdorff limits of conjugates of an isometry group
field: mathematics
tier: prose
statement: Let $\beta$ be a nondegenerate bilinear form on a finite-dimensional real vector space $V$, and let $G=\operatorname{Isom}(\beta)\subset GL(V)$. Which subgroups $H\subset GL(V)$ are Hausdorff limits of sequences of conjugates of $G$?
