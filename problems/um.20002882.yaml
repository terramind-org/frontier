title: Polynomial approximation of integrable holomorphic one-forms
field: mathematics
tier: prose
statement: |-
  **Problem 1 (J. E. Fornæss).** Let \(\omega\) be a holomorphic \(1\)-form on a polydisc in \(\mathbb C^3\) with \(\omega\wedge d\omega=0\). Can \(\omega\) be approximated on compact subsets by polynomial \(1\)-forms \(h\) satisfying \(h\wedge dh=0\)?

  **Remark.** A positive answer would lead to a nontrivial foliation of \(\mathbb{CP}^3\) by hypersurfaces.
