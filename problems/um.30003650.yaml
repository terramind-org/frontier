title: Extremal Completely Positive Plus-Rank
field: mathematics
tier: prose
statement: For a nonzero symmetric matrix $A\in S^n$, let $\operatorname{cp}(A)$ be its completely positive rank and $\operatorname{cp}^+(A)$ its completely positive plus-rank. What is the maximum finite value of $\operatorname{cp}^+(A)-\operatorname{cp}(A)$, and what is the maximum finite value of $\operatorname{cp}^+(A)$ on $S^n$?
