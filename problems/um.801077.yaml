title: "Henon Maps: Open Problems — Question 29"
field: mathematics
tier: prose
statement: |-
  Is it possible to find a generalized complex H\'enon map $f$,
  an open set $U\subset \mathbb{C}^2$ intersecting $J^+$ and a holomorphic foliation of $U$ such that
  $J^+\cap U$ is a union of leaves of this foliation?
