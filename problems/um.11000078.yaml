title: Question 7.2 — Is the sequence {L(Modg)} monotone decreasing?
field: mathematics
tier: prose
statement: Is the sequence {L(Modg)} monotone decreasing? strictly so? Explicit values of L(Modg) are known only when g = 1. In this case one is simply asking for the minimum value of the largest root of a polynomial as one varies over all integral polynomials x2−bx + 1 with b≥ 3. This is easily seen to occur when b = 3. For g = 2 Zhirov [ Zh] found the smallest dilatation for pseudo-Anosovs with orientable foliation. It is not clear if this should equal L(Mod2) or not.
