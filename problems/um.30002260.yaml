title: Model-Theoretic Connected-Component Quotients
field: mathematics
tier: prose
statement: Let $G$ be a group definable in a first-order structure $M$, let $M^*$ be a saturated elementary extension, and for a small parameter set $A$ let $G_A^{*00}$ and $G_A^{*000}$ denote the model-theoretic connected components of $G(M^*)$ (the smallest $A$-type-definable subgroup of bounded index and the smallest $A$-invariant subgroup of bounded index, respectively). Which compact/quotient groups can occur as the quotient $G_A^{*00} / G_A^{*000}$?
