title: Kourovka Notebook Problem 17.84
field: mathematics
tier: prose
statement: |-
  An associative algebra $A$ is said to be *Calabi--Yau of
  dimension $d$* (for short, CY$d$) if there is a natural
  isomorphism of $A$-bimodules $\mathrm{Ext}_{A\text{-bimod}}^d(A, A\otimes A)\cong A$ and $\mathrm{Ext}_{A\text{-bimod}}^n(A, A\otimes A)=0$ for $n\ne d$. By
  Kontsevich's theorem, the complex group algebra ${\mathbb{C}G$ of the
  fundamental group $G$ of a 3-dimensional aspherical manifold is
  CY$3$.
  Is every group with CY$3$ complex group algebra residually
  finite?
