title: Classification Problems for Del Pezzo Fibrations
field: mathematics
tier: prose
statement: For del Pezzo fibrations, are there fibrations with square-free discriminant of height two and with height six and maximal monodromy; are those of a given height irreducible; how can one characterize their Prym varieties; and, in the height-twelve example $X\to\mathbb P^1$, are there sections other than the canonical section?
