title: Affinely equivalent central sections and an ellipsoidal anchor
field: mathematics
tier: prose
statement: |-
  Let \(G(n,k)\) denote the set of \(k\)-dimensional subspaces of
  \(\mathbb R^n\), where \(2\leq k\leq n-1\) is fixed in the following
  problems. If \(K\) is a set let \(\operatorname{int}K\) denote its
  interior. Also let \(o\) denote the origin in \(\mathbb R^n\).

  (See [G, Problem 7.4 and Note 7.2].) Suppose
  \(o\in\operatorname{int}K\) and all sections \(K\cap S\),
  \(S\in G(n,k)\), are affinely equivalent. Does it follow that \(K\)
  is an ellipsoid? Here \(K\) is a star body but the problem is also
  open when \(K\) is convex.
