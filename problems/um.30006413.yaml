id: um.30006413
title: Classification of Four-Dimensional Ricci-Flow $\kappa$-Solutions
field: mathematics
tier: prose
statement: "Classify all $\\kappa$-solutions of four-dimensional Ricci flow, up to scaling and finite quotients, as follows: the shrinkers $S^4$, $\\mathbb{CP}^2$, $S^2\\times S^2$, $\\mathbb{R}\\times S^3$, and $\\mathbb{R}^2\\times S^2$; the four-dimensional Bryant soliton, the three-dimensional Bryant soliton times a line, and Lai’s one-parameter family of $\\mathbb{Z}_2\\times O(3)$-symmetric steady solitons; and the known four-dimensional ovals, products of three-dimensional ovals with a line, and the one-parameter family of $\\mathbb{Z}_2^2\\times O(3)$-symmetric ovals."
