title: Comparative Prime Number Theory — Problem 19
field: mathematics
tier: prose
statement: |-
  Investigate further examples. Determine the most biased two-way Chebotarev races.

  - (Greg Martin, University of British Columbia)
  In 1959 Shanks [Shanks] made an observation that seems to have been overlooked since then: some combinatorial reasoning led him to assert that for each integer $k\ge1$, the odd numbers $n$ with $\Omega(n)=k$ should be biased towards the residue class $(-1)^k\mod4$, where the case $k=1$ is Chebyshev's original observation. In other words, $(-1)^{\Omega(n)}\chi_{-4}(n)$ should be biased towards $1$ over $-1$.
