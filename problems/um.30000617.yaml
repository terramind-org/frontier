title: Logical Phase Transitions for Finite Well-Ordering Principles
field: mathematics
tier: prose
statement: Determine the provability/unprovability phase transition for the additive-norm finite-well-ordering assertions $\mathrm{FWO}_N(F)$ below $\varepsilon_0$, where $\mathrm{FWO}_N(F)$ requires a descending pair in every sufficiently long sequence whose $i$-th ordinal code has additive norm at most $K+F(i)$.
