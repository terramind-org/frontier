title: Group Actions on 1-Manifolds — Question 22
field: mathematics
tier: prose
statement: |-
  Given a faithful action $\phi_0$ of a finitely generated group $G$ by $C^{\infty}$ circle diffeomorphisms
  admitting an exceptional minimal set, does there exist a path $\phi_t$ of faithful actions of $G$ that is continuous in the $C^{\infty}$
  topology and starts with $\phi_0 = \phi$ so that each $\phi_t$ admits an exceptional minimal set for $t < 1$ and $\phi_1$ is minimal ?
