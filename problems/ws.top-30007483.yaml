  \section*{Quadratic sensitivity versus block sensitivity}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Is there an absolute C such that every nonconstant total Boolean function satisfies $bs(f)\leq C$ $s(f)^{2}$, where s is sensitivity and bs block sensitivity?
