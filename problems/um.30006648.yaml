title: Revised Donkin Tilting-Module Conjectures
field: mathematics
tier: prose
statement: Let $G$ be a simple simply connected algebraic group over an algebraically closed field of characteristic $p>0$, with root system $\Phi$ and Coxeter number $h$. Prove that Donkin’s Tilting Module Conjecture holds for every prime $p$ exactly when $\Phi$ has type $A_n$ or $B_2$, and prove that it holds whenever $p>h$.
