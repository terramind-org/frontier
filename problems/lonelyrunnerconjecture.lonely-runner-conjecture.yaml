lean:
  module: FormalConjectures.Wikipedia.LonelyRunnerConjecture
  decl: LonelyRunnerConjecture.lonely_runner_conjecture
  statement: |-
    theorem lonely_runner_conjecture (n : ℕ)
        (speed : Fin n ↪ ℝ) (lonely : Fin n → ℝ → Prop)
        (lonely_def :
          ∀ r t, lonely r t ↔
            ∀ r2 : Fin n, r2 ≠ r →
            dist (t * speed r : UnitAddCircle) (t * speed r2) ≥ 1 / n)
        (r : Fin n) : ∃ t ≥ 0, lonely r t
  context:
    - open LonelyRunnerConjecture
  definitions: []
