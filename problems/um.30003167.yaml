title: Descent of Intermediate Jacobians
field: mathematics
tier: prose
statement: Let $X$ be a smooth projective variety over a subfield $K\subseteq\mathbb C$, and assume $H^{2n+1}(X(\mathbb C),\mathbb Z)$ has Hodge level $1$. Does the intermediate Jacobian abelian variety $J^{2n+1}(X_\mathbb C)$ admit a model over $K$?
