id: um.30002191
title: Homological Hilbert-Scheme Conjecture for Algebraic Links
field: mathematics
tier: prose
statement: |-
  Let $C$ be a planar curve singularity at $(0,0)$ with Milnor number $\mu$. Does the triply graded HOMFLY homology of its algebraic link satisfy
  $$\left(\frac aq\right)^{\mu-1}\sum_{\ell,m}q^{2\ell}a^{2m}t^{m^2}P_t^{\mathrm{vir}}\!\left(C_{(0,0)}^{[\ell,\ell+m]}\right)=P(L_{C,(0,0)})$$?
