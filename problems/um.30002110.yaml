title: Hexagonal Asymptotics for Spectral Minimal Partitions
field: mathematics
tier: prose
statement: For a bounded planar domain $\Omega$, does the minimal $k$-partition energy satisfy the hexagonal asymptotic $\lim_{k\to\infty}L_k(\Omega)/k=\lambda(\mathrm{Hexa}_1)A(\Omega)^{-1}$, where $\mathrm{Hexa}_1$ is the regular unit-area hexagon?
