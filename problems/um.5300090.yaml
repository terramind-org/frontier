title: Topology of hyperbolic attractors in dimension three
field: mathematics
tier: prose
statement: Let $A$ be a hyperbolic attractor of a diffeomorphism of a compact $3$-manifold. Beyond the known Anosov, laminated, Williams, and invariant-torus cases, can another topology occur? In particular, can the transversal structure of the unstable lamination be a Sierpiński carpet?
