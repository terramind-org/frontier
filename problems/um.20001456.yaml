title: Transport-adapted and finite-scale variable-curvature Caffarelli estimates
field: mathematics
tier: prose
statement: |-
  Let \(T=\nabla\Phi:\mu\to\nu\) be a Brenier map, where \(\mu\) and \(\nu\) have densities \(e^{-V(x)}\) and \(e^{-W(x)}\). If
  \[
  \nabla^2W(x)\ge K\,\mathrm{Id},
  \]
  then, for \(e\in S^{n-1}\),
  \[
  \sup_{x\in\mathbb{R}^n}\Phi_{ee}^2
  \le \frac1K\sup_{x\in\mathbb{R}^n}V_{ee}.
  \]
  Can one obtain better results if \(\nabla^2W(x)\ge F(x)\,\mathrm{Id}\)?
