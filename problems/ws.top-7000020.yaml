  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Mohammad Ghomi, \emph{The length, width, and inradius of space curves}, arXiv:1605.01144v3 (2018), Introduction, pp. 2--4; Section 2, definition of curve and length, p. 4. \url{https://arxiv.org/pdf/1605.01144v3}.
  \end{description}
