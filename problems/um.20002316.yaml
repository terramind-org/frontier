title: Measure transfer for the one-relator zero-one law
field: mathematics
tier: prose
statement: |-
  **1.7. Non-abelian free groups (Knight).** Consider \(n\)-generated groups with a single relator of length at most \(t\). (For each \(t,n\) there are finitely many such groups.) For every sentence \(\varphi\) define
  \[
  h_{n,t,\varphi}
  =
  \frac{|\{G\in H_{n,t}:G\models\varphi\}|}{|H_{n,t}|}.
  \]

  **Conjecture 14.** The limit \(\lim_{t\to\infty}h_{n,t,\varphi}\) exists, and always takes the value \(0\) or \(1\), moreover in a way that may depend on \(\varphi\) but not on \(n\).
