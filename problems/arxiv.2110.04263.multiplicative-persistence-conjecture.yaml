  module: FormalConjectures.Arxiv.«2110.04263».MultiplicativePersistence
  decl: Arxiv.«2110.04263».multiplicative_persistence_conjecture
  statement: |-
    theorem multiplicative_persistence_conjecture :
        ∀ n : ℕ, ∃ k ≤ 11, (digitProduct^[k]) n < 10
  context:
