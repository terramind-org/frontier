  definitions:
    - name: Arxiv.«2110.04263».digitProduct
      kind: def
      text: |-
        /-- The product of the base-ten digits of a natural number, with zero mapped to zero. -/
        def digitProduct : ℕ → ℕ
          | 0 => 0
          | n + 1 => (Nat.digits 10 (n + 1)).prod
