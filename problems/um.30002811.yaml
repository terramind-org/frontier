title: Turnpike Properties as Criteria for Strict Dissipativity
field: mathematics
tier: prose
statement: For the discrete-time optimal-control problem $x(k+1)=f(x(k),u(k))$ with stage cost $\ell(x,u)$, under which assumptions does the turnpike property imply strict dissipativity? Here strict dissipativity means that for some equilibrium $(x_e,u_e)$, storage function $\lambda$, and $\rho\in\mathcal K_\infty$, one has $\ell(x,u)-\ell(x_e,u_e)+\lambda(x)-\lambda(f(x,u))\geq\rho(\lVert x-x_e\rVert)$. The known implication is strict dissipativity $\Rightarrow$ turnpike property.
