title: Convergence of Spectral Estimators for Diffusion Tensors
field: mathematics
tier: prose
statement: Let $(\nu_k,u_k)$ be noisy observations of eigenpairs and let $\mu$ be an invariant density satisfying $$\operatorname{div}(S\nabla u_k)=\nu_k\mu u_k$$ with Neumann boundary conditions. Prove convergence of the spectral reconstruction estimator obtained by fitting these equations to recover the matrix-valued coefficient $S$.
