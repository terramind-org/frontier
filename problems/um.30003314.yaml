title: Valuation and Simplicity Problems for the Surreal Numbers
field: mathematics
tier: prose
statement: Can the degree map on $\mathbf{No}$ be extended to a field valuation? Can $\mathbb{Q}\subset\mathbf{No}$ be characterized by sign sequences? Can the simplicity order be extended to functions, and is the surreal exponential the simplest homomorphism with the required properties?
