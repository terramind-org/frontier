title: Virtual-knot problem 8 — Virtual Biquandle
field: mathematics
tier: prose
statement: |-
  Virtual Biquandle: Construct presentations of the virtual
  biquandle with the a linear (non-commutative) representation at
  classical crossings and some interesting structure at virtual
  crossings. A start has been made by Bartholomew and Fenn .
  In this paper various biquandle decorations are made at classical
  and virtual crossings which were found by a computer search.
