lean:
  module: FormalConjectures.ErdosProblems.«18»
  decl: Erdos18.erdos_18a
  statement: |-
    theorem erdos_18a :
        ∃ C : ℝ, 0 < C ∧ ∃ᶠ m in atTop, Nat.IsPractical m ∧
          (practicalH m : ℝ) < (log (log m)) ^ C
  context:
    - open Erdos18
    - open Filter Asymptotics Real
  definitions:
    - name: Erdos18.practicalH
      kind: def
      text: |-
        /-- For a practical number $n$, $h(n)$ is the maximum over all $1 ≤ m ≤ n$ of
        the minimum number of divisors of $n$ needed to represent $m$ as a sum of
        distinct divisors. -/
        noncomputable def practicalH (n : ℕ) : ℕ :=
          Finset.sup (Finset.Icc 1 n) fun m =>
            sInf {k | ∃ D : Finset ℕ, D ⊆ n.divisors ∧ D.card = k ∧ m ∈ subsetSums D}
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/18.lean#L37
