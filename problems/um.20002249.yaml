title: Consistency bounds and a width obstruction for two merged inner-model questions
field: mathematics
tier: prose
statement: |-
  **Question 8.** What is the consistency strength of
  \[
  MM(\mathfrak c)?
  \]
  The printed annotations give \(AD_{\mathbb R}+\) “\(\Theta\) is regular” as an upper bound (via Woodin's \(\mathbb P_{\max}\) analysis) and \(AD^{L(\mathbb R)}\) as a safe lower bound (Steel--Zoble).

  **Question 9.** What is the consistency strength of
  \[
  T_9:=\mathsf{ZFC}+\neg\square_{\omega _2}+\neg\square(\omega _2)
        +2^{\omega _1}=\omega _2?
  \]
  The source then says that the upper bound is weaker than \(AD_{\mathbb R}+\) “\(\Theta\) is Mahlo” and displays the shorthand
  \[
  \{\alpha\mid \operatorname{cof}(\theta_\alpha)\geq\aleph_2
         +\theta_\alpha\text{ regular in HOD}\}.
  \]
  This displayed set is not by itself a complete theory: in particular, the PDF does not state there whether it is to be stationary or merely unbounded, and the plus sign is being used informally as conjunction. It is therefore preserved as a source annotation rather than silently replaced by a later precise hypothesis. The 2017 theorem stated in Section 2 below is the rigorous published update.
