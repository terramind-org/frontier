title: Rank Conjecture for Free Elementary-Abelian Actions
field: mathematics
tier: prose
statement: If $G=(\mathbb Z/p)^r$ acts freely on a finite-dimensional CW complex homotopy equivalent to a product of $k$ spheres, prove that $r\leq k$. In particular, settle the remaining equidimensional cases $p=2$ with sphere dimension $3$ or $7$.
