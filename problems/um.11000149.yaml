title: Question — Are the relations (1) - (7) the only relations which express the twist along the boundary as a product of positive tw…
field: mathematics
tier: prose
statement: "Are the relations (1) - (7) the only relations which express the twist along the boundary as a product of positive twists, up to the positive equivalence in the Artin group? The motivation for this question comes from symplectic geometry. If we are given a Sym- plectic Lefschetz Fibration p: M → D of a 4-manifold M over a disk D we can describe it by its monodromy product of positive Dehn twists of a fiber over the base point p on ∂D. These are twists along vanishing cycles α1,α 2,...,α k corresponding to geometric basis of π1(D− {x1,x 2,...,x k},p ), where xi’s are the critical values of the fibration. We consider the situation where the generic fiber has one boundary component and the monodromy along ∂D is equal to the twist along the boundary of the fiber. I have proven in [ 12] that in the case of a generic Lefschetz pencil of plane curves of any fixed degree we can choose a geometric basis of π1(CP 2−{x1,...,x k}) in such a way that the corresponding vanishing cycles αi form a bouquet. In particular each pair of curves intersects in 0 (when tangent) or 1 point. I do not know if a similar result is true for a generic pencil of curves on an algebraic surface or even more generally for any Symplectic Lefschetz Fibration without reducible fibers but it is reasonable to ask the Smith question under these restricted conditions: we assume that the twists in our product are along curves which intersect pairwise in 0 or 1 point. In particular they lie in the image of a small Artin group by a geometric homomorphism."
