title: Injective Projective Maps of Curves and Segre–Veronese Varieties
field: mathematics
tier: prose
statement: Can every smooth complex projective curve be injected into $\mathbb P^2$? More generally, can every smooth $d$-dimensional projective variety be injected into $\mathbb P^{2d}$? Can every Segre–Veronese variety be injectively projected into a projective space of twice its dimension?
