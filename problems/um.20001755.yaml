title: Fixed-density small-Gaussian asymptotics and the dual Hermite boundary layer
field: mathematics
tier: prose
statement: |-
  Minimize energy for $f(r) = e^{-\alpha r^2}$ in $\mathbb{R}^n$ as $\alpha \rightarrow 0$

  Fix density $\rho>0$. Minimize the lower Gaussian energy per particle among
  discrete configurations of density $\rho$, and determine both the minimum
  value and the structure of minimizers as $\alpha\downarrow0$.
