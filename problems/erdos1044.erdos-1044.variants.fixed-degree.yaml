id: erdos1044.erdos-1044.variants.fixed-degree
title: "Erdős Problem 1044 (variant: fixed_degree)"
field: mathematics
tier: proof
statement: |-
  Tang also suggests that, if the degree $n$ is fixed, then the infimum over all such $f$ of
  degree $n$ is attained by $f_n(z)=z^n-1$.
ams:
