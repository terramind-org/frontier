title: Simultaneous Control of Nodal Blow-Up Values and Positions
field: mathematics
tier: prose
statement: For ancient solutions of $u_t=u_{xx}+\lambda u+|u|^{p-1}u$ on $(0,\pi)$ with Dirichlet boundary conditions, can one prescribe simultaneously the alternating extrema $u_1,\ldots,u_m$ and their blow-up positions $0<x_1<\cdots<x_m<\pi$, subject to the compatibility conditions appearing in the separate existence theorems?
