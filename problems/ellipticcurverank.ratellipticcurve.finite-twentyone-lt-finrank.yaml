lean:
  module: FormalConjectures.Wikipedia.EllipticCurveRank
  decl: EllipticCurveRank.RatEllipticCurve.finite_twentyone_lt_finrank
  statement: "theorem finite_twentyone_lt_finrank : {E : RatEllipticCurve | 21 < E.rank}.Finite"
  context:
    - open EllipticCurveRank
    - open EllipticCurveRank.RatEllipticCurve
    - open Module (finrank)
    - open WeierstrassCurve
    - open scoped Topology
    - open Filter (atTop)
  definitions:
    - name: EllipticCurveRank.RatEllipticCurve
      kind: structure
      text: |-
        /-- A data structure representing isomoprhism classes of elliptic curves over ℚ.
        Every elliptic curve over ℚ is isomorphic to one with Weierstrass equation `y² = x³ + Ax + B`,
        and the pair `(A,B)` is unique if it satisfy the `reduced` condition below.
        See Section 5.1 in [PPVW2016]. -/
        structure RatEllipticCurve : Type where
          A : ℤ
          B : ℤ
          reduced (p : ℕ) : p.Prime → ¬ ((p ^ 4 : ℤ) ∣ A ∧ (p ^ 6 : ℤ) ∣ B)
          Δ_ne_zero : 4 * A ^ 3 + 27 * B ^ 2 ≠ 0
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L46
    - name: EllipticCurveRank.RatEllipticCurve.rank
      kind: abbrev
      text: |-
        /-- The rank of an elliptic curve over ℚ. -/
        noncomputable abbrev rank (E : RatEllipticCurve) : ℕ := finrank ℤ E.toWeierstrass.Point
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/EllipticCurveRank.lean#L78
