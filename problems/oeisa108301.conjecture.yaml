  definitions:
    - name: OeisA108301.a
      kind: def
      text: |-
        /-- The primary defining sequence `a`.
        `a n` is the digital sum of the Fermat number $2^{2^n} + 1$. -/
        def a (n : ℕ) : ℕ :=
          (Nat.digits 10 (2 ^ 2 ^ n + 1)).sum
