title: Scalar circular resolvent estimate and the sharp two-thirds obstruction
field: mathematics
tier: prose
statement: |-
  Let $x,y$ be two free circular elements, and let $S,T$ be two operators in a
  $\mathrm{II}_1$ factor which is free from $x,y$. In the Haagerup--Schultz
  estimate

  \[
  (\star\star)\qquad
  \bigl\|(S+xy^{-1})^{-1}-(T+xy^{-1})^{-1}\bigr\|_p
  \le c(p)\,\|S-T\|_p<\infty,
  \]

  with $0<p<2/3$, can one use $x$ instead of $xy^{-1}$?
