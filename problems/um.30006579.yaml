title: Adic Effective-Period Complex Conjecture
field: mathematics
tier: prose
statement: Let $K=\mathbb Q$ with a $p$-adic valuation, or let $K=k(\pi)$ with the $\pi$-adic valuation, where $k$ has characteristic zero, and write $\widehat K$ for the completion of $K$. For the infinite-dimensional Tate ball $B_\infty$ over $\widehat K$, let $\widetilde{\Omega}_{\infty-\bullet}^{K\text{-}\mathrm{alg}}(B_\infty)$ be the boundary-vanishing complex whose coefficients are power series algebraic over $K(z_1,z_2,\ldots)$. Is this complex acyclic outside degree zero, and is formal integration $H_0\!\left(\widetilde{\Omega}_{\infty-\bullet}^{K\text{-}\mathrm{alg}}(B_\infty)\right)\to\widehat K$ injective?
