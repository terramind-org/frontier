title: Limiting Boolean Functions of Random And–Or Trees
field: mathematics
tier: prose
statement: Given random trees $T_n$ with uniformly random AND/OR labels, do the Boolean functions computed by $T_n$ converge in distribution as $n\to\infty$? When is the limiting distribution degenerate, and what can be said when it is nondegenerate?
