lean:
  module: FormalConjectures.OEIS.«109909»
  decl: OeisA109909.conjecture
  statement: "theorem conjecture : ∀ n > 3, a n > 0"
  context:
    - open OeisA109909
  definitions:
    - name: OeisA109909.a
      kind: def
      text: |-
        /--
        $a(n)$ is the number of primes of the form $k(n-k)-1$.
        This counts the number of distinct prime values in the set $\{k(n-k)-1 | 1 \le k < n\}$.
        -/
        def a (n : ℕ) : ℕ :=
          (Finset.Ico 1 n).image (fun k => k * (n - k) - 1)
          |>.filter Nat.Prime
          |>.card
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/109909.lean#L33
