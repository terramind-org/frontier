lean:
  module: FormalConjectures.ErdosProblems.«654»
  decl: Erdos654.erdos_654.variants.erdos_pach
  statement: |-
    theorem erdos_654.variants.erdos_pach :
        ∀ ε > (0 : ℝ), ∀ᶠ n : ℕ in atTop, ∀ A : Finset ℝ², #A = n → InGeneralPosition A →
          AtMostTwoPerCircle A → ∃ x ∈ A, (1 - ε) * (n : ℝ) < (distinctDistancesFrom A x : ℝ)
  context:
    - open Erdos654
    - open Erdos654.erdos_654
    - open Erdos654.erdos_654.variants
    - open Filter Finset EuclideanGeometry
  definitions:
    - name: Erdos654.AtMostTwoPerCircle
      kind: def
      text: |-
        /-- `AtMostTwoPerCircle A` means that every circle centred at a point $x \in A$ contains at most
        two other points of $A$. -/
        def AtMostTwoPerCircle (A : Finset ℝ²) : Prop :=
          ∀ x ∈ A, ∀ r : ℝ, #((A.erase x).filter fun y ↦ dist y x = r) ≤ 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/654.lean#L141
