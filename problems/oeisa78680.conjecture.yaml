lean:
  module: FormalConjectures.OEIS.«78680»
  decl: OeisA78680.conjecture
  statement: |-
    theorem conjecture :
        a (2 ^ 16) = 0 ∧ ∀ n : ℕ, 1 ≤ n ∧ n < 2 ^ 16 → a n ≠ 0
  context:
    - open OeisA78680
  definitions:
    - name: OeisA78680.a
      kind: def
      text: |-
        /-- Smallest $m > 0$ such that $n \cdot 2^m + 1$ is prime, or 0 if no such $m$ exists. -/
        noncomputable def a (n : ℕ) : ℕ :=
          if h : ∃ m, 0 < m ∧ (n * 2 ^ m + 1).Prime then
            Nat.find h
          else
            0
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/OEIS/78680.lean#L34
