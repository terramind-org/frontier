statement: "(J. Przytycki) (i) Find generators of S4,∞(S3, R). (ii) For which parameters of the (4,∞) skein and framing relations, trivial links are linearly independent in S4,∞(S3; R)? (iii) For which parameters of the (4,∞) skein and framing relations, the trivial knot is not representing a torsion element of S4,∞(S3, R)? A generalization of the Montesinos-Nakanishi conjecture [ 345] said that S4,∞(S3, R) is generated by trivial links and that the (4,∞) skein module (suit- ably defined) for n-tangles is generated by ∏ n−1 i=1 (3i +1) certain basic n-tangles. This would give a generating set for the (4,∞) skein module of S3 or D3 with 2 n boundary points (for n-tangles). However, the Montesinos-Nakanishi 3-move conjecture has been disproved by M.Dabkowski and J.H.Przytycki in February 2002 [99] and [342]. Therefore ∏ n−1 i=1 (3i + 1) is only the lower bound for the number of generators. In [345] we extensively analyze the possibilities that triv ial links are linearly independent; if b∞ = 0, then this may happen only if b0b1 = b2b3. These leads to the following conjecture (cases (1)–(2)):"
