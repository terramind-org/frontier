id: um.30003803
title: Generic Splitting Varieties for Pointed Functors
field: mathematics
tier: prose
statement: Let $k$ be a field, let $S$ be a functor from field extensions of $k$ to pointed sets, and let $s\in S(k)$. Can one construct a smooth geometrically integral $k$-variety $X$ such that, for every field extension $l/k$, the restriction $s_l$ is trivial if and only if $X(l)$ is nonempty, with $X(l)$ Zariski-dense in $X$ whenever it is nonempty?
