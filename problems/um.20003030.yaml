title: A fixed-boundary group-spectrum reduction for homology slice versus contractibly slice knots
field: mathematics
tier: prose
statement: |-
  **Homology slice vs. contractibly slice.** Fix an integer homology sphere
  \(Y\) which bounds a contractible 4-manifold \(W\). Is there a knot
  \(K\) in \(Y\) such that \(K\) bounds a disc in some integer homology
  ball \(W'\), but \(K\) does not bound a disc in any contractible
  4-manifold?
