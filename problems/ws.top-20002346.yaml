  \section{Finite-fiber normalization for elliptic Diophantine encodings}\label{20002346}
  {\small UnsolvedMath ID 20002346 · Logic}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Can elliptic curves replace Pell equations in the proof of the undecidability of Hilbert's tenth problem over $\mathbb Z$, allowing fewer variables or a smaller degree? Can this approach represent every recursively enumerable set by a Diophantine equation having only finitely many witnesses for each parameter?
  \par\smallskip\textit{Formulation references:} \sref{20002346}{1}, \sref{20002346}{2}.
