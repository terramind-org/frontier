title: Brauer–Manin Density in Rationally Connected Fibrations
field: mathematics
tier: prose
statement: Let $p:Z\to B$ be a dominant morphism of smooth proper varieties over a number field $k$, with $B$ and the generic fiber rationally connected. Suppose $B(k)$ is dense in $B(\mathbb A_k)^{\operatorname{Br}(B)}$ and, for rational points $b$ in a dense open subset of $B$, each $Z_b(k)$ is dense in $Z_b(\mathbb A_k)^{\operatorname{Br}(Z_b)}$. Must $Z(k)$ be dense in $Z(\mathbb A_k)^{\operatorname{Br}(Z)}$?
