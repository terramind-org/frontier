title: Minimal Singularity Classes for Functorial Resolution
field: mathematics
tier: prose
statement: What is the smallest class $\mathcal S$ of singularities containing all normal-crossings singularities such that every variety $X$ admits a proper birational or bimeromorphic morphism from a variety $X'$ having only singularities in $\mathcal S$, with the morphism an isomorphism over the normal-crossings locus of $X$?
