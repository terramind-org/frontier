id: oeisa179524.conjecture4
title: Central binomial sum $a(n) = \sum_{k=0}^n (-4)^k \binom{n}{k}^2 \binom{n-k}{k}^2$ (conjecture4)
field: mathematics
tier: proof
statement: |-
  $\sum_{k=0}^{n-1}(20k+17)a(k) \equiv 0 \pmod n$ for all $n=1,2,3,\dots$.
  - _Zhi-Wei Sun_, Jul 01 2010
