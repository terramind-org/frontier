lean:
  module: FormalConjectures.OEIS.«179524»
  decl: OeisA179524.conjecture4
  statement: |-
    theorem conjecture4 (n : ℕ) (hn : 1 ≤ n) :
        (n : ℤ) ∣ ∑ k ∈ Finset.range n, ((20 * (k : ℤ) + 17) * a k)
  context:
    - open OeisA179524
  definitions:
    - name: OeisA179524.a
      kind: def
      text: |-
        /-- The sequence $a(n) = \sum_{k=0}^n (-4)^k \binom{n}{k}^2 \binom{n-k}{k}^2$. -/
        def a (n : ℕ) : ℤ :=
          ∑ k ∈ Finset.range (n + 1), (-4 : ℤ) ^ k * (n.choose k : ℤ) ^ 2 * ((n - k).choose k : ℤ) ^ 2
      url: https://github.com/google-deepmind/formal-conjectures/blob/9097e2f90e66d2f6244209cb1c07f7120d17ec53/FormalConjectures/OEIS/179524.lean#L35
