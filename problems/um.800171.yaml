title: Moments of L-functions — Moments of the Riemann zeta function — Problem 21
field: mathematics
tier: prose
statement: |-
  Consider the family of Rankin-Selberg $L$-functions $L(\frac12,f\otimes g)$ where $g$ is fixed and $f$ varies over the set of primitive forms of weight $k$ and level $p^{\nu}$ as $\nu\to\infty$. Establish upper bounds for third and fourth moments of this family following the work in [ChL1] and [ChL2].
  Note that the 4th moment of the family $L(\frac12,f)$ with $f$ varying as above was studied by Balkanova [balkanova]. \\
  (Alia Hamieh, UNBC)
