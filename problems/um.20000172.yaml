title: Genuine versus normed equivariant elliptic cohomology and a cyclic Frobenius constraint
field: mathematics
tier: prose
statement: |-
  For a finite group \(G\), Lurie constructs equivariant
  elliptic cohomology in commutative naive \(G\)-spectra and in genuine
  \(G\)-spectra compatibly (Lurie 2009, MR2597740).

  Can this construction be extended to commutative genuine \(G\)-spectra
  or \(G\)-commutative genuine \(G\)-spectra?
