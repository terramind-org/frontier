title: Kourovka Notebook Problem 18.46
field: mathematics
tier: prose
statement: |-
  Every finite group $G$ can be embedded in a group $H$ in such a way
  that every element of $G$ is a square of an element of $H$.
  The overgroup $H$ can be chosen such that
  $|H| \le 2|G|^2$.
  Is this estimate sharp?

  It is known that the best possible estimate cannot be better than $|H| \le |G|^2$ (D. V. Baranov, Ant. A. Klyachko, *Siber. Math. J.*, **53**, no. 2 (2012), 201--206).
