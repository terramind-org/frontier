title: Billiards and Quantitative Symplectic Geometry — Bernhard Albach, Umberto Hryniewicz, and Alexandru Oancea — Problem 2
field: mathematics
tier: prose
statement: |-
  **Problem 1.** Is it true that for a Hamiltonian diffeomorphism on a closed symplectic manifold, either the number of periodic orbits is finite, or periodic orbits grow at least quadratically in the sense that $\liminf_{T\to+\infty} \frac{\log P(T)}{\log T} \geq 2$?

  Due to the lack of counterexamples, we suspect the answer might be positive. For instance, as test cases, we propose two particular instances of the above.
