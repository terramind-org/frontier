statement: |-
  Bedford and Fornaess [BeFo] have shown that $u$ need not belong to $\mathcal{C}^2(\bar{\Omega})$ under the assumptions above. Their construction relies on the boundary behavior of the $\mathcal{C}^2$ norm.

  Under what minimial assumptions does $u$ belong to $\mathcal{C}^2(\Omega)$ ?
