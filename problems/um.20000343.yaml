title: The curve cone of the stable genus-zero moduli space and the first symmetric F-curve redundancy
field: mathematics
tier: prose
statement: |-
  **Problem 5.1. Determine the cone of curves of
  \(\boldsymbol{\overline M_{0,n}}\).**

  Inspection of the PDF
  content stream resolves the typography: immediately before the glyph \(M\),
  the stream draws a short filled horizontal rectangle at the height of an
  overline. Thus the mathematical source has an overline that was stored as a
  vector rule rather than as a font glyph, and both text extractions lost it. The recovered statement is therefore

  This reading is also forced by context. The section is headed “Moduli of
  curves—Birational geometry,” and cites Farkas–Gibney and
  Gibney–Keel–Morrison, both of which study the proper stable-curve
  compactification. The usual Kleiman–Mori cone is a cone for a proper
  projective variety; the open configuration space \(M_{0,n}\) is not the
  intended object.

  For \(n\geq 3\), every stable labeled genus-zero curve has trivial
  automorphism group: its dual tree is fixed by its labeled leaves, and every
  component has at least three fixed special points. Consequently
  \(\overline{\mathcal M}_{0,n}\) is represented by the smooth projective
  scheme \(\overline M_{0,n}\). There is no stack/coarse numerical discrepancy
  for the space in the recovered problem. The symmetric quotient
  \(\overline M_{0,n}/S_n\), used below, does have finite quotient
  stabilizers; it is treated through pullback and pushforward on real numerical
  spaces.
