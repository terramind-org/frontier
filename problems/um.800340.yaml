title: Enumeration of Matchings — Problem 11
field: mathematics
tier: prose
statement: |-
  Perhaps this is a special case of a two-parameter fact that says that
  you can take an intrusion of length $m$ in a $2n$-by-$2n$ square and the
  number of tilings of the resulting region will always be a square or
  twice a square.

  What is going on with ``intruded Aztec diamonds''?
  In particular, why is the number of tilings so square-ish?
