title: Open Problems and Questions about Geodesics — Problem 65
field: mathematics
tier: prose
statement: |-
  Also in the Finsler case parameterized geodesics determine the connection. Note though that in the Finsler geometry the connection is non-linear and actually there are more than one popular and widely used connections. We will call two Finsler
  metrics *affinely equivalent* if any
  geodesic of the first metric (considered as a curved parametrized such that the length of the velocity vector is a constant) is a geodesic of the second metric; this is equivalent to the Berwald connections of the first and the second metric coinciding in the natural sense.

  *Describe all affinely equivalent Finsler metrics.*
