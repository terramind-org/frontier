title: Sign-Changing Solutions of the Critical Equation
field: mathematics
tier: prose
statement: For $-\Delta u=|u|^{4/(N-2)}u$ with $u\in D^{1,2}(\mathbb{R}^N)$, what is the optimal energy-gap constant $\varepsilon_0$, and is the minimum energy among sign-changing solutions attained? Are there sign-changing solutions that, modulo conformal transformations, do not have $O(2)$ symmetry? Is every bounded sign-changing solution on $\mathbb{R}^N$ contained in $D^{1,2}(\mathbb{R}^N)$?
