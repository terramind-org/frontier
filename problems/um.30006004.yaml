title: Mod-p Reductions of Crystalline Galois Representations
field: mathematics
tier: prose
statement: Let $\rho:\operatorname{Gal}(\overline{\mathbb{Q}}_p/\mathbb{Q}_p)\to\mathrm{GL}_n(\overline{\mathbb{Q}}_p)$ be crystalline with Hodge–Tate weights $h_1\geq\cdots\geq h_n$. Classify the possible semisimplified reductions $\overline{\rho}:\operatorname{Gal}(\overline{\mathbb{Q}}_p/\mathbb{Q}_p)\to\mathrm{GL}_n(\overline{\mathbb{F}}_p)$. In particular, are the known inertial-weight constraints best possible for $n>2$?
