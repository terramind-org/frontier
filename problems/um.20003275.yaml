title: Parabolic stiffness, the solved moduli example, and finite root/factor diagnostics
field: mathematics
tier: prose
statement: Let \(H\) be a connected semisimple Lie group, let \(P<H\) be a parabolic subgroup, and suppose \(H\) acts on a space \(X\) preserving some geometric structure. Under what conditions is every finite \(P\)-invariant measure on \(X\) \(H\)-invariant? Equivalently, which \(H\)-actions are stiff? As a motivating case, consider the natural \(\mathrm{SL}(2,\mathbb R)\)-action on moduli spaces of quadratic differentials on compact Riemann surfaces.
