  \section{Rational Curves on Compact Kähler Manifolds}\label{30002652}
  {\small UnsolvedMath ID 30002652 · Algebraic Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $X$ be a compact Kähler manifold. Is $X$ covered by rational curves if and only if $K_X$ is not pseudoeffective? If $K_X$ is pseudoeffective but not nef, must $X$ contain a rational curve?
  \par\smallskip\textit{Formulation references:} \sref{30002652}{1}, \sref{30002652}{2}.
  \subsection{Short English statement}
  Let $X$ be a compact Kähler manifold. Is $X$ covered by rational curves if and only if $K_X$ is not pseudoeffective? If $K_X$ is pseudoeffective but not nef, must $X$ contain a rational curve?
