title: A two-source specialization-defect formula and the post-2025 status of plurigenera
field: mathematics
tier: prose
statement: |-
  **Invariance of plurigenera.** What is the status of invariance of plurigenera?

  It is known that \(h^0(mK_X)\) need not be constant in flat families if \(m=1\). For \(m\geq 2\) it remains a possibility.

  **Recovered present-day answer.** The optimistic \(m\geq2\) statement is false in general. It is false logarithmically already for smooth families of surface pairs in every residue characteristic, by Brivio's published 2023 examples. A June 2025 revision of a separate Brivio preprint states that it is also false without boundary for smooth projective families of threefolds with semiample canonical divisor and residue characteristic \(p>2\). Important positive regimes remain, particularly in characteristic zero, for many surface families, and for stable families satisfying base-change and vanishing conditions.
