schema: 1
id: koethe.kotherconjecture.variants.matrixover-kotherradical
title: "Köthe conjecture (variant: matrixOver_KotherRadical)"
field: mathematics
tier: proof
statement: |-
  The **Köthe conjecture**: for any finite index type `n`, the Köthe radical of the matrix
  ring `M_n(R)` is the ideal `M_n(Nil*(R))` of matrices with entries in the Köthe radical of `R`.
ams:
  - 16
tags:
