lean:
  module: FormalConjectures.Wikipedia.Koethe
  decl: Koethe.KotherConjecture.variants.matrixOver_KotherRadical
  statement: |-
    theorem KotherConjecture.variants.matrixOver_KotherRadical (n : Type*) [Fintype n] :
        matrix n (Nil* R) = Nil* (Matrix n n R)
  context:
    - open Koethe
    - open Koethe.KotherConjecture
    - open Koethe.KotherConjecture.variants
    - open Ideal TwoSidedIdeal Polynomial
    - open Matrix
    - open scoped Classical
    - "variable {R : Type*}"
    - variable [Ring R]
    - local notation "Nil* " R => KotheRadical R
  definitions:
    - name: Koethe.KotheRadical
      kind: def
      text: |-
        /-- The *Kothe Radical* of a ring `R` is the sum of all (two-sided) nil ideals of `R`.
        Tags: Kothe Radical, upper nilradical-/
        def KotheRadical : TwoSidedIdeal R := sSup {I : TwoSidedIdeal R | IsNil I}
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/Koethe.lean#L46
