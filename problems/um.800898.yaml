title: Open Problems in Pluripotential Theory — Question 29 (Tosatti)
field: mathematics
tier: prose
statement: |-
  Let $(X,\omega)$ be a compact Hermitian manifold. Define $T(X,\omega)$ by
  $$
  T(X,\omega)=\inf \left\lbrace\int_X(\omega+dd^c\varphi)^n|\ \varphi\in\mathcal{C}^{\infty}(X)\cap PSH(X,\omega) \right\rbrace.
  $$
  Is it possible that $T(X,\omega)=0$ for some manifold?
