title: Conjecture 4.4 — (Nonpositive curvature).
field: mathematics
tier: prose
statement: "(Nonpositive curvature). For g≥ 2 the orbifold Mg admits no complete, finite volume Riemannian metric with nonpositive sectional curvatures uniformly bounded away from−∞. 5As Mg is an orbifold, technically one studies Mod g-invariant metrics on the Teichm¨ uller space Teichg. 32 B. Farb One might be more ambitious in stating Conjecture 4.4, by weakening the finite volume condi- tion, by dropping the uniformity of the curvature bound, or by extending the statement from Mg to any finite cover of Mg (or perhaps even to certain infinite covers). It would also be interesting to extend Conjecture 4.4 beyond the Riemannian realm to that of CAT(0) metrics; see, e.g., [ BrF] for a notion of finite volume which extends to this context. In the end, it seems that we will have to make do with various relative notions of nonpositive or negative curvature, as in [ MM1, MM2 ], or with various weaker notions of nonpositive curvature, such as holomorphic, Ricci, or highly singular versions (see, e.g.,[ LSY]), or isoperimetric type versions such a Kobayashi or Kahler hyperbolicity (see [ Mc2]). Part of the diﬃculty with trying to fit Mg into the “standard models” seems to be the topological structure of the cusp of Mg. Scalar curvature and Q-rank. Let S be a genus g surface with n punctures, and let M(S) denote the corresponding moduli space. We set d(S) = 3 g− 3 + n The constant d(S) is fundamental in Teichm¨ uller theory: it is the complex dimension of the Teichm¨ uller space Teich(S); it is also the number of curves in any pair-of-pants decomposition of S. While previous results have concentrated on sectional and holomorphic curvatures, Shmuel Weinberger and I have recently proven the following; see [ FW2]."
