title: Topology and Constant $\sigma_k$-Curvature Metrics
field: mathematics
tier: prose
statement: For $2\leq k<n/2$, characterize compact manifolds admitting a $k$-positive metric, identify topological obstructions to such metrics, and determine when a conformal class containing one also contains a metric of constant $\sigma_k$-curvature.
