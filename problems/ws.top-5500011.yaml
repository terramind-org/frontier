statement: |-
  \section{3SUM Hard Problems}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For finite integer sets $A,B,C$, put $n=|A|+|B|+|C|$. The three-set 3SUM decision problem asks whether $a+b=c$ for some $a\in A,b\in B,c\in C$. A problem is 3SUM-hard in the source\textquotesingle s sense when 3SUM reduces to it with sufficiently small overhead to transfer a subquadratic algorithm. Subquadratic means $o(n^2)$; a truly subquadratic bound is $O(n^{2-\varepsilon})$ for a fixed $\varepsilon>0$. Bounds depend on the computational model.
  \paragraph{Statement recorded in the supplied source.}
  Can the class of 3SUM-hard problems be solved in subquadratic time? Is 3SUM impossible in $O(n^{2-\varepsilon})$ time for every fixed $\varepsilon>0$, even in expectation? The source reports logarithmic improvements below quadratic time in the real-RAM and word-RAM models; these do not resolve this sharper question. \sref{statement}{2}
  \subsection{Short English statement}
  Can the class of 3SUM-hard problems be solved in subquadratic time? Is 3SUM impossible in $O(n^{2-\varepsilon})$ time for every fixed $\varepsilon>0$, even in expectation? The source reports logarithmic improvements below quadratic time in the real-RAM and word-RAM models; these do not resolve this sharper question.
