title: Rotor-routing halting problem
field: mathematics
tier: prose
statement: "The rotor-routing halting problem asks the following: Given an initial chip-and-rotor configuration on a digraph, does the rotor-routing game eventually terminate? A more refined version of the problem is the halting configuration problem: If the rotor-routing game terminates, what is the final configuration?"
