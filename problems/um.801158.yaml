title: Nijenhuis Geometry and Integrable Systems — Problem 11
field: mathematics
tier: prose
statement: |-
  Certain Frobenius manifolds seem to give examples of geometric Poisson bracket of order 3
  (at least, the WDVV equation does it). Is Frobenius structure projectively invariant? Can one replace, in the definition of Frobenius structure, the flat metric by a metric of constant curvature?
