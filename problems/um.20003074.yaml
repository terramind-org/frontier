statement: |-
  For surfaces for which this is not known, can we produce quasimorphisms using
  actions of $\operatorname{Map}(S)$?

  Its problem text is:

  The supplied literature note is:

  The
  immediately preceding records concern homomorphisms and lattice maps, while item
  4.7 asks about subgroups having infinite-dimensional spaces of quasimorphisms. The literature note also points to the ray and loop graph constructions. The
  safest reconstruction is therefore:

  Here and below “nontrivial” means nonzero after quotienting by homomorphisms and
  bounded functions. This qualification is essential: a homomorphism is itself a
  quasimorphism, but it represents zero in the reduced space.

  Unless continuity is explicitly mentioned, groups and quasimorphisms are
  treated algebraically. Big mapping class groups carry a natural Polish topology,
  so continuous quasimorphisms form a genuinely different problem.
