title: 7.1 (Long) — Principal and Euclidean rings of integers from totally real polynomials
field: mathematics
tier: prose
statement: Let $f(x)\in\mathbb{Z}[x]$ be irreducible over $\mathbb{Q}$ with all roots real, let $f(\alpha)=0$, let $k=\mathbb{Q}(\alpha)$, and let $\mathcal{O}_k$ be its ring of integers. How often is $\mathcal{O}_k$ a principal ideal domain; does this happen infinitely often? How often is $\mathcal{O}_k$ Euclidean with respect to the standard norm?
