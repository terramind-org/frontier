title: Problem 2.7 — Suppose that ta1ta2··· tan = 1 in Modg, where n≥ 1.
field: mathematics
tier: prose
statement: "Suppose that ta1ta2··· tan = 1 in Modg, where n≥ 1. Let G denote the quotient H1(S)/⟨[a1], [a2],..., [an]⟩, where [ai] denotes the homology class of the simple closed curve ai. Is it true that b1(G)≤g? A positive answer to this problem imply that the total space of every genus g Lefschetz fibration over the 2-sphere has the first Betti number b1≤g, whenever the Lefschetz fibration has at least one singular fiber. To the best knowledge of the author, all known examples of Lefschetz fibrations satisfy this conclusion. Assume that g≥ 2. On the closed connected oriented surface S, let us mark a point P. Let Mod1 g denote the mapping class group S with one puncture P. In this case, by forgetting that P is marked, we get an epimorphism ϕ: Mod 1 g→ Modg, whose kernel is isomorphic to the fundamental group of S at the point P."
