title: Hyperbolic geometry — Question 10.7
field: mathematics
tier: prose
statement: |-
  Suppose $\mathscr{F}$ is a taut foliation of a hyperbolic $3$–manifold $M$.
  Let $$\pi:\widetilde{M} \to L$$
  be the projection to the leaf space of $\widetilde{\mathscr{F}}$.

  - For $\gamma$ a random walk in $\widetilde{M}$
  (which is isometric to $\mathbb{H}^3$), what is the typical behaviour of $\pi(\gamma)$?

  - Does a random walk in $\widetilde{M}$ converge to a definite end of $L$?

  - What if we replace ``random walk'' with ``random geodesic'' in the previous
  question?

  - Is the pushforward of asymptotic behaviour well–defined? That is, is it
  true that for a set of geodesics $\gamma$ of full measure, for all $\gamma'$
  a bounded distance from some $\gamma$ the behaviour of the pushforward of
  $\gamma$ and $\gamma'$ exit the same end of $L$?

  - Suppose $\mathscr{F}$ has one–sided branching. Does a random walk always
  exit $L$ in the unbranching direction?

  - Suppose there is a positive probability of a random walk exiting
  a proper positive or negative end of $L$. Does this imply $\mathscr{F}$ is $\mathbb{R}$–covered?
  What about if there is a positive probability of a random walk being recurrent?
