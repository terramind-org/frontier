title: Differential signatures as a generic coarse moduli quotient
field: mathematics
tier: prose
statement: |-
  **Problem 3.6.** Can we use differential (integral, other…) invariants to construct a moduli space?

  **Yes, on a dense specialization-good fixed-degree locus, as a generic
  coarse geometric quotient and as a flat family of target signature curves.
  No, in general, as a fine moduli scheme or as the quotient stack: signature
  curves forget stabilizers and twisted families.**
