statement: For mechanically stabilized martensitic materials, determine the relation between temperature shift and initial microstructure, the thermodynamic principles governing interfacial microstructures, the mechanism of austenite nucleation, and whether complete suppression of austenite nucleation can be achieved by tuning microstructure, orientation, and specimen dimensions.
