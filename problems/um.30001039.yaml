title: Detection and Uniqueness of Lie Quasi States
field: mathematics
tier: prose
statement: Given a Lie group $G$, its Lie algebra $\mathfrak{g}$, and an adjoint-invariant cone $K\subset\mathfrak{g}$, characterize all Lie quasi-states $\zeta:\mathfrak{g}\to\mathbb{R}$ that are linear on commutative subspaces and nonnegative on $K$. Is the Maslov Lie quasi-state for $\operatorname{Sp}(2n)$ unique up to isomorphism? Does $(T^4,\omega_{\mathrm{std}})$ admit a nonlinear Lie quasi-state? How many Lie quasi-states do $(\mathbb{CP}^2,\omega_{\mathrm{std}})$ and $(S^2\times S^2,\omega_{\mathrm{std}}\oplus\omega_{\mathrm{std}})$ admit?
