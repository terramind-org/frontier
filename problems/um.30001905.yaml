title: K-Theoretic Descent from MU to the Sphere
field: mathematics
tier: prose
statement: Let $S \to MU$ be the unit map from the sphere spectrum $S$ to the complex cobordism spectrum $MU$, viewed as a commutative $MU$-Hopf--Galois extension in the sense of Rognes. Can the algebraic $K$-theory spectrum $K(S)$ of the sphere spectrum be recovered from $K(MU)$ by homotopy fixed-point/cosimplicial descent along $S \to MU$?
