title: Problem 2.2 — Compute CommModg (Γ) for various subgroups Γ< Modg.
field: mathematics
tier: prose
statement: "Compute CommModg (Γ) for various subgroups Γ< Modg. Paris-Rolfsen and Paris (see, e.g., [ Pa]) have proven that most subgroups of Mod g stabiliz- ing a simple closed curve, or coming from the mapping class group of a subsurface of S, are self-commensurating in Mod g. Self-commensurating subgroups, that is subgroups Γ < H with CommH (Γ) = Γ, are particularly important since the finite-dimensional unitary dual of Γ in- jects into the unitary dual of H; in other words, any unitary representation of H induced from a finite-dimensional irreducible unitary representation of Γ must itself be irreducible. V olumes of representations. Consider the general problem of classifying, for a fixed finitely generated group Γ, the set Xg(Γ):= Hom(Γ, Modg)/ Modg of conjugacy classes of representations ρ: Γ → Modg. Here the representations ρ1 and ρ2 are conjugate if ρ1 =Ch◦ρ2, where Ch: Mod g→ Modg is conjugation by some h∈ Modg. Suppose Γ = π1X whereX is, say, a smooth, closed n-manifold. Since Mg is a classifying space for Mod g, we know that for each for each [ ρ]∈X g(Γ) there exists a smooth map f:X→M g with f∗ =ρ, and that f is unique up to homotopy. Eachn-dimensional real cocycle ξ onMg then gives a well-defined invariant νξ:Xg(Γ)→ R defined by νξ([ρ]):= ∫ X f ∗ξ It is clear that νξ([ρ]) does not depend on the choices, and indeed depends only on the cohomology class of ξ. As a case of special interest, let X be a 2 k-dimensional manifold and let ωWP denote the Weil-Petersson symplectic form on Mg. Define the complexk-volume of ρ:π1X→ Modg to be Volk([ρ]):= ∫ X f ∗ωk WP"
