title: Displaceability of Lagrangian Toric Fibers
field: mathematics
tier: prose
statement: Let $(M,\omega,T)$ be a symplectic toric manifold with moment polytope $\Delta$, and let $L_u=\Phi^{-1}(u)$ be the Lagrangian toric fiber over $u\in\operatorname{int}\Delta$. Which fibers $L_u$ are displaceable; that is, for which $u$ is there a Hamiltonian symplectomorphism $\varphi$ with $\varphi(L_u)\cap L_u=\varnothing$?
