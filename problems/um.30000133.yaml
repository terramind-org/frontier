title: Pair Correlation of Zeta Zeros
field: mathematics
tier: prose
statement: Assume the Riemann hypothesis, and write the nontrivial zeros of $\zeta$ as $\frac12+i\gamma$. For every suitable even test function $f$, does the following asymptotic hold? $$\sum_{0<\gamma,\gamma'\leq T} f\!\left(\frac{(\gamma-\gamma')\log T}{2\pi}\right)\sim\frac{T\log T}{2\pi}\left[f(0)+\int_{-\infty}^{\infty}f(u)\left(1-\left(\frac{\sin(\pi u)}{\pi u}\right)^2\right)\,du\right]$$.
