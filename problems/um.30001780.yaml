title: Spectral Bounds for Random DFT Submatrices
field: mathematics
tier: prose
statement: Let $F_{\Omega_n,T_n}$ be the DFT submatrix formed by independently retaining rows with probability $1-q$ and columns with probability $1-p$. If $p+q>1$, is $\|F_{\Omega_n,T_n}\|<\sqrt{p(1-q)}+\sqrt{q(1-p)}+\varepsilon$ with high probability? If $p\ne q$, is $\|(F_{\Omega_n,T_n})^{-1}\|<\bigl(|\sqrt{p(1-q)}-\sqrt{q(1-p)}|-\varepsilon\bigr)^{-1}$ with high probability?
