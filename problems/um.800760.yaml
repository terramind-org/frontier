title: Open Problems in the Theory of Ample Fields — Question 3
field: mathematics
tier: prose
statement: |-
  Colliot-Th\'el\`ene observed that a field $K$ is ample whenever $G_K$ is a pro-$p$ group for some
  prime number $p$, [ColliotThelene,JardenAmple].
  This covers again in particular
  the archimedean local fields $\mathbb{R}$ and $\mathbb{C}$.
  Since pro-$p$ groups are prosolvable, and all local fields have prosolvable absolute Galois groups
  we want to ask for the following generalization of Colliot-Th\'el\`ene's result:

  Is every infinite field $K$ with prosolvable absolute Galois group $G_K$ ample?
