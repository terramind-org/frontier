statement: |-
  \section*{Conformal stress improvement in the finite-scaling-support operational framework}\label{30007240}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For four-dimensional operational quantum field theories satisfying all source framework assumptions, including algebraic direct-sum decomposition and finite scaling support for every original field, must the dimension-three virial divergence equal Box L for a physical Hermitian scalar L of dimension two, allowing a symmetric conserved traceless stress improvement with unchanged translation and Lorentz Ward charges and unbroken local conformal Ward identities?
  \subsection{Short English statement}
  For four-dimensional operational quantum field theories satisfying all source framework assumptions, including algebraic direct-sum decomposition and finite scaling support for every original field, must the dimension-three virial divergence equal Box L for a physical Hermitian scalar L of dimension two, allowing a symmetric conserved traceless stress improvement with unchanged translation and Lorentz Ward charges and unbroken local conformal Ward identities?
