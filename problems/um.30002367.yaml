title: Topological Nilpotence Degree of Finite-Group Chow Rings
field: mathematics
tier: prose
statement: For a finite group $G$, is the topological nilpotence degree $d_0(CH_G^*)$ of its mod-$p$ Chow ring equal to the largest integer $d$ such that $CH_G^*$, as a module over the Steenrod algebra, contains the $d$th suspension of a nonzero unstable module?
