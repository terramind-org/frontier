title: Branch-point resonances and parabolic time decay
field: mathematics
tier: prose
statement: |-
  For which more general parabolic systems can a zero of an Evans function at a
  branch point of the spatial dispersion relation be related rigorously to the
  leading large-time decay of the linear Green function and, through nonlinear
  estimates, to the decay of perturbations of a coherent structure?

  In the original AIM
  PDF, the entry is headed by B. Sandstede and begins with the observation that an
  Evans function can often be extended to branch points of the linear dispersion
  relation. It then says that Murata showed that the temporal decay rates for
  scalar linear heat equations depend strongly on the presence of roots at those
  branch points. The open problem is, verbatim,

  The singular “equation” appears in the source and is probably a grammatical
  error; it has not been silently changed. Here “this” means the dependence of
  large-time Green-function decay on a threshold/branch-point root or resonance. The text beginning “S. Malham: (Biscale chaos)” belongs to the following AIM
  record, AIM-PDES-0058, and is not part of the present problem.

