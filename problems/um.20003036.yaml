id: um.20003036
title: A compression-ladder reduction and category audit for stable four-genus
field: mathematics
tier: prose
statement: |-
  **Stable 4-genus and 2-torsion.** Find a knot \(K\) which has infinite order in \(\mathcal C\) and yet which has \(g_4^{st}(K)=0\).

  The preceding canonical record defines
  \[
  g_4^{st}(K)=\lim_{n\to\infty}\frac{g_4(nK)}{n}
  \]
  “in either category.” This creates a category issue that must be resolved explicitly. Standard usage in this workshop makes unadorned \(\mathcal C\) and \(g_4\) smooth. Thus the intended reading is:

  * \(K\) has infinite order in the smooth concordance group \(\mathcal C_{\mathrm{sm}}\); and
  * its smooth stable four-genus \(g_{4,\mathrm{sm}}^{st}(K)\) is zero.

  There is also a coherent topological version, with both terms interpreted locally flat topologically, and an incoherent “mixed” version using smooth order but topological four-genus. The mixed version has easy explicit solutions (Section 5); they do not solve the intended problem.
