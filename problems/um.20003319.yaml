id: um.20003319
title: Uniform gap transfer and an elementary irrational diagonal family
field: mathematics
tier: prose
statement: |-
  Let \(Q\) be a nondegenerate positive definite quadratic form of dimension \(d\geq3\).

  Conjecture 34 (Davenport--Lewis). Suppose that \(Q\) is not a multiple of a rational form. Then the gaps between consecutive elements of the set
  \[
  \{Q(x):x\in\mathbb Z^d\}
  \]
  go to zero as \(Q(x)\to\infty\).

  The record has lost the hypotheses printed at the start of Section 5.5.

  Thus the recovered AIM statement is: if \(Q\) is a nondegenerate positive-definite real quadratic form in \(d\geq3\) variables and its coefficient matrix is not a real scalar multiple of a rational matrix, then the gaps between successive **distinct** elements of \(Q(\mathbb Z^d)\) tend to zero. Positivity makes the distinct value set locally finite, so it can be ordered

  \[
  0=v_0<v_1<v_2<\cdots,
  \]

  and the conclusion is \(v_{j+1}-v_j\to0\). Repeated representations of one value are not additional elements.

  There is a historical qualification. Later primary papers describe the original Davenport--Lewis conjecture with \(d\geq5\), whereas the AIM list places Conjecture 34 in a section beginning with \(d\geq3\). This report treats the AIM formulation: its \(d\geq5\) part is solved and its \(d=3,4\) extension remains open.
