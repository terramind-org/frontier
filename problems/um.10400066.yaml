statement: (R. Bott) Give a geometric construction of these homology classes coming from Lie algebras. The third and currently best interpretation of graph cohomo logy is that it is the cohomology of an infinite-dimensional Lie algebra of formal Hamiltonian vector fields. Kontsevich uses this to explain (and vastly generali se) Rozansky-Witten weight systems in terms of Gelfand-Fuchs cohomology. Can th is interpretation be employed on the topological rather than algebraic side? I n other words, is there a construction involving knots and algebras of formal vector fields which yields the Kontsevich integral?
