title: Geometric Hydrodynamics in Open Problems — Problem 1
field: mathematics
tier: prose
statement: |-
  Find a variational (preferably geodesic) formulation describing the motion of an ideal fluid
  in a fixed domain $M$ containing sources and sinks.
  What is the correct formulation of the variational problem:
  should one take into account the exterior forces and/or the ``memory" of the fluid?
