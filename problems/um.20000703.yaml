title: An orthogonalized Type-II lower-bound certificate and rank obstruction
field: mathematics
tier: prose
statement: |-
  We can get lower bounds for the Type I off-diagonal terms using sifted sequences. Is there any analog of this for Type II terms? Can one improve lower bounds for $F(\alpha,T)$ in this way (as in Goldston-Gonek-Ozluk-Snyder)?

  Can one get lower bounds for moments in general?
