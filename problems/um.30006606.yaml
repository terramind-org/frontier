title: Radius-Function Unimodality in Bounded-Dimensional Median Graphs
field: mathematics
tier: prose
statement: Does there exist an absolute constant $c>0$ such that every median graph of cube dimension $d$ has all of its radius functions $G_{cd}$-unimodal? Extend the theory, if possible, to suitably edge-weighted median graphs and to useful families of partial cubes.
