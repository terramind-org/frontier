title: "Henon Maps: Open Problems — Question 11"
field: mathematics
tier: prose
statement: |-
  For any map $f_{c,b}$ and any infinite set of periodic saddles $(p_n)$
  which are pairwise not homoclinically related, do we have
  $\min(|\lambda^-(p_n)|,|\lambda^+(p_n)|)\underset{n\to \infty}\longrightarrow 0$?
