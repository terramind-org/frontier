title: An inert-prime lifting criterion for the Cornelissen K3 equation
field: mathematics
tier: prose
statement: |-
  **Question 13 (Cornelissen).** Solve in integers \(A,B,X,Y\):
  \[
  (A^2+B^2)(A^2+11B^2)=3^2\cdot5^2(X^2-5Y^2)^2. \tag{1}
  \]
  This is related to defining the integers in the rational numbers by a
  \(\Sigma_3^+\)-formula; see Cornelissen--Zahidi, arXiv:math.NT/0412473.
