title: Axiomatic stable homotopy 7 — The equivariant stable homotopy category is not treated very well in our memoir.
field: mathematics
tier: prose
statement: The equivariant stable homotopy category is not treated very well in our memoir. That is, we assume that the generators have to be dualizable. This is not true unless you use the complete universe. Peter May tried to talk us out of this at the time, and I think he was right. So try to understand what happens when the generators are not dualizable. Is there some other condition that does hold in the equivariant stable homotopy category over an incomplete universe that replaces this? There is a notion of weakly dualizable, for example, which is just that D^2 X = X. Maybe the generators are weakly dualizable?
