title: Continuity of Gradient Distance for Monotone Equations
field: mathematics
tier: prose
statement: Let $G\in C^0(\mathbb R^2;\mathbb R^2)$ be strictly monotone, and let $u$ be a Lipschitz solution of $\operatorname{div}G(\nabla u)=0$. If $\mathcal B$ is the set where ellipticity degenerates simultaneously from below and above, is $x\mapsto\operatorname{dist}(\nabla u(x),\mathcal B)$ continuous?
