title: Holomorphic Foliation Theory — Problem 9
field: mathematics
tier: prose
statement: |-
  Let $Z$ be a holomorphic vector field in $\mathbb{C}^2$.

  (i) Is it possible to have a set of positive measure of leaves covered by $\mathbb{C}$ and another set of positive measure of leaves covered by the unit disc ?

  (ii) If a non-pluripolar set of leaves are parabolic, are all leaves parabolic ?

  (iii) Find conditions which imply that all leaves are covered by the unit disc.
