title: A modewise rotating-AR analogue for discrete-time stochastic reaction-diffusion systems
field: mathematics
tier: prose
statement: |-
  Its damaged displays recover as

  \[
  \dot x=f(x,y),\qquad \dot y=g(x,y),
  \]

  and, after linearization at the stable fixed point,

  \[
  \begin{bmatrix}dx\\dy\end{bmatrix}
  =A\begin{bmatrix}x\\y\end{bmatrix}dt
  +\begin{bmatrix}\sigma _1\,dW_1\\ \sigma _2\,dW_2\end{bmatrix}. \]

  On page 2 the same question is repeated as Problem 13 and followed by a separate fast/slow-systems question.

  “A discrete time reaction diffusion equation” is not specified further: it could mean a coupled map lattice, a time discretization of an SPDE, an integrodifference equation, or a microscopic discrete-time population process. The result below therefore treats a clearly stated coupled-map lattice model. Other interpretations require changing the multiplier and noise covariance, but the modewise argument survives whenever a spatial eigenbasis diagonalizes both.
