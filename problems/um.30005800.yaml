title: Polynomial-Homology Families and the p-q Theorem
field: mathematics
tier: prose
statement: Fix constants $c$ and $t$. Let $\mathcal F$ be a family of subsets of $\mathbb R^d$ such that $\sum_{i=1}^{\lfloor d/2\rfloor}\widetilde\beta_i(\bigcap\mathcal G)\leq c|\mathcal G|^t$ for every finite $\mathcal G\subseteq\mathcal F$. Prove that $\mathcal F$ satisfies a $(p,q)$-theorem for every $p\geq q\geq d+1$.
