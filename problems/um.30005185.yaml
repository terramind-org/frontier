title: Modulo-Four Reduced Khovanov Rank of Ribbon Knots
field: mathematics
tier: prose
statement: Let $R$ be $\mathbb F_p$ or $\mathbb Z$. Prove that $\operatorname{rk}\widetilde{\operatorname{Kh}}_R(K)\pmod4$ is a knot-concordance invariant; equivalently, prove $\operatorname{rk}\widetilde{\operatorname{Kh}}_R(J)\equiv1\pmod4$ for every ribbon knot $J$.
