id: um.30005021
title: Six Problems in Borel Graph Combinatorics
field: mathematics
tier: prose
statement: "Resolve the following questions for Borel graphs: (1) a Borel Lovász Local Lemma for graphs generated by amenable-group actions; (2) uniqueness of Lebesgue measure among finitely additive measures on Borel subsets of $S^n$ for $n\\geq2$; (3) existence of unfriendly Borel colorings for every bounded-degree Borel graph; (4) the bound $\\chi_B(G)\\leq2n+1$ for finitely Borel-colorable graphs generated by $n$ functions; (5) Baire-measurable $(d+1)$-edge-colorings for degree-$d$ Borel graphs; and (6) the measurable independence and chromatic numbers of the Schreier graph of the Bernoulli shift of $F_2$."
