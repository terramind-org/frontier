id: um.30002269
title: Local Clique-Weighted Chromatic Bounds
field: mathematics
tier: prose
statement: |-
  Does there exist a universal constant $\varepsilon>0$ for which

  $$\chi(G)\leq\max_{v\in V(G)}\left\lceil(1-\varepsilon)(d(v)+1)+\varepsilon\omega(G[\widetilde N(v)])\right\rceil$$

  holds for every graph $G$?
