statement: Suppose $**S**^3\to **S**^7\to **S**^4$ is a ``generalized'' Hopf fibration. Does there exist a homology $4$-sphere $H$ and a degree one map $H\to **S**^4$ such that the pull-back of the generalized Hopf fibration is a flat $**S**^3$-bundle?
