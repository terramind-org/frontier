  \item[\hypertarget{source:statement:2}{S2}] Lewis Bowen and Michael Chapman, \emph{Surjunctivity does not characterize cosoficity of invariant random subgroups}, arXiv:2511.06586 (2025), abstract and Section 1. \url{https://arxiv.org/abs/2511.06586}.
  \end{description}
  \label{end:statement}
