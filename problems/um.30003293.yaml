title: Multiple Kodaira Fiberings and Relative Irregularity
field: mathematics
tier: prose
statement: Do compact complex surfaces exist with three or more Kodaira fiberings? Can one obtain better or asymptotically sharp upper bounds, as the fiber genus $g(F)$ grows, for the relative irregularity $q_f$ of a nonisotrivial fibered Kähler surface, especially a Kodaira fibration?
