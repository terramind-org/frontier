title: Picker Surplus and Maker–Breaker Monotonicity
field: mathematics
tier: prose
statement: For the Picker–Chooser game on a hypergraph $H$ consisting of $2^n$ pairwise disjoint sets of size $n$, what happens when $|H|<2^n$, and what if Picker only wants some surplus? For the Maker–Breaker $(1,k)$ connectivity game, with $c(G,k)$ the number of Maker's final edges when Maker wins and $\infty$ otherwise and $C_n(k)=\min_G c(G,k)$ over $n$-vertex graphs, is $C_n(k)\leq C_n(k+1)$, and what analogous functions and questions arise for other Maker–Breaker games?
