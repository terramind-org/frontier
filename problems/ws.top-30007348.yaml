title: The exact hierarchical cavity pressure for dilute even-arity spin glasses
field: mathematics
tier: prose
statement: |-
  \section*{The exact hierarchical cavity pressure for dilute even-arity spin glasses}\label{30007348}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For the even-arity dilute Ising models satisfying the Panchenko–Talagrand factorization, integrability and positivity hypotheses, does the thermodynamic mean pressure equal the infimum of the explicit finite-hierarchy cavity trial functional over every finite hierarchy depth and trial law, with convergence also in probability?
  \subsection{Short English statement}
  For the even-arity dilute Ising models satisfying the Panchenko–Talagrand factorization, integrability and positivity hypotheses, does the thermodynamic mean pressure equal the infimum of the explicit finite-hierarchy cavity trial functional over every finite hierarchy depth and trial law, with convergence also in probability?
