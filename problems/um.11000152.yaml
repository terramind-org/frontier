title: Question 2.1 — Is the Hurwitz problem for mapping class group factorizations decidable?
field: mathematics
tier: prose
statement: Is the Hurwitz problem for mapping class group factorizations decidable? Are there interesting criteria which can be used to conclude that two given factorizations are equivalent, or inequivalent, up to Hurwitz moves and global conjugation? In broader terms, the question is whether mapping class group factorizations can be used to derive non-trivial and useful invariants of Lefschetz fibrations, or even better, of the underlying symplectic 4-manifolds. At this point, it is worth mentioning two spectacular examples of such invariants which arise from geometric considerations (rather than purely from mapping class group theory). One is Sei- del’s construction of a Fukaya-type A∞-category associated to a Lefschetz fibration [ 21], which seems to provide a computationally manageable approach to Lagrangian submanifolds and Fukaya categories in open 4-manifolds equipped with exact symplectic structures. The other is the enu- merative invariant introduced by Donaldson and Smith, which counts embedded pseudoholomor- phic curves in a symplectic 4-manifold by viewing them as sections of a “relative Hilbert scheme” associated to a Lefschetz fibration [ 9].
