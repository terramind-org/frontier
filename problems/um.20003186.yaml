title: A measured Toledo bound and obstructions to maximality
field: mathematics
tier: prose
statement: |-
  **Question 4.1 (Marc Burger).** Let \(M\) be a compact manifold foliated by surfaces, with transverse measure \(\mu\). Denote the foliation by \(\mathcal F\). Let \(X\) be a Hermitian symmetric space, \(G=\operatorname{Isom}(X)^0\), and \(\rho:\pi_1(M)\to G\). Given a \(\rho\)-equivariant map \(f:\widetilde M\to X\), we have
  \[
  f^*\omega\in H^2(\mathcal F),
  \]
  and let \(C\) be a Ruelle--Sullivan cycle. Find bounds on
  \[
  \langle f^*\omega,C\rangle\in\mathbb R
  \]
  and study the maximal representations.
