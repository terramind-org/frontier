id: oeisa233549.conjecture-3
title: Number of ways to write $n = p + q$ ($q > 0$) with $p$ and $(\phi(p)\phi(q))^4 + 1$ prime (conjecture_3)
field: mathematics
tier: proof
statement: |-
  Conjecture (iii): If $n > 3$ is different from $9$ and $16$, then there is a prime $p < n$
  with $((p+1)\phi(n-p))^2 + 1$ prime.
