  statement: |-
    theorem conjecture_3 (n : ℕ) (hn : 3 < n) (hne9 : n ≠ 9) (hne16 : n ≠ 16) :
        ∃ p < n, p.Prime ∧ Nat.Prime (((p + 1) * (n - p).totient) ^ 2 + 1)
