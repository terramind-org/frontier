title: Sparse-degree discrete restriction and a finite random-phase theorem
field: mathematics
tier: prose
statement: |-
  **Question 9 (Li).** Let \(d\geq 3\). For \(p\geq 2(d+1)\), prove
  \[
  \left\|\sum_{n=1}^{N}a_n e^{2\pi i n^d t}e^{2\pi i n\cdot x}\right\|_{L^p(\mathbb T^2)}
  \lesssim
  N^{\frac12-\frac{d+1}{p}+\varepsilon}
  \left(\sum_{n=1}^{N}|a_n|^2\right)^{1/2}.
  \tag{0.11}
  \]
  This is related to Waring's problem.
