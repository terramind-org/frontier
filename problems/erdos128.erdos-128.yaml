lean:
  module: FormalConjectures.ErdosProblems.«128»
  decl: Erdos128.erdos_128
  statement: |-
    theorem erdos_128 :
        ∀ (V : Type) [Fintype V] (G : SimpleGraph V),
          (∀ V' : Set V, 2 * V'.ncard + 1 ≥ Fintype.card V →
            50 * (G.induce V').edgeSet.ncard > Fintype.card V ^ 2) → ¬ G.CliqueFree 3
  context:
    - open Erdos128
    - "variable {V : Type*} {G : SimpleGraph V} [Fintype V]"
  definitions: []
