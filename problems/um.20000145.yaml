title: "Very moving cycle classes: Chow-family and positive-form reductions"
field: mathematics
tier: prose
statement: |-
  Let \(X\) be a projective variety. Suppose that there is a class
  \(\alpha\in \operatorname{Eff}_k(X)_{\mathbb Z}\) such that for a general point
  \(x\in X\) and a general \(k\)-plane \(V\subset T_xX\) there is an irreducible
  subvariety \(Y\subset X\) with \([V]=\alpha\) and \(T_xY=V\).

  Is \(\alpha\) in the interior of the effective cone?

  **Recovered problem.** Let \(X\) be a smooth irreducible projective complex
  variety of dimension \(n\), and let
  \(\alpha\in N_k(X)_{\mathbb Z}\) be an effective integral numerical class. Assume
  that for a general pair
  \[
   (x,V)\in G:=\operatorname{Gr}_X(k,T_X)
  \]
  there is an irreducible \(k\)-dimensional subvariety \(Y\subset X\) such that
  \[
   [Y]=\alpha,\qquad x\in Y_{\mathrm{reg}},\qquad T_xY=V.
  \tag{VM}
  \]
  Must \(\alpha\) lie in
  \(\operatorname{int}\overline{\operatorname{Eff}}_k(X)\)?
