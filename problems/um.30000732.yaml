title: Fast Maker Constructions of Regular Graphs
field: mathematics
tier: prose
statement: For a fixed $d>0$, are there infinitely many $d$-regular graphs $G$ for which Maker can win $(K_N,G)$ in at most $f(d)|V(G)|$ rounds whenever $N$ is sufficiently large, with $f(d)\leq(1+o(1))d$?
