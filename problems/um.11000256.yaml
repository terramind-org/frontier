title: Question 4.10 — Let Γ be a lattice in SO(m, 1), m≥ 3 or SU(q, 1), q≥ 2 which is admissable for Γg.
field: mathematics
tier: prose
statement: "Let Γ be a lattice in SO(m, 1), m≥ 3 or SU(q, 1), q≥ 2 which is admissable for Γg. Does Γ inject in Γg? Can there be purely pseudo-Anosov representations? If such an injection exists does there exist a continuous Γ-equivariant map ∂∞(Γ)→ PML0(Σ)? More generally, for a fixed Σ and hence fixed vcd, a further natural generalization of the discussion here is: 284 A.W. Reid"
