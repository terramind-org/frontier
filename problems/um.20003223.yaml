title: Row-sum homomesies for the symmetric action on Gelfand-Tsetlin patterns
field: mathematics
tier: prose
statement: |-
  Problem 4.7. What are the homomesies of the symmetric group action on Gelfand-Tsetlin triangles?

  One might expect (at least naively) that there are more homomesies for the symmetric group action than for its cyclic subactions: making the group bigger means merging orbits, and this merging permits more averaging to take place. Note that there is significant overlap with the question raised in Section??.
