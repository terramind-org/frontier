title: Are there any pairs of relatively prime amicable numbers
field: mathematics
tier: prose
statement: |-
  \section{Are there any pairs of relatively prime amicable numbers}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  For $n\in\mathbb N$, let $s(n)=\sum_{d\mid n,\ 1\le d<n}d$. Distinct positive integers $m,n$ are amicable if $s(m)=n$ and $s(n)=m$. They are relatively prime if $\gcd(m,n)=1$.
  \paragraph{Statement recorded in the supplied source.}
  Does there exist an amicable pair $m,n$ with $\gcd(m,n)=1$? \sref{statement}{2}
  \subsection{Short English statement}
  Can two relatively prime positive integers form an amicable pair?
