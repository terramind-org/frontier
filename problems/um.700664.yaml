title: Kourovka Notebook Problem 10.49
field: mathematics
tier: prose
statement: |-
  Does there exist a group $G$ satisfying the following
  four conditions:

  1) $G$ is simple, moreover, there is an
  integer $n$
  such
  that $G=C^n$ for any conjugacy class $C$,

  2) all maximal abelian subgroups of $G$ are
  conjugate in $
  G$,

  3) every maximal abelian subgroup of $G$ is
  self-normalizing and it is the centralizer of any of its
  nontrivial elements,

  4) there is an integer $m$ such that if $H$
  is a
  maximal
  abelian subgroup of $G$ and $a \in G\setminus H$ then every
  element in
  $G$ is a product of $m$ elements in $aH$?

  *Comment of 2005:* There is a partial
  solution in (E. Jaligot, A. Ould Houcine, *J. Algebra*, **280** (2004), 772--796).
