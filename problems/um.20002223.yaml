title: A sharp codimension-one compound threshold
field: mathematics
tier: prose
statement: |-
  In the strict convention used below, \(TP_r\) means that every minor of order at most \(r\) is positive, and \(TP\) means that every minor is positive.

  The record begins with the dimension-free Katkova--Vishnyakova phenomenon: a positive square matrix satisfying
  \[
   ad-\lambda bc>0,\qquad \lambda\geq4,
  \]
  on its \(2\times2\) submatrices is TP. It asks for higher-order quantitative conditions that upgrade \(TP_{k-1}\) to TP and for optimal constants.

  There is an important formulation distinction. The AIM problem literally says “every \(2\times2\) submatrix,” which ordinarily means every choice of two rows and two columns. The primary theorem of Katkova--Vishnyakova needs only the **local adjacent-entry** inequalities
  \[
   a_{ij}a_{i+1,j+1}>c\,a_{i,j+1}a_{i+1,j}. \tag{1.1}
  \]
  Thus the literal AIM hypothesis is stronger.
