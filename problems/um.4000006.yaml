title: Sharp Lichnerowicz theorem
field: mathematics
tier: prose
statement: For the $\varepsilon$-step random walk on an $N$-dimensional Riemannian manifold, the coarse-curvature argument gives the lower spectral-gap estimate $\inf\operatorname{Ric}$, whereas the sharp Lichnerowicz estimate is $\frac{N}{N-1}\inf\operatorname{Ric}$. Can the missing directional information be incorporated, for example through reflection couplings, to recover the sharp theorem?
