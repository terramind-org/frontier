title: Moments of L-functions — Moments of the Riemann zeta function — Problem 30
field: mathematics
tier: prose
statement: |-
  Topacogullari [T1], [T3] and Drappeau [Dr] have proven asymptotic formulae for $D_{k,2}(x,h)$.
  Prove an omega theorem for $D_{k,2}(x,h)-M_{k,2}(x,h)$ for $k \ge 3$ where $M_{k,2}(x,h)$ is the main term in the asymptotic formula. \\
  (N. Ng, Lethbridge)
