id: um.30002902
title: Lower Bounds for Reduced Structure Groups
field: mathematics
tier: prose
statement: Let $M$ be a compact oriented manifold of dimension $4k-1$ with $k>1$ and fundamental group $G$. Is $\operatorname{rank}\widetilde{\mathcal S}(M)\geq N_{\mathrm{fin}}(G)$, where $\widetilde{\mathcal S}(M)$ is the structure group modulo classes induced by orientation-preserving self-homotopy equivalences and $N_{\mathrm{fin}}(G)$ is the number of distinct finite orders of nonidentity elements of $G$?
