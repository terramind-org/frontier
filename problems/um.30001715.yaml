title: Compactified Jacobians and Kac Polynomials of Quivers
field: mathematics
tier: prose
statement: For every quiver $\Gamma$ and dimension vector $v$, construct the projective curve $C_{\Gamma,v}$ with one rational component of multiplicity $v_i$ per vertex and nodal intersections along edges, form its compactified Jacobian $J_v$, and seek a cohomological interpretation of $A_\Gamma(v,q)$ via $J_v$ and the associated character variety.
