title: The Dupont–Monod Comparison-Map Conjecture
field: mathematics
tier: prose
statement: |-
  For every connected semisimple Lie group $G$ with finite center, is the comparison map

  $$H^n_{\mathrm{cb}}(G;\mathbb R)\longrightarrow H^n_{\mathrm c}(G;\mathbb R)$$

  an isomorphism for every degree $n$?
