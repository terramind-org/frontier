title: Cubical Facet Counts and Nonintersecting Spatial Triangles
field: mathematics
tier: prose
statement: Let $C(d,n)$ be the maximum number of facets of a cubical $d$-polytope with $n$ vertices. Is $C(d,n)=o(n^2)$ for every fixed $d$? Separately, let $t(n)$ be the maximum number of triangles with vertices in an $n$-point subset of $\mathbb R^3$ such that two triangles meet only in a common vertex or are disjoint. Determine the growth of $t(n)$.
