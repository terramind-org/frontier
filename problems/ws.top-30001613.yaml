  \section{Brennan-Type Integrability for Crescent-Domain Conformal Maps}\label{30001613}
  {\small UnsolvedMath ID 30001613 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $G$ be the bounded complementary component of a crescent domain and let $\phi:G\to\mathbb D$ be conformal. For which $\tau$ is $$\int_G|\phi'(z)|^{3+\tau}\,dA(z)<\infty$$ independently of $G$?
  \par\smallskip\textit{Formulation references:} \sref{30001613}{1}, \sref{30001613}{2}.
  \subsection{Short English statement}
  Let $G$ be the bounded complementary component of a crescent domain and let $\phi:G\to\mathbb D$ be conformal. For which $\tau$ is $$\int_G|\phi'(z)|^{3+\tau}\,dA(z)<\infty$$ independently of $G$?
