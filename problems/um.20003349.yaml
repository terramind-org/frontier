title: Directional nondivergence, invariant cluster measures, and the closed-orbit case
field: mathematics
tier: prose
statement: |-
  Let \(A_T\) denote the ball of radius \(T\) in \(A\) and \(\lambda\) a Haar
  measure on \(A\).

  **Question 50 (B. Weiss).** Suppose that \(\dim A\geq2\) and for some
  \(x\in G/\Gamma\) and every one-parameter subgroup \(D\) of \(A\), the
  orbit \(Dx\) is not divergent in \(G/\Gamma\). Is it true that there exists
  a compact set \(K\subset G/\Gamma\) such that
  \[
  \limsup_{T\to\infty}
  \frac{1}{\lambda(A_T)}
  \lambda\bigl(\{a\in A_T:ax\in K\}\bigr)>0?
  \]

  **9. André--Oort Conjecture**
