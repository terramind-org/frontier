title: Multivariable Motivic Poles and Monodromy
field: mathematics
tier: prose
statement: For a holomorphic germ $F=(f_1,\ldots,f_r):(\mathbb C^n,0)\to(\mathbb C^r,0)$, do all polar hyperplanes of its multivariable motivic zeta function lie in the zero locus $Z(B_F)$ of the Bernstein–Sato ideal? Does the corresponding multivariable monodromy conjecture hold?
