title: Matrix Factorization over Curve Patching Fields
field: mathematics
tier: prose
statement: Let $F=F_U\cap F_P\subset F_{\wp}$ be the patching fields associated with a curve. For which linear algebraic groups $G/F$ does every $g\in G(F_{\wp})$ factor as $g=g_Ug_P$ with $g_U\in G(F_U)$ and $g_P\in G(F_P)$?
