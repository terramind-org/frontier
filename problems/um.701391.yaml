title: Kourovka Notebook Problem 17.89
field: mathematics
tier: prose
statement: |-
  By Bousfield's theorem, the free pronilpotent
  completion of a non-cyclic free group has uncountable Schur
  multiplier. Is it true that the free prosolvable completion (that
  is, the inverse limit of quotients by the derived subgroups) of a
  non-cyclic free group has uncountable Schur multiplier?
