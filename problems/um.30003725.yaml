title: Avalanche Tails and Height Correlations in Sandpiles
field: mathematics
tier: prose
statement: |-
  For the Abelian sandpile model on $\mathbb Z^d$ with infinite-volume measure $\nu$, determine the tail of $\nu(|\operatorname{Av}|>t)$ for $d\geq2$. In dimension $2$, prove or disprove
  $$
  \operatorname{Cov}_\nu(\eta(o)=i,\eta(x)=j)\sim a_{i,j}(\log^2|x|)|x|^{-4}
  $$
  as $|x|\to\infty$, for $i,j\in\{1,2,3\}$.
