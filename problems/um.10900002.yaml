title: 1.2 (Choi) — Convex projective deformations from a CR structure
field: mathematics
tier: prose
statement: Suppose a hyperbolic $3$-manifold $M$ admits a CR structure, not necessarily a spherical one. Can the deformation theory of convex real projective structures on $M$ be understood in terms of the CR structure? The source suggests hyperbolic Coxeter $3$-orbifolds as a potentially easier case.
