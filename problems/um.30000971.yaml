title: Eisenbud's Fiber-Regularity Conjecture
field: mathematics
tier: prose
statement: Let $X\subset\mathbb{P}^r$ be a smooth projective variety of dimension $n$, and let $\pi:X\to\mathbb{P}^{n+c}$ be a general projection. Is $\operatorname{reg}(\pi^{-1}(y))\leq n/c+1$ for every $y\in\mathbb{P}^{n+c}$? If $Q_y$ is the obstruction sheaf of the fiber, is $c^{-1}\operatorname{length}(Q_y)$ at least the regularity of the fiber?
