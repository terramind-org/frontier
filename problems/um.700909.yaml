title: Kourovka Notebook Problem 12.92
field: mathematics
tier: prose
statement: |-
  For a field $K$ of characteristic 2, each finite
  group $G=\{ g_1,\ldots ,g_n\}$ of odd order $n$ is determined up to
  isomorphism by its group determinant (Formanek--Sibley, 1990) and
  even by its *reduced norm* which is defined as the last
  coefficient $s_m(x)$ of the minimal polynomial $\varphi (\lambda
  ;x)=\lambda ^m - s_1(x)\lambda ^{m-1} + \cdots + (- 1)^{m}s_m(x)$ for
  the generic element $x=x_1g_1 + \cdots + x_ng_n$ of the group ring
  $KG$ (Hoehnke, 1991). Is it possible in this theorem to replace
  $s_m(x)$ by some other coefficients $s_i(x)$, $i < m$? For notation
  see (G. Frobenius, *Sitzungsber. Preuss. Akad. Wiss. Berlin*,
  1896, 1343--1382) and (K. W. Johnson, *Math. Proc. Cambridge
  Phil. Soc.*, **109** (1991), 299--311).
