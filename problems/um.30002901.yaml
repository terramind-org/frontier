title: Finite-Order Projections outside the Assembly-Map Image
field: mathematics
tier: prose
statement: For a nonidentity finite-order element $g\in G$ of order $d$, set $p_g=d^{-1}\sum_{k=1}^d g^k\in\mathbb QG$. If $g_1,\ldots,g_n$ have distinct finite orders, do $[p_{g_1}],\ldots,[p_{g_n}]$ generate a rank-$n$ subgroup of the finite part of $K_0(C^*(G))$, every nonzero element of which lies outside the assembly-map image?
