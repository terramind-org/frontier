title: Snake-Graph Models for Generalized Cluster Variables
field: mathematics
tier: prose
statement: For a generalized cluster algebra of type $C_n$ with generalized exchange polynomials, does every cluster variable correspond to a connected subgraph of its generalized snake graph? Do analogous snake-graph descriptions hold for the affine types covered by the same construction?
