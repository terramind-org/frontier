  \section*{Circulant Hadamard conjecture}\label{30007082}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  If a real n-by-n circulant matrix with entries in \{-1,1\} satisfies H $H^T=n$ I, must n belong to \{1,4\}?
  \subsection{Short English statement}
  If a real n-by-n circulant matrix with entries in \{-1,1\} satisfies H $H^T=n$ I, must n belong to \{1,4\}?
