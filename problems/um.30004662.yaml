title: Higher Product Rigidity for Wound Unipotent Targets
field: mathematics
tier: prose
statement: Let $U$ be a wound unipotent group over $k$, let $X_1,\ldots,X_n$ be nonempty open subschemes of $\mathbb P_k^1$ with chosen points $x_i\in X_i(k)$, and let $D$ be the union of their complementary divisors. If $n$ exceeds the degree of primitivity of $D$, is every $k$-morphism $\prod_iX_i\to U$ that is trivial whenever one coordinate is fixed at $x_i$ the constant morphism $1$?
