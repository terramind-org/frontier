title: Minimal Ramification over Rational Function Fields
field: mathematics
tier: prose
statement: |-
  For $q=p^\nu$ and a finite group $G$, is
  $$
  r_{\mathbb F_q(T)}(G)=\max\{1,d((G/p(G))^{\mathrm{ab}})\},
  $$
  where $r_{\mathbb F_q(T)}(G)$ is the minimum number of ramified primes and $G/p(G)$ is the maximal quotient of order prime to $p$?
