id: um.20000458
title: A representation-sensitive decidability dichotomy for integer rotation constraints
field: mathematics
tier: prose
statement: |-
  Is there an algorithm to decide solubility of a system of linear equations
  \[
  a_{i1}x_1+\cdots+a_{in}x_n=b_i
  \]
  for integer coefficients and integer unknowns, together with conditions of the form
  \[
  \{x_i\alpha_j\}<r_j
  \]
  for \(\alpha_j\in\mathbb R\setminus\mathbb Q\) and rational \(r_j\)?
