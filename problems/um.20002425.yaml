statement: |-
  (Question of Donaldson) Find smooth solutions to the equation
  \[
  \ddot{\varphi}- \frac 12 |\nabla \dot \varphi|^2_{\omega_\varphi}=-\lambda R_{\omega_\varphi}
  \]
  for $\lambda>0$ on $M \times [0,1]$ with $\varphi|_{M\times\{0\}}=0$, $\varphi|_{M\times\{0\}}=\varphi_0$.
