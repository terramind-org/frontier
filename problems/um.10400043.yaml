statement: "(A. Kricker) Take (M1, K1) and (M2, K2) of the above sort. Then, there exists a (Z/pZ)-equivariant isomorphism φ: H1(Σ p (M1,K1); Z) → H1(Σ p (M2,K2); Z) preserving the linking pairing if and only if (M1, K1) is equivalent to (M2, K2) by a finite sequence of mod p loop moves."
