title: An explicit smooth locus for the coprime-degree cubic family
field: mathematics
tier: prose
statement: |-
  **Does there exist an irrational unirational variety with unirational parametrizations of coprime degrees?**

  **Recovered answer.** Yes. In August 2025, Song Yang, Xun Yu, and Zigang Zhu produced a two-dimensional family of smooth cubic threefolds with parametrizations of degrees $2$ and $3$. Every smooth complex cubic threefold is irrational by Clemens--Griffiths. Thus their examples answer the AIM question affirmatively.
