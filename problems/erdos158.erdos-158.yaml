lean:
  module: FormalConjectures.ErdosProblems.«158»
  decl: Erdos158.erdos_158
  statement: |-
    theorem erdos_158 : ∀ A : Set ℕ, A.Infinite → B2 2 A →
        liminf (fun N : ℕ => (A ∩ .Iio N).ncard * (N : ℝ) ^ (- 1 / 2 : ℝ)) atTop = 0
  context:
    - open Erdos158
    - open Filter Real
  definitions:
    - name: Erdos158.B2
      kind: def
      text: |-
        /-- A set `A ⊆ ℕ` is said to be a `B₂[g]` set if for all `n`, the equation
        `a + a' = n, a ≤ a', a, a' ∈ A` has at most `g` solutions. This is defined in [ESS94]. -/
        def B2 (g : ℕ) (A : Set ℕ) : Prop :=
          ∀ n, {x : ℕ × ℕ | x.1 + x.2 = n ∧ x.1 ≤ x.2 ∧ x.1 ∈ A ∧ x.2 ∈ A}.encard ≤ g
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/158.lean#L35
