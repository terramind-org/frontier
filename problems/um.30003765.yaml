title: Grothendieck’s Anabelian Conjectures over Finitely Generated Fields
field: mathematics
tier: prose
statement: Let $k/\mathbb Q$ be a finitely generated field extension. Are smooth hyperbolic curves over $k$ anabelian? Does every point of a smooth $k$-variety have a basis of anabelian Zariski neighborhoods? Can $X(k)$ be reconstructed from $\pi_1^{\acute et}(X)$ together with $G_k$?
