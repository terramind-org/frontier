title: Complexity in Enumerative Combinatorics — Problem 9
field: mathematics
tier: prose
statement: |-
  In a forthcoming paper [GP-ADE]
  we construct an explicit but highly artificial non-symmetric set
  $S\subset F_k\times F_\ell$
  In [KP2] we use the tools in [KP1] to prove that
  groups have an uncountable set of *spectral radii*
  $$
  \rho(G,S) := \lim_{n\to \infty} a_n(G,S)^{1/n}
  $$
  Since the set of D-algebraic sequence is countable, this implies the
  existence of D-transcendental Cayley graphs with symmetric $S$,
  but such a proof is nonconstructive.

