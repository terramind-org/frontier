  \section*{Curtis stable mod-two Hurewicz image}\label{30007501}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Is the image of positive-degree stable sphere homotopy in $H*(Q_{0}S^{0};F_{2})$ generated only by the Hurewicz images of the Hopf-invariant-one elements $\eta ,\nu ,\sigma $ and the Kervaire-invariant-one elements that exist?
  \subsection{Short English statement}
  Is the image of positive-degree stable sphere homotopy in $H*(Q_{0}S^{0};F_{2})$ generated only by the Hurewicz images of the Hopf-invariant-one elements $\eta ,\nu ,\sigma $ and the Kervaire-invariant-one elements that exist?
