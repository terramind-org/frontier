title: Billiards and Quantitative Symplectic Geometry — Serge Tabachnikov — Problem 7
field: mathematics
tier: prose
statement: |-
  **Ivrii's conjecture for outer symplectic billiards..** The Ivrii conjecture for conventional billiards asserts that the set of periodic orbits has zero measure (with respect to the measure associated with the invariant symplectic structure of the phase space). A similar conjecture applies to the outer symplectic billiards.

  For conventional billiards, this conjecture is proved for periods $n=2,3$ in all dimensions, and for $n=4$ in dimension 2.
  For planar outer billiards, there are proofs for $2n+1$-periodic orbits with rotation number $n$ and for $2n$-periodic orbits with rotation number $n-1$. See [Sh] and the references therein about these results.

  Problem: *prove Ivrii's conjecture for 3-periodic multidimensional outer symplectic billiards with respect to a strictly convex closed hypersurface.*
