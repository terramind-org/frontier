title: "Stanley's Positivity Problems in Algebraic Combinatorics — Problem 17: Stembridge's monomial immanant positivity conjecture for totally nonnegative matrices"
field: mathematics
tier: prose
statement: For a partition $\lambda \vdash n$, let $\phi^\lambda$ denote the unique class function on $S_n$ whose Frobenius characteristic $\operatorname{ch}\phi^\lambda = \frac{1}{n!}\sum_{w\in S_n}\phi^\lambda(w)p_{\rho(w)}$ is the monomial symmetric function $m_\lambda$, and define the immanant $\operatorname{Imm}_{\phi^\lambda}(A) = \sum_{w\in S_n} \phi^\lambda(w) a_{1,w(1)}\cdots a_{n,w(n)}$. If $A$ is a totally nonnegative $n\times n$ real matrix (every minor of $A$ is nonnegative) and $\lambda \vdash n$, is $\operatorname{Imm}_{\phi^\lambda}(A) \ge 0$?
