title: Resurgence Bounds for Linear Arrangements in Multiprojective Spaces
field: mathematics
tier: prose
statement: For ideals of line arrangements, which further arrangements admit useful resurgence bounds? Can analogous containment and resurgence results be extended to higher-dimensional linear arrangements in products of projective spaces, and what upper bounds hold for concrete subschemes of multiprojective spaces?
