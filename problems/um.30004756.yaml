title: Geometry of Singular Monge–Ampère Solution Loci
field: mathematics
tier: prose
statement: Let $n\geq5$ and consider convex solutions of $$\det D^2u=1+\sum_i a_i\delta_{p_i}.$$ Determine whether singular solutions analogous to the known lower-dimensional examples exist; whether their singularities persist under small perturbations of the locations $p_i$ and masses $a_i$; and the dimension, regularity, connectivity, and other geometry of the singular-solution locus, including algebro-geometric conditions that exclude singular structures.
