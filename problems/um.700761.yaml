title: Kourovka Notebook Problem 11.69
field: mathematics
tier: prose
statement: |-
  A group $G$ acting on a
  set $\Omega$ will be said to be {\it \mathrm{1}-$\{
  2\}$-transitive} if it acts transitively on the set $ \Omega
  ^{1,\{ 2\}}=\{ (\alpha , \{ \beta ,\gamma \} )\mid \alpha ,\beta
  ,\gamma \mbox{ distinct}\} .$ Thus $G$ is 1-$\{ 2\}$-transitive
  if and only if it is transitive and a stabilizer $G_{\alpha}$ is
  2-homogeneous on $\Omega \setminus \{ \alpha \} $. The problem is
  to classify all (infinite) permutation groups that are 1-$\{
  2\}$-transitive but not 3-transitive.
