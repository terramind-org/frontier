schema: 1
id: witness.cap-set-f3-7
title: Largest cap set in F_3^7
field: mathematics
tier: witness
statement: A cap set in F_3^n is a set of points containing no three distinct points on a line, which is the same as no distinct a, b, c with a + b + c = 0. The exact maximum size is known only for n <= 6. For n = 7 the largest known cap set has 236 points and none can have 292 or more. Find a cap set in F_3^7 with more than 236 points.
ams:
