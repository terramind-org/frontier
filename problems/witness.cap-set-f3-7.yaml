      url: https://nieuwarchief.nl/serie5/pdf/naw5-2024-25-1-045.pdf
    note: Table 1 of the reference lists 236 as the best lower bound for n = 7 and states that no cap set with 292 or more elements exists. Who first found a 236-point cap set was not confirmed when this problem was added.
  format: 'A JSON object {"points": [[...], ...]}. Each point is an array of 7 integers, each 0, 1 or 2 (a vector of F_3^7). Points must be distinct, there are at most 2187 of them, and no three may sum to 0 mod 3 coordinatewise. The value is the number of points.'
