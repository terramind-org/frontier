  \section*{Factor-two shortest common superstring}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Can a deterministic algorithm polynomial in the total encoded length of any finite collection of ordinary strings return a common superstring of length at most twice the minimum?
  \subsection{Short English statement}
  Can a deterministic algorithm polynomial in the total encoded length of any finite collection of ordinary strings return a common superstring of length at most twice the minimum?
