statement: |-
  \section*{Finite critical two-point operator norm and nonuniqueness for nonamenable graphs}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For every infinite connected locally finite nonamenable quasi-transitive graph, does independent bond percolation satisfy $p_c<p_{2\to 2}\leq p_u$ and have a bounded l2 two-point connectivity operator at $p_c$? Here $p_{2\to 2}$ is the supremum of p for which that operator is bounded, and $p_u$ is the uniqueness threshold. Include the stated simultaneous nonuniqueness interval for two parameter configurations.
  \subsection{Short English statement}
  For every infinite connected locally finite nonamenable quasi-transitive graph, does independent bond percolation satisfy $p_c<p_{2\to 2}\leq p_u$ and have a bounded l2 two-point connectivity operator at $p_c$? Here $p_{2\to 2}$ is the supremum of p for which that operator is bounded, and $p_u$ is the uniqueness threshold. Include the stated simultaneous nonuniqueness interval for two parameter configurations.
