title: Extreme effective cones and stable Schubert bounds for Plucker hypersurfaces
field: mathematics
tier: prose
statement: |-
  **Recovered question.** If \(X\subset Gr(m,n)\) is a very general
  hypersurface, what is \(\operatorname{Eff}_k(X)\)?

  Its final sentence is

  There is no object \(K\) in the record. The preceding clause introduces \(X\),
  and the question asks for cycles on the hypersurface. Thus the only coherent
  recovery is

  The replacement \(K\rightsquigarrow X\) is a correction of an apparent typo,
  not a change to the mathematical question. The source also does not specify
  whether \(Gr(m,n)\) parametrizes projective \(m\)-planes or
  \(m\)-dimensional vector subspaces. In this report
  \[
  G=\operatorname{Gr}(r,V)=\operatorname{Gr}(r,n)
  \]
  parametrizes \(r\)-dimensional vector subspaces of an \(n\)-dimensional complex
  vector space, with \(1\leq r\leq n-1\). Thus
  \[
  g:=\dim G=r(n-r). \]
  Write \(H=c_1(\mathcal O_G(1))\) for the Plücker hyperplane class. A
  degree-\(d\) hypersurface means a divisor
  \[
  X\in |dH|,\qquad d\geq 1. \]
  We assume that \(X\) is smooth and put \(m=\dim X=g-1\). The conclusions below
  hold for every smooth member, and hence for a very general member when the
  smooth locus of the linear system is nonempty.

  The word “effective cone” is interpreted as the **closed pseudoeffective
  cone**
  \[
  \overline{\operatorname{Eff}}_k(X)\subset N_k(X)_{\mathbb R},
  \]
  the closure of the cone generated by effective \(k\)-dimensional algebraic
  cycles. This is the convention used in the modern higher-cycle literature. For all cones computed exactly below, taking the closure makes no difference.
