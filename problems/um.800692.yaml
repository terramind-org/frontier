title: Open Problems on Central Simple Algebras — Problem 2
field: mathematics
tier: prose
statement: |-
  As mentioned above, the smallest non-crossed product $p$-algebras known have degree $p^3$. Therefore even the following is open:

  Determine whether $p$-algebras of degree $p^2$ are crossed products.
