title: Rank Growth and the Tame Fontaine–Mazur Conjecture
field: mathematics
tier: prose
statement: If $S$ contains no primes above $p$ and $G_{K,S}$ is infinite, must its rank-growth exponent satisfy $\gamma(G_{K,S})\geq1/2$? Prove or disprove that this lower bound is group-theoretically equivalent to the Tame Fontaine–Mazur conjecture.
