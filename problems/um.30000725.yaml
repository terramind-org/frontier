statement: "For every undirected graph $G$, are the following equivalent: $\\mu(G)\\leq5$; the even-mapping invariant satisfies $\\sigma(G)\\leq5$; and the panelling $\\widetilde G$, obtained by attaching a disk to each circuit of $G$, embeds in $\\mathbb{R}^4$?"
