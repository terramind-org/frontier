title: Sharp Fractional Inradius Constants with Fixed Connectivity
field: mathematics
tier: prose
statement: |-
  For $0<s<1$ and $k\geq2$, determine the sharp constant
  $$
  T_{s,k}=\inf\{\lambda_1^s(\Omega)r_\Omega^{2s}:\Omega\subset\mathbb R^2\text{ has connectivity }k\}.
  $$.
