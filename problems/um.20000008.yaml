title: A direct HHL--Brown--Erman comparison with a corrected Hirzebruch-surface differential
field: mathematics
tier: prose
statement: |-
  **Compare \(\Delta\)-resolutions.** Can we directly compare the Hanlon-Hicks-Lazarev and Brown-Erman construction of resolutions?

  **Potential mechanism (starting in degree 0):** vertices/points in the stratification of \(T^n\) arising in HHL are in one-to-one correspondence with additional generators for normalization of the semigroup ring, i.e. elements coming from saturation of the semigroup.
