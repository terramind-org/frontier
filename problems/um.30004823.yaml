title: Polynomial Specht Multiplicities in Symmetric-Variety Cohomology
field: mathematics
tier: prose
statement: Let a symmetric ideal in the inverse-limit ring of symmetric polynomials define a sequence of symmetric varieties $V_n$, and fix a partition $\lambda$ and an integer $p\geq0$. Is the multiplicity of the Specht module indexed by $\{\lambda\}_n$ in $H^p(V_n;\mathbb Q)$ eventually a polynomial in $n$?
