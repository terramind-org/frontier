title: Listable and height-thin Diophantine subsets of the rationals
field: mathematics
tier: prose
statement: |-
  **Question 8 (Pasten).** Do we know an r.e. subset of \(\mathbb Q\) which
  is not diophantine? There is some evidence that \(\mathbb Z\) is not
  diophantine, but we have no proof yet.

  What is the “thinnest” subset of \(\mathbb Q\) known to be diophantine?

  Does Bombieri--Lang imply that the diophantine subsets of \(\mathbb Q\)
  are either finite or have “fast” growth rates? This would give a different
  proof, assuming Bombieri--Lang, that \(\mathbb Z\) is not diophantine.
