title: What diagonal and toric-correspondence transforms remember
field: mathematics
tier: prose
statement: |-
  What does the Fourier-Mukai transform by either resolution of $\Delta$ applied to $M$ tell us about $M$? More generally what does applying Fourier-Mukai transforms of resolutions of toric subvarieties tell us about the modules apply them to? [e.g. in the spirit of the way we obtain Eagon-Northcott-type complexes for modules]

  The archive of the preceding section also resolves an important ambiguity: its Problem 4.1 explicitly calls the two constructions the **Hanlon--Hicks--Lazarev (HHL)** and **Brown--Erman (BE)** resolutions. Thus “either resolution” means those two diagonal resolutions, rather than the later Anderson construction.

  The record does not define $X$ or $M$. In the workshop context, the intended setup is a smooth projective toric variety $X$, its Cox ring $S$ with irrelevant ideal $B$, and a finitely generated $\operatorname{Pic}(X)$-graded $S$-module $M$. Write $\widetilde M$ for its associated coherent sheaf. The intrinsic Fourier--Mukai statement concerns $\widetilde M$; a free Cox complex obtained by applying $\Gamma_*$ is additional, presentation-sensitive data. This distinction is essential.
