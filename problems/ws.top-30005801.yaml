  \section{Chromatic Number of Overlapping Unit-Circle Constellations}\label{30005801}
  {\small UnsolvedMath ID 30005801 · Graph Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Determine the maximum chromatic number of the tangency graph of a possibly overlapping constellation of unit circles. Equivalently, determine the chromatic number of the plane in the Hadwiger-Nelson problem.
  \par\smallskip\textit{Formulation references:} \sref{30005801}{1}, \sref{30005801}{2}.
  \subsection{Short English statement}
  Determine the maximum chromatic number of the tangency graph of a possibly overlapping constellation of unit circles. Equivalently, determine the chromatic number of the plane in the Hadwiger-Nelson problem.
