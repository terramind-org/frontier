title: NP versus the Existential Theory of the Reals
field: computer-science
tier: prose
statement: |-
  \section*{\texorpdfstring{NP versus the Existential Theory of the Reals}{NP versus the Existential Theory of the Reals}}\label{30006759}
  \subsection{Definitions and mathematical statement}
  The existential theory of the reals asks whether a sentence
  $\exists x_1,\ldots,x_m\in{\mathbb{R}}\;\Phi(x_1,\ldots,x_m)$ is true, where $\Phi$ is a quantifier-free Boolean combination of polynomial equalities and inequalities with integer coefficients given in finite binary encoding. The complexity class $\exists{\mathbb{R}}$ consists of languages polynomial-time many-one reducible to this decision problem. With $\mathrm{NP}$ defined by polynomial-length binary certificates and polynomial-time deterministic verification, the selected question is
  \[
   \exists{\mathbb{R}}\subseteq\mathrm{NP},\qquad\text{equivalently }\mathrm{NP}=\exists{\mathbb{R}}.
  \]
  Witnesses for the real formula itself need not be rational or have short numerical encodings; the question concerns existence of \emph{some} NP verification scheme, not merely writing down a real solution.
  \par\smallskip\textit{Formulation and concept references:} \href{https://arxiv.org/abs/2407.18006}{[S1]}.

  \subsection{Short English statement}
  Can the existence of solutions to finite systems of real polynomial constraints always be certified by a short binary proof that is efficiently checkable?
  \subsection{Sources}
  \begin{itemize}
  \item[S1]M. Schaefer, J. Cardinal, T. Miltzow, The Existential Theory of the Reals as a Complexity Class: A Compendium, arXiv:2407.18006, 2024.
  \url{https://arxiv.org/abs/2407.18006}.
  \textit{Formulation source.}
  \end{itemize}
