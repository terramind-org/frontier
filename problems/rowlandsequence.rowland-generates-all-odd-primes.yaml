lean:
  module: FormalConjectures.Wikipedia.RowlandSequence
  decl: RowlandSequence.rowland_generates_all_odd_primes
  statement: |-
    theorem rowland_generates_all_odd_primes {p : ℕ} (hp : p.Prime) (hodd : Odd p) :
        ∃ n : ℕ, 2 ≤ n ∧ rowlandDiff n = p
  context:
    - open RowlandSequence
  definitions:
    - name: RowlandSequence.rowlandDiff
      kind: def
      text: |-
        /-- Step increment $d(n) = a(n) - a(n - 1)$ of `rowlandSeq` (meaningful for $n \ge 2$; shifted by
        one from `OEIS A132199`, where `A132199(n) = rowlandDiff (n + 1)`). -/
        def rowlandDiff (n : ℕ) : ℕ :=
          rowlandSeq n - rowlandSeq (n - 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/RowlandSequence.lean#L49
