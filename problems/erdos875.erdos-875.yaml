lean:
  module: FormalConjectures.ErdosProblems.«875»
  decl: Erdos875.erdos_875
  statement: |-
    theorem erdos_875 :
        {c : ℝ | ∃ A : Set ℕ, A.Infinite ∧ IsAdmissible A ∧
          ∀ᶠ n : ℕ in atTop, (gap A n : ℝ) ≤ (n : ℝ) ^ c} = erdos_875.answer
  context:
    - open Erdos875
    - open Filter
  definitions:
    - name: Erdos875.IsAdmissible
      kind: def
      text: |-
        /-- A set `A` of natural numbers is *admissible* if the sets $S_r$ of sums of $r$ distinct
        elements of `A` are pairwise disjoint for $r\geq 1$. Here `ℕ` contains $0$, but an infinite
        admissible set does not contain $0$: for any other element $a$ we would have
        $a=0+a\in S_1\cap S_2$. -/
        def IsAdmissible (A : Set ℕ) : Prop :=
          (Set.Ici (1 : ℕ)).PairwiseDisjoint (rSums A)
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/875.lean#L48
    - name: Erdos875.gap
      kind: def
      text: |-
        /-- For an infinite set `A = {a₁ < a₂ < ⋯}`, `Nat.nth (· ∈ A) k` is $a_{k+1}$, because the
        enumeration starts at index `0`. Hence `gap A n` is $a_{n+1}-a_n$ for $n\geq 1$. The value at
        `n = 0` is junk and is never used, since the statements below only concern large `n`. -/
        noncomputable def gap (A : Set ℕ) (n : ℕ) : ℕ :=
          Nat.nth (· ∈ A) n - Nat.nth (· ∈ A) (n - 1)
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/875.lean#L60
    - name: Erdos875.erdos_875.answer
      kind: def
      text: "def erdos_875.answer : Set ℝ := sorry"
      url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/ErdosProblems/875.lean#L77
