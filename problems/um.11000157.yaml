title: Problem 1.1 — The ideas which were just described relate to the beginning of the lower central series of Ig.
field: mathematics
tier: prose
statement: The ideas which were just described relate to the beginning of the lower central series of Ig. There is also the lower central series of Kg. The correspondence between the group structure of Mg and 3-manifold topology, as regards the subgroups of Mg that have been studied, has been remarkable. It suggests strongly that there is much more to be done, with the possibility of new 3-manifold invariants as a reward.
