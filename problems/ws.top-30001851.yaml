  % UnsolvedMath ID 30001851; source catalogue code OWR-11128-002
  \setcounter{section}{30001850}
  \section{Uniform Rectifiability from Bounded Riesz Transforms}\label{30001851}
  {\small UnsolvedMath ID 30001851 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $n,d$ be integers with $1\le n<d$, and let $\mu$ be an $n$-dimensional AD-regular measure in $\mathbb R^d$. Is $\mu$ uniformly $n$-rectifiable if and only if its maximal $n$-Riesz transform $R_\mu^*$ is bounded on $L^2(\mu)$?
  \par\smallskip\textit{Formulation references:} \sref{30001851}{1}, \sref{30001851}{2}.
  \subsection{Short English statement}
  Let $n,d$ be integers with $1\le n<d$, and let $\mu$ be an $n$-dimensional AD-regular measure in $\mathbb R^d$. Is $\mu$ uniformly $n$-rectifiable if and only if its maximal $n$-Riesz transform $R_\mu^*$ is bounded on $L^2(\mu)$?
