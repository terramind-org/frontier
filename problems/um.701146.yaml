title: Kourovka Notebook Problem 15.58
field: mathematics
tier: prose
statement: |-
  Suppose that a free
  profinite product $G*H$ is a free profinite group of finite rank.
  Must $G$ and $H$ be free profinite groups?

  By (J. Neukirch, *Arch. Math.*, **22**,
  no. 4 (1971), 337--357) this may not be true if the rank of $G*H$
  is infinite.
