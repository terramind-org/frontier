lean:
  module: FormalConjectures.ErdosProblems.«81»
  decl: Erdos81.erdos_81
  statement: |-
    theorem erdos_81 :
        ∃ C : ℝ, ∀ n : ℕ, ∀ G : SimpleGraph (Fin n), G.IsChordal →
          ∃ P : Finset (Finset (Fin n)), G.IsCliqueEdgePartition P ∧
            (P.card : ℝ) ≤ (n : ℝ) ^ 2 / 6 + C * n
  context:
    - open Erdos81
    - open SimpleGraph
  definitions: []
