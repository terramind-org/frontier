title: Kourovka Notebook Problem 6.26
field: mathematics
tier: prose
statement: |-
  Let $D$ be a normal set of involutions in a finite group $G$ and
  let $\Gamma (D)$ be the graph with vertex set $D$ and edge set $\{
  (a,b)\mid a,b \in D,\; ab=ba \ne 1\} $. Describe the finite groups
  $G$ with non-connected graph $\Gamma (D)$.
