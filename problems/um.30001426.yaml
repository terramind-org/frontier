title: Directed Disjoint Paths in Restricted Digraph Classes
field: mathematics
tier: prose
statement: For which restricted classes of digraphs can the fixed-$k$ edge-disjoint paths problem be solved in polynomial time? Here the input is a digraph $G$ and $k$ terminal pairs, and the task is to decide whether mutually edge-disjoint directed paths connect each pair.
