  \section{\texorpdfstring{Almost-Everywhere Fourier Convergence in $L^{1}$}{Almost-Everywhere Fourier Convergence in L\textasciicircum{}1}}\label{30002499}
  {\small UnsolvedMath ID 30002499 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Characterize the functions $f\in L^1(\mathbb T)$, for $\mathbb T=\mathbb R/\mathbb Z$, whose Fourier series converges almost everywhere.
  \par\smallskip\textit{Formulation references:} \sref{30002499}{1}, \sref{30002499}{2}.
  \subsection{Short English statement}
