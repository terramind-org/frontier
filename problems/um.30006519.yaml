statement: Writing $C(0)$ for the component of the origin in the infinite-noodle model, is $C(0)$ almost surely finite? Does its size satisfy $\mathbb{P}(|C(0)|\geq k)=k^{-(2\sqrt{2}-1)/7+o(1)}$?
