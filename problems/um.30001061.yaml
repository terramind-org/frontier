title: Linear Edge Bounds for $k$-Quasiplanar Graphs
field: mathematics
tier: prose
statement: A $k$-quasiplanar topological graph is a graph drawn in the plane with no $k$ pairwise crossing edges. For every fixed integer $k>4$, does every $k$-quasiplanar topological graph with $n$ vertices have $O(n)$ edges?
