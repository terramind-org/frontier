id: um.30002358
title: Possible Values of Characteristic-Two Quadratic-Form Invariants
field: mathematics
tier: prose
statement: |-
  Let $F$ be a field of characteristic $2$, let $Q'(F)$ be the set of anisotropic quadratic forms over $F$ that are not totally singular, and let $\operatorname{rdim}(\varphi)$ and $\operatorname{ql}(\varphi)$ denote the regular dimension and quasilinear part of $\varphi$. Determine the possible values of

  $$\widetilde u(F)=\sup_{\varphi\in Q'(F)}\dim\varphi,$$

  $$u_r(F)=\sup\{\dim\varphi:\varphi\in Q'(F),\ \operatorname{rdim}(\varphi)=2r\},$$

  and $\widetilde u_s(F)=\sup\{\dim\varphi:\varphi\in Q'(F),\ \dim\operatorname{ql}(\varphi)=s\}$, for integers $r,s\geq 1$.
