title: Favard length and an exact tube formula for the four-corner Cantor set
field: mathematics
tier: prose
statement: |-
  **Problem 4.11 (Brought by B. Green, implicit in a paper of Solomyak and Peres).** Give an estimate for the size of the \(\delta\)-thickened Kahane Besicovich set \(C_4\times C_4\), where
  \[
  C_4=\left\{\sum_{n=0}^{\infty}\frac{a_n}{4^n}:a_n\in\{0,1\}\right\}.
  \]
