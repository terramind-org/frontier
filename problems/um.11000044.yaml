title: Conjecture 4.6 — LetS be any surface with d(S)≥ 1.
field: mathematics
tier: prose
statement: "LetS be any surface with d(S)≥ 1. Then M does not admit a finite volume Riemannian metric of (uniformly bounded) positive scalar curvature in the quasi-isometry class of the Teichm¨ uller metric. The analogue of Conjecture 4.6 in the Γ \\G/K case was proven by S. Chang in [ Ch]. The same method of proof as in [ Ch] should reduce Conjecture 4.6 to the following discussion, which seems to be of independent interest, and which came out of discussions with H. Masur. What does Mg, endowed with the Teichm¨ uller metric dTeich, look like from far away? This can be formalized by Gromov’s notion of tangent cone at infinity: Cone(Mg):= lim n→∞ (Mg, 1 ndTeich) (10) where the limit is taken in the sense of Gromov-Hausdorﬀ convergence of pointed metric spaces; here we have fixed a basepoint in Mg once and for all. This limit is easily shown to make sense and exist in our context. To state our conjectural answer as to what Cone( Mg) looks like, we will 2. Some problems on mapping class groups and moduli space 33 need the complex of curves on Σ g. Recall that the complex of curves Cg forg≥ 2 is the simplicial complex with one vertex for each nontrivial, nonperipheral isotopy class of simple closed curves on Σ g, and with a k-simplex for every ( k + 1)-tuple of such isotopy classes for which there are mutually disjoint representatives. Note that Mod g acts by simplicial automorphisms on Cg."
