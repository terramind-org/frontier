statement: Let $A$ be a finite zero-one matrix. If $\operatorname{QAut}(A)\neq\operatorname{Aut}(A)$, does the limiting quantum isometry group $G_A^\infty$ contain $\operatorname{QAut}(A)$ as a quantum subgroup?
