title: Problem 4.6 — Compute H • ∞(T c 3 ).
field: mathematics
tier: prose
statement: Compute H • ∞(T c 3 ). The homology of T c g is related to that of Tg via the Gysin sequence. In order to apply it, one needs to understand the topology of the divisor T c,red g. This is built up out of products of lower genus Torelli spaces of compact type. The combinatorics of the divisor is given by the complex Ksep(S)/Tg.
