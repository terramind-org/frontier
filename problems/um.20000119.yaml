title: Wild-degree supersingular Klein-loop hypersurfaces
field: mathematics
tier: prose
statement: |-
  **Problem 9.2.** Is there a supersingular hypersurface of every degree, dimension and char. \(p\)?

  Fix \(n,d,q\). How many supersingular hypersurfaces
  \(X\subset \mathbf P^n\) exist of degree \(d\) over \(\mathbf F_q\)? In
  particular, does such a hypersurface exist for every degree, dimension, and
  characteristic?
