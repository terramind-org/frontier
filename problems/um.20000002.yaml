title: "Frobenius on the affine node: a bimodule ladder and mirror obstruction"
field: mathematics
tier: prose
statement: |-
  Given a singular variety in char. p, $X$, $\mathcal F:=Frobenius$, then $\mathcal F^{>>0}(Perf(X))=Coh(X)$ (as dg enhanced categories of complexes) [B-I-L-M-P].

  Can we see the mirror to this fact explicitly in case e.g. of mirrors to $X=\{xy=0\}\subset \mathbb A_{\mathbb F_p}$? More generally, what is the symplectic mirror to Frobenius for each $p$?
