title: Density degrees under finite covers
field: mathematics
tier: prose
statement: |-
  Given a finite map \(f:X\to Y\) (over a number field), how are \(\delta(X/k)\) and \(\delta(Y/k)\) related? Are there examples showing that the obvious relations are sharp?

  It could be interesting to consider the special case where \(f\) is a Galois cover. If \(X,Y\) are curves, you can also ask about containment relations between there \(\delta_{\mathbb P^1}\)'s and their \(\delta_{\operatorname{AV}}\)'s.
