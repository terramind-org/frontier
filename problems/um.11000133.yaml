title: Problem 3 — Give a useful (piecewise) tropical description of the two elementary transformations.
field: mathematics
tier: prose
statement: Give a useful (piecewise) tropical description of the two elementary transformations. One thus immediately derives a (piecewise) tropical polynomial representation of the mapping class groups. What properties does it have, for instance under iteration? As alternative coordinates, [9] describes a family of curves whose intersection numbers alone coordinatize measured foliations of compact support (but there are relations), and presumably these intersection numbers could be computed using Theorem 3. We also wonder what are further applications or consequences of all these formulas.
