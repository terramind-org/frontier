title: Elliptic scrolls with Hasse failure and ratio tending to one half
field: mathematics
tier: prose
statement: |-
  Can one construct smooth projective varieties \(X_k\subset \mathbf P^k_{\mathbf Q}\) such that \(X_k(\mathbf Q_v)\ne\varnothing\) for every place \(v\), \(X_k(\mathbf Q)=\varnothing\), and
  \[
     \frac{\dim X_k}{\deg X_k}
  \]
  is unbounded?
