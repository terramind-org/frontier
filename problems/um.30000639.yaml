title: Fourier–Mukai Kernels from Polyhedral Divisors
field: mathematics
tier: prose
statement: Let $K$ be an algebraically closed field of characteristic zero, let $T$ be a torus with character lattice $M$ and cocharacter lattice $N$, and let $\mathcal D=\sum_i\Delta_i\otimes D_i$ be a polyhedral divisor on a normal semiprojective $K$-variety $Y$, with tail cone $\sigma$. Put $\Delta=\sum_i\Delta_i$ and $Z=\operatorname{TV}(N(\Delta),M)$. Each $\Delta_i$ determines a semiample divisor $E_i$ on $Z$, so regard $\mathcal D$ also as $\sum_iE_i\otimes D_i$. For $u\in\sigma^\vee\cap M$, view $u$ as the corresponding germ of a curve $u:(\mathbb{A}^1_K,0)\to Z$ and let $u_*\mathcal O_{\mathbb{A}^1_K,0}$ denote the direct image of its structure sheaf. Set $\mathcal U=\bigoplus_{u\in\sigma^\vee\cap M}u_*\mathcal O_{\mathbb{A}^1_K,0}$. Does $\mathcal D$ induce an object $\mathcal K_{\mathcal D}\in D^b(Y\times Z)$ such that the graded sheaf $\mathcal O_Y(\mathcal D)=\bigoplus_{u\in\sigma^\vee\cap M}\mathcal O_Y(\mathcal D(u))$ is the Fourier–Mukai transform of $\mathcal U\in D^b(Z)$ with kernel $\mathcal K_{\mathcal D}$?
