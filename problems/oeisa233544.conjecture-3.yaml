id: oeisa233544.conjecture-3
title: Representations $n = k^2 + m$ ($0 < k^2 \le m$) with $\sigma(k^2) + \phi(m)$ prime (conjecture_3)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): Any integer $n > 1$ can be written as $k + m$ with $k > 0$ and $m > 0$
  such that $\sigma(k) + \phi(m)^2$ is prime.
  - _Zhi-Wei Sun_
