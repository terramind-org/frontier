title: Target-local maximal-minor certificates for spherical parity sheaves
field: mathematics
tier: prose
statement: Given a dominant coweight $\lambda$ and a prime $p$, compute the normalized indecomposable spherical parity complex $\mathcal E_\lambda^{(p)}$ on $Gr$, and, when it is perverse, regard it as an object of $\operatorname{Perv}_{\mathrm{sph}}(Gr,\mathbb F_p)$. Can its graded stalk/costalk character be computed more efficiently than by constructing a large portion of the spherical $p$-canonical basis?
