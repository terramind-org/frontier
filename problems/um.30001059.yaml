title: Determinant Concentration for Heterogeneous Bernoulli Matrices
field: mathematics
tier: prose
statement: Let $A$ be a random $n\times n$ matrix with entries $c_{ij}\xi_{ij}$, where $1\leq c_{ij}\leq C=O(1)$ and the $\xi_{ij}$ are independent Bernoulli signs. The known estimate is $|\det A|=\mathbb{E}|\det A|\exp(O(n^{2/3}))$ almost surely. Can the exponential factor be replaced by a polynomial factor $n^{O(1)}$?
