title: Open Problems and Questions about Geodesics — Question 14
field: mathematics
tier: prose
statement: |-
  Again it is not difficult to use the uniformization theorem to show that the answer is affirmative in dimension 2.
  But the problem is still open even in dimension 3. See [Cro-Sch1986], [Lebedeva2002] and [Iva-Kap2014] for results of the nature that the fundamental groups of manifolds with no conjugate points share properties with those of non-positive curvature. Section 8 of [Iva-Kap2014] contains a number of open problems of which we mention:

  *Is the fundamental group of a closed manifold without conjugate points semihyperbolic?*
