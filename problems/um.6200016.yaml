title: Boundaries of Groups and Kleinian Groups — Problem 16
field: mathematics
tier: prose
statement: Let Z be a compactum which is a Z-boundary of a group G. Then Z is never a Boltyansky compactum. In the special case when Z is an Markov compactum, so that all building blocks Kσ → σ are isomorphic, it was proven in [29] that Z cannot be a Boltyansky compactum.
