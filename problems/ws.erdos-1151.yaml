title: "Erdős Problem #1151"
field: mathematics
tier: prose
statement: Let $L_nf$ be the polynomial of degree at most $n-1$ interpolating a continuous real function $f$ at the $n$ Chebyshev nodes in $[-1,1]$. For a prescribed closed set $A\subseteq[-1,1]$, can one choose $f$ so that the set of subsequential limits of the values $L_nf(x)$ is precisely $A$?
