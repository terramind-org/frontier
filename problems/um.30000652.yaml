title: Automorphisms of Rational Surfaces with Antipluricanonical Curves
field: mathematics
tier: prose
statement: Let $X$ be a smooth projective complex rational surface. If $\operatorname{Aut}^*(X)=\operatorname{Im}(\operatorname{Aut}(X)\to\operatorname{Aut}(\operatorname{Pic}(X)))$ is infinite, does there exist a birational morphism $X\to Y$ such that $Y$ has an antipluricanonical curve and an infinite subgroup of $\operatorname{Aut}^*(Y)$ lifts to $X$?
