title: Kourovka Notebook Problem 13.12
field: mathematics
tier: prose
statement: |-
  Is the group of all automorphisms of an
  arbitrary hyperbolic group finitely presented?

  *Comment of 2001:* This is proved for the
  group of automorphisms of a torsion-free hyperbolic group that
  cannot be decomposed into a free product (Z. Sela, *Geom.
  Funct. Anal.*, **7**, no. 3 (1997) 561--593).
