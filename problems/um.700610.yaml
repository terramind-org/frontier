title: Kourovka Notebook Problem 9.77
field: mathematics
tier: prose
statement: |-
  Does there exist an infinite finitely generated
  residually finite binary finite group all of whose Sylow subgroups
  are finite? A. V. Rozhkov (Dr. of Sci. Disser., 1997) showed that
  such a group does exist if the condition of finiteness of the
  Sylow subgroups is weakened to local finiteness.
