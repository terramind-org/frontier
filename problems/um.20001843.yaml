title: A radial Ricci accumulation criterion for bounded scalar curvature
field: mathematics
tier: prose
statement: |-
  **Recovered question.** If $(M^4,g,f)$ is a smooth, connected, complete four-real-dimensional gradient shrinking Ricci soliton
  \[
  \operatorname{Ric}+\nabla^2f=\frac12g,
  \]
  must its scalar curvature satisfy $\sup_M R<\infty$?
