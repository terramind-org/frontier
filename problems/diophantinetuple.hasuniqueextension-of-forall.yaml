lean:
  module: FormalConjectures.Wikipedia.DiophantineTuple
  decl: DiophantineTuple.hasUniqueExtension_of_forall
  statement: "theorem hasUniqueExtension_of_forall : HasUniqueExtensionOfForall"
  context:
    - open DiophantineTuple
    - "variable {R : Type*} [Semiring R]"
  definitions:
    - name: DiophantineTuple.HasUniqueExtensionOfForall
      kind: abbrev
      text: |-
        /--
        The statement that every integral Diophantine triple of three distinct elements has a unique
        extension by a larger element.
        -/
        abbrev HasUniqueExtensionOfForall :=
          ∀ a b c : ℕ, ({a, b, c} : Finset ℕ).card = 3 → IsIntegralDiophantineTuple {a, b, c} →
            HasUniqueExtension a b c
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/Wikipedia/DiophantineTuple.lean#L169
