title: Kourovka Notebook Problem 14.30
field: mathematics
tier: prose
statement: |-
  Let $\mathrm{lFit}{\mathfrak{X}}$ be the local Fitting
  class generated by a set of groups ${\mathfrak{X}}$ and let $\Psi (G)$
  be the smallest normal subgroup of a finite group $G$ such that
  $\mathrm{lFit}(\Psi (G)\cap M)=\mathrm{lFit}M$ for every
  $M\mbox{$\lhd\lhd$} G$ (K. Doerk, P. Hauck, *Arch. Math.*,
  **35**, no. 3 (1980), 218--227). We say that a Fitting class
  ${\mathfrak{F}}$ is *saturated* if $\Psi (G)\in {\mathfrak{F}}$
  implies that $G\in {\mathfrak{F}}$. Is it true that every non-empty
  soluble saturated Fitting class is local?
