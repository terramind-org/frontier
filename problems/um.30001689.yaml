title: Group Effects in Shape and Deformation Data
field: mathematics
tier: prose
statement: Given $N$ subjects in two or more groups, each represented by an image or shape, are the shapes group-dependent, and if so, where are they most affected? Given baseline images $B_i$ and follow-up images $F_i$ for each subject, is the deformation from $B_i$ to $F_i$ group-dependent, and if so, where?
