id: um.30001042
title: Bilipschitz Group Equivalences and 3-Manifold Hyperbolicity
field: mathematics
tier: prose
statement: For every finitely generated group $G$, is there a bi-Lipschitz bijection $G\to G\times\mathbb{Z}^2$? If $G_1\subset G$ has finite index, is there a bi-Lipschitz bijection $G_1\to G$? For two uniform lattices $L_1,L_2$ in the same Lie group, is there a bi-Lipschitz bijection $L_1\to L_2$? Finally, if a compact three-manifold $M$ admits a partially hyperbolic diffeomorphism with one-dimensional stable, center, and unstable bundles, what restrictions does this impose on the topology of $M$?
