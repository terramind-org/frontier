title: Slice-Genus Bounds for Homogeneous Braid Quasimorphisms
field: mathematics
tier: prose
statement: For every homogeneous quasimorphism $f:B_n\to\mathbb R$, do constants $A,C\in\mathbb R$ exist such that $|f(\beta)|\leq A\chi_4(\widehat\beta)+C$ for every braid $\beta\in B_n$?
