title: Tensor-Factorization Uniqueness for SAW$^*$-Algebras
field: mathematics
tier: prose
statement: Let $A_i$ for $i<m$ and $B_j$ for $j<n$ be SAW$^*$-algebras such that $\bigotimes_{i<m}A_i\cong\bigotimes_{j<n}B_j$. Must $m=n$, and, after permuting the factors, must $A_i$ be stably isomorphic to $B_i$ for every $i$? In particular, for the Calkin algebra $\mathcal{Q}(H)$, is $\mathcal{Q}(H)\otimes\mathcal{Q}(H)$ isomorphic to $\mathcal{Q}(H)\otimes\mathcal{Q}(H)\otimes\mathcal{Q}(H)$?
