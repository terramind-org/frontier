title: Open Problems and Questions about Geodesics — Question 13
field: mathematics
tier: prose
statement: |-
  Several examples of manifolds that admit metrics of non-positive curvature but cannot support a metric of negative curvature (or with Anosov geodesic flow) can be found in the introduction to [Ba-Br-Eb1985]. These examples have a copy of ${\mathbb{Z}} \times {\mathbb{Z}}$ in their fundamental group. The simplest of them is due to Heintze who took two cusped hyperbolic 3-manifolds, cut off the cusps, glued the two pieces together along their boundary tori and then smoothed out the metric to obtain a manifold with
  non-positive curvature.

  *If $(M,g)$ has no conjugate points, does $M$ carry a metric
  with non-positive sectional curvature?*
