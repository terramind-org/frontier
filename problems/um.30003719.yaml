title: Nested Principal Components from Manifold Covariance Fields
field: mathematics
tier: prose
statement: For PCA and classification on manifolds using covariance tensor fields, formulate a backward nested procedure and characterize when it agrees with the forward procedure. Determine when PCA or classification is appropriate under substantial curvature and whether a multiscale theory analogous to linear PCA exists.
