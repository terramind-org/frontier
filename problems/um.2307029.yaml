title: Research Problems in Function Theory — Problem 7.29
field: mathematics
tier: prose
statement: Let $f(z)$ be continuous on $\mathbb{D}$, and let $\alpha$ be a fixed number with $0 < \alpha \leq 1$. If, for each $z$ in $\{|z|< 1\}$, \[\int_{|\zeta-z|<\alpha(1-|z|)}f(\zeta)\,d\zeta=0,\] is $f$ necessarily analytic in $\mathbb{D}$? What happens if we are given that $f$ is continuous only in $\mathbb{D}$? (L. Zalcman)
