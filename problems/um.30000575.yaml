title: Simultaneous Orbit Vanishing and Scalar Hypercyclicity
field: mathematics
tier: prose
statement: If $T$ is an operator on a Hilbert space with $\inf_n\lVert T^nx\rVert=0$ for every $x$, must $\inf_n(\lVert T^nu\rVert+\lVert T^nv\rVert)=0$ for all $u,v$? If both $T$ and $3T$ are hypercyclic, is $2T$ hypercyclic? Does the first condition imply that $T$ is hypercyclic?
