statement: |-
  \section*{Partition and mean-length exponents for macroscopic triangular honeycomb chords}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For the source critical boundary-to-boundary chord ensemble in an equilateral pure-cut honeycomb triangle of scale R, restricted to diameter at least R/100, is its partition mass comparable to $R^{3/4}$ and its expected visited length $R^(4/3+o(1))$? Ask also for the same mean exponent for ordinary center-to-center critical-weight walks with endpoints on the inner boundary layer.
  \subsection{Short English statement}
  For the source critical boundary-to-boundary chord ensemble in an equilateral pure-cut honeycomb triangle of scale R, restricted to diameter at least R/100, is its partition mass comparable to $R^{3/4}$ and its expected visited length $R^(4/3+o(1))$? Ask also for the same mean exponent for ordinary center-to-center critical-weight walks with endpoints on the inner boundary layer.
