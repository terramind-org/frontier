  \item[S2] Shapiro - Problems Around Polynomials: The Good, The Bad and The Ugly (2015), source-order item 11 (Problem 5 as printed). 
  \url{https://arxiv.org/abs/1503.05295}.
  \item[S3] V. P. Kostov, Three realization problems about univariate polynomials, 2026.
  \url{https://arxiv.org/abs/2601.10529}.
  \end{itemize}
