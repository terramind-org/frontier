title: Single generation beyond Z-stability
field: mathematics
tier: prose
statement: |-
  A C*-algebra is called singly generated if it contains an element that is not contained in any proper sub-C*-algebra.
  A C*-algebra is called \(\mathcal{Z}\)-stable if it absorbs the Jiang-Su algebra tensorially.

  Which separable, unital, simple C*-algebras are singly generated? Is there a simple, nuclear C*-algebra that is singly generated, yet is not \(\mathcal{Z}\)-stable? Is single generation connected to the regularity properties coming up in the classification of nuclear, simple C*-algebras?
