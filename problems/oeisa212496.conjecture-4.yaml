      text: |-
        /-- Auxiliary sequence $b(n) = \sum_{k=1}^n \frac{(-1)^{k - \Omega(k)}}{k}$. -/
        def b (n : ℕ) : ℚ :=
          ∑ k ∈ Finset.Icc 1 n, (if (k + Ω k) % 2 = 0 then (1 : ℚ) else -1) / (k : ℚ)
