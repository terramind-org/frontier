title: Virtual-knot problem 25 — Rotational virtual knot theory introduced in is virtual knot theory without the first virtual move (thus one does not…
field: mathematics
tier: prose
statement: |-
  Rotational virtual knot theory introduced in is virtual
  knot theory without the first virtual move (thus one does not allow
  the addition or deletion of a virtual curl). This version of virtual
  knot theory is significant because all quantum link invariants
  originally defined for classical links extend to rotational virtual
  knot theory. This theory has begun to be
  explored and deserves further exploration. We
  have formulated a version of the bracket polynomial for rotational
  virtuals that assigns variables according to the absolute value of
  the Whitney degree of state curves. See Figure the cited item for
  examples of non-trivial rotational virtual links.

  The rotational bracket can be generalised in the fashion
  of the Arrow Polynomial. Beyond this there are all the quantum link
  invariants and how they behave on rotational virtuals. We are in the
  process of writing a new paper on rotational virtual knot theory. A
  natural class of invariants for rotational virtuals arises as
  quantum invariants associated with finite dimensional
  quasi-triangular Hopf algebras. This harks back to an early
  project that needs further articulation.
  In that work with Radford we articulate invariants that immediately
  generalize to invariants of rotational virtual knots. These
  invariants are defined via integrals on finite dimensional Hopf
  algebras and should be studied for their own sake. We would also
  like to know about the possibility of categorification of finite
  dimensional Hopf algebras and, in particular, the meaning of
  categorifying a right integral.
