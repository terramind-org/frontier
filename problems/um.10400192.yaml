statement: (M. Polyak, see [153, “Theorem 4”]) Let F be an oriented compact surface. Two homology cylinders C and C ′ over F are Yd -equivalent if and only if v(C) = v(C ′) for any A-valued finite type invariant v ofF Y ⋆ -degree < d for any abelian group A.
