statement: In one of Bob Thomason's last papers, he determined the thick subcategories of finite objects in the derived category of a scheme. For the derived category of a ring R, they are in 1-1 correspendence with unions of closed sets X_i in Spec R such that Spec R - X_i is quasi-compact. How about localizing subcategories? What about applying his ideas to more general non-Noetherian stable homotopy categories?
