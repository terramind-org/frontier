  \section*{Complex matrix multiplication at exponent nine-fourths}\label{30007449}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Can square complex matrices be multiplied in $O_\varepsilon (n^{9/4+\varepsilon })$ arithmetic operations for every fixed $\varepsilon >0$, equivalently is the complex matrix-multiplication exponent at most 9/4?
  \subsection{Short English statement}
  Can square complex matrices be multiplied in $O_\varepsilon (n^{9/4+\varepsilon })$ arithmetic operations for every fixed $\varepsilon >0$, equivalently is the complex matrix-multiplication exponent at most 9/4?
