title: Local and Edgewise Reed Bounds
field: mathematics
tier: prose
statement: |-
  Conjecturally, every graph $G$ satisfies both

  $$\chi(G)\leq\max_{v\in V(G)}\left\lceil\frac12\bigl(d(v)+1+\omega(G[\widetilde N(v)])\bigr)\right\rceil$$

  and

  $$\chi(G)\leq\max_{uv\in E(G)}\left\lceil\frac12\bigl(\gamma_\ell(u)+\gamma_\ell(v)\bigr)\right\rceil,$$

  where $\gamma_\ell(v)=\frac12\bigl(d(v)+1+\omega(G[\widetilde N(v)])\bigr)$.
