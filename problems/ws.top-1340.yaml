  % UnsolvedMath ID 1340; source catalogue code DYN-004
  \setcounter{section}{1339}
  \section{Birkhoff Conjecture}\label{1340}
  {\small UnsolvedMath ID 1340 · Partial Differential Equations}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  In a smooth strictly convex planar billiard table, particles move along straight lines and reflect with equal incidence and reflection angles. If the billiard dynamics is completely integrable, must the boundary of the table be an ellipse?
  \par\smallskip\textit{Formulation references:} \sref{1340}{1}, \sref{1340}{2}.
