title: Signed-cycle traces and the full B2 diagonal coinvariant module
field: mathematics
tier: prose
statement: |-
  **Problem 2.2 (C. Kriloff and V. Reiner), recovered.** This is a possible systematic approach to Problem 2.1. As mentioned, in type \(A\) with \(k=1\), the numbers (1) correspond (up to a power of \(q\), and specialized at \(t=1/q\)) with the \(q,t\)-Catalan numbers of Garsia and Haiman, which are given by the \(q,t\)-bigraded Hilbert series for the sign-isotypic component of the ring of diagonal harmonics
  \[
  \mathbb C[V\oplus V^*]/\langle \mathbb C[V\oplus V^*]^W_+\rangle.
  \]
  Can this situation be generalized to other \(W\)? When \(W\) is a symmetric group \(A_{n-1}\), it is known that the action of \(W\) on the (ungraded) diagonal harmonics has the same irreducible decomposition as the action of \(W\) on the “finite torus” \(Q/(h+1)Q\), where \(Q\) is the root lattice. Mark Haiman noted this does not hold in type \(B\). However, Iain Gordon has shown that it is possible to take a further quotient which does give the desired combinatorics.
