title: Corner Peeling in Cubical Subcomplexes of Integer Three-Space
field: mathematics
tier: prose
statement: Let $G$ be a finite connected subgraph of $\mathbb{Z}^3$, and let $X(G)$ be the cubical complex containing exactly those squares and three-cubes whose vertices and edges all belong to $G$. Assume that $X(G)$ is simply connected and that every connected component of the intersection of $X(G)$ with a coordinate hyperplane is simply connected. Must $G$ admit a corner peeling, that is, an ordering $v_1,\ldots,v_n$ in which $v_i$ belongs to a unique maximal cell of the subcomplex induced by $v_1,\ldots,v_i$?
