title: Conjecture 4.2 — ( Mg is maximal).
field: mathematics
tier: prose
statement: ( Mg is maximal). For g ≥ 3 the smooth orbifold Mg does not finitely orbifold-cover any other smooth orbifold. A much stronger statement, which may be true, would be to prove that if N is any finite cover ofMg, then the only orbifolds which N can orbifold cover are just the covers of Mg. Here is a related basic topology question about Mg.
