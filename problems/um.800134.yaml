title: Comparative Prime Number Theory — Problem 3
field: mathematics
tier: prose
statement: |-
  One needs to be careful with higher-degree $L$-functions since there are known barriers to LI, such as: the factorization of Dedekind $\zeta$-functions and Artin $L$-functions into other $L$-functions; the vanishing of elliptic curve $L$-functions at the central point; and the ability to shift an entire $L$-function vertically if we don't restrict to the central character.

  - (Alexandre Bailleul, Université Paris--Saclay) As a concrete instance of the above problem:

  Show that $\gamma_1$ is irrational.

  - (Nicol Leong, University of New South Wales--Canberra at ADFA)
