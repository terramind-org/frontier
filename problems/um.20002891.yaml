title: Explicit interior jet bounds for proper rational ball maps
field: mathematics
tier: prose
statement: |-
  **Problem 9 (Bernhard Lamel).** Suppose that
  \(R,\widetilde R:\mathbb B^n\to\mathbb B^N\) are proper rational mappings. Find the
  smallest integer \(r\) such that
  \[
  j_0^rR=j_0^r\widetilde R \quad\Longrightarrow\quad R=\widetilde R.
  \]
  Ask the same question when \(R,\widetilde R\) are merely proper, rather than rational.
