title: "Fibers of integral moduli spaces: tame compatibility and a wild obstruction"
field: mathematics
tier: prose
statement: |-
  **Problem 1.6. (Kollár)** Consider the moduli space of canonically polarized
  surfaces over \(\operatorname{Spec}\mathbb Z\). Is the fiber over the prime
  \(p\) the moduli space of surfaces over \(\mathbb F_p\)? A similar result for
  \(M_g\) may be due to Oort. What about other moduli problems? \(A_g\)? K3
  surfaces?

  **1.4. Other moduli problems.** An article of Schumacher and Tsuji ...
