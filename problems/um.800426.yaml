title: Open Problems in Arithmetic Dynamics — Conjecture 49
field: mathematics
tier: prose
statement: |-
  Let $f(x)\in\mathbb{Z}[x]$ be a polynomial of degree at least $2$, and
  let $\alpha\in\mathbb{Z}$ be a wandering point for $f$. Then $\mathcal{O}_f(\alpha)$
  contains only finitely many primes.
