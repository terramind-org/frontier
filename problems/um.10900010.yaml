title: 3.2 (Agol) — A minimal-Thurston-norm surface from a tree action
field: mathematics
tier: prose
statement: Let $M$ be a $3$-manifold whose fundamental group acts on a simplicial tree without global fixed points. In the covering space associated to an edge stabilizer, there is a unique $2$-dimensional homology class separating the two ends corresponding to the two ends of the tree minus that edge. Is there a surface in this class, of minimal Thurston norm, that embeds in $M$?
