      kind: def
      text: |-
        /-- The growth exponent `c(p, q) = liminf_{n → ∞} (log H(n)) / (log n)`. -/
        noncomputable def c (p q : ℕ) : ℝ :=
          liminf (fun n : ℕ => Real.log (H p q n) / Real.log n) atTop
