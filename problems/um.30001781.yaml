id: um.30001781
title: Maximal Submatrix Bounds Without Unconditionality
field: mathematics
tier: prose
statement: Let $X_1,\ldots,X_n$ be independent isotropic log-concave random vectors in $\mathbb{R}^N$, and let $A$ be the matrix with rows $X_i$. Define $A_{k,m}=\sup\{\|A(J,I):\ell_2^m\to\ell_2^k\|:|J|=k,\ |I|=m\}$. Does the high-probability bound $A_{k,m}\lesssim\sqrt{m\log(3N/m)}+\sqrt{k\log(3n/k)}$ hold without assuming that the vectors are unconditional?
