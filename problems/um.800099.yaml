title: Foliations and Diffeomorphism Groups — Question 40
field: mathematics
tier: prose
statement: |-
  Since our knowledge of the commuting diffeomorphisms of the circle has deepened by the works of Navas, Eynard-Bontemps and others, I would like to pose the following question again 40 years after my paper.

  For commuting diffeomorphisms $f$ and $g$ of $**S**^1$, to what extent we can say that
  the 2 cycle $(f,g)-(g,f)$ of $B\mathrm{Diff}(**S**^1)^\delta$ is a boundary ?
