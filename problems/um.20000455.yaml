id: um.20000455
title: A fixed-real-subfield criterion for a complex archimedean ball
field: mathematics
tier: prose
statement: |-
  Let \(k\) be a number field, \(k\not\subset\mathbb R\). Construct an algebraic
  set \(S\subset k^n\) for some \(n\) such that the projection onto one of the
  coordinates is exactly the set of elements of \(k\) with \(|k|\leq 1\) for
  some (archimedean) absolute value \(|\,\cdot\,|\) of \(k\).
