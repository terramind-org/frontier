title: Problem 2 — Show that the inclusion of Proposition 5 is a bijection.
field: mathematics
tier: prose
statement: Show that the inclusion of Proposition 5 is a bijection. This will probably require more thought about the analytical and geometric constructions which underpin the theory. Another question is suggested by the Auroux-Katzarkov doubling formula. Suppose we know one element fk0 of an asymptotic sequence. Can we describe fl for other values of l apart from l = 2 rk0? Or perhaps better
