title: Problem 7.5 — (Shortest Teichm¨ uller loop in a stratum).
field: mathematics
tier: prose
statement: "(Shortest Teichm¨ uller loop in a stratum). For each fixed g≥ 2, and for each r-tuple as above, give upper and lower bounds for λg(k1,...,k r):= inf {logλ(f ): f∈ Modg whose stable foliation has data (k1,...,k r)} This problem is asking for bounds for the shortest Teichm¨ uller loop lying in a given substratum in moduli space (i.e. the projection in Mg of the corresponding substratum in the cotangent bundle). L(Modg) = min {λg(k1,...,k r)} where the min is taken of all possible singularity data."
