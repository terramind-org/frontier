  \item[\hypertarget{source:statement:2}{S2}] Zhipeng Deng, Universal Triangle Covering Curve and Polygonal Chain: Escaping Forest and Fitting Worm (2026), v2; arXiv:2608.01393. \url{https://arxiv.org/pdf/2608.01393}.
