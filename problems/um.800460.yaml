title: Spaces with Lower Ricci Curvature — Conjecture 4
field: mathematics
tier: prose
statement: |-
  Let $\big(M^n_i,g_i,p_i\big)\to (X,d,p)$ satisfy $\mathrm{Ric} \geq -\lambda$ and $\mathrm{Vol}(B_1(p_i))>v>0$, then $\mathcal{S}^k$ is contained in a union of $k$-dimensional submanifolds. More precisely, there exist a countable collection of bi-H\"older maps $\varphi_i\colon B_1\big(0^k\big)\to M$ such that if $\hat \mathcal{S}^k(X)\equiv \bigcup_i \varphi_i\big(B_1\big(0^k\big)\big)$ then

  \itemsep=0pt

  $1)$ $\mathcal{S}^k(X)\subseteq \hat \mathcal{S}^k(X)$,

  $2)$ for each $x\in \hat \mathcal{S}^k(X)$ we have that every tangent cone is at least $k$-symmetric.
