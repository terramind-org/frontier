title: Exceptional Points in Favourite Distance Digraphs
field: mathematics
tier: prose
statement: Given a finite point set $S \subset \mathbb{R}^3$ and a assignment of a 'favourite distance' $d(p) > 0$ to each point $p \in S$, form the directed graph whose edges are $(p, q)$ with $|p - q| = d(p)$. In the extremal characterization of maximum-outdegree favourite-distance digraphs in $\mathbb{R}^3$ (Swanepoel), let $T \subset S$ be the exceptional set of at most two vertices not lying on the canonical concentric spheres/circles. Is the exceptional set $T$ always empty?
