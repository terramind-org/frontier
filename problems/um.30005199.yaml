title: Necessity of Z-Stability in KK-Uniqueness
field: mathematics
tier: prose
statement: Let $C,D,E$ be separable $C^*$-algebras, with $D$ a closed two-sided ideal of $E$, and let $\Phi,\Psi:C\to E$ be relatively absorbing homomorphisms agreeing modulo $D$. Can the $\mathcal Z$-stability assumption on $E$ be removed from the equivalence between $[\Phi,\Psi]_{KK}=0$ and asymptotic unitary equivalence through unitaries in $\widetilde D$?
