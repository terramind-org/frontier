title: Depth-Controlled Relative Local Character Expansions
field: mathematics
tier: prose
statement: Let a reductive group $H$ over $F$ act on $V$, let $\mathcal N_V$ be its nilpotent cone, and let $V_{r+}$ be the Moy–Prasad neighborhood. For an $H$-distinguished representation $\pi$ of depth $r$, is the relative local character expansion valid on $V_{r+}$? Equivalently, does $$\operatorname{res}_{D(V)_{r+}}\widetilde J(V)_{r+}=\operatorname{res}_{D(V)_{r+}}J(\mathcal N_V)$$ hold for every real $r$?
