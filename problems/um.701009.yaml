title: Kourovka Notebook Problem 14.24
field: mathematics
tier: prose
statement: |-
  Let $\mathrm{Aut }F_n$ be the automorphism group
  of a free group of rank $n$ with norm $|\! |\cdot |\! |$ as in
  14.23. Does there exist a recursive function
  $f: {\mathbb{N} \times {\mathbb{N} \rightarrow {\mathbb{N}$ with the following property:
  for any two conjugate elements
  $\alpha,\beta\in \mathrm{Aut }F_n$ there is an element $\gamma \in \mathrm{Aut }F_n$ such that $\gamma ^{-1}\alpha \gamma =\beta$ and $|\!
  |\gamma |\! |\leq f(|\! |\alpha |\! |,|\! |\beta |\! |)$?
