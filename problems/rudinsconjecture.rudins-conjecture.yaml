id: rudinsconjecture.rudins-conjecture
title: Rudin's conjecture on squares in arithmetic progressions (rudins_conjecture)
field: mathematics
tier: proof
statement: |-
  **Rudin's conjecture.** The maximal number of squares among the first $N$ terms of a non-trivial
  arithmetic progression grows at most like $\sqrt{N}$:
  $$Q(N) = O(\sqrt{N}).$$
