title: Square-Free Initial Ideals of Linear Determinantal Ideals
field: mathematics
tier: prose
statement: For every choice of the coefficients $a_{ijk}$ and every term order $<$ on $K[t_{ij}]$, the initial ideal of $I_2(L)$ should be square-free in the $\mathbb{Z}^m$-graded sense; that is, it should be generated by monomials $t_{i_1j_1}\cdots t_{i_kj_k}$ with $i_1<i_2<\cdots<i_k$. Does the same statement hold for every distributive lattice?
