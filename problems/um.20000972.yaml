title: A fixed Laplacian quotient and hereditary firing staircases
field: mathematics
tier: prose
statement: Acyclic orientations of a graph \(G\) are the regions of its graphic arrangement. The equivalence relation generated by converting a source into a sink encodes chip-firing on a special class of divisors, and its classes are represented geometrically by passing to the toric graphic arrangement. Is there a similar geometric model for chip-firing equivalence on larger classes of divisors? Can multi-toppling, or hereditary chip-firing, provide it, and when does that dynamics have the abelian property?
