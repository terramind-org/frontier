lean:
  module: FormalConjectures.OEIS.«108129»
  decl: OeisA108129.conjecture
  statement: |-
    theorem conjecture :
        a 254602 = -1 ∧ (∀ n : ℕ, 1 ≤ n ∧ n < 254602 → a n ≠ -1)
  context:
    - open OeisA108129
    - open Nat
    - "variable {m n : ℕ}"
  definitions:
    - name: OeisA108129.a
      kind: def
      text: |-
        /-- The primary defining sequence `a`.
        Riesel problem: let $k=2n-1$; then $a(n)$ is the smallest $m \ge 1$ such that
        $k \cdot 2^m-1$ is prime, or $-1$ if no such prime exists. -/
        noncomputable def a (n : ℕ) : ℤ :=
          if n = 0 then 0
          -- Use classical choice to find the minimum, or return -1 if no such prime exists.
          else if h : ∃ m, m ≠ 0 ∧ ((2 * n - 1) * 2 ^ m - 1).Prime then
            Nat.find h
          else
            -1
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/OEIS/108129.lean#L38
