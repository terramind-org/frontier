title: Open Problems in Arithmetic Dynamics — Question 33
field: mathematics
tier: prose
statement: |-
  Let $K(B)$ be the function field of an algebraic curve, let
  $f:\mathbb{P}^N\to\mathbb{P}^N$ be a morphism of degree $d\ge2$ defined over the
  field $K(B)$, and let $P\in\mathbb{P}^N\bigl(K(B)\bigr)$. Is the canonical
  height ${\hat h}_f(P)$ always in $\mathbb{Q}$? If not, give necessary and
  sufficient conditions for ${\hat h}_f(P)\in\mathbb{Q}$.
