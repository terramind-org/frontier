title: Calibrated faces in ell_p^n and the solved dimensional ranges
field: mathematics
tier: prose
statement: |-
  Let $\mathcal H^m$ denote the Hausdorff $m$-measure corresponding to the
  norm in $\ell_p^n$.  Let $P$ be a polyhedral $m$-cycle in $\ell_p^n$,
  $p\ne2$, with faces $F_1,\ldots,F_k$.  Is
  \[
   \mathcal H^m(F_1)\le \sum_{j=2}^k\mathcal H^m(F_j)?
  \]
