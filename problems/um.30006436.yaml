title: Higher-Depth Mock Modular Forms and Polyharmonic Maass Forms
field: mathematics
tier: prose
statement: Relate higher-depth mixed mock modular forms and iterated integrals to polyharmonic weak Maass forms. Use this connection to explain the passage from finite-length representation theory for the modular group to a well-behaved representation theory for the ambient real Lie group. Determine first whether iterated Eisenstein integrals correspond directly to polyharmonic Eisenstein series or require cusp-form or weak-form corrections.
