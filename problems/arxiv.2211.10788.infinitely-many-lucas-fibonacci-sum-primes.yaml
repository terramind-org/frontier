  module: FormalConjectures.Arxiv.«2211.10788».LucasFibonacciSumPrimes
  decl: Arxiv.«2211.10788».infinitely_many_lucas_fibonacci_sum_primes
  statement: |-
    theorem infinitely_many_lucas_fibonacci_sum_primes :
        {p : ℕ | p.Prime ∧ ∃ n, p = lucasFibonacciSum n}.Infinite
  context:
    - open Arxiv
    - open Arxiv.«2211.10788»
  definitions:
    - name: Arxiv.«2211.10788».lucasFibonacciSum
      kind: def
      text: |-
        /-- The sum $F_n+L_{n+1}=2F_n+F_{n+2}$, using $F_0=0$ and $F_1=1$. -/
        def lucasFibonacciSum (n : ℕ) : ℕ := 2 * Nat.fib n + Nat.fib (n + 2)
