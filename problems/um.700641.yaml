  [Archived solved part(s) of 10.26:]
  a)
  Does there exist an algorithm which decides,
  for given elements $a, b$ and an automorphism $ \varphi$ of a free
  group, whether the equation $ax^{\varphi}=xb$ is soluble in this
  group? This question seems to be useful for solving the problem of
  equivalence of two knots.
