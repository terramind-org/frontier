id: um.20000059
title: An oriented preservation calculus for categorical representability in codimension two
field: mathematics
tier: prose
statement: |-
  Which birational transformations preserve the following property?

  \[
  D(X)=\langle \mathscr A_1,\ldots,\mathscr A_m\rangle
  \]
  has a semiorthogonal decomposition with \(\mathscr A_i\hookrightarrow D(Y_i)\) such that \({\rm dim}\,Y_i\leq {\rm dim}\,X-2\). For future reference, we call this property (*).

  Its problem text is:

  The standard precise reading is the following. For a smooth projective variety \(X\), \(D(X)\) means \(D^b_{\mathrm{coh}}(X)\). Each \(\mathscr A_i\) is an admissible component, and \(\mathscr A_i\hookrightarrow D(Y_i)\) means that \(\mathscr A_i\) is equivalent to an admissible subcategory of \(D^b_{\mathrm{coh}}(Y_i)\), where \(Y_i\) is smooth and projective. This is categorical representability in dimension at most \(\dim X-2\), or in codimension at least two. Without admissibility the stated property is too weak for the usual formalism and does not agree with the cited definition.

  Throughout the mathematical result below, the ground field is \(\mathbb C\), varieties are smooth and projective, and \(n=\dim X\geq2\). The categorical preservation statements themselves work over any field for which the invoked semiorthogonal decompositions hold; \(\mathbb C\) is used for the Hochschild--Hodge interpretation and avoids field qualifications.
