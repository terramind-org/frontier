title: Baker's Dozen — A converse Desargues theorem
field: mathematics
tier: prose
statement: Let $f(x,y)$ be a polynomial for which $0$ is a nonsingular value, let $\gamma$ be an oval component of $f(x,y)=0$, and assume that $\gamma_\varepsilon=\{f(x,y)=\varepsilon\}$ for $\varepsilon>0$ foliates an outer neighborhood of $\gamma$. Suppose that for every tangent line $\ell$ to $\gamma$, its intersections with the curves $\gamma_\varepsilon$ define a local projective involution on $\ell$. Prove that $\gamma$ is an ellipse and the curves $\gamma_\varepsilon$ form a pencil of conics.
