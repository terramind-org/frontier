title: A dense analytic rational skeleton for an analytic Aubry foliation
field: mathematics
tier: prose
statement: Let \(f:\mathbb T\times\mathbb R\to\mathbb T\times\mathbb R\) be an analytic twist map. Suppose that \(\mathbb T\times\mathbb R\) is foliated by invariant curves \(\Gamma_c\) (which are Aubry--Mather sets). Are these curves \(\Gamma_c\) necessarily analytic?
