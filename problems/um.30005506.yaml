title: Inductive Alperin–McKay Condition for Isolated Blocks
field: mathematics
tier: prose
statement: For finite simple groups of Lie type $B$ or $C$ and primes $\ell\geq 5$ outside the defining characteristic, verify the inductive Alperin–McKay condition for every isolated $\ell$-block by constructing the required equivariant height-zero-character bijection.
