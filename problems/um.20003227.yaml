title: "Chain toggles on an antichain: CSP, homomesy, and an affine lift"
field: mathematics
tier: prose
statement: |-
  Explore these (and other) generalized toggle groups, look for homomesy and CSP, look at piecewise-linear and birational liftings.

  For example, one could look at toggling chains, then the piecewise-linear extension should be to the order complex.

  The operative text is:

  The source immediately before the problem defines generalized toggles as follows. For a finite set \(E\), a family \(\mathcal L\subseteq 2^E\), and \(e\in E\), the toggle \(t_e\) adds or removes \(e\) when the resulting set remains in \(\mathcal L\), and otherwise fixes the state. It explicitly lists chains of a poset among the examples.

  This report answers all three concrete directions—homomesy, cyclic sieving, and a piecewise-linear lift—for the chain family of an antichain. It does not propose a birational lift.
