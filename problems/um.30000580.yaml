title: Equivariant Completions of Log-Homogeneous Spaces
field: mathematics
tier: prose
statement: For a log homogeneous variety $(X,D)$, let $\sigma:X\to S(X)$ be the Stein factorization of its Tits map. Classify, in arbitrary dimension, the homogeneous spaces that admit a log homogeneous equivariant completion. Must $S(X)$ have only quotient singularities?
