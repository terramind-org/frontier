title: Lefschetz Injectivity for Doubly Cohen–Macaulay Complexes
field: mathematics
tier: prose
statement: Does the Stanley–Reisner ring $R$ of every doubly Cohen–Macaulay simplicial complex admit a linear system of parameters $\Theta$ and a linear form $\omega$ such that $\omega^{s-2i}:(R/\Theta R)_i\to(R/\Theta R)_{s-i}$ is injective for every $i\leq s/2$, where $s$ is the rank of the complex?
