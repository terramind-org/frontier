title: Critical percolation on distributional planar limits
field: mathematics
tier: prose
statement: Let $G$ be a distributional local limit of finite planar graphs. Prove that $p_c^{\mathrm{site}}(G)\ge1/2$ almost surely and that there is no infinite cluster at criticality. Determine whether the no-critical-percolation conclusion holds for every unimodular random graph.
