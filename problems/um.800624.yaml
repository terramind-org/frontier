title: Selection Principles in Mathematics — Problem 53 ([BarJu93])
field: mathematics
tier: prose
statement: |-
  Is it consistent that $\operatorname{cov}(\mathcal{M})=\aleph_1<\mathfrak{c}=\aleph_{\omega_1}$,
  and there is a $\mathfrak{c}$-Luzin set (i.e., $L$ with $|L|=\mathfrak{c}$ and $|L\cap M|<\mathfrak{c}$ for
  all meager $M\subseteq\mathbb{R}$)?
