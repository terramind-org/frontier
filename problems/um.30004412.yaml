title: Slice Candidates and Shared Trace Boundaries of Knots
field: mathematics
tier: prose
statement: Is the positive Whitehead double of the left-handed trefoil slice? Is the $(2,1)$-cable of the figure-eight knot slice? For which knots $K$ does there exist a distinct knot $J$ with $\partial X(J)\cong\partial X(K)$, or with the two trace boundaries merely integer-homology cobordant? Give an algorithm for producing such knots $J$.
