title: Kourovka Notebook Problem 17.127
field: mathematics
tier: prose
statement: |-
  Suppose that a finite soluble group $G$ of
  derived length $d$ admits an elementary abelian $p$-group of
  automorphisms $A$ of order $p^n$ such that $C_G(A)=1$. Must $G$
  have a normal series of $n$-bounded length with nilpotent factors
  of $(p,n,d)$-bounded nilpotency class?

  This is true for $p=2$. An affirmative answer would follow from
  an affirmative answer to 11.125.
