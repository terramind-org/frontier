title: Primes $p < n$ with $n^2 - n + p$ and $n^2 + n - p$ prime (conjecture_3)
field: mathematics
tier: proof
statement: |-
  Conjecture: For $n > 1828$, there is a prime $p < n$ such that
  both $n^2 - n - p$ and $n^2 + n + p$ are prime.
  - _Zhi-Wei Sun_
