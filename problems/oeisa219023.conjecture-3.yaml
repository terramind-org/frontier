  module: FormalConjectures.OEIS.«219023»
  decl: OeisA219023.conjecture_3
  statement: |-
    theorem conjecture_3 (n : ℕ) (hn : 1828 < n) :
        ∃ p : ℕ, p.Prime ∧ p < n ∧
          Nat.Prime (n ^ 2 - n - p) ∧ Nat.Prime (n ^ 2 + n + p)
