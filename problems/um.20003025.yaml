id: um.20003025
title: Exact splitting criteria for bipolar quotient subgroups
field: mathematics
tier: prose
statement: |-
  Bipolar quotients

  Does $\mathcal{T}_n/ \mathcal{T}_{n+1}$ contain a $\mathbb{Z}^{\infty}$-summand?
  What about a $(\mathbb{Z}/2\mathbb{Z})^{\infty}$ subgroup?

  In fact, it is unknown in general even if $\mathcal{T}_n/ \mathcal{T}_{n+1}$ contains a $\mathbb{Z}/ 2\mathbb{Z}$ subgroup.
  Work of Cha-Kim (Cha--Kim 2014, MR3228458) shows that $\mathcal{T}_n/ \mathcal{T}_{n+1}$ contains a $\mathbb{Z}^{\infty}$- subgroup for all $n \in \mathbb{N}$.
