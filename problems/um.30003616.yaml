title: Half-Line Spectra for Fibonacci Schrödinger Operators
field: mathematics
tier: prose
statement: |-
  Let $V_\omega$ be a continuum Fibonacci potential on $\mathbb R$, and define the separable Schrödinger operator on $\mathbb R^2$ by
  $$
  L^{(2)}_{\lambda_1V_\omega,\lambda_2V_\omega}=-\Delta+\lambda_1V_\omega(x)+\lambda_2V_\omega(y).
  $$
  Does its spectrum contain a half-line for every $\lambda_1,\lambda_2>0$?
