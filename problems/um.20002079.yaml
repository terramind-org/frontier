title: Local toric bookkeeping and a focus-focus monodromy obstruction
field: mathematics
tier: prose
statement: "**Question 1.21.** Margaret Symington asked a series of questions centered around the question of whether a locally toric structure is helpful for counting holomorphic curves. This is inspired by the success of using amoebas in Mikhalkin's work; locally toric pictures have a lot of the same structure Mikhalkin used. [Unfortunately I do not have good notes on this.]"
