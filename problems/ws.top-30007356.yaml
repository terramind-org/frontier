statement: |-
  \section*{Natural occupation measures of critical FK interfaces}\label{30007356}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For each $q\in [1,4)$, can a positive deterministic c(q) normalize the medial-edge traversal occupation measure of its critical square-lattice FK Dobrushin interface in the source's fixed unit square with specified boundary marks by $c(q)n^{-d}$, $d=1+\kappa (q)/8$, so that curve and measure converge jointly to one chordal SLE sample and its natural Minkowski-content measure, in ordered curve and weak finite-measure topologies?
  \subsection{Short English statement}
  For each $q\in [1,4)$, can a positive deterministic c(q) normalize the medial-edge traversal occupation measure of its critical square-lattice FK Dobrushin interface in the source's fixed unit square with specified boundary marks by $c(q)n^{-d}$, $d=1+\kappa (q)/8$, so that curve and measure converge jointly to one chordal SLE sample and its natural Minkowski-content measure, in ordered curve and weak finite-measure topologies?
