title: Liouville Theorems for Periodic Elliptic Equations
field: mathematics
tier: prose
statement: Does the Liouville property for periodic second-order scalar elliptic equations extend beyond divergence form, to higher-order equations and matrix-valued systems? Can one decide effectively whether a given periodic elliptic equation has the Liouville property? Can analogous criteria be established for operators on abelian coverings?
