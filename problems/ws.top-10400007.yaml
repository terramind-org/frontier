statement: |-
  \section{Problem 1.7 — (J.}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  A knot or link is a smooth oriented embedding of one or more circles in the oriented $3$-sphere, considered up to orientation-preserving ambient isotopy. Write $O$ for the unknot, which bounds an embedded disk. The Jones polynomial is normalized by $V_O(t)=1$ and
  \[t^{-1}V_{L_+}(t)-tV_{L_-}(t)=(t^{1/2}-t^{-1/2})V_{L_0}(t),\]
  where the three oriented links agree outside a ball and inside it have respectively a positive crossing, a negative crossing, and the oriented smoothing. For knots $V_K(t)\in\mathbb Z[t,t^{-1}]$.
  \paragraph{Statement recorded in the supplied source.}
  A local coefficient system on a space $X$ is a locally constant family of vector spaces, equivalently a representation of $\pi_1(X)$ on a vector space; its twisted homology is computed using this representation in the chain complex. Construct an intrinsic definition of $V_K$ using homology with local coefficients. Possible spaces include suitable configuration spaces associated directly to the knot or its complement, but the construction must be specified and proved to recover the Jones polynomial without requiring a chosen braid presentation. \sref{statement}{2}
  \subsection{Short English statement}
  Construct the Jones polynomial intrinsically from homology with local coefficients attached to the knot.
