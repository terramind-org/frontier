title: Open Problems in Arithmetic Dynamics — Conjecture 18 (Dynamical Andr{\'e}--Oort Conjecture for 1-Dimensional Families)
field: mathematics
tier: prose
statement: |-
  \textup{(Baker--DeMarco, 2013, [arxiv1211.0255])}
  Let $T$ be a non-singular algebraic curve, and let
  \[
  T \longrightarrow\mathcal{M}_d^{\mathrm{crit}},\quad
  t \longmapsto (f_t,P_{1,t},\ldots,P_{2d-2,t})
  \]
  be a family of rational maps with marked critical points. Then the
  following are equivalent\textup:
  \begin{parts}

  (a)
  There are infinitely many $t\in T$ such that $f_t$ is PCF.

  (b)
  For every $i$ and $j$, the maps $P_i:T\to\mathbb{P}^1$ and $P_j:T\to\mathbb{P}^1$
  are $f$-dynamically related.
  \end{parts}
