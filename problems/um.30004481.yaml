title: Rigidity, Regularity, and Vectorial Nucleation in Nonlinear Inclusions
field: mathematics
tier: prose
statement: For geometrically nonlinear differential inclusions, is there a critical threshold separating rigid and flexible regimes, and can one bound the maximal regularity of irregular solutions? Can scalar nucleation models for shape-memory alloys be extended to vectorial models with compatibility conditions, related to convex integration, and analyzed through their associated random processes?
