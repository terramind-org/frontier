  % UnsolvedMath ID 30000075; source catalogue code OWR-733-007
  \setcounter{section}{30000074}
  \section{\texorpdfstring{Bounded Complements for $\varepsilon-Log-Canonical$ Varieties}{Bounded Complements for varepsilon-Log-Canonical Varieties}}\label{30000075}
  {\small UnsolvedMath ID 30000075 · Algebraic Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For every dimension bound $d$ and $\varepsilon\geq 0$, does there exist a finite set of complementary indices $N_d(\varepsilon)$ such that every $\varepsilon$-log-canonical variety $X$ of dimension at most $d$, with $-K_X$ nef and big over $Z$, has a general bounded complement $(X,D/n)$ that is $\varepsilon$-log-canonical?
  \par\smallskip\textit{Formulation references:} \sref{30000075}{1}, \sref{30000075}{2}.
  \subsection{Short English statement}
  For every dimension bound $d$ and $\varepsilon\geq 0$, does there exist a finite set of complementary indices $N_d(\varepsilon)$ such that every $\varepsilon$-log-canonical variety $X$ of dimension at most $d$, with $-K_X$ nef and big over $Z$, has a general bounded complement $(X,D/n)$ that is $\varepsilon$-log-canonical?
