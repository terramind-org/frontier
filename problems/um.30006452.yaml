title: Limiting Distributions of Mixed Character Sums
field: mathematics
tier: prose
statement: For each prime $q$, let $\chi_q$ be the prescribed deterministic character and let $S(\chi_q,x,\theta)=\sum_{n\leq x}\chi_q(n)e(n\theta)$. When $\theta$ is uniform on $[0,1]$, determine the limiting distribution of this mixed character sum as $q\to\infty$.
