  path: FormalConjectures/Wikipedia/MontgomeryPairCorrelationConjecture.lean
  url: https://github.com/google-deepmind/formal-conjectures/blob/f606af160664c5a10952e9a957b100a1cd45bbeb/FormalConjectures/Wikipedia/MontgomeryPairCorrelationConjecture.lean#L128
  licence: Apache-2.0
