schema: 1
id: montgomerypaircorrelationconjecture.montgomery-pair-correlation-conjecture.variants.general-interval
title: "Montgomery's GUE pair correlation conjecture for zeta zeros (variant: general_interval)"
field: mathematics
tier: proof
statement: |-
  General-interval form of Montgomery's Pair Correlation Conjecture: given `RiemannHypothesis`,
  for any fixed $\alpha \le \beta$, the normalized pair count converges to
  $\int_\alpha^\beta \left(1 - \operatorname{sinc}(\pi u)^2\right) du + \mathbf{1}_{0 \in [\alpha,
  \beta]}$ as $T \to \infty$.
ams:
  - 11
  - 30
tags:
  - wikipedia
  - variant
references:
  - label: Wikipedia
    url: https://en.wikipedia.org/wiki/Montgomery%27s_pair_correlation_conjecture
source:
