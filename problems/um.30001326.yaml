title: Gaussian Central Limits for Stationary Sequences
field: mathematics
tier: prose
statement: Let $(X_i)_{i\geq1}$ be a stationary standard Gaussian sequence with covariance sequence $(r_k)$, and let $g$ be a measurable function with finite variance under the standard Gaussian law. Characterize the conditions on $(r_k)$ and $g$ under which $n^{-1/2}\sum_{i=1}^n g(X_i)$ converges in distribution to a normal law.
