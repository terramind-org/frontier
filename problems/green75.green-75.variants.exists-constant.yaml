lean:
  module: FormalConjectures.GreensOpenProblems.«75»
  decl: Green75.green_75.variants.exists_constant
  statement: |-
    theorem green_75.variants.exists_constant :
        ∃ C : ℕ, ∀ X : Finset (ℝ × ℝ), 2 ≤ #X →
          ∃ p ∈ X, ∃ q ∈ X, p ≠ q ∧ imbalance X p q ≤ C
  context:
    - open Green75
    - open Green75.green_75
    - open Green75.green_75.variants
    - open scoped Finset
  definitions:
    - name: Green75.imbalance
      kind: def
      text: |-
        /--
        `imbalance X p q` is the absolute difference between the numbers of points of `X` on the two sides
        of the line through
        `p` and `q`. The points of `X` on the line itself are on neither side.
        -/
        noncomputable def imbalance (X : Finset (ℝ × ℝ)) (p q : ℝ × ℝ) : ℤ :=
          |(leftCount X p q : ℤ) - (rightCount X p q : ℤ)|
      url: https://github.com/google-deepmind/formal-conjectures/blob/b576d527b271b936f9e61c0e367c302d7386bc80/FormalConjectures/GreensOpenProblems/75.lean#L53
