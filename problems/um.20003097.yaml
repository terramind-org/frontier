statement: |-
  **Problem 2.7 (K. Rafi).** Define the geodesic flow for the Thurston metric and study its properties, such as ergodic or mixing.

  The exact mathematical question in the source PDF is:

  Inspection of the PDF and neighboring records shows that this sentence introduces Problem 2.8, the counting problem for pseudo-Anosov conjugacy classes; it is not part of Problem 2.7. The contextual paragraph immediately before Problem 2.7 compares the desired theory with the Teichmüller geodesic flow on moduli space.

  This report treats the recovered one-sentence question above. It distinguishes:

  1. a selected-ray flow on marked Teichmüller space;
  2. the induced flow on the diagonal mapping-class quotient; and
  3. the impossible stronger request for a canonical flow containing every Thurston geodesic direction without an additional selection rule.
