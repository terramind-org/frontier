title: Critical Weinstein surgery, cyclic chord words, and finite action windows
field: mathematics
tier: prose
statement: |-
  This is Question 1.10 in the AIM workshop list *Holomorphic curves in contact geometry*. It asks how contact homology changes under the handle decomposition of a Stein filling. The critical case is attachment of a middle-index Weinstein handle along a Legendrian sphere \(L\); the source observes that new closed Reeb orbits should be concatenations of Reeb chords of \(L\), and asks for a surgery formula in terms of the relative contact homology of \(L\).

  The symbols in the official source are \(W\) for the Stein filling, \(\varphi:W\to\mathbb R\) for a pseudoconvex function, and \(L\) for the Legendrian attaching sphere. It is the running page number at the PDF page break. AIM's official HTML transcription omits it and continues directly with the critical-handle paragraph. No mathematical clause is missing there.

  In modern language, take a \(2n\)-dimensional Weinstein domain \(X_0\), a Legendrian attaching link \(\Lambda\subset\partial X_0\) of \((n-1)\)-spheres, and let \(X=X_0\cup H^n_\Lambda\). The one-sphere case in the AIM question is included by taking one component.
