title: Thresholds in Multicolor Online Graph-Coloring Games
field: mathematics
tier: prose
statement: Can the threshold theorem for two-color online edge-coloring games be extended to every number $r\geq2$ of colors? For trees $F$, does the known lower-bound formula give the correct threshold? What are the thresholds in the balanced variant where Painter receives $r$ vertices or edges at each step and must use each color exactly once?
