title: Open Problems on Central Simple Algebras — Conjecture 41
field: mathematics
tier: prose
statement: |-
  [Brumer--Rosen \protect{[BrumerRosen]}]
  For a given field $F$ and each prime $p$, one of the following holds:

  \renewcommand{\alph{enumi}}{\alph{enumi}}

  - $(\operatorname{Br} F)_p = 0$.

  - $(\operatorname{Br} F)_p$ contains a nonzero divisible subgroup.

  - $p = 2$ and $(\operatorname{Br} F)_2$ is an elementary abelian $2$-group.
