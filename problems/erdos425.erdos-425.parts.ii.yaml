lean:
  module: FormalConjectures.ErdosProblems.«425»
  decl: Erdos425.erdos_425.parts.ii
  statement: |-
    theorem erdos_425.parts.ii : ∀ r : ℕ, 1 ≤ r → ∃ C : ℝ, 0 < C ∧
        ∀ᶠ n in atTop, ∀ A : Finset ℕ, A ⊆ Finset.Icc 1 n → RProductsDistinct r A →
          (A.card : ℝ) ≤ (Nat.primeCounting n : ℝ) +
            C * (n : ℝ) ^ (((r : ℝ) + 1) / (2 * r))
  context:
    - open Erdos425
    - open Erdos425.erdos_425
    - open Erdos425.erdos_425.parts
    - open Filter
    - open scoped Topology
  definitions:
    - name: Erdos425.RProductsDistinct
      kind: def
      text: |-
        /--
        For `r`, all products over `r` distinct elements of `A` are distinct.  We use
        finite subsets of `A` of cardinality exactly `r`.
        -/
        def RProductsDistinct (r : ℕ) (A : Finset ℕ) : Prop :=
          ∀ ⦃S T : Finset ℕ⦄,
            S ⊆ A → T ⊆ A → S.card = r → T.card = r → S.prod id = T.prod id → S = T
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/ErdosProblems/425.lean#L48
