title: Kawaguchi–Silverman Arithmetic Degree Conjecture
field: mathematics
tier: prose
statement: Let $f$ be a dominant self-map of a smooth projective variety $X$ over a number field, and let $P\in X(\overline{\mathbb Q})$. If the forward orbit of $P$ is Zariski dense in $X$, must the arithmetic degree $\alpha(f,P)$ equal the dynamical degree $\delta(f)$?
