title: Poisson Nilpotency and Solvability in Small Characteristics
field: mathematics
tier: prose
statement: Let $L$ be a Lie algebra over a field of characteristic $p>0$. If $s(L)$ is Lie nilpotent, do its Lie nilpotency class and strong Lie nilpotency class coincide for $p=2$ or $3$? If $p>2$ and $s(L)$ is solvable, do its derived length and strong derived length coincide?
