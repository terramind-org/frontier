title: Erdős–Hajnal Conjecture
field: mathematics
tier: prose
statement: |-
  \section{Erdős–Hajnal Conjecture}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N=\{1,2,\ldots\}$, and $\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$ denote the integers, rationals, reals and complex numbers. Any other conventions are specified locally.


  Graphs are finite, simple and undirected. For a graph $G$, let $\omega(G)$ be its largest clique size and $\alpha(G)$ its largest independent-set size. A clique has every pair of distinct vertices adjacent; an independent set has no adjacent pair. A graph is $H$-free if no induced subgraph is isomorphic to $H$.
  \paragraph{Statement recorded in the supplied source.}
  For every finite simple graph $H$, is there a real number $\delta_H>0$ such that every nonempty $H$-free graph $G$ satisfies
  \[
   \max\{\alpha(G),\omega(G)\}\ge |V(G)|^{\delta_H}?
  \]
  The exponent depends on $H$ and must be uniform over all orders and all $H$-free graphs $G$. \sref{statement}{2}
  \subsection{Short English statement}
  For each forbidden induced graph, must every graph avoiding it have a clique or independent set whose size is a fixed positive power of its order?
  \subsection{Sources}
  \begin{description}
  \item[\hypertarget{source:statement:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, \emph{UnsolvedMath: A Curated Collection of Open Mathematics Problems}, catalogue entry. CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:statement:2}{S2}] Maria Chudnovsky, Alex Scott, Paul Seymour and Sophie Spirkl, \emph{Erdős--Hajnal for graphs with no 5-hole} (2021), arXiv:2102.04994v1, Section 1, Conjecture 1.1. \url{https://arxiv.org/abs/2102.04994v1}.
  \end{description}
