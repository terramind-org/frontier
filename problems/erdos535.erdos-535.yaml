lean:
  module: FormalConjectures.ErdosProblems.«535»
  decl: Erdos535.erdos_535
  statement: |-
    theorem erdos_535 : ∀ r ≥ 3, ∃ c > (0 : ℝ),
        ∀ᶠ (N : ℕ) in atTop,
          (f r N : ℝ) ≤ (N : ℝ) ^ (c / log (log (N : ℝ)))
  context:
    - open Erdos535
    - open ArithmeticFunction
    - open Filter Real
    - open scoped omega Omega
  definitions:
    - name: Erdos535.f
      kind: def
      text: |-
        /-- `f r N` is the maximum size of a subset `A ⊆ {1,…,N}` such that no `r`-element
        subset of `A` has constant pairwise GCD. -/
        noncomputable def f (r N : ℕ) : ℕ :=
          sSup {k : ℕ | ∃ A : Finset ℕ, A ⊆ Finset.Icc 1 N ∧
            (∀ S ⊆ A, S.card = r →
              ¬ (∃ d, (S : Set ℕ).Pairwise fun a b => Nat.gcd a b = d)) ∧
            A.card = k}
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/ErdosProblems/535.lean#L58
