  statement: |-
    theorem kourovka_20_51 :
        ∀ t > 3, Odd t → ∃ (G : Type) (_ : Group G), Finite G ∧ (∃ a b : G, a * b ≠ b * a) ∧
          Odd (Nat.card G) ∧ Nat.card (ConjClasses G) = t
