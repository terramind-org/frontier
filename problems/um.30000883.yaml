title: Hypercenter and Prime-Graph Problems for Integral Group Rings
field: mathematics
tier: prose
statement: Let $U=U(\mathbb{Z}G)$, let $Z_\infty(U)$ be its hypercenter, let $\Delta(U)$ be its finite-conjugacy center, and let $N_U(G)$ be the normalizer of $G$ in $U$. Are $Z_\infty(U)\subseteq\Delta(U)$ and $\Delta(U)\subseteq N_U(G)$? For a finite group $G$, is every simple section of a finite subgroup of $V(\mathbb{Z}G)$ isomorphic to a section of $G$, and does $\Pi(V(\mathbb{Z}G))=\Pi(G)$ hold for the prime graphs?
