title: Affine Algebra Models for Principal Representation Blocks
field: mathematics
tier: prose
statement: Let $A$ be the integral algebra whose complex module category is equivalent to the principal block $\mathcal O_0$ of category $\mathcal O$ and whose reduction over a field $k$ models the corresponding modular category. Fiebig's affine analogue controls the full Lusztig conjecture. How is the module category of this affine algebra related to the entire principal block $\operatorname{Rep}(G_k)$?
