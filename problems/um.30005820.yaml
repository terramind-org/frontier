title: Monochromatic Empty Triangles
field: mathematics
tier: prose
statement: Let $f(n)$ be the largest integer such that every set of $n$ red and $n$ blue points in general position in the plane contains at least $f(n)$ monochromatic empty triangles. Prove or disprove that $f(n)=o(n^2)$.
