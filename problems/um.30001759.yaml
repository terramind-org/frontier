statement: For every projective variety $Y\subset\mathbb{CP}^N$, is the $L^2$ de Rham cohomology of its regular part $Y\setminus\operatorname{Sing}Y$, with the restricted Fubini–Study metric, naturally isomorphic to the middle-perversity intersection cohomology $IH^k(Y)$?
