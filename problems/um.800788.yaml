title: Local Discrete Holomorphic Dynamics — Open Problem OP6
field: mathematics
tier: prose
statement: |-
  \emph{Let $f\in\mathop\mathrm{End}\nolimits(\mathbb{C}^n,O)$ be non-invertible and dominant. Is it true that the sequence
  $\{c(f^k)\}_{k\in\mathbb{N}}$ satisfies, at least for $k$ large enough, a linear recursion formula
  with integer coefficients?}
