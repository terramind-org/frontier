title: Self-Similar Shock Diffraction by Wedges
field: mathematics
tier: prose
statement: Given $\gamma>1$ and $\rho_0>0$, let $\Lambda$ be the upper half-plane outside a wedge and let $\phi$ solve $\operatorname{div}(\rho(|D\phi|^2,\phi)D\phi)+2\rho(|D\phi|^2,\phi)=0$, where $\rho=(\rho_0-(\gamma-1)(\phi+|D\phi|^2/2))^{1/(\gamma-1)}$. Seek a self-similar weak solution satisfying $D\phi\cdot\nu=0$ on the wedge boundary and tending at infinity to the two incident constant-state potentials separated by the incident shock.
