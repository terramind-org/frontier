id: oeisa224.conjecture
title: Number of squares $\bmod n$
field: mathematics
tier: proof
statement: |-
  $n^2 \equiv 1 \pmod{a(n)(a(n)-1)}$ if and only if $n$ is an odd prime.
  - Thomas Ordowski, Jun 08 2017
