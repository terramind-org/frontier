title: Six Problems from an Analytic Number Theory Session
field: mathematics
tier: prose
statement: "Resolve the following six problems: (1) construct a degree-five $2$-superirreducible polynomial; (2) for each finite abelian group $G$, optimize $n$ and $d$ in a representation $G\\cong\\{z^d:z\\in(\\mathbb Z/n\\mathbb Z)^\\times\\}$; (3) find homogeneous forms $f$ and $g$ of degrees $3$ and $2$ in five variables with $f^2+g^3=N_{K/\\mathbb Q}(x_1\\omega_1+\\cdots+x_5\\omega_5)$; (4) cover $\\{1,\\ldots,N\\}$ at least twice by one residue class modulo each prime, controlling both the primes and $\\sum_p1/p$; (5) produce arbitrary prescribed patterns of consecutive prime residues; and (6) develop circle-method, Weyl-sum, or Poisson-summation techniques for quaternions."
