title: Manin-Type Asymptotics for Rational-Curve Components
field: mathematics
tier: prose
statement: Let $X$ be a smooth projective Fano variety and let $N^\circ(X,q,d)$ sum $q^{\dim W}$ over dominant components $W$ of $\operatorname{Mor}(\mathbb P^1,X)$ of anticanonical degree $d$ whose family maps do not rationally factor through breaking maps. Must $N^\circ(X,q,d)\sim Cq^d d^{\rho(X)-1}$ as $d\to\infty$ for some $C>0$?
