title: Precipitous Ideal Separation at Higher Cardinals
field: mathematics
tier: prose
statement: Can the separation between precipitous and normal precipitous ideals be generalized beyond $\aleph_1$? In particular, is there a model with a precipitous ideal on $\aleph_2$ but no normal precipitous ideal? Is it consistent that a supercompact cardinal exists while $\aleph_1$ carries no precipitous ideal?
