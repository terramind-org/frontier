title: Fast Generators for F-Less Homeomorphism Groups
field: mathematics
tier: prose
statement: Does every finitely generated subgroup $H<\operatorname{PL}_o(I)$ that contains no copy of Thompson's group $F$ have a finite fast generating set $A$ with the same biembeddability class? Can fast subgroups of $\operatorname{PL}_o(I)$ that contain no copy of $F$ be characterized?
