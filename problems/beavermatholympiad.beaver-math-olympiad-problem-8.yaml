lean:
  module: FormalConjectures.Other.BeaverMathOlympiad
  decl: BeaverMathOlympiad.beaver_math_olympiad_problem_8
  statement: |-
    theorem beaver_math_olympiad_problem_8 :
        ∀ᵉ (a : ℕ → ℤ) (b : ℕ → ℤ)
        (a_ini : a 0 = 10)
        (a_rec : ∀ n, a (n + 1) =
          if b n / 2 < a n then a n - b n / 2 - 3 else 3 * a n + 5)
        (b_ini : b 0 = 12)
        (b_rec : ∀ n, b (n + 1) =
          if b n / 2 < a n then 3 * ((b n + 1) / 2) + 6 else b n - 2 * a n),
        ∃ i, a i = b i / 2 + 1
