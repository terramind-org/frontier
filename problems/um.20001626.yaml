id: um.20001626
title: A quantitative small-spectrum criterion for analytic L2-torsion approximation
field: mathematics
tier: prose
statement: |-
  Let \(M\) be a closed Riemannian manifold and let
  \[
  \Gamma=\pi_1(M)>\Gamma_1>\Gamma_2>\cdots
  \]
  be a decreasing sequence of finite-index normal subgroups of \(\Gamma\) with \(\bigcap_n\Gamma_n=1\). Let \(\widetilde M\) be the universal cover of \(M\) and let \(M_n=\widetilde M/\Gamma_n\). Is
  \[
  \rho^{(2)}(\widetilde M)=
  \lim_n\frac{\rho(M_n)}{|\Gamma:\Gamma_n|}?
  \]
