id: um.20000349
title: Cubic points in the plane and the two exceptional sets
field: mathematics
tier: prose
statement: |-
  It asks for a Manin-type conjecture for degree-\(d\) points on a Fano variety \(X/k\). Its displayed counting function is
  \[
   N_{X,\mathscr L}(U,B;d)
   =
   \#\{x\in U(\overline k):h_{\mathscr L}(x)\leq B,\ 
   [\kappa(x):k]=d\},
  \]
  and the proposed form is \(cB^a(\log B)^b\). It asks for \(a,b,c\), for the correct shape of \(U\), and particularly for \(X=\mathbb P^2_{\mathbb Q}\), \(d=3\).

  There is an essential convention to repair. In much of arithmetic geometry \(h_{\mathscr L}\) denotes a **logarithmic** Weil height. A bound \(h_{\mathscr L}\leq B\) then produces exponential, not polynomial, growth in \(B\). Throughout this report,
  \[
   H_{\mathscr L}:=\exp(h_{\mathscr L})
  \]
  is the multiplicative height and the bound is \(H_{\mathscr L}\leq B\), equivalently \(h_{\mathscr L}\leq\log B\). If the source's inequality is read literally with logarithmic \(h_{\mathscr L}\), every occurrence of \(B^\alpha\) below becomes \(\exp(\alpha B)\).

  Replacing a metric by an equivalent one preserves power and logarithmic exponents but can change the leading constant. Thus no numerical \(c\) is meaningful until the metric and the exceptional set are specified.
