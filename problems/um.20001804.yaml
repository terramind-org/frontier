title: Euler-characteristic boundary sieve for Hilbert schemes of Painleve surfaces
field: mathematics
tier: prose
statement: |-
  Hilbert schemes of points on \(K2\)-surfaces.

  There are \(12\) known deformation classes of complete hyperkahler
  manifolds of real dimension four that arise as moduli spaces of meromorphic
  Higgs bundles. Lets call them \(K2\) surfaces. For each of these \(K2\)
  surfaces there is a sequence of Higgs bundle moduli space of dimension
  \(4n\) for each \(n\).

  Is each of these \(4n\) dimensional hyperkahler manifolds diffeomorphic to
  (or a deformation of) the Hilbert scheme of \(n\)-points on the underlying
  \(K2\) surface?

  **Recovered question.** For generic admissible parameters and each of the
  twelve two-dimensional tame or wild meromorphic Hitchin moduli spaces \(S\)
  listed by Boalch, is the corresponding higher-dimensional moduli space
  \(\mathcal H_n\) diffeomorphic to \(S^{[n]}=\operatorname{Hilb}^n(S)\), or
  related to it by a topology-preserving deformation?
