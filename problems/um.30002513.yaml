title: Generating Series for Immersed Plane Curves
field: mathematics
tier: prose
statement: Let $N(g)$ be the number, up to isotopy, of immersed curves in $\mathbb R^2$ with only transverse self-intersections and exactly $g$ such intersections. Find a combinatorial or geometric interpretation of the generating series $\sum_{g\geq 0}N(g)z^g$.
