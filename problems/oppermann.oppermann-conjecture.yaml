lean:
  module: FormalConjectures.Wikipedia.Oppermann
  decl: Oppermann.oppermann_conjecture
  statement: |-
    theorem oppermann_conjecture (x : ℕ) (hx : 2 ≤ x) :
        (∃ p ∈ Ioo (x * (x - 1)) (x^2), p.Prime) ∧
        (∃ p ∈ Ioo (x^2) (x * (x + 1)), p.Prime)
