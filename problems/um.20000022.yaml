title: Immaculate line bundles as unit-orthogonal toric branes
field: mathematics
tier: prose
statement: "[Wang, Borisov--Wang] found a condition on the underlying fan for a toric stack to admit infinitely many acyclic line bundles, where “acyclic” means a line bundle \\(\\mathcal L\\) with \\(H^i(\\mathcal L)=0\\) for every \\(i\\) (for example \\(\\mathcal O(-1)\\) on projective space). In dimension two, the sample condition is the presence of collinear rays. (1) Understand the symplectic mirror of these criteria. (2) Understand consequences of generalizations, for example involving a toric subvariety whose fan is contained in a linear subspace."
