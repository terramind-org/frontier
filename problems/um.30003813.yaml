title: Combinatorics of Signed Adjacency Polytopes
field: mathematics
tier: prose
statement: For a sign sequence $\varepsilon_1,\ldots,\varepsilon_{n-1}\in\{-,+\}$, consider the polytope in $[0,1]^n$ defined, for each $i$, by $x_i+x_{i+1}\leq1$ when $\varepsilon_i=-$ and $x_i+x_{i+1}\geq1$ when $\varepsilon_i=+$. Give a combinatorial interpretation of the $h^*$-polynomial of this polytope.
