title: Open Problems on Central Simple Algebras — Problem 11
field: mathematics
tier: prose
statement: |-
  Suppose $m$ and $n$
  have the same prime factors, $m\mid n$,
  and $\operatorname{Br}_p[m](F)$ is generated by cyclic algebras. Let $\ell_F(m,n)$
  denote the minimal number such that every central simple $F$-algebra
  of degree $n$ and period (dividing) $m$ is similar to a tensor
  product of $\ell_F(m,n)$ cyclic algebras of degree $m$, unless no such bound exists,
  in which case set $\ell_F(m,n)=\infty$.
  If $F$ contains the $m$-th roots of unity,
  the generic division algebra can be used to show that
  $\ell_F(m,n)$ is finite, by the Merkurjev--Suslin theorem.
  In this case, we may assume $m$ is a power of a prime $p$ by [Tig84, Th. 2.2],
  and $\ell_F(m,n)$ is known as the *symbol length*.

  Suppose $p$ is a prime, $r\leq s$, and $\operatorname{Br}_p[p^r](F)$ is generated by
  cyclic algebras. Compute $\ell_F(p^r,p^s)$.
