statement: |-
  \section{Automatic Recognition of Numerically Unstable Quadratic Programs}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A quadratically constrained quadratic program has a quadratic objective and quadratic equality or inequality constraints. Numerical conditioning measures how perturbations in the encoded problem affect its solution or residuals; repeated nonlinear operations can amplify errors.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The automatic-recognition target has no specified condition threshold, arithmetic model, or algorithmic success criterion.

  Source-record limitation: The supplied assessment flags a broad automatic-recognition request without a defined ill-conditioning threshold or target.
  \paragraph{Statement recorded in the supplied source.}
  Consider a quadratically constrained quadratic program with $$ (x_1-1)^2+x_2^2\geq3+s^2,\qquad a_i-a_{i-1}^2=0,\qquad a_0=s/2,$$ where a finite chain of the $a_i$ amplifies numerical error through repeated square roots. How can solvers automatically recognize such severely ill-conditioned instances? \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record open; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-22.
  \subsection{Short English statement}
  Recognize and diagnose the stated severely ill-conditioned optimization examples.
