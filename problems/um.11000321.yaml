title: Problem 8.2 — Describe the Galois images in hg,1⊗ Zℓ.
field: mathematics
tier: prose
statement: "Describe the Galois images in hg,1⊗ Zℓ. The above result was proved by analyzing the number theoretical enhancement of the Johnson homomorphism where the geometric mapping class group is replaced by the arithmetic mapping class group which is expressed as an extension 1−→ ˆMn g−→πalg 1 Mn g/Q−→Gal(Q/Q)−→1 and studied by Grothendieck, Deligne, Ihara, Drinfel’d and many number theorists. Nakamura continued to study the structure of the mapping class group from the point of view of number theory extensively (see e.g. [ 88][89]). On the other hand, Hain and Matsumoto recently proved remarkable results concerning this subject (see [ 31][32]). In view of deep theories in number theory, as well as the above explicit results, it seems to be conjectured that there should exist an embedding FreeLieZ(σ3,σ 5,··· ) ⊂ hg,1 of certain free graded Lie algebra over Z generated by certain elements σ3,σ 5,···, corresponding to the Soul´ e elements, into hg,1 such that the tensor product of it with Zℓ coincides with the image of Gal( Q/Q) for any prime ℓ. We expect that the above conjectured free graded Lie algebra (the motivic Lie algebra) can be realized inside hg,1 (in fact inside the commutator ideal [ hg,1, hg,1]) explicitly in terms of the traces. In some sense, the elements σ2k+1 should be decomposable in higher genera. Here we omit the precise form of the expected formula which will be given in a forthcoming paper. Finally we mention the analogue of the Johnson homomorphisms for the group Aut Fn very briefly. Prior to the work of Johnson, Andreadakis [ 1] introduced and studied the filtration on {AutFn(k)}k which is induced from the action of Aut Fn on the lower central series of Fn. The first group Aut Fn(1) in this filtration is nothing but the group IAut n. It can be checked that an analogous procedure as in the case of the mapping class group gives rise to certain homomorphisms τk: Aut Fn(k)−→Hom(Hn,Ln(k + 1)) and the totality {τk}k of these homomorphims induces an injective homomorphism of graded Lie algebras Gr+(AutFn) = ∞⨁ k=1 AutFn(k)/AutFn(k + 1)−→Der+(Ln). (16) We refer to [ 49][93][98] for some of the recent works related to the above homomorphism. 368 S. Morita"
