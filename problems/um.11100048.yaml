title: Model categories 2 — A scheme is a generalization of a ring, in the same way that a manfold is a generalization of R^n.
field: mathematics
tier: prose
statement: A scheme is a generalization of a ring, in the same way that a manfold is a generalization of R^n. So maybe there is some kind of model structure on sheaves over a manifold? Presumably this is where de Rham cohomology comes from, but I don't know. It doesn't seem like homotopy theory has made much of a dent in analysis, but I think this is partly due to our lack of trying. Floer homology, quantum cohomology--do these things come from model structures?
