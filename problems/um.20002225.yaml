id: um.20002225
title: Welch games and the cofinality threshold for terminal extension
field: mathematics
tier: prose
statement: |-
  The formal definition in
  Foreman--Magidor--Zeman (FMZ) is as follows.

  A **\(\kappa\)-algebra** is a \(\kappa\)-complete Boolean subalgebra
  \(\mathcal A\subseteq\mathcal P(\kappa)\) of cardinality \(\kappa\). In the
  Welch game \(G^W_\gamma(\kappa)\), at every stage \(\alpha<\gamma\), Player I
  plays \(\mathcal A_\alpha\), extending all earlier algebras, and Player II
  responds with a uniform \(\kappa\)-complete ultrafilter
  \(U_\alpha\) on \(\mathcal A_\alpha\), extending all earlier
  \(U_\beta\). One may require without loss that \(\mathcal A_0\) contain all
  singletons. Player I moves first at limit stages. Player II wins exactly when
  legal responses are made at every stage below \(\gamma\).

  FMZ also define, for limit \(\gamma\), a stronger terminal payoff
  \(Q_\gamma\). The corresponding game \(G^*_\gamma\) has the same moves, but
  Player II wins a full run only when all the \(U_\alpha\)'s have a common
  uniform \(\kappa\)-complete-ultrafilter extension on the
  \(\kappa\)-complete Boolean algebra generated by
  \(\bigcup_{\alpha<\gamma}\mathcal A_\alpha\).

  1. the algebras are concrete subalgebras of \(\mathcal P(\kappa)\), have size
     \(\kappa\), and form an increasing chain;
  2. Player II's objects are **uniform ultrafilters**, not arbitrary filters;
  3. the ultrafilters must extend one another; and
  4. the first literature bullet needs a large-cardinal hypothesis: the
     length-\(\omega\) winning-strategy statement is the weak-compactness
     characterization, not an unconditional fact about every regular
     \(\kappa\).
