title: Hamiltonian Displaceability of Toric Fibers
field: mathematics
tier: prose
statement: For a $2n$-dimensional toric symplectic manifold $(M,\omega)$ with moment map $\mu$ and Lagrangian torus fibers $T_u=\mu^{-1}(u)$, which fibers can be displaced by a Hamiltonian isotopy; equivalently, for which $u$ does there exist $\phi\in\operatorname{Ham}(M,\omega)$ with $\phi(T_u)\cap T_u=\varnothing$?
