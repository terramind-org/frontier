id: um.30005922
title: Unitary Integral Identity for Noncommutative Polynomials
field: mathematics
tier: prose
statement: Let $p$ and $q$ be stable polynomials in noncommuting variables with $p(0)=q(0)=1$ and determinantal representations $\det p(X)=\det(I-A\otimes X)$ and $\det q(X)=\det(I-B\otimes X)$. Prove $\lim_{N\to\infty}\int_{U(N)^d}\det(p(U))\overline{\det(q(U))}\,dU=\det((I-A\otimes\overline B)^{-1})$.
