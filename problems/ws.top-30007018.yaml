statement: |-
  \section*{Abelianity of special compact Kähler fundamental groups}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Must the fundamental group of every connected smooth special compact Kähler manifold have an abelian subgroup of finite index? Special has Campana's standard meaning, excluding fibrations with general-type orbifold base.
  \subsection{Short English statement}
  Must the fundamental group of every connected smooth special compact Kähler manifold have an abelian subgroup of finite index? Special has Campana's standard meaning, excluding fibrations with general-type orbifold base.
