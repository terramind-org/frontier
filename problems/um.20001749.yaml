title: A dimension-linearized E6 reduction for A_+'(12)
field: mathematics
tier: prose
statement: |-
  For the real-dimension Hankel continuation of the $+1$ sign-uncertainty constant, prove that the derivative at $d=12$ exists and equals
  \[
  \frac{\sqrt8}{63}=\frac{(\sqrt2)^9}{504}.
  \]
