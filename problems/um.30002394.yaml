title: Generalized Pimsner–Voiculescu Embeddings
field: mathematics
tier: prose
statement: Can the Pimsner–Voiculescu embedding of an irrational rotation algebra be generalized to higher-dimensional noncommutative tori or more general discrete abelian groups; can spectra of unitary generators be broken in more general crossed products by locally compact abelian groups; and which properties such as maximality or extendibility of automorphisms characterize this embedding?
