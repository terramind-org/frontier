  \item[\hypertarget{source:2306103:1}{S1}] ULAM.AI and the UnsolvedMath Contributors, UnsolvedMath: A Curated Collection of Open Mathematics Problems, record 2306103 (AMR-022-6103). CC BY 4.0. \url{https://huggingface.co/datasets/ulamai/UnsolvedMath}.
  \item[\hypertarget{source:2306103:2}{S2}] W. K. Hayman and E. F. Lingham, Research Problems in Function Theory (2018), Problem 6.103, complete problem and update, harmonic-class notation preceding Problem6.103. \url{https://arxiv.org/abs/1809.07200}.
  \item[\hypertarget{source:2306103:3}{S3}] S. Ponnusamy and A. Sairam Kaliraj, On the Coefficient Conjecture of Clunie and Sheil-Small on Univalent Harmonic Mappings (2014), Section1, pp.1--2, definitions of $S_H$, $S_H^0$, and harmonic Jacobian. \url{https://arxiv.org/abs/1403.5619}.
  \end{description}
