title: An intrinsic level-4 obstruction and a discriminant sieve
field: mathematics
tier: prose
statement: |-
  1. For $p\mid N$, $X^{\mathrm{dyn}}(N)$ has bad reduction at $p$ for the standard model, but evidence suggests there exists a different model with good reduction. Is this true? If not, why not? Is there a ``reason'' for this to be true?
  2. (Silverman) In general, what are the primes of bad reduction and why?
