title: Kourovka Notebook Problem 19.26
field: mathematics
tier: prose
statement: |-
  (Y. O. Hamidoune).
  Suppose that $A$ and $B$ are finite subsets of a group $G$
  such that $\vert A \vert \ge 2$ and $\vert B \vert \ge 2$, and let
  $A\cdot_2B$ denote the set of elements of $G$ which can be expressed in the form
  $ab$ for at least two different $(a,b) \in A \times B$. Is it true that
  $\vert A \vert + \vert B \vert - (1/2) \vert AB \vert - (1/2) \vert A\cdot_2B\vert
  \le \max\{2, \vert gH \vert : H \le G,\; g \in G,\; gH \subseteq A\cdot_2B\}$?

  This is proved if $G$ is abelian.
