title: Uniqueness for Symmetric Cone-Volume Measures
field: mathematics
tier: prose
statement: For origin-symmetric convex bodies $K$ and $C$ with equal volume and cone-volume measures $V_K=V_C$, must there be direct-sum decompositions $K=K_1\oplus\cdots\oplus K_m$ and $C=C_1\oplus\cdots\oplus C_m$ with $K_i=\lambda_i C_i$ for some $\lambda_i>0$?
