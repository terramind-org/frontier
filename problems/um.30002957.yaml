title: Delaunay Simplices in Flag Complexes of Random Triangulations
field: mathematics
tier: prose
statement: For a Poisson point process in $\mathbb R^d$ with Delaunay triangulation $T$, form the flag complex of the $1$-skeleton of $T$. How many $d$-simplices, and more generally how many $k$-simplices for $k\leq d$, of this flag complex are Delaunay?
