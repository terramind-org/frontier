title: Real Rational Maps with Exclusively Real Periodic Points
field: mathematics
tier: prose
statement: For $d\geq2$, let $\mathcal R_d$ be the set of real morphisms $\phi:\mathbb P^1\to\mathbb P^1$ of degree $d$ whose periodic points are all real. The existence question has an affirmative answer via Chebyshev maps; does $\mathcal R_d$ have full dimension, equivalently nonempty interior, in the space of real degree-$d$ morphisms?
