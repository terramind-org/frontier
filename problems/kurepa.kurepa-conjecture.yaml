schema: 1
id: kurepa.kurepa-conjecture
title: Kurepa's conjecture
field: mathematics
tier: proof
statement: |-
  ## Kurepa's conjecture

  For all $n$, $$!n\not\equiv 0 \mod n$$

  This appears as B44 "Sums of factorials."
  in [Unsolved Problems in Number Theory](https://doi.org/10.1007/978-0-387-26677-0)
  by *Richard K. Guy*
ams:
  - 11
tags:
  - paper
references:
  - label: On the left factorial function !N
    url: https://oeis.org/A3422
  - label: Unsolved Problems in Number Theory
    url: https://doi.org/10.1007/978-0-387-26677-0
