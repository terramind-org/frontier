title: Galois Images in Genus-Two Real-Multiplication Families
field: mathematics
tier: prose
statement: |-
  For the family of genus-$2$ curves

  $$C_t:\quad y^2=x^5-5x^3+5x+t,$$

  which has real multiplication by $\mathbb Z[(1+\sqrt5)/2]$, in what sense is this one-dimensional family special inside the two-dimensional real-multiplication moduli space? Which level structure does it fix, can an exceptional integer $N$ make its mod-$N$ Galois image smaller than expected, and what is the image on the Tate module?
