title: Kourovka Notebook Problem 20.117
field: mathematics
tier: prose
statement: |-
  Let $G$ be a pro-$p$ group that is a 3-dimensional Poincar\'e duality group. Is $G$ coherent?

  A group is said to be *coherent* if each of its finitely generated subgroups is finitely presented, and in the question the coherency is used in the pro-$p$ sense. The question is a famous problem for abstract groups, but has a positive answer for 3-manifold groups.
