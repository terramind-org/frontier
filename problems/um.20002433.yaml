title: Chern--Ricci flow on the standard Hopf surface
field: mathematics
tier: prose
statement: |-
  The *Chern--Ricci curvature* of a Hermitian metric $g$ is
  \[
  R^{\mathcal{Ch}}_{\bar k j}=-\partial_j\partial_{\bar k}\log\det(g),
  \]
  and the Chern--Ricci flow is
  \[
  \frac{\partial}{\partial t}g_{\bar k j}=-R^{\mathcal{Ch}}_{\bar k j}.
  \]
  What is its behavior on the simplest Hopf surface,
  \[
  \mathbb (\mathbb C^2\setminus\{0\})/\big((z_1,z_2)\sim(2z_1,2z_2)\big)?
  \]
