title: Localization of Types in Bruhat–Tits Buildings
field: mathematics
tier: prose
statement: Let $G$ be a connected reductive $p$-adic group, let $\mathcal B(G)$ be its Bruhat–Tits building, and let $x\in\mathcal B(G)$. For the finite-length representation $\tau(y,g)$ arising in the Mackey decomposition of a type, is there a bounded convex neighborhood $\Gamma$ of $x$, containing $\mathcal B(G)^H$, such that every geodesic $[x,z]$ with $z\notin\Gamma$ meets either $$\operatorname{proj}_0^{-1}(\mathcal B(G^0)\setminus\{x\})$$ or $$\Omega_{t+}\setminus(\Omega_{t+}\cap\Xi_t)\quad\text{for some }0<t<s_0,$$ thereby excluding additional types far from $x$?
ams: []
