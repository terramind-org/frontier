title: Open Problems in Topological Algebra — Problem 7 (Protasov)
field: mathematics
tier: prose
statement: |-
  Does every zero-dimensional compact
  homogeneous space admit the structure of a left topological group? (This problem was answered in negative by Banakh in [T.Banakh, *A homogeneous first-countable zero-dimensional compactum failing to be a left-topological group*, Mat. Stud.29 (2008) 215--217].)
  In particular, does the countable power $K^\omega$ of a
  first-countable zero-dimensional compact space $K$ admit the
  structure of a left topological group?
