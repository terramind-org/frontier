title: Sparse Graph Sequences with Prescribed Homomorphism Limits
field: mathematics
tier: prose
statement: For a graph $F$ and a graph $G$ of edge density $p$, define $$t_p(F,G)=p^{-e(F)}|G|^{-|F|}\operatorname{hom}(F,G).$$ Can one construct graphs $G_n$ with $|G_n|\to\infty$ and edge densities $p_n=|G_n|^{-o(1)}$ such that $a_F=\lim_{n\to\infty}t_{p_n}(F,G_n)$ exists for every $F$, while $$a_{C_4}=a_{K_3}=1,\qquad \sup_F a_F^{1/e(F)}<\infty,$$ and $a_F\neq1$ for at least one graph $F$?
