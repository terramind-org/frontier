title: Constraint pivots, canonical orthogonal bases, and a dual-lacunary Padé equivalence
field: mathematics
tier: prose
statement: |-
  Consider a subspace \(S\) of \(\mathbb C[x]\) of codimension \(k\) (defined by \(k\) linear constraints, explicitly given). Given a scalar product on \(\mathbb C[x]\), find an orthogonal basis of \(S\) (ordered by degree); some degrees will be missing.
  1. Which degrees get skipped?
  2. Characterize these orthogonal polynomials.
  3. Does this have anything to do with lacunary Padé approximants?
