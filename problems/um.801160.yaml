title: Nijenhuis Geometry and Integrable Systems — Problem 13
field: mathematics
tier: prose
statement: |-
  \begin{Problem}
  As we mentioned above, geometric Poisson brackets of order 3 are essentially the same as Killing tensors whose covariant derivative satisfies a certain relation, and certain Forbenius manifolds were used to construct such Killing tensors. Does there exists a construction of a Killing tensor by a Frobenius manifold?
  \end{Problem}

  Can two different Poisson structures of order 3, one of which is not Darboux-Poisson, be compatible?
