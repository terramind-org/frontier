title: Holomorphic Symplectic Geometry — Question 3
field: mathematics
tier: prose
statement: |-
  Thus the subalgebra $\mathcal{H}$ is completely determined by the form $q$ and the dimension of $X$. In contrast, not much is known about the $\mathcal{H}$-module $\mathcal{H}^\perp$. Note that it is nonzero for the examples $a)$ and $b)$ of 1.2, with the exception of $S^{[2]}$ for a K3 surface $S$.
  We do not know much about the quadratic form $q$ either. For the two infinite series of (1.2) we have lattice isomorphisms [B1]
  \[H^2(S^{[r]},\mathbb{Z})=H^2(S,\mathbb{Z}) \buildrel {\scriptscriptstyle\perp}\over {\oplus} \langle 2-2r\rangle\qquad H^2(K_r(T),\mathbb{Z})=H^2(T,\mathbb{Z}) \buildrel {\scriptscriptstyle\perp}\over {\oplus} \langle -2-2r\rangle\ ;
  \]
  The lattices of O'Grady's two examples are computed in [R]; they are also even.

  Is the quadratic form $q$ always even? More generally, what are the possibilities for $q$? What are the possibilities for the Fujiki index $f_X$ (see $1.3$)?
