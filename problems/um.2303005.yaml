title: Research Problems in Function Theory — Problem 3.5
field: mathematics
tier: prose
statement: "Suppose that $u(z)$ is positive and subharmonic in $\\mathbb{D}$, and that there exists a series of arcs $\\gamma_n$ tending to the arc $\\alpha\\leq\\theta\\leq\\beta$ of $|z|=1$, such that $$ u(z)\\leq M,\\hspace{1cm} z\\text{ on }\\gamma_n,\\hspace{1cm} n=1,2. $$ If in addition, $$ \\int^1_0(1-r)u(re^{i\\theta})\\,d\\theta<+\\infty, $$ for a set $E$ on $\\theta$, which is dense in the interval $(\\alpha, \\beta)$, then Maclane proved that $u(re^{i\\theta})$ is uniformly bounded for \\[\\alpha+\\delta\\leq\\theta\\leq\\beta-\\delta, \\hspace{1cm}0\\leq r<1,\\] and any fixed positive $\\delta$. These conclusions thus hold in particular, if $$ \\int^1_0(1-r)B(r,u)\\,dr<+\\infty. $$ Can the growth conditions ([source label: 3.3]) and ([source label: 3.4]) be weakened without weakening the conclusions?"
