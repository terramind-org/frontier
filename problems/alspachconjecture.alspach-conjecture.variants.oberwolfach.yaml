lean:
  module: FormalConjectures.Wikipedia.AlspachConjecture
  decl: AlspachConjecture.alspach_conjecture.variants.oberwolfach
  statement: |-
    theorem alspach_conjecture.variants.oberwolfach :
        ∀ (n : ℕ), Odd n → 3 ≤ n →
          ∀ (F : SimpleGraph (Fin n)) [DecidableRel F.Adj], (∀ v, F.degree v = 2) →
          IsEmpty (F ≃g oberwolfachException9) → IsEmpty (F ≃g oberwolfachException11) →
          ∃ D : Fin ((n - 1) / 2) → SimpleGraph (Fin n),
            (∀ i, Nonempty (D i ≃g F)) ∧
            ∀ u v, (completeGraph (Fin n)).Adj u v ↔ ∃! i, (D i).Adj u v
  context:
    - open AlspachConjecture
    - open AlspachConjecture.alspach_conjecture
    - open AlspachConjecture.alspach_conjecture.variants
    - open SimpleGraph Finset
    - "variable {V : Type*} [Fintype V] [DecidableEq V]"
  definitions:
    - name: AlspachConjecture.oberwolfachException9
      kind: def
      text: |-
        /-- The exceptional Oberwolfach $2$-factor `C₄ + C₅` on nine vertices. -/
        def oberwolfachException9 : SimpleGraph (Fin 4 ⊕ Fin 5) :=
          cycleGraph 4 ⊕g cycleGraph 5
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/AlspachConjecture.lean#L166
    - name: AlspachConjecture.oberwolfachException11
      kind: def
      text: |-
        /-- The exceptional Oberwolfach $2$-factor `C₃ + C₃ + C₅` on eleven vertices. -/
        def oberwolfachException11 : SimpleGraph ((Fin 3 ⊕ Fin 3) ⊕ Fin 5) :=
          (cycleGraph 3 ⊕g cycleGraph 3) ⊕g cycleGraph 5
      url: https://github.com/google-deepmind/formal-conjectures/blob/6751c0f043985ac6647db28a45a63afdf21acffe/FormalConjectures/Wikipedia/AlspachConjecture.lean#L170
