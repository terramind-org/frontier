title: Open Problems in Pluripotential Theory — Question 23
field: mathematics
tier: prose
statement: |-
  [Blocki-Dinew]
  Let $u$ be a plurisubharmonic function in a smooth strictly pseudoconvex bounded domain
  $\Omega \subset {\mathbb{C}}^n$. Assume $u \in {\mathcal{C}}^{1,\alpha}(\Omega),\alpha>1-\frac2n$ and
  $$
  (dd^c u)^n=f dV,
  $$
  with $f$ smooth and bounded away from zero $f \geq \varepsilon >0$. Is $u$ automatically smooth ?
