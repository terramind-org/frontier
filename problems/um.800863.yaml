title: Open Problems in Algebraic Statistics — General Problem 2
field: mathematics
tier: prose
statement: |-
  This particular open problem appears in [ASCB, Conjecture 3.24],
  and it here serves as a placeholder for the following broader direction of inquiry.

  *Study the geometry and commutative algebra
  of graphical models with hidden random variables.
  Construct these varieties by gluing familiar
  secant varieties, and by applying representation theory.*
