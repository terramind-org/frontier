lean:
  module: FormalConjectures.Wikipedia.LychrelNumbers
  decl: LychrelNumbers.no_lychrel_numbers_base10
  statement: |-
    theorem no_lychrel_numbers_base10 :
        ∀ n : ℕ, 0 < n → ¬ IsLychrel10 n
  context:
    - open LychrelNumbers
  definitions:
    - name: LychrelNumbers.IsLychrel10
      kind: def
      text: |-
        /-- The number $n$ is a (base-10) Lychrel number if no iterate of the Lychrel process is a palindrome. -/
        def IsLychrel10 (n : ℕ) : Prop :=
          ∀ k : ℕ, ¬ IsPalindrome10 (lychrelStep^[k] n)
      url: https://github.com/google-deepmind/formal-conjectures/blob/86a2f58a4d7a3a0637d15d5b2ce627592b54b956/FormalConjectures/Wikipedia/LychrelNumbers.lean#L64
