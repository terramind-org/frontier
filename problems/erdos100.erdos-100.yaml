lean:
  module: FormalConjectures.ErdosProblems.«100»
  decl: Erdos100.erdos_100
  statement: |-
    theorem erdos_100 :
        ∃ C > (0 : ℝ), ∀ᶠ n in atTop, ∀ A : Finset ℝ²,
          A.card = n →
          DistancesSeparated A →
          diam (A : Set ℝ²) > C * n
  context:
    - open Erdos100
    - open Set Metric Filter Real
    - open scoped EuclideanGeometry
  definitions:
    - name: Erdos100.DistancesSeparated
      kind: def
      text: |-
        /-- If two distances in A differ, they differ by at least 1. -/
        def DistancesSeparated (A : Finset ℝ²) : Prop :=
          ∀ p₁ q₁ p₂ q₂, p₁ ∈ A → q₁ ∈ A → p₂ ∈ A → q₂ ∈ A →
            dist p₁ q₁ ≠ dist p₂ q₂ →
            |dist p₁ q₁ - dist p₂ q₂| ≥ 1
      url: https://github.com/google-deepmind/formal-conjectures/blob/d8d031d4998c78575159ccab9a7a9e95ce043883/FormalConjectures/ErdosProblems/100.lean#L36
