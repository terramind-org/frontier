  decl: Erdos100.erdos_100
  statement: |-
    theorem erdos_100 :
        ∃ C > (0 : ℝ), ∀ᶠ n in atTop, ∀ A : Finset ℝ²,
          A.card = n →
          DistancesSeparated A →
          diam (A : Set ℝ²) > C * n
