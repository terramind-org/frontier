title: Seshadri Constants of Line Arrangement Singularities
field: mathematics
tier: prose
statement: Let $x_1,\ldots,x_r$ be the singular points of a line configuration in $\mathbb{P}^2$, and let $k$ be the maximum number of these points on one line. Must the multipoint Seshadri constant $\varepsilon(\mathcal{O}_{\mathbb{P}^2}(1);x_1,\ldots,x_r)$ equal $1/k$?
