title: Question — Which Artin groups admit non-geometric embeddings into M (S)?
field: mathematics
tier: prose
statement: Which Artin groups admit non-geometric embeddings into M (S)? If we do not require the homomorphism to be geometric we do not need to restrict the question to small Artin groups. In view of the third part of lemma 2 it is easy to embed some Artin groups with some mi,j =∞ so we should restrict the question to Artin groups with finite exponents mi,j. One example is very simple. The group Bn similar to An with the first edge of the Dynkin diagram having the label 4, maps into An if we send the first generator of Bn onto the square of the first generator of An. The twists T 2 α1 and Tα2 satisfy T 2 α1Tα2T 2 α1Tα2 =Tα2T 2 α1Tα2T 2 α1. Any other Artin group of finite type maps into E8 in a similar way. The generators map onto products of powers of small number of twists. We can call such homomorphisms almost geometric. These are the only almost geometric homomorphisms which I know.
