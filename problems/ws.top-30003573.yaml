  \section{Kobayashi Pseudometric Vanishing on Calabi–Yau Manifolds}\label{30003573}
  {\small UnsolvedMath ID 30003573 · Algebraic Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Does the Kobayashi pseudometric vanish identically on every compact Calabi–Yau manifold? In particular, must every such manifold be Kobayashi non-hyperbolic and contain an entire curve?
  \par\smallskip\textit{Formulation references:} \sref{30003573}{1}, \sref{30003573}{2}.
  \subsection{Short English statement}
  Does the Kobayashi pseudometric vanish identically on every compact Calabi–Yau manifold? In particular, must every such manifold be Kobayashi non-hyperbolic and contain an entire curve?
