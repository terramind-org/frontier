title: Dual Recovery of Binary Tomography Solution Intersections
field: mathematics
tier: prose
statement: |-
  Let $A\in\mathbb R^{m\times n}$, let $x\in\{-1,1\}^n$ produce noiseless data $y=Ax$, and let $\mu^*$ minimize
  $$
  \frac12\lVert\mu-y\rVert_2^2+\lVert A^T\mu\rVert_1.
  $$
  With $\widehat x=\operatorname{sign}(A^T\mu^*)$, must $\widehat x$ recover $x$ whenever the binary tomography problem has a unique solution? When it has multiple solutions, does the dual solution recover the coordinates common to all of them?
