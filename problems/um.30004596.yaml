id: um.30004596
title: Poisson Variance Inequalities for Arbitrary Stopping Sets
field: mathematics
tier: prose
statement: Let $\eta$ be a Poisson process with intensity measure $\lambda$, let $\eta'$ be an independent copy, and let $Z$ be an arbitrary stopping set. Prove $\mathbb E|f(\eta)-f(\eta')|\leq 2\int\mathbb P(x\in Z)\mathbb E|D_xf(\eta)|\,\lambda(dx)$; equivalently, for $\{0,1\}$-valued $f$, prove $\operatorname{Var}(f(\eta))\leq\int\mathbb P(x\in Z)\mathbb E|D_xf(\eta)|\,\lambda(dx)$.
