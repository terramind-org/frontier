title: The Lyapin's Notebook — Problem 11
field: mathematics
tier: prose
statement: |-
  (E.S. Lyapin)
  Describe all varieties of ordered semigroups that have covers in the lattice of varieties of ordered semigroups. \\
  Some such varieties are described in works [Mak2], [Mak3]. In the lattice of varieties of ordered semigroups, not every variety has a cover (see [Mak2]).
