title: Reducibility and Manifold Realization of Finite Poincaré Complexes
field: mathematics
tier: prose
statement: Let $\Gamma$ be a virtual Poincaré-duality group of cohomological dimension $k$ whose Farrell cohomology is periodic of period $n+1$, and let $X$ be the resulting finite Poincaré complex of dimension $n+k$ with $\pi_1(X)\cong\Gamma$ and $\widetilde X\simeq S^n$. Is the Spivak normal fibration of $X$ reducible? Is $X$ homotopy equivalent to a closed manifold?
