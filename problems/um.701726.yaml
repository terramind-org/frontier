title: Kourovka Notebook Problem 20.68
field: mathematics
tier: prose
statement: The *submonoid membership problem* for a group $G$ generated by an alphabet $A$ asks, for given words $x_1, x_2, \dots , x_n$ and a word $w$ over $A$, whether $w$ belongs to the submonoid of $G$ generated by the $x_i$. Does there exist a hyperbolic one-relator group with undecidable submonoid membership problem?
