title: Coordinate-skeleton curves, transverse coinvariant algebras, and the cohomological-dimension gap
field: mathematics
tier: prose
statement: |-
  Let \(k\) be a field, \(R=k[x_1,\ldots,x_n]\), and let \(I\subset R\) be a
  radical ideal whose minimal primes all have height \(n-1\).  Must there
  exist \(f_1,\ldots,f_{n-1}\in R\) such that
  \[
      \sqrt{(f_1,\ldots,f_{n-1})}=I?
  \]
