title: Sharp Neumann eigenvalue ratios and an all-index ordered-simplex family
field: mathematics
tier: prose
statement: |-
  Let \(\Omega\subset\mathbb R^n\) be a nonempty bounded open convex set, and list the Neumann eigenvalues, with multiplicity, as
  \[
  0=\mu _0(\Omega)<\mu _1(\Omega)\leq\mu _2(\Omega)\leq\cdots.
  \]
  Then
  \[
  \tag{a}\frac{\mu _2(\Omega)}{\mu _1(\Omega)}\leq4,
  \qquad
  \tag{b}\frac{\mu _k(\Omega)}{\mu _1(\Omega)}\leq k^2.
  \]
