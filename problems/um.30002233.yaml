title: Surjectivity on Component Groups of Semistable Curves
field: mathematics
tier: prose
statement: Let $f:X'\to X$ be a finite morphism of smooth, proper, geometrically connected curves over $K$, with induced map $f_*:\Phi_{X'}\to\Phi_X$. Is $f_*$ surjective when the minimal regular model of $X'$ consists of two rational components meeting transversally and $X$ is a Mumford curve of genus at least $2$?
