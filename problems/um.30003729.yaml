statement: For randomly perturbed periodic coercive Hamilton–Jacobi equations, determine the behavior of the perturbed ergodic constant $\overline H^\eta$ in general settings, especially the asymptotics of $\eta^{-1}(\overline H^\eta-\overline H)$ as $\eta\to0$.
