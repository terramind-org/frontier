title: Exact incidence and complete-intersection interpolation
field: mathematics
tier: prose
statement: |-
  **Problem 32.** Fix (d,g). Let (H\subset \operatorname{Hilb}_{d,g}(\mathbf P^3)) be an irreducible component. What is the largest number of points in general position you can make these curves pass through?

  **Remark.** This is a hard problem. If the curves are arithmetically Cohen--Macaulay, it should be treatable.
