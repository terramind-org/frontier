title: Questions in Geometric Group Theory — Q 5.1
field: mathematics
tier: prose
statement: |-
  **Q 5.1. (Jim Anderson)** If $G$ is a group of isometries of $\mathbb{H}^n$, denote by
  $\mathrm{Ax}(G)$ the set of axes of the elements of $G$. If $G_1$ and $G_2$ are finitely
  generated and discrete, does $\mathrm{Ax}(G_1) = \mathrm{Ax}(G_2)$ imply that $G_1$ and $G_2$
  are commensurable?
