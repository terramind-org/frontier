title: Virtual-knot problem 1 — Recognising the Kishino Knot
field: mathematics
tier: prose
statement: |-
  Recognising the Kishino Knot: There have been invented many
  ways to recognize the Kishino virtual knot (from the unknot): The
  $3$–strand Jones polynomial, i.e. the Jones polynomial of the
  $3$–strand cabling of the knot , the $\Xi$–polynomial,
  see , the quaternionic biquandle , and the
  surface bracket polynomial (Dye and Kauffman ).
  In Kadokami proves the knot is non-trivial by
  examining the immersion class of a shadow curve in genus two. One
  can use the Manturov parity bracket to
  show that essentially the flat Kishino diagram is its own invariant,
  exhibiting the non-triviality of this knot. See for
  an exposition of this proof.

  Are we done with this knot? Perhaps not. Other proofs of its
  non-triviality may be illuminating. The fact that the Kishino
  diagram is non-trivial and yet a connected sum of trivial virtual
  knots suggests the question: Classify when a non-trivial
  virtual knot can be the connected sum of two trivial virtual knots.
  A key point here is that the connected sum of closed virtual knots
  is not well defined and hence the different choices give some
  interesting effects. With long virtual knots, the connected sum is
  ordered but well-defined, and the last question is closely related
  to the question of classifying the different long virtual knots
  whose closures are equivalent to the unknot.
