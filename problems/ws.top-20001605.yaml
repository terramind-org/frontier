  \section{Finitely presented infinite simple amenable groups}\label{20001605}
  {\small UnsolvedMath ID 20001605 · Group Theory}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Does there exist an infinite simple amenable group that is finitely presented? A finitely generated example alone is insufficient. The source also proposes the derived subgroup of the full group of the Penrose tiling as a possible construction to test for these properties.
  \par\smallskip\textit{Formulation references:} \sref{20001605}{1}, \sref{20001605}{2}.
  \subsection{Short English statement}
  Does there exist an infinite simple amenable group that is finitely presented? A finitely generated example alone is insufficient. The source also proposes the derived subgroup of the full group of the Penrose tiling as a possible construction to test for these properties.
