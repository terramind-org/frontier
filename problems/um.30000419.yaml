title: Normality Probability of Intermediate-Density Random Graphs
field: mathematics
tier: prose
statement: Let $G\sim G(n,p)$, where the edge probability stays bounded away from both $0$ and $1$ as $n\to\infty$. A graph is normal if it admits a clique cover $\mathcal{Q}$ and a stable-set cover $\mathcal{S}$ such that every member of $\mathcal{Q}$ intersects every member of $\mathcal{S}$. Determine the asymptotic probability that $G$ is normal.
