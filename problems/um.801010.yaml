title: Open Problems in Mathematical Logic — Problem 22
field: mathematics
tier: prose
statement: |-
  Maximal cofinitary groups have been studied by Bart Kastermans in [Kas]. It is known that maximal cofinitary groups cannot be $K_\sigma$, abelian, and there is a coanalytic maximal cofinitary group if assuming the axiom of constructibility. So we can ask similar questions for maximal finitely periodic groups:

  Is there a countable or $K_\sigma$ or just Borel maximal finitely periodic group?
