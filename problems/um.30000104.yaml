title: Brauer Obstructions to Rational Sections
field: mathematics
tier: prose
statement: Let $f:Y\to S$ be a dominant projective morphism with $S$ a surface and with rationally $1$-connected generic fiber $Y_{k(S)}$. Is there a class $\alpha\in\operatorname{Br}(k(S))$ such that, for every dominant morphism of surfaces $S'\to S$, one has $Y(k(S'))\ne\varnothing$ if and only if $\alpha|_{k(S')}=0$?
