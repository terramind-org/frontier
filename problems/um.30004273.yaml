title: Self-Adjointness Across Almost-Riemannian Tangency Points
field: mathematics
tier: prose
statement: |-
  When an almost-Riemannian singular set has tangency points, is the Laplace–Beltrami operator on the regular region essentially self-adjoint? In particular, does this hold on $\mathbb R^2$ for

  $$X_1=\partial_x,\qquad X_2=(z-x^2)\partial_z,$$

  whose singular set is $z=x^2$?
