title: Measurability Assumption in the Prikry Extension Theorem
field: mathematics
tier: prose
statement: Let $\mathrm{SC}(\kappa)$ assert that $\kappa$ is strongly inaccessible and that $\{x\in[\kappa^+]^{<\kappa}:\operatorname{otp}(x)\text{ is a cardinal}\}$ is stationary. Assuming GCH and $\mathrm{SC}(\kappa)$, can one obtain a Prikry extension satisfying $\neg\square_{\aleph_\omega,<\omega}$ without assuming that $\kappa$ carries a normal measure?
