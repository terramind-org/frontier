title: Product-Free Sets in Symmetric and Alternating Groups
field: mathematics
tier: prose
statement: For a permutation group $G$ and an integer $k$, determine the maximum density $m_k(G)$ of a $k$-product-free subset. In particular, determine $m_k(\operatorname{Sym}(n))$ and $m_k(\operatorname{Alt}(n))$ in the unresolved ranges of $k$.
