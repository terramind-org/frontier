statement: Let \(X\) be a smooth variety over a number field \(K\), let \(S\) be a finite set of places, and assume that \(X\) satisfies strong approximation outside \(S\). If \(Z\subset X\) is closed of codimension two, must \(X\setminus Z\) satisfy strong approximation outside \(S\)? Is the set of \(S\)-integral points Zariski dense?
