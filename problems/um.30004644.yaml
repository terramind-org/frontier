title: Local-Global Density of Galois Cover Specializations
field: mathematics
tier: prose
statement: |-
  Let $E/\mathbb Q(T)$ be a $\mathbb Q$-regular Galois extension with group $G$ and genus $g\geq2$. Does
  $$
  \frac{|\operatorname{Sp}(E)\cap S(G,x)|}{|\operatorname{Sp}(E)^{\mathrm{loc}}\cap S(G,x)|}\longrightarrow0
  $$
  as $x\to\infty$?
