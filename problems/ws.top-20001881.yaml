  \section{No conjugate points: flat-growth rigidity and the three-dimensional residue}\label{20001881}
  {\small UnsolvedMath ID 20001881 · Geometry}
  \subsection{Definitions and mathematical statement}
  If a Riemannian manifold has no conjugate points, must its underlying smooth manifold admit some Riemannian metric with nonpositive sectional curvature? The new metric need not be the original one.
  \subsection{Short English statement}
  If a Riemannian manifold has no conjugate points, must its underlying smooth manifold admit some Riemannian metric with nonpositive sectional curvature? The new metric need not be the original one.
