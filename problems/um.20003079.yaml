title: Affine realizations from balanced infinite Penner systems
field: mathematics
tier: prose
statement: |-
  **Problem.** Which mapping classes are realized by affine automorphisms on
  some translation surface?

  We can ask the same question, but for Penner's construction: Given a mapping
  class that is obtained by Penner's construction, does it fix some flat
  metric?
