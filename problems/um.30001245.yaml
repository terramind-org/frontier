title: Coloring $F$-Free Uniform Hypergraphs
field: mathematics
tier: prose
statement: For every fixed $k$-uniform hypergraph $F$, does a constant $c_F$ exist such that every $F$-free $k$-uniform hypergraph of maximum degree $\Delta$ has chromatic number at most $$c_F\left(\frac{\Delta}{\log\Delta}\right)^{1/(k-1)}$$?
