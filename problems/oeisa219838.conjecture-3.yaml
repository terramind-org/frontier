lean:
  module: FormalConjectures.OEIS.«219838»
  decl: OeisA219838.conjecture_3
  statement: |-
    theorem conjecture_3 (p : ℕ) (hp : p.Prime) :
        ∃ N : ℕ, ∀ n : ℕ, N ≤ n →
          ∃ x y : ℕ, 0 < x ∧ 0 < y ∧ x + y = n ∧
            Nat.Prime (((x * y) ^ p - 1) / (x * y - 1))
