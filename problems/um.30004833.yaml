title: Dimension Rigidity of Quantum Automorphism-Group Factors
field: mathematics
tier: prose
statement: For a finite-dimensional $C^*$-algebra $B$ equipped with its canonical trace, let $G^+(B)$ denote the compact quantum automorphism group of $B$, and let $L^\infty(G^+(B))$ be its associated von Neumann algebra. For $n = \dim B \geq 5$, does the von Neumann algebra isomorphism class of $L^\infty(G^+(B))$ depend only on $n$?
