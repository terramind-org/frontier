title: Entropy and Nondiagonal Asymptotic Pairs
field: mathematics
tier: prose
statement: Let an amenable countably infinite discrete group $\Gamma$ act expansively and algebraically on a compact metrizable space $X$. Is $h(\Gamma\curvearrowright X)>0$ equivalent to the existence of a nondiagonal asymptotic pair?
