title: Conjugacy, inner cosets, and a turbulence phase diagram
field: mathematics
tier: prose
statement: |-
  For a separable C*-algebra \(A\), what is the complexity of orbit
  equivalence relations associated to the action \(\mathrm{Aut}\left( A\right) \)
  on itself by conjugacy and to the action of \(\mathrm{Inn}\left( A\right) \)
  on \(\mathrm{\mathrm{Au}t}\left( A\right) \) by left translation? Are these
  action turbulent? How are they related to structural properties of \(A\)?
