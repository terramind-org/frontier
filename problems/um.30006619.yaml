title: Metric Properness of Wreath-Product Actions on Median Graphs
field: mathematics
tier: prose
statement: Let $G$ act properly on a median graph and let $N\trianglelefteq G$. If $G/N$ does not act metrically properly on any median graph, can the permutational wreath product $\mathbb{Z}_2\wr_{G/N}G$ nevertheless act metrically properly on a median graph? Characterize when proper median-graph actions of such wreath products can be upgraded to metrically proper actions.
