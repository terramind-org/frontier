title: Hirzebruch's 1954 Problem List — Problem 6
field: mathematics
tier: prose
statement: |-
  Consider the complex projective space $\mathbb{P}_n$ as a differentiable manifold with the usual differentiable structure. Determine all
  complex structures of $\mathbb{P}_n$. \mathrm{(See Problem 14.)} In particular (28*), determine all complex structures of $\mathbb{P}_n$
  which can carry a K\"ahler metric.
