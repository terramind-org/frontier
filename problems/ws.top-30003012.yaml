  % UnsolvedMath ID 30003012; source catalogue code OWR-13951-015
  \setcounter{section}{30003011}
  \section{Petty’s Projection-Body Conjecture}\label{30003012}
  {\small UnsolvedMath ID 30003012 · Geometry}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For every convex body $K\subset\mathbb{R}^d$ with $d\geq3$, is the affine invariant $P(K)=|\Pi K|/|K|^{d-1}$ minimized exactly by ellipsoids?
  \par\smallskip\textit{Formulation references:} \sref{30003012}{1}, \sref{30003012}{2}.
  \subsection{Short English statement}
  For every convex body $K\subset\mathbb{R}^d$ with $d\geq3$, is the affine invariant $P(K)=|\Pi K|/|K|^{d-1}$ minimized exactly by ellipsoids?
