  definitions:
    - name: OeisA120424.a
      kind: def
      text: |-
        /-- Half-Fibonacci sequence starting with $1, 3$. -/
        def a : ℕ → ℕ
          | 0 => 1
          | 1 => 3
          | n + 2 => f (a (n + 1)) + f (a n)
