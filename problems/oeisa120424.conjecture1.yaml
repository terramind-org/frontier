  module: FormalConjectures.OEIS.«120424»
  decl: OeisA120424.conjecture1
  statement: |-
    theorem conjecture1 :
        Filter.Tendsto (fun n : ℕ => ((Finset.filter (fun k => a k % 2 = 0) (Finset.range n)).card
            : ℝ) / (n : ℝ))
          Filter.atTop (nhds (1 / 2 : ℝ))
  context:
