title: Research Problems in Function Theory — Problem 9.4
field: mathematics
tier: prose
statement: "For each pair of $f,g\\in H^\\infty$, does there necessarily exist another pair of functions $a,b\\in H^\\infty$ such that $$ af+gb\\neq0,\\hspace{1cm}|z|<1\\,? $$ It is easy to see that a necessary condition for this is that $\\log(|f|-|g|)$ have a harmonic minorant. Is this condition also sufficient for ([source label: C9.1])? This problem is closely related to Problem 9.3. (B. A. Taylor; communicated by L. A. Rubel)"
