title: Problem 2.19 — (Canonical basepoints for Mg).
field: mathematics
tier: prose
statement: (Canonical basepoints for Mg). Find other properties of automorphisms or automorphism groups that determine a unique point of Mg. For example, is there a unique Riemann surface of genus g≥ 2 whose automorphism group is nilpotent, and is the largest possible order among nilpotent automorphism groups of genus g surfaces? A Hurwitz surface is a hyperbolic surface attaining the bound 84( g− 1). As the quotient of such a surface by its automorphism group is the (2, 3, 7) orbifold, which has a unique hyperbolic metric, it follows that for each g≥ 2 there are finitely many Hurwitz surfaces. As these are the surfaces of maximal symmetry, it is natural to ask precisely how many there are.
