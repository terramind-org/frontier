title: Classification of Noncommutative Hypersurfaces
field: mathematics
tier: prose
statement: Classify noncommutative hypersurfaces $\operatorname{qgr}(A/(f))\subseteq\operatorname{qgr}A$, where $A$ is Artin-Schelter regular and $f\in Z(A)$ is homogeneous, and describe their singularities and derived categories beyond the known quadratic and finite-over-the-center cases.
