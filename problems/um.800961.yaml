title: Open Problems and Questions about Geodesics — Question 42
field: mathematics
tier: prose
statement: |-
  *Does Frankel's Theorem remain true for Finsler manifolds? More precisely, must two closed
  totally geodesic submanifolds of a closed Finsler manifold
  with positive flag curvature intersect if the sum of their dimensions is at least the dimension of the ambient manifold? *
