title: Low-Randomness Constructions of Low-Discrepancy Point Sets
field: mathematics
tier: prose
statement: Can one construct, in time polynomial in $n$ and $d$, an $n$-point set $M_n\subset[0,1]^d$ with star discrepancy $O(\sqrt{d/n})$, or at least find a small subset of $[0,1]^{dn}$ guaranteed to contain such a set?
