title: A compact flat counterexample from odd holonomy
field: mathematics
tier: prose
statement: |-
  Suppose a closed manifold \((M,g)\) admits a nonzero \((1,1)\)-tensor field that is self-adjoint with respect to \(g\), parallel and nilpotent. Does this manifold or its double cover admit a nonzero light-like parallel vector field?

  It is transition text leading to Problem 12.0.4 on affinely equivalent Finsler metrics.

  The metric in Question 12.0.3 must be indefinite. For a positive-definite metric, a self-adjoint endomorphism is diagonalizable over the reals, so a nilpotent self-adjoint endomorphism is zero. Below “light-like” means nonzero and null.
