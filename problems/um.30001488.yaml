id: um.30001488
title: Submetries of Compact Ptolemy Spaces
field: mathematics
tier: prose
statement: "Let $X$ be a compact Ptolemy space satisfying these $R$-circle axioms: any two points lie on an $R$-circle; a fourth point satisfying Ptolemy equality with three points on an $R$-circle lies on that circle; closest-point projection to an $R$-circle is self-dual; and every Möbius map between $R$-circles extends to a Möbius automorphism of $X$. For every $\\omega\\in X$, does there exist a submetry $\\pi_\\omega:X\\setminus\\{\\omega\\}\\to B_\\omega$, where $B_\\omega$ is isometric to $\\mathbb R^k$, such that Möbius automorphisms induce compatible homotheties of the bases? The completed fibers $F\\cup\\{\\omega\\}$ should be $K$-circles homeomorphic to $S^p$, with $k+p=\\dim_\\partial X$, and satisfy: two distinct points determine a unique $K$-circle; a $K$-circle and an $R$-circle meet in at most two points; if $F\\cup\\{\\omega\\}$ is a $K$-circle and $x\\notin F\\cup\\{\\omega\\}$, a unique $R$-circle through $x$ and $\\omega$ meets $F$; and, for two distinct fibers $F,F'$ and two $R$-circles through $\\omega$ meeting $F,F'$, any third fiber that meets one of those $R$-circles also meets the other."
