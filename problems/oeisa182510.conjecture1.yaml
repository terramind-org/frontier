  definitions:
    - name: OeisA182510.a
      kind: def
      text: |-
        /-- Defining recurrence for $a(n)$. -/
        def a : ℕ → ℤ
          | 0 => 0
          | 1 => 1
          | n + 2 => Int.xor (a (n + 1)) (n + 2 : ℤ) - a n
