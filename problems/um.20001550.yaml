title: Largest actions from universally elliptic Deligne stabilizers
field: mathematics
tier: prose
statement: |-
  Is there a ``largest'' acylindrically hyperbolic space on which these Artin groups act that sees all loxodromic elements?

  The exact AIM record asks:

  It is Problem 4.5 in the “Non-positive curvature” section of the AIM workshop list *Geometry and topology of Artin groups*. The immediately preceding records ask whether all irreducible nonspherical Artin groups are acylindrically hyperbolic and ask for a description of the hyperbolic space. Thus the broad reading concerns irreducible nonspherical Artin groups for which acylindrical hyperbolicity is known or expected.

  There are two notions in the question that must be separated. In the terminology now standard after Abbott--Balasubramanya--Osin (ABO), “largest” means largest in the domination poset of **cobounded** acylindrical actions. “Sees all loxodromic elements” means **universal**: every element that is loxodromic in some acylindrical action is loxodromic in the chosen action. A largest action is universal, but universality alone does not prove largestness.

  The broad Artin-group question remains beyond what is proved here. The main result below gives a positive answer, with an explicit natural space, for the two-dimensional hyperbolic-type class studied by Martin--Przytycki under their finite-neighbor hypothesis.
