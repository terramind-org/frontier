title: Kourovka Notebook Problem 14.69
field: mathematics
tier: prose
statement: |-
  For every finite simple group find the minimum of
  the number of generating involutions satisfying an additional
  condition, in each of the following cases.

  a)
  The product of the generating involutions
  equals $1$.

  b) (Malle--Saxl--Weigel). All generating
  involutions are conjugate.

  c) (Malle--Saxl--Weigel). The conditions a) and
  b) are simultaneously satisfied.

  *Editors' comment:*
  partial progress was obtained in
  (J. Ward, PhD Thesis, QMW, 2009, http://www.maths.qmul.ac.uk/ raw/JWardPhD.pdf).

  d)
  All generating
  involutions are conjugate and two of them commute.
