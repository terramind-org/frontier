title: Collected Coarse-Geometric Embedding Problems
field: mathematics
tier: prose
statement: Does $L_p([0,1])$ embed coarsely into $\ell_p$? Does there exist a free measure-preserving action of a free group on a manifold whose warped cone admits a wall structure? Can one construct a slowly growing box space with bounded successive indices? For finite groups $\operatorname{SL}(n_m,\mathbb F_{p_m})$, do fixed-cardinality generating sets exist whose Cayley graphs form a superexpander family?
