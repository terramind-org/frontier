title: Extending A1-homotopy theory over a DVR
field: mathematics
tier: prose
statement: |-
  **Question 6 (Anastasia Stavrova).** Can \(\mathbb A^1\)-homotopy be extended over
  general smooth schemes, e.g. over a DVR? Else explain the issues.

  **Remark (Aravind Asok).** Many basic things fail, a specific example is the
  stable \(\mathbb A^1\)-connectivity theorem.
