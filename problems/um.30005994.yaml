title: Gradient-Constrained Ginzburg-Landau Minimizers
field: mathematics
tier: prose
statement: For $2\leq N\leq 6$, let $u_\varepsilon(x)=f_\varepsilon(|x|)x/|x|$ be the radial vortex solution on $B^N$. Is $u_\varepsilon$ the unique minimizer of the Ginzburg-Landau energy $G_\varepsilon$ over the gradient fields $\mathcal V=\{u=\nabla\phi:\phi\in H^2(B^N),\ \nabla\phi=\operatorname{Id}\text{ on }\partial B^N\}$?
