title: A fixed-polynomial Cartier-divisor bridge for the locally Cohen-Macaulay curve locus
field: mathematics
tier: prose
statement: |-
  Problem 9. Is the Hilbert scheme of local Cohen-Macaulay curves in $\mathbb P^3$ connected?

  Let $k$ be an algebraically closed field, fix integers $d>0$ and $g$, and let
  \[
  H_{d,g}\subset \operatorname{Hilb}^{P}(\mathbb P^3_k),\qquad P(n)=dn+1-g,
  \]
  be the open subscheme parametrizing locally Cohen--Macaulay curves (pure one-dimensional subschemes with no embedded or isolated zero-dimensional components). Whenever $H_{d,g}$ is nonempty, is it connected?
