title: Uniform Lower Bounds for Specialized Canonical Heights
field: mathematics
tier: prose
statement: Let $K$ be a number field and $f_t$ a non-isotrivial family of rational functions of generic degree $d\geq2$ over a curve $U$. Do there exist $\varepsilon>0$ and $N\geq0$ such that for every $t\in U(K)$, $\hat h_{f_t}(z)\geq\varepsilon h(t)$ for all but at most $N$ points $z\in\mathbb P^1(K)$?
