title: Exact block-update heights for finite-range and speed-change exclusion
field: mathematics
tier: prose
statement: |-
  Height functions associated to exclusion processes with longer range jumps, or environment dependent speed-changes.

  The exact AIM record is the one-line prompt:

  It is Problem 11.6 in the AIM workshop list *The Kardar-Parisi-Zhang equation and universality class*. I interpret it as asking both how to define the microscopic height beyond nearest-neighbor ASEP and how far its hydrodynamic/KPZ fluctuation theory has been established.

  “Environment dependent” is ambiguous. In the interacting-particle literature it may mean a translation-invariant rate depending on the nearby particle configuration (a speed-change process), or a rate depending on an external spatial environment. These are separated below. The exact height calculus applies to both, but their scaling theories are different.
