title: Complexity in Enumerative Combinatorics — Conjecture 1 (Wilf)
field: mathematics
tier: prose
statement: |-
  Now, for a *combinatorial sequence* $\{a_n\}$ one can ask if there is a
  Wilfian formula. In the original paper [Wilf] an explicit example is given:

  Let $a_n$ be the number of unlabeled graphs on $n$ vertices. Then $\{a_n\}$ has
  no Wilfian formula of type \textup{\small $($\textrm{W1}$)$}.
