title: Semiorthogonal Decompositions Along Extremal Contractions
field: mathematics
tier: prose
statement: Suppose a smooth Fano variety $X$ has extremal contractions to smooth Fano varieties $Y$ and $Z$. Do there exist semiorthogonal decompositions of $D^b(X)$ compatible with pullback from $Y$ and $Z$, with the two decompositions related by mutation?
