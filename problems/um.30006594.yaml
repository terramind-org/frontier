title: Relations Among Multiple Weierstrass Function Spaces
field: mathematics
tier: prose
statement: For the spaces $\mathcal P_k$ of multiple Weierstrass functions and Eisenstein-series spaces $\mathcal E_k$, prove that $C_n(\mathcal P_{k+n})=\mathcal E_k$ for all $k\geq 0$ and $n\geq 3$, and that $\frac{d}{dz}(\mathcal E\cdot\mathcal P)\subseteq\mathcal P$. Also prove $\mathcal E_k\cap\mathcal P_k=\Delta\mathcal E_{k-12}$ and $\mathcal E_k\cap(\mathcal P_{k-2}\wp_2)=\Delta\mathcal E_{k-14}\wp_2$.
