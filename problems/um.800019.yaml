title: The Lyapin's Notebook — Problem 19
field: mathematics
tier: prose
statement: |-
  (A.A. Borisov)
  Describe finitely generated commutative separative E-semigroups. \\
  It is proved in [Borisov4] that for a finitely defined commutative semigroup the problem of deciding whether
  the semigroup of all its endomorphisms (under pointwise multiplication) is Archimedean is algorithmically solvable.
