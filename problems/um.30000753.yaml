title: Finiteness of Nonsquare Diophantine Quadruples
field: mathematics
tier: prose
statement: If $n$ is not a perfect square, then there should be only finitely many $D(n)$-quadruples, where a $D(n)$-quadruple is a set of four positive integers such that $xy+n$ is a perfect square for every pair of distinct elements $x,y$.
