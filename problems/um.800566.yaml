title: Visibility Graphs of Points, Segments and Polygons — Problem 40
field: mathematics
tier: prose
statement: |-
  Two graphs $G_1 = (V_1, E_1)$ and $G_2 = (V_2, E_2)$ are *isomorphic* if and only if there
  is a bijection $f$ that maps vertices of $V_1$ to the vertices of $V_2$ such that an edge
  $(v, w) \in E_1$ if and only if the edge $(f(v), f(w)) \in E_2$. It has been shown
  by Ghosh [g-vap-07] that the number of *non-isomorphic* visibility graphs of
  simple polygons of $n$ vertices is
  at least $2^{n-4}$. On the other hand, a straightforward application of Warren's theorem
  [w-lbanm-68] shows that the number of visibility graphs is at most $2^{O(n\log n)}$
  [s-grep-03].

  Improve the lower and upper bounds on the number of *non-isomorphic* visibility graphs of
  simple polygons.
