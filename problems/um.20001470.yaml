title: The Small Bootstrap Problem and a separable-hull reduction
field: mathematics
tier: prose
statement: |-
  All presently known nuclear C*-algebras are obtained from $\mathbb C$ by
  taking closure under simple operations such as tensoring with
  finite-dimensional matrix algebras and taking inductive limits. They
  belong to the so-called bootstrap class.

  Does every nuclear C*-algebra belong to the
  bootstrap class?

  **Small Bootstrap Problem.** Is every separable nuclear C\*-algebra in Blackadar's Small Bootstrap Class $\mathsf B$?
