title: Kourovka Notebook Problem 15.28
field: mathematics
tier: prose
statement: |-
  Suppose that a finite $p $-group $G$ is the product of two
  subgroups: $G=AB$.

  a) Is the exponent of $G$ bounded in terms of the
  exponents of $A$ and $B$?

  b) Is the exponent of $G$ bounded if $A$ and $B$
  are groups of exponent $p$?
