title: Ultraproduct II_1 Factors — Problem 26
field: mathematics
tier: prose
statement: Does there exist a II$_1$ factor $N$ satisfying $h(N)=0$ but $N$ has continuum many sequential commutation orbits? Secondly does there exist a II$_1$ factor $N$ such that $h(N)=0$, and $N$ is not generated as a von Neumann algebra by a single sequential commutation orbit?
