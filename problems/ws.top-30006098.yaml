  \section{Neural Networks for High-Dimensional Optimal Feedback Control}\label{statement}

  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  Infinite-horizon optimal feedback minimizes the stated accumulated future cost using a state-dependent control. A complexity bound avoids the curse of dimensionality when its dimensional dependence is polynomial rather than exponential at the prescribed accuracy.
  \paragraph{Record scope and qualifications.}
  The catalogue title is retained as metadata. Named certificates, contracts, bounds or frameworks in that title are not asserted as results of the original source extract.
  The dynamics, running cost, discount or stabilization assumptions, approximation norm, and admissible controls are not specified.

  Source-record limitation: The optimal-control dynamics, cost, admissible actions, and accuracy/complexity criteria are absent.
  \paragraph{Statement recorded in the supplied source.}
  Determine when neural networks can solve high-dimensional infinite-horizon optimal feedback-control problems with rigorous accuracy, stability, and complexity guarantees that avoid the curse of dimensionality. \sref{statement}{2}
  \paragraph{Source status.}
  The supplied catalogue labels this source record partially solved; that metadata was checked against the supplied snapshot on 2026-10-11. The label is preserved for provenance and is not an independent verification of present open status or mathematical correctness. The catalogue literature assessment is dated 2026-08-22.
  \subsection{Short English statement}
  Solve high-dimensional infinite-horizon feedback problems with neural networks and rigorous error, stability, and complexity guarantees.
