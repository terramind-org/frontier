id: um.20002361
title: Bounded square-class width and sign-symmetric factorization in C(Z)
field: mathematics
tier: prose
statement: |-
  If \(x\in\mathbb C(Z)\), then
  \[
  \operatorname{ord}_{Z=0}\!\left(\frac{1+Zx^2}{1-Zx^2}\right)
  =\operatorname{ord}_{Z=\infty}\!\left(\frac{1+Zx^2}{1-Zx^2}\right)=0.
  \]
  Can every nonzero \(f\in\mathbb C(Z)\) for which
  \(\operatorname{ord}_{0}(f)\) and \(\operatorname{ord}_{\infty}(f)\)
  are even be written
  \[
  f=u^2\prod_{i=1}^{1000}\frac{1+Zx_i^2}{1-Zx_i^2},
  \qquad u,x_i\in\mathbb C(Z)?
  \]
  Is this at least true for \(f\in\mathbb Q(Z)\), while the witnesses
  \(u,x_i\) are still allowed to lie in \(\mathbb C(Z)\)?
