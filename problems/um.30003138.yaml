title: Extremal Graphs Maximizing Non-Triangular Edges
field: mathematics
tier: prose
statement: For integers $a,b,c\geq0$, define $G(a,b,c)$ on a vertex partition consisting of a clique $A$ of size $a$ and independent sets $B,C$ of sizes $b,c$, with all edges between $A$ and $B$ and between $B$ and $C$, and no edges between $A$ and $C$. For every $n$ and $e$, can an $n$-vertex graph with at least $e$ edges that maximizes the number of nontriangular edges always be chosen as some $G(a,b,c)$?
