id: um.30002654
title: K-Moduli and Minimal Fano Fillings
field: mathematics
tier: prose
statement: Consider families of Fano varieties with log-terminal singularities and a fibre-tangent holomorphic vector field $V$, with every pair $(X_t,V_t)$ modified K-semistable. Does their moduli functor admit a proper coarse algebraic moduli space $M$ parametrizing modified K-polystable Fano varieties, with Kähler connected components? Do the limits of the classes $L_{T,k}$ define a Kähler class, or an ample real line bundle $L_T$, on $M$? For a family over a punctured curve, does a modified K-polystable Fano filling minimize $\deg L_T$ among all Fano fillings?
