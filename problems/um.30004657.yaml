title: High-Order Variational Integrators for Degenerate Lagrangians
field: mathematics
tier: prose
statement: For general degenerate Lagrangians, can degenerate variational integrators be generalized to arbitrary order using Galerkin or Runge–Kutta discretizations; can they and symplectic Runge–Kutta methods be obtained without assuming any component of the symplectic potential vanishes; and do symplectic Runge–Kutta methods follow from a discrete variational principle?
