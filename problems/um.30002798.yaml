title: Extremal Fat-Point Initial Degrees and Star Configurations
field: mathematics
tier: prose
statement: Let $Z$ be a finite set of points in $\mathbb P^n$. If $d=\alpha(nZ)=\alpha(Z)+n-1$, must $Z$ either lie in a hyperplane or be the star configuration from $d$ general hyperplanes, with every degree-$d$ hypersurface vanishing to order $n$ on $Z$ splitting into those hyperplanes? In $(\mathbb P^1)^n$, if $d=\alpha(nZ)=\alpha(Z)$, must $Z$ be a $d$ by $\cdots$ by $d$ grid?
