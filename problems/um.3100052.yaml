title: Given any subset S of the integers modulo a prime p, what is the least K=K(p) for which there always exists an m so that
field: mathematics
tier: prose
statement: |-
  (Alon–Peres) Given any subset $S$ of the integers modulo a prime $p$, what is the least
  $K = K(p)$ for which there always exists an $m$ so that $mS$ has no gap of length greater
  than $K$? This question is particularly interesting if $S$ contains about half of the
  elements of $\mathbb{Z}_p$, since then it bears on questions concerning quadratic residues.
