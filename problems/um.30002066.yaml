title: Random Triangulations and Exchangeable Clique Complexes
field: mathematics
tier: prose
statement: Is there a polynomial-time algorithm that samples uniformly from closed $3$-manifold triangulations with $N$ tetrahedra, including under the restriction to triangulations of the $3$-sphere? Separately, for clique complexes of exchangeable random graphs, determine their homotopy groups and whether this random model is universal in an appropriate sense.
