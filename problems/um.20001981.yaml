title: All integer volume-growth exponents from flat hyperkähler quotients
field: mathematics
tier: prose
statement: "Let \\(M\\) be a connected noncompact hyperkähler manifold. Fix a point \\(p\\in M\\). Consider the open ball \\(B(p,r)\\) of radius \\(r\\) around \\(p\\) in \\(M\\). Describe the asymptotic behavior of \\(\\operatorname{Vol}(B(p,r))\\) as \\(r\\to\\infty\\). (Fact: this is independent of the choice of \\(p\\in M\\).) It would be interesting to search for examples of hyperkähler manifolds with different volume growth."
