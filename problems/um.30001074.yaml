title: Spanning-Tree Counts versus Triangulation Counts
field: mathematics
tier: prose
statement: For a finite planar point set $P$, let $\operatorname{tr}(P)$ and $\operatorname{st}(P)$ count its triangulations and crossing-free spanning trees. Does there exist $c>1$ such that $\operatorname{st}(P)\geq c^{|P|}\operatorname{tr}(P)$ for every sufficiently large $P$?
