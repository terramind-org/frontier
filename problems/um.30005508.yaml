title: Projective Characters and Square Roots in Real Blocks
field: mathematics
tier: prose
statement: Let $B$ be a real nonprincipal $2$-block with defect pair $(D,E)$, and let $(x,b)$ be a $B$-subsection whose defect pair is $(C_D(x),C_E(x))$ and whose block $b$ has unique projective indecomposable character $\Phi$. Prove that every $y\in G$ with $y^2=x$ satisfies $[\Phi_{C_G(y)},1_{C_G(y)}]=|y^{C_G(x)}\cap(E\setminus D)|$.
