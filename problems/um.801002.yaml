title: Open Problems in Mathematical Logic — Problem 14
field: mathematics
tier: prose
statement: |-
  \begin{definition}
  Let $F$ be a Borel field. A *Borel algebraically closed extension* of $F$ is a Borel field $K$, together with a Borel injective field homomorphism
  \[
  \iota:F\hookrightarrow K,
  \]
  such that $K$ is algebraically closed.
  \end{definition}

  [Montalb\'an--Nies {[MontalbanNies2013, Question 2.8]}]
  Does every Borel field have a Borel algebraically closed extension?
