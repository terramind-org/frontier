title: Kourovka Notebook Problem 17.34
field: mathematics
tier: prose
statement: |-
  Let $N_c$ be the quasivariety of nilpotent torsion-free groups of
  class at most $c$. Is it true that the dominion in $N_c$ (see the
  definition in 16.20) of a divisible subgroup in every group
  in $N_c$ is equal to this subgroup?
