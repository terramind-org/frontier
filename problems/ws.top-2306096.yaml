  \section{Research Problems in Function Theory — Problem 6.96}\label{2306096}
  {\small UnsolvedMath ID 2306096 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For a conformal map $f:\mathbb D\to\mathbb D$, let its integral-means exponent be
  \[\beta_f(p)=\limsup_{r\uparrow1}\frac{\log\int_0^{2\pi}|f'(re^{i\theta})|^p\,d\theta}{\log(1/(1-r))},\qquad B(p)=\sup_f\beta_f(p).\]
  Is the universal spectrum equal to $-p-1$ for $p\leq-2$, to $p^2/4$ for $-2\leq p\leq2$, and to $p-1$ for $p\geq2$?
  \par\smallskip\textit{Formulation references:} \sref{2306096}{1}, \sref{2306096}{2}.
  \subsection{Short English statement}
  For a conformal map $f:\mathbb D\to\mathbb D$, let its integral-means exponent be
  \[\beta_f(p)=\limsup_{r\uparrow1}\frac{\log\int_0^{2\pi}|f'(re^{i\theta})|^p\,d\theta}{\log(1/(1-r))},\qquad B(p)=\sup_f\beta_f(p).\]
  Is the universal spectrum equal to $-p-1$ for $p\leq-2$, to $p^2/4$ for $-2\leq p\leq2$, and to $p-1$ for $p\geq2$?
