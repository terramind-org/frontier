title: Finite-Dimensional Detection of Positivity in Surface Groups
field: mathematics
tier: prose
statement: For the fundamental group of every closed surface, is positivity of a Hermitian element in all unitary representations equivalent to positivity in all finite-dimensional unitary representations, and hence to membership in the cone of sums of Hermitian squares?
