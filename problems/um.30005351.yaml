title: Heavy Cycles in Eulerian Digraphs
field: mathematics
tier: prose
statement: Let $D$ be an Eulerian weighted digraph in which the total weight of edges leaving each vertex is at least $1$. Must $D$ contain a directed cycle of weight at least a universal positive constant? What stronger bound follows if $D$ is strongly $2$-connected?
