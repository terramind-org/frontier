title: Minimal Unique-Range Sets for Entire Functions
field: mathematics
tier: prose
statement: For a set $S\subset\mathbb C$, let $E(S,f)$ be the multiset of points at which $f$ takes a value in $S$, counted with multiplicity. What is the minimum cardinality of a finite $S$ such that $E(S,f)=E(S,g)$ for nonconstant entire functions $f$ and $g$ implies $f=g$?
