title: Kourovka Notebook Problem 17.100
field: mathematics
tier: prose
statement: |-
  *Conjecture*: A finite group is not
  simple if it has an irreducible complex character of odd degree
  vanishing on a class of odd length.

  If true, this implies the solvability of groups
  of odd order, so a proof independent of CFSG is of special
  interest.
