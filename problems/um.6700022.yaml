statement: 'Problem. Evaluate σ○(X0) and σ◻(X0) for "simple" Riemannian manifolds X0 = (X,g 0). ###◻Dirac operators, because they are invariant under isometries, often deliver optimal geometric inequalitiesfor manifolds withSc ≥σ. For instance, σ○(X0) and σ◻(X0) are equal toSc(X0) for many (conjecturally for all) compact symmetric spaces(X0), see sections 17, but this seems hard, if possible at all, to prove with minimal hypersurfaces. Even in the most transparent case, where we know by Llarull’s theorem, that if a smooth Riemannian metricg on X = Sn is greater than the spherical metricg (the diﬀerenceg−g is positive semideﬁnite) then there is a pointx∈X, where Sc(g)(x) ≤n(n−1) =Sc(Sn), there is no proof of this by means of minimal hypersurfaces forn≥3. (Maybe, such a proof is possible, it seems realistic forn = 3, but this is unlikely for complex and quaternionic projective spaces instead ofSn, where the Dirac operator works with no problem). On the other hand, there are incomplete manifoldsX0 where a sharp evaluation is possible by means of minimal hypersurfaces, but not by the Dirac operator methods, see section 21. Thomas Schick Example [1998].[105]. LetX =XSch be obtained from the n-torus Tn) by attaching the 2-handle to the circle representing the triplymultiple of one of the generators ofπ1(Tn). This is a spin Schoe-Yau-Schick manifold X for alln ≥4 with the fundamental groupsZn−1×Z/3Z, where all (known?'
