title: A sharp Galerkin GFF cancellation and an ultraviolet obstruction for 2D AKPZ
field: mathematics
tier: prose
statement: |-
  **Higher dimensions.** Make rigorous sense of the anisotropic KPZ equation
  \[
  \partial_t h=(\partial_xh)^2-(\partial_yh)^2+\Delta h+\xi
  \]
  and show that the Gaussian free field is invariant. Is there a way of getting this equation out of the 2d Schur process dynamics of Borodin--Ferrari? Or perhaps out of the 2d q-Whittaker process dynamics of Borodin--Corwin? Is this related to \(2d\) quantum Toda chain?
