title: Kourovka Notebook Problem 15.71
field: mathematics
tier: prose
statement: |-
  (B. Huppert). Let $G$ be a finite solvable group, and let $\rho(G)$
  denote the set of prime divisors of the degrees of irreducible
  characters of $G$. Is it true that there always exists an
  irreducible character of $G$ whose degree is divisible by at least
  $|\rho(G)|/2$ different primes?
