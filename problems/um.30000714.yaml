title: Pierce–Birkhoff Supremum-Infimum Representation Conjecture
field: mathematics
tier: prose
statement: Let $A=\mathbb R[x_1,\ldots,x_n]$ and let $f$ be a piecewise-polynomial function on $\mathbb R^n$. Must there be a finite family of polynomials $g_{ij}\in A$ such that $f(x)=\sup_i\inf_j g_{ij}(x)$ for every $x\in\mathbb R^n$?
