statement: (Topology of strata). Is it true that the connected components of the strata H(α) and of the strata Q(β) areK(π, 1)-spaces (i.e. their universal covers are contractible)? It is known [ KoZo], [ La] that the strata H(α) and Q(β) need not be connected. With the exception of the four strata listed below, there are intrinsic invariants that allow one to tell which component a given translation surface or quadratic diﬀerential belongs to. 15. Problems on billiards, flat surfaces and translation surfaces 257
