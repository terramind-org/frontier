id: oeisa167918.conjecture-infinite
title: Smallest index $k > n$ such that $(p_k+p_{k+1})/(p_n+p_{n+1})$ is an integer $\ge 2$ (conjecture_infinite)
field: mathematics
tier: proof
statement: |-
  Conjecture: the sequence is infinite, that is, for every $n \geq 1$ there is some $k > n$
  with $S(n) \mid S(k)$, so that $a(n)$ is defined.
