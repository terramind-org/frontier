title: Higher-Order Arf Invariants from Whitney Towers
field: mathematics
tier: prose
statement: Do the higher-order Arf invariants suggested by Whitney towers define well-defined link-concordance invariants? In the first test case, let $L=l_1\cup l_2$ be the Bing double of the figure-eight knot, bounding embedded disks $D_1,D_2\subset B^4$, with an immersed Whitney disk $W_{(1,2)}$ pairing the intersections of $D_1$ and $D_2$ and a Whitney disk $W_{((1,2),(1,2))}$ pairing the self-intersections of $W_{(1,2)}$. Does the single interior intersection of $W_{((1,2),(1,2))}$ with $W_{(1,2)}$ represent a nontrivial concordance invariant of $L$?
