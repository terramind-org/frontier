title: Invariant Dirichlet-Series Subspace Characterized by Zeta Divisibility
field: mathematics
tier: prose
statement: |-
  Let $E^2$ be the Hilbert space of Dirichlet series $D(s)$ for which $D(s)/s$ extends to a function in $H^2(\operatorname{Re}s>1/2)$. Let $V$ be the closure in $E^2$ of the functions
  $$\zeta(s)\sum_{k=1}^n c_k k^{-s}\qquad\text{with}\qquad \sum_{k=1}^n\frac{c_k}{k}=0.$$
  Is
  $$V=\{D\in E^2:D(s)/\zeta(s)\text{ is holomorphic for }\operatorname{Re}s>1/2\}$$?
