title: Ways to write $n = x + y$ with $nx + y$ and $ny - x$ both prime (conjecture_3)
field: mathematics
tier: proof
statement: |-
  Conjecture (ii): Any positive integer $n$ not among $1, 30, 54$ can be written as $x + y$
  ($x, y > 0$) with $nx + y$ and $ny + x$ both prime.
