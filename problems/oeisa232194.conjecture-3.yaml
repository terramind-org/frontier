lean:
  module: FormalConjectures.OEIS.«232194»
  decl: OeisA232194.conjecture_3
  statement: |-
    theorem conjecture_3 (n : ℕ) (hn : n > 0) (hne : n ∉ ({1, 30, 54} : Finset ℕ)) :
        ∃ x y : ℕ, 0 < x ∧ 0 < y ∧ x + y = n ∧
          (n * x + y).Prime ∧ (n * y + x).Prime
