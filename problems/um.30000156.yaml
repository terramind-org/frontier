title: Limiting Cycle Distributions of Birational Maps
field: mathematics
tier: prose
statement: Let $D_p(x)$ be the probability that a uniformly chosen point of $\mathbb F_p^2$ lies on a cycle of length at most $px$. Does the limit $D(x)=\lim_{p\to\infty}D_p(x)$ exist for every birational map $L$?
