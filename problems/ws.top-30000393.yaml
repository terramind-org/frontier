  \section{Singularity Probability of Random Symmetric Sign Matrices}\label{30000393}
  {\small UnsolvedMath ID 30000393 · Probability}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Let $Q_n$ be an $n\times n$ random symmetric matrix whose upper-triangular entries are independent Bernoulli variables taking values $\pm1$. Determine or estimate the probability that $Q_n$ is singular.
  \par\smallskip\textit{Formulation references:} \sref{30000393}{1}, \sref{30000393}{2}.
  \subsection{Short English statement}
  Let $Q_n$ be an $n\times n$ random symmetric matrix whose upper-triangular entries are independent Bernoulli variables taking values $\pm1$. Determine or estimate the probability that $Q_n$ is singular.
