title: Kourovka Notebook Problem 18.64
field: mathematics
tier: prose
statement: |-
  (K. Harada). *Conjecture*: Let $G$ be a finite group, $p$ a prime, and
  $B$ a $p$-block of $G$. If $J$ is a non-empty subset of $Irr(B)$
  such that $\sum\limits_{\chi \in J}\chi (1)\chi (g)=0$
  for
  every $p$-singular element $g\in G$, then $J=Irr(B)$.
