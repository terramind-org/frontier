title: Density of Whittaker Distributions on Spherical Spaces
field: mathematics
tier: prose
statement: |-
  Let $G$ be quasisplit with Borel subgroup $B$ and nilradical $U$, let $\psi$ be a nondegenerate character of $U$, let $H\subset G$ be reductive and spherical, and put $X=G/H$. If $O$ is the union of the open $B$-orbits in $G$, is
  $$\sum_{x\in O}S^*(Ux)^{U,\psi}$$
  dense in $S^*(X)^{U,\psi}$?
