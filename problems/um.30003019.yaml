title: Uniform Mordell Conjecture
field: mathematics
tier: prose
statement: For every integer $g\geq2$, does there exist $N(g)$ such that every smooth, proper, geometrically connected curve $C/\mathbb Q$ of genus $g$ satisfies $\lvert C(\mathbb Q)\rvert\leq N(g)$?
