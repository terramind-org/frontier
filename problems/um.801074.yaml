statement: |-
  In a topological term, monotonicity of the topological entropy of the real H\'enon map $f_{c, b}|_{\mathbb{R}^2}$ can be formulated as

  Is the isentrope $\mathcal{E}_{\alpha}$ connected for any $0\leq \alpha \leq \log 2$ ?
