title: 10 Lectures and 42 Open Problems — Mallat-Zeitouni Gaussian-basis problem
field: mathematics
tier: prose
statement: Let $X$ be a centered Gaussian random vector in $\mathbb{R}^n$ with known covariance matrix, and for an orthonormal basis $B=(b_1,\ldots,b_n)$ let $N_B=\| (\langle X,b_1\rangle,\ldots,\langle X,b_n\rangle)\|_\infty$. Is the Karhunen-Loève basis always optimal for minimizing $\mathbb{E}N_B$ over all orthonormal bases?
