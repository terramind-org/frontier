title: Toric Local Uniformization Without Embedded Resolution
field: mathematics
tier: prose
statement: When embedded resolution is not known to exist for a variety $X$, how can one find local re-embeddings and toric birational maps that uniformize a chosen valuation, making the strict transform of $X$ nonsingular and transverse to the toric boundary at the valuation-selected point?
