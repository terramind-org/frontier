title: The Alexandrov boundary conjecture and a polyhedral Gauss formula
field: mathematics
tier: prose
statement: |-
  **Problem 14.** Is there a Gauss formula for Alexandrov spaces, i.e. must a convex hypersurface $Y$ of an Alexandrov space $X$ have $\sec Y\ge \sec X$?

  If $X$ is a complete finite-dimensional Alexandrov space with curvature $\ge\kappa$ and $Y$ is a convex hypersurface, is $Y$, with its induced intrinsic length metric, an Alexandrov space with curvature $\ge\kappa$?
