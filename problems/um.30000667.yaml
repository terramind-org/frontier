title: Cayley Degrees of Simple Algebraic Groups
field: mathematics
tier: prose
statement: For a connected reductive algebraic group $G$, define $\operatorname{Cay}(G)$ as the minimum degree of a dominant $G$-equivariant rational map $G\dashrightarrow\operatorname{Lie}(G)$, where $G$ acts on itself by conjugation and on $\operatorname{Lie}(G)$ by the adjoint action. Determine $\operatorname{Cay}(G)$ for every connected simple algebraic group, in particular $\operatorname{Cay}(\operatorname{SL}_5)$.
