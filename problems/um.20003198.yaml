title: All size moments for simultaneous cores with one modulus two
field: mathematics
tier: prose
statement: |-
  **Problem 2.2.** Find and prove formulas for higher moments of cores:
  \(\sum_{c\ {\rm an}\ (a,b)\text{-core}} |c|^i\).

  Direct inspection of
  the PDF text around the damaged extraction recovers the display as
  \[
  \boxed{\quad
  \sum_{\substack{c\ \mathrm{an}\ (a,b)\text{-core}}}|c|^i . \quad}
  \]
  Thus the exact problem is:

  The reconstruction makes the following repairs and conventions explicit.

  The
  correct factor is \(a+b+1\), as verified in the primary sources:
  \[
  \mathbb E|c|=\frac{(a-1)(b-1)(a+b+1)}{24}. \]
  The specialization derived below recovers this plus sign independently.
