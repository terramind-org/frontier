  \section{Generic Singularities of Mean Curvature Flow}\label{30004754}
  {\small UnsolvedMath ID 30004754 · Partial Differential Equations}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  For mean curvature flow, are the generic singularity models shrinking spheres and generalized shrinking cylinders? Determine whether other singularity types can be excluded by generic perturbation of the initial hypersurface.
  \par\smallskip\textit{Formulation references:} \sref{30004754}{1}, \sref{30004754}{2}.
  \subsection{Short English statement}
  For mean curvature flow, are the generic singularity models shrinking spheres and generalized shrinking cylinders? Determine whether other singularity types can be excluded by generic perturbation of the initial hypersurface.
