title: A first-kind regular cover with variable critical exponent
field: mathematics
tier: prose
statement: |-
  M. Kapovich suggested that the above question maybe related to Problem
  4.1. He guessed that the construction depends on the ergodic properties of
  Γ0.

  **Problem 4.3.** Construct an infinitely generated Fuchsian group
  \(\Gamma _0\) of the first kind for which the critical exponent function is
  nonconstant on \(\mathcal T_{qc}(\Gamma _0)\).

  Thus the recovered question is:

  “Some elements” means some marked hyperbolic structures (equivalently,
  Fuchsian representations) in the quasiconformal Teichmüller space; it does not
  mean individual group elements. For a Fuchsian group \(\Gamma\),

  \[
   \delta(\Gamma)=\inf\left\{s>0:
   \sum_{\gamma\in\Gamma}e^{-s d(o,\gamma o)}<\infty\right\}. \]
