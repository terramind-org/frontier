title: Ultraproduct II_1 Factors — Problem 14
field: mathematics
tier: prose
statement: |-
  Recall that a II$_1$ factor $N$ is said to be existentially closed if whenever it embeds into a II$_1$ factor $M$, it can embed existentially into $M$. Such factors exist by [ECfactors], also see [IOANA2024110264, GKEPTConj] for concrete constructions.

  Does there exist a countable group $G$ such that $L(G)$ is an existentially closed II$_1$ factor? Does there exist an existentially closed II$_1$ factor which is not isomorphic to a group von Neumann algebra?
