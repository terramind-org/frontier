statement: Can the $U_q(\mathfrak{sl}_2)$-representations $V_1^{\otimes n}(j)$ be categorified by finite-dimensional quasi-hereditary graded algebras $A_{j,n}$ so that $K_0(A_{j,n}\text{-gmod})\cong V_1^{\otimes n}(j)$, with the simple modules indexed by binary strings of weight $j$?
