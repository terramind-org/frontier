title: The Berge Conjecture for Lens-Space Surgeries
field: mathematics
tier: prose
statement: If a nontrivial knot $K\subset S^3$ admits a Dehn surgery yielding a lens space, must $K$ be doubly primitive? Analogously, if $K\subset S^2\times S^1$ admits a nontrivial lens-space Dehn surgery, must $K$ be doubly primitive?
