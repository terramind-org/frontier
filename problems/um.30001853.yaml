title: Power Decay for Multilinear Oscillatory Integrals
field: mathematics
tier: prose
statement: For the multilinear oscillatory integral $I_\lambda$ with a nondegenerate polynomial phase, does there exist $\delta>0$ such that $|I_\lambda(f_1,\ldots,f_n)|\leq C|\lambda|^{-\delta}\prod_j\|f_j\|_{L^\infty}$ as $|\lambda|\to\infty$?
