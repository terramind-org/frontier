title: Research Problems in Function Theory — Problem 5.56
field: mathematics
tier: prose
statement: "By a first-order property we shall mean a ring-theoretic property in the first-order predicate calculus. For functions $f$ analytic in $\\mathbb{D}$, are the following first-order properties: [(a)] ; $f$ is constant? ; $f$ is bounded ? ; $f$ is admissible, i.e. $T(r,f) \\neq O(\\log(1-r)^{-1})?$ What is the situation in more general domains? (L. A. Rubel)"
