title: Kourovka Notebook Problem 16.102
field: mathematics
tier: prose
statement: |-
  We say that a group $G$ is *rational*
  if any two elements $x,y\in
  G$ satisfying $\left< x \right>=\left< y \right>$ are conjugate.
  Is it true that for any $d$ there exist only finitely many finite
  rational $d$-generated $2$-groups?
