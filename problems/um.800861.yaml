title: Randomstrasse101 Open Problems (2025) — Conjecture 1 (Type-$2$ constant of Tensors)
field: mathematics
tier: prose
statement: |-
  Let $p \geq 2$, then
  \begin{equation}
  \mathbb{E} \left| \left| \sum_{i=1}^n g_i T_i \right| \right|_{ \mathcal{I}_p} \leq \tilde{\mathcal{O}}_{r,p} \left( d^{\frac12 - \frac1p } \sqrt{\sum_{i=1}^n \left| \left| T_i \right| \right|_{ \mathcal{I}_p}^2 }\right).
  \end{equation}
  (Here $\tilde{\mathcal{O}}_{r,p}$ hides multiplicative constants depending on $r$ and $p$ as well as polylog factors in $d,n$.)
