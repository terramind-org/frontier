title: Stability of the Prékopa–Leindler Inequality
field: mathematics
tier: prose
statement: Let $\lambda\in(0,1)$, and let $f,g,m$ be nonnegative integrable functions on $\mathbb{R}^n$ such that $f$ and $g$ are probability densities with zero mean and $m(\lambda x+(1-\lambda)y)\geq f(x)^\lambda g(y)^{1-\lambda}$ for all $x,y\in\mathbb{R}^n$. With $\delta_1(f,g)=\min\{1,\int_{\mathbb{R}^n}|f-g|\}$, is there a dimension-dependent constant $\gamma>0$ such that $\int_{\mathbb{R}^n}m\geq1+\gamma\lambda\delta_1(f,g)^2$?
