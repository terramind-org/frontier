  {\small\sffamily UnsolvedMath ID 20001242 · Computer Science}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}Standard number systems are $\mathbb N,\mathbb Z,\mathbb Q,\mathbb R,\mathbb C$. Specialized notation and index ranges follow the cited source and the definitions below.


  A time series records observations at successive times. A knockout experiment disables a component to expose its influence on the remaining system. Model selection compares candidate dynamical laws using a specified fit or prediction criterion; several interventions can supply information absent from a single observed trajectory.
