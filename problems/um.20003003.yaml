title: An explicit rank-two test for the trace--Hilbert--quasi-invariant bridge
field: mathematics
tier: prose
statement: |-
  a) Relate \(tr(T(m,n))\) to rings of quasi-invariants and to A. Wilson's conjecture on \(\nabla_{p_1}^n\).

  b) Describe \(H^*(\operatorname{Hilb}(x^{nd}=y^n))\) as a module over rational Double Affine Hecke algebra (DAHA) and relate it to the above.
