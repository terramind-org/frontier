statement: |-
  \section*{The essential singularity of the planar XY correlation length}\label{statement}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  In the nearest-neighbor planar XY model below its physical inverse-temperature threshold $b_c$, does $\operatorname{sqrt}(b_c-b)$ log xi(b) converge to a finite strictly positive constant as b increases to $b_c$?
  \subsection{Short English statement}
  In the nearest-neighbor planar XY model below its physical inverse-temperature threshold $b_c$, does $\operatorname{sqrt}(b_c-b)$ log xi(b) converge to a finite strictly positive constant as b increases to $b_c$?
