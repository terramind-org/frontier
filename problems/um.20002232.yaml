title: Jump complexity of term-by-term root taking in Hahn fields
field: mathematics
tier: prose
statement: |-
  Let \(K\) be an algebraically closed field of characteristic 0, and let \(G\) be an ordered divisible group. Consider the Hahn field
  \[
  K((G))=\left\{\sum_{g\in S}a_gt^g\mid S\subseteq G\text{ well-ordered},\ a_g\in K\right\}.
  \]
  If \(K\) and \(G\) are computable and \(f\in K((G))[X]\), how complex is it to determine a root of \(f\)? At each step, the procedure should produce the next term in a root of \(f\), based on the \(a_g\) in the input coefficients of \(f\). For each step \(\alpha\), how many jumps over these coefficients are needed to do step \(\alpha\)?
