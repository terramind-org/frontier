title: Open Problems in Wavelet Theory — Problem 6
field: mathematics
tier: prose
statement: |-
  Suppose that $\psi \in L^2(\mathbb{R}^n)$ is a Parseval wavelet. Then, we can define spaces
  \[
  V_j = D^j(V(\psi)) \qquad j\in {\mathbb{Z}},
  \]
  where $Df(x)=\sqrt{2} f(x)$ is a dilation operator. Baggett has shown that a sequence $\{V_j:j\in{\mathbb{Z}}\}$ satisfies all properties of GMRA (M1), (M2), (M4), and (M5') possibly with the exception of (M3). Hence, it is natural to ask the following question.

  Let $\psi$ be a Parseval wavelet with the space of negative dilates $V=V(\psi)$.
  Is it true that
  \[
  \bigcap_{j\in{\mathbb{Z}}} D^j(V(\psi))=\{0\}?
  \]
