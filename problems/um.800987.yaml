title: Open Problems and Questions about Geodesics — Question 68
field: mathematics
tier: prose
statement: |-
  There exist local (the first examples are due already to Lagrange, Beltrami and Dini)
  and global examples of non-proportional projectively equivalent metrics. Locally, in the Riemannian case, a complete description of projectively equivalent metrics is due to Levi-Civita [Levi-Civita1896] and in arbitrary signature is due to [Bol-Mat2015]. Globally, in the Riemannian case, the situation is also pretty clear, see e.g.\ [Mat-Top1998,Matveev2003a,Matveev2003b], but if the metrics have arbitrary signature, virtually nothing is known. A general problem is to understand the topology of closed manifolds admitting non-proportional projectively equivalent metrics of indefinite signature and as the simplest version of this problem we suggest

  *Can a 3-dimensional sphere admit two non-proportional projectively equivalent
  metrics of Lorentzian signature?*
