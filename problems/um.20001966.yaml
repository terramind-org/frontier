title: All-root abelianization for cotangent Grassmannians
field: mathematics
tier: prose
statement: |-
  **Conjecture 6.14 (Hausel 2000).** Suppose that both
  \(T^*A////G\) and \(T^*A////T\) are hyper-compact. Then
  \[
  H^*(T^*A////G)\cong
  \frac{H^*(T^*A////T)^W}{\operatorname{Ann}(\widetilde e)},
  \qquad
  \widetilde e=\prod_{\alpha\in\Delta}\alpha
  \in (\operatorname{Sym}\mathfrak t^*)^W
  \cong H_T^*(\mathrm{pt})^W.
  \]
