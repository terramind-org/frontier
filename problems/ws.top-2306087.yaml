  \item[\hypertarget{source:2306087:2}{S2}] W. K. Hayman and E. F. Lingham, \emph{Research Problems in Function Theory} (2018), Chapter 6, Problem 6.87 and its complete update; Chapter 6 initial notation. \url{https://arxiv.org/abs/1809.07200}.
  \end{description}
