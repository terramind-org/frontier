statement: |-
  \section*{Logarithmic relative fluctuations of disordered critical Ising correlations}\label{30007412}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  Assuming the deterministic reference-Ising bounds listed in the source, does the relative quenched two-spin fluctuation $R_\epsilon (r)$ of the planar two-valued weak random-bond model satisfy log $R_\epsilon (r)/\log $ log $r\to 1/4$ for every sufficiently small fixed $\epsilon >0$? Use the physical critical beta solving $sinh(2\beta (1-\epsilon ))sinh(2\beta (1+\epsilon ))=1$.
  \subsection{Short English statement}
  Assuming the deterministic reference-Ising bounds listed in the source, does the relative quenched two-spin fluctuation $R_\epsilon (r)$ of the planar two-valued weak random-bond model satisfy log $R_\epsilon (r)/\log $ log $r\to 1/4$ for every sufficiently small fixed $\epsilon >0$? Use the physical critical beta solving $sinh(2\beta (1-\epsilon ))sinh(2\beta (1+\epsilon ))=1$.
