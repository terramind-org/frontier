title: Universality of Quasi-Isometry among Marked Groups
field: mathematics
tier: prose
statement: Let $\mathcal{G}$ be the Polish space of finitely generated marked groups, and let quasi-isometry be the usual relation defined by a coarsely bilipschitz map with coarsely dense image. Is the quasi-isometry relation on $\mathcal{G}$ a universal $K_\sigma$ Borel equivalence relation; that is, does every $K_\sigma$ Borel equivalence relation Borel-reduce to it?
