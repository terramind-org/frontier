title: Ramanujan Tau Nonvanishing from Double Eisenstein Series
field: mathematics
tier: prose
statement: Use double-Eisenstein-series representations of the discriminant modular form to prove that Ramanujan’s $\tau(n)$ never vanishes, or at least that $\tau(p)=0$ for only finitely many primes $p$.
