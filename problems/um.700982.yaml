title: Kourovka Notebook Problem 13.64
field: mathematics
tier: prose
statement: |-
  Let $\pi _e(G)$ denote the set of orders of elements of a group
  $G$. A group $G$ is said to be an *$OC_n
  $-group* if $\pi _e(G)=\{ 1, 2, \ldots , n\}$. Is every
  $OC_n $-group locally finite? Do there exist infinite $OC_n
  $-groups for $n\geq 7$?
