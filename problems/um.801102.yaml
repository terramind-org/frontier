title: Ultraproduct II_1 Factors — Problem 3
field: mathematics
tier: prose
statement: |-
  [Solved by J. Peterson [peterson2026ultraproductapproximationspropertyt]]
  A non Gamma factor $N$ is said to be pseudocompact if there exists an ultrafilter $\mathcal{U}$ such that $N$ is elementarily equivalent to $\mathbb{M}^{\mathcal{U}}$. Is $L(\mathbb{F}_n)$ pseudocompact for $n\geq 2$?
