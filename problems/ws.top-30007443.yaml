statement: |-
  \section*{Exact uniform sampling of arbitrary-margin contingency tables}\label{30007443}
  \subsection{Definitions and mathematical statement}
  \paragraph{Statement recorded in the supplied source.}
  For all nonnegative integer row and column margins of equal total N, is exact uniform sampling of nonnegative integer contingency tables possible with independent unbiased random bits, almost-sure termination and polynomial expected bit time in dimensions and log(N+1)? Is total-variation error $2^{-k}$ achievable in bounded polynomial time in those parameters and k?
  \subsection{Short English statement}
  For all nonnegative integer row and column margins of equal total N, is exact uniform sampling of nonnegative integer contingency tables possible with independent unbiased random bits, almost-sure termination and polynomial expected bit time in dimensions and log(N+1)? Is total-variation error $2^{-k}$ achievable in bounded polynomial time in those parameters and k?
