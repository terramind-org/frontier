title: Numerical Criterion for Deformed Hermitian–Yang–Mills Metrics
field: mathematics
tier: prose
statement: For a holomorphic line bundle $L$ over a compact Kähler manifold $X$, does the deformed Hermitian–Yang–Mills equation admit a solution if and only if every irreducible holomorphic subvariety $V\subset X$ satisfies $\operatorname{Arg}\left(\int_V e^{-i\omega}\operatorname{ch}(L)\right)>-\operatorname{Arg}\left(\int_X e^{-i\omega}\operatorname{ch}(L)\right)$?
