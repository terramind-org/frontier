title: "Erdős Problem #736: Graph Theory, Chromatic Number"
field: mathematics
tier: prose
statement: Let $G$ be a graph with chromatic number $\aleph_1$. Is there, for every cardinal number $m$, some graph $G_m$ of chromatic number $m$ such that every finite subgraph of $G_m$ is a subgraph of $G$?
