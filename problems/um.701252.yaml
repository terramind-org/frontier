title: Kourovka Notebook Problem 16.60
field: mathematics
tier: prose
statement: |-
  If $G$ is a finite group, let $T(G)$ be
  the sum of the degrees of the irreducible complex representations
  of $G$, $T(G)=\sum\limits_{i=1}^{k(G)}d_i$, where $G$ has $k(G)$
  conjugacy classes. If $\alpha \in \mathrm{Aut } G$, let $S_{\alpha
  }=\{g\in G\mid \alpha (g)=g^{-1}\}$. Is it true that $T(G)\geq
  |S_{\alpha }|$ for all $\alpha \in \mathrm{Aut } G$?
