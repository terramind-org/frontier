  \section{Polynomial-time lifted LMI representations of convex cones}\label{20002386}
  {\small UnsolvedMath ID 20002386 · Analysis}
  \subsection{Definitions and mathematical statement}

  \paragraph{Shared notation.}$\mathbb N$, $\mathbb Z$, $\mathbb Q$, $\mathbb R$, and $\mathbb C$ denote the natural numbers, integers, rationals, reals, and complex numbers, respectively. All additional parameters and hypotheses are specified in the question.


  \paragraph{Statement recorded in the supplied source.}
  Characterize full-dimensional pointed closed convex cones that admit lifted linear-matrix-inequality representations with polynomial-time complexity. Is this efficiently representable class strictly larger than the class of hyperbolicity cones?
  \par\smallskip\textit{Formulation references:} \sref{20002386}{1}, \sref{20002386}{2}.
  \subsection{Short English statement}
  Characterize full-dimensional pointed closed convex cones that admit lifted linear-matrix-inequality representations with polynomial-time complexity. Is this efficiently representable class strictly larger than the class of hyperbolicity cones?
