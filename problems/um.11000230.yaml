title: Problem 2.2 — Does the converse hold in the above theorem without the assumption that G is free?
field: mathematics
tier: prose
statement: Does the converse hold in the above theorem without the assumption that G is free? The gist of Problem 2.2 is to find an extension of the Bestvina-Feighn combination theorem beyond the setting of groups acting on trees, to the wider setting of groups acting on Gromov hyperbolic cell complexes. In particular, in the context of Problem 2.2, the group Γ G acts on the 16. Problems in the geometry of surface group extensions 263 Rips complex of G, and one wants to use this information to decide about word hyperbolicity of ΓG. Unfortunately there are at present no examples on which to test Problem 2.2, but we will propose some problems along these lines in Section 4.
