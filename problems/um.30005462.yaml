title: Compactly Supported Representing Measures for Linear Functionals
field: mathematics
tier: prose
statement: Let $A$ be a unital commutative real algebra with nonempty character space $X(A)$, and let $L:A\to\mathbb R$ be linear with $L(1)=1$. Characterize when there is a compactly supported Radon measure $\nu$ on $X(A)$ such that $$L(a)=\int_{X(A)}\alpha(a)\,d\nu(\alpha)$$ for every $a\in A$.
