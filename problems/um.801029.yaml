statement: |-
  In [LMNS, Section 3.1] the authors showed the following implications
  $$\text{1-generic } \Delta^0_2 \Rightarrow \text{ index guessable } \Rightarrow \text{ computes no maximal tower } \Rightarrow \text{ low }$$

