# Lake project for the frontier proof checker.
# `Attempt.Solution` is where an attempt's solution.lean is copied (phase 1 builds it);
# `Check.lean` loads only the resulting .olean and judges it (phase 2). See check-attempt.sh.
name = "frontier_check"

[[require]]
name = "formal_conjectures"
git = "https://github.com/google-deepmind/formal-conjectures"
rev = "9097e2f90e66d2f6244209cb1c07f7120d17ec53"

[[lean_lib]]
name = "Attempt"
globs = ["Attempt.Solution"]
