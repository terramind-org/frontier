title: Golomb ruler, 29 marks - ties 623, no improvement
claim: "No improvement. The witness is the published 29-mark ruler of length 623 (Rokicki and Dogon), which ties the best known value and does not beat it. A search for length 622 found nothing: an exhaustive scan of Bose-Chowla (q=29,31,37), Singer (q=29,31) and Ruzsa (p=31,37) constructions over all multipliers and cyclic windows (best 623, from Singer q=29, matching the record), then 10 minutes of simulated annealing on 622 (best: 32 repeated differences, never a valid ruler). Not a record improvement."
