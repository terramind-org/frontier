title: "a(40) of A103662: no zeroless b^40 for b odd or divisible by 5 (partial)"
claim: >-
  Partial result, unchecked. For every base b > 1 that is odd or divisible by 5, b^40 has a
  0 among its last four decimal digits, so no such b is a valid zeroless base. Bases that are even
  and not divisible by 5 are not settled; a search found no zeroless b^40 for those b up to 200000.
  The included partial.lean proves the three settled cases in Lean but is not the problem's
  statement and is not checked by Frontier.
