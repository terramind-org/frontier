title: "Erdős 727, k = 2: reduction to C(2n,n), a smoothness condition, and data to 2·10^6 (partial)"
claim: >-
  Partial result, unchecked; does not answer the problem. Proves in Lean (partial.lean, not the
  problem's statement and not checked by Frontier) that ((n+2)!)^2 | (2n)! iff
  ((n+1)(n+2))^2 | C(2n,n), and that then 2·v_p((n+1)(n+2)) <= log_p(2n) for every prime p,
  so every prime factor p of (n+1)(n+2) has p^2 <= 2n. Reports the 23760 solutions with
  n <= 2·10^6 (smallest 208); their proportion grows over that range, which is evidence, not proof.
