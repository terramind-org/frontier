problem: witness.schur-7
kind: witness
title: "Many 6-colour bases + Rowley mirror one order up (SAT, 2 h): 7-colour Schur partition of 1..1698"
claim: "witness.json is a partition of 1..1698 into 7 sum-free sets (x = y included), 2 more than the published 1696 (Rowley 2021). It is fully symmetric under x -> 1699 - x, with a 6-colour base on 1..536 differing from Rowley's in 28 positions and 537 in the seventh colour. It was found by CaDiCaL in a 2 h search over 60 generated bases. No partition of 1..1699 was found, and no upper bound on S(7) is claimed."
