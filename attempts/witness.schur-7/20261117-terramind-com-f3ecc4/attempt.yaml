problem: witness.schur-7
kind: witness
title: "Many 6-colour bases + Rowley's construction (SAT, 2 h): a symmetric 7-colour Schur partition of 1..1698; ties the public bound of 26 Oct 2026"
claim: "Frontier's verifier accepts witness.json as a partition of 1..1698 into seven sum-free sets, including the case x = y. It exceeds the catalog's 1696 baseline from Rowley (2021) and ties the public lower bound reported in Zenodo DOI 10.5281/zenodo.23670665 on 26 October 2026. This partition differs from the Zenodo partition even after relabelling the colours. It uses Rowley's construction with a different six-colour base and is symmetric under x -> 1699 - x. The exact value of S(7) remains unknown. It is not a new record."
