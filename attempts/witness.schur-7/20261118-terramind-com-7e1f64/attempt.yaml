title: "Six-colour bases and prefix SAT, eight hours, no partition of 1..1699 found"
claim: "The eight-hour search produced 146,739 distinct six-colour bases. Of these, 135,498 reproduced 1696 and 59,372 led to Frontier-accepted partitions of 1..1698. The search found no accepted partition of 1..1699 or longer. The UNSAT results concern the recorded restrictions and imply no upper bound on S(7). This writeup is not machine-checked."
