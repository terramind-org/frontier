title: "Exact G-orbit pool (13.4e9 norm-36 vectors), blocker-set exchanges, free-backbone LNS and symmetric models from the 604, 2 h, no 605 found"
claim: "Failed two-hour exact search around the published 604-point configuration; no configuration of 605 or more vectors was found, and every exact configuration produced or visited has 604 vectors (ties the record). Exact results, each only for the stated candidate pool (norm-36 vectors with pure integer or q*sqrt2 coordinates, B coordinates also mixed p+q*sqrt2; 13,365,555,706 vectors enumerated as G-orbits): removing all 51 blockers of the deepest hole leaves 10,570 compatible pool vectors whose maximum compatible set has 51 vectors (exact max-clique search completed); configurations invariant under six subgroups of the 604's symmetry group (orders 3,072 to 24,576) have at most 604 vectors (CP-SAT proved optimal); the S-model and three smaller subgroup models gave only incumbents of 604 with weak bounds; 2,164 cap and blocker neighbourhoods were attempted, 1,937 solved to proven optimality with no improvement, 226 skipped as too large and 1 timed out; all 1,012 equal-size move searches in the walk completed without finding an alternative set, so the walk never left the baseline. One process exceeded the 3 GB memory cap (4.77 GB). This writeup is not machine-checked and establishes no upper bound."
