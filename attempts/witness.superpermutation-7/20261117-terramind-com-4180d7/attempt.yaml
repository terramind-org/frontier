title: Strong LKH full paths and large windows, scheduled 2 h, no 5904; kernel
  completion controls timed out
claim: "No word shorter than 5905 was found in 80 capped LKH-3 calls: four full
  ATSP calls and 76 fixed-end windows of 1000-3000 permutations. Seventy-nine
  calls returned valid tours; all reproduce the two published starting words,
  with 69 edges of weight at least three. Twenty-one distinct disturbed starts
  were also tested, with lengths up to 6444. The requested broad n=6 calibration
  failed; narrower record-repair controls passed. Three published 5906 kernel
  completion controls timed out, so the planned bridged-kernel completion search
  and four legacy score-15 runs were dropped under the preflight rule. This
  writeup is not machine-checked and establishes no lower bound."
