title: "Score-20 kernel search (adaptive kernel pool + PermutationChains) and LKH segment re-solves, 2 h, no 5904 found"
claim: "No superpermutation on 7 symbols shorter than 5905 was found. In a 2-hour, 2-core search we ran 402,114 tests of Houston kernels of target score 15, 20 or 25, generated by repeated head/tail completion from an adaptive pool initially seeded by Teodorescu's score-15 kernel and its reversal (379,285 distinct kernels; most no longer share a literal end with it). Egan's PermutationChains, with no symmetry options, reached its tree search for 306 distinct score-20 kernels and reported no completion for any of them; an independent rerun of all 306 agreed. 89,782 of the 399,019 retained per-kernel results (about 22.5%) fell outside the driver's two classifications, and five score-15 calls timed out. The pipeline reproduces the known 5905 and n = 5 completions but did not reproduce a published 5906 completion within its 60 s limit, so its non-completions are bounded by those limits. We also ran 847 LKH-3 re-solves of 30-1200-permutation segments of the 5905 path (none was shorter); those settings (RUNS 1, MAX_CANDIDATES 8) missed the n = 5 optimum 153 on all 13 tested seeds, so that line is weak evidence. This writeup is not machine-checked and claims no bound: it does not show that 5904 is impossible."
