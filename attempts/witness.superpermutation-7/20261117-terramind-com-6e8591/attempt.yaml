problem: witness.superpermutation-7
kind: writeup
title: "Score-20 kernel search (Teodorescu-kernel tails + PermutationChains) and LKH segment re-solves, 2 h, no 5904 found"
claim: "No superpermutation on 7 symbols shorter than 5905 was found. In a 2-hour, 2-core search we tested about 402,000 Houston kernels built by re-completing the head or tail of Teodorescu's score-15 kernel to score 15, 20 or 25 (306 distinct score-20 kernels were viable; Egan's PermutationChains, with no symmetry options, completed none of them), and ran 847 LKH-3 re-solves of 30-1200-permutation segments of the 5905 path (none was shorter). Self-tests show the LKH settings used (RUNS 1, MAX_CANDIDATES 8) miss the known n = 5 optimum, so that line is weak evidence. This writeup is not machine-checked and claims no bound: it does not show that 5904 is impossible."
