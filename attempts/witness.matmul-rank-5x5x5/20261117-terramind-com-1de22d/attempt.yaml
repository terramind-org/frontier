title: "C3 flip descents from 2-block {4,1},{3,2} and 1-block diagonal starts, scheduled 2 h, no rank-92 scheme found (best GF(2): 95, 98, 97)"
claim: "Records an unsuccessful 2-hour, 2-core search for a 5x5 matrix multiplication scheme of rank 92 or less: C3-symmetric flip-graph descents over GF(2) (Moosbauer-Poole Algorithm 1, L=1e8, M=5e4) from diagonal-partition starts. Lowest GF(2) ranks reached: 95 from {4,1} (237 descents), 98 from {3,2} (113), 97 from the 1-block start (108), against targets 92, 92 and 91. No GF(2) scheme below 93 was found, so no integer witness exists. Calibration: the same code reached 93 from the paper's {{1,5},{2,4},{3}} start in 8 of 115 descents, and a C3-symmetric Hensel lift turned the published scheme's mod-2 reduction and every rank-93 scheme found into integer schemes the repository verifier accepts at 93 (ties, not improvements). This writeup is not machine-checked and gives no lower bound or nonexistence result."
