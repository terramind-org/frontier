title: "SorterHunter (2 prefixes) plus window SAT on the 77-gate record, 2 h, no 76-gate network found"
claim: "A failed 2-hour search for an 18-input sorting network with 76 gates or fewer; no such network was found and no witness is submitted. Shown (by the logs, not machine-checked): two SorterHunter runs with the first 2 or 3 layers of the 77-gate record fixed reached 78 and 77 gates (77 only ties the record), and CaDiCaL proved that no one-gate-shorter replacement exists for the contiguous windows of 8 gates (11 offsets), 9 gates (offsets 44 to 68) and 10 gates (offsets 47 to 67) of the record, with prefix and suffix fixed. Not shown: anything about windows of 11 or more gates, or about other prefixes. This writeup is not checked by any verifier."
