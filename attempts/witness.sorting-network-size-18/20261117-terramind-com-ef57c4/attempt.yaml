title: Record-started SorterHunter, sequential window SAT and deletion repair,
  120 min budget, no 76-gate sorter
claim: "A failed search within a 120-minute wall budget: 36 SorterHunter runs
  from known 77- and 78-gate networks, 47 unresolved larger-window SAT queries,
  and fixed-length repair. No SorterHunter run produced a valid network smaller
  than its input. The only 77-gate networks the runs printed are the two 77-gate
  inputs (the published record and round 1's network), so the best valid size,
  77, is the input, which ties the record. The repository verifier rejects the
  best measured 76-gate candidate, which fails 48 of 262144 inputs. This writeup is not machine-checked."
