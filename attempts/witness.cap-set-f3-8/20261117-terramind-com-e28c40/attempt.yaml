title: "Exclusion plateaus, stabilizer models and full-line SAT, 104.4 min of a 120 min budget, no cap above 512 found"
claim: "No cap in F_3^8 with more than 512 points was found. This writeup is not machine-checked. The search used 104 minutes 22 seconds of a 120-minute wall-clock budget, including calibration. Research walks retained three labelled 512-caps; a symmetry model adds a fourth, all in one signed-coordinate class with minimum outside blocking count four. A complete saved 448-cap grew to the original 512-cap; a literature product grew from 448 to 449. The full signed-coordinate stabilizer model reported optimum 512 only within that restriction; weaker models retained loose bounds, and unrestricted SAT at cardinality 513 returned UNKNOWN. No global upper bound or impossibility is claimed."
