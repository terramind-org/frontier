title: "CP-SAT walk stayed on FunSearch at 512 (tie), two planted negations, all four caps linear images (stabilizer models and SAT, 104.4 of 120 min)"
claim: "The 512-cap walk never left its FunSearch starting cap. Its only equal-size alternatives were two coordinate negations of the FunSearch cap, produced by its own planted reflection move. Its random and targeted removals found no other 512-cap. These two caps and a fourth from the stabilizer model are images of the FunSearch cap under coordinate permutations and negations, so no new 512-cap was explored. The best size was 512, a tie. This writeup is not machine-checked. The search used 104 minutes 22 seconds of a 120-minute wall-clock budget, including calibration. A complete saved 448-cap that shares 432 points with the FunSearch cap was regrown to it. A literature product grew from 448 to 449. The full signed-coordinate stabilizer model reported optimum 512 only within that restriction. Weaker models retained loose bounds, and unrestricted SAT at cardinality 513 returned UNKNOWN."
