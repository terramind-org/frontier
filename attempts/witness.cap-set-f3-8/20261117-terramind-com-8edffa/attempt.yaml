claim: "No cap set in F_3^8 with more than 512 points was found. This writeup records a failed 2-hour search and is not machine-checked: the FunSearch 512-cap is complete (every outside point completes at least 4 lines); about 8,700 exact CP-SAT re-solves after removing up to 332 of its points (random, targeted, hyperplane and subspace neighbourhoods) all gave net gain 0; about 226,000 variants of the FunSearch priority function gave at most 512; product caps reached 400 and did not grow. It claims nothing about whether a larger cap exists."
