# Build dist/index.json and publish it to the rolling release `index`.
# terramind.org reads https://github.com/terramind-org/frontier/releases/download/index/index.json at build time.
# Pushes made with GITHUB_TOKEN (the record workflow's verdict commit) do not trigger push workflows,
# so this also runs when `record` completes.
name: index

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [record]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the index
        run: bun frontier index

      - name: Publish dist/index.json to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view index > /dev/null 2>&1; then
            gh release upload index dist/index.json --clobber
          else
            gh release create index dist/index.json --title "Index" --notes "Rolling release holding the latest index.json. Rebuilt on every push to main." --latest=false --target main
          fi
          echo "Published \`index.json\` to the \`index\` release ($(jq -r '"\(.counts.problems) problems, \(.counts.attempts) attempts, \(.counts.verified) verified"' dist/index.json))." >> "$GITHUB_STEP_SUMMARY"
