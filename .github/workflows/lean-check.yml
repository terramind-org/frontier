# Reusable Lean proof check for one attempt (kind proof or disproof).
#
# Three jobs; the attempt's compile-time code never shares a machine with the judge:
#   resolve — checks out main only and finds, through the API, the Lean cache entry that lean-cache.yml's
#             warm job saved on main (.github/scripts/lean-cache.sh resolve). No attempt file is read.
#   build   — checks out main (checker, lean/) and the caller's ref (the PR) in pr/ for the attempt files,
#             restores that cache entry, compiles the attempt (phase 1 of lean/check-attempt.sh) and
#             uploads only the attempt's build files.
#   check   — a fresh job that never checks out PR code: it checks out main, reads the attempt's
#             attempt.yaml and solution.lean from the PR commit as data, takes the problem's Lean
#             declaration from main's problems/, downloads the build files and runs phase 2
#             (lean/Check.lean: kernel replay, statement match, axioms).
# No job here saves a cache; lean-cache.yml on main is the only writer. A job that runs attempt code can
# still write cache entries into its own ref's scope with the runner's cache token, and a restore looks in
# that scope first, so the check job confirms through the API right before and right after restoring that
# the entry with its key is still the single one the warm job made, and stops if not. Without a trusted
# entry both jobs set lean/ up from upstream (Mathlib's cache, formal-conjectures at its pinned rev).
# No secrets are used anywhere. Third-party actions are pinned to full commit SHAs.
name: lean-check

on:
  workflow_call:
    inputs:
      attempt_dir:
        description: Attempt directory, e.g. attempts/erdos1.erdos-1/20261018-maya-3f9a1c
        type: string
        required: true
    outputs:
      verdict:
        description: One-line JSON VerdictResult (src/schema.ts)
        value: ${{ jobs.check.outputs.verdict }}

permissions:
  contents: read

env:
  ELAN_INIT_URL: https://raw.githubusercontent.com/leanprover/elan/55dc2814ca42ace25f05ba4dd7a43a8c701a0549/elan-init.sh
  ELAN_INIT_SHA256: a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
  CHECK_TIMEOUT: '1200'

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      key: ${{ steps.resolve.outputs.key }}
      id: ${{ steps.resolve.outputs.id }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Find the trusted Lean cache entry
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/lean-cache.sh resolve | tee -a "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ATTEMPT_DIR: ${{ inputs.attempt_dir }}
      CACHE_KEY: ${{ needs.resolve.outputs.key }}
    steps:
      - name: Validate attempt_dir
        run: |
          [[ "$ATTEMPT_DIR" =~ ^attempts/[a-z0-9][a-z0-9.-]*[a-z0-9]/[0-9]{8}-[a-z0-9-]+-[0-9a-f]{6}$ ]] ||
            { echo "bad attempt_dir: $ATTEMPT_DIR"; exit 1; }

      - name: Artifact name for this attempt
        id: safe
        run: echo "name=$(printf '%s' "$ATTEMPT_DIR" | tr -c 'a-zA-Z0-9.-' '_')" >> "$GITHUB_OUTPUT"

      # main at the workspace root, as in the check job and the warm job, so the cache path (lean/.lake),
      # and with it the cache version, is the same everywhere.
      - name: Check out main (checker and Lean project)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check out the caller's ref (attempt files)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          persist-credentials: false

      - name: Install elan
        run: |
          curl -sSfL "$ELAN_INIT_URL" -o "$RUNNER_TEMP/elan-init.sh"
          echo "$ELAN_INIT_SHA256  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          df -h /

      # This job runs attempt code anyway and the check job judges what it builds, so the entry the resolve
      # job found is restored without the check job's before/after confirmation.
      - name: Restore the Lean cache
        id: cache
        if: env.CACHE_KEY != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake
          key: ${{ env.CACHE_KEY }}

      - name: Fetch Mathlib cache (no Lean cache)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: lean
        run: |
          rm -rf .lake
          lake exe cache get

      - name: Build the attempt (phase 1)
        run: |
          df -h /
          mkdir -p "$RUNNER_TEMP/attempt-build"
          bash lean/check-attempt.sh --phase build "pr/$ATTEMPT_DIR/solution.lean" "$RUNNER_TEMP/attempt-build"
          echo "build status: $(cat "$RUNNER_TEMP/attempt-build/status")"

      - name: Upload the attempt's build files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attempt-build-${{ steps.safe.outputs.name }}
          path: ${{ runner.temp }}/attempt-build
          if-no-files-found: error
          retention-days: 7

  check:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    env:
      ATTEMPT_DIR: ${{ inputs.attempt_dir }}
      PR_SHA: ${{ github.sha }}
      CACHE_KEY: ${{ needs.resolve.outputs.key }}
      CACHE_ID: ${{ needs.resolve.outputs.id }}
    steps:
      - name: Validate attempt_dir
        run: |
          [[ "$ATTEMPT_DIR" =~ ^attempts/[a-z0-9][a-z0-9.-]*[a-z0-9]/[0-9]{8}-[a-z0-9-]+-[0-9a-f]{6}$ ]] ||
            { echo "bad attempt_dir: $ATTEMPT_DIR"; exit 1; }

      - name: Artifact name for this attempt
        id: safe
        run: echo "name=$(printf '%s' "$ATTEMPT_DIR" | tr -c 'a-zA-Z0-9.-' '_')" >> "$GITHUB_OUTPUT"

      - name: Check out main (never the PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # Only the attempt's directory, as data, outside the workspace that runs anything. The checkout action
      # authenticates the fetch, so this also works while the repository is private (a plain `git fetch` of
      # the PR commit fails there, and persist-credentials stays false).
      - name: Fetch the attempt's directory from the PR commit as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_SHA }}
          path: pr-data
          sparse-checkout: ${{ env.ATTEMPT_DIR }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read the attempt's files from the PR commit as data
        run: |
          mkdir -p "$RUNNER_TEMP/pr"
          cp "pr-data/$ATTEMPT_DIR/attempt.yaml" "$RUNNER_TEMP/pr/attempt.yaml"
          cp "pr-data/$ATTEMPT_DIR/solution.lean" "$RUNNER_TEMP/pr/solution.lean"
          rm -rf pr-data

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Resolve the problem declaration from main
        id: target
        run: |
          bun install --frozen-lockfile
          bun -e '
            import { readFileSync, appendFileSync } from "node:fs";
            import { parse } from "yaml";
            import { Attempt, Problem } from "./src/schema.ts";
            const attempt = Attempt.parse(parse(readFileSync(process.env.RUNNER_TEMP + "/pr/attempt.yaml", "utf8")));
            const problem = Problem.parse(parse(readFileSync(`problems/${attempt.problem}.yaml`, "utf8")));
            if (attempt.kind !== "proof" && attempt.kind !== "disproof") throw new Error(`kind ${attempt.kind} is not a Lean attempt`);
            if (!problem.lean) throw new Error(`problem ${problem.id} has no lean block`);
            appendFileSync(process.env.GITHUB_OUTPUT, `decl=${problem.lean.decl}\nkind=${attempt.kind}\n`);
          '

      - name: Install elan
        run: |
          curl -sSfL "$ELAN_INIT_URL" -o "$RUNNER_TEMP/elan-init.sh"
          echo "$ELAN_INIT_SHA256  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Restoring extracts a tar archive with absolute paths, so the entry is confirmed before, not after.
      - name: Confirm the Lean cache entry before restoring
        id: trusted
        if: env.CACHE_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          df -h /
          if bash .github/scripts/lean-cache.sh check "$CACHE_KEY" "$CACHE_ID"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::not restoring the Lean cache: entry $CACHE_ID is no longer the only entry with its key; setting lean/ up from upstream"
          fi

      - name: Restore the Lean cache
        id: cache
        if: steps.trusted.outputs.ok == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake
          key: ${{ env.CACHE_KEY }}

      # Another entry with this key appearing meanwhile may be what was just extracted: stop, do not judge.
      - name: Confirm the Lean cache entry after restoring
        if: steps.trusted.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/lean-cache.sh check "$CACHE_KEY" "$CACHE_ID" ||
            { echo "::error::the cache entries with key $CACHE_KEY changed during the restore; refusing to judge on this machine"; exit 1; }

      - name: Set up the Lean project from main (no Lean cache)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: lean
        run: |
          rm -rf .lake
          lake exe cache get
          lake build FormalConjecturesUtil

      - name: Download the attempt's build files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: attempt-build-${{ steps.safe.outputs.name }}
          path: ${{ runner.temp }}/attempt-build

      - name: Judge the attempt (phase 2)
        id: verdict
        env:
          DECL: ${{ steps.target.outputs.decl }}
          KIND: ${{ steps.target.outputs.kind }}
        run: |
          # The pre-check runs on the PR's own solution.lean, not on whatever the build job uploaded.
          cp "$RUNNER_TEMP/pr/solution.lean" "$RUNNER_TEMP/attempt-build/solution.lean"
          bash lean/check-attempt.sh --phase check "$RUNNER_TEMP/attempt-build" "$DECL" "$KIND" > "$RUNNER_TEMP/verdict.json"
          line="$(tail -n1 "$RUNNER_TEMP/verdict.json")"
          echo "verdict=$line" >> "$GITHUB_OUTPUT"
          {
            echo "### Lean check: \`$ATTEMPT_DIR\`"
            echo
            echo "Declaration \`$DECL\`, kind \`$KIND\`"
            echo
            echo '```json'
            echo "$line"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Job outputs of a fanned-out (matrix) caller overwrite each other, so the verdict is also an artifact.
      - name: Wrap the verdict for callers that fan out
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          mkdir -p "$RUNNER_TEMP/verdict-out"
          jq -cn --arg dir "$ATTEMPT_DIR" --argjson result "$VERDICT" '{dir: $dir, result: $result}' > "$RUNNER_TEMP/verdict-out/result.json"

      - name: Upload the verdict
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict-${{ steps.safe.outputs.name }}
          path: ${{ runner.temp }}/verdict-out
          if-no-files-found: error
          retention-days: 7
